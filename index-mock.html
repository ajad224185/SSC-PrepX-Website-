<style>
  /* Hide Contact Us section & related */
  section:has(h2) {
    /* handled by JS */
  }
</style>
<script>
(function() {
  // ========== 1. FAKE PREMIUM USER (No Login Required) ==========
  const fakeUser = {
    id: "bypass-user-001",
    candidateCode: "HUB-BYPASS-001",
    name: "Guest User",
    email: "guest@mocktesthub.local",
    mobile: "9999999999",
    role: "STUDENT",
    subscriptionTier: "Testbook Pass Pro",
    subscriptionPurchasedAt: "2025-01-01",
    subscriptionExpiresAt: "2030-12-31",
    coins: 99999,
    testSessions: []
  };

  try {
    localStorage.setItem("mth_user_v1", JSON.stringify(fakeUser));
    localStorage.setItem("tb_user", JSON.stringify(fakeUser));
    // Common key variants
    localStorage.setItem("user", JSON.stringify(fakeUser));
    document.cookie = "tb_user_id=" + fakeUser.id + ";path=/;max-age=31536000";
    document.cookie = "tb_user_profile=" + encodeURIComponent(JSON.stringify({
      id: fakeUser.id,
      candidateCode: fakeUser.candidateCode,
      name: fakeUser.name,
      email: fakeUser.email,
      mobile: fakeUser.mobile,
      role: fakeUser.role,
      subscriptionTier: fakeUser.subscriptionTier,
      coins: fakeUser.coins
    })) + ";path=/;max-age=31536000";
  } catch(e) {}

  // ========== 2. REMOVE CONTACT SECTION ==========
  function removeContactStuff() {
    // Remove Contact Us & Official Channels section
    document.querySelectorAll("h2").forEach(h2 => {
      const text = (h2.textContent || "").trim();
      if (text.includes("Contact Us") || text.includes("Official Channels") || 
          text.includes("संपर्क करें") || text.includes("आधिकारिक चैनल")) {
        const section = h2.closest("section");
        if (section) section.remove();
      }
    });

    // Remove Support Desk / Active Support Desk cards
    document.querySelectorAll("h3, span, p, div").forEach(el => {
      const text = (el.textContent || "").trim();
      if (text === "Active Support Desk" || text === "सक्रिय सपोर्ट डेस्क" ||
          text.includes("Have a question, feedback, or grievance") ||
          text.includes("क्या आपके पास कोई प्रश्न या समस्या है")) {
        const card = el.closest("div.bg-white, div.rounded-lg, section, div.border");
        if (card && card.innerText.length < 800) card.remove();
      }
    });

    // Hide any remaining Telegram / WhatsApp / Instagram / YouTube open buttons in contact context
    document.querySelectorAll("a, button").forEach(el => {
      const text = (el.textContent || "").toLowerCase();
      const href = (el.getAttribute("href") || "").toLowerCase();
      if (text.includes("open telegram") || text.includes("open youtube") || 
          text.includes("open instagram") || text.includes("send email") ||
          href.includes("t.me/") || href.includes("instagram.com/mocktesthub") ||
          href.includes("youtube.com/@mocktesthub") || href.includes("mailto:mocktesthubsupport")) {
        const card = el.closest("div.bg-white, div.rounded-lg, div.border");
        if (card) card.style.display = "none";
        else el.style.display = "none";
      }
    });

    // Hide footer Contact Us link (optional but cleaner)
    document.querySelectorAll("a").forEach(a => {
      if ((a.textContent || "").trim() === "Contact Us" || (a.textContent || "").trim() === "संपर्क करें") {
        a.style.display = "none";
      }
    });
  }

  // Run multiple times because React re-renders
  document.addEventListener("DOMContentLoaded", function() {
    removeContactStuff();
    setTimeout(removeContactStuff, 500);
    setTimeout(removeContactStuff, 1500);
    setTimeout(removeContactStuff, 3000);
  });

  // Also observe DOM changes
  const observer = new MutationObserver(() => removeContactStuff());
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  } else {
    document.addEventListener("DOMContentLoaded", () => {
      observer.observe(document.body, { childList: true, subtree: true });
    });
  }
})();
</script>
