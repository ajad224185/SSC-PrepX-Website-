<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b1f">
  <title>SSC PrepX • Group Chat</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0e0b1f; --surface: #19152e; --surface2: #241f40; --surface3: #2e2850;
      --coral: #ff7a59; --amber: #ffb347; --teal: #2dd4bf; --red: #ff6b6b;
      --text: #f6f3ff; --muted: #9b94b8;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    .hidden { display: none !important; }
    a { color: var(--amber); }

    #app { height: 100vh; height: 100dvh; max-width: 760px; margin: auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }

    /* ---------- Top bars ---------- */
    .bar { display: flex; align-items: center; gap: 4px; padding: 8px 8px; background: rgba(25,21,46,.97); z-index: 5; min-height: 60px; }
    .ib { width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; font-size: 20px; color: var(--text); }
    .ib:active { background: var(--surface3); }
    .ib.sm { width: 34px; height: 34px; font-size: 14px; }
    .grp { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 2px 4px; }
    .gtxt { display: flex; flex-direction: column; min-width: 0; }
    .gtxt b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gtxt small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gtxt small.typing { color: var(--teal); }
    .muteico { font-size: 14px; }
    .av { width: 38px; height: 38px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; font-size: 13px; font-weight: 800; color: #1a1030; background: var(--amber); }
    .av.lg { width: 42px; height: 42px; font-size: 21px; background: linear-gradient(135deg, var(--coral), var(--amber)); }
    .av.xl { width: 92px; height: 92px; font-size: 46px; background: linear-gradient(135deg, var(--coral), var(--amber)); }
    .av.sm { width: 30px; height: 30px; font-size: 11px; }
    .bar input#sq { flex: 1; min-width: 0; background: var(--surface2); border: 0; border-radius: 20px; padding: 10px 14px; outline: none; font-size: 14px; }
    #scount { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; }
    #selCount { flex: 1; font-weight: 700; font-size: 16px; }

    .pinbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: rgba(36,31,64,.97); border-top: 1px solid var(--surface3); text-align: left; }
    .pinline { width: 3px; align-self: stretch; border-radius: 2px; background: var(--amber); }
    .pinbar > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pinbar b { font-size: 12px; color: var(--amber); }
    .pinbar span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- Messages ---------- */
    #msgs { flex: 1; overflow-y: auto; padding: 10px 10px 14px; scroll-behavior: auto; overscroll-behavior: contain;
      background: radial-gradient(circle at 15% 10%, rgba(255,122,89,.07), transparent 40%), radial-gradient(circle at 85% 80%, rgba(45,212,191,.06), transparent 45%), var(--bg); }
    .emptyc { text-align: center; color: var(--muted); padding: 60px 20px; }
    .day { text-align: center; margin: 12px 0 8px; }
    .day span { display: inline-block; padding: 4px 12px; border-radius: 14px; background: rgba(36,31,64,.9); color: var(--muted); font-size: 12px; font-weight: 600; }
    .sys { text-align: center; margin: 8px 0; }
    .sys span { display: inline-block; padding: 4px 12px; border-radius: 14px; background: rgba(36,31,64,.75); color: var(--muted); font-size: 12px; }

    .row { display: flex; align-items: flex-end; gap: 6px; margin-top: 2px; position: relative; }
    .row.first { margin-top: 8px; }
    .row.mine { justify-content: flex-end; }
    .row .sp { width: 30px; flex-shrink: 0; }
    .row .col { max-width: 80%; display: flex; flex-direction: column; min-width: 0; }
    .row.mine .col { align-items: flex-end; }
    .chk { width: 22px; height: 22px; flex-shrink: 0; margin-bottom: 8px; border-radius: 50%; border: 2px solid var(--muted); display: none; place-items: center; font-size: 12px; color: transparent; }
    .selmode .chk { display: grid; }
    .chk.on { background: var(--teal); border-color: var(--teal); color: #04221d; }
    .row.sel { background: rgba(45,212,191,.12); border-radius: 12px; }
    .row.flash .bubble { animation: flash 1.2s; }
    @keyframes flash { 0%,60% { box-shadow: 0 0 0 3px var(--amber); } 100% { box-shadow: 0 0 0 0 transparent; } }

    .bubble { position: relative; padding: 7px 11px 6px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; overflow-wrap: anywhere; min-width: 70px; max-width: 100%; }
    .bubble.other { background: var(--surface2); border-bottom-left-radius: 6px; }
    .bubble.mine { background: linear-gradient(135deg, #ff8a63, #ffb347); color: #2a0f06; border-bottom-right-radius: 6px; }
    .bubble.stk { background: none; padding: 0 4px; }
    .bubble .sname { display: block; font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .bubble .sname i { font-style: normal; font-weight: 600; font-size: 10px; color: var(--amber); margin-left: 6px; }
    .bubble .fwd { font-size: 12px; font-weight: 700; color: var(--teal); margin-bottom: 3px; }
    .mine .fwd { color: #0b5f53; }
    .bubble pre { background: rgba(0,0,0,.28); padding: 8px; border-radius: 8px; margin: 4px 0; font-size: 13px; overflow-x: auto; white-space: pre-wrap; }
    .bubble code { background: rgba(0,0,0,.25); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
    .mine a { color: #5a1a00; }
    .mention, .tag { color: var(--amber); font-weight: 600; }
    .mine .mention, .mine .tag { color: #6b2200; }
    mark { background: #ffe066; color: #000; border-radius: 3px; padding: 0 1px; }
    .stkbig { font-size: 84px; line-height: 1.1; }
    .meta { float: right; margin: 6px 0 -1px 10px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .mine .meta { color: rgba(42,15,6,.66); }
    .stk .meta { background: rgba(14,11,31,.7); padding: 1px 8px; border-radius: 10px; float: none; display: inline-block; margin: 0; }
    .tick { font-size: 11px; letter-spacing: -2px; margin-left: 2px; }
    .tick.read { color: #0b6b5c; font-weight: 900; }

    .quote { display: block; text-align: left; width: 100%; margin-bottom: 5px; padding: 4px 8px; border-left: 3px solid var(--amber); border-radius: 6px; background: rgba(0,0,0,.2); }
    .mine .quote { background: rgba(255,255,255,.3); border-left-color: #8a3a12; }
    .quote b { display: block; font-size: 12px; color: var(--amber); }
    .mine .quote b { color: #7a2d08; }
    .quote span { display: block; font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

    .media { display: block; max-width: 100%; max-height: 320px; border-radius: 12px; margin-bottom: 4px; cursor: zoom-in; }
    .expired { padding: 22px 14px; border-radius: 12px; background: rgba(0,0,0,.2); font-size: 13px; opacity: .8; margin-bottom: 4px; }
    .filec { display: flex; align-items: center; gap: 10px; min-width: 200px; }
    .fico { width: 44px; height: 44px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.22); font-size: 20px; }
    .finfo { flex: 1; min-width: 0; }
    .finfo b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .finfo small { font-size: 12px; opacity: .75; }
    .voice { display: flex; align-items: center; gap: 10px; min-width: 190px; }
    .vplay { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 15px; }
    .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; }
    .wave i { flex: 1; min-width: 2px; border-radius: 2px; background: currentColor; opacity: .65; }
    .vdur { font-size: 12px; opacity: .8; }
    .loc { display: block; min-width: 200px; text-decoration: none; color: inherit; }
    .loc .pin { display: grid; place-items: center; height: 90px; border-radius: 12px; background: rgba(0,0,0,.2); font-size: 40px; margin-bottom: 4px; }

    .poll { min-width: 230px; }
    .pq { font-weight: 800; margin-bottom: 2px; }
    .ptype { font-size: 12px; opacity: .75; margin-bottom: 8px; }
    .popt { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; margin-bottom: 6px; border-radius: 12px; background: rgba(0,0,0,.2); text-align: left; overflow: hidden; }
    .mine .popt { background: rgba(255,255,255,.3); }
    .popt i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,179,71,.35); z-index: 0; transition: width .3s; }
    .mine .popt i { background: rgba(138,58,18,.25); }
    .popt > * { position: relative; z-index: 1; }
    .pc { width: 20px; height: 20px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; border: 2px solid currentColor; font-size: 11px; opacity: .8; }
    .pc.on { background: var(--teal); border-color: var(--teal); color: #04221d; opacity: 1; }
    .pt { flex: 1; font-size: 14px; }
    .pp { font-size: 12px; font-weight: 800; }
    .pv { display: block; font-size: 11px; opacity: .7; margin: -3px 0 6px 10px; }
    .pfoot { font-size: 12px; opacity: .75; display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    .pfoot button { font-size: 12px; font-weight: 700; color: inherit; text-decoration: underline; }

    .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .react { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px; background: var(--surface2); font-size: 13px; }
    .react span { font-size: 12px; font-weight: 700; color: var(--muted); }
    .react.on { background: rgba(255,179,71,.28); box-shadow: inset 0 0 0 1px var(--amber); }

    .fab { position: absolute; right: 14px; bottom: 84px; width: 46px; height: 46px; border-radius: 50%; background: var(--surface3); font-size: 22px; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    .fab em { position: absolute; top: -6px; right: -4px; min-width: 20px; padding: 1px 6px; border-radius: 10px; background: var(--coral); color: #2a0f06; font-size: 11px; font-weight: 800; font-style: normal; }

    /* ---------- Composer ---------- */
    .ctxbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: var(--surface); border-top: 1px solid var(--surface3); }
    .ctxbar > div { flex: 1; min-width: 0; border-left: 3px solid var(--amber); padding-left: 10px; }
    .ctxbar b { display: block; font-size: 13px; color: var(--amber); }
    .ctxbar span.t { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lockbar { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--surface); }
    .composer { background: var(--surface); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
    .inrow { display: flex; align-items: flex-end; gap: 4px; }
    #ta { flex: 1; min-width: 0; resize: none; max-height: 120px; padding: 11px 14px; border: 0; border-radius: 22px; background: var(--surface2); outline: none; font-size: 15px; line-height: 1.35; }
    #ta::placeholder { color: var(--muted); }
    .send { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, var(--coral), var(--amber)); color: #2a0f06; font-size: 18px; font-weight: 800; }
    .inrow.rec { align-items: center; padding: 0 2px; }
    .recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .recmsg { flex: 1; color: var(--muted); font-size: 14px; }
    #recTime { font-variant-numeric: tabular-nums; }

    .emoji { background: var(--surface); border-top: 1px solid var(--surface3); height: 270px; display: flex; flex-direction: column; }
    .etabs { display: flex; padding: 4px 8px; gap: 4px; }
    .etabs button { flex: 1; padding: 8px 0; border-radius: 10px; font-size: 20px; }
    .etabs button.on { background: var(--surface3); }
    .egrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 4px 8px 8px; align-content: start; }
    .egrid button { font-size: 26px; padding: 6px 0; border-radius: 10px; }
    .egrid button:active { background: var(--surface3); }
    .egrid.stickers { grid-template-columns: repeat(4, 1fr); }
    .egrid.stickers button { font-size: 52px; }

    .mention { background: var(--surface); border-top: 1px solid var(--surface3); max-height: 170px; overflow-y: auto; }
    .mention button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 14px; text-align: left; }
    .mention button:active { background: var(--surface3); }

    /* ---------- Sheets & overlays ---------- */
    #layer { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
    #layer > * { pointer-events: auto; }
    .sheet-wrap { position: fixed; inset: 0; z-index: 50; }
    .scrim2 { position: absolute; inset: 0; background: rgba(5,3,15,.65); }
    .sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: 760px; transform: translateX(-50%); max-height: 86vh; overflow-y: auto; background: #1b1733; border-radius: 26px 26px 0 0; padding: 8px 14px calc(16px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
    @keyframes up { from { transform: translate(-50%, 40px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
    .grab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--surface3); margin: 4px auto 12px; }
    .sheet h3 { font-size: 18px; margin: 4px 4px 12px; }
    .sheet p.sub { color: var(--muted); font-size: 13px; margin: -6px 4px 12px; }
    .rrow { display: flex; justify-content: space-between; padding: 4px 0 10px; }
    .rrow button { font-size: 28px; width: 42px; height: 42px; border-radius: 50%; }
    .rrow button.on { background: rgba(255,179,71,.3); }
    .sitem { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 8px; border-radius: 14px; font-size: 16px; text-align: left; }
    .sitem:active { background: var(--surface2); }
    .sitem.danger { color: var(--red); }
    .sitem span { width: 26px; text-align: center; font-size: 20px; }
    .sitem small { margin-left: auto; color: var(--muted); font-size: 13px; }
    .agrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .agrid button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 6px; border-radius: 18px; background: var(--surface2); font-size: 13px; font-weight: 600; }
    .agrid button span { font-size: 30px; }
    .fld { display: block; width: 100%; margin-bottom: 10px; padding: 13px 14px; border: 0; border-radius: 14px; background: var(--surface2); outline: none; font-size: 15px; }
    .link { color: var(--amber); font-weight: 700; padding: 6px 4px 12px; }
    .primary { width: 100%; margin-top: 8px; padding: 14px; border-radius: 26px; background: linear-gradient(90deg, var(--coral), var(--amber)); color: #2a0f06; font-weight: 800; font-size: 15px; }
    .ghost { width: 100%; margin-top: 8px; padding: 14px; border-radius: 26px; background: var(--surface2); font-weight: 700; }

    .ovpage { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; max-width: 760px; margin: auto; }
    .ibar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 8px; background: rgba(14,11,31,.95); }
    .ibar b { font-size: 18px; }
    .ihero { text-align: center; padding: 8px 20px 16px; }
    .ihero .av { margin: 0 auto 12px; }
    .ihero h2 { font-size: 24px; }
    .ihero p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .iacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px 16px; }
    .iacts button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: 18px; background: var(--surface); font-size: 13px; font-weight: 600; color: var(--amber); }
    .iacts button span { font-size: 24px; }
    .card { margin: 0 16px 14px; padding: 6px 4px; border-radius: 22px; background: var(--surface); }
    .card .desc { padding: 12px; color: var(--muted); font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    .card .desc b { display: block; color: var(--text); margin-bottom: 4px; font-size: 13px; }
    .setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 13px 12px; text-align: left; font-size: 15px; }
    .setrow small { color: var(--muted); font-size: 13px; }
    .seg { display: flex; gap: 4px; padding: 3px; border-radius: 14px; background: var(--surface2); }
    .seg button { padding: 7px 12px; border-radius: 11px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .seg button.on { background: var(--amber); color: #2a0f06; }
    label.sw { display: flex; align-items: center; justify-content: space-between; padding: 13px 12px; font-size: 15px; cursor: pointer; }
    label.sw input { display: none; }
    label.sw i { width: 44px; height: 26px; border-radius: 13px; background: var(--surface3); position: relative; transition: .2s; flex-shrink: 0; }
    label.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
    label.sw input:checked + i { background: var(--teal); }
    label.sw input:checked + i::after { left: 21px; }
    .itabs { display: flex; margin: 0 16px; border-bottom: 1px solid var(--surface3); }
    .itabs button { flex: 1; padding: 12px 0; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; font-size: 14px; }
    .itabs button.on { color: var(--amber); border-bottom-color: var(--amber); }
    .mem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; text-align: left; }
    .mem:active { background: var(--surface); }
    .mem .mi { flex: 1; min-width: 0; }
    .mem b { display: block; font-size: 15px; }
    .mem small { color: var(--muted); font-size: 12px; }
    .mem small.on { color: var(--teal); }
    .badge { padding: 2px 9px; border-radius: 10px; background: rgba(255,179,71,.2); color: var(--amber); font-size: 11px; font-weight: 700; }
    .badge.mu { background: rgba(255,107,107,.2); color: var(--red); margin-left: 4px; }
    .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 12px 16px; }
    .mgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
    .lrow { display: block; padding: 12px 16px; border-bottom: 1px solid var(--surface); word-break: break-all; font-size: 14px; }
    .none { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }
    .viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.95); display: flex; flex-direction: column; }
    .viewer .top { display: flex; justify-content: space-between; padding: 10px; }
    .viewer img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
    .viewer p { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); text-align: center; color: #ddd; font-size: 14px; }
    .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); max-width: 88%; z-index: 90; padding: 10px 18px; border-radius: 22px; background: #f6f3ff; color: #1a1030; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.5); text-align: center; }
    .dots span { display: inline-block; animation: dot 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,60%,100% { opacity: .2; } 30% { opacity: 1; } }
  </style>
</head>

<body>
  <div id="app">
    <header id="top" class="bar">
      <button class="ib" onclick="goHome()" aria-label="Back">‹</button>
      <button class="grp" onclick="openInfo()">
        <span class="av lg">🎓</span>
        <span class="gtxt"><b id="gName"></b><small id="gSub"></small></span>
      </button>
      <span id="muteIco" class="muteico hidden">🔕</span>
      <button class="ib" onclick="startSearch()" aria-label="Search">🔍</button>
      <button class="ib" onclick="openMenu()" aria-label="Menu">⋮</button>
    </header>

    <header id="searchBar" class="bar hidden">
      <button class="ib" onclick="closeSearch()" aria-label="Close search">‹</button>
      <input id="sq" type="search" placeholder="Messages mein search karein..." oninput="onSearch(this.value)">
      <span id="scount"></span>
      <button class="ib sm" onclick="navSearch(-1)">▲</button>
      <button class="ib sm" onclick="navSearch(1)">▼</button>
    </header>

    <header id="selBar" class="bar hidden">
      <button class="ib" onclick="endSelect()" aria-label="Cancel">✕</button>
      <span id="selCount"></span>
      <button class="ib" onclick="selCopy()" aria-label="Copy">📋</button>
      <button class="ib" onclick="selFwd()" aria-label="Forward">➡️</button>
      <button class="ib" onclick="selDel()" aria-label="Delete">🗑️</button>
    </header>

    <div id="pinBar" class="pinbar hidden" onclick="pinTap()">
      <i class="pinline"></i>
      <div><b id="pinTitle">Pinned message</b><span id="pinText"></span></div>
      <button class="ib sm" onclick="event.stopPropagation();pinList()" aria-label="Pinned list">☰</button>
    </div>

    <main id="msgs" onscroll="onScroll()"></main>
    <button id="fab" class="fab hidden" onclick="scrollBottom(true)" aria-label="Neeche jaayein">⌄<em id="fabN" class="hidden"></em></button>

    <div id="mention" class="mention hidden"></div>
    <div id="ctxBar" class="ctxbar hidden">
      <span id="ctxIco" style="font-size:20px">↩️</span>
      <div><b id="ctxT"></b><span class="t" id="ctxS"></span></div>
      <button class="ib sm" onclick="cancelCtx()" aria-label="Cancel">✕</button>
    </div>
    <div id="lockBar" class="lockbar hidden"></div>

    <footer id="composer" class="composer">
      <div id="inputRow" class="inrow">
        <button class="ib" id="emojiBtn" onclick="toggleEmoji()" aria-label="Emoji">😊</button>
        <textarea id="ta" rows="1" placeholder="Message likhein..." oninput="onInput()" onkeydown="onKey(event)"></textarea>
        <button class="ib" onclick="openAttach()" aria-label="Attach">📎</button>
        <button id="sendBtn" class="send" onclick="sendOrMic()" aria-label="Send">🎤</button>
      </div>
      <div id="recRow" class="inrow rec hidden">
        <button class="ib" onclick="cancelRec()" aria-label="Cancel recording">🗑️</button>
        <span class="recdot"></span><b id="recTime">0:00</b><span class="recmsg">Recording…</span>
        <button class="send" onclick="finishRec()" aria-label="Send voice">➤</button>
      </div>
    </footer>
    <div id="emoji" class="emoji hidden"></div>
  </div>

  <div id="layer"></div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="fImg" accept="image/*" class="hidden" onchange="onFile(this,'image')">
  <input type="file" id="fDoc" class="hidden" onchange="onFile(this,'file')">

  <script>
  /* =====================================================================
     SSC PrepX • Telegram-style group chat
     - Data browser ke localStorage mein save hota hai (demo).
     - Real online chat ke liye: load() / doSave() ko Firebase se badal dein.
     ===================================================================== */
  const KEY = "sscprepx_chat_v1";
  const HOME_URL = "index.html";   // header ka ‹ back button home pe le jata hai
  const COLORS = ["#ff7a59", "#2dd4bf", "#a78bfa", "#f472b6", "#facc15", "#60a5fa", "#34d399", "#fb923c"];
  const REACTS = ["👍", "❤️", "😂", "😮", "😢", "🙏", "🔥", "👏"];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const now = () => Date.now();
  const uid = () => "m" + now().toString(36) + Math.random().toString(36).slice(2, 6);
  const pad = n => String(n).padStart(2, "0");
  const tm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => (w[0] || "").toUpperCase()).join("") || "?";
  const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";

  /* ---------- State ---------- */
  let S;
  let sel = new Set(), selMode = false;
  let replying = null, editing = null;
  let searchOn = false, searchQ = "", matches = [], matchIdx = -1;
  let unread = 0, pinIdx = -1, typingName = null, lastSend = 0, infoTab = "members";

  function seed() {
    const t = now(), mn = 60000;
    const m = (id, ago, from, o) => Object.assign({ id, t: t - ago * mn, from, type: "text", reactions: {} }, o);
    return {
      v: 1, myName: "You", role: "admin",
      group: { name: "SSC PrepX Students", desc: "SSC CGL / CHSL ke students ka official group.\nDaily practice, doubt solving aur updates yahin milenge. 📚", link: "https://ssc-prepx.example/join/Xk29aQ", adminOnly: false, slow: 0, muted: false, demo: true },
      members: [
        { id: "a1", name: "SSC PrepX Admin", color: COLORS[0], role: "admin", online: true },
        { id: "u1", name: "Rahul Verma", color: COLORS[1], role: "member", online: true },
        { id: "u2", name: "Priya Singh", color: COLORS[2], role: "member", online: false },
        { id: "u3", name: "Amit Kumar", color: COLORS[3], role: "member", online: true },
        { id: "u4", name: "Sneha Gupta", color: COLORS[4], role: "member", online: false },
        { id: "u5", name: "Vikas Yadav", color: COLORS[5], role: "member", online: true },
        { id: "u6", name: "Neha Sharma", color: COLORS[6], role: "member", online: true },
        { id: "u7", name: "Rohit Mishra", color: COLORS[7], role: "member", online: false }
      ],
      msgs: [
        m("s1", 2900, "a1", { type: "system", text: "SSC PrepX Admin ne group banaya" }),
        m("s2", 2890, "a1", { text: "Welcome sab ko! 🎉 Yahan **SSC CGL / CHSL** ki daily practice aur doubt solving hogi. Rules pin kiye hain 👇" }),
        m("s3", 2880, "a1", { text: "📌 **Group Rules**\n1. Sabke saath respect se baat karein\n2. Spam / ads allowed nahi\n3. Doubt clearly likhein\n4. Sirf padhai ki baatein" }),
        m("s4", 1500, "u1", { text: "Sir kal ke Maths class ke notes kahan milenge?" }),
        m("s5", 1490, "a1", { text: "Notes batch ke andar __Resources__ section mein hain. Check kar lo 👍", replyTo: "s4" }),
        m("s6", 1300, "u2", { text: "Profit & Loss shortcut: `Profit% = (SP - CP) / CP × 100`", reactions: { "🔥": ["u1", "u3", "a1"] } }),
        m("s7", 1295, "u3", { text: "Thanks Priya! 🙏", replyTo: "s6", reactions: { "👍": ["a1", "u1"] } }),
        m("s8", 600, "a1", { type: "poll", poll: { q: "Aaj ki live class kaunse subject ki chahiye?", multi: false, anon: false, closed: false,
          opts: [{ t: "Maths", votes: ["u1", "u3", "u6"] }, { t: "Reasoning", votes: ["u2"] }, { t: "English", votes: ["u4", "u5"] }, { t: "GS", votes: [] }] } }),
        m("s9", 90, "u4", { text: "Reasoning mein Blood Relation ki tricks kisi ke paas hain?" }),
        m("s10", 80, "u5", { text: "Mere paas hain, evening mein bhejta hoon 📚", replyTo: "s9" }),
        m("s11", 55, "u6", { type: "sticker", text: "🙌" }),
        m("s12", 20, "a1", { text: "Reminder: Kal subah 7 baje **Maths Mock Test** hai.\nLink: https://example.com/mock-test #mocktest" })
      ],
      pinned: ["s3"], saved: [], hidden: [], draft: ""
    };
  }

  function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  let saveT;
  function save() { clearTimeout(saveT); saveT = setTimeout(doSave, 250); }
  function doSave() {
    const ser = () => JSON.stringify(S, (k, v) => (k === "src" && typeof v === "string" && v.indexOf("blob:") === 0) ? "" : v);
    try { localStorage.setItem(KEY, ser()); return; } catch (e) {}
    for (let i = 0; i < 60; i++) {                       // storage full: purani media hatao
      const m = S.msgs.find(x => x.src && !x.expired);
      if (!m) break;
      m.src = ""; m.expired = true;
      try { localStorage.setItem(KEY, ser()); return; } catch (e) {}
    }
  }

  /* ---------- Helpers ---------- */
  const byId = id => S.msgs.find(m => m.id === id);
  const vis = () => S.msgs.filter(m => S.hidden.indexOf(m.id) < 0);
  const isAdmin = () => S.role === "admin";
  function member(id) {
    if (id === "me") return { id: "me", name: S.myName, color: "#ffb347", role: S.role, online: true };
    return S.members.find(m => m.id === id) || { id: id, name: "Deleted account", color: "#9b94b8", role: "member" };
  }
  const nameOf = id => member(id).name;
  const memberCount = () => S.members.length + 1;
  const onlineCount = () => S.members.filter(m => m.online).length + 1;
  function preview(m) {
    switch (m.type) {
      case "image": return "📷 " + (m.text || "Photo");
      case "file": return "📄 " + (m.name || "File");
      case "voice": return "🎤 Voice message";
      case "poll": return "📊 " + m.poll.q;
      case "sticker": return m.text;
      case "location": return "📍 Location";
      default: return (m.text || "").replace(/\s+/g, " ").slice(0, 90);
    }
  }
  function dayLabel(t) {
    const d = new Date(t), n = new Date(), y = new Date(); y.setDate(n.getDate() - 1);
    if (d.toDateString() === n.toDateString()) return "Aaj";
    if (d.toDateString() === y.toDateString()) return "Kal";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  }
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.remove("hidden");
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), 2200);
  }
  function copyText(text) {
    const done = () => toast("Copy ho gaya ✓");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback() {
      const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("Copy nahi ho paya"); } t.remove();
    }
  }

  /* ---------- Text formatting ---------- */
  function fmt(text, q) {
    let h = esc(text);
    h = h.replace(/```([\s\S]+?)```/g, "<pre>$1</pre>");
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/__([^_\n]+)__/g, "<i>$1</i>");
    h = h.replace(/~~([^~\n]+)~~/g, "<s>$1</s>");
    h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" onclick="event.stopPropagation()">$1</a>');
    h = h.replace(/(^|\s)@(\w+)/g, '$1<span class="mention">@$2</span>');
    h = h.replace(/(^|\s)#(\w+)/g, '$1<span class="tag">#$2</span>');
    h = h.replace(/\n/g, "<br>");
    if (q) {
      const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      h = h.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txt) => tag ? tag : txt.replace(re, "<mark>$&</mark>"));
    }
    return h;
  }

  /* ---------- Overlay stack (phone back button ke liye) ---------- */
  const stack = []; let suppress = 0, pendingAfter = null, pendingTok = 0, tokCnt = 0;
  function openOv(closeFn) {
    stack.push(closeFn);
    const h = "#ov" + stack.length;
    if (location.hash !== h) location.hash = h;
  }
  function closeTop(after) {
    if (!stack.length) { if (after) after(); return; }
    const lvl = stack.length, fn = stack.pop();
    fn();
    if (location.hash === "#ov" + lvl) {
      suppress++; pendingAfter = after || null;
      const tok = ++tokCnt; pendingTok = tok;
      history.back();
      setTimeout(() => {                       // agar hashchange na aaye to bhi kaam ho jaye
        if (pendingTok === tok && suppress > 0) { suppress = 0; const a = pendingAfter; pendingAfter = null; if (a) a(); }
      }, 500);
    } else if (after) after();
  }
  window.addEventListener("hashchange", () => {
    if (suppress > 0) {
      suppress--; pendingTok = 0;
      const a = pendingAfter; pendingAfter = null;
      if (a) a();
      return;
    }
    const mt = location.hash.match(/^#ov(\d+)$/);
    const n = mt ? +mt[1] : 0;
    while (stack.length > n) stack.pop()();
  });
  function goHome() {
    location.href = HOME_URL;
  }

  /* ---------- Sheets ---------- */
  let sheetEl = null;
  function openSheet(html) {
    if (sheetEl) { sheetEl.querySelector(".sbody").innerHTML = html; sheetEl.querySelector(".sheet").scrollTop = 0; return sheetEl; }
    const w = document.createElement("div");
    w.className = "sheet-wrap";
    w.innerHTML = '<div class="scrim2" onclick="closeTop()"></div><div class="sheet"><i class="grab"></i><div class="sbody">' + html + "</div></div>";
    $("layer").appendChild(w); sheetEl = w;
    openOv(() => { w.remove(); sheetEl = null; });
    return w;
  }
  const act = (name, a, b) => closeTop(() => A[name](a, b));

  function askText(title, placeholder, initial, cb, multiline) {
    window.__askCb = cb;
    openSheet('<h3>' + esc(title) + '</h3>' +
      (multiline ? '<textarea id="askIn" class="fld" rows="4" placeholder="' + esc(placeholder) + '">' + esc(initial) + "</textarea>"
                 : '<input id="askIn" class="fld" placeholder="' + esc(placeholder) + '" value="' + esc(initial) + '">') +
      '<button class="primary" onclick="askDone()">Save</button>');
    setTimeout(() => { const i = $("askIn"); if (i) i.focus(); }, 120);
  }
  function askDone() {
    const v = $("askIn").value.trim(), cb = window.__askCb;
    if (!v) { toast("Kuch likhein"); return; }
    closeTop(() => cb(v));
  }

  /* ---------- Rendering ---------- */
  function renderHeader() {
    $("gName").textContent = S.group.name;
    const sub = $("gSub");
    if (typingName) { sub.className = "typing"; sub.innerHTML = esc(typingName) + ' is typing<span class="dots"><span>.</span><span>.</span><span>.</span></span>'; }
    else { sub.className = ""; sub.textContent = memberCount() + " members, " + onlineCount() + " online"; }
    $("muteIco").classList.toggle("hidden", !S.group.muted);
  }

  function renderPin() {
    S.pinned = S.pinned.filter(id => byId(id));
    const bar = $("pinBar");
    if (!S.pinned.length) { bar.classList.add("hidden"); return; }
    if (pinIdx < 0 || pinIdx >= S.pinned.length) pinIdx = S.pinned.length - 1;
    const m = byId(S.pinned[pinIdx]);
    $("pinTitle").textContent = "Pinned message" + (S.pinned.length > 1 ? " #" + (pinIdx + 1) : "");
    $("pinText").textContent = preview(m);
    bar.classList.remove("hidden");
  }
  function pinTap() {
    if (!S.pinned.length) return;
    jumpTo(S.pinned[pinIdx]);
    pinIdx = (pinIdx - 1 + S.pinned.length) % S.pinned.length;
    renderPin();
  }
  function pinList() {
    if (!S.pinned.length) return;
    openSheet("<h3>📌 Pinned messages</h3>" + S.pinned.map(id => {
      const m = byId(id);
      return '<button class="sitem" onclick="act(\'jump\',\'' + id + '\')"><span>📌</span><div><b style="font-size:14px">' + esc(nameOf(m.from)) + '</b><div style="font-size:13px;color:var(--muted)">' + esc(preview(m)) + "</div></div>" +
        (isAdmin() ? '<small onclick="event.stopPropagation();act(\'pin\',\'' + id + '\')">Unpin</small>' : "") + "</button>";
    }).join(""));
  }

  function tickHTML(m) {
    if (m.from !== "me") return "";
    return ' <span class="tick ' + m.status + '" data-tick="' + m.id + '">' + (m.status === "sent" ? "✓" : "✓✓") + "</span>";
  }
  function contentHTML(m) {
    const q = searchOn ? searchQ : "";
    switch (m.type) {
      case "image":
        return (m.src ? '<img class="media" src="' + m.src + '" alt="photo" onclick="event.stopPropagation();viewImg(\'' + m.id + '\')">' : '<div class="expired">🖼️ Photo (storage full hone se hata di gayi)</div>') +
          (m.text ? "<div>" + fmt(m.text, q) + "</div>" : "");
      case "file":
        return '<div class="filec"><span class="fico">📄</span><div class="finfo"><b>' + esc(m.name) + "</b><small>" + fmtSize(m.size || 0) + (m.src ? "" : " • available nahi") + "</small></div>" +
          (m.src ? '<a class="ib sm" href="' + m.src + '" download="' + esc(m.name) + '" onclick="event.stopPropagation()" style="text-decoration:none">⬇</a>' : "") + "</div>" +
          (m.text ? '<div style="margin-top:6px">' + fmt(m.text, q) + "</div>" : "");
      case "voice": {
        let seedN = 0; for (const c of m.id) seedN = (seedN * 31 + c.charCodeAt(0)) % 997;
        let bars = ""; for (let i = 0; i < 24; i++) { seedN = (seedN * 7 + 13) % 97; bars += '<i style="height:' + (6 + seedN % 22) + 'px"></i>'; }
        return '<div class="voice" onclick="event.stopPropagation()"><button class="vplay" ' + (m.src ? "" : "disabled") + ' onclick="playVoice(\'' + m.id + '\',this)">▶</button><div class="wave">' + bars + '</div><span class="vdur">' + Math.floor((m.dur || 0) / 60) + ":" + pad((m.dur || 0) % 60) + "</span></div>";
      }
      case "poll": return pollHTML(m);
      case "sticker": return '<div class="stkbig">' + esc(m.text) + "</div>";
      case "location":
        return '<a class="loc" href="https://maps.google.com/?q=' + m.lat + "," + m.lng + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><div class="pin">📍</div><b>Live location</b><br><small>' + (+m.lat).toFixed(4) + ", " + (+m.lng).toFixed(4) + " • Map mein kholein</small></a>";
      default: return "<div>" + fmt(m.text, q) + "</div>";
    }
  }
  function pollHTML(m) {
    const p = m.poll, voters = new Set(p.opts.flatMap(o => o.votes)).size;
    const voted = p.opts.some(o => o.votes.indexOf("me") >= 0);
    const showRes = voted || p.closed || m.from === "me";
    return '<div class="poll" onclick="event.stopPropagation()"><div class="pq">📊 ' + esc(p.q) + '</div><div class="ptype">' + (p.closed ? "Poll band ho gaya" : (p.anon ? "Anonymous poll" : "Public poll") + (p.multi ? " • Multiple answers" : "")) + "</div>" +
      p.opts.map((o, i) => {
        const pct = voters ? Math.round(o.votes.length * 100 / voters) : 0, mine = o.votes.indexOf("me") >= 0;
        const names = (!p.anon && showRes && o.votes.length) ? '<span class="pv">' + o.votes.slice(0, 3).map(v => esc(nameOf(v))).join(", ") + (o.votes.length > 3 ? " +" + (o.votes.length - 3) : "") + "</span>" : "";
        return '<button class="popt" onclick="votePoll(\'' + m.id + "'," + i + ')">' + (showRes ? '<i style="width:' + pct + '%"></i>' : "") + '<span class="pc ' + (mine ? "on" : "") + '">' + (mine ? "✓" : "") + '</span><span class="pt">' + esc(o.t) + "</span>" + (showRes ? '<span class="pp">' + pct + "%</span>" : "") + "</button>" + names;
      }).join("") +
      '<div class="pfoot"><span>' + voters + " voter" + (voters === 1 ? "" : "s") + "</span>" + ((m.from === "me" || isAdmin()) && !p.closed ? '<button onclick="closePoll(\'' + m.id + '\')">Poll band karein</button>' : "") + "</div></div>";
  }

  function rowHTML(m, prev, next) {
    if (m.type === "system") return '<div class="sys"><span>' + esc(m.text) + "</span></div>";
    const mine = m.from === "me", u = member(m.from);
    const grp = x => x && x.type !== "system" && x.from === m.from;
    const first = !(prev && grp(prev) && m.t - prev.t < 300000);
    const last = !(next && grp(next) && next.t - m.t < 300000);
    let r = m.replyTo ? byId(m.replyTo) : null;
    const quote = m.replyTo ? (r && S.hidden.indexOf(r.id) < 0 ?
      '<div class="quote" onclick="event.stopPropagation();jumpTo(\'' + r.id + '\')"><b>' + esc(nameOf(r.from)) + "</b><span>" + esc(preview(r)) + "</span></div>" :
      '<div class="quote"><b>Reply</b><span>🚫 Message delete ho gaya</span></div>') : "";
    const showName = !mine && first && m.type !== "sticker";
    const pinned = S.pinned.indexOf(m.id) >= 0;
    const reacts = Object.keys(m.reactions || {}).filter(e => m.reactions[e].length).map(e =>
      '<button class="react ' + (m.reactions[e].indexOf("me") >= 0 ? "on" : "") + '" onclick="event.stopPropagation();reactTo(\'' + m.id + "','" + e + '\')">' + e + " <span>" + m.reactions[e].length + "</span></button>").join("");
    const av = mine ? "" : (last ? '<span class="av sm" style="background:' + u.color + '">' + esc(initials(u.name)) + "</span>" : '<span class="sp"></span>');
    return '<div class="row ' + (mine ? "mine " : "") + (first ? "first " : "") + (sel.has(m.id) ? "sel" : "") + '" data-id="' + m.id + '" onclick="bubbleTap(\'' + m.id + '\')">' +
      '<span class="chk ' + (sel.has(m.id) ? "on" : "") + '">✓</span>' + av +
      '<div class="col"><div class="bubble ' + (mine ? "mine" : "other") + (m.type === "sticker" ? " stk" : "") + '">' +
      (showName ? '<span class="sname" style="color:' + u.color + '">' + esc(u.name) + (u.role === "admin" ? "<i>admin</i>" : "") + "</span>" : "") +
      (m.fwd ? '<div class="fwd">↪ Forwarded from ' + esc(m.fwd) + "</div>" : "") + quote + contentHTML(m) +
      '<span class="meta">' + (pinned ? "📌 " : "") + (m.edited ? "edited " : "") + tm(m.t) + tickHTML(m) + "</span></div>" +
      (reacts ? '<div class="reacts">' + reacts + "</div>" : "") + "</div></div>";
  }

  const atBottom = () => { const b = $("msgs"); return b.scrollHeight - b.scrollTop - b.clientHeight < 90; };
  function scrollBottom(smooth) {
    const b = $("msgs"); b.scrollTo ? b.scrollTo({ top: b.scrollHeight, behavior: smooth ? "smooth" : "auto" }) : (b.scrollTop = b.scrollHeight);
    unread = 0; updateFab();
  }
  function updateFab() {
    const show = !atBottom();
    $("fab").classList.toggle("hidden", !show);
    $("fabN").classList.toggle("hidden", !(show && unread));
    $("fabN").textContent = unread;
  }
  function onScroll() { if (atBottom()) unread = 0; updateFab(); }

  function renderMsgs(mode) {
    const box = $("msgs"), was = atBottom(), top = box.scrollTop;
    const list = vis(); let html = "", lastDay = "";
    list.forEach((m, i) => {
      const day = new Date(m.t).toDateString(), newDay = day !== lastDay;
      if (newDay) { html += '<div class="day"><span>' + dayLabel(m.t) + "</span></div>"; lastDay = day; }
      const nx = list[i + 1];
      html += rowHTML(m, newDay ? null : list[i - 1], nx && new Date(nx.t).toDateString() === day ? nx : null);
    });
    if (!list.length) html = '<div class="emptyc">Koi message nahi.<br>Pehla message bhejein 👋</div>';
    box.className = selMode ? "selmode" : "";

  /* ---------- Sending ---------- */
  function canSend() {
    if (!isAdmin() && S.group.adminOnly) { toast("Sirf admins message bhej sakte hain"); return false; }
    if (!isAdmin() && S.group.slow) {
      const wait = Math.ceil((lastSend + S.group.slow * 1000 - now()) / 1000);
      if (wait > 0) { toast("Slow mode: " + wait + " second baad bhejein"); return false; }

  function pushMsg(o) {

  function sendMsg(o) {
    if (!canSend()) return null;
    if (replying) { o.replyTo = replying; }
    const m = pushMsg(o);
    lastSend = now(); cancelCtx(true); renderMsgs("bottom"); track(m); simulate(m);

  function track(m) {
    const setT = st => { m.status = st; save(); const el = document.querySelector('[data-tick="' + m.id + '"]'); if (el) { el.className = "tick " + st; el.textContent = st === "sent" ? "✓" : "✓✓"; } };

  }
  function send() {
    const ta = $("ta"), text = ta.value.trim();

      const m = byId(editing);

      if (m) { m.text = text; m.edited = true; save(); }
      cancelCtx(true); ta.value = ""; onInput(); renderPin(); renderMsgs("keep"); return;

    if (!text) return;
    if (sendMsg({ type: "text", text })) { ta.value = ""; S.draft = ""; onInput(); }

  function openPollSheet() {

  function onFile(inp, kind) {
    const f = inp.files && inp.files[0]; inp.value = "";
    if (!f) return;
    const caption = $("ta").value.trim();
    const done = o => { if (sendMsg(Object.assign({ text: caption }, o))) { $("ta").value = ""; S.draft = ""; onInput(); } };
    if (kind === "image") {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const sc = Math.min(1, 1280 / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
          const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
          done({ type: "image", src: c.toDataURL("image/jpeg", 0.72) });
        };
        img.onerror = () => toast("Image padh nahi paye");
        img.src = fr.result;
      };
      fr.readAsDataURL(f);
    } else if (f.size <= 1500000) {
      const fr = new FileReader(); fr.onload = () => done({ type: "file", name: f.name, size: f.size, src: fr.result }); fr.readAsDataURL(f);
    } else {
      done({ type: "file", name: f.name, size: f.size, src: URL.createObjectURL(f) });   // badi file sirf is session ke liye
      toast("Badi file sirf is session mein available rahegi");
    }
  }

  let curAudio = null, curBtn = null;
  function playVoice(id, btn) {
    const m = byId(id); if (!m || !m.src) return;
    if (curAudio && curBtn === btn) { if (curAudio.paused) { curAudio.play(); btn.textContent = "⏸"; } else { curAudio.pause(); btn.textContent = "▶"; } return; }
    if (curAudio) { curAudio.pause(); if (curBtn) curBtn.textContent = "▶"; }
    curAudio = new Audio(m.src); curBtn = btn; btn.textContent = "⏸";
    curAudio.onended = () => { btn.textContent = "▶"; curAudio = null; curBtn = null; };
    curAudio.play().catch(() => { btn.textContent = "▶"; toast("Audio play nahi ho paya"); });
  }

  let rec = null, recChunks = [], recT0 = 0, recInt = null, recStream = null;
  async function startRec() {
    if (!canSend()) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast("Is browser mein voice recording support nahi hai"); return; }
    try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast("Microphone ki permission chahiye"); return; }
    recChunks = []; rec = new MediaRecorder(recStream);
    rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.start(); recT0 = now();
    $("inputRow").classList.add("hidden"); $("recRow").classList.remove("hidden"); $("recTime").textContent = "0:00";
    recInt = setInterval(() => {
      const s = Math.floor((now() - recT0) / 1000);
      $("recTime").textContent = Math.floor(s / 60) + ":" + pad(s % 60);
      if (s >= 120) finishRec();
    }, 250);
  }
  function stopRecUI() {
    clearInterval(recInt); $("recRow").classList.add("hidden"); $("inputRow").classList.remove("hidden");
    if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  }
  function cancelRec() { if (rec) { rec.onstop = null; try { rec.stop(); } catch (e) {} rec = null; } stopRecUI(); }
  function finishRec() {
    if (!rec) return;
    const dur = Math.max(1, Math.round((now() - recT0) / 1000)), r = rec; rec = null;
    r.onstop = () => {
      const blob = new Blob(recChunks, { type: r.mimeType || "audio/webm" }), fr = new FileReader();
      fr.onload = () => sendMsg({ type: "voice", src: fr.result, dur });
      fr.readAsDataURL(blob);
    };
    try { r.stop(); } catch (e) {} stopRecUI();
  }

      it("🔖", "Saved messages", "closeTop(openSaved)", S.saved.length || "") +
      it("✅", "Messages select karein", "act('selectStart')") +
      it(S.group.muted ? "🔔" : "🔕", S.group.muted ? "Notifications on karein" : "Notifications mute karein", "act('muteToggle')") +
      it("🧹", "Chat clear karein (mere liye)", "A.clearAsk()") +
      it("⬇️", "Sabse neeche jaayein", "act('bottom')"));
  }
  A.selectStart = () => { const l = vis(); if (l.length) A.select(l[l.length - 1].id); };
  A.muteToggle = () => { S.group.muted = !S.group.muted; save(); renderHeader(); toast(S.group.muted ? "Mute kar diya 🔕" : "Notifications on 🔔"); };
  A.bottom = () => scrollBottom(true);
  A.clearAsk = () => openSheet('<h3>Chat clear karein?</h3><p class="sub">Sirf aapke liye saare messages hide honge. Doosron ko pehle jaise dikhenge.</p><button class="sitem danger" onclick="A.clearDo()"><span>🧹</span>Haan, clear karein</button><button class="ghost" onclick="closeTop()">Cancel</button>');
  A.clearDo = () => closeTop(() => { S.hidden = S.msgs.map(m => m.id); S.pinned = []; save(); renderPin(); renderMsgs("bottom"); toast("Chat clear ho gayi"); });

  function openSaved() {
    const l = S.saved;
    openSheet("<h3>🔖 Saved messages</h3>" + (l.length ? l.slice().reverse().map(m =>
      '<div class="sitem" style="align-items:flex-start"><span>🔖</span><div style="flex:1;min-width:0"><b style="font-size:13px;color:var(--amber)">' + esc(m.fwd || "You") + '</b><div style="font-size:14px;word-break:break-word">' + esc(preview(m)) + '</div></div><small onclick="delSaved(\'' + m.id + '\')">🗑️</small></div>').join("") : '<div class="none">Abhi kuch save nahi hai.<br>Message dabake "Saved messages mein rakhein" chunein.</div>'));
  }
  function delSaved(id) { S.saved = S.saved.filter(m => m.id !== id); save(); openSaved(); }

  /* ---------- Group info ---------- */
  let infoEl = null;
  function openInfo() {
    if (infoEl) return;
    const el = document.createElement("div"); el.className = "ovpage"; $("layer").appendChild(el); infoEl = el;
    openOv(() => { el.remove(); infoEl = null; });
    renderInfo();
  }
  function renderInfo() {
    if (!infoEl) return;
    const keep = infoEl.scrollTop; infoEl.innerHTML = infoHTML(); infoEl.scrollTop = keep;
  }
  function infoHTML() {
    const ad = isAdmin(), g = S.group;
    const seg = (cur, opts, fnName) => '<div class="seg">' + opts.map(o => '<button class="' + (cur === o[0] ? "on" : "") + '" onclick="' + fnName + "(" + JSON.stringify(o[0]).replace(/"/g, "&quot;") + ')">' + o[1] + "</button>").join("") + "</div>";
    const sw = (label, key, val) => '<label class="sw"><span>' + label + '</span><input type="checkbox" ' + (val ? "checked" : "") + ' onchange="setOpt(\'' + key + '\',this.checked)"><i></i></label>';
    let h = '<div class="ibar"><button class="ib" onclick="closeTop()">‹</button><b>Group info</b>' + (ad ? '<button class="ib" onclick="editGroup()">✏️</button>' : '<span class="ib"></span>') + "</div>" +
      '<div class="ihero"><span class="av xl">🎓</span><h2>' + esc(g.name) + "</h2><p>" + memberCount() + " members, " + onlineCount() + " online</p></div>" +
      '<div class="iacts"><button onclick="A.muteToggle();renderInfo()"><span>' + (g.muted ? "🔕" : "🔔") + "</span>" + (g.muted ? "Unmute" : "Mute") + '</button>' +
      '<button onclick="closeTop(startSearch)"><span>🔍</span>Search</button><button onclick="copyText(S.group.link)"><span>🔗</span>Invite link</button></div>' +
      '<div class="card"><div class="desc"><b>About</b>' + esc(g.desc || "Koi description nahi.") + "</div>" + (ad ? '<button class="setrow" onclick="editDesc()"><span>✏️ Description badlein</span></button>' : "") + "</div>" +
      '<div class="card"><button class="setrow" onclick="editMyName()"><span>Mera naam</span><small>' + esc(S.myName) + " ›</small></button>" +
      '<div class="setrow"><span>Meri role (demo)</span>' + seg(S.role, [["admin", "Admin"], ["member", "Member"]], "setRole") + "</div>" +
      sw("Demo members reply karein", "demo", g.demo) +
      (ad ? sw("Sirf admins message bhejein", "adminOnly", g.adminOnly) + '<div class="setrow"><span>Slow mode</span>' + seg(g.slow, [[0, "Off"], [10, "10s"], [30, "30s"], [60, "1m"]], "setSlow") + "</div>" : "") + "</div>";
    const files = S.msgs.filter(m => m.type === "file"), imgs = S.msgs.filter(m => m.type === "image" && m.src);
    const links = []; S.msgs.forEach(m => { (String(m.text || "").match(/https?:\/\/[^\s]+/g) || []).forEach(u => links.push(u)); });
    h += '<div class="itabs">' + [["members", "Members"], ["media", "Media"], ["files", "Files"], ["links", "Links"]].map(t => '<button class="' + (infoTab === t[0] ? "on" : "") + '" onclick="infoTab=\'' + t[0] + '\';renderInfo()">' + t[1] + "</button>").join("") + "</div>";
    if (infoTab === "members") {
      const all = [member("me")].concat(S.members.slice().sort((a, b) => (b.role === "admin") - (a.role === "admin")));
      h += (ad ? '<button class="mem" onclick="addMember()"><span class="av sm" style="background:var(--teal)">＋</span><div class="mi"><b style="color:var(--teal)">Member jodein</b></div></button>' : "") +
        all.map(m => '<button class="mem" ' + (ad && m.id !== "me" ? 'onclick="memberSheet(\'' + m.id + '\')"' : "") + '><span class="av" style="background:' + m.color + '">' + esc(initials(m.name)) + '</span><div class="mi"><b>' + esc(m.name) + (m.id === "me" ? " (You)" : "") + "</b><small class=\"" + (m.online ? "on" : "") + '">' + (m.online ? "online" : "recently dekha gaya") + "</small></div>" +
          (m.role === "admin" ? '<span class="badge">admin</span>' : "") + (m.muted ? '<span class="badge mu">muted</span>' : "") + "</button>").join("");
    } else if (infoTab === "media") {
      h += imgs.length ? '<div class="mgrid">' + imgs.map(m => '<img src="' + m.src + '" alt="" onclick="viewImg(\'' + m.id + '\')">').join("") + "</div>" : '<div class="none">Koi photo nahi.</div>';
    } else if (infoTab === "files") {
      h += files.length ? files.map(m => '<a class="lrow"' + (m.src ? ' href="' + m.src + '" download="' + esc(m.name) + '"' : "") + ">📄 " + esc(m.name) + " <small style=\"color:var(--muted)\">(" + fmtSize(m.size || 0) + ")</small></a>").join("") : '<div class="none">Koi file nahi.</div>';
    } else {
      h += links.length ? links.map(u => '<a class="lrow" href="' + esc(u) + '" target="_blank" rel="noopener">🔗 ' + esc(u) + "</a>").join("") : '<div class="none">Koi link nahi.</div>';
    }
    return h + '<div style="height:40px"></div>';
  }
  function setOpt(k, v) { S.group[k] = v; save(); renderInfo(); renderComposer(); }
  function setSlow(v) { setOpt("slow", +v); toast(v ? "Slow mode: " + v + " sec" : "Slow mode off"); }
  function setRole(r) { S.role = r; save(); renderInfo(); renderAll("keep"); toast("Ab aap " + (r === "admin" ? "Admin" : "Member") + " hain"); }
  function editGroup() { askText("Group ka naam", "Group name", S.group.name, v => { S.group.name = v.slice(0, 60); save(); renderHeader(); renderInfo(); }); }
  function editDesc() { askText("Description", "Group ke baare mein likhein", S.group.desc, v => { S.group.desc = v.slice(0, 400); save(); renderInfo(); }, true); }
  function editMyName() { askText("Aapka naam", "Apna naam", S.myName, v => { S.myName = v.slice(0, 30); save(); renderInfo(); renderMsgs("keep"); }); }
  function copyInvite() { copyText(S.group.link); }
  function addMember() {
    askText("Naya member", "Member ka naam", "", v => {
      const m = { id: "u" + now().toString(36), name: v.slice(0, 30), color: COLORS[S.members.length % COLORS.length], role: "member", online: true };
      S.members.push(m); pushMsg({ type: "system", from: "me", text: m.name + " ko " + S.myName + " ne add kiya" });
      save(); renderInfo(); renderHeader(); renderMsgs("keep");
    });
  }
  function memberSheet(id) {
    const m = member(id);
    const it = (ico, label, fn, cls) => '<button class="sitem ' + (cls || "") + '" onclick="' + fn + '"><span>' + ico + "</span>" + label + "</button>";
    openSheet("<h3>" + esc(m.name) + "</h3>" +
      it(m.muted ? "🔊" : "🔇", m.muted ? "Unmute karein" : "Mute karein", "A.mMute('" + id + "')") +
      it("⭐", m.role === "admin" ? "Admin se hatayein" : "Admin banayein", "A.mAdmin('" + id + "')") +
      it("🚫", "Group se hatayein", "A.mRemove('" + id + "')", "danger"));
  }
  A.mMute = id => closeTop(() => { const m = member(id); m.muted = !m.muted; save(); renderInfo(); toast(m.muted ? m.name + " mute ho gaya" : "Unmute ho gaya"); });
  A.mAdmin = id => closeTop(() => { const m = member(id); m.role = m.role === "admin" ? "member" : "admin"; save(); renderInfo(); renderMsgs("keep"); toast(m.name + " ab " + m.role + " hai"); });
  A.mRemove = id => closeTop(() => {
    const m = member(id); S.members = S.members.filter(x => x.id !== id);
    pushMsg({ type: "system", from: "me", text: m.name + " ko group se hata diya gaya" });
    save(); renderInfo(); renderHeader(); renderMsgs("keep");
  });

  /* ---------- Demo members (simulation) ---------- */
  const CHAT_REPLIES = ["Haan bilkul 👍", "Sahi baat hai!", "Mujhe bhi yehi lag raha tha 😅", "Thanks for sharing 🙏", "Kal ki class ke baad discuss karte hain", "Great! Keep going 💪", "Mock test ka link mil gaya kya?", "Maine yeh question kal solve kiya tha", "Nice 🔥", "Ok samajh gaya"];
  const DOUBT_REPLIES = ["Iska answer 25% aayega — `Profit ÷ CP × 100` lagao 👍", "Pehle formula likho, phir values daalo. Easy ho jayega!", "Notes mein iska example hai, Resources section dekho 📚", "Mujhe bhi yeh confuse karta hai, admin sir se poochte hain", "Short trick: Percentage ko fraction mein convert karo 😉"];
  function incoming(from, o) {
    const was = atBottom(), m = pushMsg(Object.assign({ from }, o));
    S.msgs.forEach(x => { if (x.from === "me" && x.status !== "read") x.status = "read"; });
    renderMsgs(was ? "bottom" : "keep");
    if (!was) { unread++; updateFab(); if (!S.group.muted) toast(nameOf(from) + ": " + preview(m)); }
    return m;
  }
  function simulate(sent) {
    if (!S.group.demo || sent.type === "system") return;
    const online = S.members.filter(m => m.online && !m.muted);
    if (!online.length || Math.random() > 0.7) return;
    const u = pick(online), isQ = /\?|\bdoubt\b|kaise|kya|kaun/i.test(sent.text || "");
    setTimeout(() => {
      typingName = u.name; renderHeader();
      setTimeout(() => {
        typingName = null; renderHeader();
        if (sent.type === "poll") { const o = pick(sent.poll.opts); if (o.votes.indexOf(u.id) < 0) o.votes.push(u.id); save(); renderMsgs("keep"); return; }
        const text = (isQ ? pick(DOUBT_REPLIES) : pick(CHAT_REPLIES));
        incoming(u.id, { text: Math.random() < 0.4 ? "@" + (S.myName.replace(/\s+/g, "")) + " " + text : text, replyTo: Math.random() < 0.5 ? sent.id : null });
      }, 1300 + Math.random() * 1800);
    }, 900 + Math.random() * 1400);
  }

  /* ---------- Init ---------- */
  (function init() {
    S = load() || seed();
    ["members", "msgs", "pinned", "saved", "hidden"].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
    S.group = Object.assign({ name: "SSC PrepX Students", desc: "", link: "", adminOnly: false, slow: 0, muted: false, demo: true }, S.group || {});
    S.msgs.forEach(m => { if (m.from === "me" && m.status !== "read") m.status = "read"; });
    if (/^#ov/.test(location.hash)) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    $("ta").value = S.draft || "";
    renderAll("bottom"); onInput(true);
    setTimeout(() => scrollBottom(), 50);
    window.addEventListener("beforeunload", doSave);
  })();
  </script>
</body>
</html>
