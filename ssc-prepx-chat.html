<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0e0b1f"/>
<title>SSC PrepX - Group Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e0b1f;--surface:#19152e;--surface2:#231e3d;--surface3:#2e2850;--coral:#ff7a59;--amber:#ffb347;--teal:#2dd4bf;--red:#ff6b6b;--text:#f6f3ff;--muted:#9b94b8;--grad:linear-gradient(90deg,var(--coral),var(--amber));--grad-v:linear-gradient(135deg,var(--coral),var(--amber))}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
@media print{body{display:none!important}}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}button{cursor:pointer}
.hidden{display:none!important}img,video{-webkit-touch-callout:none}
#app{height:100vh;height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(25,21,46,.96);border-bottom:1px solid rgba(255,255,255,.05);min-height:58px;z-index:5}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--text);flex-shrink:0}
.ib:active{background:var(--surface3)}
.ginfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:2px}
.gav{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:16px;color:#2a0f06;background:var(--grad-v)}
.gtxt{min-width:0}.gtxt b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtxt small{display:block;font-size:12px;color:var(--muted)}.gtxt small.on{color:var(--teal)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:4px}
.status-dot.live{background:var(--teal);box-shadow:0 0 6px var(--teal)}
#msgs{flex:1;overflow-y:auto;padding:12px;background:radial-gradient(circle at 12% 8%,rgba(255,122,89,.08),transparent 42%),radial-gradient(circle at 88% 78%,rgba(45,212,191,.06),transparent 46%),var(--bg);overscroll-behavior:contain}
.day{text-align:center;margin:14px 0 10px}.day span{display:inline-block;padding:4px 12px;border-radius:14px;background:rgba(36,31,64,.9);color:var(--muted);font-size:11px;font-weight:700}
.sys{text-align:center;margin:10px 0}.sys span{display:inline-block;padding:5px 12px;border-radius:14px;background:rgba(36,31,64,.8);color:var(--muted);font-size:12px}
.row{display:flex;align-items:flex-end;gap:6px;margin-top:3px}.row.first{margin-top:10px}.row.me{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1a1030}
.sp{width:30px;flex-shrink:0}.col{max-width:78%;display:flex;flex-direction:column;min-width:0}.row.me .col{align-items:flex-end}
.bubble{position:relative;padding:8px 12px 6px;border-radius:18px;font-size:15px;line-height:1.4;word-break:break-word;overflow-wrap:anywhere;min-width:72px;max-width:100%;user-select:text;-webkit-user-select:text}
.bubble.other{background:var(--surface2);border-bottom-left-radius:5px}
.bubble.me{background:var(--grad-v);color:#2a0f06;border-bottom-right-radius:5px}
.sname{display:block;font-size:12px;font-weight:800;margin-bottom:2px;color:var(--amber)}.me .sname{color:#6b2200}
.meta{float:right;margin:5px 0 -1px 10px;font-size:10px;color:var(--muted);white-space:nowrap}.me .meta{color:rgba(42,15,6,.65)}
.mention{color:var(--amber);font-weight:700}.me .mention{color:#5a1a00}
.media-wrap{position:relative;display:inline-block;max-width:100%}
.media{display:block;max-width:100%;max-height:280px;border-radius:14px;margin-bottom:4px;background:#000}.media.vid{width:100%}
.dl-btn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(14,11,31,.75);color:#fff;font-size:16px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.filec{display:flex;align-items:center;gap:10px;min-width:200px;padding:6px 4px;text-decoration:none;color:inherit}
.fico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.22);font-size:20px;flex-shrink:0}
.finfo{flex:1;min-width:0}.finfo b{display:block;font-size:13px}.finfo small{font-size:11px;opacity:.75}
.voice{display:flex;align-items:center;gap:10px;min-width:180px}
.vplay{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.22);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}.wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.55}
.vdur{font-size:11px;opacity:.8}
.poll{min-width:220px}.pq{font-weight:800;margin-bottom:6px}
.popt{position:relative;display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;margin-bottom:6px;border-radius:12px;background:rgba(0,0,0,.18);text-align:left;overflow:hidden}
.me .popt{background:rgba(255,255,255,.28)}
.popt i.bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,179,71,.3);z-index:0}.me .popt i.bar{background:rgba(138,58,18,.22)}
.popt>*{position:relative;z-index:1}.pt{flex:1;font-size:13px}.pp{font-size:11px;font-weight:800}.pfoot{font-size:11px;opacity:.75;margin-top:2px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.react{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;background:var(--surface2);font-size:13px}
.react span{font-size:11px;font-weight:700;color:var(--muted)}.react.on{box-shadow:inset 0 0 0 1px var(--amber);background:rgba(255,179,71,.2)}
.composer{background:var(--surface);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.05)}
.ctx{display:flex;align-items:center;gap:8px;padding:6px 10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
.ctx>div{flex:1;min-width:0;border-left:3px solid var(--amber);padding-left:8px}
.ctx b{display:block;font-size:12px;color:var(--amber)}.ctx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inrow{display:flex;align-items:flex-end;gap:4px}
#ta{flex:1;min-width:0;resize:none;max-height:110px;padding:11px 14px;border-radius:22px;background:var(--surface2);outline:none;font-size:15px;line-height:1.35;user-select:text;-webkit-user-select:text}
#ta::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--grad-v);color:#2a0f06;font-size:18px;font-weight:800}
.attach{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--muted);flex-shrink:0}
.lockbar{padding:16px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);border-top:1px solid rgba(255,255,255,.05)}
.recrow{display:flex;align-items:center;gap:10px;padding:8px 6px}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,3,15,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:82vh;overflow-y:auto;background:#1b1733;border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--surface3);margin:4px auto 12px;display:block}
.sheet h3{font-size:17px;font-weight:800;margin:0 4px 12px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 8px;border-radius:14px;font-size:15px;text-align:left}
.sitem:active{background:var(--surface2)}.sitem.danger{color:var(--red)}.sitem span{width:26px;text-align:center;font-size:18px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.agrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;background:var(--surface2);font-size:12px;font-weight:700}
.agrid button span{font-size:26px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:20px;background:#f6f3ff;color:#1a1030;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:88%;text-align:center}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.viewer .vtop{display:flex;justify-content:space-between;padding:12px;gap:8px}
.viewer img,.viewer video{max-width:100%;max-height:80vh;margin:auto;object-fit:contain}
.mention-box{background:var(--surface);border-top:1px solid rgba(255,255,255,.06);max-height:150px;overflow-y:auto}
.mention-box button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left}
.mention-box button:active{background:var(--surface2)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;line-height:1.6}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;background:rgba(255,179,71,.2);color:var(--amber);margin-left:6px}
.badge.ban{background:rgba(255,107,107,.2);color:var(--red)}
.mem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:14px;text-align:left}
.mem:active{background:var(--surface2)}.mem .mi{flex:1;min-width:0}.mem b{display:block;font-size:14px}.mem small{font-size:12px;color:var(--muted)}.mem small.live{color:var(--teal)}
.fld{width:100%;padding:12px 14px;border-radius:14px;background:var(--surface2);outline:none;margin-bottom:10px;font-size:14px}
.primary{width:100%;padding:13px;border-radius:22px;font-weight:800;background:var(--grad);color:#2a0f06;margin-top:6px}
.ghost{width:100%;padding:12px;border-radius:22px;font-weight:700;background:var(--surface2);color:var(--text);margin-top:8px}
#fbBadge{font-size:10px;color:var(--muted);padding:2px 8px}
#fbBadge.on{color:var(--teal)}
</style>
</head>
<body oncontextmenu="return false">
<div id="app">
<header class="top">
<button class="ib" onclick="goHome()" aria-label="Back">&#8249;</button>
<button class="ginfo" onclick="openGroupInfo()"><span class="gav">SX</span><span class="gtxt"><b id="gName">SSC PrepX Students</b><small id="gSub"><span class="status-dot" id="liveDot"></span>connecting...</small></span></button>
<span id="fbBadge">offline</span>
<button class="ib" onclick="openSearch()" aria-label="Search">&#128269;</button>
<button class="ib" onclick="openMainMenu()" aria-label="Menu">&#8942;</button>
</header>
<div id="msgs"></div>
<div id="mentionBox" class="mention-box hidden"></div>
<div id="ctxBar" class="ctx hidden"><div><b id="ctxTitle">Reply</b><span id="ctxText"></span></div><button class="ib" onclick="clearCtx()">&#10005;</button></div>
<div id="lockBar" class="lockbar hidden">&#128683; Aap ban ho — message nahi bhej sakte.</div>
<div id="recBar" class="composer hidden"><div class="recrow"><span class="recdot"></span><span style="flex:1;color:var(--muted);font-size:14px">Recording... <b id="recTime">0:00</b></span><button class="ib" onclick="cancelRec()">&#10005;</button><button class="send" onclick="finishRec()">&#10148;</button></div></div>
<div id="composer" class="composer"><div class="inrow">
<button class="attach" onclick="openAttach()">&#65291;</button>
<textarea id="ta" rows="1" placeholder="Message... (@ se mention)" maxlength="2000"></textarea>
<button class="attach" onclick="startRec()">&#127908;</button>
<button class="send" onclick="sendText()">&#10148;</button>
</div></div>
</div>
<div id="layer"></div>

<script>
const HOME_URL="index.html", KEY="sscprepx_chat_v2";
const REACTS=["👍","❤️","😂","🔥","👏","😮","😢","🎉"];
const COLORS=["#ff7a59","#ffb347","#2dd4bf","#a855f7","#60a5fa","#f472b6","#84cc16","#f59e0b"];
const $=id=>document.getElementById(id), now=()=>Date.now();
const uid=()=>"m"+now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>(n<10?"0":"")+n;
const fmtTime=t=>{const d=new Date(t);return d.getHours()+":"+pad(d.getMinutes())};
const fmtDay=t=>{const d=new Date(t),x=new Date();if(d.toDateString()===x.toDateString())return"Aaj";x.setDate(x.getDate()-1);if(d.toDateString()===x.toDateString())return"Kal";return d.toLocaleDateString("hi-IN",{day:"numeric",month:"short"})};
const fmtSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
const initials=n=>(String(n||"?").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"?").toUpperCase();
let S=null, replyTo=null, rec=null, recChunks=[], recStream=null, recT0=0, recInt=null, toastT=null, curAudio=null, curBtn=null, lpTimer=null;
let ME={uid:"local",name:"Student",role:"member",color:COLORS[0]};
let FB_READY=false;

function toast(msg){const o=document.querySelector(".toast");if(o)o.remove();const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({myName:S.myName,role:S.role,selfBanned:S.selfBanned,members:S.members}))}catch(e){}}
function seed(){return{myName:ME.name||"Student",role:ME.role||"member",selfBanned:false,members:[
{id:"u1",name:"Rahul Sharma",role:"admin",color:COLORS[1],banned:false,online:true},
{id:"u2",name:"Priya Singh",role:"member",color:COLORS[2],banned:false,online:false},
{id:"u3",name:"Amit Kumar",role:"member",color:COLORS[3],banned:false,online:true},
{id:"u4",name:"Neha Verma",role:"member",color:COLORS[4],banned:false,online:false}
],msgs:[]}}
function isAdmin(){return S.role==="admin"||ME.role==="admin"}
function member(id){
  if(id==="me"||id===ME.uid)return{id:"me",name:S.myName||ME.name||"You",role:S.role,color:ME.color||COLORS[0],banned:!!S.selfBanned,online:true};
  const m=(S.members||[]).find(x=>x.id===id);
  if(m)return m;
  return{id,name:id.slice(0,8),color:COLORS[Math.abs(hash(id))%COLORS.length],role:"member",banned:false,online:false};
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
function nameOf(id){return member(id).name}
function goHome(){location.href=HOME_URL}
document.addEventListener("keyup",e=>{if(e.key==="PrintScreen")toast("Screenshot restricted")});
document.addEventListener("visibilitychange",()=>{document.body.style.filter=document.hidden?"blur(16px)":""});

function setFbBadge(on,txt){
  const b=$("fbBadge"),d=$("liveDot");
  if(b){b.textContent=txt||(on?"live":"offline");b.className=on?"on":""}
  if(d)d.className="status-dot"+(on?" live":"");
}

function renderHeader(){
  const online=1+S.members.filter(m=>m.online&&!m.banned).length;
  const total=1+S.members.filter(m=>!m.banned).length;
  $("gName").textContent="SSC PrepX Students";
  $("gSub").innerHTML='<span class="status-dot'+(FB_READY?" live":"")+'" id="liveDot"></span>'+total+" members · "+online+" online";
}
function renderComposer(){const b=!!S.selfBanned;$("lockBar").classList.toggle("hidden",!b);$("composer").classList.toggle("hidden",b)}
function linkify(text){let t=esc(text);t=t.replace(/@([A-Za-z0-9_\u0900-\u097F]+)/g,'<span class="mention">@$1</span>');t=t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');return t}
function reactsHTML(m){const r=m.reacts||{},keys=Object.keys(r).filter(k=>r[k]&&r[k].length);if(!keys.length)return"";return'<div class="reacts">'+keys.map(k=>{const on=(r[k]||[]).includes(ME.uid)||(r[k]||[]).includes("me")?" on":"";return'<button class="react'+on+'" onclick="event.stopPropagation();toggleReact(\''+m.id+'\',\''+k+'\')">'+k+'<span>'+r[k].length+'</span></button>'}).join("")+"</div>"}

function dlBtn(url,name){
  if(!url)return"";
  return'<button class="dl-btn" title="Download" onclick="event.stopPropagation();downloadMedia(\''+esc(url).replace(/'/g,"")+"','"+esc(name||"file").replace(/'/g,"")+'\')">⬇</button>';
}
function bodyHTML(m){
  if(m.type==="text")return"<div>"+linkify(m.text||"")+"</div>";
  if(m.type==="image")return'<div class="media-wrap"><img class="media" src="'+esc(m.src)+'" alt="photo" onclick="viewMedia(\'image\',\''+m.id+'\')">'+dlBtn(m.src,"photo.jpg")+"</div>"+(m.text?"<div>"+linkify(m.text)+"</div>":"");
  if(m.type==="video")return'<div class="media-wrap"><video class="media vid" src="'+esc(m.src)+'" controls playsinline></video>'+dlBtn(m.src,"video.mp4")+"</div>"+(m.text?"<div>"+linkify(m.text)+"</div>":"");
  if(m.type==="file")return'<div style="display:flex;align-items:center;gap:6px"><a class="filec" href="'+esc(m.src||"#")+'" download="'+esc(m.name)+'" target="_blank" rel="noopener"><span class="fico">📄</span><span class="finfo"><b>'+esc(m.name)+'</b><small>'+fmtSize(m.size||0)+'</small></span></a><button class="dl-btn" style="position:static" onclick="event.stopPropagation();downloadMedia(\''+esc(m.src||"").replace(/'/g,"")+'\',\''+esc(m.name||"file").replace(/'/g,"")+'\')">⬇</button></div>';
  if(m.type==="voice")return'<div class="voice"><button class="vplay" onclick="event.stopPropagation();playVoice(this,\''+m.id+'\')">▶</button><span class="wave">'+Array.from({length:16},(_,i)=>'<i style="height:'+(30+(i*17)%70)+'%"></i>').join("")+'</span><span class="vdur">'+(m.dur||1)+'s</span><button class="dl-btn" style="position:static;width:30px;height:30px;font-size:13px" onclick="event.stopPropagation();downloadMedia(\''+esc(m.src||"").replace(/'/g,"")+'\',\'voice.webm\')">⬇</button></div>';
  if(m.type==="poll"){const p=m.poll||{q:"",opts:[]};const total=p.opts.reduce((s,o)=>s+(o.votes||[]).length,0)||1;return'<div class="poll"><div class="pq">'+esc(p.q)+"</div>"+p.opts.map((o,i)=>{const n=(o.votes||[]).length,pct=Math.round(n/total*100),on=(o.votes||[]).includes(ME.uid)||(o.votes||[]).includes("me");return'<button class="popt" onclick="event.stopPropagation();votePoll(\''+m.id+'\','+i+')"><i class="bar" style="width:'+pct+'%"></i><span class="pt">'+(on?"✓ ":"")+esc(o.text)+'</span><span class="pp">'+pct+"%</span></button>"}).join("")+'<div class="pfoot">'+total+" votes</div></div>"}
  return esc(m.text||"");
}
function preview(m){if(!m)return"";if(m.type==="image")return"Photo";if(m.type==="video")return"Video";if(m.type==="voice")return"Voice";if(m.type==="file")return m.name||"File";if(m.type==="poll")return(m.poll&&m.poll.q)||"Poll";return String(m.text||"").slice(0,60)}

async function downloadMedia(url,name){
  if(!url)return toast("File nahi mili");
  try{
    if(url.startsWith("data:")){
      const a=document.createElement("a");a.href=url;a.download=name||"download";document.body.appendChild(a);a.click();a.remove();
      toast("Download start ✓");return;
    }
    const res=await fetch(url);const blob=await res.blob();
    const obj=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=obj;a.download=name||"download";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(obj),2000);
    toast("Download start ✓");
  }catch(e){
    // fallback open
    window.open(url,"_blank","noopener");
    toast("Open / save from browser");
  }
}

function renderMsgs(){
  const box=$("msgs"),list=S.msgs||[];
  if(!list.length){box.innerHTML='<div class="empty">Abhi koi message nahi.<br>Pehla message bhejo 👋'+(FB_READY?"<br><small>Firebase live connected</small>":"<br><small>Local mode — login ke baad live sync</small>")+"</div>";return}
  let html="",lastDay="",lastFrom="";
  list.forEach(m=>{
    if(m.type==="system"){html+='<div class="sys"><span>'+esc(m.text)+"</span></div>";lastFrom="";return}
    const day=fmtDay(m.t||m.createdAt||now());if(day!==lastDay){html+='<div class="day"><span>'+day+"</span></div>";lastDay=day;lastFrom=""}
    const mine=m.from==="me"||m.from===ME.uid||m.uid===ME.uid;
    const fromId=m.from||m.uid||"x";

    html+='<div class="row'+(mine?" me":"")+(first?" first":"")+'" data-id="'+m.id+'">';
    if(!mine)html+=first?'<span class="av" style="background:'+mem.color+'">'+esc(initials(m.fromName||mem.name))+"</span>":'<span class="sp"></span>';
    html+='<div class="col"><div class="bubble '+(mine?"me":"other")+'" oncontextmenu="event.preventDefault();msgMenu(\''+m.id+'\')" ontouchstart="longPressStart(\''+m.id+'\')" ontouchend="longPressEnd()" ontouchmove="longPressEnd()">';
    if(!mine&&first)html+='<span class="sname">'+esc(m.fromName||mem.name)+((m.role||mem.role)==="admin"?'<span class="badge">admin</span>':"")+"</span>";
    if(m.replyTo){const rm=list.find(x=>x.id===m.replyTo);html+='<div style="border-left:3px solid '+(mine?"#8a3a12":"var(--amber)")+';padding:2px 8px;margin-bottom:4px;opacity:.85;font-size:12px"><b>'+esc(rm?(rm.fromName||nameOf(rm.from)):"")+"</b><div>"+esc(preview(rm))+"</div></div>"}
    html+=bodyHTML(m)+'<span class="meta">'+fmtTime(m.t||m.createdAt||now())+"</span></div>"+reactsHTML(m)+"</div></div>"});
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=html;if(atBottom)box.scrollTop=box.scrollHeight;
}

async function pushMsg(o){
  const m=Object.assign({id:uid(),t:now(),from:ME.uid||"me",uid:ME.uid,fromName:S.myName||ME.name,role:S.role||ME.role,color:ME.color,reacts:{}},o);

function pickFile(kind){
  closeLayer();
  const input=document.createElement("input");input.type="file";
  if(kind==="image")input.accept="image/*";else if(kind==="video")input.accept="video/*";else input.accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip";
  input.onchange=async()=>{
    const f=input.files&&input.files[0];if(!f)return;
    if(f.size>8*1024*1024)return toast("Max 8MB");
    toast("Uploading...");

      let src;
      if(window.ChatFB&&window.ChatFB.upload){src=await window.ChatFB.upload(f,kind)}
      else{
        src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      }

async function startRec(){if(S.selfBanned)return toast("Aap ban ho");if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Voice supported nahi");try{recStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast("Mic permission chahiye")}recChunks=[];rec=new MediaRecorder(recStream);rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};rec.start();recT0=now();$("composer").classList.add("hidden");$("recBar").classList.remove("hidden");$("recTime").textContent="0:00";recInt=setInterval(()=>{const s=Math.floor((now()-recT0)/1000);$("recTime").textContent=Math.floor(s/60)+":"+pad(s%60);if(s>=120)finishRec()},250)}
function stopRecUI(){clearInterval(recInt);$("recBar").classList.add("hidden");renderComposer();if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null}}
function cancelRec(){if(rec){try{rec.onstop=null;rec.stop()}catch(e){}rec=null}stopRecUI()}
function finishRec(){if(!rec)return;const dur=Math.max(1,Math.round((now()-recT0)/1000)),r=rec;rec=null;r.onstop=async()=>{const blob=new Blob(recChunks,{type:r.mimeType||"audio/webm"});try{let src;if(window.ChatFB&&window.ChatFB.uploadBlob){src=await window.ChatFB.uploadBlob(blob,"voice.webm","voice")}else{src=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}pushMsg({type:"voice",src,dur})}catch(e){toast("Voice send fail")}};try{r.stop()}catch(e){}stopRecUI()}

<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {
  collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
  query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js";

const COL = "chatMessages";
let storage = null;
try { storage = getStorage(getApp()); } catch (e) { console.warn("Storage not available", e); }

function clean(o){ return JSON.parse(JSON.stringify(o)); }

async function uploadFile(file, kind){
  if(!storage) throw new Error("Firebase Storage off — rules/config check karein");
  const path = "chat/" + (auth.currentUser?.uid || "anon") + "/" + Date.now() + "_" + (file.name || kind);
  const r = ref(storage, path);
  await uploadBytes(r, file);
  return await getDownloadURL(r);
}
async function uploadBlob(blob, name, kind){
  if(!storage){
    // fallback data URL
    return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
  }
  const path = "chat/" + (auth.currentUser?.uid || "anon") + "/" + Date.now() + "_" + name;
  const r = ref(storage, path);
  await uploadBytes(r, blob);
  return await getDownloadURL(r);
}

window.ChatFB = {
  async send(m){
    if(!auth.currentUser) return;
    const id = m.id || ("m"+Date.now());
    const payload = clean({
      id, type: m.type || "text", text: m.text || "", src: m.src || "",
      name: m.name || "", size: m.size || 0, dur: m.dur || 0,
      poll: m.poll || null, reacts: m.reacts || {},
      replyTo: m.replyTo || null,
      from: auth.currentUser.uid, uid: auth.currentUser.uid,
      fromName: m.fromName || "", role: m.role || "member", color: m.color || "",
      t: m.t || Date.now(), createdAt: serverTimestamp()
    });
    // strip huge data URLs from firestore if storage was used — if data URL and > 700kb skip remote
    if(payload.src && String(payload.src).startsWith("data:") && String(payload.src).length > 700000){
      throw new Error("File badi hai — Storage enable karein");
    }
    await setDoc(doc(db, COL, id), payload);
  },
  async update(id, patch){
    if(!auth.currentUser) return;
    await updateDoc(doc(db, COL, id), clean(patch));
  },
  async remove(id){
    if(!auth.currentUser) return;
    await deleteDoc(doc(db, COL, id));
  },
  upload: uploadFile,
  uploadBlob
};

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.__chatSetReady?.(false);
    // allow local-only chat without login
    return;
  }
  try{
    const uref = await getDoc(doc(db, "users", user.uid));
    const ud = uref.exists() ? uref.data() : {};
    window.__chatSetUser?.({
      uid: user.uid,
      name: ud.name || user.displayName || (user.email||"").split("@")[0] || "Student",
      role: ud.role === "admin" ? "admin" : "member",
      color: "#ff7a59"
    });
    // presence lite
    try{ await setDoc(doc(db, "chatPresence", user.uid), { name: ud.name||"", online: true, at: serverTimestamp() }, { merge: true }); }catch(e){}

    const qy = query(collection(db, COL), orderBy("t", "asc"), limit(250));
    onSnapshot(qy, (snap) => {
      const list = [];
      snap.forEach(d => {
        const x = d.data();
        list.push(Object.assign({}, x, { id: d.id, t: x.t || Date.now() }));
      });
      window.__chatApplyMessages?.(list);
      window.__chatSetReady?.(true);
    }, (err) => {
      console.error("chat listen", err);
      window.__chatSetReady?.(false);
      // toast via DOM
      const t=document.createElement("div");t.className="toast";t.textContent="Chat live fail — local mode";document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
    });

    // members from presence
    try{
      onSnapshot(collection(db, "chatPresence"), (snap) => {
        snap.forEach(d => {
          if(d.id === user.uid) return;
          const x = d.data();
          window.__chatUpsertMember?.({ id: d.id, name: x.name||d.id.slice(0,6), online: !!x.online, color: "#60a5fa", role: "member", banned: false });
        });
      });
    }catch(e){}
  }catch(e){
    console.error(e);
    window.__chatSetReady?.(false);
  }
});
</script>
