<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Railway Science Spl-30</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<style>
:root{--bg:#0e1424;--surface:#161e33;--ink:#eaeefa;--muted:#9aa6c4;--line:#27314d;--brand:#7d8cff;--brand-ink:#0e1424;--pdf:#4fd1a1;--pdf-bg:#12332a;--vid-bg:#1f2850;--hover:#1b2540}
[data-theme=light]{--bg:#f1f4f9;--surface:#fff;--ink:#16213a;--muted:#5d6985;--line:#dde3ee;--brand:#2f46d6;--brand-ink:#fff;--pdf:#0f7a55;--pdf-bg:#e4f5ee;--vid-bg:#e8ecff;--hover:#f5f7fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
h1{margin:0;font-size:1.2rem;font-weight:800}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.icon{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:1rem;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.92rem;padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab .n{background:var(--bg);border-radius:99px;padding:0 7px;font-size:.75rem;font-weight:700}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab[aria-selected=true] .n{background:var(--vid-bg)}
button:focus-visible,input:focus-visible,.row:focus-visible,.tab:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{padding:16px 0 64px}
#player-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
#player-box.hidden{display:none}
.vt{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 10px;font-weight:700;font-size:.95rem}
.vt button{flex-shrink:0}
.plyr{border-radius:10px;overflow:hidden}
.urlrow{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=search]{flex:1;min-width:0;padding:11px 13px;font:inherit;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
.go{appearance:none;border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;padding:0 16px;border-radius:11px;cursor:pointer}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:.88rem;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.meta{color:var(--muted);font-size:.83rem;margin:0 2px 10px}
.list{display:grid;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.row.play{cursor:pointer}.row.play:hover{background:var(--hover)}
.row.on{border-color:var(--brand)}
.t{min-width:0;font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.t small{display:block;color:var(--muted);font-weight:600;font-size:.76rem}
.mk{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--vid-bg);color:var(--brand);display:grid;place-items:center;font-size:.7rem}
.acts{display:flex;gap:6px;flex-shrink:0}
.btn{appearance:none;border:0;font:inherit;font-weight:700;font-size:.82rem;padding:8px 12px;border-radius:9px;cursor:pointer;background:var(--pdf-bg);color:var(--pdf)}
.btn.alt{background:var(--vid-bg);color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:1.1rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20}
@media (max-width:520px){.row .acts .btn span{display:none}}
</style>
</head>

const $=id=>document.getElementById(id);
let tab='All',kind='v',hls=null,playing=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=e=>{try{return atob(atob(e)).slice(8)}catch(_){return e}};
const player=new Plyr('#player',{settings:['quality','speed','loop'],speed:{selected:1,options:[.5,.75,1,1.25,1.5,1.75,2,3,4]},keyboard:{focused:true,global:false},fullscreen:{enabled:true,fallback:true,iosNative:true}});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const tabs=$('tabs');
['All',...DB.s].forEach(s=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.dataset.s=s;b.innerHTML=`${esc(s)} <span class="n"></span>`;b.onclick=()=>{tab=s;render();scrollTo(0,0)};tabs.appendChild(b)});
function match(r,q,s){return(s==='All'||r[0]===s)&&(!q||(r[0]+' '+r[1]).toLowerCase().includes(q))}
function render(){
 const q=$('q').value.trim().toLowerCase();
 [...tabs.children].forEach(b=>{const s=b.dataset.s;b.querySelector('.n').textContent=DB.v.filter(r=>match(r,q,s)).length+DB.p.filter(r=>match(r,q,s)).length;b.setAttribute('aria-selected',s===tab)});
 tabs.querySelector('[aria-selected=true]').scrollIntoView({inline:'center',block:'nearest'});
 const nv=DB.v.filter(r=>match(r,q,tab)).length,np=DB.p.filter(r=>match(r,q,tab)).length;
 $('bv').textContent=`Videos (${nv})`;$('bp').textContent=`PDFs (${np})`;
 $('bv').setAttribute('aria-pressed',kind==='v');$('bp').setAttribute('aria-pressed',kind==='p');
 const rows=DB[kind].map((r,i)=>[r,i]).filter(([r])=>match(r,q,tab));
 const lab=r=>tab==='All'?`<small>${esc(r[0])}</small>`:'';
 $('list').innerHTML=rows.map(([r,i])=>kind==='v'
  ?`<div class="row play${playing===i?' on':''}" tabindex="0" data-i="${i}"><div class="t">${lab(r)}${esc(r[1])}</div><span class="mk">&#9654;</span></div>`
  :`<div class="row"><div class="t">${lab(r)}${esc(r[1])}</div><div class="acts"><button class="btn alt" data-a="view" data-i="${i}">View</button><button class="btn" data-a="dl" data-i="${i}">Download</button></div></div>`).join('');
 $('empty').hidden=rows.length>0;
 $('meta').textContent=`${rows.length} ${kind==='v'?'videos':'PDFs'}${tab==='All'?'':' · '+tab}`;
 $('sub').textContent=`${DB.v.length} videos · ${DB.p.length} PDFs`;
}
function load(url,title){
 $('player-box').classList.remove('hidden');$('vtitle').textContent=title||'Custom video';
 if(hls){hls.destroy();hls=null}
 if(/\.m3u8/.test(url)){
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(player.media);hls.on(Hls.Events.MANIFEST_PARSED,()=>player.play())}
  else{player.source={type:'video',sources:[{src:url,type:'application/x-mpegURL'}]};player.play()}
 }else{player.source={type:'video',sources:[{src:url,type:'video/mp4'}]};player.play()}
 $('player-box').scrollIntoView({behavior:'smooth',block:'start'});
}
function play(url,title){
 if(url.includes('utkarshapp.com')){open(url,'_blank');return}
 if(url.includes('api.extractor.workers.dev')){
  fetch(url).then(r=>r.json()).then(d=>d.url?load(d.url,title):Promise.reject()).catch(()=>{open(url,'_blank');toast('Video naye tab mein khul raha hai')});
 }else load(url,title);
}
$('list').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');
 if(b){const r=DB.p[b.dataset.i],u=dec(r[2]);
  if(b.dataset.a==='view')open('https://tempnewwebsite.classx.co.in/pdfjs/web/viewer.html?file='+encodeURIComponent(u)+'&embedded=true','_blank');
  else{const a=document.createElement('a');a.href=u;a.download=r[3];document.body.appendChild(a);a.click();a.remove()}
  return}
 const row=e.target.closest('.row.play');
 if(row){playing=+row.dataset.i;const r=DB.v[playing];play(dec(r[2]),r[1]);render()}
});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('play'))e.target.click()});
$('bv').onclick=()=>{kind='v';render()};$('bp').onclick=()=>{kind='p';render()};
$('q').addEventListener('input',render);
$('close').onclick=()=>{player.stop();if(hls){hls.destroy();hls=null}$('player-box').classList.add('hidden')};
$('cgo').onclick=()=>{const u=$('curl').value.trim();if(u){play(u);$('curl').value=''}};
$('curl').addEventListener('keydown',e=>{if(e.key==='Enter')$('cgo').click()});
$('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
const root=document.documentElement;
try{root.dataset.theme=localStorage.getItem('theme')||'dark'}catch(_){}
$('theme').onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(_){}};
render();
</script>
