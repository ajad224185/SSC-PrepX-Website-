<style>
:root{--bg:#f1f4f9;--surface:#fff;--ink:#16213a;--muted:#5d6985;--line:#dde3ee;--brand:#2f46d6;--brand-ink:#fff;--pdf:#0f7a55;--pdf-bg:#e4f5ee;--vid-bg:#e8ecff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#161e33;--ink:#eaeefa;--muted:#9aa6c4;--line:#27314d;--brand:#7d8cff;--brand-ink:#0e1424;--pdf:#4fd1a1;--pdf-bg:#12332a;--vid-bg:#1f2850}}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.head{padding:16px 0 10px}
h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.95rem;padding:12px 8px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .n{background:var(--bg);color:var(--muted);border-radius:99px;padding:0 8px;font-size:.78rem;font-weight:700}
.tab[aria-selected=true] .n{background:var(--vid-bg);color:var(--brand)}
.tab:focus-visible,.btn:focus-visible,#q:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{padding:16px 0 48px}
#q{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.meta{color:var(--muted);font-size:.85rem;margin:10px 2px 12px}
.btn{text-decoration:none;font-weight:700;font-size:.85rem;padding:9px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px}
.btn.v{background:var(--brand);color:var(--brand-ink)}
.btn.p{background:var(--pdf-bg);color:var(--pdf)}
.btn:hover{filter:brightness(.94)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.hidden{display:none!important}

.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap;padding:12px 14px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.topic h2{margin:0 0 10px;font-size:1rem;font-weight:700}
.topic h2 small{color:var(--muted);font-weight:600;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;font-weight:600;font-size:.85rem;padding:8px 12px;border-radius:9px;line-height:1.3}
.chip.v{background:var(--vid-bg);color:var(--brand)}
.chip.p{background:var(--pdf-bg);color:var(--pdf)}
.chip:hover{filter:brightness(.94)}.chip:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.chip.v::before{content:'\25B6\00a0'}.chip.p::before{content:'PDF\00a0\00b7\00a0';font-weight:800}
</style>
</head>

bs___2025_20260910012113.pdf", "PROVERBS (1-77)"]]]]]];
let cur=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=document.getElementById('tabs');
C.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.innerHTML=`${esc(c[0])} <span class="n"></span>`;b.onclick=()=>{cur=i;render();scrollTo(0,0)};tabs.appendChild(b)});
const chips=(a,k)=>a.map(l=>`<a class="chip ${k}" href="${esc(l[0])}" target="_blank" rel="noopener">${esc(l[1])}</a>`).join('');
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 [...tabs.children].forEach((b,i)=>{
  const m=C[i][1].filter(t=>t[0].toLowerCase().includes(q)).length;
  b.querySelector('.n').textContent=m;b.setAttribute('aria-selected',i===cur);
  if(i===cur)b.scrollIntoView({inline:'center',block:'nearest'});
 });
 const m=C[cur][1].filter(t=>t[0].toLowerCase().includes(q));
 document.getElementById('list').innerHTML=m.map(t=>`<section class="topic"><h2>${esc(t[0])}<small>${t[1].length} video${t[2].length?' · '+t[2].length+' PDF':''}</small></h2><div class="chips">${chips(t[1],'v')}${chips(t[2],'p')}</div></section>`).join('');
 document.getElementById('empty').classList.toggle('hidden',m.length>0);
 document.getElementById('meta').textContent=q?`${m.length} topic mile`:`${C[cur][1].length} topics`;
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
