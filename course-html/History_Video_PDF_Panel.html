<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History Video & PDF Panel</title>
<style>
:root{--bg:#f1f4f9;--surface:#fff;--ink:#16213a;--muted:#5d6985;--line:#dde3ee;--brand:#2f46d6;--brand-ink:#fff;--pdf:#0f7a55;--pdf-bg:#e4f5ee;--vid-bg:#e8ecff;--hover:#f5f7fc}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#161e33;--ink:#eaeefa;--muted:#9aa6c4;--line:#27314d;--brand:#7d8cff;--brand-ink:#0e1424;--pdf:#4fd1a1;--pdf-bg:#12332a;--vid-bg:#1f2850;--hover:#1b2540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
h1{margin:0;padding:14px 0 2px;font-size:1.2rem;font-weight:800}
.sub{margin:0 0 4px;color:var(--muted);font-size:.85rem}
.tabs{display:flex}
.tab{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:.95rem;padding:12px 8px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.tab .n{background:var(--bg);border-radius:99px;padding:0 8px;font-size:.78rem}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab[aria-selected=true] .n{background:var(--vid-bg)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{padding:16px 0 48px}
#viewer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
#viewer[hidden]{display:none}
.vt{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 10px;font-weight:700;font-size:.95rem}
.vt .acts{display:flex;gap:6px;flex-shrink:0}
.btn{appearance:none;border:0;font:inherit;font-weight:700;font-size:.82rem;padding:8px 12px;border-radius:9px;cursor:pointer;background:var(--vid-bg);color:var(--brand);text-decoration:none}
video,iframe{display:block;width:100%;border:0;border-radius:10px;background:#000}
video,iframe.yt{aspect-ratio:16/9}
iframe.doc{height:70vh;background:#fff}
#q{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.meta{color:var(--muted);font-size:.83rem;margin:10px 2px 12px}
.list{display:grid;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.row:hover{background:var(--hover)}.row.on{border-color:var(--brand)}
.t{min-width:0;font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.t small{display:block;color:var(--muted);font-weight:600;font-size:.76rem}
.mk{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--vid-bg);color:var(--brand);display:grid;place-items:center;font-size:.7rem}
.mk.p{background:var(--pdf-bg);color:var(--pdf);font-weight:800;font-size:.62rem}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>

const $=id=>document.getElementById(id);
let kind='v',cur=null,hls=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const q=$('q').value.trim().toLowerCase();
 const m=k=>D.map((d,i)=>[d,i]).filter(([d])=>d[0]===k&&(d[1]+' '+d[2]).toLowerCase().includes(q));
 $('tv').firstElementChild.textContent=m('v').length;$('tp').firstElementChild.textContent=m('p').length;
 $('tv').setAttribute('aria-selected',kind==='v');$('tp').setAttribute('aria-selected',kind==='p');
 const rows=m(kind);
 $('list').innerHTML=rows.map(([d,i])=>`<div class="row${cur===i?' on':''}" tabindex="0" data-i="${i}"><div class="t">${d[1]?`<small>${esc(d[1])}</small>`:''}${esc(d[2])}</div><span class="mk ${d[0]}">${d[0]==='v'?'&#9654;':'PDF'}</span></div>`).join('');
 $('empty').hidden=rows.length>0;$('meta').textContent=`${rows.length} ${kind==='v'?'videos':'PDFs'}`;
}
function open_(i){
 const d=D[i];cur=i;$('viewer').hidden=false;$('vt').textContent=(d[1]?d[1]+' | ':'')+d[2];
 if(hls){hls.destroy();hls=null}
 const st=$('stage'),u=d[3],ext=$('ext');ext.hidden=d[0]!=='p';if(d[0]==='p')ext.href=u;
 if(d[0]==='p')st.innerHTML=`<iframe class="doc" src="${esc(u)}" title="PDF"></iframe>`;
 else if(/youtube\.com\/embed|youtu\.be/.test(u))st.innerHTML=`<iframe class="yt" src="${esc(u)}" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe>`;
 else{
  st.innerHTML='<video id="v" controls playsinline autoplay></video>';const v=$('v');
  if(u.includes('.m3u8')&&window.Hls&&Hls.isSupported()){hls=new Hls({capLevelToPlayerSize:true});hls.loadSource(u);hls.attachMedia(v)}
  else v.src=u;
 }
 $('viewer').scrollIntoView({behavior:'smooth',block:'start'});render();
}
$('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)open_(+r.dataset.i)});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
$('tv').onclick=()=>{kind='v';render()};$('tp').onclick=()=>{kind='p';render()};
$('q').addEventListener('input',render);
$('close').onclick=()=>{if(hls){hls.destroy();hls=null}$('stage').innerHTML='';$('viewer').hidden=true;cur=null;render()};
render();
</script>
