html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;line-height:1.5}

.sub{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.95rem;padding:12px 8px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}

.tab .n{background:var(--bg);color:var(--muted);border-radius:99px;padding:0 8px;font-size:.78rem;font-weight:700}
.tab[aria-selected=true] .n{background:var(--vid-bg);color:var(--brand)}
.tab:focus-visible,.btn:focus-visible,#q:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{padding:16px 0 48px}
#q{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.meta{color:var(--muted);font-size:.85rem;margin:10px 2px 12px}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.t{min-width:0}
.t b{display:block;font-weight:600;font-size:.98rem}
.t small{color:var(--muted);font-size:.8rem}
.acts{display:flex;gap:8px;flex-shrink:0}
.btn{text-decoration:none;font-weight:700;font-size:.85rem;padding:9px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px}
.btn.v{background:var(--brand);color:var(--brand-ink)}
.btn.p{background:var(--pdf-bg);color:var(--pdf)}
.btn:hover{filter:brightness(.94)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.hidden{display:none!important}
@media (max-width:560px){.row{flex-direction:column;align-items:stretch}.acts .btn{flex:1;justify-content:center}}
</style>

const D={part1,part2};let cur='part1';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function split(t){const i=t.lastIndexOf(' — ');return i<0?[t,'']:[t.slice(0,i),t.slice(i+3)]}
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const list=document.getElementById('list');
 for(const k of ['part1','part2']){
  const m=D[k].filter(c=>c[0].toLowerCase().includes(q));
  document.getElementById(k==='part1'?'n1':'n2').textContent=m.length;
  if(k!==cur)continue;
  list.innerHTML=m.map(c=>{const [a,b]=split(c[0]);
   return `<div class="row"><div class="t"><b>${esc(a)}</b><small>${esc(b)}</small></div><div class="acts"><a class="btn v" href="${esc(c[1])}" target="_blank" rel="noopener">&#9654; Video</a><a class="btn p" href="${esc(c[2])}" target="_blank" rel="noopener">PDF</a></div></div>`}).join('');
  document.getElementById('empty').classList.toggle('hidden',m.length>0);
  document.getElementById('meta').textContent=q?`${m.length} topic mile`:`Kul ${D[k].length} classes`;
 }
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 cur=b.dataset.k;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));render();scrollTo(0,0)}));
document.getElementById('q').addEventListener('input',render);
render();
</script>
