<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{margin:0;padding:0}
:root{
  --paper:#f5f1ea;--paper-2:#ede7db;--card:#fff;
  --ink:#1a1613;--ink-2:#57534e;--ink-3:#a8a29e;
  --line:#e7e1d5;--line-2:#d5cdbd;
  --accent:#ff5722;--accent-2:#e64a19;--accent-soft:#ffe8dd;
  --green:#15803d;--green-soft:#dcfce7;
  --radius:20px;--radius-sm:12px;
  --shadow-card:0 1px 2px rgba(26,22,19,.04),0 8px 24px -8px rgba(26,22,19,.08);
  --shadow-pop:0 2px 6px rgba(26,22,19,.08),0 24px 60px -16px rgba(26,22,19,.24);
  --container:720px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--paper);color:var(--ink);min-height:100dvh;
  font-size:15px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 5%, rgba(255,87,34,.06), transparent 40%),
    radial-gradient(circle at 85% 95%, rgba(255,152,0,.05), transparent 45%);
  background-attachment:fixed;
  overflow-x:hidden;
}
.serif{font-family:'Fraunces',ui-serif,Georgia,serif;font-optical-sizing:auto}

/* ============ BRAND TOP ============ */
.brand-top{
  max-width:var(--container);margin:0 auto;
  padding:26px 20px 0;
}
.brand-inner{
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);padding-bottom:22px;border-bottom:1px solid var(--line);
}

/* ============ HERO ============ */

/* ============ SEARCH ============ */
.search-shell{padding:10px 20px 0;max-width:var(--container);margin:0 auto}
.search{
  display:flex;align-items:center;gap:12px;padding:4px 4px 4px 20px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-card);transition:all .2s ease;
}
.search:focus-within{border-color:var(--ink-3);box-shadow:0 2px 4px rgba(26,22,19,.05),0 16px 32px -12px rgba(26,22,19,.14)}
.search i{color:var(--ink-3);font-size:13px}
.search input{
  flex:1;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:14px;font-weight:500;color:var(--ink);padding:13px 0;min-width:0;
}
.search input::placeholder{color:var(--ink-3);font-weight:400}

/* ============ SECTION LABEL ============ */
.section-label{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:28px 0 14px;gap:12px;
}
.section-label h2{
  font-family:'Fraunces',serif;font-optical-sizing:auto;font-size:22px;
  font-weight:400;letter-spacing:-.025em;color:var(--ink);line-height:1.15;
}
.section-label .count{
  font-family:ui-monospace,monospace;font-size:11px;font-weight:500;
  color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;flex:none;
}

/* ============ CONTENT ============ */
.content{padding:0 20px 100px;max-width:var(--container);margin:0 auto}

/* Chapter card (vertical list like screenshot) */
.chapter-card{
  display:flex;align-items:center;gap:16px;
  padding:20px 22px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-card);cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  margin-bottom:12px;
  animation:itemIn .4s cubic-bezier(.16,1,.3,1) both;
}
.chapter-card:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(26,22,19,.05),0 16px 32px -12px rgba(26,22,19,.14);
  border-color:var(--line-2);
}
.chapter-card:active{transform:translateY(0)}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.chapter-num{
  font-family:'Fraunces',serif;font-optical-sizing:auto;
  font-style:italic;font-size:34px;font-weight:400;line-height:1;
  color:var(--accent);letter-spacing:-.04em;
  min-width:48px;flex-shrink:0;
}
.chapter-body{flex:1;min-width:0}
.chapter-title{
  font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--ink);
  line-height:1.3;text-transform:uppercase;overflow-wrap:anywhere;
  margin-bottom:3px;
}
.chapter-meta{
  font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.01em;
}
.chapter-arrow{
  flex-shrink:0;width:34px;height:34px;border-radius:50%;
  background:var(--paper);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all .2s ease;
}
.chapter-card:hover .chapter-arrow{
  background:var(--ink);color:var(--paper);
  transform:translateX(3px);
}

/* Back button */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  margin-bottom:18px;
}
.back-btn:hover{background:var(--paper-2);color:var(--ink)}
.back-btn i{font-size:10px}

/* Resource rows (inside a chapter) */
.row{
  display:flex;align-items:center;gap:12px;padding:13px 4px;
  border-bottom:1px dashed rgba(168,162,158,.35);
}
.row:last-child{border-bottom:none}
.row-num{
  font-family:ui-monospace,monospace;font-size:10px;font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;flex:none;min-width:52px;
}
.row-title{
  flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink);
  line-height:1.4;overflow-wrap:anywhere;
}
.row-actions{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.pill-btn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;
  border-radius:8px;background:var(--paper);border:1px solid var(--line);
  font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-2);
  text-decoration:none;transition:all .15s ease;white-space:nowrap;
}
.pill-btn i{font-size:9px}
.pill-btn.play:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.pill-btn.doc:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.empty{padding:60px 20px;text-align:center}
.empty-icon{
  width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:20px;margin-bottom:14px;
}
.empty-title{font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.empty-sub{font-size:13px;color:var(--ink-3)}

/* ============ POPUP ============ */

@media (min-width:768px){
  :root{--container:840px}
  .chapter-title{font-size:16px}
  .row-title{font-size:14.5px}
  .search-shell{padding:14px 32px 0}
  .content{padding:0 32px 120px}
  .brand-top{padding:32px 32px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

/* ================= STATE ================= */
const contentEl = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
let activeChapter = null; // null = chapter list view
let currentSearch = '';

/* ================= HELPERS ================= */
function pad2(n){ return String(n).padStart(2,'0'); }

/* ================= VIEW: CHAPTER LIST ================= */
function renderChapterList(){
  contentEl.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = `<h2>Chapters</h2><span class="count">${RAW_DATA.length} total</span>`;
  contentEl.appendChild(label);

  RAW_DATA.forEach((folder, i) => {
    const card = document.createElement('div');
    card.className = 'chapter-card';
    card.style.animationDelay = (i * 30) + 'ms';
    card.innerHTML = `
      <div class="chapter-num">${pad2(i + 1)}</div>
      <div class="chapter-body">
        <div class="chapter-title">${folder.name}</div>
        <div class="chapter-meta">Chapter · ${folder.items.length} item${folder.items.length === 1 ? '' : 's'}</div>
      </div>
      <div class="chapter-arrow"><i class="fas fa-arrow-right"></i></div>
    `;
    card.addEventListener('click', () => openChapter(folder.key));
    contentEl.appendChild(card);
  });
}

/* ================= VIEW: CHAPTER DETAIL ================= */
function openChapter(key){
  activeChapter = key;
  currentSearch = '';
  searchInput.value = '';
  renderChapterDetail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderChapterDetail(){
  contentEl.innerHTML = '';
  const folder = RAW_DATA.find(f => f.key === activeChapter);
  if (!folder){
    activeChapter = null;
    renderChapterList();
    return;
  }

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.innerHTML = '<i class="fas fa-arrow-left"></i> Back to chapters';
  back.addEventListener('click', () => {
    activeChapter = null;
    renderChapterList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  contentEl.appendChild(back);

  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = `<h2>${folder.name}</h2><span class="count">${folder.items.length} items</span>`;
  contentEl.appendChild(label);

  folder.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    let actions = '';
    if (it.video) actions += `<a class="pill-btn play" href="${it.video}" target="_blank" rel="noopener"><i class="fas fa-play"></i> Watch</a>`;
    if (it.pdf)   actions += `<a class="pill-btn doc" href="${it.pdf}" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> PDF</a>`;
    row.innerHTML = `
      <span class="row-num">${pad2(i + 1)}</span>
      <div class="row-title">${it.title}</div>
      <div class="row-actions">${actions}</div>
    `;
    contentEl.appendChild(row);
  });
}

/* ================= VIEW: SEARCH RESULTS ================= */
function renderSearchResults(q){
  contentEl.innerHTML = '';
  const query = q.toLowerCase();
  const matches = [];
  RAW_DATA.forEach(folder => {
    folder.items.forEach((it, i) => {
      if (it.title.toLowerCase().includes(query) || folder.name.toLowerCase().includes(query)){
        matches.push({ folder, idx: pad2(i + 1), title: it.title, video: it.video, pdf: it.pdf });
      }
    });
  });

  if (matches.length === 0){
    contentEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i class="fas fa-search"></i></div>
        <div class="empty-title">No matches</div>
        <div class="empty-sub">Try a different search term</div>
      </div>`;
    return;
  }

  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = `<h2>Results</h2><span class="count">${matches.length} found</span>`;
  contentEl.appendChild(label);

  matches.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row';
    let actions = '';
    if (m.video) actions += `<a class="pill-btn play" href="${m.video}" target="_blank" rel="noopener"><i class="fas fa-play"></i> Watch</a>`;
    if (m.pdf)   actions += `<a class="pill-btn doc" href="${m.pdf}" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> PDF</a>`;
    row.innerHTML = `
      <span class="row-num">${m.idx}</span>
      <div class="row-title"><strong style="color:var(--accent-2);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:2px;">${m.folder.name}</strong>${m.title}</div>
      <div class="row-actions">${actions}</div>
    `;
    contentEl.appendChild(row);
  });
}

/* ================= SEARCH ================= */
searchInput.addEventListener('input', e => {
  const q = e.target.value.trim();
  currentSearch = q;
  if (!q){
    if (activeChapter) renderChapterDetail();
    else renderChapterList();
  } else {
    renderSearchResults(q);
  }
});

/* ================= INIT ================= */
renderChapterList();

})();
</script>
