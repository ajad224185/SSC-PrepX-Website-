  --border: #ebe4db;
  --ink: #1a1412;
  --ink-muted: #6b5f56;
  --ink-soft: #9a8e84;
  --accent: #e85d2c;
  --accent-dark: #c44a1a;
  --accent-soft: #fff0e8;
  --accent-border: #ffd4bc;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 2px 8px rgba(60,30,10,.06);
  --shadow-md: 0 8px 24px rgba(90,40,10,.09);
  --ease: cubic-bezier(.22,.61,.36,1);

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {

  background:

  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
::selection { background: #ffd4bc; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #e0d5c8; border-radius: 20px; }
::-webkit-scrollbar-thumb:hover { background: #cbb8a8; }

.wrap { max-width: 920px; margin: 0 auto; padding: 0 1rem 3rem; }

.site-header {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(16px) saturate(160%);

  background: rgba(247,244,240,.88);

}
.header-inner { max-width: 920px; margin: 0 auto; padding: 1rem 1rem 1.1rem; }
.brand-row {

}
.brand { display: flex; align-items: center; gap: .7rem; min-width: 0; }
.brand-icon {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(145deg, var(--accent), var(--accent-dark));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1rem;
  box-shadow: 0 6px 16px rgba(196,74,26,.3);
}
.brand-text h1 {
  margin: 0; font-size: 1.15rem; font-weight: 800;
  letter-spacing: -.02em; color: var(--ink); line-height: 1.25;
}
.brand-text p {
  margin: .12rem 0 0; font-size: .78rem; color: var(--ink-muted); font-weight: 500;
}
.stat-pills { display: flex; gap: .45rem; flex: none; }
.pill {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: .32rem .7rem; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow); min-width: 54px;
}
.pill b { font-size: .95rem; color: var(--accent-dark); line-height: 1.1; }
.pill span {
  font-size: .6rem; color: var(--ink-soft); font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}

.search-row { display: flex; gap: .5rem; align-items: center; }
.search-box { position: relative; flex: 1; min-width: 0; }
.search-box svg.icon-search {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--ink-soft); pointer-events: none;
}
.search-box input {
  width: 100%; padding: .72rem 2.5rem .72rem 2.55rem;
  font-size: .94rem; font-weight: 500; border-radius: 14px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--ink); box-shadow: var(--shadow); outline: none;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.search-box input::placeholder { color: var(--ink-soft); font-weight: 500; }
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(232,93,44,.12), var(--shadow);
}
.clear-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; border: none;
  background: var(--accent-soft); color: var(--accent-dark);
  display: none; align-items: center; justify-content: center; cursor: pointer;
}
.clear-btn svg { width: 14px; height: 14px; }
.clear-btn.show { display: flex; }
.clear-btn:hover { background: var(--accent-border); }

.icon-btn-group { display: flex; gap: .4rem; flex: none; }
.icon-btn {
  display: flex; align-items: center; justify-content: center; gap: .3rem;
  padding: 0 .75rem; height: 44px; border-radius: 14px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--ink-muted); font-weight: 700; font-size: .8rem;
  cursor: pointer; white-space: nowrap; box-shadow: var(--shadow);
  transition: transform .12s var(--ease), box-shadow .12s, border-color .12s;
}
.icon-btn svg { width: 16px; height: 16px; flex: none; }
.icon-btn:hover {
  transform: translateY(-1px); box-shadow: var(--shadow-md);
  border-color: var(--accent-border);
}
.icon-btn:active { transform: translateY(0); }
.icon-btn .label { display: inline; }

.breadcrumb {
  display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
  font-size: .78rem; color: var(--ink-soft); font-weight: 600;
  margin-top: .65rem; min-height: 1.1rem;
}
.breadcrumb .crumb { color: var(--accent-dark); cursor: pointer; }
.breadcrumb .crumb:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--ink-soft); }

.folder-grid {
  display: flex; flex-direction: column; gap: .75rem;
  margin-top: 1.35rem; counter-reset: chap;
}
.folder-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, var(--shadow);
  overflow: hidden; animation: fadeIn .3s var(--ease) both;
  transition: box-shadow .18s var(--ease), border-color .18s;
  counter-increment: chap;
}
.folder-card:hover { box-shadow: var(--shadow-md); border-color: #e5d3c2; }
.folder-card.open { border-color: #e5d3c2; box-shadow: var(--shadow-md); }
.folder-card.hidden-card { display: none; }

.folder-header {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 1rem;
  padding: 1.1rem 1.15rem; cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.folder-header:hover { background: #fffaf5; }

.folder-num {
  flex: none; font-family: Georgia, 'Times New Roman', serif;
  font-style: italic; font-weight: 400; font-size: 1.9rem;
  line-height: 1; color: var(--accent); letter-spacing: -.03em;
  min-width: 2.4rem;
}
.folder-title-block { flex: 1; min-width: 0; }
.folder-title {
  margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--ink);
  letter-spacing: -.01em; line-height: 1.3;
  overflow-wrap: anywhere; word-break: break-word;
}
.folder-title mark { background: #ffe27a; color: inherit; border-radius: 3px; padding: 0 1px; }
.folder-sub {
  margin: .28rem 0 0; font-size: .85rem; font-weight: 500; color: var(--ink-soft);
}
.folder-meta { display: flex; align-items: center; gap: 0; flex: none; }
.chevron {
  box-sizing: content-box; width: 18px; height: 18px; padding: 11px;
  border-radius: 50%; background: #f2ece5; color: var(--ink);
  transition: all .25s var(--ease);
}
.folder-header:hover .chevron,
.folder-card.open .chevron { background: var(--ink); color: #fff; }

.folder-body { max-height: 0; overflow: hidden; transition: max-height .32s var(--ease); }
.folder-body-inner { padding: 0 1.15rem 1rem; border-top: 1px solid var(--border); }
.file-list { display: flex; flex-direction: column; gap: .4rem; padding-top: .8rem; }

.file-item {
  display: flex; align-items: flex-start; gap: .65rem;
  padding: .6rem .65rem; border-radius: var(--radius-sm);
  background: var(--surface-soft); border: 1px solid transparent;
  animation: slideDown .25s var(--ease) both; flex-wrap: wrap;
  transition: transform .14s var(--ease), box-shadow .14s, border-color .14s, background .14s;
}
.file-item:hover {
  transform: translateY(-1px); box-shadow: var(--shadow);
  border-color: var(--accent-border); background: var(--surface);
}
.file-name-block { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: .25rem; }
.file-name {
  font-size: .84rem; font-weight: 600; color: var(--ink-muted);
  overflow-wrap: anywhere; word-break: break-word; line-height: 1.35;

.file-name mark { background: #ffe27a; color: inherit; border-radius: 3px; padding: 0 1px; }
.quality-badge {
  display: inline-flex; width: fit-content; font-size: .62rem; font-weight: 800;
  letter-spacing: .03em; text-transform: uppercase; padding: .14rem .45rem;
  border-radius: 20px; background: #f5ebe0; color: #8a6540; border: 1px solid #e8d5c0;

.file-actions { display: flex; gap: .35rem; flex: none; flex-wrap: wrap; }
.open-btn {

  padding: .38rem .7rem; border-radius: 10px;

.open-btn svg { width: 12px; height: 12px; }
.open-btn.video { color: #1f6fe0; }
.open-btn.video:hover {
  background: linear-gradient(135deg, #4d9bff, #1f6fe0);
  color: #fff; border-color: transparent; transform: translateY(-1px);
}
.open-btn.pdf { color: #e0473e; }
.open-btn.pdf:hover {
  background: linear-gradient(135deg, #ff6b61, #e0473e);
  color: #fff; border-color: transparent; transform: translateY(-1px);
}

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 3.5rem 1rem; text-align: center; color: var(--ink-soft);
  animation: fadeIn .3s var(--ease) both;
}
.empty-state svg { width: 56px; height: 56px; color: #e0d5c8; margin-bottom: 1rem; }
.empty-state h3 { margin: 0 0 .35rem; color: var(--ink); font-size: 1.05rem; }
.empty-state p { margin: 0; font-size: .85rem; max-width: 300px; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-5px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
@media (max-width: 640px) {
  .brand-text h1 { font-size: 1rem; }
  .brand-text p { display: none; }
  .stat-pills { display: none; }
  .icon-btn .label { display: none; }
  .icon-btn { padding: 0 .6rem; width: 44px; }
  .folder-title { font-size: .95rem; }
  .file-name { font-size: .8rem; }
  .wrap { padding: 0 .7rem 2.5rem; }
  .header-inner { padding: .85rem .7rem .95rem; }
  .folder-num { font-size: 1.65rem; min-width: 2rem; }
  .file-item { flex-direction: column; align-items: stretch; }
  .file-actions { justify-content: flex-start; }
}
</style>
</head>

  pdf: '<svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7.5L19 8v11.5A1.5 1.5 0 0 1 17.5 21h-10A1.5 1.5 0 0 1 6 19.5v-14A1.5 1.5 0 0 1 7 3.5Z" fill="currentColor"/></svg>',

const folderGridEl = document.getElementById('folderGrid');
const searchInputEl = document.getElementById('searchInput');
const clearBtnEl = document.getElementById('clearBtn');
const expandAllBtnEl = document.getElementById('expandAllBtn');
const collapseAllBtnEl = document.getElementById('collapseAllBtn');
const statFoldersEl = document.getElementById('statFolders');
const statFilesEl = document.getElementById('statFiles');
const breadcrumbEl = document.getElementById('breadcrumb');

const folders = rawData.map(function(folder, folderIndex) {
  const items = folder.items.map(function(item, itemIndex) {
    return {
      id: folderIndex + '-' + itemIndex,
      title: item.title,
      lower: item.title.toLowerCase(),
      quality: item.quality || '',
      video: item.video || null,
      pdfs: item.pdfs || []
    };
  });
  return {
    index: folderIndex,
    name: folder.name,
    lower: folder.name.toLowerCase(),
    items: items,
    itemCount: items.length,
    open: false,
    bodyEl: null,
    listEl: null,
    cardEl: null,
    built: false,
    titleEl: null,
    subEl: null
  };
});

statFoldersEl.textContent = folders.length;
statFilesEl.textContent = folders.reduce(function(s, f) { return s + f.itemCount; }, 0);

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlight(text, query) {
  const safe = escapeHTML(text);
  if (!query) return safe;
  const lowerText = text.toLowerCase();
  const idx = lowerText.indexOf(query);
  if (idx === -1) return safe;
  return escapeHTML(text.slice(0, idx)) + '<mark>' + escapeHTML(text.slice(idx, idx + query.length)) + '</mark>' + escapeHTML(text.slice(idx + query.length));
}

function createFileItemEl(item, query) {
  const el = document.createElement('div');
  el.className = 'file-item';

  const nameBlock = document.createElement('div');
  nameBlock.className = 'file-name-block';
  const name = document.createElement('div');
  name.className = 'file-name';
  name.innerHTML = highlight(item.title, query);
  name.title = item.title;
  nameBlock.appendChild(name);
  if (item.quality) {
    const badge = document.createElement('span');
    badge.className = 'quality-badge';
    badge.textContent = item.quality;
    nameBlock.appendChild(badge);
  }
  el.appendChild(nameBlock);

  const actions = document.createElement('div');
  actions.className = 'file-actions';
  if (item.video) {
    const a = document.createElement('a');
    a.className = 'open-btn video';
    a.href = item.video; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = ICONS.video + '<span>Video</span>';
    actions.appendChild(a);
  }
  if (item.pdfs && item.pdfs.length) {
    item.pdfs.forEach(function(p) {
      if (!p.url) return;
      const a = document.createElement('a');
      a.className = 'open-btn pdf';
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = ICONS.pdf + '<span>' + escapeHTML(p.label || 'PDF') + '</span>';
      actions.appendChild(a);
    });
  }
  el.appendChild(actions);
  return el;
}

function populateFileList(folder, query, subsetItems) {
  const items = subsetItems || folder.items;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < items.length; i++) {
    frag.appendChild(createFileItemEl(items[i], query));
  }
  folder.listEl.innerHTML = '';
  folder.listEl.appendChild(frag);
  folder.built = true;
}

function setFolderOpen(folder, open, query, subsetItems) {
  folder.open = open;
  if (open) {
    if (!folder.built || query !== undefined) {
      populateFileList(folder, query, subsetItems);
    }
    folder.cardEl.classList.add('open');
    folder.bodyEl.style.maxHeight = folder.bodyEl.scrollHeight + 'px';
  } else {
    folder.cardEl.classList.remove('open');
    folder.bodyEl.style.maxHeight = '0px';
  }
}

function toggleFolder(folder) {
  setFolderOpen(folder, !folder.open);
}

function createFolderCardEl(folder) {
  const card = document.createElement('div');
  card.className = 'folder-card';
  card.style.animationDelay = (Math.min(folder.index, 20) * 18) + 'ms';

  const header = document.createElement('div');
  header.className = 'folder-header';
  header.setAttribute('role', 'button');
  header.setAttribute('tabindex', '0');

  const num = document.createElement('div');
  num.className = 'folder-num';
  num.textContent = String(folder.index + 1).padStart(2, '0');

  const titleBlock = document.createElement('div');
  titleBlock.className = 'folder-title-block';
  const titleEl = document.createElement('h3');
  titleEl.className = 'folder-title';
  titleEl.textContent = folder.name;
  const subEl = document.createElement('p');
  subEl.className = 'folder-sub';
  subEl.textContent = folder.itemCount + (folder.itemCount === 1 ? ' item' : ' items');
  titleBlock.appendChild(titleEl);
  titleBlock.appendChild(subEl);

  const meta = document.createElement('div');
  meta.className = 'folder-meta';
  const chevron = document.createElement('span');
  chevron.className = 'chevron';
  chevron.innerHTML = ICONS.chevron;
  meta.appendChild(chevron);

  header.appendChild(num);
  header.appendChild(titleBlock);
  header.appendChild(meta);

  const body = document.createElement('div');
  body.className = 'folder-body';
  const bodyInner = document.createElement('div');
  bodyInner.className = 'folder-body-inner';
  const list = document.createElement('div');
  list.className = 'file-list';
  bodyInner.appendChild(list);
  body.appendChild(bodyInner);

  card.appendChild(header);
  card.appendChild(body);

  folder.cardEl = card;
  folder.bodyEl = body;
  folder.listEl = list;
  folder.titleEl = titleEl;
  folder.subEl = subEl;

  header.addEventListener('click', function() { toggleFolder(folder); });
  header.addEventListener('keydown', function(evt) {
    if (evt.key === 'Enter' || evt.key === ' ') {
      evt.preventDefault();
      toggleFolder(folder);
    }
  });

  return card;
}

function renderAllFolderShells() {
  const frag = document.createDocumentFragment();
  folders.forEach(function(folder) {
    folder.cardEl = null; folder.bodyEl = null; folder.listEl = null;
    folder.built = false; folder.open = false; folder.titleEl = null; folder.subEl = null;
    frag.appendChild(createFolderCardEl(folder));
  });
  folderGridEl.innerHTML = '';
  folderGridEl.appendChild(frag);
  updateBreadcrumb('');
}

function updateBreadcrumb(query) {
  if (!query) {
    breadcrumbEl.innerHTML = '<span class="crumb" id="crumbHome">All Sections</span>';
    return;
  }
  breadcrumbEl.innerHTML =
    '<span class="crumb" id="crumbHome">All Sections</span><span class="sep">›</span><span>Results for “' +
    escapeHTML(query) + '”</span>';
  const home = document.getElementById('crumbHome');
  if (home) home.addEventListener('click', clearSearch);
}

function renderEmptyState() {
  folderGridEl.innerHTML =
    '<div class="empty-state">' + ICONS.emptyBox +
    '<h3>No results found</h3>' +
    '<p>No section or lecture matched your search. Try a different keyword.</p>' +
    '</div>';
}

function applySearch(rawQuery) {
  const query = rawQuery.trim().toLowerCase();
  clearBtnEl.classList.toggle('show', rawQuery.length > 0);
  updateBreadcrumb(query);

  if (!query) {
    renderAllFolderShells();
    return;
  }

  let visible = 0;
  const frag = document.createDocumentFragment();

  folders.forEach(function(folder) {
    folder.cardEl = null; folder.bodyEl = null; folder.listEl = null;
    folder.built = false; folder.open = false; folder.titleEl = null; folder.subEl = null;

    const nameMatches = folder.lower.indexOf(query) !== -1;
    const matchedItems = nameMatches
      ? folder.items
      : folder.items.filter(function(it) { return it.lower.indexOf(query) !== -1; });

    if (matchedItems.length === 0) return;

    visible++;
    const card = createFolderCardEl(folder);
    folder.titleEl.innerHTML = highlight(folder.name, nameMatches ? query : '');
    folder.subEl.textContent = matchedItems.length + (matchedItems.length === 1 ? ' match' : ' matches');
    frag.appendChild(card);
    setFolderOpen(folder, true, query, matchedItems);
  });

  folderGridEl.innerHTML = '';
  if (visible === 0) {
    renderEmptyState();
    return;
  }
  folderGridEl.appendChild(frag);
}

let debounce = null;
function handleSearchInput() {
  const value = searchInputEl.value;
  clearBtnEl.classList.toggle('show', value.length > 0);
  if (debounce) clearTimeout(debounce);
  debounce = setTimeout(function() { applySearch(value); }, 90);
}

function clearSearch() {
  searchInputEl.value = '';
  clearBtnEl.classList.remove('show');
  applySearch('');
  searchInputEl.focus();
}

function expandAll() {
  folders.forEach(function(f) { if (f.cardEl) setFolderOpen(f, true); });
}
function collapseAll() {
  folders.forEach(function(f) { if (f.cardEl) setFolderOpen(f, false); });
}

searchInputEl.addEventListener('input', handleSearchInput);
clearBtnEl.addEventListener('click', clearSearch);
expandAllBtnEl.addEventListener('click', expandAll);
collapseAllBtnEl.addEventListener('click', collapseAll);

let resizeRaf = null;
window.addEventListener('resize', function() {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(function() {
    folders.forEach(function(f) {
      if (f.open && f.bodyEl) f.bodyEl.style.maxHeight = f.bodyEl.scrollHeight + 'px';
    });
  });
});

renderAllFolderShells();
})();
