an style=\"font-family:'Mangal'\">शर्तें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) यदि पहला अवयव एक प्रतीक है और अंतिम अवयव एक संख्या है, तो पहले और अंतिम अवयवों के कूट आपस में बदल दिए जाएँगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) यदि पहला अवयव एक विषम संख्या है और अंतिम अवयव एक सम संख्या है, तो पहले और अंतिम दोनों अवयवों को X से कूटबद्ध किया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) यदि दूसरा और तीसरा दोनों अवयव सम संख्याएँ हैं, तो दूसरे और तीसरे अवयवों के कूट आपस में बदल दिए जाएँगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूह 7248 का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MBKP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XKBX</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XBKX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PBKM</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूह: 7 2 4 8. तालिका से सीधे कूट: 7 = M, 2 = B, 4 = K, 8 = P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शर्त (i): पहला अवयव 7 एक संख्या है, प्रतीक नहीं → लागू </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शर्त (ii): पहला अवयव 7 विषम है और अंतिम अवयव 8 सम है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">लागू</span><span style=\"font-family:'Mangal'\"> होती है: 7 और 8 दोनों का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शर्त (iii): दूसरा अवयव 2 और तीसरा अवयव 4 दोनों सम हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">लागू</span><span style=\"font-family:'Mangal'\"> होती है: इनके कूट B और K आपस में बदलेंगे → 2 का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> और 4 का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\"> होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कूट: X K B X → </span><span style=\"font-weight:bold;font-family:'Mangal'\">XKBX</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(MBKP में शर्तें छोड़ दी गई हैं; XBKX में शर्त (iii) छूट गई है; PBKM में शर्त (i) गलत लगाई गई है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">XKBX (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति A, B, C, D, E, F, G और H एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। A के बाईं ओर से गिनने पर A और B के बीच केवल दो व्यक्ति बैठे हैं। G, A के ठीक बाईं ओर बैठा है। E के बाईं ओर से गिनने पर E और G के बीच केवल तीन व्यक्ति बैठे हैं। C, D के ठीक दाईं ओर बैठा है। F, G का निकटतम पड़ोसी नहीं है। H के दाईं ओर दूसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख केंद्र की ओर है, अतः ‘बाएँ’ = दक्षिणावर्त (clockwise) और ‘दाएँ’ = वामावर्त (anticlockwise)। सीटों को दाईं ओर (वामावर्त) 1 से 8 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">A सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, A के ठीक बाईं ओर → G = 1 − 1 = 0 → 0 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A के बाईं ओर से गिनने पर A और B के बीच दो व्यक्ति → B, A के बाईं ओर तीसरे स्थान पर → B = 1 − 3 = −2 → −2 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E के बाईं ओर से गिनने पर E और G के बीच तीन व्यक्ति → G, E के बाईं ओर चौथे स्थान पर → E = 8 + 4 = 12 → 12 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, D के ठीक दाईं ओर → D और C को 2, 3, 5, 7 में से दो क्रमागत खाली सीटें चाहिए → केवल (2, 3) संभव → </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 2, C = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीट 5 और 7, F और H के लिए बचती हैं। G (सीट 8) के पड़ोसी सीट 7 और 1 हैं, और F, G का पड़ोसी नहीं है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब बची हुई सीट 7 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 8): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A – D – C – E – F – B – H – G</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H के दाईं ओर दूसरा: 7 + 2 = 9 → 9 − 8 = 1 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर PURE, URWB से एक निश्चित प्रकार से संबंधित है। उसी प्रकार RING, WFSD से संबंधित है। उसी तर्क के अनुसार SOUL दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZIL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NLPI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XLZI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPIL</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PURE → URWB: P + 5 = U, U − 3 = R, R + 5 = W, E − 3 = B → पैटर्न (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+5, −3, +5, −3</span><span style=\"font-family:'Mangal'\">) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RING → WFSD: R + 5 = W, I − 3 = F, N + 5 = S, G − 3 = D ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SOUL → S + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, O − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, U + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">, L − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\"> → XLZI</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य जाँचें: XZIL में अक्षर सही हैं पर क्रम गलत है; NLPI में +5 के स्थान पर −5 लिया गया है; NPIL किसी नियम में नहीं बैठता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः SOUL, </span><span style=\"font-weight:bold;font-family:'Mangal'\">XLZI (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, D, J, M, R और W एक ही इमारत की छह अलग-अलग मंज़िलों पर रहते हैं। इमारत की सबसे निचली मंज़िल की संख्या 1 है, उसके ऊपर वाली की संख्या 2 है, और इसी प्रकार सबसे ऊपर वाली मंज़िल की संख्या 6 है। M एक विषम संख्या वाली मंज़िल पर रहता है, परंतु मंज़िल 1 पर नहीं। M और R की मंज़िलों की संख्याओं का योग 9 है। D और W की मंज़िलों की संख्याओं का योग 3 है। D, W से ऊपर की मंज़िल पर रहता है। J और M के बीच केवल एक व्यक्ति रहता है। B, J के ठीक नीचे रहता है। B और R की मंज़िलों की संख्याओं का योग क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंज़िलों को 1 (सबसे नीचे) से 6 (सबसे ऊपर) तक क्रमांक दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D + W = 3 → D और W मंज़िल 1 और 2 पर हैं; D, W से ऊपर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">W = 1, D = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, 1 के अतिरिक्त किसी विषम मंज़िल पर है → M = 3 या 5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M + R = 9 → यदि M = 3, तो R = 6; यदि M = 5, तो R = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J और M के बीच केवल एक व्यक्ति → J = M + 2 या M − 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति M = 5, R = 4: J = 3 (7 नहीं है); B, J के ठीक नीचे → B = 2, परंतु मंज़िल 2 पर D है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति M = 3, R = 6: J = 5 (मंज़िल 1 पर W है); B, J के ठीक नीचे → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 4</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम (मंज़िल 1 → 6): </span><span style=\"font-weight:bold;font-family:'Mangal'\">W, D, M, B, J, R</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और R की मंज़िलों का योग = 4 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः योग </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LUD : # :: % : WRK</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = PRI, % = AOP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = PRI, % = SUF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = PQI, % = SUF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = HXY, % = SUF</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समूह से दूसरे समूह तक का परिवर्तन दोनों युग्मों में समान होना चाहिए। प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: LUD → PRI = (+4, −3, +5); AOP → WRK: A − 4 = W, O + 3 = R, P − 5 = K → (−4, +3, −5) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: LUD → PRI: L + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, U − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, D + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\"> → (+4, −3, +5); SUF → WRK: S + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">, U − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, F + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> → (+4, −3, +5) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: LUD → PQI = (+4, </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span><span style=\"font-family:'Mangal'\">, +5); SUF → WRK = (+4, −3, +5) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: LUD → HXY = (−4, +3, −5); SUF → WRK = (+4, −3, +5) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = PRI, % = SUF (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कूट भाषा में 'ONE' को 9 और 'FOUR' को 16 लिखा जाता है। उसी भाषा में 'FIFTEEN' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक शब्द के अक्षर गिनें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ONE में </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → 3 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FOUR में </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → 4 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span><span style=\"font-family:'Mangal'\"> ✓ → नियम: कूट = (अक्षरों की संख्या) × (अक्षरों की संख्या)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIFTEEN में </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> अक्षर हैं (F, I, F, T, E, E, N) → 7 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(36 = 6 × 6 के लिए 6 अक्षरों का शब्द चाहिए; 18 और 24 नियम में नहीं बैठते।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'FIFTEEN' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B का अर्थ है कि ‘A, B का पिता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B का अर्थ है कि ‘A, B की पत्नी है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B का अर्थ है कि ‘A, B का भाई है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B का अर्थ है कि ‘A, B का पुत्र है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘M &amp; N @ O # P % Q’ है, तो M का Q से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी के पिता का भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री के पति के पिता का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी का पिता</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: M &amp; N @ O # P % Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M &amp; N → M, N का भाई है। M और N भाई-बहन हैं, अतः उनके माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N @ O → N, O का पिता है। इसलिए M, O के पिता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O # P → O, P की पत्नी है, अर्थात् O और P पति-पत्नी हैं। इसलिए M, P की पत्नी के पिता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P % Q → P, Q का पुत्र है। इसलिए M, Q के पुत्र की पत्नी के पिता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः M, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q के पुत्र की पत्नी के पिता का भाई (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति P, Q, R, S, T, U और V एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं। S के दाईं ओर केवल दो व्यक्ति बैठे हैं। S और U के बीच केवल तीन व्यक्ति बैठे हैं। U और V के बीच केवल एक व्यक्ति बैठा है। V, R के ठीक बाईं ओर बैठा है। T, Q के दाईं ओर कहीं बैठा है, परंतु P के बाईं ओर कहीं बैठा है। T के बाईं ओर कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 7 तक क्रमांकित करते हैं। सभी उत्तर दिशा की ओर मुख करके बैठे हैं, इसलिए बायाँ और दायाँ सामान्य रूप से ही लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S के दाईं ओर केवल दो व्यक्ति → S = 7 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और U के बीच केवल तीन व्यक्ति → U = 5 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> (5 + 4 = 9 कोई सीट नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U और V के बीच केवल एक व्यक्ति → V = 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V, R के ठीक बाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब सीट 2, 6 और 7 बची हैं। T, Q के दाईं ओर और P के बाईं ओर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 2, T = 6, P = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">U – Q – V – R – S – T – P</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T (सीट 6) के बाईं ओर: U, Q, V, R, S → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँच</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँच (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ पेन पेंसिल हैं। सभी पेंसिल रबड़ हैं। कोई रबड़ शार्पनर नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ पेन शार्पनर नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ रबड़ पेन हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ पेन पेंसिल हैं → पेन के वृत्त का एक भाग पेंसिल के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी पेंसिल रबड़ हैं → पेंसिल का वृत्त पूरी तरह रबड़ के वृत्त के अंदर है, अतः वे पेन रबड़ भी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई रबड़ शार्पनर नहीं है → रबड़ का वृत्त शार्पनर के वृत्त से पूरी तरह बाहर है, अतः वे पेन शार्पनर नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ पेन शार्पनर नहीं हैं → जो पेन पेंसिल हैं, वे रबड़ हैं और शार्पनर नहीं हो सकते → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ रबड़ पेन हैं → वही पेन रबड़ हैं, अतः कुछ रबड़ पेन हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DK - GC</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LS - OL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PW - SO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HB - KT</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DK − GC: D + 3 = G, K − 8 = C → (+3, −8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PW − SO: P + 3 = S, W − 8 = O → (+3, −8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HB − KT: H + 3 = K, B − 8 = T (2 − 8 = −6 → 26 − 6 = 20 = T) → (+3, −8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LS − OL: L + 3 = O, S − 7 = L → (+3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">−7</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (+3, −8) का पालन करते हैं; केवल LS − OL नहीं (S − 8 = K होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">LS - OL (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत का सबसे लंबा रेल-सह-सड़क पुल बोगीबील पुल, जो असम के डिब्रूगढ़ और धेमाजी ज़िलों को जोड़ता है, किस नदी पर बना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बराक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीस्ता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबनसिरी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रह्मपुत्र</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बोगीबील पुल</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">असम</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रह्मपुत्र</span><span style=\"font-family:'Mangal'\"> नदी पर बना </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.94 km</span><span style=\"font-family:'Mangal'\"> लंबा दो-मंज़िला रेल-सह-सड़क पुल है, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">डिब्रूगढ़</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">धेमाजी</span><span style=\"font-family:'Mangal'\"> ज़िलों को जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 दिसंबर 2018</span><span style=\"font-family:'Mangal'\"> को इसका उद्घाटन किया; यह भारत का सबसे लंबा रेल-सह-सड़क पुल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बराक</span><span style=\"font-family:'Mangal'\"> नदी दक्षिणी in-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योकोसुका</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डार्विन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुआम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मालाबार अभ्यास 2025</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 से 18 नवंबर 2025</span><span style=\"font-family:'Mangal'\"> तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुआम</span><span style=\"font-family:'Mangal'\"> और उसके आसपास के समुद्र में आयोजित हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑस्ट्रेलिया, भारत, जापान और अमेरिका</span><span style=\"font-family:'Mangal'\"> की नौसेनाओं ने भाग लिया; भारत का प्रतिनिधित्व स्वदेशी रूप से डिज़ाइन और निर्मित </span><span style=\"font-weight:bold;font-family:'Mangal'\">शिवालिक-श्रेणी</span><span style=\"font-family:'Mangal'\"> के गाइडेड-मिसाइल स्टेल्थ फ्रिगेट </span><span style=\"font-weight:bold;font-family:'Mangal'\">INS सह्याद्रि</span><span style=\"font-family:'Mangal'\"> ने किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह इसका </span><span style=\"font-weight:bold;font-family:'Mangal'\">29वाँ</span><span style=\"font-family:'Mangal'\"> संस्करण था; मालाबार की शुरुआत </span><span style=\"font-weight:bold;font-family:'Mangal'\">1992</span><span style=\"font-family:'Mangal'\"> में भारत-अमेरिका द्विपक्षीय अभ्यास के रूप में हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभ्यास में बंदरगाह चरण और समुद्री चरण थे, जिनमें पनडुब्बी-रोधी युद्ध, तोपखाना अभ्यास और उड़ान संचालन शामिल थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुआम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 सितंबर 2026 को केंद्रीय मंत्रिमंडल ने अनिवार्य कवरेज के लिए EPFO वेतन सीमा को ₹15,000 प्रति माह से बढ़ाकर कितना करने को मंज़ूरी दी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,000 प्रति माह</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹21,000 प्रति माह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹30,000 प्रति माह</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹25,000 प्रति माह</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> की अध्यक्षता में केंद्रीय मंत्रिमंडल ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 सितंबर 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">EPFO वेतन सीमा</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span><span style=\"font-family:'Mangal'\"> से बढ़ाकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹25,000 प्रति माह</span><span style=\"font-family:'Mangal'\"> करने को मंज़ूरी दी, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 सितंबर 2026</span><span style=\"font-family:'Mangal'\"> से प्रभावी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह सीमा पिछली बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">सितंबर 2014</span><span style=\"font-family:'Mangal'\"> में संशोधित हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्मचारी भविष्य निधि (EPF)</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्मचारी पेंशन योजना (EPS)</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्मचारी जमा सहबद्ध बीमा योजना (EDLI)</span><span style=\"font-family:'Mangal'\"> पर लागू है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">51 लाख</span><span style=\"font-family:'Mangal'\"> से अधिक अतिरिक्त कर्मचारी अनिवार्य EPFO कवरेज में आएँगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरकार का वार्षिक व्यय </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹10,250 करोड़</span><span style=\"font-family:'Mangal'\"> से बढ़कर </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹11,339 करोड़</span><span style=\"font-family:'Mangal'\"> हो जाएगा, जो पाँच वर्षों में अनुमानित </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹56,696 करोड़</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नई सीमा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹25,000 प्रति माह (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपन्यास \"फ़्लेश\" (Flesh) के लिए बुकर पुरस्कार 2025 किसने जीता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किरण देसाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एंड्रयू मिलर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डेविड सलाय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूज़न चोई</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">डेविड सलाय</span><span style=\"font-family:'Mangal'\"> ने अपने उपन्यास </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"फ़्लेश\" (Flesh)</span><span style=\"font-family:'Mangal'\"> के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">बुकर पुरस्कार 2025</span><span style=\"font-family:'Mangal'\"> जीता; इसकी घोषणा </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 नवंबर 2025</span><span style=\"font-family:'Mangal'\"> को लंदन के ओल्ड बिलिंग्सगेट में हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे यह पुरस्कार जीतने वाले पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">हंगेरियाई-ब्रिटिश</span><span style=\"font-family:'Mangal'\"> लेखक हैं, जिसकी राशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">£50,000</span><span style=\"font-family:'Mangal'\"> है; इससे पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">2016</span><span style=\"font-family:'Mangal'\"> में वे \"ऑल दैट मैन इज़\" के लिए शॉर्टलिस्ट हुए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">किरण देसाई</span><span style=\"font-family:'Mangal'\"> (\"द लोनलीनेस ऑफ़ सोनिया एंड सनी\"), </span><span style=\"font-weight:bold;font-family:'Mangal'\">एंड्रयू मिलर</span><span style=\"font-family:'Mangal'\"> (\"द लैंड इन विंटर\") और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूज़न चोई</span><span style=\"font-family:'Mangal'\"> (\"फ़्लैशलाइट\") भी छह पुस्तकों की शॉर्टलिस्ट में थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विजेता </span><span style=\"font-weight:bold;font-family:'Mangal'\">डेविड सलाय (विकल्प C)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कौन-सी अंतरराष्ट्रीय संधि, जिस पर 1987 में सहमति बनी, ओज़ोन परत का क्षरण करने वाले पदार्थों के उत्पादन और उपभोग को चरणबद्ध रूप से समाप्त करके ओज़ोन परत की रक्षा करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मॉन्ट्रियल प्रोटोकॉल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्योटो प्रोटोकॉल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेरिस समझौता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेसल अभिसमय</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन परत का क्षरण करने वाले पदार्थों पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मॉन्ट्रियल प्रोटोकॉल</span><span style=\"font-family:'Mangal'\"> पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 सितंबर 1987</span><span style=\"font-family:'Mangal'\"> को सहमति बनी और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">1989</span><span style=\"font-family:'Mangal'\"> में लागू हुआ; यह ओज़ोन-क्षयकारी रसायनों के उत्पादन और उपभोग को चरणबद्ध रूप से समाप्त करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसका </span><span style=\"font-weight:bold;font-family:'Mangal'\">किगाली संशोधन (2016)</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोफ्लोरोकार्बन (HFCs)</span><span style=\"font-family:'Mangal'\"> को चरणबद्ध रूप से घटाता है, जो ओज़ोन का क्षरण नहीं करते पर प्रबल ग्रीनहाउस गैसें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्योटो प्रोटोकॉल (1997)</span><span style=\"font-family:'Mangal'\"> ने ग्रीनहाउस गैस उत्सर्जन के बाध्यकारी लक्ष्य तय किए, </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेरिस समझौते (2015)</span><span style=\"font-family:'Mangal'\"> का लक्ष्य तापवृद्धि को </span><span style=\"font-weight:bold;font-family:'Mangal'\">2°C</span><span style=\"font-family:'Mangal'\"> से काफ़ी नीचे रखना है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेसल अभिसमय (1989)</span><span style=\"font-family:'Mangal'\"> खतरनाक अपशिष्टों की सीमा-पार आवाजाही को नियंत्रित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संधि </span><span style=\"font-weight:bold;font-family:'Mangal'\">मॉन्ट्रियल प्रोटोकॉल (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मीनार के पाद से एक पहाड़ी की चोटी का उन्नयन कोण 60° है, और मीनार के शिखर से पहाड़ी के पाद का अवनमन कोण 30° है। यदि मीनार 45 m ऊँची है, तो पहाड़ी मीनार से कितनी अधिक ऊँची है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">135 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीनार 45 m ऊँची है; मीनार के पाद और पहाड़ी के पाद के बीच क्षैतिज दूरी d m लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीनार के शिखर से (पहाड़ी के पाद का अवनमन कोण 30°): tan 30° = 45 / d</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 45 / (1/√3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीनार के पाद से (पहाड़ी की चोटी का उन्नयन कोण 60°): tan 60° = H / d</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H = d × √3 = 45√3 × √3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">135 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहाड़ी की ऊँचाई − मीनार की ऊँचाई = 135 − 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: H = h × (tan 60° / tan 30°)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 45 × 3 = 135</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H − h = 2h = 90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पहाड़ी मीनार से </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 m (विकल्प C)</span><span style=\"font-family:'Mangal'\"> अधिक ऊँची है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O एक वृत्त का केंद्र है। एक बाह्य बिंदु R से वृत्त पर दो स्पर्श रेखाएँ RP और RQ खींची जाती हैं, जो वृत्त को P और Q पर स्पर्श करती हैं। यदि ∠PRQ = 52° है, तो ∠OPQ ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">38°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52°</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है: RP और RQ, P और Q पर स्पर्श रेखाएँ हैं, और ∠PRQ = 52° है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पर्श बिंदु पर त्रिज्या स्पर्श रेखा पर लंब होती है: ∠OPR = ∠OQR = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चतुर्भुज OPRQ के कोणों का योग = 360°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠POQ = 360° − (90° + 90° + 52°) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">128°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OP = OQ (त्रिज्याएँ), अतः ΔOPQ समद्विबाहु है और ∠OPQ = ∠OQP</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠OPQ = (180° − 128°) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: RP = RQ, अतः ∠RPQ = (180° − 52°) / 2 = 64°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠OPQ = 90° − 64° = 26°, जो ∠PRQ का आधा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ∠OPQ </span><span style=\"font-weight:bold;font-family:'Mangal'\">26° (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक खोखले बेलनाकार पाइप की बाहरी त्रिज्या 10.5 cm, आंतरिक त्रिज्या 7 cm और लंबाई 14 cm है। इसका कुल पृष्ठीय क्षेत्रफल (दोनों सिरों सहित) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,925 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,694 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,079 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,540 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है: बाहरी त्रिज्या R = 10.5 cm, आंतरिक त्रिज्या r = 7 cm, लंबाई h = 14 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाहरी वक्र पृष्ठ = 2πRh = 2 × (22/7) × 10.5 × 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">924 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भीतरी वक्र पृष्ठ = 2πrh = 2 × (22/7) × 7 × 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">616 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों वलयाकार सिरे = 2π(R² − r²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × (10.5² − 7²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × (110.25 − 49)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 61.25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">385 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल पृष्ठीय क्षेत्रफल = 924 + 616 + 385 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,925 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: खोखले बेलन का TSA = 2π(R + r)(h + R − r)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 17.5 × (14 + 3.5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 17.5 × 17.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,925 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पाइप का कुल पृष्ठीय क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,925 cm² (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B और C मिलकर एक कार्य 20 दिनों में पूरा कर सकते हैं। A और B मिलकर उसे 30 दिनों में, और B और C मिलकर 24 दिनों में कर सकते हैं। B अकेला पूरा कार्य कितने दिनों में करेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 दिन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज्ञात समय: A, B और C मिलकर 20 दिन; A और B 30 दिन; B और C 24 दिन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 दिन का काम: (A + B + C) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/20</span><span style=\"font-family:'Mangal'\">, (A + B) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/30</span><span style=\"font-family:'Mangal'\">, (B + C) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C का 1 दिन का काम = 1/20 − 1/30 = (3 − 2) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का 1 दिन का काम = 1/20 − 1/24 = (6 − 5) / 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B का 1 दिन का काम = 1/20 − 1/60 − 1/120 = (6 − 2 − 1) / 120 = 3/120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः B अकेला </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 दिन</span><span style=\"font-family:'Mangal'\"> लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A + B = 1/120 + 1/40 = (1 + 3) / 120 = 1/30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: B = (A + B) + (B + C) − (A + B + C)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1/30 + 1/24 − 1/20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (4 + 5 − 6) / 120 = 3/120 = 1/40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः B अकेला कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 दिन (विकल्प B)</span><span style=\"font-family:'Mangal'\"> में पूरा करेगा।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक थोक विक्रेता स्कूल बैगों पर ₹1,500 प्रति बैग अंकित मूल्य लिखता है। वह एक खुदरा विक्रेता को 20% की व्यापारिक छूट देता है। खुदरा विक्रेता को प्रत्येक 3 बैग खरीदने पर 1 बैग मुफ़्त भी मिलता है। इसके अतिरिक्त, यदि भुगतान 7 दिनों के भीतर किया जाए तो बिल की राशि (व्यापारिक छूट के बाद) पर 5% की नकद छूट दी जाती है। यदि खुदरा विक्रेता को कुल 48 बैग मिलते हैं और वह 7 दिनों के भीतर भुगतान करता है, तो प्रति बैग प्रभावी मूल्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹900</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹855</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹912</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,140</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खुदरा विक्रेता को 48 बैग मिलते हैं; अंकित मूल्य ₹1,500 प्रति बैग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यापारिक छूट के बाद प्रति बैग मूल्य = 1,500 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक 3 खरीदे गए बैगों पर 1 मुफ़्त है, अतः 4 बैगों के प्रत्येक समूह में 3 बैगों का भुगतान होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 बैगों में 4 के समूह = 48 / 4 = 12, अतः भुगतान वाले बैग = 12 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\"> और मुफ़्त बैग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिल की राशि = 36 × 1,200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹43,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5% नकद छूट के बाद भुगतान = 43,200 × 95% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹41,040</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रति बैग प्रभावी मूल्य = 41,040 / 48 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹855</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रभावी मूल्य = 1,500 × 80% × (3/4) × 95%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,200 × (3/4) × 0.95</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 855</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रति बैग प्रभावी मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹855 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनवर का वेतन ₹19,000 प्रति माह है। वह ₹4,500 मकान किराए पर और ₹1,500 बिलों पर खर्च करता है, और शेष राशि उसकी मासिक बचत है। यदि अपने जन्मदिन वाले महीने में वह अपनी पूरी मासिक बचत जन्मदिन के उत्सव पर खर्च कर देता है, तो एक वर्ष में उसकी बचत (₹ में) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,17,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,56,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,30,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,43,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनवर का मासिक वेतन ₹19,000 है; किराया ₹4,500 और बिल ₹1,500 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मासिक खर्च = 4,500 + 1,500 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मासिक बचत = 19,000 − 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹13,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जन्मदिन वाले महीने में पूरी बचत खर्च हो जाती है, अतः वह केवल बाकी 12 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 महीनों</span><span style=\"font-family:'Mangal'\"> में बचत करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक वर्ष की बचत = 11 × 13,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,43,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: वार्षिक बचत = (12 − 1) × (वेतन − खर्च) = 11 × 13,000 = 1,43,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः एक वर्ष में उसकी बचत </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,43,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालिका एक फ़ार्म के कुल फल उत्पादन में प्रत्येक फल का प्रतिशत हिस्सा दर्शाती है। कुल उत्पादन 2023 में 2,000 टन और 2024 में 2,500 टन था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789981190321_image001.png\" width=\"269\" height=\"292\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2023 से 2024 तक किस फल के उत्पादन में सबसे अधिक प्रतिशत वृद्धि हुई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतरा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पपीता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमरूद</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल उत्पादन: 2023 में 2,000 टन और 2024 में 2,500 टन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक फल का उत्पादन = कुल × उसका हिस्सा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आम: 2,000 × 35% = 700 → 2,500 × 32% = 800; वृद्धि = (100 / 700) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14.29%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केला: 2,000 × 25% = 500 → 2,500 × 22% = 550; वृद्धि = (50 / 500) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतरा: 2,000 × 20% = 400 → 2,500 × 22% = 550; वृद्धि = (150 / 400) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पपीता: 2,000 × 12% = 240 → 2,500 × 14% = 350; वृद्धि = (110 / 240) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45.83%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमरूद: 2,000 × 8% = 160 → 2,500 × 10% = 250; वृद्धि = (90 / 160) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">56.25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे अधिक प्रतिशत वृद्धि (56.25%) अमरूद में है, यद्यपि टन में सबसे अधिक वृद्धि (150) संतरे में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: वृद्धि गुणक = (2024 का हिस्सा / 2023 का हिस्सा) × (2,500 / 2,000); दूसरा गुणक सभी फलों के लिए समान है, अतः हिस्सों के अनुपात की तुलना करें: अमरूद का 10/8 = 1.25 सबसे बड़ा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह फल </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमरूद (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित को सरल कीजिए। 294 ÷ [10 ÷ 5 × {11 + 12 − (8 + 5 − (10 + 1))}]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोष्ठकों को सबसे भीतरी से बाहर की ओर हल करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे भीतरी कोष्ठक: (10 + 1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला छोटा कोष्ठक: (8 + 5 − 11) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मझला कोष्ठक: {11 + 12 − 2} = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बड़ा कोष्ठक: [10 ÷ 5 × 21]; ÷ और × बाएँ से दाएँ किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 ÷ 5 = 2, फिर 2 × 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक = 294 ÷ 42 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सरलीकृत मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्रावास में 300 विद्यार्थियों के लिए 40 दिनों का भोजन है। 10 दिनों के बाद 60 और विद्यार्थी छात्रावास में आ जाते हैं। शेष भोजन और कितने दिनों तक चलेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 दिन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन 300 विद्यार्थियों के लिए 40 दिनों तक पर्याप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भोजन = 300 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12,000 विद्यार्थी-दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले 10 दिनों में खर्च भोजन = 300 × 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,000 विद्यार्थी-दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष भोजन = 12,000 − 3,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,000 विद्यार्थी-दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब विद्यार्थी = 300 + 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन चलने के दिन = 9,000 / 360 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: M₁ × D₁ = M₂ × D₂</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 × (40 − 10) = 360 × D₂</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D₂ = 9,000 / 360 = 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शेष भोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 दिन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> और चलेगा।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A से उतना ही छोटा है जितना वह C से बड़ा है। A और C की आयु का अनुपात 7 : 5 है, और उनकी आयु का योग 84 वर्ष है। A और B की आयु का अंतर (वर्षों में) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और C की आयु 7 : 5 के अनुपात में है और उनका योग 84 वर्ष है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 84 × (7/12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C = 84 × (5/12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A से जितना छोटा है उतना ही C से बड़ा है: A − B = B − C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2B = A + C → B = (49 + 35) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B = 49 − 42 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: B − C = 42 − 35 = 7 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: A − B = B − C, अतः A − B = (A − C) / 2 = (49 − 35) / 2 = 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और B की आयु का अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> वर्ष है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मशीन ₹18,200 में खरीदी जाती है और उसका मूल्य प्रति वर्ष 10% घटता है। यदि मूल्यह्रास वार्षिक रूप से संयोजित होता है, तो 2 वर्ष बाद मशीन का मूल्य क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,742</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,200</span></p>", "option3": " <
