<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>23.) RRB Tech.Grade-III (#Test-11   - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

eight:bold;font-family:'Mangal'\">500 N</span><span style=\"font-family:'Mangal'\">, जो गोली की गति के विपरीत दिशा में लगता है (गोली 100/10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> = 0.01 s में रुकती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बल 500 N है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव गर्भावस्था की प्रारंभिक अवस्थाओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. गर्भाशय की ओर जाते समय युग्मनज में समसूत्री विभाजनों की एक शृंखला होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. गर्भाशय की भीतरी परत में युग्मनज का रोपण गर्भावस्था का आरंभ है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लगभग नौवें सप्ताह से विकसित हो रहे भ्रूण को गर्भ (फ़ीटस) कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निषेचन के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">युग्मनज समसूत्री विभाजन</span><span style=\"font-family:'Mangal'\"> करता हुआ गर्भाशय तक पहुँचता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पोषण पाने के लिए युग्मनज </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्भाशय की मोटी भीतरी परत में रोपित</span><span style=\"font-family:'Mangal'\"> होता है, और यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">रोपण गर्भावस्था का आरंभ</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पहले दो महीनों में भ्रूण के प्रमुख अंग बनने लगते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग नौवें सप्ताह से इसे गर्भ (फ़ीटस) कहते हैं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भावस्था लगभग नौ महीने चलती है और तीन तिमाहियों में बँटी होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 1, 2 और 3 सभी सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी परमाणु में 12 प्रोटॉन, 12 न्यूट्रॉन और 12 इलेक्ट्रॉन हैं। मान लीजिए उसके इलेक्ट्रॉनों के स्थान पर समान आवेश वाले परंतु 500 गुना भारी कण रख दिए जाएँ। निम्नलिखित में से क्या बदलेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसकी द्रव्यमान संख्या</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसकी परमाणु संख्या</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसका परमाणु द्रव्यमान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसका नेट आवेश</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु संख्या</span><span style=\"font-family:'Mangal'\"> = प्रोटॉनों की संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\">, जो नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संख्या</span><span style=\"font-family:'Mangal'\"> = प्रोटॉन + न्यूट्रॉन (न्यूक्लिऑन) = 12 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span><span style=\"font-family:'Mangal'\">, जो नहीं बदलती क्योंकि इसमें इलेक्ट्रॉन नहीं गिने जाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए कणों पर इलेक्ट्रॉनों जितना ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवेश</span><span style=\"font-family:'Mangal'\"> है, अतः 12 धन और 12 ऋण आवेश अब भी संतुलित रहते हैं और परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदासीन</span><span style=\"font-family:'Mangal'\"> रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉनों का द्रव्यमान लगभग नगण्य होता है और परमाणु द्रव्यमान में इन्हें छोड़ दिया जाता है; 500 गुना भारी कण उल्लेखनीय द्रव्यमान जोड़ेंगे, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु द्रव्यमान बढ़ जाएगा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल परमाणु द्रव्यमान बदलेगा </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंगों के उपयोगों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चमगादड़ अपने द्वारा उत्सर्जित पराश्रव्य तरंगों की प्रतिध्वनियों को संवेदित करके अवरोधों और शिकार का पता लगाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. बिना शल्यक्रिया के आंतरिक अंगों की छवि प्राप्त करने में अवश्रव्य तरंगों का उपयोग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धातु के गुटकों के भीतर के दोषों का पता लगाने में पराश्रव्य तरंगों का उपयोग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चमगादड़ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पराश्रव्य तरंगों</span><span style=\"font-family:'Mangal'\"> के छोटे स्पंद उत्सर्जित करते हैं; पास की वस्तुओं से आई </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिध्वनियों</span><span style=\"font-family:'Mangal'\"> को संवेदित करके वे अवरोधों और शिकार का पता लगाते हैं, जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिध्वनि-निर्धारण (इकोलोकेशन)</span><span style=\"font-family:'Mangal'\"> कहते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. बिना शल्यक्रिया आंतरिक अंगों की छवि प्राप्त करने (</span><span style=\"font-weight:bold;font-family:'Mangal'\">अल्ट्रासोनोग्राफ़ी</span><span style=\"font-family:'Mangal'\">) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पराश्रव्य</span><span style=\"font-family:'Mangal'\"> तरंगें प्रयुक्त होती हैं; अवश्रव्य तरंगों का उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंभीर तूफ़ानों</span><span style=\"font-family:'Mangal'\"> का पता लगाने में होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निर्माण और औद्योगिक परीक्षण में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पराश्रव्य तरंगें धातु के गुटकों के भीतर के दोषों</span><span style=\"font-family:'Mangal'\"> का पता लगाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से मटर के कौन-से विपरीत दृश्य लक्षण मेंडल द्वारा उपयोग नहीं किए गए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे/बौने पौधे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल/झुर्रीदार बीज</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सफ़ेद/बैंगनी फूल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हरे/सफ़ेद बीज</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">मटर (पाइसम सेटाइवम)</span><span style=\"font-family:'Mangal'\"> पर कार्य किया और </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत लक्षणों</span><span style=\"font-family:'Mangal'\"> के युग्म चुने।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबे और बौने पौधे</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोल और झुर्रीदार बीज</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">सफ़ेद और बैंगनी फूल</span><span style=\"font-family:'Mangal'\"> लिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीज के रंग के लिए उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीले और हरे</span><span style=\"font-family:'Mangal'\"> का युग्म लिया था, हरे और सफ़ेद का नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हरे/सफ़ेद बीज वह युग्म है जिसका उपयोग मेंडल ने नहीं किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर हरे/सफ़ेद बीज है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैलिसनेरिया और हाइड्रिला जैसे जलीय पौधों में परागण किसके द्वारा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कीट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्षी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वैलिसनेरिया</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रिला</span><span style=\"font-family:'Mangal'\"> जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलीय पौधों</span><span style=\"font-family:'Mangal'\"> में परागकण </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल धाराओं</span><span style=\"font-family:'Mangal'\"> द्वारा दूसरे फूल के वर्तिकाग्र तक पहुँचते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परागण की इस विधि को </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलपरागण (हाइड्रोफिली)</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वायु</span><span style=\"font-family:'Mangal'\"> गेहूँ, मक्का और चावल जैसे पौधों का परागण करती है, जिनके परागकण हल्के और शुष्क होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कीट</span><span style=\"font-family:'Mangal'\"> सूरजमुखी, गुड़हल और गेंदा जैसे फूलों का परागण करते हैं, जो चटकीले होते हैं और मकरंद देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परागण जल द्वारा होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समुद्र के जल के दो पिंडों का ताप समान है, परंतु एक की लवणता दूसरे से अधिक है। उनका क्या होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कम लवणीय जल गहराई में जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों सतह पर मिले रहते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिक लवणीय जल गहराई में जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिक लवणीय जल ऊपर उठता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भिन्न-भिन्न स्थानों पर समुद्री जल की </span><span style=\"font-weight:bold;font-family:'Mangal'\">लवणता</span><span style=\"font-family:'Mangal'\"> भिन्न होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक लवणता वाला जल अधिक सघन</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे जाकर गहरे स्तरों पर</span><span style=\"font-family:'Mangal'\"> चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कम लवणता वाला जल कम सघन</span><span style=\"font-family:'Mangal'\"> होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सतह के पास</span><span style=\"font-family:'Mangal'\"> रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताप के अंतर, पृथ्वी के घूर्णन और स्थलखंडों के वितरण के साथ लवणता के ये अंतर समुद्री जल की गति को चलाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अधिक लवणीय जल गहराई में जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैज्ञानिकों ने एक जीवाणु का DNA निकाल दिया, परंतु उसके कोशिकाद्रव्य और कोशिका झिल्ली को सुरक्षित रखा। फिर उन्होंने उसमें एक निकट संबंधी जीवाणु के DNA की प्रयोगशाला में बनी प्रतिलिपि डाली। कोशिका नए DNA के निर्देशों के अनुसार वृद्धि और विभाजन करने लगी। इससे पता चलता है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका को पूरी तरह शून्य से बनाया जा सकता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DNA कोशिका की गतिविधियों को नियंत्रित करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाद्रव्य कोशिका की गतिविधियों को नियंत्रित करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका झिल्ली नया DNA बना सकती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2010 में जे. क्रेग वेंटर और उनके दल ने प्रयोगशाला में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक जीवाणु के DNA की प्रतिलिपि संश्लेषित</span><span style=\"font-family:'Mangal'\"> की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उन्होंने इसे एक निकट संबंधी जीवाणु में डाला जिसका अपना DNA निकाल दिया गया था, परंतु जिसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाद्रव्य और कोशिका झिल्ली सुरक्षित</span><span style=\"font-family:'Mangal'\"> थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद कोशिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">नए DNA के निर्देशों के अनुसार वृद्धि और विभाजन</span><span style=\"font-family:'Mangal'\"> करने लगी, जिससे पता चलता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">DNA कोशिका की संरचना और गतिविधियों को नियंत्रित करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल DNA संश्लेषित था; कोशिका के शेष भाग पहले से जीवित कोशिका से लिए गए थे, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका शून्य से नहीं बनाई गई</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह प्रयोग दर्शाता है कि DNA कोशिका की गतिविधियों को नियंत्रित करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर्षण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जूतों के तलों पर बने खाँचे फ़र्श और तलों के बीच घर्षण बढ़ाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वाहनों के टायरों पर बनी धारियाँ (ट्रेड) टायरों और सड़क के बीच घर्षण घटाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. चिकने पेड़ के तने पर चढ़ना कठिन होता है क्योंकि उस पर घर्षण कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जूतों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">तलों पर खाँचे</span><span style=\"font-family:'Mangal'\"> फ़र्श के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण बढ़ाते</span><span style=\"font-family:'Mangal'\"> हैं, इसीलिए ये बनाए जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">टायरों की धारियाँ</span><span style=\"font-family:'Mangal'\"> टायरों और सड़क के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण बढ़ाती</span><span style=\"font-family:'Mangal'\"> हैं; घर्षण बहुत कम होने पर, जैसे गीली या बर्फ़ से ढकी सड़क पर, वाहन चलाना जोखिम भरा होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. चढ़ते समय पैर तने को दबाते हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण चढ़ने वाले को ऊपर धकेलता</span><span style=\"font-family:'Mangal'\"> है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">चिकने तने पर घर्षण कम</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए उस पर चढ़ना कठिन है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक प्रोटॉन किसी एकसमान चुंबकीय क्षेत्र में स्वतंत्र रूप से गति करता है, और उसका वेग क्षेत्र के लंबवत है। उसकी कौन-सी राशियाँ बदलती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान और चाल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल चाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान और संवेग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग और संवेग</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गतिमान प्रोटॉन एक धारा की तरह है, अतः चुंबकीय क्षेत्र उस पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षेत्र और गति की दिशा दोनों के लंबवत बल</span><span style=\"font-family:'Mangal'\"> लगाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गति के लंबवत लगा बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल गति की दिशा बदलता</span><span style=\"font-family:'Mangal'\"> है, चाल नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग में दिशा शामिल है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">वेग बदलता</span><span style=\"font-family:'Mangal'\"> है; संवेग (द्रव्यमान × वेग) भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">बदलता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटॉन का </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान और चाल</span><span style=\"font-family:'Mangal'\"> वही रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वेग और संवेग बदलते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. समतापमंडल की ओज़ोन सूर्य से आने वाले हानिकारक पराबैंगनी विकिरण को अवशोषित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वाहनों के उत्सर्जन से बनने वाली भू-स्तरीय ओज़ोन स्वास्थ्य के लिए हानिकारक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रेफ़्रिजरेटरों और एरोसोल में प्रयुक्त क्लोरोफ़्लोरोकार्बन (CFC) ओज़ोन परत की रक्षा करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">समतापमंडल की ओज़ोन परत</span><span style=\"font-family:'Mangal'\"> एक कवच की तरह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हानिकारक UV विकिरण को अवशोषित</span><span style=\"font-family:'Mangal'\"> करके जीवन की रक्षा करती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वाहनों का उत्सर्जन सूर्य के प्रकाश से अभिक्रिया करके धूम-कोहरा (स्मॉग) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">भू-स्तरीय ओज़ोन</span><span style=\"fon rgin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल व्यवस्था 1 की पत्ती नीली-काली होती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई भी पत्ती नीली-काली नहीं होती</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पोटैशियम हाइड्रॉक्साइड कार्बन डाइऑक्साइड को अवशोषित</span><span style=\"font-family:'Mangal'\"> कर लेता है, अतः व्यवस्था 1 के पौधे को बेलजार में CO₂ नहीं मिलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ के बिना वह पौधा </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश संश्लेषण नहीं कर पाता</span><span style=\"font-family:'Mangal'\">, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">मंड नहीं बनता</span><span style=\"font-family:'Mangal'\"> और उसकी पत्ती आयोडीन से नीली-काली नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यवस्था 2 के पौधे को CO₂ मिलती है; वह प्रकाश संश्लेषण से कार्बोहाइड्रेट बनाता है और अतिरिक्त भाग को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मंड</span><span style=\"font-family:'Mangal'\"> के रूप में संचित करता है, अतः उसकी पत्ती </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीली-काली</span><span style=\"font-family:'Mangal'\"> हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे पता चलता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश संश्लेषण के लिए कार्बन डाइऑक्साइड आवश्यक</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल व्यवस्था 2 की पत्ती नीली-काली होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लसीका के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. लसीका रक्त प्लाज़्मा जैसी होती है, परंतु रंगहीन होती है और उसमें प्रोटीन कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लसीका आँत से पचे और अवशोषित वसा का वहन करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लसीका अतिरिक्त द्रव को रक्त से कोशिकाओं के बीच के स्थानों में ले जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. केशिकाओं की भित्तियों के छिद्रों से कुछ प्लाज़्मा, प्रोटीन और रक्त कोशिकाएँ बाहर निकलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">लसीका</span><span style=\"font-family:'Mangal'\"> बनाती हैं, जो प्लाज़्मा जैसी परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">रंगहीन और कम प्रोटीन वाली</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लसीका आँत से </span><span style=\"font-weight:bold;font-family:'Mangal'\">पचे और अवशोषित वसा का वहन</span><span style=\"font-family:'Mangal'\"> करती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लसीका उलटी दिशा में बहती है: यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाओं के बीच के स्थानों से अतिरिक्त द्रव को वापस रक्त में</span><span style=\"font-family:'Mangal'\"> ले जाती है, क्योंकि लसीका वाहिकाएँ बड़ी शिराओं में खुलती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाद्य पदार्थों के डिब्बों पर जिंक के स्थान पर टिन की परत चढ़ाई जाती है। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टिन, जिंक से अधिक अभिक्रियाशील है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिंक का गलनांक टिन से कम है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिंक, टिन से अधिक अभिक्रियाशील है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टिन, जिंक से ऊष्मा का बेहतर चालक है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जिंक, टिन से अधिक अभिक्रियाशील है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिंक की परत </span><span style=\"font-weight:bold;font-family:'Mangal'\">खाद्य पदार्थों में उपस्थित अम्लों से अभिक्रिया</span><span style=\"font-family:'Mangal'\"> करके ऐसे यौगिक बना सकती है जो भोजन को खराब कर दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टिन </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम अभिक्रियाशील</span><span style=\"font-family:'Mangal'\"> है और भोजन से आसानी से अभिक्रिया नहीं करता, अतः डिब्बों पर परत चढ़ाने के लिए सुरक्षित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तव में जिंक का गलनांक टिन से अधिक है, और ऊष्मा चालकता का इस चुनाव से कोई संबंध नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः डिब्बों पर टिन चढ़ाया जाता है क्योंकि जिंक, टिन से अधिक अभिक्रियाशील है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रातुओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अमलगम वह मिश्रातु है जिसकी एक धातु जिंक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मिश्रातु की विद्युत चालकता और गलनांक उन शुद्ध धातुओं से कम होते हैं जिनसे वह बनी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लेड और टिन की मिश्रातु सोल्डर का उपयोग कम गलनांक के कारण विद्युत तारों को आपस में जोड़ने (वेल्डिंग) में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमलगम</span><span style=\"font-family:'Mangal'\"> वह मिश्रातु है जिसकी एक धातु </span><span style=\"font-weight:bold;font-family:'Mangal'\">पारा (मर्करी)</span><span style=\"font-family:'Mangal'\"> होती है, जिंक नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मिश्रातु की </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत चालकता और गलनांक शुद्ध धातुओं से कम</span><span style=\"font-family:'Mangal'\"> होते हैं; पीतल और काँसा अच्छे चालक नहीं हैं, जबकि परिपथों में शुद्ध कॉपर का उपयोग होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोल्डर</span><span style=\"font-family:'Mangal'\"> (लेड + टिन) का </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलनांक कम</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए इसका उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत तारों को आपस में जोड़ने</span><span style=\"font-family:'Mangal'\"> में होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार सीधे राजमार्ग पर 2 मिनट तक 6 m/s के नियत वेग से चलती है। फिर वह उसी दिशा में 6 s तक 1 m/s² के एकसमान त्वरण से चलती है। इन 2 मिनट 6 s में कार का कुल विस्थापन है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">756 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">738 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">792 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">774 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले 2 मिनट (120 s) में वेग नियत है: s₁ = v × t = 6 × 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">720 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगले 6 s के लिए u = 6 m/s और a = 1 m/s²:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s₂ = ut + ½at²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (6 × 6) + (½ × 1 × 6²) = 36 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल विस्थापन = 720 + 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">774 m</span><span style=\"font-family:'Mangal'\">, जो वेग-समय ग्राफ़ के नीचे के कुल क्षेत्रफल के बराबर भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विस्थापन 774 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जब किसी गेंद को ऊर्ध्वाधर ऊपर की ओर फेंका जाता है, तो ऊपर जाते समय गेंद पर गुरुत्व द्वारा किया गया कार्य ऋणात्मक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ऊपर जाते समय गेंद पर लगने वाला गुरुत्वीय बल उसके विस्थापन के विपरीत दिशा में होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद के ऊपर जाते समय उसका विस्थापन </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊपर की ओर</span><span style=\"font-family:'Mangal'\"> है परंतु गुरुत्वीय बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे की ओर</span><span style=\"font-family:'Mangal'\"> लगता है, अतः गुरुत्व द्वारा किया गया कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऋणात्मक</span><span style=\"font-family:'Mangal'\"> है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल विस्थापन के विपरीत</span><span style=\"font-family:'Mangal'\"> होता है, किया गया कार्य ऋणात्मक होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R ही A में ऋणात्मक चिह्न का कारण है; इसी ऋणात्मक कार्य के कारण ऊपर जाते समय गेंद की </span><span style=\"font-weight:bold;font-family:'Mangal'\">गतिज ऊर्जा घटती</span><span style=\"font-family:'Mangal'\"> है। नीचे आते समय बल और विस्थापन दोनों नीचे की ओर होते हैं और गुरुत्व धनात्मक कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्गीकरण के पदानुक्रम में निम्नलिखित में से किस समूह में सदस्य सबसे कम परंतु समान लक्षण सबसे अधिक होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वंश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्गीकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत बड़े समूहों से छोटे, अधिक विशिष्ट समूहों</span><span style=\"font-family:'Mangal'\"> की ओर क्रमशः बढ़ता है (जगत → संघ → वर्ग → गण → कुल → वंश → जाति)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक निचला समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपने ऊपर वाले समूह का भाग</span><span style=\"font-family:'Mangal'\"> होता है, अतः हर निचले स्तर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सदस्य कम</span><span style=\"font-family:'Mangal'\"> होते जाते हैं और उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान लक्षण अधिक</span><span style=\"font-family:'Mangal'\"> होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए समूहों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वंश</span><span style=\"font-family:'Mangal'\"> सबसे निचला है; यह निकट संबंधी जातियों को समूहित करता है, जैसे पैंथेरा में बाघ और शेर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत में सदस्य सबसे अधिक परंतु समान लक्षण सबसे कम होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वंश में सदस्य सबसे कम और समान लक्षण सबसे अधिक होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक अवतल दर्पण अपने सामने 10 cm पर रखी वस्तु का तीन गुना बड़ा वास्तविक प्रतिबिंब बनाता है। प्रतिबिंब कहाँ बनता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के सामने 7.5 cm पर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के सामने 30 cm पर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के पीछे 30 cm पर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के सामने 3.3 cm पर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तविक प्रतिबिंब उलटा होता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">m = −3</span><span style=\"font-family:'Mangal'\">; नई कार्तीय चिह्न परिपाटी के अनुसार </span><span style=\"font-weight:bold;font-family:'Mangal'\">u = −10 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m = −v/u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−3 = −v / (−10) → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक चिह्न दर्शाता है कि प्रतिबिंब </span><span style=\"font-weight:bold;font-family:'Mangal'\">दर्पण के सामने</span><span style=\"font-family:'Mangal'\"> 30 cm पर बनता है, जहाँ इसे पर्दे पर प्राप्त किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(जाँच: 1/f = 1/v + 1/u = −1/30 − 1/10 → f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−7.5 cm</span><span style=\"font-family:'Mangal'\">, अर्थात् अवतल दर्पण।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दर्पण के सामने 30 cm पर बनता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जब ध्वनि वायु में चलती है, तो संपीडन और विरलन माध्यम में आगे बढ़ते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ध्वनि तरंग के साथ-साथ वायु के कण स्वयं लगातार आगे बढ़ते जाते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संपीडित वायु के कण आगे के कणों से टकराकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">संपीडन को आगे</span><span style=\"font-family:'Mangal'\"> बढ़ाते हैं; विरलन भी इसी प्रकार आगे बढ़ते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कण स्वयं केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपनी माध्य स्थितियों के इधर-उधर दोलन</span><span style=\"font-family:'Mangal'\"> करते हैं; आगे </span><span style=\"font-weight:bold;font-family:'Mangal'\">विक्षोभ (ऊर्जा)</span><span style=\"font-family:'Mangal'\"> जाता है, कण नहीं → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंग एकांतर संपीडनों और विरलनों की एक शृंखला है जो माध्यम के </span><span style=\"font-weight:bold;font-family:'Mangal'\">कणों के वास्तविक प्रवाह के बिना</span><span style=\"font-family:'Mangal'\"> संचरित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक क्रेन किसी भार को भूतल से भवन की 10वीं मंज़िल तक समय t में उठाती है। फिर वह उसी भार को भूतल से 20वीं मंज़िल तक समय 2t में उठाती है। पहली बार की तुलना में दूसरी बार उठाने में आवश्यक है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोगुनी ऊर्जा और उतनी ही शक्ति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोगुनी ऊर्जा और दोगुनी शक्ति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उतनी ही ऊर्जा और आधी शक्ति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार गुनी ऊर्जा और दोगुनी शक्ति</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवश्यक ऊर्जा = स्थितिज ऊर्जा में वृद्धि = </span><span style=\"font-weight:bold;font-family:'Mangal'\">mgh</span><span style=\"font-family:'Mangal'\">, अतः यह ऊँचाई के अनुक्रमानुपाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20वीं मंज़िल 10वीं मंज़िल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुनी ऊँचाई</span><span style=\"font-family:'Mangal'\"> पर है, अतः आवश्यक ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुनी</span><span style=\"font-family:'Mangal'\"> हो जाती है: 2mgh.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति = ऊर्जा / समय = 2mgh / 2t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">mgh / t</span><span style=\"font-family:'Mangal'\">, जो पहली बार की शक्ति के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात् ऊर्जा केवल ऊँचाई पर निर्भर करती है, जबकि शक्ति ऊर्जा और लगे समय दोनों पर निर्भर करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरी बार दोगुनी ऊर्जा परंतु उतनी ही शक्ति चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रासायनिक अभिक्रिया को उसके प्रकार से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789980059738_image001.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(iii), (d)-(ii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(ii), (c)-(iv), (d)-(i)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(iv), (d)-(ii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Fe₂O₃ + 2Al</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">विस्थापन</span><span style=\"font-family:'Mangal'\">: अधिक अभिक्रियाशील ऐलुमिनियम आयरन को उसके ऑक्साइड से विस्थापित करता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य के प्रकाश में 2AgBr</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटन</span><span style=\"font-family:'Mangal'\">: एक ही अभिकारक टूटकर सिल्वर और ब्रोमीन देता है; इसका उपयोग श्वेत-श्याम फ़ोटोग्राफ़ी में होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">2KBr + BaI₂</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विविस्थापन</span><span style=\"font-family:'Mangal'\">: दोनों यौगिकों के आयनों का आदान-प्रदान होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">H₂ + Cl₂</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजन</span><span style=\"font-family:'Mangal'\">: दो पदार्थ मिलकर एक ही उत्पाद बनाते हैं।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच विलयनों P, Q, R, S और T के pH मान क्रमशः 4, 1, 11, 7 और 9 हैं। हाइड्रोजन आयन सांद्रता के बढ़ते क्रम में ये हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, T, S, P, Q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P, S, T, R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, T, S, Q, P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, R, S, P, Q</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन आयन की सांद्रता जितनी अधिक, pH उतना ही कम</span><span style=\"font-family:'Mangal'\"> होता है; अतः H⁺ सांद्रता के बढ़ते क्रम का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">pH का घटता क्रम</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">pH के घटते क्रम में: R (11) &gt; T (9) &gt; S (7) &gt; P (4) &gt; Q (1).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R प्रबल क्षारीय, T दुर्बल क्षारीय, S उदासीन, P दुर्बल अम्लीय और Q प्रबल अम्लीय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रम R, T, S, P, Q है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन और उसके यौगिकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ग्रेफ़ाइट में प्रत्येक कार्बन परमाणु चार अन्य कार्बन परमाणुओं से जुड़कर एक दृढ़ त्रिविमीय संरचना बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. फ़्रेडरिक वोलर ने अमोनियम सायनेट से यूरिया बनाकर 'प्राण-शक्ति' सिद्धांत को गलत सिद्ध किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पहचाने गए पहले फ़ुलरीन C-60 में कार्बन परमाणु फ़ुटबॉल के आकार में व्यवस्थित होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-
