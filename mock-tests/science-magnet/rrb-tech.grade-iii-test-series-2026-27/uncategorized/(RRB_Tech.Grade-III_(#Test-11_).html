top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रति कार्बन </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार आबंधों वाली दृढ़ त्रिविमीय संरचना हीरे</span><span style=\"font-family:'Mangal'\"> की है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रेफ़ाइट में प्रत्येक कार्बन तीन अन्य कार्बन परमाणुओं से</span><span style=\"font-family:'Mangal'\"> एक ही तल में जुड़कर षट्कोणीय परतें बनाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पहले माना जाता था कि कार्बनिक यौगिक केवल जीवित तंत्र की 'प्राण-शक्ति' से बनते हैं; 1828 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वोलर ने अमोनियम सायनेट से यूरिया बनाकर</span><span style=\"font-family:'Mangal'\"> इसे गलत सिद्ध किया → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">C-60</span><span style=\"font-family:'Mangal'\"> पहचाना गया पहला फ़ुलरीन था, जिसमें कार्बन परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़ुटबॉल</span><span style=\"font-family:'Mangal'\"> की तरह व्यवस्थित होते हैं; इसका नाम वास्तुकार बकमिंस्टर फ़ुलर के नाम पर रखा गया → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालाबों में पाए जाने वाले एक जीव का शरीर लंबा, धागे जैसा और हरा है। परिपक्व होने पर यह बस छोटे-छोटे टुकड़ों में टूट जाता है, और प्रत्येक टुकड़ा वृद्धि करके नया जीव बन जाता है। यह जीव और इसकी प्रजनन विधि हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पाइरोगाइरा; पुनर्जनन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रा; खंडन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पाइरोगाइरा; खंडन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेनेरिया; खंडन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तंतुमय हरा शैवाल स्पाइरोगाइरा</span><span style=\"font-family:'Mangal'\"> एक सरल बहुकोशिकीय जीव है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिपक्व होने पर यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटे-छोटे टुकड़ों (खंडों) में टूट जाता</span><span style=\"font-family:'Mangal'\"> है, और प्रत्येक खंड वृद्धि करके नया जीव बन जाता है; इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">खंडन</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पुनर्जनन</span><span style=\"font-family:'Mangal'\"> (जैसे प्लेनेरिया में) शरीर के कटे भाग से पूरे जीव का विकास है, और यह प्रजनन का सामान्य तरीका नहीं है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रा</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुकुलन</span><span style=\"font-family:'Mangal'\"> द्वारा प्रजनन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह जीव स्पाइरोगाइरा है, जो खंडन द्वारा प्रजनन करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जब 10 g एथेनॉल को एक खुले बीकर में जलाया जाता है और कोई अवशेष नहीं बचता, तो द्रव्यमान संरक्षण के नियम का उल्लंघन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): एथेनॉल के जलने के उत्पाद, कार्बन डाइऑक्साइड और जलवाष्प, गैसें हैं जो वायु में निकल जाती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल के जलने से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड और जलवाष्प</span><span style=\"font-family:'Mangal'\"> बनती हैं, जो खुले बीकर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु में निकल जाती</span><span style=\"font-family:'Mangal'\"> हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान केवल घटता हुआ प्रतीत होता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंद निकाय</span><span style=\"font-family:'Mangal'\"> में अभिकारकों (एथेनॉल और ऑक्सीजन) का कुल द्रव्यमान उत्पादों के कुल द्रव्यमान के बराबर होता है, अतः नियम का </span><span style=\"font-weight:bold;font-family:'Mangal'\">उल्लंघन नहीं</span><span style=\"font-family:'Mangal'\"> होता → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैवोज़िए का </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संरक्षण का नियम</span><span style=\"font-family:'Mangal'\"> प्रत्येक रासायनिक अभिक्रिया पर लागू होता है: द्रव्य न तो बनता है और न ही नष्ट होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वेत प्रकाश का एक संकीर्ण किरण-पुंज काँच के एक प्रिज़्म से गुज़रता है, और उससे बनी रंगों की पट्टी एक दूसरे, सर्वसम प्रिज़्म पर पड़ती है जिसे उलटी स्थिति में रखा गया है। दूसरे प्रिज़्म से क्या निकलता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वेत प्रकाश का किरण-पुंज</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रंगों की अधिक चौड़ी पट्टी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल लाल प्रकाश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल बैंगनी प्रकाश</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला प्रिज़्म श्वेत प्रकाश का उसके सात रंगों (VIBGYOR) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विक्षेपण</span><span style=\"font-family:'Mangal'\"> करता है, क्योंकि प्रत्येक रंग भिन्न कोण से मुड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उलटा रखा दूसरा प्रिज़्म</span><span style=\"font-family:'Mangal'\"> प्रत्येक रंग को विपरीत दिशा में वापस मोड़ देता है, जिससे सभी रंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनः मिल</span><span style=\"font-family:'Mangal'\"> जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी ओर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत प्रकाश</span><span style=\"font-family:'Mangal'\"> का किरण-पुंज निकलता है, जैसा आइज़क न्यूटन ने प्रेक्षित किया था; इससे पता चलता है कि सूर्य का प्रकाश सात रंगों से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः श्वेत प्रकाश का किरण-पुंज निकलता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सर्दी-ज़ुकाम के कारण बंद नाक वाले व्यक्ति को भोजन फीका लगता है। इससे पता चलता है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वाद की अनुभूति कुछ हद तक गंध पर निर्भर है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सर्दी में जीभ काम करना बंद कर देती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वाद का पता घ्राणग्राही लगाते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गंध का पता स्वाद कलिकाएँ लगाती हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वाद का पता जीभ पर स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वादग्राही</span><span style=\"font-family:'Mangal'\"> और गंध का पता नाक में स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">घ्राणग्राही</span><span style=\"font-family:'Mangal'\"> लगाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाक बंद होने पर भोजन की गंध घ्राणग्राहियों तक नहीं पहुँच पाती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीभ तब भी काम करती है, फिर भी भोजन फीका लगता है; इससे पता चलता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वाद की अनुभूति गंध से जुड़ी</span><span style=\"font-family:'Mangal'\"> है। नाक दबाकर भोजन चखने पर भी यही प्रभाव दिखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः स्वाद की अनुभूति कुछ हद तक गंध पर निर्भर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): प्लास्टर ऑफ़ पेरिस को नमी-रोधी पात्र में रखना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): डॉक्टर टूटी हुई हड्डियों को सही स्थिति में सहारा देने के लिए प्लास्टर ऑफ़ पेरिस का उपयोग करते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लास्टर ऑफ़ पेरिस (CaSO₄·½H₂O) </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल से अभिक्रिया करके जिप्सम</span><span style=\"font-family:'Mangal'\"> (CaSO₄·2H₂O) बनाता है, जो एक कठोर ठोस पिंड है; अतः भंडारण में नमी मिलने पर यह जम जाएगा → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डॉक्टर वास्तव में प्लास्टर ऑफ़ पेरिस का उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">टूटी हड्डियों को सही स्थिति में सहारा</span><span style=\"font-family:'Mangal'\"> देने के लिए करते हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु A की व्याख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल के संपर्क में इसके जमने</span><span style=\"font-family:'Mangal'\"> से होती है, इसके चिकित्सीय उपयोग से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बच्चे के घुटने पर छोटा-सा कट लग जाता है, और कुछ समय बाद वहाँ थक्का बन जाता है। दो दिन बाद घाव में संक्रमण हो जाता है, वह लाल होकर सूज जाता है, और उसमें मवाद बन जाता है। थक्का और मवाद बनने के लिए मुख्य रूप से उत्तरदायी रक्त घटक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RBC और प्लेटलेट्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लाज़्मा और RBC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेटलेट्स और WBC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WBC और प्लेटलेट्स</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्लेटलेट्स</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">चोट के स्थान पर रक्त का थक्का</span><span style=\"font-family:'Mangal'\"> जमाने में सहायता करती हैं, अतः कट पर थक्का इन्हीं से बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत रक्त कोशिकाएँ (WBC)</span><span style=\"font-family:'Mangal'\"> रोगाणुओं से लड़ने के लिए संक्रमित स्थान पर एकत्र होती हैं, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">मवाद बनता है और सूजन</span><span style=\"font-family:'Mangal'\"> (लालिमा और फूलना) होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">RBC</span><span style=\"font-family:'Mangal'\"> लौह-युक्त प्रोटीन </span><span style=\"font-weight:bold;font-family:'Mangal'\">हीमोग्लोबिन</span><span style=\"font-family:'Mangal'\"> की सहायता से ऑक्सीजन ले जाती हैं, और प्लाज़्मा रक्त का तरल भाग है (रक्त के आयतन का 55%); इनमें से कोई भी थक्का या मवाद नहीं बनाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रमशः प्लेटलेट्स और WBC उत्तरदायी हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लवकों (प्लास्टिड) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वर्णीलवक (क्रोमोप्लास्ट) में पीले, नारंगी या लाल वर्णक होते हैं जो परागणकर्ताओं को आकर्षित करने में सहायक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अवर्णीलवक (ल्यूकोप्लास्ट) रंगहीन होते हैं, और इनमें से कुछ आलू की कोशिकाओं में मंड (स्टार्च) का संचय करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जड़ की कोशिकाओं में लवक नहीं होते क्योंकि जड़ें प्रकाश संश्लेषण नहीं करतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्णीलवक</span><span style=\"font-family:'Mangal'\"> में पर्णहरित के अतिरिक्त अन्य वर्णक (</span><span style=\"font-weight:bold;font-family:'Mangal'\">पीले, नारंगी या लाल</span><span style=\"font-family:'Mangal'\">) होते हैं, जो फूलों और फलों को चटकीले रंग देकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">परागणकर्ताओं</span><span style=\"font-family:'Mangal'\"> और बीज फैलाने वाले जंतुओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">आकर्षित</span><span style=\"font-family:'Mangal'\"> करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवर्णीलवक</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">रंगहीन लवक</span><span style=\"font-family:'Mangal'\"> हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">आलू तथा अरबी की कोशिकाओं</span><span style=\"font-family:'Mangal'\"> में कुछ अवर्णीलवक </span><span style=\"font-weight:bold;font-family:'Mangal'\">मंड का संचय</span><span style=\"font-family:'Mangal'\"> करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जड़ें भूमिगत होती हैं और प्रकाश संश्लेषण नहीं करतीं, फिर भी उनकी कोशिकाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवर्णीलवक जैसे लवक</span><span style=\"font-family:'Mangal'\"> होते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अस्पतालों में प्रयुक्त एक सेलाइन ड्रिप पर \"0.9% m/v सोडियम क्लोराइड\" लिखा है। इस ड्रिप की 500 mL की बोतल में कितना सोडियम क्लोराइड उपस्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 g</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.45 g</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 g</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 g</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान-आयतन प्रतिशत = (विलेय का द्रव्यमान / विलयन का आयतन) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.9 = (लवण का द्रव्यमान / 500) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लवण का द्रव्यमान = 500 × (0.9/100) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.5 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात् 0.9% m/v का अर्थ है विलयन के </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक 100 mL में 0.9 g लवण</span><span style=\"font-family:'Mangal'\">, अतः 500 mL (100 mL का पाँच गुना) में 5 × 0.9 = 4.5 g लवण होता है; यह सेलाइन रक्त के लिए सुरक्षित है और शरीर के खोए द्रवों की पूर्ति करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बोतल में 4.5 g सोडियम क्लोराइड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक आबंधों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ऑक्सीजन अणु के दोनों परमाणु द्वि-आबंध द्वारा जुड़े होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. क्लोरीन अणु तब बनता है जब एक क्लोरीन परमाणु दूसरे को एक इलेक्ट्रॉन स्थानांतरित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. हाइड्रोजन क्लोराइड एक सहसंयोजक यौगिक है जिसके परमाणुओं के बीच एकल आबंध होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रत्येक ऑक्सीजन परमाणु में छह संयोजकता इलेक्ट्रॉन होते हैं और उसे दो और चाहिए, अतः दो ऑक्सीजन परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो-दो इलेक्ट्रॉनों की साझेदारी</span><span style=\"font-family:'Mangal'\"> करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्वि-आबंध</span><span style=\"font-family:'Mangal'\"> (O=O) बनाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रत्येक क्लोरीन परमाणु में सात संयोजकता इलेक्ट्रॉन होते हैं और उसे एक और चाहिए; दो क्लोरीन परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-एक इलेक्ट्रॉन की साझेदारी</span><span style=\"font-family:'Mangal'\"> करते हैं (एकल सहसंयोजक आबंध), इलेक्ट्रॉन का </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई स्थानांतरण नहीं</span><span style=\"font-family:'Mangal'\"> होता → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. हाइड्रोजन और क्लोरीन दोनों को एक-एक इलेक्ट्रॉन चाहिए, अतः वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-एक इलेक्ट्रॉन की साझेदारी</span><span style=\"font-family:'Mangal'\"> करते हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल सहसंयोजक आबंध</span><span style=\"font-family:'Mangal'\"> वाला हाइड्रोजन क्लोराइड बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेन्टेन, C₅H₁₂ के कितने संरचनात्मक समावयवी संभव हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">संरचनात्मक समावयवियों</span><span style=\"font-family:'Mangal'\"> का आण्विक सूत्र समान परंतु संरचनाएँ भिन्न होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₅H₁₂ के पाँच कार्बन परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँच कार्बन की सीधी शृंखला</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक शाखा वाली चार कार्बन की शृंखला</span><span style=\"font-family:'Mangal'\">, या </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीच वाले कार्बन पर दो शाखाओं वाली तीन कार्बन की शृंखला</span><span style=\"font-family:'Mangal'\"> के रूप में व्यवस्थित हो सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य सभी व्यवस्थाएँ इन्हीं तीन कार्बन ढाँचों में से किसी एक को दोहराती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पेन्टेन के 3 संरचनात्मक समावयवी हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे को उस वर्ग से सुमेलित कीजिए जिससे वह संबंधित है:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789980059738_image002.png\" style=\"width: 400px; height: 286px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iii), (c)-(iv), (d)-(i)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(iii), (d)-(i)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्पाइरोगाइरा</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">थैलोफ़ाइटा</span><span style=\"font-family:'Mangal'\">: जड़, तने और पत्ती से रहित सरल थैलस शरीर होता है; यह जल में रहता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मार्केंशिया</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रायोफ़ाइटा</span><span style=\"font-family:'Mangal'\">: इसमें मूलाभास (राइज़ॉइड) और तने व पत्ती जैसी सरल संरचनाएँ होती हैं; यह नम, छायादार स्थानों में उगता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फ़र्न</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">टेरिडोफ़ाइटा</span><span style=\"font-family:'Mangal'\">: इसमें जाइलम और फ्लोएम सहित वास्तविक जड़, तना और पत्तियाँ होती हैं, परंतु बीज नहीं बनते।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गुलमोहर</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवृतबीजी</span><span style=\"font-family:'Mangal'\">: यह फूल वाला वृक्ष है जिसके बीज फलों के भीतर बंद होते हैं।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(ii), (b)-(iv), (c)-(iii), (d)-(i) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत बल्बों में प्रायः रासायनिक रूप से निष्क्रिय नाइट्रोजन और आर्गन गैसें भरी जाती हैं। इसका उद्देश्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा बढ़ाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिरोध घटाना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तंतु का जीवनकाल बढ़ाना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तंतु को जलने में सहायता देना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिना पिघले प्रकाश उत्सर्जित करने के लिए तंतु को </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत गर्म</span><span style=\"font-family:'Mangal'\"> होना पड़ता है, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">टंगस्टन</span><span style=\"font-family:'Mangal'\"> (गलनांक 3380°C) से बनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक रूप से निष्क्रिय नाइट्रोजन और आर्गन</span><span style=\"font-family:'Mangal'\"> गर्म तंतु से अभिक्रिया नहीं करतीं, अतः इन्हें बल्ब में भरने से </span><span style=\"font-weight:bold;font-family:'Mangal'\">तंतु का जीवनकाल बढ़</span><span style=\"font-family:'Mangal'\"> जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये गैसें न धारा बदलती हैं न प्रतिरोध, और तंतु बिना जले चमकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये गैसें तंतु का जीवनकाल बढ़ाती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकृति में क्लोरीन 35 u और 37 u द्रव्यमान वाले दो समस्थानिकों के रूप में पाई जाती है। निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रकृति में क्लोरीन-35 और क्लोरीन-37 का अनुपात 3 : 1 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. क्लोरीन का परमाणु द्रव्यमान 36 u है, जो 35 u और 37 u का साधारण औसत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. 35.5 u परमाणु द्रव्यमान का अर्थ है कि क्लोरीन के प्रत्येक परमाणु का द्रव्यमान 35.5 u है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्राकृतिक क्लोरीन में लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">75% क्लोरीन-35</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">25% क्लोरीन-37</span><span style=\"font-family:'Mangal'\"> है, अर्थात् अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 : 1</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. साधारण औसत (35 + 37)/2 = 36 u प्रचुरता की उपेक्षा करता है; परमाणु द्रव्यमान </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारित औसत</span><span style=\"font-family:'Mangal'\"> है = [35 × (75/100)] + [37 × (25/100)] = 26.25 + 9.25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35.5 u</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी भी एक परमाणु का द्रव्यमान भिन्नात्मक नहीं होता; 35.5 u का अर्थ है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 लाख क्लोरीन परमाणुओं में लगभग 7.5 लाख क्लोरीन-35 और 2.5 लाख क्लोरीन-37</span><span style=\"font-family:'Mangal'\"> हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल कथन 1 सही है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोयला एक अच्छा ईंधन है, फिर भी कोयला खाने वाले व्यक्ति को उससे कोई ऊर्जा नहीं मिलती। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोयले में रासायनिक ऊर्जा नहीं होती</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हमारे एंज़ाइम कोयले को तोड़ नहीं सकते</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोयला केवल प्रकाश से टूटता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोयला एक जैव निम्नीकरणीय पदार्थ है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जलने पर कोयला बहुत ऊष्मा देता है, अतः इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक ऊर्जा संचित</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाचन </span><span style=\"font-weight:bold;font-family:'Mangal'\">एंज़ाइमों</span><span style=\"font-family:'Mangal'\"> पर निर्भर है, और एंज़ाइम अपनी क्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विशिष्ट</span><span style=\"font-family:'Mangal'\"> होते हैं: एक एंज़ाइम केवल कुछ विशेष पदार्थों को ही तोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हमारे पास </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोयले को तोड़ने वाला कोई एंज़ाइम नहीं</span><span style=\"font-family:'Mangal'\"> है, अतः उसे खाने से ऊर्जा नहीं मिलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी विशिष्टता के कारण जिन पदार्थों को जैविक प्रक्रम नहीं तोड़ पाते, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अजैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हमारे एंज़ाइम कोयले को तोड़ नहीं सकते </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह समुच्चय चुनिए जिसकी संख्याएँ उसी प्रकार संबंधित हैं जिस प्रकार निम्नलिखित समुच्चयों की संख्याएँ संबंधित हैं। (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 33, 4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 56, 5)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 41, 5)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 27, 2)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(11, 96, 6)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(10, 84, 4)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 33, 4): (7 × 7) − (4 × 4) = 49 − 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 56, 5): (9 × 9) − (5 × 5) = 81 − 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">56</span><span style=\"font-family:'Mangal'\"> → नियम: दूसरी संख्या = (पहली × पहली) − (तीसरी × तीसरी)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 41, 5): (8 × 8) − (5 × 5) = 64 − 25 = 39 है, 41 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 27, 2): (6 × 6) − (2 × 2) = 36 − 4 = 32 है, 27 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(11, 96, 6): (11 × 11) − (6 × 6) = 121 − 36 = 85 है, 96 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(10, 84, 4): (10 × 10) − (4 × 4) = 100 − 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समुच्चय </span><span style=\"font-weight:bold;font-family:'Mangal'\">(10, 84, 4) (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख किए बच्चों की एक पंक्ति में लीना बाएँ छोर से 11वें और मोहित बाएँ छोर से 26वें स्थान पर है। मोहित, लीना और निखिल के ठीक मध्य में है। यदि निखिल पंक्ति के दाएँ छोर से 9वें स्थान पर है, तो पंक्ति में कितने बच्चे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लीना बाएँ से 11वें और मोहित 26वें स्थान पर है → मोहित, लीना के दाईं ओर 26 − 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span><span style=\"font-family:'Mangal'\"> स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोहित ठीक मध्य में है, अतः निखिल भी मोहित के दाईं ओर 15 स्थान पर है → निखिल = 26 + 15 = बाएँ से </span><span style=\"font-weight:bold;font-family:'Mangal'\">41वाँ</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निखिल दाएँ छोर से 9वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल = (बाएँ से स्थान + दाएँ से स्थान) − 1 = 41 + 9 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span><span style=\"font-family:'Mangal'\">, क्योंकि निखिल की गणना दोनों स्थानों में होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(50 में निखिल दो बार गिना गया है; 41 केवल बाएँ से निखिल का स्थान है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पंक्ति में </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बच्चे हैं।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित समीकरण को सही बनाने के लिए किन दो संख्याओं को आपस में बदलना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(56 ÷ 14) × 3 + 7 × 9 − 15 × 5 + 28 = 103</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(नोट: पूरी संख्या को बदला जाना चाहिए, किसी संख्या के अलग-अलग अंकों को नहीं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 और 14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 और 14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 और 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 और 28</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक विकल्प जाँचें: दोनों पूर्ण संख्याओं को आपस में बदलकर BODMAS लागू करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A (7 और 14): (56 ÷ 7) × 3 + 14 × 9 − 15 × 5 + 28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 8 × 3 + 126 − 75 + 28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 24 + 126 − 75 + 28 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">103</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B (28 और 14): (56 ÷ 28) × 3 + 7 × 9 − 15 × 5 + 14 = 6 + 63 − 75 + 14 = 8 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C (5 और 7): (56 ÷ 14) × 3 + 5 × 9 − 15 × 7 + 28 = 12 + 45 − 105 + 28 = −20 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D (56 और 28): (28 ÷ 14) × 3 + 7 × 9 − 15 × 5 + 56 = 6 + 63 − 75 + 56 = 50 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आपस में बदली जाने वाली संख्याएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 और 14 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वरुण बिंदु M से चलकर 8 km दक्षिण की ओर गाड़ी चलाता है। फिर वह बाएँ मुड़कर 10 km चलाता है, फिर बाएँ मुड़कर 3 km चलाता है। फिर वह दाएँ मुड़कर 5 km चलाता है। फिर वह दाएँ मुड़कर 7 km चलाता है। अंत में वह दाएँ मुड़कर 15 km चलाता है और बिंदु Y पर रुक जाता है। बिंदु M के सापेक्ष बिंदु Y कितनी दूरी (न्यूनतम दूरी) पर और किस दिशा में है? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km पूर्व की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km पूर्व की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km दक्षिण की ओर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km दक्षिण की ओर</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km दक्षिण → (0, −8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाईं ओर मुड़ना → पूर्व, 10 km → (10, −8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके बाईं ओर मुड़ना → उत्तर, 3 km → (10, −5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 5 km → (15, −5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके दाईं ओर मुड़ना → दक्षिण, 7 km → (15, −12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके दाईं ओर मुड़ना → पश्चिम, 15 km → Y = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, −12</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y, M वाली उत्तर-दक्षिण रेखा पर ही M से 12 km नीचे है → Y, M से </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km दक्षिण</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु Y, बिंदु M से </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km दक्षिण की ओर (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह सही विकल्प चुनिए जिसे रिक्त स्थानों में उसी क्रम में भरने पर शृंखला तार्किक रूप से पूर्ण हो जाएगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EF_D IJ_H _NKL QR_P U_ST</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGMOU</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CHMOV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGMPV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGMOV</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला को चार-चार अक्षरों के पाँच समूहों में बाँटें: EF_D, IJ_H, _NKL, QR_P, U_ST.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह में </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार क्रमागत अक्षर</span><span style=\"font-family:'Mangal'\"> तीसरा, चौथा, पहला, दूसरा के क्रम में लिखे गए हैं, और समूहों के पहले अक्षर (C, G, K, O, S) हर बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> बढ़ते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CDEF → </span><span style=\"font-weight:bold;font-family:'Mangal'\">EFCD</span><span style=\"font-family:'Mangal'\">, GHIJ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">IJGH</span><span style=\"font-family:'Mangal'\">, KLMN → </span><span style=\"font-weight:bold;font-family:'Mangal'\">MNKL</span><span style=\"font-family:'Mangal'\">, OPQR → </span><span style=\"font-weight:bold;font-family:'Mangal'\">QROP</span><span style=\"font-family:'Mangal'\">, STUV → </span><span style=\"font-weight:bold;font-family:'Mangal'\">UVST</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रिक्त स्थानों में क्रम से </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\"> आएँगे → CGMOV</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGMOU, CHMOV और DGMPV में कम से कम एक रिक्त स्थान पर गलत अक्षर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही विकल्प </span><span style=\"font-weight:bold;font-family:'Mangal'\">CGMOV (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BGEJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPNS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MRPV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UZXC</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BGEJ: B + 5 = G, G − 2 = E, E + 5 = J → (+5, −2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPNS: K + 5 = P, P − 2 = N, N + 5 = S → (+5, −2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UZXC: U + 5 = Z, Z − 2 = X, X + 5 = C (24 + 5 = 29 → 29 − 26 = 3 = C) → (+5, −2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MRPV: M + 5 = R, R − 2 = P, P + 6 = V → (+5, −2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+6</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+5, −2, +5) का पालन करते हैं; केवल MRPV नहीं (P + 5 = U होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">MRPV (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रश्न दिए गए शब्दों पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SUN ICE TOP HUT</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक शब्द में, प्रत्येक स्वर को अंग्रेज़ी वर्णमाला क्रम में उसके ठीक पहले वाले अक्षर से और प्रत्येक व्यंजन को उसके ठीक बाद वाले अक्षर से बदल दिया जाता है। इस प्रकार बने कितने अक्षर-समूहों में कोई स्वर नहीं होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वर → उसके ठीक पहले वाला अक्षर; व्यंजन → उसके ठीक बाद वाला अक्षर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SUN: S → T, U → T, N → O → </span><span style=\"font-weight:bold;font-family:'Mangal'\">TTO</span><span style=\"font-family:'Mangal'\"> (O स्वर है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ICE: I → H, C → D, E → D → </span><span style=\"font-weight:bold;font-family:'Mangal'\">HDD</span><span style=\"font-family:'Mangal'\"> (कोई स्वर नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TOP: T → U, O → N, P → Q → </span><span style=\"font-weight:bold;font-family:'Mangal'\">UNQ</span><span style=\"font-family:'Mangal'\"> (U स्वर है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HUT: H → I, U → T, T → U → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ITU</span><span style=\"font-family:'Mangal'\"> (I और U स्वर हैं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल HDD में कोई स्वर नहीं है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर GOLD, TLOW से एक निश्चित प्रकार से संबंधित है। उसी प्रकार FAME, UZNV से संबंधित है। उसी तर्क के अनुसार SILK दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HROP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HRPO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FVYX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HQOP</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GOLD → TLOW: G (7) + T (20) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\">, O (15) + L (12) = 27, L (12) + O (15) = 27, D (4) + W (23) = 27</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक अक्षर को उसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत अक्षर</span><span style=\"font-family:'Mangal'\"> से बदला गया है: स्थान n वाला अक्षर स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">27 − n</span><span style=\"font-family:'Mangal'\"> वाले अक्षर में बदलता है (A ↔ Z, B ↔ Y, …)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FAME → UZNV: F (6) → 27 − 6 = 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, A (1) → 27 − 1 = 26 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">, M (13) → 27 − 13 = 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\">, E (5) → 27 − 5 = 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SILK: S (19) → 27 − 19 = 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, I (9) → 27 − 9 = 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, L (12) → 27 − 12 = 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, K (11) → 27 − 11 = 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\"> → HROP</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FVYX, SILK को +13 स्थान आगे ले जाने से बनता है, जो एक अलग नियम है (GOLD के लिए यह O + 13 = 28 → 2 = B देता, L नहीं); HRPO और HQOP में एक-एक अक्षर पर नियम टूटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः SILK, </span><span style=\"font-weight:bold;font-family:'Mangal'\">HROP (विकल्प A)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिंदु P से 30 m दक्षिण की ओर चलने के बाद मीना बाएँ मुड़ती है और 25 m चलती है। फिर वह पुनः बाएँ मुड़ती है और 45 m चलकर बिंदु Q पर रुक जाती है। बिंदु Q के सापेक्ष बिंदु P किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पश्चिम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पश्चिम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 m दक्षिण → (0, −30)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाईं ओर मुड़ना → पूर्व, 25 m → (25, −30)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके बाईं ओर मुड़ना → उत्तर, 45 m → Q = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">25, 15</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P से 25 m पूर्व और 15 m उत्तर में है, अतः Q, P के उत्तर-पूर्व में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रश्न में Q के सापेक्ष P की दिशा पूछी गई है, जो इसकी विपरीत दिशा है → P, Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पश्चिम</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(उत्तर-पूर्व, P के सापेक्ष Q की दिशा है, जो पूछे गए का उल्टा है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु P, बिंदु Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पश्चिम (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, O की माता है। O, J की बहन है। T, K की पुत्री है। T, J की बहन है। J, B का पिता है। B, F की पत्नी है। M का K से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O, J की बहन है और T, J की बहन है → O, J और T भाई-बहन हैं, अतः उनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता-पिता समान</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, O की माता है → M, J और T की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, K की पुत्री है → K भी T के माता-पिता में से एक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः T के माता-पिता M (माता) और K हैं; एक ही संतान के माता-पिता पति-पत्नी होते हैं → K, T का पिता है और M, K की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्नी</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(J, B का पिता है और B, F की पत्नी है: ये तथ्य M और K के संबंध को नहीं बदलते।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः M, K की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्नी (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई अक्षर और प्रतीक शृंखला को देखिए और प्रश्न का उत्तर दीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) K # D R &amp; M @ T B % H $ Q W ? E Z + N J (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि सभी प्रतीक हटा दिए जाएँ, तो अंग्रेज़ी वर्णमाला शृंखला में दाएँ छोर से चौथे अक्षर और बाएँ छोर से चौथे अक्षर के बीच कितने अक्षर हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला से प्रतीक (#, &amp;, @, %, $, ?, +) हटाएँ:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) </span><span style=\"font-weight:bold;font-family:'Mangal'\">K D R M T B H Q W E Z N J</span><span style=\"font-family:'Mangal'\"> (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ छोर से चौथा: J (पहला), N (दूसरा), Z (तीसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> (चौथा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ छोर से चौथा: K (पहला), D (दूसरा), R (तीसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> (चौथा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला में E = 5 और M = 13 है, अतः इनके बीच के अक्षर F, G, H, I, J, K, L हैं → 13 − 5 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अक्षरों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BBX ECU HDR KEO ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MKI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NMB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NFL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NHG</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: B → E → H → K: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → K + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: B → C → D → E: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\"> → E + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: X → U → R → O: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\"> → O − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MKI, NMB और NHG में तीनों में से कम से कम एक चरण टूटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">NFL (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 4 10 33 136 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">680</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">681</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">685</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">690</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक पद की तुलना उसके पिछले पद से करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 = (3 × 1) + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 = (4 × 2) + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33 = (10 × 3) + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">136 = (33 × 4) + 4 → नियम: अगला पद = (पिछला पद × n) + n, जहाँ n = 1, 2, 3, 4, …</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला पद = (136 × 5) + 5 = 680 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">685</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(680 में + 5 वाला चरण छूट गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">685 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IFH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QOP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JGI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZWY</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IFH: I − 3 = F, F + 2 = H → (−3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JGI: J − 3 = G, G + 2 = I → (−3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZWY: Z − 3 = W, W + 2 = Y → (−3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QOP: Q − 2 = O, O + 1 = P → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">−2, +1</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (−3, +2) का पालन करते हैं; केवल QOP नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">QOP (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘+’ और ‘÷’ को आपस में बदल दिया जाए तथा ‘−’ और ‘×’ को आपस में बदल दिया जाए, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 + 8 × 5 ÷ 7 − 3 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्न बदलें: 96 ÷ 8 − 5 + 7 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (+ और − से पहले ÷ और ×): 96 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\">; 7 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 12 − 5 + 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रश्न में संख्याओं/प्रतीकों के एक समूह को नीचे दी गई तालिका और उसके बाद दी गई शर्तों के अनुसार अक्षर-कूटों से कूटबद्ध किया गया है। यदि कोई भी शर्त लागू नहीं होती, तो कूट सीधे तालिका से लिए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789980275164_image001.png\" width=\"269\" height=\"33\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><sp
