/span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Planets are much closer and are seen as </span><span style=\"font-weight:bold;font-family:'Mangal'\">extended sources</span><span style=\"font-family:'Mangal'\">, which are a collection of many point sources; the variations in light from these sources </span><span style=\"font-weight:bold;font-family:'Mangal'\">average out to zero</span><span style=\"font-family:'Mangal'\">, nullifying the twinkling → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So planets </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not twinkle</span><span style=\"font-family:'Mangal'\">, even though they are closer to the Earth → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A potted plant kept near a window bends towards the light coming from one side. Which of the following correctly describes the role of auxin in this bending?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Auxin collects on the lit side of the shoot and makes those cells grow longer</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Auxin is destroyed by light, so the lit side of the shoot stops growing</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Auxin is synthesised at the root tip and moves up to the shoot to cause bending</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Auxin diffuses towards the shady side of the shoot and stimulates those cells to grow longer, so the shoot bends towards the light</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Auxin</span><span style=\"font-family:'Mangal'\"> is a plant hormone synthesised at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">shoot tip</span><span style=\"font-family:'Mangal'\"> that helps cells grow longer; like other plant hormones it diffuses to the area where it acts.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When light comes from one side, auxin </span><span style=\"font-weight:bold;font-family:'Mangal'\">diffuses towards the shady side</span><span style=\"font-family:'Mangal'\"> of the shoot.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The higher concentration of auxin on the shady side stimulates those cells to </span><span style=\"font-weight:bold;font-family:'Mangal'\">grow longer</span><span style=\"font-family:'Mangal'\">, so the shoot appears to bend </span><span style=\"font-weight:bold;font-family:'Mangal'\">towards the light</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, auxin moves to the shady side and makes those cells elongate </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): During a thunderstorm, lightning is seen before the thunder is heard.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Sound waves are longitudinal waves.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light travels at about 3 × 10⁸ m/s, while sound travels in air at only about 340 m/s; so the light from the lightning reaches us almost instantly and the thunder arrives later → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a sound wave the particles of the medium vibrate </span><span style=\"font-weight:bold;font-family:'Mangal'\">parallel</span><span style=\"font-family:'Mangal'\"> to the direction of propagation, so sound waves are </span><span style=\"font-weight:bold;font-family:'Mangal'\">longitudinal</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But the delay is due to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">much lower speed of sound</span><span style=\"font-family:'Mangal'\"> compared with light, not due to the longitudinal nature of sound waves → R does not explain A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A milkman adds a very small amount of baking soda to fresh milk (pH about 6). Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pH of the milk falls below 6 and it sets into curd faster</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pH shifts to slightly alkaline, so the lactic acid formed is neutralised and the milk takes longer to set as curd</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Baking soda is acidic, so it speeds up the formation of lactic acid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pH of the milk remains 6 because baking soda is a neutral salt</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fresh milk has a pH of about 6; as it turns into curd, </span><span style=\"font-weight:bold;font-family:'Mangal'\">lactic acid</span><span style=\"font-family:'Mangal'\"> is formed and its pH </span><span style=\"font-weight:bold;font-family:'Mangal'\">decreases</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Baking soda (sodium hydrogencarbonate, NaHCO₃) is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">mild, non-corrosive basic salt</span><span style=\"font-family:'Mangal'\">, so adding it shifts the pH of the milk from 6 to </span><span style=\"font-weight:bold;font-family:'Mangal'\">slightly alkaline</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the alkaline condition the lactic acid produced is </span><span style=\"font-weight:bold;font-family:'Mangal'\">neutralised</span><span style=\"font-family:'Mangal'\">, so the milk takes </span><span style=\"font-weight:bold;font-family:'Mangal'\">longer to set</span><span style=\"font-family:'Mangal'\"> as curd (this is why the milkman adds it, to keep the milk from curdling quickly).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pH becomes slightly alkaline and the milk takes longer to set </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Tendons connect one bone to another bone at a joint.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Tendons are strong, flexible bands of tough connective tissue that transmit the force of muscle contraction to the bone.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Tendons</span><span style=\"font-family:'Mangal'\"> connect </span><span style=\"font-weight:bold;font-family:'Mangal'\">muscles to bones</span><span style=\"font-family:'Mangal'\">; it is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ligaments</span><span style=\"font-family:'Mangal'\"> that connect bone to bone at a joint → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A tendon is a strong, flexible band of tough connective tissue; when a muscle contracts, the tendon transmits this force to the bone, producing movement at the joint → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The near point of a hypermetropic eye is 1 m. The power of the lens required to enable the person to read a book kept at 25 cm (the near point of a normal eye) is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−3 D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+3 D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+1 D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+4 D</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The corrective lens must form a </span><span style=\"font-weight:bold;font-family:'Mangal'\">virtual image</span><span style=\"font-family:'Mangal'\"> of the book (kept at 25 cm) at the person's near point, </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 m</span><span style=\"font-family:'Mangal'\">, on the same side as the book.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Object distance u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−25 cm</span><span style=\"font-family:'Mangal'\">, image distance v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−100 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lens formula: 1/f = 1/v − 1/u = −1/100 + 1/25 = (−1 + 4) ÷ 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/100</span><span style=\"font-family:'Mangal'\"> → f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+33.3 cm</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.333 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Power P = 1/f = 1 ÷ 0.333 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3 D</span><span style=\"font-family:'Mangal'\">; the positive sign shows a </span><span style=\"font-weight:bold;font-family:'Mangal'\">convex (converging)</span><span style=\"font-family:'Mangal'\"> lens, as expected for hypermetropia.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required power is +3 D </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about pollination:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In wind-pollinated plants such as wheat, maize and rice, the pollen grains are light and small and are produced in large numbers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In wind-pollinated plants, the stigma is long and feathery to trap pollen grains.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In insect-pollinated flowers, the pollen grains are large, sticky or spiny so that they can attach to the body of the insect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Wind pollination is seen in wheat, maize and rice; their pollen grains are </span><span style=\"font-weight:bold;font-family:'Mangal'\">light, small and produced in large numbers</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In wind-pollinated plants the stigma is </span><span style=\"font-weight:bold;font-family:'Mangal'\">long and feathery</span><span style=\"font-family:'Mangal'\"> to trap the pollen → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In insect pollination the pollen grains are </span><span style=\"font-weight:bold;font-family:'Mangal'\">large, sticky or spiny</span><span style=\"font-family:'Mangal'\"> to attach to the insect's body, and the stigma is also sticky → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three atomic species have the following composition: X has 18 protons and 19 neutrons; Y has 17 protons and 18 neutrons; Z has 17 protons and 20 neutrons. Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y and Z are isobars, and Z and X are isotopes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X and Y are isotopes of the same element</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X, Y and Z are all isotopes of the same element</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y and Z are isotopes of the same element, and Z and X are isobars</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mass number A = protons + neutrons: X = 18 + 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\">; Y = 17 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35</span><span style=\"font-family:'Mangal'\">; Z = 17 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Y and Z</span><span style=\"font-family:'Mangal'\"> have the same atomic number (17, chlorine) but different mass numbers (35 and 37) → they are </span><span style=\"font-weight:bold;font-family:'Mangal'\">isotopes</span><span style=\"font-family:'Mangal'\"> of the same element.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Z and X</span><span style=\"font-family:'Mangal'\"> have the same mass number (37) but different atomic numbers (17 and 18) → they are </span><span style=\"font-weight:bold;font-family:'Mangal'\">isobars</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X (18 protons, argon) is a different element from Y and Z, so it cannot be their isotope.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Y and Z are isotopes and Z and X are isobars </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zinc carbonate ore is heated strongly in a limited supply of air: ZnCO₃(s) → ZnO(s) + CO₂(g). This step in the extraction of zinc is called:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Roasting</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electrolytic reduction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcination</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electrolytic refining</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Metals in the middle of the activity series (Zn, Fe, Pb, Cu) occur mainly as sulphides or carbonates, and it is easier to obtain a metal from its </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxide</span><span style=\"font-family:'Mangal'\">, so these ores are first converted into oxides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Carbonate ores</span><span style=\"font-family:'Mangal'\"> are converted into oxides by heating strongly in </span><span style=\"font-weight:bold;font-family:'Mangal'\">limited air</span><span style=\"font-family:'Mangal'\">; this is </span><span style=\"font-weight:bold;font-family:'Mangal'\">calcination</span><span style=\"font-family:'Mangal'\">: ZnCO₃(s) → ZnO(s) + CO₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(</span><span style=\"font-weight:bold;font-family:'Mangal'\">Sulphide ores</span><span style=\"font-family:'Mangal'\"> are converted into oxides by heating strongly in </span><span style=\"font-weight:bold;font-family:'Mangal'\">excess air</span><span style=\"font-family:'Mangal'\">; that is </span><span style=\"font-weight:bold;font-family:'Mangal'\">roasting</span><span style=\"font-family:'Mangal'\">: 2ZnS + 3O₂ → 2ZnO + 2SO₂.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The oxide is later reduced with carbon (ZnO + C → Zn + CO); electrolytic refining is a purification step after extraction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the step is calcination </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about magnetic field lines:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Inside a bar magnet, the direction of the field lines is from its south pole to its north pole.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. No two magnetic field lines cross each other, because at the point of intersection a compass needle would have to point in two directions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The magnetic field is weaker in the region where the field lines are crowded together.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. By convention field lines emerge from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">north pole</span><span style=\"font-family:'Mangal'\"> and merge at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">south pole</span><span style=\"font-family:'Mangal'\"> outside the magnet; </span><span style=\"font-weight:bold;font-family:'Mangal'\">inside</span><span style=\"font-family:'Mangal'\"> the magnet they run from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">south pole to the north pole</span><span style=\"font-family:'Mangal'\">, making closed curves → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Two field lines never </span><span style=\"font-weight:bold;font-family:'Mangal'\">cross</span><span style=\"font-family:'Mangal'\">, because at the crossing point the compass needle would point in </span><span style=\"font-weight:bold;font-family:'Mangal'\">two directions</span><span style=\"font-family:'Mangal'\">, which is not possible → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">closeness</span><span style=\"font-family:'Mangal'\"> of the field lines shows the relative </span><span style=\"font-weight:bold;font-family:'Mangal'\">strength</span><span style=\"font-family:'Mangal'\"> of the field: the field is </span><span style=\"font-weight:bold;font-family:'Mangal'\">stronger</span><span style=\"font-family:'Mangal'\"> where the lines are crowded → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the prefix system used for naming covalent compounds, which of the following names is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H₂S – dihydrogen sulfide</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CS₂ – carbon disulfide</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SF₆ – sulfur pentafluoride</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PCl₃ – monophosphorus trichloride</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Prefixes mono- (1), di- (2), tri- (3), tetra- (4), penta- (5), hexa- (6) show the number of atoms of each element; the prefix </span><span style=\"font-weight:bold;font-family:'Mangal'\">mono-</span><span style=\"font-family:'Mangal'\"> is usually </span><span style=\"font-weight:bold;font-family:'Mangal'\">omitted for the first element</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">CS₂</span><span style=\"font-family:'Mangal'\">: one carbon and two sulfur atoms → </span><span style=\"font-weight:bold;font-family:'Mangal'\">carbon disulfide</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H₂S: when </span><span style=\"font-weight:bold;font-family:'Mangal'\">hydrogen is the first element</span><span style=\"font-family:'Mangal'\">, no prefix is added before it → </span><span style=\"font-weight:bold;font-family:'Mangal'\">hydrogen sulfide</span><span style=\"font-family:'Mangal'\">, not dihydrogen sulfide → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SF₆ has six fluorine atoms → sulfur </span><span style=\"font-weight:bold;font-family:'Mangal'\">hexa</span><span style=\"font-family:'Mangal'\">fluoride, not pentafluoride; PCl₃ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">phosphorus trichloride</span><span style=\"font-family:'Mangal'\">, without mono- → both incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct name is CS₂ – carbon disulfide </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the placenta in human beings:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The placenta is a disc embedded in the uterine wall.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. It contains villi on the embryo's side and blood spaces on the mother's side, providing a large surface area for glucose and oxygen to pass from the mother to the embryo.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Waste substances generated by the developing embryo are removed by transferring them into the mother's blood through the placenta.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The embryo gets nutrition from the mother's blood with the help of a special tissue, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">placenta</span><span style=\"font-family:'Mangal'\">, which is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">disc embedded in the uterine wall</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The placenta has </span><span style=\"font-weight:bold;font-family:'Mangal'\">villi</span><span style=\"font-family:'Mangal'\"> on the embryo's side and </span><span style=\"font-weight:bold;font-family:'Mangal'\">maternal blood spaces</span><span style=\"font-family:'Mangal'\"> on the mother's side, giving a </span><span style=\"font-weight:bold;font-family:'Mangal'\">large surface area</span><span style=\"font-family:'Mangal'\"> for glucose and oxygen to pass to the embryo → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">wastes</span><span style=\"font-family:'Mangal'\"> of the embryo are also removed through the placenta into the </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's blood</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A flower that contains either stamens or a pistil, but not both, is called unisexual. Which of the following pairs of plants bears unisexual flowers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Papaya and watermelon</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hibiscus and mustard</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Papaya and Hibiscus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mustard and watermelon</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stamens (male part) and the pistil (female part) are the reproductive parts of a flower and contain the germ-cells.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A flower with </span><span style=\"font-weight:bold;font-family:'Mangal'\">either</span><span style=\"font-family:'Mangal'\"> stamens </span><span style=\"font-weight:bold;font-family:'Mangal'\">or</span><span style=\"font-family:'Mangal'\"> a pistil is </span><span style=\"font-weight:bold;font-family:'Mangal'\">unisexual</span><span style=\"font-family:'Mangal'\">, as in </span><span style=\"font-weight:bold;font-family:'Mangal'\">papaya</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">watermelon</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A flower with </span><span style=\"font-weight:bold;font-family:'Mangal'\">both</span><span style=\"font-family:'Mangal'\"> stamens and pistil is </span><span style=\"font-weight:bold;font-family:'Mangal'\">bisexual</span><span style=\"font-family:'Mangal'\">, as in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hibiscus</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">mustard</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair with unisexual flowers is papaya and watermelon </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about combinations of resistors:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In a series combination, the same current flows through each resistor.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In a parallel combination, the potential difference across each resistor is the same.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The equivalent resistance of a parallel combination is greater than the largest of the individual resistances.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In a </span><span style=\"font-weight:bold;font-family:'Mangal'\">series</span><span style=\"font-family:'Mangal'\"> circuit the current is the same in every part, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">same current</span><span style=\"font-family:'Mangal'\"> flows through each resistor (and the total potential difference is the sum V₁ + V₂ + V₃) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In a </span><span style=\"font-weight:bold;font-family:'Mangal'\">parallel</span><span style=\"font-family:'Mangal'\"> combination each resistor is connected across the same two points, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">potential difference across each is the same</span><span style=\"font-family:'Mangal'\"> (and the total current is I₁ + I₂ + I₃) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In a parallel combination 1/Rₚ = 1/R₁ + 1/R₂ + …, so the total resistance is </span><span style=\"font-weight:bold;font-family:'Mangal'\">decreased</span><span style=\"font-family:'Mangal'\">; it is less than each of the individual resistances (in series it is greater than any individual resistance) → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A coconut of mass 1.5 kg falls from a height of 10 m onto wet sand and comes to rest after making a depression in the sand. If the sand exerts an average resistive force of 3000 N and all the energy of the coconut goes into making the depression, the depth of the depression is (g = 10 m/s²):</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Energy of the coconut just before hitting the sand = potential energy lost = </span><span style=\"font-weight:bold;font-family:'Mangal'\">mgh</span><span style=\"font-family:'Mangal'\"> = 1.5 × 10 × 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 J</span><span style=\"font-family:'Mangal'\"> (by conservation of mechanical energy, this equals its kinetic energy at the sand).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By the </span><span style=\"font-weight:bold;font-family:'Mangal'\">work-energy theorem</span><span style=\"font-family:'Mangal'\">, the work done by the resistive force of the sand equals this energy: F × d = 150 J.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 150 ÷ 3000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.05 m</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the depth of the depression is 5 cm </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about bacteria in the nitrogen cycle:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Nitrosomonas converts ammonia into nitrite (NO₂⁻).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Nitrobacter converts nitrite into nitrate (NO₃⁻); this process is called nitrification.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Pseudomonas converts nitrates into ammonia; this process is called denitrification.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Nitrifying bacteria like </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nitrosomonas</span><span style=\"font-family:'Mangal'\"> convert ammonia into </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrite</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nitrobacter</span><span style=\"font-family:'Mangal'\"> converts nitrite into </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrate</span><span style=\"font-family:'Mangal'\">; the conversion of ammonia to nitrite and nitrate is </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrification</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Denitrifying bacteria such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pseudomonas</span><span style=\"font-family:'Mangal'\"> convert nitrates back into </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrogen gas (N₂)</span><span style=\"font-family:'Mangal'\">, not into ammonia; this denitrification completes the cycle → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which pair of cell organelles contains its own DNA and ribosomes, a feature suggesting that they share an evolutionary history with single-celled organisms?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mitochondria and chloroplasts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Golgi apparatus and lysosomes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ribosomes and endoplasmic reticulum</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lysosomes and vacuoles</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Mitochondria</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">plastids (chloroplasts)</span><span style=\"font-family:'Mangal'\"> have features similar to certain bacteria: both have their </span><span style=\"font-weight:bold;font-family:'Mangal'\">own DNA and ribosomes</span><span style=\"font-family:'Mangal'\"> and can make some of their own proteins.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These characteristics suggest that both share an evolutionary history with single-celled organisms; both are also double-membrane-bound organelles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ribosomes, Golgi bodies and lysosomes do not contain DNA.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair is mitochondria and chloroplasts </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match the method of vegetative propagation with its description:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733976301_image001.png\" style=\"width: 900px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cutting, grafting, layering and tissue culture are methods adapted from natural vegetative propagation.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) In </span><span style=\"font-weight:bold;font-family:'Mangal'\">grafting</span><span style=\"font-family:'Mangal'\">, a slit is made on a twig of a healthy rooted plant (Plant A) and a stem cutting of another plant/variety (Plant B) is inserted into it &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) In </span><span style=\"font-weight:bold;font-family:'Mangal'\">layering</span><span style=\"font-family:'Mangal'\">, the middle part of a flexible twig (e.g. of lemon) is buried in soil; roots develop in 10&ndash;15 days and the twig is then cut from the parent &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) In </span><span style=\"font-weight:bold;font-family:'Mangal'\">tissue culture</span><span style=\"font-family:'Mangal'\">, healthy plantlets are mass-produced from the shoot tip (apical meristem), which helps eliminate virus-infected plants (e.g. in banana farming) &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-3, (b)-1, (c)-2 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sonar signal sent vertically downwards from a ship is received back after 4 s. If the speed of sound in seawater is 1500 m/s, the depth of the sea at that point is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3000 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6000 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">375 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">750 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sonar signal travels from the ship to the sea bed and </span><span style=\"font-weight:bold;font-family:'Mangal'\">back</span><span style=\"font-family:'Mangal'\">, so the total time 4 s covers </span><span style=\"font-weight:bold;font-family:'Mangal'\">twice</span><span style=\"font-family:'Mangal'\"> the depth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time to reach the sea bed = 4 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Depth = speed × time = 1500 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3000 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Using the full 4 s would give 6000 m, which is the total distance travelled, not the depth.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the depth of the sea is 3000 m </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following pairs consists only of natural ecosystems?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Garden and pond</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Crop-field and forest</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Forest and lake</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aquarium and pond</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An ecosystem consists of all the interacting organisms in an area together with the non-living components of the environment.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Forests, ponds and lakes</span><span style=\"font-family:'Mangal'\"> are </span><span style=\"font-weight:bold;font-family:'Mangal'\">natural</span><span style=\"font-family:'Mangal'\"> ecosystems.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Gardens, crop-fields and aquariums</span><span style=\"font-family:'Mangal'\"> are </span><span style=\"font-weight:bold;font-family:'Mangal'\">human-made (artificial)</span><span style=\"font-family:'Mangal'\"> ecosystems.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair of natural ecosystems is forest and lake </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध ीियथ यी धnधनgद in ोn धcयौदौपधं:1. Tुध ीियथ यी धnधनgद in ोn धcयौदौपधं iौ हniकiनधcपiयnोि.2. Gनधधn ूिोnपौ in ो पधननधौपनiोि धcयौदौपधं cोूपहनध ोृयहप 1% यी पुध धnधनgद यी ौहnिigुप पुोप ीोििस यn पुधiन िधोॅधौ.3. Fययक cुोinौ gधnधनोििद cयnौiौप यी यnिद पुनधध यन ीयहन ौपधूौ, ृधcोहौध ॅधनद िiपिपध हौोृिध धnधनgद नधंोinौ ोीपधन ीयहन पनयूुic िधॅिधस.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Energy captured by autotrophs does not revert to the solar input, and energy passed to herbivores does not come back to the autotrophs; the flow is </span><span style=\"font-weight:bold;font-family:'Mangal'\">unidirectional</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Green plants capture about </span><span style=\"font-weight:bold;font-family:'Mangal'\">1%</span><span style=\"font-family:'Mangal'\"> of the sunlight falling on their leaves and convert it into food energy → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Only about 10% of the energy passes to the next trophic level, so the loss at each step is so great that very little usable energy remains after </span><span style=\"font-weight:bold;font-family:'Mangal'\">four</span><span style=\"font-family:'Mangal'\"> trophic levels; hence food chains have only </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 or 4 steps</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A dentist uses a mirror to see an enlarged image of a patient's tooth. The mirror used and the position of the tooth relative to the mirror are:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave mirror, with the tooth between the pole and the principal focus</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A convex mirror, with the tooth anywhere in front of it</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave mirror, with the tooth between the principal focus and the centre of curvature</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A plane mirror, with the tooth very close to it</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dentists use </span><span style=\"font-weight:bold;font-family:'Mangal'\">concave mirrors</span><span style=\"font-family:'Mangal'\"> to see large images of the teeth of patients (concave mirrors are also used as shaving mirrors for the same reason).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave mirror gives an </span><span style=\"font-weight:bold;font-family:'Mangal'\">erect and enlarged (virtual)</span><span style=\"font-family:'Mangal'\"> image only when the object is placed </span><span style=\"font-weight:bold;font-family:'Mangal'\">between the pole P and the principal focus F</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the object is between F and C, the image is enlarged but </span><span style=\"font-weight:bold;font-family:'Mangal'\">real and inverted</span><span style=\"font-family:'Mangal'\"> (formed beyond C), which is not suitable for viewing directly; a convex mirror always gives a </span><span style=\"font-weight:bold;font-family:'Mangal'\">diminished</span><span style=\"font-family:'Mangal'\"> image, and a plane mirror gives an image of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">same size</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, a concave mirror with the tooth between P and F </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the refraction of light through a rectangular glass slab:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The emergent ray is parallel to the direction of the incident ray.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. At the surface where the ray passes from glass into air, it bends towards the normal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The emergent ray is shifted sideways with respect to the incident ray (lateral displacement).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The bending at the two parallel faces (air-glass and glass-air) is </span><span style=\"font-weight:bold;font-family:'Mangal'\">equal and opposite</span><span style=\"font-family:'Mangal'\">, so the emergent ray is </span><span style=\"font-weight:bold;font-family:'Mangal'\">parallel</span><span style=\"font-family:'Mangal'\"> to the incident ray → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. On going from a </span><span style=\"font-weight:bold;font-family:'Mangal'\">denser</span><span style=\"font-family:'Mangal'\"> medium (glass) to a </span><span style=\"font-weight:bold;font-family:'Mangal'\">rarer</span><span style=\"font-family:'Mangal'\"> medium (air), light bends </span><span style=\"font-weight:bold;font-family:'Mangal'\">away</span><span style=\"font-family:'Mangal'\"> from the normal (it bends towards the normal when entering glass from air) → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Although parallel, the emergent ray is </span><span style=\"font-weight:bold;font-family:'Mangal'\">shifted sideways</span><span style=\"font-family:'Mangal'\"> slightly; this is </span><span style=\"font-weight:bold;font-family:'Mangal'\">lateral displacement</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During the soft landing of Chandrayaan-3, the Vikram lander had to reduce its velocity. According to Newton's third law, how did firing its engine slow it down?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The engine was fired opposite to the direction of motion, so the exhaust gases pushed the lander forward</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The engine was fired in the direction of motion, so the exhaust gases exerted a force on the lander opposite to its motion</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The engine was switched off so that the Moon's gravity slowed the lander</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The exhaust gases pushed against the lunar surface, and the surface pushed the lander back</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A rocket engine produces gas and expels it; by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Newton's third law</span><span style=\"font-family:'Mangal'\"> the expelled gas exerts an </span><span style=\"font-weight:bold;font-family:'Mangal'\">equal and opposite force</span><span style=\"font-family:'Mangal'\"> on the rocket.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If the engine fires </span><span style=\"font-weight:bold;font-family:'Mangal'\">in the direction of motion</span><span style=\"font-family:'Mangal'\">, the exhaust gases go forward and exert a force on the lander </span><span style=\"font-weight:bold;font-family:'Mangal'\">opposite to its motion</span><span style=\"font-family:'Mangal'\">, slowing it down.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Vikram lander of Chandrayaan-3 used exactly this to reduce its velocity and attain the speed needed for a soft landing near the Moon's south pole.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Firing opposite to the motion would push the lander forward and speed it up.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the engine was fired in the direction of motion </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match the simple machine (lever) with its class:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733976301_image002.png\" width=\"269\" height=\"50\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-2, (c)-3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-3, (c)-1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Wheelbarrow</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Class II lever</span><span style=\"font-family:'Mangal'\">: Load lies between the fulcrum and effort.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Scissors</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Class I lever</span><span style=\"font-family:'Mangal'\">: Fulcrum lies between the load and effort.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Tweezers</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Class III lever</span><span style=\"font-family:'Mangal'\">: Effort lies between the fulcrum and load.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-2, (b)-1, (c)-3 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the reaction 2PbO(s) + C(s) → 2Pb(s) + CO₂(g). Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lead oxide is reduced and carbon is oxidised</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lead oxide is oxidised and carbon is reduced</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lead is oxidised and carbon dioxide is reduced</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both lead oxide and carbon are reduced</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Oxidation</span><span style=\"font-family:'Mangal'\"> is the gain of oxygen (or loss of hydrogen); </span><span style=\"font-weight:bold;font-family:'Mangal'\">reduction</span><span style=\"font-family:'Mangal'\"> is the loss of oxygen (or gain of hydrogen).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">PbO loses oxygen</span><span style=\"font-family:'Mangal'\"> and becomes Pb → lead oxide is </span><span style=\"font-weight:bold;font-family:'Mangal'\">reduced</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Carbon gains oxygen</span><span style=\"font-family:'Mangal'\"> and becomes CO₂ → carbon is </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxidised</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since one reactant is oxidised while the other is reduced, this is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">redox</span><span style=\"font-family:'Mangal'\"> reaction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, lead oxide is reduced and carbon is oxidised </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about plant groups:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Pteridophytes such as ferns have true roots, stems and leaves with vascular tissue (xylem and phloem), but they do not produce seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In gymnosperms, the seeds are not enclosed in fruits and are often exposed on cones.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Like bryophytes and pteridophytes, gymnosperms also require water for fertilisation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Pteridophytes (e.g. ferns) possess </span><span style=\"font-weight:bold;font-family:'Mangal'\">true roots, stems and leaves</span><span style=\"font-family:'Mangal'\"> with </span><span style=\"font-weight:bold;font-family:'Mangal'\">xylem and phloem</span><span style=\"font-family:'Mangal'\">, but they still depend on water for reproduction and </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not produce seeds</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Gymnosperm ('naked seed') seeds are </span><span style=\"font-weight:bold;font-family:'Mangal'\">not enclosed in fruits</span><span style=\"font-family:'Mangal'\"> and are often </span><span style=\"font-weight:bold;font-family:'Mangal'\">exposed on cones</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Gymnosperms </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not require water for fertilisation</span><span style=\"font-family:'Mangal'\">; that is why pines and cycads are well adapted to cold and dry regions → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bottle of aerated drink (carbon dioxide dissolved in water) loses its fizz much faster when kept warm than when kept cold. The reason is that:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ reacts with water faster at high temperature to form a solid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the solubility of a gas in a liquid increases with rise in temperature</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the solubility of a gas in a liquid decreases with rise in temperature, so more CO₂ escapes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">aerated drink is a heterogeneous mixture that separates on warming</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An aerated drink such as soda is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">homogeneous mixture (solution)</span><span style=\"font-family:'Mangal'\"> of carbon dioxide gas in water.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">solubility of a gas</span><span style=\"font-family:'Mangal'\"> dissolved in a liquid generally </span><span style=\"font-weight:bold;font-family:'Mangal'\">decreases</span><span style=\"font-family:'Mangal'\"> with an increase in temperature (for a solid solute in a liquid, solubility generally increases with temperature).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So when the drink is warm, less CO₂ can stay dissolved and more of it escapes as bubbles; the fizz is lost faster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the reason is the decrease in solubility of the gas with rise in temperature </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a survey, an organism Q is found to be multicellular with a filamentous body, to have a cell wall, to lack chlorophyll, and to grow on dead organic matter by absorbing nutrients from it. In the five kingdom classification, Q belongs to the kingdom:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plantae</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fungi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Protista</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Monera</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q is </span><span style=\"font-weight:bold;font-family:'Mangal'\">multicellular</span><span style=\"font-family:'Mangal'\"> with a </span><span style=\"font-weight:bold;font-family:'Mangal'\">cell wall</span><span style=\"font-family:'Mangal'\"> but has </span><span style=\"font-weight:bold;font-family:'Mangal'\">no chlorophyll</span><span style=\"font-family:'Mangal'\">, so it cannot make its own food; it is not a plant (Plantae are autotrophic).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It grows on </span><span style=\"font-weight:bold;font-family:'Mangal'\">dead organic matter</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">absorbs</span><span style=\"font-family:'Mangal'\"> nutrients through its filamentous body (hyphae forming a mycelium). This is the saprophytic mode of nutrition typical of </span><span style=\"font-weight:bold;font-family:'Mangal'\">fungi</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Protista are mostly unicellular eukaryotes,
