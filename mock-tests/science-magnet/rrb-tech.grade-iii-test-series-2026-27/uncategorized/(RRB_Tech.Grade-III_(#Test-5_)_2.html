<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>12.) RRB Tech.Grade-III (#Test-5  - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

old;font-family:'Mangal'\">2,695 m</span><span style=\"font-family:'Mangal'\">) in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Anamalai Hills</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kerala</span><span style=\"font-family:'Mangal'\"> is the highest peak of the Western Ghats and of peninsular India.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Doddabetta</span><span style=\"font-family:'Mangal'\"> (2,637 m) is the highest peak of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nilgiri Hills</span><span style=\"font-family:'Mangal'\"> (Tamil Nadu), slightly lower than Anaimudi.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Mullayanagiri</span><span style=\"font-family:'Mangal'\"> (1,930 m) in the Baba Budan range is the highest peak of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Karnataka</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mahabaleshwar</span><span style=\"font-family:'Mangal'\"> is a hill station in Maharashtra.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the highest peak is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Anaimudi (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On 15 July 2026 the Union Cabinet approved India Semiconductor Mission 2.0 (Semicon 2.0). What is its total outlay?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,27,500 crore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹76,000 crore</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹62,500 crore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,19,353 crore</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">India Semiconductor Mission 2.0 (Semicon 2.0)</span><span style=\"font-family:'Mangal'\"> → approved by the Union Cabinet on </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 July 2026</span><span style=\"font-family:'Mangal'\"> with an outlay of </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,27,500 crore</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Six pillars → chip design; domestic manufacture of semiconductor equipment, materials, chemicals and gases; fab capacity; ATMP/OSAT (assembly, testing, marking, packaging); R&amp;D; talent development.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ISM 1.0 (approved December 2021 with ₹76,000 crore) had sanctioned 12 semiconductor projects.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The same Cabinet meeting approved the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mobile Phone Manufacturing Scheme</span><span style=\"font-family:'Mangal'\"> with ₹62,500 crore.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the outlay is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,27,500 crore (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who assumed charge as the Chief of the Army Staff on 30 June 2026, succeeding General Upendra Dwivedi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Manoj Pande</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Anil Chauhan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Dhiraj Seth</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Admiral Krishna Swaminathan</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">General Dhiraj Seth</span><span style=\"font-family:'Mangal'\"> took over as </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chief of the Army Staff (COAS)</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 June 2026</span><span style=\"font-family:'Mangal'\"> on the superannuation of </span><span style=\"font-weight:bold;font-family:'Mangal'\">General Upendra Dwivedi</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He is from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Armoured Corps</span><span style=\"font-family:'Mangal'\"> (2nd Lancers), the first Armoured Corps officer to head the Army in nearly three decades; he earlier commanded the Southern Command.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Manoj Pande was the COAS before General Dwivedi; General Anil Chauhan served as Chief of Defence Staff.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Admiral Krishna Swaminathan became Chief of the Naval Staff on 31 May 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the new Army Chief is </span><span style=\"font-weight:bold;font-family:'Mangal'\">General Dhiraj Seth (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The inaugural railway line in the Indian subcontinent was opened in 1853 between which two locations?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Patna and Gaya</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jaipur and Ajmer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bombay and Thane</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Surat and Bharuch</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first passenger train in India ran on </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 April 1853</span><span style=\"font-family:'Mangal'\"> from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bori Bunder (Bombay)</span><span style=\"font-family:'Mangal'\"> to </span><span style=\"font-weight:bold;font-family:'Mangal'\">Thane</span><span style=\"font-family:'Mangal'\">, a distance of about </span><span style=\"font-weight:bold;font-family:'Mangal'\">34 km</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The line was built by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Great Indian Peninsula Railway (GIPR)</span><span style=\"font-family:'Mangal'\">, and the train carried about 400 passengers in 14 carriages.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was introduced during the tenure of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lord Dalhousie</span><span style=\"font-family:'Mangal'\">, the then Governor-General, who is regarded as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">father of Indian Railways</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Patna–Gaya, Jaipur–Ajmer and Surat–Bharuch were not the sites of the first railway line.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the first line ran between </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bombay and Thane (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pandit Shivkumar Sharma, who brought a Kashmiri folk instrument to the Hindustani classical concert stage, is associated with which of the following instruments?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Santoor</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sarod</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sitar</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bansuri</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Shivkumar Sharma</span><span style=\"font-family:'Mangal'\"> (1938–2022) is famous for the </span><span style=\"font-weight:bold;font-family:'Mangal'\">santoor</span><span style=\"font-family:'Mangal'\">, a hammered string instrument of Kashmir that he established as a Hindustani classical instrument.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">sarod</span><span style=\"font-family:'Mangal'\"> is associated with Ustad Amjad Ali Khan; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">sitar</span><span style=\"font-family:'Mangal'\"> with Pandit Ravi Shankar.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">bansuri</span><span style=\"font-family:'Mangal'\"> (bamboo flute) is associated with Pandit Hariprasad Chaurasia, with whom Shivkumar Sharma composed film music as the duo \"Shiv-Hari\".</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the instrument is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">santoor (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India's first Vande Bharat Sleeper train, flagged off by the Prime Minister on 17 January 2026, runs between which two stations?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New Delhi and Patna</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Howrah and Guwahati (Kamakhya)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mumbai and Ahmedabad</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Secunderabad and Bengaluru</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vande Bharat Sleeper</span><span style=\"font-family:'Mangal'\"> train runs between </span><span style=\"font-weight:bold;font-family:'Mangal'\">Howrah</span><span style=\"font-family:'Mangal'\"> in West Bengal and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kamakhya station, Guwahati</span><span style=\"font-family:'Mangal'\">, in Assam. PM </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> flagged it off on </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 January 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It has </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 fully air-conditioned coaches</span><span style=\"font-family:'Mangal'\"> in three AC classes (1A, 2A and 3A), a designed speed of up to </span><span style=\"font-weight:bold;font-family:'Mangal'\">180 km/h</span><span style=\"font-family:'Mangal'\">, and is fitted with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">KAVACH</span><span style=\"font-family:'Mangal'\"> safety system.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its first commercial run was from Kamakhya to Howrah on </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 January 2026</span><span style=\"font-family:'Mangal'\">, and the journey took about </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 hours</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the train runs between </span><span style=\"font-weight:bold;font-family:'Mangal'\">Howrah and Guwahati (Kamakhya) (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 22nd edition of which India–US joint military exercise commenced on 15 September 2026 simultaneously at Auli (Uttarakhand) and the Mahajan Field Firing Range (Rajasthan)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vajra Prahar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Tiger Triumph</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yudh Abhyas</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cope India</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Yudh Abhyas</span><span style=\"font-family:'Mangal'\"> is the annual </span><span style=\"font-weight:bold;font-family:'Mangal'\">India–US Army</span><span style=\"font-family:'Mangal'\"> joint exercise; its </span><span style=\"font-weight:bold;font-family:'Mangal'\">22nd edition</span><span style=\"font-family:'Mangal'\"> began on </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 September 2026</span><span style=\"font-family:'Mangal'\"> at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Auli Foreign Training Node</span><span style=\"font-family:'Mangal'\"> (Uttarakhand) and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mahajan Field Firing Range</span><span style=\"font-family:'Mangal'\"> (Rajasthan).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">About </span><span style=\"font-weight:bold;font-family:'Mangal'\">600 personnel from each side</span><span style=\"font-family:'Mangal'\"> took part (the Indian Army's 14 Infantry Division and the US Army's 1st Infantry Brigade Combat Team, 11th Airborne Division), with focus on Integrated Battle Groups in mountainous terrain, drones and autonomous systems.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The previous (21st) edition was held at Fort Wainwright, Alaska (USA) in September 2025.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vajra Prahar (special forces), Tiger Triumph (tri-service) and Cope India (air forces) are other India–US exercises.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the exercise is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yudh Abhyas (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Part XVIII of the Constitution of India (Articles 352 to 360) provides for three types of emergencies. Under which Article can the President proclaim a Financial Emergency?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 352</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 356</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 365</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 360</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 360</span><span style=\"font-family:'Mangal'\"> empowers the President to proclaim a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Financial Emergency</span><span style=\"font-family:'Mangal'\"> if the financial stability or credit of India or any part of it is threatened.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 352</span><span style=\"font-family:'Mangal'\"> → National Emergency (war, external aggression or armed rebellion); </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 356</span><span style=\"font-family:'Mangal'\"> → President's Rule in a State (failure of constitutional machinery).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 365</span><span style=\"font-family:'Mangal'\"> only says that a State's failure to comply with Union directions may be treated as failure of constitutional machinery; it is not the emergency provision itself.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A Financial Emergency has </span><span style=\"font-weight:bold;font-family:'Mangal'\">never been proclaimed</span><span style=\"font-family:'Mangal'\"> in India so far.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Article is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 360 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the Environmental Performance Index (EPI) 2026, released by the Yale Center for Environmental Law &amp; Policy and Columbia University, what was India's rank?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180th out of 180 countries</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">176th out of 177 countries</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">105th out of 177 countries</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">133rd out of 180 countries</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">EPI 2026</span><span style=\"font-family:'Mangal'\"> is the biennial index of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yale Center for Environmental Law &amp; Policy</span><span style=\"font-family:'Mangal'\"> and Columbia University's CIESIN, scoring countries on </span><span style=\"font-weight:bold;font-family:'Mangal'\">47 indicators in 12 issue categories</span><span style=\"font-family:'Mangal'\"> (air quality, biodiversity, climate action, etc.).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">India</span><span style=\"font-family:'Mangal'\"> ranked </span><span style=\"font-weight:bold;font-family:'Mangal'\">176th out of 177 countries</span><span style=\"font-family:'Mangal'\"> with a score of </span><span style=\"font-weight:bold;font-family:'Mangal'\">22.46</span><span style=\"font-family:'Mangal'\">; only </span><span style=\"font-weight:bold;font-family:'Mangal'\">Laos</span><span style=\"font-family:'Mangal'\"> (177th) was below India.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Estonia</span><span style=\"font-family:'Mangal'\"> topped the index with a score of 74.79.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In EPI 2022, India had been placed last (180th of 180), a ranking the Environment Ministry had rejected.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, India's rank is </span><span style=\"font-weight:bold;font-family:'Mangal'\">176th out of 177 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 6 years, Rohan will be twice as old as Sita. Three years ago, he was three times as old as Sita. Find Rohan's present age.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 years</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let Sita's present age be x years and Rohan's present age be y years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 6 years: y + 6 = 2(x + 6) → y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2x + 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three years ago: y − 3 = 3(x − 3) → y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3x − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2x + 6 = 3x − 6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = 2 × 12 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: in 6 years 36 = 2 × 18 ✓; three years ago 27 = 3 × 9 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Rohan's present age is </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 years (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ravi covered a distance of 100 km in 10 hours. He walked part of the distance at a speed of 4 km/h and rode a cycle for the rest at 16 km/h. How far did he walk?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the walking time be t hours → cycling time = (10 − t) hours.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance walked = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4t</span><span style=\"font-family:'Mangal'\"> km; distance cycled = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16(10 − t)</span><span style=\"font-family:'Mangal'\"> km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4t + 16(10 − t) = 100 → 4t + 160 − 16t = 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−12t = −60 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">t = 5 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance walked = 4 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: cycled 16 × 5 = 80 km; 20 + 80 = 100 km ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he walked </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 km (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a classroom survey, the average weight of 36 students was recorded as 50 kg. Later, it was found that one student’s weight had been wrongly entered as 73 kg instead of 37 kg. What is the correct average weight of the class?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">47 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 kg</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Recorded total weight = 36 × 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,800 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Error = 73 − 37 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 kg</span><span style=\"font-family:'Mangal'\"> was added extra</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Correct total = 1,800 − 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,764 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Correct average = 1,764 ÷ 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: correct average = 50 − (73 − 37) ÷ 36 = 50 − 1 = 49 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct average weight is </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 kg (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The HCF of two numbers is 18 and their LCM is 540. If one number is 90, find the other number.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For two numbers, product of the numbers = HCF × LCM.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 × other number = 18 × 540 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,720</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Other number = 9,720 ÷ 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">108</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: HCF(90, 108) = 18 and LCM(90, 108) = 540 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: other number = (HCF × LCM) / given number = (18 × 540) ÷ 90 = 108</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the other number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">108 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The distance between the centres of two circles having radii 9 cm and 4 cm is 13 cm. The length of the direct common tangent of the two circles is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 cm</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For circles of radii r₁ and r₂ with centres d apart, length of the direct common tangent = √[d² − (r₁ − r₂)²].</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">r₁ − r₂ = 9 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d² − (r₁ − r₂)² = 13² − 5² = 169 − 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Length = √144 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the length of the direct common tangent is </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A company’s revenue increases by 40% in one quarter and then decreases by 20% in the next. If the initial revenue was ₹1,00,000, what is the final revenue?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,14,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,12,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,08,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,20,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Revenue after the 40% increase = ₹1,00,000 × 140% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,40,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Revenue after the 20% decrease = ₹1,40,000 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: net change = 40 − 20 − (40 × 20 ÷ 100) = +12% → ₹1,00,000 × 112% = ₹1,12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the final revenue is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,12,000 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A hemispherical bowl of internal radius 9 cm is full of juice. The juice is to be poured into cylindrical glasses of diameter 3 cm and height 4 cm. How many glasses are required to empty the bowl completely?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of the hemispherical bowl = (2/3)πr³ = (2/3) × π × 9³ = (2/3) × π × 729 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">486π cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Radius of a glass = 3 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.5 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of one glass = πr²h = π × 1.5² × 4 = π × 2.25 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9π cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of glasses = 486π ÷ 9π = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 glasses (Option B)</span><span style=\"font-family:'Mangal'\"> are required.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: 84 − {45 ÷ (6 × 4 − 15)}</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">81</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">79</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS: solve the innermost bracket first.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 4 − 15 = 24 − 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 ÷ 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">79</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">79 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 3x + 2y = 10 and xy = 3, find the value of 9x² + 4y².</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">76</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">88</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Use (a + b)² = a² + b² + 2ab with a = 3x and b = 2y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3x + 2y)² = 9x² + 4y² + 2 × (3x)(2y) = 9x² + 4y² + </span><span style=\"font-weight:bold;font-family:'Mangal'\">12xy</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10² = 9x² + 4y² + 12 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 = 9x² + 4y² + </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9x² + 4y² = 100 − 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The table shows the electricity consumption (in kWh) of four families over three months.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733459515_image001.png\" width=\"269\" height=\"110\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which family consumed the most electricity over the three months, and how much more (in kWh) did it consume than the family with the lowest consumption?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, and 18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, and 15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, and 27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, and 27</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three-month total of each family:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 120 + 135 + 150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">405 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B = 141 + 130 + 161 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">432 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C = 110 + 150 + 154 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">414 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D = 145 + 125 + 150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">420 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Highest = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B (432)</span><span style=\"font-family:'Mangal'\">, lowest = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (405)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Difference = 432 − 405 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">B, and 27 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A store marks up an item by 50% and then provides a discount of 20% on the marked price. If the final selling price is ₹2,400, what was the cost price (in ₹)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,800</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,050</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the cost price be ₹100.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Marked price = ₹100 × 150% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹150</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price = ₹150 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So selling price = 120% of cost price → cost price = 2,400 ÷ 1.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: SP = CP × 1.5 × 0.8 = 1.2 CP → CP = 2,400 ÷ 1.2 = 2,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the cost price is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,000 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two trains, 310 m and 320 m long, run on parallel tracks in opposite directions. The first runs at 67 km/h and the second at 59 km/h. How long will they take to cross each other?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 seconds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 seconds</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 seconds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 seconds</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Opposite directions → relative speed = 67 + 59 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126 km/h = (126 × 5) ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total distance to cross = 310 + 320 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">630 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time = 630 ÷ 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 seconds</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the trains cross each other in </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 seconds (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cost price of 15 identical pens is ₹450 and the cost price of 6 identical notebooks is ₹240. Find the total cost price (in ₹) of 20 such pens and 9 such notebooks.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">900</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">920</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">980</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">960</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 1 pen = 450 ÷ 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 1 notebook = 240 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 20 pens = 20 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 9 notebooks = 9 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total = 600 + 360 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total cost price is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹960 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The angles of elevation of the top of a tower from two points given on the same straight line and on the same side of the tower are 30° and 60°. If the distance between the two points is 20 m, find the height of the tower.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8√3 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10√3 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the height of the tower be h and the nearer point be x from the foot of the tower.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the nearer point: tan 60° = h ÷ x → √3 = h/x → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = h/√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the farther point: tan 30° = h ÷ (x + 20) → 1/√3 = h/(x + 20) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x + 20 = h√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Subtract: h√3 − h/√3 = 20 → h(3 − 1)/√3 = 20 → 2h/√3 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = 20 × √3 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: for angles 30° and 60°, height = (distance between the points) × √3 ÷ 2 = 20 × √3 ÷ 2 = 10√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the height of the tower is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10√3 m (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arjun bought an article for ₹x. He sold it to Bhavna at a loss of 10%. Bhavna spent ₹120 on its transportation and sold it to Chetan at a profit of 25%. If Chetan bought it for ₹1,500, then what is the value of x?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,080</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,320</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chetan's price is known, so move in reverse: Chetan → Bhavna → Arjun.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bhavna's total cost × 125% = ₹1,500 → Bhavna's total cost = 1,500 ÷ 1.25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bhavna's purchase price = 1,200 − 120 (transport) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,080</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arjun sold at a 10% loss: x × 90% = 1,080 → x = 1,080 ÷ 0.9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a moderately skewed distribution, the mode is 42 and the median is 48. Using the empirical relationship, find the mean.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Empirical relationship: Mode = (3 × Median) − (2 × Mean)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 = (3 × 48) − (2 × Mean)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 = 144 − (2 × Mean) → 2 × Mean = 144 − 42 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">102</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mean = 102 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">51</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: Mean = (3 × Median − Mode) ÷ 2 = (144 − 42) ÷ 2 = 51</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mean is </span><span style=\"font-weight:bold;font-family:'Mangal'\">51 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X people were given a contract to complete a piece of work in 24 days. 5 people did not turn up for the work, and the rest of the people completed the work in 30 days. What is the value of X?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total work is the same in both cases: people × days is constant.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Planned: X × 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24X</span><span style=\"f
