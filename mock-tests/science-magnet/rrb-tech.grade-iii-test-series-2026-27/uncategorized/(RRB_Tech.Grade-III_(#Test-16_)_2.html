size:12pt\"><span style=\"font-family:'Mangal'\">1,760 = 2 × (22/7) × 14 × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,760 = 88h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = 1,760 / 88 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now use the volume formula.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume = πr²h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22/7) × 14 × 14 × 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 22 × 2 × 14 × 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">12,320 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the volume of the cylinder is </span><span style=\"font-weight:bold;font-family:'Mangal'\">12,320 cm³ (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: (3a⁴b²c³) × (4a²b⁵c) ÷ (6a³b⁴c²)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2a³b³c²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2a³b³c</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12a³b³c²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2a²b³c²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Handle the numbers first and then each letter separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Numbers: (3 × 4) / 6 = 12 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a: the powers add in the product and the power of the divisor is subtracted.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a: 4 + 2 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">b: 2 + 5 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">c: 3 + 1 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Putting the parts together gives 2a³b³c².</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the simplified form is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2a³b³c² (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The difference between the present ages of a man and his son is 26 years. Six years ago, the man was three times as old as his son. What is the present age of the son?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 years</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the present age of the son be s years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Present age of the man = s + </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Six years ago the son was (s − 6) years old and the man was (s + 20) years old.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At that time the man was three times as old as the son.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s + 20 = 3(s − 6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s + 20 = 3s − 18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: the man is 45 years old; six years ago they were 39 and 13 years old, and 39 = 3 × 13 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the present age of the son is </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 years (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A can do a piece of work in 6 days and B can do the same work in 8 days. With the help of C they finished the work in 3 days and received ₹3,200 in all. What is C’s share of the money?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹480</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹320</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹600</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wages are shared in the ratio of the work each person does in one day.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by A in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by B in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by the three together in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by C in 1 day = 1/3 − 1/6 − 1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (8 − 4 − 3)/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ratio of their one-day work = 1/6 : 1/8 : 1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiply every term by 24.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 4 : 3 : 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total parts = 4 + 3 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C's share = 3,200 × (1/8) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, C's share of the money is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If x = 2 + √3, then what is the value of x² + 1/x²?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First find 1/x by rationalising the denominator.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/x = 1/(2 + √3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiply the numerator and the denominator by (2 − √3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/x = (2 − √3) / [(2)² − (√3)²]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2 − √3) / (4 − 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 − √3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 1/x = (2 + √3) + (2 − √3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Square both sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + 1/x)² = x² + 1/x² + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 = x² + 1/x² + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² + 1/x² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: if x + 1/x = k, then x² + 1/x² = k² − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 16 − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: 18 + {4 × 36 ÷ 6 + 5} − (24 ÷ 8) × 4</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">37</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Solve the innermost bracket first, then the braces, and only then the remaining terms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(24 ÷ 8) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inside the braces, × and ÷ are done from left to right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 36 = 144, then 144 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{24 + 5} = </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The expression is now 18 + 29 − (3 × 4).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 + 29 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of the expression is </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A man loses 20% of his money. He then spends 25% of what remains. If he is left with ₹525, what was his original amount?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹890</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹880</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹885</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹875</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the original amount be ₹x and apply the two changes one after the other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After losing 20%, the money left = x × 80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He then spends 25% of this, so 75% of it is left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Money finally left = x × 80% × 75%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × 80% × 75% = x × 60%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 60% of the original amount is ₹525.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (525 × 100) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹875</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: ₹875 × 80% = ₹700 and ₹700 × 75% = ₹525 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the original amount was </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹875 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": "In ो ौcुयिय, पुध नोपiय यी पुध nहंृधन यी ृयदौ पय पुध nहंृधन यी giिनस iौ 5 : 3. Iी 20 ंयनध giिनस पोाध ोकंiौौiयn, पुध नोपiय ृधcयंधौ 5 : 4. Hयथ ंोnद ृयदौ ोनध पुधनध in पुध ौcुयिय?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">125</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the number of boys as 5x and the number of girls as 3x, so that the first ratio is kept.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The number of boys does not change, only the girls increase.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New number of girls = 3x + 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5x) : (3x + 20) = 5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cross multiply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 5x = 5 × (3x + 20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20x = 15x + 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of boys = 5x = 5 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: girls were 60 and become 80, and 100 : 80 = 5 : 4 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of boys in the school is </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A can complete a piece of work in 12 days and B can complete the same work in 18 days. They begin the work together, but A leaves 3 days before the work is finished. In how many days was the whole work completed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 days</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the whole work be finished in d days.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B works on all d days, while A works for (d − 3) days.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by A in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by B in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d − 3)/12 + d/18 = 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiply every term by 36 to clear the denominators.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3(d − 3) + 2d = 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3d − 9 + 2d = 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: A works 6 days and does 6/12 = 1/2, B works 9 days and does 9/18 = 1/2, and 1/2 + 1/2 = 1 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the whole work was completed in </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 days (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many numbers between 351 and 650 are divisible by 7?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the first and the last multiple of 7 that lie between 351 and 650.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 50 = 350, which is below 351, so the first multiple in the range is 7 × 51 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">357</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 93 = 651, which is above 650, so the last multiple in the range is 7 × 92 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">644</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The multiples are 7 × 51, 7 × 52, …, 7 × 92, so count the multipliers from 51 to 92.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Count = 92 − 51 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of such numbers is </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The simple interest on a certain sum at 10% per annum for 3 years is ₹1,800. What is the compound interest on the same sum at the same rate for 2 years, compounded annually?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,260</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,320</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,380</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First find the sum from the simple interest.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,800 = (P × 10 × 3) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = (1,800 × 100) / 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now compound ₹6,000 for 2 years at 10% per annum.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount = 6,000 × 110% × 110%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6,000 × 121%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compound interest = ₹7,260 − ₹6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the compound interest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,260 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The marks obtained by 60 students in a test are given below. Find the mode of the distribution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790313288709_image002.png\" width=\"442\" height=\"131\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The class with the highest frequency is the modal class.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The highest frequency is </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span><span style=\"font-family:'Mangal'\">, so the modal class is </span><span style=\"font-weight:bold;font-family:'Mangal'\">20-30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lower limit of the modal class (l) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Size of the class interval (h) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">) = 22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the class preceding the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the class succeeding the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) = 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mode = l + [(f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) / (2f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">)] × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + [(22 − 10) / (44 − 10 − 14)] × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + (12 / 20) × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mode of the distribution is </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In triangle ABC, D lies on AB and E lies on AC such that DE is parallel to BC. If AD : DB = 2 : 3 and the area of triangle ADE is 24 cm², what is the area of the trapezium DBCE?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since DE is parallel to BC, the corresponding angles are equal and ΔADE is similar to ΔABC.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AD : DB = 2 : 3, so AD : AB = 2 : (2 + 3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In similar triangles the areas are in the ratio of the squares of the corresponding sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of ΔADE : Area of ΔABC = 2² : 5² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of ΔABC = 24 × (25/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The trapezium is what is left of ΔABC after ΔADE is removed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the trapezium DBCE = 150 − 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the trapezium DBCE is </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 cm² (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Excluding stoppages, the speed of a train is 80 km/h and including stoppages it is 60 km/h. For how many minutes does the train stop in one hour?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 minutes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 minutes</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In one hour the train covers only 60 km instead of 80 km, and the rest of the hour is spent standing.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance lost because of stoppages = 80 − 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The train would cover these 20 km at its running speed of 80 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stoppage time = distance / speed</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 / 80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4 hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/4 hour = (1/4) × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: stoppage time per hour = [(difference of the two speeds) / (speed excluding stoppages)] × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (20 / 80) × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the train stops for </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 minutes (Option B)</span><span style=\"font-family:'Mangal'\"> in one hour.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A vessel contains 45 litres of a mixture of milk and water in the ratio 7 : 2. How much water must be added to the mixture so that the ratio of milk to water becomes 7 : 3?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5 litres</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only water is added, so the quantity of milk stays the same throughout.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total parts in the mixture = 7 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Milk = 45 × (7/9) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water = 45 − 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the new mixture the milk is still 35 litres and milk : water = 7 : 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water in the new mixture = 35 × (3/7) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water to be added = 15 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the quantity of water to be added is </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 litres (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the least number which, when decreased by 7, becomes exactly divisible by 8, 12, 18 and 30?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">367</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">353</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">373</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">361</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The number left after subtracting 7 is divisible by 8, 12, 18 and 30 together, so it is a multiple of their LCM (लघुत्तम समापवर्त्य).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 = 2³, 12 = 2² × 3, 18 = 2 × 3² and 30 = 2 × 3 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2³ × 3² × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The least such multiple is 360 itself, so the required number is 7 more than it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required number = 360 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">367</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 367 − 7 = 360, and 360 is divisible by 8, 12, 18 and 30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the least such number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">367 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Mission for Cotton Productivity, approved by the Union Cabinet in May 2026, is implemented by the Ministry of Agriculture and Farmers Welfare together with which other ministry?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ministry of Commerce and Industry</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ministry of Rural Development</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ministry of Micro, Small and Medium Enterprises</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ministry of Textiles</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mission for Cotton Productivity</span><span style=\"font-family:'Mangal'\"> is implemented jointly by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Agriculture and Farmers Welfare</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Textiles</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Union Cabinet approved it on </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 May 2026</span><span style=\"font-family:'Mangal'\"> with an outlay of </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,659.22 crore</span><span style=\"font-family:'Mangal'\"> for the five years </span><span style=\"font-weight:bold;font-family:'Mangal'\">2026-27 to 2030-31</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In its first phase the mission covers </span><span style=\"font-weight:bold;font-family:'Mangal'\">140</span><span style=\"font-family:'Mangal'\"> districts in </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> cotton growing States.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It aims to raise cotton lint productivity from about </span><span style=\"font-weight:bold;font-family:'Mangal'\">440 kg</span><span style=\"font-family:'Mangal'\"> per hectare to about </span><span style=\"font-weight:bold;font-family:'Mangal'\">755 kg</span><span style=\"font-family:'Mangal'\"> per hectare and to benefit about </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 lakh</span><span style=\"font-family:'Mangal'\"> cotton farmers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the other ministry is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Textiles (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who won the men's singles title at the Australian Open 2026, beating Novak Djokovic in the final?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jannik Sinner</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daniil Medvedev</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Carlos Alcaraz</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Alexander Zverev</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Carlos Alcaraz</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Spain</span><span style=\"font-family:'Mangal'\"> won the men's singles title at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Australian Open 2026</span><span style=\"font-family:'Mangal'\">, beating </span><span style=\"font-weight:bold;font-family:'Mangal'\">Novak Djokovic</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Serbia</span><span style=\"font-family:'Mangal'\"> in the final by </span><span style=\"font-weight:bold;font-family:'Mangal'\">2-6, 6-2, 6-3, 7-5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was Alcaraz's </span><span style=\"font-weight:bold;font-family:'Mangal'\">first</span><span style=\"font-family:'Mangal'\"> Australian Open title and his </span><span style=\"font-weight:bold;font-family:'Mangal'\">seventh</span><span style=\"font-family:'Mangal'\"> Grand Slam singles title.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the women's singles final </span><span style=\"font-weight:bold;font-family:'Mangal'\">Elena Rybakina</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kazakhstan</span><span style=\"font-family:'Mangal'\"> beat </span><span style=\"font-weight:bold;font-family:'Mangal'\">Aryna Sabalenka</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Belarus</span><span style=\"font-family:'Mangal'\"> by </span><span style=\"font-weight:bold;font-family:'Mangal'\">6-4, 4-6, 6-4</span><span style=\"font-family:'Mangal'\">, taking her first Australian Open title and her </span><span style=\"font-weight:bold;font-family:'Mangal'\">second</span><span style=\"font-family:'Mangal'\"> Grand Slam singles title.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Australian Open is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">first</span><span style=\"font-family:'Mangal'\"> Grand Slam tournament of the year and the 2026 edition was played at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Melbourne Park</span><span style=\"font-family:'Mangal'\">, Melbourne, from </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 January to 1 February 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winner is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carlos Alcaraz (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 1964, who chaired the Committee on Prevention of Corruption and suggested the Central Vigilance Commission be established?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K. Santhanam</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G V Ramakrishna</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P K Mohanty</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G K Pillai</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Committee on Prevention of Corruption</span><span style=\"font-family:'Mangal'\"> was set up by the Government of India in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1962</span><span style=\"font-family:'Mangal'\"> under the chairmanship of </span><span style=\"font-weight:bold;font-family:'Mangal'\">K. Santhanam</span><span style=\"font-family:'Mangal'\">, and it is usually called the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Santhanam Committee</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The committee recommended the setting up of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Central Vigilance Commission (CVC)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking its recommendations into consideration, the Government set up the CVC by a Government of India </span><span style=\"font-weight:bold;font-family:'Mangal'\">Resolution of 11 February 1964</span><span style=\"font-family:'Mangal'\"> (an executive resolution, not a law).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The CVC was first given </span><span style=\"font-weight:bold;font-family:'Mangal'\">statutory status in 1998 through an Ordinance</span><span style=\"font-family:'Mangal'\">, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Central Vigilance Commission Act, 2003</span><span style=\"font-family:'Mangal'\"> later gave it a permanent statutory basis (in force from 11 September 2003).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the chairman was </span><span style=\"font-weight:bold;font-family:'Mangal'\">K. Santhanam (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The headquarters of the North Atlantic Treaty Organization (NATO) is located in which city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Geneva</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vienna</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brussels</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Hague</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The headquarters of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">North Atlantic Treaty Organization (NATO)</span><span style=\"font-family:'Mangal'\"> is at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brussels</span><span style=\"font-family:'Mangal'\">, the capital of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Belgium</span><span style=\"font-family:'Mangal'\">, where it moved in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1967</span><span style=\"font-family:'Mangal'\"> from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Paris</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NATO was founded on </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 April 1949</span><span style=\"font-family:'Mangal'\"> by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">North Atlantic Treaty</span><span style=\"font-family:'Mangal'\">, which was signed at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Washington, D.C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 5</span><span style=\"font-family:'Mangal'\"> of that treaty carries its principle of collective defence: an armed attack on one member is treated as an attack on all.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Geneva</span><span style=\"font-family:'Mangal'\"> is the seat of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">World Trade Organization (WTO)</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vienna</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">International Atomic Energy Agency (IAEA)</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">The Hague</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">International Court of Justice (ICJ)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the headquarters is at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brussels (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Exercise Nomadic Elephant 2026, whose 18th edition began at Pithoragarh in Uttarakhand on 21 September 2026, is a joint military exercise of India with which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nepal</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kazakhstan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Myanmar</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mongolia</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Exercise Nomadic Elephant</span><span style=\"font-family:'Mangal'\"> is the joint military exercise of </span><span style=\"font-weight:bold;font-family:'Mangal'\">India</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mongolia</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its </span><span style=\"font-weight:bold;font-family:'Mangal'\">18th</span><span style=\"font-family:'Mangal'\"> edition began on </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 September 2026</span><span style=\"font-family:'Mangal'\"> at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Foreign Training Node, Pithoragarh</span><span style=\"font-family:'Mangal'\">, in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Uttarakhand</span><span style=\"font-family:'Mangal'\">, and runs to </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 October 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indian Army</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mongolian Armed Forces</span><span style=\"font-family:'Mangal'\"> are represented by </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span><span style=\"font-family:'Mangal'\"> personnel each.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The exercise builds joint capability for counter insurgency operations in semi urban and mountainous terrain under a </span><span style=\"font-weight:bold;font-family:'Mangal'\">United Nations</span><span style=\"font-family:'Mangal'\"> mandate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the partner country is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mongolia (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Khalilur Rahman, elected President of the 81st session of the United Nations General Assembly on 2 June 2026, belongs to which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sri Lanka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bangladesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nepal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Maldives</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Khalilur Rahman</span><span style=\"font-family:'Mangal'\">, who was elected President of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">81st</span><span style=\"font-family:'Mangal'\"> session of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">United Nations General Assembly</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 June 2026</span><span style=\"font-family:'Mangal'\">, belongs to </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bangladesh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the election he defeated </span><span style=\"font-weight:bold;font-family:'Mangal'\">Andreas Kakouris</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Cyprus</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The office of President of the General Assembly rotates among the regional groups of the United Nations, and for the 81st session it fell to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Asia Pacific Group</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The President of the General Assembly is elected for a term of </span><span style=\"font-weight:bold;font-family:'Mangal'\">one</span><span style=\"font-family:'Mangal'\"> session.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he belongs to </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bangladesh (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who is known as the Father of the White Revolution in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M. S. Swaminathan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C. Subramaniam</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Norman Borlaug</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Verghese Kurien</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Verghese Kurien</span><span style=\"font-family:'Mangal'\"> is known as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Father of the White Revolution</span><span style=\"font-family:'Mangal'\"> in India; this movement made India the world's largest producer of </span><span style=\"font-weight:bold;font-family:'Mangal'\">milk</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He led </span><span style=\"font-weight:bold;font-family:'Mangal'\">Operation Flood</span><span style=\"font-family:'Mangal'\">, the dairy development programme launched in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1970</span><span style=\"font-family:'Mangal'\"> by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Dairy Development Board (NDDB)</span><span style=\"font-family:'Mangal'\">, of which he was the founder chairman.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Operation Flood built its work on the cooperative model of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kaira District Co-operative Milk Producers' Union</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Anand</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gujarat</span><span style=\"font-family:'Mangal'\">, which is widely known by its brand name, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amul</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">M. S. Swaminathan</span><span style=\"font-family:'Mangal'\"> is called the leader of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Green Revolution</span><span style=\"font-family:'Mangal'\"> in India and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Norman Borlaug</span><span style=\"font-family:'Mangal'\"> is called the Father of the Green Revolution, while </span><span style=\"font-weight:bold;font-family:'Mangal'\">C. Subramaniam</span><span style=\"font-family:'Mangal'\"> was the Union Agriculture Minister of those Green Revolution years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Father of the White Revolution is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Verghese Kurien (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kavach, whose Version 4.0 Indian Railways is commissioning section by section, is which kind of system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Passenger ticketing system</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Track renewal machine</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Automatic Train Protection system</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Freight booking portal</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Kavach</span><span style=\"font-family:'Mangal'\"> is the indigenous </span><span style=\"font-weight:bold;font-family:'Mangal'\">Automatic Train Protection (ATP)</span><span style=\"font-family:'Mangal'\"> system of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indian Railways</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was developed by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Research Designs and Standards Organisation (RDSO)</span><span style=\"font-family:'Mangal'\">, the research arm of Indian Railways at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lucknow</span><span style=\"font-family:'Mangal'\">, with Indian industry partners.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It uses </span><span style=\"font-weight:bold;font-family:'Mangal'\">microprocessor</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">GPS</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">radio</span><span style=\"font-family:'Mangal'\"> technology to warn the loco pilot and to apply the brakes on its own if the driver does not, so it prevents a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Signal Passed at Danger</span><span style=\"font-family:'Mangal'\">, prevents over speeding and helps a train run safely in dense </span><span style=\"font-weight:bold;font-family:'Mangal'\">fog</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 January 2026</span><span style=\"font-family:'Mangal'\"> Kavach Version </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.0</span><span style=\"font-family:'Mangal'\"> was commissioned on three more sections, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vadodara to Virar</span><span style=\"font-family:'Mangal'\"> on Western Railway, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tughlakabad Junction Cabin to Palwal</span><span style=\"font-family:'Mangal'\"> on Northern Railway and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Manpur to Sarmatanr</span><span style=\"font-family:'Mangal'\"> on East Central Railway.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Kavach is an </span><span style=\"font-weight:bold;font-family:'Mangal'\">Automatic Train Protection system (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the flight-test of the Advanced Agni missile carried out on 8 May 2026, what does MIRV stand for?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiple Independently Targeted Re-Entry Vehicle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multi Stage Inertial Ranging Vehicle</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Manoeuvrable Interceptor Radar Vehicle</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Modular Integrated Rocket Vehicle</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">MIRV</span><span style=\"font-family:'Mangal'\"> stands for </span><span style=\"font-weight:bold;font-family:'Mangal'\">Multiple Independently Targeted Re-Entry Vehicle</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A MIRV system lets </span><span style=\"font-weight:bold;font-family:'Mangal'\">one</span><span style=\"font-family:'Mangal'\"> missile carry several warheads and release them so that each travels on its own path to a </span><span style=\"font-weight:bold;font-family:'Mangal'\">different</span><span style=\"font-family:'Mangal'\"> target.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Defence Research and Development Organisation (DRDO)</span><span style=\"font-family:'Mangal'\"> carried out the successful flight-test of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Advanced Agni</span><span style=\"font-family:'Mangal'\"> missile fitted with this system on </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 May 2026</span><span style=\"font-family:'Mangal'\"> from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dr A.P.J. Abdul Kalam Island</span><span style=\"font-family:'Mangal'\"> off the coast of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Odisha</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the test the payloads were directed at targets spread over a large area of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indian Ocean Region</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, MIRV stands for </span><span style=\"font-weight:bold;font-family:'Mangal'\">Multiple Independently Targeted Re-Entry Vehicle (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Rudra Veena is predominantly associated with which genre of Hindustani music?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Thumri</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dhrupad</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Khayal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ghazal</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Rudra Veena</span><span style=\"font-family:'Mangal'\"> is the large plucked string instrument of Hindustani music that is played mainly in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dhrupad</span><span style=\"font-family:'Mangal'\"> style.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">stick zither</span><span style=\"font-family:'Mangal'\">: a long hollow tube of wood carries the frets, and two large </span><span style=\"font-weight:bold;font-family:'Mangal'\">gourds</span><span style=\"font-family:'Mangal'\"> fixed under it act as resonators.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Dhrupad</span><span style=\"font-family:'Mangal'\"> is the oldest surviving style of Hindustani classical vocal music, sung in a slow, grave manner that begins with a long </span><span style=\"font-weight:bold;font-family:'Mangal'\">alap</span><span style=\"font-family:'Mangal'\">, and the deep, sustained sound of the Rudra Veena suits it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Khayal</span><span style=\"font-family:'Mangal'\"> is the later and now more common style of Hindustani classical singing, while </span><span style=\"font-weight:bold;font-family:'Mangal'\">Thumri</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ghazal</span><span style=\"font-family:'Mangal'\"> are lighter forms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the genre is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dhrupad (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Refer to the given letter, number and symbol series and answer the question that follows. All numbers are single-digit numbers only. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Left) K 4 # B 9 % 7 M $ R 3 &amp; 6 P @ T 2 * W 8 D (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many symbols are there in the series, each of which is immediately preceded by a number and immediately followed by a letter?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take each symbol of the series one by one and look at the element just before it and the element just after it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">#: just before is 4, a number, and just after is B, a letter ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">%: just before is 9, a number, but just after is 7, a number ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">$: just before is M, a letter, so $ fails at the first condition ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">&amp;: just before is 3, a number, but just after is 6, a number ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">@: just before is P, a letter ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">*: just before is 2, a number, and j
