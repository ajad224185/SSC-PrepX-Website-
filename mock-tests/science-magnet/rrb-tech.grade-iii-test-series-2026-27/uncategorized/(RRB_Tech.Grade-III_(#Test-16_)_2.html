ust after is W, a letter ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the symbols # and * satisfy both conditions, that is, </span><span style=\"font-weight:bold;font-family:'Mangal'\">two</span><span style=\"font-family:'Mangal'\"> symbols.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Two (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three of the following four number-pairs are alike in a certain way and thus form a group. Which number-pair does not belong to that group? (Note: The odd one out is not based on the number of digits.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 - 6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 - 9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 - 8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63 - 9</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In each pair, divide the first number by the second number and see what comes out.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 - 6: 42 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 - 8: 56 / 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63 - 9: 63 / 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 - 9: 72 / 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In three pairs the first number is seven times the second; in 72 - 9 it is eight times the second.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">72 - 9 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B means that ‘A is the brother of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B means that ‘A is the daughter of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B means that ‘A is the husband of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B means that ‘A is the mother of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘P × Q ÷ R + S’, then how is S related to P?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daughter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Father's sister</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A is the brother of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A is the daughter of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A is the husband of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A is the mother of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the expression: P × Q ÷ R + S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R + S → R is the husband of S, so R and S are husband and wife.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q ÷ R → Q is the daughter of R, so R is a parent of Q. Since R and S are husband and wife, S is the mother of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P × Q → P is the brother of Q, so P and Q have the same parents, and therefore S is the mother of P as well.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Sister would need S to be a child of the same parents as P; Daughter would reverse the generation; and Father's sister would need one more person in the chain.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, S is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mother (Option B)</span><span style=\"font-family:'Mangal'\"> of P.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The position(s) of how many letters will remain unchanged if each letter in the word DOSAGE is arranged in the English alphabetical order?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">None</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the word and then write its letters again in the English alphabetical order, one below the other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Word: D, O, S, A, G, E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Letters in alphabetical order: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, D, E, G, O, S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now compare the two rows position by position.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First position: D and A are different; second position: O and D are different; third position: S and E are different</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fourth position: A and G are different; fifth position: G and O are different; sixth position: E and S are different</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So no letter stays at the same position.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">None (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series? 6 19 45 97 201 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">406</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">403</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">409</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the difference between one term and the next.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">; 45 − 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\">; 97 − 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52</span><span style=\"font-family:'Mangal'\">; 201 − 97 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">104</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So each difference is double the difference before it: 13, 26, 52, 104.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The next difference is 104 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">208</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">? = 201 + 208 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">409</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(400, 406 and 403 all fall short of the doubled difference.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">409 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 is related to 52 following a certain logic. Following the same logic, 9 is related to 84. To which of the following is 11 related, following the same logic?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13: Operations on 13 such as adding/subtracting/multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">122</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">118</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">124</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare each number with the number it is related to, taking the whole number each time.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 7 = 49, and 49 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 × 9 = 81, and 81 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: square the number and add 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A plain multiplication does not work, because 52 / 7 and 84 / 9 are not the same.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 × 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">121</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">121 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">124</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(122 adds 1, 118 subtracts 3 and 126 adds 5 instead of 3.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 11 is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">124 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDF CEG FHJ KMO RTV ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ABE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACF</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inside every cluster the three letters are two places apart, so compare one cluster with the next cluster instead.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDF → CEG: each letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG → FHJ: each letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHJ → KMO: each letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KMO → RTV: each letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the shift itself grows by 2 each time, and the next shift is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+9</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (18 + 9 = 27 → 27 − 26 = 1 = A), T + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> (20 + 9 = 29 → 29 − 26 = 3 = C), V + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> (22 + 9 = 31 → 31 − 26 = 5 = E)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the missing cluster is ACE.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ABE, BCE and ACF each change one letter of ACE.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">ACE (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Eight people, A, B, C, D, E, F, G and H, are sitting around a circular table facing the centre.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C sits third to the left of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E sits second to the right of C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B sits to the immediate right of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G sits third to the right of B.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D is an immediate neighbour of E.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between F and G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who sits second to the right of the person who sits to the immediate left of G?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All eight face the centre, so for each of them ‘right’ is anticlockwise and ‘left’ is clockwise. Number the seats 1 to 8 towards the right, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">A at seat 1</span><span style=\"font-family:'Mangal'\">; moving right adds 1 and moving left subtracts 1, and 8 is followed by 1 again.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B sits to the immediate right of A → B = 1 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C sits third to the left of A → C = 1 − 3 = −2 → −2 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E sits second to the right of C → E = 6 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G sits third to the right of B → G = 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D is an immediate neighbour of E → the seats next to 8 are 7 and 1, and seat 1 is A's, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between F and G → F = 5 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, because 5 + 2 = 7 is already D's seat.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The one seat left, seat 4, goes to </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (seats 1 → 8): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A – B – F – H – G – C – D – E</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The person to the immediate left of G is at seat 5 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, which is H.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second to the right of H is seat 4 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, which is C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the person asked for is </span><span style=\"font-weight:bold;font-family:'Mangal'\">C (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘A’ stands for ‘÷’, ‘B’ stands for ‘×’, ‘C’ stands for ‘+’ and ‘D’ stands for ‘−’, what will come in place of the question mark (?) in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 A 6 B 5 C 27 D 19 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Replace each letter by the sign it stands for.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 A 6 B 5 C 27 D 19 becomes 48 ÷ 6 × 5 + 27 − 19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now apply BODMAS, so the division and the multiplication are done before the addition and the subtraction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 + 27 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">67 − 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(44, 52 and 40 come from doing the addition or the subtraction before the multiplication.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Read the given statement(s) and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statement(s).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Statements: All pens are books. Some books are tables. No table is a chair.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) Some pens are tables.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) Some books are not chairs.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Neither conclusion (I) nor (II) follows</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All pens are books → the pens circle lies completely inside the books circle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Some books are tables → the books circle and the tables circle overlap in at least one part.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No table is a chair → the tables circle and the chairs circle do not touch each other at all.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (I): Some pens are tables → the pens circle may be drawn inside the part of the books circle that does not overlap the tables circle, so this is only a possibility → </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not follow</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (II): Some books are not chairs → at least one book is a table, and no table is a chair, so that book is certainly not a chair → </span><span style=\"font-weight:bold;font-family:'Mangal'\">follows</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only conclusion (II) follows </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KOR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of every letter and find the gap between one letter and the next inside each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFI: B = 2, F = 6, I = 9 → gaps </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KOR: K = 11, O = 15, R = 18 → gaps </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTW: P = 16, T = 20, W = 23 → gaps </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHL: D = 4, H = 8, L = 12 → gaps </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three clusters have the gaps +4 and +3; only DHL has +4 and +4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">DHL (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pointing to a lady in a park, Vikas said, 'She is the daughter of the only son of my grandmother.' How is the lady related to Vikas?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aunt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Niece</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cousin</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Start from the far end of the sentence and come back to Vikas one step at a time.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vikas's grandmother has only one son, and that son is the father of Vikas, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">the only son of the grandmother is Vikas's father</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The lady is the daughter of that man, so the lady and Vikas have the same parents.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two children of the same parents are brother and sister, so the lady is </span><span style=\"font-weight:bold;font-family:'Mangal'\">the sister of Vikas</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(An aunt would be his father's or mother's sister, a niece would be his brother's or sister's daughter, and a cousin would be the child of an uncle or an aunt, and each of those needs a different chain.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the lady is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sister (Option C)</span><span style=\"font-family:'Mangal'\"> of Vikas.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A man is standing on the roof facing east. First, he turns 45 degrees clockwise, then 45 degrees anticlockwise. He then turns 180 degrees anticlockwise. Finally, he turns 90 degrees clockwise. In which direction is the man facing now?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">West</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">North</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">East</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Measure the direction he faces as an angle from the north, taken clockwise: north = 0°, east = 90°, south = 180°, west = 270°. A clockwise turn adds to this angle and an anticlockwise turn subtracts from it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He starts facing the east → </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 degrees clockwise: 90° + 45° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">135°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 degrees anticlockwise: 135° − 45° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span><span style=\"font-family:'Mangal'\">, so the first two turns cancel each other and he faces the east again.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 degrees anticlockwise: 90° − 180° = −90° → −90° + 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270°</span><span style=\"font-family:'Mangal'\">, which is the west.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 degrees clockwise: 270° + 90° = 360° → 360° − 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0°</span><span style=\"font-family:'Mangal'\">, which is the north.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the man is now facing the </span><span style=\"font-weight:bold;font-family:'Mangal'\">North (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T and U were born in six different months of the same year: January, March, April, July, September and December, but not necessarily in the same order.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people were born between S and P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T was born in the month immediately after P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q was born in March.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U was born in December.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who was born in April?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number the six months in order: January = 1, March = 2, April = 3, July = 4, September = 5, December = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q was born in March → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U was born in December → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T was born in the month immediately after P → T = P + 1, so P and T take two months next to each other, and the months left for P, R, S and T are 1, 3, 4 and 5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people were born between S and P → the numbers of S and P are three apart.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 4</span><span style=\"font-family:'Mangal'\"> gives </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 5</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 1</span><span style=\"font-family:'Mangal'\">, because 4 + 3 = 7 is not a month on the list ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The one month left, 3, goes to </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(P = 3 would need T = 4 and S = 6, but December is already U's month ✗)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final order: S in January, Q in March, R in April, P in July, T in September, U in December.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the person born in April is </span><span style=\"font-weight:bold;font-family:'Mangal'\">R (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the pair which follows the same pattern as that followed by the two pairs given below. Both pairs follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAP : RCE</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DOG : IQF</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BUS : UWD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MAT : VCN</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PEN : PGQ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FAN : PCG</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The letters of the second cluster do not match the first cluster letter by letter, so write the first cluster in reverse order and then compare.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAP written in reverse is PAC: P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">, C + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> → RCE ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DOG written in reverse is GOD: G + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, O + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, D + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> → IQF ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: write the cluster in reverse order, then move every letter two places ahead.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option A, BUS written in reverse is SUB: S + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, U + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">, B + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> → UWD ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option B, MAT written in reverse is TAM: T + 2 = U, A + 2 = C, but M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, not N ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option C, PEN written in reverse is NEP: N + 2 = P, E + 2 = G, but P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, not Q ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option D, FAN written in reverse is NAF: N + 2 = P, A + 2 = C, but F + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, not G ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct pair is </span><span style=\"font-weight:bold;font-family:'Mangal'\">BUS : UWD (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAT - IGZ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOP - SUV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIN - LOT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED - HKI</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare the two clusters of each pair letter by letter.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAT - IGZ: C + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, A + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, T + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOP - SUV: M + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, O + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, P + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIN - LOT: F + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, I + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, N + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED - HKI: B + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, E + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">, but D + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, and the pair gives I ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three pairs move every letter six places ahead; BED - HKI does not.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">BED - HKI (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language, 'RAIN' is coded as 42 and 'WIND' is coded as 50. How will 'CLOUD' be coded in the same language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">53</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of every letter of the word in the English alphabet and add the positions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RAIN: R = 18, A = 1, I = 9, N = 14 → 18 + 1 + 9 + 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WIND: W = 23, I = 9, N = 14, D = 4 → 23 + 9 + 14 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: the code is the sum of the positions of the letters of the word.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CLOUD: C = 3, L = 12, O = 15, U = 21, D = 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 + 12 + 15 + 21 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">55</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(54, 56 and 53 come from adding one letter position wrongly.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 'CLOUD' is coded as </span><span style=\"font-weight:bold;font-family:'Mangal'\">55 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rohit starts from point A and walks 12 km towards the east. He then takes a right turn and walks 9 km. He then takes a U-turn and walks 18 km. Finally he takes a left turn and walks 12 km to reach point B. How far and in which direction is point B from point A? (All turns are 90-degree turns only, unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 km, south</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km, north</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, north</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 km, north</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take point A as the origin; east = +x, north = +y, and 1 unit = 1 km.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He walks 12 km towards the east → he is at (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 0</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A right turn from the east makes him face the south, and he walks 9 km → he is at (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, −9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A U-turn makes him face the north, and he walks 18 km → he is at (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 9</span><span style=\"font-family:'Mangal'\">), because −9 + 18 = 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A left turn from the north makes him face the west, and he walks 12 km → he is at (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, 9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So point B has the same east-west position as point A and lies 9 units above it, which means B is </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 km to the north</span><span style=\"font-family:'Mangal'\"> of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9 km south reverses the U-turn, 12 km north uses the last leg as the distance, and 15 km north adds the legs instead of cancelling them.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, point B is </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 km, north (Option D)</span><span style=\"font-family:'Mangal'\"> of point A.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of :: ?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILK : # :: % : ROAD</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPJ, % = PRWE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPJ, % = PRWF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OEPJ, % = PRWE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPI, % = PRWE</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The change from the first cluster to the second cluster must be the same in both pairs. Test each option.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option A: MILK → OFPJ: M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\">, L + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, K − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> → (+2, −3, +4, −1); PRWE → ROAD: P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, R − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, W + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (23 + 4 = 27 → 27 − 26 = 1 = A), E − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> → (+2, −3, +4, −1) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option B: PRWF → ROAD needs F − 1 = D, but F − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option C: MILK → OEPJ needs I − 3 = E, but I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option D: MILK → OFPI needs K − 1 = I, but K − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = OFPJ, % = PRWE (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the given letter-number clusters will replace the question mark (?) in the following series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DF 5, GH 11, JJ 23, ML 47, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PN 94</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ON 95</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PM 95</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PN 95</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Read the first letters, the second letters and the numbers as three separate series.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First letters: D, G, J, M, ?: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → ? = M + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second letters: F, H, J, L, ?: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\"> → ? = L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Numbers: 5, 11, 23, 47, ?: (5 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span><span style=\"font-family:'Mangal'\">, (11 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23</span><span style=\"font-family:'Mangal'\">, (23 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">47</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So each number is double the one before it plus 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">? = (47 × 2) + 1 = 94 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">95</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the missing cluster is PN 95.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(PN 94 leaves out the extra 1, ON 95 moves the first letter only two places ahead, and PM 95 moves the second letter only one place ahead.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">PN 95 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘+’ means ‘−’, ‘−’ means ‘×’, ‘×’ means ‘÷’ and ‘÷’ means ‘+’, then what will come in place of the question mark (?) in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 × 8 + 5 − 4 ÷ 18 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Replace each sign by the meaning given for it, one sign at a time.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The × in the equation means ÷, the + means −, the − means × and the ÷ means +.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 96 × 8 + 5 − 4 ÷ 18 becomes 96 ÷ 8 − 5 × 4 + 18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now apply BODMAS, so the division and the multiplication are done first.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 − 20 + 18 = −8 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 stops at the first step, and 8 and 14 come from doing the subtraction before the multiplication.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a row of 45 students, Rohan is 18th from the left end of the row. Kavita sits 7 places to the right of Rohan. What is Kavita's position from the right end of the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20th</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22nd</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27th</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21st</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Count Kavita's position from the left end first.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rohan is 18th from the left end, and Kavita sits 7 places to his right, so Kavita is 18 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25th from the left end</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a row of n students, the position from the right end = n − (position from the left end) + 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Position of Kavita from the right end = 45 − 25 + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21st</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 1 is added because Kavita herself is counted from both ends.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(20th leaves out that 1, 27th counts 7 places from the wrong end, and 22nd subtracts 7 from 45 − 16.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Kavita is </span><span style=\"font-weight:bold;font-family:'Mangal'\">21st (Option D)</span><span style=\"font-family:'Mangal'\"> from the right end.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seven people, A, B, C, D, E, F and G, are sitting in a row, facing south.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit to the right of G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D sits third to the left of G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sits at one of the extreme ends of the row.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between A and B.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C sits to the immediate right of F.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E is not an immediate neighbour of D.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the position of F with respect to B?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third to the left</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third to the right</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second to the right</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fourth to the right</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All seven face south, so their right is the opposite of the side that looks like the right on paper. To keep the counting simple, number the seats 1 to 7 towards the right of the people themselves; then moving right adds 1 and moving left subtracts 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit to the right of G → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D sits third to the left of G → D = 5 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sits at one of the extreme ends → A = 1 or A = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between A and B → the seats of A and B are two apart.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C sits to the immediate right of F → C = F + 1, so F and C take two seats next to each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 1</span><span style=\"font-family:'Mangal'\"> gives </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 3</span><span style=\"font-family:'Mangal'\">, and the seats left are 4, 6 and 7 for C, E and F.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F and C must be next to each other, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 6</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 7</span><span style=\"font-family:'Mangal'\">, and the remaining seat 4 goes to </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E is not an immediate neighbour of D, and seat 4 is not next to seat 2 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(A = 7 would need B = 5, which is G's seat ✗)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (seats 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, D, B, E, G, F, C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F is at seat 6 and B is at seat 3, so F sits 6 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> places to the right of B.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, F is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Third to the right (Option B)</span><span style=\"font-family:'Mangal'\"> of B.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'ripe mango tree' is written as 'sa ko li',</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'green mango leaf' is written as 'ko da ne' and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'tree leaf water' is written as 'li ne pa'.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the code for 'mango' in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ko</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">li</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ne</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">da</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A word that appears in two sentences must have a code that appears in both of those sentences.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'mango' appears in the first and the second sentence only.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The codes of the first sentence are sa, ko, li and the codes of the second sentence are ko, da, ne.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The only code common to both is </span><span style=\"font-weight:bold;font-family:'Mangal'\">ko</span><span style=\"font-family:'Mangal'\">, so 'mango' is coded as ko.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the other words with the same idea: 'tree' appears in the first and the third sentence, whose common code is </span><span style=\"font-weight:bold;font-family:'Mangal'\">li</span><span style=\"font-family:'Mangal'\">, and 'leaf' appears in the second and the third sentence, whose common code is </span><span style=\"font-weight:bold;font-family:'Mangal'\">ne</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">That leaves sa for 'ripe', da for 'green' and pa for 'water', so every code is accounted for and no other word can take ko.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the code for 'mango' is </span><span style=\"font-weight:bold;font-family:'Mangal'\">ko (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 is related to 9 in a certain way. In the same way, 120 is related to 11. To which of the following is 168 related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look for a rule that turns the big number into the small one.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 + 1 = 81 = 9 × 9, so 80 is </span><span style=\"font-weight:bold;font-family:'Mangal'\">one less than the square of 9</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 + 1 = 121 = 11 × 11, so 120 is </span><span style=\"font-weight:bold;font-family:'Mangal'\">one less than the square of 11</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: the first number is one less than a perfect square, and the second number is the root of that square.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">169</span><span style=\"font-family:'Mangal'\"> = 13 × 13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the root is </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 gives 144 − 1 = 143, 14 gives 196 − 1 = 195, and 15 gives 225 − 1 = 224, and none of these is 168.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 168 is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">13 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}];
