=\"font-family:'Mangal'\"> का उपयोग करता है। ऑक्सीजन की खपत और CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> का मुक्त होना श्वसन और दहन में होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल कथन 1 सही है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भावस्था के दौरान मासिक धर्म क्यों रुक जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भाशय की भित्ति नहीं निकलती क्योंकि वह भ्रूण को पोषण देने के लिए आवश्यक होती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंडाशय हर महीने दो अंडाणु मुक्त करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भाशय की भित्ति बिल्कुल नहीं बनती</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शुक्राणु गर्भाशय की भित्ति को नष्ट कर देते हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हर महीने गर्भाशय की भित्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी और स्पंजी</span><span style=\"font-family:'Mangal'\"> हो जाती है ताकि निषेचन होने पर वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">भ्रूण को पोषण</span><span style=\"font-family:'Mangal'\"> दे सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि अंडाणु का </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषेचन नहीं</span><span style=\"font-family:'Mangal'\"> होता, तो भित्ति की आवश्यकता नहीं रहती, इसलिए वह टूटकर मासिक धर्म के रूप में बाहर आ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गर्भावस्था</span><span style=\"font-family:'Mangal'\"> में अंडाणु का निषेचन हो चुका होता है और भ्रूण गर्भाशय में विकसित होता है, इसलिए भित्ति की </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवश्यकता बनी रहती है</span><span style=\"font-family:'Mangal'\"> और वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं निकलती</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मासिक रक्तस्राव नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भित्ति बनती है, और अतिरिक्त अंडाणु या शुक्राणु इसका कारण नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मासिक धर्म इसलिए रुकता है क्योंकि भित्ति भ्रूण को पोषण देने के लिए बनी रहती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक उत्तल लेंस के सामने 15 cm दूरी पर रखी वस्तु का वास्तविक प्रतिबिंब बनता है। उत्पन्न आवर्धन m = −2 है। नई कार्तीय चिह्न परिपाटी का प्रयोग करने पर प्रतिबिंब की दूरी v है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−30 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+30 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+7.5 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−7.5 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई कार्तीय चिह्न परिपाटी का प्रयोग करने पर (दूरियाँ प्रकाशिक केंद्र से मापी जाती हैं, आपतित प्रकाश की दिशा में धनात्मक):</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">u = वस्तु की दूरी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−15 cm</span><span style=\"font-family:'Mangal'\"> (वस्तु लेंस के सामने)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m = आवर्धन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> (वास्तविक, उलटे प्रतिबिंब के लिए ऋणात्मक चिह्न)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = प्रतिबिंब की दूरी (ज्ञात करनी है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूत्र: m = v/u, अतः v = m × u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = (−2) × (−15)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+30 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक चिह्न का अर्थ है कि प्रतिबिंब लेंस की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरी ओर</span><span style=\"font-family:'Mangal'\"> बना है, जो उत्तल लेंस द्वारा बने वास्तविक प्रतिबिंब के लिए सही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 1/f = 1/v − 1/u = 1/30 + 1/15 = 3/30, अतः f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+10 cm</span><span style=\"font-family:'Mangal'\">, जो उत्तल लेंस के लिए धनात्मक होना ही चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−30 cm का मान u का चिह्न अनदेखा करने से आता है, और ±7.5 cm का मान m से गुणा करने के बजाय u को m से भाग देने से आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब की दूरी +30 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी बीकर में थोड़े-से बिना बुझे चूने (CaO) में जल धीरे-धीरे मिलाया जाता है और बीकर गर्म हो जाता है। कौन-सी पंक्ति अभिक्रिया का प्रकार और बना उत्पाद सही बताती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपघटन; कैल्सियम कार्बोनेट, ऊष्मा का अवशोषण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन; कैल्सियम हाइड्रॉक्साइड (बुझा चूना), ऊष्मा मुक्त होती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन; कैल्सियम हाइड्रॉक्साइड और हाइड्रोजन, ऊष्मा मुक्त होती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन; कैल्सियम कार्बोनेट, ऊष्मा का अवशोषण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिना बुझा चूना जल के साथ तीव्र अभिक्रिया करता है: CaO(s) + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O(l) → Ca(OH)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">(aq) + ऊष्मा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण संतुलित है: दोनों ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> Ca, </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> O और </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> H हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो अभिकारक CaO और H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O मिलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही उत्पाद</span><span style=\"font-family:'Mangal'\">, कैल्सियम हाइड्रॉक्साइड (बुझा चूना), बनाते हैं, इसलिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीकर गर्म इसलिए होता है क्योंकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़ी मात्रा में ऊष्मा मुक्त होती है</span><span style=\"font-family:'Mangal'\">, इसलिए अभिक्रिया </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊष्माक्षेपी</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ कैल्सियम कार्बोनेट नहीं बनता और हाइड्रोजन गैस भी मुक्त नहीं होती, क्योंकि कोई विस्थापन नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह संयोजन अभिक्रिया है जिसमें कैल्सियम हाइड्रॉक्साइड बनता है और ऊष्मा मुक्त होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धोने के सोडे के बारे में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. इसका सूत्र Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O है, जिसमें एक सूत्र इकाई में क्रिस्टलन जल के 10 अणु होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इसे बेकिंग सोडा को तेज़ गर्म करके बनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो 1 और न ही 2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 1: धोने का सोडा </span><span style=\"font-weight:bold;font-family:'Mangal'\">Na</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-weight:bold;font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> है। क्रिस्टलन जल एक सूत्र इकाई में जल के अणुओं की </span><span style=\"font-weight:bold;font-family:'Mangal'\">निश्चित संख्या</span><span style=\"font-family:'Mangal'\"> है, यहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\">। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सही</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 2: बेकिंग सोडा को गर्म करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम कार्बोनेट</span><span style=\"font-family:'Mangal'\"> मिलता है: 2NaHCO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> → Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O + CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धोने का सोडा तब मिलता है जब इस सोडियम कार्बोनेट का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनः क्रिस्टलन</span><span style=\"font-family:'Mangal'\"> किया जाता है। इसलिए केवल गर्म करने से यह नहीं मिलता। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलत</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल कथन 1 सही है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सिकुड़ी हुई किशमिश को कुछ घंटे सादे जल में छोड़ने पर वह फूलकर मोटी हो जाती है। कौन-सी व्याख्या सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशमिश से जल बाहर जाता है क्योंकि सादा जल उसकी कोशिकाओं के लिए अतिपरासरी है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशमिश से शर्करा परासरण द्वारा बाहर जाती है जब तक दोनों ओर बराबर न हो जाए</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशमिश में जल परासरण द्वारा प्रवेश करता है क्योंकि सादा जल उसकी कोशिकाओं के लिए अल्पपरासरी है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल का कोई नेट गमन नहीं होता क्योंकि सादा जल उसकी कोशिकाओं के लिए समपरासरी है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परासरण जल का चयनात्मक पारगम्य झिल्ली से होकर गमन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> विलेय सांद्रता वाले पक्ष से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> विलेय सांद्रता वाले पक्ष की ओर जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशमिश की कोशिकाओं में बहुत शर्करा होती है, जबकि सादे जल में लगभग कोई विलेय नहीं होता। इसलिए सादा जल किशमिश की कोशिकाओं के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अल्पपरासरी</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जल परासरण द्वारा कोशिकाओं में प्रवेश करता है और किशमिश फूलकर मोटी हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल का बाहर जाना केवल अतिपरासरी विलयन में होता है, शर्करा परासरण द्वारा झिल्ली पार नहीं करती, और समपरासरी विलयन में नेट गमन तथा फूलना दोनों नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः किशमिश में जल परासरण द्वारा प्रवेश करता है क्योंकि सादा जल उसकी कोशिकाओं के लिए अल्पपरासरी है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नम मिट्टी पर रखी ब्रायोफिलम की पत्ती के किनारे की खाँचों से छोटे-छोटे पौधे उगते दिखाई देते हैं। प्रजनन की इस विधि को क्या कहते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कायिक प्रवर्धन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुकुलन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु निर्माण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रायोफिलम की पत्ती पर छोटे-छोटे पौधे निकलते हैं, जो आगे चलकर नए पौधों में विकसित हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनक के किसी कायिक भाग (यहाँ पत्ती) से नए पौधे का बनना </span><span style=\"font-weight:bold;font-family:'Mangal'\">कायिक प्रवर्धन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक जनक</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए नए पौधे उसके आनुवंशिक रूप से समान होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुकुलन यीस्ट और हाइड्रा में, बीजाणु निर्माण ब्रेड फफूँद में होता है और लैंगिक प्रजनन में दो युग्मक चाहिए, इसलिए इनमें से कोई यहाँ नहीं बैठता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पौधे कायिक प्रवर्धन से बनते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हवा में चलती प्रकाश की एक किरण पारदर्शी प्लास्टिक की शीट की सतह पर 60° के आपतन कोण से टकराती है और 30° के कोण पर अपवर्तित होती है। प्लास्टिक का अपवर्तनांक है (sin 60° = 0.87 और sin 30° = 0.50 लीजिए):</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.58</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.00</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.74</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपवर्तनांक (स्नेल का नियम): n = sin i / sin r.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान लीजिए n प्लास्टिक का अपवर्तनांक, i आपतन कोण और r अपवर्तन कोण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">i = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60°</span><span style=\"font-family:'Mangal'\">, इसलिए sin i = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.87</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">r = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30°</span><span style=\"font-family:'Mangal'\">, इसलिए sin r = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.50</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n = sin i / sin r = 0.87 / 0.50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.74</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपवर्तनांक 1 से अधिक है, और किरण अभिलंब की ओर मुड़ती है (r, i से कम है), जैसा प्रकाश के सघन माध्यम में प्रवेश करने पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प 0.58 अनुपात को उलटने, अर्थात् sin r / sin i लेने से आता है। विकल्प 2.00 कोणों के sin की जगह स्वयं कोणों को भाग देने, 60 / 30, से आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्लास्टिक का अपवर्तनांक 1.74 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही परिनालिका के चुंबकीय क्षेत्र के बारे में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. परिनालिका में अधिक धारा प्रवाहित करने पर अधिक प्रबल चुंबकीय क्षेत्र उत्पन्न होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. परिनालिका के चारों ओर क्षेत्र रेखाओं का पैटर्न छड़ चुंबक के चारों ओर के पैटर्न जैसा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो 1 और न ही 2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 1: किसी बिंदु पर धारावाही तार द्वारा उत्पन्न चुंबकीय क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारा पर सीधे निर्भर</span><span style=\"font-family:'Mangal'\"> करता है, इसलिए अधिक धारा से अधिक प्रबल क्षेत्र मिलता है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सही</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 2: परिनालिका का क्षेत्र पैटर्न </span><span style=\"font-weight:bold;font-family:'Mangal'\">छड़ चुंबक के पैटर्न जैसा</span><span style=\"font-family:'Mangal'\"> होता है; उसका एक सिरा उत्तरी ध्रुव और दूसरा दक्षिणी ध्रुव की तरह व्यवहार करता है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सही</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कथन 1 और 2 दोनों सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791287645344_image001.png\" width=\"442\" height=\"155\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(i), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iv), (c)-(iii), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(ii), (c)-(iv), (d)-(i)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नम ब्रेड के टुकड़े पर ब्रेड मोल्ड (</span><span style=\"font-weight:bold;font-family:'Mangal'\">राइज़ोपस</span><span style=\"font-family:'Mangal'\">) धागे जैसी और डंडी पर गोले जैसी संरचनाएँ बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कवक जाल (हाइफी)</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">धागे जैसे भाग जो प्रजनन में भाग नहीं लेते</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणुधानी</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">डंडी पर गोले जैसे भाग जिनमें बीजाणु होते हैं</span><span style=\"font-family:'Mangal'\">: ये प्रजनन में भाग लेती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणु</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐसी कोशिकाएँ जो नए जीव में विकसित हो सकती हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणु की भित्ति</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी भित्ति जो नम सतह मिलने तक सुरक्षा देती है</span><span style=\"font-family:'Mangal'\">: उसके बाद बीजाणु वृद्धि करने लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I के प्रत्येक तत्व का मिलान सूची II में उस नाम से कीजिए जिससे उसका प्रतीक बना है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791287645344_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(ii), (d)-(i)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">टिन (Sn)</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टैनम (लैटिन)</span><span style=\"font-family:'Mangal'\">: इसका प्रतीक लैटिन नाम से बना है, अंग्रेज़ी नाम से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पारा (Hg)</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रार्गिरोस (ग्रीक)</span><span style=\"font-family:'Mangal'\">: इसका प्रतीक ग्रीक नाम से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">टंगस्टन (W)</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">वोल्फ्राम (जर्मन)</span><span style=\"font-family:'Mangal'\">: इसका प्रतीक जर्मन नाम से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लोहा (Fe)</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">फेरम (लैटिन)</span><span style=\"font-family:'Mangal'\">: इसका प्रतीक लैटिन नाम से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B में टिन और लोहा आपस में बदल गए हैं, विकल्प C में पारा और टंगस्टन आपस में बदल गए हैं, और विकल्प D में चारों गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791287645344_image003.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(ii), (c)-(iv), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(ii), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमीबा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">उँगली जैसे प्रवर्ध भोजन पर जुड़कर खाद्य रिक्तिका बनाते हैं</span><span style=\"font-family:'Mangal'\">: कोशिका की सतह के ये अस्थायी प्रवर्ध (कूटपाद) भोजन कण को घेर लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पैरामीशियम</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पक्ष्माभ भोजन को कोशिका के एक निश्चित स्थान तक ले जाते हैं</span><span style=\"font-family:'Mangal'\">: कोशिका का आकार निश्चित होता है और भोजन एक विशिष्ट स्थान से लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रेड मोल्ड</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">भोजन का पाचन शरीर के बाहर करके उसे अवशोषित करता है</span><span style=\"font-family:'Mangal'\">: ब्रेड मोल्ड, यीस्ट और मशरूम जैसे कवक इसी प्रकार भोजन लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमरबेल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादप को मारे बिना उससे पोषण लेता है</span><span style=\"font-family:'Mangal'\">: यह परजीवी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iv), (b)-(ii), (c)-(i), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी घर में TV, रेफ्रिजरेटर और हीटर में से प्रत्येक को समान वोल्टेज पर चलना है, और प्रत्येक को बंद करने पर अन्य दोनों बंद नहीं होने चाहिए। उन्हें इस प्रकार जोड़ना चाहिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक-दूसरे के साथ श्रेणी में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो श्रेणी में और तीसरा उनके साथ समानांतर में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक के बाद एक, तीनों के लिए एक ही स्विच के साथ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेन्स आपूर्ति के आर-पार समानांतर में</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">समानांतर</span><span style=\"font-family:'Mangal'\"> संयोजन में प्रत्येक उपकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीधे दोनों आपूर्ति तारों के आर-पार</span><span style=\"font-family:'Mangal'\"> जुड़ा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए प्रत्येक उपकरण के सिरों पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">विभवांतर</span><span style=\"font-family:'Mangal'\"> आपूर्ति वोल्टेज के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बराबर</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक उपकरण धारा के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपना अलग पथ</span><span style=\"font-family:'Mangal'\"> बनाता है, इसलिए एक को बंद करने पर केवल उसी का पथ टूटता है और अन्य दो चलते रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">श्रेणी</span><span style=\"font-family:'Mangal'\"> संयोजन में सभी उपकरणों से एक ही धारा गुजरती है और आपूर्ति वोल्टेज उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">बँट</span><span style=\"font-family:'Mangal'\"> जाता है, इसलिए किसी भी उपकरण को पूरा वोल्टेज नहीं मिलता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साथ ही, एक को बंद करने (या एक में खराबी आने) पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी में धारा रुक</span><span style=\"font-family:'Mangal'\"> जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उपकरणों को मेन्स आपूर्ति के आर-पार समानांतर में जोड़ना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्शियम क्लोराइड, CaCl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">, एक आयनिक यौगिक है जो नमी सोखने के काम आता है। परमाणु द्रव्यमान Ca = 40 u और Cl = 35.5 u दिए जाने पर, इसका सूत्र इकाई द्रव्यमान कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75.5 u</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">151 u</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">111 u</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2840 u</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक अणु नहीं बनाते; उनके आयन 3-D क्रिस्टल बनाते हैं। इसलिए आयनों के सरलतम पूर्ण संख्या अनुपात के समूह, </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूत्र इकाई</span><span style=\"font-family:'Mangal'\">, का द्रव्यमान आणविक द्रव्यमान की जगह प्रयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूत्र इकाई द्रव्यमान = एक सूत्र इकाई में उपस्थित सभी परमाणुओं के परमाणु द्रव्यमानों का योग</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CaCl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> की एक सूत्र इकाई में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> कैल्शियम आयन और </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> क्लोराइड आयन होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">Ca</span><span style=\"font-family:'Mangal'\"> = कैल्शियम का परमाणु द्रव्यमान = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">Cl</span><span style=\"font-family:'Mangal'\"> = क्लोरीन का परमाणु द्रव्यमान = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35.5 u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूत्र इकाई द्रव्यमान = (40 × 1) + (35.5 × 2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 40 + 71 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">111 u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75.5 u में केवल एक क्लोरीन गिना गया है, 151 u पूरे योग (40 + 35.5) को दोगुना कर देता है मानो सूत्र Ca</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">Cl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> हो, और 2840 u में 40 और 71 को जोड़ने के बजाय गुणा किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कैल्शियम क्लोराइड का सूत्र इकाई द्रव्यमान 111 u है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति को स्पष्ट पढ़ने के लिए अख़बार को आँखों से 25 cm से बहुत अधिक दूरी पर रखना पड़ता है। इस व्यक्ति की आँख में पास की वस्तु से आने वाली किरणें किस स्थान पर फोकसित होती हैं, और कौन-सा लेंस इस दोष को ठीक करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना के पीछे; उत्तल लेंस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना के पीछे; अवतल लेंस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना के सामने; उत्तल लेंस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना के सामने; अवतल लेंस</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अख़बार को 25 cm से बहुत दूर रखने का अर्थ है कि निकट बिंदु सामान्य से अधिक दूर है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">दीर्घ दृष्टि दोष</span><span style=\"font-family:'Mangal'\"> (दूर-दृष्टि) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस दोष में पास की वस्तु से आने वाली किरणें </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेटिना के पीछे</span><span style=\"font-family:'Mangal'\"> फोकसित होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपयुक्त शक्ति का </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल लेंस</span><span style=\"font-family:'Mangal'\"> प्रयोग किया जाता है। यह किरणों को थोड़ा पहले अभिसरित कर देता है, इसलिए प्रतिबिंब रेटिना पर बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल लेंस किरणों को अपसारित करता है और प्रतिबिंब को रेटिना से और पीछे धकेल देगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना के सामने फोकस होना निकट दृष्टि दोष में होता है, जिसमें अवतल लेंस चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब रेटिना के पीछे बनता है और उत्तल लेंस इसे ठीक करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से किस अणु में कार्बन परमाणु चार अन्य परमाणुओं से चार एकल सहसंयोजी बंधों द्वारा जुड़ा होता है और अणु की संरचना चतुष्फलकीय (टेट्राहेड्रल) होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड, CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईथीन, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईथाइन, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेन, CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेन, CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, में कार्बन के </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 संयोजी इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> होते हैं और वह हर एक को एक हाइड्रोजन परमाणु के साथ साझा करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार एक कार्बन परमाणु से </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 हाइड्रोजन परमाणुओं</span><span style=\"font-family:'Mangal'\"> तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 एकल सहसंयोजी बंध</span><span style=\"font-family:'Mangal'\"> बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये चारों बंध चतुष्फलक (टेट्राहेड्रल) के चारों कोनों की ओर होते हैं, इसलिए मेथेन </span><span style=\"font-weight:bold;font-family:'Mangal'\">चतुष्फलकीय</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड में </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 द्विबंध</span><span style=\"font-family:'Mangal'\"> होते हैं, ईथीन में कार्बनों के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विबंध</span><span style=\"font-family:'Mangal'\"> होता है और ईथाइन में कार्बनों के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्रिबंध</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए इनमें से किसी में भी कार्बन परमाणु के चार एकल बंध नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चतुष्फलकीय अणु मेथेन, CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक स्लाइड प्रोजेक्टर में 12 cm फोकस दूरी का उत्तल लेंस लगा है। स्लाइड को लेंस से 30 cm की दूरी पर रखा गया है। लेंस से प्रतिबिंब (पर्दे) की दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+8.6 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+20 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−20 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+42 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र: 1/v − 1/u = 1/f. नई कार्तीय चिह्न परिपाटी का उपयोग किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान लीजिए u वस्तु दूरी, v प्रतिबिंब दूरी और f फोकस दूरी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु लेंस के बाईं ओर रखी है, इसलिए u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस उत्तल है, इसलिए उसकी फोकस दूरी धनात्मक है: f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+12 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = 1/f + 1/u = 1/12 + 1/(−30) = 1/12 − 1/30.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = (5 − 2)/60 = 3/60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/20</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+20 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक चिह्न दर्शाता है कि प्रतिबिंब वास्तविक है और लेंस के दूसरी ओर बनता है, जहाँ पर्दा रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प +8.6 cm, u = +30 cm लेने से आता है, जो चिह्न परिपाटी के विरुद्ध है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दूरी +20 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंद्रधनुष के बनने के बारे में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. इंद्रधनुष तब दिखाई देता है जब सूर्य प्रेक्षक के पीछे हो और जल की बूँदें प्रेक्षक के सामने हों।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. बूँद में प्रवेश करने वाला प्रकाश अपवर्तित और विक्षेपित होता है, फिर आंतरिक परावर्तित होता है, और बूँद से बाहर निकलते समय पुनः अपवर्तित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो 1 और न ही 2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 1: इंद्रधनुष सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य की विपरीत दिशा</span><span style=\"font-family:'Mangal'\"> में बनता है। अतः प्रेक्षक के पीछे सूर्य और सामने बूँदें होनी चाहिए। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सही</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन 2: प्रत्येक बूँद छोटे प्रिज़्म की तरह कार्य करती है। वह सूर्य के प्रकाश को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपवर्तित और विक्षेपित</span><span style=\"font-family:'Mangal'\"> करती है, उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंतरिक परावर्तित</span><span style=\"font-family:'Mangal'\"> करती है, और बाहर निकलते समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनः अपवर्तित</span><span style=\"font-family:'Mangal'\"> करती है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सही</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कथन 1 और 2 दोनों सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेंज़ीन, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, के लिए कौन-सा वर्णन उपयुक्त है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधी शृंखला वाला संतृप्त हाइड्रोकार्बन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वलय में एकांतर द्विबंध वाला चक्रीय असंतृप्त हाइड्रोकार्बन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिबंध वाला शाखित शृंखला हाइड्रोकार्बन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल एकल बंध वाला चक्रीय संतृप्त हाइड्रोकार्बन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेंज़ीन का सूत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> है और इसमें केवल कार्बन और हाइड्रोजन हैं, इसलिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोकार्बन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके छह कार्बन परमाणु एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">वलय</span><span style=\"font-family:'Mangal'\"> में जुड़े हैं, इसलिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">चक्रीय</span><span style=\"font-family:'Mangal'\"> यौगिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वलय में कार्बन परमाणुओं के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकांतर द्विबंध</span><span style=\"font-family:'Mangal'\"> हैं, इसलिए बेंज़ीन </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंतृप्त</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल एकल बंध वाला चक्रीय यौगिक संतृप्त होता है, जैसे साइक्लोहेक्सेन, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\">। बेंज़ीन ऐसा नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेंज़ीन में न शृंखला है और न त्रिबंध।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बेंज़ीन वलय में एकांतर द्विबंध वाला चक्रीय असंतृप्त हाइड्रोकार्बन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेन से लिखना एक ऐच्छिक गति है, जो बाँह की हड्डियों से जुड़ी पेशियों द्वारा होती है। इन पेशियों का सही वर्णन किस पंक्ति में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंकाल पेशी: अशाखित, अनेक केंद्रक, धारीदार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हृदय पेशी: शाखित, एक केंद्रक, हल्की धारियाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिकनी पेशी: तर्कुरूप, एक केंद्रक, धारियाँ नहीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंकाल पेशी: शाखित, एक केंद्रक, धारियाँ नहीं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चेतन नियंत्रण में होने वाली गतियाँ (दौड़ना, लिखना, वस्तुएँ उठाना) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐच्छिक गतियाँ</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐच्छिक गतियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंकाल पेशियों</span><span style=\"font-family:'Mangal'\"> द्वारा होती हैं, जो कंकाल से जुड़ी होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंकाल पेशी के तंतु लंबी, बेलनाकार कोशिकाएँ हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अशाखित, बहुकेंद्रकी</span><span style=\"font-family:'Mangal'\"> (अनेक केंद्रक) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारीदार</span><span style=\"font-family:'Mangal'\"> (हल्की और गहरी पट्टियाँ) होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिकनी पेशी तर्कुरूप होती है और उसमें धारियाँ नहीं होतीं, तथा हृदय पेशी शाखित होती है, उसमें एक केंद्रक होता है और वह केवल हृदय में पाई जाती है; दोनों अनैच्छिक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D में नाम सही है पर लक्षण गलत हैं, क्योंकि कंकाल पेशी के तंतु शाखित नहीं होते और धारीदार होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये कंकाल पेशियाँ हैं: अशाखित, अनेक केंद्रक, धारीदार </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूट्रॉन के बारे में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. उस पर कोई विद्युत आवेश नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. उसका द्रव्यमान प्रोटॉन के द्रव्यमान के लगभग बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो 1 और न ही 2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. न्यूट्रॉन का आपेक्षिक आवेश </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए वह विद्युत उदासीन है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चैडविक को ऐसा कण मिला जिसका द्रव्यमान </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटॉन के लगभग बराबर</span><span style=\"font-family:'Mangal'\"> था और जिस पर कोई आवेश नहीं था → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कथन 1 और 2 दोनों सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम ट्रेकीड, वाहिकाओं, जाइलम तंतुओं और जाइलम पैरेन्काइमा से बना होता है। इनमें से जाइलम का एकमात्र जीवित घटक कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम पैरेन्काइमा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ट्रेकीड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाहिकाएँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम तंतु</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम के चार घटक होते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">ट्रेकीड, वाहिकाएँ, जाइलम तंतु और जाइलम पैरेन्काइमा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ट्रेकीड और वाहिकाएँ नलिकाकार और मोटी भित्ति वाली होती हैं, और ये जल तथा खनिज ले जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ट्रेकीड, वाहिकाएँ और जाइलम तंतु मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्क्लेरेन्काइमा</span><span style=\"font-family:'Mangal'\"> प्रकृति के होते हैं, इसलिए ये निर्जीव होते हैं और पौधे को मज़बूती देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जाइलम पैरेन्काइमा</span><span style=\"font-family:'Mangal'\"> जाइलम का एकमात्र जीवित घटक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जाइलम का एकमात्र जीवित घटक जाइलम पैरेन्काइमा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहू, शार्क और समुद्री घोड़ा पानी में साँस लेने के लिए क्लोम और चलने के लिए पंखों का उपयोग करते हैं। ये जंतु कशेरुकी के किस वर्ग में आते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उभयचर (Amphibia)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरीसृप (Reptilia)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछली वर्ग (Pisces)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्तनधारी (Mammalia)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कशेरुकी जंतुओं में रीढ़ की हड्डी होती है और उन्हें पाँच समूहों में बाँटा जाता है: मछली, उभयचर, सरीसृप, पक्षी और स्तनधारी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पंख और क्लोम</span><span style=\"font-family:'Mangal'\"> मछलियों को पानी में चलने और साँस लेने में सहायता देते हैं, इसलिए रोहू, शार्क और समुद्री घोड़ा </span><span style=\"font-weight:bold;font-family:'Mangal'\">मछलियाँ</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियों का वर्ग </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिसीज</span><span style=\"font-family:'Mangal'\"> कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उभयचर (मेंढक), सरीसृप (छिपकली) और स्तनधारी (मनुष्य) के आवास, शरीर के आवरण और प्रजनन की विधियाँ भिन्न होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये जंतु वर्ग पिसीज में आते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छोटा विद्युत पंप 2 मिनट में 120 J कार्य करता है। उसकी शक्ति कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 W</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 W</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14400 W</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति = किया गया कार्य / लिया गया समय, और समय का SI मात्रक सेकंड है, इसलिए पहले समय को मिनट से सेकंड में बदलना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W = किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">t = लिया गया समय = 2 मिनट = 2 × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = शक्ति = W / t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = 120 / 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 W</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 W मिनट को सेकंड में बदले बिना 2 से भाग देता है, 240 W कार्य को 2 मिनट से गुणा कर देता है, और 14400 W भाग देने के बजाय कार्य को 120 s से गुणा कर देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पंप की शक्ति 1 W है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नियत त्वरण से गति करती एक वस्तु का वेग-समय ग्राफ (t = 0 s, v = 5 m/s) से (t = 8 s, v = 21 m/s) तक एक सीधी रेखा है। इन 8 s में वस्तु का विस्थापन कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">208 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">104 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग-समय ग्राफ और समय अक्ष से घिरा क्षेत्रफल विस्थापन देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधी रेखा वाले ग्राफ के नीचे की आकृति </span><span style=\"font-weight:bold;font-family:'Mangal'\">समलंब</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">u = प्रारंभिक वेग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = अंतिम वेग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">t = समय = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = समलंब का क्षेत्रफल = (1/2) × (u + v) × t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = (1/2) × (5 + 21) × 8 = (1/2) × 26 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">104 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">208 m में (1/2) का गुणक छूट जाता है, 168 m पूरे 8 s को अंतिम वेग 21 m/s पर मान लेता है, और 40 m पूरे 8 s को प्रारंभिक वेग 5 m/s पर मान लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु का विस्थापन 104 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो ध्वनियों X और Y की प्रबलता समान है। हवा में किसी बिंदु से प्रति सेकंड ध्वनि X के संपीडन, ध्वनि Y से अधिक गुज़रते हैं। कौन-सी तुलना सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X का आयाम अधिक है और आवृत्ति अधिक है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X का आयाम समान है और आवृत्ति कम है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X का आयाम अधिक है और आवृत्ति समान है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X का आयाम समान है और आवृत्ति अधिक है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हम ध्वनि तरंग के </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयाम</span><span style=\"font-family:'Mangal'\"> को प्रबलता के रूप में सुनते हैं, इसलिए समान प्रबलता वाली ध्वनियों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयाम समान</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवृत्ति किसी बिंदु से </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रति सेकंड</span><span style=\"font-family:'Mangal'\"> गुज़रने वाले संपीडनों (और विरलनों) की संख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X के संपीडन प्रति सेकंड अधिक होने का अर्थ है कि X की </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवृत्ति अधिक</span><span style=\"font-family:'Mangal'\"> है (और हवा में चाल समान होने के कारण उसकी तरंगदैर्ध्य कम है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रबलता आवृत्ति के साथ नहीं बदलती, इसलिए अधिक आवृत्ति का अर्थ अधिक आयाम नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X का आयाम Y के समान और आवृत्ति अधिक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पाइरोगाइरा जैसे थैलोफाइट के बारे में कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शरीर जड़, तने और पत्तियों में विभाजित होता है; शुष्क स्थानों में पाए जाते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शरीर जड़, तने और पत्तियों में विभेदित नहीं होता; मुख्यतः जल या नम स्थानों में पाए जाते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीज नग्न होते हैं और शंकुओं में लगते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुष्प और फल पाए जाते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैलोफाइट सरलतम पौधों में से हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">थैलॉस</span><span style=\"font-family:'Mangal'\"> का अर्थ अविभेदित शरीर है, इसलिए थैलोफाइट में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक जड़, तना या पत्तियाँ नहीं</span><span style=\"font-family:'Mangal'\"> होतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल या नम स्थानों</span><span style=\"font-family:'Mangal'\"> में पाए जाते हैं। स्पाइरोगाइरा इसका उदाहरण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़, तना और पत्तियाँ उच्च पौधों में होती हैं, थैलोफाइट में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शंकुओं में नग्न बीज अनावृतबीजी पौधों में और पुष्प व फल आवृतबीजी पौधों में होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः थैलोफाइट का शरीर अविभेदित होता है और ये मुख्यतः जल या नम स्थानों में रहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {
