style=\"font-weight:bold;font-family:'Mangal'\">1 अरब अमेरिकी डॉलर</span><span style=\"font-family:'Mangal'\"> से अधिक और कैंसर को पहली बार G7 की प्राथमिकता बनाना शामिल था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">51वाँ</span><span style=\"font-family:'Mangal'\"> सम्मेलन </span><span style=\"font-weight:bold;font-family:'Mangal'\">कनानास्किस, कनाडा</span><span style=\"font-family:'Mangal'\"> (जून 2025) में, 50वाँ बोर्गो एग्नाज़िया, अपुलिया, </span><span style=\"font-weight:bold;font-family:'Mangal'\">इटली</span><span style=\"font-family:'Mangal'\"> (2024) में और 49वाँ हिरोशिमा, </span><span style=\"font-weight:bold;font-family:'Mangal'\">जापान</span><span style=\"font-family:'Mangal'\"> (2023) में हुआ था; G7 में कनाडा, फ्रांस, जर्मनी, इटली, जापान, ब्रिटेन और अमेरिका हैं तथा यूरोपीय संघ भी भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेज़बान देश </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्रांस (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सी नदी अमरकंटक पठार से निकलती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नर्मदा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोदावरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महानदी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृष्णा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नर्मदा</span><span style=\"font-family:'Mangal'\"> नदी </span><span style=\"font-weight:bold;font-family:'Mangal'\">मध्य प्रदेश</span><span style=\"font-family:'Mangal'\"> की मैकाल पहाड़ियों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमरकंटक पठार</span><span style=\"font-family:'Mangal'\"> से निकलती है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">विंध्य</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">सतपुड़ा</span><span style=\"font-family:'Mangal'\"> पर्वतमालाओं के बीच भ्रंश घाटी से होकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> की ओर बहती हुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">खंभात की खाड़ी</span><span style=\"font-family:'Mangal'\"> (अरब सागर) में गिरती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसकी लंबाई लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,312 km</span><span style=\"font-family:'Mangal'\"> है; जबलपुर के पास </span><span style=\"font-weight:bold;font-family:'Mangal'\">संगमरमर की चट्टानें</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">धुआँधार जलप्रपात</span><span style=\"font-family:'Mangal'\"> तथा गुजरात में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरदार सरोवर</span><span style=\"font-family:'Mangal'\"> बाँध इसी पर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गोदावरी</span><span style=\"font-family:'Mangal'\"> नासिक (महाराष्ट्र) के पास </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्र्यंबकेश्वर</span><span style=\"font-family:'Mangal'\"> से, </span><span style=\"font-weight:bold;font-family:'Mangal'\">महानदी</span><span style=\"font-family:'Mangal'\"> छत्तीसगढ़ के धमतरी ज़िले में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिहावा</span><span style=\"font-family:'Mangal'\"> के पास से और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कृष्णा</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">महाबलेश्वर</span><span style=\"font-family:'Mangal'\"> (महाराष्ट्र) के पास से निकलती है; तीनों पूर्व की ओर बहकर बंगाल की खाड़ी में गिरती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नदी </span><span style=\"font-weight:bold;font-family:'Mangal'\">नर्मदा (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत की पहली हाइड्रोजन-चालित ट्रेन \"नमो ग्रीन रेल\" को प्रधानमंत्री नरेंद्र मोदी ने 17 जुलाई 2026 को हरी झंडी दिखाई। यह किस राज्य में जींद और सोनीपत के बीच चलती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पंजाब</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हरियाणा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राजस्थान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर प्रदेश</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत की पहली </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन-चालित ट्रेन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"नमो ग्रीन रेल\"</span><span style=\"font-family:'Mangal'\"> को प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 जुलाई 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">जींद</span><span style=\"font-family:'Mangal'\"> में रेल मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">अश्विनी वैष्णव</span><span style=\"font-family:'Mangal'\"> और हरियाणा के मुख्यमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नायब सिंह सैनी</span><span style=\"font-family:'Mangal'\"> की उपस्थिति में हरी झंडी दिखाई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरियाणा</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जींद जंक्शन और सोनीपत</span><span style=\"font-family:'Mangal'\"> के बीच (लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 km</span><span style=\"font-family:'Mangal'\">) गोहाना होकर चलती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 डिब्बों</span><span style=\"font-family:'Mangal'\"> की ट्रेन-सेट में </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 ड्राइविंग पावर कार और 8 ट्रेलर कोच</span><span style=\"font-family:'Mangal'\"> हैं, क्षमता लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,600 यात्री</span><span style=\"font-family:'Mangal'\"> और अधिकतम सेवा गति </span><span style=\"font-weight:bold;font-family:'Mangal'\">75 km/h</span><span style=\"font-family:'Mangal'\"> (डिज़ाइन गति 110 km/h) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक ड्राइविंग पावर कार </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन ईंधन सेल</span><span style=\"font-family:'Mangal'\"> से </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 kW</span><span style=\"font-family:'Mangal'\"> (कुल 2,400 kW) शक्ति देती है, जिनका एकमात्र उप-उत्पाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलवाष्प</span><span style=\"font-family:'Mangal'\"> है; जींद में हाइड्रोजन भंडारण और रीफ्यूलिंग सुविधा बनाई गई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके साथ भारत हाइड्रोजन ट्रेन चलाने वाले देशों </span><span style=\"font-weight:bold;font-family:'Mangal'\">जर्मनी, जापान, चीन और अमेरिका</span><span style=\"font-family:'Mangal'\"> में शामिल हो गया; जर्मनी ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">2022</span><span style=\"font-family:'Mangal'\"> में विश्व का पहला हाइड्रोजन ट्रेन बेड़ा शुरू किया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राज्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरियाणा (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 अगस्त 2026 को कमलांग टाइगर रिज़र्व के भीतर स्थित ग्लॉ झील को भारत का 101वाँ रामसर स्थल घोषित किया गया, जो अपने राज्य का पहला रामसर स्थल है। ग्लॉ झील किस राज्य में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुजरात</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">असम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अरुणाचल प्रदेश</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लद्दाख</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अरुणाचल प्रदेश</span><span style=\"font-family:'Mangal'\"> की </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्लॉ झील</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 अगस्त 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">रामसर स्थल</span><span style=\"font-family:'Mangal'\"> (अंतरराष्ट्रीय महत्व की आर्द्रभूमि) घोषित किया गया। यह भारत का </span><span style=\"font-weight:bold;font-family:'Mangal'\">101वाँ</span><span style=\"font-family:'Mangal'\"> रामसर स्थल और अरुणाचल प्रदेश का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहला</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">झील पूर्वी हिमालय में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कमलांग टाइगर रिज़र्व और वन्यजीव अभयारण्य</span><span style=\"font-family:'Mangal'\"> के भीतर स्थित है; स्थल और उसके जलग्रहण क्षेत्र में </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 से अधिक वृक्ष प्रजातियाँ</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 ऑर्किड प्रजातियाँ</span><span style=\"font-family:'Mangal'\"> दर्ज हैं; भारत के रामसर स्थल </span><span style=\"font-weight:bold;font-family:'Mangal'\">2014 के 26 से बढ़कर 101</span><span style=\"font-family:'Mangal'\"> हो गए हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे पहले 2026 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 जनवरी</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">पटना पक्षी अभयारण्य</span><span style=\"font-family:'Mangal'\"> (एटा, </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर प्रदेश</span><span style=\"font-family:'Mangal'\">) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">छारी-ढांड</span><span style=\"font-family:'Mangal'\"> (कच्छ, </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुजरात</span><span style=\"font-family:'Mangal'\">) जोड़े गए, जिससे संख्या 98 हुई; </span><span style=\"font-weight:bold;font-family:'Mangal'\">दीपोर बील</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">असम</span><span style=\"font-family:'Mangal'\"> का और </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्सो कार</span><span style=\"font-family:'Mangal'\"> व </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्सोमोरिरी</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">लद्दाख</span><span style=\"font-family:'Mangal'\"> के रामसर स्थल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रामसर अभिसमय पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">1971</span><span style=\"font-family:'Mangal'\"> में रामसर (ईरान) में हस्ताक्षर हुए; भारत </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 फरवरी 1982</span><span style=\"font-family:'Mangal'\"> को इसमें शामिल हुआ और </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 फरवरी</span><span style=\"font-family:'Mangal'\"> विश्व आर्द्रभूमि दिवस के रूप में मनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राज्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">अरुणाचल प्रदेश (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कस्बे की जनसंख्या 8,000 थी। एक वर्ष में पुरुषों की संख्या 8% और महिलाओं की संख्या 12% बढ़ी, और जनसंख्या 8,840 हो गई। प्रारंभ में कस्बे में महिलाओं और पुरुषों की संख्याओं का अंतर क्या था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रारंभिक पुरुषों की संख्या m लें, अतः प्रारंभिक महिलाओं की संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,000 − m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई जनसंख्या: m × 108% + (8,000 − m) × 112% = 8,840</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.08m + 8,960 − 1.12m = 8,840</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8,960 − 8,840 = 1.12m − 1.08m → 120 = 0.04m → m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महिलाएँ = 8,000 − 3,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: e=\"font-weight:bold;font-family:'Mangal'\">₹62.88</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष माल = 100 − 48 = 52%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा भाग: शेष का 25% = 52 का 25% = माल का 13%, लागत ₹13, 16% लाभ पर → SP = 13 × 116% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15.08</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा भाग: बाकी = 52 − 13 = माल का 39%, लागत ₹39, 32% हानि पर → SP = 39 × 68% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹26.52</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल SP = 62.88 + 15.08 + 26.52 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹104.48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल लाभ = 104.48 − 100 = ₹100 पर ₹4.48 → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.48 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बल्लेबाज़ का 16 पारियों में औसत 38 रन है। 17वीं पारी में वह 89 रन बनाता है। उसका औसत कितने रन बढ़ जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span sty e=\"font-family:'Mangal'\">बहुलक = l + [(f₁ − f₀)/(2f₁ − f₀ − f₂)] × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + [(13 − 7)/(2 × 13 − 7 − 9)] × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + (6/10) × 10 = 20 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: बहुलक = l + (f₁ − f₀)/(2f₁ − f₀ − f₂) × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वितरण का बहुलक </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप A एक टंकी को दूसरे पाइप B की तुलना में तीन गुना तेज़ी से भर सकता है। यदि दोनों पाइप एक साथ काम करके टंकी को 36 मिनट में भर सकते हैं, तो धीमा पाइप अकेला टंकी को कितने समय में भरेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">82 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">144 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 मिनट</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धीमा पाइप B अकेला टंकी को t मिनट में भरता है, अतः B का 1 मिनट का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A तीन गुना तेज़ है, अतः A का 1 मिनट का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/t</span><span style=\"font-family:'Mangal'\"> (A अकेला t/3 मिनट लेता है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों का मिलकर 1 मिनट का काम: 1/t + 3/t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे टंकी 36 मिनट में भरते हैं: 4/t = 1/36 → t = 4 × 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A अकेला 48 मिनट लेता है; 1/48 + 1/144 = (3 + 1) / 144 = 4/144 = 1/36 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: कार्यकुशलता A : B = 3 : 1 → B कुल काम का 1/4 करता है, अतः B अकेला 4 × 36 = 144 मिनट लेता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धीमा पाइप अकेला टंकी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">144 मिनट (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में भरेगा।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कौशल 120 km/h की चाल से 7 घंटे 31 मिनट तक चला। उसी दूरी को 22 घंटे में तय करने के लिए उसे किस चाल (km/h में) से चलना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">39</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय को घंटों में बदलें: 7 घंटे 31 मिनट = 7 + 31/60 घंटे = </span><span style=\"font-weight:bold;font-family:'Mangal'\">451/60 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी = चाल × समय = (120 × 451) / 60 = 2 × 451 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">902 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब उसी दूरी को 22 घंटे में तय करना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट चाल = दूरी / समय = 902 / 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">41 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समान दूरी के लिए चाल × समय स्थिर रहता है: (120 × 451) / 60 = S × 22 → S = 902 / 22 = 41</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट चाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">41 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> km/h है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक रेलगाड़ी 1,560 m और 960 m लंबी दो सुरंगों को क्रमशः 60 सेकंड और 40 सेकंड में पूरी तरह पार करती है। रेलगाड़ी की लंबाई क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेलगाड़ी की लंबाई L m और चाल v m/s लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुरंग को पूरी तरह पार करने में रेलगाड़ी (सुरंग की लंबाई + अपनी लंबाई) तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली सुरंग: L + 1,560 = 60v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी सुरंग: L + 960 = 40v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घटाएँ: (L + 1,560) − (L + 960) = 60v − 40v → 600 = 20v → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समीकरण से: L = 40 × 30 − 960 = 1,200 − 960 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: L + 1,560 = 1,800 = 60 × 30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: चाल = (सुरंगों की लंबाई का अंतर) / (समय का अंतर) = 600 / 20 = 30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रेलगाड़ी की लंबाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 m (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.6, 1.5 और 0.36 का LCM (लघुत्तम समापवर्त्य) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी संख्याओं को समान दशमलव स्थानों (दो) तक लिखें: 0.60, 1.50, 0.36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दशमलव बिंदु हटाकर 60, 150 और 36 का LCM (लघुत्तम समापवर्त्य) निकालें</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 = 2² × 3 × 5; 150 = 2 × 3 × 5²; 36 = 2² × 3²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2² × 3² × 5² = 4 × 9 × 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दशमलव बिंदु वापस रखें (दो स्थान): 900 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">9.00 = 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 9 / 0.6 = 15, 9 / 1.5 = 6, 9 / 0.36 = 25; सभी पूर्ण संख्याएँ ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दशमलवों का LCM = बिना बिंदु वाली संख्याओं का LCM, फिर उतने ही दशमलव स्थान वापस रखें</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः LCM </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्री मदन को अंग्रेज़ी में 10 में से 9 अंक, जीव विज्ञान में 16 में से 15 अंक मिले और उनके अंग्रेज़ी तथा गणित के अंकों के प्रतिशत का अनुपात 15 : 16 है। यदि गणित के कुल अंक 20 हैं, तो उनके गणित और जीव विज्ञान के अंकों के प्रतिशत का अंतर ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.35%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5.25%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी में प्रतिशत = 9/10 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीव विज्ञान में प्रतिशत = 15/16 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">93.75%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी % : गणित % = 15 : 16, अतः गणित % = (90 × 16) / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(गणित के अंक = 20 का 96% = 19.2; कुल अंक 20 होने से प्रतिशत नहीं बदलता।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = गणित % − जीव विज्ञान % = 96% − 93.75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.25% (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ऑटो-रिक्शा एक निश्चित किराया और प्रति किलोमीटर शुल्क लेता है। अमन 8 km की यात्रा के लिए ₹190 देता है और बेला 14 km की यात्रा के लिए ₹310 देती है। निश्चित किराया और प्रति किलोमीटर शुल्क क्या हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निश्चित किराया = ₹40; प्रति km शुल्क = ₹18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निश्चित किराया = ₹50; प्रति km शुल्क = ₹17.50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निश्चित किराया = ₹30; प्रति km शुल्क = ₹20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निश्चित किराया = ₹20; प्रति km शुल्क = ₹22.50</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निश्चित किराया ₹f और प्रति किलोमीटर शुल्क ₹c लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमन की यात्रा: f + 8c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेला की यात्रा: f + 14c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समीकरण में से पहला घटाएँ: (f + 14c) − (f + 8c) = 310 − 190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6c = 120 → c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समीकरण में रखें: f + 8 × 20 = 190 → f = 190 − 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 30 + 14 × 20 = 30 + 280 = 310 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रति km शुल्क = (किराए का अंतर) / (दूरी का अंतर) = 120 / 6 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">निश्चित किराया = ₹30; प्रति km शुल्क = ₹20 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धनराशि पर 10% वार्षिक दर से 1½ वर्ष के अर्धवार्षिक संयोजित चक्रवृद्धि ब्याज और साधारण ब्याज का अंतर ₹61 है। धनराशि क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹9,000</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्धवार्षिक संयोजन: प्रति छमाही दर = 10% / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5%</span><span style=\"font-family:'Mangal'\">, 1½ वर्ष में छमाहियों की संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनराशि ₹P लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CI पर मिश्रधन = P × (1.05)³ = P × 1.05 × 1.05 × 1.05 = P × 1.157625 → CI = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.157625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × 10 × 1.5) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.15P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CI − SI = 0.157625P − 0.15P = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.007625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.007625P = 61 → P = 61 / 0.007625 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: CI = 8,000 × 0.157625 = 1,261; SI = 8,000 × 0.15 = 1,200; अंतर = 61 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रति अवधि r% पर 3 अवधियों के लिए CI − SI = P(r/100)²(3 + r/100) = P × 0.0025 × 3.05 = 0.007625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,000 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17³ − 12³ का मान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,125</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,285</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,185</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,085</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सर्वसमिका a³ − b³ = (a − b)(a² + ab + b²) का प्रयोग करने पर, जहाँ a = 17 और b = 12.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a − b = 17 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a² = 17² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">289</span><span style=\"font-family:'Mangal'\">; ab = 17 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">204</span><span style=\"font-family:'Mangal'\">; b² = 12² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a² + ab + b² = 289 + 204 + 144 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">637</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17³ − 12³ = 5 × 637 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,185</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 17³ = 4,913 और 12³ = 1,728; 4,913 − 1,728 = 3,185 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: a³ − b³ = (a − b)(a² + ab + b²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,185 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक समलंब की समांतर भुजाएँ 26 cm और 10 cm हैं, और उसकी दोनों असमांतर भुजाओं में से प्रत्येक 17 cm है। समलंब का क्षेत्रफल (cm² में) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">255</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटी समांतर भुजा के सिरों से बड़ी समांतर भुजा पर लंब डालें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों बराबर असमांतर भुजाएँ बड़ी भुजा पर बराबर लंबाई काटती हैं: (26 − 10) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 cm</span><span style=\"font-family:'Mangal'\"> प्रत्येक</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समकोण त्रिभुज में: कर्ण = 17 cm (असमांतर भुजा), आधार = 8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई = √(17² − 8²) = √(289 − 64) = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षेत्रफल = ½ × (समांतर भुजाओं का योग) × ऊँचाई = ½ × (26 + 10) × 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ½ × 36 × 15 = 18 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 8-15-17 एक पाइथागोरस त्रिक है, अतः ऊँचाई तुरंत 15 cm मिल जाती है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समलंब का क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> cm² है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालिका एक विद्यालय की पाँच कक्षाओं में लड़कों और लड़कियों की संख्या दर्शाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790226991479_image002.png\" width=\"269\" height=\"85\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि कक्षा VII के 25% लड़के और 20% लड़कियाँ एक प्रश्नोत्तरी में भाग लेते हैं, तो कक्षा VII के कितने विद्यार्थी प्रश्नोत्तरी में भाग नहीं लेते?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">88</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालिका से, कक्षा VII में 64 लड़के और 45 लड़कियाँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाग लेने वाले लड़के = 64 का 25% = (64 × 25) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाग लेने वाली लड़कियाँ = 45 का 20% = (45 × 20) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाग लेने वाले विद्यार्थी = 16 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कक्षा VII के कुल विद्यार्थी = 64 + 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">109</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाग न लेने वाले विद्यार्थी = 109 − 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: भाग न लेने वाले = (64 − 16) + (45 − 9) = 48 + 36 = 84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भाग न लेने वाले विद्यार्थियों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">84 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिया और उसके पिता की वर्तमान आयु 3 : 8 के अनुपात में हैं और उनकी आयु का गुणनफल 600 है। 5 वर्ष बाद उनकी आयु का अनुपात क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 : 5</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान आयु 3x और 8x वर्ष लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयु का गुणनफल: 3x × 8x = function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

  }

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
