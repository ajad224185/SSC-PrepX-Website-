"><span style=\"font-family:'Mangal'\">पहले कोष्ठक: 12 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (+ से पहले ÷ और ×): 36 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\">; 5 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 9 + 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">49 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'birds fly very high' को 'ma tu ke ro', 'planes fly across sky' को 'zo ke pi na' और 'high sky blue clouds' को 'fa tu pi lu' लिखा जाता है। (सभी कूट केवल दो अक्षरों के हैं।) उसी भाषा में 'across' का संभावित कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'ke' या 'zo'</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'pi' या 'na'</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'na' या 'zo'</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'na' या 'tu'</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो वाक्यों में उभयनिष्ठ शब्द और उन्हीं दो वाक्यों में उभयनिष्ठ कूट ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1 और 2: उभयनिष्ठ शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">fly</span><span style=\"font-family:'Mangal'\">, उभयनिष्ठ कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">ke</span><span style=\"font-family:'Mangal'\"> → fly = ke</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1 और 3: उभयनिष्ठ शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">high</span><span style=\"font-family:'Mangal'\">, उभयनिष्ठ कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">tu</span><span style=\"font-family:'Mangal'\"> → high = tu</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 2 और 3: उभयनिष्ठ शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">sky</span><span style=\"font-family:'Mangal'\">, उभयनिष्ठ कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">pi</span><span style=\"font-family:'Mangal'\"> → sky = pi</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 2: planes fly across sky → zo ke pi na; fly = ke और sky = pi, अतः कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">zo</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">na</span><span style=\"font-family:'Mangal'\"> 'planes' और 'across' के लिए बचते हैं (किसी क्रम में)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी अन्य वाक्य में 'planes' या 'across' नहीं है, अतः 'across' का कूट na या zo है; ke, pi और tu अन्य शब्दों के लिए पहले ही तय हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'across' का संभावित कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">'na' या 'zo' (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14, एक निश्चित तर्क के अनुसार 101 से संबंधित है। उसी तर्क के अनुसार 22, 157 से संबंधित है। उसी तर्क के अनुसार 31 दिए गए विकल्पों में से किससे संबंधित है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">217</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">224</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">220</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">213</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 → 101: 14 × 7 = 98; 98 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">101</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 → 157: 22 × 7 = 154; 154 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">157</span><span style=\"font-family:'Mangal'\"> → नियम: दूसरी संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(पहली संख्या × 7) + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(जाँच: दिए गए दो युग्म नियम को निश्चित करते हैं, क्योंकि 157 − 101 = 56 = 7 × (22 − 14).)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31 → 31 × 7 = 217; 217 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">220</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">217 में + 3 नहीं जोड़ा गया; 224 = 31 × 7 + 7; 213 = 31 × 7 − 4. कोई भी नियम का पालन नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 31, </span><span style=\"font-weight:bold;font-family:'Mangal'\">220 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आर्यन बिंदु P से चलकर 4 m दक्षिण की ओर जाता है। फिर वह बाएँ मुड़कर 3 m चलता है। फिर वह एक बार और बाएँ मुड़कर 8 m चलता है। फिर वह दाएँ मुड़कर 2 m चलता है। अंत में वह दाएँ मुड़कर 4 m चलकर बिंदु Q पर रुकता है। बिंदु P पर पुनः पहुँचने के लिए उसे किस दिशा में चलना चाहिए? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 m दक्षिण → (0, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाईं ओर मुड़ना → पूर्व, 3 m → (3, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके बाईं ओर मुड़ना → उत्तर, 8 m → (3, 4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 2 m → (5, 4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके दाईं ओर मुड़ना → दक्षिण, 4 m → Q = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">5, 0</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P से ठीक 5 m पूर्व में है, अतः P पर पहुँचने के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> की ओर चलना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> की ओर चलना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति A, L, M, I, R, H और S एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं। S के दाईं ओर कोई नहीं बैठा है। S और H के बीच केवल तीन व्यक्ति बैठे हैं। H और R के बीच केवल दो व्यक्ति बैठे हैं। M, L के बाईं ओर तीसरे स्थान पर बैठा है। I, L के ठीक दाईं ओर बैठा है। A और R के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख उत्तर की ओर है, अतः ‘दाएँ’ पूर्व की ओर है। सीटों को 1 (बायाँ छोर) से 7 (दायाँ छोर) तक क्रमांक दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S के दाईं ओर कोई नहीं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और H के बीच तीन व्यक्ति → H = 7 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H और R के बीच दो व्यक्ति → R = 3 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> (3 − 3 = 0 कोई सीट नहीं है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I, L के ठीक दाईं ओर और M, L के बाईं ओर तीसरे स्थान पर → L और I को 1, 2, 4, 5 में से दो क्रमागत खाली सीटें चाहिए: (1, 2) लेने पर M सीट −2 पर होता ✗, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">L = 4, I = 5, M = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष सीट 2 </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> की है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">M – A – H – L – I – R – S</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A (सीट 2) और R (सीट 6) के बीच: H, L, I → </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> व्यक्ति बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B, C, D, E, F और G एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। C, A के बाईं ओर दूसरे स्थान पर बैठा है। C के बाईं ओर से गिनने पर C और E के बीच केवल एक व्यक्ति बैठा है। B, E के दाईं ओर तीसरे स्थान पर बैठा है। G, A और D दोनों का निकटतम पड़ोसी है। F के ठीक दाईं ओर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख केंद्र की ओर है, अतः ‘दाएँ’ = दक्षिणावर्त (clockwise) और ‘बाएँ’ = वामावर्त (anticlockwise)। सीटों को दक्षिणावर्त 1 से 7 तक क्रमांक दें, </span><span style=\"font-weight:bold;font-family:'Mangal'\">A सीट 1 पर</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के बाईं ओर दूसरे स्थान पर → C = 1 − 2 = −1 → −1 + 7 = 6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C के बाईं ओर से गिनने पर C और E के बीच एक व्यक्ति → E = 6 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, E के दाईं ओर तीसरे स्थान पर → B = 4 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, A (सीट 1) का पड़ोसी → G = 2 या 7; सीट 7 पर B है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 2</span><span style=\"font-family:'Mangal'\">. G, D का भी पड़ोसी → D = 1 या 3; सीट 1 पर A है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष सीट 5 </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> की है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (A से दक्षिणावर्त): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A – G – D – E – F – C – B</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F (सीट 5) के ठीक दाईं ओर (दक्षिणावर्त) सीट 6 → C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः F के ठीक दाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">C (विकल्प C)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># : NRU :: FJM : %</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = HLO, % = LPS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = HLO, % = LPR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = HKO, % = LPS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = TXA, % = LPS</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक युग्म में दूसरे समूह का प्रत्येक अक्षर पहले समूह के संगत अक्षर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 स्थान आगे</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बायाँ युग्म: # → NRU, अतः # = NRU − 6: N − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, R − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, U − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> → # = HLO</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दायाँ युग्म: FJM → %, अतः % = FJM + 6: F + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, J + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, M + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\"> → % = LPS</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य जाँचें: LPR में R (M + 5) है, HKO में K (R − 7) है, TXA = NRU + 6 है (गलत दिशा)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = HLO, % = LPS (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BHD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MSO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TZV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GMJ</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BHD: B + 6 = H, H − 4 = D → (+6, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MSO: M + 6 = S, S − 4 = O → (+6, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TZV: T + 6 = Z, Z − 4 = V → (+6, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GMJ: G + 6 = M, M − 3 = J → (+6, </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+6, −4) का पालन करते हैं; केवल GMJ नहीं (M − 4 = I होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">GMJ (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U और V में से प्रत्येक की परीक्षा एक ही सप्ताह के अलग-अलग दिन है, जो सोमवार से शुरू होकर रविवार को समाप्त होता है। R की परीक्षा गुरुवार को है। R और P के बीच केवल दो व्यक्तियों की परीक्षा है। V की परीक्षा P के ठीक बाद है। V से पहले उतने ही व्यक्तियों की परीक्षा है, जितने T के बाद। Q की परीक्षा R से ठीक पहले है। U की परीक्षा रविवार को नहीं है। शनिवार को किसकी परीक्षा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिनों को सोमवार = 1 से रविवार = 7 तक क्रमांक दें। R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुरुवार (4)</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R और P के बीच दो व्यक्ति → P = 4 − 3 = 1 या 4 + 3 = 7. V की परीक्षा P के ठीक बाद है, अतः P रविवार को नहीं हो सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = सोमवार, V = मंगलवार</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V से पहले उतने ही व्यक्ति जितने T के बाद → V से पहले एक व्यक्ति (P) है, अतः T के बाद ठीक एक व्यक्ति है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = शनिवार</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q की परीक्षा R से ठीक पहले → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = बुधवार</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष दिन शुक्रवार और रविवार S और U के हैं; U रविवार को नहीं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = शुक्रवार, S = रविवार</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोम P, मंगल V, बुध Q, गुरु R, शुक्र U, शनि T, रवि S</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शनिवार को </span><span style=\"font-weight:bold;font-family:'Mangal'\">T (विकल्प D)</span><span style=\"font-family:'Mangal'\"> की परीक्षा है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 9 18 34 59 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">93</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">91</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">97</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रमागत पदों के अंतर ज्ञात करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> = 2²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> = 3²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34 − 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span><span style=\"font-family:'Mangal'\"> = 4²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59 − 34 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\"> = 5² → अंतर 2, 3, 4, 5, … के वर्ग हैं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला अंतर = 6² = 36 → अगला पद = 59 + 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">95</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">95 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर JUMP, CNFI से एक निश्चित प्रकार से संबंधित है। उसी प्रकार DESK, WXLD से संबंधित है। उसी तर्क के अनुसार BOAT दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UHSM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VHTM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UHTM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UITM</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JUMP → CNFI: J − 7 = C, U − 7 = N, M − 7 = F, P − 7 = I → प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DESK → WXLD: D − 7 = W (4 − 7 = −3 → 26 − 3 = 23 = W), E − 7 = X, S − 7 = L, K − 7 = D ✓ (A से पीछे गिनने पर Z, Y, X …)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOAT → B − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\"> (2 − 7 = −5 → 26 − 5 = 21 = U), O − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, A − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> (1 − 7 = −6 → 20 = T), T − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> → UHTM</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य जाँचें: UHSM में S (A − 8) है, VHTM में V (B − 6) है, UITM में I (O − 6) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः BOAT, </span><span style=\"font-weight:bold;font-family:'Mangal'\">UHTM (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी ऑस्ट्रिच कीवी हैं। कोई ऑस्ट्रिच कबूतर नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कोई कीवी कबूतर नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ कबूतर ऑस्ट्रिच हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: ऑस्ट्रिच का वृत्त कीवी के वृत्त के पूरी तरह अंदर है (सभी ऑस्ट्रिच कीवी हैं), और कबूतर का वृत्त ऑस्ट्रिच के वृत्त से पूरी तरह बाहर है (कोई ऑस्ट्रिच कबूतर नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कोई कीवी कबूतर नहीं है → जो कीवी ऑस्ट्रिच नहीं हैं, वे कबूतर हो सकते हैं; कथन इसे नहीं रोकते → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ कबूतर ऑस्ट्रिच हैं → यह ‘कोई ऑस्ट्रिच कबूतर नहीं है’ का सीधा विरोध है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द TRIANGLE के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में उसके ठीक पहले वाले अक्षर से बदल दिया जाता है और फिर इस प्रकार बने सभी अक्षरों को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाता है। इस प्रकार बने नए अक्षर-समूह में बाएँ से तीसरा अक्षर निम्नलिखित में से कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRIANGLE के प्रत्येक अक्षर को उसके ठीक पहले वाले अक्षर से बदलें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T → S, R → Q, I → H, A → Z (A से पहले कोई अक्षर नहीं है, अतः चक्र में Z लेते हैं), N → M, G → F, L → K, E → D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए अक्षर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">S Q H Z M F K D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन्हें वर्णमाला क्रम में व्यवस्थित करें: </span><span style=\"font-weight:bold;font-family:'Mangal'\">D F H K M Q S Z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से तीसरा: D (पहला), F (दूसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> (तीसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(F दूसरा, K चौथा और M पाँचवाँ है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बाएँ से तीसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">H (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B का अर्थ है कि ‘A, B की माता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B का अर्थ है कि ‘A, B का भाई है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘Kartik # Manish % Uday @ Chanchal $ Naira’ है, तो Kartik का Naira से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता के पिता का पिता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता के पिता का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता की माता का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता की माता का पिता</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A, B की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: Kartik # Manish % Uday @ Chanchal $ Naira</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kartik # Manish → Kartik, Manish का भाई है। Kartik और Manish भाई-बहन हैं, अतः उनके माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Manish % Uday → Manish, Uday का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Uday @ Chanchal → Uday, Chanchal की माता है। इसलिए Manish, Chanchal की माता का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chanchal $ Naira → Chanchal, Naira की पत्नी है। इसलिए Manish, Naira की पत्नी की माता का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः Kartik, Manish का भाई है जो Naira की पत्नी की माता का पिता है → Kartik, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Naira की पत्नी की माता के पिता का भाई (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे संख्याओं के दो समुच्चय दिए गए हैं। प्रत्येक समुच्चय में पहली संख्या पर कुछ गणितीय संक्रिया(एँ) करने से दूसरी संख्या प्राप्त होती है। इसी प्रकार, दूसरी संख्या पर कुछ गणितीय संक्रिया(एँ) करने से तीसरी संख्या प्राप्त होती है, और इसी प्रकार आगे। दिए गए विकल्पों में से कौन-सा विकल्प दिए गए समुच्चयों की संक्रियाओं के उसी क्रम का पालन करता है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 – 7 – 14 – 19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 – 13 – 26 – 31</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 – 15 – 30 – 34</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 – 11 – 22 – 28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 – 17 – 32 – 39</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 – 19 – 38 – 43</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 → 7 → 14 → 19: 10 − 3 = 7; 7 × 2 = 14; 14 + 5 = 19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 → 13 → 26 → 31: 16 − 3 = 13; 13 × 2 = 26; 26 + 5 = 31 → नियम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3, ×2, +5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 → 15 → 30 → 35 (30 + 5 = 35 है, 34 नहीं) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 → 11 → 22 → 27 (22 + 5 = 27 है, 28 नहीं) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 → 17 → 34 (17 × 2 = 34 है, 32 नहीं) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 → 19 → 38 → 43: 22 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19</span><span style=\"font-family:'Mangal'\">; 19 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\">; 38 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">43</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समुच्चय </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 – 19 – 38 – 43 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित त्रिक में, अक्षरों का प्रत्येक समूह एक निश्चित तर्क के अनुसार अगले समूह से संबंधित है। दिए गए विकल्पों में से वह चुनिए जो उसी तर्क का पालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BUNK - BKNU - KNUB</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">POUR - PRUO - RUOP</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MONK - OMNK - KONM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VENT - VETN - ENTV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DEAR - DRAE - RAED</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RING - RNIG - GNIR</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BUNK → BKNU: </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरे और चौथे अक्षर आपस में बदले गए</span><span style=\"font-family:'Mangal'\"> (U ↔ K); BKNU → KNUB: </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहला अक्षर अंत में ले जाया गया</span><span style=\"font-family:'Mangal'\"> (B सबसे अंत में)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">POUR → PRUO: O ↔ R बदले गए ✓; PRUO → RUOP: P अंत में ✓ → वही दो चरण।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MONK → OMNK: पहला और दूसरा अक्षर बदले गए हैं, दूसरा और चौथा नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VENT → VETN: तीसरा और चौथा अक्षर बदले गए हैं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DEAR → DRAE: E ↔ R (दूसरा और चौथा) ✓; DRAE → RAED: D अंत में ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RING → RNIG: दूसरा और तीसरा अक्षर बदले गए हैं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्रिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">DEAR - DRAE - RAED (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके बैठे विद्यार्थियों की एक पंक्ति में अमित बाएँ छोर से 15वें और बीना दाएँ छोर से 20वें स्थान पर है। यदि अमित और बीना के बीच ठीक 6 विद्यार्थी बैठे हैं, तो पंक्ति में विद्यार्थियों की अधिकतम संभव संख्या क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो व्यवस्थाएँ संभव हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 1 (अमित, बीना के बाईं ओर है, कोई अतिव्यापन नहीं): कुल = 15 (अमित और उसके बाईं ओर वाले) + 6 (बीच में) + 20 (बीना और उसके दाईं ओर वाले) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">41</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 2 (बीना, अमित के बाईं ओर है, दोनों गिनतियाँ अतिव्यापी हैं): कुल = 15 + 20 − 6 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रश्न में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकतम</span><span style=\"font-family:'Mangal'\"> संभव संख्या पूछी गई है → 41.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(27 न्यूनतम है; 35 और 29 बीच के 6 विद्यार्थियों को गलत गिनने से आते हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्यार्थियों की अधिकतम संभव संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">41 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि एक पार्क में दक्षिण-पश्चिम की ओर मुख करके खड़ा है। पहले वह 135° दक्षिणावर्त (clockwise) मुड़ता है, फिर 90° वामावर्त (anticlockwise) और अंत में 225° दक्षिणावर्त मुड़ता है। अब उसका मुख किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पश्चिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ दिशाएँ एक-दूसरे से 45° पर हैं: उत्तर → उत्तर-पूर्व → पूर्व → दक्षिण-पूर्व → दक्षिण → दक्षिण-पश्चिम → पश्चिम → उत्तर-पश्चिम (दक्षिणावर्त)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रारंभ: </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पश्चिम</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">135° दक्षिणावर्त = 45° के 3 चरण दक्षिणावर्त: दक्षिण-पश्चिम → पश्चिम → उत्तर-पश्चिम → </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90° वामावर्त = 2 चरण वामावर्त: उत्तर → उत्तर-पश्चिम → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">225° दक्षिणावर्त = 5 चरण दक्षिणावर्त: पश्चिम → उत्तर-पश्चिम → उत्तर → उत्तर-पूर्व → पूर्व → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पूर्व</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शॉर्टकट: कुल घुमाव = 135° − 90° + 225° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270° दक्षिणावर्त</span><span style=\"font-family:'Mangal'\"> = दक्षिण-पश्चिम से 90° वामावर्त → दक्षिण-पूर्व।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अब उसका मुख </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पूर्व (विकल्प B)</span><span style=\"font-family:'Mangal'\"> की ओर है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WVY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AAC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DCF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BAD</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WVY: W − 1 = V, V + 3 = Y → (−1, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DCF: D − 1 = C, C + 3 = F → (−1, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BAD: B − 1 = A, A + 3 = D → (−1, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AAC: A − 0 = A, A + 2 = C → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (−1, +3) का पालन करते हैं; केवल AAC नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">AAC (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कूट भाषा में 'ROAD' को 42 और 'CAMEL' को 39 लिखा जाता है। उसी भाषा में 'TRAIN' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">67</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला में प्रत्येक अक्षर का स्थान लिखें (A = 1, B = 2, …, Z = 26)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD: R = 18, O = 15, A = 1, D = 4 → योग = 38; 38 + </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> (अक्षरों की संख्या) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAMEL: C = 3, A = 1, M = 13, E = 5, L = 12 → योग = 34; 34 + </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> (अक्षरों की संख्या) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">39</span><span style=\"font-family:'Mangal'\"> ✓ → नियम: कूट = अक्षरों के स्थानों का योग + अक्षरों की संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(योग में स्थिर 4 जोड़ने पर CAMEL = 38 आता, 39 नहीं, अतः जोड़ी गई संख्या अक्षरों की गिनती है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAIN: T = 20, R = 18, A = 1, I = 9, N = 14 → योग = 62; 62 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'TRAIN' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">67 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित अक्षर, संख्या और प्रतीक शृंखला को देखिए और प्रश्न का उत्तर दीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) 5 K @ 2 P # 8 L $ 4 M &amp; 9 R * 6 T % 3 W (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शृंखला में से सभी संख्याएँ हटा दी जाएँ, तो बाएँ से तीसरे तत्व के दाईं ओर चौथा तत्व निम्नलिखित में से कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">$</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">&amp;</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला से संख्याएँ (5, 2, 8, 4, 9, 6, 3) हटाएँ:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) </span><span style=\"font-weight:bold;font-family:'Mangal'\">K @ P # L $ M &amp; R * T % W</span><span style=\"font-family:'Mangal'\"> (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से तीसरा तत्व: K (पहला), @ (दूसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\"> (तीसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P के दाईं ओर चौथा: # (पहला), L (दूसरा), $ (तीसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> (चौथा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(संख्याएँ हटाए बिना मूल शृंखला में गिनने पर भिन्न तत्व मिलेगा, अतः पहले संख्याएँ हटाना आवश्यक है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">M (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राष्ट्रीय अनुसूचित जनजाति आयोग (NCST) का गठन पूर्ववर्ती राष्ट्रीय अनुसूचित जाति एवं अनुसूचित जनजाति आयोग को विभाजित करके किया गया। NCST भारतीय संविधान के किस अनुच्छेद के अंतर्गत कार्य करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 338</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 338A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 338B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 340</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">89वें संविधान संशोधन अधिनियम, 2003</span><span style=\"font-family:'Mangal'\"> ने संयुक्त राष्ट्रीय अनुसूचित जाति एवं अनुसूचित जनजाति आयोग को विभाजित किया और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 338A</span><span style=\"font-family:'Mangal'\"> जोड़ा, जिसके अंतर्गत </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय अनुसूचित जनजाति आयोग (NCST)</span><span style=\"font-family:'Mangal'\"> की स्थापना </span><span style=\"font-weight:bold;font-family:'Mangal'\">2004</span><span style=\"font-family:'Mangal'\"> में हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NCST में राष्ट्रपति द्वारा नियुक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक अध्यक्ष, एक उपाध्यक्ष और तीन अन्य सदस्य</span><span style=\"font-family:'Mangal'\"> होते हैं; यह अनुसूचित जनजातियों के संरक्षण-उपायों की जाँच और निगरानी करता है और राष्ट्रपति को रिपोर्ट देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 338</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय अनुसूचित जाति आयोग (NCSC)</span><span style=\"font-family:'Mangal'\"> का प्रावधान है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">102वें संशोधन अधिनियम, 2018</span><span style=\"font-family:'Mangal'\"> द्वारा जोड़ा गया </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 338B</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय पिछड़ा वर्ग आयोग</span><span style=\"font-family:'Mangal'\"> को संवैधानिक दर्जा देता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 340</span><span style=\"font-family:'Mangal'\"> राष्ट्रपति को पिछड़े वर्गों की दशा की जाँच के लिए आयोग नियुक्त करने की शक्ति देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 338A (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विनय कुमार सक्सेना, जिन्हें लद्दाख का उपराज्यपाल नियुक्त किया गया, के स्थान पर 11 मार्च 2026 को दिल्ली के 23वें उपराज्यपाल के रूप में किसने शपथ ली?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अजय कुमार भल्ला</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल बैजल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कविंदर गुप्ता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तरनजीत सिंह संधू</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तरनजीत सिंह संधू</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 मार्च 2026</span><span style=\"font-family:'Mangal'\"> को लोक निवास में </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिल्ली के 23वें उपराज्यपाल</span><span style=\"font-family:'Mangal'\"> के रूप में शपथ ली; शपथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिल्ली उच्च न्यायालय के मुख्य न्यायाधीश</span><span style=\"font-family:'Mangal'\"> ने दिलाई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">1988 बैच के IFS अधिकारी</span><span style=\"font-family:'Mangal'\"> हैं, फरवरी 2020 से जनवरी 2024 तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमेरिका में भारत के राजदूत</span><span style=\"font-family:'Mangal'\"> रहे और 2024 का लोकसभा चुनाव अमृतसर से लड़ा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">विनय कुमार सक्सेना</span><span style=\"font-family:'Mangal'\"> (मई 2022 से दिल्ली के उपराज्यपाल) का स्थान लिया, जिन्होंने 13 मार्च 2026 को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लद्दाख के चौथे उपराज्यपाल</span><span style=\"font-family:'Mangal'\"> के रूप में शपथ ली।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अनिल बैजल</span><span style=\"font-family:'Mangal'\"> 2016 से 2022 तक दिल्ली के उपराज्यपाल थे; </span><span style=\"font-weight:bold;font-family:'Mangal'\">कविंदर गुप्ता</span><span style=\"font-family:'Mangal'\"> जुलाई 2025 में लद्दाख के उपराज्यपाल नियुक्त हुए; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अजय कुमार भल्ला</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">मणिपुर</span><span style=\"font-family:'Mangal'\"> के राज्यपाल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उपराज्यपाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">तरनजीत सिंह संधू (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिंदी दिवस, 14 सितंबर 2026 को केंद्रीय गृह मंत्री अमित शाह ने छठे अखिल भारतीय राजभाषा सम्मेलन का उद्घाटन किस शहर में किया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गांधीनगर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुणे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोपाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नवी मुंबई</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हिंदी दिवस, 14 सितंबर 2026</span><span style=\"font-family:'Mangal'\"> को केंद्रीय गृह मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमित शाह</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिडको प्रदर्शनी केंद्र, नवी मुंबई</span><span style=\"font-family:'Mangal'\"> (महाराष्ट्र) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">छठे अखिल भारतीय राजभाषा सम्मेलन</span><span style=\"font-family:'Mangal'\"> का उद्घाटन किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपने संबोधन में उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय शिक्षा नीति</span><span style=\"font-family:'Mangal'\"> के प्राथमिक शिक्षा में मातृभाषा के प्रावधान और </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय सम्मान अपमान निवारण (संशोधन) विधेयक, 2026</span><span style=\"font-family:'Mangal'\"> का उल्लेख किया, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"वंदे मातरम्\"</span><span style=\"font-family:'Mangal'\"> को संरक्षण देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">5वाँ</span><span style=\"font-family:'Mangal'\"> राजभाषा सम्मेलन (हिंदी दिवस 2025) </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुजरात</span><span style=\"font-family:'Mangal'\"> में हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिंदी दिवस </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 सितंबर 1949</span><span style=\"font-family:'Mangal'\"> की स्मृति में मनाया जाता है, जब संविधान सभा ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 343</span><span style=\"font-family:'Mangal'\"> के अंतर्गत </span><span style=\"font-weight:bold;font-family:'Mangal'\">देवनागरी लिपि में हिंदी</span><span style=\"font-family:'Mangal'\"> को संघ की राजभाषा के रूप में अपनाया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शहर </span><span style=\"font-weight:bold;font-family:'Mangal'\">नवी मुंबई (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'रागम-तानम-पल्लवी' शब्द भारतीय संगीत की किस शैली से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिंदुस्तानी संगीत</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूफ़ी संगीत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोक संगीत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कर्नाटक संगीत</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रागम-तानम-पल्लवी (RTP)</span><span style=\"font-family:'Mangal'\"> दक्षिण भारत के शास्त्रीय संगीत </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्नाटक संगीत</span><span style=\"font-family:'Mangal'\"> की एक प्रमुख मंचीय प्रस्तुति-विधा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रागम</span><span style=\"font-family:'Mangal'\"> बिना ताल के राग का मुक्त विस्तार (आलापना) है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">तानम</span><span style=\"font-family:'Mangal'\"> लयबद्ध विस्तार है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पल्लवी</span><span style=\"font-family:'Mangal'\"> ताल में बँधी एक रचित पंक्ति है जिस पर संगीतकार आगे विस्तार करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हिंदुस्तानी संगीत</span><span style=\"font-family:'Mangal'\"> (उत्तर भारत) की मुख्य विधाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्रुपद, ख़याल, ठुमरी और तराना</span><span style=\"font-family:'Mangal'\"> हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूफ़ी संगीत</span><span style=\"font-family:'Mangal'\"> की भक्ति-गायन विधा </span><span style=\"font-weight:bold;font-family:'Mangal'\">क़व्वाली</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शैली </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्नाटक संगीत (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जवाहरलाल नेहरू स्टेडियम, नई दिल्ली में आयोजित और 5 अक्टूबर 2025 को संपन्न विश्व पैरा एथलेटिक्स चैंपियनशिप 2025 में भारत कितने पदकों के अपने सर्वश्रेष्ठ प्रदर्शन के साथ 10वें स्थान पर रहा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">12वीं विश्व पैरा एथलेटिक्स चैंपियनशिप</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">जवाहरलाल नेहरू स्टेडियम, नई दिल्ली</span><span style=\"font-family:'Mangal'\"> में हुई (भारत ने पहली बार इसकी मेज़बानी की) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 अक्टूबर 2025</span><span style=\"font-family:'Mangal'\"> को संपन्न हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत रिकॉर्ड </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 पदकों</span><span style=\"font-family:'Mangal'\"> (</span><span style=\"font-weight:bold;font-family:'Mangal'\">6 स्वर्ण, 9 रजत, 7 कांस्य</span><span style=\"font-family:'Mangal'\">) के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">10वें</span><span style=\"font-family:'Mangal'\"> स्थान पर रहा, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोबे 2024</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\"> पदकों के पिछले सर्वश्रेष्ठ प्रदर्शन से अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ब्राज़ील</span><span style=\"font-family:'Mangal'\"> 15 स्वर्ण, 20 रजत और 9 कांस्य के साथ पदक तालिका में शीर्ष पर रहा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत के स्वर्ण विजेता थे </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुमित अंतिल</span><span style=\"font-family:'Mangal'\"> (पुरुष भाला फेंक F64, तीसरा विश्व खिताब), </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषाद कुमार</span><span style=\"font-family:'Mangal'\"> (पुरुष ऊँची कूद T47), </span><span style=\"font-weight:bold;font-family:'Mangal'\">रिंकू हुड्डा</span><span style=\"font-family:'Mangal'\"> (पुरुष भाला फेंक F46), </span><span style=\"font-weight:bold;font-family:'Mangal'\">शैलेश कुमार</span><span style=\"font-family:'Mangal'\"> (पुरुष ऊँची कूद T63), </span><span style=\"font-weight:bold;font-family:'Mangal'\">संदीप संजय सरगर</span><span style=\"font-family:'Mangal'\"> (पुरुष भाला फेंक F44) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिमरन शर्मा</span><span style=\"font-family:'Mangal'\"> (महिला 100 m T12)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पदकों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह दर जिस पर भारतीय रिज़र्व बैंक चलनिधि समायोजन सुविधा के अंतर्गत सरकारी प्रतिभूतियों की जमानत पर वाणिज्यिक बैंकों को अल्पकालिक ऋण देता है, ____________ कहलाती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिवर्स रेपो दर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैंक दर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेपो दर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नकद आरक्षित अनुपात</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रेपो दर</span><span style=\"font-family:'Mangal'\"> वह दर है जिस पर RBI </span><span style=\"font-weight:bold;font-family:'Mangal'\">चलनिधि समायोजन सुविधा (LAF)</span><span style=\"font-family:'Mangal'\"> के अंतर्गत </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरकारी प्रतिभूतियों</span><span style=\"font-family:'Mangal'\"> की जमानत पर बैंकों को अल्पकालिक ऋण देता है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">मौद्रिक नीति समिति</span><span style=\"font-family:'Mangal'\"> द्वारा तय की जाने वाली नीतिगत दर है (अगस्त 2026 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">5.25%</span><span style=\"font-family:'Mangal'\"> पर यथावत)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रिवर्स रेपो दर</span><span style=\"font-family:'Mangal'\"> वह दर है जिस पर RBI सरकारी प्रतिभूतियों के बदले बैंकों की अतिरिक्त निधि </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवशोषित</span><span style=\"font-family:'Mangal'\"> करता है, अर्थात् जो दर RBI बैंकों को देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बैंक दर</span><span style=\"font-family:'Mangal'\"> वह दर है जिस पर RBI विनिमय बिलों और अन्य वाणिज्यिक पत्रों की पुनर्कटौती करता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">नकद आरक्षित अनुपात (CRR)</span><span style=\"font-family:'Mangal'\"> शुद्ध माँग और मीयादी देयताओं का वह भाग है जिसे बैंकों को RBI के पास नकद शेष के रूप में रखना होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेपो दर (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52वाँ G7 शिखर सम्मेलन, जिसमें भारत को साझेदार देश के रूप में आमंत्रित किया गया, 15 से 17 जून 2026 तक एवियाँ-ले-बाँ में हुआ। इस सम्मेलन की मेज़बानी किस देश ने की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्रांस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कनाडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इटली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जापान</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">52वाँ G7 शिखर सम्मेलन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 से 17 जून 2026</span><span style=\"font-family:'Mangal'\"> तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्रांस</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">एवियाँ-ले-बाँ</span><span style=\"font-family:'Mangal'\"> (ओत-सावुआ) के होटल रॉयल में हुआ, जिसकी मेज़बानी राष्ट्रपति </span><span style=\"font-weight:bold;font-family:'Mangal'\">इमैनुएल मैक्रों</span><span style=\"font-family:'Mangal'\"> ने की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">भारत, केन्या, दक्षिण कोरिया, ब्राज़ील और मिस्र</span><span style=\"font-family:'Mangal'\"> को साझेदार देशों के रूप में आमंत्रित किया गया; प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> शामिल हुए और यूक्रेन के राष्ट्रपति ज़ेलेंस्की भी उपस्थित रहे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिणामों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिटिकल मिनरल्स रेज़िलिएंस एंड प्रोडक्शन अलायंस</span><span style=\"font-family:'Mangal'\"> (2030 तक किसी एक आपूर्तिकर्ता पर निर्भरता 60% से कम), बुंडिबुग्यो </span><span style=\"font-weight:bold;font-family:'Mangal'\">इबोला</span><span style=\"font-family:'Mangal'\"> प्रकोप के लिए </span><span
