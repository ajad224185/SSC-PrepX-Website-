<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>21.) RRB Tech.Grade-III (#Test-10  - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

<script>

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्रा चिकने फ़र्श पर पहियों वाली कुर्सी पर बैठकर एक रस्सी से एक भारी मेज़ को अपनी ओर खींचती है। निम्नलिखित में से कौन-सा सही बताता है कि क्या होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुर्सी नहीं हिलती और केवल मेज़ उसकी ओर चलती है, क्योंकि बल वह लगा रही है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुर्सी मेज़ से दूर चलती है, क्योंकि प्रत्येक क्रिया की समान और विपरीत प्रतिक्रिया होती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुर्सी मेज़ की ओर चलती है, क्योंकि जब वह मेज़ को खींचती है, तो मेज़ उस पर विपरीत दिशा में, अर्थात् मेज़ की ओर, समान बल लगाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न कुर्सी चलती है न मेज़, क्योंकि दो समान और विपरीत बल एक-दूसरे को निरस्त कर देते हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब मेज़ पर बल लगाया जाता है, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेज़ व्यक्ति पर विपरीत दिशा में बल लगाती है</span><span style=\"font-family:'Mangal'\">। बल के अस्तित्व में आने के लिए कम से कम दो वस्तुओं की अन्योन्यक्रिया आवश्यक है, और इस अन्योन्यक्रिया के दोनों बल परिमाण में समान होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छात्रा मेज़ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपनी ओर</span><span style=\"font-family:'Mangal'\"> खींचती है, अतः उसके द्वारा मेज़ पर लगाया बल उसकी ओर है; इसलिए उस पर प्रतिक्रिया बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेज़ की ओर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहियों वाली कुर्सी आसानी से चलती है, अतः छात्रा और कुर्सी </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेज़ की ओर चलती हैं</span><span style=\"font-family:'Mangal'\">। इसी प्रकार, यदि वह मेज़ को दूर धकेलती, तो कुर्सी मेज़ से दूर चली जाती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग-अलग वस्तुओं</span><span style=\"font-family:'Mangal'\"> पर लगते हैं (एक मेज़ पर, एक छात्रा पर), अतः वे निरस्त नहीं होते; प्रत्येक वस्तु अपने ऊपर लगे बल और अपने द्रव्यमान के अनुसार चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुर्सी मेज़ की ओर चलती है क्योंकि मेज़ छात्रा को अपनी ओर खींचती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि की चाल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यदि किसी ध्वनि स्रोत की आवृत्ति दोगुनी कर दी जाए, तो वायु में ध्वनि का तरंगदैर्ध्य आधा हो जाता है, जबकि उसकी चाल वही रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ध्वनि जल में वायु की तुलना में लगभग 4–5 गुना तेज़, और ठोसों में वायु की तुलना में लगभग 15–20 गुना तेज़ चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वायु का ताप या आर्द्रता बढ़ने पर वायु में ध्वनि की चाल घट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वायु जैसे अधिकांश माध्यमों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्वनि की चाल केवल माध्यम पर निर्भर</span><span style=\"font-family:'Mangal'\"> करती है, स्रोत या आवृत्ति पर नहीं; चूँकि v = λν, </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवृत्ति बदलने पर तरंगदैर्ध्य बदलता है</span><span style=\"font-family:'Mangal'\"> जबकि चाल नियत रहती है: ν दोगुना होने पर λ आधा हो जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ध्वनि ठोसों में सबसे तेज़, द्रवों में धीमी और गैसों में सबसे धीमी चलती है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में वायु की तुलना में लगभग 4–5 गुना तेज़</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठोसों में वायु की तुलना में प्रायः 15–20 गुना तेज़</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वायु में ध्वनि की चाल ताप और आर्द्रता पर निर्भर करती है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">ताप या आर्द्रता बढ़ने पर ध्वनि की चाल बढ़ती है</span><span style=\"font-family:'Mangal'\">, घटती नहीं (0°C पर शुष्क वायु में लगभग 331 m/s और 25°C पर लगभग 346 m/s) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र डिजिटल तुला पर दो प्रयोग करता है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यवस्था 1: खुले शंक्वाकार फ्लास्क में लिए सिरके में एक खुले गुब्बारे से बेकिंग सोडा डाला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यवस्था 2: बेकिंग सोडा वाला गुब्बारा पहले फ्लास्क के मुँह पर कसकर लगाया जाता है, और फिर सोडा सिरके में गिराया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्या प्रेक्षित होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों व्यवस्थाओं में तुला का रीडिंग घटता है, क्योंकि प्रत्येक में गैस बनती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों व्यवस्थाओं में तुला का रीडिंग अपरिवर्तित रहता है, क्योंकि द्रव्यमान सदैव संरक्षित रहता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तुला का रीडिंग केवल व्यवस्था 2 में घटता है, क्योंकि फूला हुआ गुब्बारा हल्का हो जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यवस्था 1 में तुला का रीडिंग घटता है क्योंकि बनी कार्बन डाइऑक्साइड वायु में निकल जाती है, जबकि व्यवस्था 2 में गुब्बारा फूल जाता है और रीडिंग प्रारंभिक रीडिंग के बराबर रहता है, क्योंकि बंद निकाय में द्रव्यमान संरक्षित रहता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिरका बेकिंग सोडा (सोडियम हाइड्रोजनकार्बोनेट) से अभिक्रिया करके अन्य पदार्थों के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड गैस</span><span style=\"font-family:'Mangal'\"> बनाता है, जो एक रासायनिक परिवर्तन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">व्यवस्था 1</span><span style=\"font-family:'Mangal'\"> (खुला फ्लास्क) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड वायु में निकल जाती है</span><span style=\"font-family:'Mangal'\">, अतः तुला का अंतिम रीडिंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रारंभिक रीडिंग से कम</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">व्यवस्था 2</span><span style=\"font-family:'Mangal'\"> (फ्लास्क के मुँह पर लगा गुब्बारा) में तेज़ बुदबुदाहट से </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुब्बारा फूल जाता है</span><span style=\"font-family:'Mangal'\"> परंतु निकाय से कुछ बाहर नहीं जाता, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतिम रीडिंग प्रारंभिक रीडिंग के बराबर</span><span style=\"font-family:'Mangal'\"> रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बंद निकाय में अभिक्रिया से पहले सिरके और बेकिंग सोडा का कुल द्रव्यमान अभिक्रिया के बाद कार्बन डाइऑक्साइड और अन्य पदार्थों के कुल द्रव्यमान के बराबर होता है; यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संरक्षण का नियम</span><span style=\"font-family:'Mangal'\"> (लैवोज़िए) है। व्यवस्था 1 में दिखने वाली हानि केवल इसलिए है कि गैस तुला से बाहर चली गई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यवस्था 1 में रीडिंग घटता है परंतु व्यवस्था 2 में वही रहता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रक्रम को उसमें होने वाले ऊर्जा रूपांतरण से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789970622115_image001.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iii), (d)-(iv)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(ii), (d)-(i)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) घड़ी की कसी हुई कमानी अपने विकृत आकार के कारण ऊर्जा संचित रखती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">खुलते समय यह प्रत्यास्थ स्थितिज ऊर्जा यांत्रिक ऊर्जा में बदल जाती है</span><span style=\"font-family:'Mangal'\"> जो सुइयों को चलाती है &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश संश्लेषण</span><span style=\"font-family:'Mangal'\"> में हरी पत्तियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश ऊर्जा को भोजन में संचित रासायनिक ऊर्जा</span><span style=\"font-family:'Mangal'\"> में बदलती हैं &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">माइक्रोफ़ोन</span><span style=\"font-family:'Mangal'\"> में ध्वनि तरंगें डायाफ्राम को कंपित करती हैं और ये कंपन विद्युत संकेत में बदल जाते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्वनि ऊर्जा &rarr; विद्युत ऊर्जा</span><span style=\"font-family:'Mangal'\"> &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">सौर पैनल</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश ऊर्जा को विद्युत ऊर्जा</span><span style=\"font-family:'Mangal'\"> में बदलता है &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(अन्य उदाहरण: जलता बल्ब विद्युत ऊर्जा को प्रकाश और ऊष्मा में, और जलती माचिस की तीली रासायनिक ऊर्जा को ऊष्मा और प्रकाश में बदलती है।)</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(ii), (b)-(iv), (c)-(iii), (d)-(i) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निलंबन से कणों को अलग करने के लिए निम्नलिखित में से किस विधि का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाष्पन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निस्यंदन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">निलंबन</span><span style=\"font-family:'Mangal'\"> में ठोस कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">घुलते नहीं</span><span style=\"font-family:'Mangal'\"> हैं, बल्कि द्रव में सब ओर निलंबित रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये कण विलयन के कणों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़े</span><span style=\"font-family:'Mangal'\"> होते हैं और नंगी आँखों से दिखाई देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूती कपड़े या फ़िल्टर पेपर पर रुक जाते हैं</span><span style=\"font-family:'Mangal'\">, जबकि द्रव उसके पार निकल जाता है: यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">निस्यंदन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण और वाष्पन </span><span style=\"font-weight:bold;font-family:'Mangal'\">घुले हुए</span><span style=\"font-family:'Mangal'\"> ठोस को प्राप्त करते हैं, और आसवन विलयन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">विलायक या द्रवों</span><span style=\"font-family:'Mangal'\"> को अलग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निलंबन से कणों को निस्यंदन द्वारा अलग किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पद को उसके विवरण से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789970622115_image002.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(i), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(ii), (d)-(i)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाइरस</span><span style=\"font-family:'Mangal'\"> अकोशिकीय संक्रामक कारक हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन आवरण से घिरे कुछ आनुवंशिक पदार्थ</span><span style=\"font-family:'Mangal'\"> से बने होते हैं &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाइरॉइड</span><span style=\"font-family:'Mangal'\"> ऐसे अकोशिकीय कारक हैं जिनके आनुवंशिक पदार्थ के चारों ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन आवरण नहीं होता</span><span style=\"font-family:'Mangal'\"> &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रिऑन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलत ढंग से मुड़े प्रोटीन हैं जिनमें आनुवंशिक पदार्थ नहीं होता</span><span style=\"font-family:'Mangal'\"> &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">तरल-मोज़ेक मॉडल</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका झिल्ली की संरचना</span><span style=\"font-family:'Mangal'\"> समझाता है: प्रोटीन धँसे हुए लिपिड द्विस्तर, जिसके अणु झिल्ली में बग़ल में खिसक, पलट और घूम सकते हैं &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाइरस, वाइरॉइड और प्रिऑन तीनों इतने छोटे हैं कि प्रकाश सूक्ष्मदर्शी से नहीं देखे जा सकते।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.5 m त्रिज्या के एक झूले (मेरी-गो-राउंड) पर बैठा बच्चा वृत्ताकार पथ पर बिंदु A से व्यासतः विपरीत बिंदु C तक 5 s में पहुँचता है (π = 22/7 लीजिए)। बच्चे द्वारा तय दूरी और विस्थापन का परिमाण क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 m और 7 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 m और 11 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 m और 7 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 m और 3.5 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बच्चा A से C तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अर्धवृत्त</span><span style=\"font-family:'Mangal'\"> (एक परिक्रमा का आधा) पर चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तय दूरी = परिधि का आधा = ½ × 2πR = πR = (22/7) × 3.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन दोनों स्थितियों को जोड़ने वाली सीधी रेखा AC है, अर्थात् वृत्त का व्यास = 2R = 2 × 3.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृत्तीय गति में सामान्यतः तय दूरी (A से C तक का चाप) और विस्थापन (सीधी रेखा AC) बराबर नहीं होते; औसत चाल 11 / 5 = 2.2 m/s है जबकि औसत वेग का परिमाण 7 / 5 = 1.4 m/s है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूरी 11 m और विस्थापन 7 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जब बेरियम हाइड्रॉक्साइड और अमोनियम क्लोराइड को एक परखनली में मिलाया जाता है, तो परखनली की तली ठंडी महसूस होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): बेरियम हाइड्रॉक्साइड और अमोनियम क्लोराइड के बीच अभिक्रिया ऊष्माशोषी है, अर्थात् अभिक्रिया के दौरान परिवेश से ऊर्जा अवशोषित होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेरियम हाइड्रॉक्साइड और अमोनियम क्लोराइड को मिलाया</span><span style=\"font-family:'Mangal'\"> जाता है और परखनली की तली को छुआ जाता है, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठंडी महसूस होती है</span><span style=\"font-family:'Mangal'\"> → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन अभिक्रियाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्जा अवशोषित</span><span style=\"font-family:'Mangal'\"> होती है, उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊष्माशोषी अभिक्रियाएँ</span><span style=\"font-family:'Mangal'\"> कहते हैं; बेरियम हाइड्रॉक्साइड और अमोनियम क्लोराइड का मिलना एक ऊष्माशोषी अभिक्रिया है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि अभिक्रिया अपने परिवेश (परखनली के काँच सहित) से ऊष्मा लेती है, परखनली ठंडी हो जाती है; अतः A में महसूस होने वाली ठंडक R में बताए गए ऊर्जा अवशोषण का सीधा परिणाम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके विपरीत, जिन अभिक्रियाओं में उत्पादों के साथ ऊष्मा बाहर निकलती है, जैसे मैग्नीशियम का जलना या बिना बुझे चूने की जल से अभिक्रिया, वे ऊष्माक्षेपी अभिक्रियाएँ हैं और पात्र गर्म महसूस होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक 8 वर्षीय लड़का अपनी आयु के अन्य बच्चों से बहुत छोटे कद का है। जाँच से पता चलता है कि उसके शरीर में पीयूष ग्रंथि द्वारा स्रावित एक हॉर्मोन की कमी है। वह हॉर्मोन और बचपन में उसकी कमी से होने वाली अवस्था हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृद्धि हॉर्मोन, जो शरीर की वृद्धि और विकास को नियंत्रित करता है; बचपन में इसकी कमी से बौनापन होता है, और पीयूष ग्रंथि से इसका स्राव हाइपोथैलेमस के एक मोचक कारक द्वारा उद्दीपित होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थायरॉक्सिन, जो उपापचय को नियंत्रित करता है; इसकी कमी से घेंघा (गॉइटर) होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंसुलिन, जो रक्त शर्करा को नियंत्रित करता है; इसकी कमी से मधुमेह होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐड्रिनैलिन, जो शरीर को आपात स्थितियों के लिए तैयार करता है; इसकी कमी से हृदय की धड़कन धीमी हो जाती है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि हॉर्मोन पीयूष ग्रंथि द्वारा स्रावित होता है</span><span style=\"font-family:'Mangal'\"> और शरीर की </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि और विकास को नियंत्रित</span><span style=\"font-family:'Mangal'\"> करता है, सभी अंगों में वृद्धि को उद्दीपित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बचपन में वृद्धि हॉर्मोन की कमी से बौनापन होता है</span><span style=\"font-family:'Mangal'\">, जो लड़के की अवस्था से मेल खाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइपोथैलेमस</span><span style=\"font-family:'Mangal'\"> की महत्वपूर्ण भूमिका है: जब वृद्धि हॉर्मोन का स्तर कम होता है, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि हॉर्मोन मोचक कारक</span><span style=\"font-family:'Mangal'\"> छोड़ता है, जो पीयूष ग्रंथि को वृद्धि हॉर्मोन स्रावित करने के लिए उद्दीपित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थायरॉक्सिन थायरॉइड ग्रंथि से (आयोडीन की कमी से घेंघा होता है), इंसुलिन अग्न्याशय से और ऐड्रिनैलिन अधिवृक्क ग्रंथियों से स्रावित होते हैं। इनमें से कोई भी पीयूष ग्रंथि का हॉर्मोन नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लड़के में वृद्धि हॉर्मोन की कमी है, जिससे बौनापन होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): वाहनों में एयरबैग टक्कर की स्थिति में यात्री को गंभीर चोट लगने के जोखिम को कम करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): फूला हुआ एयरबैग उस समय को बढ़ा देता है जिसमें यात्री का सिर और छाती रुकते हैं, जिससे त्वरण और इसलिए व्यक्ति पर लगने वाला बल कम हो जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टक्कर की स्थिति में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एयरबैग तेज़ी से फूलकर</span><span style=\"font-family:'Mangal'\"> एक नरम, संपीड्य गद्दी बन जाते हैं, और इनके प्रयोग से </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंभीर चोट का जोखिम कम</span><span style=\"font-family:'Mangal'\"> हो जाता है (सीट बेल्ट के साथ प्रयोग करने पर जोखिम और भी कम हो जाता है) → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एयरबैग उस </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय को बढ़ा देता है</span><span style=\"font-family:'Mangal'\"> जिसमें यात्री का सिर और छाती रुकते हैं; वेग के समान परिवर्तन के लिए अधिक समय का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम त्वरण</span><span style=\"font-family:'Mangal'\"> और इसलिए व्यक्ति पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम बल</span><span style=\"font-family:'Mangal'\"> (F = ma) → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही कारण है कि क्षेत्ररक्षक तेज़ गेंद पकड़ते समय हाथ पीछे खींचता है, क्योंकि रुकने का समय बढ़ाने से बल घट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R ही वह कारण है जिससे एयरबैग चोट कम करते हैं, अतः यह A की सही व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब कोई व्यक्ति तेज़ धूप से एक कम प्रकाश वाले कमरे में जाती है, तो उसकी आँखों की पुतलियाँ बड़ी हो जाती हैं। यह परिवर्तन करने वाली संरचना और परिवर्तन का उद्देश्य हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्ष्माभी पेशियाँ; ये नेत्र लेंस की वक्रता बदलती हैं ताकि वह कम प्रकाश में फोकस कर सके</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परितारिका (आइरिस), कॉर्निया के पीछे स्थित एक गहरे रंग की पेशीय झिल्ली; यह पुतली के आकार को नियंत्रित करती है, जो आँख में प्रवेश करने वाले प्रकाश की मात्रा को नियंत्रित करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉर्निया; यह अधिक उभर जाता है ताकि अधिक प्रकाश आँख में अपवर्तित हो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना; इसकी प्रकाश-सुग्राही कोशिकाएँ अधिक प्रकाश एकत्र करने के लिए फैल जाती हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परितारिका (आइरिस)</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉर्निया के पीछे</span><span style=\"font-family:'Mangal'\"> स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">गहरे रंग की पेशीय झिल्ली (डायाफ्राम)</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परितारिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुतली के आकार को नियंत्रित करती है</span><span style=\"font-family:'Mangal'\">, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुतली आँख में प्रवेश करने वाले प्रकाश की मात्रा को नियंत्रित करती है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कम प्रकाश में परितारिका पुतली को बड़ा कर देती है ताकि अधिक प्रकाश प्रवेश करे; तेज़ प्रकाश में वह पुतली को छोटा कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्ष्माभी पेशियाँ समंजन के लिए नेत्र लेंस की वक्रता (और इसलिए फोकस दूरी) बदलती हैं, पुतली का आकार नहीं; कॉर्निया और रेटिना प्रकाश के स्तर के साथ अपना आकार नहीं बदलते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परितारिका पुतली को बड़ा करके आँख में अधिक प्रकाश आने देती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लोएम, जो पौधों में भोजन का परिवहन करने वाला ऊतक है, चालनी नलिकाओं, सहचर कोशिकाओं, फ्लोएम पैरेन्काइमा और फ्लोएम तंतुओं से बना होता है। निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चालनी नलिकाएँ लंबी, नलिकाकार कोशिकाएँ हैं जो छिद्रित भित्तियों द्वारा सिरे से सिरा जुड़ी होती हैं, और वे पत्तियों से पौधे के अन्य भागों तक भोजन का परिवहन करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सहचर कोशिकाएँ विशिष्ट पैरेन्काइमा कोशिकाएँ हैं जिनका मुख्य कार्य चालनी नलिकाओं में शर्करा के भरने और निकलने (लोडिंग और अनलोडिंग) की निगरानी करना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. फ्लोएम तंतु जीवित कोशिकाएँ हैं जो भोजन, रेज़िन, टैनिन और लेटेक्स का संचय करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">चालनी नलिकाएँ</span><span style=\"font-family:'Mangal'\"> लंबी, नलिकाकार कोशिकाएँ हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">छिद्रित भित्तियों द्वारा सिरे से सिरा जुड़ी</span><span style=\"font-family:'Mangal'\"> होती हैं, और वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्तियों से पौधे के अन्य भागों तक भोजन का परिवहन</span><span style=\"font-family:'Mangal'\"> करती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सहचर कोशिकाएँ</span><span style=\"font-family:'Mangal'\"> विशिष्ट पैरेन्काइमा कोशिकाएँ हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">चालनी नलिका कोशिकाओं के कार्यों को नियंत्रित</span><span style=\"font-family:'Mangal'\"> करती हैं और चालनी नलिकाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">शर्करा के भरने और निकलने की निगरानी</span><span style=\"font-family:'Mangal'\"> करती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. भोजन, रेज़िन, टैनिन और लेटेक्स का संचय </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लोएम पैरेन्काइमा</span><span style=\"font-family:'Mangal'\"> करता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लोएम तंतु मुख्यतः स्क्लेरेन्काइमी</span><span style=\"font-family:'Mangal'\"> होते हैं और चालनी नलिकाओं को सहारा देने के लिए मज़बूती प्रदान करते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम के विपरीत फ्लोएम अधिकतर जीवित कोशिकाओं से बना होता है, परंतु तंतु उसका संचय घटक नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मटमैले जल में पिसी फिटकरी डाली जाती है। इस प्रक्रम को क्या कहते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाष्पन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्कंदन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मटमैला जल मिट्टी के सूक्ष्म कणों का एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">निलंबन</span><span style=\"font-family:'Mangal'\"> है, जो जल को धुँधला बनाए रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फिटकरी</span><span style=\"font-family:'Mangal'\"> इन सूक्ष्म कणों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">आपस में जोड़कर</span><span style=\"font-family:'Mangal'\"> बड़े गुच्छे बना देती है; इस प्रक्रम को </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्कंदन</span><span style=\"font-family:'Mangal'\"> कहते हैं, और फिटकरी एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्कंदक</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारी गुच्छे </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे बैठ जाते हैं (अवसादन)</span><span style=\"font-family:'Mangal'\">, और फिर स्वच्छ जल </span><span style=\"font-weight:bold;font-family:'Mangal'\">निस्तारण या निस्यंदन</span><span style=\"font-family:'Mangal'\"> द्वारा अलग कर लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह प्रक्रम स्कंदन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन के समस्थानिकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्राकृतिक रूप से पाए जाने वाले हाइड्रोजन का लगभग 99.98% प्रोटियम, लगभग 0.015% ड्यूटीरियम है, और ट्राइटियम केवल अल्प मात्रा (ट्रेस) में उपस्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. तीनों समस्थानिकों में एक-एक प्रोटॉन होता है; प्रोटियम में कोई न्यूट्रॉन नहीं होता जबकि ड्यूटीरियम में एक न्यूट्रॉन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ट्राइटियम में एक प्रोटॉन और एक न्यूट्रॉन होता है, अतः इसकी द्रव्यमान संख्या 2 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्राकृतिक हाइड्रोजन में लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">99.98% प्रोटियम</span><span style=\"font-family:'Mangal'\">, लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.015% ड्यूटीरियम</span><span style=\"font-family:'Mangal'\"> है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ट्राइटियम केवल अल्प मात्रा में</span><span style=\"font-family:'Mangal'\"> पाया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. समस्थानिक एक ही तत्व के ऐसे परमाणु हैं जिनमें प्रोटॉनों की संख्या समान परंतु न्यूट्रॉनों की संख्या भिन्न होती है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन के तीनों समस्थानिकों में एक प्रोटॉन</span><span style=\"font-family:'Mangal'\"> है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटियम में कोई न्यूट्रॉन नहीं</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ड्यूटीरियम में एक न्यूट्रॉन</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">ट्राइटियम में दो न्यूट्रॉन</span><span style=\"font-family:'Mangal'\"> होते हैं, अतः इसकी द्रव्यमान संख्या 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> है, 2 नहीं (द्रव्यमान संख्या 2 ड्यूटीरियम की है) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि रासायनिक गुण मुख्यतः संयोजकता इलेक्ट्रॉनों की संख्या पर निर्भर करते हैं, तीनों समस्थानिक रासायनिक रूप से समान हैं परंतु क्वथनांक और गलनांक जैसे भौतिक गुणों में भिन्न हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोटी का एक टुकड़ा गीली रुई पर एक बंद डिब्बे में गर्म (25–35°C), अँधेरी जगह पर रखा जाता है; तीन दिन बाद उस पर फफूँद उगती दिखाई देती है। वैसा ही एक टुकड़ा रेफ्रिजरेटर में रखने पर एक सप्ताह बाद भी फफूँद नहीं दिखती। सबसे उपयुक्त व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फफूँद रोटी की अपनी कोशिकाओं से उगती है, और रेफ्रिजरेटर की ठंड इन कोशिकाओं को मार देती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फफूँद को उगने के लिए प्रकाश चाहिए, और रेफ्रिजरेटर के अंदर अँधेरा होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फफूँद के बीजाणुओं को बहुत अधिक ऑक्सीजन चाहिए, जो रेफ्रिजरेटर के अंदर नहीं होती</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु में पहले से उपस्थित फफूँद के बीजाणु नम रोटी पर बैठ जाते हैं और उन्हें उगने के लिए गर्मी और नमी चाहिए; रेफ्रिजरेटर का कम ताप उनके प्रजनन को धीमा या बंद कर देता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रेड या रोटी पर फफूँद </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु में पहले से उपस्थित कवक बीजाणुओं</span><span style=\"font-family:'Mangal'\"> से उगती है, जो नम सतह पर बैठकर तेज़ी से प्रजनन करने लगते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नम कक्ष को </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्म (25–35°C)</span><span style=\"font-family:'Mangal'\"> और नम रखा जाता है क्योंकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणुओं को उगने के लिए गर्मी और नमी</span><span style=\"font-family:'Mangal'\"> चाहिए; डिब्बे का अँधेरा होना मायने नहीं रखता, क्योंकि फफूँद को प्रकाश की आवश्यकता नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कम ताप फफूँद के प्रजनन को धीमा या बंद कर देता है</span><span style=\"font-family:'Mangal'\">, इसीलिए जल्दी खराब होने वाले भोजन को रेफ्रिजरेटर में रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूक्ष्मदर्शी में फफूँद धागे जैसे कवकतंतु (हाइफ़ी) दिखाती है जिनके सिरों पर गोल थैलियाँ होती हैं जिनमें सूक्ष्म बीजाणु होते हैं; ये लाखों की संख्या में बनते हैं और वायु धाराओं में आसानी से तैरते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गर्म डिब्बे में रोटी पर वायु के बीजाणुओं से फफूँद उगती है जबकि प्रशीतन उनकी वृद्धि रोक देता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर में विद्युत उपकरणों को जोड़ने के तरीके के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. श्रेणीक्रम परिपथ में जब एक घटक खराब हो जाता है, तो परिपथ टूट जाता है और अन्य कोई घटक काम नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. एक विद्युत बल्ब और एक विद्युत हीटर को श्रेणीक्रम में जोड़ना अव्यावहारिक है, क्योंकि उन्हें ठीक से काम करने के लिए बहुत भिन्न धाराओं की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पार्श्वक्रम परिपथ में प्रत्येक उपकरण से, उसके प्रतिरोध की परवाह किए बिना, समान धारा बहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. श्रेणीक्रम परिपथ की एक बड़ी हानि यह है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">जब एक घटक खराब हो जाता है, तो परिपथ टूट जाता है और कोई भी घटक काम नहीं करता</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. श्रेणीक्रम परिपथ में धारा सर्वत्र नियत रहती है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत बल्ब और विद्युत हीटर को श्रेणीक्रम में जोड़ना अव्यावहारिक</span><span style=\"font-family:'Mangal'\"> है, क्योंकि उन्हें ठीक से काम करने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत भिन्न धाराओं</span><span style=\"font-family:'Mangal'\"> की आवश्यकता होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पार्श्वक्रम परिपथ उससे जुड़े उपकरणों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारा को बाँट देता है</span><span style=\"font-family:'Mangal'\">; प्रत्येक उपकरण अपनी आवश्यक धारा लेता है, क्योंकि पार्श्वक्रम संयोजन ठीक तभी उपयोगी है जब प्रत्येक उपकरण का प्रतिरोध भिन्न हो और उसे भिन्न धारा चाहिए → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए घरेलू उपकरण विद्युन्मय और उदासीन तारों के बीच पार्श्वक्रम में जोड़े जाते हैं, प्रत्येक पर समान विभवांतर और अपना स्विच होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम रिबन के समान लंबाई के टुकड़े परखनली A, जिसमें तनु हाइड्रोक्लोरिक अम्ल है, और परखनली B, जिसमें ऐसीटिक अम्ल है, में रखे जाते हैं; दोनों अम्ल समान मात्रा और सांद्रता के हैं। निम्नलिखित में से क्या प्रेक्षित होगा, और क्यों?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों नलियों में बुदबुदाहट समान रूप से तीव्र होती है, क्योंकि दोनों समान सांद्रता के अम्ल हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नली B में बुदबुदाहट अधिक तीव्र होती है, क्योंकि ऐसीटिक अम्ल एक कार्बनिक अम्ल है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नली B में कोई बुदबुदाहट नहीं होती, क्योंकि ऐसीटिक अम्ल धातुओं से अभिक्रिया नहीं करता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नली A में बुदबुदाहट अधिक तीव्र होती है, क्योंकि हाइड्रोक्लोरिक अम्ल एक प्रबल अम्ल है और समान सांद्रता के ऐसीटिक अम्ल की तुलना में अधिक H⁺ आयन उत्पन्न करता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों अम्ल मैग्नीशियम से अभिक्रिया करके लवण और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन गैस</span><span style=\"font-family:'Mangal'\"> देते हैं (अम्ल + धातु → लवण + हाइड्रोजन), जिससे बुदबुदाहट होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल की प्रबलता उसके द्वारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पन्न H⁺ आयनों की संख्या</span><span style=\"font-family:'Mangal'\"> पर निर्भर करती है: समान सांद्रता पर अधिक H⁺ आयन देने वाले अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल अम्ल</span><span style=\"font-family:'Mangal'\"> हैं, और कम H⁺ आयन देने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">दुर्बल अम्ल</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">समान सांद्रता के हाइड्रोक्लोरिक अम्ल और ऐसीटिक अम्ल हाइड्रोजन आयनों की भिन्न मात्राएँ उत्पन्न करते हैं</span><span style=\"font-family:'Mangal'\">: HCl प्रबल अम्ल है और ऐसीटिक अम्ल दुर्बल अम्ल।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः HCl के साथ अभिक्रिया तेज़ होती है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नली A में बुदबुदाहट अधिक तीव्र</span><span style=\"font-family:'Mangal'\"> होती है; ऐसीटिक अम्ल अभिक्रिया तो करता है, परंतु धीमी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नली A में बुदबुदाहट अधिक तीव्र है क्योंकि HCl अधिक प्रबल अम्ल है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र एक छोटे कंपास की सहायता से काग़ज़ की शीट पर एक छड़ चुंबक की चुंबकीय क्षेत्र रेखाएँ खींचता है। निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जब कंपास को चुंबक के उत्तरी ध्रुव के पास रखा जाता है, तो सुई का दक्षिणी ध्रुव चुंबक के उत्तरी ध्रुव की ओर संकेत करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कंपास की सुई का विक्षेप बढ़ता जाता है जब उसे किसी क्षेत्र रेखा के अनुदिश चुंबक के ध्रुवों की ओर ले जाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. परिपाटी के अनुसार क्षेत्र रेखाएँ चुंबक के दक्षिणी ध्रुव से निकलती हैं और उत्तरी ध्रुव पर मिलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कंपास की सुई एक छोटा छड़ चुंबक है, और असमान ध्रुव आकर्षित करते हैं: चुंबक के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तरी ध्रुव के पास सुई का दक्षिणी ध्रुव उसकी ओर संकेत करता है</span><span style=\"font-family:'Mangal'\">, जबकि सुई का उत्तरी ध्रुव उससे दूर की ओर होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. क्षेत्र की सापेक्ष प्रबलता क्षेत्र रेखाओं की निकटता से दर्शाई जाती है; ध्रुवों के पास क्षेत्र अधिक प्रबल होता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुई का विक्षेप बढ़ता जाता है जब उसे क्षेत्र रेखा के अनुदिश ध्रुवों की ओर ले जाया जाता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. परिपाटी के अनुसार </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय क्षेत्र रेखाएँ चुंबक के उत्तरी ध्रुव से निकलती हैं और दक्षिणी ध्रुव पर मिलती हैं</span><span style=\"font-family:'Mangal'\"> (किसी बिंदु पर क्षेत्र की दिशा वह है जिसमें कंपास की सुई का उत्तरी ध्रुव चलता है), अतः कथन में यह उल्टा कहा गया है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति को दूर की दृष्टि ठीक करने के लिए −4 D शक्ति का लेंस और निकट की दृष्टि ठीक करने के लिए +2 D शक्ति का लेंस चाहिए। दोनों लेंसों की फोकस दूरियाँ और उनकी प्रकृति क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−25 cm (अवतल) और +50 cm (उत्तल)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−40 cm (अवतल) और +20 cm (उत्तल)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−25 cm (उत्तल) और +50 cm (अवतल)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−50 cm (अवतल) और +25 cm (उत्तल)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस की शक्ति मीटर में उसकी फोकस दूरी का व्युत्क्रम है: P = 1/f, अतः f = 1/P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूर की दृष्टि के लिए: f = 1 / (−4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−0.25 m = −25 cm</span><span style=\"font-family:'Mangal'\">; ऋणात्मक फोकस दूरी का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल (अपसारी) लेंस</span><span style=\"font-family:'Mangal'\">, जो निकट-द
