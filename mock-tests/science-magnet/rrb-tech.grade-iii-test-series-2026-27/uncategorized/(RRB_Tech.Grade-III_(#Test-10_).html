ृष्टि दोष वाली आँख में दूर की वस्तु के प्रतिबिंब को वापस रेटिना पर ले आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकट की दृष्टि के लिए: f = 1 / (+2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.50 m = +50 cm</span><span style=\"font-family:'Mangal'\">; धनात्मक फोकस दूरी का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल (अभिसारी) लेंस</span><span style=\"font-family:'Mangal'\">, जो निकट दृष्टि के लिए आवश्यक अतिरिक्त फोकसन शक्ति देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे व्यक्ति को द्विफोकसी लेंस चाहिए: ऊपरी भाग दूर की दृष्टि के लिए अवतल और निचला भाग निकट की दृष्टि के लिए उत्तल।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः फोकस दूरियाँ −25 cm (अवतल) और +50 cm (उत्तल) हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लू (ऊष्मा लहर) के दौरान एक तालाब में रहने वाली एक जाति के अधिकांश जीवाणु मर जाते हैं, परंतु कुछ ऐसे जीवाणु जो गर्मी सह सकते हैं, जीवित रहते हैं और संख्या में बढ़ते हैं। यह निम्नलिखित में से किस सिद्धांत को दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी जाति में सभी विभिन्नताओं के पर्यावरण में जीवित रहने की संभावना समान होती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी विभिन्नताओं के जीवित रहने की संभावना समान नहीं होती; पर्यावरणीय कारकों द्वारा विभिन्न रूपों (वैरिएंट) का चयन विकास प्रक्रमों का आधार बनता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लू के दौरान जीवाणु गर्मी-प्रतिरोध अर्जित कर लेते हैं और फिर उसे अपनी संतति को दे देते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक प्रजनन कोई विभिन्नता उत्पन्न नहीं करता, अतः जीवित बचे जीवाणु मरे हुए जीवाणुओं के समान ही हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रजनन ऐसे जीव उत्पन्न करता है जो समान परंतु सूक्ष्म रूप से भिन्न होते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">किसी जाति की सभी विभिन्नताओं के अपने पर्यावरण में जीवित रहने की संभावना समान नहीं</span><span style=\"font-family:'Mangal'\"> होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभिन्नता की प्रकृति के अनुसार अलग-अलग व्यष्टियों को अलग-अलग प्रकार के लाभ मिलते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्मी सह सकने वाले जीवाणु लू में बेहतर जीवित रहते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पर्यावरणीय कारकों द्वारा विभिन्न रूपों का चयन विकास प्रक्रमों का आधार</span><span style=\"font-family:'Mangal'\"> है। गर्मी-प्रतिरोधी रूप समष्टि में पहले से उपस्थित थे और बदली परिस्थितियों ने उन्हें चुना, बनाया नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक प्रजनन भी कुछ विविधता उत्पन्न करता है (यद्यपि लैंगिक प्रजनन कहीं अधिक), अतः D गलत है; A प्रेक्षण के विपरीत है, और C एक अर्जित लक्षण का वर्णन करता है, जबकि विभिन्नता इस प्रकार नहीं उत्पन्न हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह पर्यावरणीय कारकों द्वारा विभिन्न रूपों का चयन है, जो विकास का आधार है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कशेरुकियों के हृदय के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मछलियों का हृदय दो-कक्षीय होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. उभयचरों का हृदय तीन-कक्षीय होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मछलियों सहित सभी कशेरुकियों में दोहरा परिसंचरण होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">मछलियों का हृदय दो-कक्षीय</span><span style=\"font-family:'Mangal'\"> होता है; रक्त गलफड़ों में पंप होता है, वहाँ ऑक्सीजनित होकर सीधे शरीर में जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">उभयचरों</span><span style=\"font-family:'Mangal'\"> (और अनेक सरीसृपों) का </span><span style=\"font-weight:bold;font-family:'Mangal'\">हृदय तीन-कक्षीय</span><span style=\"font-family:'Mangal'\"> होता है और वे ऑक्सीजनित और विऑक्सीजनित रक्त के कुछ मिश्रण को सहन कर लेते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मछलियों में प्रत्येक चक्र में रक्त हृदय से </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल एक बार</span><span style=\"font-family:'Mangal'\"> गुज़रता है (</span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल परिसंचरण</span><span style=\"font-family:'Mangal'\">); </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोहरा परिसंचरण</span><span style=\"font-family:'Mangal'\"> अन्य कशेरुकियों में पाया जाता है, और पक्षियों तथा स्तनधारियों का हृदय </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार-कक्षीय</span><span style=\"font-family:'Mangal'\"> होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाल ही में अध्ययन किया गया एक जीव T अकोशिकीय है, उसमें आनुवंशिक पदार्थ है, और वह परपोषी कोशिका के बाहर पूर्णतः निष्क्रिय रहता है। पाँच जगत वर्गीकरण प्रणाली में T को रखा जाना चाहिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँचों जगतों में से किसी में नहीं, क्योंकि T में कोशिकीय संगठन नहीं है, जो पाँच जगत प्रणाली का मूलभूत आधार है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत मोनेरा में, क्योंकि यह सूक्ष्म और प्रोकैरियोटी है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत प्रोटिस्टा में, क्योंकि यह आनुवंशिक पदार्थ वाली एक इकाई है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत कवक में, क्योंकि यह पोषण के लिए परपोषी पर निर्भर है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीव T (</span><span style=\"font-weight:bold;font-family:'Mangal'\">अकोशिकीय, आनुवंशिक पदार्थ युक्त और परपोषी कोशिका के बाहर निष्क्रिय</span><span style=\"font-family:'Mangal'\">) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाइरस</span><span style=\"font-family:'Mangal'\"> के लक्षण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच जगत वर्गीकरण (मोनेरा, प्रोटिस्टा, कवक, प्लांटी, एनिमेलिया) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका के प्रकार</span><span style=\"font-family:'Mangal'\"> (प्रोकैरियोट या यूकैरियोट), कोशिका संरचना, संगठन के स्तर और पोषण की विधि जैसे मानदंडों पर आधारित है। ये सभी मानते हैं कि जीव कोशिकाओं से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाइरसों में कोशिकीय संगठन नहीं होता</span><span style=\"font-family:'Mangal'\">, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँचों जगतों में से किसी में भी फ़िट नहीं होते</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोनेरा, प्रोटिस्टा और कवक सभी कोशिकीय जीवों से बने हैं (क्रमशः प्रोकैरियोटी जीवाणु, सच्चे केंद्रक वाले एककोशिकीय यूकैरियोट, और कोशिका भित्ति वाले परपोषी), अतः विकल्प B, C और D गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः T को पाँचों जगतों में से किसी में नहीं रखा जाता </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन चक्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कुल वैश्विक कार्बन का लगभग 71% महासागरों में पाया जाता है, जबकि वायुमंडल में इसका केवल लगभग 1% है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. धीमे कार्बन चक्र में दबे हुए मृत पौधे और जंतु लाखों वर्षों में जीवाश्म ईंधनों में बदल जाते हैं, परंतु इन ईंधनों को जलाने पर कार्बन बहुत कम समय में CO₂ के रूप में वापस लौट आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. महासागरीय जल वायुमंडलीय CO₂ को अवशोषित करके कार्बोनेट और बाइकार्बोनेट आयन बनाता है, जिनका उपयोग पादपप्लवक प्रकाश संश्लेषण के लिए नहीं कर सकते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कुल वैश्विक कार्बन की मात्रा का </span><span style=\"font-weight:bold;font-family:'Mangal'\">71% महासागरों में</span><span style=\"font-family:'Mangal'\"> पाया जाता है, और यह महासागरीय भंडार वायुमंडल में CO₂ की मात्रा को नियंत्रित करता है, जिसमें केवल बहुत छोटा अंश, लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">1%</span><span style=\"font-family:'Mangal'\">, है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीमे कार्बन चक्र</span><span style=\"font-family:'Mangal'\"> (लाखों वर्ष) में मृत पौधे और जंतु दबकर कोयला, तेल और गैस जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवाश्म ईंधनों में बदल जाते हैं</span><span style=\"font-family:'Mangal'\">; जीवाश्म ईंधन जलाने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन बहुत कम समय में CO₂ के रूप में वापस निकल जाता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. महासागरीय जल CO₂ को अवशोषित करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बोनेट और बाइकार्बोनेट आयन</span><span style=\"font-family:'Mangal'\"> अवश्य बनाता है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादपप्लवक इन आयनों का उपयोग प्रकाश संश्लेषण के लिए करते हैं</span><span style=\"font-family:'Mangal'\">, और कुछ समुद्री जीव इनसे कवच बनाते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक उथले कटोरे की तली में एक सिक्का रखा है और एक छात्र तब तक पीछे हटता है जब तक सिक्का कटोरे के किनारे के पीछे दिखना बंद न हो जाए। छात्र के हिले बिना, एक मित्र धीरे-धीरे कटोरे में जल डालता है, और सिक्का फिर से दिखाई देने लगता है। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल की सतह सिक्के से आने वाले प्रकाश को छात्र की आँखों की ओर परावर्तित कर देती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कटोरे का जल उत्तल लेंस की तरह कार्य करके सिक्के को आवर्धित कर देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिक्के से आने वाला प्रकाश जल से वायु में जाते समय अभिलंब की ओर मुड़ता है, अतः सिक्का अपनी वास्तविक स्थिति से नीचे दिखाई देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिक्के से आने वाला प्रकाश जल (सघन माध्यम) से वायु (विरल माध्यम) में जाते समय अभिलंब से दूर मुड़ता है, अतः सिक्का अपनी वास्तविक स्थिति से ऊपर उठा हुआ दिखाई देता है और दृष्टि में आ जाता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश के अपवर्तन</span><span style=\"font-family:'Mangal'\"> का उदाहरण है: प्रकाश सभी माध्यमों में एक ही दिशा में नहीं चलता, और जब वह तिरछा एक माध्यम से दूसरे में जाता है तो उसकी दिशा बदल जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिक्के से आने वाला प्रकाश </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल (प्रकाशिक रूप से सघन)</span><span style=\"font-family:'Mangal'\"> से </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु (प्रकाशिक रूप से विरल)</span><span style=\"font-family:'Mangal'\"> में जाता है; सघन से विरल माध्यम में जाने वाली किरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">तेज़ हो जाती है और अभिलंब से दूर मुड़ती है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस मुड़ने के कारण आँख तक पहुँचने वाली किरणें </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिक्के से ऊँचे बिंदु</span><span style=\"font-family:'Mangal'\"> से आती प्रतीत होती हैं, अतः सिक्का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपनी वास्तविक स्थिति से ऊपर उठा दिखाई देता है</span><span style=\"font-family:'Mangal'\">। इसी कारण टंकी या तालाब की तली उठी हुई दिखती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह आभासी उठान सिक्के को किनारे की रेखा से ऊपर ले आती है, अतः वह फिर दिखने लगता है; सतह पर परावर्तन या लेंस की क्रिया इसमें शामिल नहीं है, और अभिलंब की ओर मुड़ना केवल वायु से जल में जाने वाले प्रकाश के लिए होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सिक्का इसलिए दिखता है क्योंकि अपवर्तन उसे ऊपर उठा हुआ दिखाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जंतु अपने बच्चों के जीवित रहने को कैसे सुनिश्चित करते हैं, इस पर आधारित निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मछलियों में बाह्य निषेचन होता है, वे एक बार में सैकड़ों से हज़ारों अंडे देती हैं, और उनके बच्चों की उत्तरजीविता कम होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. आंतरिक निषेचन में बच्चों के जीवित रहने की संभावना प्रायः अधिक होती है, क्योंकि निषेचित अंडा या भ्रूण अधिक सुरक्षित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. सरीसृपों और पक्षियों में अंडे के भीतर विकसित हो रहे भ्रूण का पोषण पीतक (योक) के बजाय सीधे माँ के शरीर से होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">मछलियाँ</span><span style=\"font-family:'Mangal'\"> जल में रहती हैं, उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाह्य निषेचन</span><span style=\"font-family:'Mangal'\"> होता है, वे एक बार में </span><span style=\"font-weight:bold;font-family:'Mangal'\">100–1000 अंडे</span><span style=\"font-family:'Mangal'\"> देती हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बच्चों की उत्तरजीविता कम</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंतरिक निषेचन</span><span style=\"font-family:'Mangal'\"> (सरीसृप, पक्षी और स्तनधारी) में निषेचित अंडा या भ्रूण </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक सुरक्षित</span><span style=\"font-family:'Mangal'\"> रहता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">बच्चों के जीवित रहने की संभावना प्रायः अधिक</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरीसृपों और पक्षियों में प्रत्येक अंडे में विकसित हो रहे भ्रूण के पोषण के लिए पर्याप्त पीतक</span><span style=\"font-family:'Mangal'\"> होता है जब तक कि वह अंडे से नहीं निकल आता; स्तनधारियों में ही युग्मनज माँ के शरीर के भीतर बढ़ता और विकसित होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सीधी सड़क पर 24 m/s से चलती एक मोटरसाइकिल पर नियत त्वरण से ब्रेक लगाए जाते हैं और वह 72 m चलकर रुक जाती है। मोटरसाइकिल का त्वरण और उसके रुकने में लगा समय क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−4 m/s² और 8 s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−3 m/s² और 8 s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−4 m/s² और 6 s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−8 m/s² और 3 s</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गति की दिशा को धनात्मक लीजिए: u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 m/s</span><span style=\"font-family:'Mangal'\">, v = 0, s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">72 m</span><span style=\"font-family:'Mangal'\">; त्वरण नियत है इसलिए शुद्धगतिकी समीकरणों का उपयोग किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v² = u² + 2as → 0 = 24² + 2 × a × 72 → 144a = −576 → a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4 m/s²</span><span style=\"font-family:'Mangal'\">; ऋणात्मक चिह्न दर्शाता है कि त्वरण गति की दिशा के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = u + at → 0 = 24 + (−4)t → t = 24 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: s = ut + ½at² = (24 × 6) − (½ × 4 × 36) = 144 − 72 = 72 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्वरण −4 m/s² और रुकने का समय 6 s है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): इलेक्ट्रॉन प्रत्येक तत्व के परमाणुओं का एक मूलभूत घटक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): कैथोड किरणें ऋणावेशित कणों की धाराएँ हैं जिनका द्रव्यमान परमाणुओं की तुलना में बहुत कम होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैथोड किरणों की प्रकृति </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैथोड के पदार्थ और कैथोड किरण नलिका में भरी गैस से स्वतंत्र</span><span style=\"font-family:'Mangal'\"> पाई गई; इससे पता चला कि उत्सर्जित कण हर प्रकार के परमाणु से आते हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉन सभी परमाणुओं का मूलभूत घटक हैं</span><span style=\"font-family:'Mangal'\"> → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैद्युत और चुंबकीय क्षेत्रों में कैथोड किरणों का अध्ययन करके जे. जे. टॉमसन ने निष्कर्ष निकाला कि ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऋणावेशित कणों की धाराएँ</span><span style=\"font-family:'Mangal'\"> हैं जिनका </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान परमाणुओं से बहुत कम</span><span style=\"font-family:'Mangal'\"> है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु इन कणों का कम द्रव्यमान और ऋणावेश अपने आप में यह सिद्ध नहीं करते कि वे हर तत्व में उपस्थित हैं; वह निष्कर्ष इस प्रेक्षण से आया कि कैथोड का पदार्थ या गैस कुछ भी हो, किरणें एक जैसी रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R कैथोड किरणों के बारे में सत्य कथन है, परंतु यह A की व्याख्या नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र जल ऊष्मक (वॉटर बाथ) में एथेनॉल को गर्म करता है और क्षारीय पोटैशियम परमैंगनेट का 5% विलयन बूँद-बूँद डालता है। बैंगनी रंग पहले गायब हो जाता है, परंतु कुछ निश्चित बूँदें डालने के बाद रंग बना रहता है। निम्नलिखित में से कौन-सा इसकी व्याख्या करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल एथेन में अपचयित हो जाता है, और पोटैशियम परमैंगनेट की अपचायक शक्ति समाप्त हो जाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम परमैंगनेट निर्जलीकारक का कार्य करता है और एथेनॉल को एथीन में बदल देता है, जो उसे रंगहीन कर देती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षारीय पोटैशियम परमैंगनेट एक ऑक्सीकारक है जो एथेनॉल को एथेनॉइक अम्ल में ऑक्सीकृत करता है और स्वयं खर्च हो जाता है; जब सारा एथेनॉल ऑक्सीकृत हो जाता है, तो डाला गया परमैंगनेट और खर्च नहीं होता और उसका बैंगनी रंग बना रहता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल और पोटैशियम परमैंगनेट मिलकर एक मीठी गंध वाला एस्टर बनाते हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो पदार्थ </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरों में ऑक्सीजन जोड़ने</span><span style=\"font-family:'Mangal'\"> में समर्थ होते हैं, उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीकारक</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारीय पोटैशियम परमैंगनेट</span><span style=\"font-family:'Mangal'\"> (और अम्लीकृत पोटैशियम डाइक्रोमेट) ऑक्सीजन जोड़कर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐल्कोहॉलों को कार्बोक्सिलिक अम्लों में ऑक्सीकृत</span><span style=\"font-family:'Mangal'\"> करता है: एथेनॉल एथेनॉइक अम्ल में बदल जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब तक एथेनॉल ऑक्सीकृत हो रहा है, परमैंगनेट अभिक्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">खर्च होता रहता है</span><span style=\"font-family:'Mangal'\">, अतः हर बूँद डालने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैंगनी रंग गायब</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब सारा एथेनॉल ऑक्सीकृत हो जाता है, तो परमैंगनेट की आगे की बूँदें खर्च नहीं होतीं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैंगनी रंग बना रहता है</span><span style=\"font-family:'Mangal'\">। एथेनॉल एथेन में अपचयित नहीं होता, परमैंगनेट निर्जलीकारक नहीं है (वह सांद्र सल्फ्यूरिक अम्ल है), और एस्टर के लिए अम्ल और ऐल्कोहॉल चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परमैंगनेट एक ऑक्सीकारक है जो तब तक खर्च होता है जब तक सारा एथेनॉल ऑक्सीकृत नहीं हो जाता </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): चीड़ (पाइन) जैसे अनावृतबीजी पौधों को निषेचन के लिए उसी प्रकार जल की आवश्यकता होती है जैसे ब्रायोफाइट को।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): अनावृतबीजी पौधों की पत्तियाँ सुई जैसी होती हैं जो जल की हानि कम करती हैं, और वे ठंडे और शुष्क क्षेत्रों के लिए भली-भाँति अनुकूलित हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रायोफाइट</span><span style=\"font-family:'Mangal'\"> में प्रजनन के लिए जल आवश्यक है क्योंकि नर जनन कोशिकाओं को तैरकर मादा कोशिकाओं तक पहुँचना होता है; परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनावृतबीजी पौधों में निषेचन के लिए जल आवश्यक नहीं</span><span style=\"font-family:'Mangal'\"> है, और वे बीज बनाते हैं (यद्यपि बीज फलों से ढके नहीं होते) → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनावृतबीजी के उदाहरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">चीड़ और साइकस</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठंडे और शुष्क क्षेत्रों के लिए भली-भाँति अनुकूलित</span><span style=\"font-family:'Mangal'\"> हैं; उनकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुई जैसी या शल्क जैसी पत्तियाँ जल की हानि कम करती हैं</span><span style=\"font-family:'Mangal'\"> और कठोर परिस्थितियाँ सहने में सहायता करती हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनावृतबीजी ('gymnos' = नग्न, 'spermos' = बीज) ऐसे बीज बनाते हैं जो विकसित हो रहे भ्रूण की रक्षा करते हैं और संचित भोजन रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रीष्म की एक रात को एक बड़े शहर के केंद्र में दर्ज तापमान आसपास के गाँवों की तुलना में कुछ डिग्री अधिक पाया जाता है। सबसे उपयुक्त व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शहर गाँवों की तुलना में कम ऊँचाई पर हैं, और ऊँचाई घटने पर तापमान बढ़ता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शहर के वाहन ऑक्सीजन छोड़ते हैं, जो ज़मीन के पास ऊष्मा को रोक लेती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टील, कंक्रीट और ईंट की इमारतें और कंक्रीट व डामर की सड़कें दिन में सौर विकिरण अवशोषित करती हैं और रात में ऊष्मा पुनः विकिरित करती हैं, जबकि गाँवों में अधिक वनस्पति है जो छाया और वाष्पोत्सर्जन से ठंडी रहती है; यही नगरीय ऊष्मा द्वीप प्रभाव है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शहर को अधिक सूर्यातप मिलता है क्योंकि सूर्य की किरणें उस पर लंबवत पड़ती हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नगरीय ऊष्मा द्वीप प्रभाव</span><span style=\"font-family:'Mangal'\"> बताता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">शहर आसपास के ग्रामीण क्षेत्रों से गर्म</span><span style=\"font-family:'Mangal'\"> क्यों होते हैं, विशेषकर ग्रीष्म में और रात के समय।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शहरों में निर्मित क्षेत्र अधिक है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टील, कंक्रीट और ईंट की इमारतें, और कंक्रीट व डामर की सड़कें</span><span style=\"font-family:'Mangal'\">, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">सौर विकिरण अवशोषित करके ऊष्मा रोके रखती हैं</span><span style=\"font-family:'Mangal'\">; सभी वस्तुएँ ऊष्मा विकिरित करती हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नगरीय पदार्थों से पुनः विकिरित यह ऊष्मा शहर को</span><span style=\"font-family:'Mangal'\"> आसपास से अधिक गर्म करती है (इसीलिए ग्रीष्म की रात में कंक्रीट का घर गर्म लगता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रामीण क्षेत्रों और वनों में अधिक वनस्पति होती है जो छाया और पौधों के वाष्पोत्सर्जन से ठंडी रहती है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई, वाहनों की ऑक्सीजन और सूर्य की किरणों का कोण शहर और कुछ किलोमीटर दूर के गाँवों में भिन्न नहीं होते, अतः A, B और D गलत हैं; यह प्रभाव दर्शाता है कि मानव भूमि-उपयोग स्थानीय जलवायु को बदल सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शहर नगरीय ऊष्मा द्वीप प्रभाव के कारण गर्म है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक जौहरी ग्राहक को बताता है कि उसकी दुकान के आभूषण 22 कैरेट सोने के बने हैं, 24 कैरेट सोने के नहीं। निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 कैरेट सोना 24 कैरेट सोने से अधिक शुद्ध है, इसीलिए इसे आभूषणों के लिए पसंद किया जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 कैरेट सोना शुद्ध सोना है, जो बहुत नरम होता है; 22 कैरेट सोने में शुद्ध सोने के 22 भागों को ताँबे या चाँदी के 2 भागों के साथ मिश्रित किया जाता है ताकि वह आभूषणों के लिए पर्याप्त कठोर हो जाए</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 कैरेट सोने में पारा होता है, और सोने और पारे की ऐसी मिश्रधातु को अमलगम कहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शुद्ध सोने को ताँबे के साथ मिश्रित करने से उसकी विद्युत चालकता और गलनांक बढ़ जाते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">शुद्ध सोना, जिसे 24 कैरेट सोना कहते हैं, बहुत नरम होता है</span><span style=\"font-family:'Mangal'\"> और इसलिए आभूषण बनाने के लिए उपयुक्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसे कठोर बनाने के लिए शुद्ध सोने को </span><span style=\"font-weight:bold;font-family:'Mangal'\">चाँदी या ताँबे के साथ मिश्रित</span><span style=\"font-family:'Mangal'\"> किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में आभूषणों के लिए प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 कैरेट सोना</span><span style=\"font-family:'Mangal'\"> प्रयोग होता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुद्ध सोने के 22 भागों को ताँबे या चाँदी के 2 भागों के साथ मिश्रित किया जाता है</span><span style=\"font-family:'Mangal'\">; अतः 22 कैरेट सोना 24 कैरेट से कम शुद्ध है, अधिक नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पारा युक्त मिश्रधातु को अमलगम कहते हैं, परंतु 22 कैरेट सोने में ताँबा या चाँदी होती है, पारा नहीं; और मिश्रधातु की विद्युत चालकता और गलनांक शुद्ध धातुओं से कम होते हैं। अतः A, C और D गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 24 कैरेट सोना शुद्ध परंतु नरम है, और 22 कैरेट सोने को ताँबे या चाँदी के मिश्रण से कठोर बनाया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बाँसुरी, एक इकतारा और एक तबला एक ही स्वर को समान प्रबलता से बजाते हैं, फिर भी आँखें बंद किए श्रोता आसानी से बता देता है कि कौन-सा वाद्य बज रहा है। ध्वनि का वह गुण जो इसे संभव बनाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तारत्व (पिच), क्योंकि प्रत्येक वाद्य स्वर को भिन्न आवृत्ति पर उत्पन्न करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणता (टिम्बर), क्योंकि प्रत्येक वाद्य मूल आवृत्ति के साथ अधिस्वरकों (ओवरटोन) का भिन्न समूह जोड़ता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीव्रता, क्योंकि प्रत्येक वाद्य प्रति इकाई क्षेत्रफल भिन्न मात्रा में ऊर्जा स्थानांतरित करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्तकाल, क्योंकि प्रत्येक वाद्य के कंपन भिन्न समय तक चलते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक संगीतमय स्वर सबसे कम आवृत्ति, जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूल आवृत्ति</span><span style=\"font-family:'Mangal'\"> कहते हैं, और उच्च आवृत्तियों, जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिस्वरक</span><span style=\"font-family:'Mangal'\"> कहते हैं, का संयोजन है; ये मिलकर समृद्ध और मधुर ध्वनि बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाँसुरी, इकतारा या तबला जैसे भिन्न वाद्य एक ही स्वर को समान प्रबलता से बजाते हैं, तब भी प्रत्येक की ध्वनि अनूठी</span><span style=\"font-family:'Mangal'\"> होती है; ध्वनि के इस गुण को </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुणता (टिम्बर)</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि स्वर एक ही है, तारत्व (मूल आवृत्ति) समान है; चूँकि प्रबलता समान है, आयाम और तीव्रता समान हैं। अतः A, C और D भेद करने वाला गुण नहीं हो सकते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सारंगी, सितार और वीणा जैसे भारतीय तंतु वाद्य मूल आवृत्ति और अधिस्वरकों के इस संयोजन को समृद्ध करने के लिए अतिरिक्त तार प्रयोग करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वाद्यों में भेद उनकी गुणता से होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा विभज्योतक कोशिकाओं का एक विशिष्ट लक्षण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिक्त स्थानों वाली मृत कोशिकाएँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लिग्निन जमाव वाली पतली भित्तियाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सघन कोशिकाद्रव्य और रिक्तिकाओं का अभाव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोटी भित्तियाँ और बड़ी रिक्तिकाएँ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभज्योतक कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवित कोशिकाएँ</span><span style=\"font-family:'Mangal'\"> हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">सक्रिय रूप से विभाजित</span><span style=\"font-family:'Mangal'\"> होती रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये छोटी होती हैं, इनकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">भित्तियाँ पतली और सेलुलोज़ की</span><span style=\"font-family:'Mangal'\"> होती हैं (लिग्निन नहीं), </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रक बड़ा और स्पष्ट</span><span style=\"font-family:'Mangal'\"> होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाद्रव्य सघन</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">रिक्तिकाएँ प्रायः अनुपस्थित</span><span style=\"font-family:'Mangal'\"> होती हैं, और कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सघन रूप से व्यवस्थित</span><span style=\"font-family:'Mangal'\"> होती हैं जिनके बीच अंतरकोशिकीय स्थान बहुत कम या नहीं होता; ये लक्षण तीव्र कोशिका विभाजन में सहायक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लिग्निन युक्त मोटी भित्तियों वाली मृत कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्क्लेरेन्काइमा</span><span style=\"font-family:'Mangal'\"> की होती हैं, विभज्योतक की नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विभज्योतक कोशिकाओं में सघन कोशिकाद्रव्य होता है और रिक्तिकाओं का अभाव होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र लगभग 2 g लेड नाइट्रेट चूर्ण वाली क्वथन नली को चिमटे से पकड़कर ज्वाला पर गर्म करता है। निम्नलिखित में से कौन-सा प्रेक्षण और अभिक्रिया के प्रकार को सही बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन डाइऑक्साइड के भूरे धुएँ निकलते हैं, लेड ऑक्साइड का अवशेष बचता है, और ऑक्सीजन भी मुक्त होती है; यह ऊष्मीय अपघटन अभिक्रिया है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक रंगहीन गैस, हाइड्रोजन, पॉप की ध्वनि के साथ निकलती है; यह विस्थापन अभिक्रिया है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन के श्वेत धुएँ निकलते हैं और लेड धातु बच जाती है; यह संयोजन अभिक्रिया है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रोमीन के भूरे धुएँ निकलते हैं; यह द्विविस्थापन अभिक्रिया है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्म करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">लेड नाइट्रेट अपघटित होता है</span><span style=\"font-family:'Mangal'\">: 2Pb(NO₃)₂(s) → 2PbO(s) + 4NO₂(g) + O₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रेक्षित </span><span style=\"font-weight:bold;font-family:'Mangal'\">भूरे धुएँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन डाइऑक्साइड (NO₂)</span><span style=\"font-family:'Mangal'\"> के हैं, नली में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लेड ऑक्साइड</span><span style=\"font-family:'Mangal'\"> का ठोस अवशेष बचता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> भी मुक्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही अभिकारक टूटकर सरल उत्पाद देता है, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है; चूँकि यह गर्म करके की जाती है, इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊष्मीय अपघटन</span><span style=\"font-family:'Mangal'\"> कहते हैं (जैसे कैल्सियम कार्बोनेट या फ़ेरस सल्फ़ेट का गर्म करने पर अपघटन)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें हाइड्रोजन, नाइट्रोजन या ब्रोमीन शामिल नहीं है, और न कुछ संयोजित होता है न आयनों की अदला-बदली होती है, अतः B, C और D गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः NO₂ के भूरे धुएँ दिखते हैं और अभिक्रिया ऊष्मीय अपघटन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान लीजिए एक घास के मैदान के पारिस्थितिकी तंत्र में एक पोषक स्तर के सभी जीव (जैसे शाकाहारी) हटा दिए जाते हैं। निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल शाकाहारी स्तर प्रभावित होता है, जबकि उत्पादक और मांसाहारी अपरिवर्तित बने रहते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मांसाहारी उत्पादक को खाने लगेंगे, अतः पारिस्थितिकी तंत्र को कोई क्षति नहीं होती</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्पादक अनियंत्रित रूप से बढ़ सकता है जबकि ऊपरी स्तरों का उपभोक्ता भूखा रह जाता है; प्रभाव विभिन्न पोषक स्तरों के लिए भिन्न होता है, परंतु किसी भी पोषक स्तर को पारिस्थितिकी तंत्र को क्षति पहुँचाए बिना नहीं हटाया जा सकता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीर्ष मांसाहारियों को हटाने का पारिस्थितिकी तंत्र पर कोई प्रभाव नहीं पड़ेगा, क्योंकि कोई जीव उन्हें नहीं खाता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पारिस्थितिकी तंत्र के विभिन्न घटक परस्पर निर्भर हैं</span><span style=\"font-family:'Mangal'\">: उत्पादक सूर्य के प्रकाश की ऊर्जा को पारिस्थितिकी तंत्र के शेष भाग के लिए उपलब्ध कराता है, और प्रत्येक उपभोक्ता स्तर अपने से नीचे के स्तर पर निर्भर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शाकाहारी मार दिए जाएँ, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पादक (घास) को कोई नहीं खाता और वह अनियंत्रित रूप से बढ़ सकता है</span><span style=\"font-family:'Mangal'\">, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">शाकाहारियों को खाने वाले मांसाहारी बिना भोजन के भूखे रह जाते हैं</span><span style=\"font-family:'Mangal'\">; मांसाहारी घास खाने पर नहीं उतर सकते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">किसी पोषक स्तर को हटाने का प्रभाव विभिन्न स्तरों के लिए भिन्न होता है</span><span style=\"font-family:'Mangal'\">: उत्पादक को हटाने से ऊर्जा का प्रवाह पूरी तरह रुक जाएगा, जबकि शीर्ष मांसाहारियों को हटाने से शाकाहारी या निचले मांसाहारी नियंत्रण से बाहर बढ़ जाएँगे। अतः D भी गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस परस्पर निर्भरता के कारण </span><span style=\"font-weight:bold;font-family:'Mangal'\">किसी भी पोषक स्तर के जीवों को पारिस्थितिकी तंत्र को क्षति पहुँचाए बिना नहीं हटाया जा सकता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह हटाना पूरे पारिस्थितिकी तंत्र को अस्त-व्यस्त कर देता है और कोई भी स्तर बिना क्षति के नहीं हटाया जा सकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32 Ω प्रतिरोध के एक एकसमान तार को चार बराबर भागों में काटा जाता है, और फिर चारों भागों को पार्श्वक्रम (समांतर) में जोड़ा जाता है। संयोजन का तुल्य प्रतिरोध है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 Ω</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">128 Ω</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.5 Ω</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार का प्रतिरोध उसकी लंबाई के अनुक्रमानुपाती है (R ∝ l), अतः चार बराबर भागों में से प्रत्येक का प्रतिरोध 32 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 Ω</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार समान प्रतिरोधकों के पार्श्वक्रम के लिए: 1/Rₚ = 1/8 + 1/8 + 1/8 + 1/8 = 4/8, अतः Rₚ = 8 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्यतः R प्रतिरोध के तार को n बराबर भागों में काटकर पार्श्वक्रम में जोड़ने पर R/n² मिलता है, अर्थात् यहाँ R/R' = n² = 16; पार्श्वक्रम संयोजन का तुल्य प्रतिरोध सदैव सबसे छोटे व्यक्तिगत प्रतिरोध से कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों भागों को श्रेणीक्रम में जोड़ने पर बस 32 Ω ही वापस मिलता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तुल्य प्रतिरोध 2 Ω है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कायिक प्रवर्धन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जब आलू के टुकड़े गीली रुई पर रखे जाते हैं, तो केवल वही टुकड़े ताज़ा हरे प्ररोह और जड़ें देते हैं जिनमें खाँच या कलिका ('आँख') होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मनीप्लांट के तने के वे टुकड़े, जो दो पत्तियों के बीच से बिना किसी पर्वसंधि (नोड) के काटे गए हैं, जल में डुबाने पर नई पत्तियाँ उगाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ब्रायोफिलम की पत्ती के किनारे की खाँचों में बनी कलिकाएँ मिट्टी पर गिरकर नए पौधों में विकसित हो जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जब आलू को टुकड़ों में काटकर, कुछ खाँच या कलिका (आँख) वाले और कुछ बिना, गीली रुई पर रखा जाता है, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल कलिका वाले टुकड़े ताज़ा हरे प्ररोह और जड़ें देते हैं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जल में डुबाए गए मनीप्लांट के तने के वे टुकड़े जिनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम से कम एक पत्ती (पर्वसंधि) है, नई पत्तियाँ उगाते हैं</span><span style=\"font-family:'Mangal'\">, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो पत्तियों के बीच के भाग से काटे गए टुकड़े नहीं</span><span style=\"font-family:'Mangal'\"> उगाते → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रायोफिलम की पत्ती के किनारे की खाँचों में बनी कलिकाएँ</span><span style=\"font-family:'Mangal'\"> मिट्टी पर गिरकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">नए पौधों में विकसित हो जाती हैं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन सभी मामलों में जड़, तना और पत्तियों जैसे भाग नए पौधों में विकसित होते हैं; यही कायिक प्रवर्धन है, जिसका उपयोग गन्ना, गुलाब या अंगूर उगाने के लिए दाब लगाने (लेयरिंग) या कलम बाँधने (ग्राफ़्टिंग) में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी आयनिक यौगिक में धनायनों का कुल धनावेश ऋणायनों के कुल ऋणावेश के बराबर होना चाहिए। निम्नलिखित में से आयनों का कौन-सा संयोजन विद्युत उदासीन यौगिक देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 Mg</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> और 2 Cl⁻</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Fe</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> और 2 O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> और 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 Ca</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> और 3 NO₃⁻</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यौगिक तभी उदासीन होता है जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">धनावेश और ऋणावेश संतुलित</span><span style=\"font-family:'Mangal'\"> हों; आयनों के आवेशों को क्रिस-क्रॉस करके सूत्र लिखने का यही आधार है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: 3 × (2+) = 6+ परंतु 2 × (1−) = 2− → असंतुलित। विकल्प B: 2 × (3+) = 6+ परंतु 2 × (2−) = 4− → असंतुलित। विकल्प D: 1 × (2+) = 2+ परंतु 3 × (1−) = 3− → असंतुलित।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: 2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> से 2 × (3+) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6+</span><span style=\"font-family:'Mangal'\"> और 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> से 3 × (2−) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6−</span><span style=\"font-family:'Mangal'\">; आवेश पूर्णतः निरस्त हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह यौगिक ऐलुमिनियम सल्फेट, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al₂(SO₄)₃</span><span style=\"font-family:'Mangal'\"> है। कोष्ठक इसलिए लगाए जाते हैं क्योंकि एक से अधिक बहुपरमाणुक सल्फेट आयन उपस्थित हैं, और सूत्र में आयनों के आवेश नहीं दर्शाए जाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> और 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> उदासीन यौगिक देते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊर्जा के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चंद्रमा की सतह पर गुरुत्वाकर्षण पृथ्वी की तुलना में लगभग छठा भाग है, अतः समान चाल से ऊपर फेंकी गई गेंद चंद्रमा पर पृथ्वी की तुलना में लगभग छह गुना ऊँचाई तक जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. घर्षण के विरुद्ध किया गया कार्य वस्तु में स्थितिज ऊर्जा के रूप में संचित हो जाता है, ठीक वैसे ही जैसे गुरुत्व के विरुद्ध किया गया कार्य।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. एक वास्तविक लोलक धीमा होकर अंततः रुक जाता है क्योंकि वह आधार पर घर्षण और वायु प्रतिरोध के कारण ऊर्जा खो देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी दी गई चाल से ऊपर फेंकी गेंद की गतिज ऊर्जा ½mv² स्थितिज ऊर्जा mgh में बदलती है, अतः प्राप्त ऊँचाई h = v²/2g </span><span style=\"font-weight:bold;font-family:'Mangal'\">g के व्युत्क्रमानुपाती</span><span style=\"font-family:'Mangal'\"> है; चंद्रमा पर g पृथ्वी का लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span><span style=\"font-family:'Mangal'\"> होने से गेंद लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">छह गुना ऊँचाई</span><span style=\"font-family:'Mangal'\"> तक जाती है (पृथ्वी पर 8 m तक जाने वाला फेंकाव चंद्रमा पर लगभग 48 m तक जाता है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. गुरुत्वीय, वैद्युत या चुंबकीय जैसे आंतरिक बलों के विरुद्ध किया गया कार्य स्थितिज ऊर्जा के रूप में संचित हो सकता है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण के विरुद्ध किया गया कार्य ऊर्जा के संचय की ओर नहीं ले जाता</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वास्तविक जीवन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लोलक धीमा होकर अंततः रुक जाता है</span><span style=\"font-family:'Mangal'\"> क्योंकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">आधार पर घर्षण और वायु प्रतिरोध के कारण ऊर्जा की हानि</span><span style=\"font-family:'Mangal'\"> होती है; ऐसी हानियों के अभाव में ही उसकी यांत्रिक ऊर्जा नियत रहती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ऐलुमिनियम छड़ AB को एक नाल चुंबक के ध्रुवों के बीच क्षैतिज रूप से लटकाया जाता है, जिसमें चुंबकीय क्षेत्र ऊर्ध्वाधर है, और उसमें धारा प्रवाहित की जाती है; छड़ बग़ल की ओर विस्थापित हो जाती है। निम्नलिखित में से कौन-सा परिवर्तन छड़ का विस्थापन नहीं बढ़ाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छड़ में धारा बढ़ाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यवस्था को इस प्रकार घुमाना कि छड़ में धारा चुंबकीय क्षेत्र के समांतर बहे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिक प्रबल नाल चुंबक का उपयोग करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र के भीतर स्थित छड़ की लंबाई बढ़ाना</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छड़ का विस्थापन दर्शाता है कि चुंबकीय क्षेत्र में रखे </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारावाही चालक पर एक बल लगता है</span><span style=\"font-family:'Mangal'\">; धारा की दिशा उलटने पर बल की दिशा उलट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन (बल का परिमाण) तब बढ़ता है जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">छड़ में धारा बढ़ाई जाती है</span><span style=\"font-family:'Mangal'\">, जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक प्रबल चुंबक</span><span style=\"font-family:'Mangal'\"> प्रयोग किया जाता है, और जब क्षेत्र में स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">छड़ की लंबाई</span><span style=\"font-family:'Mangal'\"> बढ़ाई जाती है। अतः A, C और D सभी विस्थापन बढ़ाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विस्थापन तब सबसे अधिक होता है जब धारा की दिशा चुंबकीय क्षेत्र की दिशा के लंबवत हो</span><span style=\"font-family:'Mangal'\">; जब धारा क्षेत्र के समांतर हो, तो छड़ पर कोई बल नहीं लगता और वह बिल्कुल विस्थापित नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः छड़ को इस प्रकार घुमाना कि धारा क्षेत्र के अनुदिश बहे, विस्थापन को बढ़ाने के बजाय शून्य कर देगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धारा को क्षेत्र के समांतर करने से विस्थापन नहीं बढ़ेगा </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WK - UQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MT - KY</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FB - DG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RH - PM</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MT − KY: M − 2 = K, T + 5 = Y → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FB − DG: F − 2 = D, B + 5 = G → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RH − PM: R − 2 = P, H + 5 = M → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WK − UQ: W − 2 = U, K + 6 = Q → (−2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+6</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (−2, +5) का पालन करते हैं; केवल WK − UQ नहीं (K + 5 = P होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">WK - UQ (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अक्षर-संख्या समूह दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आकर उसे तार्किक रूप से पूर्ण करेगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HUL 19, MZQ 36, REV 53, WJA 70, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BNE 88</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOF 87</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CMD 80</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BMF 90</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों को स्थान के अनुसार और संख्याओं को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: H → M → R → W: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → W + 5 = 23 + 5 = 28 → 28 − 26 = 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: U → Z → E → J: प्रत्येक +5 (Z + 5 = 26 + 5 = 31 → 31 − 26 = 5 = E) → J + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: L → Q → V → A: प्रत्येक +5 (V + 5 = 22 + 5 = 27 → 1 = A) → A + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ: 19 → 36 → 53 → 70: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+17</span><span style=\"font-family:'Mangal'\"> → 70 + 17 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">87</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह BOF 87 है; BNE 88, CMD 80 और BMF 90 में अक्षर-चरण या संख्या-चरण टूटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">BOF 87 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q का पुत्र है। Q, R की बहन है। R, S की पत्नी है। S, T का पिता है। P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की बहन का पुत्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता के भाई का पुत्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन का पुत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, S की पत्नी है → R और S पति-पत्नी हैं; S, T का पिता है, अतः R, T की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, R की बहन है → Q और R के माता-पिता एक ही हैं → Q, T की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता की बहन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q का पुत्र है → P, T की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता की बहन का पुत्र</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: Q, R की बहन है, भाई नहीं (विकल्प B); Q का T से संबंध R (माता) के माध्यम से है, S (पिता) के माध्यम से नहीं (विकल्प C); P और T के माता-पिता अलग-अलग हैं, अतः वे भाई नहीं हैं (विकल्प D)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, T की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता की बहन का पुत्र (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए ताकि वह तार्किक रूप से पूर्ण हो जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZKF TLA NMV HNQ ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOK</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">COL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BNL</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: Z → T → N → H: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6</span><span style=\"font-family:'Mangal'\"> → H − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: K → L → M → N: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\"> → N + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: F → A → V → Q: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−5</span><span style=\"font-family:'Mangal'\"> (A − 5 = 1 − 5 = −4 → 26 − 4 = 22 = V) → Q − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOK, COL और BNL में BOL से एक-एक अक्षर भिन्न है, अतः वे पैटर्न का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">BOL (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P’ का अर्थ ‘×’, ‘Q’ का अर्थ ‘÷’, ‘R’ का अर्थ ‘−’ और ‘S’ का अर्थ ‘+’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 P 3) Q 4 S 5 P 8 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">53</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों के स्थान पर चिह्न रखें: (12 × 3) ÷ 4 + 5 × 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\
