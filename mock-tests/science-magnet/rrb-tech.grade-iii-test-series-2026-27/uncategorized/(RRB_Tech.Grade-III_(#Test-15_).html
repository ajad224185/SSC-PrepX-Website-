</span><span style=\"font-weight:bold;font-family:'Mangal'\">7, 2 और 4</span><span style=\"font-family:'Mangal'\"> उभयनिष्ठ हैं, अतः ये तीनों अंक किसी क्रम में M, I और L के लिए हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILD के कूट में बचा हुआ अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> है, अतः 8, D के लिए है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LIME के कूट में बचा हुआ अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> है, अतः 9, E के लिए है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'E' का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई अक्षर, संख्या और प्रतीक शृंखला को देखिए और उसके बाद दिए गए प्रश्न का उत्तर दीजिए। सभी संख्याएँ एक अंक की हैं। गिनती केवल बाएँ से दाएँ की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) R 4 # M 2 B % 7 * K T 9 @ P &amp; 5 D 3 $ 8 W (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला में ऐसे कितने प्रतीक हैं जिनमें से प्रत्येक के ठीक पहले एक संख्या और ठीक बाद एक अक्षर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला के प्रत्येक प्रतीक को एक-एक करके लें और उसके ठीक पहले तथा ठीक बाद वाले अवयव को देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">#: ठीक पहले 4 है, जो संख्या है, और ठीक बाद M है, जो अक्षर है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">%: ठीक पहले B है, जो अक्षर है, अतः % पहली ही शर्त पर खरा नहीं उतरता ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">*: ठीक पहले 7 है, जो संख्या है, और ठीक बाद K है, जो अक्षर है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">@: ठीक पहले 9 है, जो संख्या है, और ठीक बाद P है, जो अक्षर है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">&amp;: ठीक पहले P है, जो अक्षर है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">$: ठीक पहले 3 है, जो संख्या है, परंतु ठीक बाद 8 है, जो संख्या है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः #, * और @ ये तीनों प्रतीक दोनों शर्तों पर खरे उतरते हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\"> प्रतीक।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए समीकरण को सही बनाने के लिए प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 ÷ 4 + 5 × ? − 8 = 26</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें: पहले ÷ और × हल करें, फिर + और −.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\">, अतः समीकरण 9 + 5 × ? − 8 = 26 बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">, अतः 5 × ? + 1 = 26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × ? = 26 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> = 25 है, अतः ? = 5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 36 ÷ 4 + 5 × 5 − 8 = 9 + 25 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4 लेने पर 21, 6 लेने पर 31 और 7 लेने पर 36 आता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास, रोहित के पिता हैं। सुनीता, विकास की इकलौती बहन है। मीना, सुनीता की माता है। मीना का रोहित से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की बहन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई और बहन के माता-पिता समान होते हैं, अतः रोहित से शुरू करके एक-एक चरण चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास, रोहित के पिता हैं, अतः रोहित से पहला चरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसके पिता विकास</span><span style=\"font-family:'Mangal'\"> तक जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुनीता, विकास की इकलौती बहन है, अतः सुनीता और विकास के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीना, सुनीता की माता है, और सुनीता तथा विकास के माता-पिता समान हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">मीना, विकास की भी माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास, रोहित के पिता हैं, इसलिए मीना, रोहित के पिता की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता की माता होने के लिए संबंध रोहित की माता से होकर जाना पड़ता, और पिता की बहन तो सुनीता है, मीना नहीं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मीना, रोहित के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता की माता (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह बक्से A, B, C, D, E और F एक के ऊपर एक रखे हैं, और प्रत्येक बक्से में एक अलग फल है: आम, सेब, अमरूद, लीची, संतरे और पपीते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C के ऊपर केवल दो बक्से रखे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, C के ठीक नीचे रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सबसे ऊपर रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आम वाला बक्सा सबसे नीचे रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, सेब वाले बक्से के ठीक ऊपर रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमरूद वाला बक्सा C के ठीक ऊपर रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D में संतरे हैं और वह सबसे नीचे नहीं रखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किस बक्से में सेब हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों को नीचे से ऊपर की ओर 1 से 6 तक क्रमांकित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C के ऊपर केवल दो बक्से हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, C के ठीक नीचे है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सबसे ऊपर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमरूद वाला बक्सा C के ठीक ऊपर है → स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> वाले बक्से में अमरूद हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब D, E और F के लिए स्थान 1, 2 और 5 बचे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, सेब वाले बक्से के ठीक ऊपर है, अतः E स्थान 1 पर नहीं हो सकता; और यदि E स्थान 2 पर होता, तो सेब स्थान 1 पर होते, जहाँ आम रखे हैं। अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 5</span><span style=\"font-family:'Mangal'\">, और सेब स्थान 4 वाले बक्से में हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D सबसे नीचे नहीं है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 2</span><span style=\"font-family:'Mangal'\">, और बचा हुआ एकमात्र स्थान 1, </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> को मिलेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे से अंतिम क्रम: F में आम, D में संतरे, B, C, E में अमरूद, A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थान 4 पर C है, अतः C में सेब हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सेब वाला बक्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">C (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा, यदि ‘×’ और ‘−’ को आपस में बदल दिया जाए तथा ‘+’ और ‘÷’ को आपस में बदल दिया जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 × 6 ÷ 9 + 3 − 12 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्नों को बदलें: प्रत्येक × के स्थान पर −, प्रत्येक − के स्थान पर ×, प्रत्येक + के स्थान पर ÷ और प्रत्येक ÷ के स्थान पर + रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 × 6 ÷ 9 + 3 − 12 बन जाता है 36 − 6 + 9 ÷ 3 × 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब BODMAS लागू करें, अर्थात् + और − से पहले ÷ और × हल करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 ÷ 3 × 12 = 3 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 − 6 + 36 = 30 + 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">66</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(60 और 72 तब आते हैं जब कोई एक चिह्न बिना बदले रह जाए, तथा 54 तब आता है जब भाग से पहले जोड़ कर लिया जाए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">66 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राकेश बिंदु A से चलना शुरू करता है और 14 km उत्तर की ओर गाड़ी चलाता है। फिर वह दाएँ मुड़कर 9 km चलाता है। फिर वह दाएँ मुड़कर 5 km चलाता है। इसके बाद वह बाएँ मुड़कर 3 km चलाता है और बिंदु B पर रुक जाता है। बिंदु A से बिंदु B कितनी दूरी पर और किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 km, उत्तर-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, दक्षिण-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km, उत्तर-पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, उत्तर-पूर्व</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिंदु A को मूल बिंदु लें; पूर्व = +x, उत्तर = +y, और 1 इकाई = 1 km.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह 14 km उत्तर की ओर चलाता है → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, 14</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाएँ मुड़ने पर वह पूर्व की ओर हो जाता है, और 9 km पूर्व → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">9, 14</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके दाएँ मुड़ने पर वह दक्षिण की ओर हो जाता है, और 5 km दक्षिण → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">9, 9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाएँ मुड़ने पर वह पूर्व की ओर हो जाता है, और 3 km पूर्व → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु B, बिंदु A से 12 km पूर्व और 9 km उत्तर में है, जिसका अर्थ है कि B, A के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पूर्व</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी AB = √(12² + 9²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(144 + 81) = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(21 km में समकोण त्रिभुज के स्थान पर दोनों दूरियाँ जोड़ दी गई हैं, 12 km में उत्तर वाला भाग छूट जाता है, तथा दक्षिण-पूर्व दिशा इसलिए गलत है क्योंकि B, A के उत्तर में है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु B, बिंदु A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km, उत्तर-पूर्व (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CHE HEG MBI RYK ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WUM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XVM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WVM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WVN</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के तीनों स्थानों की अलग-अलग तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: C, H, M, R, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → ? = R + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: H, E, B, Y, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\"> → ? = Y − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: E, G, I, K, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\"> → ? = K + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह WVM है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(WUM में दूसरा अक्षर एक स्थान अधिक पीछे गया है, XVM में पहला अक्षर छह स्थान आगे गया है, तथा WVN में तीसरा अक्षर तीन स्थान आगे गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">WVM (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJP - PJG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MDR - RDM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KWT - TKW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XSV - VSX</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के अक्षर पहले समूह के ही अक्षर हैं, अतः उनके स्थानों के बजाय उनका क्रम जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJP को उल्टे क्रम में लिखने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">PJG</span><span style=\"font-family:'Mangal'\"> बनता है, जो दूसरा समूह है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MDR को उल्टे क्रम में लिखने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">RDM</span><span style=\"font-family:'Mangal'\"> बनता है, जो दूसरा समूह है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XSV को उल्टे क्रम में लिखने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">VSX</span><span style=\"font-family:'Mangal'\"> बनता है, जो दूसरा समूह है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KWT को उल्टे क्रम में लिखने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">TWK</span><span style=\"font-family:'Mangal'\"> बनता है, परंतु युग्म में T</span><span style=\"font-weight:bold;font-family:'Mangal'\">KW</span><span style=\"font-family:'Mangal'\"> दिया है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म इस नियम का पालन करते हैं: समूह के अक्षरों को उल्टे क्रम में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">KWT - TKW (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति A, B, C, D, E, F, G और H एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के बाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E के बाईं ओर से गिनने पर E और G के बीच केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, G के दाईं ओर दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, G का निकटतम पड़ोसी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D के बाईं ओर से गिनने पर D और H के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठों व्यक्तियों का मुख केंद्र की ओर है, अतः उनमें से प्रत्येक के लिए ‘बाएँ’ = दक्षिणावर्त (clockwise) और ‘दाएँ’ = वामावर्त (anticlockwise)। सीटों को दक्षिणावर्त 1 से 8 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">A सीट 1 पर</span><span style=\"font-family:'Mangal'\">; किसी व्यक्ति के बाईं ओर जाने पर 1 जुड़ता है, दाईं ओर जाने पर 1 घटता है, तथा सीट 8 के बाद फिर सीट 1 आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के बाईं ओर तीसरे स्थान पर → C = 1 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर → E = 4 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E के बाईं ओर से गिनने पर E और G के बीच केवल दो व्यक्ति हैं → G = 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, G के दाईं ओर दूसरे स्थान पर → D = 5 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A के ठीक दाईं ओर → B = 1 − 1 = 0 → 0 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, G का निकटतम पड़ोसी है → सीट 5 के पास सीट 4 और सीट 6 हैं, और सीट 4 पर C है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 6</span><span style=\"font-family:'Mangal'\">, तथा बची हुई एकमात्र सीट 7 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 8, दक्षिणावर्त): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, E, D, C, G, F, H, B</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D के बाईं ओर से गिनने का अर्थ है सीट 3 से दक्षिणावर्त चलना, अतः सीट 7 (H की सीट) से पहले सीट 4, 5 और 6 आती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः D और H के बीच बैठे व्यक्तियों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ कलम पुस्तकें हैं। सभी पुस्तकें कागज़ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ कलम कागज़ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) सभी कागज़ पुस्तकें हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ कलम पुस्तकें हैं → कलमों का वृत्त और पुस्तकों का वृत्त कम से कम एक भाग में एक-दूसरे को काटते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी पुस्तकें कागज़ हैं → पुस्तकों का वृत्त पूरी तरह कागज़ों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ कलम कागज़ हैं → जो कलम पुस्तकें हैं, वे पुस्तकों के वृत्त के अंदर हैं, और पूरा पुस्तकों का वृत्त कागज़ों के वृत्त के अंदर है, अतः वे कलम कागज़ भी हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): सभी कागज़ पुस्तकें हैं → कागज़ों का वृत्त पुस्तकों के वृत्त से बहुत बड़ा खींचा जा सकता है, जिसके एक भाग में कोई पुस्तक न हो, अतः यह केवल एक संभावना है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अक्षर-संख्या समूह दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आएगा जिससे वह तार्किक रूप से पूर्ण हो जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BF 5, FJ 11, JN 23, ?, RV 95</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NR 46</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MR 47</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NS 47</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NR 47</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों और संख्याओं को अलग-अलग पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: B, F, J, ?, R: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> → ? = J + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: F, J, N, ?, V: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> → ? = N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब संख्याओं को देखें: 5, 11, 23, ?, 95.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × 2 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span><span style=\"font-family:'Mangal'\"> ✓ और 11 × 2 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23</span><span style=\"font-family:'Mangal'\"> ✓, अतः प्रत्येक संख्या = (पिछली संख्या × 2) + 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">? = 23 × 2 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">47</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम पद की जाँच करें: 47 × 2 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">95</span><span style=\"font-family:'Mangal'\"> ✓, जो शृंखला के अंत में दी गई संख्या से मेल खाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(NR 46 में अंतिम चरण गलत हो जाता है, MR 47 में पहला अक्षर केवल तीन स्थान आगे गया है, तथा NS 47 में दूसरा अक्षर पाँच स्थान आगे गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">NR 47 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDK : GIF</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPT : RUO</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DFN : IKS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEH : HJC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JLQ : OPL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTW : WYS</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDK : GIF → B + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, D + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, K − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> → (+5, +5, −5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPT : RUO → M + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, P + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, T − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> → (+5, +5, −5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: पहला और दूसरा अक्षर पाँच स्थान आगे जाते हैं, तीसरा अक्षर पाँच स्थान पीछे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B, CEH : HJC → C + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, E + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, H − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> → (+5, +5, −5) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, DFN : IKS → D + 5 = I ✓, F + 5 = K ✓, परंतु N − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\"> है, S नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, JLQ : OPL → J + 5 = O ✓, परंतु L + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> है, P नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, RTW : WYS → R + 5 = W ✓, T + 5 = Y ✓, परंतु W − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है, S नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">CEH : HJC (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित संख्या-युग्मों में, दूसरी संख्या पहली संख्या पर कुछ गणितीय संक्रियाएँ करके प्राप्त की गई है। उस समुच्चय का चयन कीजिए जिसकी संख्याएँ दिए गए समुच्चयों की संख्याओं के समान ही संबंधित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 - 24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 - 120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\ \"> तथा उनके राज्यक्षेत्रों की सूची है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पहले संविधान संशोधन अधिनियम, 1951</span><span style=\"font-family:'Mangal'\"> द्वारा जोड़ी गई </span><span style=\"font-weight:bold;font-family:'Mangal'\">नौवीं अनुसूची</span><span style=\"font-family:'Mangal'\"> में वे विधियाँ रखी जाती हैं जिन्हें मूल अधिकारों के उल्लंघन के आधार पर न्यायालय में चुनौती नहीं दी जा सकती, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">73वें संविधान संशोधन अधिनियम, 1992</span><span style=\"font-family:'Mangal'\"> द्वारा जोड़ी गई </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्यारहवीं अनुसूची</span><span style=\"font-family:'Mangal'\"> में पंचायतों के विषय सूचीबद्ध हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शपथ और प्रतिज्ञान </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीसरी अनुसूची (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में हैं।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारतीय नौसेना के बहुराष्ट्रीय नौसैनिक अभ्यास का 13वाँ संस्करण MILAN 2026 किस शहर के तट के पास आयोजित हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोच्चि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुंबई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोर्ट ब्लेयर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विशाखापत्तनम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">भारतीय नौसेना</span><span style=\"font-family:'Mangal'\"> के बहुराष्ट्रीय नौसैनिक अभ्यास का </span><span style=\"font-weight:bold;font-family:'Mangal'\">13वाँ</span><span style=\"font-family:'Mangal'\"> संस्करण </span><span style=\"font-weight:bold;font-family:'Mangal'\">MILAN 2026</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 से 25 फ़रवरी 2026</span><span style=\"font-family:'Mangal'\"> तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">विशाखापत्तनम</span><span style=\"font-family:'Mangal'\"> में और उसके तट के पास आयोजित हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके साथ ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतरराष्ट्रीय बेड़ा समीक्षा 2026</span><span style=\"font-family:'Mangal'\"> भी हुई और इस अभ्यास का विषय </span><span style=\"font-weight:bold;font-family:'Mangal'\">'Camaraderie, Cooperation, Collaboration'</span><span style=\"font-family:'Mangal'\"> (सौहार्द, सहयोग और सहकार) था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विशाखापत्तनम का पूरा कार्यक्रम (</span><span style=\"font-weight:bold;font-family:'Mangal'\">IFR 2026</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">MILAN</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">IONS प्रमुखों का सम्मेलन</span><span style=\"font-family:'Mangal'\">) </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 से 25 फ़रवरी 2026</span><span style=\"font-family:'Mangal'\"> तक चला।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span><span style=\"font-family:'Mangal'\"> पोत तथा पनडुब्बियाँ और </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span><span style=\"font-family:'Mangal'\"> विमान शामिल हुए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समापन समारोह विशाखापत्तनम के तट के पास भारत के स्वदेशी विमानवाहक पोत </span><span style=\"font-weight:bold;font-family:'Mangal'\">INS विक्रांत</span><span style=\"font-family:'Mangal'\"> पर हुआ; मिलन अभ्यास की शुरुआत </span><span style=\"font-weight:bold;font-family:'Mangal'\">1995</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार</span><span style=\"font-family:'Mangal'\"> नौसेनाओं के साथ हुई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अभ्यास </span><span style=\"font-weight:bold;font-family:'Mangal'\">विशाखापत्तनम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> के तट के पास आयोजित हुआ।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 मार्च 2026 को दिए गए 98वें अकादमी पुरस्कारों में सर्वश्रेष्ठ फ़िल्म का अकादमी पुरस्कार किस फ़िल्म को मिला?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिनर्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हैमनेट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वन बैटल आफ्टर अनदर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सेंटिमेंटल वैल्यू</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">98वें अकादमी पुरस्कार</span><span style=\"font-family:'Mangal'\">, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 मार्च 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लॉस एंजिल्स</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">डॉल्बी थिएटर</span><span style=\"font-family:'Mangal'\"> में दिए गए, उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्वश्रेष्ठ फ़िल्म</span><span style=\"font-family:'Mangal'\"> का पुरस्कार </span><span style=\"font-weight:bold;font-family:'Mangal'\">वन बैटल आफ्टर अनदर</span><span style=\"font-family:'Mangal'\"> को मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके निर्देशक </span><span style=\"font-weight:bold;font-family:'Mangal'\">पॉल थॉमस एंडरसन</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्वश्रेष्ठ निर्देशक</span><span style=\"font-family:'Mangal'\"> का पुरस्कार मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">माइकल बी. जॉर्डन</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिनर्स</span><span style=\"font-family:'Mangal'\"> के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्वश्रेष्ठ अभिनेता</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">जेसी बकले</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">हैमनेट</span><span style=\"font-family:'Mangal'\"> के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्वश्रेष्ठ अभिनेत्री</span><span style=\"font-family:'Mangal'\"> का पुरस्कार मिला।</span></p><p style=\"marg eight:bold;font-family:'Mangal'\">अक्तूबर और नवंबर</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लौटते मानसून</span><span style=\"font-family:'Mangal'\"> से मिलती है, जब पवनें उत्तर-पूर्व से चलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पूर्वी</span><span style=\"font-family:'Mangal'\"> पवनें </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंगाल की खाड़ी</span><span style=\"font-family:'Mangal'\"> को पार करती हैं, उसके ऊपर से नमी लेती हैं और फिर इस तट पर वर्षा करती हैं, इसीलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">चेन्नई</span><span style=\"font-family:'Mangal'\"> से मानसून देश के अधिकांश भागों की तुलना में बाद में लौटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पश्चिम मानसून</span><span style=\"font-family:'Mangal'\"> के समय कोरोमंडल तट </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिमी घाट</span><span style=\"font-family:'Mangal'\"> की </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृष्टि छाया</span><span style=\"font-family:'Mangal'\"> में पड़ता है, इसलिए उन महीनों में यह अपेक्षाकृत सूखा रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिमी विक्षोभ</span><span style=\"font-family:'Mangal'\"> उत्तर-पश्चिमी भारत में शीत ऋतु की वर्षा लाते हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">काल बैसाखी</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम बंगाल</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">असम</span><span style=\"font-family:'Mangal'\"> में मानसून से पहले शाम को आने वाले _heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगस्त 1908 में फाँसी पर चढ़ाए गए खुदीराम बोस ने प्रफुल्ल चाकी के साथ मिलकर किस स्थान पर बम फेंका था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुज़फ़्फ़रपुर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलीपुर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चटगाँव</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैरकपुर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खुदीराम बोस</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रफुल्ल चाकी</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 अप्रैल 1908</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिहार</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुज़फ़्फ़रपुर</span><span style=\"font-family:'Mangal'\"> में बम फेंका था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनका निशाना </span><span style=\"font-weight:bold;font-family:'Mangal'\">डगलस किंग्सफ़ोर्ड</span><span style=\"font-family:'Mangal'\"> थे, वही न्यायाधीश जिन्होंने युवा क्रांतिकारियों को कठोर दंड दिए थे, परंतु जिस बग्घी पर बम फेंका गया उसमें दो अंग्रेज़ महिलाएँ, </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्रीमती केनेडी और कुमारी केनेडी</span><span style=\"font-family:'Mangal'\">, सवार थीं और उनकी मृत्यु हो गई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्रफुल्ल चाकी</span><span style=\"font-family:'Mangal'\"> ने गिरफ़्तारी से बचने के लिए स्वयं को गोली मार ली और </span><span style=\"font-weight:bold;font-family:'Mangal'\">खुदीराम बोस</span><span style=\"font-family:'Mangal'\"> पर मुक़दमा चलाकर उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 अगस्त 1908</span><span style=\"font-family:'Mangal'\"> को फाँसी दी गई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">1908</span><span style=\"font-family:'Mangal'\"> का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलीपुर</span><span style=\"font-family:'Mangal'\"> षड्यंत्र मुक़दमा वह मुक़दमा था जिसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अरविंद घोष</span><span style=\"font-family:'Mangal'\"> अभियुक्त थे, </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैरकपुर</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1857</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">मंगल पांडे</span><span style=\"font-family:'Mangal'\"> ने विद्रोह किया था और </span><span style=\"font-weight:bold;font-family:'Mangal'\">1930</span><span style=\"font-family:'Mangal'\"> का </span><span style=\"font-weight:bold;font-family:'Mangal'\">चटगाँव</span><span style=\"font-family:'Mangal'\"> शस्त्रागार कांड </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य सेन</span><span style=\"font-family:'Mangal'\"> के नेतृत्व में हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बम </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुज़फ़्फ़रपुर (विकल्प A)</
