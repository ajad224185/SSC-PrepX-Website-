question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्य नेत्र की दृष्टि परास के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वह न्यूनतम दूरी जिस पर वस्तुएँ बिना किसी तनाव के सबसे स्पष्ट दिखाई देती हैं, स्पष्ट दृष्टि की न्यूनतम दूरी कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सामान्य दृष्टि वाले युवा व्यक्ति के लिए स्पष्ट दृष्टि की न्यूनतम दूरी लगभग 2.5 cm होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वह दूरतम बिंदु जिस तक नेत्र वस्तुओं को स्पष्ट देख सकता है, दूर बिंदु कहलाता है, और सामान्य नेत्र के लिए वह अनंत पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्पष्ट दृष्टि की न्यूनतम दूरी</span><span style=\"font-family:'Mangal'\">, जिसे निकट बिंदु भी कहते हैं, वह न्यूनतम दूरी है जिस पर वस्तु बिना किसी तनाव के सबसे स्पष्ट दिखाई देती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सामान्य दृष्टि वाले युवा व्यक्ति के लिए यह दूरी लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 cm</span><span style=\"font-family:'Mangal'\"> होती है, 2.5 cm नहीं, इसीलिए पुस्तक लगभग हाथ भर की दूरी पर पकड़ी जाती है, आँख से सटाकर नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूर बिंदु</span><span style=\"font-family:'Mangal'\"> वह दूरतम बिंदु है जिस तक नेत्र वस्तुओं को स्पष्ट देख सकता है, और सामान्य नेत्र के लिए वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनंत</span><span style=\"font-family:'Mangal'\"> पर होता है, इसीलिए दूर के तारे भी दिखाई देते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 kg द्रव्यमान का एक गुटका क्षैतिज मेज़ पर विरामावस्था में रखा है। g = 10 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> लेने पर गुटके के लिए इनमें से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भार 50 N नीचे की ओर तथा अभिलंब बल 50 N ऊपर की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भार 5 N नीचे की ओर तथा अभिलंब बल 5 N ऊपर की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भार 50 N नीचे की ओर तथा उस पर कोई अन्य बल नहीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भार 50 N नीचे की ओर तथा अभिलंब बल 50 N नीचे की ओर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी गुटके को अपनी ओर खींचती है, और गुटके पर लगने वाला यही गुरुत्वीय बल उसका </span><span style=\"font-weight:bold;font-family:'Mangal'\">भार</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भार = mg = 5 × 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 N</span><span style=\"font-family:'Mangal'\">, और यह ऊर्ध्वाधर नीचे की ओर लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस मेज़ की सतह पर गुटका रखा है, वह सतह उसे सतह के लंबवत ऊपर की ओर धकेलती है; इस धक्के को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिलंब बल</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुटका विरामावस्था में रहता है, अतः उस पर नेट बल शून्य होना चाहिए, जिसका अर्थ है कि अभिलंब बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 N ऊपर की ओर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भार 50 N नीचे की ओर तथा अभिलंब बल 50 N ऊपर की ओर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रासायनिक समीकरण लिखने के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. तीर का सिरा उत्पादों की ओर होता है और अभिक्रिया की दिशा दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जब कोई अभिकारक या उत्पाद जल में विलयन के रूप में उपस्थित हो, तब (aq) लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. हर रासायनिक समीकरण में अभिकारकों तथा उत्पादों की भौतिक अवस्थाएँ लिखनी ही पड़ती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अभिकारक बाईं ओर तथा उत्पाद दाईं ओर लिखे जाते हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीर का सिरा उत्पादों की ओर</span><span style=\"font-family:'Mangal'\"> होता है, जो अभिक्रिया की दिशा दर्शाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जो पदार्थ </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में विलयन</span><span style=\"font-family:'Mangal'\"> के रूप में उपस्थित हो, उसके सूत्र के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">(aq)</span><span style=\"font-family:'Mangal'\"> लिखा जाता है, जबकि (s), (l) तथा (g) क्रमशः ठोस, द्रव तथा गैसीय अवस्था के लिए लिखे जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. भौतिक अवस्थाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">तभी लिखी जाती हैं जब उन्हें बताना आवश्यक हो</span><span style=\"font-family:'Mangal'\">, अतः वे हर रासायनिक समीकरण का भाग नहीं होतीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पदार्थ की प्रतिरोधकता इनमें से किस पर निर्भर करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक की लंबाई तथा अनुप्रस्थ काट के क्षेत्रफल पर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उससे बहने वाली धारा पर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पदार्थ की प्रकृति पर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक की आकृति पर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तार की लंबाई या अनुप्रस्थ काट का क्षेत्रफल बदलने पर उसका प्रतिरोध बदल जाता है, परंतु प्रतिरोधकता नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिरोधकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">पदार्थ का अपना गुण</span><span style=\"font-family:'Mangal'\"> है, इसलिए ठीक एक ही नाप के ताँबे तथा ऐलुमिनियम के तारों की प्रतिरोधकताएँ फिर भी भिन्न रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसका SI मात्रक </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओम मीटर (Ω m)</span><span style=\"font-family:'Mangal'\"> है, और धातुओं तथा मिश्रातुओं के मान बहुत कम, लगभग 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m से 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−6</span><span style=\"font-family:'Mangal'\"> Ω m तक होते हैं, इसीलिए वे अच्छे चालक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार को छोटा काटने, मोटा बनाने, दूसरी आकृति में मोड़ने या उसमें अधिक धारा बहाने से पदार्थ की प्रतिरोधकता नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिरोधकता पदार्थ की प्रकृति पर निर्भर करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हृदय की हृद पेशी जीवन भर बिना थके लयबद्ध ढंग से सिकुड़ती और फैलती रहती है। यह मुख्यतः इसलिए संभव होता है क्योंकि उसकी कोशिकाओं में होते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुत अधिक संख्या में माइटोकॉन्ड्रिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केंद्रक बिलकुल नहीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोटी बाहरी कोशिका भित्ति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुत लंबे अशाखित तंतु</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हृदय का धड़कना एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनैच्छिक गति</span><span style=\"font-family:'Mangal'\"> है, अतः वह हमारे किसी सचेत नियंत्रण के बिना स्वतः चलती रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिना रुके सिकुड़ते और फैलते रहने के लिए लगातार ऊर्जा चाहिए, और हृद पेशी की कोशिकाएँ यह आवश्यकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत अधिक संख्या में माइटोकॉन्ड्रिया</span><span style=\"font-family:'Mangal'\"> रखकर पूरी करती हैं, जहाँ ऊर्जा मुक्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हृद पेशी के तंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेलनाकार तथा शाखित</span><span style=\"font-family:'Mangal'\"> होते हैं और प्रत्येक में एक केंद्रक होता है, अतः वे न तो केंद्रक रहित हैं और न ही लंबे तथा अशाखित।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोटी बाहरी कोशिका भित्ति केवल पादप कोशिकाओं में होती है, अतः हृदय की किसी पेशी कोशिका में वह हो ही नहीं सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसकी कोशिकाओं में बहुत अधिक संख्या में माइटोकॉन्ड्रिया होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): लैंगिक प्रजनन करने वाले जीव की प्रत्येक जनन कोशिका में हर जीन की दो प्रतियाँ होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ऐसे जीव की हर कोशिका में प्रत्येक गुणसूत्र की दो प्रतियाँ होती हैं, एक नर जनक से तथा एक मादा जनक से।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनन कोशिका में जीनों का केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक समुच्चय</span><span style=\"font-family:'Mangal'\"> होता है, दो नहीं; यदि उसमें दो होते तो संतति में हर जीन की चार प्रतियाँ पहुँच जातीं → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन करने वाले जीव की हर काय कोशिका में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक गुणसूत्र की दो प्रतियाँ</span><span style=\"font-family:'Mangal'\"> अवश्य होती हैं, एक नर जनक से मिली और एक मादा जनक से → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतति में दो ही प्रतियाँ पहुँचें, इससे अधिक नहीं, इसी कारण प्रत्येक जनन कोशिका में केवल एक जीन समुच्चय रहने दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दिया गया कारण सत्य कथन है, जबकि अभिकथन उससे निकलने वाली बात के ठीक उलटा कहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक प्रजनन में एक ही जीव अगली पीढ़ी को जन्म देता है। इसकी तुलना में लैंगिक प्रजनन उत्पन्न करता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई विविधता नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठीक उतनी ही विविधता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विविधता केवल पहली पीढ़ी में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">और भी अधिक विविधता</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब कोई एक ही जीव स्वयं प्रजनन करता है, तब अगली पीढ़ी उसी एक जनक की शारीरिक रूपरेखा पर बनती है, और जो अंतर दिखाई देते हैं वे केवल प्रतिलिपि बनने के समय आई छोटी-छोटी भिन्नताएँ होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन में दो भिन्न जीव योगदान देते हैं, इसलिए संतति में उन छोटी भिन्नताओं के साथ-साथ दोनों जनकों के लक्षणों का नया संयोजन भी आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी कारण लैंगिक प्रजनन अलैंगिक प्रजनन की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">और भी अधिक विविधता</span><span style=\"font-family:'Mangal'\"> उत्पन्न करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक प्रजनन में भी कुछ विविधता आती ही है, अतः यह कहना ठीक नहीं कि उसमें कोई विविधता नहीं होती या दोनों में बराबर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लैंगिक प्रजनन और भी अधिक विविधता उत्पन्न करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तत्व की संयोजन क्षमता के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. हाइड्रोजन या क्लोरीन के जितने परमाणुओं से किसी तत्व का एक परमाणु संयोग करता है, वही उसकी संयोजन क्षमता कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इस तुलना के लिए हाइड्रोजन तथा क्लोरीन इसलिए लिए जाते हैं क्योंकि इन दोनों की संयोजन क्षमता एक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी परमाणु के बाह्यतम कोश में कितने भी इलेक्ट्रॉन रह सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी तत्व की </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजन क्षमता</span><span style=\"font-family:'Mangal'\"> हाइड्रोजन या क्लोरीन के उन परमाणुओं की संख्या है जिनसे उस तत्व का एक परमाणु संयोग करके यौगिक बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. हाइड्रोजन तथा क्लोरीन को मापदंड इसलिए चुना जाता है क्योंकि इन दोनों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजन क्षमता एक</span><span style=\"font-family:'Mangal'\"> होती है, अतः इनकी गिनती से संयोजन क्षमता सीधे मिल जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी परमाणु के बाह्यतम कोश में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकतम 8 इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> रह सकते हैं, और पहले कोश में अधिकतम 2, अतः उसमें कितने भी इलेक्ट्रॉन नहीं रह सकते → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 kg द्रव्यमान की एक गेंद 20 m ऊँचाई से विरामावस्था से गिराई जाती है। g = 10 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> लेने पर तथा वायु के प्रतिरोध को छोड़ने पर, धरती से टकराने ठीक पहले उसकी गतिज ऊर्जा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">800 J</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर गेंद विरामावस्था में है, अतः वहाँ उसकी गतिज ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">0 J</span><span style=\"font-family:'Mangal'\"> है और उसकी सारी ऊर्जा स्थितिज ऊर्जा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर स्थितिज ऊर्जा = mgh = 2 × 10 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">400 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यांत्रिक ऊर्जा गतिज ऊर्जा तथा स्थितिज ऊर्जा का योग होती है, और मुक्त रूप से गिरती गेंद के लिए वह पूरे गिरने के दौरान एक ही बनी रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धरती से टकराने ठीक पहले गेंद की ऊँचाई शून्य है, अतः उसकी स्थितिज ऊर्जा 0 J है और पूरी 400 J गतिज ऊर्जा के रूप में दिखाई देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः टकराने ठीक पहले गतिज ऊर्जा 400 J है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातुओं तथा अधातुओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जो धातुएँ किसी कठोर सतह पर टकराने पर ध्वनि उत्पन्न करती हैं, उन्हें ध्वानिक कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कार्बन अधातु है, फिर भी उसका अपररूप ग्रेफाइट विद्युत का चालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वैद्युत संयोजी यौगिक सामान्यतः किरोसिन तथा पेट्रोल में घुलनशील होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जो धातु किसी कठोर सतह पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">टकराने पर ध्वनि उत्पन्न</span><span style=\"font-family:'Mangal'\"> करती है, उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्वानिक</span><span style=\"font-family:'Mangal'\"> कहते हैं, इसीलिए विद्यालय की घंटी तथा वाद्ययंत्रों के तार धातु के बनाए जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अधातुएँ सामान्यतः कुचालक होती हैं, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन का अपररूप ग्रेफाइट विद्युत का चालन करता है</span><span style=\"font-family:'Mangal'\">, और यह जाने-माने अपवादों में से एक है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वैद्युत संयोजी यौगिक सामान्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में घुलनशील तथा</span><span style=\"font-family:'Mangal'\"> किरोसिन और पेट्रोल जैसे विलायकों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अघुलनशील</span><span style=\"font-family:'Mangal'\"> होते हैं, अतः यह कथन तथ्य को उलट देता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कशेरुकियों के एक समूह में पंख तथा खोखली हड्डियाँ उड़ान संभव बनाती हैं, जबकि दूसरे समूह में स्तन ग्रंथियाँ वह अतिरिक्त परिवर्तन हैं जो शिशुओं के जीवित रहने की संभावना बढ़ाती हैं। ये दोनों समूह क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरीसृप तथा पक्षी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्षी तथा उभयचर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्षी तथा स्तनधारी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ तथा सरीसृप</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कशेरुकियों को आवास, शरीर के आवरण तथा प्रजनन की रीति के आधार पर पाँच समूहों में रखा जाता है: मछलियाँ, उभयचर, सरीसृप, पक्षी तथा स्तनधारी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पंख तथा खोखली हड्डियाँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">पक्षियों</span><span style=\"font-family:'Mangal'\"> में होती हैं; पंख डैने को उसकी सतह देते हैं और खोखली हड्डियाँ शरीर को हल्का रखती हैं, जिससे उड़ान संभव हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्तन ग्रंथियाँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्तनधारियों</span><span style=\"font-family:'Mangal'\"> में होती हैं; शिशु इन ग्रंथियों से स्रावित दूध पर पलते हैं, जिससे उनके जीवित रहने की संभावना बहुत बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियों में गलफड़े तथा शल्क होते हैं, उभयचरों की त्वचा नम होती है, और सरीसृपों की त्वचा शुष्क तथा शल्कमय होती है, अतः इनमें से किसी में ये दोनों लक्षण नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये दोनों समूह पक्षी तथा स्तनधारी हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कूपिकाएँ _______ के विस्तृत जाल से घिरी रहती हैं, जहाँ _______ का विनिमय होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तंत्रिकाओं; आवेगों</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रुधिर कोशिकाओं; गैसों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशियों; दाब</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वसनी; वायु</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फेफड़ों के भीतर वायु मार्ग बार-बार विभाजित होकर गुब्बारे जैसी रचनाओं में समाप्त होते हैं, जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कूपिकाएँ</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक कूपिका पतली रुधिर वाहिकाओं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">रुधिर कोशिकाओं</span><span style=\"font-family:'Mangal'\"> के विस्तृत जाल से घिरी रहती है, जिससे रुधिर तथा वायु के बीच केवल एक बहुत पतली भित्ति रह जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रुधिर शरीर के शेष भागों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> लाकर कूपिकाओं में छोड़ता है और कूपिका की वायु से </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> ले लेता है, अतः यहाँ जिसका विनिमय होता है वह गैसें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कूपिकाओं की सतह को फैलाया जाए तो वह लगभग 80 m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> को ढक लेगी, और यही विशाल क्षेत्रफल इतने तेज़ विनिमय को संभव बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूपिकाएँ रुधिर कोशिकाओं से घिरी रहती हैं जहाँ गैसों का विनिमय होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आयनिक यौगिक के नाम में पहले धनायन का नाम लिखा जाता है और उसके बाद ऋणायन का नाम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सरल ऋणायनों के नाम के अंत में -आइड लगता है, जैसे क्लोराइड तथा सल्फाइड।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दो या दो से अधिक तत्वों के परमाणुओं के जुड़ने से बना आयन, जैसे सल्फेट आयन, एकपरमाणुक आयन कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आयनिक यौगिक का नाम लिखते समय पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">धनायन का नाम</span><span style=\"font-family:'Mangal'\"> लिखा जाता है और उसके बाद ऋणायन का नाम, जैसे सोडियम क्लोराइड → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरल ऋणायनों के नाम के अंत में -आइड</span><span style=\"font-family:'Mangal'\"> लगता है: क्लोरीन से क्लोराइड और सल्फर से सल्फाइड बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो या दो से अधिक तत्वों</span><span style=\"font-family:'Mangal'\"> के परमाणुओं से बना आयन, जैसे सल्फेट आयन, </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुपरमाणुक आयन</span><span style=\"font-family:'Mangal'\"> कहलाता है, एकपरमाणुक आयन नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तत्वों के परमाणु आपस में या तो इलेक्ट्रॉनों की साझेदारी करके या इलेक्ट्रॉनों के स्थानांतरण से संयोग करते हैं, और संयोग के बाद निकाय की कुल ऊर्जा अलग-अलग परमाणुओं की ऊर्जाओं के योग से कम हो जाती है। इस प्रकार जुड़े परमाणुओं को बाँधे रखने वाला बल कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुरुत्वीय बल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्प्लावन बल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर्षण बल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रासायनिक बंध</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु सामान्यतः दो प्रकार से संयोग करते हैं: अपने संयोजी इलेक्ट्रॉनों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">साझेदारी</span><span style=\"font-family:'Mangal'\"> करके तथा संयोजी इलेक्ट्रॉनों के एक परमाणु से दूसरे परमाणु तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थानांतरण</span><span style=\"font-family:'Mangal'\"> से।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोग होने पर निकाय की कुल ऊर्जा अलग-अलग परमाणुओं की ऊर्जाओं के योग से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> हो जाती है, और कम ऊर्जा वाला निकाय अधिक स्थायी होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस स्थायी व्यवस्था में जुड़े परमाणुओं को बाँधे रखने वाले बल को </span><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक बंध</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो परमाणुओं के बीच गुरुत्वीय बल उन्हें बाँधने के लिए बहुत ही कम होता है, उत्प्लावन बल केवल द्रव में रखी वस्तु पर लगता है, और घर्षण संपर्क में आई सतहों के बीच लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परमाणुओं को बाँधे रखने वाला बल रासायनिक बंध है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशी किस प्रकार गति कराती है, इस विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पेशी कोशिका इसलिए छोटी होती है क्योंकि तंत्रिका आवेग उसमें से जल को बाहर धकेल देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पेशी कोशिकाओं में विशेष प्रोटीन होते हैं, जो तंत्रिका विद्युत आवेग पहुँचने पर अपनी आकृति तथा अपनी व्यवस्था दोनों बदल देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. इन प्रोटीनों की यह नई व्यवस्था पेशी कोशिका को छोटा रूप दे देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पेशी कोशिका जल खोकर छोटी नहीं होती; आवेग उसमें से </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल बाहर नहीं धकेलता</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पेशी कोशिकाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विशेष प्रोटीन</span><span style=\"font-family:'Mangal'\"> होते हैं, जो तंत्रिका विद्युत आवेग पहुँचने पर अपनी आकृति तथा कोशिका में अपनी व्यवस्था दोनों बदल देते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. इन प्रोटीनों की यही नई व्यवस्था पेशी कोशिका को </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा रूप</span><span style=\"font-family:'Mangal'\"> दे देती है, और ऐसी अनेक कोशिकाओं का छोटा होना ही वह गति है जो हमें दिखाई देती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनली में लिए गए निर्जल एल्कोहॉल (एथेनॉल) में सोडियम का एक छोटा टुकड़ा डाला जाता है। निकलने वाली गैस तथा बनने वाला दूसरा उत्पाद क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड तथा सोडियम एथेनोएट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन तथा सोडियम एथॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन तथा सोडियम एथॉक्साइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन तथा सोडियम एथेनोएट</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल सोडियम से तुरंत अभिक्रिया करता है और गैस निकलने से तेज़ बुदबुदाहट दिखाई देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जलती हुई तीली पास लाने पर यह गैस पॉप की ध्वनि के साथ जलती है, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन</span><span style=\"font-family:'Mangal'\"> की पहचान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम हाइड्रॉक्सिल समूह के हाइड्रोजन का स्थान ले लेता है, अतः दूसरा उत्पाद लवण </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम एथॉक्साइड</span><span style=\"font-family:'Mangal'\"> है: 2Na + 2CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">OH → 2CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−</span><span style=\"font-family:'Mangal'\">Na</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">+</span><span style=\"font-family:'Mangal'\"> + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम एथेनोएट तब बनता है जब एथेनॉल नहीं, बल्कि एथेनॉइक अम्ल सोडियम हाइड्रॉक्साइड जैसे क्षारक से अभिक्रिया करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्पाद हाइड्रोजन तथा सोडियम एथॉक्साइड हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790237089679_image002.png\" width=\"442\" height=\"155\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(ii), (c)-(iv), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खोपड़ी</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">मस्तिष्क की रक्षा करती है</span><span style=\"font-family:'Mangal'\">: मस्तिष्क कोमल अंग है, इसलिए वह इसी हड्डी के बक्से के भीतर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कशेरुक दंड</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेरुरज्जु की रक्षा करता है</span><span style=\"font-family:'Mangal'\">: पीठ के बीचोबीच महसूस होने वाला यह कठोर तथा उभरा हुआ दंड कोमल मेरुरज्जु को अपने भीतर रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मध्यमस्तिष्क तथा पश्चमस्तिष्क</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनेक अनैच्छिक क्रियाओं को नियंत्रित करते हैं</span><span style=\"font-family:'Mangal'\">: हृदय का धड़कना या मुँह में पानी आना जैसी क्रियाएँ हमारे सोचे बिना चलती रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परिधीय तंत्रिका तंत्र</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रीय तंत्रिका तंत्र तथा शरीर के शेष भागों के बीच सूचना पहुँचाता है</span><span style=\"font-family:'Mangal'\">: यही वह कड़ी है जिससे निर्देश बाहर जाते हैं और सूचना भीतर आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(ii), (b)-(i), (c)-(iv), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनली में लिए गए सोडियम कार्बोनेट में तनु एथेनॉइक अम्ल मिलाया जाता है, और निकलने वाली गैस ताज़ा बने चूने के पानी को दूधिया कर देती है। बनने वाली गैस तथा लवण क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन तथा सोडियम ऐसीटेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड तथा सोडियम एथॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन तथा सोडियम ऐसीटेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड तथा सोडियम ऐसीटेट</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो गैस ताज़ा बने चूने के पानी को दूधिया कर देती है वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> है, अतः यहाँ निकलने वाली गैस कार्बन डाइऑक्साइड है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉइक अम्ल कार्बोनेट तथा हाइड्रोजनकार्बोनेट से अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">लवण, कार्बन डाइऑक्साइड तथा जल</span><span style=\"font-family:'Mangal'\"> देता है, जो किसी भी अम्ल का सामान्य व्यवहार है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉइक अम्ल तथा सोडियम कार्बोनेट से बनने वाला लवण </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम ऐसीटेट</span><span style=\"font-family:'Mangal'\"> है, जिसे सोडियम एथेनोएट भी कहते हैं: 2CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">COOH + Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> → 2CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">COONa + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O + CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन तब निकलती है जब अम्ल किसी धातु से अभिक्रिया करता है, और सोडियम एथॉक्साइड तब बनता है जब एथेनॉल में सोडियम धातु डाली जाती है, अतः इनमें से कोई यहाँ नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्पाद कार्बन डाइऑक्साइड तथा सोडियम ऐसीटेट हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹12,000 की धनराशि का कुछ भाग 8% वार्षिक दर पर तथा शेष भाग 12% वार्षिक दर पर साधारण ब्याज पर निवेश किया जाता है। यदि एक वर्ष में कुल ₹1,240 ब्याज मिलता है, तो 12% वार्षिक दर पर कितनी राशि निवेश की गई है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹5,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹6,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना 12% वार्षिक दर पर निवेशित भाग ₹x है, अतः शेष भाग ₹(12,000 − x) 8% वार्षिक दर पर निवेशित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक वर्ष के लिए SI = (P × R × T) / 100 का रूप P × R% हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12% पर ब्याज = x × 12%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8% पर ब्याज = (12,000 − x) × 8% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹960 − (x × 8%)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल ब्याज = (x × 12%) + ₹960 − (x × 8%) = ₹1,240</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × 4% = 1,240 − 960 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹280</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 280 / 4% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ₹7,000 × 12% = ₹840 तथा ₹5,000 × 8% = ₹400, और ₹840 + ₹400 = ₹1,240 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 12% वार्षिक दर पर निवेशित राशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,000 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चावल के मूल्य में 10% की कमी के कारण एक व्यक्ति ₹1,800 में 5 kg अधिक चावल खरीद सकता है। चावल का घटा हुआ मूल्य प्रति kg कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खर्च की गई राशि ₹1,800 ही रहती है, अतः अतिरिक्त 5 kg चावल बची हुई राशि से खरीदा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,800 पर बची हुई राशि = ₹1,800 × 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹180</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही बची हुई राशि अतिरिक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 kg</span><span style=\"font-family:'Mangal'\"> चावल खरीदती है और यह घटे हुए मूल्य पर खर्च होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घटा हुआ मूल्य प्रति kg = 180 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: मूल मूल्य = ₹36 / 90% = ₹40 प्रति kg, अतः ₹1,800 में पहले 45 kg और अब 50 kg चावल आता है, जो 5 kg अधिक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: घटा हुआ मूल्य = (खर्च की गई राशि × कमी %) / अतिरिक्त मात्रा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (1,800 × 10%) / 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चावल का घटा हुआ मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> प्रति kg है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे दी गई सारणी में दो शोरूम A और B द्वारा पाँच महीनों में बेची गई इकाइयों की संख्या दी गई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790237185795_image001.png\" width=\"442\" height=\"163\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन पाँच महीनों में से कितने महीनों में शोरूम A की बिक्री, इन्हीं पाँच महीनों की उसकी अपनी औसत मासिक बिक्री से अधिक रही?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले शोरूम A की औसत मासिक बिक्री ज्ञात करें, फिर प्रत्येक महीने की तुलना उससे करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शोरूम A की कुल बिक्री = 300 + 420 + 380 + 450 + 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,800 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत मासिक बिक्री = 1,800 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब प्रत्येक महीने की तुलना 360 से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनवरी: 300, जो 360 से कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फरवरी: 420, जो 360 से अधिक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मार्च: 380, जो 360 से अधिक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अप्रैल: 450, जो 360 से अधिक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मई: 250, जो 360 से कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 महीनों</span><span style=\"font-family:'Mangal'\"> में बिक्री औसत से अधिक रही, ये महीने फरवरी, मार्च तथा अप्रैल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे महीनों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठहरावों को छोड़कर एक बस की चाल 54 km/h है तथा ठहरावों सहित यह 45 km/h है। बस एक घंटे में कितने मिनट रुकती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 मिनट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक घंटे में बस 54 km के स्थान पर केवल 45 km चलती है, अतः यह कमी ठहरावों के कारण छूटी दूरी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 घंटे में छूटी दूरी = 54 − 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह 9 km बस चलते समय की चाल, अर्थात् 54 km/h से तय करती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छूटा समय = दूरी / चाल</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 9 / 54 घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (1/6) घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (1/6) × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रति घंटा ठहराव समय = [(चालों का अंतर) / (ठहराव रहित चाल)] × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (9 / 54) × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 10 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बस एक घंटे में </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 मिनट (विकल्प B)</span><span style=\"font-family:'Mangal'\"> रुकती है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से संख्याओं का कौन-सा समुच्चय एक त्रिभुज की भुजाएँ बना सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{10 cm, 8 cm, 2 cm}</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{5 cm, 6 cm, 11 cm}</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{9 cm, 12 cm, 22 cm}</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{8 cm, 9 cm, 4 cm}</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन लंबाइयाँ त्रिभुज तभी बनाती हैं जब दो छोटी भुजाओं का योग सबसे बड़ी भुजा से अधिक हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{10 cm, 8 cm, 2 cm}: 8 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 cm</span><span style=\"font-family:'Mangal'\">, जो सबसे बड़ी भुजा के बराबर है, अधिक नहीं, अतः त्रिभुज नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{5 cm, 6 cm, 11 cm}: 5 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 cm</span><span style=\"font-family:'Mangal'\">, जो फिर सबसे बड़ी भुजा के बराबर है, अतः त्रिभुज नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{9 cm, 12 cm, 22 cm}: 9 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span><span style=\"font-family:'Mangal'\">, जो 22 cm से कम है, अतः त्रिभुज नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{8 cm, 9 cm, 4 cm}: 8 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span><span style=\"font-family:'Mangal'\">, जो 9 cm से अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष दोनों जाँच भी सही हैं: 9 + 4 = 13 cm, 8 cm से अधिक है तथा 8 + 9 = 17 cm, 4 cm से अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्रिभुज की भुजाएँ बनाने वाला समुच्चय </span><span style=\"font-weight:bold;font-family:'Mangal'\">{8 cm, 9 cm, 4 cm} (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">374 और 384 के बीच स्थित अभाज्य संख्याओं की संख्या कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभाज्य संख्या के ठीक दो गुणनखंड होते हैं, 1 और स्वयं वह संख्या, अतः परास की प्रत्येक संख्या की जाँच करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">374 और 384 के बीच की संख्याएँ 375, 376, 377, 378, 379, 380, 381, 382 तथा 383 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">375, 380: </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> से विभाज्य हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">376, 378, 382: </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> से विभाज्य हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">381: 3 + 8 + 1 = 12 है, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> से विभाज्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">377 = 13 × 29 है, अतः यह अभाज्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">379: यह 2, 3, 5, 7, 11, 13 या 17 से विभाज्य नहीं है तथा 19² = 361, 379 से कम और 20² = 400 इससे अधिक है, अतः 19 तक जाँच करना पर्याप्त है। 379 </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभाज्य</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">383: यह भी 2, 3, 5, 7, 11, 13 या 17 से विभाज्य नहीं है, अतः 383 </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभाज्य</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस परास में अभाज्य संख्याएँ 379 तथा 383 हैं, अर्थात् कुल </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> संख्याएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभाज्य संख्याओं की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक परिवार का औसत मासिक व्यय वर्ष के पहले तीन महीनों में ₹2,600, अगले चार महीनों में ₹2,900 तथा अंतिम पाँच महीनों में ₹3,400 है। यदि वर्ष भर में परिवार की कुल बचत ₹5,600 है, तो उसकी औसत मासिक आय कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,600</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय, व्यय और बचत का योग होती है, अतः पहले पूरे वर्ष का कुल व्यय जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले 3 महीनों का व्यय = 3 × ₹2,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगले 4 महीनों का व्यय = 4 × ₹2,900 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹11,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम 5 महीनों का व्यय = 5 × ₹3,400 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹17,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ष का कुल व्यय = ₹7,800 + ₹11,600 + ₹17,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ष की कुल आय = कुल व्यय + कुल बचत</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹36,400 + ₹5,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹42,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ष में 3 + 4 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 महीने</span><span style=\"font-family:'Mangal'\"> होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत मासिक आय = 42,000 / 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परिवार की औसत मासिक आय </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,500 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B मिलकर एक कार्य 12 दिन में, B और C मिलकर 15 दिन में तथा C और A मिलकर 20 दिन में पूरा कर सकते हैं। A अकेला उस कार्य को कितने दिन में पूरा कर सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 दिन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों जोड़ियों की एक दिन की कार्य दर जोड़ें, इससे प्रत्येक व्यक्ति ठीक दो बार गिना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B का 1 दिन का कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और C का 1 दिन का कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C और A का 1 दिन का कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन्हें जोड़ने पर, 2 × (A + B + C) = 1/12 + 1/15 + 1/20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) 60 लेने पर यह (5 + 4 + 3)/60 = 12/60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/5</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A, B और C का मिलकर 1 दिन का कार्य = (1/5) × (1/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A अकेले का 1 दिन का कार्य = (A + B + C) − (B + C)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1/10 − 1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 − 2)/30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A अकेला कार्य को </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 दिन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में पूरा करता है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संख्याओं का HCF (महत्तम समापवर्तक) 16 तथा उनका LCM (लघुत्तम समापवर्त्य) 1,440 है। यदि इनमें से एक संख्या 80 हो, तो दोनों संख्याओं का धनात्मक अंतर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">208</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">288</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">176</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">224</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किन्हीं दो संख्याओं का गुणनफल, उनके HCF (महत्तम समापवर्तक) और LCM (लघुत्तम समापवर्त्य) के गुणनफल के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली संख्या × दूसरी संख्या = HCF × LCM</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 × दूसरी संख्या = 16 × 1,440 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23,040</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी संख्या = 23,040 / 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">288</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 80 = 16 × 5 तथा 288 = 16 × 18 है और 5 व 18 का कोई उभयनिष्ठ गुणनखंड नहीं है, अतः HCF 16 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक अंतर = 288 − 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">208</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दूसरी संख्या = (HCF × LCM) / दी गई संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (16 × 1,440) / 80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 288</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों संख्याओं का धनात्मक अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">208 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 7 1/2 − [2 1/4 ÷ {1 1/4 − 1/2 × (1 1/2 − 1/3 − 1/6)}]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 1/2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 1/2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 1/2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 1/2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS के क्रम के अनुसार सबसे भीतरी कोष्ठक से बाहर की ओर हल करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे भीतरी कोष्ठक: 1 1/2 − 1/3 − 1/6 = 3/2 − 1/3 − 1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) 6 लेने पर यह (9 − 2 − 1)/6 = 6/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब मझले कोष्ठक के भीतर का गुणन: 1/2 × 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मझला कोष्ठक: 1 1/4 − 1/2 = 5/4 − 2/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब बड़े कोष्ठक के भीतर का भाग: 2 1/4 ÷ 3/4 = 9/4 × 4/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंत में घटाव: 7 1/2 − 3 =
