 </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 1/2 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक धनराशि A, B और C में इस प्रकार बाँटी जाती है कि A के हिस्से का 2 गुना, B के हिस्से का 3 गुना तथा C के हिस्से का 4 गुना आपस में बराबर हैं। यदि B का हिस्सा, C के हिस्से से ₹1,200 अधिक है, तो कुल धनराशि कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹13,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹16,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,600</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बराबर गुणज अनुपात दे देते हैं, अतः माना उभयनिष्ठ मान k है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2A = 3B = 4C = k</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = k/2, B = k/3 तथा C = k/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B का हिस्सा, C के हिस्से से ₹1,200 अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k/3 − k/4 = 1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) 12 लेने पर, (4k − 3k)/12 = 1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k/12 = 1,200, अतः k = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 14,400 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,200</span><span style=\"font-family:'Mangal'\">, B = 14,400 / 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,800</span><span style=\"font-family:'Mangal'\">, C = 14,400 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ₹4,800 − ₹3,600 = ₹1,200 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल धनराशि = ₹7,200 + ₹4,800 + ₹3,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,600 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्यालय में लड़कों और लड़कियों की संख्या का अनुपात 5 : 3 है। यदि 40 और लड़कियाँ विद्यालय में प्रवेश ले लें तथा लड़कों की संख्या वही रहे, तो अनुपात 5 : 4 हो जाता है। विद्यालय में कितने लड़के हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bott tyle=\"font-family:'Mangal'\">वर्गीकृत आँकड़ों का बहुलक उस वर्ग में होता है जिसकी बारंबारता सबसे अधिक हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे अधिक बारंबारता </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> है, अतः बहुलक वर्ग </span><span style=\"font-weight:bold;font-family:'Mangal'\">20-30</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग की निम्न सीमा (l) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग अंतराल का माप (h) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग से ठीक पहले वाले वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) = 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग के ठीक बाद वाले वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) = 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक = l + [(f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) / (2f</span><span style=\"font-size:8pt;ve  "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनकी आयु का अंतर कभी नहीं बदलता, अतः पुत्र की आयु को चर मानें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना पुत्र की वर्तमान आयु x वर्ष है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यक्ति की वर्तमान आयु = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(x + 24) वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्ष बाद पुत्र (x + 2) वर्ष का तथा व्यक्ति (x + 26) वर्ष का होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 26 = 2(x + 2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 26 = 2x + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: पुत्र 22 वर्ष का और व्यक्ति 46 वर्ष का है; 2 वर्ष बाद वे 24 और 48 वर्ष के होंगे तथा 48 = 2 × 24 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पुत्र की वर्तमान आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 वर्ष (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x</span><span style=\"font-family:'Mangal'\"> = 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y+1</span><span style=\"font-family:'Mangal'\"> तथा 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x−9</span><span style=\"font-family:'Mangal'\"> है, तो x का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समीकरण के दोनों पक्षों को समान आधार पर लिखें, फिर घातों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला समीकरण: 8 = 2³, अतः 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y+1</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3(y+1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3y+3</span><span style=\"font-family:'Mangal'\">, अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3y + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा समीकरण: 9 = 3², अतः 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x−9</span><span style=\"font-family:'Mangal'\">, अतः 2y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">x − 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y = x − 9 में x = 3y + 3 रखने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y = 3y + 3 − 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y = 3y − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (3 × 6) + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\"> = 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\"> ✓ तथा 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21−9</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दीवार 8 m लंबी, 6 m ऊँची तथा 22.5 cm मोटी है। इस दीवार को बनाने के लिए 25 cm × 12.5 cm × 7.5 cm माप वाली कितनी ईंटों की आवश्यकता होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,320</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,608</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5,120</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,840</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले सभी मापों को एक ही मात्रक में बदलें, फिर आयतनों में भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीवार की लंबाई = 8 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">800 cm</span><span style=\"font-family:'Mangal'\">, ऊँचाई = 6 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600 cm</span><span style=\"font-family:'Mangal'\">, मोटाई = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22.5 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीवार का आयतन = 800 × 600 × 22.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,08,00,000 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ईंट का आयतन = 25 × 12.5 × 7.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,343.75 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईंटों की संख्या = दीवार का आयतन / एक ईंट का आयतन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,08,00,000 / 2,343.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,608</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवश्यक ईंटों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,608 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक भरी हुई टंकी की तली में लगा रिसाव उसे 8 घंटे में खाली कर सकता है। 6 लीटर प्रति मिनट पानी देने वाला एक नल खोल दिया जाता है और अब भरी हुई टंकी 12 घंटे में खाली होती है। टंकी की धारिता कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8,640 लीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5,760 लीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,320 लीटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,080 लीटर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टंकी फिर भी खाली हो रही है, अतः रिसाव, नल से आने वाले पानी से अधिक पानी बाहर निकालता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना टंकी की धारिता C लीटर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिसाव द्वारा 1 घंटे में निकाला गया पानी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/8 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नल द्वारा 1 घंटे में डाला गया पानी = 6 × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों के चलते टंकी 12 घंटे में खाली होती है, अतः 1 घंटे में शुद्ध निकासी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/12 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/8 − 360 = C/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/8 − C/12 = 360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) 24 लेने पर, (3C − 2C)/24 = 360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/24 = 360, अतः C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,640 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: रिसाव 8,640 / 8 = 1,080 लीटर प्रति घंटा निकालता है और नल 360 लीटर डालता है, अतः शुद्ध निकासी 720 लीटर प्रति घंटा है तथा 8,640 / 720 = 12 घंटे ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः टंकी की धारिता </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,640 लीटर (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यापारी ने ₹30 प्रति kg की दर से 400 kg गेहूँ खरीदा। उसने इसमें से 100 kg गेहूँ 20% लाभ पर बेच दिया। शेष गेहूँ उसे किस दर प्रति kg पर बेचना होगा ताकि पूरे लॉट पर उसे 25% लाभ हो?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹37.50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹38</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले कुल क्रय मूल्य ज्ञात करें, फिर वह कुल विक्रय मूल्य जो अभीष्ट लाभ के लिए आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल क्रय मूल्य = 400 × ₹30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25% लाभ के लिए कुल विक्रय मूल्य = ₹12,000 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले 100 kg का विक्रय मूल्य = 100 × ₹30 × 120% = 100 × ₹36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष आवश्यक विक्रय मूल्य = ₹15,000 − ₹3,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹11,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभी बेचा जाने वाला गेहूँ = 400 − 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट दर = 11,400 / 300 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹38</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे शेष गेहूँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹38 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> प्रति kg की दर से बेचना होगा।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमित का वेतन, भरत के वेतन से 20% अधिक है तथा भरत का वेतन, चेतन के वेतन से 25% कम है। अमित का वेतन, चेतन के वेतन का कितने प्रतिशत है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम तुलना का आधार चेतन का वेतन है, अतः उसी से शुरू करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना चेतन का वेतन </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹100</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भरत का वेतन, चेतन के वेतन से 25% कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भरत का वेतन = ₹100 × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमित का वेतन, भरत के वेतन से 20% अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमित का वेतन = ₹75 × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट प्रतिशत = (90 / 100) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: कुल गुणक = 120% × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अमित का वेतन, चेतन के वेतन का </span><span style=\"font-weight:bold;font-family:'Mangal'\">90% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति को 6 km की दूरी 45 मिनट में तय करनी है। वह इस दूरी का आधा भाग दिए गए समय के दो-तिहाई भाग में तय कर लेता है। ठीक समय पर पहुँचने के लिए उसे शेष दूरी किस चाल से तय करनी होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km/h</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले शेष दूरी और शेष समय ज्ञात करें, फिर भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी का आधा भाग = 6 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 km</span><span style=\"font-family:'Mangal'\">, अतः शेष दूरी भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 km</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रयुक्त समय = 45 × (2/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष समय = 45 − 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय को घंटे में बदलें: 15 मिनट = 15/60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(1/4) घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट चाल = दूरी / समय</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3 / (1/4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3 × 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे शेष दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h (विकल्प C)</span><span style=\"font-family:'Mangal'\"> की चाल से तय करनी होगी।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक लंब वृत्तीय शंकु का वक्र पृष्ठीय क्षेत्रफल 550 cm² है तथा उसके आधार का व्यास 14 cm है। शंकु का आयतन कितना है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,232 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,078 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,540 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">924 cm³</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वक्र पृष्ठीय क्षेत्रफल से तिर्यक ऊँचाई मिलती है और तिर्यक ऊँचाई से लंबवत ऊँचाई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिज्या, r = 14 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शंकु का वक्र पृष्ठीय क्षेत्रफल = π × r × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">550 = (22/7) × 7 × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">550 = 22 × l, अतः l = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब r, h और l से बनने वाले समकोण त्रिभुज का प्रयोग करने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = √(l² − r²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(625 − 49)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √576</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शंकु का आयतन = (π × r² × h) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [(22/7) × 7 × 7 × 24] / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22 × 7 × 24) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3,696 / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शंकु का आयतन </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm³ (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज पर, वार्षिक रूप से संयोजित, ₹6,250 की धनराशि 2 वर्ष में ₹7,290 हो जाती है। वार्षिक ब्याज दर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज के मिश्रधन सूत्र का प्रयोग करने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = P × (1 + R/100)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7,290 = 6,250 × (1 + R/100)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1 + R/100)² = 7,290 / 6,250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.1664</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पक्षों का वर्गमूल लेने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 + R/100 = √1.1664 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.08</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R/100 = 0.08, अतः R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ₹6,250 × 108% = ₹6,750 तथा ₹6,750 × 108% = ₹7,290 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वार्षिक ब्याज दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">8% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: (12.5 × 12.5) + (2 × 12.5 × 7.5) + (7.5 × 7.5)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">380</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">390</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">420</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह व्यंजक a² + 2ab + b² के रूप में है, अतः दशमलव संख्याओं को गुणा करने के बजाय सर्वसमिका का प्रयोग करने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ a = </span><span style=\" p:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पद और अगले पद का अंतर ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 − 97 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−17</span><span style=\"font-family:'Mangal'\">; 65 − 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−15</span><span style=\"font-family:'Mangal'\">; 52 − 65 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−13</span><span style=\"font-family:'Mangal'\">; 41 − 52 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शृंखला पहले 17, फिर 15, फिर 13, फिर 11 से घट रही है: हर अंतर अपने से पिछले अंतर से 2 कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> है, अतः ? = 41 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(28 में 13 का अंतर, 36 में 5 का अंतर तथा 29 में 12 का अंतर लिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKJP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIHM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPOU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RUTZ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का स्थान लिखें और हर समूह के भीतर के तीनों अंतर देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKJP: H = 8, K = 11, J = 10, P = 16 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPOU: M = 13, P = 16, O = 15, U = 21 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RUTZ: R = 18, U = 21, T = 20, Z = 26 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIHM: F = 6, I = 9, H = 8, M = 13 → +3 ✓, −1 ✓, परंतु 8 + 6 = 14 = N होता है, जबकि समूह में </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+3, −1, +6) का पालन करते हैं; FIHM में अंतिम अंतर +5 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">FIHM (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रश्न नीचे दिए गए शब्दों पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OUT USE TUG RIP</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के अनुसार, दाईं ओर से पहले शब्द के दूसरे अक्षर और बाईं ओर से पहले शब्द के दूसरे अक्षर के बीच कितने अक्षर हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रम से चारों शब्द OUT, USE, TUG और RIP हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर से पहला शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">RIP</span><span style=\"font-family:'Mangal'\"> है, और उसका दूसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाईं ओर से पहला शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">OUT</span><span style=\"font-family:'Mangal'\"> है, और उसका दूसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन दोनों अक्षरों के स्थान लिखें: I = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> और U = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनके बीच पड़ने वाले अक्षरों की संख्या = 21 − 9 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 में दोनों में से एक अक्षर भी गिन लिया गया है, तथा 10 और 14 गलत स्थान से आते हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इनके बीच अक्षरों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नौ व्यक्ति P, Q, R, S, T, U, V, W और X एक पंक्ति में दक्षिण की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के दाईं ओर केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, T के बाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U पंक्ति के अंतिम पूर्वी छोर पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और V के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W, V के ठीक बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और W के बीच केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X पंक्ति के दोनों छोरों में से किसी एक पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R के बाईं ओर तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी नौ व्यक्ति दक्षिण दिशा की ओर मुख करके बैठे हैं, अतः ‘बायाँ’ और ‘दायाँ’ स्वयं व्यक्तियों के अपने बाएँ और दाएँ हैं; दक्षिण की ओर मुख करने वाले व्यक्ति के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाईं ओर पश्चिम</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाईं ओर पूर्व</span><span style=\"font-family:'Mangal'\"> होता है। सीटों को पश्चिमी छोर से 1 से 9 तक क्रमांकित करते हैं, अतः किसी व्यक्ति के बाईं ओर जाने पर 1 जुड़ता है और दाईं ओर जाने पर 1 घटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के दाईं ओर केवल दो व्यक्ति हैं → सीट 1 और 2, T के दाईं ओर हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, T के बाईं ओर तीसरे स्थान पर है → S = 3 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U अंतिम पूर्वी छोर पर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 9</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और V के बीच केवल एक व्यक्ति है → V या तो सीट 4 पर है या सीट 8 पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W, V के ठीक बाईं ओर है → यदि V सीट 8 पर होता, तो W सीट 9 पर होता, जो U की सीट है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 4</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">W = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और W के बीच केवल दो व्यक्ति हैं → P या तो सीट 2 पर है या सीट 8 पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P के ठीक दाईं ओर है → यदि P सीट 2 पर होता, तो Q सीट 1 पर होता, और R तथा X के लिए सीट 7 और 8 बचतीं, जिनमें से कोई भी छोर की सीट नहीं है; परंतु X छोर पर बैठा है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 8</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब सीट 1 और 2 बची हैं, और X छोर पर बैठा है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">X = 1</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 9, पश्चिम से पूर्व): </span><span style=\"font-weight:bold;font-family:'Mangal'\">X, R, T, V, W, S, Q, P, U</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R सीट 2 पर है, अतः R के बाईं ओर तीसरा स्थान सीट 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> है, जो W की सीट है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R के बाईं ओर तीसरे स्थान पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">W (विकल्प A)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख किए 54 व्यक्तियों की एक पंक्ति में, गीता बाएँ छोर से 19वें स्थान पर बैठी है। यदि बरुण और गीता के बीच केवल 19 व्यक्ति बैठे हैं, तो पंक्ति के दाएँ छोर से बरुण का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16वाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17वाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18वाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19वाँ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गीता बाएँ छोर से 19वें स्थान पर है, अतः उसके बाईं ओर 18 व्यक्ति हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बरुण और गीता के बीच केवल 19 व्यक्ति हैं, अतः बरुण गीता के दाईं ओर भी हो सकता है और बाईं ओर भी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाईं ओर होने पर बरुण का स्थान 19 − 19 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1</span><span style=\"font-family:'Mangal'\"> होता, जो कोई स्थान नहीं है, अतः बरुण गीता के दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ छोर से बरुण का स्थान = 19 + 19 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">39</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ छोर से स्थान = कुल व्यक्ति − बाएँ छोर से स्थान + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 54 − 39 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ छोर से बरुण का स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">16वाँ (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN : # :: % : GIFT</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXR, % = HGIP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXR, % = HGIQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OMXR, % = HGIP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXS, % = HGIP</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समूह से दूसरे समूह तक का परिवर्तन दोनों युग्मों में समान होना चाहिए। प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: PLAN → ONXR: P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\">, A − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> (1 − 3 = −2 → −2 + 26 = 24 = X), N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> → (−1, +2, −3, +4); HGIP → GIFT: H − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, G + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\">, P + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> → (−1, +2, −3, +4) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: HGIQ → GIFT के लिए Q + 4 = T चाहिए, परंतु Q + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: PLAN → OMXR के लिए L + 2 = M चाहिए, परंतु L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: PLAN → ONXS के लिए N + 4 = S चाहिए, परंतु N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = ONXR, % = HGIP (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B का अर्थ है कि ‘A, B की माता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B का अर्थ है कि ‘A, B का भाई है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B का अर्थ है कि ‘A, B का पति है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B का अर्थ है कि ‘A, B की पुत्री है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P $ Q @ R # S’ है, तो P का S से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A, B की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B → A, B का पति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P $ Q @ R # S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R # S → R, S का भाई है, अतः R और S के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q @ R → Q, R की माता है, और R तथा S के माता-पिता समान हैं, अतः Q, S की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P $ Q → P, Q की पुत्री है, अतः P और S के माता-पिता समान हैं, और P लड़की है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता और पुत्री होने पर P, S से एक पीढ़ी दूर हो जाती, तथा भाई होने पर P लड़का होता।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, S की </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीना दक्षिण की ओर चल रही है। वह 90° दक्षिणावर्त मुड़ती है, फिर 180° दक्षिणावर्त मुड़ती है, और उसके बाद 90° वामावर्त मुड़ती है। अब वह किस दिशा में चल रही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों दिशाओं को दक्षिणावर्त क्रम में लें: उत्तर, पूर्व, दक्षिण, पश्चिम। 90° दक्षिणावर्त मुड़ने पर इस क्रम में एक कदम आगे बढ़ते हैं, 180° मुड़ने पर दो कदम आगे, और 90° वामावर्त मुड़ने पर एक कदम पीछे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीना </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण</span><span style=\"font-family:'Mangal'\"> की ओर चलना शुरू करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला मोड़, 90° दक्षिणावर्त: दक्षिण → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा मोड़, 180° दक्षिणावर्त: पश्चिम → उत्तर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्व</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा मोड़, 90° वामावर्त: पूर्व → </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों मोड़ों के बाद वह उत्तर की ओर चल रही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(दक्षिण से उसने शुरू किया था, तथा पश्चिम और पूर्व बीच की दिशाएँ हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मीना अब </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर (विकल्प C)</span><span style=\"font-family:'Mangal'\"> की ओर चल रही है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HK एक निश्चित तर्क के अनुसार 9 से संबंधित है। उसी तर्क के अनुसार DM, 27 से संबंधित है। उसी तर्क के अनुसार FQ निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का अंग्रेज़ी वर्णमाला में स्थान लिखकर ऐसा नियम खोजें जो संख्या दे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HK: H = 8, K = 11 → 11 − 8 = 3, और 3 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DM: D = 4, M = 13 → 13 − 4 = 9, और 9 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: संख्या = (दोनों अक्षरों के स्थानों का अंतर) × 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों का योग काम नहीं करता, क्योंकि 8 + 11 = 19 और 4 + 13 = 17 हैं, 9 और 27 नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FQ: F = 6, Q = 17 → 17 − 6 = 11, और 11 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(30 और 36 क्रमशः 10 और 12
