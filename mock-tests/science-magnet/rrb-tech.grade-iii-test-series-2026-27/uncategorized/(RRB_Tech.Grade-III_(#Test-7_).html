ेता है, परंतु वह कोशिकाओं के राइबोसोम और उन पर आक्रमण कर रहे एक विषाणु को देखना चाहता है। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसी प्रकाश सूक्ष्मदर्शी पर 40X अभिदृश्यक लेंस लगाने से राइबोसोम और विषाणु स्पष्ट दिखेंगे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन सूक्ष्मदर्शी चाहिए, क्योंकि यह इलेक्ट्रॉनों के पुंज का उपयोग करता है और नैनोमीटर स्तर की संरचनाएँ दिखा सकता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हस्त लेंस पर्याप्त है, क्योंकि आँख की विभेदन सीमा 0.1 mm है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों नहीं दिख सकते, क्योंकि राइबोसोम और विषाणु निर्जीव हैं और प्रकाश का प्रकीर्णन नहीं करते</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश पादप और जंतु कोशिकाएँ, केंद्रक और अधिकांश जीवाणु उस आकार-परास में आते हैं जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश सूक्ष्मदर्शी</span><span style=\"font-family:'Mangal'\"> से देखा जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">राइबोसोम, विषाणु, माइटोकॉन्ड्रिया और सबसे छोटे जीवाणु</span><span style=\"font-family:'Mangal'\"> इतने छोटे हैं कि उन्हें देखने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉन सूक्ष्मदर्शी</span><span style=\"font-family:'Mangal'\"> चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन सूक्ष्मदर्शी प्रकाश के बजाय </span><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉनों के पुंज</span><span style=\"font-family:'Mangal'\"> का उपयोग करता है और वैज्ञानिकों को कोशिका संरचना </span><span style=\"font-weight:bold;font-family:'Mangal'\">नैनोमीटर स्तर</span><span style=\"font-family:'Mangal'\"> पर (1 nm = मीटर का एक अरबवाँ भाग) अत्यंत स्पष्टता से दिखाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश सूक्ष्मदर्शी का अभिदृश्यक बदलने या हस्त लेंस से यह विभेदन नहीं मिलता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इलेक्ट्रॉन सूक्ष्मदर्शी चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधे धारावाही चालक पर दक्षिण-हस्त अंगुष्ठ नियम (Right Hand Thumb Rule) के प्रयोग का सबसे सही वर्णन कौन-सा कथन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंगूठा धारा की दिशा में, उँगलियाँ चुंबकीय क्षेत्र की दिशा में मुड़ती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उँगलियाँ धारा की दिशा में, अंगूठा चुंबकीय क्षेत्र की दिशा में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंगूठा चुंबकीय क्षेत्र की दिशा में, उँगलियाँ धारा की दिशा में मुड़ती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बायाँ हाथ धारा के लिए और दायाँ हाथ चुंबकीय क्षेत्र के लिए</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-हस्त अंगुष्ठ नियम:</span><span style=\"font-family:'Mangal'\"> धारावाही सीधे चालक को </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाएँ हाथ</span><span style=\"font-family:'Mangal'\"> में इस प्रकार पकड़ें कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंगूठा धारा की दिशा</span><span style=\"font-family:'Mangal'\"> में संकेत करे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब चालक के चारों ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">लिपटी उँगलियाँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय क्षेत्र रेखाओं की दिशा</span><span style=\"font-family:'Mangal'\"> बताती हैं, जो तार के चारों ओर संकेंद्री वृत्त होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B और C अंगूठे और उँगलियों की भूमिकाएँ उलट देते हैं, और यह नियम केवल दाएँ हाथ का उपयोग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस नियम को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैक्सवेल का कॉर्कस्क्रू नियम</span><span style=\"font-family:'Mangal'\"> भी कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंगूठा धारा की दिशा में और उँगलियाँ क्षेत्र की दिशा में मुड़ती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार लवणों (सोडियम क्लोराइड, अमोनियम क्लोराइड, पोटैशियम नाइट्रेट और सोडियम कार्बोनेट) के अलग-अलग जलीय विलयनों को लाल लिटमस पत्र से परखा जाता है। जो विलयन लाल लिटमस को नीला कर देता है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम क्लोराइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम नाइट्रेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम कार्बोनेट</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो लवण विलयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाल लिटमस को नीला</span><span style=\"font-family:'Mangal'\"> करता है वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारकीय</span><span style=\"font-family:'Mangal'\"> है (pH 7 से अधिक); लवण विलयन की प्रकृति उस अम्ल और क्षारक की प्रबलता पर निर्भर करती है जिनसे लवण बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम क्लोराइड</span><span style=\"font-family:'Mangal'\"> (NaOH + HCl) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पोटैशियम नाइट्रेट</span><span style=\"font-family:'Mangal'\"> (KOH + HNO₃) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल अम्ल और प्रबल क्षारक</span><span style=\"font-family:'Mangal'\"> के लवण हैं: उदासीन, pH 7; लिटमस में कोई परिवर्तन नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमोनियम क्लोराइड</span><span style=\"font-family:'Mangal'\"> (NH₄OH + HCl) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल अम्ल और दुर्बल क्षारक</span><span style=\"font-family:'Mangal'\"> का लवण है: अम्लीय, pH 7 से कम; यह नीले लिटमस को लाल करता, लाल को नीला नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम कार्बोनेट</span><span style=\"font-family:'Mangal'\"> (NaOH + H₂CO₃) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल क्षारक और दुर्बल अम्ल</span><span style=\"font-family:'Mangal'\"> का लवण है: क्षारकीय, pH 7 से अधिक; यह लाल लिटमस को नीला कर देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह विलयन सोडियम कार्बोनेट का है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबे के वैद्युत अपघटनी परिष्करण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अशुद्ध ताँबे को ऐनोड और शुद्ध ताँबे की पतली पट्टी को कैथोड बनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अम्लीकृत कॉपर सल्फेट विलयन को विद्युत अपघट्य के रूप में प्रयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अघुलनशील अशुद्धियाँ कैथोड के नीचे कैथोड पंक के रूप में बैठ जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वैद्युत अपघटनी परिष्करण में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अशुद्ध धातु को ऐनोड</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुद्ध धातु की पतली पट्टी को कैथोड</span><span style=\"font-family:'Mangal'\"> बनाया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. धातु के लवण का विलयन विद्युत अपघट्य होता है: ताँबे के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्लीकृत कॉपर सल्फेट विलयन</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धारा प्रवाहित करने पर ऐनोड से शुद्ध ताँबा विद्युत अपघट्य में घुलता है और उतना ही शुद्ध ताँबा कैथोड पर निक्षेपित होता है; घुलनशील अशुद्धियाँ विलयन में चली जाती हैं, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">अघुलनशील अशुद्धियाँ ऐनोड के नीचे ऐनोड पंक के रूप में</span><span style=\"font-family:'Mangal'\"> बैठती हैं, कैथोड पंक नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कीलिंग वक्र वायुमंडलीय CO₂ सांद्रता को 1960 में लगभग 315 ppm से बढ़कर 2025 में लगभग 420 ppm होते दिखाता है, परंतु रेखा चिकनी नहीं है। इसमें हर वर्ष एक नियमित आरी-दाँत (ज़िग-ज़ैग) प्रतिरूप है। यह आरी-दाँत प्रतिरूप किस कारण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उद्योगों द्वारा जलाए गए जीवाश्म ईंधन की मात्रा में मासिक परिवर्तन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तरी गोलार्ध में वार्षिक पादप वृद्धि द्वारा CO₂ अवशोषण से होने वाली मौसमी गिरावटें</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज्वालामुखी विस्फोट जो हर वर्ष एक बार CO₂ छोड़ते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महासागर केवल सर्दियों में CO₂ अवशोषित करते और गर्मियों में छोड़ते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कीलिंग वक्र</span><span style=\"font-family:'Mangal'\"> वायुमंडलीय CO₂ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">1960 में लगभग 315 ppm से 2025 में लगभग 420 ppm</span><span style=\"font-family:'Mangal'\"> तक बढ़ते दर्ज करता है, यानी लगभग 35% की वृद्धि, जो मानव इतिहास में अभूतपूर्व है और जीवाश्म ईंधन जलाने व वनोन्मूलन से हुई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वक्र का </span><span style=\"font-weight:bold;font-family:'Mangal'\">आरी-दाँत प्रतिरूप</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">मौसमी गिरावटें</span><span style=\"font-family:'Mangal'\"> दर्शाता है: हर वर्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तरी गोलार्ध</span><span style=\"font-family:'Mangal'\"> में वृद्धि-काल में पादप वृद्धि प्रकाश संश्लेषण द्वारा CO₂ अवशोषित करके सांद्रता घटा देती है, जो वृद्धि धीमी होने पर फिर बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवाश्म ईंधन जलाना दीर्घकालिक ऊपरी प्रवृत्ति समझाता है, नियमित वार्षिक ज़िग-ज़ैग नहीं; ज्वालामुखी किसी वार्षिक समय-सारणी से नहीं फटते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आरी-दाँत प्रतिरूप उत्तरी गोलार्ध में पादप वृद्धि द्वारा CO₂ के मौसमी अवशोषण के कारण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल द्वारा अपने प्रयोगों में उपयोग किया गया मटर का निम्नलिखित में से कौन-सा लक्षण प्रभावी लक्षण था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बौने पौधे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे पौधे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हरे बीज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">झुर्रीदार बीज</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने उद्यान मटर में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत लक्षणों</span><span style=\"font-family:'Mangal'\"> के युग्मों का अध्ययन किया, जैसे लंबे और बौने पौधे तथा गोल और झुर्रीदार बीज।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब शुद्ध </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबे</span><span style=\"font-family:'Mangal'\"> पौधे का शुद्ध </span><span style=\"font-weight:bold;font-family:'Mangal'\">बौने</span><span style=\"font-family:'Mangal'\"> पौधे से संकरण कराया गया, तो F1 की सभी संतानें </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी</span><span style=\"font-family:'Mangal'\"> थीं; जो लक्षण F1 पीढ़ी में प्रकट होता है, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रभावी</span><span style=\"font-family:'Mangal'\"> लक्षण कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबापन</span><span style=\"font-family:'Mangal'\"> प्रभावी है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बौनापन</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरा बीज रंग</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">झुर्रीदार बीज</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अप्रभावी</span><span style=\"font-family:'Mangal'\"> लक्षण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रभावी लक्षण लंबे पौधे हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक उदासीन परमाणु में 17 इलेक्ट्रॉन और 18 न्यूट्रॉन हैं। बोर-बरी योजना के अनुसार इस परमाणु के लिए निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉनिक विन्यास 2, 8, 8 और द्रव्यमान संख्या 36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉनिक विन्यास 2, 8, 7 और द्रव्यमान संख्या 35</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉनिक विन्यास 2, 7, 8 और द्रव्यमान संख्या 35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉनिक विन्यास 2, 8, 7 और द्रव्यमान संख्या 17</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी कोश में इलेक्ट्रॉनों की अधिकतम संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">2n²</span><span style=\"font-family:'Mangal'\"> है: K-कोश (n = 1) में 2, L-कोश (n = 2) में 8, M-कोश (n = 3) में 18 तक (परंतु बाह्यतम कोश में अधिकतम 8)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाभिक के निकटतम कोश से बाहर की ओर क्रमशः</span><span style=\"font-family:'Mangal'\"> भरे जाते हैं: L-कोश K-कोश के पूरा भरने के बाद ही भरता है, और इसी प्रकार आगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 इलेक्ट्रॉन → K = 2, L = 8, M = 7, अर्थात् विन्यास </span><span style=\"font-weight:bold;font-family:'Mangal'\">2, 8, 7</span><span style=\"font-family:'Mangal'\">, जो क्लोरीन (परमाणु क्रमांक 17) है, जैसा सारणी 8.4 में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उदासीन परमाणु में प्रोटॉन और इलेक्ट्रॉन की संख्या बराबर होती है, अतः प्रोटॉन = 17; </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संख्या = प्रोटॉन + न्यूट्रॉन = 17 + 18 = 35</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विन्यास 2, 8, 7 और द्रव्यमान संख्या 35 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जल की किसी भी सुविधाजनक मात्रा में एक चम्मच नमक और एक चम्मच चीनी मिलाकर बनाया गया पेय मौखिक पुनर्जलीकरण विलयन (ORS) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ORS जल की एक निश्चित मात्रा में नमक और चीनी की निर्दिष्ट मात्राएँ मिलाकर बनाया जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ORS</span><span style=\"font-family:'Mangal'\"> जल की एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">निश्चित मात्रा में नमक और चीनी की निर्दिष्ट मात्राएँ</span><span style=\"font-family:'Mangal'\"> मिलाकर बनाया जाता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि निर्दिष्ट विधि से नमक या चीनी की मात्रा, या जल का आयतन बदल दिया जाए, तो नमक-चीनी का विलयन तो बनता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">परंतु वह ORS नहीं</span><span style=\"font-family:'Mangal'\"> होता; घर पर बने या बाज़ार में बिकने वाले सभी मीठे पेय ORS नहीं होते → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए विलयन बनाते समय विलेय और विलायक का सही अनुपात (</span><span style=\"font-weight:bold;font-family:'Mangal'\">सांद्रता</span><span style=\"font-family:'Mangal'\">) सदैव आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्याज़ के दो कंद जल से भरे जारों में उगाए जाते हैं। तीसरे दिन जार B के कंद की जड़ों के सिरे लगभग 1 cm काट दिए जाते हैं, जबकि जार A की जड़ें ज्यों की त्यों छोड़ दी जाती हैं। अगले चार दिनों में जार A की जड़ें बढ़ती रहती हैं, परंतु जार B की जड़ों की लंबाई बढ़ना रुक जाती है। सही व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">काटने से जड़ का जाइलम हट गया, इसलिए पौधा जल अवशोषित नहीं कर सका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़ें केवल अपने सिरों से बढ़ती हैं, जिनमें लगातार विभाजित होने वाली कोशिकाएँ (मूल शीर्षस्थ विभज्योतक) होती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़ें कंद के आधार से बढ़ती हैं, इसलिए सिरा काटने का कोई प्रभाव नहीं होना चाहिए और प्रेक्षण गलत है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कटी जड़ें इसलिए बढ़ना बंद कर देती हैं क्योंकि उनकी लंबाई बढ़ाने वाला पार्श्व विभज्योतक हट गया</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रियाकलाप 3.1 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जार A</span><span style=\"font-family:'Mangal'\"> की जड़ें लंबाई में बढ़ती रहती हैं, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">जार B की जड़ें सिरे कटने के बाद बढ़ना बंद</span><span style=\"font-family:'Mangal'\"> कर देती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष यह है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">जड़ें केवल अपने सिरों से बढ़ती हैं</span><span style=\"font-family:'Mangal'\">, क्योंकि सिरों में ऐसी कोशिकाएँ होती हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगातार विभाजित</span><span style=\"font-family:'Mangal'\"> होती रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़ों और तनों के सिरों पर स्थित इन वृद्धि क्षेत्रों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">शीर्षस्थ विभज्योतक</span><span style=\"font-family:'Mangal'\"> कहते हैं; ये पौधे की लंबाई बढ़ाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पार्श्व विभज्योतक तने की मोटाई (व्यास) बढ़ाता है, लंबाई नहीं; और जल अवशोषण रुकना वृद्धि रुकने का कारण नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वृद्धि इसलिए रुकी क्योंकि मूल शीर्षस्थ विभज्योतक की विभाजित होने वाली कोशिकाएँ हट गईं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम का एक छोटा टुकड़ा जल में डाला जाता है: Na + H₂O → NaOH + H₂. इस कंकाली समीकरण को सबसे छोटे पूर्ण-संख्या गुणांकों से संतुलित करने पर Na, H₂O, NaOH और H₂ के गुणांक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2, 2, 2, 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 1, 1, 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2, 1, 2, 1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 2, 1, 2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलित</span><span style=\"font-family:'Mangal'\"> तभी है जब प्रत्येक तत्व के परमाणुओं की संख्या दोनों ओर समान हो; असंतुलित रूप Na + H₂O → NaOH + H₂ एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंकाली समीकरण</span><span style=\"font-family:'Mangal'\"> है (H: बाईं ओर 2, दाईं ओर 3)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले हाइड्रोजन संतुलित कीजिए: बाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2H₂O</span><span style=\"font-family:'Mangal'\"> (4 H) के साथ दाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2NaOH</span><span style=\"font-family:'Mangal'\"> (2 H) + </span><span style=\"font-weight:bold;font-family:'Mangal'\">H₂</span><span style=\"font-family:'Mangal'\"> (2 H) लिखिए → 4 = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब सोडियम: दाईं ओर 2 (2NaOH), अतः बाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2Na</span><span style=\"font-family:'Mangal'\"> लिखिए; ऑक्सीजन: 2 (2H₂O) = 2 (2NaOH).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतुलित समीकरण: </span><span style=\"font-weight:bold;font-family:'Mangal'\">2Na + 2H₂O → 2NaOH + H₂</span><span style=\"font-family:'Mangal'\">. जाँच: Na 2 = 2, H 4 = 4, O 2 = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गुणांक 2, 2, 2, 1 हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डाल्टन के परमाणु सिद्धांत के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी दिए गए तत्व के परमाणु द्रव्यमान और रासायनिक गुणों में समान होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यह सिद्धांत यह मानकर कि परमाणु अविभाज्य हैं और केवल पुनर्व्यवस्थित होते हैं, समझाता है कि पदार्थ निश्चित अनुपात में क्यों संयोग करते हैं और रासायनिक अभिक्रिया में द्रव्यमान की हानि या वृद्धि क्यों नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. भिन्न तत्वों के परमाणुओं का द्रव्यमान समान परंतु रासायनिक गुण भिन्न होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. डाल्टन का अभिगृहीत: किसी दिए गए तत्व के परमाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान और रासायनिक गुणों में समान</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. डाल्टन का सिद्धांत </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिर अनुपात के नियम</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संरक्षण के नियम</span><span style=\"font-family:'Mangal'\"> की व्याख्या करता है: परमाणु अविभाज्य हैं और अभिक्रिया में न बनते हैं न नष्ट होते हैं; वे केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनर्व्यवस्थित</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. डाल्टन का अभिगृहीत है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न तत्वों के परमाणुओं के द्रव्यमान भिन्न</span><span style=\"font-family:'Mangal'\"> और रासायनिक गुण भिन्न होते हैं, समान द्रव्यमान नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र मछलियों, जल, ऑक्सीजन पंप (वातक) और बाज़ार से खरीदे मछली-आहार से एक जलजीवशाला (एक्वेरियम) बनाता है, परंतु टैंक को नियमित सफ़ाई और आहार की आवश्यकता रहती है। कौन-सा एक परिवर्तन जलजीवशाला को स्व-पोषित तंत्र के अधिक निकट ले जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिक शक्तिशाली ऑक्सीजन पंप लगाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बार में अधिक मात्रा में मछली-आहार डालना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ जलीय पौधे और जंतु जोड़ना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियों को अधिक सक्रिय बनाने के लिए रंगीन बत्तियाँ लगाना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जलजीवशाला बनाते समय मछलियों को तैरने के लिए खुला स्थान, </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल, ऑक्सीजन और भोजन</span><span style=\"font-family:'Mangal'\"> चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन पंप (वातक)</span><span style=\"font-family:'Mangal'\"> से दी जा सकती है और मछली-आहार बाज़ार में मिलता है, परंतु इनसे टैंक छात्र पर निर्भर रहता है, स्व-पोषित नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलीय पौधे और जंतु</span><span style=\"font-family:'Mangal'\"> जोड़ने से जलजीवशाला </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्व-पोषित तंत्र</span><span style=\"font-family:'Mangal'\"> बन सकती है: पौधे ऑक्सीजन और भोजन बनाते हैं, और जीव एक-दूसरे तथा अजैव घटकों के साथ पारिस्थितिकी तंत्र की तरह परस्पर क्रिया करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बड़ा पंप, अधिक भोजन या रंगीन बत्तियाँ ये परस्पर क्रियाएँ नहीं बनातीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुछ जलीय पौधे और जंतु जोड़ना ही आवश्यक परिवर्तन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे के तने की मोटाई में वृद्धि के लिए कौन-सा विभज्योतक ऊतक उत्तरदायी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पार्श्व विभज्योतक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीर्षस्थ विभज्योतक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर्वेशी विभज्योतक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थायी ऊतक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों में तीन प्रकार के विभज्योतक ऊतक होते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">शीर्षस्थ</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">पार्श्व</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्वेशी</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पार्श्व विभज्योतक</span><span style=\"font-family:'Mangal'\"> की कोशिकाएँ विभाजित होकर भीतर और बाहर की ओर संकेंद्री रूप में नई कोशिकाएँ जोड़ती हैं, जिससे तने की </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटाई (घेरा)</span><span style=\"font-family:'Mangal'\"> बढ़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़ और तने के सिरों पर स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">शीर्षस्थ विभज्योतक</span><span style=\"font-family:'Mangal'\"> पौधे की </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबाई</span><span style=\"font-family:'Mangal'\"> बढ़ाता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्वेशी विभज्योतक</span><span style=\"font-family:'Mangal'\"> पत्तियों या पर्वों के आधार पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्थायी ऊतक</span><span style=\"font-family:'Mangal'\"> विभाजन की क्षमता खो चुका होता है, इसलिए वह नई कोशिकाएँ नहीं जोड़ सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मोटाई में वृद्धि पार्श्व विभज्योतक के कारण होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साफ़ लोहे की कीलें तीन परखनलियों में रखी जाती हैं: A में साधारण जल है; B में उबला हुआ आसुत जल है जिसके ऊपर तेल की परत है; C में निर्जल कैल्सियम क्लोराइड है और उसे कॉर्क से बंद किया गया है। कुछ दिनों बाद जंग दिखाई देता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल परखनली A में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनलियों A और B में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनलियों A और C में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों परखनलियों में</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहे में जंग लगने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु (ऑक्सीजन) और जल दोनों</span><span style=\"font-family:'Mangal'\"> की उपस्थिति आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनली </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\">: कीलें ऐसे जल के संपर्क में हैं जिसमें घुली हुई वायु है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">कीलों में जंग लगता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनली </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">: जल को उबालकर घुली वायु निकाल दी गई और तेल की परत वायु को पुनः घुलने से रोकती है। जल है परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु नहीं</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">जंग नहीं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परखनली </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">: निर्जल कैल्सियम क्लोराइड वायु की नमी सोख लेता है, अतः कीलें </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल शुष्क वायु</span><span style=\"font-family:'Mangal'\"> के संपर्क में हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">जंग नहीं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जंग केवल परखनली A में दिखाई देता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव ऋतु चक्र (मासिक चक्र) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यदि अंडाणु निषेचित नहीं होता, तो वह लगभग एक दिन तक जीवनक्षम रहता है और फिर नष्ट हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अंडोत्सर्जन, अर्थात् अंडाशय से परिपक्व अंडाणु का मोचन, सामान्य 28-दिन के चक्र के पहले दिन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रजोधर्म (मासिक स्राव) प्रायः 3 से 7 दिन तक चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यदि अंडाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषेचित नहीं</span><span style=\"font-family:'Mangal'\"> होता, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग एक दिन</span><span style=\"font-family:'Mangal'\"> तक जीवनक्षम रहता है और फिर नष्ट हो जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सामान्य 28-दिन के चक्र में दिन 1–5 रजोधर्म है, दिन 6–14 में गर्भाशय की भित्ति पुनः बनती है और अंडाणु परिपक्व होता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडोत्सर्जन लगभग 14वें दिन</span><span style=\"font-family:'Mangal'\"> होता है, पहले दिन नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निषेचन न होने पर गर्भाशय की मोटी भित्ति झड़कर कुछ रक्त के साथ योनि से बाहर निकलती है। यही रजोधर्म है, जो प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 से 7 दिन</span><span style=\"font-family:'Mangal'\"> चलता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास, गेहूँ, आम, बकरी, मनुष्य, गाय, हाथी और मछली: इन जीवों में से निम्नलिखित में कौन-सी एक वैध खाद्य शृंखला बनाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → गेहूँ → आम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → मछली → बकरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बकरी → गाय → हाथी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → बकरी → मनुष्य</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खाद्य शृंखला</span><span style=\"font-family:'Mangal'\"> जीवों की ऐसी शृंखला है जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-दूसरे को खाते</span><span style=\"font-family:'Mangal'\"> हैं, प्रत्येक एक भिन्न जैविक स्तर पर; शृंखला का प्रत्येक चरण एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">पोषक स्तर</span><span style=\"font-family:'Mangal'\"> बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → बकरी → मनुष्य: </span><span style=\"font-weight:bold;font-family:'Mangal'\">घास</span><span style=\"font-family:'Mangal'\"> (उत्पादक, पहला पोषक स्तर) को </span><span style=\"font-weight:bold;font-family:'Mangal'\">बकरी</span><span style=\"font-family:'Mangal'\"> (शाकाहारी, प्राथमिक उपभोक्ता) खाती है, और बकरी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मनुष्य</span><span style=\"font-family:'Mangal'\"> (अगले पोषक स्तर का उपभोक्ता) खाता है → वैध शृंखला।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → गेहूँ → आम में केवल उत्पादक हैं, जिनमें कोई दूसरे को नहीं खाता; बकरी → गाय → हाथी में केवल शाकाहारी हैं जो एक-दूसरे को नहीं खाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास → मछली → बकरी अवैध है क्योंकि बकरी मछली नहीं खाती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वैध खाद्य शृंखला घास → बकरी → मनुष्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रजनन में DNA प्रतिकृति के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. DNA प्रतिकृति के साथ अतिरिक्त कोशिकीय संरचना का निर्माण होता है, जिसके बाद DNA की दोनों प्रतियाँ अपनी-अपनी कोशिकीय संरचना के साथ अलग हो जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. DNA प्रतिकृति की प्रक्रिया पूर्णतः विश्वसनीय है, इसलिए बनी दोनों कोशिकाएँ सदैव एक-दूसरे के समरूप होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रजनन के दौरान विभिन्नता की अंतर्निहित प्रवृत्ति विकास (इवोल्यूशन) का आधार है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. DNA की एक प्रति को कोशिका से बाहर धकेल देना काम नहीं करेगा, क्योंकि उसके पास कोई संगठित कोशिकीय संरचना नहीं होगी; अतः DNA प्रतिकृति के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अतिरिक्त कोशिकीय संरचना का निर्माण</span><span style=\"font-family:'Mangal'\"> होता है, और फिर प्रतियाँ अपनी-अपनी संरचना के साथ अलग हो जाती हैं। प्रभावी रूप से कोशिका दो में बँट जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई भी जैव-रासायनिक अभिक्रिया पूर्णतः विश्वसनीय नहीं</span><span style=\"font-family:'Mangal'\"> होती, इसलिए DNA प्रतिकृति में हर बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुछ विभिन्नताएँ</span><span style=\"font-family:'Mangal'\"> आती हैं; प्रतियाँ मूल के समान होती हैं परंतु समरूप न भी हों → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बची हुई कोशिकाएँ एक-दूसरे के समान परंतु सूक्ष्म रूप से भिन्न होती हैं; प्रजनन के दौरान </span><span style=\"font-weight:bold;font-family:'Mangal'\">विभिन्नता की यह अंतर्निहित प्रवृत्ति</span><span style=\"font-family:'Mangal'\"> ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">विकास का आधार</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ट्रॉली पर उसकी गति की दिशा में लगने वाला बल पहले 3 m तक 20 N पर नियत रहता है और फिर अगले 2 m में एकसमान रूप से घटकर शून्य हो जाता है। बल द्वारा ट्रॉली पर किया गया कुल कार्य है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70 J</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नियत बल के लिए किया गया कार्य W = F × s; बल-विस्थापन ग्राफ पर यह ग्राफ के नीचे </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयत का क्षेत्रफल</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बल नियत न होने पर भी किया गया कार्य प्रारंभिक और अंतिम स्थितियों के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल-विस्थापन ग्राफ के नीचे के क्षेत्रफल</span><span style=\"font-family:'Mangal'\"> के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला भाग (नियत बल): आयत का क्षेत्रफल = 20 N × 3 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा भाग (बल 2 m में 20 N से एकसमान रूप से घटकर 0): त्रिभुज का क्षेत्रफल = ½ × 2 m × 20 N = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल कार्य = 60 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 J</span><span style=\"font-family:'Mangal'\"> (पूरे 5 m के लिए बल 20 N मानने पर गलत उत्तर 100 J आता).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः किया गया कुल कार्य 80 J है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): ठोस सोडियम क्लोराइड एकल, स्वतंत्र NaCl इकाइयों के रूप में नहीं रहता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): आयनिक यौगिक त्रिविमीय क्रिस्टल बनाते हैं जिनमें आयन एक दोहराए जाने वाले प्रतिरूप में व्यवस्थित होते हैं; सोडियम क्लोराइड में प्रत्येक Na⁺ आयन छह Cl⁻ आयनों से और प्रत्येक Cl⁻ आयन छह Na⁺ आयनों से घिरा होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Na⁺ और Cl⁻ आयन बनने के बाद वे विपरीत आवेशित आयनों के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिरवैद्युत आकर्षण बल</span><span style=\"font-family:'Mangal'\"> (</span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनिक बंध</span><span style=\"font-family:'Mangal'\">) द्वारा जुड़े रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल इकाइयों के रूप में नहीं रहते</span><span style=\"font-family:'Mangal'\">; वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्रिविमीय (3-D) क्रिस्टल</span><span style=\"font-family:'Mangal'\"> बनाते हैं जिनमें आयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोहराए जाने वाले प्रतिरूप</span><span style=\"font-family:'Mangal'\"> में व्यवस्थित होते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक Na⁺ छह Cl⁻ आयनों से और प्रत्येक Cl⁻ छह Na⁺ आयनों से घिरा</span><span style=\"font-family:'Mangal'\"> होता है (क्रिस्टल जालक में ये आयन बिंदुओं के रूप में दिखाए जाते हैं) → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही दोहराई जाने वाली 3-D व्यवस्था कारण है कि ठोस में कोई एकल NaCl इकाई अलग से नहीं होती → R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सीधे तार के ठीक नीचे कंपास की सुई रखी जाती है। जब तार में धारा प्रवाहित की जाती है, तो सुई विक्षेपित हो जाती है। इससे पता चलता है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही तार लोहे की वस्तुओं को आकर्षित करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही तार अपने चारों ओर चुंबकीय क्षेत्र उत्पन्न करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार पर विद्युत आवेश आ जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंपास की सुई अपना चुंबकत्व खो देती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंपास की सुई एक छोटा चुंबक है, और वह केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय क्षेत्र</span><span style=\"font-family:'Mangal'\"> से विक्षेपित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार में धारा प्रवाहित होने पर सुई विक्षेपित होती है; धारा बंद होने पर वह अपनी मूल स्थिति में लौट आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे पता चलता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत धारा चालक के चारों ओर चुंबकीय क्षेत्र उत्पन्न करती है</span><span style=\"font-family:'Mangal'\">, जिसे सबसे पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">हैंस क्रिश्चियन ओर्स्टेड</span><span style=\"font-family:'Mangal'\"> ने देखा था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार पर आवेश नहीं आता और सुई अपना चुंबकत्व नहीं खोती; लोहे को आकर्षित करना कंपास के विक्षेपण का कारण नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धारावाही तार अपने चारों ओर चुंबकीय क्षेत्र उत्पन्न करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द MACHINE के प्रत्येक स्वर को अंग्रेज़ी वर्णमाला क्रम में उसके ठीक बाद वाले अक्षर में और प्रत्येक व्यंजन को उसके ठीक पहले वाले अक्षर में बदल दिया जाता है। इस प्रकार बने नए अक्षर-समूह में दाएँ से तीसरा अक्षर निम्नलिखित में से कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द: M A C H I N E (स्वर A, I, E; व्यंजन M, C, H, N)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वर एक अक्षर आगे: A → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">, I → </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, E → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजन एक अक्षर पीछे: M → </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, C → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">, H → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, N → </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया अक्षर-समूह (वही स्थान): </span><span style=\"font-weight:bold;font-family:'Mangal'\">L B B G J M F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ से गिनें: F (पहला), M (दूसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> (तीसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ से तीसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">J (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ! B का अर्थ है कि ‘A, B की पत्नी है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पिता है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = B का अर्थ है कि ‘A, B की बहन है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘R = I + G ÷ H ! T’ है, तो R का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की बहन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी का पिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी का भाई</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ! B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = B → A, B की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: R = I + G ÷ H ! T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = I → R, I की बहन है। R और I भाई-बहन हैं, अतः उनके माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I + G → I, G का पुत्र है। इसलिए R, G की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G ÷ H → G, H का पिता है। इसलिए R और H दोनों G की संतान हैं, अर्थात् R, H की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H ! T → H, T की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R, H की बहन है और H, T की पत्नी है → R, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T की पत्नी की बहन (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ डॉक्टर चील हैं। कोई साँप डॉक्टर नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ चील साँप नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) सभी चील डॉक्टर हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: डॉक्टर का वृत्त चील के वृत्त को काटता है (कुछ डॉक्टर चील हैं), और साँप का वृत्त डॉक्टर के वृत्त से पूरी तरह बाहर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ चील साँप नहीं हैं → जो चील डॉक्टर हैं, वे डॉक्टर के अंदर हैं और कोई साँप डॉक्टर के अंदर नहीं है, अतः वे चील निश्चित रूप से साँप नहीं हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): सभी चील डॉक्टर हैं → केवल ‘कुछ डॉक्टर चील हैं’ दिया है; चील का वृत्त डॉक्टर से बाहर भी फैल सकता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">142 एक निश्चित तर्क से 287 से संबंधित है। उसी तर्क से 219, 441 से संबंधित है। उसी तर्क के अनुसार 356 दिए गए विकल्पों में से किससे संबंधित है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">709</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">721</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">715</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">712</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">142 → 287: 142 × 2 = 284; 284 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">287</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">219 → 441: 219 × 2 = 438; 438 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">441</span><span style=\"font-family:'Mangal'\"> → नियम: दूसरी संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(पहली संख्या × 2) + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">356 → 356 × 2 = 712; 712 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">715</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प जाँचें: 709 = 712 − 3, 712 = 356 × 2 (+ 3 नहीं जोड़ा), 721 = 712 + 9. कोई भी नियम का पालन नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 356, </span><span style=\"font-weight:bold;font-family:'Mangal'\">715 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति K, L, M, N, O, P और Q एक पंक्ति में दक्षिण की ओर मुख करके बैठे हैं। K के दाईं ओर केवल L बैठा है। L और O के बीच केवल तीन व्यक्ति बैठे हैं। N, O के बाईं ओर दूसरे स्थान पर बैठा है। M, O के ठीक दाईं ओर बैठा है। Q, M का निकटतम पड़ोसी नहीं है। पंक्ति के पूर्वी छोर पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी सात दक्षिण की ओर मुख किए हैं, अतः ‘बाएँ’ और ‘दाएँ’ व्यक्तियों के अपने बाएँ-दाएँ हैं; दक्षिण की ओर मुख वाले व्यक्ति के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाएँ पश्चिम</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाएँ पूर्व</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को व्यक्तियों के बाएँ से दाएँ 1 से 7 तक क्रमांक दें (सीट 1 = पूर्वी छोर, सीट 7 = पश्चिमी छोर)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K के दाईं ओर केवल L → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 6, L = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L और O के बीच तीन व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">O = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N, O के बाईं ओर दूसरे स्थान पर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">N = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, O के ठीक दाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">M = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, M (सीट 4) का पड़ोसी नहीं है → Q सीट 5 पर नहीं हो सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 2, P = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (व्यक्तियों के बाईं ओर → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">N – Q – O – M – P – K – L</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीट 1, व्यक्तियों का सबसे बायाँ छोर, ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्वी छोर</span><span style=\"font-family:'Mangal'\"> है → N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पंक्ति के पूर्वी छोर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">N (विकल्प C)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कूट भाषा में 'BLAST' को LBCTS और 'CHAIR' को HCCRI लिखा जाता है। उसी भाषा में 'FRUIT' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWIT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWTI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FRWTI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFVTI</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BLAST → LBCTS: पहले दो अक्षर आपस में बदले गए (B L → </span><span style=\"font-weight:bold;font-family:'Mangal'\">L B</span><span style=\"font-family:'Mangal'\">), बीच का अक्षर 2 आगे बढ़ाया गया (A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">), और अंतिम दो अक्षर आपस में बदले गए (S T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T S</span><span style=\"font-family:'Mangal'\">)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CHAIR → HCCRI: C H → </span><span style=\"font-weight:bold;font-family:'Mangal'\">H C</span><span style=\"font-family:'Mangal'\">; A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">; I R → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R I</span><span style=\"font-family:'Mangal'\"> → वही नियम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FRUIT → F R → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R F</span><span style=\"font-family:'Mangal'\">; U + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">; I T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T I</span><span style=\"font-family:'Mangal'\"> → RFWTI</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWIT में अंतिम दो अक्षर नहीं बदले, FRWTI में पहले दो नहीं बदले, और RFVTI में U + 1 है। कोई भी नियम का पालन नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘FRUIT’ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">RFWTI (विकल्प B)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में \"JUMOC\" को \"15\" और \"QYATXZR\" को \"21\" लिखा जाता है। उसी भाषा में \"VTGZXAIW\" का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JUMOC में </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट 15 = 5 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QYATXZR में </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट 21 = 7 × 3 → नियम: कूट = (अक्षरों की संख्या) </span><span style=\"font-weight:bold;font-family:'Mangal'\">× 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VTGZXAIW में </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट = 8 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 21, 29 और 30, 3 × 8 नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः \"VTGZXAIW\" का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T और U में से प्रत्येक की आयु अलग-अलग है। R की आयु 30 वर्ष है; R, Q से छोटा और T से बड़ा है। केवल दो व्यक्ति 30 वर्ष से बड़े हैं। केवल एक व्यक्ति S से बड़ा है। U सबसे बड़ा नहीं है। U, T से बड़ा है। केवल एक व्यक्ति P से छोटा है। सबसे छोटा कौन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह व्यक्तियों को सबसे बड़े (पहला) से सबसे छोटे (छठा) तक क्रम दें।</span></p><p style=\"margin-top:0pt;margin-bot
