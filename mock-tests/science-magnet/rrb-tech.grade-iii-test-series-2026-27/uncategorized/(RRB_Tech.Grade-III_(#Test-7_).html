<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>15.) RRB Tech.Grade-III (#Test-7  - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र अवतल दर्पण को सूर्य की ओर करके उसके सामने कागज़ की शीट तब तक खिसकाता है जब तक कागज़ पर एक चमकीला, तीक्ष्ण बिंदु न बन जाए; यह बिंदु दर्पण से 12 cm पर है। दर्पण की वक्रता त्रिज्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कागज़ पर बना चमकीला बिंदु </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य का प्रतिबिंब</span><span style=\"font-family:'Mangal'\"> है; चूँकि सूर्य बहुत दूर है, उसकी किरणें समांतर हैं और अवतल दर्पण के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुख्य फोकस</span><span style=\"font-family:'Mangal'\"> पर मिलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु की दर्पण से दूरी लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">फोकस दूरी</span><span style=\"font-family:'Mangal'\"> देती है: f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span><span style=\"font-family:'Mangal'\"> (यहाँ संकेंद्रित ऊष्मा कागज़ को जला भी सकती है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे द्वारक वाले गोलीय दर्पण के लिए वक्रता त्रिज्या फोकस दूरी की दोगुनी होती है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 2f</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = 2 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 cm</span><span style=\"font-family:'Mangal'\">. मुख्य फोकस ध्रुव और वक्रता केंद्र के ठीक बीच में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वक्रता त्रिज्या 24 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चूँकि तय की गई दूरी की कोई दिशा नहीं होती, उससे मापी गई औसत चाल का केवल संख्यात्मक मान होता है, दिशा नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सीधी रेखा में चलती वस्तु एकसमान गति में तभी है जब वह समय अंतरालों के सभी संभव चयनों के लिए समान समय अंतरालों में समान दूरियाँ तय करे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. स्थिति-समय ग्राफ एक मार्ग-मानचित्र है जो वह पथ दर्शाता है जिस पर वस्तु चली।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. औसत चाल = कुल तय दूरी ÷ समय अंतराल; चूँकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूरी की कोई दिशा नहीं</span><span style=\"font-family:'Mangal'\"> होती, औसत चाल की भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई दिशा नहीं, केवल संख्यात्मक मान</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सीधी रेखा में एकसमान गति का अर्थ है समान समय अंतरालों में समान दूरियाँ, </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय अंतरालों के सभी संभव चयनों के लिए</span><span style=\"font-family:'Mangal'\">, केवल एक चुने हुए अंतराल के लिए नहीं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ग्राफ </span><span style=\"font-weight:bold;font-family:'Mangal'\">मार्ग-मानचित्र नहीं</span><span style=\"font-family:'Mangal'\"> है; यह मार्ग नहीं, बल्कि मूल बिंदु के सापेक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">वस्तु की स्थिति समय के साथ कैसे बदलती है</span><span style=\"font-family:'Mangal'\">, यह दर्शाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो मित्र एक लंबे स्टील के पाइप के सहारे 1020 m की दूरी पर खड़े हैं। उनमें से एक पाइप पर हथौड़े से एक बार प्रहार करता है। स्टील में ध्वनि की चाल 5000 m/s और वायु में 340 m/s लेते हुए, दूसरे मित्र को सुनाई देने वाली दोनों ध्वनियों के बीच समय अंतराल लगभग है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.0 s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2 s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.2 s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8 s</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रहार की ध्वनि श्रोता तक दो मार्गों से पहुँचती है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टील के पाइप</span><span style=\"font-family:'Mangal'\"> से और </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु</span><span style=\"font-family:'Mangal'\"> से।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु से समय: t₁ = दूरी ÷ चाल = 1020 ÷ 340 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.0 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टील से समय: t₂ = 1020 ÷ 5000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.204 s</span><span style=\"font-family:'Mangal'\"> (स्टील में ध्वनि वायु की तुलना में लगभग 15 गुना तेज़ चलती है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टील वाली ध्वनि पहले पहुँचती है; समय अंतराल = 3.0 − 0.204 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.796 s ≈ 2.8 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि अंतराल 0.1 s से कहीं अधिक है, दोनों ध्वनियाँ अलग-अलग सुनाई देती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समय अंतराल लगभग 2.8 s है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भनिरोध की विधि को उसके विवरण से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789800739689_image001.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(iv), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(iii), (d)-(ii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंडोम</span><span style=\"font-family:'Mangal'\"> (और योनि आवरण) </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवरोध विधियाँ</span><span style=\"font-family:'Mangal'\"> हैं जो शुक्राणु को अंडाणु तक पहुँचने से रोकती हैं; कंडोम STI के संचरण को भी रोकता है &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">मौखिक गर्भनिरोधक गोलियाँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">हॉर्मोनों को बदलकर</span><span style=\"font-family:'Mangal'\"> अंडाणु के मोचन को बदल देती हैं, यद्यपि इनके कुछ दुष्प्रभाव हो सकते हैं &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉपर-T</span><span style=\"font-family:'Mangal'\"> एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्गर्भाशयी युक्ति (IUD)</span><span style=\"font-family:'Mangal'\"> है जिसे गर्भधारण रोकने के लिए गर्भाशय में रखा जाता है; यह कभी-कभी गर्भाशय में जलन कर सकती है &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">शल्य विधियाँ</span><span style=\"font-family:'Mangal'\"> पुरुषों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुक्रवाहिनी</span><span style=\"font-family:'Mangal'\"> या स्त्रियों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडवाहिनी</span><span style=\"font-family:'Mangal'\"> को अवरुद्ध करती हैं ताकि शुक्राणु और अंडाणु मिल न सकें &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 Ω, 6 Ω और 10 Ω के तीन प्रतिरोधक 12 V की बैटरी, एक ऐमीटर और एक प्लग कुंजी के साथ श्रेणीक्रम में जुड़े हैं। 10 Ω के प्रतिरोधक के सिरों पर एक वोल्टमीटर जुड़ा है। कुंजी बंद करने पर ऐमीटर और वोल्टमीटर के रीडिंग क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.6 A और 6 V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.6 A और 12 V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.2 A और 6 V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 A और 6 V</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्रेणी संयोजन में तुल्य प्रतिरोध अलग-अलग प्रतिरोधों का योग होता है (और किसी भी एक से अधिक): R = 4 + 6 + 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्रेणी परिपथ के प्रत्येक भाग से </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान धारा</span><span style=\"font-family:'Mangal'\"> बहती है; ओम के नियम से I = V/R = 12 ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.6 A</span><span style=\"font-family:'Mangal'\">, यही ऐमीटर का रीडिंग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 Ω प्रतिरोधक के सिरों पर विभवांतर: V₃ = I × R₃ = 0.6 × 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 V</span><span style=\"font-family:'Mangal'\">, वोल्टमीटर का रीडिंग।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: V₁ = 0.6 × 4 = 2.4 V, V₂ = 0.6 × 6 = 3.6 V; V₁ + V₂ + V₃ = 2.4 + 3.6 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 V</span><span style=\"font-family:'Mangal'\">, जो बैटरी के वोल्टेज के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रीडिंग 0.6 A और 6 V हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): यूरोप के उत्तर-पश्चिमी तट के अनेक बंदरगाह उच्च अक्षांशों पर होते हुए भी सर्दियों में हिम-मुक्त रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): उत्तरी अटलांटिक ड्रिफ्ट, आर्कटिक से आने वाली एक ठंडी महासागरीय धारा, यूरोप के उत्तर-पश्चिमी तट के साथ बहती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तरी अटलांटिक ड्रिफ्ट</span><span style=\"font-family:'Mangal'\"> यूरोप के उत्तर-पश्चिमी तट की ओर बहती है और उच्च अक्षांशों पर भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनेक बंदरगाहों को सर्दियों में हिम-मुक्त रखती</span><span style=\"font-family:'Mangal'\"> है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु उत्तरी अटलांटिक ड्रिफ्ट एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्म</span><span style=\"font-family:'Mangal'\"> महासागरीय धारा है, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">गल्फ स्ट्रीम</span><span style=\"font-family:'Mangal'\"> का विस्तार, जो उत्तरी अमेरिका के पूर्वी तट के दक्षिणी भाग से अटलांटिक के पार गर्म जल ले जाती है; यह आर्कटिक से आने वाली ठंडी धारा नहीं है → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्म धाराओं का जलवायु पर यह समकारी प्रभाव व्यापार और वाणिज्य जैसी मानवीय गतिविधियों को भी सहारा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम हाइड्रोजनकार्बोनेट में तनु HCl मिलाने पर निकली गैस को चूने के पानी से प्रवाहित किया जाता है। चूने का पानी पहले दूधिया हो जाता है, परंतु गैस को लंबे समय तक प्रवाहित करने पर वह फिर से स्वच्छ हो जाता है। इन प्रेक्षणों की सही व्याख्या निम्नलिखित में से कौन-सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूधियापन CaCl₂ के कारण है, जो चूने के पानी में अधिक HCl वाष्प पहुँचने पर घुल जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूधियापन अघुलनशील Ca(HCO₃)₂ के कारण है, जो अधिक गैस प्रवाहित करने पर घुलनशील CaCO₃ में बदल जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूधियापन CaCO₃ के श्वेत अवक्षेप के कारण है, जो अधिक CO₂ प्रवाहित करने पर घुलनशील Ca(HCO₃)₂ में बदल जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैस हाइड्रोजन है, जो कैल्सियम हाइड्रॉक्साइड को पहले अपचयित और फिर पुनः ऑक्सीकृत करती है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम हाइड्रोजनकार्बोनेट तनु HCl से अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> देता है: NaHCO₃ + HCl → NaCl + H₂O + CO₂; सभी धातु कार्बोनेट और हाइड्रोजनकार्बोनेट अम्लों से CO₂ देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ को चूने के पानी से प्रवाहित करने पर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l)</span><span style=\"font-family:'Mangal'\">. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम कार्बोनेट का श्वेत अवक्षेप</span><span style=\"font-family:'Mangal'\"> चूने के पानी को दूधिया कर देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> CO₂ प्रवाहित करने पर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">CaCO₃(s) + H₂O(l) + CO₂(g) → Ca(HCO₃)₂(aq)</span><span style=\"font-family:'Mangal'\">. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम हाइड्रोजनकार्बोनेट जल में घुलनशील</span><span style=\"font-family:'Mangal'\"> है, अतः दूधियापन समाप्त हो जाता है और विलयन स्वच्छ हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूधियापन CaCO₃ के कारण है, जो अधिक CO₂ के साथ घुलनशील Ca(HCO₃)₂ में बदल जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संगीतमय ध्वनि के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सप्तक (ऑक्टेव) दो स्वरों के बीच का वह अंतराल है जिसमें एक की आवृत्ति दूसरे की दोगुनी होती है, जैसे 200 Hz और 400 Hz.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. टोन एकल आवृत्ति की ध्वनि है, जैसे स्वरित्र द्विभुज या मुँह से सीटी बजाने से उत्पन्न ध्वनि।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी वाद्य यंत्र का टिम्बर (ध्वनि-गुण) केवल उस प्रबलता से तय होता है जिस पर उसे बजाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सप्तक (ऑक्टेव)</span><span style=\"font-family:'Mangal'\"> दो स्वरों के बीच का वह अंतराल है जिसमें एक की आवृत्ति दूसरे की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुनी</span><span style=\"font-family:'Mangal'\"> होती है (जैसे 200 Hz और 400 Hz), जो उनकी मूल आवृत्तियों के बीच मापा जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">टोन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल आवृत्ति</span><span style=\"font-family:'Mangal'\"> की ध्वनि है, जैसे स्वरित्र द्विभुज या मुँह की सीटी की; इसके विपरीत संगीतमय स्वर मूल आवृत्ति और अधिस्वरों (ओवरटोन) का संयोजन है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. भिन्न वाद्य यंत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान प्रबलता</span><span style=\"font-family:'Mangal'\"> पर एक ही स्वर बजाएँ तब भी हर एक अनूठा सुनाई देता है। यह गुण </span><span style=\"font-weight:bold;font-family:'Mangal'\">टिम्बर</span><span style=\"font-family:'Mangal'\"> है, और यह वाद्य के </span><span style=\"font-weight:bold;font-family:'Mangal'\">आकार, पदार्थ और बनावट</span><span style=\"font-family:'Mangal'\"> से आता है, जो अधिस्वरों के प्रतिरूप और तीव्रता तय करते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिक्कों की एक गड्डी को तीन अलग-अलग सतहों पर समान बल से धकेला जाता है। वह किस सतह पर सबसे अधिक दूरी तय करेगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खुरदुरे सीमेंट के फ़र्श पर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लकड़ी की मेज़ पर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पॉलिश किए संगमरमर के फ़र्श पर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों पर समान दूरी तय करेगी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धकेलने वाले बल से अलग होने के बाद गड्डी पर केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण बल</span><span style=\"font-family:'Mangal'\"> लगता है, जो उसकी गति का विरोध करके उसे धीमा करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सतह जितनी </span><span style=\"font-weight:bold;font-family:'Mangal'\">चिकनी</span><span style=\"font-family:'Mangal'\"> होती है, घर्षण बल उतना ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए वेग </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीरे-धीरे</span><span style=\"font-family:'Mangal'\"> घटता है और गड्डी अधिक दूर जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों में पॉलिश किया संगमरमर का फ़र्श सबसे चिकना है, इसलिए वहाँ घर्षण सबसे कम है; खुरदुरे सीमेंट के फ़र्श पर घर्षण सबसे अधिक और दूरी सबसे कम होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान बल का अर्थ समान दूरी नहीं है, क्योंकि प्रत्येक सतह पर घर्षण भिन्न होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गड्डी पॉलिश किए संगमरमर के फ़र्श पर सबसे अधिक दूरी तय करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक प्रजनन करने वाली किसी जाति की समष्टि में लक्षण A 10% व्यक्तियों में और लक्षण B 60% में पाया जाता है। कौन-सा लक्षण पहले उत्पन्न हुआ होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लक्षण A, क्योंकि दुर्लभ लक्षण सदैव पुराने होते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लक्षण B, क्योंकि वह अधिक पीढ़ियों तक प्रतिकृत हुआ है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों एक साथ उत्पन्न हुए</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ नहीं कहा जा सकता, क्योंकि अलैंगिक प्रजनन में विभिन्नता होती ही नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि एक जीवाणु विभाजित हो और बने दोनों जीवाणु फिर विभाजित हों, तो बने चारों जीवाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत समान</span><span style=\"font-family:'Mangal'\"> होते हैं; उनके बीच अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मामूली</span><span style=\"font-family:'Mangal'\"> होते हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">DNA प्रतिकृति की छोटी त्रुटियों</span><span style=\"font-family:'Mangal'\"> से उत्पन्न होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अलैंगिक प्रजनन करने वाली जाति में विभिन्नताएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीरे-धीरे</span><span style=\"font-family:'Mangal'\"> प्रकट होती हैं और कोई नया लक्षण समष्टि में तभी फैलता है जब वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीढ़ी-दर-पीढ़ी प्रतिकृत</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समष्टि के </span><span style=\"font-weight:bold;font-family:'Mangal'\">60%</span><span style=\"font-family:'Mangal'\"> में उपस्थित लक्षण केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span><span style=\"font-family:'Mangal'\"> में उपस्थित लक्षण की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक पीढ़ियों</span><span style=\"font-family:'Mangal'\"> में प्रतिकृत हुआ होगा, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">लक्षण B पहले उत्पन्न हुआ</span><span style=\"font-family:'Mangal'\"> और लक्षण A नई विभिन्नता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ लैंगिक प्रजनन शामिल नहीं है, और अलैंगिक प्रजनन में (मामूली) विभिन्नता होती ही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लक्षण B के पहले उत्पन्न होने की संभावना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): वसा और तेल युक्त खाद्य पदार्थों को वायुरोधी डिब्बों में रखने से उनका खराब होना धीमा हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): वसा और तेल ऑक्सीकृत होने पर विकृतगंधी हो जाते हैं और उनकी गंध और स्वाद बदल जाते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वसा और तेल ऑक्सीकृत</span><span style=\"font-family:'Mangal'\"> होने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">विकृतगंधी (रैन्सिड)</span><span style=\"font-family:'Mangal'\"> हो जाते हैं और उनकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंध और स्वाद बदल</span><span style=\"font-family:'Mangal'\"> जाते हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन को </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायुरोधी डिब्बों</span><span style=\"font-family:'Mangal'\"> में रखने से वायु की ऑक्सीजन से उसका संपर्क सीमित होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीकरण धीमा</span><span style=\"font-family:'Mangal'\"> हो जाता है। यही कारण है कि विकृतगंधिता देर से होती है → A सत्य है, और R इसकी व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी कारण ऑक्सीकरण रोकने वाले पदार्थ, जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिऑक्सीकारक</span><span style=\"font-family:'Mangal'\"> कहते हैं, प्रायः वसा और तेल युक्त खाद्य पदार्थों में मिलाए जाते हैं, और चिप्स के पैकेटों में नाइट्रोजन जैसी गैस भरी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधी सड़क पर चलता एक स्कूटर t = 4 s पर 8 m की स्थिति पर और t = 10 s पर 50 m की स्थिति पर है। इन दोनों क्षणों के बीच उसके औसत वेग का परिमाण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 m/s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.4 m/s</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत वेग = विस्थापन ÷ समय अंतराल</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन = 50 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 m</span><span style=\"font-family:'Mangal'\">; समय अंतराल = 10 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत वेग = 42 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्यान दें: 8.4 m/s तब आता है जब 6 s के स्थान पर 5 s से भाग दिया जाए, और 5 m/s तब जब अंतिम स्थिति को कुल समय से भाग दिया जाए (50 ÷ 10)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः औसत वेग 7 m/s है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): बीज के अंकुरण पर जड़ नीचे जाती है और तना ऊपर वायु में आता है; यदि वृद्धि रोक दी जाए तो यह दिशात्मक गति नहीं होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): छुई-मुई की पत्तियों का स्पर्श पर मुड़ना एक त्वरित गति है जिसमें वृद्धि शामिल नहीं होती।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंकुरित हो रहे नवोद्भिद की दिशात्मक गति (</span><span style=\"font-weight:bold;font-family:'Mangal'\">जड़ का नीचे जाना, तने का ऊपर आना</span><span style=\"font-family:'Mangal'\">) </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि के कारण</span><span style=\"font-family:'Mangal'\"> होती है; वृद्धि रोक देने पर यह गति नहीं होगी → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पर्श की अनुक्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">छुई-मुई</span><span style=\"font-family:'Mangal'\"> की पत्तियों की गति </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वरित है और उसमें वृद्धि शामिल नहीं</span><span style=\"font-family:'Mangal'\"> → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु R पादप गति के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरे</span><span style=\"font-family:'Mangal'\"> प्रकार (वृद्धि से स्वतंत्र) का वर्णन करता है; यह नहीं समझाता कि नवोद्भिद की गति वृद्धि पर क्यों निर्भर है। पौधे ये दो भिन्न प्रकार की गतियाँ दर्शाते हैं: एक वृद्धि पर निर्भर और दूसरी उससे स्वतंत्र।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक माली किसी वृक्ष की पुरानी छाल से गोंद रिसते और पुरानी पत्तियाँ झड़ते देखता है। पौधों में उत्सर्जन का सही वर्णन निम्नलिखित में से कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे अपनी जड़ों में वृक्क जैसे अंगों से रस के अपशिष्ट छानते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे अपने आसपास की मिट्टी में कभी कोई अपशिष्ट पदार्थ नहीं छोड़ते</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे कुछ अपशिष्ट उत्पादों को रेज़िन और गोंद के रूप में, विशेषकर पुराने जाइलम में, और अंततः झड़ जाने वाली पत्तियों में संचित करते हैं; प्रकाश संश्लेषण की ऑक्सीजन स्वयं एक अपशिष्ट उत्पाद है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों में कोई अपशिष्ट उत्पाद होता ही नहीं, क्योंकि वे अपना भोजन स्वयं बनाते हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे उत्सर्जन के लिए जंतुओं से </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिल्कुल भिन्न युक्तियाँ</span><span style=\"font-family:'Mangal'\"> अपनाते हैं; उनमें वृक्क नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> को स्वयं </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश संश्लेषण में बना अपशिष्ट उत्पाद</span><span style=\"font-family:'Mangal'\"> माना जा सकता है, और पौधे अतिरिक्त जल वाष्पोत्सर्जन से निकालते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनेक पादप अपशिष्ट कोशिकीय रिक्तिकाओं में या </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंततः झड़ जाने वाली पत्तियों</span><span style=\"font-family:'Mangal'\"> में संचित होते हैं; अन्य अपशिष्ट </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेज़िन और गोंद के रूप में, विशेषकर पुराने जाइलम में</span><span style=\"font-family:'Mangal'\">, संचित होते हैं। यही माली को छाल से रिसता दिखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे अपने आसपास की </span><span style=\"font-weight:bold;font-family:'Mangal'\">मिट्टी में भी कुछ अपशिष्ट पदार्थ उत्सर्जित</span><span style=\"font-family:'Mangal'\"> करते हैं, अतः विकल्प B गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही वर्णन है रेज़िन, गोंद और झड़ने वाली पत्तियों में संचय, तथा ऑक्सीजन का अपशिष्ट होना </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में पाचन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यकृत से आया पित्त रस आमाशय से आए अम्लीय भोजन को क्षारीय बना देता है ताकि अग्न्याशयी एंज़ाइम कार्य कर सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. आमाशय में हाइड्रोक्लोरिक अम्ल अम्लीय माध्यम बनाता है जो पेप्सिन एंज़ाइम की क्रिया को सुगम बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बाघ जैसे माँसाहारियों की छोटी आँत शाकाहारियों से लंबी होती है, क्योंकि माँस घास की तुलना में पचाना कठिन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आमाशय से आने वाला भोजन अम्लीय होता है और अग्न्याशयी एंज़ाइमों के कार्य के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारीय</span><span style=\"font-family:'Mangal'\"> बनाना पड़ता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">यकृत का पित्त रस</span><span style=\"font-family:'Mangal'\"> वसा के इमल्सीकरण के अतिरिक्त यह कार्य भी करता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जठर ग्रंथियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोक्लोरिक अम्ल</span><span style=\"font-family:'Mangal'\"> स्रावित करती हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्लीय माध्यम बनाकर प्रोटीन-पाचक एंज़ाइम पेप्सिन की क्रिया को सुगम</span><span style=\"font-family:'Mangal'\"> बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. घास खाने वाले शाकाहारियों को सेलुलोज़ पचाने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी</span><span style=\"font-family:'Mangal'\"> छोटी आँत चाहिए; </span><span style=\"font-weight:bold;font-family:'Mangal'\">माँस पचाना आसान</span><span style=\"font-family:'Mangal'\"> है, इसलिए बाघ जैसे माँसाहारियों की छोटी आँत </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटी</span><span style=\"font-family:'Mangal'\"> होती है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्रा तालाब के जल में एक सप्ताह घास भिगोकर हे-इन्फ़्यूज़न बनाती है और उसकी एक बूँद सूक्ष्मदर्शी से देखती है। उसे एक एककोशिकीय जीव दिखता है जिसमें सुस्पष्ट केंद्रक है, कोशिका भित्ति नहीं है, और जो जल में सक्रिय रूप से गति कर रहा है। यह जीव जिस जगत से है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोनेरा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटिस्टा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कवक (फंजाई)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लांटी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हे-इन्फ़्यूज़न</span><span style=\"font-family:'Mangal'\"> (ठहरे या तालाब के जल में एक सप्ताह भिगोई घास, भूसा या चारा) का उपयोग क्रियाकलाप 12.5 में सूक्ष्मदर्शी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवित प्रोटिस्ट</span><span style=\"font-family:'Mangal'\"> देखने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी </span><span style=\"font-weight:bold;font-family:'Mangal'\">एककोशिकीय यूकैरियोट</span><span style=\"font-family:'Mangal'\"> (केंद्रक वाली कोशिकाएँ) जिनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका भित्ति नहीं होती, या सेलुलोज़ की कोशिका भित्ति</span><span style=\"font-family:'Mangal'\"> होती है, जगत </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटिस्टा</span><span style=\"font-family:'Mangal'\"> में रखे जाते हैं; ये जल या नम स्थानों में रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जगत मोनेरा में एककोशिकीय </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोकैरियोट</span><span style=\"font-family:'Mangal'\"> (सुस्पष्ट केंद्रक रहित) आते हैं, अतः केंद्रक वाला यह जीव मोनेरा का नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कवक और पादप बिना कोशिका भित्ति के स्वतंत्र गतिशील एकल कोशिकाएँ नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह जीव प्रोटिस्टा का है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन कार्बन वाले यौगिक के नाम को उसमें उपस्थित प्रकार्यात्मक समूह से सुमेलित कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789800739689_image002.png\" width=\"269\" height=\"130\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(i), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन यौगिक का नाम मूल कार्बन शृंखला के नाम (तीन कार्बन → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोपेन</span><span style=\"font-family:'Mangal'\">) में प्रकार्यात्मक समूह दर्शाने वाला प्रत्यय जोड़कर बनता है; यदि प्रत्यय स्वर से शुरू होता है, तो शृंखला के नाम का अंतिम 'e' हटा दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) प्रत्यय </span><span style=\"font-weight:bold;font-family:'Mangal'\">-al</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐल्डिहाइड</span><span style=\"font-family:'Mangal'\">: propane − e + al = </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोपेनैल</span><span style=\"font-family:'Mangal'\"> → (iii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) प्रत्यय </span><span style=\"font-weight:bold;font-family:'Mangal'\">-one</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">कीटोन</span><span style=\"font-family:'Mangal'\">: propane − e + one = </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोपेनोन</span><span style=\"font-family:'Mangal'\"> → (iv).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) प्रत्यय </span><span style=\"font-weight:bold;font-family:'Mangal'\">-oic acid</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बोक्सिलिक अम्ल</span><span style=\"font-family:'Mangal'\">: </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोपेनोइक अम्ल</span><span style=\"font-family:'Mangal'\"> → (i).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) असंतृप्त शृंखला के लिए 'ane' का स्थान 'ene' (द्विबंध) या </span><span style=\"font-weight:bold;font-family:'Mangal'\">'yne' (त्रिबंध)</span><span style=\"font-family:'Mangal'\"> लेता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोपाइन</span><span style=\"font-family:'Mangal'\"> → (ii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन लाखों स्थायी यौगिक बनाता है, परंतु सिलिकॉन के हाइड्रोजन-यौगिक अत्यधिक अभिक्रियाशील होते हैं, जबकि सिलिकॉन की संयोजकता भी चार है। इसका मुख्य कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन की संयोजकता छह है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिलिकॉन हाइड्रोजन से बंध नहीं बना सकता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन धातु है और सिलिकॉन अधातु</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन परमाणु छोटा है, इसलिए कार्बन-कार्बन बंध बहुत प्रबल होते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन अन्य कार्बन परमाणुओं से जुड़कर लंबी शृंखलाएँ बनाता है; इस गुण को </span><span style=\"font-weight:bold;font-family:'Mangal'\">शृंखलन</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन परमाणु छोटा</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए उसका नाभिक साझा इलेक्ट्रॉन युग्मों को दृढ़ता से पकड़े रखता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन-कार्बन बंध बहुत प्रबल और स्थायी</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिलिकॉन के परमाणु बड़े होते हैं, इसलिए उनके बंध दुर्बल होते हैं, और सात-आठ परमाणुओं की शृंखला वाले सिलिकॉन-हाइड्रोजन यौगिक अत्यधिक अभिक्रियाशील होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन की संयोजकता चार है (छह नहीं), सिलिकॉन हाइड्रोजन से बंध बनाता है, और कार्बन अधातु है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार्बन परमाणु के छोटे आकार से प्रबल और स्थायी बंध बनते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुजाकार काँच के प्रिज़्म से प्रकाश के अपवर्तन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पहली सतह पर, जहाँ किरण वायु से काँच में प्रवेश करती है, वह अभिलंब की ओर मुड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दूसरी सतह पर, जहाँ किरण काँच से वायु में जाती है, वह अभिलंब से दूर मुड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रिज़्म के दो पार्श्व फलकों के बीच के कोण को विचलन कोण कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्रियाकलाप 10.1 में पहली सतह (AB) पर प्रिज़्म में प्रवेश करती किरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु से काँच</span><span style=\"font-family:'Mangal'\"> में जाती है और अपवर्तन पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिलंब की ओर मुड़ती</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दूसरी सतह (AC) पर किरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">काँच से वायु</span><span style=\"font-family:'Mangal'\"> में जाती है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिलंब से दूर मुड़ती</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दो पार्श्व फलकों के बीच का कोण </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रिज़्म कोण</span><span style=\"font-family:'Mangal'\"> (A) है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">विचलन कोण</span><span style=\"font-family:'Mangal'\"> (D) निर्गत किरण की दिशा और आपतित किरण की दिशा के बीच का कोण है, जो प्रिज़्म की विशेष आकृति से बनता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लद्दाख की पुगा घाटी के गर्म जल-स्रोत ठंडी जलवायु में भी लगभग जल के क्वथनांक पर बने रहते हैं। जीवन की उत्पत्ति का अध्ययन करने वाले वैज्ञानिक ऐसे गर्म जल-स्रोतों में विशेष रुचि लेते हैं, क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वहाँ के जल में कोई जीव नहीं होता, इसलिए यह दर्शाता है कि जीवन से पहले पृथ्वी कैसी थी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वहाँ रहने वाले जीव अधिकतर शीत-प्रेमी शैवाल हैं जो हिमयुगों में बचे रहे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनकी पर्यावरणीय परिस्थितियाँ लगभग 3.5 अरब वर्ष पहले की प्रारंभिक पृथ्वी जैसी लगती हैं, और वहाँ थर्मोफाइल नामक ताप-प्रेमी जीवाणु रहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवन की उत्पत्ति महासागरों में हुई मानी जाती है, और गर्म जल-स्रोत महासागरों से जुड़े हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह व्यापक रूप से स्वीकार है कि जीवन की उत्पत्ति जल में हुई; कुछ शोधकर्ता मानते हैं कि यह महासागरों के बजाय </span><span style=\"font-weight:bold;font-family:'Mangal'\">बदलती परिस्थितियों वाले छोटे जल-कुंडों</span><span style=\"font-family:'Mangal'\">, जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्म जल-स्रोतों</span><span style=\"font-family:'Mangal'\">, में हुई होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लद्दाख की पुगा घाटी</span><span style=\"font-family:'Mangal'\"> के गर्म जल-स्रोत ठंडी जलवायु में भी बहुत उच्च ताप बनाए रखते हैं, और उनकी परिस्थितियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग 3.5 अरब वर्ष पहले की प्रारंभिक पृथ्वी जैसी</span><span style=\"font-family:'Mangal'\"> लगती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन गर्म जल-स्रोतों में रहने वाले जीव अधिकतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">थर्मोफाइल नामक ताप-प्रेमी जीवाणु</span><span style=\"font-family:'Mangal'\"> हैं, शीत-प्रेमी शैवाल नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये स्रोत यह समझने की प्राकृतिक प्रयोगशालाएँ हैं कि पहली कोशिकाएँ कैसे बनी होंगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये स्रोत प्रारंभिक पृथ्वी जैसी परिस्थितियाँ रखते हैं और थर्मोफाइल के आवास हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र विद्यालय के प्रकाश सूक्ष्मदर्शी से प्याज़ की झिल्ली की कोशिकाएँ और उनके केंद्रक स्पष्ट देख ल
