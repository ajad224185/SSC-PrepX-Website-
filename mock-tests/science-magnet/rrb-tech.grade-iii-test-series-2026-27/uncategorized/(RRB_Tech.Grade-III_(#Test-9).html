<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>19.) RRB Tech.Grade-III (#Test-9 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राहुल बिंदु A से चलकर 5 km उत्तर की ओर जाता है। फिर वह दाएँ मुड़कर 4 km चलता है, बाएँ मुड़कर 7 km चलता है, और अंत में दाएँ मुड़कर 5 km चलकर बिंदु B पर पहुँचता है। बिंदु A और बिंदु B के बीच न्यूनतम दूरी कितनी है, और बिंदु B, बिंदु A के सापेक्ष किस दिशा में है? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 km, उत्तर-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, उत्तर-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, उत्तर-पश्चिम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 km, उत्तर-पूर्व</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km उत्तर → (0, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 4 km → (4, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके बाईं ओर मुड़ना → उत्तर, 7 km → (4, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 5 km → B = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">9, 12</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A से 9 km पूर्व और 12 km उत्तर में है → B, A के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पूर्व</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूनतम दूरी AB = √(9² + 12²) = √(81 + 144) = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(21 km चली गई कुल दूरी है, न्यूनतम दूरी नहीं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km, उत्तर-पूर्व (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 13 33 73 153 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">313</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">303</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">323</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">306</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रमागत पदों के अंतर ज्ञात करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33 − 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">73 − 33 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">153 − 73 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span><span style=\"font-family:'Mangal'\"> → प्रत्येक अंतर पिछले अंतर का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुना</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला अंतर = 80 × 2 = 160 → अगला पद = 153 + 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">313</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">313 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WD - TG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR - EU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LT - IX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK - MN</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WD − TG: W − 3 = T, D + 3 = G → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR − EU: H − 3 = E, R + 3 = U → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK − MN: P − 3 = M, K + 3 = N → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LT − IX: L − 3 = I, T + 4 = X → (−3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (−3, +3) का पालन करते हैं; केवल LT − IX नहीं (T + 3 = W होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">LT - IX (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में ‘OVEN’ को ‘6218’ और ‘MOVE’ को ‘5621’ लिखा जाता है। उसी कूट भाषा में ‘N’ का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का कूट एक अंक है (आवश्यक नहीं कि उसी क्रम में हो)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OVEN → 6218 और MOVE → 5621</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों शब्दों में उभयनिष्ठ अक्षर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">O, V, E</span><span style=\"font-family:'Mangal'\">; दोनों कूटों में उभयनिष्ठ अंक: </span><span style=\"font-weight:bold;font-family:'Mangal'\">6, 2, 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः O, V, E के कूट 6, 2, 1 हैं (किसी क्रम में)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OVEN में शेष अक्षर N और 6218 में शेष अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> है → N = 8 (इसी प्रकार M = 5).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘N’ का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 विद्यार्थियों की एक कक्षा में रिया का स्थान ऊपर से 17वाँ है। सोनू का स्थान रिया से 5 स्थान नीचे है। कक्षा में सोनू का स्थान नीचे से कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26वाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28वाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22वाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27वाँ</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिया ऊपर से 17वें स्थान पर है; सोनू उससे 5 स्थान नीचे है → सोनू का ऊपर से स्थान = 17 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22वाँ</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे से स्थान = (कुल विद्यार्थी) − (ऊपर से स्थान) + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 48 − 22 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(26वाँ और 28वाँ ‘+ 1’ को भूलने या दो बार गिनने से आते हैं; 22वाँ ऊपर से स्थान है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सोनू का नीचे से स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">27वाँ (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H, L का पिता है। F, H की पत्नी है। T, F की माता है। L, M का भाई है। T का M से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की माता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, H की पत्नी है → F और H पति-पत्नी हैं; H, L का पिता है, अतः F, L की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L, M का भाई है → L और M के माता-पिता एक ही हैं → F, M की भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, F की माता है → T, M की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता की माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: T, M से दो पीढ़ी ऊपर है (बहन नहीं), T, F की माता है, M की पत्नी की माता नहीं (विकल्प B), और T का विवाह M के भाई से नहीं हुआ है (विकल्प D)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः T, M की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता की माता (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HILQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TUXB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCFK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NORW</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HILQ: H + 1 = I, I + 3 = L, L + 5 = Q → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCFK: B + 1 = C, C + 3 = F, F + 5 = K → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NORW: N + 1 = O, O + 3 = R, R + 5 = W → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TUXB: T + 1 = U, U + 3 = X, X + 4 = B (24 + 4 = 28 → 28 − 26 = 2 = B) → (+1, +3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+1, +3, +5) का पालन करते हैं; केवल TUXB नहीं (X + 5 = C होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">TUXB (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनु बिंदु A से चलकर 21 km पूर्व की ओर गाड़ी चलाता है। फिर वह दाएँ मुड़कर 20 km चलता है, पुनः दाएँ मुड़कर 23 km चलता है। फिर वह दाएँ मुड़कर 25 km चलता है। अंत में वह दाएँ मुड़कर 2 km चलता है और बिंदु P पर रुकता है। बिंदु A पर पुनः पहुँचने के लिए उसे कितनी दूर (न्यूनतम दूरी) और किस दिशा में गाड़ी चलानी चाहिए? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 km दक्षिण की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km दक्षिण की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km दक्षिण की ओर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 km दक्षिण की ओर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 km पूर्व → (21, 0)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके दाईं ओर मुड़ना → दक्षिण, 20 km → (21, −20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके दाईं ओर मुड़ना → पश्चिम, 23 km → (−2, −20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम की ओर मुख करके दाईं ओर मुड़ना → उत्तर, 25 km → (−2, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 2 km → P = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, 5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, A से ठीक 5 km उत्तर में है, अतः A पर पहुँचने के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 km दक्षिण की ओर</span><span style=\"font-family:'Mangal'\"> चलना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 km दक्षिण की ओर (विकल्प C)</span><span style=\"font-family:'Mangal'\"> चलना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JTS, SCB, BLK, KUT, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CDT</sp "}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'green tea cup' को 'la po ki', 'hot tea now' को 'ki mo ru' और 'cup of hot' को 'sa mo la' लिखा जाता है। (सभी कूट केवल दो अक्षरों के हैं।) उसी भाषा में 'green' का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">la</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ki</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">po</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">mo</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो वाक्यों में उभयनिष्ठ शब्द और उन्हीं दो वाक्यों में उभयनिष्ठ कूट ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1 और 2: उभयनिष्ठ शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">tea</span><span style=\"font-family:'Mangal'\">, उभयनिष्ठ कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">ki</span><span style=\"font-family:'Mangal'\"> → tea = ki</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 2 और 3: उभयनिष्ठ शब्द </span><span style=\"font-weight:bold;font-family:'Mangal'\">hot</span><span style=\"font-family:'Mangal'\">, उभयनिष्ठ कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">mo</span><span style=\"font-family:'Mangal'\"> → hot = mo</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1 और 3: उभयनिष्ठ श e:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B का अर्थ है कि ‘A, B का भाई है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P % Q − R @ S + T’ है, तो P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री के पति का पिता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी का पिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी का पिता</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P % Q − R @ S + T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P % Q → P, Q का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q − R → Q, R का भाई है। Q और R भाई-बहन हैं, अतः उनके माता-पिता समान हैं। इसलिए P, R का भी पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R @ S → R, S की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S + T → S, T का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, R का पिता है, R, S की पत्नी है और S, T का पुत्र है → P, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T के पुत्र की पत्नी का पिता (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह व्यक्ति A, B, C, D, E और F एक पंक्ति में दक्षिण की ओर मुख करके बैठे हैं। B के दाईं ओर केवल दो व्यक्ति बैठे हैं। D, B के बाईं ओर दूसरे स्थान पर बैठा है। B और F के बीच केवल एक व्यक्ति बैठा है। A, F के ठीक बाईं ओर बैठा है। E पंक्ति के किसी एक छोर पर बैठा है। C के दाईं ओर दूसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख दक्षिण की ओर है, अतः प्रत्येक व्यक्ति का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दायाँ पश्चिम की ओर</span><span style=\"font-family:'Mangal'\"> और बायाँ पूर्व की ओर है। सीटों को 1 (पश्चिमी छोर) से 6 (पूर्वी छोर) तक क्रमांक दें: ‘दाएँ’ = छोटा सीट नंबर, ‘बाएँ’ = बड़ा सीट नंबर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B के दाईं ओर केवल दो व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, B के बाईं ओर दूसरे स्थान पर → D = 3 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और F के बीच केवल एक व्यक्ति → F = 1 या 5; सीट 5 पर D है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, F के ठीक बाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E किसी एक छोर पर; सीट 1 पर F है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 6</span><span style=\"font-family:'Mangal'\">, और शेष सीट 4 </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> की है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (पश्चिम → पूर्व): </span><span style=\"font-weight:bold;font-family:'Mangal'\">F – A – B – C – D – E</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C (सीट 4) के दाईं ओर दूसरा → सीट 4 − 2 = 2 → A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः C के दाईं ओर दूसरे स्थान पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (विकल्प A)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H, I, J, K, L और M एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। K, J के ठीक दाईं ओर बैठा है। I के बाईं ओर से गिनने पर I और M के बीच केवल दो व्यक्ति बैठे हैं। L, H के ठीक दाईं ओर बैठा है। H, I का निकटतम पड़ोसी नहीं है। J के ठीक बाईं ओर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख केंद्र की ओर है, अतः ‘दाएँ’ = दक्षिणावर्त (clockwise) और ‘बाएँ’ = वामावर्त (anticlockwise)। सीटों को दक्षिणावर्त 1 से 6 तक क्रमांक दें, </span><span style=\"font-weight:bold;font-family:'Mangal'\">J सीट 1 पर</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K, J के ठीक दाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I और M के बीच दो व्यक्ति (I के बाईं ओर से गिनने पर) → छह की वृत्ताकार व्यवस्था में I और M एक-दूसरे के </span><span style=\"font-weight:bold;font-family:'Mangal'\">सामने</span><span style=\"font-family:'Mangal'\"> बैठे हैं (3 सीट दूर)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L, H के ठीक दाईं ओर → L = H + 1; खाली सीटें 3, 4, 5, 6 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I और M को दो आमने-सामने की खाली सीटें चाहिए → केवल (3, 6), क्योंकि सीट 4 के सामने सीट 1 (J) है। अतः H और L सीट 4 और 5 पर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">H = 4, L = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H, I का पड़ोसी नहीं है → I ≠ 3 (3, सीट 4 के बगल में है) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">I = 6, M = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (J से दक्षिणावर्त): </span><span style=\"font-weight:bold;font-family:'Mangal'\">J – K – M – H – L – I</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J (सीट 1) के ठीक बाईं ओर (वामावर्त) सीट 6 → I.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः J के ठीक बाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">I (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HEZ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EAW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TPL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LHD</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EAW: E − 4 = A, A − 4 = W (1 − 4 = −3 → 26 − 3 = 23 = W) → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TPL: T − 4 = P, P − 4 = L → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LHD: L − 4 = H, H − 4 = D → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HEZ: H − 3 = E, E − 5 = Z (5 − 5 = 0 → 26 = Z) → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">−3, −5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (−4, −4) का पालन करते हैं; केवल HEZ नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">HEZ (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई अक्षर शृंखला को देखिए और प्रश्न का उत्तर दीजिए। गिनती केवल बाएँ से दाएँ की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) P A K E B D O U M I R F E C R N T O S T G L (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे कितने व्यंजन हैं, जिनमें से प्रत्येक के ठीक पहले एक स्वर है और ठीक बाद भी एक स्वर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वर A, E, I, O, U हैं; हमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वर – व्यंजन – स्वर</span><span style=\"font-family:'Mangal'\"> का पैटर्न चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला को बाएँ से दाएँ देखें और प्रत्येक व्यंजन के पहले और बाद का अक्षर जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> E → K के पहले A और बाद में E ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> I → M के पहले U और बाद में I ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E C R → C के बाद R (व्यंजन) है ✗; O S T → S के बाद T है ✗; O U M → U स्वर है, गिना नहीं जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी अन्य व्यंजन के दोनों ओर स्वर नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\"> व्यंजन हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U और V एक ही इमारत की सात अलग-अलग मंज़िलों पर रहते हैं। सबसे निचली मंज़िल की संख्या 1 है, उसके ऊपर की मंज़िल की संख्या 2 है, और इसी प्रकार सबसे ऊपरी मंज़िल की संख्या 7 है। T के ऊपर केवल दो व्यक्ति रहते हैं। S, T के ठीक नीचे रहता है। S और Q के बीच केवल दो व्यक्ति रहते हैं। V, P के ठीक ऊपर रहता है। U एक सम-संख्या वाली मंज़िल पर, R के ऊपर किसी मंज़िल पर रहता है। R सबसे निचली मंज़िल पर नहीं रहता है। V और U के बीच कितने व्यक्ति रहते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के ऊपर केवल दो व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, T के ठीक नीचे → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और Q के बीच दो व्यक्ति → Q = 4 + 3 = 7 या 4 − 3 = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V, P के ठीक ऊपर → V और P को दो क्रमागत खाली मंज़िलें चाहिए; U सम मंज़िल पर R के ऊपर है, और R ≠ 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति Q = 1: खाली मंज़िलें 2, 3, 6, 7 → (P, V) = (2, 3) या (6, 7); U सम (2 या 6) और R के ऊपर → यदि (P, V) = (2, 3), तो U = 6, R = 7, जो U के ऊपर है ✗; यदि (P, V) = (6, 7), तो U = 2, R = 3, जो U के ऊपर है ✗.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति Q = 7: खाली मंज़िलें 1, 2, 3, 6 → (P, V) = (1, 2) या (2, 3); U सम → यदि (P, V) = (2, 3), तो U = 6 और R = 1, परंतु R सबसे निचली मंज़िल पर नहीं है ✗ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">(P, V) = (1, 2), U = 6, R = 3</span><span style=\"font-family:'Mangal'\"> ✓.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (मंज़िल 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P, V, R, S, T, U, Q</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V (मंज़िल 2) और U (मंज़िल 6) के बीच: R, S, T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः V और U के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> व्यक्ति रहते हैं।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FKM : HHQ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTB : TQF</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : NMA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : NMZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : OMA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPW : NNA</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FKM → HHQ: F + 2 = H, K − 3 = H, M + 4 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTB → TQF: R + 2 = T, T − 3 = Q, B + 4 = F → नियम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, −3, +4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → NMA: L + 2 = N, P − 3 = M, W + 4 = A (23 + 4 = 27 → 27 − 26 = 1 = A) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → NMZ: W + 4 = A है, Z नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → OMA: L + 2 = N है, O नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPW → NNA: K + 2 = M है, N नहीं; P − 3 = M है, N नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">LPW : NMA (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UO 7, WR -2 से एक निश्चित प्रकार से संबंधित है। उसी प्रकार EK 12, GN 3 से संबंधित है। उसी तर्क के अनुसार VW 2 निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VX -5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XW -6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZ -7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GT -8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UO 7 → WR −2: U + 2 = W, O + 3 = R; 7 − 9 = −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EK 12 → GN 3: E + 2 = G, K + 3 = N; 12 − 9 = 3 → नियम: पहला अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">, दूसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\">, संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">−9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VW 2 → V + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, W + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">; 2 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−7</span><span style=\"font-family:'Mangal'\"> → XZ −7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य जाँचें: VX −5 (V, V + 2 नहीं है), XW −6 (W, W + 3 नहीं है), GT −8 (अक्षर नियम का पालन नहीं करते).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः VW 2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">XZ -7 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ बर्तन कप हैं। कोई कप प्लेट नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ बर्तन प्लेट नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कोई बर्तन प्लेट नहीं है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: बर्तन और कप के वृत्त एक-दूसरे को काटते हैं (कुछ बर्तन कप हैं), और प्लेट का वृत्त कप के वृत्त से पूरी तरह बाहर है (कोई कप प्लेट नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ बर्तन प्लेट नहीं हैं → जो बर्तन कप हैं, वे कभी प्लेट नहीं हो सकते (कोई कप प्लेट नहीं है), अतः कम से कम वे बर्तन प्लेट नहीं हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कोई बर्तन प्लेट नहीं है → जो बर्तन कप नहीं हैं, वे प्लेट हो सकते हैं; कथन इसे नहीं रोकते → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर TRAP, RCTV से एक निश्चित प्रकार से संबंधित है। उसी प्रकार KIND, FPKM से संबंधित है। उसी तर्क के अनुसार MOVE दिए गए विकल्पों में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OQXG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GXQP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HXQO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GXQO</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAP → RCTV: शब्द को उल्टा लिखें, PART, फिर प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">: P + 2 = R, A + 2 = C, R + 2 = T, T + 2 = V ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KIND → FPKM: उल्टा DNIK; D + 2 = F, N + 2 = P, I + 2 = K, K + 2 = M ✓ → नियम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">शब्द उल्टा करें, फिर प्रत्येक अक्षर +2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOVE → उल्टा EVOM; E + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, V + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, O + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> → GXQO</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य जाँचें: OQXG में उल्टा नहीं किया गया है, GXQP में P (M + 3) है, HXQO में H (E + 3) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः MOVE, </span><span style=\"font-weight:bold;font-family:'Mangal'\">GXQO (विकल्प D)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि संख्या 7364528 के प्रत्येक विषम अंक में 1 जोड़ा जाए और प्रत्येक सम अंक में से 2 घटाया जाए, तो इस प्रकार बनी नई संख्या में बाएँ से दूसरे और दाएँ से तीसरे अंकों का योग क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7364528 के अंक: 7, 3, 6, 4, 5, 2, 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विषम अंक + 1: 7 → 8, 3 → 4, 5 → 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सम अंक − 2: 6 → 4, 4 → 2, 2 → 0, 8 → 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई संख्या: </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 4 4 2 6 0 6</span><span style=\"font-family:'Mangal'\"> → 8442606</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से दूसरा: </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">; दाएँ से तीसरा: 6 (पहला), 0 (दूसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> (तीसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योग = 4 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट योग </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BQGZ EOLV HMQR KKVN ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIZJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIAJ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MIAJ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NJAJ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: B → E → H → K: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → K + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: Q → O → M → K: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → K − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: G → L → Q → V: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → V + 5 = 22 + 5 = 27 → 27 − 26 = 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चौथे अक्षर: Z → V → R → N: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span><span style=\"font-family:'Mangal'\"> → N − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIZJ, MIAJ और NJAJ में NIAJ से एक-एक अक्षर भिन्न है, अतः वे पैटर्न का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">NIAJ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक राजमिस्त्री एक घर की दीवारों की सफ़ेदी किसी पदार्थ X के विलयन से करता है। दो-तीन दिन बाद दीवारों पर चमकदार परत आ जाती है। X और चमकदार परत के लिए उत्तरदायी यौगिक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम हाइड्रॉक्साइड और कैल्सियम कार्बोनेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम ऑक्साइड और कैल्सियम हाइड्रॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम कार्बोनेट और कैल्सियम ऑक्साइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम हाइड्रॉक्साइड और कैल्सियम सल्फेट</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बुझे चूने, कैल्सियम हाइड्रॉक्साइड, Ca(OH)₂</span><span style=\"font-family:'Mangal'\"> का विलयन, जो बिना बुझे चूने (कैल्सियम ऑक्साइड) की जल से अभिक्रिया से बनता है, दीवारों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">सफ़ेदी</span><span style=\"font-family:'Mangal'\"> में प्रयोग होता है; अतः X कैल्सियम हाइड्रॉक्साइड है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम हाइड्रॉक्साइड </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु की कार्बन डाइऑक्साइड से धीरे-धीरे अभिक्रिया</span><span style=\"font-family:'Mangal'\"> करके दीवारों पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम कार्बोनेट</span><span style=\"font-family:'Mangal'\"> की पतली परत बनाता है: Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम कार्बोनेट सफ़ेदी के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो-तीन दिन बाद</span><span style=\"font-family:'Mangal'\"> बनता है और दीवारों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">चमकदार परत</span><span style=\"font-family:'Mangal'\"> देता है; संगमरमर का सूत्र भी CaCO₃ है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम ऑक्साइड X बनाने का कच्चा माल है, स्वयं सफ़ेदी नहीं, और कैल्सियम सल्फेट की यहाँ कोई भूमिका नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X कैल्सियम हाइड्रॉक्साइड है और चमकदार परत कैल्सियम कार्बोनेट के कारण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सूर
