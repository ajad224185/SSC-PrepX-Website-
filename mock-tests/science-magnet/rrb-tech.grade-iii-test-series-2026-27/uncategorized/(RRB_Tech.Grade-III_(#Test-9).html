(d)-(iv)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रिका</span><span style=\"font-family:'Mangal'\"> केंद्रक के अंदर स्थित सघन गोल पिंड है जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">राइबोसोम की उप-इकाइयों का संश्लेषण</span><span style=\"font-family:'Mangal'\"> होता है &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) माइटोकॉन्ड्रिया की भीतरी झिल्ली अँगुली जैसे उभारों में मुड़ी होती है जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिस्टी</span><span style=\"font-family:'Mangal'\"> कहते हैं; ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक अभिक्रियाओं के लिए सतह क्षेत्रफल बढ़ाते हैं और ऊर्जा उत्पादन में सहायक</span><span style=\"font-family:'Mangal'\"> हैं &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ल्यूकोप्लास्ट</span><span style=\"font-family:'Mangal'\"> रंगहीन लवक हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टार्च, तेल या प्रोटीन जैसे भोजन का संचय</span><span style=\"font-family:'Mangal'\"> करते हैं (जैसे आलू की कोशिकाओं में स्टार्च) &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाइसोसोम</span><span style=\"font-family:'Mangal'\"> एकल झिल्ली से घिरी थैलियाँ हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐसे एंज़ाइमों से भरी होती हैं जो अनावश्यक प्रोटीन, कार्बोहाइड्रेट, वसा और कोशिका के क्षतिग्रस्त भागों तक को तोड़ देते हैं</span><span style=\"font-family:'Mangal'\"> &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(ii), (b)-(iv), (c)-(i), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 km/h की चाल से चलती एक बस गति-सीमा क्षेत्र में प्रवेश करती है और चालक उसे 20 s में एकसमान रूप से धीमा करके 54 km/h पर ले आता है। इन 20 s में बस का त्वरण और उसके द्वारा तय की गई दूरी क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.9 m/s² और 350 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.25 m/s² और 400 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+0.25 m/s² और 300 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.25 m/s² और 350 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेगों को SI मात्रकों में बदलते हैं: u = 72 km/h = (72 × 1000) / 3600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 m/s</span><span style=\"font-family:'Mangal'\"> और v = 54 km/h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत त्वरण a = (v − u)/t = (15 − 20) / 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−0.25 m/s²</span><span style=\"font-family:'Mangal'\">; ऋणात्मक चिह्न दर्शाता है कि त्वरण वेग की दिशा के विपरीत है (बस धीमी हो रही है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नियत त्वरण से तय दूरी: s = ut + ½at² = 20 × 20 + ½ × (−0.25) × 20² = 400 − 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">350 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: s = (औसत वेग) × t = ½(20 + 15) × 20 = 17.5 × 20 = 350 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्वरण −0.25 m/s² और दूरी 350 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातुओं के निष्कर्षण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पारा अपने अयस्क सिनाबार (HgS) से केवल वायु में गर्म करने से प्राप्त होता है, क्योंकि सक्रियता श्रेणी में नीचे स्थित धातुओं के ऑक्साइड केवल गर्म करने से धातु में अपचयित हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सोडियम, मैग्नीशियम और कैल्सियम अपने गलित क्लोराइडों के वैद्युत अपघटन से प्राप्त होते हैं, जिसमें धातु कैथोड पर जमा होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ऐलुमिनियम ऑक्साइड को कार्बन के साथ गर्म करके ऐलुमिनियम प्राप्त किया जा सकता है, क्योंकि कार्बन की ऑक्सीजन के प्रति बंधुता ऐलुमिनियम से अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सक्रियता श्रेणी में नीचे स्थित धातुएँ बहुत कम अभिक्रियाशील होती हैं, और उनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्साइड केवल गर्म करने से धातु में अपचयित</span><span style=\"font-family:'Mangal'\"> हो जाते हैं: सिनाबार पहले मरक्यूरिक ऑक्साइड में बदलता है, 2HgS + 3O₂ → 2HgO + 2SO₂, और आगे गर्म करने पर 2HgO → 2Hg + O₂ → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अत्यधिक अभिक्रियाशील धातुएँ वैद्युत अपचयन से प्राप्त होती हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम, मैग्नीशियम और कैल्सियम</span><span style=\"font-family:'Mangal'\"> अपने </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलित क्लोराइडों के वैद्युत अपघटन</span><span style=\"font-family:'Mangal'\"> से प्राप्त होते हैं, जिसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">धातु कैथोड पर जमा होती है</span><span style=\"font-family:'Mangal'\"> और ऐनोड पर क्लोरीन मुक्त होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन सोडियम, मैग्नीशियम, कैल्सियम और ऐलुमिनियम के ऑक्साइडों को अपचयित नहीं कर सकता</span><span style=\"font-family:'Mangal'\">, क्योंकि इन धातुओं की </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन के प्रति बंधुता कार्बन से अधिक</span><span style=\"font-family:'Mangal'\"> है; ऐलुमिनियम ऐलुमिनियम ऑक्साइड के वैद्युत अपचयन से प्राप्त होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वच्छ आकाश की स्थिति में पृथ्वी की सतह तक पहुँचने वाला अधिकतम सूर्यातप लगभग 1 kW/m² होता है। सूर्य की किरणों के लंबवत रखी 1 m² सतह द्वारा एक घंटे में प्राप्त सौर ऊर्जा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.6 × 10³ J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.0 × 10³ J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.6 × 10⁶ J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.4 × 10⁶ J</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊर्जा = तीव्रता × क्षेत्रफल × समय; यहाँ तीव्रता (सूर्यातप) 1 kW/m² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1000 J s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−1</span><span style=\"font-weight:bold;font-family:'Mangal'\"> m</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = 1 घंटा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3600 s</span><span style=\"font-family:'Mangal'\"> और क्षेत्रफल = 1 m².</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E = 1000 × 1 × 3600 = 3,600,000 J = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.6 × 10⁶ J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह ऊर्जा घरेलू बिजली के बिल में दर्शाई गई </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत की एक यूनिट</span><span style=\"font-family:'Mangal'\"> (1 kWh) के बराबर है, और लगभग उतनी ही है जितनी 5 kg बर्फ़ को पिघलाकर प्राप्त जल को 100°C तक गर्म करने में लगती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(अधिकतम सूर्यातप, 1 kW/m², सौर स्थिरांक लगभग 1.4 kW/m² से कम है क्योंकि कुछ ऊर्जा वायुमंडल द्वारा अवशोषित और प्रकीर्णित हो जाती है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्राप्त ऊर्जा 3.6 × 10⁶ J है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन यौगिकों के दहन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. खाना पकाने के बर्तनों की तली का काला पड़ना दर्शाता है कि स्टोव के वायु-छिद्र बंद हैं और ईंधन व्यर्थ जा रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ज्वाला केवल तब बनती है जब गैसीय पदार्थ जलते हैं; इसीलिए अँगीठी में कोयला कभी-कभी बिना ज्वाला के केवल लाल होकर दहकता है और ऊष्मा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. संतृप्त हाइड्रोकार्बन सदैव स्वच्छ नीली ज्वाला देते हैं, भले ही वायु की आपूर्ति सीमित हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. गैस या किरोसिन स्टोव में वायु-प्रवेश छिद्र होते हैं ताकि ऑक्सीजन-समृद्ध मिश्रण स्वच्छ नीली ज्वाला से जले; </span><span style=\"font-weight:bold;font-family:'Mangal'\">बर्तनों की तली का काला पड़ना दर्शाता है कि वायु-छिद्र बंद हैं और ईंधन व्यर्थ जा रहा है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">ज्वाला केवल तब बनती है जब गैसीय पदार्थ जलते हैं</span><span style=\"font-family:'Mangal'\">; अँगीठी में कोयला या लकड़ी का कोयला कभी-कभी </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिना ज्वाला के केवल लाल होकर दहकता है और ऊष्मा देता है</span><span style=\"font-family:'Mangal'\">, जबकि लकड़ी या लकड़ी के कोयले में उपस्थित वाष्पशील पदार्थ शुरू में ज्वाला के साथ जलते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. संतृप्त हाइड्रोकार्बन प्रायः स्वच्छ ज्वाला देते हैं, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु की आपूर्ति सीमित होने पर संतृप्त हाइड्रोकार्बनों का भी अपूर्ण दहन होता है और कज्जली (धुएँदार) ज्वाला बनती है</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 kg और 3 kg द्रव्यमान के दो बक्से एक घर्षणरहित क्षैतिज सतह पर रखे हैं और एक हल्की डोरी से जुड़े हैं। 10 N का एक क्षैतिज बल 2 kg वाले बक्से को खींचता है जिससे दोनों बक्से साथ-साथ चलते हैं। डोरी में तनाव है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 N</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों बक्सों और डोरी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही निकाय</span><span style=\"font-family:'Mangal'\"> मानने पर आंतरिक बल (तनाव) पर विचार करने की आवश्यकता नहीं होती और केवल बाह्य बल मायने रखता है: a = F/(m₁ + m₂) = 10 / (2 + 3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 kg वाले बक्से को केवल डोरी का तनाव T खींचता है, अतः T = m₂a = 3 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 N</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 kg वाले बक्से से जाँच: उस पर नेट बल F − T = 10 − 6 = 4 N है, जिससे a = 4 / 2 = 2 m/s², वही त्वरण।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के तीसरे नियम से डोरी 2 kg वाले बक्से को पीछे और 3 kg वाले बक्से को आगे समान बल T से खींचती है; बक्सों का अलग-अलग विश्लेषण भी वही परिणाम देता है जो उन्हें एक निकाय मानने पर मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः डोरी में तनाव 6 N है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्राकृतिक स्रोत को उसमें उपस्थित अम्ल से सुमेलित कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789928378966_image002.png\" width=\"269\" height=\"140\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(ii), (d)-(i)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(iii), (d)-(i)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">इमली</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">टार्टरिक अम्ल</span><span style=\"font-family:'Mangal'\"> होता है → (iv).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">टमाटर</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्ज़ैलिक अम्ल</span><span style=\"font-family:'Mangal'\"> होता है → (ii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिच्छू बूटी (नेटल)</span><span style=\"font-family:'Mangal'\"> की पत्तियों के डंक वाले रोम </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेथेनोइक अम्ल</span><span style=\"font-family:'Mangal'\"> प्रविष्ट कराते हैं, जिससे जलन वाला दर्द होता है → (iii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">खट्टे दूध (दही)</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैक्टिक अम्ल</span><span style=\"font-family:'Mangal'\"> होता है → (i).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(सिरके में ऐसीटिक अम्ल, और संतरे तथा नींबू में सिट्रिक अम्ल होता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iv), (b)-(ii), (c)-(iii), (d)-(i) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बोहाइड्रेट से भरपूर भोजन के बाद एक स्वस्थ व्यक्ति के रक्त में शर्करा का स्तर बढ़ जाता है। निम्नलिखित में से कौन-सा शरीर की अनुक्रिया का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्न्याशय अधिक इंसुलिन छोड़ता है, और शर्करा घटने पर कम (पुनर्भरण नियंत्रण)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिवृक्क ग्रंथियाँ ऐड्रिनैलिन स्रावित करती हैं, जो अतिरिक्त रक्त शर्करा को वसा में बदल देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थायरॉइड ग्रंथि अधिक थायरॉक्सिन स्रावित करती है, जो रक्त से शर्करा हटा देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्न्याशय रक्त शर्करा के स्तर की परवाह किए बिना पूरे दिन एक नियत दर से इंसुलिन स्रावित करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हॉर्मोन के स्राव का समय और मात्रा पुनर्भरण (फीडबैक) क्रियाविधियों द्वारा नियंत्रित होते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब रक्त में शर्करा का स्तर बढ़ता है, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अग्न्याशय की कोशिकाएँ इसका पता लगाती हैं</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक इंसुलिन बनाकर</span><span style=\"font-family:'Mangal'\"> अनुक्रिया करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैसे-जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">रक्त शर्करा का स्तर घटता है, इंसुलिन का स्राव कम हो जाता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि इंसुलिन उचित मात्रा में स्रावित न हो तो रक्त शर्करा का स्तर बढ़ जाता है और अनेक हानिकारक प्रभाव होते हैं, इसीलिए मधुमेह के कुछ रोगियों को इंसुलिन के इंजेक्शन दिए जाते हैं; ऐड्रिनैलिन और थायरॉक्सिन रक्त शर्करा को इस प्रकार नियंत्रित नहीं करते, और इंसुलिन नियत दर से स्रावित नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अनुक्रिया अग्न्याशय द्वारा इंसुलिन का पुनर्भरण-नियंत्रित स्राव है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): लाइकेन वायु की गुणवत्ता मापने के लिए प्राकृतिक जैव-सूचक के रूप में प्रयोग किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): लाइकेन एक सहजीवी संबंध है जिसमें कवक साझेदार सुरक्षा देता है जबकि शैवाल साझेदार प्रकाश संश्लेषण करके भोजन देता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लाइकेन प्राकृतिक जैव-सूचक</span><span style=\"font-family:'Mangal'\"> हैं जिनसे वायु की गुणवत्ता मापी जाती है, क्योंकि वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु प्रदूषकों के साथ रंग बदलते हैं</span><span style=\"font-family:'Mangal'\"> → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाइकेन जैविक रूप से </span><span style=\"font-weight:bold;font-family:'Mangal'\">सहजीवी</span><span style=\"font-family:'Mangal'\"> हैं: एक साझेदार </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वपोषी शैवाल</span><span style=\"font-family:'Mangal'\"> और दूसरा </span><span style=\"font-weight:bold;font-family:'Mangal'\">परपोषी कवक</span><span style=\"font-family:'Mangal'\"> है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">कवक साझेदार सुरक्षा देता है</span><span style=\"font-family:'Mangal'\"> जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">शैवाल साझेदार प्रकाश संश्लेषण करके भोजन देता है</span><span style=\"font-family:'Mangal'\"> → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु R लाइकेन की संरचना बताता है; यह नहीं समझाता कि लाइकेन वायु की गुणवत्ता क्यों दर्शाते हैं (वह इसलिए कि वे प्रदूषकों की प्रतिक्रिया में रंग बदलते हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक घर में एक विद्युत इस्तरी, एक रूम हीटर और एक गीज़र, तीनों को मल्टी-प्लग के ज़रिए एक ही सॉकेट में लगाया जाता है। कुछ मिनट बाद उस परिपथ का फ़्यूज़ तार पिघल जाता है और आपूर्ति कट जाती है। सबसे संभावित कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युन्मय (लाइव) तार के उदासीन तार से सीधे संपर्क में आने से लघुपथन (शॉर्ट सर्किट) हुआ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आपूर्ति वोल्टेज 220 V से नीचे गिर गया, जिससे उपकरणों ने कम धारा ली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भू-संपर्क तार ने तीनों उपकरणों की धारा वहन की और फ़्यूज़ को गर्म कर दिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतिभारण (ओवरलोडिंग): एक ही सॉकेट में बहुत अधिक उपकरण जोड़ने से धारा सुरक्षित सीमा से अधिक हो गई, और जूल तापन से फ़्यूज़ पिघलकर परिपथ टूट गया</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत फ़्यूज़ सभी घरेलू परिपथों का एक महत्वपूर्ण घटक है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अतिभारण के कारण उपकरणों और परिपथ को होने वाली क्षति को रोकता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अतिभारण कभी-कभी एक ही सॉकेट में बहुत अधिक उपकरण जोड़ने से होता है</span><span style=\"font-family:'Mangal'\">। यहाँ एक सॉकेट पर तीन उच्च शक्ति वाले उपकरण धारा को परिपथ की निर्धारित सीमा से अधिक कर देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब धारा सुरक्षित सीमा से अधिक हो जाती है, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़्यूज़ में होने वाला जूल तापन उसे पिघला देता है, जिससे विद्युत परिपथ टूट जाता है</span><span style=\"font-family:'Mangal'\"> और आपूर्ति कट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लघुपथन के लिए विद्युन्मय और उदासीन तारों का सीधा संपर्क चाहिए, वोल्टेज गिरने से धारा घटती, और भू-संपर्क तार में सामान्यतः धारा नहीं बहती, अतः A, B और C गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः फ़्यूज़ अतिभारण के कारण पिघला </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20°C पर पदार्थों की विद्युत प्रतिरोधकता के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. धातुओं में चाँदी की प्रतिरोधकता सबसे कम (1.60 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) है, अतः वह सबसे अच्छी चालक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. नाइक्रोम, जो निकैल, क्रोमियम, मैंगनीज़ और लोहे की मिश्रधातु है, की प्रतिरोधकता (100 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−6</span><span style=\"font-family:'Mangal'\"> Ω m) उसकी घटक शुद्ध धातुओं से कहीं अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी चालक का प्रतिरोध ताप के साथ बदलता है, परंतु उसके पदार्थ की प्रतिरोधकता नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रतिरोधकता पदार्थ का अभिलाक्षणिक गुण है; धातुओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">चाँदी (1.60 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m) की प्रतिरोधकता सबसे कम</span><span style=\"font-family:'Mangal'\"> है, ताँबे (1.62 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) और ऐलुमिनियम (2.63 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) से भी कम, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे अच्छी चालक</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइक्रोम</span><span style=\"font-family:'Mangal'\"> की प्रतिरोधकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−6</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m</span><span style=\"font-family:'Mangal'\"> है, जो निकैल (6.84 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m), क्रोमियम (12.9 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) या लोहे (10.0 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) से कहीं अधिक है; मिश्रधातुओं की प्रतिरोधकता प्रायः उनकी घटक धातुओं से अधिक होती है, इसीलिए तापन अवयव मिश्रधातुओं के बनाए जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">किसी पदार्थ का प्रतिरोध और प्रतिरोधकता दोनों ताप के साथ बदलते हैं</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि लैंगिक क्रिया शरीरों का अत्यंत घनिष्ठ संपर्क है, अनेक रोग लैंगिक रूप से संचरित हो सकते हैं। निम्नलिखित में से कौन-सा लैंगिक संचरित संक्रमणों को उनके कारक के अनुसार सही वर्गीकृत करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिफ़िलिस (विषाणुजनित) और HIV-AIDS (जीवाणुजनित)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोनोरिया (जीवाणुजनित) और मस्से (विषाणुजनित)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोनोरिया (विषाणुजनित) और सिफ़िलिस (जीवाणुजनित)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्से (जीवाणुजनित) और HIV-AIDS (विषाणुजनित)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनेक रोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैंगिक रूप से संचरित</span><span style=\"font-family:'Mangal'\"> हो सकते हैं क्योंकि लैंगिक क्रिया शरीरों का अत्यंत घनिष्ठ संपर्क है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक संचरित </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवाणुजनित</span><span style=\"font-family:'Mangal'\"> संक्रमणों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोनोरिया और सिफ़िलिस</span><span style=\"font-family:'Mangal'\"> शामिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक संचरित </span><span style=\"font-weight:bold;font-family:'Mangal'\">विषाणुजनित</span><span style=\"font-family:'Mangal'\"> संक्रमणों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">मस्से और HIV-AIDS</span><span style=\"font-family:'Mangal'\"> शामिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, C और D में से प्रत्येक कम से कम एक संक्रमण को गलत प्रकार के कारक से जोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गोनोरिया जीवाणुजनित और मस्से विषाणुजनित हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि अकेला एक काम 30 दिनों में पूरा कर सकता है। सुनील रवि से 50% अधिक कार्यकुशल है। वे 8 दिनों तक साथ काम करते हैं, उसके बाद सुनील चला जाता है। रवि शेष काम अकेला और कितने दिनों में पूरा करेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि का 1 दिन का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुनील 50% अधिक कार्यकुशल है, अतः सुनील का 1 दिन का काम = 1/30 × 150% = 1.5/30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/20</span><span style=\"font-family:'Mangal'\"> (सुनील अकेला 20 दिन लेता है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों का मिलकर 1 दिन का काम = 1/30 + 1/20 = (2 + 3) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 दिनों में साथ किया गया काम = 8 × (1/12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष काम = 1 − 2/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि अकेला प्रतिदिन 1/30 काम करता है, अतः समय = (1/3) / (1/30) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: कार्यकुशलता का अनुपात रवि : सुनील = 2 : 3, अतः समय का अनुपात 3 : 2 → 30 और 20 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रवि शेष काम </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> दिनों में पूरा करेगा।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बैंक 20% वार्षिक दर से अर्धवार्षिक संयोजित ब्याज देता है। मीरा उसी वर्ष 1 जनवरी को ₹6,000 और 1 जुलाई को ₹5,000 जमा करती है। उस वर्ष के अंत में उसे कुल कितना ब्याज मिलेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,700</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,810</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,650</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,760</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रति छमाही दर = 20% / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span><span style=\"font-family:'Mangal'\">, अतः हर छमाही में राशि 1.1 से गुणित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 जनवरी की जमा राशि 2 छमाही रहती है: मिश्रधन = 6,000 × (1.1)² = 6,000 × 1.21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस पर ब्याज = 7,260 − 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 जुलाई की जमा राशि 1 छमाही रहती है: मिश्रधन = 5,000 × 1.1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस पर ब्याज = 5,500 − 5,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल ब्याज = 1,260 + 500 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,760</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: अर्धवार्षिक संयोजन के लिए A = P(1 + R/200)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल ब्याज </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,760 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक वॉशिंग मशीन की कीमत एक TV की कीमत से 25% कम है। यदि वॉशिंग मशीन की कीमत 40% बढ़ जाए और TV की कीमत 20% घट जाए, तो 4 वॉशिंग मशीनों और 2 TV की कुल कीमत में प्रतिशत परिवर्तन क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16% की वृद्धि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16% की कमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12% की वृद्धि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20% की वृद्धि</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TV की कीमत ₹100 लें, अतः वॉशिंग मशीन की कीमत = 100 × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूल कुल कीमत = (4 × 75) + (2 × 100) = 300 + 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वॉशिंग मशीन की नई कीमत = 75 × 140% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹105</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TV की नई कीमत = 100 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई कुल कीमत = (4 × 105) + (2 × 80) = 420 + 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹580</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिवर्तन = 580 − 500 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+₹80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिशत परिवर्तन = 80 / 500 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16% वृद्धि</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल कीमत में </span><span style=\"font-weight:bold;font-family:'Mangal'\">16% की वृद्धि (विकल्प A)</span><span style=\"font-family:'Mangal'\"> होती है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बर्तन में द्रव A और B, 5 : 3 के अनुपात में हैं। यदि 16 लीटर मिश्रण निकालकर उतनी ही मात्रा में द्रव B मिला दिया जाए, तो अनुपात 3 : 5 हो जाता है। बर्तन की धारिता क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">47 लीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33 लीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 लीटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44 लीटर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बर्तन की धारिता V लीटर लें: A = 5V/8 और B = 3V/8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकाले गए 16 लीटर मिश्रण में A और B 5 : 3 के अनुपात में हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 लीटर A और 6 लीटर B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकालने के बाद: A = 5V/8 − 10, B = 3V/8 − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 लीटर B मिलाने पर: B = 3V/8 − 6 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3V/8 + 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया अनुपात 3 : 5: 5 × (5V/8 − 10) = 3 × (3V/8 + 10)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25V/8 − 50 = 9V/8 + 30 → 16V/8 = 80 → 2V = 80 → V = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A = 25 − 10 = 15, B = 15 + 10 = 25 → 15 : 25 = 3 : 5 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बर्तन की धारिता </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 लीटर (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज PQR में, D भुजा QR पर एक बिंदु इस प्रकार है कि ∠PDR = ∠QPR. यदि QR = 18 cm और QD = 10 cm है, तो PR की लंबाई ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DR = QR − QD = 18 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔPDR और ΔQPR में: ∠PDR = ∠QPR (दिया है) और ∠PRD = ∠QRP (R पर उभयनिष्ठ कोण)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः AA समरूपता कसौटी से ΔPDR ~ ΔQPR.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संगत भुजाएँ समानुपाती हैं: PR/QR = DR/PR</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PR² = QR × DR = 18 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PR = √144 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: PR, QR और DR के बीच मध्यानुपाती है: PR² = QR × DR</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः PR की लंबाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पिता और उसके पुत्र की वर्तमान आयु का माध्य 33 वर्ष है। 15 वर्ष बाद पिता की आयु पुत्र की आयु की दोगुनी होगी। पुत्र और पिता की वर्तमान आयु का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49 : 17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 : 25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 : 49</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों आयु का माध्य = 33, अतः वर्तमान आयु का योग = 2 × 33 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">66 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की वर्तमान आयु s वर्ष लें, अतः पिता की वर्तमान आयु = </span><span style=\"font-weight:bold;font-family:'Mangal'\">66 − s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 वर्ष बाद: पिता = 66 − s + 15 = 81 − s; पुत्र = s + 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की आयु पुत्र की दोगुनी: 81 − s = 2(s + 15) = 2s + 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">81 − 30 = 3s → 3s = 51 → s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\">; पिता = 66 − 17 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 15 वर्ष बाद पिता 64 और पुत्र 32 → 64 = 2 × 32 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान आयु का अनुपात पुत्र : पिता = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 : 49</span><span style=\"font-family:'Mangal'\"> (17 और 49 का कोई उभयनिष्ठ गुणनखंड नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 : 49 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्रम अपनी आय का r% बचाता है। यदि उसकी आय 22% बढ़ जाए और उसका व्यय 16% बढ़ जाए, तो उसकी बचत 40% बढ़ जाती है। r का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय ₹100 लें, अतः बचत = ₹r और व्यय = ₹(100 − r).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई आय = 100 × 122% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹122</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया व्यय = (100 − r) × 116% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">116 − 1.16r</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई बचत = 122 − (116 − 1.16r) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 + 1.16r</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बचत 40% बढ़ती है: 6 + 1.16r = r × 140% = 1.4r</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 = 1.4r − 1.16r = 0.24r → r = 6 / 0.24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: बचत 25, व्यय 75 → नया व्यय 87, नई बचत 122 − 87 = 35 = 25 × 140% ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः r का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 पुरुष और 15 महिलाएँ एक काम 10 दिनों में पूरा कर सकते हैं, जबकि 15 पुरुष और 5 महिलाएँ उसे 20 दिनों में पूरा कर सकते हैं। 40 महिलाएँ उस काम को कितने दिनों में पूरा करेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 दिन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पुरुष का 1 दिन का काम m और एक महिला का 1 दिन का काम w लें (काम का भाग)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 पुरुष + 15 महिलाएँ 10 दिनों में: 5m + 15w = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 पुरुष + 5 महिलाएँ 20 दिनों में: 15m + 5w = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समीकरण को 3 से गुणा करें: 15m + 45w = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा समीकरण घटाएँ: (15m + 45w) − (15m + 5w) = 3/10 − 1/20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40w = 6/20 − 1/20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5/20 = 1/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 40 महिलाएँ 1 दिन में काम का 1/4 करती हैं → 40 महिलाओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 दिन</span><span style=\"font-family:'Mangal'\"> लगेंगे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 40 महिलाएँ काम को </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 दिन (विकल्प B)</span><span style=\"font-family:'Mangal'\"> में पूरा करेंगी।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 आमों का क्रय मूल्य 25 आमों के विक्रय मूल्य के बराबर है। लाभ प्रतिशत ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11.6%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10.9%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 आम का क्रय मूल्य ₹1 लें, अतः 28 आमों का क्रय मूल्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 आमों का विक्रय मूल्य = 28 आमों का क्रय मूल्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 आम का विक्रय मूल्य = 28 / 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1.12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 आम पर लाभ = 1.12 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹0.12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ % = 0.12 / 1 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: लाभ % = (CP वाली वस्तुएँ − SP वाली वस्तुएँ) / SP वाली वस्तुएँ × 100% = (28 − 25) / 25 × 100% = 12%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लाभ प्रतिशत </span><span style=\"font-weight:bold;font-family:'Mangal'\">12% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक रेलगाड़ी में AC श्रेणी, स्लीपर श्रेणी और सामान्य श्रेणी के यात्रियों की संख्याएँ 1 : 3 : 6 के अनुपात में हैं, और इन श्रेणियों के किराए 10 : 5 : 2 के अनुपात में हैं। यदि कुल एकत्रित किराया ₹1,11,000 है, तो स्लीपर श्रेणी से कितना किराया एकत्रित हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹36,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी श्रेणी की आय = यात्रियों की संख्या × किराया, अतः आय का अनुपात = (1 × 10) : (3 × 5) : (6 × 2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय का अनुपात AC : स्लीपर : सामान्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 : 15 : 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भाग = 10 + 15 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक भाग = 1,11,000 / 37 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्लीपर श्रेणी की आय = 15 × 3,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹45,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: AC = 30,000, सामान्य = 36,000; 30,000 + 45,000 + 36,000 = 1,11,000 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: मिश्रित अनुपात = दोनों अनुपातों के संगत पदों का गुणनफल</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः स्लीपर श्रेणी से एकत्रित राशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹45,000 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि cos A − sin A = √2 sin A है, तो (cos A − sin A)/(cos A + sin A) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sinA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cosA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cotA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tanA</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है cos A − sin A = √2 sin A → cos A = √2 sin A + sin A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(√2 + 1) sin A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः cos A + sin A = (√2 + 1) sin A + sin A = (√2 + 2) sin A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√2(√2 + 1) sin A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट अनुपात = (cos A − sin A)/(cos A + sin A) = √2 sin A / [√2(√2 + 1) sin A] = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/(√2 + 1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिमेयीकरण: 1/(√2 + 1) = (√2 − 1)/((√2 + 1)(√2 − 1)) = (√2 − 1)/(2 − 1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√2 − 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब tan A = sin A/cos A = sin A / [(√2 + 1) sin A] = 1/(√2 + 1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√2 − 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात tan A के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: अंश और हर को cos A से भाग दें: (1 − tan A)/(1 + tan A); tan A = √2 − 1 रखने पर (2 − √2)/√2 = √2 − 1 = tan A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">tanA (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आँकड़ों 5, 9, 14, 21, 8, 17, (x + 3), 12, 25 और 6 का माध्यक 12.5 है। x का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नौ ज्ञात मानों को आरोही क्रम में लिखें: 5, 6, 8, 9, 12, 14, 17, 21, 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 प्रेक्षण हैं (सम), अतः माध्यक = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5वें और 6वें</span><span style=\"font-family:'Mangal'\"> प्रेक्षणों का माध्य</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि (x + 3) 12 या उससे कम होता, तो 5वाँ और 6वाँ मान 9 और 12 होते → माध्यक 10.5 (12.5 नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि (x + 3) 14 या उससे अधिक होता, तो 5वाँ और 6वाँ मान 12 और 14 होते → माध्यक 13 (12.5 नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः (x + 3), 12 और 14 के बीच है और स्वयं 6वाँ प्रेक्षण है: (12 + (x + 3)) / 2 = 12.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 + x + 3 = 25 → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: x + 3 = 13 लेने पर क्रम में आँकड़े 5, 6, 8, 9, 12, 13, 14, 17, 21, 25 → माध्यक = (12 + 13) / 2 = 12.5 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: n सम होने पर माध्यक = [(n/2)वाँ + (n/2 + 1)वाँ प्रेक्षण] / 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ठोस बेलन के आधार की त्रिज्या और ऊँचाई का योग 35 cm है। यदि उसके वक्र पृष्ठीय क्षेत्रफल और कुल पृष्ठीय क्षेत्रफल का अनुपात 3 : 5 है, तो बेलन के कुल पृष्ठीय क्षेत्रफल और वक्र पृष्ठीय क्षेत्रफल का अंतर ज्ञात कीजिए। (π = 22/7 लें)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">616 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,848 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,232 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,080 cm²</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिज्या r और ऊँचाई h लें, जहाँ r + h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CSA = 2πrh और TSA = 2πr(r + h), अतः CSA : TSA = h : (r + h) = 3 : 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h/35 = 3/5 → h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span><span style=\"font-family:'Mangal'\"> और r = 35 − 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TSA − CSA = 2πr(r + h) − 2πrh = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2πr²</span><span style=\"font-family:'Mangal'\"> (दोनों वृत्ताकार सिरों का क्षेत्रफल)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 14 × 14 = 2 × 22 × 2 × 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: CSA = 2 × (22/7) × 14 × 21 = 1,848; TSA = 1,848 + 1,232 = 3,080; 1,848 : 3,080 = 3 : 5 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: बेलन का TSA − CSA = 2πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm² (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 संख्याओं का औसत 40 है। पहली 12 संख्याओं का औसत 38 और अंतिम 12 संख्याओं का औसत 41 है। 13वीं संख्या क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 25 संख्याओं का योग = 25 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली 12 संख्याओं का योग = 12 × 38 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">456</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम 12 संख्याओं का योग = 12 × 41 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">492</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली 12 और अंतिम 12 मिलकर 24 संख्याएँ हैं, केवल 13वीं संख्या शेष रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13वीं संख्या = 1,000 − (456 + 492) = 1,000 − 948 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: मध्य पद = कुल योग − (पहले समूह का योग + अंतिम समूह का योग)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 13वीं संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार 40 km/h की चाल से चलना शुरू करती है और प्रत्येक 30 मिनट के अंत में अपनी चाल 6 km/h बढ़ा देती है। यात्रा के पहले 2.5 घंटों के लिए कार की औसत चाल (km/h में) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5 घंटे = 30 मिनट (प्रत्येक 1/2 घंटा) के 5 अंतराल।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच अंतरालों में चालें: 40, 46, 52, 58, 64 km/h (प्रत्येक पिछली से 6 अधिक)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अंतराल में दूरी = चाल × (1/2) घंटा:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 × (1/2) = 20 km; 46 × (1/2) = 23 km; 52 × (1/2) = 26 km; 58 × (1/2) = 29 km; 64 × (1/2) = 32 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूरी = 20 + 23 + 26 + 29 + 32 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">130 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल = कुल दूरी / कुल समय = 130 / 2.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समान समय-अंतराल → औसत चाल = चालों का माध्य = (40 + 46 + 52 + 58 + 64) / 5 = 260 / 5 = 52</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार की औसत चाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> km/h है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63 km/h की चाल से चल रही एक रेलगाड़ी एक प्लेटफॉर्म को पार करने में 30 सेकंड लेती है। इसके बाद वह उसी दिशा में 9 km/h की चाल से साइकिल चला रहे एक व्यक्ति को पार करने में 18 सेकंड लेती है। रेलगाड़ी की लंबाई और प्लेटफॉर्म की लंबाई का अनुपात है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 : 17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 : 7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 : 19</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 : 9</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेलगाड़ी की चाल = 63 km/h = (63 × 5) / 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17.5 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेटफॉर्म को 30 s में पार करना: रेलगाड़ी की लंबाई + प्लेटफॉर्म की लंबाई = 17.5 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">525 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साइकिल सवार के सापेक्ष चाल (समान दिशा) = 63 − 9 = 54 km/h = (54 × 5) / 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साइकिल सवार को 18 s में पार करना: रेलगाड़ी की लंबाई = 15 × 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेटफॉर्म की लंबाई = 525 − 270 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">255 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात रेलगाड़ी : प्लेटफॉर्म = 270 : 255 = (15 से भाग देने पर) </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 : 17</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: km/h → m/s: 5/18 से गुणा करें</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 : 17 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए व्यंजक को सरल कीजिए: 45 − 4 का (36 ÷ 12 × 3) + 15 ÷ 5 × 2</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\">
