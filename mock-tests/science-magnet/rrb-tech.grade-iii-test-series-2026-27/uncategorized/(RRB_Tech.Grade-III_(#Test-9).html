्योदय और सूर्यास्त के समय सूर्य थोड़ा चपटा (अंडाकार) दिखाई देता है, क्योंकि वायुमंडल सूर्य के प्रकाश का विक्षेपण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): वायुमंडलीय अपवर्तन के कारण सूर्य हमें वास्तविक सूर्योदय से लगभग 2 मिनट पहले दिखाई देने लगता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्योदय और सूर्यास्त के समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य का चपटा दिखाई देना</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायुमंडलीय अपवर्तन</span><span style=\"font-family:'Mangal'\"> के कारण है, विक्षेपण के कारण नहीं (विक्षेपण प्रिज़्म या वर्षा की बूँदों द्वारा श्वेत प्रकाश का उसके रंगों में बँटना है) → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडलीय अपवर्तन के कारण सूर्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक सूर्योदय से लगभग 2 मिनट पहले दिखाई देने लगता है</span><span style=\"font-family:'Mangal'\"> और वास्तविक सूर्यास्त के लगभग 2 मिनट बाद तक दिखाई देता रहता है; वास्तविक सूर्योदय का अर्थ है सूर्य का क्षितिज को वास्तव में पार करना → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वास्तविक और आभासी सूर्यास्त के बीच लगभग 2 मिनट का अंतर होता है, और यह तथा चपटापन दोनों वायुमंडलीय अपवर्तन के प्रभाव हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60°C पर एक यौगिक B के संतृप्त विलयन में 100 g जल में 287 g B घुला होता है, जबकि 40°C पर 100 g जल में केवल 241 g B ही घुला रह सकता है। एक छात्र 50 g जल लेकर 60°C पर B का संतृप्त विलयन बनाता है और फिर उसे धीरे-धीरे ठंडा करके 40°C पर लाता है। क्रिस्टल के रूप में अलग होने वाले B का द्रव्यमान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46 g</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23 g</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120.5 g</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">143.5 g</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 g जल में 60°C पर संतृप्त विलयन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">287 g</span><span style=\"font-family:'Mangal'\"> B होता है, परंतु 40°C पर केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">241 g</span><span style=\"font-family:'Mangal'\"> ही घुला रह सकता है; अंतर, 287 − 241 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">46 g</span><span style=\"font-family:'Mangal'\">, ठंडा करने पर शुद्ध ठोस (क्रिस्टल) के रूप में अलग हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छात्र ने केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 g जल</span><span style=\"font-family:'Mangal'\"> लिया, अर्थात् आधी मात्रा, अतः प्रत्येक द्रव्यमान आधा हो जाता है: 60°C पर घुला = 143.5 g और 40°C पर घुला = 120.5 g.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलों का द्रव्यमान = 143.5 − 120.5 = 46 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही क्रिस्टलीकरण का सिद्धांत है: किसी पदार्थ की विलेयता विभिन्न तापों पर भिन्न होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 23 g B क्रिस्टल के रूप में अलग होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणसूत्रों के प्रत्येक युग्म में से एक जनन कोशिका को मिलता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक गुणसूत्र, माता या पिता किसी से भी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्म के दोनों गुणसूत्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल माता वाला गुणसूत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल पिता वाला गुणसूत्र</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शरीर की प्रत्येक कोशिका में प्रत्येक गुणसूत्र की दो प्रतियाँ होती हैं, एक नर जनक से और एक मादा जनक से।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनन कोशिकाएँ बनते समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक जनन कोशिका प्रत्येक युग्म से एक गुणसूत्र लेती है</span><span style=\"font-family:'Mangal'\">, और यह गुणसूत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">मातृ या पितृ किसी भी मूल का</span><span style=\"font-family:'Mangal'\"> हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निषेचन में दो जनन कोशिकाओं के मिलने पर युग्मनज को </span><span style=\"font-weight:bold;font-family:'Mangal'\">युग्म फिर से मिल जाता है</span><span style=\"font-family:'Mangal'\">, जिससे संतति में गुणसूत्रों की सामान्य संख्या पुनः स्थापित हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीन DNA के एक लंबे धागे के रूप में नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग-अलग स्वतंत्र टुकड़ों पर होते हैं, जिनमें से प्रत्येक को गुणसूत्र कहते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जनन कोशिका को प्रत्येक युग्म से एक गुणसूत्र मिलता है, जो माता या पिता किसी से भी हो सकता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन परमाणुओं P, Q और R का संघटन इस प्रकार है: P में 20 प्रोटॉन और 20 न्यूट्रॉन, Q में 19 प्रोटॉन और 21 न्यूट्रॉन, और R में 18 प्रोटॉन और 22 न्यूट्रॉन हैं। P, Q और R के विषय में निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये तीन भिन्न तत्वों के परमाणु हैं जिनकी द्रव्यमान संख्या समान, 40, है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये एक ही तत्व के समस्थानिक हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनकी परमाणु संख्या समान परंतु द्रव्यमान संख्याएँ भिन्न हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उदासीन अवस्था में इनमें इलेक्ट्रॉनों की संख्या समान है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु संख्या (प्रोटॉनों की संख्या) </span><span style=\"font-weight:bold;font-family:'Mangal'\">किसी तत्व की विशिष्ट पहचान</span><span style=\"font-family:'Mangal'\"> है: P (20 प्रोटॉन) कैल्सियम, Q (19 प्रोटॉन) पोटैशियम और R (18 प्रोटॉन) आर्गन है। ये तीन </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न तत्व</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान संख्या = प्रोटॉन + न्यूट्रॉन: P = 20 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">, Q = 19 + 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">, R = 18 + 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">; तीनों में न्यूक्लिऑनों की कुल संख्या समान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समस्थानिकों की परमाणु संख्या समान और द्रव्यमान संख्याएँ भिन्न होती हैं। यहाँ परमाणु संख्याएँ भिन्न हैं, अतः B और C गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उदासीन अवस्था में इलेक्ट्रॉनों की संख्या प्रोटॉनों के बराबर होती है, अतः P, Q और R में क्रमशः 20, 19 और 18 इलेक्ट्रॉन हैं। D गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, Q और R समान द्रव्यमान संख्या 40 वाले भिन्न तत्वों के परमाणु हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन करने वाले जीवों में जनन-कोशिकाओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अनेक बहुकोशिकीय जीवों में विशेष अंगों में कोशिकाओं की विशेष वंशावलियाँ (जनन-कोशिकाएँ) होती हैं जिनमें शरीर की कोशिकाओं की तुलना में गुणसूत्रों की संख्या और DNA की मात्रा केवल आधी होती है; ये अर्धसूत्री विभाजन से बनती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जटिल जीवों में भोजन-भंडार वाली बड़ी जनन-कोशिका को परंपरागत रूप से नर युग्मक कहते हैं, जबकि छोटी गतिशील जनन-कोशिका मादा युग्मक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जब दो व्यक्तियों की जनन-कोशिकाएँ मिलकर नया जीव बनाती हैं, तो गुणसूत्रों की सामान्य संख्या और DNA की मात्रा पुनः स्थापित हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यदि प्रत्येक पीढ़ी दो व्यक्तियों के पूरे DNA को बस जोड़ दे, तो हर पीढ़ी में DNA दोगुना हो जाएगा; इसका समाधान यह है कि अनेक बहुकोशिकीय जीवों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐसी जनन-कोशिकाएँ होती हैं जिनमें गुणसूत्रों की संख्या और DNA की मात्रा केवल आधी होती है</span><span style=\"font-family:'Mangal'\">, और ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">अर्धसूत्री विभाजन</span><span style=\"font-family:'Mangal'\"> नामक कोशिका विभाजन से बनती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. बात इसके उलट है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">गतिशील जनन-कोशिका को परंपरागत रूप से नर युग्मक</span><span style=\"font-family:'Mangal'\"> कहते हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">संचित भोजन वाली जनन-कोशिका को मादा युग्मक</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लैंगिक प्रजनन में दो व्यक्तियों की जनन-कोशिकाओं के मिलने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुणसूत्रों की संख्या और DNA की मात्रा सामान्य स्तर पर पुनः स्थापित</span><span style=\"font-family:'Mangal'\"> हो जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेन और क्लोरीन के मिश्रण को सूर्य के प्रकाश में रखा जाता है। निम्नलिखित में से कौन-सा उत्पादों और अभिक्रिया के प्रकार को सही बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₃Cl और HCl बनते हैं; यह संकलन अभिक्रिया है क्योंकि क्लोरीन किसी आबंध पर जुड़ती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₂=CH₂ और HCl बनते हैं; यह ऑक्सीकरण अभिक्रिया है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई अभिक्रिया नहीं होती, क्योंकि संतृप्त हाइड्रोकार्बन पूर्णतः निष्क्रिय होते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₃Cl और HCl बनते हैं; यह प्रतिस्थापन अभिक्रिया है जिसमें क्लोरीन मेथेन के हाइड्रोजन परमाणुओं को एक-एक करके प्रतिस्थापित करती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतृप्त हाइड्रोकार्बन काफ़ी कम अभिक्रियाशील होते हैं और अधिकांश अभिकर्मकों की उपस्थिति में निष्क्रिय रहते हैं, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य के प्रकाश की उपस्थिति में क्लोरीन हाइड्रोकार्बनों से बहुत तेज़ अभिक्रिया</span><span style=\"font-family:'Mangal'\"> करके हाइड्रोजन परमाणुओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-एक करके</span><span style=\"font-family:'Mangal'\"> प्रतिस्थापित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₄ + Cl₂ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">CH₃Cl + HCl</span><span style=\"font-family:'Mangal'\"> (सूर्य के प्रकाश की उपस्थिति में).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस अभिक्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक प्रकार का परमाणु या परमाणुओं का समूह दूसरे का स्थान ले लेता है</span><span style=\"font-family:'Mangal'\"> उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिस्थापन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> कहते हैं। यहाँ क्लोरीन परमाणु हाइड्रोजन परमाणु का स्थान लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह संकलन अभिक्रिया नहीं है (मेथेन में द्विआबंध या त्रिआबंध नहीं है), और उच्च ऐल्केनों की क्लोरीन से अभिक्रिया में प्रायः अनेक उत्पाद बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिस्थापन अभिक्रिया द्वारा CH₃Cl और HCl बनते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक गेंद को ऊर्ध्वाधर ऊपर फेंका जाता है और वह अपने उच्चतम बिंदु पर पहुँचती है। उच्चतम बिंदु पर गेंद के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. गेंद की गतिज ऊर्जा शून्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. गेंद पर लगने वाला बल शून्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. गेंद की स्थितिज ऊर्जा अधिकतम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. उच्चतम बिंदु पर गेंद क्षण भर के लिए रुक जाती है; जो वस्तु गति नहीं करती उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">गतिज ऊर्जा शून्य</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. उच्चतम बिंदु पर भी गेंद पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुरुत्वाकर्षण बल (भार) लगता रहता है</span><span style=\"font-family:'Mangal'\">, इसीलिए वह नीचे आती है; वहाँ गुरुत्वीय त्वरण शून्य नहीं होता → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पृथ्वी की सतह से वस्तु की ऊँचाई जितनी अधिक, उसकी स्थितिज ऊर्जा उतनी अधिक, अतः उच्चतम बिंदु पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थितिज ऊर्जा अधिकतम</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 W का एक रेफ्रिजरेटर 30 दिनों तक प्रतिदिन 10 घंटे चलाया जाता है। यदि विद्युत ऊर्जा की कीमत ₹5.00 प्रति यूनिट है, तो महीने भर रेफ्रिजरेटर चलाने की कीमत है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹450</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹900</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत ऊर्जा = शक्ति × समय; कुल समय = 10 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 घंटे</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपभुक्त ऊर्जा = 300 W × 300 h = 90,000 Wh = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 kWh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत ऊर्जा का व्यावसायिक मात्रक </span><span style=\"font-weight:bold;font-family:'Mangal'\">किलोवाट घंटा (kWh)</span><span style=\"font-family:'Mangal'\"> है, जिसे प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">'यूनिट'</span><span style=\"font-family:'Mangal'\"> कहते हैं (1 kWh = 3.6 × 10⁶ J), अतः 90 kWh = 90 यूनिट।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कीमत = 90 × ₹5.00 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹450</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः महीने की कीमत ₹450 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): अधिकांश बहुकोशिकीय जीव विद्युत आवेगों के अतिरिक्त नियंत्रण और समन्वय के दूसरे साधन के रूप में रासायनिक संचार (हॉर्मोन) का उपयोग करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): विद्युत आवेग केवल उन्हीं कोशिकाओं तक पहुँच सकते हैं जो तंत्रिका ऊतक से जुड़ी हैं, और आवेग संचरित कर चुकी कोशिका को नया आवेग उत्पन्न और संचरित करने से पहले पुनः तैयार होने में कुछ समय लगता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश बहुकोशिकीय जीव विद्युत आवेगों के अतिरिक्त संचार के दूसरे साधन के रूप में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाओं के बीच रासायनिक संचार</span><span style=\"font-family:'Mangal'\"> का उपयोग करते हैं; इसके लिए प्रयुक्त यौगिकों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">हॉर्मोन</span><span style=\"font-family:'Mangal'\"> कहते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत आवेगों की सीमाएँ हैं: वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल तंत्रिका ऊतक से जुड़ी कोशिकाओं तक ही पहुँचते हैं</span><span style=\"font-family:'Mangal'\">, शरीर की हर कोशिका तक नहीं, और एक बार आवेग उत्पन्न और संचरित करने के बाद कोशिका को अपनी व्यवस्था </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनः तैयार करने में कुछ समय लगता है</span><span style=\"font-family:'Mangal'\">, अतः कोशिकाएँ लगातार आवेग नहीं बना और भेज सकतीं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उद्दीपित कोशिका द्वारा छोड़ा गया रसायन उसके चारों ओर विसरित होकर शरीर की सभी कोशिकाओं तक स्थिर और सतत रूप से पहुँच सकता है, अतः विद्युत आवेगों की यही सीमाएँ रासायनिक संचार के उपयोग का कारण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 cm फोकस दूरी का एक अवतल लेंस किसी वस्तु का प्रतिबिंब लेंस से 15 cm की दूरी पर बनाता है। वस्तु लेंस से जितनी दूरी पर रखी है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से 8.6 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से 30 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से 35 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से 60 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल लेंस की फोकस दूरी ऋणात्मक होती है: f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20 cm</span><span style=\"font-family:'Mangal'\">; अवतल लेंस सदैव वस्तु की ओर ही आभासी, सीधा प्रतिबिंब बनाता है, अतः प्रतिबिंब दूरी v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−15 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र: 1/v − 1/u = 1/f → 1/u = 1/v − 1/f = (−1/15) − (−1/20) = −1/15 + 1/20.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/u = (−4 + 3) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1/60</span><span style=\"font-family:'Mangal'\">, अतः u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−60 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक चिह्न दर्शाता है कि वस्तु लेंस के बाईं ओर, उससे 60 cm दूर है; प्रतिबिंब (15 cm) फोकस और प्रकाशिक केंद्र के बीच है, जैसा अवतल लेंस के लिए अपेक्षित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु लेंस से 60 cm दूर रखी है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य की परिपक्व लाल रुधिर कोशिकाओं (RBC) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. परिपक्व RBC में केंद्रक नहीं होता, जिससे हीमोग्लोबिन के लिए अधिक स्थान मिलता है और अधिक मात्रा में ऑक्सीजन ले जाई जा सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. केंद्रक न होने के कारण RBC स्वयं की मरम्मत या विभाजन नहीं कर सकतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. केंद्रक न होने के कारण RBC दीर्घजीवी होती हैं और कई वर्षों तक जीवित रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मनुष्य की परिपक्व RBC </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रक-रहित</span><span style=\"font-family:'Mangal'\"> होती हैं; केंद्रक न होने से </span><span style=\"font-weight:bold;font-family:'Mangal'\">हीमोग्लोबिन के लिए अधिक स्थान</span><span style=\"font-family:'Mangal'\"> मिलता है, जिससे वह शरीर की सभी कोशिकाओं तक अधिक मात्रा में ऑक्सीजन पहुँचा पाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. केंद्रक न होने के कारण RBC </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वयं की मरम्मत या विभाजन नहीं कर सकतीं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. केंद्रक न होने के परिणामस्वरूप RBC का </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवनकाल छोटा</span><span style=\"font-family:'Mangal'\"> होता है और वे लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 दिन</span><span style=\"font-family:'Mangal'\"> जीवित रहती हैं, कई वर्ष नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल के प्रयोग में शुद्ध लंबे (TT) और शुद्ध बौने (tt) पौधे के संकरण से प्राप्त F₁ लंबे मटर के पौधों (Tt) का स्व-परागण कराया गया और 400 F₂ पौधे प्राप्त हुए। F₂ के ऐसे पौधों की अपेक्षित संख्या जो लंबे हैं परंतु बौनेपन के लक्षण की एक प्रति रखते हैं (Tt), और बौने पौधों की अपेक्षित संख्या क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 और 100</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 और 100</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 और 100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 और 200</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Tt पौधों के स्व-परागण में प्रत्येक जनक संतति को T या t देता है, जिससे F₂ के जीनप्ररूप </span><span style=\"font-weight:bold;font-family:'Mangal'\">TT : Tt : tt का अनुपात 1 : 2 : 1</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400 F₂ पौधों में से: TT = ¼ × 400 = 100, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tt = ½ × 400 = 200</span><span style=\"font-family:'Mangal'\">, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">tt = ¼ × 400 = 100</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">TT और Tt दोनों लंबे</span><span style=\"font-family:'Mangal'\"> होते हैं (T प्रभावी है), अतः 300 पौधे लंबे हैं, जिनमें से 200 Tt हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल tt पौधे बौने</span><span style=\"font-family:'Mangal'\"> होते हैं, अतः 100 पौधे बौने हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही F₂ पीढ़ी में लंबे : बौने का 3 : 1 लक्षणप्ररूप अनुपात है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 200 पौधे Tt हैं और 100 पौधे बौने हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम, जो जड़ों से पौधे के अन्य भागों तक जल और खनिजों का परिवहन करने वाला ऊतक है, वाहिनिकाओं (ट्रैकीड), वाहिकाओं, जाइलम पैरेन्काइमा और जाइलम तंतुओं से बना होता है। इन घटकों के विषय में निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाहिनिकाएँ और वाहिकाएँ जीवित, पतली भित्ति वाली कोशिकाएँ हैं जो जल का चालन करती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम पैरेन्काइमा जाइलम का एकमात्र जीवित घटक है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम तंतु जाइलम के एकमात्र जीवित घटक हैं और वे भोजन संचित करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम के चारों घटक परिपक्व होने पर मृत होते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम एक जटिल स्थायी ऊतक है जो मिलकर कार्य करने वाली विभिन्न प्रकार की कोशिकाओं से बना है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाहिनिकाएँ, वाहिकाएँ, जाइलम पैरेन्काइमा और जाइलम तंतु</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वाहिनिकाएँ और वाहिकाएँ नलिकाकार और मोटी भित्ति वाली</span><span style=\"font-family:'Mangal'\"> होती हैं; वाहिनिकाएँ, वाहिकाएँ और जाइलम तंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुख्यतः स्क्लेरेन्काइमी</span><span style=\"font-family:'Mangal'\"> हैं, अर्थात् मोटी लिग्निनयुक्त भित्ति वाली मृत कोशिकाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जाइलम पैरेन्काइमा जाइलम का एकमात्र जीवित घटक है</span><span style=\"font-family:'Mangal'\">; तंतु जीवित नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विकल्प A, C और D गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जाइलम पैरेन्काइमा जाइलम का एकमात्र जीवित घटक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र एक्वेरियम में एक सुनहरी मछली को देखता है और पाता है कि वह प्रति मिनट अपना मुँह और गिल-आवरण छात्र के साँस लेने की तुलना में कहीं अधिक बार खोलती और बंद करती है। सबसे उपयुक्त व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ जल की सतह पर वायु से ऑक्सीजन लेती हैं, इसलिए उन्हें बार-बार मुँह खोलना पड़ता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल में घुली ऑक्सीजन की मात्रा वायु में ऑक्सीजन की तुलना में काफ़ी कम होती है, इसलिए जलीय जीवों में श्वसन की दर स्थलीय जीवों की तुलना में बहुत तेज़ होती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल वायु से अधिक घना है, इसलिए मछली को गलफड़ों से जल गुज़ारने के लिए अनेक तीव्र गतियाँ करनी पड़ती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ अवायवीय श्वसन करती हैं और उन्हें मुँह से कार्बन डाइऑक्साइड तेज़ी से निकालनी पड़ती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थलीय जंतु वायुमंडल से ऑक्सीजन लेते हैं, जबकि जल में रहने वाले जंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में घुली ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> का उपयोग करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ मुँह से जल लेती हैं और उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलफड़ों</span><span style=\"font-family:'Mangal'\"> से गुज़ारती हैं, जहाँ घुली ऑक्सीजन रक्त द्वारा ग्रहण कर ली जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में घुली ऑक्सीजन की मात्रा वायु में ऑक्सीजन की मात्रा की तुलना में काफ़ी कम</span><span style=\"font-family:'Mangal'\"> होती है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलीय जीवों में श्वसन की दर</span><span style=\"font-family:'Mangal'\"> स्थलीय जीवों की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत तेज़</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ वायु से ऑक्सीजन नहीं लेतीं, और वे घुली ऑक्सीजन से वायवीय श्वसन करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तेज़ श्वसन इसलिए है क्योंकि जल में वायु की तुलना में बहुत कम ऑक्सीजन होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव आहार नाल में पाचन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आमाशय की भित्ति में स्थित जठर ग्रंथियाँ पेप्सिन स्रावित करती हैं, जो वसा-पाचक एंज़ाइम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पित्त लवण वसा की बड़ी गोलिकाओं को छोटी गोलिकाओं में तोड़ देते हैं, जिससे एंज़ाइम की क्रिया की दक्षता बढ़ जाती है, ठीक वैसे ही जैसे साबुन मैल पर कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अग्न्याशयी रस में प्रोटीन के पाचन के लिए ट्रिप्सिन और इमल्सीकृत वसा को तोड़ने के लिए लाइपेज़ होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जठर ग्रंथियाँ हाइड्रोक्लोरिक अम्ल, श्लेष्मा और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेप्सिन</span><span style=\"font-family:'Mangal'\"> स्रावित करती हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन-पाचक</span><span style=\"font-family:'Mangal'\"> एंज़ाइम है, वसा-पाचक नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. आँत में वसा बड़ी गोलिकाओं के रूप में होती है, जिससे एंज़ाइम की क्रिया कठिन हो जाती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">पित्त लवण उन्हें छोटी गोलिकाओं में तोड़ देते हैं</span><span style=\"font-family:'Mangal'\"> (इमल्सीकरण), जिससे एंज़ाइम की क्रिया की दक्षता बढ़ती है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैल पर साबुन की इमल्सीकारी क्रिया</span><span style=\"font-family:'Mangal'\"> जैसा है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">अग्न्याशय</span><span style=\"font-family:'Mangal'\"> अग्न्याशयी रस स्रावित करता है जिसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन के पाचन के लिए ट्रिप्सिन</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">इमल्सीकृत वसा को तोड़ने के लिए लाइपेज़</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा I ले जाने वाला तार का एक वृत्ताकार लूप अपने केंद्र पर चुंबकीय क्षेत्र B उत्पन्न करता है। अब उसी तार को समान त्रिज्या के 50 फेरों वाली वृत्ताकार कुंडली में लपेटा जाता है और उसमें वही धारा I प्रवाहित की जाती है। कुंडली के केंद्र पर चुंबकीय क्षेत्र है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, क्योंकि केंद्र पर क्षेत्र केवल धारा पर निर्भर करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 B, क्योंकि प्रत्येक फेरे में धारा एक ही दिशा में है और प्रत्येक फेरे के कारण क्षेत्र जुड़ जाते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B/50, क्योंकि धारा 50 फेरों में बँट जाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2500 B, क्योंकि क्षेत्र फेरों की संख्या के वर्ग के समानुपाती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धारावाही तार द्वारा किसी बिंदु पर उत्पन्न चुंबकीय क्षेत्र उसमें प्रवाहित </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारा पर सीधे निर्भर</span><span style=\"font-family:'Mangal'\"> करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">n फेरों</span><span style=\"font-family:'Mangal'\"> वाली वृत्ताकार कुंडली द्वारा उत्पन्न क्षेत्र एक फेरे द्वारा उत्पन्न क्षेत्र का </span><span style=\"font-weight:bold;font-family:'Mangal'\">n गुना</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा इसलिए है क्योंकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक वृत्ताकार फेरे में धारा की दिशा समान</span><span style=\"font-family:'Mangal'\"> होती है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक फेरे के कारण क्षेत्र बस जुड़ जाते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 फेरों और समान धारा के साथ केंद्र पर क्षेत्र 50 × B हो जाता है; धारा फेरों में बँटती नहीं है (श्रेणीक्रम में हर फेरे से वही धारा बहती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केंद्र पर क्षेत्र 50 B है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेत्रदान के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चश्मा लगाने वाले लोग, या जिनका मोतियाबिंद का ऑपरेशन हो चुका है, फिर भी नेत्रदान कर सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मृत्यु के 4–6 घंटे के भीतर आँखें निकाल लेनी चाहिए, इसलिए निकटतम नेत्र बैंक को तुरंत सूचित करना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दान की गई आँखों का एक जोड़ा कॉर्निया-अंधता वाले चार लोगों तक को दृष्टि दे सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नेत्रदाता किसी भी आयु वर्ग या लिंग के हो सकते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">चश्मा लगाने वाले, या मोतियाबिंद का ऑपरेशन करा चुके लोग भी नेत्रदान कर सकते हैं</span><span style=\"font-family:'Mangal'\">, और मधुमेह, उच्च रक्तदाब या दमा वाले लोग भी → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">मृत्यु के 4–6 घंटे के भीतर आँखें निकाल लेनी चाहिए</span><span style=\"font-family:'Mangal'\">, इसलिए निकटतम नेत्र बैंक को तुरंत सूचित करना चाहिए; नेत्र बैंक की टीम मृतक के घर या अस्पताल में केवल 10–15 मिनट में, बिना किसी विकृति के, आँखें निकाल लेती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">दान की गई आँखों का एक जोड़ा कॉर्निया-अंधता वाले चार लोगों तक को दृष्टि देता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(AIDS, हेपेटाइटिस B या C, रेबीज़, तीव्र ल्यूकीमिया, टिटनेस, हैज़ा, मेनिन्जाइटिस या एन्सेफ़्लाइटिस से संक्रमित या इनसे मृत व्यक्ति नेत्रदान नहीं कर सकते।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कारखाने में एक साफ़ ऐलुमिनियम की वस्तु को ऐनोड बनाकर तनु सल्फ्यूरिक अम्ल के साथ उसका वैद्युत अपघटन किया जाता है। वस्तु के साथ क्या होता है, और इस प्रक्रम को क्या कहते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम अम्ल में ऐलुमिनियम सल्फेट के रूप में घुल जाता है; इस प्रक्रम को पिकलिंग कहते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐनोड पर निकली हाइड्रोजन ऑक्साइड परत हटा देती है जिससे वस्तु चमकने लगती है; इस प्रक्रम को वैद्युत अपघटनी परिष्करण कहते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐनोड पर निकली ऑक्सीजन ऐलुमिनियम से अभिक्रिया करके मोटी सुरक्षात्मक ऑक्साइड परत बनाती है, जिसे रंगा भी जा सकता है; इस प्रक्रम को ऐनोडीकरण कहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु पर ताँबे की परत जमा हो जाती है; इस प्रक्रम को विद्युत लेपन कहते हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु के संपर्क में ऐलुमिनियम पर ऑक्साइड की पतली परत बन जाती है, और यह ऑक्साइड परत उसे आगे संक्षारण से बचाती है; ऐलुमिनियम की वस्तु पर ऐलुमिनियम ऑक्साइड की </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी परत</span><span style=\"font-family:'Mangal'\"> बनाने के प्रक्रम को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनोडीकरण</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐनोडीकरण में साफ़ ऐलुमिनियम की वस्तु को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनोड</span><span style=\"font-family:'Mangal'\"> बनाकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">तनु सल्फ्यूरिक अम्ल</span><span style=\"font-family:'Mangal'\"> के साथ उसका वैद्युत अपघटन किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनोड पर निकली ऑक्सीजन गैस ऐलुमिनियम से अभिक्रिया</span><span style=\"font-family:'Mangal'\"> करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी सुरक्षात्मक ऑक्साइड परत</span><span style=\"font-family:'Mangal'\"> बनाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस ऐनोडीकृत ऑक्साइड परत को </span><span style=\"font-weight:bold;font-family:'Mangal'\">आसानी से रंगा</span><span style=\"font-family:'Mangal'\"> जा सकता है जिससे ऐलुमिनियम की वस्तुओं को आकर्षक रूप मिलता है; वस्तु घुलती नहीं, और ताँबा जमा नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मोटी सुरक्षात्मक ऑक्साइड परत बनती है, और प्रक्रम ऐनोडीकरण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हमारे द्वारा उत्पन्न अपशिष्ट जैव निम्नीकरणीय या अजैव निम्नीकरणीय हो सकता है। निम्नलिखित में से किस समूह में ऐसी वस्तु है जो जैव निम्नीकरणीय नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास, लकड़ी और प्लास्टिक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास, फूल और चमड़ा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फलों के छिलके, केक और नींबू का रस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केक, लकड़ी और घास</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो पदार्थ जैविक प्रक्रमों (जीवाणुओं और अन्य मृतजीवियों के एंज़ाइमों) द्वारा टूट जाते हैं, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> हैं; जो इस प्रकार नहीं टूटते, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अजैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास, फूल, चमड़ा, लकड़ी, फलों के छिलके, केक और नींबू का रस सभी जैविक मूल के पदार्थ हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्लास्टिक अजैव निम्नीकरणीय है</span><span style=\"font-family:'Mangal'\">: यह पर्यावरण में लंबे समय तक बना रहता है; पैकेजिंग में बदलाव और अधिक वस्तुओं के एक बार प्रयोग वाली (डिस्पोज़ेबल) होने से हमारा अधिकांश अपशिष्ट अजैव निम्नीकरणीय हो गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समूह 'घास, लकड़ी और प्लास्टिक' में एक अजैव निम्नीकरणीय वस्तु है, जबकि शेष तीन समूहों में केवल जैव निम्नीकरणीय वस्तुएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अजैव निम्नीकरणीय वस्तु वाला समूह घास, लकड़ी और प्लास्टिक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): चलते समय ज़मीन द्वारा पैर पर लगाया गया घर्षण बल आगे की दिशा में लगता है और व्यक्ति को आगे बढ़ने में सहायता करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ज़मीन को पीछे की ओर धकेलते समय पैर पीछे की ओर फिसलने की प्रवृत्ति रखता है, और घर्षण बल इस प्रवृत्ति का विरोध करता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चलते या दौड़ते समय व्यक्ति अपने पैरों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">ज़मीन को पीछे की ओर धकेलता है</span><span style=\"font-family:'Mangal'\">, और ज़मीन पैरों पर विपरीत बल लगाकर व्यक्ति को आगे बढ़ाती है; यह बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण</span><span style=\"font-family:'Mangal'\"> के रूप में होता है, अतः यहाँ घर्षण व्यक्ति का विरोध करने के बजाय उसे चलने में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सहायता</span><span style=\"font-family:'Mangal'\"> करता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब पैर ज़मीन को धकेलता है, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे की ओर फिसलने की कोशिश</span><span style=\"font-family:'Mangal'\"> करता है; घर्षण बल उस पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">आगे की दिशा</span><span style=\"font-family:'Mangal'\"> में लगता है क्योंकि घर्षण फिसलने की इस प्रवृत्ति का विरोध करता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर्षण के बिना पैर पीछे फिसल जाता और व्यक्ति गिर पड़ता। R ही वह कारण है जिससे पैर पर घर्षण आगे की ओर है, अतः R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक घास के मैदान में घास को टिड्डे, खरगोश और हिरण खाते हैं; टिड्डों को मेंढक और पक्षी खाते हैं; मेंढकों को साँप खाते हैं; और खरगोश, हिरण और साँपों को बाघ खाता है। भोजन-संबंधों के इस पैटर्न को X कहते हैं, और घास के मैदान में जीवों की सबसे अधिक संख्या प्रायः Y पर पाई जाती है। X और Y क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाद्य शृंखला; शीर्ष मांसाहारी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आहार जाल; प्राथमिक उपभोक्ता स्तर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आहार जाल; उत्पादक स्तर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोषक स्तर; तृतीयक उपभोक्ता स्तर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक जीव को प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो या अधिक अन्य प्रकार के जीव खाते हैं</span><span style=\"font-family:'Mangal'\">, जिन्हें फिर कई अन्य जीव खाते हैं, अतः सीधी खाद्य शृंखला के बजाय इस संबंध को </span><span style=\"font-weight:bold;font-family:'Mangal'\">शाखित रेखाओं की शृंखला के रूप में दर्शाया जाता है जिसे आहार जाल कहते हैं</span><span style=\"font-family:'Mangal'\"> → X आहार जाल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आहार जाल अनेक खाद्य शृंखलाओं से बना होता है: जैसे घास → टिड्डा → मेंढक → साँप → बाघ इसके भीतर की एक शृंखला है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पारिस्थितिकी तंत्र के </span><span style=\"font-weight:bold;font-family:'Mangal'\">निचले पोषक स्तरों पर प्रायः जीवों की संख्या अधिक</span><span style=\"font-family:'Mangal'\"> होती है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे अधिक संख्या उत्पादक की</span><span style=\"font-family:'Mangal'\"> होती है (यहाँ घास) → Y उत्पादक स्तर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा इसलिए है क्योंकि प्रत्येक चरण पर ऊर्जा की हानि होती है, अतः चार पोषक स्तरों के बाद बहुत कम उपयोगी ऊर्जा बचती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X आहार जाल और Y उत्पादक स्तर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हम ध्वनि को कैसे अनुभव करते हैं, इस विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि की प्रबलता प्रायः डेसिबल (dB) में मापी जाती है; सामान्य बातचीत लगभग 60 dB होती है, जबकि पटाखों की ध्वनि 100 dB से अधिक हो सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. हाथी अवश्रव्य ध्वनि (इन्फ्रासाउंड) का पता लगा सकते हैं, जबकि कुत्ते, बिल्लियाँ, चमगादड़ और डॉल्फ़िन पराश्रव्य ध्वनि (अल्ट्रासाउंड) का पता लगा सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ध्वनि की तीव्रता एक व्यक्तिनिष्ठ राशि है जो श्रोता पर निर्भर करती है, जबकि प्रबलता एक मापी जा सकने वाली भौतिक राशि है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि की प्रबलता प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">डेसिबल (dB)</span><span style=\"font-family:'Mangal'\"> में मापी जाती है: पत्तियों की सरसराहट जैसी बहुत मंद ध्वनियाँ कुछ dB, </span><span style=\"font-weight:bold;font-family:'Mangal'\">सामान्य बातचीत लगभग 60 dB</span><span style=\"font-family:'Mangal'\">, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पटाखों जैसी बहुत तेज़ ध्वनियाँ 100 dB से अधिक</span><span style=\"font-family:'Mangal'\"> हो सकती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मनुष्य अवश्रव्य या पराश्रव्य ध्वनि नहीं सुन सकते, परंतु कुछ जंतु सुन सकते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाथी अवश्रव्य ध्वनि</span><span style=\"font-family:'Mangal'\"> का, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुत्ते, बिल्लियाँ, चमगादड़ और डॉल्फ़िन पराश्रव्य ध्वनि</span><span style=\"font-family:'Mangal'\"> का पता लगा लेते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बात इसके उलट है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीव्रता एक मापी जा सकने वाली राशि है</span><span style=\"font-family:'Mangal'\">, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबलता श्रोता की सुनने की क्षमता पर निर्भर करती है</span><span style=\"font-family:'Mangal'\">; केवल दैनिक भाषा में दोनों को एक-दूसरे के स्थान पर प्रयोग कर लिया जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक तत्व M का इलेक्ट्रॉनिक विन्यास 2, 8, 2 है। यह ऑक्सीजन से अभिक्रिया करके एक यौगिक बनाता है जो जल में अल्प विलेय है। यौगिक का सूत्र, उसमें आबंध का प्रकार, और उसके जलीय विलयन की विद्युत चालकता क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M₂O, सहसंयोजक, विद्युत का चालन नहीं करता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO₂, आयनिक, विद्युत का चालन करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO, आयनिक, विद्युत का चालन करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO, सहसंयोजक, विद्युत का चालन नहीं करता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M के </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजकता कोश में केवल दो इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> हैं; जिस परमाणु में चार से कम संयोजकता इलेक्ट्रॉन हों, वह प्रायः उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">दान</span><span style=\"font-family:'Mangal'\"> करता है, अतः M दो इलेक्ट्रॉन खोकर धनायन </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> (संयोजकता 2) बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन (2, 6) दो इलेक्ट्रॉन ग्रहण करके ऋणायन </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> (संयोजकता 2) बनाती है; संयोजकताओं को क्रिस-क्रॉस करने पर सूत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">MO</span><span style=\"font-family:'Mangal'\"> मिलता है (जैसे मैग्नीशियम ऑक्साइड)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि एक धातु इलेक्ट्रॉनों के स्थानांतरण द्वारा अधातु से जुड़ी है, आबंध </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनिक</span><span style=\"font-family:'Mangal'\"> है; आयनिक यौगिक प्रायः धातुओं के अधातुओं से संयोग से बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक का घुला हुआ भाग जल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुक्त आयन</span><span style=\"font-family:'Mangal'\"> देता है, अतः जलीय विलयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत का चालन करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यौगिक MO है, आयनिक है, और उसका विलयन विद्युत का चालन करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुष्पी पौधों में परागकण और बीज उत्पादन तथा परागण के बाद की घटनाओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मक्का और गेहूँ जैसी वायु-परागित घासें प्रति पुष्प लगभग 5,00,000–10,00,000 परागकण छोड़ती हैं, फिर भी अनुमानतः औसतन केवल 50–200 बीज ही बनाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सूरजमुखी जैसे कीट-परागित पौधे प्रति पुष्प लगभग 20,000–40,000 परागकण छोड़ते हैं और अनुमानतः औसतन 800–1,000 बीज बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निषेचन के बाद बीजांड बढ़कर फल बनाता है जबकि अंडाशय बीज में विकसित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु-परागित घासें</span><span style=\"font-family:'Mangal'\"> (मक्का, गेहूँ) प्रति पुष्प लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,00,000–10,00,000 परागकण</span><span style=\"font-family:'Mangal'\"> छोड़ती हैं परंतु अनुमानतः औसतन केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">50–200 बीज</span><span style=\"font-family:'Mangal'\"> बनाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कीट-परागित पौधे</span><span style=\"font-family:'Mangal'\"> (जैसे सूरजमुखी) प्रति पुष्प लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">20,000–40,000 परागकण</span><span style=\"font-family:'Mangal'\"> छोड़ते हैं और अनुमानतः औसतन </span><span style=\"font-weight:bold;font-family:'Mangal'\">800–1,000 बीज</span><span style=\"font-family:'Mangal'\"> बनाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बीजांडों को घेरे हुए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडाशय</span><span style=\"font-family:'Mangal'\"> बढ़कर </span><span style=\"font-weight:bold;font-family:'Mangal'\">फल</span><span style=\"font-family:'Mangal'\"> बनता है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजांड फल के अंदर बीजों में विकसित होते हैं</span><span style=\"font-family:'Mangal'\">। कथन में यह उल्टा कहा गया है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मोटर 30 s तक 85 W की शक्ति विकसित करती है। मोटर द्वारा किया गया कार्य कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">255 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">250 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2500 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2550 J</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति कार्य करने की दर है: P = W / t, अतः W = P × t.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W = 85 W × 30 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">2550 J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मोटर द्वारा किया गया कार्य 2550 J है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): दानेदार ज़िंक को सोडियम हाइड्रॉक्साइड विलयन के साथ गर्म करने पर हाइड्रोजन गैस निकलती है और सोडियम ज़िंकेट बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): सभी धातुएँ क्षारकों से अभिक्रिया करके हाइड्रोजन गैस उत्पन्न करती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दानेदार </span><span style=\"font-weight:bold;font-family:'Mangal'\">ज़िंक</span><span style=\"font-family:'Mangal'\"> के टुकड़ों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम हाइड्रॉक्साइड</span><span style=\"font-family:'Mangal'\"> विलयन के साथ गर्म करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन गैस</span><span style=\"font-family:'Mangal'\"> बनती है: 2NaOH(aq) + Zn(s) → Na₂ZnO₂(s) (सोडियम ज़िंकेट) + H₂(g) → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु क्षारक की धातु से अभिक्रिया करके हाइड्रोजन गैस देना </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी धातुओं के साथ संभव नहीं</span><span style=\"font-family:'Mangal'\"> है → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A में दी गई अभिक्रिया ज़िंक जैसी विशेष धातुओं का गुण है, सभी धातुओं का सामान्य नियम नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आगरा किले की एक दीवार में लगा एक छोटा दर्पण छत पर खड़े दर्शक को ताजमहल, जो एक बहुत बड़ी इमारत है, का पूरा प्रतिबिंब देखने देता है। यह दर्पण सबसे अधिक संभवतः है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण, क्योंकि यह पूरी इमारत से आने वाले प्रकाश को एक बिंदु पर अभिसरित करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तल दर्पण, क्योंकि यह बाहर की ओर वक्रित है और इसलिए इसका दृष्टि-क्षेत्र अधिक विस्तृत है, जिससे पूरी लंबाई का सीधा परंतु छोटा प्रतिबिंब बनता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समतल दर्पण, क्योंकि यह वस्तु के आकार के बराबर प्रतिबिंब बनाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण, क्योंकि यह दूर की वस्तुओं का आवर्धित प्रतिबिंब बनाता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">किसी ऊँची इमारत या वृक्ष का पूरी लंबाई का प्रतिबिंब एक छोटे उत्तल दर्पण में देखा जा सकता है</span><span style=\"font-family:'Mangal'\"> क्योंकि उत्तल दर्पण का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दृष्टि-क्षेत्र अधिक विस्तृत</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तल दर्पण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाहर की ओर वक्रित</span><span style=\"font-family:'Mangal'\"> होते हैं, इसीलिए वे समतल दर्पणों की तुलना में कहीं बड़ा क्षेत्र दिखाते हैं; ऐसा ही एक उत्तल दर्पण </span><span style=\"font-weight:bold;font-family:'Mangal'\">आगरा किले की ताजमहल की ओर वाली दीवार</span><span style=\"font-family:'Mangal'\"> में लगा है, जिससे दीवार से सटी छत से ताजमहल का पूरा प्रतिबिंब देखा जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तल दर्पण सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीधा, यद्यपि छोटा, प्रतिबिंब</span><span style=\"font-family:'Mangal'\"> देता है। इसी कारण इसे वाहनों में पश्च-दृश्य दर्पण के रूप में प्रयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे आकार का समतल दर्पण पूरी इमारत नहीं दिखा सकता, और अवतल दर्पण दूर की बड़ी वस्तु का सीधा पूरा दृश्य नहीं देता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह दर्पण विस्तृत दृष्टि-क्षेत्र वाला उत्तल दर्पण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका संरचना को उसके कार्य से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789928378966_image001.png\" style=\"width: 804px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iii), (c)-(i),
