"font-family:'Mangal'\"> पत्तियों के आधार पर या पर्वसंधियों पर होता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थायी ऊतक</span><span style=\"font-family:'Mangal'\"> तो विभाजन की क्षमता खो चुका होता है, इसलिए इनमें से कोई मोटाई नहीं बढ़ाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मोटाई में वृद्धि पार्श्व विभज्योतक के कारण होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790151764757_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(iii), (d)-(i)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कंकाल पेशी</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐच्छिक गति कराना</span><span style=\"font-family:'Mangal'\">: यह कंकाल से जुड़ी होती है और तभी चलती है जब हम चाहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">चिकनी पेशी</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">आमाशय तथा आँत की गति कराना</span><span style=\"font-family:'Mangal'\">: यह हमारे नियंत्रण के बिना स्वयं काम करती है और पाचन जैसी धीमी तथा लगातार गतियाँ कराती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तंत्रिका कोशिका</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">शरीर के एक भाग से दूसरे भाग तक संदेश ले जाना</span><span style=\"font-family:'Mangal'\">: तंत्रिका ऊतक की कोशिकाएँ संदेश ग्रहण करती हैं, उन पर कार्य करती हैं और आगे पहुँचाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कंडरा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेशी को हड्डी से जोड़ना</span><span style=\"font-family:'Mangal'\">: यह पेशी के खिंचाव को हड्डी तक पहुँचाकर गति कराती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(ii), (b)-(iv), (c)-(i), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक गोलकीपर चलती हुई गेंद को रोकता है। ऐसा करते समय उसके हाथ उसी दिशा में पीछे हटते हैं जिस दिशा में गेंद जा रही थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोलकीपर द्वारा गेंद पर किया गया कार्य है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शून्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लगाए गए बल के बराबर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी बल द्वारा किया गया कार्य = बल × बल की दिशा में विस्थापन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोलकीपर गेंद को गति के विरुद्ध </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे</span><span style=\"font-family:'Mangal'\"> की ओर धकेलता है, जबकि गेंद अब भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">आगे</span><span style=\"font-family:'Mangal'\"> बढ़ रही है, अतः बल और विस्थापन की दिशाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब विस्थापन लगाए गए बल के विपरीत हो, तब उस बल द्वारा किया गया कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऋणात्मक</span><span style=\"font-family:'Mangal'\"> होता है, और यही ऋणात्मक कार्य गेंद से गतिज ऊर्जा लेकर उसे रोक देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्य शून्य नहीं हो सकता, क्योंकि बल लगने के दौरान गेंद चलती अवश्य है, और कार्य तथा बल भिन्न राशियाँ हैं, जिन्हें जूल तथा न्यूटन में मापा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गोलकीपर द्वारा गेंद पर किया गया कार्य ऋणात्मक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): आयनिक यौगिकों के गलनांक तथा क्वथनांक उच्च होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): आयनिक यौगिक प्रायः भंगुर होते हैं और दाब डालने पर टुकड़ों में टूट जाते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धन तथा ऋण आयनों के बीच के प्रबल आकर्षण बल को तोड़ने के लिए बहुत ऊर्जा चाहिए, इसीलिए आयनिक यौगिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च तापमान</span><span style=\"font-family:'Mangal'\"> पर ही पिघलते और उबलते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">भंगुर</span><span style=\"font-family:'Mangal'\"> भी होते हैं और दाब डालने पर टुकड़ों में टूट जाते हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु भंगुरता यह बताती है कि ठोस पर चोट पड़ने पर वह कैसा व्यवहार करता है; उससे यह पता नहीं चलता कि ठोस को पिघलाने में कितनी ऊर्जा लगेगी, अतः R, A का कारण नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का सही कारण तो आयनों के बीच का प्रबल आकर्षण ही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक साइकिल सवार सीधी सड़क पर 400 m पूर्व की ओर चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर वह मुड़कर उसी सड़क पर 250 m पश्चिम की ओर चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसके द्वारा तय की गई कुल दूरी तथा उसके विस्थापन का परिमाण क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">650 m और 650 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">650 m और 150 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 m और 650 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400 m और 250 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी तय किए गए पूरे पथ की लंबाई होती है, अतः वह दोनों भागों का योग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूरी = 400 + 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">650 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन आरंभिक बिंदु तथा अंतिम बिंदु के बीच स्थिति का नेट परिवर्तन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साइकिल सवार अंत में अपने आरंभिक बिंदु से 400 − 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 m</span><span style=\"font-family:'Mangal'\"> पूर्व में है, अतः विस्थापन का परिमाण 150 m है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये दोनों मान 650 m और 150 m हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/(1 × 2) + 1/(2 × 3) + 1/(3 × 4) + … + 1/(9 × 10) का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9/10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10/9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8/9</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक पद को दो भिन्नों के अंतर के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/(1 × 2) = 1/1 − 1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/(2 × 3) = 1/2 − 1/3, इसी प्रकार अंतिम पद 1/(9 × 10) = 1/9 − 1/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन्हें जोड़ने पर पहली और अंतिम भिन्न को छोड़कर हर भिन्न अगले पद से कट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योग = 1/1 − 1/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (10 − 1)/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">9/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 1/(1 × 2) + … + 1/(n(n + 1)) = n/(n + 1), जहाँ n = 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 9/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">9/10 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि tan A + cot A = 5 है, तो tan²A + cot²A का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए समीकरण के दोनों पक्षों का वर्ग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(tan A + cot A)² = 5²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan²A + cot²A + 2 tan A cot A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु cot A, tan A का व्युत्क्रम है, अतः tan A × cot A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan²A + cot²A + 2 = 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan²A + cot²A = 25 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: यदि x + 1/x = k हो, तो x² + 1/x² = k² − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 25 − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 23</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: (0.6³ + 0.4³) / (0.6² − 0.6 × 0.4 + 0.4²)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.76</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंश घनों का योग है, अतः दशमलव संख्याओं को गुणा करने के बजाय सर्वसमिका का प्रयोग करने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a³ + b³ = (a + b)(a² − ab + b²), जहाँ a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.6</span><span style=\"font-family:'Mangal'\"> तथा b = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.4</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंश = (0.6 + 0.4)(0.6² − 0.6 × 0.4 + 0.4²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोष्ठक (0.6² − 0.6 × 0.4 + 0.4²) ठीक हर के बराबर है, अतः यह कट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान = 0.6 + 0.4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: (a³ + b³) / (a² − ab + b²) = a + b</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 0.6 + 0.4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज पर, वार्षिक रूप से संयोजित, निवेशित एक धनराशि 2 वर्ष के अंत में ₹10,800 तथा 3 वर्ष के अंत में ₹12,960 हो जाती है। निवेशित धनराशि कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹9,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे वर्ष के अंत से तीसरे वर्ष के अंत तक, ₹10,800 पर एक वर्ष का ब्याज मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे वर्ष का ब्याज = ₹12,960 − ₹10,800 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,160</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर = (2,160 / 10,800) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब ₹10,800 को दो वर्ष पीछे ले जाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्ष बाद मिश्रधन = P × (120%)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,800 = P × 1.44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = 10,800 / 1.44 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: P = A / (1 + R/100)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 10,800 / (1.2 × 1.2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹7,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निवेशित धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,500 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह छोटी से छोटी संख्या कौन-सी है जिसे 539 में जोड़ने पर प्राप्त संख्या 10, 15 और 3 से पूर्णतः विभाज्य हो जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो संख्या 10, 15 और 3 तीनों से विभाज्य होगी, वह इनके LCM (लघुत्तम समापवर्त्य) से भी विभाज्य होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 = 2 × 5, 15 = 3 × 5 तथा 3 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2 × 3 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 539 को 30 से भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">539 = (30 × 17) + 29, अतः शेषफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">539 के बाद 30 का अगला गुणज 30 × 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">540</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जोड़ी जाने वाली संख्या = 540 − 539 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जोड़ी जाने वाली छोटी से छोटी संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार्यशाला में श्रमिकों की संख्या 25% बढ़ गई जबकि एक श्रमिक की औसत दैनिक मजदूरी 8% घट गई। पहले कुल दैनिक मजदूरी व्यय ₹1,20,000 था। नया कुल दैनिक मजदूरी व्यय कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,32,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,35,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,40,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,38,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मजदूरी व्यय, श्रमिकों की संख्या और औसत मजदूरी का गुणनफल होता है, अतः दोनों परिवर्तन इसी पर लागू होंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्रमिकों की संख्या पहले की संख्या का 125% हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत मजदूरी पहले की औसत का 92% हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया मजदूरी व्यय = ₹1,20,000 × 125% × 92%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,20,000 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,50,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,50,000 × 92% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,38,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: कुल गुणक = 125% × 92% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">115%</span><span style=\"font-family:'Mangal'\">, अर्थात् व्यय 15% बढ़ जाता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹1,20,000 × 115%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹1,38,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नया कुल दैनिक मजदूरी व्यय </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,38,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे दी गई सारणी में एक कारखाने की दो इकाइयों का चार वर्षों का उत्पादन (टन में) दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790151870664_image001.png\" width=\"442\" height=\"115\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार वर्षों में इकाई B का कुल उत्पादन, इन्हीं वर्षों में इकाई A के कुल उत्पादन से कितने प्रतिशत अधिक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22.5%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले प्रत्येक इकाई के चारों वर्षों के आँकड़े जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इकाई A का कुल उत्पादन = 120 + 150 + 180 + 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">700 टन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इकाई B का कुल उत्पादन = 175 + 200 + 250 + 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">875 टन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 875 − 700 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">175 टन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तुलना इकाई A से है, अतः इकाई A का कुल उत्पादन आधार होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट प्रतिशत = (175 / 700) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इकाई B का कुल उत्पादन, इकाई A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">25% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> अधिक है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सिपाही एक चोर को अपने से 250 m आगे देखता है और तुरंत उसका पीछा करना शुरू कर देता है। उसी क्षण चोर भी भागना शुरू कर देता है। यदि चोर 10 km/h की चाल से तथा सिपाही 12 km/h की चाल से दौड़ता है, तो पकड़े जाने से पहले चोर कितनी दूरी तय करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,250 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,500 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,125 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों एक ही दिशा में दौड़ रहे हैं, अतः उनके बीच की दूरी चालों के अंतर से घटती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सापेक्ष चाल = 12 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घटाई जाने वाली दूरी = 250 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.25 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पकड़ने में लगा समय = दूरी / सापेक्ष चाल</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 0.25 / 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.125 घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चोर द्वारा तय दूरी = चाल × समय</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 10 × 0.125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1.25 km = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,250 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: सिपाही 12 × 0.125 = 1.5 km चलता है, जो चोर से 250 m अधिक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पकड़े जाने से पहले चोर </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,250 m (विकल्प B)</span><span style=\"font-family:'Mangal'\"> दूरी तय करता है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q और R के मासिक वेतन 3 : 4 : 5 के अनुपात में हैं। उनके वेतनों में क्रमशः 20%, 15% और 10% की वृद्धि की जाती है। उनके नए वेतनों का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 : 23 : 28</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 : 46 : 55</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 : 23 : 22</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 : 8 : 11</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात बनाए रखने के लिए वेतन 3x, 4x तथा 5x लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P का नया वेतन = 3x × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.6x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q का नया वेतन = 4x × 115% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.6x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R का नया वेतन = 5x × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5.5x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया अनुपात = 3.6x : 4.6x : 5.5x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दशमलव हटाने के लिए प्रत्येक पद को 10 से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 36 : 46 : 55</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन तीनों संख्याओं का कोई उभयनिष्ठ गुणनखंड नहीं है, अतः अनुपात न्यूनतम रूप में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उनके नए वेतनों का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 : 46 : 55 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक 5 सदस्यों वाले परिवार की औसत आयु 24 वर्ष है। परिवार का सबसे छोटा सदस्य 8 वर्ष का है। सबसे छोटे सदस्य के जन्म के समय परिवार की औसत आयु कितनी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 वर्ष</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे छोटे सदस्य के जन्म के समय परिवार में शेष 4 सदस्य ही थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 सदस्यों की वर्तमान कुल आयु = 24 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष 4 सदस्यों की वर्तमान कुल आयु = 120 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">112 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 वर्ष पहले इन 4 सदस्यों में से प्रत्येक 8 वर्ष छोटा था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 वर्ष पहले उनकी कुल आयु = 112 − (4 × 8) = 112 − 32 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस समय औसत आयु = 80 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उस समय परिवार की औसत आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष (विकल्प A)</span><span style=\"font-family:'Mangal'\"> थी।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज ABC में ∠A = 30°, ∠B = 60° तथा ∠C = 90° है। त्रिभुज DEF में ∠D = 30°, ∠E = 60° तथा ∠F = 90° है। यदि AB:DE = 2:3 हो, तो दोनों त्रिभुजों के क्षेत्रफलों का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2:1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1:2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4:9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3:5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दोनों त्रिभुजों के कोणों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠A = ∠D = 30°, ∠B = ∠E = 60° तथा ∠C = ∠F = 90°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों कोण बराबर हैं, अतः ΔABC और ΔDEF समरूप हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समरूप त्रिभुजों के क्षेत्रफलों का अनुपात, संगत भुजाओं के वर्गों के अनुपात के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔABC का क्षेत्रफल : ΔDEF का क्षेत्रफल = AB² : DE²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2² : 3²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्षेत्रफलों का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">4:9 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 विद्यार्थियों के अंक नीचे \"से कम\" वितरण के रूप में दिए गए हैं। अंकों का माध्यक ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790151870664_image002.png\" width=\"442\" height=\"137\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">\"से कम\" सारणी संचयी बारंबारता देती है, अतः पहले प्रत्येक वर्ग की बारंबारता ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0-10: </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, 10-20: 14 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\">, 20-30: 26 − 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\">, 30-40: 34 − 26 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">, 40-50: 40 − 34 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्यार्थियों की कुल संख्या, N = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संचयी बारंबारता पहली बार वर्ग </span><span style=\"font-weight:bold;font-family:'Mangal'\">20-30</span><span style=\"font-family:'Mangal'\"> में 20 को पार करती है, अतः यही माध्यक वर्ग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ l = 20, cf = 14, f = 12 तथा h = 10 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्यक = l + [(N/2 − cf) / f] × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + [(20 − 14) / 12] × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + (6/12) × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंकों का माध्यक </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कक्षा के 31 विद्यार्थियों की औसत आयु 35 वर्ष है। यदि शिक्षक की आयु भी सम्मिलित कर ली जाए, तो पूरे समूह की औसत आयु 36 वर्ष हो जाती है। शिक्षक की आयु (वर्षों में) कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">67</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">69</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत, कुल योग में सदस्यों की संख्या का भाग देने पर मिलता है, अतः कुल योग से चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31 विद्यार्थियों की कुल आयु = 31 × 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,085 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शिक्षक सहित समूह में 31 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 सदस्य</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूह की कुल आयु = 32 × 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,152 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शिक्षक की आयु = 1,152 − 1,085 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">67 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: शिक्षक की आयु = नया औसत + (विद्यार्थियों की संख्या × औसत में वृद्धि)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 36 + (31 × 1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शिक्षक की आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">67 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप A एक टंकी को 12 घंटे में तथा पाइप B उसी टंकी को 18 घंटे में भर सकता है। दोनों पाइप एक साथ खोले जाते हैं, परंतु कुछ समय बाद B बंद कर दिया जाता है और टंकी कुल 9 घंटे में पूरी भर जाती है। पाइप B कितने घंटे बाद बंद किया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 घंटे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 घंटे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.5 घंटे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 घंटे</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप A पूरे 9 घंटे चलता है, अतः पहले उसका भाग ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A द्वारा 1 घंटे में भरा गया भाग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A द्वारा 9 घंटे में भरा गया भाग = 9 × (1/12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप B के लिए शेष भाग = 1 − 3/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B द्वारा 1 घंटे में भरा गया भाग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B जितने समय चला = (1/4) × 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.5 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 4.5 घंटे में B, 4.5 × (1/18) = 1/4 भाग भरता है तथा 3/4 + 1/4 = 1 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पाइप B </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.5 घंटे (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बाद बंद किया गया।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि α और β समीकरण x² − 7x + 10 = 0 के मूल हैं, तो (1/α) + (1/β) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7/10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10/7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7/2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2/7</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ax² + bx + c = 0 के लिए मूलों का योग −b/a तथा मूलों का गुणनफल c/a होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ a = 1, b = −7 तथा c = 10 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">α + β = 7 तथा αβ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक को समान हर पर लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1/α) + (1/β) = (β + α) / (αβ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 7/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणनखंड से जाँच: x² − 7x + 10 = (x − 2)(x − 5), अतः मूल 2 और 5 हैं तथा 1/2 + 1/5 = 7/10 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">7/10 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ठेकेदार ने एक सड़क 40 दिन में बनाने का ठेका लिया और 60 आदमी लगाए। 25 दिन बाद उसने पाया कि सड़क का केवल एक-तिहाई भाग ही बना है। सड़क को ठीक समय पर पूरा करने के लिए उसे कितने अतिरिक्त आदमी लगाने होंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:
