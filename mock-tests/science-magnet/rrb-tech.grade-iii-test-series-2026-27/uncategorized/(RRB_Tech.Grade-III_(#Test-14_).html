रखती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790151764757_image001.png\" style=\"width: 652px; height: 200px;\" /></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(ii), (d)-(iv)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गुरुत्वानुवर्तन</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुरुत्व</span><span style=\"font-family:'Mangal'\">: गुरुत्व के खिंचाव के कारण प्ररोह ऊपर की ओर और जड़ नीचे की ओर बढ़ती है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जलानुवर्तन</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल</span><span style=\"font-family:'Mangal'\">: जड़ मुड़कर उसी ओर बढ़ती है जिस ओर जल उपलब्ध होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रसायनानुवर्तन</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">रसायन</span><span style=\"font-family:'Mangal'\">: परागनलिका का बीजांड की ओर बढ़ना इसी प्रकार की गति है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाशानुवर्तन</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश</span><span style=\"font-family:'Mangal'\">: प्ररोह उसी ओर झुक जाता है जिस ओर से उस पर प्रकाश पड़ता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरंभिक मॉडलों में से एक में परमाणु को धन आवेश के गोले के रूप में माना गया था, जिसमें इलेक्ट्रॉन पूरे गोले में फैले हुए थे। यह मॉडल कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रहीय मॉडल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाभिकीय मॉडल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोश मॉडल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लम पुडिंग मॉडल</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टॉमसन जानते थे कि परमाणु में इलेक्ट्रॉन ऋण आवेशित होने पर भी परमाणु विद्युत उदासीन रहता है, अतः उन्हें धन आवेश को कहीं रखना ही था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए उन्होंने परमाणु को </span><span style=\"font-weight:bold;font-family:'Mangal'\">धन आवेश का गोला माना जिसमें इलेक्ट्रॉन सर्वत्र बिखरे हुए</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह ठीक उस पुडिंग जैसा है जिसमें आलूबुखारे धँसे हों, इसीलिए इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लम पुडिंग मॉडल</span><span style=\"font-family:'Mangal'\"> कहा गया; इसी को तरबूज के रूप में भी दर्शाया जाता है, जिसमें लाल गूदा धन आवेशित पदार्थ और बीज इलेक्ट्रॉन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रहीय</span><span style=\"font-family:'Mangal'\"> अथवा </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाभिकीय</span><span style=\"font-family:'Mangal'\"> मॉडल रदरफ़ोर्ड का था, जिसमें सारा धन आवेश एक अत्यंत छोटे नाभिक में रहता है, जबकि कोश मॉडल इलेक्ट्रॉनों के कोशों में व्यवस्थित होने का वर्णन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह मॉडल प्लम पुडिंग मॉडल है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. लार में एक एंजाइम होता है जो स्टार्च को तोड़कर सरल शर्करा बना देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पित्त लवण वसा पर लगभग वैसे ही क्रिया करते हैं जैसे साबुन मैल पर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कूपिकाओं की भित्ति में रुधिर वाहिकाओं का घना जाल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. लार में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लार एमाइलेस</span><span style=\"font-family:'Mangal'\"> नामक एंजाइम होता है, जो जटिल अणु स्टार्च को तोड़कर सरल शर्करा बना देता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पित्त लवण वसा की बड़ी गोलिकाओं को छोटी गोलिकाओं में तोड़ देते हैं, और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">इमल्सीकरण की क्रिया वैसी ही है जैसी साबुन मैल पर करता</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कूपिकाओं</span><span style=\"font-family:'Mangal'\"> की भित्ति में रुधिर वाहिकाओं का घना जाल होता है, इसलिए वहीं ऑक्सीजन ली जाती है और कार्बन डाइऑक्साइड छोड़ी जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 kg द्रव्यमान के एक ड्रम को 5 m लंबी चिकनी ढलान के सहारे 1.5 m ऊँचे चबूतरे पर चढ़ाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">g = 10 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> लेने पर उसे एक समान चाल से ऊपर ले जाने के लिए आवश्यक प्रयास है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 N</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ढलान पर प्रयास ड्रम को ढलान की पूरी लंबाई तक ले जाता है, जबकि ड्रम केवल चबूतरे की ऊँचाई तक ही ऊपर उठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर्षण छोड़ देने पर प्रयास द्वारा किया गया कार्य प्राप्त स्थितिज ऊर्जा के बराबर होता है, अतः F × L = mgh.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F = (m × g × h) / L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (60 × 10 × 1.5) / 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 900 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">180 N</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ड्रम को सीधे ऊपर उठाने में mg = 600 N लगता, अतः ढलान प्रयास घटा देती है, और अधिक लंबी ढलान उसे और भी घटा देती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवश्यक प्रयास 180 N है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दृष्टि दोषों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निकट दृष्टि दोष वाली आँख में दूर की वस्तु का प्रतिबिंब रेटिना के सामने बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दूर दृष्टि दोष तब हो सकता है जब आँख के लेंस की फोकस दूरी अधिक हो जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दूर दृष्टि दोष अवतल लेंस से ठीक किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">निकट दृष्टि दोष</span><span style=\"font-family:'Mangal'\"> में आँख का लेंस प्रकाश को आवश्यकता से अधिक मोड़ देता है अथवा नेत्रगोलक लंबा हो जाता है, इसलिए दूर की वस्तु का प्रतिबिंब </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेटिना के सामने</span><span style=\"font-family:'Mangal'\"> बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूर दृष्टि दोष</span><span style=\"font-family:'Mangal'\"> में पास की वस्तु का प्रकाश रेटिना के पीछे फोकसित होता है, और ऐसा तब होता है जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">आँख के लेंस की फोकस दूरी अधिक</span><span style=\"font-family:'Mangal'\"> हो जाए अथवा नेत्रगोलक छोटा रह जाए → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दूर दृष्टि दोष </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल</span><span style=\"font-family:'Mangal'\"> लेंस से ठीक किया जाता है, जो आँख में कम पड़ रही अभिसरण शक्ति जोड़ देता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल</span><span style=\"font-family:'Mangal'\"> लेंस तो निकट दृष्टि दोष ठीक करने के लिए लगाया जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीलकुरिंजी एक ऐसा पौधा है जो केवल भारत में उगता है, संसार में और कहीं नहीं। ऐसी जाति कहलाती है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानिक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विलुप्त</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विदेशी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पालतू</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो जाति संसार में </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल एक ही क्षेत्र में मिलती है, और कहीं नहीं</span><span style=\"font-family:'Mangal'\">, उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थानिक</span><span style=\"font-family:'Mangal'\"> जाति कहते हैं, और नीलकुरिंजी भारत की एक स्थानिक जाति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन क्षेत्रों में स्थानिक जातियाँ बड़ी संख्या में होती हैं और जिनका बहुत-सा आवास नष्ट भी हो चुका है, उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैव विविधता के तप्त स्थल</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विलुप्त</span><span style=\"font-family:'Mangal'\"> जाति वह है जो अब कहीं भी जीवित नहीं मिलती, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">विदेशी</span><span style=\"font-family:'Mangal'\"> जाति वह है जो किसी दूसरे क्षेत्र से लाई गई हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पालतू</span><span style=\"font-family:'Mangal'\"> जाति वह है जिसे मनुष्य ने पीढ़ियों तक पालकर अपने उपयोग के लिए बदल लिया हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसी जाति स्थानिक कहलाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्यार्थी दो ठेलों को, जिनमें एक भारी और एक हल्का है, समान बल से धकेलता है। न्यूटन के द्वितीय नियम के अनुसार उनके त्वरणों का क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारी ठेला शून्य त्वरण से चलेगा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हल्का ठेला भारी ठेले की तुलना में अधिक त्वरित होगा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारी ठेला हल्के ठेले की तुलना में अधिक त्वरित होगा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों ठेले बराबर त्वरित होंगे</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के द्वितीय नियम से किसी वस्तु पर नेट बल F = ma होता है, अतः उत्पन्न त्वरण a = F/m होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान बल</span><span style=\"font-family:'Mangal'\"> पर त्वरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक द्रव्यमान के लिए कम और कम द्रव्यमान के लिए अधिक</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी कारण समान धक्के से हल्की वस्तु को चलाना भारी वस्तु की तुलना में सरल होता है, और समान बल से खींचे जा रहे ठेले का द्रव्यमान दोगुना करने पर उसका त्वरण आधा रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी भी ठेले का त्वरण शून्य नहीं हो सकता, क्योंकि दोनों पर नेट बल लग रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हल्का ठेला भारी ठेले की तुलना में अधिक त्वरित होगा </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साबुन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. साबुन के अणु का एक सिरा जल से क्रिया करता है और दूसरा सिरा हाइड्रोकार्बन से क्रिया करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जल के भीतर साबुन के अणु अपनी हाइड्रोकार्बन पूँछों को भीतर रखकर गुच्छा बना लेते हैं, जिसे मिसेल कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. साबुन कठोर जल में आसुत जल की तुलना में अधिक झाग देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. साबुन के अणु का एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलरागी सिरा</span><span style=\"font-family:'Mangal'\"> जल से क्रिया करता है और दूसरा </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलविरागी सिरा</span><span style=\"font-family:'Mangal'\"> हाइड्रोकार्बन से क्रिया करता है, इसलिए एक ही अणु तेल और जल दोनों को पकड़ सकता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जल के भीतर ये अणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोकार्बन पूँछों को भीतर तथा आयनिक सिरों को बाहर</span><span style=\"font-family:'Mangal'\"> रखकर गुच्छा बना लेते हैं, और इसी गुच्छे को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मिसेल</span><span style=\"font-family:'Mangal'\"> कहते हैं; तेलीय मैल उसके बीच में इकट्ठा हो जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. साबुन आसुत या वर्षा के जल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> झाग देता है; कठोर जल में तो सफ़ेद दहीनुमा अवक्षेप बनता है और झाग बहुत कम बनता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसीटोन और जल के मिश्रण को इस प्रकार अलग करना है कि दोनों द्रव प्राप्त हो जाएँ। इसके लिए उपयुक्त विधि है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निस्यंदन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊर्ध्वपातन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निस्तारण</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसीटोन और जल दो ऐसे द्रव हैं जो आपस में पूरी तरह मिल जाते हैं, इसलिए बैठ जाने या रुक जाने पर आधारित कोई विधि इन्हें अलग नहीं कर सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्वथनांकों में पर्याप्त अंतर</span><span style=\"font-family:'Mangal'\"> होता है, अतः मिश्रण को गर्म करने पर पहले ऐसीटोन वाष्प में बदल जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आसवन</span><span style=\"font-family:'Mangal'\"> में इस वाष्प को आगे ले जाकर ठंडा किया जाता है और वह फिर द्रव बन जाता है, जिसे अलग एकत्र कर लिया जाता है; जल पीछे रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">निस्यंदन</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">निस्तारण</span><span style=\"font-family:'Mangal'\"> से तो केवल अघुलनशील ठोस या बैठी हुई परत ही द्रव से अलग होती है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्ध्वपातन</span><span style=\"font-family:'Mangal'\"> केवल उस ठोस के लिए काम आता है जो सीधे वाष्प में बदल जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उपयुक्त विधि आसवन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): पालक की पत्तियों के हरे निष्कर्ष में उपस्थित विभिन्न वर्णकों को पेपर क्रोमैटोग्राफ़ी से अलग किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): पेपर क्रोमैटोग्राफ़ी से अलग किए जाने वाले प्रत्येक मिश्रण के लिए जल ही उपयुक्त विलायक होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेपर क्रोमैटोग्राफ़ी में मिश्रण के पदार्थ इसलिए अलग हो जाते हैं क्योंकि चलता हुआ विलायक उन्हें कागज़ पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न-भिन्न दूरियों</span><span style=\"font-family:'Mangal'\"> तक ले जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पालक की पत्तियों के हरे निष्कर्ष में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक से अधिक वर्णक</span><span style=\"font-family:'Mangal'\"> होते हैं, और ये वर्णक कागज़ पर भिन्न रंगों की पट्टियों के रूप में सचमुच अलग हो जाते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल प्रत्येक स्थिति में विलायक का काम </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> करता; अनेक मिश्रणों के लिए दूसरा विलायक, जैसे ऐल्कोहॉल या विलायकों का मिश्रण, लेना पड़ता है → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक लड़की ने किसी चट्टान के पास ताली बजाई और 4 s बाद प्रतिध्वनि सुनी। यदि ध्वनि की चाल 320 m/s ली जाए, तो लड़की से चट्टान की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1280 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">320 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">640 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब ध्वनि चट्टान जैसी कठोर सतह से परावर्तित होकर लौटती है, तब प्रतिध्वनि सुनाई देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन 4 s में ध्वनि लड़की से चट्टान तक जाकर लौटती है, अतः वह चट्टान की दूरी का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुना</span><span style=\"font-family:'Mangal'\"> पथ तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तय किया गया कुल पथ = चाल × समय = 320 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1280 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चट्टान की दूरी = 1280 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">640 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चट्टान लड़की से 640 m दूर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप कोशिका भित्ति के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यह मुख्यतः सेल्यूलोज से बनी होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यह पूर्णतः अपारगम्य होती है, इसलिए उसमें से कुछ भी नहीं जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जंतु कोशिका में कोशिका भित्ति नहीं होती, इसलिए वह अपनी आकृति सरलता से बदल सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पादप कोशिका भित्ति मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">सेल्यूलोज</span><span style=\"font-family:'Mangal'\"> से बनी होती है, जो अनेक ग्लूकोस इकाइयों के जुड़ने से बना कार्बोहाइड्रेट है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कोशिका भित्ति दृढ़ अवश्य होती है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">पारगम्य</span><span style=\"font-family:'Mangal'\"> होती है: जल और कुछ घुले हुए खनिज उसमें से सरलता से निकल जाते हैं, और इसी से जड़ें मिट्टी से जल तथा पोषक पदार्थ लेती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दृढ़ कोशिका भित्ति न होने के कारण </span><span style=\"font-weight:bold;font-family:'Mangal'\">जंतु कोशिका अपनी आकृति सरलता से बदल सकती</span><span style=\"font-family:'Mangal'\"> है, इसीलिए जंतु कोशिकाओं की कोई निश्चित आकृति नहीं होती → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाँदी के संक्षारण पर उस पर जो काली परत बनती है, वह क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक ऑक्साइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर ऑक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयरन ऑक्साइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिल्वर सल्फ़ाइड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संक्षारण वह प्रक्रम है जिसमें आसपास की वायु की गैसें तथा नमी धातु को धीरे-धीरे खा जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाँदी की वस्तुएँ कुछ समय बाद इसलिए काली पड़ जाती हैं क्योंकि चाँदी वायु में उपस्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">सल्फर</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिल्वर सल्फ़ाइड</span><span style=\"font-family:'Mangal'\"> की परत बना लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह परत स्वयं चाँदी के ही यौगिक की है, अतः वह ज़िंक, कॉपर या आयरन का ऑक्साइड नहीं हो सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम का व्यवहार भिन्न है: उस पर बनी पतली ऑक्साइड परत तो धातु को आगे के संक्षारण से बचा ही लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चाँदी पर बनी काली परत सिल्वर सल्फ़ाइड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवों के वर्गीकरण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दो जगत प्रणाली ने सभी जीवों को प्लांटी तथा ऐनिमेलिया में बाँटा था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रोटिस्टा जगत उन जीवों के लिए जोड़ा गया जो प्रायः एककोशिकीय होते हैं और जिनमें वास्तविक केंद्रक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पाँच जगत प्रणाली में कवकों को पौधों के साथ ही रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अठारहवीं शताब्दी में वैज्ञानिकों ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो जगत प्रणाली</span><span style=\"font-family:'Mangal'\"> अपनाई थी, जिसमें प्रत्येक जीव या तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लांटी में या ऐनिमेलिया</span><span style=\"font-family:'Mangal'\"> में रखा जाता था → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दो जगत प्रणाली में अमीबा और पैरामीशियम जैसे जीवों को रखना कठिन था, इसलिए प्रायः एककोशिकीय और वास्तविक केंद्रक वाले जीवों के लिए तीसरा जगत </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटिस्टा</span><span style=\"font-family:'Mangal'\"> जोड़ा गया → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कवकों को पौधों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग</span><span style=\"font-family:'Mangal'\"> करके उनका अपना जगत बनाया गया, और इसी से वर्गीकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँच जगत</span><span style=\"font-family:'Mangal'\"> प्रणाली बना → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्केन की समजातीय श्रेणी का प्रत्येक अगला सदस्य अपने पिछले सदस्य से जिस इकाई के अंतर से भिन्न होता है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार्बन और तीन हाइड्रोजन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो कार्बन और दो हाइड्रोजन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार्बन और दो हाइड्रोजन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो कार्बन और तीन हाइड्रोजन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समजातीय श्रेणी यौगिकों की वह श्रेणी है जिसमें प्रत्येक सदस्य अपने पिछले सदस्य से एक निश्चित इकाई के अंतर से भिन्न होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्केन श्रेणी में मेथेन CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> के बाद ईथेन C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> आता है, और ईथेन के बाद प्रोपेन C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सदस्य से अगले सदस्य तक एक कार्बन परमाणु और दो हाइड्रोजन परमाणु जुड़ते हैं, अर्थात् एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">-CH</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">- इकाई</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी क्रम से अणु द्रव्यमान लगातार बढ़ता है तथा गलनांक और क्वथनांक में क्रमिक परिवर्तन दिखता है, जबकि क्रियात्मक समूह न बदलने के कारण रासायनिक गुण एक जैसे बने रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह इकाई एक कार्बन और दो हाइड्रोजन की है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): रदरफ़ोर्ड का परमाणु मॉडल यह नहीं समझा सका कि परमाणु स्थायी क्यों है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): नाभिक के चारों ओर घूमता हुआ इलेक्ट्रॉन लगातार त्वरित होता रहता है, अतः उसे ऊर्जा खोकर सर्पिल पथ पर नाभिक में गिर जाना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रदरफ़ोर्ड ने इलेक्ट्रॉनों को नाभिक के चारों ओर घूमते हुए माना, ठीक वैसे ही जैसे ग्रह सूर्य के चारों ओर घूमते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृत्त में चलता हुआ आवेशित कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगातार त्वरित</span><span style=\"font-family:'Mangal'\"> होता है, और ऐसे कण को निरंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्जा खोनी</span><span style=\"font-family:'Mangal'\"> चाहिए; तब इलेक्ट्रॉन सर्पिल पथ पर चलकर नाभिक में गिर जाता और परमाणु ढह जाता → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु परमाणु वास्तव में </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थायी</span><span style=\"font-family:'Mangal'\"> हैं और हमारे चारों ओर का पदार्थ बना रहता है, इसलिए रदरफ़ोर्ड का मॉडल इसी बिंदु पर पूर्णतः सही नहीं पाया गया → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R में बताई गई यही ऊर्जा हानि वह बात है जिसका उत्तर उनका मॉडल नहीं दे सका, अतः R ही A का कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> आयन बनाता है और ऑक्सीजन O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> आयन बनाती है। ऐलुमिनियम ऑक्साइड का सूत्र है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक में कुल धन आवेश कुल ऋण आवेश के बराबर होना चाहिए, और सूत्र आवेशों की अदला-बदली करके लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों आयनों को साथ-साथ लिखिए, Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> तथा O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\">, और संख्याओं की अदला-बदली कीजिए: ऐलुमिनियम का 3 ऑक्सीजन का पादांक बन जाता है और ऑक्सीजन का 2 ऐलुमिनियम का पादांक बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> मिलता है, और पादांक 2 तथा 3 का कोई उभयनिष्ठ गुणनखंड न होने के कारण इन्हें और छोटा नहीं किया जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवेश जाँचने पर 2 × (+3) = +6 तथा 3 × (−2) = −6, अतः यह यौगिक उदासीन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐलुमिनियम ऑक्साइड का सूत्र Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक माली गुलाब के ऐसे बहुत से पौधे तैयार करना चाहता है जिन सब पर बिल्कुल एक ही रंग के फूल आएँ। उसे प्रयोग करना चाहिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस पौधे के बीज</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर-परागण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस पौधे के बीजाणु</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस पौधे की तना कलम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कलम</span><span style=\"font-family:'Mangal'\"> से उगाया गया पौधा जनक पौधे के ही एक टुकड़े से बनता है, इसलिए उसमें जनक के समान लक्षण रहते हैं और उन सब पर एक ही रंग के फूल आते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कलम लगाना, रोपण, दाब लगाना तथा ऊतक संवर्धन </span><span style=\"font-weight:bold;font-family:'Mangal'\">कायिक प्रवर्धन</span><span style=\"font-family:'Mangal'\"> की विधियाँ हैं, जिन्हें उद्यान वैज्ञानिकों ने एक प्राकृतिक प्रक्रम से विकसित किया है और जिनसे मनचाहे पौधे बड़े पैमाने पर तैयार किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बीज</span><span style=\"font-family:'Mangal'\"> से उगे पौधे युग्मकों के संलयन से बनते हैं, अतः उनमें विभिन्नता आती है और उन पर एक ही रंग के फूल आना आवश्यक नहीं, तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर-परागण</span><span style=\"font-family:'Mangal'\"> विभिन्नता और बढ़ा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुलाब </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणुओं</span><span style=\"font-family:'Mangal'\"> से प्रजनन करता ही नहीं; बीजाणु तो कवक जाल और फ़र्न जैसे जीवों में बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे उस पौधे की तना कलम का प्रयोग करना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मटर के पौधे की ऊँचाई और उसके बीजों की आकृति सदैव एक ही इकाई के रूप में साथ-साथ वंशागत होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): गोल बीज वाले लंबे पौधे तथा झुर्रीदार बीज वाले बौने पौधे के संकरण की दूसरी पीढ़ी में झुर्रीदार बीज वाले लंबे पौधों जैसे नए संयोजन दिखाई देते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल बीज वाले लंबे पौधे का झुर्रीदार बीज वाले बौने पौधे से संकरण कराने पर पहली पीढ़ी के सभी पौधे गोल बीज वाले और लंबे होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरी पीढ़ी</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">झुर्रीदार बीज वाले लंबे</span><span style=\"font-family:'Mangal'\"> पौधे तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोल बीज वाले बौने</span><span style=\"font-family:'Mangal'\"> पौधे भी दिखाई देते हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि दोनों लक्षण साथ-साथ ही चलते, तो ये नए संयोजन बन ही नहीं सकते थे, अतः ऊँचाई और बीज की आकृति एक-दूसरे से </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वतंत्र रूप से वंशागत</span><span style=\"font-family:'Mangal'\"> होती हैं → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए प्रत्येक जनन कोशिका में जीनों का केवल एक ही समुच्चय होना आवश्यक है, जिससे दोनों लक्षणों के जीन अलग-अलग आगे जा सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किन प्लैस्टिड में वे वर्णक होते हैं जो पौधों को पीला, नारंगी या लाल रंग देते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रोमोप्लास्ट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्लोरोप्लास्ट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एमाइलोप्लास्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ल्यूकोप्लास्ट</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों में भोजन बनाने और संचित करने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लैस्टिड</span><span style=\"font-family:'Mangal'\"> नामक विशेष कोशिकांग होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फूलों की पंखुड़ियों और फलों के वे प्लैस्टिड, जिनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरोफ़िल के अतिरिक्त</span><span style=\"font-family:'Mangal'\"> दूसरे वर्णक होते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रोमोप्लास्ट</span><span style=\"font-family:'Mangal'\"> कहलाते हैं, और यही वर्णक पीला, नारंगी तथा लाल रंग देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रोमोप्लास्ट के चमकीले रंग परागणकर्ताओं को तथा बीज दूर ले जाने वाले जंतुओं को आकर्षित करने में सहायक होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरोप्लास्ट</span><span style=\"font-family:'Mangal'\"> में हरा वर्णक क्लोरोफ़िल होता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">ल्यूकोप्लास्ट</span><span style=\"font-family:'Mangal'\"> में कोई वर्णक नहीं होता और वे रंगहीन होते हैं, तथा एमाइलोप्लास्ट वे रंगहीन प्लैस्टिड हैं जिनमें स्टार्च संचित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये वर्णक क्रोमोप्लास्ट में होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): धारावाही परिनालिका के भीतर रखा नरम लोहे का टुकड़ा चुंबक बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): धारावाही परिनालिका के भीतर प्रबल चुंबकीय क्षेत्र उत्पन्न होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिनालिका के भीतर रखी नरम लोहे की छड़ धारा बहने तक सचमुच चुंबक बन जाती है, और इसी प्रकार विद्युत चुंबक बनाया जाता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही परिनालिका के भीतर क्षेत्र रेखाएँ समांतर सरल रेखाएँ होती हैं, जिससे पता चलता है कि वहाँ क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल है और सभी बिंदुओं पर समान</span><span style=\"font-family:'Mangal'\"> है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुंडली के भीतर का यही प्रबल क्षेत्र नरम लोहे को चुंबक बनाता है, अतः R ही A का कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युतरोधी ताँबे के तार के अनेक पास-पास लिपटे फेरों वाली कुंडली के भीतर नरम लोहे की छड़ रखकर कुंडली में धारा प्रवाहित की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह व्यवस्था कार्य करती है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत मोटर के रूप में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैल्वेनोमीटर के रूप में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थायी चुंबक के रूप में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत चुंबक के रूप में</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युतरोधी ताँबे के तार के अनेक वृत्ताकार फेरों को बेलन के आकार में पास-पास लपेटकर बनाई गई कुंडली </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिनालिका</span><span style=\"font-family:'Mangal'\"> कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही परिनालिका के भीतर प्रबल चुंबकीय क्षेत्र उत्पन्न होता है, और यही क्षेत्र कुंडली के भीतर रखे </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरम लोहे जैसे चुंबकीय पदार्थ को चुंबक बना देता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार बने चुंबक को </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत चुंबक</span><span style=\"font-family:'Mangal'\"> कहते हैं, और वह तभी तक चुंबक रहता है जब तक धारा बहती रहे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत मोटर विद्युत ऊर्जा को गति में बदलती है और गैल्वेनोमीटर धारा का पता लगाता है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थायी</span><span style=\"font-family:'Mangal'\"> चुंबक बिना किसी धारा के भी अपना चुंबकत्व बनाए रखता है, अतः वह इस प्रकार नहीं बनाया जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह व्यवस्था विद्युत चुंबक के रूप में कार्य करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी वस्तु के संवेग की दिशा उसके वेग की दिशा के समान होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. गोली चलाने पर बंदूक पर लगने वाले बल का परिमाण गोली पर लगने वाले बल के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. क्रिया और प्रतिक्रिया एक ही वस्तु पर लगती हैं, इसलिए वे एक-दूसरे को निरस्त कर देती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. संवेग द्रव्यमान और वेग का गुणनफल है, और द्रव्यमान सदैव धनात्मक होता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">संवेग की दिशा वेग की दिशा के समान</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. गोली चलाना क्रिया-प्रतिक्रिया का युग्म है, अतः बंदूक गोली को आगे धकेलती है और गोली बंदूक को </span><span style=\"font-weight:bold;font-family:'Mangal'\">उतने ही परिमाण</span><span style=\"font-family:'Mangal'\"> के बल से पीछे धकेलती है; गोली पर 2 N का बल लगने का अर्थ है बंदूक पर भी 2 N का प्रतिक्षेप बल → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. क्रिया और प्रतिक्रिया </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो भिन्न वस्तुओं</span><span style=\"font-family:'Mangal'\"> पर, अर्थात् अन्योन्यक्रिया करने वाली दोनों वस्तुओं पर एक-एक लगती हैं, इसलिए वे कभी एक-दूसरे को निरस्त नहीं करतीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तनु सोडियम हाइड्रॉक्साइड के विलयन में फ़ीनॉल्फ़्थेलिन की कुछ बूँदें डालने पर वह गुलाबी हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद तनु हाइड्रोक्लोरिक अम्ल बूँद-बूँद करके तब तक डाला जाता है जब तक गुलाबी रंग ठीक-ठीक समाप्त न हो जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब परखनली के द्रव में मुख्यतः है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड और जल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल सोडियम हाइड्रॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल हाइड्रोक्लोरिक अम्ल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन गैस</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़ीनॉल्फ़्थेलिन क्षारकीय विलयन में गुलाबी रहता है, अतः गुलाबी रंग बताता है कि सोडियम हाइड्रॉक्साइड उपस्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल डालते जाने पर वह क्षारक का प्रभाव समाप्त करता जाता है, और ठीक उसी क्षण गुलाबी रंग जाता है जब क्षारक पूरी तरह समाप्त हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल और क्षारक की अभिक्रिया से </span><span style=\"font-weight:bold;font-family:'Mangal'\">लवण तथा जल</span><span style=\"font-family:'Mangal'\"> बनते हैं, और यहाँ यह लवण </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम क्लोराइड</span><span style=\"font-family:'Mangal'\"> है: NaOH + HCl → NaCl + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदासीनीकरण अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है, अतः इस अवस्था पर न क्षारक बचा है और न अतिरिक्त अम्ल, तथा कोई गैस भी नहीं निकलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः द्रव में मुख्यतः सोडियम क्लोराइड और जल हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नर और मादा युग्मक के संलयन को निषेचन कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सरीसृपों, पक्षियों तथा स्तनधारियों में निषेचन मादा के शरीर के भीतर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मादा के शरीर के बाहर होने वाला निषेचन आंतरिक निषेचन कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-fami \"><span style=\"font-family:'Mangal'\">पहले</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाद्य शृंखला के जिन विभिन्न चरणों पर भोजन का स्थानांतरण होता है, उन्हें पोषक स्तर कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास अपना भोजन स्वयं बनाती है, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहले पोषक स्तर का उत्पादक</span><span style=\"font-family:'Mangal'\"> है; टिड्डा घास खाता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरे</span><span style=\"font-family:'Mangal'\"> स्तर का शाकाहारी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंढक टिड्डे को खाता है, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीसरे</span><span style=\"font-family:'Mangal'\"> स्तर का छोटा मांसाहारी है, और साँप मेंढक को खाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे मांसाहारियों को खाने वाले बड़े मांसाहारी, अर्थात् तृतीयक उपभोक्ता, </span><span style=\"font-weight:bold;font-family:'Mangal'\">चौथा पोषक स्तर</span><span style=\"font-family:'Mangal'\"> बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साँप चौथे पोषक स्तर का है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm फोकस दूरी वाले अवतल दर्पण के सामने 20 cm की दूरी पर एक वस्तु रखी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु का प्रति ><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दर्पण के सामने 30 cm पर बनता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तरंग के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दो क्रमागत शीर्षों के बीच की दूरी तरंगदैर्घ्य कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. किसी निश्चित बिंदु पर एक सेकंड में होने वाले दोलनों की संख्या आवृत्ति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. तरंग की आवृत्ति और आवर्तकाल एक-दूसरे के अनुक्रमानुपाती होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दो क्रमागत शीर्षों के बीच, अथवा दो क्रमागत गर्तों के बीच की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">तरंगदैर्घ्य</span><span style=\"font-family:'Mangal'\"> है, जिसे λ से लिखते हैं और मीटर में मापते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. किसी निश्चित बिंदु पर एक सेकंड में होने वाले दोलनों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवृत्ति</span><span style=\"font-family:'Mangal'\"> है, जिसे ν से लिखते हैं और हर्ट्ज़ में मापते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आवृत्ति और आवर्तकाल का संबंध ν = 1/T है, अतः वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">व्युत्क्रमानुपाती</span><span style=\"font-family:'Mangal'\"> हैं: आवर्तकाल जितना छोटा, आवृत्ति उतनी अधिक → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल के ऊपरी भाग में उपस्थित ओज़ोन जीवों के लिए महत्वपूर्ण है, क्योंकि वह:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साँस लेने के लिए ऑक्सीजन देती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रात में पृथ्वी को गरम रखती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हानिकारक पराबैंगनी विकिरण को अवशोषित करती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बादल बनाकर वर्षा कराती है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन ऑक्सीजन के </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन परमाणुओं</span><span style=\"font-family:'Mangal'\"> से बना अणु है, और वह उस ऑक्सीजन से भिन्न है जिसमें दो परमाणु होते हैं और जिसे हम साँस में लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल के ऊपरी भाग में ओज़ोन सूर्य से आने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">हानिकारक पराबैंगनी विकिरण को अवशोषित</span><span style=\"font-family:'Mangal'\"> कर लेती है, अतः वह पृथ्वी के जीवों के लिए कवच का काम करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धरती तक पहुँचने वाला पराबैंगनी विकिरण त्वचा कैंसर करता है और आँखों को हानि पहुँचाता है, इसीलिए ओज़ोन परत को होने वाली क्षति चिंता का विषय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन न साँस लेने में काम आती है, न पृथ्वी की ऊष्मा रोकती है, और न बादल बनाने या वर्षा कराने में उसका कोई भाग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ओज़ोन इसलिए महत्वपूर्ण है क्योंकि वह हानिकारक पराबैंगनी विकिरण को अवशोषित करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आयनिक यौगिकों के गलनांक तथा क्वथनांक प्रायः उच्च होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कपूर तथा नैफ़्थ =\"font-weight:bold;font-family:'Mangal'\">एक तत्व दूसरे तत्व को उसके यौगिक से विस्थापित कर देता</span><span style=\"font-family:'Mangal'\"> है, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">विस्थापन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन अभिक्रिया में दो या अधिक पदार्थ मिलकर एक ही उत्पाद देते हैं, अपघटन अभिक्रिया में एक पदार्थ टूटकर सरल पदार्थ देता है, और द्विविस्थापन अभिक्रिया में दो यौगिक अपने आयनों की अदला-बदली करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अभिक्रिया विस्थापन अभिक्रिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी के वायुमंडल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. इसमें मुख्यतः नाइट्रोजन लगभग 78 प्रतिशत तथा ऑक्सीजन लगभग 21 प्रतिशत होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यह पृथ्वी के गुरुत्वाकर्षण बल से अपने स्थान पर बना रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पृथ्वी की सतह के सबसे निकट की परत समतापमंडल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वायुमंडल में मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन लगभग 78 प्रतिशत</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन लगभग 21 प्रतिशत</span><span style=\"font-family:'Mangal'\"> होती है, और थोड़ी मात्रा में आर्गन, कार्बन डाइऑक्साइड, जलवाष्प तथा अन्य गैसें रहती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वायुमंडल पृथ्वी के </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुरुत्वाकर्षण</span><span style=\"font-family:'Mangal'\"> बल से पृथ्वी के चारों ओर बना रहता है, इसीलिए वह अंतरिक्ष में नहीं बिखर जाता → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. सतह के </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे निकट</span><span style=\"font-family:'Mangal'\"> की परत </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षोभमंडल</span><span style=\"font-family:'Mangal'\"> है, जो लगभग 12 km तक फैली है और जिसमें हमारे बादल तथा मौसम रहते हैं; समतापमंडल उसके ऊपर है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-b
