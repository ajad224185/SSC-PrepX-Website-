></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 + s = 3(9 − s)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 + s = 27 − 3s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = 18 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.5 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: अनुकूल चाल = 13.5 km/h तथा विपरीत चाल = 4.5 km/h, और 13.5 = 3 × 4.5 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धारा की चाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.5 km/h (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक वृत्त की परिधि, एक वर्ग के परिमाप के बराबर है। वृत्त के क्षेत्रफल तथा वर्ग के क्षेत्रफल का अनुपात क्या है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 : 14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 : 11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 : 11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 : 7</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल अनुपात पूछा गया है, अतः त्रिज्या का एक सुविधाजनक मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना वृत्त की त्रिज्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 cm</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिधि = 2 × (22/7) × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग का परिमाप = 44 cm, अतः उसकी भुजा = 44 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृत्त का क्षेत्रफल = (22/7) × 7 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">154 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग का क्षेत्रफल = 11 × 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">121 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात = 154 : 121</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पदों में 11 का भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 : 11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्षेत्रफलों का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 : 11 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 के पाँच क्रमागत गुणजों का योग 450 है। इन पाँच संख्याओं में सबसे बड़ी संख्या कौन-सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">102</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 के क्रमागत गुणजों में 6 का अंतर होता है, अतः ये समान अंतराल पर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच समान अंतराल वाली संख्याओं में बीच वाली संख्या ही उनका माध्य होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीच वाली संख्या = 450 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद की दो संख्याएँ 90 + 6 = 96 और 96 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">102</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँचों संख्याएँ 78, 84, 90, 96 तथा 102 हैं और इनका योग 450 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पाँचों में सबसे बड़ी संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">102 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 सेब बेचने पर एक फल विक्रेता को 4 सेबों के विक्रय मूल्य के बराबर हानि होती है। उसकी हानि प्रतिशत कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11.11%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि केवल प्रतिशत पूछा गया है, एक सेब का विक्रय मूल्य ₹1 मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 सेबों का विक्रय मूल्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हानि = 4 सेबों का विक्रय मूल्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रय मूल्य = विक्रय मूल्य + हानि</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹36 + ₹4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हानि प्रतिशत = (हानि / क्रय मूल्य) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (4 / 40) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसकी हानि प्रतिशत </span><span style=\"font-weight:bold;font-family:'Mangal'\">10% (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यापारी अपने सामान पर क्रय मूल्य से 40% अधिक अंकित करता है। वह आधा स्टॉक अंकित मूल्य पर, स्टॉक का एक-तिहाई भाग 20% की छूट पर तथा शेष स्टॉक 50% की छूट पर बेच देता है। उसका कुल लाभ प्रतिशत कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 वस्तुओं का स्टॉक लें जिनमें प्रत्येक का क्रय मूल्य ₹100 हो, क्योंकि 6, 2 और 3 दोनों से विभाज्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल क्रय मूल्य = 6 × ₹100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक वस्तु का अंकित मूल्य = ₹100 × 140% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹140</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आधा स्टॉक = 3 वस्तुएँ अंकित मूल्य पर = 3 × ₹140 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹420</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टॉक का एक-तिहाई = 2 वस्तुएँ ₹140 के 80% पर = 2 × ₹112 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹224</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष स्टॉक = 6 − 3 − 2 = 1 वस्तु ₹140 के 50% पर = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹70</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल विक्रय मूल्य = ₹420 + ₹224 + ₹70 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹714</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ = ₹714 − ₹600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹114</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ प्रतिशत = (114 / 600) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल लाभ </span><span style=\"font-weight:bold;font-family:'Mangal'\">19% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताजे अंगूरों में भार के अनुसार 80% जल होता है तथा सूखे अंगूरों में भार के अनुसार 15% जल होता है। 340 kg ताजे अंगूरों से कितने kg सूखे अंगूर प्राप्त होंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85 kg</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुखाने में केवल जल घटता है, अतः गूदे का भार पहले और बाद में समान रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताजे अंगूरों में गूदा = 100% − 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">340 kg ताजे अंगूरों में गूदा = 340 × 20% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">68 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूखे अंगूरों में गूदा = 100% − 15% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">85%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात् सूखे अंगूरों के भार का 85% भाग 68 kg है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूखे अंगूरों का भार = (68 / 85) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: ताजा भार × (ताजे में गूदे का %) = सूखा भार × (सूखे में गूदे का %)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">340 × 20% = सूखा भार × 85%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूखा भार = 80 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्राप्त सूखे अंगूरों का भार </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 kg (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धनराशि पर साधारण ब्याज, उस धनराशि का 9/25 है। यदि वार्षिक दर प्रतिशत, वर्षों की संख्या के संख्यात्मक रूप से बराबर हो, तो वार्षिक ब्याज दर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना धनराशि P, दर R% वार्षिक तथा समय T वर्ष है, जहाँ T = R है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है SI = (9/25) × P, अतः</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9/25) × P = (P × R × R) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों ओर से P कट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R² = (9 × 100) / 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = √36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 6% की दर से 6 वर्ष में SI = (P × 6 × 6) / 100 = 36P/100 = (9/25)P ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वार्षिक ब्याज दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">6% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि (3x + 2y) : (5x − 4y) = 2 : 3 है, तो (x + y) : (x − y) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 : 15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 : 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 : 13</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दिए गए अनुपात को तिर्यक गुणा करके समीकरण में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3(3x + 2y) = 2(5x − 4y)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9x + 6y = 10x − 8y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान पदों को एक ओर लाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10x − 9x = 6y + 8y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब पूछे गए अनुपात में x = 14y रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + y) : (x − y) = (14y + y) : (14y − y)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 15y : 13y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 : 13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 : 13 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयुक्त राष्ट्र मानव पर्यावरण सम्मेलन, जो 5 से 16 जून 1972 तक हुआ, किस शहर में आयोजित किया गया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टॉकहोम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नैरोबी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिनेवा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रियो डी जनेरियो</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">संयुक्त राष्ट्र मानव पर्यावरण सम्मेलन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 से 16 जून 1972</span><span style=\"font-family:'Mangal'\"> तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वीडन</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टॉकहोम</span><span style=\"font-family:'Mangal'\"> शहर में हुआ था और इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">122</span><span style=\"font-family:'Mangal'\"> देशों ने भाग लिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा सम्मेलन कराने का प्रस्ताव </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वीडन</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">1968</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयुक्त राष्ट्र आर्थिक एवं सामाजिक परिषद</span><span style=\"font-family:'Mangal'\"> के समक्ष रखा था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सम्मेलन ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\"> सिद्धांतों वाली </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टॉकहोम घोषणा</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">109</span><span style=\"font-family:'Mangal'\"> सिफ़ारिशों वाली कार्य योजना स्वीकार की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसका सबसे प्रसिद्ध परिणाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)</span><span style=\"font-family:'Mangal'\"> की स्थापना था, जिसका मुख्यालय </span><span style=\"font-weight:bold;font-family:'Mangal'\">नैरोबी</span><span style=\"font-family:'Mangal'\"> में है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">रियो डी जनेरियो</span><span style=\"font-family:'Mangal'\"> में बाद में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1992</span><span style=\"font-family:'Mangal'\"> का पृथ्वी सम्मेलन हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेज़बान शहर </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्टॉकहोम (विकल्प A)</span><span style=\"font-family:'Mangal'\"> था।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 नवंबर 2025 को आरंभ हुआ राष्ट्रीय गीत 'वंदे मातरम्' के 150 वर्ष का वर्षव्यापी समारोह इस गीत की रचना के 150 वर्ष पूरे होने का स्मरण कराता है। इसकी रचना किसने की थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवींद्रनाथ टैगोर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरोजिनी नायडू</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बंकिमचंद्र चटर्जी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुब्रमण्य भारती</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राष्ट्रीय गीत </span><span style=\"font-weight:bold;font-family:'Mangal'\">'वंदे मातरम्'</span><span style=\"font-family:'Mangal'\"> की रचना </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंकिमचंद्र चटर्जी</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 नवंबर 1875</span><span style=\"font-family:'Mangal'\"> को की थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह पहली बार साहित्यिक पत्रिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंगदर्शन</span><span style=\"font-family:'Mangal'\"> में उनके उपन्यास </span><span style=\"font-weight:bold;font-family:'Mangal'\">आनंदमठ</span><span style=\"font-family:'Mangal'\"> के भाग के रूप में प्रकाशित हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> ने इसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">150</span><span style=\"font-family:'Mangal'\"> वर्ष पूरे होने पर वर्षव्यापी राष्ट्रव्यापी समारोह का उद्घाटन </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 नवंबर 2025</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">इंदिरा गांधी इनडोर स्टेडियम, नई दिल्ली</span><span style=\"font-family:'Mangal'\"> में किया और एक स्मारक डाक टिकट तथा एक स्मारक सिक्का जारी किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह समारोह </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 नवंबर 2026</span><span style=\"font-family:'Mangal'\"> तक चलेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस गीत की रचना </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंकिमचंद्र चटर्जी (विकल्प C)</span><span style=\"font-family:'Mangal'\"> ने की थी।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31 अगस्त 2026 को नौसेना गोदी, मुंबई में भारतीय नौसेना में शामिल किया गया INS निपुण किस प्रकार का पोत है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्टेल्थ फ़्रिगेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोताखोरी सहायक पोत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु शक्ति चालित पनडुब्बी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विमानवाहक पोत</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">INS निपुण</span><span style=\"font-family:'Mangal'\"> एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोताखोरी सहायक पोत</span><span style=\"font-family:'Mangal'\"> है, जो भारतीय नौसेना की </span><span style=\"font-weight:bold;font-family:'Mangal'\">निस्तार श्रेणी</span><span style=\"font-family:'Mangal'\"> का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरा</span><span style=\"font-family:'Mangal'\"> पोत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 अगस्त 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">नौसेना गोदी, मुंबई</span><span style=\"font-family:'Mangal'\"> में नौसेनाध्यक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">एडमिरल कृष्ण स्वामीनाथन</span><span style=\"font-family:'Mangal'\"> की उपस्थिति में नौसेना में शामिल किया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस पोत का अभिकल्पन और निर्माण </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिंदुस्तान शिपयार्ड लिमिटेड, विशाखापत्तनम</span><span style=\"font-family:'Mangal'\"> ने किया है और यह इस श्रेणी के पहले पोत </span><span style=\"font-weight:bold;font-family:'Mangal'\">INS निस्तार</span><span style=\"font-family:'Mangal'\"> के बाद आया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह गहरे समुद्र में सैचुरेशन डाइविंग, दूर से संचालित यानों द्वारा पानी के भीतर के कार्य तथा पनडुब्बी बचाव में सहायता करता है और गहरे जल बचाव यान के लिए मातृ पोत का कार्य कर सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः INS निपुण एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोताखोरी सहायक पोत (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत की जनगणना 2027 के जनसंख्या गणना चरण की संदर्भ तिथि क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 मार्च 2027</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font- e=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आनंदमठ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिंद स्वराज</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द डिस्कवरी ऑफ़ इंडिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द इंडियन वॉर ऑफ़ इंडिपेंडेंस</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">द इंडियन वॉर ऑफ़ इंडिपेंडेंस</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">विनायक दामोदर सावरकर</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">1907</span><span style=\"font-family:'Mangal'\"> में लिखा था और यह पहली बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">1909</span><span style=\"font-family:'Mangal'\"> में प्रकाशित हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सावरकर ने इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">मराठी</span><span style=\"font-family:'Mangal'\"> में लिखा था और ब्रिटिश दबाव के कारण प्रकाशकों के मना कर देने पर इसका अंग्रेज़ी अनुवाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीदरलैंड</span><span style=\"font-family:'Mangal'\"> में छापा गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस पुस्तक में तर्क दिया गया है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">1857</span><span style=\"font-family:'Mangal'\"> की घटनाएँ सिपाहियों का मात्र विद्रोह नहीं, बल्कि एक सुनियोजित राष्ट्रीय स्वतंत्रता संग्राम थीं, और अंग्रेज़ों ने इसके प्रकाशित होने से पहले ही भारत में इस पर प्रतिबंध लगा दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आनंदमठ</span><span style=\"font-family:'Mangal'\"> बंकिमचंद्र चटर्जी ने, </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिंद स्वराज</span><span style=\"font-family:'Mangal'\"> महात्मा गांधी ने और </span><span style=\"font-weight:bold;font-family:'Mangal'\">द डिस्कवरी ऑफ़ इंडिया</span><span style=\"font-family:'Mangal'\"> जवाहरलाल नेहरू ने लिखी थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह पुस्तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">द इंडियन वॉर ऑफ़ इंडिपेंडेंस (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 मार्च 2026 को नरेंद्र मोदी स्टेडियम, अहमदाबाद में खेले गए फाइनल में भारत ने किस टीम को 96 रन से हराकर ICC पुरुष T20 विश्व कप 2026 जीता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑस्ट्रेलिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूज़ीलैंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंग्लैंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण अफ़्रीका</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ICC पुरुष T20 विश्व कप 2026</span><span style=\"font-family:'Mangal'\"> के फाइनल म t-family:'Mangal'\">भारत और श्रीलंका</span><span style=\"font-family:'Mangal'\"> में हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः फाइनल में हारने वाली टीम </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूज़ीलैंड (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 जुलाई 2026 को लागू हुए व्यापक आर्थिक एवं व्यापार समझौते (CETA) पर भारत ने किस देश के साथ हस्ताक्षर किए थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑस्ट्रेलिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जापान</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयुक्त अरब अमीरात</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यूनाइटेड किंगडम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">व्यापक आर्थिक एवं व्यापार समझौता (CETA)</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूनाइटेड किंगडम</span><span style=\"font-family:'Mangal'\"> के बीच है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 जुलाई 2025</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंदन</span><span style=\"font-family:'Mangal'\"> में हस्ताक्षर हुए थे और यह सामाजिक सुरक्षा अंशदान से जुड़े </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोहरा अंशदान अभिसमय (DCC)</span><span style=\"font-family:'Mangal'\"> के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 जुलाई 2026</span><span style=\"font-family:'Mangal'\"> को लागू हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस समझौते के अंतर्गत यूनाइटेड किंगडम भारत के लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">99%</span><span style=\"font-family:'Mangal'\"> निर्यात को </span><span style=\"font-weight:bold;font-family:'Mangal'\">शून्य शुल्क</span><span style=\"font-family:'Mangal'\"> पहुँच देता है, जो व्यापार मूल्य के लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">100%</span><span style=\"font-family:'Mangal'\"> को समेटता है, जबकि भारत ने अपनी </span><span style=\"font-weight:bold;font-family:'Mangal'\">89.5%</span><span style=\"font-family:'Mangal'\"> टैरिफ़ लाइनों पर रियायतें दी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोहरा अंशदान अभिसमय के कारण यूनाइटेड किंगडम में अस्थायी रूप से कार्यरत भारतीय पेशेवरों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 वर्ष</span><span style=\"font-family:'Mangal'\"> तक वहाँ के सामाजिक सुरक्षा अंशदान से छूट मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह देश </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूनाइटेड किंगडम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BKS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DLP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CMT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHR</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों समूहों में अक्षरों के बीच के अंतर अलग-अलग हैं, अतः स्वयं स्थानों को जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का स्थान लिखकर उनका योग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BKS: B = 2, K = 11, S = 19 → 2 + 11 + 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DLP: D = 4, L = 12, P = 16 → 4 + 12 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHR: F = 6, H = 8, R = 18 → 6 + 8 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CMT: C = 3, M = 13, T = 20 → 3 + 13 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-t bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, +, ÷, ×: 45 + 9 ÷ 4 × 6 = 45 + 13.5 = 58.5 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, ÷, +, ×: 45 ÷ 9 + 4 × 6 = 5 + 24 = 29 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही संयोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">÷, ×, + (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DNK : JHQ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PWE : VQK</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GRN : MLU</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MCT : SWZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JQS : PLZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BTI : HNP</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DNK : JHQ → D + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, N − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, K + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> → (+6, −6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PWE : VQK → P + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\">, W − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, E + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> → (+6, −6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: पहला और तीसरा अक्षर छह स्थान आगे जाते हैं, दूसरा अक्षर छह स्थान पीछे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B, MCT : SWZ → M + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, C − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\"> (3 − 6 = −3 → −3 + 26 = 23 = W), T + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\"> → (+6, −6, +6) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, GRN : MLU → G + 6 = M ✓, R − 6 = L ✓, परंतु N + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> है, U नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, JQS : PLZ → J + 6 = P ✓, परंतु Q − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> है, L नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, BTI : HNP → B + 6 = H ✓, T − 6 = N ✓, परंतु I + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> है, P नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">MCT : SWZ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए? 1 11 31 61 ? 151</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">111</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">121</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">101</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">91</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पद और अगले पद का अंतर ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\">; 31 − 11 = </spa "font-family:'Mangal'\">E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छहों व्यक्तियों का मुख बाहर की ओर, अर्थात् केंद्र से विपरीत दिशा में है, अतः ‘दाएँ’ = दक्षिणावर्त (clockwise) और ‘बाएँ’ = वामावर्त (anticlockwise)। सीटों को दाईं ओर (दक्षिणावर्त) 1 से 6 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">B सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है, तथा 6 के बाद फिर 1 आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B के बाईं ओर तीसरे स्थान पर → A = 1 − 3 = −2 → −2 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के दाईं ओर दूसरे स्थान पर → C = 4 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, C का निकटतम पड़ोसी है → सीट 6 के पास सीट 5 और सीट 1 हैं, और सीट 1 पर B है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब सीट 2 और 3 बची हैं, और E, F के ठीक दाईं ओर बैठा है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 2</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 6): </span><span style=\"font-weight:bold;font-family:'Mangal'\">B – F – E – A – D – C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D सीट 5 पर है, अतः D के दाईं ओर दूसरा स्थान सीट 5 + 2 = 7 → 7 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> है, जो B की सीट है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः D के दाईं ओर दूसरे स्थान पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">B (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'TRACK' को 'UTDGP' लिखा जाता है। उसी भाषा में 'BRICK' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CTLGO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CSLGP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DTLGP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CTLGP</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द की तुलना उसके कूट से एक-एक अक्षर करके करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, R + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\">, A + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\">, C + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, K + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हर अक्षर के लिए बदलाव समान नहीं है: पहला अक्षर 1 स्थान आगे, दूसरा 2 स्थान, तीसरा 3 स्थान, चौथा 4 स्थान और पाँचवाँ 5 स्थान आगे जाता है, अर्थात् प्रत्येक अक्षर शब्द में अपने अपने स्थान के बराबर आगे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही नियम BRICK पर लागू करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">, R + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\">, I + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, C + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, K + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूट CTLGP बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(CTLGO और CSLGP में एक अक्षर बदल गया है, तथा DTLGP में पहला अक्षर दो स्थान आगे ले लिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'BRICK' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">CTLGP (विकल्प D)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंजलि, करण की माता है। अंजलि, महेश की पुत्री है। सुरेश, महेश का इकलौता पुत्र है। सुरेश का करण से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता का भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता के पिता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की बहन का पुत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता का भाई</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही माता-पिता की दो संतानों के माता-पिता समान होते हैं, अतः करण से शुरू करके एक-एक चरण चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंजलि, करण की माता है, अतः करण से पहला चरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसकी माता अंजलि</span><span style=\"font-family:'Mangal'\"> तक जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंजलि, महेश की पुत्री है और सुरेश, महेश का इकलौता पुत्र है, अतः अंजलि और सुरेश के माता-पिता समान हैं, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुरेश, अंजलि का भाई</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए सुरेश, करण की माता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(पिता का भाई होने के लिए संबंध करण के पिता से होकर जाना पड़ता; माता के पिता तो महेश हैं, सुरेश नहीं; और माता की बहन का पुत्र होने के लिए एक पीढ़ी और चाहिए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सुरेश, करण की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता का भाई (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच विद्यार्थियों P, Q, R, S और T की लंबाइयाँ अलग-अलग हैं। P, Q से लंबा है परंतु R से छोटा है। S सबसे छोटा नहीं है। केवल एक विद्यार्थी T से छोटा है। इनमें से सबसे छोटा कौन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले संकेत के तीनों विद्यार्थियों को एक पंक्ति में, सबसे लंबे से शुरू करके लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q से लंबा है परंतु R से छोटा है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R &gt; P &gt; Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल एक विद्यार्थी T से छोटा है → T ऊपर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">चौथे</span><span style=\"font-family:'Mangal'\"> स्थान पर है, अतः T से नीचे ठीक एक विद्यार्थी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S सबसे छोटा नहीं है, अतः S पाँचवें स्थान पर नहीं है, और T चौथे स्थान पर है, इसलिए पाँचवें स्थान पर P, Q और R में से कोई एक होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, P और Q में सबसे छोटा </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> है, अतः पाँचवाँ स्थान Q को मिलेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे लंबे से अंतिम क्रम इस प्रकार है: पहले तीन स्थानों पर किसी क्रम में R, S और P, फिर T, फिर Q.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(P और R दोनों Q से लंबे हैं, तथा S को इस संकेत से हटा दिया जाता है कि S सबसे छोटा नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे छोटा विद्यार्थी </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए समीकरण को सही बनाने के लिए किन दो संख्याओं को आपस में बदलना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 ÷ 6 + 9 × 4 − 12 = 32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(नोट: संपूर्ण संख्या को आपस में बदलना है, अलग-अलग अंकों को नहीं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 and 12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 and 6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 and 12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 and 12</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैसा दिया है, 24 ÷ 6 + 9 × 4 − 12 = 4 + 36 − 12 = 28 आता है, जो 32 नहीं है, अतः दो संख्याओं को आपस में बदलना होगा। प्रत्येक विकल्प आज़माएँ और BODMAS लागू करें (+ और − से पहले × और ÷)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, 9 और 12 बदलने पर: 24 ÷ 6 + 12 × 4 − 9 = 4 + 48 − 9 = 43 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B, 4 और 6 बदलने पर: 24 ÷ 4 + 9 × 6 − 12 = 6 + 54 − 12 = 48 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, 24 और 12 बदलने पर: 12 ÷ 6 + 9 × 4 − 24 = 2 + 36 − 24 = 14 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, 6 और 12 बदलने पर: 24 ÷ 12 + 9 × 4 − 6 = 2 + 36 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आपस में बदली जाने वाली दो संख्याएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 and 12 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B का अर्थ है कि ‘A, B की बहन है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P − Q + R × S’ है, तो S का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता का भाई</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P − Q + R × S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R × S → R, S की पत्नी है, अतः R और S पति-पत्नी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q + R → Q, R का पुत्र है, अतः R, Q की माता है। चूँकि R और S पति-पत्नी हैं, इसलिए S, Q का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P − Q → P, Q की बहन है, अतः P और Q के माता-पिता समान हैं, और इसलिए S, P का भी पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(भाई होने के लिए S को R की संतान होना पड़ता; माता का भाई और पिता का भाई होने के लिए शृंखला में एक व्यक्ति और चाहिए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः S, P का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिंदु A, बिंदु B के 10 m दक्षिण में है। बिंदु C, बिंदु A के 24 m पूर्व में है। बिंदु D, बिंदु C के 3 m उत्तर में है। बिंदु B के सापेक्ष बिंदु D किस दिशा में और कितनी दूरी पर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 m, दक्षिण-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 m, उत्तर-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 m, दक्षिण-पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31 m, दक्षिण-पूर्व</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिंदु B को मूल बिंदु लें; पूर्व = +x, उत्तर = +y, और 1 इकाई = 1 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B = (0, 0); A, B के 10 m दक्षिण में है → A = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, −10</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के 24 m पूर्व में है → C = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">24, −10</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, C के 3 m उत्तर में है → D = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">24, −7</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः D, B से 24 m पूर्व और 7 m दक्षिण में है, जिसका अर्थ है कि D, B के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पूर्व</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी BD = √(24² + 7²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(576 + 49) = √625 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(24 m में दक्षिण वाला भाग छूट जाता है, तथा 31 m में समकोण त्रिभुज के स्थान पर दोनों दूरियाँ जोड़ दी गई हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु D, बिंदु B से </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 m, दक्षिण-पूर्व (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U और V के एक ही दिन के सात अलग-अलग समय पर डॉक्टर से मिलने का समय तय है: 10 am, 11 am, 12 noon, 1 pm, 2 pm, 3 pm और 4 pm, परंतु आवश्यक नहीं कि इसी क्रम में हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S का समय 11 am है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और P के बीच केवल एक व्यक्ति का समय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T का समय P के ठीक बाद है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V का समय 4 pm है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q का समय U से पहले है, और U का समय R से पहले है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 pm पर किसका समय तय है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सातों समयों को क्रम से क्रमांकित करते हैं: 10 am = 1, 11 am = 2, 12 noon = 3, 1 pm = 4, 2 pm = 5, 3 pm = 6, 4 pm = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S का समय 11 am है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और P के बीच केवल एक व्यक्ति है → P = 2 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, क्योंकि 2 − 2 = 0 सूची में कोई समय नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T का समय P के ठीक बाद है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V का समय 4 pm है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब Q, U और R के लिए समय 1, 3 और 6 बचे हैं, और Q, U से पहले तथा U, R से पहले है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 1, U = 3, R = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: Q का 10 am, S का 11 am, U का 12 noon, P का 1 pm, T का 2 pm, R का 3 pm, V का 4 pm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 3 pm पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">R (विकल्प C)</span><span style=\"font-family:'Mangal'\"> का समय तय है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृतिका पूर्व की ओर चल रही है। वह बाएँ मुड़ती है, फिर दाएँ मुड़ती है, और उसके बाद लगातार दो बार और दाएँ मुड़ती है। अब वह किस दिशा में चल रही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों दिशाओं को दक्षिणावर्त क्रम में लें: उत्तर, पूर्व, दक्षिण, पश्चिम। दाएँ मुड़ने पर इस क्रम में एक कदम आगे बढ़ते हैं और बाएँ मुड़ने पर एक कदम पीछे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृतिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्व</span><span style=\"font-family:'Mangal'\"> की ओर चलना शुरू करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला मोड़, बाएँ: पूर्व → </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा मोड़, दाएँ: उत्तर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्व</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा मोड़, दाएँ: पूर्व → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चौथा मोड़, दाएँ: दक्षिण → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चारों मोड़ों के बाद वह पश्चिम की ओर चल रही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बीच के दो मोड़ एक-दूसरे को निरस्त कर देते हैं, और अंतिम दायाँ मोड़ उसे पूर्व से दक्षिण और फिर पश्चिम तक ले आता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कृतिका अब </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम (विकल्प C)</span><span style=\"font-family:'Mangal'\"> की ओर चल रही है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी बाघ बिल्लियाँ हैं। कोई बिल्ली कुत्ता नहीं है। कुछ कुत्ते पालतू हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कोई बाघ कुत्ता नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ पालतू बिल्लियाँ हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी बाघ बिल्लियाँ हैं → बाघों का वृत्त पूरी तरह बिल्लियों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई बिल्ली कुत्ता नहीं है → बिल्लियों का वृत्त और कुत्तों का वृत्त एक-दूसरे को कहीं भी नहीं छूते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ कुत्ते पालतू हैं → कुत्तों का वृत्त और पालतुओं का वृत्त कम से कम एक भाग में एक-दूसरे को काटते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कोई बाघ कुत्ता नहीं है → प्रत्येक बाघ बिल्लियों के वृत्त के अंदर है, और बिल्लियों के वृत्त का कोई भाग कुत्ता नहीं है, अतः कोई बाघ कुत्ता नहीं हो सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ पालतू बिल्लियाँ हैं → पालतुओं का वृत्त केवल कुत्तों के वृत्त को काटता हुआ ज्ञात है; उसे बिल्लियों के वृत्त से पूरी तरह बाहर भी खींचा जा सकता है, अतः यह केवल एक संभावना है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति P, Q, R, S, T, U, V और W एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के बाईं ओर केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T और W के बीच केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, W के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U पंक्ति के अंतिम दाएँ छोर पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और R के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, P के ठीक बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S के सापेक्ष V का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर तीसरा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर चौथा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाईं ओर चौथा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर पाँचवाँ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 8 तक क्रमांकित करते हैं। सभी आठ व्यक्ति उत्तर दिशा की ओर मुख करके बैठे हैं, इसलिए बायाँ और दायाँ सामान्य रूप से ही लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के बाईं ओर केवल दो व्यक्ति हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T और W के बीच केवल दो व्यक्ति हैं → W = 3 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, क्योंकि 3 − 3 = 0 कोई सीट नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, W के ठीक दाईं ओर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U अंतिम दाएँ छोर पर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब P, R, S और V के लिए सीट 1, 2, 4 और 5 बची हैं।</span></p><p st
