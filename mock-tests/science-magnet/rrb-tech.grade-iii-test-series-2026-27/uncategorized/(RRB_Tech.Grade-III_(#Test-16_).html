size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पैरामीशियम</span><span style=\"font-family:'Mangal'\"> की आकृति निश्चित होती है और वह भोजन एक नियत स्थान से लेता है, जहाँ तक भोजन को कोशिका की पूरी सतह पर फैली </span><span style=\"font-weight:bold;font-family:'Mangal'\">पक्ष्माभिकाएँ</span><span style=\"font-family:'Mangal'\"> पहुँचाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">यूग्लीना</span><span style=\"font-family:'Mangal'\"> के पास कशाभिका होती है और वह प्रकाश में अपना भोजन स्वयं बना सकता है, तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रा</span><span style=\"font-family:'Mangal'\"> अपने स्पर्शकों से शिकार पकड़ता है, अतः इन तीनों में से कोई कूटपादों का प्रयोग नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भोजन पकड़ने के लिए कूटपादों का प्रयोग अमीबा में होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विरंजक चूर्ण बनाने के लिए किस यौगिक का प्रयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम हाइड्रॉक्साइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम हाइड्रॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम कार्बोनेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम क्लोराइड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विरंजक चूर्ण </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुष्क बुझे हुए चूने पर क्लोरीन की क्रिया</span><span style=\"font-family:'Mangal'\"> से बनाया जाता है, और बुझा हुआ चूना </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम हाइड्रॉक्साइड</span><span style=\"font-family:'Mangal'\"> ही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार बने विरंजक चूर्ण को Ca(ClO)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> से दर्शाया जाता है, यद्यपि उसका वास्तविक संघटन इससे अधिक जटिल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसका उपयोग वस्त्र उद्योग में सूती तथा लिनन के विरंजन में, कागज़ कारखानों में लकड़ी की लुगदी के विरंजन में, अनेक रासायनिक उद्योगों में उपचायक के रूप में, तथा पीने के जल को रोगाणुरहित करने में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम हाइड्रॉक्साइड, सोडियम कार्बोनेट तथा कैल्सियम क्लोराइड क्लोरीन के साथ विरंजक चूर्ण नहीं देते, और सोडियम कार्बोनेट तो दैनिक उपयोग का धोने का सोडा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इसके लिए कैल्सियम हाइड्रॉक्साइड का प्रयोग किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सोडियम को प्रयोगशाला में खुले पात्र में सुरक्षित रखा जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): सोडियम वायु तथा नमी से इतनी तीव्रता से अभिक्रिया करता है कि उसमें आग लग सकती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम को कभी खुले पात्र में नहीं रखा जाता; उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">केरोसिन तेल में डुबोकर</span><span style=\"font-family:'Mangal'\"> रखा जाता है, क्योंकि केरोसिन धातु तक वायु तथा नमी को पहुँचने नहीं देता → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम तथा पोटैशियम वायु की ऑक्सीजन तथा नमी से इतनी तीव्रता से अभिक्रिया करते हैं कि उस अभिक्रिया से धातु में आग लग सकती है, और इसी कारण उन्हें केरोसिन में रखा जाता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात कारण यह ठीक-ठीक बताता है कि खुला पात्र असुरक्षित क्यों है, जबकि अभिकथन प्रयोगशाला में की जाने वाली बात के उलटा कह रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल को एथेनॉइक अम्ल के साथ सांद्र सल्फ्यूरिक अम्ल की कुछ बूँदों की उपस्थिति में गर्म करने पर एक सुगंधित पदार्थ बनता है। यह पदार्थ है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एस्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साबुन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्काइन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपमार्जक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल तथा ऐल्कोहॉल अम्लीय उत्प्रेरक की उपस्थिति में आपस में अभिक्रिया करते हैं, और इस अभिक्रिया को </span><span style=\"font-weight:bold;font-family:'Mangal'\">एस्टरीकरण</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ अम्ल एथेनॉइक अम्ल है और ऐल्कोहॉल एथेनॉल है, तथा सांद्र सल्फ्यूरिक अम्ल उत्प्रेरक का काम करता है, अतः बनने वाला उत्पाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">एस्टर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एस्टर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुगंधित पदार्थ</span><span style=\"font-family:'Mangal'\"> होते हैं, और इसी कारण उनका उपयोग इत्र बनाने में तथा सुगंध देने वाले पदार्थों के रूप में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साबुन लंबी शृंखला वाले कार्बोक्सिलिक अम्ल का सोडियम लवण है और एस्टर को क्षार के साथ गर्म करने पर बनता है, अपमार्जक सल्फोनिक अम्ल का लवण है, तथा ऐल्काइन त्रिबंध वाला हाइड्रोकार्बन है, अतः इनमें से कोई यहाँ नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बनने वाला पदार्थ एस्टर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पुष्प के स्त्रीकेसर के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. स्त्रीकेसर के तीन भाग होते हैं: वर्तिकाग्र, वर्तिका तथा अंडाशय।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वर्तिकाग्र पर पहुँचा परागकण एक परागनलिका बनाता है, जो वर्तिका से होती हुई अंडाशय तक बढ़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निषेचन के बाद बीजांड सूखकर गिर जाते हैं और केवल अंडाशय ही बीज बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. स्त्रीकेसर पुष्प का मादा भाग है, और उसके तीन भाग होते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्तिकाग्र</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्तिका</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडाशय</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वर्तिकाग्र पर पहुँचा परागकण एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">परागनलिका</span><span style=\"font-family:'Mangal'\"> बनाता है, जो वर्तिका से होती हुई अंडाशय में प्रवेश करती है और नर जनन कोशिका को अंड कोशिका तक पहुँचाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निषेचन के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजांड बीज बनते हैं</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडाशय फल बन जाता</span><span style=\"font-family:'Mangal'\"> है, अतः इस कथन में दोनों बातें उलट दी गई हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति अपने पैरों को नारियल के पेड़ के तने से कसकर दबाते हुए पेड़ पर चढ़ता है। उसे ऊपर की ओर धकेलने वाला बल है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसके शरीर का भार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसके पैरों के नीचे की वायु का धक्का</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तने तथा उसके पैरों के बीच का घर्षण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तने पर लगने वाला पृथ्वी का खिंचाव</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बल तभी लगता है जब कम से कम </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो वस्तुएँ अन्योन्यक्रिया</span><span style=\"font-family:'Mangal'\"> करें, और यहाँ ये दो वस्तुएँ व्यक्ति तथा पेड़ का तना हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यक्ति के पैर तने को नीचे की ओर दबाते हैं, और तना पैरों पर उतना ही बल विपरीत दिशा में, अर्थात </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊपर</span><span style=\"font-family:'Mangal'\"> की ओर लगाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर की ओर लगने वाला यही बल तने तथा पैरों के बीच का </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण</span><span style=\"font-family:'Mangal'\"> है, और यही व्यक्ति को ऊपर ले जाता है; यदि तना चिकना और फिसलनदार होता तो वह नीचे फिसल जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसका भार नीचे की ओर लगता है, तने पर लगने वाला पृथ्वी का खिंचाव तने पर लगता है, उस पर नहीं, और पैरों के नीचे की वायु ऐसा कोई बल नहीं लगाती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे ऊपर की ओर तने तथा उसके पैरों के बीच का घर्षण धकेलता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन करने वाले किसी जीव में किसी लक्षण के जीन की दो प्रतियाँ होती हैं, और ये दोनों प्रतियाँ एक जैसी नहीं हैं। ऐसे जीव में जो लक्षण अभिव्यक्त होता है, उसे कहते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अप्रभावी लक्षण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपार्जित लक्षण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रभावी लक्षण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभिन्नता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने बताया कि किसी लक्षण को एक कारक नियंत्रित करता है, जिसे अब </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीन</span><span style=\"font-family:'Mangal'\"> कहते हैं, और लैंगिक प्रजनन करने वाले जीव में उस जीन की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो प्रतियाँ</span><span style=\"font-family:'Mangal'\"> होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब ये दोनों प्रतियाँ एक जैसी नहीं होतीं, तब उनमें से केवल एक ही अपना प्रभाव दिखाती है, और इस प्रकार </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिव्यक्त होने वाले</span><span style=\"font-family:'Mangal'\"> लक्षण को </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रभावी लक्षण</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी प्रति का लक्षण, जो उपस्थित तो रहता है पर दिखाई नहीं देता, </span><span style=\"font-weight:bold;font-family:'Mangal'\">अप्रभावी लक्षण</span><span style=\"font-family:'Mangal'\"> कहलाता है, और वह आगे की किसी पीढ़ी में फिर प्रकट हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उपार्जित लक्षण</span><span style=\"font-family:'Mangal'\"> वह है जो जीव अपने जीवनकाल में स्वयं प्राप्त करता है और आगे नहीं भेजता, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">विभिन्नता</span><span style=\"font-family:'Mangal'\"> जीवों के बीच का कोई भी अंतर है, अभिव्यक्त होने वाले लक्षण का नाम नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभिव्यक्त होने वाले लक्षण को प्रभावी लक्षण कहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): एक बच्चे में मनुष्य के सभी मूलभूत लक्षण होते हैं, फिर भी वह अपने माता-पिता में से किसी एक के बिल्कुल समान नहीं दिखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): बच्चे का प्रत्येक लक्षण पिता के DNA और माता के DNA दोनों से प्रभावित हो सकता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक बच्चे में मनुष्य की मूलभूत शारीरिक रूपरेखा होती है, फिर भी कोई बच्चा न बिल्कुल अपने पिता जैसा दिखता है और न बिल्कुल अपनी माता जैसा; मानव समष्टियों में बहुत अधिक विभिन्नता मिलती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बच्चे को जीनों का एक समुच्चय पिता से और एक समुच्चय माता से मिलता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक लक्षण पर पिता तथा माता, दोनों के DNA का प्रभाव पड़ सकता</span><span style=\"font-family:'Mangal'\"> है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि एक ही लक्षण पर निर्देशों के ये दोनों समुच्चय मिलकर काम करते हैं, इसलिए बच्चे में दिखने वाला परिणाम किसी एक जनक से हूबहू मिलना आवश्यक नहीं, और इसी कारण बच्चा दोनों जनकों से मिलता-जुलता होकर भी किसी की प्रतिलिपि नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खेत से लाए गए एक जंतु के शरीर में संधियुक्त पाद हैं और शरीर के बाहर कठोर आवरण है। यह जंतु किस समूह का है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आर्थ्रोपोडा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐनेलिडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोलस्का</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोरीफेरा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आर्थ्रोपोडा</span><span style=\"font-family:'Mangal'\"> नाम ही दो शब्दों से बना है, जिनका अर्थ है पाद तथा उपांग, और इस समूह के जंतु अपने </span><span style=\"font-weight:bold;font-family:'Mangal'\">संधियुक्त पादों</span><span style=\"font-family:'Mangal'\"> से पहचाने जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये थल पर भी रहते हैं और जल में भी, इनमें अंग तंत्र स्तर का संगठन होता है, और शरीर के बाहर कठोर </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाह्यकंकाल</span><span style=\"font-family:'Mangal'\"> रहता है; कीट, केकड़े तथा मकड़ियाँ इसी समूह के हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनेलिडा</span><span style=\"font-family:'Mangal'\">, जैसे केंचुआ, का शरीर बेलनाकार होता है और खंडों में बँटा रहता है तथा उसमें कोई कंकाल नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मोलस्का</span><span style=\"font-family:'Mangal'\">, जैसे घोंघा, का शरीर कोमल होता है और उस पर कवच रहता है, तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पोरीफेरा</span><span style=\"font-family:'Mangal'\">, अर्थात स्पंज, के शरीर में असंख्य छिद्र होते हैं और उनमें केवल कोशिकीय स्तर का संगठन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह जंतु आर्थ्रोपोडा समूह का है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जिस वर्षा जल का pH 5.6 से कम होता है, उसे अम्ल वर्षा कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. नदी में पहुँचने वाली अम्ल वर्षा नदी के जल का pH बढ़ा देती है और जलीय जीवन के लिए सहायक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. सार्वत्रिक सूचक कई सूचकों का मिश्रण है और वह हाइड्रोजन आयनों की भिन्न-भिन्न सांद्रताओं पर भिन्न-भिन्न रंग दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जिस वर्षा जल का </span><span style=\"font-weight:bold;font-family:'Mangal'\">pH 5.6 से कम</span><span style=\"font-family:'Mangal'\"> होता है, उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्ल वर्षा</span><span style=\"font-family:'Mangal'\"> कहते हैं, और वह तब बनती है जब प्रदूषित वायु की गैसें गिरती हुई वर्षा में घुल जाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. नदी में पहुँचने वाली अम्ल वर्षा नदी के जल का </span><span style=\"font-weight:bold;font-family:'Mangal'\">pH घटा देती</span><span style=\"font-family:'Mangal'\"> है, और इससे जलीय जीवों का जीवित रहना कठिन हो जाता है, अतः वह न pH बढ़ाती है और न जलीय जीवन के लिए सहायक है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सार्वत्रिक सूचक</span><span style=\"font-family:'Mangal'\"> कई सूचकों का मिश्रण है, और वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन आयनों की भिन्न-भिन्न सांद्रताओं पर भिन्न-भिन्न रंग</span><span style=\"font-family:'Mangal'\"> दर्शाता है, इसी से उससे pH का मान पढ़ा जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम रिबन को वायु में जलाने से पहले उसे रेगमाल से रगड़कर साफ़ किया जाता है। ऐसा किसे हटाने के लिए किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस पर जमी धूल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसकी सतह की नमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रखते समय लगाई गई चिकनाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस पर बनी मैग्नीशियम ऑक्साइड की परत</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम एक क्रियाशील धातु है, इसलिए वायु में रखे रहने पर उसकी सतह धीरे-धीरे वायु की ऑक्सीजन से अभिक्रिया कर लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिबन पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैग्नीशियम ऑक्साइड</span><span style=\"font-family:'Mangal'\"> की पतली सफ़ेद परत बन जाती है, और यह परत नीचे की धातु तक वायु को पहुँचने नहीं देती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेगमाल से रगड़ने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">यही ऑक्साइड परत हट जाती</span><span style=\"font-family:'Mangal'\"> है, जिससे साफ़ धातु वायु की ऑक्सीजन से मिल सके और चमकीली सफ़ेद ज्वाला के साथ ठीक से जलकर सफ़ेद चूर्ण छोड़ सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धूल, नमी या चिकनाई इस सफ़ाई का कारण नहीं हैं, क्योंकि प्रयोगशाला में रखे रहने पर इनमें से कोई रिबन पर स्वयं नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रेगमाल उस पर बनी मैग्नीशियम ऑक्साइड की परत हटाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक धावक 21 m त्रिज्या वाले वृत्ताकार पथ का एक चक्कर लगाता है और यह चक्कर पूरा करने में उसे 11 s लगते हैं। π = 22/7 लेने पर इस चक्कर में उसकी औसत चाल है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 m/s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 m/s</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पूरे चक्कर में धावक वृत्ताकार पथ की पूरी परिधि तय करता है, अतः तय की गई दूरी वृत्त की परिधि के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तय की गई दूरी = 2πR</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">132 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल = तय की गई कुल दूरी / लिया गया समय</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 132 / 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पूरे चक्कर में उसका विस्थापन शून्य है, क्योंकि वह वहीं पहुँच जाता है जहाँ से चला था, इसलिए उसका औसत वेग शून्य है, जबकि औसत चाल शून्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसकी औसत चाल 12 m/s है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): लोलक का गोलक एक ओर से छोड़ने पर दूसरी ओर लगभग उतनी ही ऊँचाई तक उठ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): गोलक की यांत्रिक ऊर्जा, जो उसकी गतिज ऊर्जा तथा स्थितिज ऊर्जा का योग है, झूलने के दौरान समान बनी रहती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल लोलक के गोलक को किसी क्षैतिज रेखा के बराबर वाले बिंदु से छोड़ने पर वह झूलकर दूसरी ओर लगभग उतनी ही ऊँचाई तक पहुँच जाता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोड़ने वाली स्थिति पर गोलक के पास mgh स्थितिज ऊर्जा होती है और गतिज ऊर्जा शून्य; सबसे नीचे वाले बिंदु पर गतिज ऊर्जा होती है और स्थितिज ऊर्जा शून्य; दूसरे सिरे पर फिर स्थितिज ऊर्जा होती है और गतिज ऊर्जा शून्य।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन दोनों का योग, अर्थात गोलक की </span><span style=\"font-weight:bold;font-family:'Mangal'\">यांत्रिक ऊर्जा</span><span style=\"font-family:'Mangal'\">, झूलने के हर बिंदु पर समान रहती है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यांत्रिक ऊर्जा न बदलने के कारण दूसरे सिरे की स्थितिज ऊर्जा आरंभ की स्थितिज ऊर्जा के बराबर होनी ही चाहिए, और इसी कारण गोलक उतनी ही ऊँचाई तक उठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 Ω, 12 Ω तथा 4 Ω के तीन प्रतिरोधक 12 V की बैटरी के साथ पार्श्वक्रम में जोड़े गए हैं। इस संयोजन का तुल्य प्रतिरोध तथा बैटरी से लिया गया कुल धारा मान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 Ω और 0.55 A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω और 24 A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 Ω और 1 A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω और 6 A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पार्श्वक्रम संयोजन में तुल्य प्रतिरोध का व्युत्क्रम अलग-अलग प्रतिरोधों के व्युत्क्रमों के योग के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/R = 1/6 + 1/12 + 1/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/R = (2 + 1 + 3) / 12 = 6/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक प्रतिरोधक के सिरों पर पूरे 12 V लगते हैं, अतः कुल धारा इसी तुल्य प्रतिरोध के साथ ओम के नियम से निकाली जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I = V/R = 12 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलग-अलग धाराएँ जोड़ने पर भी यही उत्तर मिलता है: 12/6 + 12/12 + 12/4 = 2 + 1 + 3 = 6 A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये मान 2 Ω और 6 A हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पारिस्थितिकी तंत्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पारिस्थितिकी तंत्र के जैविक घटक उसमें उपस्थित सजीव जीव होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जो जीव अपना भोजन स्वयं बनाते हैं, उन्हें उपभोक्ता कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. उपभोक्ता शाकाहारी, मांसाहारी, सर्वाहारी अथवा परजीवी हो सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पारिस्थितिकी तंत्र में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैविक घटक</span><span style=\"font-family:'Mangal'\"> होते हैं, अर्थात उस स्थान के </span><span style=\"font-weight:bold;font-family:'Mangal'\">सजीव जीव</span><span style=\"font-family:'Mangal'\">, और इनके साथ मिट्टी, वायु, जल तथा तापमान जैसे अजैविक घटक भी होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जो जीव अपना भोजन स्वयं बनाते हैं वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पादक</span><span style=\"font-family:'Mangal'\"> हैं, उपभोक्ता नहीं; उपभोक्ता तो वह जीव है जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरों के बनाए भोजन पर निर्भर</span><span style=\"font-family:'Mangal'\"> रहता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. उपभोक्ता उत्पादकों का बनाया भोजन सीधे अथवा दूसरे उपभोक्ताओं को खाकर लेते हैं, और उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">शाकाहारी, मांसाहारी, सर्वाहारी तथा परजीवी</span><span style=\"font-family:'Mangal'\"> में बाँटा जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हड्डी का मैट्रिक्स कठोर और दृढ़ होता है, जबकि उपास्थि का मैट्रिक्स मुलायम और जेली जैसा होता है। हड्डी के मैट्रिक्स की कठोरता किन तत्वों के यौगिकों के कारण होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम और पोटैशियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयरन और कॉपर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम और फ़ॉस्फोरस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम और सल्फर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजी ऊतक की कोशिकाओं के बीच पड़े पदार्थ को उसका मैट्रिक्स कहते हैं, और इसी मैट्रिक्स की प्रकृति से तय होता है कि ऊतक कैसा व्यवहार करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हड्डी</span><span style=\"font-family:'Mangal'\"> के मैट्रिक्स में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम तथा फ़ॉस्फोरस</span><span style=\"font-family:'Mangal'\"> के यौगिक होते हैं, और यही यौगिक हड्डी को कठोर तथा दृढ़ बनाकर उसे मजबूती देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उपास्थि</span><span style=\"font-family:'Mangal'\"> का मैट्रिक्स मुलायम और जेली जैसा होता है, इसलिए उपास्थि लचीली रहती है, दबाने पर फिर से अपनी आकृति में आ जाती है और हड्डियों के सिरों को झटकों से बचाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयरन रक्त में ले जाया जाता है, सोडियम तथा पोटैशियम कोशिकाओं के कार्य के लिए आवश्यक हैं, और सल्फर कुछ प्रोटीनों का भाग है, परंतु इनमें से कोई हड्डी के मैट्रिक्स को कठोर नहीं बनाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हड्डी की कठोरता कैल्सियम तथा फ़ॉस्फोरस के यौगिकों के कारण होती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुकानदार एक वस्तु को 15% लाभ पर बेचता है। यदि उसने उसे 10% कम मूल्य पर खरीदा होता और ₹35 कम में बेचा होता, तो उसे 25% का लाभ होता। वस्तु का क्रय मूल्य कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,250</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना क्रय मूल्य ₹x है तथा दोनों विक्रय मूल्यों को x के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला विक्रय मूल्य = x × 115%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया क्रय मूल्य = x × 90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया विक्रय मूल्य = x × 90% × 125% = x × </span><span style=\"font-weight:bold;font-family:'Mangal'\">112.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया विक्रय मूल्य, पहले विक्रय मूल्य से ₹35 कम भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x × 115%) − (x × 112.5%) = ₹35</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × 2.5% = ₹35</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (35 × 100) / 2.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: पहला विक्रय मूल्य = ₹1,610; नया क्रय मूल्य = ₹1,260 तथा नया विक्रय मूल्य = ₹1,575, जो ₹35 कम है और 25% लाभ देता है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु का क्रय मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,400 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार्यालय में 60% कर्मचारी पुरुष हैं तथा शेष महिलाएँ हैं। 25% पुरुष और 40% महिलाएँ कंपनी की बस से यात्रा करते हैं। कुल कर्मचारियों का कितने प्रतिशत कंपनी की बस से यात्रा करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर प्रतिशत में है, अतः कार्यालय में कुल 100 कर्मचारी मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुरुषों की संख्या = 100 × 60% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महिलाओं की संख्या = 100 − 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बस से यात्रा करने वाले पुरुष = 60 × 25% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बस से यात्रा करने वाली महिलाएँ = 40 × 40% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बस से यात्रा करने वाले कुल कर्मचारी = 15 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट प्रतिशत = (31 / 100) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कंपनी की बस से यात्रा करने वाले कर्मचारी </span><span style=\"font-weight:bold;font-family:'Mangal'\">31% (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 और 70 के बीच की अभाज्य संख्याओं के माध्य तथा 50 और 58 के बीच 4 के गुणजों के माध्य का अंतर कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दोनों समूहों की संख्याएँ लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 और 70 के बीच अभाज्य संख्याएँ 61 तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">67</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनका माध्य = (61 + 67) / 2 = 128 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 और 58 के बीच 4 के गुणज 52 तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">56</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनका माध्य = (52 + 56) / 2 = 108 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 64 − 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों माध्यों का अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे दी गई सारणी में एक शोरूम द्वारा पाँच वर्षों में बेची गई कारों की संख्या दी गई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790313256948_image001.png\" width=\"442\" height=\"55\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किस वर्ष में, पिछले वर्ष की तुलना में बेची गई कारों की संख्या में प्रतिशत वृद्धि सबसे अधिक रही?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2023</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2022</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2024</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक वर्ष की, उससे पिछले वर्ष की तुलना में वृद्धि निकालकर प्रतिशत की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2022: वृद्धि = 300 − 250 = 50, प्रतिशत = (50 / 250) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2023: वृद्धि = 390 − 300 = 90, प्रतिशत = (90 / 300) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2024: वृद्धि = 468 − 390 = 78, प्रतिशत = (78 / 390) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025: वृद्धि = 585 − 468 = 117, प्रतिशत = (117 / 468) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%, 30%, 20% तथा 25% में सबसे अधिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">30%</span><span style=\"font-family:'Mangal'\"> है, जो 2023 का है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिशत वृद्धि सबसे अधिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">2023 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में रही।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,000 पर 10% वार्षिक दर से 3 वर्ष का चक्रवृद्धि ब्याज, वार्षिक रूप से संयोजित, तथा साधारण ब्याज का अंतर कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹240</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹264</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹256</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹248</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों ब्याज अलग-अलग ज्ञात करके उनका अंतर निकालें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (8,000 × 10 × 3) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज पर मिश्रधन = 8,000 × 110% × 110% × 110%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹10,648</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CI = ₹10,648 − ₹8,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,648</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = ₹2,648 − ₹2,400 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹248</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 3 वर्ष का अंतर = [P × R² × (300 + R)] / 10,00,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [8,000 × 100 × 310] / 10,00,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 248</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹248 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 3 cot θ = 4 हो और θ एक न्यून कोण हो, तो (5 sin θ + 3 cos θ) / (5 sin θ − 3 cos θ) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दिए गए संबंध को एक अनुपात के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cot θ = 4/3 है, अतः tan θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस समकोण त्रिभुज में लंब 3 तथा आधार 4 हो, उसका कर्ण = √(3² + 4²) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sin θ = 3/5 तथा cos θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 sin θ = 5 × (3/5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 cos θ = 3 × (4/5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान = (3 + 2.4) / (3 − 2.4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 5.4 / 0.6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: अंश और हर दोनों में cos θ का भाग देने पर (5 tan θ + 3) / (5 tan θ − 3) प्राप्त होता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3.75 + 3) / (3.75 − 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुकान किसी वस्तु के अंकित मूल्य पर 20% तथा 15% की दो क्रमिक छूट देती है। इन दोनों छूटों के तुल्य एकल छूट कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल प्रतिशत पूछा गया है, अतः अंकित मूल्य ₹100 मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली छूट के बाद मूल्य = ₹100 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी छूट ₹80 पर लगती है, ₹100 पर नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी छूट के बाद मूल्य = ₹80 × 85% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹68</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल छूट = ₹100 − ₹68 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तुल्य एकल छूट = (32 / 100) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: एकल छूट = a + b − (a × b) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 15 − (20 × 15) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तुल्य एकल छूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">32% (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्यार्थी 5 km/h की चाल से पैदल चलकर विद्यालय जाता है तो 10 मिनट देर से पहुँचता है। जब वह 15 km/h की चाल से साइकिल चलाता है तो 10 मिनट पहले पहुँच जाता है। उसके घर से विद्यालय की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.75 km</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों बार दूरी समान है, अतः दोनों बार लगे समय की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बार वह 10 मिनट देर से और दूसरी बार 10 मिनट पहले पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों समयों का अंतर = 10 + 10 = 20 मिनट = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3 घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना दूरी d km है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d/5 − d/15 = 1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3d − d)/15 = 1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2d/15 = 1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 15 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.5 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: पैदल चलने में 30 मिनट और साइकिल से 10 मिनट लगते हैं, अंतर 20 मिनट है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्यालय की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.5 km (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 cm त्रिज्या के एक वृत्त के आकार का तार काटकर एक वर्ग के आकार में मोड़ा जाता है। वर्ग का क्षेत्रफल कितना है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,764 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,936 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,
