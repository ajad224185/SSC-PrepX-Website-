ly:'Mangal'\">118</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">124</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक संख्या की तुलना उस संख्या से करें जिससे वह संबंधित है, हर बार पूरी संख्या लेते हुए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 7 = 49, और 49 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 × 9 = 81, और 81 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: संख्या का वर्ग कीजिए और उसमें 3 जोड़िए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल गुणा करने से काम नहीं चलता, क्योंकि 52 / 7 और 84 / 9 समान नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 × 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">121</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">121 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">124</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(122 में 1 जोड़ा गया है, 118 में 3 घटाया गया है तथा 126 में 3 के स्थान पर 5 जोड़ दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 11, </span><span style=\"font-weight:bold;font-family:'Mangal'\">124 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDF CEG FHJ KMO RTV ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ABE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACF</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हर समूह के भीतर तीनों अक्षर दो-दो स्थान की दूरी पर हैं, अतः एक समूह की तुलना अगले समूह से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDF → CEG: प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\"> स्थान आगे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG → FHJ: प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> स्थान आगे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHJ → KMO: प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> स्थान आगे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KMO → RTV: प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+7</span><span style=\"font-family:'Mangal'\"> स्थान आगे जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बदलाव स्वयं हर बार 2 से बढ़ रहा है, और अगला बदलाव </span><span style=\"font-weight:bold;font-family:'Mangal'\">+9</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (18 + 9 = 27 → 27 − 26 = 1 = A), T + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> (20 + 9 = 29 → 29 − 26 = 3 = C), V + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> (22 + 9 = 31 → 31 − 26 = 5 = E)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह ACE है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ABE, BCE और ACF में ACE का एक-एक अक्षर बदल दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">ACE (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति A, B, C, D, E, F, G और H एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के बाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, B के दाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, E का निकटतम पड़ोसी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F और G के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G के ठीक बाईं ओर बैठे व्यक्ति के दाईं ओर दूसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी आठ व्यक्तियों का मुख केंद्र की ओर है, अतः उनके लिए ‘दाएँ’ = वामावर्त (anticlockwise) और ‘बाएँ’ = दक्षिणावर्त (clockwise)। सीटों को दाईं ओर 1 से 8 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">A सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है, तथा 8 के बाद फिर 1 आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A के ठीक दाईं ओर है → B = 1 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के बाईं ओर तीसरे स्थान पर है → C = 1 − 3 = −2 → −2 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर है → E = 6 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, B के दाईं ओर तीसरे स्थान पर है → G = 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, E का निकटतम पड़ोसी है → सीट 8 के पास सीट 7 और सीट 1 हैं, और सीट 1 पर A है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F और G के बीच केवल एक व्यक्ति है → F = 5 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, क्योंकि 5 + 2 = 7 पर पहले ही D बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बची हुई सीट 4 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 8): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A – B – F – H – G – C – D – E</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G के ठीक बाईं ओर वाला व्यक्ति सीट 5 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> पर है, जो H है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H के दाईं ओर दूसरा स्थान सीट 4 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> है, जो C है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पूछा गया व्यक्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">C (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘A’ का अर्थ ‘÷’, ‘B’ का अर्थ ‘×’, ‘C’ का अर्थ ‘+’ और ‘D’ का अर्थ ‘−’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 A 6 B 5 C 27 D 19 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर के स्थान पर उसका चिह्न रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 A 6 B 5 C 27 D 19 बन जाता है 48 ÷ 6 × 5 + 27 − 19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब BODMAS लागू करें, अर्थात् जोड़ और घटाव से पहले भाग तथा गुणा किए जाएँगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 + 27 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">67 − 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(44, 52 और 40 तब आते हैं जब गुणा से पहले जोड़ या घटाव कर दिया जाए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी पेन किताबें हैं। कुछ किताबें मेज़ हैं। कोई मेज़ कुर्सी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ पेन मेज़ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ किताबें कुर्सियाँ नहीं हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी पेन किताबें हैं → पेनों का वृत्त पूरी तरह किताबों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ किताबें मेज़ हैं → किताबों का वृत्त और मेज़ों का वृत्त कम से कम एक भाग में एक-दूसरे को काटते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई मेज़ कुर्सी नहीं है → मेज़ों का वृत्त और कुर्सियों का वृत्त एक-दूसरे को कहीं भी नहीं छूते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ पेन मेज़ हैं → पेनों का वृत्त किताबों के वृत्त के उस भाग में भी खींचा जा सकता है जो मेज़ों के वृत्त को नहीं काटता, अतः यह केवल एक संभावना है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ किताबें कुर्सियाँ नहीं हैं → कम से कम एक किताब मेज़ है, और कोई मेज़ कुर्सी नहीं है, अतः वह किताब निश्चित रूप से कुर्सी नहीं है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (II) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KOR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का स्थान लिखें और हर समूह के भीतर एक अक्षर से अगले अक्षर तक का अंतर ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFI: B = 2, F = 6, I = 9 → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KOR: K = 11, O = 15, R = 18 → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTW: P = 16, T = 20, W = 23 → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHL: D = 4, H = 8, L = 12 → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूहों में अंतर +4 और +3 हैं; केवल DHL में +4 और +4 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">DHL (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पार्क में एक महिला की ओर संकेत करते हुए विकास ने कहा, 'यह मेरी दादी के इकलौते पुत्र की पुत्री है।' उस महिला का विकास से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मौसी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भतीजी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चचेरी बहन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य के अंतिम भाग से शुरू करके एक-एक चरण विकास तक आएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास की दादी का केवल एक पुत्र है, और वही पुत्र विकास का पिता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">दादी का इकलौता पुत्र विकास का पिता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महिला उसी व्यक्ति की पुत्री है, अतः महिला और विकास के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही माता-पिता की दो संतानें भाई और बहन होती हैं, अतः महिला </span><span style=\"font-weight:bold;font-family:'Mangal'\">विकास की बहन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(मौसी होने के लिए उसे विकास की माता की बहन होना पड़ता, भतीजी होने के लिए उसे विकास के भाई या बहन की पुत्री होना पड़ता, और चचेरी बहन होने के लिए उसे चाचा या बुआ की संतान होना पड़ता, और इनमें से प्रत्येक के लिए अलग शृंखला चाहिए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह महिला विकास की </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहन (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति छत पर पूर्व की ओर मुख करके खड़ा है। पहले वह 45 डिग्री दक्षिणावर्त घूमता है, फिर 45 डिग्री वामावर्त घूमता है। इसके बाद वह 180 डिग्री वामावर्त घूमता है। अंत में वह 90 डिग्री दक्षिणावर्त घूमता है। अब उस व्यक्ति का मुख किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस दिशा में उसका मुख है, उसे उत्तर से दक्षिणावर्त मापे गए कोण के रूप में लिखें: उत्तर = 0°, पूर्व = 90°, दक्षिण = 180°, पश्चिम = 270°. दक्षिणावर्त घूमने पर यह कोण बढ़ता है और वामावर्त घूमने पर घटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह पूर्व की ओर मुख करके शुरू करता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 डिग्री दक्षिणावर्त: 90° + 45° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">135°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 डिग्री वामावर्त: 135° − 45° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span><span style=\"font-family:'Mangal'\">, अतः पहले दोनों मोड़ एक-दूसरे को निरस्त कर देते हैं और उसका मुख फिर पूर्व की ओर हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 डिग्री वामावर्त: 90° − 180° = −90° → −90° + 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270°</span><span style=\"font-family:'Mangal'\">, जो पश्चिम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 डिग्री दक्षिणावर्त: 270° + 90° = 360° → 360° − 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0°</span><span style=\"font-family:'Mangal'\">, जो उत्तर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अब उस व्यक्ति का मुख </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर (विकल्प C)</span><span style=\"font-family:'Mangal'\"> की ओर है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T और U का जन्म एक ही वर्ष के छह अलग-अलग महीनों में हुआ: जनवरी, मार्च, अप्रैल, जुलाई, सितंबर और दिसंबर, परंतु आवश्यक नहीं कि इसी क्रम में हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और P के बीच केवल दो व्यक्तियों का जन्म हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T का जन्म P के ठीक बाद वाले महीने में हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q का जन्म मार्च में हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U का जन्म दिसंबर में हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अप्रैल में किसका जन्म हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छहों महीनों को क्रम से क्रमांकित करते हैं: जनवरी = 1, मार्च = 2, अप्रैल = 3, जुलाई = 4, सितंबर = 5, दिसंबर = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q का जन्म मार्च में हुआ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U का जन्म दिसंबर में हुआ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T का जन्म P के ठीक बाद वाले महीने में हुआ → T = P + 1, अतः P और T आसपास के दो महीने लेते हैं, और P, R, S तथा T के लिए महीने 1, 3, 4 और 5 बचते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और P के बीच केवल दो व्यक्तियों का जन्म हुआ → S और P की संख्याओं में तीन का अंतर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">P = 4</span><span style=\"font-family:'Mangal'\"> लेने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 5</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 1</span><span style=\"font-family:'Mangal'\"> मिलते हैं, क्योंकि 4 + 3 = 7 सूची में कोई महीना नहीं है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बचा हुआ एक महीना 3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> को मिलेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(P = 3 लेने पर T = 4 और S = 6 चाहिए, परंतु दिसंबर पहले ही U का महीना है ✗)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: S का जनवरी, Q का मार्च, R का अप्रैल, P का जुलाई, T का सितंबर, U का दिसंबर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अप्रैल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">R (विकल्प C)</span><span style=\"font-family:'Mangal'\"> का जन्म हुआ।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAP : RCE</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DOG : IQF</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BUS : UWD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MAT : VCN</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PEN : PGQ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FAN : PCG</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के अक्षर पहले समूह से एक-एक करके मेल नहीं खाते, अतः पहले समूह को उल्टे क्रम में लिखकर तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAP को उल्टे क्रम में लिखने पर PAC: P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">, C + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> → RCE ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DOG को उल्टे क्रम में लिखने पर GOD: G + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, O + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, D + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> → IQF ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: समूह को उल्टे क्रम में लिखें, फिर प्रत्येक अक्षर को दो स्थान आगे ले जाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, BUS को उल्टे क्रम में लिखने पर SUB: S + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, U + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">, B + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> → UWD ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B, MAT को उल्टे क्रम में लिखने पर TAM: T + 2 = U, A + 2 = C, परंतु M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> है, N नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, PEN को उल्टे क्रम में लिखने पर NEP: N + 2 = P, E + 2 = G, परंतु P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है, Q नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, FAN को उल्टे क्रम में लिखने पर NAF: N + 2 = P, A + 2 = C, परंतु F + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> है, G नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">BUS : UWD (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAT - IGZ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOP - SUV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIN - LOT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED - HKI</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक युग्म के दोनों समूहों की तुलना एक-एक अक्षर करके करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAT - IGZ: C + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, A + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, T + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOP - SUV: M + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, O + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, P + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIN - LOT: F + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, I + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, N + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> → (+6, +6, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED - HKI: B + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, E + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">, परंतु D + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> है, और युग्म में I दिया है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्मों में प्रत्येक अक्षर छह स्थान आगे जाता है; BED - HKI में ऐसा नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">BED - HKI (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'RAIN' को 42 और 'WIND' को 50 लिखा जाता है। उसी भाषा में 'CLOUD' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">53</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द के प्रत्येक अक्षर का अंग्रेज़ी वर्णमाला में स्थान लिखकर उन स्थानों का योग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RAIN: R = 18, A = 1, I = 9, N = 14 → 18 + 1 + 9 + 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WIND: W = 23, I = 9, N = 14, D = 4 → 23 + 9 + 14 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: कूट, शब्द के अक्षरों के स्थानों का योग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CLOUD: C = 3, L = 12, O = 15, U = 21, D = 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 + 12 + 15 + 21 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">55</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(54, 56 और 53 किसी एक अक्षर का स्थान गलत जोड़ने से आते हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'CLOUD' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">55 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहित बिंदु A से चलना शुरू करता है और पूर्व की ओर 12 km चलता है। फिर वह दाएँ मुड़कर 9 km चलता है। इसके बाद वह U-टर्न लेकर 18 km चलता है। अंत में वह बाएँ मुड़कर 12 km चलकर बिंदु B पर पहुँचता है। बिंदु B, बिंदु A से कितनी दूरी पर और किस दिशा में है? (जब तक अन्यथा न कहा जाए, सभी मोड़ केवल 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 km, दक्षिण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km, उत्तर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, उत्तर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 km, उत्तर</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिंदु A को मूल बिंदु लें; पूर्व = +x, उत्तर = +y, और 1 इकाई = 1 km.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह पूर्व की ओर 12 km चलता है → वह (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 0</span><span style=\"font-family:'Mangal'\">) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व से दाएँ मुड़ने पर उसका मुख दक्षिण की ओर हो जाता है, और वह 9 km चलता है → वह (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, −9</span><span style=\"font-family:'Mangal'\">) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U-टर्न लेने पर उसका मुख उत्तर की ओर हो जाता है, और वह 18 km चलता है → वह (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 9</span><span style=\"font-family:'Mangal'\">) पर है, क्योंकि −9 + 18 = 9 होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर से बाएँ मुड़ने पर उसका मुख पश्चिम की ओर हो जाता है, और वह 12 km चलता है → वह (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, 9</span><span style=\"font-family:'Mangal'\">) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु B की पूर्व-पश्चिम स्थिति बिंदु A जैसी ही है और वह उससे 9 इकाई ऊपर है, जिसका अर्थ है कि B, A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 km उत्तर</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9 km दक्षिण में U-टर्न उलट जाता है, 12 km उत्तर में अंतिम चरण को दूरी मान लिया गया है, तथा 15 km उत्तर में चरणों को निरस्त करने के बजाय जोड़ दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु B, बिंदु A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 km, उत्तर (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILK : # :: % : ROAD</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPJ, % = PRWE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPJ, % = PRWF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OEPJ, % = PRWE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OFPI, % = PRWE</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समूह से दूसरे समूह तक का परिवर्तन दोनों युग्मों में समान होना चाहिए। प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: MILK → OFPJ: M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\">, L + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, K − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> → (+2, −3, +4, −1); PRWE → ROAD: P + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, R − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, W + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (23 + 4 = 27 → 27 − 26 = 1 = A), E − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> → (+2, −3, +4, −1) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: PRWF → ROAD के लिए F − 1 = D चाहिए, परंतु F − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: MILK → OEPJ के लिए I − 3 = E चाहिए, परंतु I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: MILK → OFPI के लिए K − 1 = I चाहिए, परंतु K − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = OFPJ, % = PRWE (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अक्षर-संख्या समूह दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आएगा जिससे वह तार्किक रूप से पूर्ण हो जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DF 5, GH 11, JJ 23, ML 47, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PN 94</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ON 95</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PM 95</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PN 95</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षरों, दूसरे अक्षरों और संख्याओं को तीन अलग-अलग शृंखलाओं की तरह पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: D, G, J, M, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → ? = M + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: F, H, J, L, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\"> → ? = L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ: 5, 11, 23, 47, ?: (5 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span><span style=\"font-family:'Mangal'\">, (11 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23</span><span style=\"font-family:'Mangal'\">, (23 × 2) + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">47</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक संख्या अपने से पहली संख्या की दोगुनी में 1 जोड़कर बनती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">? = (47 × 2) + 1 = 94 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">95</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह PN 95 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(PN 94 में अतिरिक्त 1 छूट गया है, ON 95 में पहला अक्षर केवल दो स्थान आगे गया है, तथा PM 95 में दूसरा अक्षर केवल एक स्थान आगे गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">PN 95 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘+’ का अर्थ ‘−’, ‘−’ का अर्थ ‘×’, ‘×’ का अर्थ ‘÷’ और ‘÷’ का अर्थ ‘+’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 × 8 + 5 − 4 ÷ 18 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक चिह्न के स्थान पर उसके लिए दिया गया अर्थ एक-एक करके रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण के × का अर्थ ÷, + का अर्थ −, − का अर्थ × और ÷ का अर्थ + है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 96 × 8 + 5 − 4 ÷ 18 बन जाता है 96 ÷ 8 − 5 × 4 + 18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब BODMAS लागू करें, अर्थात् पहले भाग और गुणा किए जाएँगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 − 20 + 18 = −8 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 पहले ही चरण पर रुक जाता है, तथा 8 और 14 गुणा से पहले घटाव करने से आते हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 विद्यार्थियों की एक पंक्ति में रोहन पंक्ति के बाएँ छोर से 18वें स्थान पर है। कविता, रोहन से 7 स्थान दाईं ओर बैठी है। पंक्ति के दाएँ छोर से कविता का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20वाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22वाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27वाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21वाँ</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले बाएँ छोर से कविता का स्थान ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहन बाएँ छोर से 18वें स्थान पर है, और कविता उससे 7 स्थान दाईं ओर है, अतः कविता बाएँ छोर से 18 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25वें स्थान</span><span style=\"font-family:'Mangal'\"> पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n विद्यार्थियों की पंक्ति में, दाएँ छोर से स्थान = n − (बाएँ छोर से स्थान) + 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ छोर से कविता का स्थान = 45 − 25 + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ 1 इसलिए जोड़ा गया है क्योंकि कविता की गणना दोनों छोरों से की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(20वाँ लेने पर यह 1 छूट जाता है, 27वाँ में 7 स्थान गलत छोर से गिन लिए गए हैं, तथा 22वाँ में 45 − 16 में से 7 घटा दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ छोर से कविता का स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">21वाँ (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति A, B, C, D, E, F और G एक पंक्ति में दक्षिण की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G के दाईं ओर केवल दो व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, G के बाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A पंक्ति के किसी एक अंतिम छोर पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, F के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, D का निकटतम पड़ोसी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B के सापेक्ष F का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाईं ओर तीसरा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर तीसरा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर दूसरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर चौथा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सातों व्यक्तियों का मुख दक्षिण की ओर है, अतः उनका दायाँ हाथ उस ओर है जो कागज़ पर दायाँ दिखने वाली ओर के विपरीत है। गिनती सरल रखने के लिए सीटों को स्वयं व्यक्तियों के दाईं ओर 1 से 7 तक क्रमांकित करते हैं; तब दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G के दाईं ओर केवल दो व्यक्ति हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, G के बाईं ओर तीसरे स्थान पर है → D = 5 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A किसी एक अंतिम छोर पर है → A = 1 या A = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B के बीच केवल एक व्यक्ति है → A और B की सीटें दो का अंतर रखती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, F के ठीक दाईं ओर है → C = F + 1, अतः F और C आसपास की दो सीटें लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">A = 1</span><span style=\"font-family:'Mangal'\"> लेने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 3</span><span style=\"font-family:'Mangal'\"> मिलता है, और C, E तथा F के लिए सीट 4, 6 और 7 बचती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F और C को साथ-साथ होना है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 6</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 7</span><span style=\"font-family:'Mangal'\">, तथा बची हुई सीट 4 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> बैठेगा ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, D का निकटतम पड़ोसी नहीं है, और सीट 4, सीट 2 के पास नहीं है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(A = 7 लेने पर B = 5 चाहिए, जो G की सीट है ✗)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, D, B, E, G, F, C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F सीट 6 पर है और B सीट 3 पर, अतः F, B से 6 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> स्थान दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः B के सापेक्ष F का स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाईं ओर तीसरा (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'ripe mango tree' को 'sa ko li' लिखा जाता है,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'green mango leaf' को 'ko da ne' लिखा जाता है और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">'tree leaf water' को 'li ne pa' लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उस भाषा में 'mango' का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ko</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">li</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ne</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">da</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal
