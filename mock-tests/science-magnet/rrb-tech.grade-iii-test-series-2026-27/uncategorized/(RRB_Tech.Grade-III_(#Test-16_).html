span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹480</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹320</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹600</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मजदूरी उसी अनुपात में बँटती है जिस अनुपात में प्रत्येक व्यक्ति एक दिन में कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A द्वारा 1 दिन में किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B द्वारा 1 दिन में किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों द्वारा मिलकर 1 दिन में किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C द्वारा 1 दिन में किया गया कार्य = 1/3 − 1/6 − 1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (8 − 4 − 3)/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनके एक दिन के कार्य का अनुपात = 1/6 : 1/8 : 1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक पद को 24 से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 4 : 3 : 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भाग = 4 + 3 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C का हिस्सा = 3,200 × (1/8) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धनराशि में C का हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि x = 2 + √3 है, तो x² + 1/x² का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले हर का परिमेयकरण करके 1/x ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/x = 1/(2 + √3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंश और हर दोनों को (2 − √3) से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/x = (2 − √3) / [(2)² − (√3)²]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2 − √3) / (4 − 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 − √3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 1/x = (2 + √3) + (2 − √3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पक्षों का वर्ग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + 1/x)² = x² + 1/x² + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 = x² + 1/x² + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² + 1/x² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: यदि x + 1/x = k हो, तो x² + 1/x² = k² − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 16 − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 18 + {4 × 36 ÷ 6 + 5} − (24 ÷ 8) × 4</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">37</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले सबसे भीतर का कोष्ठक हल करें, फिर मध्य कोष्ठक और उसके बाद शेष पद।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(24 ÷ 8) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मध्य कोष्ठक के भीतर × और ÷ बाएँ से दाएँ क्रम में किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 36 = 144, फिर 144 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{24 + 5} = </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक 18 + 29 − (3 × 4) रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 + 29 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति अपने धन का 20% खो देता है। इसके बाद वह शेष धन का 25% खर्च कर देता है। यदि उसके पास ₹525 बचते हैं, तो उसका मूल धन कितना था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹890</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹880</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹885</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹875</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना मूल धन ₹x है तथा दोनों परिवर्तन एक के बाद एक लागू करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20% खोने के बाद बचा धन = x × 80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद वह इसका 25% खर्च करता है, अतः इसका 75% भाग बचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंत में बचा धन = x × 80% × 75%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × 80% × 75% = x × 60%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात् मूल धन का 60% भाग ₹525 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (525 × 100) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹875</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ₹875 × 80% = ₹700 तथा ₹700 × 75% = ₹525 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसका मूल धन </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹875 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> था।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्यालय में लड़कों और लड़कियों की संख्या का अनुपात 5 : 3 है। यदि 20 और लड़कियाँ प्रवेश ले लें, तो यह अनुपात 5 : 4 हो जाता है। विद्यालय में लड़के कितने हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">125</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला अनुपात बनाए रखने के लिए लड़कों की संख्या 5x तथा लड़कियों की संख्या 3x लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़कों की संख्या नहीं बदलती, केवल लड़कियाँ बढ़ती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़कियों की नई संख्या = 3x + 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5x) : (3x + 20) = 5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तिर्यक गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 5x = 5 × (3x + 20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20x = 15x + 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़कों की संख्या = 5x = 5 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: लड़कियाँ 60 थीं और 80 हो जाती हैं तथा 100 : 80 = 5 : 4 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्यालय में लड़के </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A एक कार्य को 12 दिन में तथा B उसी कार्य को 18 दिन में पूरा कर सकता है। वे कार्य एक साथ शुरू करते हैं, परंतु कार्य समाप्त होने से 3 दिन पहले A छोड़ देता है। पूरा कार्य कितने दिन में समाप्त हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 दिन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना पूरा कार्य d दिन में समाप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B पूरे d दिन कार्य करता है, जबकि A केवल (d − 3) दिन कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A द्वारा 1 दिन में किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B द्वारा 1 दिन में किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d − 3)/12 + d/18 = 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हर हटाने के लिए प्रत्येक पद को 36 से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3(d − 3) + 2d = 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3d − 9 + 2d = 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A 6 दिन कार्य करके 6/12 = 1/2 भाग तथा B 9 दिन कार्य करके 9/18 = 1/2 भाग करता है और 1/2 + 1/2 = 1 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पूरा कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 दिन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में समाप्त हुआ।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">351 और 650 के बीच कितनी संख्याएँ 7 से विभाज्य हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले 351 और 650 के बीच 7 का पहला तथा अंतिम गुणज ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 50 = 350 है, जो 351 से कम है, अतः इस परास में पहला गुणज 7 × 51 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">357</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 × 93 = 651 है, जो 650 से अधिक है, अतः इस परास में अंतिम गुणज 7 × 92 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">644</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणज 7 × 51, 7 × 52, …, 7 × 92 हैं, अतः 51 से 92 तक के गुणकों की गिनती कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गिनती = 92 − 51 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसी संख्याओं की गिनती </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धनराशि पर 10% वार्षिक दर से 3 वर्ष का साधारण ब्याज ₹1,800 है। उसी धनराशि पर उसी दर से 2 वर्ष का चक्रवृद्धि ब्याज, वार्षिक रूप से संयोजित, कितना होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,260</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,320</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,380</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले साधारण ब्याज से धनराशि ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,800 = (P × 10 × 3) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = (1,800 × 100) / 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब ₹6,000 पर 10% वार्षिक दर से 2 वर्ष का चक्रवृद्धि कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रधन = 6,000 × 110% × 110%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6,000 × 121%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज = ₹7,260 − ₹6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,260</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चक्रवृद्धि ब्याज </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,260 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक परीक्षा में 60 विद्यार्थियों द्वारा प्राप्त अंक नीचे दिए गए हैं। वितरण का बहुलक ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790313256948_image002.png\" width=\"442\" height=\"137\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस वर्ग की बारंबारता सबसे अधिक होती है, वही बहुलक वर्ग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे अधिक बारंबारता </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span><span style=\"font-family:'Mangal'\"> है, अतः बहुलक वर्ग </span><span style=\"font-weight:bold;font-family:'Mangal'\">20-30</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग की निम्न सीमा (l) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग अंतराल का माप (h) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">) = 22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग से ठीक पहले वाले वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक वर्ग के ठीक बाद वाले वर्ग की बारंबारता (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) = 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुलक = l + [(f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) / (2f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">)] × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + [(22 − 10) / (44 − 10 − 14)] × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + (12 / 20) × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वितरण का बहुलक </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज ABC में D भुजा AB पर तथा E भुजा AC पर इस प्रकार स्थित हैं कि DE, BC के समांतर है। यदि AD : DB = 2 : 3 हो तथा त्रिभुज ADE का क्षेत्रफल 24 cm² हो, तो समलंब DBCE का क्षेत्रफल कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DE, BC के समांतर है, अतः संगत कोण बराबर होते हैं और ΔADE, ΔABC के समरूप है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AD : DB = 2 : 3 है, अतः AD : AB = 2 : (2 + 3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समरूप त्रिभुजों के क्षेत्रफलों का अनुपात, संगत भुजाओं के वर्गों के अनुपात के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔADE का क्षेत्रफल : ΔABC का क्षेत्रफल = 2² : 5² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔABC का क्षेत्रफल = 24 × (25/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔABC में से ΔADE हटाने पर जो भाग बचता है, वही समलंब है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समलंब DBCE का क्षेत्रफल = 150 − 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समलंब DBCE का क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 cm² (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठहरावों को छोड़कर एक रेलगाड़ी की चाल 80 km/h है तथा ठहरावों सहित यह 60 km/h है। रेलगाड़ी एक घंटे में कितने मिनट रुकती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 मिनट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक घंटे में रेलगाड़ी 80 km के स्थान पर केवल 60 km चलती है तथा शेष समय खड़ी रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठहरावों के कारण छूटी दूरी = 80 − 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन 20 km को रेलगाड़ी अपनी चलने की चाल 80 km/h से तय करती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठहराव का समय = दूरी / चाल</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 / 80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4 घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/4 घंटा = (1/4) × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रति घंटा ठहराव का समय = [(दोनों चालों का अंतर) / (ठहरावों को छोड़कर चाल)] × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (20 / 80) × 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रेलगाड़ी एक घंटे में </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 मिनट (विकल्प B)</span><span style=\"font-family:'Mangal'\"> रुकती है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बर्तन में दूध और पानी का 45 litre मिश्रण 7 : 2 के अनुपात में है। मिश्रण में कितना पानी और मिलाया जाए कि दूध और पानी का अनुपात 7 : 3 हो जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 litre</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 litre</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 litre</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5 litre</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल पानी मिलाया जाता है, अतः दूध की मात्रा पूरे समय समान रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रण में कुल भाग = 7 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध = 45 × (7/9) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 litre</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पानी = 45 − 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 litre</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए मिश्रण में दूध 35 litre ही रहता है तथा दूध : पानी = 7 : 3 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए मिश्रण में पानी = 35 × (3/7) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 litre</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलाया जाने वाला पानी = 15 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 litre</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मिलाया जाने वाला पानी </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 litre (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह छोटी से छोटी संख्या कौन-सी है, जिसमें से 7 घटाने पर प्राप्त संख्या 8, 12, 18 और 30 से पूर्णतः विभाज्य हो जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">367</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">353</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">373</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">361</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 घटाने के बाद बची संख्या 8, 12, 18 और 30 चारों से विभाज्य है, अतः वह इनके LCM (लघुत्तम समापवर्त्य) का गुणज होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 = 2³, 12 = 2² × 3, 18 = 2 × 3² तथा 30 = 2 × 3 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2³ × 3² × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा सबसे छोटा गुणज 360 ही है, अतः अभीष्ट संख्या इससे 7 अधिक होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट संख्या = 360 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">367</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 367 − 7 = 360, और 360, 8, 12, 18 तथा 30 से विभाज्य है ✓</span></p><p style=\"mar t-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेलारूस</span><span style=\"font-family:'Mangal'\"> की </span><span style=\"font-weight:bold;font-family:'Mangal'\">आरिना सबालेंका</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">6-4, 4-6, 6-4</span><span style=\"font-family:'Mangal'\"> से हराकर अपना पहला ऑस्ट्रेलियन ओपन तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरा</span><span style=\"font-family:'Mangal'\"> ग्रैंड स्लैम एकल खिताब जीता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑस्ट्रेलियन ओपन वर्ष की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहली</span><span style=\"font-family:'Mangal'\"> ग्रैंड स्लैम प्रतियोगिता है और 2026 का संस्करण </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 जनवरी से 1 फ़रवरी 2026</span><span style=\"font-family:'Mangal'\"> तक मेलबर्न के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेलबर्न पार्क</span><span style=\"font-family:'Mangal'\"> में खेला गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विजेता </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्लोस अल्काराज़ (विकल्प C)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1964 में भ्रष्टाचार निवारण समिति की अध्यक्षता किसने की थी और केंद्रीय सतर्कता आयोग की स्थापना का सुझाव दिया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">के. संथानम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जी. वी. रामकृष्ण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पी. के. मोहंती</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जी. के. पिल्लई</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">भ्रष्टाचार निवारण समिति</span><span style=\"font-family:'Mangal'\"> भारत सरकार ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">1962</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">के. संथानम</span><span style=\"font-family:'Mangal'\"> की अध्यक्षता में बनाई थी और इसे प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">संथानम समिति</span><span style=\"font-family:'Mangal'\"> कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समिति ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रीय सतर्कता आयोग (CVC)</span><span style=\"font-family:'Mangal'\"> की स्थापना की सिफ़ारिश की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन सिफ़ारिशों को ध्यान में रखते हुए भारत सरकार ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 फ़रवरी 1964 के संकल्प</span><span style=\"font-family:'Mangal'\"> द्वारा CVC की स्थापना की (यह एक कार्यकारी संकल्प था, कोई कानून नहीं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CVC को पहली बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">1998 में एक अध्यादेश द्वारा वैधानिक दर्जा</span><span style=\"font-family:'Mangal'\"> मिला, और बाद में </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रीय सतर्कता आयोग अधिनियम, 2003</span><span style=\"font-family:'Mangal'\"> ने इसे स्थायी वैधानिक आधार दिया (11 सितंबर 2003 से लागू)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अध्यक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">के. संथानम (विकल्प A)</span><span style=\"font-family:'Mangal'\"> थे।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर अटलांटिक संधि संगठन (NATO) का मुख्यालय किस शहर में स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिनेवा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वियना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रुसेल्स</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हेग</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर अटलांटिक संधि संगठन (NATO)</span><span style=\"font-family:'Mangal'\"> का मुख्यालय </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेल्जियम</span><span style=\"font-family:'Mangal'\"> की राजधानी </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रुसेल्स</span><span style=\"font-family:'Mangal'\"> में है, जहाँ यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">1967</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेरिस</span><span style=\"font-family:'Mangal'\"> से आया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NATO की स्थापना </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 अप्रैल 1949</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर अटलांटिक संधि</span><span style=\"font-family:'Mangal'\"> से हुई थी, जिस पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">वॉशिंगटन, डी.सी.</span><span style=\"font-family:'Mangal'\"> में हस्ताक्षर हुए थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी संधि का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 5</span><span style=\"font-family:'Mangal'\"> सामूहिक रक्षा का सिद्धांत रखता है, अर्थात् किसी एक सदस्य पर सशस्त्र हमले को सभी सदस्यों पर हमला माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जिनेवा</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विश्व व्यापार संगठन (WTO)</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">वियना</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्राष्ट्रीय परमाणु ऊर्जा एजेंसी (IAEA)</span><span style=\"font-family:'Mangal'\"> तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">हेग</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्राष्ट्रीय न्यायालय (ICJ)</span><span style=\"font-family:'Mangal'\"> का मुख्यालय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मुख्यालय </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रुसेल्स (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 सितंबर 2026 को उत्तराखं bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">2 जून 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयुक्त राष्ट्र महासभा</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">81वें</span><span style=\"font-family:'Mangal'\"> सत्र के अध्यक्ष चुने गए </span><span style=\"font-weight:bold;font-family:'Mangal'\">ख़लीलुर रहमान</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">बांग्लादेश</span><span style=\"font-family:'Mangal'\"> से हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस चुनाव में उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">साइप्रस</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंद्रेयास काकूरिस</span><span style=\"font-family:'Mangal'\"> को हराया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महासभा के अध्यक्ष का पद संयुक्त राष्ट्र के क्षेत्रीय समूहों के बीच बारी-बारी से आता है और 81वें सत्र के लिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">एशिया प्रशांत समूह</span><span style=\"font-family:'Mangal'\"> को मिला।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महासभा का अध्यक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक</span><span style=\"font-family:'Mangal'\"> सत्र के कार्यकाल के लिए चुना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">बांग्लादेश (विकल्प B)</span><span style=\"font-family:'Mangal'\"> से हैं।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में श्वेत क्रांति का जनक किसे कहा जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एम. एस. स्वामीनाथन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सी. सुब्रमण्यम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नॉर्मन बोरलॉग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्गीस कुरियन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वर्गीस कुरियन</span><span style=\"font-family:'Mangal'\"> को भारत में </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत क्रांति का जनक</span><span style=\"font-family:'Mangal'\"> कहा जाता है; इसी आंदोलन से भारत </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूध</span><span style=\"font-family:'Mangal'\"> का विश्व में सबसे बड़ा उत्पादक बना।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑपरेशन फ़्लड</span><span style=\"font-family:'Mangal'\"> का नेतृत्व किया, जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय डेयरी विकास बोर्ड (NDDB)</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">1970</span><span style=\"font-family:'Mangal'\"> में आरंभ किया था; कुरियन NDDB के संस्थापक अध्यक्ष थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑपरेशन फ़्लड ने अपना कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुजरात</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">आणंद</span><span style=\"font-family:'Mangal'\"> स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">खेड़ा ज़िला सहकारी दुग्ध उत्पादक संघ</span><span style=\"font-family:'Mangal'\"> के सहकारी मॉडल पर आधारित किया, जिसे उसके ब्रांड नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमूल</span><span style=\"font-family:'Mangal'\"> से व्यापक रूप से जाना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">एम. एस. स्वामीनाथन</span><span style=\"font-family:'Mangal'\"> को भारत में </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरित क्रांति</span><span style=\"font-family:'Mangal'\"> का अगुआ और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नॉर्मन बोरलॉग</span><span style=\"font-family:'Mangal'\"> को हरित क्रांति का जनक कहा जाता है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">सी. सुब्रमण्यम</span><span style=\"font-family:'Mangal'\"> उन हरित क्रांति वर्षों में केंद्रीय कृषि मंत्री थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः श्वेत क्रांति के जनक </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्गीस कुरियन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारतीय रेल जिसका संस्करण 4.0 खंड-दर-खंड चालू कर रही है, वह कवच किस प्रकार की प्रणाली है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यात्री टिकट प्रणाली</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पटरी नवीकरण मशीन</span></p> ily:'Mangal'\">माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B का पति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P × Q ÷ R + S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R + S → R, S का पति है, अतः R और S पति-पत्नी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q ÷ R → Q, R की पुत्री है, अतः R, Q का जनक है। चूँकि R और S पति-पत्नी हैं, इसलिए S, Q की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P × Q → P, Q का भाई है, अतः P और Q के माता-पिता समान हैं, और इसलिए S, P की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बहन होने के लिए S के माता-पिता वही होने पड़ते जो P के हैं; पुत्री होने पर पीढ़ी उलट जाती; और पिता की बहन होने के लिए शृंखला में एक व्यक्ति और चाहिए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः S, P की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शब्द DOSAGE के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाए, तो कितने अक्षरों का स्थान अपरिवर्तित रहेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द लिखें और फिर उसके अक्षरों को अंग्रेज़ी वर्णमाला क्रम में एक के नीचे एक लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द: D, O, S, A, G, E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला क्रम में अक्षर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, D, E, G, O, S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब दोनों पंक्तियों की तुलना स्थान दर स्थान करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला स्थान: D और A अलग हैं; दूसरा स्थान: O और D अलग हैं; तीसरा स्थान: S और E अलग है
