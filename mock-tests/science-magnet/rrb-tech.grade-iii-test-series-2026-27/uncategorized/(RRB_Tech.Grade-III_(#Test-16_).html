<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>33.) RRB Tech.Grade-III (#Test-16   - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

p:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन तथा हाइड्रोजन के आधार पर, जो पदार्थ ऑक्सीजन प्राप्त करता है या हाइड्रोजन खोता है वह उपचयित होता है, और जो ऑक्सीजन खोता है या हाइड्रोजन प्राप्त करता है वह अपचयित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. इस अभिक्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">HCl हाइड्रोजन खोकर</span><span style=\"font-family:'Mangal'\"> क्लोरीन गैस बनाता है, अतः HCl </span><span style=\"font-weight:bold;font-family:'Mangal'\">उपचयित होकर Cl</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">MnO</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\"> अपनी ऑक्सीजन खोकर</span><span style=\"font-family:'Mangal'\"> MnCl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> बनता है, अतः MnO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपचयित होकर MnCl</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. MnO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> ऑक्सीजन प्राप्त नहीं करता; वह तो यहाँ अपनी ऑक्सीजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">देने वाला</span><span style=\"font-family:'Mangal'\"> पदार्थ है, इसीलिए वह उपचायक का कार्य करता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केरोसिन तेल और जल को एक ही पात्र में डालने पर वे आपस में नहीं मिलते और दो अलग-अलग परतों में बैठ जाते हैं। इन्हें अलग करने के लिए जिस उपकरण का प्रयोग किया जाता है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथक्कारी कीप</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपकेंद्रित्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चीनी मिट्टी की प्याली</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रोमैटोग्राफ़ी कागज़</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो दो द्रव आपस में नहीं मिलते और अलग-अलग परतें बना लेते हैं, उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमिश्रणीय द्रव</span><span style=\"font-family:'Mangal'\"> कहते हैं, और केरोसिन तेल तथा जल ऐसा ही युग्म हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये परतों में इसलिए बैठते हैं क्योंकि इनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">घनत्व भिन्न</span><span style=\"font-family:'Mangal'\"> होते हैं: हल्का तेल ऊपर तैरकर ऊपरी परत बनाता है और भारी जल नीचे रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे मिश्रण के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">पृथक्कारी कीप</span><span style=\"font-family:'Mangal'\"> का प्रयोग किया जाता है: नीचे लगी टोंटी धीरे से खोलकर पहले जल की निचली परत बाहर निकाल ली जाती है और उसके बाद तेल एकत्र कर लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपकेंद्रित्र तेज़ी से घुमाकर निलंबन के भारी कणों को अलग करता है, चीनी मिट्टी की प्याली वाष्पन के लिए काम आती है, और क्रोमैटोग्राफ़ी कागज़ विलयन के पदार्थों को अलग करता है, अतः इनमें से कोई दो अमिश्रणीय द्रवों के लिए उपयुक्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इसके लिए पृथक्कारी कीप का प्रयोग किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 cm ऊँची एक वस्तु 10 cm फोकस दूरी वाले उत्तल लेंस के सामने 30 cm की दूरी पर रखी है। बनने वाले प्रतिबिंब का आकार तथा प्रकृति है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 cm, आभासी तथा सीधा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 cm, वास्तविक तथा उल्टा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm, वास्तविक तथा उल्टा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 cm, वास्तविक तथा उल्टा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्न परिपाटी के अनुसार u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\">, तथा उत्तल लेंस के लिए f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+10 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र: 1/v − 1/u = 1/f</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = 1/f + 1/u = 1/10 + (−1/30)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = (3 − 1) / 30 = 2/30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+15 cm</span><span style=\"font-family:'Mangal'\">, अतः प्रतिबिंब लेंस के दूसरी ओर 15 cm पर बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्धन m = v/u = 15 / (−30) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−0.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिबिंब की ऊँचाई = m × वस्तु की ऊँचाई = −0.5 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई का ऋण चिह्न बताता है कि प्रतिबिंब उल्टा है, और उत्तल लेंस के दूसरी ओर बनने वाला प्रतिबिंब वास्तविक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब 3 cm ऊँचा, वास्तविक तथा उल्टा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाष्पोत्सर्जन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पौधे के वायवीय भागों से जल का वाष्प के रूप में निकल जाना वाष्पोत्सर्जन कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वाष्पोत्सर्जन जल तथा उसमें घुले खनिजों के अवशोषण और ऊपर की ओर गति में सहायक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वाष्पोत्सर्जन पौधे के तापमान को नियंत्रित करने में कोई भूमिका नहीं निभाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पौधे के </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायवीय भागों से जल का वाष्प के रूप में</span><span style=\"font-family:'Mangal'\"> निकल जाना, जो मुख्यतः पत्तियों के रंध्रों से होता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाष्पोत्सर्जन</span><span style=\"font-family:'Mangal'\"> कहलाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वाष्प बनकर निकलता जल पौधे की वाहिकाओं में खिंचाव पैदा करता है, इसलिए वाष्पोत्सर्जन जड़ों से पत्तियों तक </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल तथा उसमें घुले खनिजों के अवशोषण और ऊपर की ओर गति में सहायक</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वाष्पोत्सर्जन पौधे के </span><span style=\"font-weight:bold;font-family:'Mangal'\">तापमान को नियंत्रित करने में भी सहायक</span><span style=\"font-family:'Mangal'\"> होता है, क्योंकि वाष्प बनकर उड़ता जल अपने साथ ऊष्मा भी ले जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका में लाइसोसोम का मुख्य कार्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाहरी पदार्थों तथा घिस चुके कोशिकांगों का पाचन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ATP अणुओं के रूप में ऊर्जा का उत्पादन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाद्रव्य में जल तथा खनिजों के संतुलन का नियमन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका झिल्ली के लिए प्रोटीन तथा लिपिड का संश्लेषण</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाइसोसोम एक झिल्ली से घिरी ऐसी थैलियाँ हैं जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">एंजाइम</span><span style=\"font-family:'Mangal'\"> से भरी रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये एंजाइम अनावश्यक प्रोटीन, कार्बोहाइड्रेट तथा वसा को, और कोशिका के टूटे-फूटे या घिस चुके भागों को भी तोड़ सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए लाइसोसोम कोशिका में आए बाहरी पदार्थों का पाचन करता है और पुराने कोशिकांगों को हटा देता है, इसी कारण उसे कोशिका का अपशिष्ट निपटान तंत्र कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ATP के रूप में ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">माइटोकॉन्ड्रिया</span><span style=\"font-family:'Mangal'\"> में मुक्त होती है, झिल्लियों के लिए प्रोटीन तथा लिपिड </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्द्रव्यी जालिका</span><span style=\"font-family:'Mangal'\"> बनाती है, और जल तथा खनिजों की आवाजाही कोशिका झिल्ली नियंत्रित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लाइसोसोम का मुख्य कार्य बाहरी पदार्थों तथा घिस चुके कोशिकांगों का पाचन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधातुओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अधातुएँ या तो ठोस होती हैं या गैस, केवल ब्रोमीन इसका अपवाद है, जो द्रव है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. आयोडीन अधातु है, फिर भी वह चमकदार है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अधिकांश अधातुओं के ऑक्साइड जल में घुलकर क्षारकीय ऑक्साइड देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अधातुएँ या तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठोस होती हैं या गैस</span><span style=\"font-family:'Mangal'\">, और इसका एक अपवाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रोमीन</span><span style=\"font-family:'Mangal'\"> है, जो कमरे के तापमान पर द्रव रहती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अधातुएँ प्रायः चमकरहित होती हैं, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयोडीन अधातु होकर भी चमकदार</span><span style=\"font-family:'Mangal'\"> है, जो अधातुओं के भौतिक गुणों का एक अपवाद है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अधिकांश अधातुएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्लीय ऑक्साइड</span><span style=\"font-family:'Mangal'\"> देती हैं, इसीलिए जलते हुए सल्फर के धुएँ का विलयन नीले लिटमस को लाल कर देता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारकीय ऑक्साइड</span><span style=\"font-family:'Mangal'\"> तो धातुएँ देती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण के लिए सूची I में दी गई वस्तु की स्थिति का सूची II में दिए गए प्रतिबिंब से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790313158331_image001.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(iv), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(iii), (d)-(ii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वस्तु अनंत पर</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिबिंब F पर, अत्यधिक छोटा</span><span style=\"font-family:'Mangal'\">: बहुत दूर की वस्तु से आती समांतर किरणें मुख्य फोकस पर मिलती हैं और बिंदु के आकार का वास्तविक प्रतिबिंब बनाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वस्तु C से परे</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिबिंब F और C के बीच, छोटा</span><span style=\"font-family:'Mangal'\">: यह प्रतिबिंब वास्तविक तथा उल्टा होता है और वस्तु से छोटा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वस्तु C पर</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिबिंब C पर, समान आकार का</span><span style=\"font-family:'Mangal'\">: यह प्रतिबिंब वास्तविक तथा उल्टा होता है और ठीक वस्तु के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वस्तु C और F के बीच</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिबिंब C से परे, बड़ा</span><span style=\"font-family:'Mangal'\">: यह प्रतिबिंब वास्तविक तथा उल्टा होता है और वस्तु से बड़ा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुत अधिक ऊँचाई पर उड़ रहे वायुयान के यात्रियों को आकाश नीला नहीं, बल्कि काला दिखाई देता है। इसका कारण यह है कि इतनी ऊँचाई पर:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु बहुत ठंडी होती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य का प्रकाश वहाँ तक नहीं पहुँचता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु के अणु अपना नीला प्रकाश देते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश का प्रकीर्णन प्रबल नहीं होता</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धरती से आकाश इसलिए नीला दिखाई देता है क्योंकि वायु के अणु तथा वायुमंडल के सूक्ष्म कण सूर्य के प्रकाश की छोटी तरंगदैर्घ्य वाली, अर्थात नीले सिरे की किरणों का प्रकीर्णन लाल सिरे की तुलना में कहीं अधिक प्रबलता से करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही प्रकीर्ण नीला प्रकाश आकाश के हर भाग से हमारी आँखों तक पहुँचता है, और उसी को हम आकाश का रंग देखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुत अधिक ऊँचाई पर वायु अत्यंत विरल होती है, इसलिए प्रकाश का प्रकीर्णन करने वाले अणु तथा कण बहुत कम रह जाते हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकीर्णन प्रबल नहीं रह जाता</span><span style=\"font-family:'Mangal'\">; आँख तक प्रकीर्ण प्रकाश लगभग न पहुँचने के कारण आकाश काला दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु का ठंडा होना रंग तय नहीं करता, सूर्य का प्रकाश तो उन ऊँचाइयों से भी आगे पहुँचता है, और वायु के अणु अपना कोई प्रकाश नहीं देते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आकाश इसलिए काला दिखाई देता है क्योंकि प्रकाश का प्रकीर्णन प्रबल नहीं होता </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790313158331_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(ii), (d)-(iv)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत धारा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐम्पियर</span><span style=\"font-family:'Mangal'\">: धारा का SI मात्रक फ़्रांसीसी वैज्ञानिक आंद्रे मैरी ऐम्पियर के नाम पर रखा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विभवांतर</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">वोल्ट</span><span style=\"font-family:'Mangal'\">: दो बिंदुओं के बीच एक वोल्ट विभवांतर तब होता है जब एक कूलॉम आवेश को एक बिंदु से दूसरे बिंदु तक ले जाने में एक जूल कार्य करना पड़े।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिरोध</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओम</span><span style=\"font-family:'Mangal'\">: प्रतिरोध चालक का वह गुण है जिससे वह आवेश के प्रवाह का विरोध करता है, और उसका SI मात्रक ओम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत आवेश</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">कूलॉम</span><span style=\"font-family:'Mangal'\">: कूलॉम लगभग 6 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">18</span><span style=\"font-family:'Mangal'\"> इलेक्ट्रॉनों पर उपस्थित आवेश के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी सीधे तार में बह रही धारा की दिशा में एक कॉर्कस्क्रू को घुमाकर आगे बढ़ाने की कल्पना की जाती है। तब कॉर्कस्क्रू जिस दिशा में घूमता है, वह दिशा किसकी होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार में बहने वाली विद्युत धारा की</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार के चारों ओर के चुंबकीय क्षेत्र की</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार पर लगने वाले बल की</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार में इलेक्ट्रॉनों के प्रवाह की</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधे तार में बहती धारा उसके चारों ओर चुंबकीय क्षेत्र उत्पन्न करती है, और उसकी क्षेत्र रेखाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">संकेंद्री वृत्त</span><span style=\"font-family:'Mangal'\"> होती हैं, जिनके केंद्र पर तार रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये वृत्त किस दिशा में खिंचे हैं, यह जानने के लिए कॉर्कस्क्रू नियम काम में लिया जाता है: कल्पना कीजिए कि कॉर्कस्क्रू को धारा की दिशा में आगे बढ़ाया जा रहा है, तो वह जिस दिशा में </span><span style=\"font-weight:bold;font-family:'Mangal'\">घूमता</span><span style=\"font-family:'Mangal'\"> है वही </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय क्षेत्र</span><span style=\"font-family:'Mangal'\"> की दिशा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही परिणाम दाहिने हाथ के अंगूठे के नियम से भी मिलता है, जिसमें अंगूठा धारा की दिशा में रहता है और मुड़ी हुई उँगलियाँ क्षेत्र रेखाओं की दिशा बताती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा की दिशा तो पहले से ही आगे बढ़ाने की दिशा के रूप में दी हुई है, इलेक्ट्रॉनों का प्रवाह धारा के विपरीत होता है, और तार पर बल तभी लगता है जब उसे किसी दूसरे चुंबकीय क्षेत्र में रखा जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह घूर्णन तार के चारों ओर के चुंबकीय क्षेत्र की दिशा बताता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): किसी सीधे तार में धारा की दिशा उलट देने पर उसके पास रखी कंपास की सुई विपरीत दिशा में विक्षेपित हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): सीधे धारावाही तार के चारों ओर की चुंबकीय क्षेत्र रेखाएँ तार के समांतर सरल रेखाएँ होती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधे तार के नीचे उसके समांतर रखी कंपास की सुई धारा प्रवाहित करने पर विक्षेपित हो जाती है, और धारा की दिशा उलटने पर वह दूसरी ओर विक्षेपित होती दिखाई देती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधे धारावाही तार के चारों ओर की क्षेत्र रेखाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">संकेंद्री वृत्त</span><span style=\"font-family:'Mangal'\"> होती हैं, जिनके केंद्र पर तार रहता है, न कि तार के समांतर सरल रेखाएँ → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुई दूसरी ओर इसलिए घूमती है क्योंकि धारा उलटने पर इन वृत्ताकार क्षेत्र रेखाओं की दिशा उलट जाती है, और सुई का उत्तरी ध्रुव उसी दिशा का अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक से अधिक परमाणुओं से बना वह विद्युत उदासीन कण, जो स्वतंत्र रूप से रह सकता है और पदार्थ के सभी गुण दर्शाता है, कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनायन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अणु</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही तत्व के परमाणु आपस में जुड़ सकते हैं, जैसे दो हाइड्रोजन परमाणु जुड़कर हाइड्रोजन का अणु बनाते हैं, और भिन्न तत्वों के परमाणु भी जुड़ सकते हैं, जैसे एक हाइड्रोजन परमाणु तथा एक क्लोरीन परमाणु जुड़कर हाइड्रोजन क्लोराइड बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत उदासीन</span><span style=\"font-family:'Mangal'\"> होता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक से अधिक परमाणुओं</span><span style=\"font-family:'Mangal'\"> से बना होता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वतंत्र रूप से रह सकता</span><span style=\"font-family:'Mangal'\"> है और उस पदार्थ के सभी गुण दर्शाता है; इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अणु</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आयन</span><span style=\"font-family:'Mangal'\"> आवेशित कण होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">धनायन</span><span style=\"font-family:'Mangal'\"> धन आवेश वाला आयन है, अतः इनमें से कोई विद्युत उदासीन नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> परमाणु के भीतर का ऋण आवेशित कण है और वह परमाणुओं से बना ही नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसा कण अणु कहलाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MgO में ऑक्सीजन की संयोजकता क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तत्व की संयोजकता उसकी संयोजन क्षमता है, और वह उसके सबसे बाहरी कोश के इलेक्ट्रॉनों से तय होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन का इलेक्ट्रॉनिक विन्यास </span><span style=\"font-weight:bold;font-family:'Mangal'\">2, 6</span><span style=\"font-family:'Mangal'\"> है, अतः उसके पास </span><span style=\"font-weight:bold;font-family:'Mangal'\">छह संयोजी इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> हैं और अष्टक पूरा करने के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो और</span><span style=\"font-family:'Mangal'\"> इलेक्ट्रॉन चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस तत्व के संयोजी इलेक्ट्रॉन चार से अधिक होते हैं, वह अष्टक पूरा करने के लिए इलेक्ट्रॉन ग्रहण करता है, इसलिए ऑक्सीजन दो इलेक्ट्रॉन ले लेती है और उसकी संयोजकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम ऑक्साइड MgO में एक मैग्नीशियम परमाणु दो इलेक्ट्रॉन देता है और एक ऑक्सीजन परमाणु वही दो इलेक्ट्रॉन ले लेती है, इसी से दोनों 1 : 1 के अनुपात में जुड़ते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः MgO में ऑक्सीजन की संयोजकता दो है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशोरावस्था के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किशोरावस्था के परिवर्तन महीनों और वर्षों में धीरे-धीरे होते हैं और सब में एक ही आयु पर आरंभ नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लड़कों में टेस्टोस्टेरॉन शुक्राणुओं के निर्माण का नियमन करता है और दिखावट के परिवर्तन लाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लड़कियों में रजोधर्म किशोरावस्था आरंभ होने से कई वर्ष पहले ही शुरू हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किशोरावस्था के परिवर्तन </span><span style=\"font-weight:bold;font-family:'Mangal'\">महीनों और वर्षों में धीरे-धीरे होते</span><span style=\"font-family:'Mangal'\"> हैं, वे सब एक साथ नहीं होते, और किस आयु पर आरंभ होंगे तथा कितनी तेज़ी से चलेंगे, यह हर व्यक्ति में भिन्न होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लड़कों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">टेस्टोस्टेरॉन</span><span style=\"font-family:'Mangal'\"> हॉर्मोन शुक्राणुओं के निर्माण का नियमन करता है और दिखावट के परिवर्तन लाता है, जैसे चेहरे पर नए बालों का आना → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लड़कियों में रजोधर्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">किशोरावस्था के आसपास</span><span style=\"font-family:'Mangal'\"> आरंभ होता है, उससे कई वर्ष पहले नहीं, क्योंकि रजोधर्म स्वयं लैंगिक परिपक्वता के परिवर्तनों में से एक है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खमीर के कणों को गर्म शर्करा के विलयन में डालकर एक घंटे बाद सूक्ष्मदर्शी से देखा जाता है। खमीर की कोशिकाओं से छोटे-छोटे उभार निकलते दिखाई देते हैं, जो बाद में अलग होकर नई खमीर कोशिकाएँ बन जाते हैं। प्रजनन की यह विधि है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुकुलन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्विखंडन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खंडन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु निर्माण</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मुकुलन</span><span style=\"font-family:'Mangal'\"> में जनक के शरीर से एक छोटा उभार निकलता है, जिसे मुकुल कहते हैं, और यह मुकुल बढ़कर अलग हो जाता है तथा नए जीव के रूप में रहने लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्म शर्करा के विलयन में पड़ा खमीर ऐसे ही छोटे मुकुल निकालता है, जो अलग होकर आगे बढ़ते हैं, अतः खमीर मुकुलन द्वारा बढ़ता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रा</span><span style=\"font-family:'Mangal'\"> भी इसी प्रकार प्रजनन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">द्विखंडन</span><span style=\"font-family:'Mangal'\"> में जनक कोशिका सीधे दो संतति कोशिकाओं में बँट जाती है, जैसा अमीबा में होता है, और कोई मुकुल नहीं निकलता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खंडन</span><span style=\"font-family:'Mangal'\"> में जीव का शरीर टुकड़ों में टूट जाता है और प्रत्येक टुकड़ा नया जीव बना देता है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणु निर्माण</span><span style=\"font-family:'Mangal'\"> में छोटी थैलियों के भीतर मोटी भित्ति वाले बीजाणु बनते हैं, जैसे ब्रेड पर उगे कवक जाल में।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रजनन की यह विधि मुकुलन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): रक्त को संयोजी ऊतक माना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): रक्त का मैट्रिक्स तरल रूप में होता है, जबकि हड्डी का मैट्रिक्स कठोर और दृढ़ होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो ऊतक शरीर के दूसरे ऊतकों को जोड़ता और सहारा देता है, उसे संयोजी ऊतक कहते हैं, और रक्त यही काम करता है: वह शरीर के हर भाग को जोड़ता है और पदार्थों को एक भाग से दूसरे भाग तक ले जाता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्त और हड्डी दोनों संयोजी ऊतक हैं, और इनमें अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैट्रिक्स</span><span style=\"font-family:'Mangal'\"> का है: रक्त का मैट्रिक्स तरल होता है, जबकि हड्डी का मैट्रिक्स कठोर, ठोस तथा दृढ़ होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु मैट्रिक्स का यह अंतर केवल यह बताता है कि दोनों ऊतक एक-दूसरे से किस प्रकार भिन्न हैं; इससे यह पता नहीं चलता कि रक्त को संयोजी ऊतकों में रखा ही क्यों गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्त संयोजी ऊतक इसलिए है क्योंकि वह शरीर को जोड़ने तथा सहारा देने का कार्य करता है, अतः R, A का कारण नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्तिष्क के अन्य भागों की तुलना में अग्रमस्तिष्क का विशिष्ट कार्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह संवेदी आवेग ग्रहण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह हॉर्मोन स्रावित करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह हृदय की धड़कन का नियमन करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह संतुलन बनाए रखता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्तिष्क के तीन प्रमुख भाग होते हैं: अग्रमस्तिष्क, मध्यमस्तिष्क तथा पश्चमस्तिष्क।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अग्रमस्तिष्क</span><span style=\"font-family:'Mangal'\"> मस्तिष्क का मुख्य सोचने वाला भाग है, और उसमें ऐसे अलग-अलग क्षेत्र होते हैं जो विभिन्न ग्राहियों से आने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">संवेदी आवेग ग्रहण</span><span style=\"font-family:'Mangal'\"> करते हैं, जिनमें सुनने, सूँघने तथा देखने के लिए भिन्न-भिन्न क्षेत्र होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद उसके संबंध क्षेत्र इस सूचना को दूसरी ग्राहियों की सूचना तथा मस्तिष्क में पहले से संचित सूचना के साथ जोड़कर उसका अर्थ निकालते हैं, और निर्णय प्रेरक क्षेत्रों तक पहुँचा दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हॉर्मोन ग्रंथियाँ स्रावित करती हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">हृदय की धड़कन</span><span style=\"font-family:'Mangal'\"> का नियमन पश्चमस्तिष्क का मेडुला करता है, तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलन</span><span style=\"font-family:'Mangal'\"> अनुमस्तिष्क सँभालता है, अतः इनमें से कोई अग्रमस्तिष्क का कार्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अग्रमस्तिष्क का विशिष्ट कार्य यह है कि वह संवेदी आवेग ग्रहण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी विद्यार्थी की निम्नलिखित आदतों में से कौन-सी पर्यावरण के अनुकूल है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाज़ार जाते समय कपड़े का थैला ले जाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाली कमरे में पंखा चलता छोड़ देना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 m दूर की दुकान तक जाने के लिए स्कूटर का प्रयोग करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रयोग किए हुए प्लास्टिक के बोतल तालाब में फेंक देना</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई आदत पर्यावरण के अनुकूल तब होती है जब उससे हमारे द्वारा उत्पन्न अपशिष्ट या खर्च किए जाने वाले संसाधन कम हों।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बाज़ार जाते समय कपड़े का थैला ले जाने</span><span style=\"font-family:'Mangal'\"> का अर्थ है कि हर बार नया प्लास्टिक थैला लेकर फेंका नहीं जाएगा, इसलिए जैव अनिम्नीकरणीय अपशिष्ट की मात्रा घट जाती है → यह पर्यावरण के अनुकूल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खाली कमरे में पंखा चलता छोड़ने</span><span style=\"font-family:'Mangal'\"> से विद्युत व्यर्थ जाती है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">200 m की दूरी के लिए स्कूटर का प्रयोग</span><span style=\"font-family:'Mangal'\"> ईंधन जलाकर वायु की प्रदूषक गैसें बढ़ाता है, जबकि इतनी दूरी पैदल भी तय की जा सकती थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्लास्टिक के बोतल तालाब में फेंकना</span><span style=\"font-family:'Mangal'\"> इन चारों में सबसे हानिकारक है, क्योंकि प्लास्टिक जैव अनिम्नीकरणीय है और वर्षों तक जल में पड़ा रहकर वहाँ रहने वाले जीवों को हानि पहुँचाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पर्यावरण के अनुकूल आदत बाज़ार जाते समय कपड़े का थैला ले जाना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव नेत्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नेत्र लेंस रेटिना पर वस्तु का सीधा तथा आभासी प्रतिबिंब बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रेटिना में उत्पन्न संकेत दृक् तंत्रिकाओं द्वारा मस्तिष्क तक भेजे जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आयु बढ़ने के साथ नेत्र की समंजन क्षमता प्रायः घट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नेत्र लेंस रेटिना पर वस्तु का </span><span style=\"font-weight:bold;font-family:'Mangal'\">उल्टा तथा वास्तविक</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब बनाता है, सीधा तथा आभासी नहीं; वस्तु को सीधा दिखाने का काम तो मस्तिष्क करता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रेटिना एक कोमल झिल्ली है जिसमें प्रकाश के प्रति संवेदनशील कोशिकाएँ बहुत बड़ी संख्या में होती हैं; प्रकाश पड़ते ही ये कोशिकाएँ विद्युत संकेत उत्पन्न करती हैं, और ये संकेत </span><span style=\"font-weight:bold;font-family:'Mangal'\">दृक् तंत्रिकाओं द्वारा मस्तिष्क तक</span><span style=\"font-family:'Mangal'\"> पहुँचाए जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आयु बढ़ने के साथ नेत्र की </span><span style=\"font-weight:bold;font-family:'Mangal'\">समंजन क्षमता</span><span style=\"font-family:'Mangal'\"> प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">घट जाती</span><span style=\"font-family:'Mangal'\"> है, इसीलिए वृद्ध व्यक्ति पास की वस्तुओं पर सुविधा से फोकस नहीं कर पाते → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C-60 कार्बन का ऐसा अपररूप है जिसकी आकृति वास्तुकार बकमिंस्टर फुलर द्वारा बनाए गए गुंबद जैसी है। यह अपररूप कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रेफ़ाइट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हीरा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बकमिंस्टरफुलरीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोक</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन एक से अधिक रूपों में मिलता है, और एक ही तत्व के ऐसे प्रत्येक रूप को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपररूप</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हीरे तथा ग्रेफ़ाइट के अतिरिक्त कार्बन के अपररूपों का एक और वर्ग है, जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">फुलरीन</span><span style=\"font-family:'Mangal'\"> कहते हैं, और उनमें सबसे प्रसिद्ध साठ कार्बन परमाणुओं से बना अणु C-60 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C-60 को </span><span style=\"font-weight:bold;font-family:'Mangal'\">बकमिंस्टरफुलरीन</span><span style=\"font-family:'Mangal'\"> नाम इसलिए दिया गया क्योंकि उसकी आकृति अमेरिकी वास्तुकार बकमिंस्टर फुलर द्वारा बनाए गए गुंबद जैसी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हीरा</span><span style=\"font-family:'Mangal'\"> कार्बन परमाणुओं का कठोर त्रिविमीय जाल है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रेफ़ाइट</span><span style=\"font-family:'Mangal'\"> मुलायम परतदार रूप है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोक</span><span style=\"font-family:'Mangal'\"> अपररूप है ही नहीं; वह तो कोयले से प्राप्त कार्बन का अशुद्ध रूप है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अपररूप बकमिंस्टरफुलरीन कहलाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिक्तिकाओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. परिपक्व पादप कोशिका में प्रायः एक बड़ी केंद्रीय रिक्तिका होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पादप कोशिका की रिक्तिका वायु से भरी रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बहुत सारा जल संचित करके रिक्तिका पादप कोशिका को तना हुआ बनाए रखने में सहायक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. परिपक्व पादप कोशिका में प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक बड़ी केंद्रीय रिक्तिका</span><span style=\"font-family:'Mangal'\"> होती है, जिसके चारों ओर एक चयनात्मक पारगम्य झिल्ली रहती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रिक्तिका में वायु नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका रस</span><span style=\"font-family:'Mangal'\"> नामक जलीय द्रव भरा रहता है, और इसी रस में जल, खनिज, शर्करा तथा अपशिष्ट पदार्थ रहते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रिक्तिका में संचित बहुत सारा जल कोशिका के भीतर दाब बनाए रखता है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादप कोशिका तनी हुई</span><span style=\"font-family:'Mangal'\"> रहती है; जल की कमी होने पर रिक्तिका जल खो देती है और पौधा मुरझा जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से किस जीव में भोजन पकड़ने के लिए कूटपादों का प्रयोग होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैरामीशियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यूग्लीना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमीबा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमीबा</span><span style=\"font-family:'Mangal'\"> की कोई निश्चित आकृति नहीं होती, और वह अपनी कोशिका सतह से उँगली जैसे अस्थायी प्रवर्ध निकालता है, जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कूटपाद</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये कूटपाद भोजन के कण के ऊपर आकर जुड़ जाते हैं और उसे घेर लेते हैं, जिससे कोशिका के भीतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">खाद्य रिक्तिका</span><span style=\"font-family:'Mangal'\"> बन जाती है, जहाँ जटिल पदार्थ टूटकर सरल पदार्थ बनते हैं और कोशिकाद्रव्य में फैल जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-
