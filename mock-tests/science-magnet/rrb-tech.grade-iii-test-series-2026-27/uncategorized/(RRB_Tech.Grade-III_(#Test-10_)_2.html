ute work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/t</span><span style=\"font-family:'Mangal'\"> (A alone takes t/3 minutes)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Together in 1 minute: 1/t + 3/t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They fill the tank in 36 minutes: 4/t = 1/36 → t = 4 × 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: A alone takes 48 minutes; 1/48 + 1/144 = (3 + 1) / 144 = 4/144 = 1/36 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: efficiency A : B = 3 : 1 → B does 1/4 of the combined work, so B alone takes 4 × 36 = 144 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the slower pipe alone will fill the tank in </span><span style=\"font-weight:bold;font-family:'Mangal'\">144 minutes (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kaushal travelled for 7 hours 31 minutes at the speed of 120 km/h. At what speed (in km/h) should he travel to cover the same distance in 22 hours?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">39</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Convert the time to hours: 7 hours 31 minutes = 7 + 31/60 hours = </span><span style=\"font-weight:bold;font-family:'Mangal'\">451/60 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance = speed × time = (120 × 451) / 60 = 2 × 451 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">902 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The same distance is now to be covered in 22 hours.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required speed = distance / time = 902 / 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">41 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: for the same distance, speed × time is constant: (120 × 451) / 60 = S × 22 → S = 902 / 22 = 41</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required speed is </span><span style=\"font-weight:bold;font-family:'Mangal'\">41 (Option B)</span><span style=\"font-family:'Mangal'\"> km/h.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A train passes completely through two tunnels of lengths 1,560 m and 960 m in 60 seconds and 40 seconds, respectively. What is the length of the train?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the length of the train be L m and its speed be v m/s.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To pass a tunnel completely, the train covers (tunnel length + its own length).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First tunnel: L + 1,560 = 60v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second tunnel: L + 960 = 40v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Subtract: (L + 1,560) − (L + 960) = 60v − 40v → 600 = 20v → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the second equation: L = 40 × 30 − 960 = 1,200 − 960 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: L + 1,560 = 1,800 = 60 × 30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: speed = (difference in tunnel lengths) / (difference in times) = 600 / 20 = 30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the length of the train is </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 m (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the LCM of 0.6, 1.5 and 0.36.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write all the numbers with the same number of decimal places (two): 0.60, 1.50, 0.36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ignore the decimal point and find the LCM (लघुत्तम समापवर्त्य) of 60, 150 and 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 = 2² × 3 × 5; 150 = 2 × 3 × 5²; 36 = 2² × 3²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2² × 3² × 5² = 4 × 9 × 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Put the decimal point back (two places): 900 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">9.00 = 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 9 / 0.6 = 15, 9 / 1.5 = 6, 9 / 0.36 = 25; all whole numbers ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: LCM of decimals = LCM of the numbers without the point, then restore the same number of decimal places</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the LCM is </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mr. Madan got 9 out of 10 marks in English, 15 out of 16 in life sciences and the ratio of the percentage of his marks in English and Mathematics is 15 : 16. If the total marks of Mathematics are 20, then find the difference of the percentage of his marks in Mathematics and life sciences.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.35%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5.25%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Percentage in English = 9/10 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Percentage in life sciences = 15/16 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">93.75%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">English % : Mathematics % = 15 : 16, so Mathematics % = (90 × 16) / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Marks in Mathematics = 96% of 20 = 19.2; the total marks of 20 do not change the percentage.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Difference = Mathematics % − life sciences % = 96% − 93.75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required difference is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.25% (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An auto-rickshaw charges a fixed fare plus a charge per kilometre. Aman pays ₹190 for a trip of 8 km and Bela pays ₹310 for a trip of 14 km. What are the fixed fare and the per-kilometre charge?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fixed fare = ₹40; per-km charge = ₹18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fixed fare = ₹50; per-km charge = ₹17.50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fixed fare = ₹30; per-km charge = ₹20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fixed fare = ₹20; per-km charge = ₹22.50</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the fixed fare be ₹f and the per-kilometre charge be ₹c.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aman's trip: f + 8c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bela's trip: f + 14c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Subtract the first equation from the second: (f + 14c) − (f + 8c) = 310 − 190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6c = 120 → c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Substitute in the first equation: f + 8 × 20 = 190 → f = 190 − 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 30 + 14 × 20 = 30 + 280 = 310 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: per-km charge = (difference in fares) / (difference in distances) = 120 / 6 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fixed fare = ₹30; per-km charge = ₹20 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The difference between the compound interest, compounded half-yearly, and the simple interest on a certain sum at 10% per annum for 1½ years is ₹61. What is the sum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹8,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹9,000</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half-yearly compounding: rate per half-year = 10% / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5%</span><span style=\"font-family:'Mangal'\">, number of half-years in 1½ years = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the sum be ₹P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount at CI = P × (1.05)³ = P × 1.05 × 1.05 × 1.05 = P × 1.157625 → CI = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.157625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × 10 × 1.5) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.15P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CI − SI = 0.157625P − 0.15P = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.007625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.007625P = 61 → P = 61 / 0.007625 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: CI = 8,000 × 0.157625 = 1,261; SI = 8,000 × 0.15 = 1,200; difference = 61 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: for 3 periods at r% per period, CI − SI = P(r/100)²(3 + r/100) = P × 0.0025 × 3.05 = 0.007625P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sum is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,000 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The value of 17³ − 12³ is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,125</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,285</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,185</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,085</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Use the identity a³ − b³ = (a − b)(a² + ab + b²) with a = 17 and b = 12.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a − b = 17 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a² = 17² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">289</span><span style=\"font-family:'Mangal'\">; ab = 17 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">204</span><span style=\"font-family:'Mangal'\">; b² = 12² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a² + ab + b² = 289 + 204 + 144 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">637</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17³ − 12³ = 5 × 637 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,185</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 17³ = 4,913 and 12³ = 1,728; 4,913 − 1,728 = 3,185 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: a³ − b³ = (a − b)(a² + ab + b²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,185 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The parallel sides of a trapezium are 26 cm and 10 cm, and each of its two non-parallel sides is 17 cm. Find the area (in cm²) of the trapezium.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">255</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Drop perpendiculars from the ends of the shorter parallel side to the longer one.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The two equal non-parallel sides cut off equal lengths on the longer side: (26 − 10) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 cm</span><span style=\"font-family:'Mangal'\"> each</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In each right triangle: hypotenuse = 17 cm (non-parallel side), base = 8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Height = √(17² − 8²) = √(289 − 64) = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area = ½ × (sum of parallel sides) × height = ½ × (26 + 10) × 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ½ × 36 × 15 = 18 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 8-15-17 is a Pythagorean triplet, so the height is 15 cm at once</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the trapezium is </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 (Option B)</span><span style=\"font-family:'Mangal'\"> cm².</span></p>", "question_heading": ""}, {"sr_no": 82, "question": "Tुध पोृिध ौुयथौ पुध nहंृधन यी ृयदौ ोnक giिनस in ीiॅध cिोौौधौ यी ो ौcुयिय.Iी 25% यी पुध ृयदौ ोnक 20% यी पुध giिनस यी Cिोौौ VII पोाध ूोनप in ो तहप्र, ुयथ ंोnद ौपहकधnपौ यी Cिोौौ VII कय NOT पोाध ूोनप in पुध तहप्र?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">88</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the table, Class VII has 64 boys and 45 girls.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Boys taking part = 25% of 64 = (64 × 25) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Girls taking part = 20% of 45 = (45 × 20) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Students taking part = 16 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total students of Class VII = 64 + 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">109</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Students not taking part = 109 − 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: not taking part = (64 − 16) + (45 − 9) = 48 + 36 = 84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of students not taking part is </span><span style=\"font-weight:bold;font-family:'Mangal'\">84 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The present ages of Riya and her father are in the ratio 3 : 8 and the product of their ages is 600. What will be the ratio of their ages after 5 years?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 : 5</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the present ages be 3x and 8x years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product of the ages: 3x × 8x = 24x² = 600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² = 600 / 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\"> → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Present ages: Riya = 3 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 years</span><span style=\"font-family:'Mangal'\">, father = 8 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 15 × 40 = 600 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 5 years: Riya = 20 years, father = 45 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ratio = 20 : 45 = (divide by 5) </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the ratio of their ages after 5 years will be </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 9 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The angle of elevation of a cloud from a point 60 m above a lake is 30°, and the angle of depression of its reflection is 60°. Find the height of the cloud.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the cloud be H m above the lake and let the observer P be 60 m above the lake.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The reflection of the cloud is H m below the lake surface.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the horizontal distance from P to the cloud's vertical line be d m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cloud is (H − 60) m above P: tan 30° = (H − 60)/d → d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3(H − 60)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reflection is (H + 60) m below P: tan 60° = (H + 60)/d → d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(H + 60)/√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Equate: √3(H − 60) = (H + 60)/√3 → 3(H − 60) = H + 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3H − 180 = H + 60 → 2H = 240 → H = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: d = √3 × 60 = 103.9 m; (120 + 60)/√3 = 180/√3 = 103.9 m ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: height of cloud = h(tan β + tan α)/(tan β − tan α) = 60(√3 + 1/√3)/(√3 − 1/√3) = (60 × 4) / 2 = 120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the height of the cloud is </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 m (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a division sum, the divisor is 2 times the quotient and 4 times the remainder. If the remainder is 22, what is the dividend?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3894</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3892</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3899</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3889</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remainder = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divisor = 4 × remainder = 4 × 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">88</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divisor = 2 × quotient, so quotient = 88 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dividend = divisor × quotient + remainder</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 88 × 44 + 22 = 3,872 + 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,894</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 3,894 / 88 = 44 remainder 22 (88 × 44 = 3,872) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: Dividend = Divisor × Quotient + Remainder</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the dividend is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3894 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a quadrilateral ABCD, ∠A = 64° and ∠B = 48°. The bisectors of ∠C and ∠D meet at the point X. What is the measure of ∠CXD?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56°</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Angle sum of a quadrilateral = 360°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠C + ∠D = 360° − (∠A + ∠B) = 360° − (64° + 48°) = 360° − 112° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">248°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X lies on the bisectors, so in ΔCXD: ∠XCD = ∠C/2 and ∠XDC = ∠D/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">∠XCD + ∠XDC = (∠C + ∠D)/2 = 248°/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">124°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Angle sum of ΔCXD: ∠CXD = 180° − 124° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">56°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: the angle between the bisectors of two angles of a quadrilateral = half the sum of the other two angles = (64° + 48°) / 2 = 56°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the measure of ∠CXD is </span><span style=\"font-weight:bold;font-family:'Mangal'\">56° (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 men can complete a piece of work in 15 days, while 10 women can complete the same work in 18 days. In how many days will 5 men and 5 women together complete the work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 days</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 men take 15 days, so 1 man's 1-day work = 1/(6 × 15) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 women take 18 days, so 1 woman's 1-day work = 1/(10 × 18) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/180</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 men in 1 day = 5/90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 women in 1 day = 5/180 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Together in 1 day = 1/18 + 1/36 = (2 + 1) / 36 = 3/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 5 men and 5 women finish the work in </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 1 man = 2 women (1/90 = 2/180), so 5 men + 5 women = 15 women → (10 × 18) / 15 = 12 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, they will complete the work in </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 days (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: 54 − (−12) × (−7 − 13 − 4) ÷ [3 × {5 + (−3) × (−1)}]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">78</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Solve the innermost brackets first.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Curly bracket: (−3) × (−1) = 3, so {5 + 3} = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Square bracket: [3 × 8] = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Round bracket: (−7 − 13 − 4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Expression = 54 − (−12) × (−24) ÷ (24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">× and) / from left to right: (−12) × (−24) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">288</span><span style=\"font-family:'Mangal'\">; 288 ÷ 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the simplified value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of ₹6,300 is divided among A, B, C and D such that A : B = 2 : 3, B : C = 4 : 5 and C : D = 6 : 7. How much more does D receive than A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,080</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,140</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,260</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Combine the ratios so that the common terms match.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A : B = 2 : 3 and B : C = 4 : 5 → make B = 12: A : B : C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 : 12 : 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C : D = 6 : 7 → make C = 90 (LCM of 15 and 6): A : B : C : D = (8 × 6) : (12 × 6) : (15 × 6) : (7 × 15) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 : 72 : 90 : 105</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 48 : 72 = 2 : 3 ✓, 72 : 90 = 4 : 5 ✓, 90 : 105 = 6 : 7 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total parts = 48 + 72 + 90 + 105 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">315</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One part = 6,300 / 315 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D − A = (105 − 48) × 20 = 57 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,140</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: A : B : C : D = (2 × 4 × 6) : (3 × 4 × 6) : (3 × 5 × 6) : (3 × 5 × 7) = 48 : 72 : 90 : 105</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, D receives </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,140 (Option C)</span><span style=\"font-family:'Mangal'\"> more than A.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A certain sum of money is invested at simple interest for 3 years at 3% per annum. The simple interest earned is equal to half of the compound interest earned on ₹6,000 invested for 2 years at 6% per annum, compounded annually. Find the sum invested at simple interest.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,650</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,890</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,120</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First find the compound interest on ₹6,000 at 6% per annum for 2 years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount = 6,000 × (1 + 6/100)² = 6,000 × 1.06 × 1.06 = 6,000 × 1.1236 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,741.60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CI = 6,741.60 − 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹741.60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half of the CI = 741.60 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹370.80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the sum at simple interest be ₹P: SI = (P × 3 × 3) / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9P/100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9P/100 = 370.80 → P = (370.80 × 100) / 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: (4,120 × 9) / 100 = 370.80 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: CI for 2 years = P[(1 + R/100)² − 1]; SI = PRT/100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sum invested at simple interest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,120 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The National Commission for Scheduled Tribes (NCST) was created by bifurcating the erstwhile National Commission for Scheduled Castes and Scheduled Tribes. Under which Article of the Constitution of India does the NCST function?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 338</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 338A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 338B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 340</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">89th Constitutional Amendment Act, 2003</span><span style=\"font-family:'Mangal'\"> bifurcated the combined National Commission for Scheduled Castes and Scheduled Tribes and inserted </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 338A</span><span style=\"font-family:'Mangal'\">, under which the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Commission for Scheduled Tribes (NCST)</span><span style=\"font-family:'Mangal'\"> was set up in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2004</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The NCST has a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chairperson, a Vice-Chairperson and three other Members</span><span style=\"font-family:'Mangal'\"> appointed by the President; it investigates and monitors safeguards for the Scheduled Tribes and reports to the President.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 338</span><span style=\"font-family:'Mangal'\"> provides for the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Commission for Scheduled Castes (NCSC)</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 338B</span><span style=\"font-family:'Mangal'\">, inserted by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">102nd Amendment Act, 2018</span><span style=\"font-family:'Mangal'\">, gives constitutional status to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Commission for Backward Classes</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 340</span><span style=\"font-family:'Mangal'\"> empowers the President to appoint a commission to investigate the conditions of backward classes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Article is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 338A (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who was sworn in as the 23rd Lieutenant Governor of Delhi on 11 March 2026, succeeding Vinai Kumar Saxena, who was appointed Lieutenant Governor of Ladakh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ajay Kumar Bhalla</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Anil Baijal</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kavinder Gupta</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taranjit Singh Sandhu</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Taranjit Singh Sandhu</span><span style=\"font-family:'Mangal'\"> was sworn in as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">23rd Lieutenant Governor of Delhi</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 March 2026</span><span style=\"font-family:'Mangal'\"> at Lok Niwas; the oath was administered by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chief Justice of the Delhi High Court</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">1988-batch IFS officer</span><span style=\"font-family:'Mangal'\"> who served as India's </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ambassador to the United States</span><span style=\"font-family:'Mangal'\"> from February 2020 to January 2024 and contested the 2024 Lok Sabha election from Amritsar.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He succeeded </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vinai Kumar Saxena</span><span style=\"font-family:'Mangal'\"> (Delhi LG since May 2022), who was sworn in as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">4th Lieutenant Governor of Ladakh</span><span style=\"font-family:'Mangal'\"> on 13 March 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Anil Baijal</span><span style=\"font-family:'Mangal'\"> was Lieutenant Governor of Delhi from 2016 to 2022; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kavinder Gupta</span><span style=\"font-family:'Mangal'\"> was appointed Lieutenant Governor of Ladakh in July 2025; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ajay Kumar Bhalla</span><span style=\"font-family:'Mangal'\"> is the Governor of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Manipur</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Lieutenant Governor is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Taranjit Singh Sandhu (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On Hindi Diwas, 14 September 2026, Union Home Minister Amit Shah inaugurated the 6th Akhil Bharatiya Rajbhasha Sammelan (All India Official Language Conference) in which city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gandhinagar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pune</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bhopal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Navi Mumbai</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hindi Diwas, 14 September 2026</span><span style=\"font-family:'Mangal'\">, Union Home Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amit Shah</span><span style=\"font-family:'Mangal'\"> inaugurated the </span><span style=\"font-weight:bold;font-family:'Mangal'\">6th Akhil Bharatiya Rajbhasha Sammelan</span><span style=\"font-family:'Mangal'\"> at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">CIDCO Exhibition Centre, Navi Mumbai</span><span style=\"font-family:'Mangal'\"> (Maharashtra).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In his address he referred to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Education Policy's</span><span style=\"font-family:'Mangal'\"> provision for mother-tongue instruction in primary education and to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Prevention of Insults to National Honour (Amendment) Bill, 2026</span><span style=\"font-family:'Mangal'\">, which extends protection to </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Vande Mataram\"</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">5th</span><span style=\"font-family:'Mangal'\"> Rajbhasha Sammelan (Hindi Diwas 2025) was held in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gujarat</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hindi Diwas marks </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 September 1949</span><span style=\"font-family:'Mangal'\">, when the Constituent Assembly adopted </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hindi in Devanagari script</span><span style=\"font-family:'Mangal'\"> as the official language of the Union under </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 343</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the city is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Navi Mumbai (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The term 'Ragam-Tanam-Pallavi' is associated with which style of Indian music?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hindustani Music</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sufi Music</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Folk Music</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Carnatic Music</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ragam-Tanam-Pallavi (RTP)</span><span style=\"font-family:'Mangal'\"> is a major concert form of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carnatic music</span><span style=\"font-family:'Mangal'\">, the classical music of South India.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ragam</span><span style=\"font-family:'Mangal'\"> is the free improvisation of the raga without rhythm (alapana), </span><span style=\"font-weight:bold;font-family:'Mangal'\">tanam</span><span style=\"font-family:'Mangal'\"> is rhythmic improvisation, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">pallavi</span><span style=\"font-family:'Mangal'\"> is a composed line of text set to a tala on which the musician improvises further.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The main forms of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hindustani music</span><span style=\"font-family:'Mangal'\"> (North India) are </span><span style=\"font-weight:bold;font-family:'Mangal'\">dhrupad, khayal, thumri and tarana</span><span style=\"font-family:'Mangal'\">; the devotional song form of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sufi music</span><span style=\"font-family:'Mangal'\"> is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">qawwali</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the style is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carnatic Music (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At the World Para Athletics Championships 2025, held at the Jawaharlal Nehru Stadium, New Delhi, and concluded on 5 October 2025, India finished 10th with its best-ever haul of how many medals?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">12th World Para Athletics Championships</span><span style=\"font-family:'Mangal'\"> were held at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jawaharlal Nehru Stadium, New Delhi</span><span style=\"font-family:'Mangal'\"> (the first time India hosted the event) and concluded on </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 October 2025</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India finished </span><span style=\"font-weight:bold;font-family:'Mangal'\">10th</span><span style=\"font-family:'Mangal'\"> with a record </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 medals</span><span style=\"font-family:'Mangal'\"> (</span><span style=\"font-weight:bold;font-family:'Mangal'\">6 gold, 9 silver, 7 bronze</span><span style=\"font-family:'Mangal'\">), surpassing its previous best of </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\"> medals at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kobe 2024</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Brazil</span><span style=\"font-family:'Mangal'\"> topped the medal table with 15 gold, 20 silver and 9 bronze.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India's gold medallists were </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sumit Antil</span><span style=\"font-family:'Mangal'\"> (men's javelin F64, his third world title), </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nishad Kumar</span><span style=\"font-family:'Mangal'\"> (men's high jump T47), </span><span style=\"font-weight:bold;font-family:'Mangal'\">Rinku Hooda</span><span style=\"font-family:'Mangal'\"> (men's javelin F46), </span><span style=\"font-weight:bold;font-family:'Mangal'\">Shailesh Kumar</span><span style=\"font-family:'Mangal'\"> (men's high jump T63), </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sandip Sanjay Sargar</span><span style=\"font-family:'Mangal'\"> (men's javelin F44) and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Simran Sharma</span><span style=\"font-family:'Mangal'\"> (women's 100 m T12).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of medals is </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The rate at which the Reserve Bank of India lends short-term funds to commercial banks against the collateral of government securities under the Liquidity Adjustment Facility is called the ____________.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reverse repo rate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bank rate</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Repo rate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cash reserve ratio</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">repo rate</span><span style=\"font-family:'Mangal'\"> is the rate at which the RBI lends short-term funds to banks against </span><span style=\"font-weight:bold;font-family:'Mangal'\">government securities</span><span style=\"font-family:'Mangal'\"> under the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Liquidity Adjustment Facility (LAF)</span><span style=\"font-family:'Mangal'\">; it is the policy rate fixed by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Monetary Policy Committee</span><span style=\"font-family:'Mangal'\"> (kept at </span><span style=\"font-weight:bold;font-family:'Mangal'\">5.25%</span><span style=\"font-family:'Mangal'\"> in August 2026).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">reverse repo rate</span><span style=\"font-family:'Mangal'\"> is the rate at which the RBI </span><span style=\"font-weight:bold;font-family:'Mangal'\">absorbs</span><span style=\"font-family:'Mangal'\"> surplus funds from banks against government securities, i.e., the rate the RBI pays to banks.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">bank rate</span><span style=\"font-family:'Mangal'\"> is the rate at which the RBI rediscounts bills of exchange and other commercial papers; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">cash reserve ratio (CRR)</span><span style=\"font-family:'Mangal'\"> is the share of net demand and time liabilities that banks must keep as cash balances with the RBI.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the rate is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Repo rate (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 52nd G7 Summit, to which India was invited as a partner country, was held from 15 to 17 June 2026 at Évian-les-Bains. The summit was hosted by which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">France</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Canada</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Italy</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Japan</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">52nd G7 Summit</span><span style=\"font-family:'Mangal'\"> was held from </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 to 17 June 2026</span><span style=\"font-family:'Mangal'\"> at the Hôtel Royal, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Évian-les-Bains</span><span style=\"font-family:'Mangal'\"> (Haute-Savoie), </span><span style=\"font-weight:bold;font-family:'Mangal'\">France</span><span style=\"font-family:'Mangal'\">, hosted by President </span><span style=\"font-weight:bold;font-family:'Mangal'\">Emmanuel Macron</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">India, Kenya, South Korea, Brazil and Egypt</span><span style=\"font-family:'Mangal'\"> were invited as partner countries; PM </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> attended, as did Ukrainian President Zelensky.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Outcomes included a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Critical Minerals Resilience and Production Alliance</span><span style=\"font-family:'Mangal'\"> (dependence on any single supplier below 60% by 2030), over </span><span style=\"font-weight:bold;font-family:'Mangal'\">US$1 billion</span><span style=\"font-family:'Mangal'\"> for the Bundibugyo </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ebola</span><span style=\"font-family:'Mangal'\"> response and cancer being made a G7 priority for the first time.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">51st</span><span style=\"font-family:'Mangal'\"> summit was held at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kananaskis, Canada</span><span style=\"font-family:'Mangal'\"> (June 2025), the 50th at Borgo Egnazia, Apulia, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Italy</span><span style=\"font-family:'Mangal'\"> (2024) and the 49th at Hiroshima, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Japan</span><span style=\"font-family:'Mangal'\"> (2023); the G7 comprises Canada, France, Germany, Italy, Japan, the UK and the USA, with the EU also participating.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the host country is </span><span style=\"font-weight:bold;font-family:'Mangal'\">France (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following rivers originates from the Amarkantak Plateau?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Narmada</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Godavari</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mahanadi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Krishna</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narmada</span><span style=\"font-family:'Mangal'\"> rises at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amarkantak Plateau</span><span style=\"font-family:'Mangal'\"> in the Maikal hills of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Madhya Pradesh</span><span style=\"font-family:'Mangal'\"> and flows </span><span style=\"font-weight:bold;font-family:'Mangal'\">westward</span><span style=\"font-family:'Mangal'\"> through a rift valley between the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vindhya</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Satpura</span><span style=\"font-family:'Mangal'\"> ranges to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gulf of Khambhat</span><span style=\"font-family:'Mangal'\"> (Arabian Sea).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its length is about </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,312 km</span><span style=\"font-family:'Mangal'\">; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Marble Rocks</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dhuandhar Falls</span><span style=\"font-family:'Mangal'\"> near Jabalpur and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sardar Sarovar</span><span style=\"font-family:'Mangal'\"> dam (Gujarat) lie on it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Godavari</span><span style=\"font-family:'Mangal'\"> rises at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Trimbakeshwar</span><span style=\"font-family:'Mangal'\"> near Nashik (Maharashtra), the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mahanadi</span><span style=\"font-family:'Mangal'\"> near </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sihawa</span><span style=\"font-family:'Mangal'\"> in Dhamtari district (Chhattisgarh) and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Krishna</span><span style=\"font-family:'Mangal'\"> near </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mahabaleshwar</span><span style=\"font-family:'Mangal'\"> (Maharashtra); all three flow east into the Bay of Bengal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the river is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narmada (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India's first hydrogen-powered train, \"NaMo Green Rail\", was flagged off by Prime Minister Narendra Modi on 17 July 2026. It runs between Jind and Sonipat in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Punjab</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Haryana</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rajasthan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Uttar Pradesh</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">\"NaMo Green Rail\"</span><span style=\"font-family:'Mangal'\">, India's first </span><span style=\"font-weight:bold;font-family:'Mangal'\">hydrogen-powered train</span><span style=\"font-family:'Mangal'\">, was flagged off by PM </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jind</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 July 2026</span><span style=\"font-family:'Mangal'\"> in the presence of Railway Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ashwini Vaishnaw</span><span style=\"font-fam
