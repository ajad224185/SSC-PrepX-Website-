iprocal of its focal length in metres: P = 1/f, so f = 1/P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For distant vision: f = 1 / (−4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−0.25 m = −25 cm</span><span style=\"font-family:'Mangal'\">; the negative focal length means a </span><span style=\"font-weight:bold;font-family:'Mangal'\">concave (diverging) lens</span><span style=\"font-family:'Mangal'\">, which brings the image of a distant object back onto the retina in a myopic eye.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For near vision: f = 1 / (+2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.50 m = +50 cm</span><span style=\"font-family:'Mangal'\">; the positive focal length means a </span><span style=\"font-weight:bold;font-family:'Mangal'\">convex (converging) lens</span><span style=\"font-family:'Mangal'\">, which provides the additional focusing power needed for near vision.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Such a person needs a bifocal lens: the upper part concave for distant vision and the lower part convex for near vision.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the focal lengths are −25 cm (concave) and +50 cm (convex) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During a heat wave, most of the bacteria of a species living in a pond die, but a few individuals that can withstand heat survive and multiply. Which of the following principles does this illustrate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All variations in a species have an equal chance of surviving in the environment</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Not all variations have an equal chance of surviving; the selection of variants by environmental factors forms the basis of evolutionary processes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Heat resistance is acquired by the bacteria during the heat wave and is then passed on to their progeny</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Asexual reproduction produces no variation, so the surviving bacteria are identical to those that died</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reproduction generates individuals that are similar but subtly different; </span><span style=\"font-weight:bold;font-family:'Mangal'\">not all variations in a species have equal chances of surviving</span><span style=\"font-family:'Mangal'\"> in the environment they find themselves in.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Depending on the nature of the variation, different individuals have different kinds of advantages: </span><span style=\"font-weight:bold;font-family:'Mangal'\">bacteria that can withstand heat survive better in a heat wave</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">selection of variants by environmental factors forms the basis for evolutionary processes</span><span style=\"font-family:'Mangal'\">. The heat-resistant variants were already present in the population and were selected by the changed conditions, not created by them.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Even asexual reproduction generates some diversity (though sexual reproduction generates much more), so D is wrong; A contradicts the observation, and C describes an acquired trait, which is not how the variation arose.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, this is selection of variants by environmental factors, the basis of evolution </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the hearts of vertebrates:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Fishes have a two-chambered heart.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Amphibians have a three-chambered heart.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. All vertebrates, including fishes, show double circulation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fishes have a two-chambered heart</span><span style=\"font-family:'Mangal'\">; blood is pumped to the gills, oxygenated there and sent directly to the body → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amphibians</span><span style=\"font-family:'Mangal'\"> (and many reptiles) have a </span><span style=\"font-weight:bold;font-family:'Mangal'\">three-chambered heart</span><span style=\"font-family:'Mangal'\"> and tolerate some mixing of oxygenated and de-oxygenated blood → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In fishes blood passes through the heart </span><span style=\"font-weight:bold;font-family:'Mangal'\">only once</span><span style=\"font-family:'Mangal'\"> in each cycle (</span><span style=\"font-weight:bold;font-family:'Mangal'\">single circulation</span><span style=\"font-family:'Mangal'\">); </span><span style=\"font-weight:bold;font-family:'Mangal'\">double circulation</span><span style=\"font-family:'Mangal'\"> is found in the other vertebrates, and birds and mammals have </span><span style=\"font-weight:bold;font-family:'Mangal'\">four chambers</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A newly studied organism T is acellular, contains genetic material, and remains completely inactive outside a host cell. In the five kingdom system of classification, T should be placed in:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">None of the five kingdoms, because T lacks cellular organisation, which is the fundamental basis of the five kingdom system</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kingdom Monera, because it is microscopic and prokaryotic</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kingdom Protista, because it is a single unit with genetic material</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kingdom Fungi, because it depends on a host for nutrition</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Organism T (</span><span style=\"font-weight:bold;font-family:'Mangal'\">acellular, containing genetic material and inactive outside a host cell</span><span style=\"font-family:'Mangal'\">) has the characteristics of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">virus</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The five kingdom classification (Monera, Protista, Fungi, Plantae, Animalia) is based on criteria such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">cell type</span><span style=\"font-family:'Mangal'\"> (prokaryote or eukaryote), cell structure, level of organisation and mode of nutrition, all of which assume that the organism is made of cells.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since </span><span style=\"font-weight:bold;font-family:'Mangal'\">viruses lack cellular organisation</span><span style=\"font-family:'Mangal'\">, they do </span><span style=\"font-weight:bold;font-family:'Mangal'\">not fit into any of the five kingdoms</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Monera, Protista and Fungi all consist of cellular organisms (prokaryotic bacteria, unicellular eukaryotes with a true nucleus, and heterotrophs with a cell wall respectively), so options B, C and D are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, T is not placed in any of the five kingdoms </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध cोनृयn cदcिध:1. Aृयहप 71% यी पुध पयपोि gियृोि cोनृयn iौ ीयहnक in पुध यcधोnौ, थुiिध पुध ोपंयौूुधनध ुियकौ यnिद ोृयहप 1% यी iप.2. In पुध ौियथ cोनृयn cदcिध, ृहनiधक कधोक ूिोnपौ ोnक ोniंोिस ोनध cयnॅधनपधक inपय ीयौौiि ीहिधस यॅधन ंiििiयnौ यी दधोनौ, ृहप थुधn पुधौध ीहिधस ोनध ृहनnप पुध cोनृयn iौ नधपहनnधक ोौ CO₂ यn ो ॅधनद ौुयनप पiंध ौcोिध.3. Ocधोn थोपधन ोृौयनृौ ोपंयौूुधनic CO₂ पय ीयनं cोनृयnोपध ोnक ृicोनृयnोपध iयnौ, थुicु ूुदपयूिोnापयn cोnnयप हौध ीयन ूुयपयौदnपुधौiौ.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Of the total quantity of global carbon, </span><span style=\"font-weight:bold;font-family:'Mangal'\">71% is found in the oceans</span><span style=\"font-family:'Mangal'\">, and this oceanic reservoir regulates the amount of CO₂ in the atmosphere, which holds only a very small fraction, about </span><span style=\"font-weight:bold;font-family:'Mangal'\">1%</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In the </span><span style=\"font-weight:bold;font-family:'Mangal'\">slow carbon cycle</span><span style=\"font-family:'Mangal'\"> (millions of years), dead plants and animals get buried and are </span><span style=\"font-weight:bold;font-family:'Mangal'\">converted to fossil fuels</span><span style=\"font-family:'Mangal'\"> such as coal, oil and gas; when fossil fuels are burnt, </span><span style=\"font-weight:bold;font-family:'Mangal'\">carbon is released back as CO₂ on a very short time scale</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Ocean water does absorb CO₂ to form </span><span style=\"font-weight:bold;font-family:'Mangal'\">carbonate and bicarbonate ions</span><span style=\"font-family:'Mangal'\">, but </span><span style=\"font-weight:bold;font-family:'Mangal'\">phytoplankton use these ions for photosynthesis</span><span style=\"font-family:'Mangal'\">, and some marine organisms use them to form shells → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A coin is placed at the bottom of a shallow bowl and a student moves back until the coin just disappears from view behind the rim. Without the student moving, a friend slowly pours water into the bowl, and the coin becomes visible again. The reason is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The water surface reflects light from the coin towards the student's eyes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The water in the bowl acts as a convex lens and magnifies the coin</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light from the coin bends towards the normal on passing from water into air, so the coin appears lower than its actual position</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light from the coin bends away from the normal on passing from water (denser medium) into air (rarer medium), so the coin appears raised above its actual position and comes into view</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is a case of </span><span style=\"font-weight:bold;font-family:'Mangal'\">refraction of light</span><span style=\"font-family:'Mangal'\">: light does not travel in the same direction in all media, and when it passes obliquely from one medium to another its direction changes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light from the coin travels from </span><span style=\"font-weight:bold;font-family:'Mangal'\">water (optically denser)</span><span style=\"font-family:'Mangal'\"> into </span><span style=\"font-weight:bold;font-family:'Mangal'\">air (optically rarer)</span><span style=\"font-family:'Mangal'\">; a ray going from a denser to a rarer medium </span><span style=\"font-weight:bold;font-family:'Mangal'\">speeds up and bends away from the normal</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because of this bending, the rays reaching the eye appear to come from a point </span><span style=\"font-weight:bold;font-family:'Mangal'\">higher than the coin</span><span style=\"font-family:'Mangal'\">, so the coin </span><span style=\"font-weight:bold;font-family:'Mangal'\">appears raised above its actual position</span><span style=\"font-family:'Mangal'\">; this is the same reason the bottom of a tank or pond appears raised.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The apparent raising brings the coin above the line of the rim, so it comes back into view; reflection at the surface or a lens action is not involved, and bending towards the normal would happen only for light going from air into water.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the coin is seen because refraction makes it appear raised </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements based on how animals ensure the survival of their young:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Fish have external fertilisation, produce hundreds to thousands of eggs at a time, and the survival of their young is low.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In internal fertilisation the chances of survival of the young are generally higher, because the fertilised egg or embryo is more protected.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In reptiles and birds, the developing embryo inside the egg is nourished directly by the mother's body rather than by the yolk.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fish</span><span style=\"font-family:'Mangal'\"> live in water, have </span><span style=\"font-weight:bold;font-family:'Mangal'\">external fertilisation</span><span style=\"font-family:'Mangal'\">, produce </span><span style=\"font-weight:bold;font-family:'Mangal'\">100s–1000s of eggs at a time</span><span style=\"font-family:'Mangal'\">, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">survival of the young is low</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In </span><span style=\"font-weight:bold;font-family:'Mangal'\">internal fertilisation</span><span style=\"font-family:'Mangal'\"> (reptiles, birds and mammals) the fertilised egg or embryo is </span><span style=\"font-weight:bold;font-family:'Mangal'\">more protected</span><span style=\"font-family:'Mangal'\">, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">chances of survival of the young are generally higher</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In </span><span style=\"font-weight:bold;font-family:'Mangal'\">reptiles and birds, each egg contains enough yolk to nourish the developing embryo</span><span style=\"font-family:'Mangal'\"> until it hatches; it is in mammals that the zygote grows and develops inside the mother's body → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A motorbike moving at 24 m/s on a straight road is braked with a constant acceleration and comes to rest after travelling 72 m. The acceleration of the motorbike and the time taken by it to stop are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−4 m/s² and 8 s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−3 m/s² and 8 s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−4 m/s² and 6 s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−8 m/s² and 3 s</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the direction of motion as positive: u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 m/s</span><span style=\"font-family:'Mangal'\">, v = 0, s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">72 m</span><span style=\"font-family:'Mangal'\">; the kinematic equations can be used because the acceleration is constant.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v² = u² + 2as → 0 = 24² + 2 × a × 72 → 144a = −576 → a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4 m/s²</span><span style=\"font-family:'Mangal'\">; the negative sign shows that the acceleration is opposite to the direction of motion.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = u + at → 0 = 24 + (−4)t → t = 24 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: s = ut + ½at² = (24 × 6) − (½ × 4 × 36) = 144 − 72 = 72 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the acceleration is −4 m/s² and the stopping time is 6 s </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Electrons are a fundamental component of the atoms of every element.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Cathode rays are streams of negatively charged particles whose mass is much smaller than that of atoms.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The nature of cathode rays was found to be </span><span style=\"font-weight:bold;font-family:'Mangal'\">independent of the material of the cathode and of the gas</span><span style=\"font-family:'Mangal'\"> filled in the cathode ray tube; this showed that the particles emitted come from every kind of atom, i.e. </span><span style=\"font-weight:bold;font-family:'Mangal'\">electrons are a fundamental component of all atoms</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By studying cathode rays in electric and magnetic fields, J. J. Thomson concluded that they are </span><span style=\"font-weight:bold;font-family:'Mangal'\">streams of negatively charged particles</span><span style=\"font-family:'Mangal'\"> with a </span><span style=\"font-weight:bold;font-family:'Mangal'\">mass much smaller than that of atoms</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">However, the small mass and negative charge of these particles do not by themselves prove that they are present in every element; that conclusion came from the observation that the rays are the same whatever the cathode material or gas.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So R is a true statement about cathode rays, but it is not the explanation of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A student warms ethanol in a water bath and adds a 5% solution of alkaline potassium permanganate drop by drop. The purple colour disappears at first, but after a certain number of drops have been added the colour persists. Which of the following explains this?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ethanol is reduced to ethane, and the reducing power of the potassium permanganate is used up</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Potassium permanganate acts as a dehydrating agent and converts ethanol into ethene, which decolourises it</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Alkaline potassium permanganate is an oxidising agent that oxidises ethanol to ethanoic acid and is itself used up; once all the ethanol has been oxidised, the added permanganate is no longer consumed and its purple colour persists</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ethanol and potassium permanganate combine to form a sweet-smelling ester</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Substances that are capable of </span><span style=\"font-weight:bold;font-family:'Mangal'\">adding oxygen to others</span><span style=\"font-family:'Mangal'\"> are known as </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxidising agents</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Alkaline potassium permanganate</span><span style=\"font-family:'Mangal'\"> (and acidified potassium dichromate) </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxidises alcohols to carboxylic acids</span><span style=\"font-family:'Mangal'\"> by adding oxygen: ethanol is converted into ethanoic acid.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">While ethanol is being oxidised, the permanganate is </span><span style=\"font-weight:bold;font-family:'Mangal'\">used up</span><span style=\"font-family:'Mangal'\"> in the reaction, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">purple colour disappears</span><span style=\"font-family:'Mangal'\"> as each drop is added.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Once all the ethanol has been oxidised, further drops of permanganate are not consumed, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">purple colour persists</span><span style=\"font-family:'Mangal'\">. Ethanol is not reduced to ethane, permanganate is not a dehydrating agent (that is concentrated sulphuric acid), and an ester needs an acid and an alcohol.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the permanganate is an oxidising agent that is consumed until all the ethanol is oxidised </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Gymnosperms such as pines need water for fertilisation in the same way as bryophytes do.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Gymnosperms have needle-like leaves that reduce water loss, and they are well adapted to cold and dry regions.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In </span><span style=\"font-weight:bold;font-family:'Mangal'\">bryophytes</span><span style=\"font-family:'Mangal'\">, water is required for reproduction because the male reproductive cells must swim to reach the female cells; but in </span><span style=\"font-weight:bold;font-family:'Mangal'\">gymnosperms water is not essential for fertilisation</span><span style=\"font-family:'Mangal'\">, and they form seeds (though the seeds are not covered in fruits) → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pines and cycads</span><span style=\"font-family:'Mangal'\">, examples of gymnosperms, are </span><span style=\"font-weight:bold;font-family:'Mangal'\">well adapted to cold and dry regions</span><span style=\"font-family:'Mangal'\">; their </span><span style=\"font-weight:bold;font-family:'Mangal'\">needle-like or scale-like leaves reduce water loss</span><span style=\"font-family:'Mangal'\"> and help them withstand harsh conditions → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gymnosperms ('gymnos' = naked, 'spermos' = seed) produce seeds that protect the developing embryo and contain stored food.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On a summer night, the temperature recorded in the centre of a large city is found to be a few degrees higher than that in the villages around it. The best explanation is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cities lie at a lower altitude than villages, and temperature increases as altitude decreases</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vehicles in the city release oxygen, which traps heat near the ground</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Buildings of steel, concrete and brick and roads of concrete and asphalt absorb solar radiation during the day and re-radiate the heat at night, whereas the villages have more vegetation that stays cool through shade and transpiration; this is the urban heat island effect</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The city receives more insolation because the Sun's rays fall vertically on it</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">urban heat island effect</span><span style=\"font-family:'Mangal'\"> describes how </span><span style=\"font-weight:bold;font-family:'Mangal'\">cities are warmer than the surrounding rural areas</span><span style=\"font-family:'Mangal'\">, especially during summer and at night.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cities have more built-up area: </span><span style=\"font-weight:bold;font-family:'Mangal'\">buildings of steel, concrete and brick, and roads of concrete and asphalt</span><span style=\"font-family:'Mangal'\">, which </span><span style=\"font-weight:bold;font-family:'Mangal'\">absorb solar radiation and retain heat</span><span style=\"font-family:'Mangal'\">; all objects radiate heat, and this </span><span style=\"font-weight:bold;font-family:'Mangal'\">re-radiated heat from urban materials warms the city</span><span style=\"font-family:'Mangal'\"> more than the surroundings (this is also why a concrete house feels hot at night in summer).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Rural areas and forests have more vegetation and stay cool through shade and plant transpiration</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Altitude, oxygen from vehicles and the angle of the Sun's rays do not differ between a city and the villages a few kilometres away, so A, B and D are wrong; the effect shows how human land use can alter the local climate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the city is warmer because of the urban heat island effect </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A jeweller tells a customer that the ornaments in his shop are made of 22 carat gold and not of 24 carat gold. Which of the following statements is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 carat gold is purer than 24 carat gold, which is why it is preferred for ornaments</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 carat gold is pure gold, which is very soft; in 22 carat gold, 22 parts of pure gold are alloyed with 2 parts of copper or silver to make it hard enough for ornaments</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 carat gold contains mercury, and such an alloy of gold and mercury is called an amalgam</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Alloying pure gold with copper increases its electrical conductivity and melting point</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pure gold, known as 24 carat gold, is very soft</span><span style=\"font-family:'Mangal'\"> and is therefore not suitable for making jewellery.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To make it hard, pure gold is </span><span style=\"font-weight:bold;font-family:'Mangal'\">alloyed with either silver or copper</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In India, </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 carat gold</span><span style=\"font-family:'Mangal'\"> is generally used for ornaments: </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 parts of pure gold are alloyed with 2 parts of either copper or silver</span><span style=\"font-family:'Mangal'\">; so 22 carat gold is less pure than 24 carat, not purer.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An alloy containing mercury is called an amalgam, but 22 carat gold contains copper or silver, not mercury; and the electrical conductivity and melting point of an alloy are less than those of the pure metals, so A, C and D are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 24 carat gold is pure but soft, and 22 carat gold is hardened by alloying with copper or silver </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A flute, an ektara and a tabla play the same musical note at the same loudness, yet a listener with closed eyes can easily tell which instrument is being played. The property of sound that makes this possible is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pitch, because each instrument produces the note at a different frequency</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Timbre (quality), because each instrument combines the fundamental frequency with a different set of overtones</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Intensity, because each instrument transfers a different amount of energy per unit area</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time period, because the vibrations of each instrument last for a different time</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A musical note is a combination of a lowest frequency called the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fundamental</span><span style=\"font-family:'Mangal'\"> and higher frequencies called </span><span style=\"font-weight:bold;font-family:'Mangal'\">overtones</span><span style=\"font-family:'Mangal'\">; together they create a rich and pleasant sound.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Even when different instruments like a </span><span style=\"font-weight:bold;font-family:'Mangal'\">flute, ektara or tabla play the same note at the same loudness, each sounds unique</span><span style=\"font-family:'Mangal'\">; this quality of sound is called </span><span style=\"font-weight:bold;font-family:'Mangal'\">timbre</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since the note is the same, the pitch (fundamental frequency) is the same; since the loudness is the same, the amplitude and intensity are the same, so A, C and D cannot be the distinguishing property.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Indian string instruments like the sarangi, sitar and veena use extra strings to enrich this combination of fundamental and overtones.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the instruments are distinguished by their timbre </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following is a characteristic feature of meristematic cells?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dead cells with empty spaces</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Thin walls with lignin deposits</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dense cytoplasm and lack of vacuoles</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Thick walls and large vacuoles</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meristematic cells are </span><span style=\"font-weight:bold;font-family:'Mangal'\">living cells</span><span style=\"font-family:'Mangal'\"> that keep </span><span style=\"font-weight:bold;font-family:'Mangal'\">dividing actively</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They are small, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">thin cellulose walls</span><span style=\"font-family:'Mangal'\"> (no lignin), a </span><span style=\"font-weight:bold;font-family:'Mangal'\">large, prominent nucleus</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">dense cytoplasm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Vacuoles are generally absent</span><span style=\"font-family:'Mangal'\">, and the cells are </span><span style=\"font-weight:bold;font-family:'Mangal'\">tightly packed</span><span style=\"font-family:'Mangal'\"> with little or no intercellular space; these features allow rapid cell division.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dead cells with thick, lignified walls describe </span><span style=\"font-weight:bold;font-family:'Mangal'\">sclerenchyma</span><span style=\"font-family:'Mangal'\">, not meristem.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, meristematic cells have dense cytoplasm and lack vacuoles </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A student holds a boiling tube containing about 2 g of lead nitrate powder with a pair of tongs and heats it over a flame. Which of the following correctly gives the observation and the type of reaction?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brown fumes of nitrogen dioxide are given off, leaving a residue of lead oxide, and oxygen is also released; it is a thermal decomposition reaction</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A colourless gas, hydrogen, is evolved with a pop sound; it is a displacement reaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">White fumes of nitrogen are given off and lead metal is left behind; it is a combination reaction</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brown fumes of bromine are given off; it is a double displacement reaction</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On heating, </span><span style=\"font-weight:bold;font-family:'Mangal'\">lead nitrate decomposes</span><span style=\"font-family:'Mangal'\">: 2Pb(NO₃)₂(s) → 2PbO(s) + 4NO₂(g) + O₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">brown fumes</span><span style=\"font-family:'Mangal'\"> observed are of </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrogen dioxide (NO₂)</span><span style=\"font-family:'Mangal'\">, a solid residue of </span><span style=\"font-weight:bold;font-family:'Mangal'\">lead oxide</span><span style=\"font-family:'Mangal'\"> remains in the tube, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen</span><span style=\"font-family:'Mangal'\"> is also released.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A single reactant breaks down into simpler products, so it is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">decomposition reaction</span><span style=\"font-family:'Mangal'\">; since it is carried out by heating, it is called </span><span style=\"font-weight:bold;font-family:'Mangal'\">thermal decomposition</span><span style=\"font-family:'Mangal'\"> (like the decomposition of calcium carbonate or ferrous sulphate on heating).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No hydrogen, nitrogen or bromine is involved, and nothing combines or exchanges ions, so B, C and D are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, brown NO₂ fumes are seen and the reaction is a thermal decomposition </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Suppose all the organisms of one trophic level (say, the herbivores) in a grassland ecosystem are removed. Which of the following statements is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only the herbivore level is affected, while the producers and the carnivores continue unchanged</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The carnivores will start feeding on the producers, so the ecosystem is not damaged</span></p>", "option3": "Tुध ूनयकहcधनौ ंोद gनयथ हncुधcाधक थुiिध पुध cयnौहंधनौ यी पुध ुigुधन िधॅिधस ौपोनॅधे पुध iंूोcप कiीीधनौ ीयन कiीीधनधnप पनयूुic िधॅिधस, ृहप nय पनयूुic िधॅिध cोn ृध नधंयॅधक थiपुयहप कोंोging पुध धcयौदौपधं", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Removing the top carnivores would have no effect on the ecosystem, because no organism feeds on them</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">various components of an ecosystem are interdependent</span><span style=\"font-family:'Mangal'\">: producers make the energy of sunlight available to the rest of the ecosystem, and each consumer level depends on the level below it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If the herbivores are killed, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">producers (grass) are no longer eaten and may grow unchecked</span><span style=\"font-family:'Mangal'\">, while the </span><span style=\"font-weight:bold;font-family:'Mangal'\">carnivores that feed on the herbivores are left without food and starve</span><span style=\"font-family:'Mangal'\">; carnivores cannot switch to eating grass.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">impact of removing a trophic level differs for different levels</span><span style=\"font-family:'Mangal'\">: removing producers would stop the flow of energy altogether, while removing the top carnivores would let the herbivores or lower carnivores multiply beyond control, so D is also wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because of this interdependence, </span><span style=\"font-weight:bold;font-family:'Mangal'\">the organisms of no trophic level can be removed without damaging the ecosystem</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the removal disturbs the whole ecosystem and no level can be removed without damage </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A uniform wire of resistance 32 Ω is cut into four equal parts, and the four parts are then connected in parallel. The equivalent resistance of the combination is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 Ω</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">128 Ω</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.5 Ω</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The resistance of a wire is directly proportional to its length (R ∝ l), so each of the four equal parts has resistance 32 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For four equal resistors in parallel: 1/Rₚ = 1/8 + 1/8 + 1/8 + 1/8 = 4/8, so Rₚ = 8 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In general, cutting a wire of resistance R into n equal parts and joining them in parallel gives R/n², i.e. R/R' = n² = 16 here; the equivalent resistance of a parallel combination is always less than the smallest individual resistance.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Connecting the four parts in series would simply give back 32 Ω.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the equivalent resistance is 2 Ω </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about vegetative propagation:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. When pieces of a potato are placed on wet cotton, only the pieces bearing a notch or bud ('eye') give rise to fresh green shoots and roots.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Pieces of a money-plant stem cut from between two leaves, without any node, grow fresh leaves when dipped in water.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Buds produced in the notches along the leaf margin of Bryophyllum fall on the soil and develop into new plants.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. When a potato is cut into pieces, some with a notch or bud (eye) and some without, and the pieces are kept on wet cotton, </span><span style=\"font-weight:bold;font-family:'Mangal'\">only the pieces with a bud give rise to fresh green shoots and roots</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. When money-plant stem pieces are dipped in water, pieces containing </span><span style=\"font-weight:bold;font-family:'Mangal'\">at least one leaf (node) grow fresh leaves</span><span style=\"font-family:'Mangal'\">, while pieces cut from the portion </span><span style=\"font-weight:bold;font-family:'Mangal'\">between two leaves do not</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Buds produced in the notches along the leaf margin of Bryophyllum</span><span style=\"font-family:'Mangal'\"> fall on the soil and </span><span style=\"font-weight:bold;font-family:'Mangal'\">develop into new plants</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In all these cases parts like the root, stem and leaves develop into new plants: this is vegetative propagation, which is used in layering or grafting to grow sugarcane, roses or grapes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In an ionic compound the total positive charge of the cations must equal the total negative charge of the anions. Which of the following combinations of ions gives an electrically neutral compound?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 Mg</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> and 2 Cl⁻</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Fe</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> and 2 O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> and 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 Ca</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> and 3 NO₃⁻</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A compound is neutral only when the </span><span style=\"font-weight:bold;font-family:'Mangal'\">positive and negative charges balance</span><span style=\"font-family:'Mangal'\">; this is the basis of writing formulae by criss-crossing the charges on the ions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option A: 3 × (2+) = 6+ but 2 × (1−) = 2− → not balanced. Option B: 2 × (3+) = 6+ but 2 × (2−) = 4− → not balanced. Option D: 1 × (2+) = 2+ but 3 × (1−) = 3− → not balanced.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option C: 2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> give 2 × (3+) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6+</span><span style=\"font-family:'Mangal'\"> and 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> give 3 × (2−) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6−</span><span style=\"font-family:'Mangal'\">; the charges cancel exactly.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The compound is aluminium sulphate, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al₂(SO₄)₃</span><span style=\"font-family:'Mangal'\">. Brackets are used because more than one polyatomic sulphate ion is present, and the charges on the ions are not shown in the formula.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 2 Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> and 3 SO₄</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> give a neutral compound </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about energy:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The gravitational attraction on the surface of the Moon is about one-sixth of that on the Earth, so a ball thrown up with the same speed rises about six times higher on the Moon than on the Earth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Work done against friction is stored in the object as potential energy, just like work done against gravity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. A real pendulum slows down and eventually stops because it loses energy due to friction at the support and air resistance.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. For a ball thrown up with a given speed, the kinetic energy ½mv² is converted into potential energy mgh, so the height reached h = v²/2g is </span><span style=\"font-weight:bold;font-family:'Mangal'\">inversely proportional to g</span><span style=\"font-family:'Mangal'\">; with g on the Moon about </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6th</span><span style=\"font-family:'Mangal'\"> of that on the Earth, the ball rises about </span><span style=\"font-weight:bold;font-family:'Mangal'\">six times higher</span><span style=\"font-family:'Mangal'\"> (a throw that reaches 8 m on the Earth reaches about 48 m on the Moon) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Work done against internal forces such as gravitational, electric or magnetic forces can be stored as potential energy, but </span><span style=\"font-weight:bold;font-family:'Mangal'\">work done against friction does not lead to a storage of energy</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In real life a </span><span style=\"font-weight:bold;font-family:'Mangal'\">pendulum slows down and eventually stops</span><span style=\"font-family:'Mangal'\"> because of </span><span style=\"font-weight:bold;font-family:'Mangal'\">energy loss due to friction at the support and air resistance</span><span style=\"font-family:'Mangal'\">; only in the absence of such losses does its mechanical energy remain constant → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An aluminium rod AB is suspended horizontally between the poles of a horse-shoe magnet, with the magnetic field vertical, and a current is passed through it; the rod is displaced sideways. Which of the following changes would NOT increase the displacement of the rod?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increasing the current through the rod</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Turning the arrangement so that the current in the rod flows parallel to the magnetic field</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Using a stronger horse-shoe magnet</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increasing the length of the rod lying within the magnetic field</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The displacement of the rod shows that a </span><span style=\"font-weight:bold;font-family:'Mangal'\">force is exerted on a current-carrying conductor</span><span style=\"font-family:'Mangal'\"> placed in a magnetic field; the force reverses direction when the current is reversed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The displacement (magnitude of the force) increases when the </span><span style=\"font-weight:bold;font-family:'Mangal'\">current in the rod is increased</span><span style=\"font-family:'Mangal'\">, when a </span><span style=\"font-weight:bold;font-family:'Mangal'\">stronger magnet</span><span style=\"font-family:'Mangal'\"> is used, and when the </span><span style=\"font-weight:bold;font-family:'Mangal'\">length of the rod</span><span style=\"font-family:'Mangal'\"> in the field is increased, so A, C and D all increase the displacement.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">displacement is largest when the direction of the current is at right angles to the direction of the magnetic field</span><span style=\"font-family:'Mangal'\">; when the current is parallel to the field, the rod experiences no force and is not displaced at all.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So turning the rod so that the current flows along the field would reduce the displacement to zero rather than increase it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, making the current parallel to the field would not increase the displacement </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WK - UQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MT - KY</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FB - DG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RH - PM</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare each letter of the second cluster with the corresponding letter of the first cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MT − KY: M − 2 = K, T + 5 = Y → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FB − DG: F − 2 = D, B + 5 = G → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RH − PM: R − 2 = P, H + 5 = M → (−2, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WK − UQ: W − 2 = U, K + 6 = Q → (−2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+6</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three pairs follow (−2, +5); only WK − UQ does not (K + 5 would be P).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">WK - UQ (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HUL 19, MZQ 36, REV 53, WJA 70, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BNE 88</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOF 87</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CMD 80</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BMF 90</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look at the letters position by position, and the numbers separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First letters: H → M → R → W: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → W + 5 = 23 + 5 = 28 → 28 − 26 = 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second letters: U → Z → E → J: each +5 (Z + 5 = 26 + 5 = 31 → 31 − 26 = 5 = E) → J + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third letters: L → Q → V → A: each +5 (V + 5 = 22 + 5 = 27 → 1 = A) → A + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Numbers: 19 → 36 → 53 → 70: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+17</span><span style=\"font-family:'Mangal'\"> → 70 + 17 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">87</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the missing cluster is BOF 87; BNE 88, CMD 80 and BMF 90 break either the letter step or the number step.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">BOF 87 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is the son of Q. Q is the sister of R. R is the wife of S. S is the father of T. How is P related to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother's sister's son</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother's brother's son</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Father's sister's son</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brother</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R is the wife of S → R and S are husband and wife; S is the father of T, so R is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother</span><span style=\"font-family:'Mangal'\"> of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q is the sister of R → Q and R have the same parents → Q is T's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's sister</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is the son of Q → P is T's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's sister's son</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The other options are wrong: Q is R's sister, not her brother (Option B); Q is related to T through R (the mother), not through S (the father) (Option C); P and T have different parents, so they are not brothers (Option D).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, P is T's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's sister's son (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series based on the English alphabetical order, to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZKF TLA NMV HNQ ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BOK</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">COL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BNL</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look at each position of the clusters separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First letters: Z → T → N → H: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6</span><span style=\"font-family:'Mangal'\"> → H − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second letters: K → L → M → N: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\"> → N + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third lett
