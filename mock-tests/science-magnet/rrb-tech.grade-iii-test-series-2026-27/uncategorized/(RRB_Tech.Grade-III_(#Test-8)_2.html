12pt\"><span style=\"font-family:'Mangal'\">Let the capacity of the tank be C litres.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Petrol = 3C/8, so the remaining part = C − 3C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5C/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Diesel = 2/5 of 5C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/4</span><span style=\"font-family:'Mangal'\">, so the remaining part = 5C/8 − C/4 = 5C/8 − 2C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3C/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kerosene = 3/4 of 3C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9C/32</span><span style=\"font-family:'Mangal'\">, so the remaining part = 3C/8 − 9C/32 = 12C/32 − 9C/32 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3C/32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This remaining part is water: 3C/32 = 12 → C = (12 × 32) / 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">128 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: petrol 48 + diesel 32 + kerosene 36 + water 12 = 128 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: water = C × (5/8) × (3/5) × (1/4) = 3C/32 = 12 → C = 128</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the capacity of the tank is </span><span style=\"font-weight:bold;font-family:'Mangal'\">128 litres (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The equations x² − 7x + 12 = 0 and x² + px + q = 0 have exactly one common root, and the other root of the second equation is −5. Which of the following are possible values of p and q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = −1, q = −20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = 2, q = −15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = 1, q = 20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = −2, q = −15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Roots of x² − 7x + 12 = 0: (x − 3)(x − 4) = 0 → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 or 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The second equation has one of these as a root and −5 as the other root.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Case 1: roots 3 and −5 → equation = (x − 3)(x + 5) = x² + 2x − 15 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = 2, q = −15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Case 2: roots 4 and −5 → equation = (x − 4)(x + 5) = x² + x − 20 → p = 1, q = −20 (not among the options)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the options: x² − x − 20 = (x − 5)(x + 4) → roots 5, −4 ✗; x² + x + 20 has no real roots ✗; x² − 2x − 15 = (x − 5)(x + 3) → roots 5, −3 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only x² + 2x − 15 has roots 3 (common) and −5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: sum of roots = −p and product = q → p = −(3 + (−5)) = 2, q = 3 × (−5) = −15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the possible values are </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = 2, q = −15 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In measuring the sides of a rectangular field, one side is taken 8% in excess and the other side is taken 10% in deficit. What is the error percentage in the area calculated from these measurements?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8% decrease</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2% decrease</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8% increase</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.8% decrease</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the true sides be 100 units and 100 units, so the true area = 100 × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,000 sq units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Measured first side = 100 × 108% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">108</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Measured second side = 100 × 90% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calculated area = 108 × 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,720 sq units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Error = 9,720 − 10,000 = −280, i.e. the area is </span><span style=\"font-weight:bold;font-family:'Mangal'\">280 less</span><span style=\"font-family:'Mangal'\"> on 10,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Error percentage = 280 / 10,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8% decrease</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: net % change = a + b + ab/100 = 8 − 10 + (8 × (−10)) / 100 = −2 − 0.8 = −2.8%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area comes out </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8% decrease (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of the present ages of a father and his son is 62 years. Six years ago, the product of the numerical values of their ages was 504. What is the present age (in years) of the father?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the ages 6 years ago be f years (father) and s years (son).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum of present ages = 62, so the sum 6 years ago = 62 − 6 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50</span><span style=\"font-family:'Mangal'\"> → f + s = 50</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product 6 years ago: f × s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">504</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So f and s are the roots of t² − 50t + 504 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Factorise: 504 = 36 × 14 and 36 + 14 = 50 → (t − 36)(t − 14) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Father is older, so f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\"> and s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> (6 years ago)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Father's present age = 36 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: son's present age = 14 + 6 = 20; 42 + 20 = 62 ✓; 36 × 14 = 504 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the present age of the father is </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The median of the following frequency distribution is:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914629143_image002.png\" width=\"269\" height=\"51\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total frequency N = 6 + 9 + 12 + 15 + 10 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">61</span><span style=\"font-family:'Mangal'\"> (odd)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Median = the value of the ((N + 1) / 2)th observation = the </span><span style=\"font-weight:bold;font-family:'Mangal'\">31st</span><span style=\"font-family:'Mangal'\"> observation</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cumulative frequencies: x = 2 → 6; x = 4 → 15; x = 6 → 27; x = 8 → 42; x = 10 → 52; x = 12 → 61</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 28th to 42nd observations all have the value 8, so the 31st observation = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: median = the x whose cumulative frequency first reaches (N + 1) / 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the median is </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A boat takes 14 hours to travel downstream from point A to point B and then come back upstream to a point C midway between A and B. If the speed of the stream is 2 km/h and the speed of the boat in still water is 10 km/h, what is the distance between A and B?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Downstream speed = 10 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h</span><span style=\"font-family:'Mangal'\">; upstream speed = 10 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the distance AB be D km. The boat goes D km downstream and then D/2 km upstream.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time downstream = D/12; time upstream = (D/2) / 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D/16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total time: D/12 + D/16 = 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) of 12 and 16 is 48: (4D + 3D) / 48 = 14 → 7D = 14 × 48 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D = 672 / 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 96 / 12 = 8 h and 48 / 8 = 6 h, total 14 h ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the distance between A and B is </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 km (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A manufacturer fixes his selling price at 20% above the cost of production. If the cost of production goes up by 25% and the manufacturer raises his selling price by 50%, what is his new profit percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the original cost of production be ₹100.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Original selling price = ₹100 × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New cost of production = ₹100 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New selling price = ₹120 × 150% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹180</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New profit = 180 − 125 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹55</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New profit % = 55 / 125 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: new profit % = (1.2 × 1.5 / 1.25 − 1) × 100% = (1.44 − 1) × 100% = 44%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, his new profit percentage is </span><span style=\"font-weight:bold;font-family:'Mangal'\">44% (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The radius of a circle is 17 cm and the length of a chord of the circle is 16 cm. What is the distance (in cm) of the chord from the centre of the circle?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The perpendicular from the centre to a chord bisects the chord.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half of the chord = 16 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Radius (hypotenuse) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 cm</span><span style=\"font-family:'Mangal'\">; let the distance of the chord from the centre be d.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By Pythagoras: d² + 8² = 17²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d² = 289 − 64 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">225</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: d = √(r² − (chord/2)²) = √(17² − 8²) = 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the distance of the chord from the centre is </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the top of a vertical tower of height 90 m, the angle of depression of the foot of a building is 60° and the angle of depression of the top of the same building is 30°. Find the height of the building.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the horizontal distance between the tower and the building be d m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Angle of depression of the foot = angle of elevation of the tower top from the foot = 60°.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan 60° = 90 / d → √3 = 90/d → d = 90/√3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the top of the building, the tower top is seen at 30° (alternate angle of the depression).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the tower top be h m above the building top: tan 30° = h / d → 1/√3 = h / 30√3 → h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Height of the building = 90 − 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: building = tower × (1 − tan 30°/tan 60°) = 90 × (1 − 1/3) = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the height of the building is </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 m (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The simplified value of 6 × (15 × (2²)) ÷ 18 + 23 − 29 is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS: solve the brackets first (the power inside the inner bracket), then ÷ and × from left to right, then + and −.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inner bracket: 2² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">; outer bracket: 15 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Expression = (6 × 60) ÷ 18 + 23 − 29</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">360 ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 + 23 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">43</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43 − 29 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the simplified value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the remainder when 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">939</span><span style=\"font-family:'Mangal'\"> is divided by 8?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the pattern of remainders when powers of 3 are divided by 8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3¹ = 3 → remainder </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3² = 9 = 8 × 1 + 1 → remainder </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 3² leaves remainder 1, and every even power of 3 leaves remainder 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">939 = 2 × 469 + 1, so 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">939</span><span style=\"font-family:'Mangal'\"> = (3²)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">469</span><span style=\"font-family:'Mangal'\"> × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remainder = (1)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">469</span><span style=\"font-family:'Mangal'\"> × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 3² = 9 leaves remainder 1 when divided by 8. So an odd power of 3 leaves remainder </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, and an even power leaves remainder </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the remainder is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A solid cylinder of base radius 7 cm and height 12 cm has a conical cavity of the same base radius and 8 cm height. Find the volume of the remaining solid. [Use π = 22/7 and round off your answer to two decimal places.]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1417.33 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1437.33 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1452.33 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1402.33 cm³</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of the cylinder = πr²h = 22/7 × 7 × 7 × 12 = 22 × 7 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,848 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of the conical cavity = (π × r² × h) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [(22/7) × 7 × 7 × 8] / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22 × 7 × 8) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,232 / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">410.67 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of the remaining solid = 1,848 − 410.67 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,437.33 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: remaining volume = πr²(H − h/3) = 154 × (12 − 8/3) = (154 × 28) / 3 = 4,312/3 = 1,437.33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the volume of the remaining solid is </span><span style=\"font-weight:bold;font-family:'Mangal'\">1437.33 cm³ (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The compound interest on a sum of ₹10000 for 2 years is ₹2544, when the interest is compounded annually. If the rate of interest per annum is halved and the time duration is doubled, then the compound interest (in ₹, correct to nearest paise) will be:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2724.67</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2642.77</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2742.67</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2624.77</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount after 2 years = 10,000 + 2,544 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,544</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = P(1 + R/100)² → (1 + R/100)² = 12,544 / 10,000 = 1.2544</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.2544 = (1.12)², so 1 + R/100 = 1.12 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 12%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Halved rate = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6%</span><span style=\"font-family:'Mangal'\">; doubled time = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New amount = 10,000 × (1.06)⁴</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1.06)² = 1.1236 and (1.1236)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.26247696</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New amount = 10,000 × 1.26247696 = ₹12,624.7696 ≈ </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,624.77</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New compound interest = 12,624.77 − 10,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,624.77</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the compound interest will be </span><span style=\"font-weight:bold;font-family:'Mangal'\">2624.77 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The three edges of a cuboid are in arithmetic progression and its volume is 315 cm³. If the smallest edge measures 5 cm, find the total surface area of the cuboid.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">252 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">315 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">286 cm²</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the edges be 5, 5 + d and 5 + 2d (in cm), where d is the common difference.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume = 5 × (5 + d) × (5 + 2d) = 315 → (5 + d)(5 + 2d) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">63</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 + 10d + 5d + 2d² = 63 → 2d² + 15d − 38 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Factorise: (2d + 19)(d − 2) = 0 → d = 2 (d must be positive)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Edges = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 cm, 7 cm, 9 cm</span><span style=\"font-family:'Mangal'\">; check: 5 × 7 × 9 = 315 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total surface area = 2(lb + bh + hl) = 2(5 × 7 + 7 × 9 + 9 × 5) = 2(35 + 63 + 45)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 143 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">286 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: TSA of a cuboid = 2(lb + bh + hl)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total surface area is </span><span style=\"font-weight:bold;font-family:'Mangal'\">286 cm² (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With an average speed of 60 kmph, a bus reaches its destination on time. If it goes at an average speed of 55 kmph, then it is late by 10 minutes. The total distance of the journey is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">110 km</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the distance be D km. Time difference = 10 minutes = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6 hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time at 55 km/h − time at 60 km/h = 1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D/55 − D/60 = 1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D × (60 − 55) / (55 × 60) = 1/6 → 5D / 3,300 = 1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D = 3,300 / (6 × 5) = 3,300 / 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">110 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 110 / 55 = 2 h and 110 / 60 = 1 h 50 min, difference = 10 min ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: D = (S₁ × S₂ × time difference) / (S₁ − S₂) = 60 × 55 × (1/6) / 5 = 110</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total distance of the journey is </span><span style=\"font-weight:bold;font-family:'Mangal'\">110 km (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following pairs of numbers is co-prime?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51 and 85</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57 and 95</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64 and 81</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">91 and 143</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two numbers are co-prime when their HCF (महत्तम समापवर्तक) is 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51 = 3 × 17 and 85 = 5 × 17 → HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\">, not co-prime</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57 = 3 × 19 and 95 = 5 × 19 → HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19</span><span style=\"font-family:'Mangal'\">, not co-prime</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">91 = 7 × 13 and 143 = 11 × 13 → HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">, not co-prime</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64 = 2⁶ and 81 = 3⁴ → no common prime factor → HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">, co-prime</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the co-prime pair is </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 and 81 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B and C together finish a work in 2 days. If A alone can finish the same work in 4 days and B in 8 days, find how long (in days) will C take to finish twice the same work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 day work of A, B and C together = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A's 1 day work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4</span><span style=\"font-family:'Mangal'\">; B's 1 day work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C's 1 day work = 1/2 − 1/4 − 1/8 = (4 − 2 − 1) / 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So C alone finishes one work in </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Twice the work takes C = 2 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: in 2 days A + B + C do 2 × (1/4 + 1/8 + 1/8) = (2 × 1) / 2 = 1 work ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, C will take </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 (Option C)</span><span style=\"font-family:'Mangal'\"> days.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If x varies directly as y and inversely as z, and x = 16 when y = 40 and z = 3, then find x when y = 50 and z = 6</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x varies directly as y and inversely as z, so x = (k × y) / z for some constant k.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Put x = 16, y = 40, z = 3: 16 = (k × 40) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = (16 × 3) / 40 = 48 / 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now put y = 50, z = 6: x = (1.2 × 50) / 6 = 60 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: x₂ = x₁ × (y₂/y₁) × (z₁/z₂) = 16 × (50/40) × (3/6) = 16 × 1.25 × 0.5 = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of x is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following initiatives was introduced in India during Union budget 2020-21 to support farmers by enabling efficient air transportation of agricultural produce across domestic and international routes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rural Export Enhancement Initiative</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">National Farm Logistics Mission</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Krishi Air Connect Programme</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Krishi Udan Scheme</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Krishi Udan Scheme</span><span style=\"font-family:'Mangal'\"> was announced in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Union Budget 2020-21</span><span style=\"font-family:'Mangal'\"> (1 February 2020) by Finance Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nirmala Sitharaman</span><span style=\"font-family:'Mangal'\"> to move agricultural produce (especially perishables from the North-East and tribal districts) by air on domestic and international routes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is implemented by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Civil Aviation</span><span style=\"font-family:'Mangal'\">; the improved </span><span style=\"font-weight:bold;font-family:'Mangal'\">Krishi UDAN 2.0</span><span style=\"font-family:'Mangal'\"> was launched in </span><span style=\"font-weight:bold;font-family:'Mangal'\">October 2021</span><span style=\"font-family:'Mangal'\">, covering 53 airports initially.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The other three names are not Government of India schemes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the initiative is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Krishi Udan Scheme (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": "Tुध Inपधनnोपiयnोि Bययाधन Pनप्रध 2026, ोnnयहncधक यn 19 Mोद 2026 in Lयnकयn, थोौ ोथोनकधक पय पुध nयॅिध \"Tोiथोn Tनोॅिधयgहध\", पुध ीiनौप ृयया पनोnौिोपधक ीनयं Mोnकोनin Cुinधौध पय थin पुध ूनप्रध. Wुय iौ iपौ ोहपुयन?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yáng Shuāng-zǐ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Banu Mushtaq</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jenny Erpenbeck</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Georgi Gospodinov</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">International Booker Prize 2026</span><span style=\"font-family:'Mangal'\"> went to </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Taiwan Travelogue\"</span><span style=\"font-family:'Mangal'\"> by the Taiwanese author </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yáng Shuāng-zǐ</span><span style=\"font-family:'Mangal'\">, translated from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mandarin Chinese</span><span style=\"font-family:'Mangal'\"> by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lin King</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was announced on </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 May 2026</span><span style=\"font-family:'Mangal'\"> at Tate Modern, </span><span style=\"font-weight:bold;font-family:'Mangal'\">London</span><span style=\"font-family:'Mangal'\">; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">£50,000</span><span style=\"font-family:'Mangal'\"> prize is shared equally between author and translator; the chair of judges was </span><span style=\"font-weight:bold;font-family:'Mangal'\">Natasha Brown</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">first</span><span style=\"font-family:'Mangal'\"> book translated from Mandarin Chinese to win the prize; the novel is set in Taiwan of the 1930s under Japanese rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Banu Mushtaq</span><span style=\"font-family:'Mangal'\"> (India) won the prize in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2025</span><span style=\"font-family:'Mangal'\"> for the Kannada story collection \"Heart Lamp\"; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jenny Erpenbeck</span><span style=\"font-family:'Mangal'\"> (Germany) won in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2024</span><span style=\"font-family:'Mangal'\"> for \"Kairos\"; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Georgi Gospodinov</span><span style=\"font-family:'Mangal'\"> (Bulgaria) won in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2023</span><span style=\"font-family:'Mangal'\"> for \"Time Shelter\".</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Geetanjali Shree</span><span style=\"font-family:'Mangal'\"> became the first Indian author to win the International Booker Prize, in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2022</span><span style=\"font-family:'Mangal'\">, for </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tomb of Sand</span><span style=\"font-family:'Mangal'\"> (originally written in Hindi as *Ret Samadhi*), translated by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Daisy Rockwell</span><span style=\"font-family:'Mangal'\">; it was the first book translated from an Indian language to win.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the author is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yáng Shuāng-zǐ (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jharia, the most important coking-coal field of India lying on the Chota Nagpur Plateau, is located in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jharkhand</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Odisha</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chhattisgarh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">West Bengal</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jharia coalfield</span><span style=\"font-family:'Mangal'\"> lies in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dhanbad district</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jharkhand</span><span style=\"font-family:'Mangal'\">, in the Damodar valley on the Chota Nagpur Plateau; it is India's main source of </span><span style=\"font-weight:bold;font-family:'Mangal'\">coking coal</span><span style=\"font-family:'Mangal'\">, used in the iron and steel industry.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Damodar valley coalfields, namely Jharia, Bokaro, Giridih (Jharkhand) and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Raniganj (West Bengal)</span><span style=\"font-family:'Mangal'\">, are the country's oldest and most important </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gondwana</span><span style=\"font-family:'Mangal'\"> coalfields.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Talcher</span><span style=\"font-family:'Mangal'\"> is the major coalfield of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Odisha</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Korba</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chhattisgarh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the state is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jharkhand (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which team won the ICC Women's T20 World Cup 2026, whose final was played at Lord's, London, on 5 July 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">England</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New Zealand</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Australia</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">ICC Women's T20 World Cup 2026</span><span style=\"font-family:'Mangal'\"> (10th edition) was hosted by </span><span style=\"font-weight:bold;font-family:'Mangal'\">England</span><span style=\"font-family:'Mangal'\">; the final was played at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lord's, London</span><span style=\"font-family:'Mangal'\">, on </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 July 2026</span><span style=\"font-family:'Mangal'\"> before a record crowd of over 28,000.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Australia</span><span style=\"font-family:'Mangal'\"> beat </span><span style=\"font-weight:bold;font-family:'Mangal'\">England</span><span style=\"font-family:'Mangal'\"> by </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 wickets</span><span style=\"font-family:'Mangal'\">: England </span><span style=\"font-weight:bold;font-family:'Mangal'\">150/4</span><span style=\"font-family:'Mangal'\">, Australia </span><span style=\"font-weight:bold;font-family:'Mangal'\">153/3 in 17.1 overs</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Beth Mooney</span><span style=\"font-family:'Mangal'\"> made </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 off 49 balls</span><span style=\"font-family:'Mangal'\">, her third half-century in a T20 World Cup final.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was Australia's record-extending </span><span style=\"font-weight:bold;font-family:'Mangal'\">7th</span><span style=\"font-family:'Mangal'\"> Women's T20 World Cup title and the highest successful run chase in a Women's T20 World Cup final.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">New Zealand</span><span style=\"font-family:'Mangal'\"> were the champions of the previous edition (</span><span style=\"font-weight:bold;font-family:'Mangal'\">2024</span><span style=\"font-family:'Mangal'\">, UAE); India did not reach the 2026 final.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winner is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Australia (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ustad Bismillah Khan, the shehnai maestro who performed at the Red Fort on the eve of India's independence in 1947, was conferred the Bharat Ratna in which year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1998</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2001</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2005</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2008</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ustad Bismillah Khan</span><span style=\"font-family:'Mangal'\"> (1916–2006), the legendary </span><span style=\"font-weight:bold;font-family:'Mangal'\">shehnai</span><span style=\"font-family:'Mangal'\"> player from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Varanasi</span><span style=\"font-family:'Mangal'\">, played at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Red Fort</span><span style=\"font-family:'Mangal'\"> on the eve of independence on 15 August 1947.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He received the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bharat Ratna in 2001</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lata Mangeshkar</span><span style=\"font-family:'Mangal'\"> was the other recipient that year.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Among musicians, </span><span style=\"font-weight:bold;font-family:'Mangal'\">M.S. Subbulakshmi</span><span style=\"font-family:'Mangal'\"> received the Bharat Ratna in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1998</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Bhimsen Joshi</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2008</span><span style=\"font-family:'Mangal'\"> (announced November 2008); </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Ravi Shankar</span><span style=\"font-family:'Mangal'\"> received it in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1999</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the year is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2001 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Pradhan Mantri Surya Sarovar Yojana (PM-SSY), approved by the Union Cabinet on 31 July 2026 with an outlay of ₹5,070 crore, aims to develop how much floating solar photovoltaic capacity with energy storage on reservoirs and other water bodies?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,000 MW</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5,000 MW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,000 MW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20,000 MW</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pradhan Mantri Surya Sarovar Yojana (PM-SSY)</span><span style=\"font-family:'Mangal'\"> was approved by the Union Cabinet on </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 July 2026</span><span style=\"font-family:'Mangal'\"> with a total outlay of </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,070 crore</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It targets </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,000 MW</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">floating solar photovoltaic</span><span style=\"font-family:'Mangal'\"> projects with co-located </span><span style=\"font-weight:bold;font-family:'Mangal'\">energy storage</span><span style=\"font-family:'Mangal'\"> (minimum </span><span style=\"font-weight:bold;font-family:'Mangal'\">two-hour</span><span style=\"font-family:'Mangal'\"> storage, </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,000 MWh</span><span style=\"font-family:'Mangal'\"> in all) on reservoirs and other inland water bodies, saving land.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Central financial assistance is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1 crore per MW</span><span style=\"font-family:'Mangal'\"> after commissioning, plus up to </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹50 lakh per project</span><span style=\"font-family:'Mangal'\"> for feasibility studies; projects are to be sanctioned from </span><span style=\"font-weight:bold;font-family:'Mangal'\">FY2026-27 to FY2030-31</span><span style=\"font-family:'Mangal'\">, with disbursement till FY2032-33.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The scheme is expected to create about </span><span style=\"font-weight:bold;font-family:'Mangal'\">16,000–17,000</span><span style=\"font-family:'Mangal'\"> full-time-equivalent jobs and cut about </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 million tonnes of CO₂</span><span style=\"font-family:'Mangal'\"> a year.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the target capacity is </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,000 MW (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the Economic Survey 2025-26, tabled in Parliament on 29 January 2026, India's real GDP growth for the financial year 2025-26 was estimated at:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.4%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.8%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Economic Survey 2025-26</span><span style=\"font-family:'Mangal'\"> was tabled in Parliament on </span><span style=\"font-weight:bold;font-family:'Mangal'\">29 January 2026</span><span style=\"font-family:'Mangal'\"> by Union Finance Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nirmala Sitharaman</span><span style=\"font-family:'Mangal'\">, three days before the Union Budget.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It estimated real GDP growth for </span><span style=\"font-weight:bold;font-family:'Mangal'\">2025-26 at 7.4%</span><span style=\"font-family:'Mangal'\">, \"driven by the double engine of consumption and investment\", up from </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.5% in 2024-25</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For </span><span style=\"font-weight:bold;font-family:'Mangal'\">2026-27</span><span style=\"font-family:'Mangal'\"> the Survey projected real GDP growth in the range </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.8% to 7.2%</span><span style=\"font-family:'Mangal'\">; headline CPI inflation was </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.7%</span><span style=\"font-family:'Mangal'\"> during April–December 2025-26.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">7.8%</span><span style=\"font-family:'Mangal'\"> is the real GDP growth recorded in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q1 (April–June) of 2026-27</span><span style=\"font-family:'Mangal'\"> as per the NSO estimate of 31 August 2026, not the Survey's figure.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the estimated growth for 2025-26 is </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.4% (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In which year did India completely eliminate Quantitative Restrictions (QRs) on imports as part of trade liberalization?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1996</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2005</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1998</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2001</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Quantitative Restrictions (QRs)</span><span style=\"font-family:'Mangal'\"> are limits on the physical quantity of goods that may be imported (quotas, licensing); WTO rules require members to replace them with tariffs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India removed its remaining QRs on imports in two steps (the first batch from </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 April 2000</span><span style=\"font-family:'Mangal'\"> and the last batch from </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 April 2001</span><span style=\"font-family:'Mangal'\">), so QRs on imports were </span><span style=\"font-weight:bold;font-family:'Mangal'\">completely eliminated in 2001</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India had maintained QRs on balance-of-payments grounds under </span><span style=\"font-weight:bold;font-family:'Mangal'\">GATT Article XVIII-B</span><span style=\"font-family:'Mangal'\">; after a WTO dispute raised by the USA, it agreed to phase them out.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the year is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2001 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who assumed charge as the third Chief of Defence Staff (CDS) of India on 31 May 2026, succeeding General Anil Chauhan?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Upendra Dwivedi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General Dhiraj Seth</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">General N.S. Raja Subramani</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Admiral Krishna Swaminathan</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">General N.S. Raja Subramani</span><span style=\"font-family:'Mangal'\"> assumed charge as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">3rd Chief of Defence Staff</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Secretary, Department of Military Affairs</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 May 2026</span><span style=\"font-family:'Mangal'\">; his appointment had been announced on </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 May 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He succeeded </span><span style=\"font-weight:bold;font-family:'Mangal'\">General Anil Chauhan</span><span style=\"font-family:'Mangal'\">, the 2nd CDS, whose term ended on </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 May 2026</span><span style=\"font-family:'Mangal'\">; the first CDS was </span><span style=\"font-weight:bold;font-family:'Mangal'\">General Bipin Rawat</span><span style=\"font-family:'Mangal'\"> (from 1 January 2020).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He was commissioned into the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Garhwal Rifles</span><span style=\"font-family:'Mangal'\"> in December 1985 and earlier served as </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vice Chief of the Army Staff</span><span style=\"font-family:'Mangal'\">, GOC-in-C </span><span style=\"font-weight:bold;font-family:'Mangal'\">Central Command</span><span style=\"font-family:'Mangal'\"> and Military Adviser in the National Security Council Secretariat.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">General Upendra Dwivedi</span><span style=\"font-family:'Mangal'\"> was Chief of the Army Staff till 30 June 2026 and </span><span style=\"font-weight:bold;font-family:'Mangal'\">General Dhiraj Seth</span><span style=\"font-family:'Mangal'\"> succeeded him as Army Chief; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Admiral Krishna Swaminathan</span><span style=\"font-family:'Mangal'\"> became Chief of the Naval Staff on 31 May 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the 3rd CDS is </span><span style=\"font-weight:bold;font-family:'Mangal'\">General N.S. Raja Subramani (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In February 2026 the Cabinet Committee on Economic Affairs approved India's first underwater road-cum-rail tunnel, a 33.7 km link between Gohpur and Numaligarh in Assam. The tunnel will pass under which river?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ganga</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brahmaputra</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hooghly</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Barak</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 February 2026</span><span style=\"font-family:'Mangal'\"> the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Cabinet Committee on Economic Affairs (CCEA)</span><span style=\"font-family:'Mangal'\">, chaired by PM Narendra Modi, approved India's first </span><span style=\"font-weight:bold;font-family:'Mangal'\">underwater road-cum-rail tunnel</span><span style=\"font-family:'Mangal'\"> under the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brahmaputra</span><span style=\"font-family:'Mangal'\"> river in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Assam</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The project is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">33.7 km</span><span style=\"font-family:'Mangal'\"> four-lane access-controlled greenfield link from </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gohpur (NH-15)</span><span style=\"font-family:'Mangal'\"> on the north bank to </span><span style=\"font-weight:bold;font-family:'Mangal'\">Numaligarh (NH-715)</span><span style=\"font-family:'Mangal'\"> on the south bank, including a </span><span style=\"font-weight:bold;font-family:'Mangal'\">15.79 km twin-tube</span><span style=\"font-family:'Mangal'\"> underwater tunnel with
