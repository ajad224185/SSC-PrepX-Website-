 style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Methanol is added to make it unfit for drinking, and the dye is added for identification</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Denatured alcohol is safe to drink in small quantities because ethanol neutralises the effect of methanol</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To prevent the misuse of industrial ethanol, it is made </span><span style=\"font-weight:bold;font-family:'Mangal'\">unfit for drinking by adding poisonous substances like methanol</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">dyes are added to colour it blue for identification</span><span style=\"font-family:'Mangal'\">; this is denatured alcohol.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Intake of even very small quantities of methanol can cause death</span><span style=\"font-family:'Mangal'\">: methanol is </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxidised to methanal in the liver</span><span style=\"font-family:'Mangal'\">, and methanal reacts rapidly with the components of cells, coagulating the protoplasm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Methanol also </span><span style=\"font-weight:bold;font-family:'Mangal'\">affects the optic nerve, causing blindness</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the dye does not make the alcohol poisonous, methanol is not added as a fuel, and denatured alcohol is never safe to drink.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, methanol makes the ethanol unfit for drinking and the dye identifies it </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about soaps and detergents:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. With hard water, soap reacts with the calcium and magnesium salts present in it and forms an insoluble substance called scum.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Detergents remain effective in hard water because their charged ends do not form insoluble precipitates with calcium and magnesium ions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. A soap solution appears cloudy because the soap micelles are too small to scatter light.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Hard water contains </span><span style=\"font-weight:bold;font-family:'Mangal'\">calcium and magnesium salts</span><span style=\"font-family:'Mangal'\">; soap reacts with them, so foam forms with difficulty and an insoluble substance called </span><span style=\"font-weight:bold;font-family:'Mangal'\">scum</span><span style=\"font-family:'Mangal'\"> remains, which is why more soap is needed in hard water → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Detergents</span><span style=\"font-family:'Mangal'\"> (generally sodium salts of sulphonic acids or ammonium salts with chloride or bromide ions) have charged ends that </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not form insoluble precipitates with calcium and magnesium ions</span><span style=\"font-family:'Mangal'\">, so they work in hard water → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Soap micelles are </span><span style=\"font-weight:bold;font-family:'Mangal'\">large enough to scatter light</span><span style=\"font-family:'Mangal'\">, which is why a soap solution appears cloudy; they stay in solution as a colloid because of ion-ion repulsion → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the percentage of having a male child if the sex chromosomes of the father are XY and those of the mother are XX?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mother (XX) can give only an </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> chromosome to every child.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The father (XY) gives either an </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> or a </span><span style=\"font-weight:bold;font-family:'Mangal'\">Y</span><span style=\"font-family:'Mangal'\"> chromosome, with equal chance.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X from the father → </span><span style=\"font-weight:bold;font-family:'Mangal'\">XX</span><span style=\"font-family:'Mangal'\"> → girl; Y from the father → </span><span style=\"font-weight:bold;font-family:'Mangal'\">XY</span><span style=\"font-family:'Mangal'\"> → boy. So the chance of a male child is </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 in 2 = 50%</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sex of the child depends on which chromosome it inherits from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">father</span><span style=\"font-family:'Mangal'\">; 25% and 75% come from wrongly applying Mendel's 3 : 1 ratio.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the percentage of having a male child is 50% </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about alloys:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. An alloy is a homogeneous mixture of two or more metals, or of a metal and a non-metal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Brass is an alloy of approximately 80% copper and 20% tin.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The components of an alloy cannot be separated by physical methods.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. A </span><span style=\"font-weight:bold;font-family:'Mangal'\">homogeneous mixture of two or more metals, or a metal and a non-metal</span><span style=\"font-family:'Mangal'\">, is called an alloy; it is made by mixing melted metals, which solidify into a material that appears to be a single metal → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brass</span><span style=\"font-family:'Mangal'\"> is an alloy of approximately </span><span style=\"font-weight:bold;font-family:'Mangal'\">80% copper and 20% zinc</span><span style=\"font-family:'Mangal'\">; it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">bronze</span><span style=\"font-family:'Mangal'\"> that is about 80% copper and 20% tin → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Physical methods cannot separate</span><span style=\"font-family:'Mangal'\"> the components of an alloy → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A blindfolded student can still point towards a friend who claps. This is mainly because:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sound travels faster towards the nearer ear</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">only one ear hears the sound</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the cochlea works in only one ear</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the sound reaches the two ears at slightly different times</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When sound enters the ear, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">eardrum vibrates</span><span style=\"font-family:'Mangal'\">, tiny bones amplify the vibration, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">cochlea converts the vibrations into electrical signals</span><span style=\"font-family:'Mangal'\"> that go to the brain; this happens in </span><span style=\"font-weight:bold;font-family:'Mangal'\">both</span><span style=\"font-family:'Mangal'\"> ears.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Having two ears allows the brain to find the </span><span style=\"font-weight:bold;font-family:'Mangal'\">direction</span><span style=\"font-family:'Mangal'\"> of a sound: it compares </span><span style=\"font-weight:bold;font-family:'Mangal'\">which ear hears the sound first</span><span style=\"font-family:'Mangal'\">, using the tiny time gap between the two ears, often less than a thousandth of a second.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sound travels at the same speed in all directions, and both ears and both cochleas work, so options A, B and C are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the direction is found because the sound reaches the two ears at slightly different times </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): While diluting concentrated sulphuric acid, the acid must be added slowly to water with constant stirring, and never water to the acid.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Dissolving an acid in water is a highly exothermic process, and the heat generated may cause the mixture to splash out and cause burns.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The process of </span><span style=\"font-weight:bold;font-family:'Mangal'\">dissolving an acid or a base in water is highly exothermic</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Concentrated nitric acid or sulphuric acid must therefore always be </span><span style=\"font-weight:bold;font-family:'Mangal'\">added slowly to water with constant stirring</span><span style=\"font-family:'Mangal'\">; if water is added to the concentrated acid instead, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">heat generated may cause the mixture to splash out and cause burns</span><span style=\"font-family:'Mangal'\">, and the glass container may even break due to excessive local heating → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Adding acid to a large amount of water lets the heat get absorbed by the water, so R is exactly why the rule in A is followed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A farmer plants two types of sugarcane stem cuttings in his field: type A, cut from the portion of the stem between two nodes, and type B, each containing a node. After two weeks only the type B cuttings sprout new shoots. The best explanation is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The type A cuttings dried up because they had no xylem to absorb water from the soil</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The type A cuttings lacked the apical meristem, which is present only at the tip of the whole plant</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The type B cuttings contain intercalary meristem, located at the base of the internode or just above the node, whose continuously dividing cells give rise to new shoots</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The type B cuttings sprouted because the node stores a large amount of food in the form of starch</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">intercalary meristem</span><span style=\"font-family:'Mangal'\"> is located at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">base of the internode or just above the node</span><span style=\"font-family:'Mangal'\">; the node is the point on the stem where branches or leaves arise.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is why, when a hedge is cut, more branches appear after some time from the nodes and the hedge becomes bushy.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sugarcane cuttings </span><span style=\"font-weight:bold;font-family:'Mangal'\">with nodes</span><span style=\"font-family:'Mangal'\"> sprout because they carry this </span><span style=\"font-weight:bold;font-family:'Mangal'\">meristematic tissue at the nodes</span><span style=\"font-family:'Mangal'\">; cuttings taken from between two nodes (type A) have no meristem and do not sprout.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The apical meristem is at the tips of roots and shoots, and it is not the absence of xylem or of stored starch that decides sprouting here.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the type B cuttings sprout because of the intercalary meristem at the nodes </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Heavier atoms such as uranium have many more neutrons than protons in their nuclei.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Every proton inside the nucleus repels every other proton, and neutrons strengthen the nuclear force that binds all the particles of the nucleus together.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lighter atoms often have an equal number of protons and neutrons (carbon has six each), but </span><span style=\"font-weight:bold;font-family:'Mangal'\">as atoms get heavier, their nuclei have many more neutrons than protons</span><span style=\"font-family:'Mangal'\">; uranium has 92 protons and 146 neutrons → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Every proton in the nucleus repels every other proton</span><span style=\"font-family:'Mangal'\"> because they all carry positive charge; </span><span style=\"font-weight:bold;font-family:'Mangal'\">neutrons strengthen the nuclear force</span><span style=\"font-family:'Mangal'\"> that binds all the particles of the nucleus together → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Heavier atoms therefore need many more neutrons to hold everything in the nucleus tightly bound; R is exactly the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A car starts from rest and its velocity increases uniformly to 15 m/s in 6 s. It then moves at a constant velocity of 15 m/s for 8 s, and finally the brakes are applied so that it comes to rest uniformly in 4 s. The total distance travelled by the car is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">195 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">165 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On a velocity-time graph, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">area enclosed between the graph line and the time axis</span><span style=\"font-family:'Mangal'\"> gives the displacement (here equal to the distance, as the car moves in one direction).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First part (velocity rising uniformly from 0 to 15 m/s in 6 s): area of triangle = ½ × 6 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second part (constant velocity 15 m/s for 8 s): area of rectangle = 15 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third part (velocity falling uniformly from 15 m/s to 0 in 4 s): area of triangle = ½ × 4 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total distance = 45 + 120 + 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">195 m</span><span style=\"font-family:'Mangal'\"> (taking 15 m/s for the whole 18 s would wrongly give 270 m).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total distance travelled is 195 m </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The convex rear-view mirror of a truck has a radius of curvature of 4.0 m. A car is 6.0 m behind the mirror. The position of the image of the car and the magnification are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.0 m behind the mirror, +0.50</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m behind the mirror, +0.25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m in front of the mirror, −0.25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.0 m behind the mirror, +0.33</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a convex mirror, R = +4.0 m, so the focal length f = R/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2.0 m</span><span style=\"font-family:'Mangal'\">; the object distance u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6.0 m</span><span style=\"font-family:'Mangal'\"> (object in front of the mirror).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mirror formula: 1/v + 1/u = 1/f → 1/v = 1/f − 1/u = 1/2 − (−1/6) = 1/2 + 1/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2/3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1.5 m</span><span style=\"font-family:'Mangal'\">; the positive sign means the image is formed </span><span style=\"font-weight:bold;font-family:'Mangal'\">behind the mirror</span><span style=\"font-family:'Mangal'\"> (virtual).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Magnification m = −v/u = −(1.5)/(−6.0) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.25</span><span style=\"font-family:'Mangal'\">: the image is virtual, erect and smaller in size by a factor of 0.25.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the image is 1.5 m behind the mirror with magnification +0.25 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about scientific naming and classification:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In a scientific name, the genus name comes first and begins with a capital letter, while the species name is written in lower case.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A scientific name is written in italics when printed, or underlined when handwritten.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In the three domain system proposed by Carl Woese in 1977, the three domains are Monera, Protista and Eukarya.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Rule of scientific naming: the </span><span style=\"font-weight:bold;font-family:'Mangal'\">genus name begins with a capital letter and comes first</span><span style=\"font-family:'Mangal'\">, followed by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">species name in lower case</span><span style=\"font-family:'Mangal'\">, e.g. Panthera tigris → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The scientific name is </span><span style=\"font-weight:bold;font-family:'Mangal'\">written in italics when printed, or underlined when handwritten</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Carl Woese (1977) proposed the three domain system based on genetic data, and the three domains are </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bacteria, Archaea and Eukarya</span><span style=\"font-family:'Mangal'\">; Monera and Protista are kingdoms of the five kingdom system → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plastic bags and glass bottles thrown into a garbage dump remain unchanged for years, whereas vegetable peels thrown there rot within a few days. Which of the following best explains this?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Non-biodegradable substances are also broken down by enzymes, but very slowly</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vegetable peels are broken down by heat and pressure, while plastic and glass need enzymes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plastic and glass are inert, so they can never harm any member of the ecosystem</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Enzymes are specific in their action, and the enzymes of bacteria and other saprophytes cannot break down plastic and glass; these are acted upon only by physical processes like heat and pressure and so persist for a long time</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Enzymes are specific in their action</span><span style=\"font-family:'Mangal'\">: a specific enzyme is needed for the break-down of a particular substance, which is why we get no energy if we try to eat coal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vegetable peels are </span><span style=\"font-weight:bold;font-family:'Mangal'\">biodegradable</span><span style=\"font-family:'Mangal'\">: bacteria and other saprophytes have the enzymes to break them down, so they rot within days.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plastic and glass are </span><span style=\"font-weight:bold;font-family:'Mangal'\">non-biodegradable</span><span style=\"font-family:'Mangal'\">: they are acted upon only by </span><span style=\"font-weight:bold;font-family:'Mangal'\">physical processes like heat and pressure</span><span style=\"font-family:'Mangal'\">, and under ambient conditions they </span><span style=\"font-weight:bold;font-family:'Mangal'\">persist for a long time</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Non-biodegradable substances may be inert and simply persist, or they may </span><span style=\"font-weight:bold;font-family:'Mangal'\">harm</span><span style=\"font-family:'Mangal'\"> the various members of the ecosystem, so option C is wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the difference is explained by the specificity of enzymes </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): In frogs and most fish, fertilisation takes place inside the body of the female.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Fish and frogs produce hundreds to thousands of eggs at a time, and the survival of their young is low.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In many aquatic animals such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">frogs and most fish</span><span style=\"font-family:'Mangal'\">, the female releases eggs into the water and the male releases sperm over them, so fertilisation occurs </span><span style=\"font-weight:bold;font-family:'Mangal'\">outside the body</span><span style=\"font-family:'Mangal'\">; this is </span><span style=\"font-weight:bold;font-family:'Mangal'\">external fertilisation</span><span style=\"font-family:'Mangal'\"> → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In external fertilisation a </span><span style=\"font-weight:bold;font-family:'Mangal'\">large number of eggs</span><span style=\"font-family:'Mangal'\"> are laid (frogs 5,000–50,000, fish hundreds to thousands at a time), but many are destroyed by water currents or eaten by other animals, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">survival of the young is low</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fertilisation inside the female body (internal fertilisation) is seen in reptiles, birds and mammals, where fewer eggs are produced and survival is higher.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who was the first scientist to observe a cell, in 1665, using a microscope he designed himself?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Anton van Leeuwenhoek</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Robert Hooke</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Robert Brown</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Matthias Schleiden</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Robert Hooke</span><span style=\"font-family:'Mangal'\"> was the first person to observe a cell, in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1665</span><span style=\"font-family:'Mangal'\">, using a microscope he designed himself (about 200-300X magnification); he saw small box-like compartments in a thin slice of cork and called them </span><span style=\"font-weight:bold;font-family:'Mangal'\">cells</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Anton van Leeuwenhoek</span><span style=\"font-family:'Mangal'\"> was the first to see </span><span style=\"font-weight:bold;font-family:'Mangal'\">living</span><span style=\"font-family:'Mangal'\"> cells, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Robert Brown</span><span style=\"font-family:'Mangal'\"> discovered the </span><span style=\"font-weight:bold;font-family:'Mangal'\">nucleus</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Matthias Schleiden</span><span style=\"font-family:'Mangal'\"> is one of the founders of the cell theory.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the first scientist to observe a cell was Robert Hooke </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about planetary winds and pressure belts:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Because of the Earth's rotation, planetary winds are deflected towards the right in the Northern Hemisphere and towards the left in the Southern Hemisphere.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Near the equator, intense heating by the Sun makes warm air rise, forming an equatorial low pressure belt.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In the polar regions, the very low temperature makes cold, dense air sink, forming polar low pressure belts.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The Earth's rotation deflects planetary winds from their straight paths: </span><span style=\"font-weight:bold;font-family:'Mangal'\">towards the right in the Northern Hemisphere and towards the left in the Southern Hemisphere</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Near the equator, </span><span style=\"font-weight:bold;font-family:'Mangal'\">intense heating causes warm air to rise</span><span style=\"font-family:'Mangal'\">, forming the </span><span style=\"font-weight:bold;font-family:'Mangal'\">equatorial low pressure belt</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Around the poles (90° N and S), the very low temperature makes cold, dense air </span><span style=\"font-weight:bold;font-family:'Mangal'\">sink</span><span style=\"font-family:'Mangal'\">, which forms </span><span style=\"font-weight:bold;font-family:'Mangal'\">polar high pressure belts</span><span style=\"font-family:'Mangal'\">, not low pressure belts; air from these high pressure regions flows towards the sub-polar low pressure belts → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After an accident, the medulla in the hind-brain of a patient is injured. Which of the following activities is most likely to be affected?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Deciding to write a letter and moving a chair, which are voluntary actions</span></p>", "option2": "Tुध cुोngध in पुध ौप्रध यी पुध ूहूiि थुधn ृनigुप िigुप ीोििस यn पुध धदध", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Control of blood pressure, salivation and vomiting</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sensation of feeling full after a meal</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Involuntary actions such as blood pressure, salivation and vomiting are </span><span style=\"font-weight:bold;font-family:'Mangal'\">controlled by the medulla in the hind-brain</span><span style=\"font-family:'Mangal'\">; many involuntary actions are controlled by the mid-brain and hind-brain.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Writing and moving a chair are </span><span style=\"font-weight:bold;font-family:'Mangal'\">voluntary (thought-out) actions</span><span style=\"font-family:'Mangal'\">, decided in the fore-brain and passed to its motor areas that control voluntary muscles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">change in the size of the pupil</span><span style=\"font-family:'Mangal'\"> is an example of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">simple reflex action</span><span style=\"font-family:'Mangal'\">, not a medulla-controlled activity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">sensation of feeling full</span><span style=\"font-family:'Mangal'\"> is due to a </span><span style=\"font-weight:bold;font-family:'Mangal'\">hunger centre</span><span style=\"font-family:'Mangal'\"> located in a separate part of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fore-brain</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, an injury to the medulla would most affect the control of blood pressure, salivation and vomiting </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the solubility and electrical conductivity of compounds:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Ionic compounds like sodium chloride and copper sulfate are generally soluble in water but insoluble in solvents such as kerosene and petrol.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Sugar dissolves in water and its solution conducts electricity because it provides ions in solution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Covalent compounds such as camphor and naphthalene are insoluble in water but dissolve in kerosene and petrol.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ionic compounds</span><span style=\"font-family:'Mangal'\"> like sodium chloride and copper sulfate are generally </span><span style=\"font-weight:bold;font-family:'Mangal'\">soluble in water</span><span style=\"font-family:'Mangal'\"> but </span><span style=\"font-weight:bold;font-family:'Mangal'\">insoluble in kerosene and petrol</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Sugar is a covalent compound that is soluble in water, but it </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not provide ions</span><span style=\"font-family:'Mangal'\"> in solution, so its solution </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not conduct electricity</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Most </span><span style=\"font-weight:bold;font-family:'Mangal'\">covalent compounds</span><span style=\"font-family:'Mangal'\">, such as camphor and naphthalene, are </span><span style=\"font-weight:bold;font-family:'Mangal'\">insoluble in water but dissolve in kerosene and petrol</span><span style=\"font-family:'Mangal'\">; they also do not conduct electricity → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A unicellular organism that causes kala-azar has a whip-like structure at one end of its cell, and when it divides, the splitting of the cell takes place in a definite orientation in relation to this structure. This organism is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Leishmania, which reproduces by binary fission</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amoeba, which can split in any plane</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plasmodium, which reproduces by multiple fission</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Spirogyra, which reproduces by fragmentation</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Many bacteria and protozoa simply split into two equal halves during cell division; this is </span><span style=\"font-weight:bold;font-family:'Mangal'\">binary fission</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In organisms such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amoeba</span><span style=\"font-family:'Mangal'\">, the splitting of the two cells can take place </span><span style=\"font-weight:bold;font-family:'Mangal'\">in any plane</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Leishmania</span><span style=\"font-family:'Mangal'\">, which causes </span><span style=\"font-weight:bold;font-family:'Mangal'\">kala-azar</span><span style=\"font-family:'Mangal'\">, has a </span><span style=\"font-weight:bold;font-family:'Mangal'\">whip-like structure at one end</span><span style=\"font-family:'Mangal'\"> of the cell and shows more organisation of its body; in it, </span><span style=\"font-weight:bold;font-family:'Mangal'\">binary fission occurs in a definite orientation in relation to the whip-like structure</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Spirogyra is a multicellular filament that reproduces by fragmentation, and Plasmodium does not match the description.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the organism is Leishmania </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the chlor-alkali process and its products:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In the chlor-alkali process, chlorine gas is given off at the anode and hydrogen gas at the cathode.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Sodium hydroxide solution is formed near the cathode.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Bleaching powder is produced by the action of chlorine on dry sodium hydroxide.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When electricity is passed through an aqueous solution of sodium chloride (brine), it decomposes: 2NaCl(aq) + 2H₂O(l) → 2NaOH(aq) + Cl₂(g) + H₂(g); this is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">chlor-alkali process</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chlorine gas is given off at the anode and hydrogen gas at the cathode</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sodium hydroxide solution forms near the cathode</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Bleaching powder, Ca(ClO)₂, is produced by the action of </span><span style=\"font-weight:bold;font-family:'Mangal'\">chlorine on dry slaked lime, Ca(OH)₂</span><span style=\"font-family:'Mangal'\">, not on sodium hydroxide → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In Mendel's experiment, a pea plant with round, yellow seeds (RRYY) is crossed with a plant with wrinkled, green seeds (rryy). How many different types of gametes does an F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> plant (RrYy) produce?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> plants are </span><span style=\"font-weight:bold;font-family:'Mangal'\">RrYy</span><span style=\"font-family:'Mangal'\">: they get one set of genes from each parent.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Traits such as seed shape and seed colour are </span><span style=\"font-weight:bold;font-family:'Mangal'\">inherited independently</span><span style=\"font-family:'Mangal'\">, so an F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> plant produces </span><span style=\"font-weight:bold;font-family:'Mangal'\">four kinds of gametes</span><span style=\"font-family:'Mangal'\">: </span><span style=\"font-weight:bold;font-family:'Mangal'\">RY, Ry, rY and ry</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 4 × 4 table of these gametes gives the </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 combinations</span><span style=\"font-family:'Mangal'\"> of the F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> generation; 16 is the number of combinations, not of gamete types.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, an F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> plant produces 4 types of gametes </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of ₹7,450 is divided among P, Q and R such that if their shares are increased by ₹150, ₹250 and ₹350 respectively, the new amounts are in the ratio 2 : 3 : 5. What is the original share of Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,460</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,490</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,050</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,210</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After the increases, the total = 7,450 + (150 + 250 + 350) = 7,450 + 750 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The increased amounts are in the ratio 2 : 3 : 5, total parts = 2 + 3 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One part = 8,200 / 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹820</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q's increased amount = 3 × 820 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,460</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q's original share = 2,460 − 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,210</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: P = 2 × 820 − 150 = 1,490; R = 5 × 820 − 350 = 3,750; 1,490 + 2,210 + 3,750 = 7,450 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the original share of Q is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,210 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A man bought two types of apples, one at ₹2 for 3 apples and the other at ₹6 per apple. He purchased an equal number of each type and sold all the apples at ₹6 per apple. Find his percentage profit.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">78%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">77%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take a convenient equal number of each type, say 3 apples of each type (a multiple of 3 keeps the first cost a whole number).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 3 apples of the first type = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost of 3 apples of the second type = 3 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total cost price of 6 apples = 2 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total selling price of 6 apples = 6 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Profit = 36 − 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Profit % = 16 / 20 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, his percentage profit is </span><span style=\"font-weight:bold;font-family:'Mangal'\">80% (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The average weight of 10 students increases by 1.5 kg when a student weighing 45 kg is replaced by a new student. What is the weight of the new student?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62 kg</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The number of students stays 10, and the average rises by 1.5 kg.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increase in the total weight = 10 × 1.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The only change is that the 45 kg student is replaced, so the new student weighs 15 kg more than the one who left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Weight of the new student = 45 + 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: new member = old member + (number × increase in average) = 45 + 10 × 1.5 = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the weight of the new student is </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 kg (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amit can build a wall alone in 36 hours, while Bimal works three times as fast as Amit. Amit works alone during the first hour, Bimal works alone during the second hour, and both work together during the third hour. If they continue in this pattern, in how many hours will the wall be completed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amit's 1 hour work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/36</span><span style=\"font-family:'Mangal'\">; Bimal is three times as fast, so his 1 hour work = 3/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Together in 1 hour = 1/36 + 3/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done in one 3-hour cycle (Amit, then Bimal, then both) = 1/36 + 3/36 + 4/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 4 cycles (12 hours): (4 × 8) / 36 = 32/36, remaining work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13th hour (Amit alone): 1/36 done → remaining = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14th hour (Bimal alone): 3/36 done → remaining = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the wall is completed exactly at the end of the 14th hour.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the wall will be completed in </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (Option D)</span><span style=\"font-family:'Mangal'\"> hours.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Girish scored 664 marks in an examination and was 8 marks short of 84% of the maximum marks. In the same examination, his friend scored 472 marks. What is the percentage of marks scored by his friend?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Girish was 8 marks short of 84%, so 84% of the maximum marks = 664 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the maximum marks be M: (M × 84) / 100 = 672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M = (672 × 100) / 84 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Friend's percentage = 472 / 800 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">59%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 59% of 800 = 472 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the friend scored </span><span style=\"font-weight:bold;font-family:'Mangal'\">59% (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The table shows the income and expenditure (in ₹ million) of five companies A, B, C, D and E in a year. Profit or loss = Income − Expenditure.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914629143_image001.png\" width=\"269\" height=\"59\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the ratio of the combined profit or loss of companies B and C to that of companies A and E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 : 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Profit or loss of each company = income − expenditure (₹ million):</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B = 180 − 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20</span><span style=\"font-family:'Mangal'\"> (loss of 20); C = 220 − 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60</span><span style=\"font-family:'Mangal'\"> (profit of 60)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Combined result of B and C = −20 + 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+40</span><span style=\"font-family:'Mangal'\"> (profit of 40)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 150 − 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+30</span><span style=\"font-family:'Mangal'\">; E = 200 − 170 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Combined result of A and E = 30 + 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60</span><span style=\"font-family:'Mangal'\"> (profit of 60)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required ratio = 40 : 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required ratio is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 3 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of ₹6,300 is divided between Ravi and Shyam. Ravi invests his share at 10% per annum, compounded annually, for 2 years, while Shyam invests his share at the same rate for 3 years. If both receive equal amounts at the end of their investment periods, what is the share (in ₹) of Ravi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,150</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let Ravi's share be ₹x and Shyam's share be ₹(6,300 − x).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At 10% compounded annually, the amount is multiplied by 1.1 every year.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ravi's amount after 2 years = x × (1.1)²; Shyam's amount after 3 years = (6,300 − x) × (1.1)³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Equal amounts: x × (1.1)² = (6,300 − x) × (1.1)³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divide both sides by (1.1)²: x = (6,300 − x) × 1.1 → x = 6,930 − 1.1x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.1x = 6,930 → x = 6,930 / 2.1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,300</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shyam's share = 6,300 − 3,300 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 3,300 × 1.21 = 3,993 and 3,000 × 1.331 = 3,993 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: Ravi : Shyam = (1 + R/100) : 1 = 11 : 10, so Ravi's share = (6,300 × 11) / 21 = 3,300</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the share of Ravi is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,300 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three-eighths of a tank is filled with petrol, two-fifths of the remaining part is filled with diesel, three-fourths of the still remaining part is filled with kerosene and the remaining 12 litres is water. What is the capacity of the tank?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">128 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">144 litres</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:
