:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">$</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला से प्रत्येक संख्या हटा दें और अक्षरों तथा प्रतीकों को उनके मूल क्रम में रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूल शृंखला: 5 A % 3 K 7 # B 2 M 9 $ D 6 4 P @ Q 1 R 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ हटाने के बाद: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A % K # B M $ D P @ Q R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से गिनें: पहला A, दूसरा %, तीसरा K, चौथा #, पाँचवाँ B, छठा M, सातवाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">$</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(M बाएँ से छठा, D आठवाँ और P नौवाँ है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बाएँ छोर से सातवाँ तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">$ (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति P, Q, R, S, T, U और V एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। Q, P के दाईं ओर दूसरे स्थान पर बैठा है। Q के दाईं ओर से गिनने पर Q और T के बीच केवल दो व्यक्ति बैठे हैं। U, T के ठीक बाईं ओर बैठा है। R, P का निकटतम पड़ोसी है परंतु Q का नहीं। V, R के बाईं ओर तीसरे स्थान पर बैठा है। S के निकटतम पड़ोसी कौन हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और Q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q और V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R और U</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सातों व्यक्तियों का मुख केंद्र की ओर है, अतः ‘दाएँ’ = वामावर्त (anticlockwise) और ‘बाएँ’ = दक्षिणावर्त (clockwise)। सीटों को दाईं ओर (वामावर्त) 1 से 7 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">P सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है, तथा 7 के बाद फिर 1 आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q, P के दाईं ओर दूसरे स्थान पर → Q = 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q के दाईं ओर से गिनने पर Q और T के बीच केवल दो व्यक्ति → T = 3 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U, T के ठीक बाईं ओर → U = 6 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, P का निकटतम पड़ोसी है (सीट 2 या सीट 7) परंतु Q का नहीं (Q के पड़ोसी सीट 2 और 4 हैं) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V, R के बाईं ओर तीसरे स्थान पर → V = 7 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब केवल सीट 2 बची है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P – S – Q – V – U – T – R</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S सीट 2 पर है, सीट 1 पर बैठे P और सीट 3 पर बैठे Q के बीच।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः S के निकटतम पड़ोसी </span><span style=\"font-weight:bold;font-family:'Mangal'\">P और Q (विकल्प A)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच मित्र वरुण, अंकित, नेहा, आद्या और रूबी की आयु अलग-अलग है। केवल आद्या, अंकित से बड़ी है। ठीक दो व्यक्ति रूबी से छोटे हैं। वरुण, नेहा से छोटा है। उनमें से कितने व्यक्ति नेहा से बड़े हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँचों को सबसे बड़े से सबसे छोटे तक, स्थान 1 से 5 पर, व्यवस्थित करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल आद्या, अंकित से बड़ी है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">आद्या = 1</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंकित = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठीक दो व्यक्ति रूबी से छोटे हैं → रूबी ऊपर से तीसरे स्थान पर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">रूबी = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वरुण, नेहा से छोटा है → बचे हुए दो स्थानों 4 और 5 में से </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेहा = 4</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">वरुण = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम (सबसे बड़ा → सबसे छोटा): </span><span style=\"font-weight:bold;font-family:'Mangal'\">आद्या &gt; अंकित &gt; रूबी &gt; नेहा &gt; वरुण</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेहा से बड़े व्यक्ति आद्या, अंकित और रूबी हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\"> व्यक्ति।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नेहा से बड़े व्यक्तियों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P’ का अर्थ ‘×’, ‘Q’ का अर्थ ‘÷’, ‘R’ का अर्थ ‘−’ और ‘S’ का अर्थ ‘+’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 P 3 S (28 Q 4) P 5 R 9 P 2 S 6 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">53</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">65</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर के स्थान पर उसकी संक्रिया रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 P 3 S (28 Q 4) P 5 R 9 P 2 S 6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 × 3 + (28 ÷ 4) × 5 − 9 × 2 + 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले कोष्ठक: 28 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर गुणा: 12 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\">; 7 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35</span><span style=\"font-family:'Mangal'\">; 9 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक 36 + 35 − 18 + 6 है, जिसे बाएँ से दाएँ हल करें: 36 + 35 = 71; 71 − 18 = 53; 53 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">59</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(53 में अंतिम + 6 छूट गया है; 61 और 65 अंतिम दो चरणों की चूक से आते हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">59 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘×’ और ‘+’ को आपस में बदल दिया जाए तथा ‘8’ और ‘4’ को आपस में बदल दिया जाए, तो निम्नलिखित व्यंजक का मान क्या होगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 × 4 + 12 ÷ 4 − 2</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक में × के स्थान पर +, + के स्थान पर ×, 8 के स्थान पर 4 और 4 के स्थान पर 8 रखें, फिर BODMAS लागू करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है: 8 × 4 + 12 ÷ 4 − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अदला-बदली के बाद: </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 + 8 × 12 ÷ 8 − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले भाग: 12 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर गुणा: 8 × 1.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर बाएँ से दाएँ: 4 + 12 − 2 = 16 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(16 में अंतिम − 2 छूट गया है, 12 में शुरू का 4 छूट गया है, तथा 18 में 2 घटाने के बजाय जोड़ दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GFE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NML</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QPN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VUT</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह में एक अक्षर से अगले अक्षर तक का अंतर लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GFE: G − 1 = F, F − 1 = E → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1, −1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NML: N − 1 = M, M − 1 = L → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1, −1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VUT: V − 1 = U, U − 1 = T → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1, −1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QPN: Q − 1 = P, P − 2 = N → अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1, −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूहों में अक्षर वर्णमाला में बिना अंतराल के उल्टे क्रम में चलते हैं; QPN में अंतिम अक्षर O को छोड़ देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">QPN (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 58 63 76 81 94 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">101</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">93</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">99</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पद और अगले पद का अंतर ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58 − 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">; 63 − 58 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">; 76 − 63 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">; 81 − 76 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">; 94 − 81 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शृंखला में बारी-बारी से 13 और 5 जोड़े जाते हैं: +13, +5, +13, +5, +13, और अगला चरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">? = 94 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">99</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(101 में 7 जोड़ा गया है, 96 में 2, तथा 93 में 1 घटाया गया है; इनमें से कोई भी +13, +5 के पैटर्न को नहीं रखता।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">99 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द TRIANGLE के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाता है। इस प्रकार बने नए अक्षर-समूह में बाएँ से तीसरे अक्षर और दाएँ से दूसरे अक्षर के बीच अंग्रेज़ी वर्णमाला क्रम में कितने अक्षर हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRIANGLE के अक्षरों को वर्णमाला क्रम में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षर T, R, I, A, N, G, L, E हैं → वर्णमाला क्रम में: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A E G I L N R T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से तीसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\"> है (वर्णमाला में स्थान 7); दाएँ से दूसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है (स्थान 18)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला में G और R के बीच के अक्षर: H, I, J, K, L, M, N, O, P, Q → 18 − 7 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9 और 11 में किसी एक सिरे का अक्षर गिन लिया गया है या एक छूट गया है; 8 में वर्णमाला के बजाय नए समूह में उनके बीच के अक्षर गिने गए हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उनके बीच के अक्षरों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अक्षर-संख्या समूह दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आएगा जिससे वह तार्किक रूप से पूर्ण हो जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Z 2, X 5, V 10, T 17, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R 26</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S 26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R 24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R 25</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों और संख्याओं को अलग-अलग पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षर: Z, X, V, T, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → ? = T − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ: 2, 5, 10, 17, ?: 1² + 1 = 2, 2² + 1 = 5, 3² + 1 = 10, 4² + 1 = 17, अतः प्रत्येक संख्या किसी पूर्ण वर्ग से एक अधिक है → ? = 5² + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(अंतरों से जाँच: 3, 5, 7, फिर 9 → 17 + 9 = 26 ✓)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह R 26 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(S 26 में अक्षर केवल एक स्थान पीछे गया है, R 24 में फिर से 7 जोड़ा गया है, तथा R 25 में 1 जोड़े बिना केवल वर्ग लिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">R 26 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1855-1856 के संथाल विद्रोह के प्रमुख नेता निम्नलिखित में से कौन थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तिलका माँझी और सिदो कान्हू</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिरसा मुंडा और रघुनाथ मुर्मू</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लालू प्रसाद और सिद्धू कान्हू</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिद्धू मुर्मू और कान्हू मुर्मू</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">1855-56</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">संथाल विद्रोह (हूल)</span><span style=\"font-family:'Mangal'\"> का नेतृत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिद्धू मुर्मू और कान्हू मुर्मू</span><span style=\"font-family:'Mangal'\"> नामक दो भाइयों ने किया, जिन्होंने राजमहल की पहाड़ियों के क्षेत्र के संथालों को अंग्रेज़ों, ज़मींदारों और साहूकारों के विरुद्ध खड़ा किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह विद्रोह </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 जून 1855</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">भोगनाडीह</span><span style=\"font-family:'Mangal'\"> से शुरू हुआ और 1856 में अंग्रेज़ों ने इसे दबा दिया; इसके बाद 1855-56 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संथाल परगना</span><span style=\"font-family:'Mangal'\"> ज़िले को एक अलग प्रशासनिक इकाई के रूप में बनाया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तिलका माँझी</span><span style=\"font-family:'Mangal'\"> ने 1780 के दशक में राजमहल की पहाड़ियों में अंग्रेज़ों के विरुद्ध एक पहले के आदिवासी विद्रोह का नेतृत्व किया था और 1785 में उन्हें फाँसी दी गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बिरसा मुंडा</span><span style=\"font-family:'Mangal'\"> ने छोटा नागपुर क्षेत्र में 1899-1900 के मुंडा विद्रोह (उलगुलान) का नेतृत्व किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्रोह के नेता </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिद्धू मुर्मू और कान्हू मुर्मू (विकल्प D)</span><span style=\"font-family:'Mangal'\"> थे।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26 मई 2026 को हुई क्वाड विदेश मंत्रियों की बैठक, जिसमें डॉ. एस. जयशंकर, पेनी वोंग, मोटेगी तोशिमित्सु और मार्को रुबियो ने भाग लिया, किस शहर में हुई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टोक्यो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई दिल्ली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैनबरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाशिंगटन डीसी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्वाड विदेश मंत्रियों की बैठक</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 मई 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत</span><span style=\"font-family:'Mangal'\"> की मेज़बानी में </span><span style=\"font-weight:bold;font-family:'Mangal'\">नई दिल्ली</span><span style=\"font-family:'Mangal'\"> में हुई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें भारत के विदेश मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">डॉ. एस. जयशंकर</span><span style=\"font-family:'Mangal'\">, ऑस्ट्रेलिया की विदेश मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेनी वोंग</span><span style=\"font-family:'Mangal'\">, जापान के विदेश मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटेगी तोशिमित्सु</span><span style=\"font-family:'Mangal'\"> और संयुक्त राज्य अमेरिका के विदेश मंत्री (सेक्रेटरी ऑफ़ स्टेट) </span><span style=\"font-weight:bold;font-family:'Mangal'\">मार्को रुबियो</span><span style=\"font-family:'Mangal'\"> ने भाग लिया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंत्रियों ने एक संयुक्त वक्तव्य, </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिंद-प्रशांत ऊर्जा सुरक्षा पर क्वाड वक्तव्य</span><span style=\"font-family:'Mangal'\"> और महत्वपूर्ण खनिजों की आपूर्ति शृंखलाओं को मज़बूत करने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्वाड क्रिटिकल मिनरल्स इनिशिएटिव फ़्रेमवर्क</span><span style=\"font-family:'Mangal'\"> जारी किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्वाड </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत, ऑस्ट्रेलिया, जापान और संयुक्त राज्य अमेरिका</span><span style=\"font-family:'Mangal'\"> का समूह है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह बैठक </span><span style=\"font-weight:bold;font-family:'Mangal'\">नई दिल्ली (विकल्प B)</span><span style=\"font-family:'Mangal'\"> में हुई।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राज्य विधानमंडल का सत्र न चलने पर किसी राज्य के राज्यपाल को अध्यादेश जारी करने की शक्ति भारत के संविधान के किस अनुच्छेद के अंतर्गत दी गई है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 123</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 161</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 213</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 356</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत के संविधान का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 213</span><span style=\"font-family:'Mangal'\"> राज्य के </span><span style=\"font-weight:bold;font-family:'Mangal'\">राज्यपाल</span><span style=\"font-family:'Mangal'\"> को उस समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">अध्यादेश</span><span style=\"font-family:'Mangal'\"> जारी करने की शक्ति देता है, जब राज्य की विधान सभा (और जहाँ विधान परिषद है, वह भी) का </span><span style=\"font-weight:bold;font-family:'Mangal'\">सत्र नहीं चल रहा हो</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 213 के अंतर्गत जारी अध्यादेश का वही बल होता है, जो राज्य विधानमंडल के अधिनियम का होता है, परंतु विधानमंडल के पुनः समवेत होने पर उसे सदन के सामने रखना आवश्यक है और पहले अनुमोदित न होने पर वह पुनः समवेत होने के </span><span style=\"font-weight:bold;font-family:'Mangal'\">छह सप्ताह</span><span style=\"font-family:'Mangal'\"> बाद प्रभावहीन हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 123</span><span style=\"font-family:'Mangal'\"> संसद का सत्र न चलने पर यही अध्यादेश जारी करने की शक्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रपति</span><span style=\"font-family:'Mangal'\"> को देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 161</span><span style=\"font-family:'Mangal'\"> राज्यपाल को क्षमादान की शक्ति देता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 356</span><span style=\"font-family:'Mangal'\"> किसी राज्य में राष्ट्रपति शासन का प्रावधान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राज्यपाल की अध्यादेश शक्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 213 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> के अंतर्गत दी गई है।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोकसभा के बाद 18 दिसंबर 2025 को राज्यसभा द्वारा पारित SHANTI विधेयक, 2025 निम्नलिखित में से किस क्षेत्र से संबंधित कानून है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतरिक्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सेमीकंडक्टर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु ऊर्जा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नवीकरणीय ऊर्जा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">SHANTI</span><span style=\"font-family:'Mangal'\"> का पूर्ण रूप </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sustainable Harnessing and Advancement of Nuclear Energy for Transforming India</span><span style=\"font-family:'Mangal'\"> है, इसलिए यह विधेयक </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु ऊर्जा</span><span style=\"font-family:'Mangal'\"> क्षेत्र से संबंधित कानून है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह विधेयक लोकसभा से पारित होने के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 दिसंबर 2025</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">राज्यसभा</span><span style=\"font-family:'Mangal'\"> ने पारित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु ऊर्जा अधिनियम, 1962</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प ाई (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोलिया, जो तलवार और ढाल लिए पुरुषों द्वारा बारात के साथ किया जाने वाला तलवार नृत्य है, किस राज्य के कुमाऊँ क्षेत्र का नृत्य है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तराखंड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिमाचल प्रदेश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जम्मू और कश्मीर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिक्किम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">छोलिया</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तराखंड</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुमाऊँ</span><span style=\"font-family:'Mangal'\"> क्षेत्र का तलवार नृत्य है, जो अल्मोड़ा, बागेश्वर, चंपावत और पिथौरागढ़ ज़िलों में लोकप्रिय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह पारंपरिक रूप से </span><span style=\"font-weight:bold;font-family:'Mangal'\">तलवार और ढाल</span><span style=\"font-family:'Mangal'\"> लिए पुरुषों द्वारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">बारात</span><span style=\"font-family:'Mangal'\"> के साथ ढोल, दमाऊ तथा तुरी और रणसिंग जैसे पीतल के वाद्यों के संगीत पर किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt; let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
