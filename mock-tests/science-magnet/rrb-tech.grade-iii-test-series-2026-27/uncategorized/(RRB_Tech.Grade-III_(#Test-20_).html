<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>41.) RRB Tech.Grade-III (#Test-20  - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव गर्भावस्था में निषेचित अंडाणु भ्रूण में विकसित होता है और शिशु के प्रमुख अंग बनना किस अवस्था में शुरू होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली तिमाही</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी तिमाही</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरी तिमाही</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जन्म से पहले का अंतिम महीना</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव में गर्भावस्था लगभग नौ महीने की होती है और इसे लगभग तीन-तीन महीने की तीन अवस्थाओं में बाँटा जाता है, जिन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">तिमाही</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पहली तिमाही</span><span style=\"font-family:'Mangal'\"> में निषेचित अंडाणु पहले दो महीनों के दौरान भ्रूण में विकसित होता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रमुख अंग बनने लगते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी तिमाही में भ्रूण (फ़ीटस) बड़ा और मज़बूत होता है, और माँ प्रायः उसकी हलचल महसूस कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरी तिमाही में शिशु तेज़ी से बढ़ता है और गर्भ के बाहर के जीवन के लिए तैयार होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रमुख अंग पहली तिमाही में बनना शुरू होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): ठोस सोडियम क्लोराइड विद्युत का चालन नहीं करता, परंतु उसका जलीय विलयन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): सोडियम क्लोराइड का गलनांक उच्च होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठोस सोडियम क्लोराइड में Na</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">+</span><span style=\"font-family:'Mangal'\"> और Cl</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−</span><span style=\"font-family:'Mangal'\"> आयन स्थिर वैद्युत आकर्षण बल द्वारा क्रिस्टल जालक में निश्चित स्थानों पर बँधे रहते हैं, अतः वे गति नहीं कर सकते और ठोस चालन नहीं करता; लवण को जल में घोलने पर आयन गति के लिए मुक्त हो जाते हैं और धारा ले जाते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विपरीत आवेश वाले आयनों के बीच इसी प्रबल आकर्षण के कारण जालक तोड़ने के लिए बहुत ऊष्मा चाहिए, अतः सोडियम क्लोराइड का </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलनांक उच्च</span><span style=\"font-family:'Mangal'\"> होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु उच्च गलनांक चालन में अंतर का कारण नहीं है; कारण यह है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयन गति के लिए मुक्त हैं</span><span style=\"font-family:'Mangal'\"> या नहीं, अतः R, A की व्याख्या नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मॉस और लिवरवर्ट, जिनमें जड़ जैसी मूलाभास (राइज़ॉइड) होती हैं और जो पौधों के जल से स्थल की ओर बढ़ने के महत्वपूर्ण चरण को दर्शाते हैं, किस समूह के हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैलोफ़ाइटा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टेरिडोफ़ाइटा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनावृतबीजी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रायोफ़ाइटा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप जगत को सरलतम से जटिलतम रूपों तक क्रम में रखा जाता है: थैलोफ़ाइट, ब्रायोफ़ाइट, टेरिडोफ़ाइट, अनावृतबीजी और आवृतबीजी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रायोफ़ाइट</span><span style=\"font-family:'Mangal'\"> नाम 'ब्रायोन' (मॉस) और 'फ़ाइटॉन' (पौधा) से बना है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">मॉस और लिवरवर्ट</span><span style=\"font-family:'Mangal'\"> इसके उदाहरण हैं, और ये पौधों के जल से स्थल की ओर बढ़ने के महत्वपूर्ण चरण को दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनका शरीर थैलोफ़ाइट की तुलना में अधिक विभेदित होता है, जिसमें जड़ जैसी </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूलाभास (राइज़ॉइड)</span><span style=\"font-family:'Mangal'\"> तथा तने जैसी और पत्ती जैसी सरल संरचनाएँ होती हैं, परंतु सच्चा संवहन ऊतक नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैलोफ़ाइट का शरीर अविभेदित थैलस होता है, फ़र्न जैसे टेरिडोफ़ाइट में जाइलम और फ्लोएम होते हैं, और अनावृतबीजी नग्न बीज धारण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मॉस और लिवरवर्ट ब्रायोफ़ाइटा के हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यदि किसी वस्तु पर नेट बल शून्य हो, तो उसका त्वरण शून्य होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. घर्षणरहित सतह पर किसी वस्तु को अचर वेग से चलाए रखने के लिए लगातार बल लगाना आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. चलती हुई वस्तु की गति की दिशा बदलने के लिए बल लगाना आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. त्वरण केवल नेट बल से उत्पन्न होता है; जब किसी वस्तु पर नेट बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">शून्य हो, तो उसका त्वरण शून्य</span><span style=\"font-family:'Mangal'\"> होता है, और वह विराम में रहती है या अचर वेग से चलती रहती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यदि घर्षण बल शून्य हो, तो एक बार चल पड़ने के बाद वस्तु को अचर वेग से चलाए रखने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई और बल आवश्यक नहीं</span><span style=\"font-family:'Mangal'\"> होता; बल केवल उसे चलाने या उसका वेग बदलने के लिए चाहिए → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वेग की दिशा होती है, अतः गति की दिशा बदलना वेग में परिवर्तन है, और न्यूटन के पहले नियम के अनुसार इसके लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल लगाना आवश्यक</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नारियल की भूसी के रेशे कठोर और भंगुर होते हैं, जबकि धनिये की पत्तियों के डंठल मुलायम और लचीले होते हैं। इन गुणों के लिए उत्तरदायी ऊतक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैरेन्काइमा और कॉलेन्काइमा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉलेन्काइमा और स्क्लेरेन्काइमा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैरेन्काइमा और स्क्लेरेन्काइमा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्क्लेरेन्काइमा और कॉलेन्काइमा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों के तीन सरल स्थायी (सहायक) ऊतक पैरेन्काइमा, कॉलेन्काइमा और स्क्लेरेन्काइमा हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्क्लेरेन्काइमा</span><span style=\"font-family:'Mangal'\"> की भित्तियाँ मोटी और लिग्निनयुक्त होती हैं और इसकी अधिकांश कोशिकाएँ मृत होती हैं; यह किसी भाग को कठोर और कड़ा बनाता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नारियल की भूसी</span><span style=\"font-family:'Mangal'\"> के रेशे इसी से बने होते हैं, इसीलिए वे कठोर और भंगुर होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कॉलेन्काइमा</span><span style=\"font-family:'Mangal'\"> में असमान रूप से मोटी भित्तियों वाली जीवित कोशिकाएँ होती हैं; यह बिना टूटे लचीलापन देता है, इसीलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">धनिये के डंठल</span><span style=\"font-family:'Mangal'\"> और कोमल तने हवा में झुक जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैरेन्काइमा में पतली भित्ति वाली, ढीली बँधी जीवित कोशिकाएँ होती हैं, जो न कठोरता देती हैं न विशेष लचीलापन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये ऊतक क्रमशः स्क्लेरेन्काइमा और कॉलेन्काइमा हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चुंबकीय क्षेत्र रेखाएँ बंद वक्र होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कंपास की सुई एक छोटा छड़ चुंबक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लंबी सीधी धारावाही परिनालिका के भीतर चुंबकीय क्षेत्र भिन्न-भिन्न बिंदुओं पर भिन्न होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्षेत्र रेखाएँ चुंबक के बाहर उत्तरी ध्रुव से निकलकर दक्षिणी ध्रुव में मिलती हैं, और चुंबक के भीतर दक्षिणी ध्रुव से उत्तरी ध्रुव की ओर जाती हैं, अतः प्रत्येक क्षेत्र रेखा एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंद वक्र</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कंपास की सुई एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा छड़ चुंबक</span><span style=\"font-family:'Mangal'\"> है; उसका उत्तर की ओर संकेत करने वाला सिरा उसका उत्तरी ध्रुव है, और छड़ चुंबक या धारावाही तार पास लाने पर वह विक्षेपित हो जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लंबी सीधी धारावाही परिनालिका के भीतर क्षेत्र रेखाएँ समांतर सीधी रेखाएँ होती हैं, जो दर्शाती हैं कि उसके भीतर क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकसमान है, सभी बिंदुओं पर समान</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दंत क्षय (दाँतों का सड़ना) तब शुरू होता है, जब:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैक्टीरिया शर्करा पर क्रिया करके अम्ल बनाते हैं, जो इनैमल को नरम कर देते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लार धीरे-धीरे दाँतों के इनैमल को घोल देती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन के कठोर कण दाँत के इनैमल को खरोंच देते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाँत की सतह पर अतिरिक्त कैल्सियम जमा हो जाता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दंत क्षय से दाँत का इनैमल और डेंटीन धीरे-धीरे नरम पड़ जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह तब शुरू होता है जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैक्टीरिया शर्करा पर क्रिया करके अम्ल बनाते हैं</span><span style=\"font-family:'Mangal'\">, जो इनैमल को नरम या विखनिजीकृत कर देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैक्टीरिया की कोशिकाओं के समूह भोजन के कणों के साथ दाँतों पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">दंत प्लाक</span><span style=\"font-family:'Mangal'\"> के रूप में चिपक जाते हैं, और प्लाक के दाँत की सतह को ढक लेने के कारण लार वहाँ पहुँचकर अम्ल को उदासीन नहीं कर पाती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाने के बाद दाँत साफ़ करने से बैक्टीरिया के अम्ल बनाने से पहले ही प्लाक हट जाता है; लार इनैमल को नहीं घोलती, भोजन के कण खरोंच से क्षय नहीं करते, और कैल्सियम का जमाव दाँत को नहीं सड़ाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दंत क्षय तब शुरू होता है जब बैक्टीरिया शर्करा पर क्रिया करके अम्ल बनाते हैं, जो इनैमल को नरम कर देते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. आग की लौ से हाथ पीछे खींच लेना और भोजन देखकर मुँह में पानी आना प्रतिवर्ती क्रियाएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पौधे सूचना को एक कोशिका से दूसरी कोशिका तक पहुँचाने के लिए विद्युत-रासायनिक साधनों का प्रयोग करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. छुई-मुई की पत्तियों का छूने पर सिकुड़ जाना वृद्धि से संबंधित गति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रतिवर्त पर्यावरण की किसी घटना के प्रति बिना सोचे की गई अचानक क्रिया है; बस के रास्ते से हट जाना, </span><span style=\"font-weight:bold;font-family:'Mangal'\">लौ से हाथ पीछे खींचना</span><span style=\"font-family:'Mangal'\"> और भोजन देखकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुँह में पानी आना</span><span style=\"font-family:'Mangal'\"> प्रतिवर्ती क्रियाएँ हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पौधों में तंत्रिका तंत्र नहीं होता, परंतु छुई-मुई में गति स्पर्श के स्थान से भिन्न स्थान पर होती है, अतः सूचना पौधे में आगे जाती है; पौधे सूचना को कोशिका से कोशिका तक पहुँचाने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत-रासायनिक साधनों</span><span style=\"font-family:'Mangal'\"> का प्रयोग करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. छुई-मुई की पत्तियाँ इसलिए सिकुड़ती हैं क्योंकि उसकी कोशिकाएँ अपने भीतर के जल की मात्रा बदलकर आकार बदल लेती हैं; यह तेज़ गति है जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि से संबंधित नहीं</span><span style=\"font-family:'Mangal'\"> है, जबकि प्ररोह का प्रकाश की ओर धीरे-धीरे मुड़ना वृद्धि से संबंधित है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दीवार घड़ी की मिनट की सुई 7 cm लंबी है। शाम 6:00 बजे से 7:30 बजे तक मिनट की सुई की नोक द्वारा तय की गई दूरी और उसके विस्थापन का परिमाण क्रमशः हैं (π = 22/7 लीजिए):</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44 cm और 0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66 cm और 14 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66 cm और 0</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44 cm और 14 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिनट की सुई की नोक r = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 cm</span><span style=\"font-family:'Mangal'\"> त्रिज्या के वृत्त पर चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृत्त की परिधि = 2 × π × r = 2 × (22/7) × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शाम 6:00 बजे से 7:30 बजे तक 1 घंटा 30 मिनट होते हैं, अतः मिनट की सुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.5 चक्कर</span><span style=\"font-family:'Mangal'\"> पूरे करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तय की गई दूरी = 1.5 × 44 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">66 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6:00 बजे नोक 12 के निशान पर और 7:30 बजे 6 के निशान पर होती है, जो एक व्यास के दो विपरीत सिरे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन का परिमाण = व्यास = 2 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूरी 66 cm और विस्थापन 14 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">220 V, 20 W अनुमतांक के कितने बल्ब 220 V की लाइन के साथ समांतर क्रम में जोड़े जा सकते हैं, यदि लाइन में अधिकतम अनुमत धारा 4 A हो?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">88</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">220 V की लाइन के साथ समांतर क्रम में जुड़ा प्रत्येक बल्ब अपने अनुमतांक 220 V पर काम करता है, अतः वह 20 W खपत करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बल्ब द्वारा ली गई धारा, P = V × I से: I = P / V = 20 / 220 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/11 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाइन में अधिकतम अनुमत धारा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बल्बों की संख्या = (कुल धारा) / (प्रति बल्ब धारा) = 4 / (1/11) = 4 × 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: कुल शक्ति = 44 × 20 = 880 W, और 880 / 220 = 4 A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 44 बल्ब जोड़े जा सकते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु की संरचना के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. थॉमसन के परमाणु मॉडल में इलेक्ट्रॉन नाभिक के चारों ओर उसी प्रकार परिक्रमा करते हैं जैसे ग्रह सूर्य के चारों ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रदरफ़ोर्ड ने पाया कि नाभिक परमाणु से लगभग 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> गुना छोटा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जेम्स चैडविक ने 1932 में न्यूट्रॉन की खोज की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">थॉमसन</span><span style=\"font-family:'Mangal'\"> के मॉडल में परमाणु धन आवेश का एक गोला है, जिसमें इलेक्ट्रॉन तरबूज़ के बीजों की तरह धँसे हैं; इलेक्ट्रॉनों का नाभिक के चारों ओर ग्रहों की तरह परिक्रमा करना </span><span style=\"font-weight:bold;font-family:'Mangal'\">रदरफ़ोर्ड</span><span style=\"font-family:'Mangal'\"> का मॉडल है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. स्वर्ण पन्नी प्रयोग से रदरफ़ोर्ड ने पाया कि नाभिक अत्यंत छोटा है, परमाणु से लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">5</span><span style=\"font-weight:bold;font-family:'Mangal'\"> (एक लाख) गुना छोटा</span><span style=\"font-family:'Mangal'\">: परमाणु का व्यास लगभग 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−10</span><span style=\"font-family:'Mangal'\"> m और नाभिक का लगभग 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−15</span><span style=\"font-family:'Mangal'\"> m है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रदरफ़ोर्ड के शिष्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">जेम्स चैडविक</span><span style=\"font-family:'Mangal'\"> ने नाभिक के उदासीन कण, </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूट्रॉन, की खोज 1932 में</span><span style=\"font-family:'Mangal'\"> की, जिससे परमाणुओं के अतिरिक्त द्रव्यमान की व्याख्या हुई → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक किसान 5 mL द्रव कीटनाशी को जल में मिलाकर 250 mL छिड़काव विलयन बनाता है। विलयन में कीटनाशी का आयतन-आयतन प्रतिशत है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब विलेय और विलयन दोनों द्रव हों, तो सांद्रता आयतन-आयतन प्रतिशत में व्यक्त की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयतन-आयतन प्रतिशत = (विलेय का आयतन / विलयन का आयतन) × 100.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कीटनाशी (विलेय) का आयतन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 mL</span><span style=\"font-family:'Mangal'\"> और छिड़काव विलयन का आयतन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">250 mL</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिशत = (5 / 250) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2%</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही अनुपात महत्वपूर्ण है: कम कीटनाशी फसल की रक्षा नहीं कर पाता और अधिक कीटनाशी उसे हानि पहुँचा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कीटनाशी का आयतन-आयतन प्रतिशत 2% है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वसन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यीस्ट में किण्वन के दौरान पाइरुवेट एथेनॉल और कार्बन डाइऑक्साइड में बदल जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वायवीय श्वसन में मुक्त होने वाली ऊर्जा अवायवीय श्वसन की तुलना में बहुत अधिक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रात में, जब प्रकाश संश्लेषण नहीं होता, पौधों में गैस विनिमय की मुख्य क्रिया कार्बन डाइऑक्साइड का निष्कासन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ग्लूकोज़ पहले कोशिकाद्रव्य में पाइरुवेट में टूटता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">यीस्ट</span><span style=\"font-family:'Mangal'\"> में ऑक्सीजन की अनुपस्थिति में पाइरुवेट </span><span style=\"font-weight:bold;font-family:'Mangal'\">एथेनॉल और कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> में बदल जाता है, और यही किण्वन है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वायवीय श्वसन में पाइरुवेट माइटोकॉन्ड्रिया में पूरी तरह कार्बन डाइऑक्साइड और जल में टूट जाता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुक्त होने वाली ऊर्जा</span><span style=\"font-family:'Mangal'\"> अवायवीय श्वसन की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत अधिक</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पौधों में गैस विनिमय विसरण द्वारा होता है, और उसकी दिशा परिस्थितियों पर निर्भर करती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">रात में</span><span style=\"font-family:'Mangal'\">, जब प्रकाश संश्लेषण नहीं होता, </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड का निष्कासन</span><span style=\"font-family:'Mangal'\"> मुख्य विनिमय है, जबकि दिन में ऑक्सीजन का निकलना → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सभी 1, 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परागकण के उपयुक्त वर्तिकाग्र पर पहुँचने के बाद नर जनन कोशिका बीजांड तक किसके द्वारा पहुँचती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फूल की पंखुड़ियों द्वारा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुंकेसर के तंतु द्वारा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तिका से होकर बढ़ती पराग नलिका द्वारा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाह्यदलों के संवहन ऊतक द्वारा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्त्रीकेसर के तीन भाग होते हैं: ऊपर चिपचिपा वर्तिकाग्र, बीच में लंबी वर्तिका और नीचे फूला हुआ अंडाशय, जिसमें बीजांड होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परागकण के उपयुक्त वर्तिकाग्र पर पहुँचने के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">परागकण से एक नलिका निकलती है</span><span style=\"font-family:'Mangal'\">, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्तिका से होकर</span><span style=\"font-family:'Mangal'\"> अंडाशय तक पहुँचती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नर जनन कोशिका इसी पराग नलिका से नीचे जाकर बीजांड में मादा युग्मक से मिलती है; यह मिलन निषेचन है, जिसके बाद युग्मनज भ्रूण में विकसित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पंखुड़ियाँ, पुंकेसर का तंतु और बाह्यदल नर जनन कोशिका को ले जाने में कोई भूमिका नहीं निभाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नर जनन कोशिका वर्तिका से होकर बढ़ती पराग नलिका द्वारा बीजांड तक पहुँचती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): अचार और मुरब्बे की तरह नमक या चीनी की अधिक सांद्रता में सुरक्षित रखे गए आँवले और नींबू आसानी से खराब नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): नमक या चीनी की अधिक सांद्रता एक अतिपरासरी (हाइपरटोनिक) वातावरण बनाती है, जो परासरण द्वारा खाद्य को खराब करने वाले बैक्टीरिया और कवकों से जल बाहर खींच लेता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अचार, मुरब्बा और शरबत आँवले और नींबू को नमक, चीनी या गुड़ के साथ सुरक्षित रखने की पारंपरिक विधियाँ हैं, और ऐसा भोजन महीनों तक खराब नहीं होता → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नमक या चीनी की अधिक सांद्रता वाला विलयन सूक्ष्मजीव की कोशिका के भीतरी भाग की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अतिपरासरी (हाइपरटोनिक)</span><span style=\"font-family:'Mangal'\"> होता है; बैक्टीरिया और कवकों की कोशिका झिल्ली से होकर जल </span><span style=\"font-weight:bold;font-family:'Mangal'\">परासरण</span><span style=\"font-family:'Mangal'\"> द्वारा बाहर निकल जाता है, अतः वे बढ़ और बहुगुणित नहीं हो पाते → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाद्य को खराब करने वाले सूक्ष्मजीवों से जल का यही निकलना भोजन को खराब होने से बचाता है, अतः R, A की सही व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने गोल बीज वाले लंबे मटर के पौधों का संकरण झुर्रीदार बीज वाले बौने मटर के पौधों से किया। F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> पीढ़ी में दोनों जनक प्रकारों के अतिरिक्त झुर्रीदार बीज वाले लंबे पौधे और गोल बीज वाले बौने पौधे भी मिले। इससे पता चलता है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबाई और गोल बीज सदैव एक साथ वंशागत होते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों लक्षण एक-दूसरे से स्वतंत्र रूप से वंशागत होते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">झुर्रीदार बीज गोल बीज पर प्रभावी हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> के पौधे झुर्रीदार बीज वाले बौने थे</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस संकरण में F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> के सभी पौधे गोल बीज वाले लंबे थे, अतः लंबाई और गोल बीज प्रभावी लक्षण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> के पौधों के स्व-परागण से बनी F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> पीढ़ी में ऐसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">नए संयोजन</span><span style=\"font-family:'Mangal'\"> दिखे जो किसी भी जनक में नहीं थे: झुर्रीदार बीज वाले लंबे पौधे और गोल बीज वाले बौने पौधे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे नए संयोजन तभी बन सकते हैं जब ऊँचाई का लक्षण और बीज के आकार का लक्षण </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-दूसरे से स्वतंत्र रूप से</span><span style=\"font-family:'Mangal'\"> आगे जाएँ; यदि वे सदैव साथ वंशागत होते, तो केवल दोनों जनक संयोजन ही दिखते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नए संयोजनों का दिखना बताता है कि दोनों लक्षण स्वतंत्र रूप से वंशागत होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): क्षितिज के पास देखने पर कोई तारा अपनी वास्तविक स्थिति से थोड़ा नीचे दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): वायुमंडल तारे के प्रकाश को अभिलंब की ओर मोड़ देता है, क्योंकि प्रकाश उत्तरोत्तर सघन होती वायु की परतों से गुज़रता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल में प्रवेश करने वाला तारे का प्रकाश ऊपर की विरल परतों से उत्तरोत्तर सघन होती नीचे की परतों में जाता है, अतः वह अधिकाधिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिलंब की ओर</span><span style=\"font-family:'Mangal'\"> अपवर्तित होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस मुड़ाव के कारण तारा उस स्थिति पर दिखाई देता है जहाँ से अपवर्तित प्रकाश आता प्रतीत होता है, जो उसकी वास्तविक स्थिति से </span><span style=\"font-weight:bold;font-family:'Mangal'\">थोड़ा ऊपर</span><span style=\"font-family:'Mangal'\"> है, नीचे नहीं → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी वायुमंडलीय अपवर्तन के कारण सूर्य वास्तविक सूर्योदय से लगभग दो मिनट पहले और वास्तविक सूर्यास्त के लगभग दो मिनट बाद तक दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समजातीय श्रेणी के विषय में निम्नलिखित में से कौन-सा कथन सत्य है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक क्रमागत सदस्य में -CH₂- समूह का अंतर होता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी सदस्यों के क्रियात्मक समूह भिन्न होते हैं।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी सदस्यों का आणविक भार समान होता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी सदस्यों का क्वथनांक समान होता है।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समजातीय श्रेणी कार्बन यौगिकों की ऐसी श्रेणी है जिसमें कार्बन शृंखला के एक हाइड्रोजन परमाणु का स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही क्रियात्मक समूह</span><span style=\"font-family:'Mangal'\"> लेता है, जैसे ऐल्केन CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> या एथीन से शुरू होने वाली ऐल्कीन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किन्हीं दो </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रमागत सदस्यों में −CH</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">− इकाई का अंतर</span><span style=\"font-family:'Mangal'\"> होता है, अर्थात् आणविक द्रव्यमान में 14 u का अंतर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सदस्यों का क्रियात्मक समूह एक ही होने के कारण उनके रासायनिक गुण समान होते हैं, जबकि गलनांक, क्वथनांक और विलेयता जैसे भौतिक गुण आणविक द्रव्यमान बढ़ने के साथ क्रमिक रूप से बदलते हैं; अतः सदस्यों का न आणविक भार समान होता है न क्वथनांक।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक क्रमागत सदस्य में −CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">− समूह का अंतर होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव मादा प्रजनन तंत्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. गर्भाशय गर्भाशय ग्रीवा (सर्विक्स) से होकर अंडवाहिनी में खुलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यदि अंडाणु निषेचित न हो, तो वह लगभग एक दिन तक जीवित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रजोधर्म (मासिक स्राव) प्रायः लगभग दो से आठ दिन तक चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दोनों अंडवाहिनियाँ मिलकर थैली जैसा लचीला गर्भाशय बनाती हैं, और गर्भाशय गर्भाशय ग्रीवा (सर्विक्स) से होकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">योनि</span><span style=\"font-family:'Mangal'\"> में खुलता है, अंडवाहिनी में नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अंडाशय हर महीने एक अंडाणु छोड़ता है; यदि अंडाणु </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषेचित न हो, तो वह लगभग एक दिन</span><span style=\"font-family:'Mangal'\"> तक जीवित रहता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जब निषेचन नहीं होता, तो गर्भाशय की मोटी हुई भित्ति टूटकर रक्त और श्लेष्मा के रूप में योनि से बाहर आती है; यह रजोधर्म लगभग हर महीने होता है और प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो से आठ दिन</span><span style=\"font-family:'Mangal'\"> तक चलता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर के विद्युत अपघटनी शोधन के लिए सामान्यतः अम्लीकृत _______ के विलयन का उपयोग विद्युत अपघट्य के रूप में किया जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर कार्बोनेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर क्लोराइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर ऑक्साइड</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत अपघटनी शोधन कॉपर, जस्ता, टिन, निकल, चाँदी और सोना जैसी अशुद्ध धातुओं के शोधन की सबसे अधिक प्रयुक्त विधि है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अशुद्ध धातु को ऐनोड, शुद्ध धातु की पतली पट्टी को कैथोड, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">धातु के लवण के विलयन</span><span style=\"font-family:'Mangal'\"> को विद्युत अपघट्य बनाया जाता है; कॉपर के लिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्लीकृत कॉपर सल्फेट का विलयन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा प्रवाहित करने पर ऐनोड का कॉपर विद्युत अपघट्य में घुलता है और उतनी ही मात्रा में शुद्ध कॉपर कैथोड पर जमा हो जाता है, जबकि अशुद्धियाँ ऐनोड पंक के रूप में नीचे बैठ जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर कार्बोनेट और कॉपर ऑक्साइड जल में अघुलनशील हैं, और कॉपर क्लोराइड इस प्रक्रम में प्रयुक्त विद्युत अपघट्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्युत अपघट्य अम्लीकृत कॉपर सल्फेट का विलयन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा उद्योग में पराश्रव्य ध्वनि का उपयोग है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तुओं का भार हल्का करना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेफ्रिजरेटर में ठंडा करने के लिए उपयोग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातु के ब्लॉकों में दरारों का पता लगाना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठोसों में ध्वनि की चाल बढ़ाना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पराश्रव्य तरंगें 20 kHz से अधिक आवृत्ति की ध्वनि तरंगें हैं, और ये अवरोधों की उपस्थिति में भी सुनिश्चित पथ पर चल सकती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उद्योग में इनका उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">धातु के ब्लॉकों में दरारों और दोषों का पता लगाने</span><span style=\"font-family:'Mangal'\"> के लिए किया जाता है: पराश्रव्य तरंगें ब्लॉक से होकर भेजी जाती हैं और दूसरी ओर संसूचक उन्हें ग्रहण करते हैं; दरार तरंगों को परावर्तित कर देती है, अतः वह संकेत में एक खाली स्थान के रूप में दिखाई देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पराश्रव्य ध्वनि का उपयोग पराश्रव्य वेल्डिंग, मशीनों के नाज़ुक पुर्ज़ों की सफ़ाई, और तरंगों के परावर्तन से वस्तुओं का पता लगाने में भी होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह किसी वस्तु का भार नहीं बदल सकती, रेफ्रिजरेटर को ठंडा करने में इसकी कोई भूमिका नहीं है, और यह ठोस में ध्वनि की चाल नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धातु के ब्लॉकों में दरारों का पता लगाना पराश्रव्य ध्वनि का औद्योगिक उपयोग है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत धारा के तापीय प्रभाव के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दिए गए प्रतिरोध के लिए प्रतिरोधक में उत्पन्न ऊष्मा धारा के वर्ग के समानुपाती होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दी गई धारा के लिए प्रतिरोधक में उत्पन्न ऊष्मा उसके प्रतिरोध के व्युत्क्रमानुपाती होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विद्युत हीटर की डोरी (कॉर्ड) इसलिए नहीं चमकती क्योंकि उसका प्रतिरोध तापन अवयव की तुलना में बहुत कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जूल के तापन नियम के अनुसार H = I</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">Rt, अतः दिए गए प्रतिरोध और समय के लिए ऊष्मा </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारा के वर्ग के समानुपाती</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इसी नियम से, दी गई धारा और समय के लिए ऊष्मा </s
