pan><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिरोध के समानुपाती</span><span style=\"font-family:'Mangal'\"> होती है, व्युत्क्रमानुपाती नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. डोरी और तापन अवयव में एक ही धारा बहती है, परंतु मोटे कॉपर के तार से बनी डोरी का प्रतिरोध </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत कम</span><span style=\"font-family:'Mangal'\"> होता है, अतः उसमें बहुत कम ऊष्मा उत्पन्न होती है और वह नहीं चमकती, जबकि उच्च प्रतिरोध वाला अवयव लाल-गरम हो जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम नाइट्रेट (NH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">NO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">) का उपयोग नाइट्रोजन उर्वरक के रूप में किया जाता है। इसका सूत्र इकाई द्रव्यमान है (परमाणु द्रव्यमान: N = 14 u, H = 1 u, O = 16 u):</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66 u</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">78 u</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 u</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">94 u</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम नाइट्रेट एक आयनिक यौगिक है, अतः उसकी सूत्र इकाई का द्रव्यमान NH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">NO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> के सभी परमाणुओं के परमाणु द्रव्यमान जोड़कर निकाला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन: 2 परमाणु × 14 u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन: 4 परमाणु × 1 u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन: 3 परमाणु × 16 u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूत्र इकाई द्रव्यमान = 28 + 4 + 48 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अमोनियम नाइट्रेट का सूत्र इकाई द्रव्यमान 80 u है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790409728382_image001.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सौर पैनल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश ऊर्जा से विद्युत ऊर्जा</span><span style=\"font-family:'Mangal'\">: पैनल पर पड़ने वाला सूर्य का प्रकाश विद्युत धारा उत्पन्न करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">माचिस की तीली का जलना</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक ऊर्जा से ऊष्मा और प्रकाश ऊर्जा</span><span style=\"font-family:'Mangal'\">: तीली के सिरे में संचित रासायनिक ऊर्जा ऊष्मा और प्रकाश के रूप में मुक्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बाँध से नीचे बहता जल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थितिज ऊर्जा से गतिज ऊर्जा</span><span style=\"font-family:'Mangal'\">: ऊँचाई पर संचित जल गिरते समय चाल प्राप्त करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जलता हुआ विद्युत बल्ब</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत ऊर्जा से प्रकाश और ऊष्मा ऊर्जा</span><span style=\"font-family:'Mangal'\">: तंतु गरम होकर प्रकाश देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">800 kg द्रव्यमान की एक कार समतल सड़क पर विराम से चलकर 9 s में 54 km/h की चाल प्राप्त कर लेती है। इस दौरान उसके इंजन द्वारा विकसित औसत शक्ति है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 kW</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 kW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 kW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 kW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले चाल बदलिए: v = 54 km/h = 54 × (5/18) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार विराम से चलती है (u = 0), अतः इंजन द्वारा किया गया कार्य कार की अंतिम गतिज ऊर्जा के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किया गया कार्य = (1/2) × m × v</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (1/2) × 800 × 15 × 15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 400 × 225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90,000 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति = किया गया कार्य / लगा समय = 90,000 / 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,000 W = 10 kW</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विकसित औसत शक्ति 10 kW है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकट दृष्टि दोष (मायोपिया) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निकट दृष्टि दोष वाली आँख में दूर की वस्तु का प्रतिबिंब रेटिना के सामने बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. निकट दृष्टि दोष नेत्र गोलक के लंबा हो जाने के कारण हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निकट दृष्टि दोष को उपयुक्त शक्ति के उत्तल लेंस से ठीक किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निकट दृष्टि दोष वाला व्यक्ति पास की वस्तुएँ स्पष्ट देख सकता है परंतु दूर की नहीं, क्योंकि दूर की वस्तु का प्रतिबिंब रेटिना पर न बनकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेटिना के सामने</span><span style=\"font-family:'Mangal'\"> बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. निकट दृष्टि दोष </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेत्र लेंस की अत्यधिक वक्रता</span><span style=\"font-family:'Mangal'\"> या </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेत्र गोलक के लंबा हो जाने</span><span style=\"font-family:'Mangal'\"> के कारण हो सकता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निकट दृष्टि दोष को उपयुक्त शक्ति के </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल लेंस</span><span style=\"font-family:'Mangal'\"> से ठीक किया जाता है, जो प्रतिबिंब को वापस रेटिना पर ले आता है; उत्तल लेंस दूर दृष्टि दोष में प्रयोग होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल के ऊपरी स्तरों में उपस्थित ओज़ोन पृथ्वी के जीवों की किससे रक्षा करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्साइडों से होने वाली अम्लीय वर्षा से</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवरक्त किरणों से होने वाले अत्यधिक तापन से</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतरिक्ष से आने वाली रेडियो तरंगों से</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के पराबैंगनी विकिरण से</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन (O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">) ऑक्सीजन के तीन परमाणुओं से बना अणु है; भूमि के स्तर पर यह विष है, परंतु वायुमंडल के ऊपरी स्तरों में यह एक आवश्यक कार्य करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन परत </span><span style=\"font-weight:bold;font-family:'Mangal'\">पृथ्वी की सतह को सूर्य के पराबैंगनी (UV) विकिरण से बचाती है</span><span style=\"font-family:'Mangal'\">, जो जीवों के लिए अत्यंत हानिकारक है: उदाहरण के लिए, यह त्वचा का कैंसर कर सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन अम्लीय वर्षा को नहीं रोकती, यह अवरक्त तापन के विरुद्ध ढाल नहीं है, और रेडियो तरंगें जीवन के लिए हानिकारक नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ओज़ोन जीवों की सूर्य के पराबैंगनी विकिरण से रक्षा करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): नाल चुंबक के ध्रुवों के बीच लटकाई गई धारावाही ऐलुमिनियम की छड़ धारा चालू करते ही विस्थापित हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): चुंबक केवल लोहे और निकल जैसे चुंबकीय पदार्थों पर ही बल लगाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब प्रबल नाल चुंबक के ध्रुवों के बीच स्वतंत्र रूप से लटकी हल्की ऐलुमिनियम की छड़ में धारा प्रवाहित की जाती है, तो छड़ </span><span style=\"font-weight:bold;font-family:'Mangal'\">विस्थापित</span><span style=\"font-family:'Mangal'\"> हो जाती है, और धारा की दिशा उलटने पर विस्थापन की दिशा भी उलट जाती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम चुंबकीय पदार्थ नहीं है, अतः यह बल चुंबक द्वारा लोहे के साधारण आकर्षण जैसा नहीं है; यह वह बल है जो चुंबकीय क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारावाही चालक</span><span style=\"font-family:'Mangal'\"> पर लगाता है, जैसा ऐम्पियर ने सुझाया था, और यह धारा द्वारा चुंबक पर लगाए गए बल के बराबर और विपरीत है → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही चालक पर लगने वाला यही बल विद्युत मोटर का कार्य सिद्धांत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 kg द्रव्यमान की एक बंदूक से 20 g द्रव्यमान की गोली चलाई जाती है। गोली चलते समय बंदूक और गोली एक-दूसरे पर 4 N का बल लगाती हैं। गोली का आरंभिक त्वरण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के तीसरे नियम के अनुसार गोली पर लगने वाला बल और बंदूक पर लगने वाला बल परिमाण में बराबर, </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 N</span><span style=\"font-family:'Mangal'\"> प्रत्येक, और दिशा में विपरीत होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोली का द्रव्यमान m = 20 g = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.02 kg</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोली का त्वरण = F / m = 4 / 0.02 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">200 m/s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तुलना के लिए, बंदूक का त्वरण = 4 / 2 = 2 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">, इसीलिए बंदूक का प्रतिक्षेप (झटका) छोटा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बराबर बल बहुत भिन्न त्वरण उत्पन्न करते हैं, क्योंकि द्रव्यमान बहुत भिन्न हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गोली का आरंभिक त्वरण 200 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा यौगिक शुष्क बुझे हुए चूने (Ca(OH)₂) पर क्लोरीन की क्रिया से बनता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साधारण नमक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्लीचिंग सोडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धावन सोडा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विरंजक चूर्ण (ब्लीचिंग पाउडर)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्लोर-क्षार प्रक्रम से प्राप्त क्लोरीन शुष्क बुझे हुए चूने से अभिक्रिया करके विरंजक चूर्ण बनाती है: Ca(OH)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> + Cl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> → CaOCl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विरंजक चूर्ण</span><span style=\"font-family:'Mangal'\"> (CaOCl</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) का उपयोग वस्त्र उद्योग में सूती और लिनन कपड़ों, कागज़ के कारखानों में लकड़ी की लुगदी और धुलाईघरों में धुले कपड़ों के विरंजन में, रासायनिक उद्योगों में ऑक्सीकारक के रूप में, और पीने के जल को रोगाणुमुक्त करने में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साधारण नमक NaCl है, धावन सोडा Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O है, और ब्लीचिंग सोडा नाम का कोई यौगिक नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बनने वाला यौगिक विरंजक चूर्ण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पवनों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पवन उच्च दाब के क्षेत्र से निम्न दाब के क्षेत्र की ओर वायु की गति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पृथ्वी के घूर्णन के कारण ग्रहीय पवनें सीधे पथ पर चलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दिन के समय सूर्य की ओर वाले पर्वतीय ढलान घाटी के तल की अपेक्षा अधिक तेज़ी से गरम होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वायु </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च दाब के क्षेत्र से निम्न दाब के क्षेत्र</span><span style=\"font-family:'Mangal'\"> की ओर चलती है, और वायु की यही गति पवन है; दाब का यह अंतर मुख्यतः सूर्य द्वारा पृथ्वी की सतह के असमान तापन से उत्पन्न होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पृथ्वी का घूर्णन ग्रहीय पवनों को उनके सीधे पथ से </span><span style=\"font-weight:bold;font-family:'Mangal'\">विक्षेपित</span><span style=\"font-family:'Mangal'\"> कर देता है, अतः वे सीधे नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">वक्र</span><span style=\"font-family:'Mangal'\"> पथ पर चलती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पर्वतीय क्षेत्रों में ढलान और घाटी का तल एक समान दर से गरम नहीं होते; दिन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य की ओर वाले ढलान</span><span style=\"font-family:'Mangal'\"> घाटी के तल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">तेज़ी से गरम</span><span style=\"font-family:'Mangal'\"> होते हैं, उनके ऊपर की वायु ऊपर उठती है, और घाटी की ठंडी वायु घाटी समीर के रूप में ढलान पर ऊपर चढ़ती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़कों और लड़कियों में यौवनारंभ से जुड़े परिवर्तन क्रमशः किसके स्रावण के कारण होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एड्रीनलिन और इंसुलिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टेस्टोस्टेरॉन और एस्ट्रोजन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एस्ट्रोजन और टेस्टोस्टेरॉन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थायरॉक्सिन और वृद्धि हार्मोन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लगभग 10 से 12 वर्ष की आयु में यौवनारंभ शरीर में ऐसे परिवर्तन लाता है, जिन्हें लिंग ग्रंथियों के हार्मोन नियंत्रित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लड़कों</span><span style=\"font-family:'Mangal'\"> में ये परिवर्तन वृषणों से स्रावित </span><span style=\"font-weight:bold;font-family:'Mangal'\">टेस्टोस्टेरॉन</span><span style=\"font-family:'Mangal'\"> के कारण होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लड़कियों</span><span style=\"font-family:'Mangal'\"> में ये परिवर्तन अंडाशयों से स्रावित </span><span style=\"font-weight:bold;font-family:'Mangal'\">एस्ट्रोजन</span><span style=\"font-family:'Mangal'\"> के कारण होते हैं, जो मादा जनन अंगों के विकास और मासिक चक्र के नियमन के लिए भी उत्तरदायी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एड्रीनलिन शरीर को आपात स्थिति के लिए तैयार करता है, इंसुलिन रक्त शर्करा का नियमन करता है, थायरॉक्सिन उपापचय का और वृद्धि हार्मोन सामान्य वृद्धि का; इनमें से कोई यौवनारंभ के परिवर्तन नहीं लाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये हार्मोन क्रमशः टेस्टोस्टेरॉन और एस्ट्रोजन हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790409728382_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(iii), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कंधा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंदुक-खल्लिका जोड़</span><span style=\"font-family:'Mangal'\">: एक हड्डी का गोल सिरा दूसरी हड्डी के प्याले में बैठता है, जिससे आगे, पीछे, बगल में और गोलाकार गति संभव होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">घुटना</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">कब्जा (हिंज) जोड़</span><span style=\"font-family:'Mangal'\">: यह दरवाज़े के कब्जे की तरह केवल एक तल में गति होने देता है, और घुटने की टोपी (नीकैप) नामक छोटी हड्डी इसकी रक्षा करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गर्दन</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">धुराग्र (पिवट) जोड़</span><span style=\"font-family:'Mangal'\">: यह रीढ़ के ऊपरी सिरे पर सिर को दाएँ-बाएँ घुमाने देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">खोपड़ी की हड्डियाँ</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अचल जोड़</span><span style=\"font-family:'Mangal'\">: खोपड़ी की चपटी हड्डियाँ इस प्रकार जुड़ी होती हैं कि हिल नहीं सकतीं, जिससे मस्तिष्क सुरक्षित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब ठोस लेड(II) नाइट्रेट को गरम किया जाता है, तो पीला अवशेष (PbO) बचता है और दो गैसें निकलती हैं, एक लाल-भूरी है और दूसरी दहन में सहायक है। कौन-सी गैसें निकलती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन डाइऑक्साइड और ऑक्सीजन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रिक ऑक्साइड और ऑक्सीजन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन गैस और कार्बन डाइऑक्साइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन डाइऑक्साइड और हाइड्रोजन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड नाइट्रेट को गरम करना एक ऊष्मीय अपघटन अभिक्रिया है: 2Pb(NO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">(s) → 2PbO(s) + 4NO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">(g) + O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लाल-भूरा धुआँ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन डाइऑक्साइड (NO</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">)</span><span style=\"font-family:'Mangal'\"> है, और जो गैस </span><span style=\"font-weight:bold;font-family:'Mangal'\">दहन में सहायक</span><span style=\"font-family:'Mangal'\"> है वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन (O</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">)</span><span style=\"font-family:'Mangal'\"> है; बचा हुआ पीला ठोस लेड ऑक्साइड (PbO) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रिक ऑक्साइड रंगहीन है, नाइट्रेट से नाइट्रोजन गैस और कार्बन डाइऑक्साइड नहीं बनतीं, और हाइड्रोजन दहन में सहायक होने के बजाय स्वयं जलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निकलने वाली गैसें नाइट्रोजन डाइऑक्साइड और ऑक्सीजन हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): यदि हमारे द्वारा उत्पन्न सारा अपशिष्ट जैव निम्नीकरणीय होता, तब भी उसका पर्यावरण पर प्रभाव पड़ता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): बड़ी मात्रा में डाला गया जैव निम्नीकरणीय अपशिष्ट अपघटित होने में समय लेता है, और अपघटित होने तक वह आसपास के परिवेश को प्रदूषित करता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैव निम्नीकरणीय पदार्थ बैक्टीरिया और अन्य अपघटकों की क्रिया जैसी जैविक प्रक्रियाओं से टूटते हैं, परंतु इस टूटने में </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय</span><span style=\"font-family:'Mangal'\"> लगता है → A सत्य है, क्योंकि उस समय तक अपशिष्ट पड़ा रहता है और पर्यावरण को प्रभावित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब ऐसा अपशिष्ट </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़ी मात्रा</span><span style=\"font-family:'Mangal'\"> में डाला जाता है, तो उसके ढेर धीरे-धीरे अपघटित होते हैं; पड़े रहने के दौरान वे दुर्गंध और गैसें छोड़ते हैं, मक्खियों और रोग फैलाने वाले अन्य जीवों के प्रजनन का स्थान बनते हैं, और मिट्टी तथा जल को प्रदूषित कर सकते हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपशिष्ट के ढेरों का यही धीमा अपघटन प्रभाव का कारण है, अतः R, A की व्याख्या करता है; स्रोत पर ही अपशिष्ट घटाना और उसकी खाद बनाना इसे सीमित करने का उपाय है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक उत्तल लेंस (−2) का आवर्धन उत्पन्न करता है, जब वस्तु को उससे X cm की दूरी पर रखा जाता है। यदि प्रतिबिंब की दूरी 40 cm हो, तो X का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">− 80 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">− 20 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+ 20 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+ 80 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस के लिए आवर्धन m = h'/h = v/u, जहाँ v प्रतिबिंब की दूरी और u वस्तु की दूरी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्धन m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> और प्रतिबिंब की दूरी v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+40 cm</span><span style=\"font-family:'Mangal'\"> (प्रतिबिंब वास्तविक है, लेंस की दूसरी ओर)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−2 = 40 / u</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">u = 40 / (−2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक चिह्न दिखाता है कि वस्तु लेंस के बाईं ओर है, और ऋणात्मक आवर्धन दिखाता है कि प्रतिबिंब वास्तविक, उल्टा और वस्तु से दोगुने आकार का है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X का मान −20 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी वस्तु द्वारा तय की गई दूरी उसके विस्थापन के परिमाण से कम हो सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चाल एक अदिश राशि है, क्योंकि उसे केवल संख्यात्मक मान से व्यक्त किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विस्थापन की दिशा पहले क्षण की स्थिति से दूसरे क्षण की स्थिति की ओर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. विस्थापन दो स्थितियों के बीच की न्यूनतम दूरी है, अतः पथ के साथ वास्तव में तय की गई दूरी विस्थापन के परिमाण के </span><span style=\"font-weight:bold;font-family:'Mangal'\">सदैव बराबर या उससे अधिक</span><span style=\"font-family:'Mangal'\"> होती है, कम कभी नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जिन भौतिक राशियों को केवल उनके संख्यात्मक मान से व्यक्त किया जाता है, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अदिश</span><span style=\"font-family:'Mangal'\"> कहलाती हैं; चाल अदिश है, जबकि वेग, विस्थापन और त्वरण सदिश हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विस्थापन की दिशा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहले क्षण की स्थिति से दूसरे क्षण की स्थिति की ओर</span><span style=\"font-family:'Mangal'\"> होती है; सीधी रेखा में गति के लिए इसे + या − चिह्न से दर्शाया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहे के एक परमाणु में 26 प्रोटॉन और 30 न्यूट्रॉन हैं। उसकी द्रव्यमान संख्या और उदासीन परमाणु में इलेक्ट्रॉनों की संख्या क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 और 26</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 और 26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 और 30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26 और 56</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान संख्या A नाभिक में प्रोटॉनों और न्यूट्रॉनों की कुल संख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 26 + 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">56</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु संख्या Z प्रोटॉनों की संख्या है, अतः Z = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु के विद्युत उदासीन होने के लिए इलेक्ट्रॉनों की संख्या प्रोटॉनों की संख्या के बराबर होनी चाहिए, अतः लोहे के परमाणु में </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानक संकेतन में इस परमाणु को Fe के बाईं ओर ऊपर 56 और नीचे 26 लिखकर दर्शाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः द्रव्यमान संख्या 56 और इलेक्ट्रॉनों की संख्या 26 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकांगों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. माइटोकॉन्ड्रिया की भीतरी झिल्ली अंगुली जैसे उभारों में मुड़ी होती है, जिन्हें क्रिस्टी कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कोशिकीय श्वसन के दौरान मुक्त हुई ऊर्जा ATP के रूप में संचित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. क्लोरोप्लास्ट केवल एक झिल्ली से घिरा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रत्येक माइटोकॉन्ड्रिया में दो झिल्लियाँ होती हैं; बाहरी झिल्ली चिकनी और सछिद्र होती है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">भीतरी झिल्ली अंगुली जैसे उभारों में मुड़ी होती है, जिन्हें क्रिस्टी कहते हैं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. माइटोकॉन्ड्रिया में कोशिकीय श्वसन के दौरान ग्लूकोज़ और अन्य अणु टूटते हैं, और मुक्त हुई ऊर्जा कोशिका की ऊर्जा मुद्रा </span><span style=\"font-weight:bold;font-family:'Mangal'\">ATP</span><span style=\"font-family:'Mangal'\"> में संचित होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. क्लोरोप्लास्ट भी माइटोकॉन्ड्रिया की तरह </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोहरी झिल्ली से घिरा</span><span style=\"font-family:'Mangal'\"> कोशिकांग है, जिसके भीतर अर्ध-तरल स्ट्रोमा होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पनीर बनाने के लिए गरम दूध में थोड़ा नींबू का रस या सिरका मिलाया जाता है और दूध के ठोस पदार्थ अलग हो जाते हैं। जिस प्रक्रिया से दूध के ठोस पदार्थ अलग होते हैं, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्कंदन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊर्ध्वपातन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध एक कोलॉइड है, जिसमें प्रोटीन और वसा के सूक्ष्म कण जल में परिक्षिप्त रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब गरम दूध में नींबू का रस या सिरका जैसा अम्ल मिलाया जाता है, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्कंदक</span><span style=\"font-family:'Mangal'\"> का काम करता है: परिक्षिप्त कण आपस में जुड़कर बड़े पिंड बनाते हैं और पनीर के रूप में अलग हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे निलंबित या परिक्षिप्त कणों का आपस में जुड़कर बड़े पिंड बनाना, जिन्हें अलग किया जा सके, </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्कंदन</span><span style=\"font-family:'Mangal'\"> कहलाता है; गंदले जल में निलंबित अशुद्धियों को स्कंदित करने के लिए फिटकरी का प्रयोग इसी प्रकार किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण संतृप्त विलयन से क्रिस्टल बनाता है, ऊर्ध्वपातन ठोस को सीधे वाष्प में बदलता है, और आसवन द्रवों को क्वथनांक के आधार पर अलग करता है; यहाँ इनमें से कोई प्रक्रिया नहीं होती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूध के ठोस पदार्थ स्कंदन द्वारा अलग होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,350 को A, B और C में इस प्रकार बाँटा जाता है कि यदि उनके हिस्सों में से क्रमशः ₹50, ₹40 और ₹60 निकाल लिए जाएँ, तो शेष राशियाँ 3 : 4 : 5 के अनुपात में हों। B का मूल हिस्सा कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,440</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,810</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,100</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले तीनों निश्चित राशियाँ निकाल दें, क्योंकि अनुपात केवल शेष राशियों का है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकाली गई कुल राशि = ₹50 + ₹40 + ₹60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹150</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष कुल राशि = ₹4,350 − ₹150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह ₹4,200, 3 : 4 : 5 के अनुपात में है, जिसमें 3 + 4 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 भाग</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक भाग = 4,200 / 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹350</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B की शेष राशि = 4 × ₹350 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B का मूल हिस्सा = ₹1,400 + ₹40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A = 1,050 + 50 = 1,100, C = 1,750 + 60 = 1,810 तथा 1,100 + 1,440 + 1,810 = 4,350 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः B का मूल हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": "" </p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कमरा 8 m लंबा, 6 m चौड़ा और 4 m ऊँचा है। इसमें 2 m × 1 m आकार का एक दरवाजा और 1.5 m × 1 m आकार की दो खिड़कियाँ हैं। ₹25 प्रति m² की दर से कमरे की चारों दीवारों पर कागज लगाने का खर्च कितना होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,675</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,550</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,700</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले चारों दीवारों का क्षेत्रफल ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों दीवारों का क्षेत्रफल = 2 × ऊँचाई × (लंबाई + चौड़ाई)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 4 × (8 + 6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 8 × 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">112 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दरवाजे और खिड़कियों पर कागज नहीं लगता, अतः उनका क्षेत्रफल घटाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दरवाजे का क्षेत्रफल = 2 × 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों खिड़कियों का क्षेत्रफल = 2 × (1.5 × 1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कागज लगाने का क्षेत्रफल = 112 − 2 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">107 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खर्च = 107 × ₹25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,675</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दीवारों पर कागज लगाने का खर्च </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,675 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B और C एक कार्य को क्रमशः 10, 15 और 30 दिन में कर सकते हैं। तीनों मिलकर कार्य शुरू करते हैं। A 2 दिन बाद कार्य छोड़ देता है और B कार्य पूरा होने से 3 दिन पहले कार्य छोड़ देता है। कार्य कितने दिन में पूरा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भिन्नों से बचने के लिए कुल कार्य 10, 15 और 30 का LCM (लघुत्तम समापवर्त्य) लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A प्रतिदिन 30 / 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 इकाई</span><span style=\"font-family:'Mangal'\">, B प्रतिदिन 30 / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 इकाई</span><span style=\"font-family:'Mangal'\"> तथा C प्रतिदिन 30 / 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 इकाई</span><span style=\"font-family:'Mangal'\"> कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना कार्य T दिन में पूरा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 2 दिन कार्य करता है: 3 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C पूरे T दिन कार्य करता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">T इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B (T − 3) दिन कार्य करता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">2(T − 3) इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 + T + 2(T − 3) = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 + T + 2T − 6 = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3T = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: A (3 × 2) = 6, B (2 × 7) = 14, C (1 × 10) = 10; 6 + 14 + 10 = 30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> दिन में पूरा होता है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19 और 57 के HCF (महत्तम समापवर्तक) और LCM (लघुत्तम समापवर्त्य) का योग क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">76</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले बड़ी संख्या का गुणनखंड करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57 = 3 × 19, अतः 19, 57 को पूर्णतः विभाजित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब एक संख्या दूसरी को विभाजित करती है, तो छोटी संख्या HCF (महत्तम समापवर्तक) और बड़ी संख्या LCM (लघुत्तम समापवर्त्य) होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = </span><span style=\"font-weight:bold;font-family:'Mangal'\">57</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योग = 19 + 57 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">76</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: HCF × LCM = 19 × 57 = 1,083 = 19 × 57, जो दोनों संख्याओं का गुणनफल है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः HCF और LCM का योग </span><span style=\"font-weight:bold;font-family:'Mangal'\">76 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B से दोगुना कार्यकुशल है। एक साथ कार्य करते हुए वे एक कार्य को 12 दिन में पूरा कर सकते हैं। A अकेला उस कार्य को कितने दिन में पूरा कर सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनकी कार्यकुशलता से उनके प्रतिदिन के कार्य की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना B प्रतिदिन </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 इकाई</span><span style=\"font-family:'Mangal'\"> कार्य करता है, अतः A प्रतिदिन </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 इकाई</span><span style=\"font-family:'Mangal'\"> कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों मिलकर प्रतिदिन 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 इकाई</span><span style=\"font-family:'Mangal'\"> कार्य करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 दिन में वे पूरा कार्य कर देते हैं, अतः कुल कार्य = 12 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A अकेला प्रतिदिन 2 इकाई कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A अकेले का समय = 36 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: B अकेला 36 दिन लेगा तथा 1/18 + 1/36 = 3/36 = 1/12 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A अकेला उस कार्य को </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> दिन में पूरा कर सकता है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक महामारी में एक नगर की जनसंख्या का 8% भाग मर गया और फिर शेष जनसंख्या का 15% भाग नगर छोड़कर चला गया। नगर की जनसंख्या अब 78,200 है। महामारी से पहले जनसंख्या कितनी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,00,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,02,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,10,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना मूल जनसंख्या P है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8% के मरने के बाद जनसंख्या P × 92% रह गई।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर इस शेष का 15% भाग चला गया, अतः इसका 85% भाग बचा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान जनसंख्या = P × 92% × 85%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92% × 85% = (92/100) × (85/100) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">78.2%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P × 78.2% = 78,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = (78,200 / 78.2) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,000 × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,00,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 1,00,000 का 8% = 8,000 मरे, 92,000 बचे; 92,000 का 15% = 13,800 चले गए, 92,000 − 13,800 = 78,200 बचे ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः महामारी से पहले जनसंख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,00,000 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> थी।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि x + y + z = 9 और xy + yz + zx = 26 है, तो x² + y² + z² का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन पदों के योग के वर्ग की सर्वसमिका का प्रयोग करने पर,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + y + z)² = x² + y² + z² + 2(xy + yz + zx)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + y + z = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> तथा xy + yz + zx \"font-family:'Mangal'\">दीपक की पूँजी पहले 4 महीने ₹50,000 और फिर शेष 8 महीने ₹25,000 रही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीपक का पूँजी-महीना योग = (50,000 × 4) + (25,000 × 8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2,00,000 + 2,00,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,00,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईशा का पूँजी-महीना योग = 40,000 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,80,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ का अनुपात = 4,00,000 : 4,80,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 : 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भाग = 5 + 6 = 11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईशा का हिस्सा = ₹22,000 × (6/11) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लाभ में ईशा का हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह छोटी से छोटी प्राकृत संख्या कौन-सी है जिसे 2,500 में जोड़ने पर प्राप्त संख्या को 12, 15, 18 और 20 में से प्रत्येक से भाग देने पर शेषफल 3 बचे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो संख्या प्रत्येक भाजक से भाग देने पर शेषफल 3 छोड़ती है, वह भाजकों के किसी उभयनिष्ठ गुणज से 3 अधिक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले 12, 15, 18 और 20 का LCM (लघुत्तम समापवर्त्य) ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 = 2² × 3, 15 = 3 × 5, 18 = 2 × 3², 20 = 2² × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2² × 3² × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">180</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 180 का वह पहला गुणज ज्ञात करें जो 2,500 से कम न हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,500 = (180 × 13) + 160, अतः अगला गुणज 180 × 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,520</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट संख्या = 2,520 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,523</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जोड़ी ;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक केले का क्रय मूल्य = 4,320 / 1,440 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक केले का विक्रय मूल्य = 18 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3.60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक केले पर लाभ = ₹3.60 − ₹3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹0.60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ प्रतिशत = (लाभ / क्रय मूल्य) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (0.60 / 3) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: कुल विक्रय मूल्य = 1,440 × ₹3.60 = ₹5,184 तथा (5,184 − 4,320) / 4,320 = 864 / 4,320 = 20% ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसका लाभ प्रतिशत </span><span style=\"font-weight:bold;font-family:'Mangal'\">20% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो रेलगाड़ियाँ स्टेशन P और Q से एक ही समय चलकर क्रमशः 60 km/h और 40 km/h की चाल से एक-दूसरे की ओर बढ़ती हैं। जब वे मिलती हैं, तब तेज रेलगाड़ी ने धीमी रेलगाड़ी से 60 km अधिक दूरी तय की होती है। P और Q के बीच की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">250 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">360 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 km</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने तक दोनों रेलगाड़ियाँ समान समय तक चलती हैं, माना t घंटे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तेज रेलगाड़ी द्वारा तय दूरी = 60t km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धीमी रेलगाड़ी द्वारा तय दूरी = 40t km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर 60 km दिया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60t − 40t = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20t = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और Q के बीच की दूरी = दोनों दूरियों का योग</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (60 + 40) × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 3 घंटे में रेलगाड़ियाँ 180 km और 120 km चलती हैं तथा 180 − 120 = 60 km ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P और Q के बीच की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 km (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि किसी संख्या के 24% का 15%, 108 है, तो वह संख्या क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,600</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना संख्या x है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x के 24% का 15% = 108</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले दोनों प्रतिशतों को गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15% × 24% = (15/100) × (24/100) = 360/10,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.6%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का 3.6% = 108</s
