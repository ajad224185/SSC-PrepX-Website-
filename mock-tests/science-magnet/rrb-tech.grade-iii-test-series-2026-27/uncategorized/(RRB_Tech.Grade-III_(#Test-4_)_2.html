le=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LAP → SHW: L + 7 = S, A + 7 = H, P + 7 = W → every letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAT → C + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, A + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, T + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (20 + 7 = 27 → 1 = A)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair is </span><span style=\"font-weight:bold;font-family:'Mangal'\">CAT : JHA (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ankur starts from Point A and drives 11 km towards east. He then takes a right turn, drives 7 km, turns right and drives 14 km. He then takes a right turn and drives 12 km. He takes a final right turn, drives 3 km and stops at Point P. How far (shortest distance) and towards which direction should he drive in order to reach Point A again? (All turns are 90° turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km to the south</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 km to the north</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km to the north</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 km to the south</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take A as the origin; east = +x, north = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 km east → (11, 0)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn → south, 7 km → (11, −7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn → west, 14 km → (−3, −7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn → north, 12 km → (−3, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn → east, 3 km → P = (0, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is 5 km directly </span><span style=\"font-weight:bold;font-family:'Mangal'\">north</span><span style=\"font-family:'Mangal'\"> of A, so he must drive 5 km </span><span style=\"font-weight:bold;font-family:'Mangal'\">south</span><span style=\"font-family:'Mangal'\"> to reach A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he should drive </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 km to the south (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Refer to the given letter series and answer the question that follows. Counting to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Left) K A M B R I T O L Z E N D U P A S H E C O B (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many such consonants are there, each of which is immediately preceded by a consonant and also immediately followed by a vowel?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look for the pattern consonant – </span><span style=\"font-weight:bold;font-family:'Mangal'\">consonant</span><span style=\"font-family:'Mangal'\"> – vowel, and count the middle consonant.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> I → R (position 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\"> E → Z (position 10)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> U → D (position 13)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> E → H (position 18)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No other consonant has a consonant before it and a vowel after it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, there are </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> such consonants </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A cylinder of height 72 cm and base radius 16 cm is melted to form a sphere. Find the radius of the sphere.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of cylinder = πr²h = π × 16² × 72 = π × 256 × 72 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18,432π cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of sphere = (4/3)πR³ = 18,432π → R³ = (18,432 × 3) / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13,824</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = ∛13,824 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 cm</span><span style=\"font-family:'Mangal'\"> (since 24³ = 13,824)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the radius of the sphere is </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 cm (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The average temperature of first 3 days in a week was 36°C and the average temperature of this week was 35°C. Then the average temperature of last 4 days in this week was:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35.5°C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34°C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35°C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34.25°C</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total temperature of the week = 7 × 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">245°C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total of the first 3 days = 3 × 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">108°C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total of the last 4 days = 245 − 108 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">137°C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average of the last 4 days = 137 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">34.25°C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the average is </span><span style=\"font-weight:bold;font-family:'Mangal'\">34.25°C (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A cylindrical tank of radius 7 m and height 5 m is full of water. The water is emptied into a cuboidal tank of length 11 m and breadth 7 m. Find the height of the water in the cuboidal tank. (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of water = πr²h = (22/7) × 7² × 5 = 22 × 7 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">770 m³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume in the cuboid = length × breadth × height = 11 × 7 × h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">77h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">77h = 770 → h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the height of water is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 m (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The difference between the compound interest (compounded annually) and the simple interest on ₹10,000 for 2 years at the same rate R% per annum is ₹64. What is the value of R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For 2 years, CI − SI = P × (R/100)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,000 × (R/100)² = 64 → (R/100)² = 64 ÷ 10,000 = 0.0064</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R/100 = 0.08 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: SI = (10,000 × 8 × 2) / 100 = ₹1,600; CI = 10,000 × (1.08)² − 10,000 = ₹1,664; difference = ₹64 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 12.8 : x :: x : 3.2 and x &gt; 0, then find the value of x.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5.6</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a continued proportion a : x :: x : b, the middle term satisfies x² = a × b.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² = 12.8 × 3.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40.96</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = √40.96 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.4</span><span style=\"font-family:'Mangal'\"> (taking x &gt; 0)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.4 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A trader marks a product at ₹2,000. He offers two successive discounts of 20% and 10% to a customer. Find the single equivalent discount percentage and the selling price of the product.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%, ₹1,740</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%, ₹1,540</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%, ₹1,640</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28%, ₹1,440</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Price after the first discount = ₹2,000 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Price after the second discount = ₹1,600 × 90% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total discount = 2,000 − 1,440 = ₹560 → 560 ÷ 2,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: single equivalent discount = 20 + 10 − (20 × 10 ÷ 100) = 28%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the equivalent discount is 28% and the selling price is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calculate the mean from the following items.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">172, 148, 160, 181, 189</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">172</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">170</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">174</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mean = sum of the items ÷ number of items</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 172 + 148 + 160 + 181 + 189 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">850</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mean = 850 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">170</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mean is </span><span style=\"font-weight:bold;font-family:'Mangal'\">170 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": "Tथय ृिधिस नing ोप inपधनॅोिस यी 12 ंinहपधौ ोnक 18 ंinहपधौ नधौूधcपiॅिधद. Iी पुधद नing पयgधपुधन ोप 9:00 AM, ोीपधन ुयथ ंोnद ंinहपधौ थiिि पुधद nधसप नing पयgधपुधन?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 minutes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 minutes</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They ring together again after a time that is a multiple of both 12 and 18 → the </span><span style=\"font-weight:bold;font-family:'Mangal'\">LCM</span><span style=\"font-family:'Mangal'\"> of 12 and 18.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 = 2² × 3 and 18 = 2 × 3² → LCM = 2² × 3² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So they next ring together after </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 minutes</span><span style=\"font-family:'Mangal'\"> (at 9:36 AM).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 minutes (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given that 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.3</span><span style=\"font-family:'Mangal'\"> = x and 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.9</span><span style=\"font-family:'Mangal'\"> = y, and x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = y², then the value of z is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = (5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.3</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">0.3z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y² = (5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.9</span><span style=\"font-family:'Mangal'\">)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">1.8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Equal bases → equal powers: 0.3z = 1.8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">z = 1.8 / 0.3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, z = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During a round-trip journey where a person walks to a location at 5 km/h and returns at 3 km/h, which statement about average speed is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average speed is 3 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average speed is 5 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average speed will be less than the arithmetic mean of 5 km/h and 3 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average speed equals the arithmetic mean of 5 km/h and 3 km/h</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For equal distances at speeds x and y, average speed = 2xy ÷ (x + y).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 5 × 3 ÷ (5 + 3) = 30 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.75 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arithmetic mean of the speeds = (5 + 3) ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.75 &lt; 4 → the average speed is </span><span style=\"font-weight:bold;font-family:'Mangal'\">less than</span><span style=\"font-family:'Mangal'\"> the arithmetic mean, because more time is spent at the slower speed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct statement is that the average speed is less than the arithmetic mean </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The population of a district is 3,35,000, out of which 2,14,000 are males. 31% of the population is literate. If 31% males are literate, then what percentage of females are literate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Females = 3,35,000 − 2,14,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,21,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total literate = 3,35,000 × 31% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,03,850</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Literate males = 2,14,000 × 31% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">66,340</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Literate females = 1,03,850 − 66,340 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37,510</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Female literacy = 37,510 ÷ 1,21,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: if the whole population and the males both have 31% literacy, the females must also have 31%.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 31% of females are literate </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A person standing 30 metres away from the base of a tower observes that the angle of elevation of the top of the tower is 30°. Find the height of the tower. (Rounded off to two decimal places; take √3 = 1.732)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51.96 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17.32 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15.00 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20.00 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan(angle of elevation) = height ÷ distance from the base</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan 30° = h ÷ 30 → h = 30 × tan 30° = 30 × (1/√3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30/√3 = 10√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = 10 × 1.732 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17.32 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the height of the tower is </span><span style=\"font-weight:bold;font-family:'Mangal'\">17.32 m (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In an election contested by two candidates, 20% of the 20,000 registered voters did not cast their votes, and 400 of the votes cast were declared invalid. The winning candidate secured 60% of the valid votes. How many votes did the winning candidate get?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,360</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,600</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,120</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8,400</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Votes cast = 20,000 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Valid votes = 16,000 − 400 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Winner's votes = 15,600 × 60% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winning candidate got </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,360 votes (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A mother's present age is three times her daughter's present age. The sum of their present ages is 64 years. What is the difference (in years) between their present ages?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the daughter's age be x → mother's age = 3x.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 3x = 64 → 4x = 64 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother = 3 × 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 years</span><span style=\"font-family:'Mangal'\">, daughter = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Difference = 48 − 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the difference is </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 years (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify the following expression:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(2a + 3b + 4c)² + (2a − 3b − 4c)² − 8a² − 18b² − 32c²</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24ab</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12bc</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16ac</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48bc</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let x = 2a and y = 3b + 4c → the expression starts as (x + y)² + (x − y)².</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + y)² + (x − y)² = 2x² + 2y²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2x² = 2 × (2a)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8a²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y² = 2 × (3b + 4c)² = 2 × (9b² + 24bc + 16c²) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18b² + 48bc + 32c²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 8a² + 18b² + 48bc + 32c²; subtracting 8a² + 18b² + 32c² leaves </span><span style=\"font-weight:bold;font-family:'Mangal'\">48bc</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the expression simplifies to </span><span style=\"font-weight:bold;font-family:'Mangal'\">48bc (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The table shows the number of books sold by a bookstore in three categories over three months.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789640512330_image001.png\" width=\"269\" height=\"81\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By what percentage did the total number of books sold in February exceed the total sold in January?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11.43%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">January total = 1,200 + 1,500 + 800 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">February total = 1,400 + 1,600 + 900 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increase = 3,900 − 3,500 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Percentage increase = 400 ÷ 3,500 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11.43%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, February exceeded January by </span><span style=\"font-weight:bold;font-family:'Mangal'\">11.43% (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Evaluate: 24 − 6 × 3 + 7</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS: multiplication before addition and subtraction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 − 18 + 7 = 6 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">13 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 people can do a piece of work in 20 days. After 8 days, 6 people left. How many more days will it take to complete the remaining work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 days</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total work = 24 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">480 person-days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done in 8 days = 24 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">192 person-days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remaining work = 480 − 192 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">288 person-days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">People remaining = 24 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Days needed = 288 ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 more days (Option A)</span><span style=\"font-family:'Mangal'\"> are needed.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bus leaves City A at 8:00 am and travels at 40 km/h. At 11:00 am the driver stops for a 20-minute break, then continues at 50 km/h. At what time does the bus reach City B, which is 270 km from City A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2:00 pm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2:20 pm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1:50 pm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2:30 pm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8:00 to 11:00 → 3 hours at 40 km/h → distance = 40 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remaining distance = 270 − 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Break of 20 minutes → journey resumes at </span><span style=\"font-weight:bold;font-family:'Mangal'\">11:20 am</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time for 150 km at 50 km/h = 150 ÷ 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arrival = 11:20 am + 3 h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2:20 pm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the bus reaches City B at </span><span style=\"font-weight:bold;font-family:'Mangal'\">2:20 pm (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the simple interest (in ₹) if a sum of ₹650 is borrowed for 2.5 years at 6% per annum rate of interest.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">87.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">107.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">97.5</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simple interest = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (650 × 6 × 2.5) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 9,750 / 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹97.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the simple interest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹97.5 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of the interior angles of a regular polygon is 1800°. Find the number of diagonals of the polygon.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">65</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum of interior angles = (n − 2) × 180°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(n − 2) × 180° = 1800°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n − 2 = 10 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">n = 12</span><span style=\"font-family:'Mangal'\"> sides</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of diagonals = n(n − 3) / 2 = (12 × 9) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the polygon has </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 diagonals (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a society election, the two candidates received votes in the ratio 8 : 5. If the total number of votes cast was 390, how many votes did the winning candidate receive?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total ratio parts = 8 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One part = 390 ÷ 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 votes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Winning candidate (8 parts) = 8 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 votes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winner received </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 votes (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If a 7-digit number 87321A6 is completely divisible by 6, what is the least value of A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A number is divisible by 6 when it is divisible by both </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divisibility by 2: the last digit is 6 (even) → divisible for every value of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divisibility by 3: digit sum = 8 + 7 + 3 + 2 + 1 + A + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27 + A</span><span style=\"font-family:'Mangal'\">, which must be a multiple of 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27 is already a multiple of 3, so A = 0, 3, 6 or 9 → least value </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 0</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the least value of A is </span><span style=\"font-weight:bold;font-family:'Mangal'\">0 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 8 workers can complete a task in 12 days, how many days will 6 workers take to complete the same task?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total work = workers × days = 8 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 worker-days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With 6 workers: days = 96 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut (inverse proportion): M₁D₁ = M₂D₂ → 8 × 12 = 6 × D₂ → D₂ = 16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 6 workers take </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 days (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": "A ंोn ृहदौ ो ूुयnध ीयन ₹2,000. Hध ौिधिस iप पय ुiौ ीनiधnक ोप ो ूनयीiप यी 10% यn ुiौ cयौप ूनicध. Tुध ीनiधnक पुधn ौिधिस iप पय ोnयपुधन ूधनौयn ोप ो ूनयीiप यी 5% यn ुiौ यथn cयौप ूनicध. Wुोप iौ पुध कiीीधनधncध ृधपथधधn पुध यनiginोि cयौप ूनicध ोnक पुध ीinोि ौिधिing ूनicध?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹300</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹310</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹315</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹320</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Friend's cost price = ₹2,000 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final selling price = ₹2,200 × 105% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Difference = 2,310 − 2,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: net increase = 10 + 5 + (10 × 5 ÷ 100) = 15.5% → ₹2,000 × 15.5% = ₹310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the difference is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹310 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which distinctive drainage characteristic best describes the river Luni of north-western India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It flows directly into the Arabian Sea.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It forms a large, well-developed delta at its mouth.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is the only glacier-fed perennial Himalayan river.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It terminates in an inland salt marsh in the Rann region without reaching the sea.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Luni</span><span style=\"font-family:'Mangal'\"> originates in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Naga Hills of the Aravalli Range</span><span style=\"font-family:'Mangal'\">, near the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pushkar valley</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ajmer district, Rajasthan</span><span style=\"font-family:'Mangal'\">, and flows south-west through the Thar region.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It flows into the </span><span style=\"font-weight:bold;font-family:'Mangal'\">marshy Rann of Kachchh</span><span style=\"font-family:'Mangal'\">, where its water dissipates, so it is generally classified under </span><span style=\"font-weight:bold;font-family:'Mangal'\">inland drainage</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is a seasonal (non-perennial) river, not glacier-fed, and it forms no delta.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Luni terminates in an inland salt marsh in the Rann region </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India won its maiden ICC Women's Cricket World Cup in November 2025. In the final at Navi Mumbai, India defeated which team, and by what margin?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South Africa, by 52 runs</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Australia, by 5 wickets</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">England, by 52 runs</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South Africa, by 7 wickets</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ICC Women's Cricket World Cup 2025</span><span style=\"font-family:'Mangal'\"> → hosted by </span><span style=\"font-weight:bold;font-family:'Mangal'\">India</span><span style=\"font-family:'Mangal'\"> (some matches in Sri Lanka).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final → </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 November 2025</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dr DY Patil Stadium, Navi Mumbai</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">India</span><span style=\"font-family:'Mangal'\"> (captain </span><span style=\"font-weight:bold;font-family:'Mangal'\">Harmanpreet Kaur</span><span style=\"font-family:'Mangal'\">) made </span><span style=\"font-weight:bold;font-family:'Mangal'\">298/7 in 50 overs</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">South Africa</span><span style=\"font-family:'Mangal'\"> were all out for </span><span style=\"font-weight:bold;font-family:'Mangal'\">246 in 45.3 overs</span><span style=\"font-family:'Mangal'\"> → India won by </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 runs</span><span style=\"font-family:'Mangal'\"> → India's </span><span style=\"font-weight:bold;font-family:'Mangal'\">first</span><span style=\"font-family:'Mangal'\"> Women's ODI World Cup title.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, India beat South Africa by 52 runs </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The global commemoration of World Environment Day 2026 (5 June), focused on climate action, was hosted by which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Republic of Korea</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Azerbaijan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Saudi Arabia</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">World Environment Day</span><span style=\"font-family:'Mangal'\"> is observed every year on </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 June</span><span style=\"font-family:'Mangal'\">, led by the UN Environment Programme (UNEP).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">2026</span><span style=\"font-family:'Mangal'\"> global commemoration was hosted by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Azerbaijan</span><span style=\"font-family:'Mangal'\"> in its capital </span><span style=\"font-weight:bold;font-family:'Mangal'\">Baku</span><span style=\"font-family:'Mangal'\">, with the focus on </span><span style=\"font-weight:bold;font-family:'Mangal'\">climate change and climate action</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 2025 commemoration was hosted by the Republic of Korea (theme: ending plastic pollution).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the 2026 host was </span><span style=\"font-weight:bold;font-family:'Mangal'\">Azerbaijan (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who was sworn in as the 53rd Chief Justice of India on 24 November 2025, succeeding Justice B. R. Gavai?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Justice Sanjiv Khanna</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Justice D. Y. Chandrachud</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Justice Vikram Nath</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Justice Surya Kant</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Justice Surya Kant</span><span style=\"font-family:'Mangal'\"> took oath as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">53rd Chief Justice of India</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 November 2025</span><span style=\"font-family:'Mangal'\">; the oath was administered by President </span><span style=\"font-weight:bold;font-family:'Mangal'\">Droupadi Murmu</span><span style=\"font-family:'Mangal'\"> at Rashtrapati Bhavan.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He succeeded </span><span style=\"font-weight:bold;font-family:'Mangal'\">Justice B. R. Gavai</span><span style=\"font-family:'Mangal'\"> (52nd CJI) and is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">first CJI from Haryana</span><span style=\"font-family:'Mangal'\">; his tenure runs till </span><span style=\"font-weight:bold;font-family:'Mangal'\">February 2027</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Justice Sanjiv Khanna (51st) and Justice D. Y. Chandrachud (50th) were earlier CJIs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the 53rd CJI is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Justice Surya Kant (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In August 2026, Parliament passed the Kerala (Alteration of Name) Bill, 2026 to rename the State of Kerala as \"Keralam\". Under which Article of the Constitution can Parliament alter the name of a State?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 368</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 370</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Article 3</span><span style=\"font-family:'Mangal'\"> empowers Parliament to form new States and alter the areas, boundaries or </span><span style=\"font-weight:bold;font-family:'Mangal'\">names</span><span style=\"font-family:'Mangal'\"> of existing States; such a Bill needs the </span><span style=\"font-weight:bold;font-family:'Mangal'\">President's prior recommendation</span><span style=\"font-family:'Mangal'\"> and is referred to the State legislature for its views.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Timeline → Kerala Assembly resolution (June 2024) → Union Cabinet approval (</span><span style=\"font-weight:bold;font-family:'Mangal'\">24 February 2026</span><span style=\"font-family:'Mangal'\">) → President's reference to the Kerala Assembly (June 2026) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lok Sabha passed on 11 August 2026</span><span style=\"font-family:'Mangal'\">, Parliament passed on 12 August 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">\"Keralam\" is the name of the State in Malayalam.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Article is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 3 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Nobel Prize in Chemistry 2025 was awarded to Susumu Kitagawa, Richard Robson and Omar M. Yaghi for the development of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lithium-ion batteries</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CRISPR gene editing</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Metal-organic frameworks (MOFs)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Quantum dots</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Nobel Prize in Chemistry 2025</span><span style=\"font-family:'Mangal'\"> → Susumu Kitagawa (Japan), Richard Robson (Australia) and Omar M. Yaghi (USA) for developing </span><span style=\"font-weight:bold;font-family:'Mangal'\">metal-organic frameworks (MOFs)</span><span style=\"font-family:'Mangal'\"> — porous crystalline materials with large cavities, useful for harvesting water from desert air and capturing carbon dioxide.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Physics 2025 → John Clarke, Michel H. Devoret and John M. Martinis (macroscopic quantum tunnelling in an electric circuit).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Physiology or Medicine 2025 → Mary E. Brunkow, Fred Ramsdell and Shimon Sakaguchi (regulatory T cells).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Literature 2025 → László Krasznahorkai; Economics 2025 → Joel Mokyr, Philippe Aghion and Peter Howitt.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Chemistry prize was for </span><span style=\"font-weight:bold;font-family:'Mangal'\">metal-organic frameworks (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The words \"Socialist\", \"Secular\" and \"Integrity\" were added to the Preamble of the Constitution of India by the 42nd Amendment Act. In which year was this amendment enacted?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1971</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1978</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1976
