nt-family:'Mangal'\"> होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोनों पैमाने बराबर रीडिंग दिखाते हैं</span><span style=\"font-family:'Mangal'\">, चाहे कोई भी सिरा बँधा हो और कोई भी खींचा जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बँधा हुआ तुला शून्य नहीं पढ़ता, क्योंकि दीवार उसे उसी बल से पीछे खींचती है जो दूसरे सिरे पर हाथ लगा रहा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों तुला बराबर रीडिंग दिखाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): पेट्रोलियम शोधनशाला में कच्चे पेट्रोलियम को प्रभाजी आसवन द्वारा पेट्रोलियम गैस, पेट्रोल, केरोसिन और डीज़ल में अलग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): कच्चे पेट्रोलियम के विभिन्न प्रभाजों के क्वथनांक भिन्न-भिन्न होते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी की भूपर्पटी से निकाला गया कच्चा पेट्रोलियम अनेक उपयोगी द्रवों और गैसों का मिश्रण है, और शोधनशाला उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रभाजी आसवन</span><span style=\"font-family:'Mangal'\"> द्वारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेट्रोलियम गैस, पेट्रोल, केरोसिन और डीज़ल</span><span style=\"font-family:'Mangal'\"> जैसे प्रभाजों में अलग करती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रभाजी आसवन इसलिए संभव है क्योंकि मिश्रण के घटक </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न-भिन्न तापमान</span><span style=\"font-family:'Mangal'\"> पर उबलते हैं; गर्म करने पर प्रत्येक प्रभाज अपने तापमान परास में वाष्प बनता है और उसे अलग संघनित करके एकत्र कर लिया जाता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्वथनांकों का यही अंतर पृथक्करण को संभव बनाता है, अतः R ही A की व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पारिस्थितिकी तंत्र में सूर्य के प्रकाश की ऊर्जा को अन्य सभी जीवों के लिए उपलब्ध कराने वाले जीव हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शाकाहारी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपघटक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्पादक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मांसाहारी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हरे पौधे और कुछ अन्य जीव प्रकाश संश्लेषण द्वारा सूर्य के प्रकाश की ऊर्जा को ग्रहण करके अपने बनाए भोजन में संचित करते हैं; वे पारिस्थितिकी तंत्र के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पादक</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य सभी जीव इसी संचित ऊर्जा पर निर्भर हैं: शाकाहारी उत्पादक को खाते हैं, मांसाहारी शाकाहारी को, और अपघटक इन सबके मृत अवशेषों को तोड़ते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्पादक ही सूर्य के प्रकाश की ऊर्जा को शेष पारिस्थितिकी तंत्र के लिए उपलब्ध कराता है, और वह हर खाद्य शृंखला के पहले पोषक स्तर पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये जीव उत्पादक हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हमारे द्वारा उत्पन्न अजैव निम्नीकरणीय अपशिष्टों से होने वाली समस्या निम्नलिखित में से कौन-सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे बैक्टीरिया द्वारा शीघ्र तोड़ दिए जाते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे मिट्टी में पोषक तत्व जोड़ते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे खाद में बदल जाते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे पर्यावरण में बहुत समय तक बने रहते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो पदार्थ जैविक प्रक्रियाओं, जैसे बैक्टीरिया और अन्य अपघटकों की क्रिया, से टूट जाते हैं, वे जैव निम्नीकरणीय हैं, और वे पोषक तत्वों के रूप में मिट्टी में पुनः चक्रित हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लास्टिक जैसे अजैव निम्नीकरणीय अपशिष्ट इन अपघटकों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> टूटते, अतः वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्यावरण में बहुत लंबे समय तक बने रहते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे ढेर बनकर मिट्टी और जल को प्रदूषित करते हैं, और उन्हें खाने वाले या उनमें उलझने वाले जीवों को हानि पहुँचाते हैं; कुछ खाद्य शृंखलाओं में पहुँचकर और भी हानि करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीघ्र टूट जाना, मिट्टी में पोषक तत्व जोड़ना और खाद में बदल जाना, ये सब जैव निम्नीकरणीय अपशिष्टों के गुण हैं, अजैव निम्नीकरणीय अपशिष्टों के नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समस्या यह है कि वे पर्यावरण में बहुत समय तक बने रहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नाइक्रोम के तार के लिए उसके सिरों के बीच विभवांतर V और उसमें बहने वाली धारा I का ग्राफ़ मूल बिंदु से गुज़रने वाली सीधी रेखा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यदि चालक का प्रतिरोध दोगुना कर दिया जाए, तो उसी विभवांतर के लिए उसमें बहने वाली धारा आधी हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. चालक का प्रतिरोध उसकी लंबाई, उसके अनुप्रस्थ काट के क्षेत्रफल और उसके पदार्थ की प्रकृति पर निर्भर करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ओम के नियम के अनुसार V ∝ I, अतः नाइक्रोम के तार के लिए V/I अचर रहता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">V–I ग्राफ़ मूल बिंदु से गुज़रने वाली सीधी रेखा</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. I = V/R से, उसी विभवांतर के लिए धारा प्रतिरोध के व्युत्क्रमानुपाती है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">R दोगुना करने पर I आधी</span><span style=\"font-family:'Mangal'\"> हो जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. चालक का प्रतिरोध </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसकी लंबाई, अनुप्रस्थ काट के क्षेत्रफल और उसके पदार्थ</span><span style=\"font-family:'Mangal'\"> पर निर्भर करता है; लंबे तार का प्रतिरोध अधिक, मोटे तार का कम होता है, और भिन्न पदार्थों की प्रतिरोधकता भिन्न होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सभी 1, 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में घरेलू विद्युत परिपथ में गीज़र और एयर कूलर जैसे अधिक शक्ति अनुमतांक वाले उपकरण जिस अलग परिपथ से जोड़े जाते हैं, उसका धारा अनुमतांक है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में मुख्य आपूर्ति के जीवित तार और उदासीन तार के बीच विभवांतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">220 V</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुख्य स्विच से लाइन तार घर के अलग-अलग परिपथों को आपूर्ति देते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 A</span><span style=\"font-family:'Mangal'\"> धारा अनुमतांक का एक परिपथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">गीज़र और एयर कूलर</span><span style=\"font-family:'Mangal'\"> जैसे अधिक शक्ति अनुमतांक वाले उपकरणों के लिए, और 5 A अनुमतांक का दूसरा परिपथ बल्ब, पंखे जैसे कम शक्ति वाले उपकरणों के लिए प्रयोग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अलग परिपथ में अपना फ़्यूज़ या MCB होता है, ताकि एक में अतिभार होने पर दूसरे प्रभावित न हों।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अधिक शक्ति वाले उपकरण 15 A के परिपथ से जोड़े जाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तेज़ गति से आती क्रिकेट गेंद को पकड़ते समय क्षेत्ररक्षक अपने हाथों को धीरे-धीरे पीछे की ओर खींचता है। वह ऐसा इसलिए करता है ताकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद को रोकने में लगने वाला समय बढ़ जाए, जिससे हाथों पर कम बल लगे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद द्वारा हाथों पर लगाया गया बल बढ़ जाए</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद को रोकने में लगने वाला समय घट जाए</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद कम दूरी में रुक जाए</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद को रोकने के लिए उसका वेग शून्य करना होता है; वेग में यह परिवर्तन निश्चित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाथ पीछे खींचकर क्षेत्ररक्षक वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय बढ़ा देता है</span><span style=\"font-family:'Mangal'\"> जिसमें गेंद का वेग शून्य होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग का वही परिवर्तन अधिक समय में होने पर परिवर्तन की दर (त्वरण) कम होती है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाथों पर बल कम</span><span style=\"font-family:'Mangal'\"> लगता है और चोट नहीं लगती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह गेंद को रोकने का समय बढ़ाने और बल घटाने के लिए हाथ पीछे खींचता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैल्वनीकृत लोहे की वस्तु जस्ते की परत खरोंच जाने पर भी जंग से सुरक्षित क्यों रहती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जस्ता लोहे से अधिक क्रियाशील है और पहले स्वयं ऑक्सीकृत होकर लोहे की रक्षा करता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खरोंचों से तेल भीतर रिसकर जंग लगने से रोकता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहे पर जंग की पतली परत बन जाती है जो आगे संक्षारण रोकती है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जस्ता लोहे से अभिक्रिया करके आयरन ऑक्साइड की सुरक्षात्मक परत बनाता है।</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैल्वनीकरण स्टील और लोहे को </span><span style=\"font-weight:bold;font-family:'Mangal'\">जस्ते</span><span style=\"font-family:'Mangal'\"> की पतली परत चढ़ाकर जंग से बचाने की विधि है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सक्रियता श्रेणी में जस्ता </span><span style=\"font-weight:bold;font-family:'Mangal'\">लोहे से ऊपर</span><span style=\"font-family:'Mangal'\"> है, अतः वह लोहे से अधिक क्रियाशील है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जस्ते की परत खरोंच जाने और थोड़ा लोहा खुल जाने पर भी आसपास का जस्ता लोहे से पहले ऑक्सीकृत होता है, इसलिए नीचे का लोहा सुरक्षित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जंग एक भूरा पपड़ीदार पदार्थ है जो आगे के संक्षारण को नहीं रोकता, जस्ता लोहे से अभिक्रिया करके आयरन ऑक्साइड नहीं बनाता, और खरोंचों से तेल भीतर नहीं जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु इसलिए सुरक्षित रहती है क्योंकि जस्ता लोहे से अधिक क्रियाशील है और उससे पहले ऑक्सीकृत हो जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): एक हार्मोन शरीर के अनेक भिन्न-भिन्न ऊतकों में एक साथ परिवर्तन ला सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): हार्मोन रक्त के साथ जाकर शरीर की सभी कोशिकाओं तक पहुँच सकता है, जबकि तंत्रिका आवेग केवल उन्हीं कोशिकाओं तक पहुँचता है जो उस तंत्रिका से जुड़ी हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शरीर केवल तंत्रिका कोशिकाओं के विद्युत आवेगों पर निर्भर रहता, तो निर्देश पाने वाले ऊतक केवल वही होते जो उस तंत्रिका से जुड़े हैं; इसके विपरीत </span><span style=\"font-weight:bold;font-family:'Mangal'\">रासायनिक संकेत</span><span style=\"font-family:'Mangal'\"> शरीर की </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी कोशिकाओं</span><span style=\"font-family:'Mangal'\"> तक पहुँचता है और व्यापक परिवर्तन ला सकता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हार्मोन विसरण द्वारा नियंत्रण और समन्वय के लिए प्रयुक्त यौगिक हैं; हार्मोन </span><span style=\"font-weight:bold;font-family:'Mangal'\">रक्त</span><span style=\"font-family:'Mangal'\"> में छोड़ा जाता है और शरीर के हर भाग तक पहुँचाया जाता है, जो धीमा तो है परंतु तंत्रिका संबंध के बिना भी सभी कोशिकाओं तक पहुँचता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठीक इसीलिए कि हार्मोन रक्त के माध्यम से सभी कोशिकाओं तक पहुँचता है, वह अनेक ऊतकों पर एक साथ कार्य कर पाता है, अतः R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम हाइड्रॉक्साइड के एक विलयन का 10 mL, हाइड्रोक्लोरिक अम्ल के एक दिए गए विलयन के 8 mL से ठीक-ठीक उदासीन हो जाता है। उसी सोडियम हाइड्रॉक्साइड विलयन के 20 mL को उदासीन करने के लिए उसी हाइड्रोक्लोरिक अम्ल विलयन का आवश्यक आयतन है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 mL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 mL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 mL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 mL</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उदासीनीकरण में अम्ल क्षारक के प्रभाव को समाप्त कर देता है: NaOH(aq) + HCl(aq) → NaCl(aq) + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O(l).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों विलयन वही हैं, अतः आवश्यक अम्ल का आयतन लिए गए क्षारक के आयतन के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समानुपाती</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NaOH विलयन के 10 mL के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 mL</span><span style=\"font-family:'Mangal'\"> अम्ल चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसी NaOH विलयन के 20 mL के लिए, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुना</span><span style=\"font-family:'Mangal'\"> क्षारक है, 8 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 mL</span><span style=\"font-family:'Mangal'\"> अम्ल चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवश्यक हाइड्रोक्लोरिक अम्ल का आयतन 16 mL है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रदरफ़ोर्ड के स्वर्ण पन्नी प्रयोग ने किसकी उपस्थिति स्थापित की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाभिक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटॉन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूट्रॉन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वर्ण पन्नी प्रयोग में, जिसे अल्फा-किरण प्रकीर्णन प्रयोग भी कहते हैं, अल्फा कणों की किरण-पुंज को सोने की अत्यंत पतली पन्नी पर डाला गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश अल्फा कण सीधे पार निकल गए, कुछ छोटे कोणों से विक्षेपित हुए, और बहुत ही थोड़े वापस लौट आए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे रदरफ़ोर्ड ने निष्कर्ष निकाला कि परमाणु का धन आवेश और अधिकांश द्रव्यमान केंद्र के एक अत्यंत छोटे क्षेत्र, </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाभिक</span><span style=\"font-family:'Mangal'\">, में सिमटा है, जबकि शेष परमाणु प्रायः खाली स्थान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> पहले ही टॉमसन ने कैथोड किरणों में खोज लिए थे, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूट्रॉन</span><span style=\"font-family:'Mangal'\"> की खोज बाद में 1932 में चैडविक ने की; इस प्रयोग ने प्रोटॉन को भी अलग से स्थापित नहीं किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस प्रयोग ने नाभिक की उपस्थिति स्थापित की </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव हृदय के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बायाँ निलय शरीर से आने वाला विऑक्सीजनित रक्त ग्रहण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. हृदय में अलग-अलग कक्ष होते हैं, ताकि ऑक्सीजन युक्त रक्त कार्बन डाइऑक्साइड युक्त रक्त से न मिले।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दायाँ निलय रक्त को ऑक्सीजनीकरण के लिए फेफड़ों में भेजता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. शरीर से आने वाला विऑक्सीजनित रक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाएँ अलिंद</span><span style=\"font-family:'Mangal'\"> में उसके शिथिल होने पर आता है, बाएँ निलय में नहीं; बायाँ निलय ऑक्सीजनित रक्त ग्रहण करके उसे शरीर में भेजता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रक्त को ऑक्सीजन और कार्बन डाइऑक्साइड दोनों ले जानी होती हैं, इसलिए हृदय में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग-अलग कक्ष</span><span style=\"font-family:'Mangal'\"> होते हैं, जो ऑक्सीजन युक्त और कार्बन डाइऑक्साइड युक्त रक्त को मिलने नहीं देते → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. दाएँ अलिंद के संकुचित होने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">दायाँ निलय</span><span style=\"font-family:'Mangal'\"> भरता है, और फिर वह इस रक्त को ऑक्सीजनीकरण के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">फेफड़ों</span><span style=\"font-family:'Mangal'\"> में भेजता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगरबत्ती की गंध का पता किसमें उपस्थित ग्राही लगाते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भीतरी कान</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीभ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्वचा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर्यावरण से मिलने वाली सारी सूचना कुछ तंत्रिका कोशिकाओं के विशेषीकृत सिरों, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्राहियों</span><span style=\"font-family:'Mangal'\">, द्वारा ग्रहण की जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">संवेदी अंगों</span><span style=\"font-family:'Mangal'\"> में स्थित होते हैं: गंध के ग्राही </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाक</span><span style=\"font-family:'Mangal'\"> में, स्वाद के जीभ में, और संतुलन तथा सुनने के भीतरी कान में होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाक के ग्राही अगरबत्ती की गंध ग्रहण करके एक विद्युत आवेग उत्पन्न करते हैं, जो तंत्रिका कोशिकाओं के सहारे मस्तिष्क तक जाता है, जहाँ गंध पहचानी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गंध का पता नाक में उपस्थित ग्राही लगाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्गीकरण के इतिहास के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अरस्तू ने जंतुओं को उनके आवास के आधार पर वर्गीकृत किया: स्थल, जल और वायु।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चार जगत प्रणाली में प्लांटी, एनिमेलिया, प्रोटिस्टा और मोनेरा थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अमीबा और बैक्टीरिया दोनों को प्रोटिस्टा जगत में रखा गया, क्योंकि दोनों एककोशिकीय हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. लगभग चौथी शताब्दी ईसा पूर्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">अरस्तू</span><span style=\"font-family:'Mangal'\"> ने जंतुओं को उनके रहने के स्थान, </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थल, जल या वायु</span><span style=\"font-family:'Mangal'\">, और बाहरी रूप-रंग के आधार पर वर्गीकृत किया → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जब दो जगत प्रणाली अमीबा, पैरामीशियम और बैक्टीरिया जैसे जीवों को स्थान न दे सकी, तब दो और जगत जोड़े गए, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार जगत प्लांटी, एनिमेलिया, प्रोटिस्टा और मोनेरा</span><span style=\"font-family:'Mangal'\"> बने → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अमीबा में झिल्ली से घिरा सच्चा केंद्रक होता है, परंतु बैक्टीरिया में नहीं; अतः दोनों के एककोशिकीय होने पर भी बैक्टीरिया को अमीबा के साथ प्रोटिस्टा में नहीं, बल्कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग जगत मोनेरा</span><span style=\"font-family:'Mangal'\"> में रखा गया → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक अध्ययन में पाया गया कि हल्के रंग की आँखों वाले बच्चों के माता-पिता की आँखें भी प्रायः हल्के रंग की होती हैं। केवल इस सूचना के आधार पर क्या हम कह सकते हैं कि हल्के रंग की आँखों का लक्षण प्रभावी है या अप्रभावी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाँ, यह प्रभावी है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाँ, यह अप्रभावी है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नहीं, केवल इससे यह तय नहीं हो सकता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाँ, दोनों समान रूप से प्रभावी हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई लक्षण प्रभावी है या अप्रभावी, यह तय करने के लिए हमें जानना होगा कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो विपरीत लक्षणों के संकरण</span><span style=\"font-family:'Mangal'\"> में क्या होता है: ऐसे संकरण की संतति में जो लक्षण प्रकट होता है, वही प्रभावी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अध्ययन केवल यह कहता है कि हल्की आँखों वाले बच्चों के माता-पिता की आँखें प्रायः हल्की होती हैं; लक्षण का माता-पिता से बच्चों में जाना दिखाता है कि वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">वंशागत</span><span style=\"font-family:'Mangal'\"> है, परंतु ऐसा प्रभावी और अप्रभावी दोनों लक्षणों में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हल्की आँखों वाले और गहरी आँखों वाले जनक के बच्चों के बारे में कुछ भी ज्ञात नहीं है, अतः दी गई सूचना प्रभाविता तय करने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्याप्त नहीं</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल इस सूचना से यह तय नहीं हो सकता कि लक्षण प्रभावी है या अप्रभावी </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रासायनिक समीकरणों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. संतुलित रासायनिक समीकरण में प्रत्येक तत्व के परमाणुओं की संख्या अभिकारक पक्ष और उत्पाद पक्ष में बराबर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सूत्र के बाद लिखे प्रतीक (g), (l), (aq) और (s) उस पदार्थ की भौतिक अवस्था दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रासायनिक अभिक्रिया के दौरान एक तत्व के परमाणु दूसरे तत्व के परमाणुओं में बदल जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. रासायनिक अभिक्रिया में द्रव्यमान न बनता है न नष्ट होता है, अतः समीकरण को दोनों पक्षों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक तत्व के परमाणुओं की संख्या बराबर</span><span style=\"font-family:'Mangal'\"> करके संतुलित किया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. भौतिक अवस्थाएँ सूत्रों के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">(g) गैस, (l) द्रव, (aq) जलीय विलयन और (s) ठोस</span><span style=\"font-family:'Mangal'\"> के रूप में लिखी जाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रासायनिक अभिक्रिया में केवल परमाणुओं के बीच के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंध</span><span style=\"font-family:'Mangal'\"> टूटते और बनते हैं; एक तत्व के परमाणु दूसरे तत्व के परमाणुओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कभी नहीं बदलते</span><span style=\"font-family:'Mangal'\">, और न कोई परमाणु लुप्त होता है, न कहीं और से आता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाँदी के शोधन में सिल्वर नाइट्रेट के विलयन में उपस्थित चाँदी को किससे विस्थापित करके प्राप्त किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लैटिनम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिक क्रियाशील धातु कम क्रियाशील धातु को उसके लवण के विलयन से विस्थापित कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर </span><span style=\"font-weight:bold;font-family:'Mangal'\">चाँदी से अधिक क्रियाशील</span><span style=\"font-family:'Mangal'\"> है, अतः सिल्वर नाइट्रेट के विलयन में कॉपर डालने पर वह चाँदी को विस्थापित कर देता है: Cu + 2AgNO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> → Cu(NO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> + 2Ag.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाँदी धातु के रूप में मुक्त हो जाती है, और शोधन में उसे इसी प्रकार प्राप्त किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सोना</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लैटिनम</span><span style=\"font-family:'Mangal'\"> चाँदी से कम क्रियाशील हैं और उसे विस्थापित नहीं कर सकते, तथा कार्बन का प्रयोग लवण विलयन से विस्थापन के लिए नहीं किया जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चाँदी को कॉपर से विस्थापित करके प्राप्त किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संख्याएँ 5 : 6 के अनुपात में हैं और उनका LCM 480 है। दोनों संख्याओं का HCF कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना दोनों संख्याएँ 5x और 6x हैं, जहाँ x उनका HCF (महत्तम समापवर्तक) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 और 6 सह-अभाज्य हैं, अतः 5x और 6x का LCM (लघुत्तम समापवर्त्य) = 5 × 6 × x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30x = 480</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 480 / 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: संख्याएँ 80 और 96 हैं, इनका HCF 16 तथा LCM 480 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: HCF = LCM / (अनुपात के पदों का गुणनफल)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 480 / 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों संख्याओं का HCF </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कागज की एक आयताकार शीट, जो 44 cm लंबी और 20 cm चौड़ी है, को उसकी लंबाई के अनुदिश मोड़कर 20 cm ऊँचाई का एक बेलन बनाया जाता है। बेलन का आयतन कितना है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,800 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,080 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6,160 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,540 cm³</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीट को लंबाई के अनुदिश मोड़ने पर 44 cm वाली भुजा आधार की परिधि बन जाती है और 20 cm वाली भुजा ऊँचाई बन जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिधि = 2πr = 44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 × (22/7) × r = 44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">r = 44 × (7/44) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेलन का आयतन = πr²h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22/7) × 7 × 7 × 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 22 × 7 × 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,080 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बेलन का आयतन </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,080 cm³ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B और C एक कार्य को क्रमशः 10, 12 और 15 दिन में कर सकते हैं। तीनों मिलकर कार्य शुरू करते हैं। A 2 दिन बाद कार्य छोड़ देता है और B कार्य पूरा होने से 3 दिन पहले छोड़ देता है। कार्य कितने दिनों में पूरा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 दिन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल कार्य = 10, 12 और 15 का LCM (लघुत्तम समापवर्त्य) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 इकाई</span><span style=\"font-family:'Mangal'\"> मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A की दर = 60 / 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 इकाई प्रति दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B की दर = 60 / 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 इकाई प्रति दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C की दर = 60 / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 इकाई प्रति दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना कार्य T दिनों में पूरा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 2 दिन कार्य करता है: 6 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B (T − 3) दिन कार्य करता है: 5(T − 3) इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C पूरे T दिन कार्य करता है: 4T इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 + 5(T − 3) + 4T = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 + 5T − 15 + 4T = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9T − 3 = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9T = </span><span style=\"font-weight:bold;font-family:'Mangal'\">63</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 12 + (5 × 4) + (4 × 7) = 12 + 20 + 28 = 60 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 दिन (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में पूरा होता है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक परीक्षा में अधिकतम अंकों के 30% अंक प्राप्त करने वाला एक परीक्षार्थी 50 अंकों से अनुत्तीर्ण हो जाता है, जबकि अधिकतम अंकों के 45% अंक प्राप्त करने वाले दूसरे परीक्षार्थी को उत्तीर्णांक से 40 अंक अधिक मिलते हैं। उत्तीर्णांक कितने हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">230</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना अधिकतम अंक M तथा उत्तीर्णांक P हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला परीक्षार्थी: M का 30% + 50 = P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा परीक्षार्थी: M का 45% − 40 = P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों P के बराबर हैं, अतः दूसरे में से पहले को घटाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(M का 45% − 40) − (M का 30% + 50) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M का 15% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M = (90 / 15) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तीर्णांक = 600 का 30% + 50 = 180 + 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">230</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 600 का 45% = 270, और 270 − 40 = 230 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तीर्णांक </span><span style=\"font-weight:bold;font-family:'Mangal'\">230 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि x + y = 10 और xy = 21 है, तो x³ + y³ का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">430</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">340</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">370</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योग के घन की सर्वसमिका का प्रयोग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(x + y)³ = x³ + y³ + 3xy(x + y)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x³ + y³ = (x + y)³ − 3xy(x + y)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 10³ − (3 × 21 × 10)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,000 − 630</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">370</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: x और y के मान 3 और 7 हैं (योग 10, गुणनफल 21), और 27 + 343 = 370 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x³ + y³ का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">370 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना A एक सम बहुभुज है जिसका प्रत्येक अंतः कोण उसके बहिष्कोण से 120° अधिक है। A की भुजाओं की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुभुज के प्रत्येक शीर्ष पर अंतः कोण और बहिष्कोण एक सरल रेखा पर होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतः कोण + बहिष्कोण = </span><span style=\"font-weight:bold;font-family:'Mangal'\">180°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतः कोण − बहिष्कोण = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120°</span><span style=\"font-family:'Mangal'\"> (दिया है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों समीकरणों को जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 × अंतः कोण = 300°, अतः अंतः कोण = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहिष्कोण = 180° − 150° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुभुज के सभी बहिष्कोणों का योग 360° होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भुजाओं की संख्या = 360° / 30° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: n = 360° / बहिष्कोण</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 360° / 30°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A की भुजाओं की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(785² − 215²) / 570 का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">570</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों संख्याओं का वर्ग न करें; सर्वसमिका a² − b² = (a + b)(a − b) का प्रयोग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">785</span><span style=\"font-family:'Mangal'\"> तथा b = </span><span style=\"font-weight:bold;font-family:'Mangal'\">215</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a + b = 785 + 215 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a − b = 785 − 215 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">570</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंश = 1,000 × 570</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान = (1,000 × 570) / 570 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आशा और बीना की वर्तमान आयु 4 : 5 के अनुपात में हैं। अब से चार वर्ष बाद उनकी आयु का योग 44 वर्ष होगा। बीना की वर्तमान आयु कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 वर्ष</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना आशा और बीना की वर्तमान आयु 4x और 5x वर्ष हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार वर्ष बाद उनकी आयु 4x + 4 और 5x + 4 होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब आयु का योग = (4x + 4) + (5x + 4) = 9x + 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9x + 8 = 44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीना की वर्तमान आयु = 5x = 5 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: आशा 16 वर्ष और बीना 20 वर्ष की है; 4 वर्ष बाद 20 + 24 = 44 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बीना की वर्तमान आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि tan (A + B) = √3 और tan (A − B) = 1/√3 है, जहाँ A और B न्यून कोण हैं तथा A &gt; B है, तो A का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15°</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानक मान याद रखें: tan 60° = √3 तथा tan 30° = 1/√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan (A + B) = √3, अतः A + B = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan (A − B) = 1/√3, अतः A − B = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों समीकरणों को जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2A = 60° + 30° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: B = 60° − 45° = 15°, जो न्यून कोण है और A से छोटा है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">45° (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संख्याओं का LCM उनके HCF का चार गुना है। उनके LCM और HCF का योग 140 है। यदि इनमें से एक संख्या 112 है, तो दूसरी संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना HCF (महत्तम समापवर्तक) H है। तब LCM (लघुत्तम समापवर्त्य) 4H होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM + HCF = 140</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4H + H = 140</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5H = 140</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span><span style=\"font-family:'Mangal'\"> तथा LCM = 4 × 28 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">112</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों संख्याओं का गुणनफल = HCF × LCM</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112 × दूसरी संख्या = 28 × 112</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी संख्या = (28 × 112) / 112 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 112 = 28 × 4 तथा 28 = 28 × 1, अतः HCF 28 और LCM 112 है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरी संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो रेलगाड़ियाँ स्टेशन P और Q से एक ही समय पर चलकर क्रमशः 45 km/h और 60 km/h की चाल से एक-दूसरे की ओर चलती हैं। जब वे मिलती हैं, तो तेज रेलगाड़ी धीमी रेलगाड़ी से 90 km अधिक दूरी तय कर चुकी होती है। P और Q के बीच की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">540 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">630 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">720 km</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने तक दोनों रेलगाड़ियाँ समान समय तक चलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक घंटे में तेज रेलगाड़ी धीमी रेलगाड़ी से 60 − 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span><span style=\"font-family:'Mangal'\"> अधिक चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने के स्थान पर यह अतिरिक्त दूरी 90 km है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने तक का समय = 90 / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 घंटे में धीमी रेलगाड़ी 45 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 km</span><span style=\"font-family:'Mangal'\"> तथा तेज रेलगाड़ी 60 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360 km</span><span style=\"font-family:'Mangal'\"> चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और Q के बीच की दूरी = 270 + 360 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">630 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दूरी = (चालों का योग) × (अतिरिक्त दूरी / चालों का अंतर)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 105 × (90 / 15)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 630 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P और Q के बीच की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">630 km (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक धनराशि चक्रवृद्धि ब्याज की एक निश्चित दर से, वार्षिक रूप से संयोजित, 4 वर्ष में स्वयं की दोगुनी हो जाती है। उसी दर से वह कितने वर्षों में स्वयं की 16 गुनी हो जाएगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 वर्ष</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज में मिश्रधन प्रत्येक समान अवधि में एक ही गुणक से बढ़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 वर्ष में धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 गुनी</span><span style=\"font-family:'Mangal'\"> हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगले 4 वर्षों में यह फिर दोगुनी होती है: 2 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 गुनी</span><span style=\"font-family:'Mangal'\"> (8 वर्ष बाद)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगले 4 वर्षों में: 4 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 गुनी</span><span style=\"font-family:'Mangal'\"> (12 वर्ष बाद)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगले 4 वर्षों में: 8 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 गुनी</span><span style=\"font-family:'Mangal'\"> (16 वर्ष बाद)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 16 = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, अतः समय = 4 × 4 = 16 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 वर्ष (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में स्वयं की 16 गुनी हो जाएगी।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे दी गई सारणी में एक महाविद्यालय में चार वर्षों में तीन पाठ्यक्रमों में नामांकित विद्यार्थियों की संख्या दी गई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790409388501_image001.png\" width=\"442\" height=\"115\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार वर्षों में विज्ञान के कुल विद्यार्थियों की संख्या और कला के कुल विद्यार्थियों की संख्या का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 : 5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन दो पाठ्यक्रमों की तुलना करनी है, उनके चारों वर्षों के आँकड़े जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विज्ञान के कुल विद्यार्थी = 120 + 140 + 160 + 180 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कला के कुल विद्यार्थी = 90 + 110 + 100 + 150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">450</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात = 600 : 450</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पदों में 150 का भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 : 3 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 48 ÷ 4 × 3 − (7 − 2)² + 5 × 4</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS का पालन करें: पहले कोष्ठक, फिर घात, फिर बाएँ से दाएँ ÷ और ×, और अंत में + तथा − की गणना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7 − 2)² = 5² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 ÷ 4 × 3 = 12 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक = 36 − 25 + 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 11 + 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">31</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चीनी का मूल्य 25% बढ़ जाता है। एक परिवार को चीनी की खपत कितने प्रतिशत कम करनी होगी ताकि चीनी पर उसका व्यय समान बना रहे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16.67%</span></p>
