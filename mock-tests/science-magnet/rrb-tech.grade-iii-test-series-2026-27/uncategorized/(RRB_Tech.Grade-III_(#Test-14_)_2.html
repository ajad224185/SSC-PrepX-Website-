. The cell wall is rigid but it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">permeable</span><span style=\"font-family:'Mangal'\">: water and some dissolved minerals pass through it freely, and this is how roots take in water and nutrients from the soil → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Without a rigid cell wall an </span><span style=\"font-weight:bold;font-family:'Mangal'\">animal cell can change its shape easily</span><span style=\"font-family:'Mangal'\">, which is why animal cells have no fixed shape → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the dark layer that develops on silver upon its corrosion?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zinc oxide</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Copper oxide</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Iron oxide</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Silver sulphide</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Corrosion is the slow eating away of a metal by the gases and moisture of the air around it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Silver articles turn black after some time because silver reacts with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">sulphur</span><span style=\"font-family:'Mangal'\"> present in the air to form a coating of </span><span style=\"font-weight:bold;font-family:'Mangal'\">silver sulphide</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The coating is of a compound of silver itself, so it cannot be an oxide of zinc, copper or iron.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aluminium behaves differently: the thin oxide layer that forms on it actually protects the metal from further corrosion.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the dark layer on silver is silver sulphide </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the classification of living organisms:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The two kingdom system divided all living organisms into Plantae and Animalia.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The kingdom Protista was added for mostly unicellular organisms with a true nucleus.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In the five kingdom system the fungi are kept along with the plants.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In the eighteenth century scientists used the </span><span style=\"font-weight:bold;font-family:'Mangal'\">two kingdom system</span><span style=\"font-family:'Mangal'\">, which placed every living organism in either </span><span style=\"font-weight:bold;font-family:'Mangal'\">Plantae or Animalia</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The two kingdom system could not place organisms such as Amoeba and Paramecium, so a third kingdom, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Protista</span><span style=\"font-family:'Mangal'\">, was added for mostly unicellular organisms that have a true nucleus → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Fungi were taken </span><span style=\"font-weight:bold;font-family:'Mangal'\">out</span><span style=\"font-family:'Mangal'\"> of the plants and given a kingdom of their own, and that is how the classification became a </span><span style=\"font-weight:bold;font-family:'Mangal'\">five kingdom</span><span style=\"font-family:'Mangal'\"> system → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each succeeding member of the homologous series of alkane differs from the previous one by a unit that consists of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One carbon and three hydrogens</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two carbon and two hydrogens</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One carbon and two hydrogens</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two carbon and three hydrogens</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A homologous series is a series of compounds in which every member differs from the one before it by a fixed unit.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the alkane series, methane CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> is followed by ethane C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, and ethane by propane C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From one member to the next, one carbon atom and two hydrogen atoms are added, that is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">-CH</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">- unit</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because of this step the molecular mass rises steadily and the melting and boiling points show a gradation, while the chemical properties stay similar because the functional group does not change.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the unit consists of one carbon and two hydrogens </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Rutherford's model of the atom could not explain why an atom is stable.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): An electron revolving around the nucleus keeps accelerating, so it should lose energy and spiral into the nucleus.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rutherford pictured the electrons as revolving around the nucleus, much as the planets revolve around the Sun.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A charged particle moving in a circle is </span><span style=\"font-weight:bold;font-family:'Mangal'\">accelerating all the time</span><span style=\"font-family:'Mangal'\">, and such a particle should keep </span><span style=\"font-weight:bold;font-family:'Mangal'\">losing energy</span><span style=\"font-family:'Mangal'\">; the electron would then follow a spiral path and fall into the nucleus, so the atom would collapse → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since atoms are in fact </span><span style=\"font-weight:bold;font-family:'Mangal'\">stable</span><span style=\"font-family:'Mangal'\"> and matter around us stays intact, Rutherford's model was found not to be completely correct on this very point → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is exactly the predicted loss of energy in R that his model could not answer, so R is the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aluminium forms the Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> ion and oxygen forms the O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> ion. The formula of aluminium oxide is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In an ionic compound the total positive charge must balance the total negative charge, and the formula is written by criss-crossing the charges.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the two ions side by side, Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> and O</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\">, and criss-cross the numbers: the 3 of aluminium becomes the subscript of oxygen and the 2 of oxygen becomes the subscript of aluminium.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This gives </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, and the subscripts 2 and 3 have no common factor, so they are not reduced further.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Checking the charges: 2 × (+3) = +6 and 3 × (−2) = −6, so the compound is neutral.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the formula of aluminium oxide is Al</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A gardener wants to raise a large number of rose plants that all bear flowers of exactly the same colour. He should use:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seeds of that plant</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cross-pollination</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Spores of that plant</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stem cuttings of that plant</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plants raised from a </span><span style=\"font-weight:bold;font-family:'Mangal'\">cutting</span><span style=\"font-family:'Mangal'\"> grow from a piece of the parent plant itself, so they carry the same characters as the parent and all of them bear flowers of the same colour.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cutting, grafting, layering and tissue culture are methods of </span><span style=\"font-weight:bold;font-family:'Mangal'\">vegetative propagation</span><span style=\"font-family:'Mangal'\">, which horticulturists have developed from a natural process and use to raise desirable plants on a large scale.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plants raised from </span><span style=\"font-weight:bold;font-family:'Mangal'\">seeds</span><span style=\"font-family:'Mangal'\"> come from a fusion of gametes, so they show variation and need not bear flowers of the same colour, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">cross-pollination</span><span style=\"font-family:'Mangal'\"> adds still more variation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Roses do not reproduce by </span><span style=\"font-weight:bold;font-family:'Mangal'\">spores</span><span style=\"font-family:'Mangal'\"> at all; spores are formed by organisms such as moulds and ferns.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he should use stem cuttings of that plant </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): The height of a pea plant and the shape of its seeds are always inherited together as a single unit.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): In the second generation of a cross between a tall plant with round seeds and a short plant with wrinkled seeds, new combinations such as tall plants with wrinkled seeds appear.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When a tall plant with round seeds is crossed with a short plant with wrinkled seeds, all the plants of the first generation are tall with round seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the </span><span style=\"font-weight:bold;font-family:'Mangal'\">second generation</span><span style=\"font-family:'Mangal'\">, however, plants that are </span><span style=\"font-weight:bold;font-family:'Mangal'\">tall with wrinkled seeds</span><span style=\"font-family:'Mangal'\"> and plants that are </span><span style=\"font-weight:bold;font-family:'Mangal'\">short with round seeds</span><span style=\"font-family:'Mangal'\"> also appear → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These new combinations could not appear if the two traits travelled together, so height and seed shape are </span><span style=\"font-weight:bold;font-family:'Mangal'\">inherited independently</span><span style=\"font-family:'Mangal'\"> of each other → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">That is why each germ cell must carry only one gene set, with the genes for the two traits free to be passed on separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which plastids contain pigments that give plants their yellow, orange or red colours?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chromoplasts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chloroplasts</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amyloplasts</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Leucoplasts</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plants have special organelles called </span><span style=\"font-weight:bold;font-family:'Mangal'\">plastids</span><span style=\"font-family:'Mangal'\"> for making and storing food.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The plastids of flower petals and fruits that hold pigments </span><span style=\"font-weight:bold;font-family:'Mangal'\">other than chlorophyll</span><span style=\"font-family:'Mangal'\"> are called </span><span style=\"font-weight:bold;font-family:'Mangal'\">chromoplasts</span><span style=\"font-family:'Mangal'\">, and these pigments give the yellow, orange and red colours.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bright colours from chromoplasts help attract pollinators and the animals that carry the seeds away.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Chloroplasts</span><span style=\"font-family:'Mangal'\"> carry the green pigment chlorophyll, </span><span style=\"font-weight:bold;font-family:'Mangal'\">leucoplasts</span><span style=\"font-family:'Mangal'\"> carry no pigment at all and are colourless, and amyloplasts are the colourless plastids in which starch is stored.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pigments are present in chromoplasts </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): A piece of soft iron placed inside a current-carrying solenoid gets magnetised.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): A strong magnetic field is produced inside a current-carrying solenoid.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A soft iron rod kept inside a solenoid does get magnetised while the current flows, and this is how an electromagnet is made → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The field lines inside a current-carrying solenoid are parallel straight lines, which shows that the field there is </span><span style=\"font-weight:bold;font-family:'Mangal'\">strong and the same at all points</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is this strong field inside the coil that magnetises the soft iron, so R is the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A soft iron rod is placed inside a coil of many closely wound turns of insulated copper wire and a current is passed through the coil.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This arrangement works as:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electric motor</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A galvanometer</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A permanent magnet</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electromagnet</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A coil of many circular turns of insulated copper wire wound closely in the shape of a cylinder is called a </span><span style=\"font-weight:bold;font-family:'Mangal'\">solenoid</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A strong magnetic field is produced inside a current-carrying solenoid, and this field </span><span style=\"font-weight:bold;font-family:'Mangal'\">magnetises a piece of magnetic material such as soft iron</span><span style=\"font-family:'Mangal'\"> kept inside the coil.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A magnet made in this way is called an </span><span style=\"font-weight:bold;font-family:'Mangal'\">electromagnet</span><span style=\"font-family:'Mangal'\">, and it stays a magnet only as long as the current flows.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electric motor turns electrical energy into motion and a galvanometer detects current, while a </span><span style=\"font-weight:bold;font-family:'Mangal'\">permanent</span><span style=\"font-family:'Mangal'\"> magnet keeps its magnetism without any current, so it is not made like this.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the arrangement works as an electromagnet </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The direction of the momentum of an object is the same as the direction of its velocity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. When a bullet is fired, the force on the gun is equal in magnitude to the force on the bullet.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The action and the reaction act on the same object, so they cancel each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Momentum is the product of mass and velocity, and mass is always positive, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">momentum points in the same direction as the velocity</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Firing a bullet is an action-reaction pair, so the gun pushes the bullet forward and the bullet pushes the gun back with a force of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">same magnitude</span><span style=\"font-family:'Mangal'\">; a 2 N force on the bullet means a 2 N recoil force on the gun → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Action and reaction act on </span><span style=\"font-weight:bold;font-family:'Mangal'\">two different objects</span><span style=\"font-family:'Mangal'\">, one on each of the two bodies that interact, so they never cancel each other → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A few drops of phenolphthalein are added to dilute sodium hydroxide solution and it turns pink.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dilute hydrochloric acid is then added drop by drop until the pink colour just disappears.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The liquid in the test tube now contains mainly:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sodium chloride and water</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only sodium hydroxide</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only hydrochloric acid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hydrogen gas</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Phenolphthalein is pink in a basic solution, so the pink colour shows that sodium hydroxide is present.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">As the acid is added it destroys the effect of the base, and the pink colour just disappears at the moment when the base has been completely used up.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The reaction between an acid and a base gives a </span><span style=\"font-weight:bold;font-family:'Mangal'\">salt and water</span><span style=\"font-family:'Mangal'\">, and here the salt is </span><span style=\"font-weight:bold;font-family:'Mangal'\">sodium chloride</span><span style=\"font-family:'Mangal'\">: NaOH + HCl → NaCl + H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">neutralisation reaction</span><span style=\"font-family:'Mangal'\">, so at this stage neither the base nor any extra acid is left, and no gas is given off.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the liquid contains mainly sodium chloride and water </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The fusion of the male and the female gamete is called fertilisation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In reptiles, birds and mammals, fertilisation takes place inside the body of the female.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Fertilisation that takes place outside the body of the female is called internal fertilisation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">fusion of the male and the female gamete is fertilisation</span><span style=\"font-family:'Mangal'\">, and it marks the beginning of a new life; the fertilised egg is called the zygote → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In </span><span style=\"font-weight:bold;font-family:'Mangal'\">reptiles, birds and mammals</span><span style=\"font-family:'Mangal'\"> the male gamete is placed inside the body of the female, so fertilisation is </span><span style=\"font-weight:bold;font-family:'Mangal'\">internal</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Fertilisation that takes place </span><span style=\"font-weight:bold;font-family:'Mangal'\">outside</span><span style=\"font-family:'Mangal'\"> the body, as in most fish and frogs, is called </span><span style=\"font-weight:bold;font-family:'Mangal'\">external</span><span style=\"font-family:'Mangal'\"> fertilisation, not internal → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the food chain grass → grasshopper → frog → snake, the snake belongs to which trophic level?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fourth</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The various steps of a food chain at which the transfer of food takes place are called trophic levels.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass makes its own food, so it is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">producer at the first trophic level</span><span style=\"font-family:'Mangal'\">; the grasshopper eats the grass and is a herbivore at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">second</span><span style=\"font-family:'Mangal'\"> level.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The frog eats the grasshopper, so it is a small carnivore at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">third</span><span style=\"font-family:'Mangal'\"> level, and the snake eats the frog.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Larger carnivores, or tertiary consumers, that feed on the small carnivores form the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fourth trophic level</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the snake belongs to the fourth trophic level </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An object is placed 20 cm in front of a concave mirror of focal length 12 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The image of the object is formed:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 cm in front of the mirror</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 cm behind the mirror</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5 cm in front of the mirror</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 cm in front of the mirror</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By the New Cartesian Sign Convention, distances measured against the direction of the incident light are negative, so u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20 cm</span><span style=\"font-family:'Mangal'\"> and, for a concave mirror, f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−12 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mirror formula: 1/v + 1/u = 1/f</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = 1/f − 1/u = (−1/12) − (−1/20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = (−5 + 3) / 60 = −2/60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The minus sign shows that the image lies on the same side as the object, that is in front of the mirror.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the image is formed 30 cm in front of the mirror </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about a wave:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The distance between two consecutive crests is called the wavelength.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The number of oscillations at a fixed point in one second is the frequency.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The frequency and the time period of a wave are directly proportional to each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The distance between two consecutive crests, or between two consecutive troughs, is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">wavelength</span><span style=\"font-family:'Mangal'\">, written as λ and measured in metre → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The number of oscillations at a fixed point in one second is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">frequency</span><span style=\"font-family:'Mangal'\">, written as ν and measured in hertz → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Frequency and time period are related by ν = 1/T, so they are </span><span style=\"font-weight:bold;font-family:'Mangal'\">inversely</span><span style=\"font-family:'Mangal'\"> related: a shorter time period means a higher frequency → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ozone present high up in the atmosphere is important for living beings because it:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Supplies oxygen for breathing</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Keeps the Earth warm at night</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Absorbs harmful ultraviolet radiation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Forms clouds and brings rain</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ozone is a molecule made of </span><span style=\"font-weight:bold;font-family:'Mangal'\">three atoms of oxygen</span><span style=\"font-family:'Mangal'\">, and it is quite different from the oxygen we breathe, which has two atoms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">High up in the atmosphere, ozone </span><span style=\"font-weight:bold;font-family:'Mangal'\">absorbs the harmful ultraviolet radiation</span><span style=\"font-family:'Mangal'\"> coming from the Sun, so it works like a shield for the living beings on the Earth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ultraviolet radiation that reaches the ground causes skin cancer and damages the eyes, which is why any damage to the ozone layer is a cause for concern.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ozone is not used in breathing, it does not hold in the heat of the Earth, and it has no part in forming clouds or bringing rain.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, ozone is important because it absorbs harmful ultraviolet radiation </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Ionic compounds generally have high melting and boiling points.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Covalent compounds such as camphor and naphthalene conduct electricity easily.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Covalent compounds usually have low melting and boiling points.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In an ionic compound the oppositely charged ions attract one another strongly, and a large amount of energy is needed to break this attraction, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">melting and boiling points are high</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A covalent compound such as camphor or naphthalene has no free ions or free electrons, so it </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not conduct electricity</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The forces between the molecules of a covalent compound are weak, so it melts and boils at </span><span style=\"font-weight:bold;font-family:'Mangal'\">low temperatures</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An iron nail is dipped in copper sulfate solution. After some time the nail gets a brownish coating and the blue colour of the solution fades. This reaction is a:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Combination reaction</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Decomposition reaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Double displacement reaction</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Displacement reaction</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Iron is more reactive than copper, so iron takes the place of copper in the salt solution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The brownish coating on the nail is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">copper</span><span style=\"font-family:'Mangal'\"> set free, and the blue colour fades because the copper sulfate of the solution is used up and iron sulfate is formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A reaction in which </span><span style=\"font-weight:bold;font-family:'Mangal'\">one element displaces another element from its compound</span><span style=\"font-family:'Mangal'\"> is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">displacement reaction</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a combination reaction two or more substances join to give a single product, in a decomposition reaction one substance breaks up into simpler ones, and in a double displacement reaction two compounds exchange their ions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, this reaction is a displacement reaction </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the Earth's atmosphere:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. It consists mainly of nitrogen, about 78 per cent, and oxygen, about 21 per cent.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. It is held in place by the force of the Earth's gravity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The layer closest to the Earth's surface is the stratosphere.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The atmosphere consists mainly of </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitrogen, about 78 per cent</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen, about 21 per cent</span><span style=\"font-family:'Mangal'\">, with small amounts of argon, carbon dioxide, water vapour and other gases → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The atmosphere is held around the Earth by the force of the Earth's </span><span style=\"font-weight:bold;font-family:'Mangal'\">gravity</span><span style=\"font-family:'Mangal'\">, which is why it does not escape into space → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The layer </span><span style=\"font-weight:bold;font-family:'Mangal'\">closest to the surface</span><span style=\"font-family:'Mangal'\"> is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">troposphere</span><span style=\"font-family:'Mangal'\">, which reaches up to about 12 km and holds our clouds and weather; the stratosphere lies above it → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The girth of the stem of a tree keeps increasing year after year. This increase in girth is brought about by the:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apical meristem</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Permanent tissue</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Intercalary meristem</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lateral meristem</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meristematic tissue is the tissue whose cells go on dividing and add new cells to the plant body.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The meristematic tissue that is responsible for the </span><span style=\"font-weight:bold;font-family:'Mangal'\">increase in girth</span><span style=\"font-family:'Mangal'\"> of a stem or a root is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">lateral meristem</span><span style=\"font-family:'Mangal'\">, which lies along the sides of the plant body.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">apical meristem</span><span style=\"font-family:'Mangal'\"> sits at the tip of the shoot and of the root, so it increases the </span><span style=\"font-weight:bold;font-family:'Mangal'\">length</span><span style=\"font-family:'Mangal'\"> of the plant, not the girth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Intercalary meristem</span><span style=\"font-family:'Mangal'\"> lies at the base of the leaves or at the nodes, and a </span><span style=\"font-weight:bold;font-family:'Mangal'\">permanent tissue</span><span style=\"font-family:'Mangal'\"> has already lost the power to divide, so neither can add to the girth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the increase in girth is brought about by the lateral meristem </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match List I with List II:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790164427417_image002.png\" style=\"width: 808px; height: 200px;\" /></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the correct answer:</span></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(iii), (d)-(i)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Skeletal muscle</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brings about voluntary movement</span><span style=\"font-family:'Mangal'\">: it is attached to the skeleton and moves only when we want it to.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Smooth muscle</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brings about movement of the stomach and intestines</span><span style=\"font-family:'Mangal'\">: it works on its own, without our control, in slow and continuous movements such as digestion.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Neuron</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carries messages from one part of the body to another</span><span style=\"font-family:'Mangal'\">: the cells of nervous tissue receive, process and pass on messages.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Tendon</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Joins a muscle to a bone</span><span style=\"font-family:'Mangal'\">: it passes the pull of the muscle on to the bone and so brings about movement.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-(ii), (b)-(iv), (c)-(i), (d)-(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A goalkeeper stops a moving ball. While doing so his hands move back in the direction in which the ball was travelling.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The work done by the goalkeeper on the ball is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Positive</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Negative</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zero</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Equal to the force applied</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by a force = force × displacement in the direction of the force.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The goalkeeper pushes the ball </span><span style=\"font-weight:bold;font-family:'Mangal'\">backwards</span><span style=\"font-family:'Mangal'\">, against the motion, while the ball still moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">forward</span><span style=\"font-family:'Mangal'\">, so the force and the displacement are in </span><span style=\"font-weight:bold;font-family:'Mangal'\">opposite</span><span style=\"font-family:'Mangal'\"> directions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the displacement is opposite to the applied force, the work done by that force is </span><span style=\"font-weight:bold;font-family:'Mangal'\">negative</span><span style=\"font-family:'Mangal'\">, and it is this negative work that takes the kinetic energy away from the ball and stops it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The work done cannot be zero because the ball does move while the force acts, and work and force are different quantities, measured in joule and newton.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the work done by the goalkeeper on the ball is negative </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Ionic compounds have high melting and boiling points.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Ionic compounds are generally brittle and break into pieces when pressure is applied.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A great deal of energy is needed to break the strong force of attraction between the positive and the negative ions, so ionic compounds melt and boil only at </span><span style=\"font-weight:bold;font-family:'Mangal'\">high temperatures</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ionic compounds are also </span><span style=\"font-weight:bold;font-family:'Mangal'\">brittle</span><span style=\"font-family:'Mangal'\"> and break into pieces when pressure is applied on them → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But brittleness is about how the solid behaves when it is struck; it does not tell us anything about the energy needed to melt the solid, so R is not the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The correct reason for A is the strong inter-ionic attraction itself.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A cyclist rides 400 m due east along a straight road.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He then turns back and rides 250 m due west along the same road.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The total distance covered and the magnitude of his displacement are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">650 m and 650 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">650 m and 150 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 m and 650 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400 m and 250 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance is the whole length of the path covered, so it is the sum of the two parts.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total distance = 400 + 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">650 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Displacement is the net change in position between the starting point and the final point.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cyclist ends up 400 − 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 m</span><span style=\"font-family:'Mangal'\"> east of his starting point, so the magnitude of the displacement is 150 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the two values are 650 m and 150 m </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
