'Mangal'\">₹3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: interest on ₹3,000 for 3 years at 4% = (3,000 × 4 × 3) / 100 = ₹360 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: P = (extra interest × 100) / (extra rate × time)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (360 × 100) / (4 × 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the principal is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,000 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sides of a triangle are 13 cm, 14 cm and 15 cm. What is the length of the altitude drawn to the side of length 14 cm?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11.2 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10.5 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First find the area of the triangle from its three sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Semi-perimeter s = (13 + 14 + 15) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area by Heron's formula = √[s(s − a)(s − b)(s − c)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(21 × 8 × 7 × 6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √7056 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now take the side of 14 cm as the base.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area = (1/2) × base × altitude</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 = (1/2) × 14 × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = (84 × 2) / 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: altitude = (2 × area) / base</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the altitude to the side of 14 cm is </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One diagonal of a rhombus is 16 cm and each side of the rhombus is 10 cm. What is the area of the rhombus?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112 cm²</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The diagonals of a rhombus bisect each other at right angles, so they cut it into four equal right triangles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half of the given diagonal = 16 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In one such right triangle the side of 10 cm is the hypotenuse.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(half of the other diagonal)² = 10² − 8² = 100 − 64 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half of the other diagonal = √36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Other diagonal = 2 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area = (d₁ × d₂) / 2 = (16 × 12) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: area of a rhombus = (product of the diagonals) / 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the rhombus is </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 cm² (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The average of 11 consecutive even numbers is 54. What is the largest of these numbers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">66</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 11 numbers are in arithmetic progression with a common difference of 2, so the middle number is the average.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Middle number (the 6th) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The largest number lies 5 steps to the right of the middle one.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Largest = 54 + (5 × 2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: the numbers are 44, 46, 48, …, 64; their sum = 594 and 594 / 11 = 54 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: for an odd count of terms in AP the middle term is the average, and the largest = average + [(n − 1)/2] × common difference</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the largest number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a class test, 30% of the students failed in Mathematics, 20% failed in English and 10% failed in both subjects. If 720 students passed in both subjects, how many students appeared in the test?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,080</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,440</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">960</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the number of students who appeared as 100%.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 10% who failed in both are counted inside the 30% and again inside the 20%, so count them once.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Failed in at least one subject = 30% + 20% − 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Passed in both subjects = 100% − 40% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60% of the total = 720 students</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total = (720 / 60) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 students</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: failures are 360 in Mathematics, 240 in English and 120 in both; 360 + 240 − 120 = 480 and 1,200 − 480 = 720 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: students who passed in both = 100% − (30% + 20% − 10%) = 60% of the total</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total = 720 × (100/60) = 1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of students who appeared is </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Navya and Bhavya can paint a house in 40 days and 60 days, respectively. If they work on alternate days, starting with Bhavya, in how many days can the duo complete painting that house?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the whole work as 120 units, the LCM (लघुत्तम समापवर्त्य) of 40 and 60.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Navya's one day's work = 120 / 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bhavya's one day's work = 120 / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They work on alternate days starting with Bhavya, so a pair of two days gives 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pairs needed = 120 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 pairs</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 pairs = 24 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 days</span><span style=\"font-family:'Mangal'\">, and the work finishes exactly at the end of the 48th day.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the house is painted in </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 days (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A car covers a total distance of 360 km. It covers the first 120 km at 40 km/h. Of the remaining distance, it then covers one-third at 60 km/h and the rest at a constant speed v. If the car’s overall average speed for the whole trip is 60 km/h, what is the value of v?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 km/h</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The whole trip is 360 km at an average speed of 60 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total time = 360 / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time for the first 120 km = 120 / 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remaining distance = 360 − 120 = 240 km; one-third of it = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time for these 80 km = 80 / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/3 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Last part of the journey = 240 − 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">160 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time left for it = 6 − 3 − 4/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5/3 hours</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = 160 / (5/3) = 160 × (3/5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of v is </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 km/h (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the area of a sector of a circle of radius 21 cm whose central angle is 120°. (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">154 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">231 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">308 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">462 cm²</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sector is the part of a circle cut off by two radii, and its share of the circle is the share of 360° that its angle takes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the whole circle = π × r² = (22/7) × 21 × 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,386 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Share of the sector = 120° / 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the sector = 1,386 × (1/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">462 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: area of a sector = (θ / 360°) × π × r²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (120° / 360°) × (22/7) × 21 × 21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 462 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the sector is </span><span style=\"font-weight:bold;font-family:'Mangal'\">462 cm² (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mean of 20 observations is 15. If each observation is first multiplied by 3 and then 5 is subtracted from each of them, what is the mean of the new observations?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mean of the 20 observations is 15.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum of the observations = 20 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiplying every observation by 3 multiplies the sum by 3: new sum = 3 × 300 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Subtracting 5 from each of the 20 observations reduces the sum by 20 × 5 = 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New sum = 900 − 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New mean = 800 / 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: if every observation x becomes (3x − 5), the mean becomes (3 × mean) − 5 = (3 × 15) − 5 = 40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the new mean is </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the largest number that divides 964 and 1,238, leaving remainders of 4 and 8, respectively.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If a number leaves remainder 4 on dividing 964, it divides 964 − 4 exactly.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">964 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Similarly, it divides 1,238 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,230</span><span style=\"font-family:'Mangal'\"> exactly.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the required number is the HCF (महत्तम समापवर्तक) of 960 and 1,230.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">960 = 2⁵ × 3 × 5 and 1,230 = 2 × 3 × 5 × 41</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Common factors = 2 × 3 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 960 / 30 = 32 and 1,230 / 30 = 41, both exact ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: required number = HCF (महत्तम समापवर्तक) of (964 − 4) and (1,238 − 8)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the largest such number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What price should Amit mark on a pair of jeans which cost him ₹7,700, so as to gain 32% after allowing successive discounts of 16% and 20%?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,997</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,993</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,125</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,183</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cost price is ₹7,700 and the required gain is 32%.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price = 7,700 × 132% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹10,164</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The two discounts act one after the other on the marked price.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price = MP × 84% × 80% = MP × </span><span style=\"font-weight:bold;font-family:'Mangal'\">67.2%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MP × 0.672 = 10,164</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MP = 10,164 / 0.672 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 15,125 × 84% = 12,705 and 12,705 × 80% = 10,164 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: MP = (CP × 1.32) / (0.84 × 0.80)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 10,164 / 0.672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 15,125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the marked price should be </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,125 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of ₹7,800 is divided among P, Q and R in the inverse ratio 2 : 3 : 4. What is R's share?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,600</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An inverse ratio means the shares are proportional to 1/2, 1/3 and 1/4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Multiply each fraction by the LCM (लघुत्तम समापवर्त्य) of 2, 3 and 4, which is 12.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12/2) : (12/3) : (12/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 : 4 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total parts = 6 + 4 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Value of one part = 7,800 / 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R's share = 3 × 600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 3,600 + 2,400 + 1,800 = 7,800 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: R's share = 7,800 × (3/13) = 1,800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, R's share is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,800 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who founded the Gandharva Mahavidyalaya at Lahore in 1901 to take the teaching of Hindustani classical music to the common people?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pandit Vishnu Narayan Bhatkhande</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ustad Alladiya Khan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pandit Vishnu Digambar Paluskar</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pandit Omkarnath Thakur</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Vishnu Digambar Paluskar</span><span style=\"font-family:'Mangal'\"> (1872 to 1931) founded the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gandharva Mahavidyalaya</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lahore</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 May 1901</span><span style=\"font-family:'Mangal'\"> and opened a branch at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bombay in 1908</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He is credited with the tune of the bhajan </span><span style=\"font-weight:bold;font-family:'Mangal'\">Raghupati Raghava Raja Ram</span><span style=\"font-family:'Mangal'\"> as it is sung today.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Vishnu Narayan Bhatkhande</span><span style=\"font-family:'Mangal'\"> (1860 to 1936) devised the notation system used for Hindustani classical music and classified its ragas into </span><span style=\"font-weight:bold;font-family:'Mangal'\">ten thaats</span><span style=\"font-family:'Mangal'\">; the music college he helped start at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lucknow in 1926</span><span style=\"font-family:'Mangal'\"> is today the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bhatkhande Sanskriti Vishwavidyalaya</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the founder is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pandit Vishnu Digambar Paluskar (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At the 72nd National Film Awards, announced on 18 July 2026, which film won the award for Best Feature Film?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amaran</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family: "font-weight:bold;font-family:'Mangal'\">Chandu Champion</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Rajkumar Periasamy</span><span style=\"font-family:'Mangal'\"> won </span><span style=\"font-weight:bold;font-family:'Mangal'\">Best Director</span><span style=\"font-family:'Mangal'\"> for </span><span style=\"font-weight:bold;font-family:'Mangal'\">Amaran</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These awards covered films certified by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Central Board of Film Certification</span><span style=\"font-family:'Mangal'\"> during </span><span style=\"font-weight:bold;font-family:'Mangal'\">2024</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Best Feature Film is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 370 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the Ministry of Railways in July 2026, what share of the broad-gauge network of Indian Railways has been electrified?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85.4%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92.8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96.2%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">99.6%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By </span><span style=\"font-weight:bold;font-family:'Mangal'\">July 2026</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">99.6%</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">broad-gauge</span><span style=\"font-family:'Mangal'\"> network of Indian Railways had been electrified.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This places India </span><span style=\"font-weight:bold;font-family:'Mangal'\">second in the world</span><span style=\"font-family:'Mangal'\"> in railway electrification, behind </span><span style=\"font-weight:bold;font-family:'Mangal'\">Switzerland</span><span style=\"font-family:'Mangal'\">, whose network is </span><span style=\"font-weight:bold;font-family:'Mangal'\">100%</span><span style=\"font-family:'Mangal'\"> electrified.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">21,801 route km</span><span style=\"font-family:'Mangal'\"> were electrified in the six decades before 2014 and </span><span style=\"font-weight:bold;font-family:'Mangal'\">48,072 route km</span><span style=\"font-family:'Mangal'\"> between 2014 and 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">15</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">19</span><span style=\"font-family:'Mangal'\"> railway zones and </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span><span style=\"font-family:'Mangal'\"> States and Union Territories have reached </span><span style=\"font-weight:bold;font-family:'Mangal'\">100%</span><span style=\"font-family:'Mangal'\"> electrification.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the share is </span><span style=\"font-weight:bold;font-family:'Mangal'\">99.6% (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In January 2026, the DRDO successfully ground-tested a full-scale actively cooled scramjet engine for more than 12 minutes. This engine is being developed for which programme?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ballistic missile defence programme</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hypersonic cruise missile programme</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reusable launch vehicle programme</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Man-portable anti-tank guided missile programme</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 January 2026</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Defence Research and Development Laboratory (DRDL), Hyderabad</span><span style=\"font-family:'Mangal'\">, a laboratory of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">DRDO</span><span style=\"font-family:'Mangal'\">, ran a full-scale actively cooled </span><span style=\"font-weight:bold;font-family:'Mangal'\">scramjet</span><span style=\"font-family:'Mangal'\"> engine for more than </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 minutes</span><span style=\"font-family:'Mangal'\"> at its </span><span style=\"font-weight:bold;font-family:'Mangal'\">Scramjet Connect Pipe Test facility</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The test validated the design of the advanced scramjet combustor as well as the test facility itself.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is a step in India's </span><span style=\"font-weight:bold;font-family:'Mangal'\">hypersonic cruise missile programme</span><span style=\"font-family:'Mangal'\">, which targets speeds of more than </span><span style=\"font-weight:bold;font-family:'Mangal'\">five times</span><span style=\"font-family:'Mangal'\"> the speed of sound, that is over </span><span style=\"font-weight:bold;font-family:'Mangal'\">6,100 km/h</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">scramjet</span><span style=\"font-family:'Mangal'\"> is an air-breathing engine in which combustion takes place in a supersonic airstream, so the vehicle need not carry its own oxidiser.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the programme is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">hypersonic cruise missile programme (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which team won the IPL 2026 title by beating Gujarat Titans by 5 wickets in the final played on 31 May 2026 at the Narendra Modi Stadium, Ahmedabad?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Royal Challengers Bengaluru</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chennai Super Kings</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mumbai Indians</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Punjab Kings</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Royal Challengers Bengaluru</span><span style=\"font-family:'Mangal'\"> beat </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gujarat Titans</span><span style=\"font-family:'Mangal'\"> by </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 wickets</span><span style=\"font-family:'Mangal'\"> in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">IPL 2026</span><span style=\"font-family:'Mangal'\"> final on </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 May 2026</span><span style=\"font-family:'Mangal'\"> at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi Stadium, Ahmedabad</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gujarat Titans scored </span><span style=\"font-weight:bold;font-family:'Mangal'\">155/8</span><span style=\"font-family:'Mangal'\"> and Bengaluru overhauled the target with wickets in hand.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Virat Kohli</span><span style=\"font-family:'Mangal'\"> was adjudged Player of the Match for his unbeaten </span><span style=\"font-weight:bold;font-family:'Mangal'\">75 off 42 balls</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was Bengaluru's </span><span style=\"font-weight:bold;font-family:'Mangal'\">second</span><span style=\"font-family:'Mangal'\"> IPL title and their </span><span style=\"font-weight:bold;font-family:'Mangal'\">second in a row</span><span style=\"font-family:'Mangal'\">, which made them the third franchise to win back-to-back titles after </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chennai Super Kings</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mumbai Indians</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winner is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Royal Challengers Bengaluru (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The India AI Impact Summit 2026, held at Bharat Mandapam, New Delhi, in February 2026, was the fourth summit in the series of global AI summits. Which city had hosted the previous edition, in 2025?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seoul</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">London</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Geneva</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Paris</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">India AI Impact Summit 2026</span><span style=\"font-family:'Mangal'\"> was held at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bharat Mandapam, New Delhi</span><span style=\"font-family:'Mangal'\">, in </span><span style=\"font-weight:bold;font-family:'Mangal'\">February 2026</span><span style=\"font-family:'Mangal'\"> and was organised by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Electronics and Information Technology (MeitY)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was the </span><span style=\"font-weight:bold;font-family:'Mangal'\">first</span><span style=\"font-family:'Mangal'\"> summit of this series to be hosted by a country of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Global South</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The earlier editions were the </span><span style=\"font-weight:bold;font-family:'Mangal'\">AI Safety Summit</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bletchley Park in the United Kingdom (2023)</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">AI Seoul Summit (2024)</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">AI Action Summit</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Paris (2025)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Delhi summit was built on three Sutras, </span><span style=\"font-weight:bold;font-family:'Mangal'\">People, Planet and Progress</span><span style=\"font-family:'Mangal'\">, and seven working groups called Chakras, with delegations from over </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span><span style=\"font-family:'Mangal'\"> countries.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the previous edition was hosted by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Paris (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Industrial Policy Resolution of 1956 categorised industries into how many groups?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Five</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nine</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seven</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Industrial Policy Resolution of 1956</span><span style=\"font-family:'Mangal'\"> divided industries into </span><span style=\"font-weight:bold;font-family:'Mangal'\">three</span><span style=\"font-family:'Mangal'\"> schedules.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Schedule A</span><span style=\"font-family:'Mangal'\"> listed </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\"> industries reserved exclusively for the State, such as atomic energy, arms and ammunition and the railways.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Schedule B</span><span style=\"font-family:'Mangal'\"> listed </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\"> industries in which the State would set up new units while private enterprise could also expand.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Schedule C</span><span style=\"font-family:'Mangal'\"> covered all the remaining industries, left to private enterprise under government licensing.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of groups is </span><span style=\"font-weight:bold;font-family:'Mangal'\">three (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which among the following slogans was popularised by Bal Gangadhar Tilak?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Swaraj is my birthright and I shall have it</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Give me blood and I will give you freedom</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Freedom is our goal and we shall achieve it</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Liberty is our dream and we must attain it</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Bal Gangadhar Tilak</span><span style=\"font-family:'Mangal'\"> popularised the slogan </span><span style=\"font-weight:bold;font-family:'Mangal'\">Swaraj is my birthright and I shall have it</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">He was one of the leaders of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Extremist</span><span style=\"font-family:'Mangal'\"> group of the Indian National Congress, along with </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bipin Chandra Pal</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lala Lajpat Rai</span><span style=\"font-family:'Mangal'\">, and he brought out the newspapers </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kesari</span><span style=\"font-family:'Mangal'\"> in Marathi and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mahratta</span><span style=\"font-family:'Mangal'\"> in English.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The slogan </span><span style=\"font-weight:bold;font-family:'Mangal'\">Give me blood and I will give you freedom</span><span style=\"font-family:'Mangal'\"> was given by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Subhas Chandra Bose</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the slogan is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Swaraj is my birthright and I shall have it (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 44th Amendment Act of 1978 took the right to property out of the list of Fundamental Rights and made it a constitutional legal right under which Article of the Constitution of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 19(1)(f)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Article 300A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">44th Amendment Act, 1978</span><span style=\"font-family:'Mangal'\"> repealed </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 19(1)(f)</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 31</span><span style=\"font-family:'Mangal'\">, which together had made the </span><span style=\"font-weight:bold;font-family:'Mangal'\">right to property</span><span style=\"font-family:'Mangal'\"> a Fundamental Right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It inserted </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 300A</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Part XII</span><span style=\"font-family:'Mangal'\">, which lays down that no person shall be deprived of his property save by authority of law.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The right to property is therefore a constitutional legal right and not a Fundamental Right, so it cannot be enforced directly under </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 32</span><span style=\"font-family:'Mangal'\">, which itself remains a Fundamental Right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Article is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Article 300A (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On 31 July 2026, the Union Cabinet approved the revamped Khelo India Scheme along with the Assistance to National Sports Federations Scheme for 2026-27 to 2030-31 with a total outlay of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹18,220 crore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹28,840 crore</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3
