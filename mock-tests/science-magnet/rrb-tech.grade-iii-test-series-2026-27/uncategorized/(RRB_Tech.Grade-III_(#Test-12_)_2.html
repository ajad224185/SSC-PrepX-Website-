rgin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plants show two kinds of movement, one </span><span style=\"font-weight:bold;font-family:'Mangal'\">dependent on growth</span><span style=\"font-family:'Mangal'\"> and the other </span><span style=\"font-weight:bold;font-family:'Mangal'\">independent of growth</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The bending of a shoot towards light happens because the shoot </span><span style=\"font-weight:bold;font-family:'Mangal'\">grows more on the side away from the light</span><span style=\"font-family:'Mangal'\">, so it is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">growth-dependent</span><span style=\"font-family:'Mangal'\"> movement → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Environmental triggers such as light or gravity change the </span><span style=\"font-weight:bold;font-family:'Mangal'\">direction in which plant parts grow</span><span style=\"font-family:'Mangal'\">, and such directional movements are called </span><span style=\"font-weight:bold;font-family:'Mangal'\">tropic movements</span><span style=\"font-family:'Mangal'\">, which may be towards the stimulus or away from it → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The folding of the leaves of the sensitive plant on touch is the other kind, a movement that does not depend on growth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A person finds that his image in a mirror is always erect, however far or near he stands from it. The mirror can be:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only concave</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only convex</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Either plane or concave</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Either plane or convex</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">plane mirror</span><span style=\"font-family:'Mangal'\"> always gives a </span><span style=\"font-weight:bold;font-family:'Mangal'\">virtual, erect image of the same size</span><span style=\"font-family:'Mangal'\">, whatever the distance of the object.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">convex mirror</span><span style=\"font-family:'Mangal'\"> always gives a </span><span style=\"font-weight:bold;font-family:'Mangal'\">virtual, erect and diminished image</span><span style=\"font-family:'Mangal'\">, for an object anywhere between infinity and the pole; this is why it is used as a rear-view mirror.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">concave mirror</span><span style=\"font-family:'Mangal'\"> gives an erect image only when the object lies between the pole and the focus; for all other positions the image is real and inverted.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since the image stays erect at every distance, the mirror cannot be concave.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mirror is either plane or convex </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): The Sun remains visible for about two minutes after it has actually crossed the horizon at sunset.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): The refractive index of air increases as one goes higher above the surface of the Earth.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Actual sunset means the actual crossing of the horizon by the Sun, and because of </span><span style=\"font-weight:bold;font-family:'Mangal'\">atmospheric refraction</span><span style=\"font-family:'Mangal'\"> the Sun is still seen for about </span><span style=\"font-weight:bold;font-family:'Mangal'\">two minutes</span><span style=\"font-family:'Mangal'\"> after that → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Starlight and sunlight are refracted in the atmosphere because it is a medium of </span><span style=\"font-weight:bold;font-family:'Mangal'\">gradually changing refractive index</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Air becomes thinner as one goes higher, so the refractive index of air </span><span style=\"font-weight:bold;font-family:'Mangal'\">decreases</span><span style=\"font-family:'Mangal'\">, and does not increase, with altitude → R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is true but R is false </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Weak ion currents moving along the nerve cells of our body produce magnetic fields. The magnetic field produced inside the body forms the basis of which technique used in medical diagnosis?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ultrasound scanning</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X-ray imaging</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Endoscopy</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Magnetic Resonance Imaging</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When we touch something, the nerves carry an electric impulse to the muscles, and this impulse produces a </span><span style=\"font-weight:bold;font-family:'Mangal'\">temporary magnetic field</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These fields are extremely weak, about </span><span style=\"font-weight:bold;font-family:'Mangal'\">one-billionth of the Earth's magnetic field</span><span style=\"font-family:'Mangal'\">, and they are strongest for the </span><span style=\"font-weight:bold;font-family:'Mangal'\">heart and the brain</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The magnetic field inside the body forms the basis of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Magnetic Resonance Imaging (MRI)</span><span style=\"font-family:'Mangal'\">, which gives images of different parts of the body for medical diagnosis.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ultrasound scanning</span><span style=\"font-family:'Mangal'\"> uses ultrasonic waves and </span><span style=\"font-weight:bold;font-family:'Mangal'\">X-ray imaging</span><span style=\"font-family:'Mangal'\"> uses X-rays, neither of which depends on the body's own magnetic field.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the technique is Magnetic Resonance Imaging </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During adolescence the voice of a boy becomes deeper than it was before. The main reason is that his vocal cords:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Become shorter and thinner</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stop vibrating for a while</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Become longer and thicker</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Are replaced by new ones</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sound in human beings is produced by the vibration of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">vocal cords</span><span style=\"font-family:'Mangal'\">, which are stretched muscular flaps inside the voice box.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During adolescence a boy's vocal cords become </span><span style=\"font-weight:bold;font-family:'Mangal'\">longer and thicker</span><span style=\"font-family:'Mangal'\">, so they </span><span style=\"font-weight:bold;font-family:'Mangal'\">vibrate less frequently</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The frequency of the sound therefore becomes lower.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pitch</span><span style=\"font-family:'Mangal'\"> is how we perceive frequency: a lower frequency is heard as a </span><span style=\"font-weight:bold;font-family:'Mangal'\">low pitch</span><span style=\"font-family:'Mangal'\">, which is why the voice sounds deeper.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the vocal cords become longer and thicker </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the male and female gametes of animals:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Sperms are produced in millions, while eggs are produced only in small numbers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The egg has stored nutrients in it, whereas a sperm has none.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Both the sperm and the egg are actively motile.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Gametogenesis in the male produces </span><span style=\"font-weight:bold;font-family:'Mangal'\">numerous tiny sperms</span><span style=\"font-family:'Mangal'\">, while in the female usually </span><span style=\"font-weight:bold;font-family:'Mangal'\">one large egg</span><span style=\"font-family:'Mangal'\"> matures at a time → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The egg carries </span><span style=\"font-weight:bold;font-family:'Mangal'\">stored nutrients</span><span style=\"font-family:'Mangal'\"> that nourish the early embryo, while a sperm is mainly genetic material with a tail and has </span><span style=\"font-weight:bold;font-family:'Mangal'\">no stored food</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">sperm is actively motile</span><span style=\"font-family:'Mangal'\"> because of its long tail, but the </span><span style=\"font-weight:bold;font-family:'Mangal'\">egg is non-motile</span><span style=\"font-family:'Mangal'\"> and is carried along the oviduct → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A current of 0.5 A is drawn by the filament of an electric bulb for 10 minutes. The amount of electric charge that flows through the circuit in this time is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electric current is the rate of flow of charge, so I = Q/t.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Here I = 0.5 A and t = 10 minutes = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q = I × t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 0.5 × 600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One ampere is the flow of one coulomb of charge per second, so a current of 0.5 A carries 0.5 C every second.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the charge that flows is 300 C </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about inheritance in human beings:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The father and the mother contribute practically equal amounts of genetic material to the child.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. For every trait there are two versions in each child, one from each parent.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Out of the 23 pairs of chromosomes in a human cell, 22 pairs are sex chromosomes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Both the father and the mother contribute </span><span style=\"font-weight:bold;font-family:'Mangal'\">practically equal amounts of genetic material</span><span style=\"font-family:'Mangal'\"> to the child, so each trait can be influenced by paternal as well as maternal DNA → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Since each parent contributes a copy of the same gene, there will be </span><span style=\"font-weight:bold;font-family:'Mangal'\">two versions of every trait</span><span style=\"font-family:'Mangal'\"> in each child → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Twenty-two pairs</span><span style=\"font-family:'Mangal'\"> of human chromosomes are </span><span style=\"font-weight:bold;font-family:'Mangal'\">autosomes</span><span style=\"font-family:'Mangal'\">; only the remaining </span><span style=\"font-weight:bold;font-family:'Mangal'\">one pair</span><span style=\"font-family:'Mangal'\"> is the pair of sex chromosomes → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The amount of ozone in the atmosphere began to drop sharply during which decade?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 1950s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 1980s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 1920s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 2010s</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The amount of ozone in the atmosphere began to drop </span><span style=\"font-weight:bold;font-family:'Mangal'\">sharply in the 1980s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This drop was linked to the use of chemicals such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">chlorofluorocarbons (CFCs)</span><span style=\"font-family:'Mangal'\">, which were used as refrigerants and in fire extinguishers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The ozone layer shields the surface of the Earth from </span><span style=\"font-weight:bold;font-family:'Mangal'\">ultraviolet radiation</span><span style=\"font-family:'Mangal'\">, which is highly damaging to organisms and is known to cause </span><span style=\"font-weight:bold;font-family:'Mangal'\">skin cancer</span><span style=\"font-family:'Mangal'\"> in human beings.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sharp drop began in the 1980s </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An elephant strips off a complete ring of bark from the trunk of a tree. Over the next few weeks the tree begins to die. The tissue that is cut along with the bark and causes this is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Xylem, which carries water upward</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Epidermis, which checks water loss</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Phloem, which carries food downward</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cambium, which makes the bark thick</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">bark</span><span style=\"font-family:'Mangal'\"> of a tree is made of </span><span style=\"font-weight:bold;font-family:'Mangal'\">cork cells</span><span style=\"font-family:'Mangal'\">, which are dead and impermeable to water and gases, and just beneath it lies the </span><span style=\"font-weight:bold;font-family:'Mangal'\">phloem</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When a complete ring of bark is stripped off, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">phloem is cut all around the trunk</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Phloem carries the </span><span style=\"font-weight:bold;font-family:'Mangal'\">food made in the leaves down to the stem and roots</span><span style=\"font-family:'Mangal'\">, so the roots are starved and the tree dies over a few weeks.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Xylem</span><span style=\"font-family:'Mangal'\"> lies deeper in the trunk and is not removed, so water still rises from the roots for some time.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the phloem, which carries food downward, is responsible </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): The large circular patterns formed by ocean currents, called gyres, rotate clockwise in the Northern Hemisphere.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Ocean currents carry heat from the equatorial regions towards the poles.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Moving masses of ocean water are deflected by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">rotation of the Earth</span><span style=\"font-family:'Mangal'\"> and form large circular patterns called </span><span style=\"font-weight:bold;font-family:'Mangal'\">gyres</span><span style=\"font-family:'Mangal'\">; these rotate </span><span style=\"font-weight:bold;font-family:'Mangal'\">clockwise in the Northern Hemisphere</span><span style=\"font-family:'Mangal'\"> and counter clockwise in the Southern Hemisphere → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ocean currents also </span><span style=\"font-weight:bold;font-family:'Mangal'\">transport heat from the equator towards the poles</span><span style=\"font-family:'Mangal'\">, which reduces the temperature difference across the planet → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sense of rotation of a gyre follows from the deflection caused by the Earth's rotation, not from the transport of heat, so R is not the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The refractive index of diamond is 2.42. Taking the speed of light in air as 3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s, the speed of light in diamond is about:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.42 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.26 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.24 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.00 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The absolute refractive index of a medium is n = c/v, where c is the speed of light in air and v is the speed of light in the medium.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So v = c/n</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">) / 2.42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.24 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light travels fastest in vacuum, at 3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s, and a refractive index of 2.42 means light slows down to about two-fifths of that speed inside diamond.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the speed of light in diamond is about 1.24 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about domestic electric circuits:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In our homes, AC electric power is received at 220 V with a frequency of 50 Hz.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A wire with green insulation is usually the earth wire of the supply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. At the time of a short circuit, the current in the circuit falls sharply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In homes, </span><span style=\"font-weight:bold;font-family:'Mangal'\">AC electric power is received at 220 V</span><span style=\"font-family:'Mangal'\"> between the live and the neutral wires, with a </span><span style=\"font-weight:bold;font-family:'Mangal'\">frequency of 50 Hz</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">earth wire</span><span style=\"font-family:'Mangal'\"> carries </span><span style=\"font-weight:bold;font-family:'Mangal'\">green insulation</span><span style=\"font-family:'Mangal'\"> and is connected to a metal plate deep in the earth, while the live wire has red insulation and the neutral wire black → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. At the time of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">short circuit the current increases heavily</span><span style=\"font-family:'Mangal'\">, and it is this large current that melts the fuse wire and breaks the circuit → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The equation HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O has to be balanced. The coefficients of HNO₃ and H₂O respectively are:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 and 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 and 1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ca(NO₃)₂ on the right carries </span><span style=\"font-weight:bold;font-family:'Mangal'\">two nitrate groups</span><span style=\"font-family:'Mangal'\">, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">2HNO₃</span><span style=\"font-family:'Mangal'\"> are needed on the left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The left side then has 2 hydrogen atoms from 2HNO₃ and 2 more from Ca(OH)₂, that is </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 hydrogen atoms</span><span style=\"font-family:'Mangal'\">, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">2H₂O</span><span style=\"font-family:'Mangal'\"> are needed on the right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The balanced equation is 2HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2H₂O.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: oxygen = (2 × 3) + 2 = 8 on the left and 6 + 2 = 8 on the right, and calcium is 1 on each side, so the number of atoms of every element is the same on both sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the coefficients are 2 and 2 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a snake boat race, each of the 100 oarsmen applies a horizontal force of 200 N. By mistake, 5 of them row in the direction opposite to that of the remaining 95. The net force on the boat is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20,000 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19,000 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18,000 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000 N</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Force applied by the 95 oarsmen rowing correctly = 95 × 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19,000 N</span><span style=\"font-family:'Mangal'\"> forward.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Force applied by the 5 oarsmen rowing the wrong way = 5 × 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000 N</span><span style=\"font-family:'Mangal'\"> backward.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These two forces act in opposite directions, so the magnitude of the net force is their difference.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Net force = 19,000 − 1,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18,000 N</span><span style=\"font-family:'Mangal'\">, acting in the forward direction, which is the direction of the larger force.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the net force on the boat is 18,000 N </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the skeletons of some animal groups:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Sponges show a cellular level of organisation and have no skeleton.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Starfish and sea urchins have a hard internal skeleton made of calcium carbonate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Insects and crabs have an internal skeleton made of bone.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Poriferans (sponges)</span><span style=\"font-family:'Mangal'\"> live in marine water, show a </span><span style=\"font-weight:bold;font-family:'Mangal'\">cellular level of organisation</span><span style=\"font-family:'Mangal'\"> and have </span><span style=\"font-weight:bold;font-family:'Mangal'\">no skeleton</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Echinoderms</span><span style=\"font-family:'Mangal'\"> such as starfish and sea urchins possess a hard </span><span style=\"font-weight:bold;font-family:'Mangal'\">internal skeleton made of calcium carbonate</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Insects and crabs are </span><span style=\"font-weight:bold;font-family:'Mangal'\">arthropods</span><span style=\"font-family:'Mangal'\">, and their defining feature is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">hard external skeleton (exoskeleton)</span><span style=\"font-family:'Mangal'\">, not a skeleton of bone → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following is NOT one of the global biodiversity hotspots present in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Western Ghats</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Himalayas</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Thar Desert</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Indo-Burma</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">biodiversity hotspot</span><span style=\"font-family:'Mangal'\"> is a region that supports a large number of </span><span style=\"font-weight:bold;font-family:'Mangal'\">endemic species</span><span style=\"font-family:'Mangal'\"> and has also undergone </span><span style=\"font-weight:bold;font-family:'Mangal'\">significant habitat loss</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The global hotspots present in India are the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Western Ghats</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Himalayas</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indo-Burma</span><span style=\"font-family:'Mangal'\"> (which includes North East India) and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sundaland</span><span style=\"font-family:'Mangal'\"> (which includes the Nicobar Islands).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Thar desert</span><span style=\"font-family:'Mangal'\"> is a distinctive landscape of western India, but it is not counted among these hotspots.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the Thar Desert is the answer </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": "Aौौधनपiयn (A): A ीययक cुोin in nोपहनध gधnधनोििद ुोौ यnिद पुनधध यन ीयहन पनयूुic िधॅिधस.Rधोौयn (R): A gनधोप कधोि यी धnधनgद iौ ियौप ोौ ुधोप ोप धोcु पनयूुic िधॅिध, ौय ॅधनद िiपिपध हौोृिध धnधनgद iौ िधीप ोीपधन ीयहन िधॅिधस.", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The loss of energy at each step of a food chain is so great that </span><span style=\"font-weight:bold;font-family:'Mangal'\">very little usable energy is left after four trophic levels</span><span style=\"font-family:'Mangal'\">, which is why food chains are short → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Whenever one form of energy is changed to another, </span><span style=\"font-weight:bold;font-family:'Mangal'\">some energy is lost to the surroundings</span><span style=\"font-family:'Mangal'\"> in forms that cannot be used again; at each trophic level a great deal of the energy taken in is lost as heat → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is exactly this loss at every level that limits the number of levels, so R is the correct explanation of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": "Tुध ौदंृियस यी ौयंध िधधंधnपौ cयंध ीनयं पुधiन Lोपin nोंधौ. Wुicु यी पुध ीियियथing ौदंृियस iौ NOT कधनiॅधक ीनयं पुध Lोपin nोंध यी पुध िधधंधnप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zn for zinc</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Na for sodium</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ag for silver</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pb for lead</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Na</span><span style=\"font-family:'Mangal'\"> comes from the Latin name </span><span style=\"font-weight:bold;font-family:'Mangal'\">natrium</span><span style=\"font-family:'Mangal'\"> for sodium.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ag</span><span style=\"font-family:'Mangal'\"> comes from the Latin name </span><span style=\"font-weight:bold;font-family:'Mangal'\">argentum</span><span style=\"font-family:'Mangal'\"> for silver.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pb</span><span style=\"font-family:'Mangal'\"> comes from the Latin name </span><span style=\"font-weight:bold;font-family:'Mangal'\">plumbum</span><span style=\"font-family:'Mangal'\"> for lead.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Zn</span><span style=\"font-family:'Mangal'\"> is taken from the name </span><span style=\"font-weight:bold;font-family:'Mangal'\">zinc</span><span style=\"font-family:'Mangal'\"> itself, using the first letter and a later letter of the same name, as in Cl for chlorine.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In every symbol the first letter is written as a capital letter and the second, if present, as a small letter.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Zn for zinc is not from a Latin name </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a code language, 'PET' is coded as 123 and 'NEAR' is coded as 152. How will 'TRAIN' be coded in the same language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">310</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">196</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">218</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">288</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of each letter in the English alphabet and add them up.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PET: P = 16, E = 5, T = 20 → sum = </span><span style=\"font-weight:bold;font-family:'Mangal'\">41</span><span style=\"font-family:'Mangal'\">; PET has 3 letters → 41 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">123</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NEAR: N = 14, E = 5, A = 1, R = 18 → sum = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\">; NEAR has 4 letters → 38 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">152</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: code = (sum of the letter positions) × (number of letters).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAIN: T = 20, R = 18, A = 1, I = 9, N = 14 → sum = 20 + 18 + 1 + 9 + 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">62</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAIN has 5 letters → 62 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(288 is 62 × 5 worked out wrongly; 196 and 218 fit neither the sum nor the rule.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 'TRAIN' is coded as </span><span style=\"font-weight:bold;font-family:'Mangal'\">310 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of :: ?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TNQ : # :: % : GBE</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OPL, % = LZJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OPL, % = BXZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OLP, % = LZJ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = YPV, % = LZJ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The change from the first cluster to the second cluster must be the same in both pairs. Test each option.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option A: TNQ → OPL: T − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, N + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, Q − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\"> → (−5, +2, −5); LZJ → GBE: L − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, Z + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\"> (26 + 2 = 28 → 28 − 26 = 2 = B), J − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> → (−5, +2, −5) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option B: TNQ → OPL is (−5, +2, −5); BXZ → GBE is B + 5 = G, X + 4 = B, Z + 5 = E → (+5, +4, +5) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option C: TNQ → OLP is (−5, </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\">, −1) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option D: TNQ → YPV is (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">, +2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = OPL, % = LZJ (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N is mother of O. O is wife of P. P is brother of Q. How is N related to Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sister's Husband's Mother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brother's Wife's Mother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brother's Wife</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife’s Mother</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Start from Q and move step by step.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is the brother of Q → P is Q's </span><span style=\"font-weight:bold;font-family:'Mangal'\">brother</span><span style=\"font-family:'Mangal'\">, and P and Q have the same parents.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O is the wife of P → O and P are husband and wife, so O is Q's brother's </span><span style=\"font-weight:bold;font-family:'Mangal'\">wife</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N is the mother of O → N is Q's brother's wife's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Sister's Husband's Mother would need P to be Q's sister; Brother's Wife would leave out N; Wife's Mother would need Q to be married to O.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, N is Q's </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brother's Wife's Mother (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Eight people, P, Q, R, S, T, U, V and W, are sitting in a row, facing north. Only three people sit to the right of T. Q sits at the extreme left end of the row. Only one person sits between Q and R. W sits to the immediate left of T. S sits to the immediate right of V. P sits at one of the extreme ends of the row. Who sits third to the right of R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number the seats 1 to 8 from left to right. All face north, so left and right are taken in the usual way.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only three people sit to the right of T → T = 8 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q sits at the extreme left end → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between Q and R → R = 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W sits to the immediate left of T → W = 5 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P sits at an extreme end, and seat 1 is Q's → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seats 2, 6 and 7 are left for S, U and V. S sits to the immediate right of V → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 6, S = 7</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (left → right): </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q – U – R – W – T – V – S – P</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third to the right of R (seat 3): 3 + 3 = seat 6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">V (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the pair which follows the same pattern as that followed by the two pairs given below. Both pairs follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIK−JLN CEG−FHJ</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB−ACE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ−ZBD</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ−ACE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB−ZCD</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare each letter of the second cluster with the matching letter of the first cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIK − JLN: G + 3 = J, I + 3 = L, K + 3 = N → (+3, +3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG − FHJ: C + 3 = F, E + 3 = H, G + 3 = J → (+3, +3, +3) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inside each cluster the letters also rise by (+2, +2): G, I, K and C, E, G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the options:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB − ACE: inside XZB, X + 2 = Z and Z + 2 = B (26 + 2 = 28 → 28 − 26 = 2 = B) ✓; X + 3 = A (24 + 3 = 27 → 27 − 26 = 1 = A), Z + 3 = C, B + 3 = E ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ − ZBD: X + 3 = A, not Z ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ − ACE: inside XYZ the letters rise by (+1, +1), and Y + 3 = B, not C ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB − ZCD: X + 3 = A, not Z ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair is </span><span style=\"font-weight:bold;font-family:'Mangal'\">XZB−ACE (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, G, H, K, L and N bought a car each, in six different years: 2016, 2017, 2018, 2019, 2020 and 2021, but not necessarily in the same order. F bought a car in an even-numbered year, but not in 2016. Exactly two people bought cars in the years between the years in which H and K bought theirs. N bought a car in the year immediately after the year in which F bought his. L bought a car before H did. Only one person bought a car after K did. How many people bought cars after H did?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Four</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Five</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the six years in order: 2016, 2017, 2018, 2019, 2020, 2021.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person bought a car after K → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 2020</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F bought in an even-numbered year other than 2016, and 2020 is K's → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 2018</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N bought in the year immediately after F → </span><span style=\"font-weight:bold;font-family:'Mangal'\">N = 2019</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Exactly two people bought cars between H and K → the gap between the two years is 3 → H = 2020 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2017</span><span style=\"font-family:'Mangal'\"> (2020 + 3 = 2023 is not in the list).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L bought before H → the only earlier year left is </span><span style=\"font-weight:bold;font-family:'Mangal'\">L = 2016</span><span style=\"font-family:'Mangal'\">, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 2021</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final order (2016 → 2021): </span><span style=\"font-weight:bold;font-family:'Mangal'\">L, H, F, N, K, G</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">People who bought after H (2017): F, N, K and G → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Four</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Four (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Town P is 12 km to the north of Town Q. Town R is 9 km to the east of Town P. Town S is 5 km to the south of Town R. Town T is 4 km to the east of Town S. In which direction is Town T with respect to Town Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South-west</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South-east</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">North-east</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">North-west</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take Town Q as the origin; east = +x, north = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is 12 km north of Q → P = (0, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R is 9 km east of P → R = (9, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S is 5 km south of R → S = (9, 7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T is 4 km east of S → T = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">13, 7</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T lies 13 km to the east and 7 km to the north of Q, so T is to the north-east of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(South-east and south-west would need T to be below Q, and north-west would need T to be to its west.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Town T is to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">North-east (Option C)</span><span style=\"font-family:'Mangal'\"> of Town Q.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many meaningful five-letter English words can be formed using O, N, W, M and A using all the letters but each letter only once in each word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">More than two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All five letters must be used, so look for a five-letter English word made of O, N, W, M and A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The letters include only one vowel pair, A and O, so the word must read as a consonant, vowel, consonant, vowel, consonant pattern: W, O, M, A, N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">That gives </span><span style=\"font-weight:bold;font-family:'Mangal'\">WOMAN</span><span style=\"font-family:'Mangal'\">, which is a meaningful English word.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No other arrangement of these five letters (for example MANOW, NOMAW, WAMON) is an English word.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So exactly </span><span style=\"font-weight:bold;font-family:'Mangal'\">one</span><span style=\"font-family:'Mangal'\"> meaningful word can be formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">One (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of ? in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCD CDE EFG HIJ LMN ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QRT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PQR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QRS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RST</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inside every cluster the three letters are consecutive, so compare only the first letters: B, C, E, H, L, ?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B → C is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\">, C → E is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">, E → H is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\">, H → L is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">, so the next step is </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> (12 + 5 = 17 = Q), and the cluster is Q, R, S → QRS</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PQR uses +4, RST uses +6, and QRT is not made of three consecutive letters.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">QRS (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IGD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QPL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GEB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OMJ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare the consecutive letters of each cluster.</span></p><p style=\"margin-top:0pt;m
