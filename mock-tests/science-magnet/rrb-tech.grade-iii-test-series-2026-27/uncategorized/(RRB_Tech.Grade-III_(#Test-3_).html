टियों में विविधताएँ उत्पन्न होती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि कुछ व्यक्तियों में कुछ विविधताएँ हों, तो निकेत (निच) बदलने पर उनके जीवित रहने की संभावना होती है → विविधता </span><span style=\"font-weight:bold;font-family:'Mangal'\">जाति के जीवित रहने</span><span style=\"font-family:'Mangal'\"> के लिए उपयोगी है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DNA प्रतिलिपि की त्रुटियाँ, जो पूरी तरह सटीक नहीं होतीं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">विविधताओं का स्रोत</span><span style=\"font-family:'Mangal'\"> हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु R बताता है कि विविधताएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैसे उत्पन्न</span><span style=\"font-family:'Mangal'\"> होती हैं, यह नहीं कि वे जीवित रहने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्यों उपयोगी</span><span style=\"font-family:'Mangal'\"> हैं; उपयोगिता बदलते निकेत से आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिक्रिया Pb(s) + CuCl₂(aq) → PbCl₂(aq) + Cu(s) किस प्रकार की अभिक्रिया का उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन अभिक्रिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्विविस्थापन अभिक्रिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपघटन अभिक्रिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन अभिक्रिया</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीसा (Pb)</span><span style=\"font-family:'Mangal'\"> कॉपर क्लोराइड से कॉपर को हटाकर उसकी जगह ले लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब एक तत्व दूसरे तत्व को उसके यौगिक से विस्थापित करता है, तो वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">विस्थापन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है (जैसे Fe या Zn द्वारा CuSO₄ से Cu का विस्थापन)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">द्विविस्थापन</span><span style=\"font-family:'Mangal'\"> अभिक्रिया में दो यौगिकों के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनों का आदान-प्रदान</span><span style=\"font-family:'Mangal'\"> होता है, जो यहाँ नहीं है (Pb एक मुक्त तत्व है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह विस्थापन अभिक्रिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हार्मोन को उसे स्रावित करने वाली ग्रंथि और उसके कार्य से सुमेलित कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789554656944_image002.png\" width=\"269\" height=\"75\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">थायरॉक्सिन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">थायरॉइड ग्रंथि</span><span style=\"font-family:'Mangal'\"> बनाती है; इसके लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयोडीन</span><span style=\"font-family:'Mangal'\"> आवश्यक है, और आयोडीन की कमी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">घेंघा</span><span style=\"font-family:'Mangal'\"> (गर्दन में सूजन) हो सकता है → (3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">इंसुलिन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अग्न्याशय</span><span style=\"font-family:'Mangal'\"> बनाता है और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">रक्त शर्करा</span><span style=\"font-family:'Mangal'\"> स्तर का नियमन करता है → (1).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐड्रीनलिन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिवृक्क ग्रंथि</span><span style=\"font-family:'Mangal'\"> से स्रावित होता है और शरीर को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लड़ो या भागो</span><span style=\"font-family:'Mangal'\"> के लिए तैयार करता है → (2).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश की एक किरण-पुंज को नमक के विलयन, जल में मिले दूध और कॉपर सल्फेट के विलयन वाले तीन बीकरों से गुज़ारा जाता है। इनमें से किसमें किरण-पुंज का पथ दिखाई देगा, और क्यों?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नमक का विलयन, क्योंकि उसके कण बहुत छोटे हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फेट का विलयन, क्योंकि वह रंगीन है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल में मिला दूध, क्योंकि उसके कोलॉइडी कण प्रकाश को प्रकीर्णित करते हैं (टिंडल प्रभाव)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों में, क्योंकि हर द्रव प्रकाश को प्रकीर्णित करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कणों द्वारा प्रकाश का प्रकीर्णन </span><span style=\"font-weight:bold;font-family:'Mangal'\">टिंडल प्रभाव</span><span style=\"font-family:'Mangal'\"> कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह तब होता है जब प्रकाश </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोलॉइड या निलंबन</span><span style=\"font-family:'Mangal'\"> से गुज़रता है, परंतु पारदर्शी विलयन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\">, क्योंकि उसके कण प्रकीर्णन के लिए बहुत छोटे होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल में मिला दूध एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोलॉइड</span><span style=\"font-family:'Mangal'\"> है, इसलिए उसके कण प्रकाश को प्रकीर्णित करते हैं और किरण-पुंज का पथ दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नमक और कॉपर सल्फेट के विलयन वास्तविक विलयन हैं → पथ दिखाई नहीं देता (रंग का इससे संबंध नहीं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पथ केवल जल में मिले दूध में, टिंडल प्रभाव के कारण दिखाई देता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्बीडो के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) ऐल्बीडो किसी सतह द्वारा परावर्तित सौर विकिरण का अंश है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) बर्फ और हिम का ऐल्बीडो अधिक होता है, जो ध्रुवीय क्षेत्रों के बहुत ठंडे होने का एक कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) काली मिट्टी और समुद्री जल का ऐल्बीडो अधिक होता है, इसलिए वे बहुत कम सौर विकिरण अवशोषित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐल्बीडो</span><span style=\"font-family:'Mangal'\"> = किसी सतह द्वारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">परावर्तित</span><span style=\"font-family:'Mangal'\"> सौर विकिरण का अंश (लैटिन: श्वेतता) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">बर्फ और हिम</span><span style=\"font-family:'Mangal'\"> (ऐल्बीडो लगभग 0.8–0.9 और 0.5–0.7) अधिकांश आने वाले विकिरण को परावर्तित कर ठंडे रहते हैं, जिससे ध्रुवीय क्षेत्र बहुत ठंडे होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">काली मिट्टी और समुद्री जल</span><span style=\"font-family:'Mangal'\"> का ऐल्बीडो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> होता है; वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक अवशोषित</span><span style=\"font-family:'Mangal'\"> करते हैं और अपेक्षाकृत गर्म रहते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेल की पटरियों को जोड़ने में प्रयुक्त थर्मिट अभिक्रिया है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2Al + 3CuO → Al₂O₃ + 3Cu</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe + CuSO₄ → FeSO₄ + Cu</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + ऊष्मा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2Fe + 3H₂O → Fe₂O₃ + 3H₂</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आयरन(III) ऑक्साइड की ऐलुमिनियम से अभिक्रिया</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">थर्मिट अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है: Fe₂O₃(s) + 2Al(s) → 2Fe(l) + Al₂O₃(s) + ऊष्मा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह अत्यधिक ऊष्माक्षेपी है, इसलिए लोहा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिघली</span><span style=\"font-family:'Mangal'\"> अवस्था में बनता है, जिसका उपयोग रेल की पटरियों या टूटे मशीन भागों को जोड़ने में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम, अधिक क्रियाशील होने से, लोहे को उसके ऑक्साइड से विस्थापित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः थर्मिट अभिक्रिया Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + ऊष्मा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) सोडियम और पोटैशियम ठंडे जल से इतनी तीव्रता से अभिक्रिया करते हैं कि निकली हाइड्रोजन आग पकड़ लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) ऐलुमिनियम, लोहा और ज़िंक भाप से अभिक्रिया करते हैं परंतु ठंडे या गर्म जल से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) यशदलेपन (गैल्वनीकरण) लोहे पर टिन की पतली परत चढ़ाकर उसे जंग से बचाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम और पोटैशियम</span><span style=\"font-family:'Mangal'\"> की जल से अभिक्रिया इतनी तीव्र और ऊष्माक्षेपी होती है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन तुरंत आग पकड़ लेती है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐलुमिनियम, लोहा और ज़िंक</span><span style=\"font-family:'Mangal'\"> ठंडे या गर्म जल से अभिक्रिया नहीं करते, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाप</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करके धातु ऑक्साइड और हाइड्रोजन बनाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">यशदलेपन</span><span style=\"font-family:'Mangal'\"> लोहे या इस्पात पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ज़िंक</span><span style=\"font-family:'Mangal'\"> की पतली परत चढ़ाना है, टिन की नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम आयन Al³⁺ और सल्फेट आयन SO₄²⁻ है। ऐलुमिनियम सल्फेट का सही सूत्र है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlSO₄</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₂(SO₄)₃</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₃(SO₄)₂</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₂SO₄</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al³⁺ की संयोजकता = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">; SO₄²⁻ की संयोजकता = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजकताओं को क्रॉस करें: Al की संयोजकता SO₄ का पादांक बनती है और SO₄ की संयोजकता Al का।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₂(SO₄)₃ → कुल धनावेश = 2 × 3 = +6, कुल ऋणावेश = 3 × 2 = −6 → उदासीन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुपरमाणुक आयन SO₄ को कोष्ठक में लिखा जाता है क्योंकि वह एक से अधिक बार आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सूत्र Al₂(SO₄)₃ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब एथेनॉल को 443 K पर आधिक्य सांद्र सल्फ्यूरिक अम्ल के साथ गर्म किया जाता है, तो बनने वाला मुख्य कार्बनिक उत्पाद है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉइक अम्ल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम एथॉक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथाइन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉल को </span><span style=\"font-weight:bold;font-family:'Mangal'\">443 K पर आधिक्य सांद्र H₂SO₄</span><span style=\"font-family:'Mangal'\"> के साथ गर्म करने पर उससे जल का अणु निकल जाता है (</span><span style=\"font-weight:bold;font-family:'Mangal'\">निर्जलीकरण</span><span style=\"font-family:'Mangal'\">)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₃CH₂OH → CH₂=CH₂ + H₂O → उत्पाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">एथीन</span><span style=\"font-family:'Mangal'\"> है, द्विबंध वाला असंतृप्त हाइड्रोकार्बन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ सांद्र सल्फ्यूरिक अम्ल निर्जलीकारक की तरह कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके विपरीत, एथेनॉल </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करके सोडियम एथॉक्साइड और हाइड्रोजन गैस देता है, और एथेनॉल के ऑक्सीकरण से एथेनॉइक अम्ल बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्पाद एथीन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तत्व टंगस्टन का प्रतीक W किस भाषा के नाम से लिया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैटिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रीक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जर्मन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बर्ज़ीलियस (1813) ने सुझाया कि प्रतीक तत्वों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैटिन</span><span style=\"font-family:'Mangal'\"> नामों से लिए जाएँ, जैसे लोहा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fe</span><span style=\"font-family:'Mangal'\"> (ferrum).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ प्रतीक अन्य भाषाओं से आए: पारा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hg</span><span style=\"font-family:'Mangal'\"> (ग्रीक, hydrargyros) और टंगस्टन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\"> (</span><span style=\"font-weight:bold;font-family:'Mangal'\">जर्मन</span><span style=\"font-family:'Mangal'\">, wolfram).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः W जर्मन नाम wolfram से आया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 N भार के एक बक्से को 5 m लंबे आनत तल पर 1 m की ऊँचाई तक नियत चाल से धकेला जाता है (घर्षण नगण्य)। आनत तल का यांत्रिक लाभ और आवश्यक प्रयास क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 और 120 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2 और 3,000 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 और 600 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 और 100 N</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आनत तल का यांत्रिक लाभ = भार ÷ प्रयास = L ÷ h.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MA = 5 m ÷ 1 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रयास = भार ÷ MA = 600 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि L, h से बड़ा है, प्रयास भार से कम है → MA 1 से अधिक।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः MA = 5 और प्रयास = 120 N </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जब पादप को प्रकाश संश्लेषण के लिए कार्बन डाइऑक्साइड की आवश्यकता नहीं होती, तो वह अपने रंध्र बंद कर लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): रंध्र तब खुलता है जब द्वार कोशिकाएँ जल से फूलती हैं और तब बंद होता है जब वे सिकुड़ती हैं, और रंध्र बंद होने से जल की हानि कम होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रंध्रों से बहुत अधिक जल की हानि हो सकती है, इसलिए CO₂ की आवश्यकता न होने पर पादप उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">बंद</span><span style=\"font-family:'Mangal'\"> कर लेता है ताकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल की हानि कम</span><span style=\"font-family:'Mangal'\"> हो → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खुलना और बंद होना </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्वार कोशिकाओं</span><span style=\"font-family:'Mangal'\"> का कार्य है: जल अंदर आने पर वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">फूलती</span><span style=\"font-family:'Mangal'\"> हैं (रंध्र खुलता है) और जल बाहर जाने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिकुड़ती</span><span style=\"font-family:'Mangal'\"> हैं (रंध्र बंद होता है) → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, A में वर्णित बंद होने की क्रियाविधि और उद्देश्य (जल हानि कम करना) बताता है → R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक शुद्ध लंबे (TT) और एक शुद्ध बौने (tt) मटर के पौधे के बीच मेंडल के एकसंकर संकरण में F₂ पीढ़ी में जीनप्ररूप TT, Tt और tt का अनुपात होता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 2 : 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 : 3 : 3 : 1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनक TT × tt → सभी F₁ पौधे </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tt</span><span style=\"font-family:'Mangal'\"> (लंबे, क्योंकि T प्रभावी है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F₁ × F₁ (Tt × Tt) → प्रत्येक जनक से युग्मक T और t → F₂ जीनप्ररूप: TT, Tt, Tt, tt.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीनप्ररूप अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">TT : Tt : tt = 1 : 2 : 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि 'T' एक प्रति में भी अभिव्यक्त होता है (प्रभावी) और 't' केवल दोनों प्रतियाँ होने पर (अप्रभावी), दिखने का अनुपात लंबे : बौने = 3 : 1 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जीनप्ररूप अनुपात 1 : 2 : 1 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) 20 Hz से कम आवृत्ति की ध्वनि तरंगें अवश्रव्य (इन्फ्रासोनिक) तरंगें कहलाती हैं और भूकंप तथा ज्वालामुखी विस्फोट का पता लगाने में उपयोग होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) पराश्रव्य (अल्ट्रासोनिक) तरंगें गुर्दे की पथरी को छोटे टुकड़ों में तोड़ने में उपयोग होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) मानव की श्रव्य सीमा 20 Hz से 20,000 Hz है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 Hz से कम</span><span style=\"font-family:'Mangal'\"> आवृत्ति की तरंगें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवश्रव्य</span><span style=\"font-family:'Mangal'\"> हैं; ये लंबी दूरी तय करती हैं और भूकंप, ज्वालामुखी विस्फोट और तीव्र तूफ़ानों का पता लगाने में उपयोग होती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">पराश्रव्य</span><span style=\"font-family:'Mangal'\"> तरंगें (20 kHz से ऊपर) </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुर्दे की पथरी</span><span style=\"font-family:'Mangal'\"> तोड़ने, अल्ट्रासोनोग्राफी और पराश्रव्य वेल्डिंग में उपयोग होती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) मानव की </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्रव्य सीमा</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 Hz से 20,000 Hz (20 kHz)</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 kg द्रव्यमान का एक लड़का 6 m ऊँची सीढ़ी 20 s में चढ़ता है। g = 10 m/s² लेते हुए, लड़के द्वारा विकसित औसत शक्ति है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,000 W</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 W</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 W</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुरुत्व के विरुद्ध किया गया कार्य = स्थितिज ऊर्जा में वृद्धि = mgh = 50 × 10 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,000 J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति = किया गया कार्य ÷ समय = 3,000 ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 W</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1 W = प्रति सेकंड 1 J कार्य।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः औसत शक्ति 150 W है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रक्रिया को वायुमंडलीय नाइट्रोजन के स्थिरीकरण की उसकी विधि से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789554656944_image003.png\" style=\"width: 864px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-3, (c)-1</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">राइज़ोबियम</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">फलीदार पौधों की जड़ ग्रंथिकाओं</span><span style=\"font-family:'Mangal'\"> में रहने वाला नाइट्रोजन-स्थिरीकारी जीवाणु, वायुमंडलीय N₂ को अमोनिया (NH₃) में बदलता है &rarr; (2). मिट्टी में ऐज़ोटोबैक्टर भी यही करता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">तड़ित</span><span style=\"font-family:'Mangal'\"> के समय थोड़ी मात्रा में वायुमंडलीय नाइट्रोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन ऑक्साइडों</span><span style=\"font-family:'Mangal'\"> के रूप में स्थिर होती है &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">हैबर-बॉश प्रक्रिया</span><span style=\"font-family:'Mangal'\"> (1900 के दशक की शुरुआत) औद्योगिक रूप से </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायुमंडलीय नाइट्रोजन से अमोनिया</span><span style=\"font-family:'Mangal'\"> बनाती है; आज अधिकांश नाइट्रोजन इसी से स्थिर होती है &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-2, (b)-3, (c)-1 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+3 D और −1 D शक्ति के दो पतले लेंस संपर्क में रखे गए हैं। संयोजन की शक्ति और प्रकृति, तथा उसकी फोकस दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+2 D, उत्तल, 50 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+4 D, उत्तल, 25 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−2 D, अवतल, 50 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+2 D, अवतल, 200 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संपर्क में रखे लेंसों की कुल शक्ति अलग-अलग शक्तियों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजगणितीय योग</span><span style=\"font-family:'Mangal'\"> होती है: P = P₁ + P₂.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P = (+3) + (−1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2 D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक शक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल</span><span style=\"font-family:'Mangal'\"> (अभिसारी) लेंस।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फोकस दूरी f = 1/P = 1/2 m = 0.5 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संयोजन +2 D, उत्तल, फोकस दूरी 50 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कच्चे माल के रूप में साधारण नमक (NaCl) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) ब्राइन (लवण जल) के विद्युत अपघटन से बनी क्लोरीन का उपयोग विरंजक चूर्ण बनाने में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) साधारण नमक सोडियम हाइड्रॉक्साइड, बेकिंग सोडा और धावन सोडा के लिए कच्चा माल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) धावन सोडा सोडियम कार्बोनेट के पुनः क्रिस्टलन से प्राप्त होता है, जो स्वयं बेकिंग सोडा को गर्म करके प्राप्त किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) ब्राइन के विद्युत अपघटन (क्लोर-क्षार प्रक्रिया) से </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरीन</span><span style=\"font-family:'Mangal'\"> मिलती है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">विरंजक चूर्ण</span><span style=\"font-family:'Mangal'\"> बनाया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) साधारण नमक </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम हाइड्रॉक्साइड, बेकिंग सोडा, धावन सोडा और विरंजक चूर्ण</span><span style=\"font-family:'Mangal'\"> का कच्चा माल है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) बेकिंग सोडा (NaHCO₃) गर्म करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम कार्बोनेट</span><span style=\"font-family:'Mangal'\"> देता है, और उसके पुनः क्रिस्टलन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">धावन सोडा</span><span style=\"font-family:'Mangal'\"> (Na₂CO₃.10H₂O) मिलता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप जगत का कौन-सा समूह प्रजनन के लिए जल पर निर्भर है और इसलिए \"पादप जगत का उभयचर\" कहलाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैलोफाइटा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टेरिडोफाइटा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनावृतबीजी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रायोफाइटा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप जगत पाँच समूहों में बँटा है: थैलोफाइटा, ब्रायोफाइटा, टेरिडोफाइटा, अनावृतबीजी और आवृतबीजी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ब्रायोफाइट</span><span style=\"font-family:'Mangal'\"> (जैसे मॉस) भूमि पर रहते हैं परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रजनन के लिए जल</span><span style=\"font-family:'Mangal'\"> चाहिए, जैसे उभयचरों को प्रजनन के लिए जल चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए इन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादप जगत का उभयचर</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समूह ब्रायोफाइटा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मेंडल के लंबे × बौने संकरण के F₁ लंबे पौधे जनक लंबे पौधों के समान नहीं थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): जब F₁ लंबे पौधों का स्व-परागण कराया गया, तो F₂ के एक-चौथाई पौधे बौने थे, जो दर्शाता है कि बौनेपन का लक्षण F₁ पौधों को वंशागत हुआ था परंतु अभिव्यक्त नहीं हुआ।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने जनक लंबे पौधों और F₁ लंबे पौधों, दोनों का स्व-परागण कराकर जाँचा कि क्या वे समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनक लंबे पौधों से केवल लंबी संतति मिली, परंतु F₁ लंबे पौधों की F₂ संतति में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक-चौथाई बौने</span><span style=\"font-family:'Mangal'\"> थे → F₁ पौधे जनक लंबे पौधों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान नहीं</span><span style=\"font-family:'Mangal'\"> थे → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F₂ में बौने पौधों का आना दर्शाता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबापन और बौनापन दोनों</span><span style=\"font-family:'Mangal'\"> F₁ में वंशागत हुए, परंतु केवल लंबापन </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिव्यक्त</span><span style=\"font-family:'Mangal'\"> हुआ → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही F₂ परिणाम A का प्रमाण है → R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि किसी ध्वनि तरंग के 20 संपीडन एक बिंदु से 4 सेकंड में गुज़रते हैं, तो तरंग की आवृत्ति और आवर्तकाल क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 Hz और 0.0125 s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 Hz और 0.2 s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2 Hz और 5 s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 Hz और 5 s</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवृत्ति = प्रति सेकंड दोलनों (संपीडनों) की संख्या = 20 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 Hz</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवृत्ति का SI मात्रक प्रति सेकंड है, जिसे हर्ट्ज़ (Hz) कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्तकाल = 1 ÷ आवृत्ति = 1 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.2 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवृत्ति = 5 Hz और आवर्तकाल = 0.2 s </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">काँच के प्रिज़्म द्वारा श्वेत प्रकाश के विक्षेपण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) लाल प्रकाश सबसे कम और बैंगनी प्रकाश सबसे अधिक मुड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) न्यूटन ने दिखाया कि स्पेक्ट्रम के रंग दूसरे, उल्टे प्रिज़्म से गुज़रने पर पुनः श्वेत प्रकाश बना देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) विक्षेपण इसलिए होता है क्योंकि प्रकाश के सभी रंग प्रिज़्म में समान कोण से मुड़ते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) स्पेक्ट्रम VIBGYOR में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाल सबसे कम</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैंगनी सबसे अधिक</span><span style=\"font-family:'Mangal'\"> मुड़ता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूटन</span><span style=\"font-family:'Mangal'\"> ने दूसरा समान प्रिज़्म उल्टी स्थिति में रखकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत प्रकाश</span><span style=\"font-family:'Mangal'\"> की किरण प्राप्त की, जिससे सिद्ध हुआ कि सूर्य का प्रकाश सात रंगों से बना है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) विक्षेपण इसलिए होता है क्योंकि अलग-अलग रंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग-अलग</span><span style=\"font-family:'Mangal'\"> कोणों से मुड़ते हैं, समान कोण से नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चपटी थैली जैसी संरचनाओं के ढेर से बना कौन-सा कोशिकांग प्रोटीनों को रूपांतरित, छाँटकर और पुटिकाओं में पैक करके परिवहन या स्रावण के लिए भेजता है और प्रायः कोशिका का \"डाकघर\" कहलाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गॉल्जी उपकरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राइबोसोम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाइसोसोम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माइटोकॉन्ड्रियन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चपटी, थैली जैसी संरचनाओं के ढेर मिलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">गॉल्जी उपकरण</span><span style=\"font-family:'Mangal'\"> बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रोटीनों और लिपिडों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">रूपांतरित, छाँटकर और पैक</span><span style=\"font-family:'Mangal'\"> करके पुटिकाओं में परिवहन, स्रावण या लाइसोसोम निर्माण के लिए भेजता है, इसलिए यह कोशिका के डाकघर की तरह कार्य करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राइबोसोम प्रोटीन संश्लेषण के स्थल हैं; लाइसोसोम में पाचक एंज़ाइम होते हैं; माइटोकॉन्ड्रिया ऊर्जा देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कोशिकांग गॉल्जी उपकरण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति-समय ग्राफ के आकार को उसके द्वारा दर्शाई गई गति से सुमेलित कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789554656944_image004.png\" width=\"269\" height=\"99\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-3, (c)-1</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय अक्ष के समांतर</span><span style=\"font-family:'Mangal'\"> सीधी रेखा का अर्थ है स्थिति नहीं बदलती → वस्तु </span><span style=\"font-weight:bold;font-family:'Mangal'\">विरामावस्था</span><span style=\"font-family:'Mangal'\"> में है → (2).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) झुकी सीधी रेखा का अर्थ है समान समय में स्थिति में समान परिवर्तन → </span><span style=\"font-weight:bold;font-family:'Mangal'\">नियत वेग</span><span style=\"font-family:'Mangal'\"> → (3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">वक्र</span><span style=\"font-family:'Mangal'\"> रेखा का अर्थ है वेग बदल रहा है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वरित गति</span><span style=\"font-family:'Mangal'\"> → (1).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-2, (b)-3, (c)-1 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लेमिंग के वाम-हस्त नियम के अनुसार, यदि तर्जनी चुंबकीय क्षेत्र की दिशा में और मध्यमा धारा की दिशा में हो, तो अँगूठा किसकी दिशा बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रेरित धारा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र रेखाएँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक पर बल (उसकी गति)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन प्रवाह</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लेमिंग का वाम-हस्त नियम</span><span style=\"font-family:'Mangal'\">: बाएँ हाथ के अँगूठे, तर्जनी और मध्यमा को परस्पर लंबवत फैलाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तर्जनी</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय क्षेत्र</span><span style=\"font-family:'Mangal'\"> की दिशा; </span><span style=\"font-weight:bold;font-family:'Mangal'\">मध्यमा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">धारा</span><span style=\"font-family:'Mangal'\"> की दिशा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब </span><span style=\"font-weight:bold;font-family:'Mangal'\">अँगूठा</span><span style=\"font-family:'Mangal'\"> चालक पर लगने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल</span><span style=\"font-family:'Mangal'\"> की, अर्थात् उसकी गति की, दिशा बताता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(दक्षिण-हस्त अँगूठा नियम अलग नियम है: वह सीधे धारावाही चालक के चारों ओर क्षेत्र की दिशा बताता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अँगूठा चालक पर बल की दिशा बताता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वर्ण पन्नी (अल्फा-किरण प्रकीर्णन) प्रयोग के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) अधिकांश अल्फा कण पन्नी से बिना विक्षेपित हुए निकल गए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) कुछ अल्फा कण वापस लौट आए, जो दर्शाता है कि धनावेश और अधिकांश द्रव्यमान एक छोटे सघन नाभिक में संकेंद्रित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) थॉमसन का मॉडल कुछ अल्फा कणों के बड़े कोण पर विक्षेपण की व्याख्या कर सकता था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकांश</span><span style=\"font-family:'Mangal'\"> अल्फा कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिना विक्षेपित</span><span style=\"font-family:'Mangal'\"> निकल गए, जो दर्शाता है कि परमाणु का अधिकांश भाग खाली है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुछ वापस लौटे</span><span style=\"font-family:'Mangal'\">, इसलिए रदरफोर्ड ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">सघन नाभिक</span><span style=\"font-family:'Mangal'\"> प्रस्तावित किया जिसमें पूरा धनावेश और अधिकांश द्रव्यमान है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) थॉमसन का मॉडल (समान रूप से फैला धनावेश) बड़े कोण के विक्षेपणों की व्याख्या करने में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विफल</span><span style=\"font-family:'Mangal'\"> रहा → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कीटनाशियों जैसे हानिकारक रसायन खाद्य शृंखला में प्रवेश करके प्रत्येक पोषक स्तर पर क्रमशः संचित होते जाते हैं और शीर्ष मांसाहारियों में सबसे अधिक सांद्रता तक पहुँचते हैं। यह परिघटना कहलाती है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैव निम्नीकरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुपोषण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन क्षय</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैविक आवर्धन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ हानिकारक रसायन </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैव अनिम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> होते हैं — वे जैविक प्रक्रियाओं द्वारा नहीं टूटते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि वे निम्नीकृत नहीं होते, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक पोषक स्तर पर क्रमशः संचित</span><span style=\"font-family:'Mangal'\"> होते जाते हैं; यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैविक आवर्धन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि मनुष्य अनेक खाद्य शृंखलाओं में शीर्ष स्तर पर है, अधिकतम सांद्रता हमारे शरीर तक पहुँचती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके विपरीत, जैव निम्नीकरणीय पदार्थ जैविक प्रक्रियाओं द्वारा टूट जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परिघटना जैविक आवर्धन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">\"लड़ो या भागो\" की स्थिति में स्रावित ऐड्रीनलिन के निम्नलिखित प्रभावों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) हृदय तेज़ धड़कता है, जिससे पेशियों को अधिक ऑक्सीजन मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) पाचन तंत्र और त्वचा में रक्त प्रवाह बढ़ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) डायाफ्राम और पसलियों की पेशियों के संकुचन से श्वसन दर बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐड्रीनलिन </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिवृक्क ग्रंथियों</span><span style=\"font-family:'Mangal'\"> से सीधे रक्त में स्रावित होता है, जो शरीर को लड़ो या भागो के लिए तैयार करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) इसके लक्ष्य अंगों में हृदय शामिल है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">हृदय तेज़ धड़कता</span><span style=\"font-family:'Mangal'\"> है, जिससे पेशियों को अधिक ऑक्सीजन मिलती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) यह पाचन तंत्र और त्वचा की छोटी धमनियों के चारों ओर की पेशियों को सिकोड़कर वहाँ रक्त प्रवाह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> करता है और रक्त को कंकाल पेशियों की ओर मोड़ता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) यह डायाफ्राम और पसलियों की पेशियों के संकुचन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वसन दर बढ़ाता</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (iii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत टोस्टर और विद्युत इस्तरी की तापन कुंडलियाँ शुद्ध धातु के बजाय नाइक्रोम जैसी मिश्रधातु से बनाई जाती हैं क्योंकि मिश्रधातुओं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">की प्रतिरोधकता शुद्ध धातुओं से कम होती है, इसलिए वे अधिक धारा ले जाती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">की प्रतिरोधकता उनकी घटक धातुओं से अधिक होती है और वे उच्च ताप पर आसानी से ऑक्सीकृत (जलती) नहीं होतीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सस्ती होती हैं और उच्च ताप पर आसानी से पिघल जाती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शुद्ध धातुओं की तुलना में ऊष्मा की बेहतर चालक होती हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइक्रोम निकल, क्रोमियम, मैंगनीज़ और लोहे की मिश्रधातु है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मिश्रधातु की प्रतिरोधकता</span><span style=\"font-family:'Mangal'\"> सामान्यतः उसकी घटक धातुओं से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> होती है, इसलिए दी गई धारा पर वह अधिक ऊष्मा देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रधातुएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च ताप पर आसानी से ऑक्सीकृत (जलती) नहीं</span><span style=\"font-family:'Mangal'\"> होतीं, इसलिए कुंडली टिकाऊ रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मिश्रधातुओं का उपयोग उनकी अधिक प्रतिरोधकता और ऑक्सीकरण के प्रतिरोध के कारण होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): कायिक प्रवर्धन से उगाए गए पौधे बीजों से उगाए गए पौधों की तुलना में सामान्यतः किसी रोग के प्रति अधिक संवेदनशील होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): कायिक प्रवर्धन से उगाए गए पौधे एक ही जनक की आनुवंशिक रूप से समान प्रतियाँ होते हैं और उनमें वह विविधता नहीं होती जो कुछ पौधों को प्रतिरोध दे सके।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कायिक प्रवर्धन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल एक जनक</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए नए पौधे आनुवंशिक रूप से समान क्लोन होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि एक पौधा किसी रोग के प्रति संवेदनशील है, तो उसके सभी क्लोन समान रूप से संवेदनशील होते हैं; प्रतिरोध देने वाली </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई विविधता नहीं</span><span style=\"font-family:'Mangal'\"> होती → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लैंगिक प्रजनन (बीज) विविधता उत्पन्न करता है, इसलिए कुछ पौधे रोग का प्रतिरोध कर सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विविधता का अभाव ही कायिक प्रवर्धित पौधों की अधिक संवेदनशीलता का कारण है → R सत्य है और A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वनस्पति तेलों को हाइड्रोजनीकरण द्वारा ठोस वसा (वनस्पति घी) में बदला जाता है। इस प्रक्रिया के विषय में कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैलेडियम उत्प्रेरक की उपस्थिति में संतृप्त शृंखलाओं से हाइड्रोजन हटाई जाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकल उत्प्रेरक की उपस्थिति में असंतृप्त कार्बन शृंखलाओं में हाइड्रोजन जोड़ी जाती है, जिससे वे संतृप्त हो जाती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के प्रकाश में तेल में ऑक्सीजन जोड़ी जाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सांद्र सल्फ्यूरिक अम्ल से तेल का निर्जलीकरण किया जाता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वनस्पति तेलों में लंबी </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंतृप्त</span><span style=\"font-family:'Mangal'\"> कार्बन शृंखलाएँ (द्विबंध) होती हैं, जबकि जंतु वसा में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतृप्त</span><span style=\"font-family:'Mangal'\"> शृंखलाएँ होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">असंतृप्त हाइड्रोकार्बन </span><span style=\"font-weight:bold;font-family:'Mangal'\">निकल</span><span style=\"font-family:'Mangal'\"> या पैलेडियम जैसे उत्प्रेरकों की उपस्थिति में </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन जोड़कर</span><span style=\"font-family:'Mangal'\"> संतृप्त हाइड्रोकार्बन देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकल उत्प्रेरक के साथ यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजनीकरण</span><span style=\"font-family:'Mangal'\"> द्रव वनस्पति तेलों को ठोस वसा में बदल देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निकल उत्प्रेरक के साथ असंतृप्त शृंखलाओं में हाइड्रोजन जोड़ी जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPN</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HJI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KNL</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह में क्रमागत अक्षरों का अंतर देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPN: M(13) → P(16) → N(14): +3, −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGE: D(4) → G(7) → E(5): +3, −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HJI: H(8) → J(10) → I(9): </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, −1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KNL: K(11) → N(14) → L(12): +3, −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह +3, −2 का पालन करते हैं; HJI +2, −1 का।</span></p><p st
