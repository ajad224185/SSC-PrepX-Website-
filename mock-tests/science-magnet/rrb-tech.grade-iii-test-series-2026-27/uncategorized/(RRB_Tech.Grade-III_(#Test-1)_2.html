<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) RRB Tech.Grade-III (#Test-1 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

le:normal\"><span style=\"font-weight:normal\">Piece    X in plain water: water moves </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>into</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    the cells → the piece </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>swells</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    and its weight </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>increases</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Piece    Y in 20% salt solution: water moves </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>out</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    of the cells → the piece </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>shrinks</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    and its weight </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>decreases</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    X swells and gains weight while Y shrinks and loses weight </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">In    a lime kiln, limestone is heated strongly to produce quick lime,    which is later used in making cement. The reaction CaCO₃ → CaO    + CO₂ is an example of:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Thermal    decomposition reaction</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Combination    reaction</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Displacement    reaction</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Double    displacement reaction</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">CaCO₃    (limestone), on heating, gives CaO (quick lime) + CO₂.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">One    compound breaks into </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>two    or more</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    simpler substances → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>decomposition</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Since    the energy is supplied as </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>heat</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">,    it is a </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>thermal    decomposition</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    reaction.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(Combination    is the reverse: CaO + H₂O → Ca(OH)₂ + heat.)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    it is a thermal decomposition reaction </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Read    the Assertion (A) and Reason (R) and choose the correct option.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Assertion    (A): When a boat is rowed, the force of the paddle on the water    and the force of the water on the paddle, though equal and    opposite, do not cancel each other.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Reason    (R): Newton's third law applies to all types of forces, contact as    well as non-contact.</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Both    (A) and (R) are true and (R) is the correct explanation of (A)</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Both    (A) and (R) are true but (R) is not the correct explanation of (A)</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(A)    is true but (R) is false</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(A)    is false but (R) is true</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(A):    the two forces of an action–reaction pair act on </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>two    different objects</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    (water and paddle), so they never cancel → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>true</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(R):    Newton's third law does apply to all forces, contact or    non-contact → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>true</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">But    (R) does not explain (A): the reason the forces do not cancel is    that they act on </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>different    objects</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">,    not that the law applies to all forces.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    both are true but (R) is not the correct explanation </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">In    the nitrogen cycle, when plants and animals die, bacteria and    fungi break down the organic matter and return nitrogen to the    soil as ammonia. This step is called:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Nitrification</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Nitrogen    fixation</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Ammonification</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Denitrification</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    nitrogen cycle has the steps: nitrogen fixation, assimilation,    ammonification, nitrification and denitrification.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>Ammonification</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    → decomposers (bacteria, fungi) break down dead organic    matter/waste and release </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>ammonia</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    into the soil.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Nitrification    converts ammonia → nitrite → nitrate; nitrogen fixation    converts N₂ into usable compounds; denitrification returns N₂    to the air.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the step is ammonification </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    student runs from the ground floor to the fourth floor of a    building (each floor is ><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">This    is exactly </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>why</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    gametes carry half the number: 23 + 23 = 46 restores the species    number at fertilisation. So (R) explains (A).</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    both are true and (R) is the correct explanation </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">To    hear a distinct echo, the reflected sound must reach the ear at    least 0.1 s after the original sound. Taking the speed of sound in    air as 344 m/s, the minimum distance of the reflecting surface    from the person is:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span s {"sr_no": 17, "question": "Fयहन ंधपोिस A, B, C ोnक D थधनध पधौपधक थiपु ौोिप ौियहपiयnौ. A कiौूिोcधौ cयूूधन ीनयं CहSO₄ ृहप nयप iनयn ीनयं FधSO₄े B कiौूिोcधौ iनयn ीनयं FधSO₄े C कiौूिोcधौ यnिद ौiिॅधन ीनयं AgNO₃े D ौुयथौ nय नधोcपiयn थiपु FधSO₄, CहSO₄, ZnSO₄ यन AgNO₃. Tुध ंयौप नधोcपiॅध ोnक पुध िधोौप नधोcपiॅध ंधपोिस ोनध नधौूधcपiॅिधद:", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">B    and D</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    and C</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">D    and B</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">C    and A</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    more reactive metal displaces a less reactive metal from its salt    solution.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">B    displaces </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>iron</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    → B is more reactive than Fe (and hence than Cu, Ag) → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>most    reactive</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    displaces Cu but not Fe → between Fe and Cu.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">C    displaces only Ag → between Cu and Ag.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">D    displaces </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>none</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    (not even Ag) → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>least    reactive</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Order:    B &gt; A &gt; C &gt; D.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    most reactive = B, least reactive = D </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">In    domestic wiring, the metallic body of appliances such as an    electric press, toaster or refrigerator is connected to the earth    wire. The purpose of this is:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">To    increase the power supplied to the appliance</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">To    keep the current constant during voltage fluctuations</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">To    provide a low-resistance path so that a current leaking to the    body flows to the earth and the user is not shocked</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">To    reduce the heating of the appliance</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>earth    wire</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    (green insulation) is connected to a metal plate deep in the    earth.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    metallic body of the appliance is connected to it, giving a    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>low-resistance    conducting path</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    for current.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weigh pan style=\"font-style:normal\"><span style=\"font-weight:normal\">Nitrogen pentaoxide</span></span></span></span></span></span></p>", "option3": "\r\n\r\n<p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Dinitrogen oxide</span></span></span></span></span></span></p>", "option4": "\r\n\r\n<p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Nitrogen(V) oxide</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"orphans:2;widows:2;margin-bottom:0.03in\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Prefixes give the number of atoms: di- = 2, penta- = 5.</span></span></span></span></span></span></p>\r\n\r\n<p style=\"orphans:2;widows:2;margin-bottom:0.03in\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">N₂ &rarr; </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>dinitrogen</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">; O₅ &rarr; penta + oxide.</span></span></span></span></span></p>\r\n\r\n<p style=\"orphans:2;widows:2;margin-bottom:0.03in\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">When a prefix ends in &#39;a&#39; or &#39;o&#39; and the element name begins with a vowel, the last vowel of the prefix is dropped: penta + oxide &rarr; </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>pentoxide</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>\r\n\r\n<p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore, N₂O₅ is dinitrogen pentoxide </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Flowers    of the coral tree and the hibiscus are pollinated by sunbirds and    the Indian white-eye. Such a flower is said to be:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Wind-pollinated</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Water-pollinated</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Bird-pollinated</span></span></span></span></span></span></p>", "option4": " <p style=\"or yle:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">An    atom of element X has a mass number of 37 and contains 20    neutrons. What is the atomic number of X, and which element does    it represent?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">18,    Argon</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">19,    Potassium</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">20,    Calcium</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">17,    Chlorine</span></span></span></span></span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Mass    number (A) = number of protons + number of neutrons</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows: he equator → air </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>rises</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    → equatorial low pressure belt.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">This    air moves poleward at high altitude, </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>cools,    becomes denser and sinks</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    around </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>30°    N and 30° S</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    sinking air forms the </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>sub-tropical    high pressure belts</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">;    from here air flows back to the equator along the surface.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(Air    rises again around 60° N/S and sinks at the poles.)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the belts form around 30° N and S </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">In    1987, the United Nations Environment Programme (UNEP) forged an    agreement among nations to protect the ozone layer. The agreement    was to:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Ban    the use of all refrigerators</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Freeze    CFC production at 1986 levels</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Stop    the burning of fossil fuels</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font- t-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">De-oxygenated    blood from the body enters the </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>right    atrium</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the chamber is the left atrium </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">An    optician prescribes a lens of power −2.5 D. The focal length and    the nature of the lens are:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">+40    cm, convex lens</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span>−<span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">40    cm, concave lens</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span>−<span style=\"font-family:'Mangal'\"><span style=\"font- e:normal\"><span style=\"font-weight:normal\">71    g and 117 g</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">71    g and 71 g</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Law    of constant proportions: Na : Cl = 23 : 35.5 by mass, always.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">23    g Na needs 35.5 g Cl → 46 g Na (double) needs 2 × 35.5 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>71    g Cl</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Law    of conservation of mass: mass of NaCl formed = 46 + 71 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>117    g</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-fam =\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(The    few that bounced back showed a tiny, dense, positive nucleus.)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Thomson's    model (evenly spread positive charge) could not explain the large    deflections.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    Option A is correct </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(Option    A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Consider    the following statements about the cell:</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(i)    The cell membrane is about 7 to 10 nanometres thick.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span s an></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">As    air is sucked out of the jar, the sound becomes </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>fainter</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">When    a near vacuum is reached, </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>almost    no sound</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    is heard although the bell can still be </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>seen</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    vibrating.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">When    air is let back in, the sound is heard again.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    person can see distant objects clearly but cannot read a book held    at 25 cm; he has to hold it farther away. His defect and its    correction are:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Myopia;    corrected by a concave lens</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Hypermetropia;    corrected by a convex lens</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Presbyopia;    corrected by a concave lens</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Cataract;    corrected by a bifocal lens</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:norma =\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Gallium    and caesium</span></span></span></span></span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Metals    generally have high melting points, but there are exceptions.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>Gallium    and caesium</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    have very low melting points and </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>melt    on the palm</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    (body temperature ≈ 37 °C).</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Mercury    is liquid at room temperature (not \"melts on the palm\");    bromine is a non-metal.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sodium    and potassium are soft but do not melt on the palm.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"fon <span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    &lt; B means that ‘A is the brother of B’.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">If    ‘C # D &lt; S + T @ Y’, then how is C related to Y?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Wife's    father's mother</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Wife's    father's father</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Wife's    father's sister</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Wife's    father's brother</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Given:</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    + B → A is the father of B</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    @ B → A is the wife of B</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    # B → A is the mother of B</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    &lt; B → A is the brother of B</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Now    the expression: C # D &lt; S + T @ Y</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">C    # D → C is the mother of D.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">D    &lt; S → D is the brother of S. D and S are siblings, so they    have the same parents. So C is also the mother of S.</span></span></span></span></span></span></p :normal\"><span style=\"font-weight:normal\">    → B is 5 m </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>West</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    of A</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">So    B lies to the </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>South-West</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    of A; to reach A he must walk </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>North-East</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    he should walk towards </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>North-East    (Option C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">What    should come in place of ? in the given se ottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Read    the given statements and conclusions carefully. Assuming that the    information given in the statements is true, even if it appears to    be at variance with commonly known facts, decide which of the    given conclusion(s) logically follow(s) from the statements.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Statements:    All pens are books. No book is a chair.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Conclusions:    (I) No pen is a chair. (II) Some chairs are books.</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Only    conclusion (II) follows</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Only    conclusion (I) follows</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Both    conclusions (I) and (II) follow</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Neither    conclusion (I) nor (II) follows</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">All    pens are books → the circle of \"pens\" lies completely    inside the circle of \"books\".</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">No    book is a chair → the \"books\" circle and the \"chairs\"    circle do not touch at all.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Since    every pen is inside \"books\" and \"books\" is    completely separate from \"chairs\", no pen can be a chair    → conclusion (I) </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>follows</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">\"Some    chairs are books\" directly contradicts \"No book is a    chair\" → conclusion (II) </span></span></span></span><span><span style=\"font-fami
