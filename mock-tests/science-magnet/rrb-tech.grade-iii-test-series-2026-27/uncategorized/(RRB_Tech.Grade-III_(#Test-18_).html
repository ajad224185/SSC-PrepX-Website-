<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>37.) RRB Tech.Grade-III (#Test-18  - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तत्व A का इलेक्ट्रॉनिक विन्यास 2, 8, 5 है और तत्व B का इलेक्ट्रॉनिक विन्यास 2, 8, 7 है। A और B के संयोग से बने यौगिक में होंगे:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक बंध</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक बंध</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धात्विक बंध</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई रासायनिक बंध नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तत्व A में </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> संयोजकता इलेक्ट्रॉन और तत्व B में </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> संयोजकता इलेक्ट्रॉन हैं; दोनों के बाह्यतम कोश में चार से अधिक इलेक्ट्रॉन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार से अधिक संयोजकता इलेक्ट्रॉन वाले परमाणु प्रायः अपना अष्टक पूरा करने के लिए इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रहण करते या साझा करते</span><span style=\"font-family:'Mangal'\"> हैं; A और B में से कोई भी इलेक्ट्रॉन त्यागकर धनायन नहीं बना सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों परमाणुओं को इलेक्ट्रॉन चाहिए, इसलिए कोई भी दूसरे को इलेक्ट्रॉन दे नहीं सकता, अतः वे इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">साझा करके</span><span style=\"font-family:'Mangal'\"> स्थायी विन्यास प्राप्त करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इलेक्ट्रॉन युग्म साझा करने से बना बंध </span><span style=\"font-weight:bold;font-family:'Mangal'\">सहसंयोजक बंध</span><span style=\"font-family:'Mangal'\"> है; A को तीन और B को एक इलेक्ट्रॉन चाहिए, अतः A का एक परमाणु B के तीन परमाणुओं से साझा करता है और सूत्र AB</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस यौगिक में सहसंयोजक बंध होंगे </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सीढ़ियों से किसी भवन की सबसे ऊपरी मंज़िल तक चढ़ने वाले विद्यार्थी की स्थितिज ऊर्जा में वृद्धि उतनी ही होती है जितनी उसे लिफ़्ट से उस मंज़िल तक ले जाने पर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. एक सरल मशीन किसी काम के लिए आवश्यक कुल कार्य को घटा देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी ढलान का यांत्रिक लाभ ढलान की लंबाई को उसकी ऊँचाई से भाग देने पर मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. स्थितिज ऊर्जा में वृद्धि mgh है, जो केवल प्राप्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊँचाई</span><span style=\"font-family:'Mangal'\"> पर निर्भर करती है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">पथ पर नहीं</span><span style=\"font-family:'Mangal'\">, अतः सीढ़ियों और लिफ़्ट से वृद्धि समान होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मशीन कुल कार्य को घटा नहीं सकती; वह केवल लगाए जाने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल के परिमाण या दिशा को बदलकर</span><span style=\"font-family:'Mangal'\"> काम को सरल बनाती है, और मशीनें ऊर्जा उत्पन्न नहीं करतीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ढलान पर प्रयास लंबाई L तक लगता है जबकि भार ऊँचाई h तक उठता है, अतः प्रयास × L = भार × h और यांत्रिक लाभ = भार / प्रयास = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L / h</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैस स्टोव पर खाना पकाते समय बर्तन की तली काली हो रही है। इसका अर्थ है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन पूरी तरह नहीं पका है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईंधन गीला है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईंधन का पूर्ण दहन नहीं हो रहा है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईंधन का पूर्ण दहन हो रहा है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गैस और केरोसिन स्टोव में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु के छिद्र</span><span style=\"font-family:'Mangal'\"> होते हैं, ताकि ऑक्सीजन से भरपूर मिश्रण जले और </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वच्छ नीली ज्वाला</span><span style=\"font-family:'Mangal'\"> दे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु के छिद्र बंद हो जाने पर ईंधन को पर्याप्त ऑक्सीजन नहीं मिलती और उसका </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्ण दहन नहीं होता</span><span style=\"font-family:'Mangal'\">; बिना जला कार्बन (कालिख) बर्तन पर जमकर उसे काला कर देता है और ईंधन भी व्यर्थ होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तली का काला होना भोजन के पकने से संबंधित नहीं है; पूर्ण दहन में बिना कालिख वाली स्वच्छ नीली ज्वाला मिलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ईंधन का पूर्ण दहन नहीं हो रहा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी पर नाइट्रोजन का सबसे बड़ा भंडार है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिट्टी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महासागर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सजीव</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन का सबसे बड़ा भंडार </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायुमंडल</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन गैस (N</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) काफ़ी अक्रियाशील होती है, इसलिए पौधे और जंतु इसका सीधे उपयोग नहीं कर सकते; पहले इसे ऐसे यौगिकों में बदलना पड़ता है जिन्हें पौधे मिट्टी से ले सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नाइट्रोजन का सबसे बड़ा भंडार वायुमंडल है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक किसान पाता है कि उसके खेत की मिट्टी अम्लीय हो गई है। मिट्टी को फ़सल के लिए उपयुक्त pH पर लाने के लिए उसे मिट्टी में मिलाना चाहिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बुझा हुआ चूना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तनु हाइड्रोक्लोरिक अम्ल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साधारण नमक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिरका</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधे तभी अच्छी तरह उगते हैं जब मिट्टी न बहुत अम्लीय हो और न बहुत क्षारकीय, अतः अम्लीय मिट्टी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदासीन</span><span style=\"font-family:'Mangal'\"> करना पड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल को </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारक</span><span style=\"font-family:'Mangal'\"> उदासीन करता है; बुझा हुआ चूना, अर्थात् कैल्सियम हाइड्रॉक्साइड, क्षारक है, और बिना बुझा चूना तथा खड़िया भी, जिन्हें किसान इसी काम के लिए प्रयोग करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तनु हाइड्रोक्लोरिक अम्ल और सिरका </span><span style=\"font-weight:bold;font-family:'Mangal'\">अम्ल</span><span style=\"font-family:'Mangal'\"> हैं और मिट्टी को और अधिक अम्लीय बना देंगे, जबकि साधारण नमक </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदासीन</span><span style=\"font-family:'Mangal'\"> लवण है और pH नहीं बदलता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे मिट्टी में बुझा हुआ चूना मिलाना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): बेल जार के भीतर बजती हुई विद्युत घंटी, जार से वायु निकाल देने पर, सुनाई देनी बंद हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ध्वनि के संचरण के लिए किसी भौतिक माध्यम की आवश्यकता होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि कंपन करती हुई वस्तु से उत्पन्न होती है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">माध्यम के कणों</span><span style=\"font-family:'Mangal'\"> के संपीडनों तथा विरलनों के रूप में चलती है; कणों के बिना विक्षोभ को ले जाने वाला कुछ नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए ध्वनि के संचरण के लिए ठोस, द्रव या गैस चाहिए और वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">निर्वात में नहीं चल सकती</span><span style=\"font-family:'Mangal'\"> → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेल जार से वायु निकाल देने पर घंटी कंपन तो करती रहती है, परंतु उसके चारों ओर ध्वनि को जार की दीवार तक पहुँचाने वाली वायु नहीं बचती, इसलिए घंटी सुनाई देनी बंद हो जाती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R में बताया गया माध्यम का अभाव ही घंटी के न सुनाई देने का कारण है, अतः R से A की व्याख्या होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धूप वाले दिन एक व्यक्ति किसी झरने की फुहार को देखता है और उसमें इंद्रधनुष देखता है। ऐसा होने के लिए सूर्य होना चाहिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रेक्षक के पीछे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रेक्षक के सामने</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठीक सिर के ऊपर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षितिज के नीचे</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंद्रधनुष एक प्राकृतिक स्पेक्ट्रम है, जो तब बनता है जब सूर्य का प्रकाश जल की नन्ही बूँदों में प्रवेश करके अपने रंगों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विक्षेपित</span><span style=\"font-family:'Mangal'\"> होता है, प्रत्येक बूँद के पिछले भाग से </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंतरिक परावर्तन</span><span style=\"font-family:'Mangal'\"> करता है और बाहर निकलते समय फिर अपवर्तित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्षेपित प्रकाश बूँदों से लगभग आने वाले सूर्य के प्रकाश की </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> दिशा में लौटता है, अतः वह आँख तक तभी पहुँचता है जब बूँदें प्रेक्षक के सामने हों और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य प्रेक्षक के पीछे</span><span style=\"font-family:'Mangal'\"> हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए इंद्रधनुष वर्षा के बाद आकाश में दिखता है, और धूप वाले दिन झरने या फव्वारे की फुहार में भी दिखता है, जब सूर्य व्यक्ति की पीठ की ओर हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के सामने, सिर के ऊपर या क्षितिज के नीचे होने पर बूँदों से लौटता प्रकाश इस प्रकार आँख तक नहीं पहुँच सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सूर्य प्रेक्षक के पीछे होना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तत्व X के परमाणु की द्रव्यमान संख्या 70 है और उसमें 31 इलेक्ट्रॉन हैं। उसके नाभिक में न्यूट्रॉनों की संख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">39</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">101</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु समग्र रूप से विद्युत उदासीन होता है, अतः उसमें प्रोटॉनों की संख्या इलेक्ट्रॉनों की संख्या के बराबर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटॉनों की संख्या = इलेक्ट्रॉनों की संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31</span><span style=\"font-family:'Mangal'\">, अतः X की परमाणु संख्या 31 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान संख्या नाभिक में भरे प्रोटॉनों और न्यूट्रॉनों की कुल संख्या है, अतः द्रव्यमान संख्या = प्रोटॉन + न्यूट्रॉन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूट्रॉनों की संख्या = 70 − 31 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">39</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परमाणु के नाभिक में 39 न्यूट्रॉन हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्षैतिज बल F से धकेली गई एक मेज़ फ़र्श पर अचर वेग से चलती है; फ़र्श से उस पर लगने वाला घर्षण बल परिमाण में F के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. यदि घर्षणरहित सतह पर चलती हुई गेंद पर कोई नेट बल न लगे, तो उसका वेग वही बना रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जल पर तैरती हुई गेंद पर उत्प्लावन बल और गुरुत्वाकर्षण बल एक ही दिशा में लगते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. अचर वेग का अर्थ है शून्य त्वरण, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेज़ पर नेट बल शून्य</span><span style=\"font-family:'Mangal'\"> है; इसलिए घर्षण बल लगाए गए बल को संतुलित करता है और गति के विपरीत दिशा में </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिमाण में F के बराबर</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेट बल न होने</span><span style=\"font-family:'Mangal'\"> पर चलती हुई वस्तु न तेज़ होती है, न धीमी होती है और न मुड़ती है, अतः गेंद </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसी वेग</span><span style=\"font-family:'Mangal'\"> से चलती रहती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. तैरती हुई गेंद पर गुरुत्वाकर्षण बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे</span><span style=\"font-family:'Mangal'\"> की ओर और जल का उत्प्लावन बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊपर</span><span style=\"font-family:'Mangal'\"> की ओर लगता है; दोनों विपरीत दिशाओं में लगकर एक-दूसरे को संतुलित करते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरलतम हाइड्रोकार्बन, मेथेन, का ईंधन के रूप में व्यापक उपयोग होता है, क्योंकि वह किसका मुख्य घटक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बायोगैस और संपीडित प्राकृतिक गैस (CNG)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केरोसिन और डीज़ल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेट्रोल और द्रवित पेट्रोलियम गैस (LPG)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोक और चारकोल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेन का सूत्र CH</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> है, जिसमें एक कार्बन परमाणु अपने चार संयोजकता इलेक्ट्रॉन चार हाइड्रोजन परमाणुओं से साझा करता है; यह बहुत निम्न गलनांक और क्वथनांक वाली गैस है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह पशुओं के गोबर और पादप अपशिष्ट से बनने वाली </span><span style=\"font-weight:bold;font-family:'Mangal'\">बायोगैस</span><span style=\"font-family:'Mangal'\"> का तथा वाहनों में ईंधन के रूप में प्रयुक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">संपीडित प्राकृतिक गैस (CNG)</span><span style=\"font-family:'Mangal'\"> का </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुख्य घटक</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केरोसिन, डीज़ल और पेट्रोल पेट्रोलियम से प्राप्त बड़े हाइड्रोकार्बनों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव</span><span style=\"font-family:'Mangal'\"> मिश्रण हैं, LPG मुख्यतः ब्यूटेन है, और कोक तथा चारकोल कार्बन के ठोस रूप हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेथेन बायोगैस और CNG का मुख्य घटक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जल में साधारण नमक का विलयन टिंडल प्रभाव दिखाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): विलयन के कण व्यास में 1 nm से छोटे होते हैं, जो प्रकाश को प्रकीर्णित करने के लिए बहुत छोटे हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टिंडल प्रभाव कणों द्वारा प्रकाश किरण-पुंज का प्रकीर्णन है, जिससे किरण-पुंज का पथ दिखाई देने लगता है; यह कोलॉइडों में तथा वायु के धूल और धुएँ के कणों में दिखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल में साधारण नमक जैसे वास्तविक विलयन में विलेय के कण व्यास में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 nm से छोटे</span><span style=\"font-family:'Mangal'\"> होते हैं, इसलिए वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश को प्रकीर्णित नहीं कर सकते</span><span style=\"font-family:'Mangal'\"> → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी कारण नमक के विलयन से गुज़रने वाले प्रकाश किरण-पुंज का पथ दिखाई नहीं देता, अर्थात् वास्तविक विलयन टिंडल प्रभाव </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं दिखाता</span><span style=\"font-family:'Mangal'\"> → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सीधा धारावाही चालक चुंबकीय क्षेत्र में रखा है। चालक पर लगने वाला बल सबसे अधिक तब होता है जब धारा की दिशा होती है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र के समांतर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र के विपरीत</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र के लंबवत</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र से 45° पर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबक अपने क्षेत्र में रखे धारावाही चालक पर बल लगाता है, और इस बल की दिशा धारा की दिशा तथा चुंबकीय क्षेत्र की दिशा पर निर्भर करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह बल चालक की लंबाई और चुंबकीय क्षेत्र दोनों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबवत</span><span style=\"font-family:'Mangal'\"> होता है, और इसका परिमाण </span><span style=\"font-weight:bold;font-family:'Mangal'\">तब सबसे अधिक होता है जब धारा क्षेत्र के समकोण पर</span><span style=\"font-family:'Mangal'\"> हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब धारा क्षेत्र के समांतर या विपरीत हो, तब चालक पर कोई बल नहीं लगता, और 45° पर बल अपने अधिकतम मान से कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बल तब सबसे अधिक होता है जब धारा चुंबकीय क्षेत्र के लंबवत हो </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I में दिए गए जंतु समूह का सूची II में दिए गए उदाहरण से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790407950401_image001.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(ii), (d)-(iv)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नाइडेरिया</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">जेलीफ़िश</span><span style=\"font-family:'Mangal'\">: हाइड्रा, जेलीफ़िश और प्रवाल नाइडेरिया के जंतु हैं, जिनमें ऊतक स्तर का संगठन होता है और जो स्पर्शकों से शिकार पकड़ते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनेलिडा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंचुआ</span><span style=\"font-family:'Mangal'\">: ऐनेलिडा के जंतुओं का शरीर बेलनाकार और खंडों में बँटा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मोलस्का</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्टोपस</span><span style=\"font-family:'Mangal'\">: घोंघा, स्क्विड और ऑक्टोपस मोलस्का के कोमल शरीर वाले जंतु हैं, जिनमें अंग तंत्र स्तर का संगठन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">एकाइनोडर्मेटा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">तारामछली</span><span style=\"font-family:'Mangal'\">: इस नाम का अर्थ है काँटेदार त्वचा वाले, और तारामछली तथा समुद्री अर्चिन इसके उदाहरण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेनेरिया अपने कटे हुए टुकड़ों से नए जीव बना सकता है, परंतु अधिक जटिल बहुकोशिकीय जीव ऐसा नहीं कर सकते। इसका कारण यह है कि जटिल जीवों में:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाओं में DNA नहीं होता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाएँ विभाजन की क्षमता खो चुकी होती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रजनन केवल बीजाणुओं द्वारा होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाएँ विशिष्ट ऊतकों और अंगों में संगठित होती हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेनेरिया जैसे सरल जीवों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनर्जनन</span><span style=\"font-family:'Mangal'\"> विशिष्ट कोशिकाओं द्वारा होता है, जो तेज़ी से बढ़ती हैं और फिर विभेदित होकर पूरे नए जीव के विभिन्न प्रकार की कोशिकाएँ और ऊतक बनाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जटिल जीव में विशिष्ट कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊतकों में, और ऊतक अंगों में संगठित</span><span style=\"font-family:'Mangal'\"> होते हैं, और प्रत्येक शरीर में एक निश्चित स्थान पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा जीव किसी टुकड़े से कोशिका-दर-कोशिका स्वयं को फिर से नहीं बना सकता, इसलिए वह पुनर्जनन के स्थान पर प्रजनन के लिए एक ही विशिष्ट प्रकार की कोशिका का उपयोग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसकी कोशिकाओं में DNA होता है, उसकी अनेक कोशिकाएँ वृद्धि और मरम्मत के लिए विभाजित होती रहती हैं, और वह बीजाणुओं से प्रजनन नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जटिल जीव पुनर्जनन इसलिए नहीं कर सकते क्योंकि उनकी कोशिकाएँ विशिष्ट ऊतकों और अंगों में संगठित होती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुष्पी पादप के लैंगिक प्रजनन की अवस्थाओं का सही क्रम है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निषेचन, परागण, पराग अंकुरण, युग्मनज बनना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परागण, वर्तिकाग्र पर पराग अंकुरण, निषेचन, युग्मनज बनना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पराग अंकुरण, परागण, युग्मनज बनना, निषेचन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्मनज बनना, निषेचन, परागण, पराग अंकुरण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुष्पी पादप में लैंगिक प्रजनन </span><span style=\"font-weight:bold;font-family:'Mangal'\">परागण</span><span style=\"font-family:'Mangal'\"> से आरंभ होता है, अर्थात् परागकोश से वर्तिकाग्र तक परागकणों का स्थानांतरण।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपयुक्त वर्तिकाग्र पर परागकण </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंकुरित</span><span style=\"font-family:'Mangal'\"> होता है, और परागनलिका वर्तिका से होकर नीचे बीजांड तक बढ़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नर युग्मक परागनलिका से होकर बीजांड तक पहुँचता है और अंड कोशिका से संलयित होता है; यही संलयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषेचन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निषेचित अंड कोशिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">युग्मनज</span><span style=\"font-family:'Mangal'\"> है, जो बाद में बीज के भीतर भ्रूण में विकसित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही क्रम परागण, वर्तिकाग्र पर पराग अंकुरण, निषेचन, युग्मनज बनना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम सल्फ़ेट और बेरियम क्लोराइड के विलयनों को मिलाने पर बेरियम सल्फ़ेट का सफ़ेद अवक्षेप बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अवक्षेप बनने के बाद फ़्लास्क में उपस्थित पदार्थों का कुल द्रव्यमान बदल जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ज़िंक तनु हाइड्रोक्लोरिक अम्ल से अभिक्रिया करता है, तो हाइड्रोजन गैस निकलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम सल्फ़ेट और बेरियम क्लोराइड की अभिक्रिया से </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेरियम सल्फ़ेट</span><span style=\"font-family:'Mangal'\"> बनता है, जो अघुलनशील है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सफ़ेद अवक्षेप</span><span style=\"font-family:'Mangal'\"> के रूप में दिखता है, साथ में सोडियम क्लोराइड बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दोनों विलयनों को मिलाने से पहले और अवक्षेप बनने के बाद तौलने पर कुल द्रव्यमान </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपरिवर्तित</span><span style=\"font-family:'Mangal'\"> मिलता है; यही द्रव्यमान संरक्षण का नियम है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ज़िंक तनु हाइड्रोक्लोरिक अम्ल से अभिक्रिया करके ज़िंक क्लोराइड और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन गैस</span><span style=\"font-family:'Mangal'\"> बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पारिस्थितिकी तंत्र में अपघटकों की क्या भूमिका होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे मिट्टी में जल के स्तर को नियंत्रित करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे मृत कार्बनिक पदार्थ को अपघटित करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे ऊर्जा को सीधे मांसाहारियों तक पहुँचाते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे प्रकाश संश्लेषण द्वारा भोजन बनाते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पारिस्थितिकी तंत्र में उत्पादक, उपभोक्ता और अपघटक होते हैं, और ऊर्जा के प्रवाह तथा पदार्थ के चक्रण में प्रत्येक की अपनी भूमिका है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवाणु और कवक जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटक</span><span style=\"font-family:'Mangal'\"> जीवों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मृत अवशेषों और अपशिष्ट पदार्थों को</span><span style=\"font-family:'Mangal'\"> सरल अकार्बनिक पदार्थों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटित</span><span style=\"font-family:'Mangal'\"> कर देते हैं, जो मिट्टी में लौटकर पौधों द्वारा फिर से उपयोग किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पादक</span><span style=\"font-family:'Mangal'\"> प्रकाश संश्लेषण द्वारा बनाते हैं, और ऊर्जा मांसाहारियों तक उन शाकाहारियों से पहुँचती है जिन्हें वे खाते हैं, अपघटकों से नहीं; मिट्टी में जल के स्तर को नियंत्रित करना किसी जीव की भूमिका नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अपघटक मृत कार्बनिक पदार्थ को अपघटित करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातुओं की प्राप्ति और निष्कर्षण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पोटैशियम, सोडियम, कैल्सियम, मैग्नीशियम और ऐलुमिनियम जैसी धातुएँ प्रकृति में कभी मुक्त तत्वों के रूप में नहीं मिलतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कॉपर, जो प्रकृति में Cu</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">S के रूप में मिलता है, अपने अयस्क को केवल वायु में गर्म करके प्राप्त किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ऐलुमिनियम ऑक्साइड को कार्बन के साथ गर्म करके ऐलुमिनियम प्राप्त किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सक्रियता श्रेणी में सबसे ऊपर की धातुएँ, K, Na, Ca, Mg और Al, इतनी </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रियाशील</span><span style=\"font-family:'Mangal'\"> हैं कि प्रकृति में कभी मुक्त तत्वों के रूप में नहीं मिलतीं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कॉपर निम्न क्रियाशीलता वाली धातु है; उसके सल्फ़ाइड अयस्क Cu</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">S को पहले वायु में गर्म करने पर कॉपर(I) ऑक्साइड बनता है, जो फिर बचे हुए Cu</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">S से अभिक्रिया करके </span><span style=\"font-weight:bold;font-family:'Mangal'\">धात्विक कॉपर</span><span style=\"font-family:'Mangal'\"> देता है, अतः केवल वायु में गर्म करना ही पर्याप्त है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ऐलुमिनियम सक्रियता श्रेणी में ऊपर है, और ऐसी धातुएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपने ऑक्साइडों को कार्बन के साथ गर्म करके प्राप्त नहीं की जा सकतीं</span><span style=\"font-family:'Mangal'\">; ऐलुमिनियम को ऐलुमिनियम ऑक्साइड के </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत अपघटनी अपचयन</span><span style=\"font-family:'Mangal'\"> से प्राप्त किया जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवों की किसी समष्टि में विभिन्नता क्यों महत्वपूर्ण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह सभी जीवों के विलुप्त होने का कारण बनती है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर्यावरणीय परिस्थितियों के बदलने पर यह कुछ जीवों को जीवित रहने में सहायता करती है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह जीवों को एक जैसा बना देती है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रजनन को रोक देती है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रजनन से ऐसे जीव बनते हैं जो अपने जनकों के समान होते हैं, परंतु उनमें छोटी-छोटी </span><span style=\"font-weight:bold;font-family:'Mangal'\">विभिन्नताएँ</span><span style=\"font-family:'Mangal'\"> होती हैं, और इन विभिन्नताओं की प्रकृति के अनुसार भिन्न-भिन्न जीवों को भिन्न-भिन्न प्रकार के लाभ मिलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि पर्यावरण बदल जाए, जैसे किसी तालाब का जल अधिक गर्म हो जाए, तो अधिकांश जीव मर सकते हैं, परंतु वे थोड़े-से जीव, जिनकी विभिन्नता उन्हें इस परिवर्तन को सहने योग्य बनाती है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवित रहते और बढ़ते</span><span style=\"font-family:'Mangal'\"> हैं; इस प्रकार विभिन्नता जाति के जीवित रहने की संभावना बढ़ाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभिन्नता विलुप्ति का कारण नहीं बनती, जीवों को एक जैसा नहीं बनाती और प्रजनन को नहीं रोकती; वह तो प्रजनन के दौरान ही उत्पन्न होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विभिन्नता इसलिए महत्वपूर्ण है क्योंकि पर्यावरणीय परिस्थितियों के बदलने पर यह कुछ जीवों को जीवित रहने में सहायता करती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक फुटबॉल खिलाड़ी 0.5 kg द्रव्यमान की स्थिर गेंद को किक मारता है, और गेंद उसके पैर से 72 km/h की चाल से निकलती है। यदि पैर द्वारा लगाया गया औसत बल 500 N हो, तो पैर जितने समय तक गेंद के संपर्क में रहता है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.02 s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2 s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.05 s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.5 s</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाल को SI मात्रक में बदलिए: 72 km/h = 72 × (1000 / 3600) m/s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गेंद विरामावस्था से चलती है, अतः उसके संवेग में परिवर्तन = m × (v − u) = 0.5 × (20 − 0) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 kg m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के द्वितीय नियम के संवेग रूप से, बल = संवेग में परिवर्तन / लगा समय, अतः समय = संवेग में परिवर्तन / बल।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">t = 10 / 500 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.02 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पैर 0.02 s तक गेंद के संपर्क में रहता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): अग्न्याशय की कोशिकाओं में, जो पाचक एंजाइम स्रावित करती हैं, खुरदरी अंतर्द्रव्यी जालिका प्रचुर मात्रा में होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): चिकनी अंतर्द्रव्यी जालिका वसा तथा हार्मोन के संश्लेषण और संचयन में भाग लेती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खुरदरी अंतर्द्रव्यी जालिका (RER) इसलिए खुरदरी दिखती है क्योंकि उसकी सतह पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">राइबोसोम</span><span style=\"font-family:'Mangal'\"> लगे होते हैं, और वह मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन संश्लेषण तथा प्रोटीन स्रावण</span><span style=\"font-family:'Mangal'\"> में भाग लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्न्याशय की कोशिकाओं जैसी ग्रंथि कोशिकाएँ बड़ी मात्रा में एंजाइम बनाती और स्रावित करती हैं, जो प्रोटीन हैं, इसलिए उनमें RER प्रचुर मात्रा में होती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिकनी अंतर्द्रव्यी जालिका (SER) पर राइबोसोम नहीं होते और वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">वसा तथा हार्मोन के संश्लेषण और संचयन</span><span style=\"font-family:'Mangal'\"> में भाग लेती है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु R में SER के काम का वर्णन है; उससे यह नहीं समझ आता कि स्रावण करने वाली कोशिका में RER अधिक क्यों है, जिसका कारण RER पर लगे राइबोसोम द्वारा प्रोटीन बनाना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिमालयी क्षेत्र की पारंपरिक पनचक्की, घराट में, पीसने के पत्थर को घुमाने वाला पहिया इसलिए चलता है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईंधन की रासायनिक ऊर्जा यांत्रिक ऊर्जा में बदलती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल की ऊष्मीय ऊर्जा यांत्रिक ऊर्जा में बदलती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत ऊर्जा यांत्रिक ऊर्जा में बदलती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल की स्थितिज ऊर्जा गतिज ऊर्जा में बदलती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घराट में जल को ऊँचाई से लाया जाता है और ऊपर उसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थितिज ऊर्जा</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैसे-जैसे जल पाइप से नीचे आता है, यह स्थितिज ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">गतिज ऊर्जा</span><span style=\"font-family:'Mangal'\"> में बदलती जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तेज़ बहते जल की गतिज ऊर्जा पहिए से टकराकर उसे घूर्णन गति देती है, और पहिया पीसने के पत्थर से जुड़ा होता है जो अनाज पीसता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें न ईंधन जलता है, न विद्युत का प्रयोग होता है और न जल गर्म किया जाता है, अतः बाकी तीनों रूपांतरणों का इसमें कोई भाग नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पहिया इसलिए चलता है क्योंकि जल की स्थितिज ऊर्जा गतिज ऊर्जा में बदलती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I में दिए गए तत्व के लैटिन नाम का सूची II में दिए गए उसके प्रतीक से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790407950401_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iv), (c)-(ii), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(ii), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनेक तत्वों के प्रतीक उनके अंग्रेज़ी नामों से नहीं, बल्कि लैटिन नामों से बने हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फ़ेरम</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fe</span><span style=\"font-family:'Mangal'\">: लोहे (आयरन) का लैटिन नाम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऑरम</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Au</span><span style=\"font-family:'Mangal'\">: सोने (गोल्ड) का लैटिन नाम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्लंबम</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'
