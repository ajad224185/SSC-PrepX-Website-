× N’ है, तो K का N से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई के पुत्र की पत्नी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन के पुत्र की पत्नी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन की पुत्री</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: K + L − M × N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K + L → K, L की पत्नी है, अतः K और L पति-पत्नी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L − M → L, M का पुत्र है, अतः M, L की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M × N → M, N की बहन है, अतः M और N के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः L, N की बहन का पुत्र है, और K उसी पुत्र की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(भाई के पुत्र की पत्नी होने के लिए M को भाई होना पड़ता, परंतु M बहन है; बहन की पुत्री और पुत्र की पत्नी में शृंखला का एक-एक चरण छूट जाता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः K, N के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहन के पुत्र की पत्नी (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DKD GNG JQJ MTM ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PWP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PVP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OWO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PWQ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के दोनों सिरों पर एक ही अक्षर है, अतः बाहरी अक्षरों और बीच के अक्षरों को अलग-अलग पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाहरी अक्षर: D, G, J, M, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → ? = M + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, दोनों सिरों पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीच के अक्षर: K, N, Q, T, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → ? = T + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह PWP है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(PVP में बीच का अक्षर केवल दो स्थान आगे गया है, OWO में बाहरी अक्षर केवल दो स्थान आगे गए हैं, तथा PWQ में दोनों सिरों के अक्षर समान होने का पैटर्न टूट जाता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">PWP (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘+’ और ‘×’ को आपस में बदल दिया जाए तथा ‘6’ और ‘4’ को आपस में बदल दिया जाए, तो निम्नलिखित में से कौन-सा समीकरण सही होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 + 6 × 3 = 22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 4 + 8 = 32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 6 + 5 = 26</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 + 4 × 2 = 14</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक विकल्प में बाईं ओर + के स्थान पर ×, × के स्थान पर +, 6 के स्थान पर 4 और 4 के स्थान पर 6 रखें, फिर BODMAS लागू करें (+ से पहले ×) और दाईं ओर से तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: 4 + 6 × 3 → 6 × 4 + 3 = 24 + 3 = 27 आता है, जो 22 नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: 6 × 4 + 8 → 4 + 6 × 8 = 4 + 48 = 52 आता है, जो 32 नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: 4 × 6 + 5 → 6 + 4 × 5 = 6 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: 6 + 4 × 2 → 4 × 6 + 2 = 24 + 2 = 26 आता है, जो 14 नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अदला-बदली के बाद केवल विकल्प C संतुलित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही समीकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 × 6 + 5 = 26 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट में 2 * 5 = 29 और 4 * 3 = 25 है। उसी नियम के अनुसार 6 * 7 का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">83</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">87</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">91</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा एक नियम खोजें जो 2 और 5 से 29 तथा 4 और 3 से 25 दे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणनफल काम नहीं करता: 2 × 5 = 10 और 4 × 3 = 12, जो 29 और 25 से बहुत दूर हैं। वर्ग आज़माएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 * 5: 2² + 5² = 4 + 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 * 3: 4² + 3² = 16 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: a * b = a² + b², अर्थात् दोनों संख्याओं के वर्गों का योग।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसे 6 * 7 पर लागू करें: 6² + 7² = 36 + 49 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">85</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(83 और 87 में 85 से 2 की चूक है, तथा 91 = 6 × 7 + 49 है, जिसमें गुणनफल और एक वर्ग मिला दिए गए हैं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 6 * 7 का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">85 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्या 63928417 के प्रत्येक अंक को बाएँ से दाएँ आरोही क्रम में व्यवस्थित किया जाता है। इस प्रकार बनी नई संख्या में निम्नलिखित में से कौन-सा अंक दाएँ से तीसरा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63928417 के अंकों को सबसे छोटे से सबसे बड़े तक लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंक 6, 3, 9, 2, 8, 4, 1, 7 हैं → आरोही क्रम में: </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 2 3 4 6 7 8 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नई संख्या 12346789 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ से गिनें: दाएँ से पहला 9, दूसरा 8, तीसरा </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8 दाएँ से दूसरा है, 6 दाएँ से चौथा है, तथा 4 दाएँ से पाँचवाँ है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ से तीसरा अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कोई कार बस नहीं है। सभी वैन बसें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कोई वैन कार नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ बसें कार नहीं हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई कार बस नहीं है → कारों का वृत्त और बसों का वृत्त एक-दूसरे को कहीं भी नहीं छूते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी वैन बसें हैं → वैनों का वृत्त पूरी तरह बसों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कोई वैन कार नहीं है → प्रत्येक वैन बसों के वृत्त के अंदर है, और बसों के वृत्त का कोई भाग कार नहीं है, अतः कोई वैन कार नहीं हो सकती → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ बसें कार नहीं हैं → जो बसें वैन हैं, वे निश्चित रूप से हैं, और उनमें से कोई भी कार नहीं हो सकती, क्योंकि कोई भी बस कार नहीं है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पार्किंग स्थल में, कार P, कार Q के पूर्व में है। कार R, कार Q के पश्चिम में है। कार S, कार Q के दक्षिण में है। कार T, कार R के उत्तर में है। कार S के सापेक्ष कार T की स्थिति क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पश्चिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पश्चिम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारों का चित्र बनाएँ, कार Q बीच में; पूर्व = दाईं ओर, उत्तर = ऊपर की ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार P, Q के पूर्व में है → P, Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाईं ओर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार R, Q के पश्चिम में है → R, Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाईं ओर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार S, Q के दक्षिण में है → S, Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार T, R के उत्तर में है → T, R के </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊपर</span><span style=\"font-family:'Mangal'\"> है, अर्थात् Q के ऊपर और बाईं ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब T की तुलना S से करें: T, Q के बाईं ओर है और S, Q के ठीक नीचे है, अतः T, S के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> में है; T, Q के ऊपर है और S, Q के नीचे है, अतः T, S के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों को मिलाकर, T, S के उत्तर-पश्चिम में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(उत्तर-पूर्व के लिए T को Q के दाईं ओर होना पड़ता; दक्षिण-पश्चिम और पश्चिम में यह छूट जाता है कि T, Q के ऊपर है जबकि S नीचे है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार T, कार S के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पश्चिम (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DRDO द्वारा 15 जून 2026 को सफलतापूर्वक उड़ान परीक्षण की गई लंबी दूरी की भू-प्रहार क्रूज़ मिसाइल (LRLACM) को डॉ. ए.पी.जे. अब्दुल कलाम द्वीप से प्रक्षेपित किया गया, जो किस राज्य के तट के निकट स्थित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आंध्र प्रदेश</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तमिलनाडु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम बंगाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओडिशा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">डॉ. ए.पी.जे. अब्दुल कलाम द्वीप</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओडिशा</span><span style=\"font-family:'Mangal'\"> के तट के निकट स्थित है और इसी द्वीप से DRDO ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 जून 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी दूरी की भू-प्रहार क्रूज़ मिसाइल (LRLACM)</span><span style=\"font-family:'Mangal'\"> का उड़ान परीक्षण किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परीक्षण के सभी उद्देश्य पूरी तरह प्राप्त हुए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस मिसाइल की नोडल प्रयोगशाला </span><span style=\"font-weight:bold;font-family:'Mangal'\">वैमानिकी विकास प्रतिष्ठान (ADE), बेंगलुरु</span><span style=\"font-family:'Mangal'\"> है और इसकी उप-प्रणालियाँ DRDO की प्रयोगशालाओं ने भारतीय उद्योग भागीदारों के साथ मिलकर विकसित की हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्षा मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">राजनाथ सिंह</span><span style=\"font-family:'Mangal'\"> ने इस सफल परीक्षण पर DRDO टीम और उद्योग भागीदारों को बधाई दी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह राज्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओडिशा (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत के संविधान का निम्नलिखित में से कौन-सा अनुच्छेद संसद को संविधान में संशोधन करने की शक्ति और उसकी प्रक्रिया प्रदान करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 372</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 362</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 356</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुच्छेद 368</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत के संविधान के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाग XX</span><span style=\"font-family:'Mangal'\"> में स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 368</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">संसद</span><span style=\"font-family:'Mangal'\"> को संविधान में संशोधन करने की शक्ति देता है और उसकी प्रक्रिया निर्धारित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संशोधन विधेयक संसद के किसी भी सदन में पेश किया जा सकता है और प्रत्येक सदन में इसे कुल सदस्य संख्या के बहुमत तथा उपस्थित और मतदान करने वाले सदस्यों के कम से कम </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो-तिहाई</span><span style=\"font-family:'Mangal'\"> बहुमत से पारित होना आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राष्ट्रपति के निर्वाचन या विधायी शक्तियों के बँटवारे जैसे संघीय प्रावधानों से जुड़े संशोधनों का कम से कम </span><span style=\"font-weight:bold;font-family:'Mangal'\">आधे</span><span style=\"font-family:'Mangal'\"> राज्यों के विधानमंडलों द्वारा अनुसमर्थन भी आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">केशवानंद भारती मामले (1973)</span><span style=\"font-family:'Mangal'\"> में उच्चतम न्यायालय ने कहा कि संसद इस शक्ति से संविधान के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूल ढाँचे</span><span style=\"font-family:'Mangal'\"> को नहीं बदल सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 356</span><span style=\"font-family:'Mangal'\"> किसी राज्य में राष्ट्रपति शासन का, </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 372</span><span style=\"font-family:'Mangal'\"> विद्यमान विधियों के प्रवृत्त बने रहने का प्रावधान करता है और पूर्व देशी रियासतों के शासकों के अधिकारों और विशेषाधिकारों से जुड़े </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 362</span><span style=\"font-family:'Mangal'\"> को 1971 के 26वें संशोधन द्वारा हटा दिया गया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह अनुच्छेद </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 368 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रांतों में 'द्वैध शासन' की व्यवस्था, जिसके अंतर्गत प्रांतीय विषयों को 'आरक्षित' और 'हस्तांतरित' विषयों में बाँटा गया था, निम्नलिखित में से किस अधिनियम द्वारा लागू की गई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारतीय परिषद अधिनियम, 1909</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत सरकार अधिनियम, 1935</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत सरकार अधिनियम, 1919</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारतीय परिषद अधिनियम, 1892</span></p>", "answer": "3", nt-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">भारतीय परिषद अधिनियम, 1909</span><span style=\"font-family:'Mangal'\"> (मॉर्ले-मिंटो सुधार) ने मुसलमानों के लिए पृथक निर्वाचक मंडल लागू किया और </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारतीय परिषद अधिनियम, 1892</span><span style=\"font-family:'Mangal'\"> ने विधान परिषदों का विस्तार किया तथा अप्रत्यक्ष निर्वाचन की अनुमति दी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रांतों में द्वैध शासन </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत सरकार अधिनियम, 1919 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> द्वारा लागू किया गया था।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27 जनवरी 2026 को नई दिल्ली में हुए 16वें शिखर सम्मेलन में भारत ने किस साझेदार के साथ मुक्त व्यापार समझौते की वार्ता पूरी की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यूनाइटेड किंगडम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑस्ट्रेलिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यूरोपीय संघ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जापान</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">27 जनवरी 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">नई दिल्ली</span><span style=\"font-family:'Mangal'\"> में हुए </span><span style=\"font-weight:bold;font-family:'Mangal'\">16वें भारत यूरोपीय संघ शिखर सम्मेलन</span><span style=\"font-family:'Mangal'\"> में भारत और </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूरोपीय संघ</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत यूरोपीय संघ मुक्त व्यापार समझौते</span><span style=\"font-family:'Mangal'\"> की वार्ता पूरी की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस सम्मेलन में प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\">, यूरोपीय आयोग की अध्यक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">उर्सुला वॉन डेर लेयेन</span><span style=\"font-family:'Mangal'\"> और यूरोपीय परिषद के अध्यक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">एंतोनियो कोस्ता</span><span style=\"font-family:'Mangal'\"> उपस्थित थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह वार्ता पहली बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">2007</span><span style=\"font-family:'Mangal'\"> में आरंभ हुई थी और </span><span style=\"font-weight:bold;font-family:'Mangal'\">2022</span><span style=\"font-family:'Mangal'\"> में फिर से शुरू की गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी सम्मेलन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">भारत यूरोपीय संघ सुरक्षा एवं रक्षा साझेदारी</span><span style=\"font-family:'Mangal'\"> पर हस्ताक्षर हुए, और इस व्यापार समझौते को \"सभी समझौतों की जननी\" (mother of all deals) कहा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह साझेदार </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूरोपीय संघ (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साइप्रस में हुए और 16 अप्रैल 2026 को समाप्त हुए FIDE महिला कैंडिडेट्स टूर्नामेंट 2026 को जीतकर महिला विश्व शतरंज चैंपियन जू वेनजुन को चुनौती देने का अधिकार किसने पाया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आर. वैशाली</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोनेरू हम्पी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिव्या देशमुख</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डी. हरिका</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">भारत</span><span style=\"font-family:'Mangal'\"> की </span><span style=\"font-weight:bold;font-family:'Mangal'\">आर. वैशाली</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> में से </span><span style=\"font-weight:bold;font-family:'Mangal'\">8.5</span><span style=\"font-family:'Mangal'\"> अंक लेकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">FIDE महिला कैंडिडेट्स टूर्नामेंट 2026</span><span style=\"font-family:'Mangal'\"> जीता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह टूर्नामेंट </span><span style=\"font-weight:bold;font-family:'Mangal'\">साइप्रस</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेगेइया</span><span style=\"font-family:'Mangal'\"> स्थित कैप सेंट जॉर्जेस होटल एंड रिज़ॉ argin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोयले का खनन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैंकिंग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछली पकड़ना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चीनी का विनिर्माण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तृतीयक क्षेत्र</span><span style=\"font-family:'Mangal'\"> में वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">सेवाएँ</span><span style=\"font-family:'Mangal'\"> आती हैं, जो वस्तुओं के उत्पादन में सहायक होती हैं, जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैंकिंग</span><span style=\"font-family:'Mangal'\">, परिवहन, भंडारण, संचार, व्यापार, शिक्षा और स्वास्थ्य।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्राथमिक क्षेत्र</span><span style=\"font-family:'Mangal'\"> में वे गतिविधियाँ आती हैं, जो सीधे प्राकृतिक संसाधनों पर आधारित हैं, जैसे कृषि, </span><span style=\"font-weight:bold;font-family:'Mangal'\">मछली पकड़ना</span><span style=\"font-family:'Mangal'\">, वानिकी और </span><span style=\"font-weight:bold;font-family:'Mangal'\">खनन</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">द्वितीयक क्षेत्र</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">विनिर्माण</span><span style=\"font-family:'Mangal'\"> आता है, जिसमें प्राकृतिक उत्पादों को औद्योगिक प्रक्रियाओं द्वारा दूसरे रूप में बदला जाता है, जैसे गन्ने से </span><span style=\"font-weight:bold;font-family:'Mangal'\">चीनी</span><span style=\"font-family:'Mangal'\"> बनाना।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैंकिंग स्वयं कोई वस्तु नहीं बनाती; यह एक सेवा है, जो अन्य दोनों क्षेत्रों की सहायता करती है, इसलिए यह तृतीयक क्षेत्र में आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तृतीयक क्षेत्र की गतिविधि </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैंकिंग (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़रवरी 2025 में किस दिन भारत में राष्ट्रीय विज्ञान दिवस मनाया गया?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 फ़रवरी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 फ़रवरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 फ़रवरी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 फ़रवरी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय विज्ञान दिवस</span><span style=\"font-family:'Mangal'\"> प्रतिवर्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 फ़रवरी</span><span style=\"font-family:'Mangal'\"> को मनाया जाता है, इसलिए 2025 में यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 फ़रवरी 2025</span><span style=\"font-family:'Mangal'\"> को मनाया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">1928</span><span style=\"font-family:'Mangal'\"> के उस दिन की स्मृति में है, जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">सी.वी. रमन</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">रमन प्रभाव</span><span style=\"font-family:'Mangal'\"> की खोज की घोषणा की थी, अर्थात् अणुओं द्वारा प्रकाश का तरंगदैर्ध्य में परिवर्तन के साथ प्रकीर्णन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस खोज के लिए रमन को </span><span style=\"font-weight:bold;font-family:'Mangal'\">1930</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">भौतिकी का नोबेल पुरस्कार</span><span style=\"font-family:'Mangal'\"> मिला और वे विज्ञान में नोबेल पुरस्कार पाने वाले पहले एशियाई बने।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह दिवस पहली बार 28 फ़रवरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">1987</span><span style=\"font-family:'Mangal'\"> को मनाया गया और प्रतिवर्ष भारत सरकार इसके लिए एक विषय घोषित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राष्ट्रीय विज्ञान दिवस </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 फ़रवरी (विकल्प A)</span><span style=\"font-family:'Mangal'\"> को मनाया गया।</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहुपक्षीय अभ्यास प्रगति 2026, जिसमें 20 से 30 मई 2026 तक हिंद महासागर क्षेत्र के 12 साझेदार देशों की सेनाओं ने भारतीय थलसेना के साथ प्रशिक्षण लिया, किस राज्य के उमरोई सैन्य स्टेशन में हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">असम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेघालय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिज़ोरम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नागालैंड</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बहुपक्षीय अभ्यास प्रगति 2026</span><span style=\"font-family:'Mangal'\"> भारतीय थलसेना ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेघालय</span><span style=\"font-family:'Mangal'\"> के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उमरोई सैन्य स्टेशन</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 से 30 मई 2026</span><span style=\"font-family:'Mangal'\"> तक किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PRAGATI का पूर्ण रूप </span><span style=\"font-weight:bold;font-family:'Mangal'\">Partnership of Regional Armies for Growth and Transformation in the Indian Ocean Region</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\"> साझेदार देशों की सेनाओं ने भाग लिया: </span><span style=\"font-weight:bold;font-family:'Mangal'\">भूटान, कंबोडिया, इंडोनेशिया, लाओस, मलेशिया, मालदीव, म्यांमार, नेपाल, फ़िलीपींस, सेशेल्स, श्रीलंका और वियतनाम</span><span style=\"font-family:'Mang let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
