Mangal'\">Pb</span><span style=\"font-family:'Mangal'\">: सीसे (लेड) का लैटिन नाम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कैलियम</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">: पोटैशियम का लैटिन नाम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iv), (b)-(i), (c)-(ii), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु में चलती हुई किसी ध्वनि तरंग की आवृत्ति बढ़ा दी जाती है। निम्नलिखित में से क्या भी बढ़ जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी बिंदु से प्रति सेकंड गुज़रने वाले संपीडनों की संख्या</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु में तरंग की चाल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तरंग की तरंगदैर्घ्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तरंग का आवर्तकाल</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंग की आवृत्ति किसी निश्चित बिंदु से </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक सेकंड</span><span style=\"font-family:'Mangal'\"> में गुज़रने वाले पूर्ण दोलनों, अर्थात् संपीडनों, की संख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवृत्ति बढ़ाने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रति सेकंड अधिक संपीडन उस बिंदु से गुज़रते हैं</span><span style=\"font-family:'Mangal'\"> → यह राशि बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि की </span><span style=\"font-weight:bold;font-family:'Mangal'\">चाल</span><span style=\"font-family:'Mangal'\"> केवल माध्यम और उसकी दशा पर निर्भर करती है, स्रोत की आवृत्ति पर नहीं, अतः वह वही रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाल = तरंगदैर्घ्य × आवृत्ति होने से, समान चाल पर अधिक आवृत्ति का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटी तरंगदैर्घ्य</span><span style=\"font-family:'Mangal'\">, और आवर्तकाल, जो 1 / आवृत्ति है, भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः किसी बिंदु से प्रति सेकंड गुज़रने वाले संपीडनों की संख्या बढ़ जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): गर्मियों में धूप में हल्के रंग की सतह गहरे रंग की सतह की तुलना में ठंडी रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): गहरे रंग की सतहों का ऐल्बीडो उच्च होता है और वे अपने ऊपर पड़ने वाले अधिकांश सूर्य के प्रकाश को परावर्तित कर देती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भिन्न-भिन्न सतहें धूप में भिन्न प्रकार से प्रकाश अवशोषित करके गर्म होती हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">गहरे रंग की सतहें अधिक</span><span style=\"font-family:'Mangal'\"> सूर्य का प्रकाश अवशोषित करती हैं, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">हल्के रंग की सतहें अधिक परावर्तित</span><span style=\"font-family:'Mangal'\"> करती हैं और तुलना में ठंडी रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए गहरे रंग की सड़कें जल्दी गर्म हो जाती हैं और गर्मियों में गहरे रंग के कपड़े सफ़ेद कपड़ों से अधिक गर्म लगते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्बीडो सूर्य के प्रकाश का वह अंश है जिसे कोई सतह परावर्तित करती है; गहरे रंग की सतहें बहुत कम परावर्तित करती हैं, अतः उनका ऐल्बीडो </span><span style=\"font-weight:bold;font-family:'Mangal'\">निम्न</span><span style=\"font-family:'Mangal'\"> होता है, उच्च नहीं, और निम्न ऐल्बीडो वाली सतहें अधिक जल्दी गर्म होती हैं → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार सीधी सड़क पर विरामावस्था से चलना आरंभ करती है और 6 s में उसका वेग 18 m/s हो जाता है। त्वरण को अचर मानते हुए, इन 6 s में कार द्वारा तय की गई दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार विरामावस्था से चलती है, अतः u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">, और t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 s</span><span style=\"font-family:'Mangal'\"> में उसका वेग v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 m/s</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्वरण a = (v − u) / t = (18 − 0) / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 m/s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्वरण अचर है, इसलिए दूरी s = ut + ½at</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> से मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = 0 + ½ × 3 × 6</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> = ½ × 3 × 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Shortcut:</span><span style=\"font-family:'Mangal'\"> अचर त्वरण के लिए s = ½ × (u + v) × t = ½ × (0 + 18) × 6 = 54 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तय की गई दूरी 54 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक घर में 220 V पर विद्युत आपूर्ति होती है। यदि घर की अधिकतम शक्ति खपत 11 kW है, तो मुख्य फ़्यूज़ की रेटिंग क्या होनी चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़्यूज़ की रेटिंग वह अधिकतम धारा है जिसे वह बिना पिघले गुज़रने देता है, अतः मुख्य फ़्यूज़ को उतनी धारा वहन करनी चाहिए जितनी पूरे घर के अधिकतम शक्ति पर चलने पर ली जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकतम शक्ति P = 11 kW = 11 × 1000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11,000 W</span><span style=\"font-family:'Mangal'\">, और आपूर्ति वोल्टेज V = </span><span style=\"font-weight:bold;font-family:'Mangal'\">220 V</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत शक्ति P = V × I, अतः I = P / V.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I = 11,000 / 220 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 A या 30 A का फ़्यूज़ इस लोड पर पिघल जाएगा, और 100 A का फ़्यूज़ वायरिंग की रक्षा नहीं करेगा, क्योंकि वह सुरक्षित धारा से दोगुनी धारा गुज़रने देगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मुख्य फ़्यूज़ की रेटिंग 50 A होनी चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चिप्स के पैकेटों में नाइट्रोजन जैसी गैस भरी जाती है, ताकि चिप्स का उपचयन न हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कैल्सियम ऑक्साइड जल से तीव्रता से अभिक्रिया करके बुझा हुआ चूना बनाता है और बहुत अधिक ऊष्मा मुक्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. संयोजन अभिक्रिया में एक ही अभिकारक टूटकर दो या अधिक सरल उत्पाद देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. चिप्स में उपस्थित वसा और तेल वायु की ऑक्सीजन से उपचयित होकर विकृतगंधी हो जाते हैं, इसलिए निर्माता पैकेटों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन</span><span style=\"font-family:'Mangal'\"> जैसी गैस भरते हैं, ताकि ऑक्सीजन दूर रहे → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कैल्सियम ऑक्साइड, अर्थात् बिना बुझा चूना, जल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीव्रता</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करके कैल्सियम हाइड्रॉक्साइड, अर्थात् बुझा हुआ चूना, बनाता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत अधिक ऊष्मा</span><span style=\"font-family:'Mangal'\"> मुक्त होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">संयोजन</span><span style=\"font-family:'Mangal'\"> अभिक्रिया में दो या अधिक पदार्थ मिलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही उत्पाद</span><span style=\"font-family:'Mangal'\"> बनाते हैं; जिस अभिक्रिया में एक ही अभिकारक टूटकर सरल उत्पाद देता है, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटन</span><span style=\"font-family:'Mangal'\"> अभिक्रिया है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक तत्व ऑक्सीजन से अभिक्रिया करके ऐसा यौगिक देता है जिसका गलनांक उच्च है और जो जल में घुलनशील भी है। यह तत्व संभवतः है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिलिकॉन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च गलनांक</span><span style=\"font-family:'Mangal'\"> वाला ऑक्साइड आयनिक ठोस होता है, जिसका अर्थ है कि तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">धातु</span><span style=\"font-family:'Mangal'\"> है; कार्बन और सिलिकॉन अधातु हैं, और कार्बन डाइऑक्साइड तो गैस है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश धातु ऑक्साइड जल में अघुलनशील होते हैं, परंतु अत्यधिक क्रियाशील धातुओं के ऑक्साइड </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में घुलकर क्षार बनाते</span><span style=\"font-family:'Mangal'\"> हैं, जैसे सोडियम ऑक्साइड और पोटैशियम ऑक्साइड।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैल्सियम ऐसी ही क्रियाशील धातु है: कैल्सियम ऑक्साइड जल में घुलकर कैल्सियम हाइड्रॉक्साइड देता है, अतः उसका ऑक्साइड </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च गलनांक वाला भी है और घुलनशील भी</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयरन ऑक्साइड का गलनांक उच्च है, परंतु वह जल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अघुलनशील</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह तत्व संभवतः कैल्सियम है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम हाइड्रोजनकार्बोनेट का उपयोग सोडा-अम्ल अग्निशामकों में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. धोने के सोडे का उपयोग काँच, साबुन और कागज़ उद्योगों में किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धोने के सोडे, Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O, में क्रिस्टलन जल नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम हाइड्रोजनकार्बोनेट अम्ल से अभिक्रिया करके कार्बन डाइऑक्साइड देता है, और इसी अभिक्रिया का उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडा-अम्ल अग्निशामकों</span><span style=\"font-family:'Mangal'\"> में होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. धोने के सोडे का उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">काँच, साबुन और कागज़ उद्योगों</span><span style=\"font-family:'Mangal'\"> में, बोरेक्स जैसे सोडियम यौगिकों के निर्माण में और सफ़ाई के साधन के रूप में होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. सूत्र Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O बताता है कि धोने के सोडे की प्रत्येक सूत्र इकाई में </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिस्टलन जल के दस अणु</span><span style=\"font-family:'Mangal'\"> होते हैं; सूखा दिखने पर भी वह वास्तव में सूखा नहीं होता → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के प्रकाश में सिल्वर ब्रोमाइड का सिल्वर और ब्रोमीन में अपघटन किसमें उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल के विद्युत अपघटन में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वेत-श्याम फ़ोटोग्राफ़ी में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीवारों की सफ़ेदी में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिल्वर के शोधन में</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिल्वर ब्रोमाइड भी सिल्वर क्लोराइड की तरह व्यवहार करता है: सूर्य के प्रकाश में वह सिल्वर धातु और ब्रोमीन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटित</span><span style=\"font-family:'Mangal'\"> हो जाता है, और सफ़ेद लवण धूसर पड़ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश</span><span style=\"font-family:'Mangal'\"> द्वारा कराई गई अपघटन अभिक्रिया है, और जहाँ प्रकाश पड़ता है वहाँ सिल्वर लवण का काला पड़ना ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत-श्याम फ़ोटोग्राफ़ी</span><span style=\"font-family:'Mangal'\"> का आधार है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल का विद्युत अपघटन विद्युत द्वारा कराया गया अपघटन है, सफ़ेदी में कैल्सियम हाइड्रॉक्साइड प्रयोग होता है, और सिल्वर का शोधन विद्युत अपघटनी विधि से या विस्थापन से किया जाता है; इनमें से किसी में सिल्वर ब्रोमाइड का उपयोग नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस अभिक्रिया का उपयोग श्वेत-श्याम फ़ोटोग्राफ़ी में किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मानव हृदय के निलयों की पेशीय भित्तियाँ अलिंदों की तुलना में मोटी होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सामान्य प्रकुंचन दाब लगभग 120 mm Hg और सामान्य अनुशिथिलन दाब लगभग 80 mm Hg होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मछली में शरीर के एक चक्र के दौरान रक्त हृदय से दो बार गुज़रता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निलयों को विभिन्न अंगों में रक्त पंप करना होता है, इसलिए उनकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेशीय भित्तियाँ</span><span style=\"font-family:'Mangal'\"> अलिंदों की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी</span><span style=\"font-family:'Mangal'\"> होती हैं, जो केवल रक्त ग्रहण करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. निलय के संकुचन के समय धमनी में रक्त का दाब प्रकुंचन दाब है, जो सामान्यतः लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 mm Hg</span><span style=\"font-family:'Mangal'\"> होता है, और निलय के शिथिलन के समय अनुशिथिलन दाब है, जो सामान्यतः लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 mm Hg</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मछली में शरीर के एक चक्र में रक्त हृदय से केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक बार</span><span style=\"font-family:'Mangal'\"> गुज़रता है; स्तनधारियों और पक्षियों में ही रक्त हृदय से दो बार गुज़रता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सूक्ष्म जीव में वास्तविक केंद्रक नहीं है, उसकी कोशिका के चारों ओर एक दृढ़ आवरण है, और वह बहुत अधिक लवणता तथा तापमान वाले जल में जीवित रहता है। उसे किस जगत में रखा जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटिस्टा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कवक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लांटी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोनेरा</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस जीव में </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक केंद्रक नहीं</span><span style=\"font-family:'Mangal'\"> है, अतः वह प्रोकैरियोट है, और दृढ़ कोशिका आवरण वह कोशिका भित्ति है जो जीवाणुओं में मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मोनेरा</span><span style=\"font-family:'Mangal'\"> जगत में एककोशिकीय प्रोकैरियोट, अर्थात् जीवाणु तथा सायनोबैक्टीरिया, आते हैं, और जीवाणु गर्म जल के झरनों तथा अन्य चरम पर्यावरणों में भी मिलते हैं जहाँ अधिकांश जीव जीवित नहीं रह सकते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटिस्टा</span><span style=\"font-family:'Mangal'\"> में प्रायः वे एककोशिकीय जीव आते हैं जिनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक केंद्रक</span><span style=\"font-family:'Mangal'\"> होता है, अतः बिना केंद्रक वाला जीव प्रोटिस्ट नहीं हो सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कवक</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लांटी</span><span style=\"font-family:'Mangal'\"> वास्तविक केंद्रक वाले यूकैरियोट हैं, और पौधे बहुकोशिकीय स्वपोषी हैं, अतः इनमें से कोई इस वर्णन पर खरा नहीं उतरता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस जीव को मोनेरा जगत में रखा जाना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फेफड़ों की कूपिकाओं को आस्तरित करने वाली एपिथीलियम केवल एक कोशिका मोटी होती है। इसे इतना पतला इसलिए रखा गया है क्योंकि इसे:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फेफड़ों को यांत्रिक चोट से बचाना है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्लेष्मा तथा पाचक एंजाइम स्रावित करने हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपने आर-पार गैसों का शीघ्र विनिमय होने देना है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फेफड़ों को मज़बूती और सहारा देना है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एपिथीलियम ऊतक शरीर की सतहों को ढकता है और उसके आंतरिक अंगों को आस्तरित करता है, और उसकी संरचना उसके काम के अनुसार होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फेफड़ों में ऑक्सीजन और कार्बन डाइऑक्साइड को कूपिकाओं के आस्तर के आर-पार रक्त में जाना और उससे बाहर आना होता है, इसलिए यह एपिथीलियम </span><span style=\"font-weight:bold;font-family:'Mangal'\">पतली, चपटी कोशिकाओं की एक ही परत</span><span style=\"font-family:'Mangal'\"> होती है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">गैसों का शीघ्र विनिमय</span><span style=\"font-family:'Mangal'\"> हो सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चपटी, सटी हुई कोशिकाओं की अनेक परतों वाली एपिथीलियम वहाँ होती है जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुरक्षा</span><span style=\"font-family:'Mangal'\"> चाहिए, जैसे त्वचा और मुख में, और घनाकार या स्तंभाकार कोशिकाएँ उन ग्रंथियों में होती हैं जो पदार्थ </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्रावित</span><span style=\"font-family:'Mangal'\"> करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मज़बूती और सहारा संयोजी ऊतक तथा हड्डी से मिलते हैं, कूपिकाओं की एपिथीलियम से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूपिकाओं की एपिथीलियम इसलिए पतली है कि उसके आर-पार गैसों का शीघ्र विनिमय हो सके </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव प्रजनन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. शुक्राशय तथा प्रोस्टेट जैसी ग्रंथियाँ ऐसे द्रव मिलाती हैं जो शुक्राणुओं को पोषण देते हैं और उन्हें सक्रिय बनाए रखने में सहायक होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रत्येक शुक्राणु में आनुवंशिक पदार्थ वाला एक सिर और एक लंबी पूँछ होती है, जो उसे अंडाणु की ओर तैरने में सहायता करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रत्येक स्त्री में अंडोत्सर्जन सदैव मासिक चक्र के 14वें दिन ही होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. शुक्राणुओं के मार्ग में </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुक्राशय तथा प्रोस्टेट</span><span style=\"font-family:'Mangal'\"> जैसी ग्रंथियाँ अपने द्रव मिलाती हैं, जो शुक्राणुओं को पोषण देते हैं और उन्हें सक्रिय तथा गतिशील बनाए रखने में सहायक होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. शुक्राणु एक छोटी-सी कोशिका है जिसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">आनुवंशिक पदार्थ वाला सिर</span><span style=\"font-family:'Mangal'\"> और एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी पूँछ</span><span style=\"font-family:'Mangal'\"> होती है, जो उसे अंडाणु की ओर तैरने में सहायता करती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मासिक चक्र की अवधि स्त्री-स्त्री में भिन्न होती है, प्रायः 21 से 35 दिन के बीच, अतः अंडोत्सर्जन का दिन भी भिन्न होता है; वह सबके लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">14वें दिन पर निश्चित नहीं</span><span style=\"font-family:'Mangal'\"> है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 cm फोकस दूरी वाले अवतल दर्पण से 30 cm की दूरी पर एक वस्तु रखी है। दर्पण सूत्र का प्रयोग करने पर प्रतिबिंब दूरी क्या होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−40 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−2.5 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−12 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−60 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई कार्तीय चिह्न परिपाटी के अनुसार दर्पण का ध्रुव मूल बिंदु है, और आपतित प्रकाश की दिशा के विपरीत मापी गई दूरियाँ ऋणात्मक होती हैं, अतः u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\"> तथा अवतल दर्पण के लिए f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण सूत्र: 1/v + 1/u = 1/f</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = 1/f − 1/u = (−1/20) − (−1/30)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/v = (−3 + 2) / 60 = −1/60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−60 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋण चिह्न बताता है कि प्रतिबिंब वास्तविक है और दर्पण के सामने, वस्तु की ओर ही बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दूरी −60 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्त के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. रक्त के कुल आयतन का लगभग 55 प्रतिशत भाग प्लाज़्मा होता है।</span></p><p style=\"margin-top:0pt;margin-b nt-family:'Mangal'\">3. लाल रक्त कोशिकाएँ केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग चार महीने</span><span style=\"font-family:'Mangal'\"> जीवित रहती हैं, चार वर्ष नहीं, और नियमित रूप से बदली जाती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फ़ेट के एक अशुद्ध नमूने को क्रिस्टलीकरण द्वारा शुद्ध किया जाता है। यह विधि इसलिए काम करती है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फ़ेट गर्म करने पर ऊर्ध्वपातित हो जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फ़ेट जल में अघुलनशील है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अशुद्धियाँ भारी होती हैं और नीचे बैठ जाती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फ़ेट की विलेयता तापमान के साथ बदलती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस्टलीकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतृप्त विलयन</span><span style=\"font-family:'Mangal'\"> से क्रिस्टल बनाने का प्रक्रम है, और यह किसी ठोस को शुद्ध करने की एक सामान्य विधि है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अशुद्ध कॉपर सल्फ़ेट को गर्म जल में घोलकर संतृप्त विलयन बनाया जाता है, गर्म विलयन को छाना जाता है, और निस्यंद को ठंडा होने दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फ़ेट </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठंडे जल में गर्म जल की तुलना में बहुत कम घुलता</span><span style=\"font-family:'Mangal'\"> है, अतः ठंडा होने पर शुद्ध कॉपर सल्फ़ेट क्रिस्टलों के रूप में अलग हो जाता है, जबकि थोड़ी-सी अशुद्धियाँ घुली रह जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार क्रिस्टलीकरण द्वारा शुद्धिकरण का सिद्धांत </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न तापमानों पर किसी पदार्थ की विलेयता में अंतर</span><span style=\"font-family:'Mangal'\"> है; इस विधि का ऊर्ध्वपातन, अघुलनशीलता या भारी अशुद्धियों के बैठने से कोई संबंध नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह विधि इसलिए काम करती है क्योंकि कॉपर सल्फ़ेट की विलेयता तापमान के साथ बदलती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): जिस स्कूटर के स्पीडोमीटर की रीडिंग अचर बनी रहे, वह फिर भी त्वरित हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): किसी वस्तु का त्वरण तब-तब अशून्य होता है जब-जब उसका वेग परिमाण में, दिशा में या दोनों में बदलता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पीडोमीटर केवल वेग का </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिमाण</span><span style=\"font-family:'Mangal'\">, अर्थात् चाल, दिखाता है, उसकी दिशा नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्वरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">वेग</span><span style=\"font-family:'Mangal'\"> के परिवर्तन की दर है, और वेग में परिमाण तथा दिशा दोनों होते हैं; इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">जब भी वेग परिमाण में, दिशा में या दोनों में बदले</span><span style=\"font-family:'Mangal'\">, त्वरण अशून्य होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब स्कूटर उसी चाल से मोड़ पर घूमता है, तब उसके वेग की दिशा लगातार बदलती है, अतः स्पीडोमीटर की रीडिंग अचर रहने पर भी वह त्वरित होता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिशा का यही परिवर्तन, जो R में बताया गया है, स्कूटर को त्वरित करता है, अतः R से A की व्याख्या होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अंग वृद्धि हार्मोन मोचक कारक स्रावित करता है, जो पीयूष ग्रंथि को वृद्धि हार्मोन मुक्त करने के लिए उद्दीपित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिवृक्क ग्रंथियाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्न्याशय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइपोथैलेमस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थाइमस</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हार्मोन अंतःस्रावी तंत्र के रासायनिक संदेशवाहक हैं, और यह तंत्र तंत्रिका तंत्र के अतिरिक्त शरीर में नियंत्रण और समन्वय का दूसरा तरीका है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्तिष्क का भाग </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइपोथैलेमस</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोचक हार्मोन</span><span style=\"font-family:'Mangal'\"> स्रावित करता है, और ये मोचक हार्मोन </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीयूष ग्रंथि</span><span style=\"font-family:'Mangal'\"> को उसके हार्मोन, जिनमें वृद्धि हार्मोन भी है, मुक्त करने के लिए उद्दीपित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिवृक्क ग्रंथियाँ ऐड्रिनलीन स्रावित करती हैं, अग्न्याशय इंसुलिन स्रावित करता है, और थाइमस प्रतिरक्षा से संबंधित है; इनमें से कोई भी पीयूष ग्रंथि को इस प्रकार नियंत्रित नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अंग हाइपोथैलेमस है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,400 पर 2.5% प्रति माह की ब्याज दर से 8 महीने का साधारण ब्याज ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹600</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹240</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹480</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर प्रति माह दी गई है, अतः समय वर्षों में नहीं, महीनों में लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ P = ₹2,400, R = 2.5% प्रति माह तथा T = 8 माह है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 माह का ब्याज = ₹2,400 का 2.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹2,400 × 2.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 माह का ब्याज = ₹60 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹480</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2,400 × 2.5 × 8) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹480</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साधारण ब्याज </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹480 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राहुल हर 6 दिन में, प्रिया हर 8 दिन में और अमित हर 12 दिन में पुस्तकालय जाता है। यदि तीनों आज पुस्तकालय में मिलते हैं, तो कितने दिनों के बाद वे तीनों वहाँ फिर से मिलेंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 दिन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राहुल 6 के गुणज वाले दिनों में, प्रिया 8 के गुणज वाले दिनों में और अमित 12 के गुणज वाले दिनों में पुस्तकालय में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों एक साथ उस दिन होंगे जो 6, 8 और 12 का उभयनिष्ठ गुणज हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा पहला दिन 6, 8 और 12 का LCM (लघुत्तम समापवर्त्य) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 = 2 × 3, 8 = 2 × 2 × 2 तथा 12 = 2 × 2 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2 × 2 × 2 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 24 / 6 = 4, 24 / 8 = 3 तथा 24 / 12 = 2, तीनों पूर्ण संख्याएँ हैं, और 8 तथा 12 दोनों के लिए इससे छोटी कोई संख्या काम नहीं करती ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वे तीनों </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 दिन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बाद फिर मिलेंगे।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6, 9 और 10 के चतुर्थानुपाती तथा 8 और 18 के मध्यानुपाती का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 6</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों राशियों को एक-एक करके ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6, 9 और 10 का चतुर्थानुपाती वह संख्या d है जिसके लिए 6 : 9 = 10 : d हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × d = 9 × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 90 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 और 18 का मध्यानुपाती वह संख्या m है जिसके लिए 8 : m = m : 18 हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m² = 8 × 18 = 144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m = √144 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट अनुपात = 15 : 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पदों में 3 का भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 : 4 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब किसी संख्या का 30%, 84 में जोड़ा जाता है, तो परिणाम वही संख्या प्राप्त होती है। उस संख्या का 45% कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना संख्या x है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x का 30% + 84 = x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 = x − x का 30%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 = x का 70%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 84 / 70%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (84 / 70) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 का 45% = 120 × 45%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 120 का 30% = 36, और 36 + 84 = 120 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संख्या का 45% </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108 km/h की चाल से चल रही एक रेलगाड़ी एक पुल को 40 सेकंड में पार करती है। पहली रेलगाड़ी से 100 m लंबी एक दूसरी रेलगाड़ी उसी पुल को 72 km/h की चाल से पार करती है। दूसरी रेलगाड़ी को पुल पार करने में कितना समय लगता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 सेकंड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70 सेकंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75 सेकंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">65 सेकंड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना पहली रेलगाड़ी की लंबाई = L m तथा पुल की लंबाई = B m है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुल पार करने में रेलगाड़ी </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपनी लंबाई + पुल की लंबाई</span><span style=\"font-family:'Mangal'\"> के बराबर दूरी तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली रेलगाड़ी की चाल = 108 km/h = 108 × (5/18) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी = चाल × समय</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L + B = 30 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी रेलगाड़ी की लंबाई = L + 100 (पहली से 100 m अधिक)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी रेलगाड़ी द्वारा तय दूरी = (L + 100) + B = (L + B) + 100 = 1,200 + 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,300 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी रेलगाड़ी की चाल = 72 km/h = 72 × (5/18) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = दूरी / चाल = 1,300 / 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">65 सेकंड</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरी रेलगाड़ी को पुल पार करने में </span><span style=\"font-weight:bold;font-family:'Mangal'\">65 सेकंड (विकल्प D)</span><span style=\"font-family:'Mangal'\"> लगते हैं।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P आयत ABCD के अंदर एक बिंदु है। यदि PA = 10 cm, PB = 2 cm तथा PC = 5 cm है, तो PD की लंबाई क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P से होकर आयत की भुजाओं के समांतर रेखाएँ खींचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना P की भुजाओं AB, BC, CD और DA से दूरियाँ क्रमशः p, q, r और s हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P से प्रत्येक शीर्ष की दूरी एक समकोण त्रिभुज का कर्ण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PA² = s² + p², PB² = q² + p², PC² = q² + r² तथा PD² = s² + r²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सम्मुख शीर्षों की दूरियों को जोड़ने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PA² + PC² = p² + q² + r² + s² = PB² + PD²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आयत के अंदर किसी भी बिंदु के लिए PA² + PC² = PB² + PD² होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10² + 5² = 2² + PD²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 + 25 = 4 + PD²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PD² = 125 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">121</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PD = √121 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः PD की लंबाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 cm (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,999.9 + 999.99 + 99.999 का मान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11,109.889</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11,099.889</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,999.889</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11,099.989</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक संख्या किसी पूर्ण संख्या से थोड़ी-सी कम है, अतः उसे उसी रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,999.9 = 10,000 − 0.1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">999.99 = 1,000 − 0.01</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">99.999 = 100 − 0.001</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्ण संख्याओं और छोटे भागों को अलग-अलग जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्ण संख्याएँ: 10,000 + 1,000 + 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11,100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे भाग: 0.1 + 0.01 + 0.001 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.111</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान = 11,100 − 0.111 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11,099.889</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">11,099.889 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पार्किंग स्थल में केवल कारें और मोटरसाइकिलें हैं। कुल 30 वाहन हैं और पहियों की कुल संख्या 96 है। वहाँ कितनी कारें हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना कारों की संख्या c तथा मोटरसाइकिलों की संख्या m है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाहनों की गिनती से: c + m = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहियों की गिनती से: एक कार में 4 और एक मोटरसाइकिल में 2 पहिए होते हैं, अतः 4c + 2m = 96</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समीकरण को 2 से भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2c + m = 48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें से पहला समीकरण घटाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(2c + m) − (c + m) = 48 − 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">c = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब m = 30 − 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: (4 × 18) + (2 × 12) = 72 + 24 = 96 पहिए ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: यदि सभी 30 वाहन मोटरसाइकिल होते तो 60 पहिए होते; अतिरिक्त 96 − 60 = 36 पहिए कारों से आते हैं, प्रत्येक कार से 2 अतिरिक्त पहिए</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 36 / 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 18 कारें</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कारों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है 7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.4</span><span style=\"font-family:'Mangal'\"> = x, 7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.9</span><span style=\"font-family:'Mangal'\"> = y तथा x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = y</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">, तो z का मान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14.4</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = y</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> के दोनों पक्षों को 7 की घात के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = (7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.4</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = 7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.4z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> = (7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.9</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> = 7</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">7.2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आधार समान हैं, अतः घातांक बराबर होने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.4z = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">z = 7.2 / 0.4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: (a</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">m</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = (a</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">n</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">k</span><span style=\"font-family:'Mangal'\"> से z = (n × k) / m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (0.9 × 8) / 0.4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः z का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A एक कार्य को 10 दिन में और B उसे 15 दिन में कर सकता है। वे 3 दिन एक साथ कार्य करते हैं, जिसके बाद A चला जाता है। तब C, B के साथ जुड़ जाता है और B तथा C मिलकर शेष कार्य 5 दिन में पूरा कर देते हैं। C अकेला पूरा कार्य कितने दिनों में कर सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 दिन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले ज्ञात करें कि A के जाने पर कितना कार्य शेष है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B द्वारा 1 दिन में किया गया कार्य = 1/10 + 1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 + 2) / 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 दिन में किया गया कार्य = 3 × (1/6) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष कार्य = 1 − 1/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और C इस 1/2 कार्य को 5 दिन में पूरा करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और C द्वारा 1 दिन में किया गया कार्य = (1/2) / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B अकेला एक दिन में 1/15 कार्य करता है, अतः दैनिक कार्य में C का भाग = 1/10 − 1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 − 2) / 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः C अकेला पूरा कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 दिन</span><span style=\"font-family:'Mangal'\"> में करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: B और C 5 दिन में 5 × (1/15 + 1/30) = 5 × (3/30) = 1/2 कार्य करते हैं ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः C अकेला यह कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 दिन (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में कर सकता है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धनराशि पर वार्षिक रूप से संयोजित चक्रवृद्धि ब्याज पहले वर्ष के लिए ₹1,200 तथा दूसरे वर्ष के लिए ₹1,296 है। धनराशि कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹16,200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,400</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चक्रवृद्धि ब्याज में दूसरे वर्ष का ब्याज, मूलधन और पहले वर्ष के ब्याज दोनों पर मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरे वर्ष का अतिरिक्त ब्याज, ₹1,200 पर एक वर्ष का ब्याज है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतिरिक्त ब्याज = ₹1,296 − ₹1,200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹96</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर = (96 / 1,200) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8%</span><span style=\"font-family:'Mangal'\"> वार्षिक</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले वर्ष का ब्याज धनराशि का 8% है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनराशि का 8% = ₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनराशि = (1,200 / 8) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ₹15,000 का 8% = ₹1,200; दूसरे वर्ष: ₹16,200 का 8% = ₹1,296 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छह अंकों की संख्या 63X4Y0, 4, 9 और 10 से विभाज्य है। यदि Y सबसे छोटा संभव अंक है, तो X + Y का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभाज्यता के नियमों को एक-एक करके लगाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 से विभाज्य: अंतिम अंक 0 होना चाहिए, जो पहले से ही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 से विभाज्य: अंतिम दो अंकों से बनी संख्या Y0, 4 से विभा
