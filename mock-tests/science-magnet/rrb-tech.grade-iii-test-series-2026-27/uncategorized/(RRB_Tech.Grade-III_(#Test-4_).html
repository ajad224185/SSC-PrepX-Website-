", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साँस अंदर लेने पर हम </span><span style=\"font-weight:bold;font-family:'Mangal'\">पसलियों को ऊपर उठाते</span><span style=\"font-family:'Mangal'\"> हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">डायाफ्राम को चपटा</span><span style=\"font-family:'Mangal'\"> करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">वक्ष गुहा बड़ी</span><span style=\"font-family:'Mangal'\"> हो जाती है, अतः वायु </span><span style=\"font-weight:bold;font-family:'Mangal'\">फेफड़ों में खिंच</span><span style=\"font-family:'Mangal'\"> जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायु </span><span style=\"font-weight:bold;font-family:'Mangal'\">कूपिकाओं</span><span style=\"font-family:'Mangal'\"> को भरती है, जो सबसे छोटी वायु नलिकाओं के सिरों पर गुब्बारे जैसी संरचनाएँ हैं और जिनकी भित्तियों में गैस विनिमय के लिए रक्त वाहिकाओं का सघन जाल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही क्रम है पसलियाँ ऊपर और डायाफ्राम चपटा → बड़ी वक्ष गुहा → वायु अंदर खिंचती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): फर्श पर रखे एक भारी बक्से को धीरे से धकेलने पर वह हिलता नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): बक्से और फर्श के बीच घर्षण बल लगाए गए बल को संतुलित कर देता है, इसलिए बक्से पर नेट बल शून्य होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बक्से को धकेलने पर उसकी निचली सतह और फर्श के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण बल</span><span style=\"font-family:'Mangal'\"> उत्पन्न होता है, जो लगाए गए बल के </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> दिशा में लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हल्के धक्के पर घर्षण परिमाण में धक्के के बराबर होता है → दोनों बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलित</span><span style=\"font-family:'Mangal'\"> हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेट बल शून्य</span><span style=\"font-family:'Mangal'\"> है → बक्सा विराम में रहता है → A सत्य है, और R यही कारण सही बताता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बक्सा तभी चलना शुरू करता है जब लगाया गया बल घर्षण बल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> हो जाए, ताकि गति की दिशा में नेट बल लगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किस लचीली, छड़ के आकार की संरचना की उपस्थिति या अनुपस्थिति जंतुओं को अकशेरुकी (नॉन-कॉर्डेटा) और कॉर्डेटा में वर्गीकृत करने का प्रमुख आधार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नोटोकॉर्ड (पृष्ठरज्जु)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कशेरुक दंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाह्य कंकाल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">देहगुहा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नोटोकॉर्ड (पृष्ठरज्जु)</span><span style=\"font-family:'Mangal'\"> एक लचीली, छड़ के आकार की संरचना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नोटोकॉर्ड की अनुपस्थिति या उपस्थिति के आधार पर जंतुओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">नॉन-कॉर्डेटा (अकशेरुकी)</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉर्डेटा</span><span style=\"font-family:'Mangal'\"> में वर्गीकृत किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉर्डेटा को आगे </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटोकॉर्डेटा</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्टिब्रेटा</span><span style=\"font-family:'Mangal'\"> में बाँटा जाता है; कुछ कॉर्डेटों में नोटोकॉर्ड कशेरुक दंड का पूर्ववर्ती होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संरचना नोटोकॉर्ड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सांद्र अम्ल को तनु करते समय अम्ल को धीरे-धीरे जल में मिलाना चाहिए, जल को अम्ल में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): अम्ल का जल में घुलना अत्यधिक ऊष्माक्षेपी है; सांद्र अम्ल में जल मिलाने पर मिश्रण उबलकर बाहर छलक सकता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल का जल से मिलना </span><span style=\"font-weight:bold;font-family:'Mangal'\">अत्यधिक ऊष्माक्षेपी</span><span style=\"font-family:'Mangal'\"> है (बहुत ऊष्मा निकलती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि सांद्र अम्ल में जल मिलाया जाए, तो उत्पन्न ऊष्मा से मिश्रण </span><span style=\"font-weight:bold;font-family:'Mangal'\">छलककर बाहर</span><span style=\"font-family:'Mangal'\"> आ सकता है और जलन हो सकती है → इसलिए अम्ल को सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीरे-धीरे जल में</span><span style=\"font-family:'Mangal'\">, लगातार हिलाते हुए मिलाया जाता है → A सत्य है और R इसका कारण बताता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तनुकरण से प्रति इकाई आयतन H₃O⁺ आयनों की सांद्रता भी घटती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक हॉल में परावर्तित ध्वनि श्रोता तक मूल ध्वनि के 0.05 s बाद पहुँचती है। श्रोता अनुभव करता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक स्पष्ट प्रतिध्वनि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई ध्वनि नहीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुरणन, क्योंकि अंतराल अलग प्रतिध्वनि सुनने के लिए आवश्यक 0.1 s से कम है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोनिक बूम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो ध्वनियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग-अलग (प्रतिध्वनि)</span><span style=\"font-family:'Mangal'\"> तभी सुनाई देती हैं जब वे कान तक कम से कम </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.1 s</span><span style=\"font-family:'Mangal'\"> के अंतर से पहुँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">0.05 s से कम</span><span style=\"font-family:'Mangal'\"> के समय-अंतर से आने वाले परावर्तन मूल ध्वनि में मिलकर उसे बनाए रखते हैं; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुरणन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ अंतराल 0.05 s (&lt; 0.1 s) है, इसलिए अलग प्रतिध्वनि नहीं सुनाई देती — ध्वनि बनी रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः श्रोता अनुरणन का अनुभव करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): परासरण, विसरण की एक विशेष स्थिति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): परासरण चयनात्मक पारगम्य झिल्ली के आर-पार जल का विसरण है, जबकि सामान्य विसरण कणों का अधिक सांद्रता से कम सांद्रता की ओर शुद्ध गमन है और यह झिल्ली के बिना भी होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">विसरण</span><span style=\"font-family:'Mangal'\"> कणों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक सांद्रता से कम सांद्रता</span><span style=\"font-family:'Mangal'\"> की ओर शुद्ध गमन है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">झिल्ली के बिना भी</span><span style=\"font-family:'Mangal'\"> होता है → R (दूसरा भाग) सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परासरण</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">चयनात्मक पारगम्य झिल्ली</span><span style=\"font-family:'Mangal'\"> (जो कुछ पदार्थों को जाने देती है और कुछ को रोकती है) के आर-पार </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल</span><span style=\"font-family:'Mangal'\"> का विसरण है → R (पहला भाग) सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि परासरण ऐसी झिल्ली से केवल जल का विसरण है, यह विसरण की एक विशेष स्थिति है → A सत्य है, और R ठीक यही कारण बताता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार का वेग-समय ग्राफ समय अक्ष के समांतर एक सीधी रेखा है। यह कार की गति के विषय में क्या दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार नियत वेग से चलती है और उसका त्वरण शून्य है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार विरामावस्था में है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार नियत त्वरण से चलती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार का वेग एकसमान रूप से घट रहा है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग-समय ग्राफ दर्शाता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">वेग</span><span style=\"font-family:'Mangal'\"> समय के साथ कैसे बदलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">समय अक्ष के समांतर</span><span style=\"font-family:'Mangal'\"> रेखा का अर्थ है कि वेग का </span><span style=\"font-weight:bold;font-family:'Mangal'\">हर क्षण समान मान</span><span style=\"font-family:'Mangal'\"> है → नियत वेग।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि वेग नहीं बदलता, </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वरण शून्य</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ऊपर की ओर झुकी रेखा का अर्थ नियत त्वरण से बढ़ता वेग होता; \"विरामावस्था\" v = 0 पर समय अक्ष के साथ की रेखा होती।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कार नियत वेग से चलती है और त्वरण शून्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम (2, 8, 1) एक इलेक्ट्रॉन खोकर Na⁺ बनाता है और क्लोरीन (2, 8, 7) वह इलेक्ट्रॉन प्राप्त करके Cl⁻ बनाती है। इस प्रकार धातु से अधातु में इलेक्ट्रॉनों के स्थानांतरण से बने यौगिक कहलाते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक यौगिक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक (वैद्युत संयोजक) यौगिक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धात्विक यौगिक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपसहसंयोजक यौगिक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Na (2, 8, 1) एक इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">खोता</span><span style=\"font-family:'Mangal'\"> है → Na⁺ (2, 8); Cl (2, 8, 7) एक इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राप्त</span><span style=\"font-family:'Mangal'\"> करता है → Cl⁻ (2, 8, 8).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विपरीत आवेशित आयन एक-दूसरे को आकर्षित करके सोडियम क्लोराइड बनाते हैं।</sp 'Mangal'\">मनुष्यों में रक्त परिसंचरण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) प्रकुंचन दाब निलय के संकुचन के समय धमनी के अंदर रक्त का दाब है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) रक्त दाब धमनियों की तुलना में शिराओं में बहुत अधिक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) शिराएँ विभिन्न अंगों से रक्त एकत्र करके उसे वापस हृदय तक लाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकुंचन दाब</span><span style=\"font-family:'Mangal'\"> = निलय के </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकुंचन (संकुचन)</span><span style=\"font-family:'Mangal'\"> के समय धमनी में दाब; अनुशिथिलन दाब शिथिलन के समय → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) रक्त दाब </span><span style=\"font-weight:bold;font-family:'Mangal'\">धमनियों में शिराओं की तुलना में बहुत अधिक</span><span style=\"font-family:'Mangal'\"> होता है, उल्टा नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">शिराएँ</span><span style=\"font-family:'Mangal'\"> अंगों से रक्त एकत्र करके उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">वापस हृदय</span><span style=\"font-family:'Mangal'\"> तक लाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (iii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे सूक्ष्मजीव जो जीवों के मृत अवशेषों और अपशिष्ट पदार्थों को सरल अकार्बनिक पदार्थों में तोड़ देते हैं, जो मिट्टी में जाकर पादपों द्वारा पुनः उपयोग किए जाते हैं, कहलाते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्पादक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शाकाहारी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपघटक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मांसाहारी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जीवों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">मृत अवशेषों और अपशिष्ट पदार्थों</span><span style=\"font-family:'Mangal'\"> को तोड़ने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवाणु और कवक</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटक</span><span style=\"font-family:'Mangal'\"> कहलाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये जटिल कार्बनिक पदार्थों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरल अकार्बनिक पदार्थों</span><span style=\"font-family:'Mangal'\"> में बदलते हैं, जो मिट्टी में लौटकर पादपों द्वारा पुनः उपयोग होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊर्जा स्वपोषी (उत्पादक) से विषमपोषी और अपघटकों तक प्रवाहित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे सूक्ष्मजीव अपघटक हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंद्रधनुष के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) यह वायुमंडल में उपस्थित जल की सूक्ष्म बूँदों द्वारा सूर्य के प्रकाश के विक्षेपण से बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) यह सदैव सूर्य की विपरीत दिशा में बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) प्रत्येक बूँद सूर्य के प्रकाश का अपवर्तन और विक्षेपण करती है, उसे आंतरिक रूप से परावर्तित करती है, और बाहर निकलते समय पुनः अपवर्तित करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) इंद्रधनुष वर्षा के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल की बूँदों द्वारा सूर्य के प्रकाश के विक्षेपण</span><span style=\"font-family:'Mangal'\"> से बना प्राकृतिक स्पेक्ट्रम है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) यह सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूर्य की विपरीत दिशा</span><span style=\"font-family:'Mangal'\"> में दिखता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) बूँदें छोटे प्रिज़्म की तरह कार्य करती हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपवर्तन और विक्षेपण</span><span style=\"font-family:'Mangal'\">, फिर </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंतरिक परावर्तन</span><span style=\"font-family:'Mangal'\">, फिर बूँद से निकलते समय पुनः </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपवर्तन</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओम के नियम के अनुसार, किसी धात्विक तार के सिरों के बीच विभवांतर उसमें प्रवाहित धारा के समानुपाती होता है, बशर्ते कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार की लंबाई बदलती रहे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार का तापमान समान बना रहे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार विद्युतरोधी पदार्थ का बना हो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा प्रत्यावर्ती हो</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ओम का नियम</span><span style=\"font-family:'Mangal'\"> (जॉर्ज साइमन ओम, 1827): V ∝ I, अर्थात् V/I = नियतांक = R, या </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = IR</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह नियम </span><span style=\"font-weight:bold;font-family:'Mangal'\">तार का तापमान समान रहने पर</span><span style=\"font-family:'Mangal'\"> लागू होता है, क्योंकि प्रतिरोध तापमान के साथ बदलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शर्त यह है कि तापमान नियत रहे </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ मग बकरियाँ हैं। सभी बकरियाँ वर्ग हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ मग वर्ग हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ वर्ग बकरियाँ हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: बकरियों का वृत्त वर्गों के अंदर है, और मगों का वृत्त बकरियों को काटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ मग वर्ग हैं → जो मग बकरियाँ हैं वे वर्गों के अंदर हैं, अतः कुछ मग निश्चित रूप से वर्ग हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ वर्ग बकरियाँ हैं → सभी बकरियाँ वर्ग हैं, अतः जो बकरियाँ हैं वे वर्ग हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B का अर्थ है कि ‘A, B की बहन है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘M + T ÷ K @ D # Z’ है, तो M का Z से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी का पिता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A, B की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: M + T ÷ K @ D # Z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M + T → M, T का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T ÷ K → T, K का पिता है। इसलिए M और K के माता-पिता समान हैं, अर्थात् M, K का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K @ D → K, D की बहन है। K और D बहनें हैं, अतः उनके माता-पिता समान हैं। इसलिए T, D का भी पिता है और M, D का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D # Z → D, Z की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः M, D का भाई है और D, Z की पत्नी है → M, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z की पत्नी का भाई (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘A’ का अर्थ ‘÷’, ‘B’ का अर्थ ‘×’, ‘C’ का अर्थ ‘+’ और ‘D’ का अर्थ ‘−’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75 A 3 D 14 C 9 B 4 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">47</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों को बदलें: 75 ÷ 3 − 14 + 9 × 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (पहले ÷ और ×): 75 ÷ 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\">; 9 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 25 − 14 + 36 = 11 + 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">47</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">47 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " < 3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DG 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OG 8</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QP 5 → TL −6: Q + 3 = T, P − 4 = L, 5 − 11 = −6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HG 9 → KC −2: H + 3 = K, G − 4 = C, 9 − 11 = −2 → पैटर्न: अक्षरों पर (+3, −4) और संख्या पर −11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LK 19 पर लागू करें: L + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, K − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, 19 − 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः LK 19, </span><span style=\"font-weight:bold;font-family:'Mangal'\">OG 8 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला क्रम के आधार पर, निम्नलिखित चार में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KMP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QSU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HJL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACE</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह में क्रमागत अक्षरों का अंतर देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KMP: K(11) → M(13) → P(16): </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, +3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QSU: Q(17) → S(19) → U(21): +2, +2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HJL: H(8) → J(10) → L(12): +2, +2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ACE: A(1) → C(3) → E(5): +2, +2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह +2, +2 का पालन करते हैं; KMP +2, +3 का।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">KMP (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B, C, P, S, T और U एक सीधी पंक्ति में उत्तर की ओर मुख करके बैठे हैं। S के बाईं ओर केवल तीन व्यक्ति बैठे हैं। A के दाईं ओर केवल B बैठा है। A और C के बीच केवल दो व्यक्ति बैठे हैं। P, T के बाईं ओर किसी स्थान पर परंतु U के दाईं ओर किसी स्थान पर बैठा है। U और T के बीच क t;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह −2, −3 का पालन करते हैं; YWS −2, −4 का।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">YWS (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B की पुत्री है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A - B का अर्थ है कि ‘A, B का भाई है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A x B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘E - F + G x H ÷ K’ है, तो E का K से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A - B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A x B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: E - F + G x H ÷ K</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E - F → E, F का भाई है। E और F भाई-बहन हैं, अतः उनके माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F + G → F, G की पुत्री है। इसलिए E और F दोनों G की संतान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G x H → G, H की पत्नी है। G और H पति-पत्नी हैं, इसलिए H, E और F दोनों का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H ÷ K → H, K का पिता है। इसलिए E, F और K तीनों H की संतान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः E, H का पुत्र है और K भी H की संतान है → E, </span><span style=\"font-weight:bold;font-family:'Mangal'\">K का भाई (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात बक्से A, B, C, D, E, F और G एक के ऊपर एक रखे हैं, परंतु आवश्यक नहीं कि इसी क्रम में हों। C ऊपर से तीसरे स्थान पर है। C और F के बीच केवल दो बक्से हैं। E, F के ठीक ऊपर रखा है। B, D के ठीक नीचे रखा है। A सबसे नीचे नहीं रखा है। नीचे से चौथा बक्सा कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों को 1 (ऊपर) से 7 (नीचे) तक क्रमांक दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C ऊपर से तीसरा → C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C और F के बीच दो बक्से → F = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> (स्थान 0 नहीं होता).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, F के ठीक ऊपर → E = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, D के ठीक नीचे → एकमात्र खाली सटी जोड़ी 1 और 2 है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 1, B = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सबसे नीचे नहीं → A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, और G स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (ऊपर → नीचे): </span><span style=\"font-weight:bold;font-family:'Mangal'\">D – B – C – A – E – F – G</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे से चौथा = स्थान 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बक्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> नीचे से चौथा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रश्न नीचे दी गई पाँच तीन-अंकीय संख्याओं पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) 642 685 327 314 671 (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(उदाहरण: 697 – पहला अंक = 6, दूसरा अंक = 9 और तीसरा अंक = 7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि सबसे बड़ी संख्या के दूसरे अंक को सबसे छोटी संख्या के दूसरे अंक में जोड़ा जाए, तो परिणाम क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p> ng": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में ‘book is published’ को ‘cw ku qr’ और ‘book was interesting’ को ‘ot qr zx’ लिखा जाता है। उस भाषा में ‘book’ को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ot</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">qr</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cw</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ku</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों वाक्यों में केवल एक शब्द उभयनिष्ठ है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">book</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों कूट वाक्यों में केवल एक कूट उभयनिष्ठ है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">qr</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उभयनिष्ठ शब्द का कूट उभयनिष्ठ कूट होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘book’ का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">qr (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दि  style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्षों के लिए CI − SI = P × (R/100)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,000 × (R/100)² = 64 → (R/100)² = 64 ÷ 10,000 = 0.0064</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R/100 = 0.08 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: SI = (10,000 × 8 × 2) / 100 = ₹1,600; CI = 10,000 × (1.08)² − 10,000 = ₹1,664; अंतर = ₹64 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 12.8 : x :: x : 3.2 और x &gt; 0 है, तो x का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5.6</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सतत समानुपात a : x :: x : b में मध्य पद x² = a × b को संतुष्ट करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² = 12.8 × 3.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40.96</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = √40.96 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.4</span><span style=\"font-family:'Mangal'\"> (x &gt; 0 लेते हुए)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.4 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यापारी एक उत्पाद का अंकित मूल्य ₹2,000 रखता है। वह ग्राहक को 20% और 10% की दो क्रमिक छूट देता है। एकल समतुल्य छूट प्रतिशत और उत्पाद का विक्रय मूल्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%, ₹1,740</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%, ₹1,540</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%, ₹1,640</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28%, ₹1,440</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली छूट के बाद मूल्य = ₹2,000 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी छूट के बाद मूल्य = ₹1,600 × 90% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल छूट = 2,000 − 1,440 = ₹560 → 560 ÷ 2,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: एकल समतुल्य छूट = 20 + 10 − (20 × 10 ÷ 100) = 28%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समतुल्य छूट 28% और विक्रय मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,440 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित मदों से माध्य की गणना कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">172, 148, 160, 181, 189</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">172</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">170</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">174</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्य = मदों का योग ÷ मदों की संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योग = 172 + 148 + 160 + 181 + 189 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">850</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्य = 850 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">170</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः माध्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">170 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो घंटियाँ क्रमशः 12 मिनट और 18 मिनट के अंतराल पर बजती हैं। यदि वे सुबह 9:00 बजे एक साथ बजती हैं, तो कितने मिनट बाद वे फिर एक साथ बजेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 मिनट</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे उस समय के बाद फिर एक साथ बजेंगी जो 12 और 18 दोनों का गुणज हो → 12 और 18 का </span><span style=\"font-weight:bold;font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 = 2² × 3 और 18 = 2 × 3² → LCM = 2² × 3² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 मिनट</span><span style=\"font-family:'Mangal'\"> बाद (सुबह 9:36 बजे) फिर एक साथ बजेंगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 मिनट (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है कि 5^0.3 = x और 5^0.9 = y, तथा x^z = y² है, तो z का मान है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = (5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.3</span><span style=\"font-family:'Mangal'\">)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">z</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">0.3z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y² = (5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">0.9</span><span style=\"font-family:'Mangal'\">)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">1.8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आधार समान → घात समान: 0.3z = 1.8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">z = 1.8 / 0.3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः z = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक आने-जाने की यात्रा में एक व्यक्ति किसी स्थान तक 5 km/h की चाल से जाता है और 3 km/h की चाल से लौटता है। औसत चाल के विषय में कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल 3 km/h है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल 5 km/h है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल 5 km/h और 3 km/h के समांतर माध्य से कम होगी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत चाल 5 km/h और 3 km/h के समांतर माध्य के बराबर है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान दूरियों के लिए चाल x और y पर औसत चाल = 2xy ÷ (x + y).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 5 × 3 ÷ (5 + 3) = 30 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.75 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालों का समांतर माध्य = (5 + 3) ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.75 &lt; 4 → औसत चाल समांतर माध्य से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> है, क्योंकि धीमी चाल पर अधिक समय लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही कथन यह है कि औसत चाल समांतर माध्य से कम होगी </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ज़िले की जनसंख्या 3,35,000 है, जिसमें से 2,14,000 पुरुष हैं। जनसंख्या का 31% साक्षर है। यदि 31% पुरुष साक्षर हैं, तो कितने प्रतिशत महिलाएँ साक्षर हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28%</span> y:'Mangal'\">एक मीनार के आधार से 30 मीटर दूर खड़ा एक व्यक्ति देखता है कि मीनार के शीर्ष का उन्नयन कोण 30° है। मीनार की ऊँचाई ज्ञात कीजिए। (उत्तर को दो दशमलव स्थानों तक ज्ञात कीजिए; √3 = 1.732 लें)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51.96 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17.32 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15.00 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20.00 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan(उन्नयन कोण) = ऊँचाई ÷ आधार से दूरी</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan 30° = h ÷ 30 → h = 30 × tan 30° = 30 × (1/√3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30/√3 = 10√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = 10 × 1.732 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17.32 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मीनार की ऊँचाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">17.32 m (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो उम्मीदवारों के बीच हुए एक चुनाव में 20,000 पंजीकृत मतदाताओं में से 20% ने मतदान नहीं किया, और डाले गए मतों में से 400 अवैध घोषित हुए। विजयी उम्मीदवार को वैध मतों का 60% मिला। विजयी उम्मीदवा m:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री की आयु x लें → माता की आयु = 3x.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 3x = 64 → 4x = 64 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता = 3 × 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 वर्ष</span><span style=\"font-family:'Mangal'\">, पुत्री = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 48 − 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 वर्ष (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित व्यंजक को सरल कीजिए: (2a + 3b + 4c)² + (2a − 3b − 4c)² − 8a² − 18b² − 32c²</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24ab</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">65</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतःकोणों का योग = (n − 2) × 180°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(n − 2) × 180° = 1800°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n − 2 = 10 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">n = 12</span><span style=\"font-family:'Mangal'\"> भुजाएँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकर्णों की संख्या = n(n − 3) / 2 = (12 × 9) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बहुभुज में </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 विकर्ण (विकल्प C)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सोसाइटी के चुनाव में दो उम्मीदवारों को 8 : 5 के अनुपात में मत मिले। यदि कुल 390 मत डाले गए, तो विजयी उम्मीदवार को कितने मत मिले?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात के कुल भाग = 8 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक भाग = 390 ÷ 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 मत</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विजयी उम्मीदवार (8 भाग) = 8 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 मत</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विजेता को </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 मत (विकल्प D)</span><span style=\"font-family:'Mangal'\"> मिले।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 7 अंकों की संख्या 87321A6, 6 से पूर्णतः विभाज्य है, तो A का न्यूनतम मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p sty
