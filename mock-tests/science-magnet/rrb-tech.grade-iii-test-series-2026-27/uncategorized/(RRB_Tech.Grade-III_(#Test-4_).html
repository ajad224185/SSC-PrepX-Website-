<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9.) RRB Tech.Grade-III (#Test-4  - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

estion": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) यह ऐसे दो मिश्रणीय द्रवों को पृथक कर सकता है जिनके क्वथनांकों में कम से कम लगभग 25°C का अंतर हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) कम क्वथनांक वाले द्रव की वाष्प को संघनित्र में ठंडा करके आसुत के रूप में एकत्र किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) घुला हुआ ठोस या अधिक क्वथनांक वाला द्रव आसवन फ्लास्क में ही रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) आसवन उन द्रवों को पृथक करता है जिनके क्वथनांकों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम से कम लगभग 25°C</span><span style=\"font-family:'Mangal'\"> का अंतर हो, या विलायक को पुनः प्राप्त करता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) कम क्वथनांक वाले द्रव की वाष्प </span><span style=\"font-weight:bold;font-family:'Mangal'\">संघनित्र</span><span style=\"font-family:'Mangal'\"> से गुज़रती है, ठंडी होती है और शुद्ध द्रव, </span><span style=\"font-weight:bold;font-family:'Mangal'\">आसुत</span><span style=\"font-family:'Mangal'\">, के रूप में एकत्र होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठोस या दूसरा द्रव</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">आसवन फ्लास्क</span><span style=\"font-family:'Mangal'\"> में ही रह जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1820 में किसने खोजा कि किसी धात्विक तार के पास रखी कंपास सुई तार में विद्युत धारा प्रवाहित होने पर विक्षेपित हो जाती है, जो दर्शाता है कि विद्युत धारा चुंबकीय प्रभाव उत्पन्न करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माइकल फैराडे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जॉर्ज साइमन ओम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हैंस क्रिश्चियन ओर्स्टेड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आंद्रे-मैरी ऐम्पियर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">1820</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">हैंस क्रिश्चियन ओर्स्टेड</span><span style=\"font-family:'Mangal'\"> ने संयोगवश खोजा कि पास के धात्विक तार में विद्युत धारा प्रवाहित होने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंपास सुई विक्षेपित</span><span style=\"font-family:'Mangal'\"> हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे सिद्ध हुआ कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत धारा चुंबकीय प्रभाव उत्पन्न</span><span style=\"font-family:'Mangal'\"> करती है, और विद्युत चुंबकत्व का अध्ययन शुरू हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र की तीव्रता का मात्रक </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओर्स्टेड</span><span style=\"font-family:'Mangal'\"> उनके सम्मान में रखा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह खोज हैंस क्रिश्चियन ओर्स्टेड ने की </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूरॉन के भाग को उसके कार्य से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789639268934_image001.png\" style=\"width: 794px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक न्यूरॉन के तीन मुख्य भाग होते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाकाय</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">डेंड्राइट</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक्सॉन</span><span style=\"font-family:'Mangal'\">।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">डेंड्राइट</span><span style=\"font-family:'Mangal'\"> अन्य न्यूरॉनों से संकेत प्राप्त करते हैं &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाकाय</span><span style=\"font-family:'Mangal'\"> में केंद्रक होता है और यह कोशिका की क्रियाओं का नियंत्रण करता है &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक्सॉन</span><span style=\"font-family:'Mangal'\"> संकेत को कोशिकाकाय से दूर अपने सिरों तक ले जाता है &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पौधे के फूल के परागकोश से उसी प्रकार के दूसरे पौधे के फूल के वर्तिकाग्र तक पराग का स्थानांतरण कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्व-परागण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर-परागण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निषेचन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंकुरण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्व-परागण</span><span style=\"font-family:'Mangal'\">: पराग </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसी फूल या उसी पौधे के दूसरे फूल</span><span style=\"font-family:'Mangal'\"> के वर्तिकाग्र तक पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पर-परागण</span><span style=\"font-family:'Mangal'\">: पराग </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक पौधे</span><span style=\"font-family:'Mangal'\"> के फूल के परागकोश से उसी प्रकार के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरे पौधे</span><span style=\"font-family:'Mangal'\"> के फूल के वर्तिकाग्र तक पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निषेचन (युग्मकों का संलयन) और अंकुरण (बीज से अंकुर बनना) बाद में होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह प्रक्रिया पर-परागण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब सोडियम सल्फेट के विलयन को बेरियम क्लोराइड के विलयन से मिलाया जाता है, तो एक अघुलनशील श्वेत पदार्थ बनता है। यह पदार्थ और अभिक्रिया का प्रकार है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेरियम क्लोराइड; संयोजन अभिक्रिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेरियम सल्फेट; अवक्षेपण (द्विविस्थापन) अभिक्रिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड; अपघटन अभिक्रिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेरियम सल्फेट; विस्थापन अभिक्रिया</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिक्रिया में बना </span><span style=\"font-weight:bold;font-family:'Mangal'\">अघुलनशील पदार्थ</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवक्षेप</span><span style=\"font-family:'Mangal'\"> कहलाता है, और ऐसी अभिक्रिया </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवक्षेपण अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Na₂SO₄(aq) + BaCl₂(aq) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">BaSO₄(s)</span><span style=\"font-family:'Mangal'\"> + 2NaCl(aq)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बेरियम सल्फेट (BaSO₄)</span><span style=\"font-family:'Mangal'\"> का श्वेत अवक्षेप Ba²⁺ और SO₄²⁻ आयनों से बनता है; सोडियम क्लोराइड विलयन में रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि दो यौगिकों के बीच आयनों का आदान-प्रदान होता है, यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विविस्थापन</span><span style=\"font-family:'Mangal'\"> अभिक्रिया भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पदार्थ बेरियम सल्फेट है और यह अवक्षेपण (द्विविस्थापन) अभिक्रिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समस्थानिकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) समस्थानिक एक ही तत्व के वे परमाणु हैं जिनका परमाणु क्रमांक समान परंतु द्रव्यमान संख्या भिन्न होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) प्राकृतिक हाइड्रोजन तीन समस्थानिकों — प्रोटियम, ड्यूटीरियम और ट्राइटियम — का मिश्रण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) किसी तत्व के समस्थानिकों के रासायनिक गुण समान होते हैं क्योंकि उनका इलेक्ट्रॉनिक विन्यास समान होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान परमाणु क्रमांक</span><span style=\"font-family:'Mangal'\"> परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न द्रव्यमान संख्या</span><span style=\"font-family:'Mangal'\"> वाले \"जुड़वाँ परमाणु\" समस्थानिक हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) प्राकृतिक हाइड्रोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटियम, ड्यूटीरियम और ट्राइटियम</span><span style=\"font-family:'Mangal'\"> का मिश्रण है, प्रत्येक में एक प्रोटॉन → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) समस्थानिकों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉनों की संख्या</span><span style=\"font-family:'Mangal'\"> और इलेक्ट्रॉनिक विन्यास समान होता है, इसलिए उनके रासायनिक गुण </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक लड़की अपने सिर पर एक बक्सा रखकर समतल सड़क पर 20 m चलती है। बक्से पर उसके द्वारा लगाए गए ऊपर की ओर के बल द्वारा किया गया कार्य है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनात्मक, क्योंकि बक्सा 20 m चलता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शून्य, क्योंकि बल और विस्थापन एक-दूसरे के लंबवत हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक, क्योंकि गुरुत्व बल का विरोध करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बक्से के भार × 20 m के बराबर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़की का ऊपर की ओर बल केवल बक्से के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भार को संतुलित</span><span style=\"font-family:'Mangal'\"> करता है; बक्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षैतिज</span><span style=\"font-family:'Mangal'\"> दिशा में चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्य तभी होता है जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल की दिशा में</span><span style=\"font-family:'Mangal'\"> विस्थापन हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ बल (ऊर्ध्वाधर) विस्थापन (क्षैतिज) के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबवत</span><span style=\"font-family:'Mangal'\"> है → इस बल द्वारा किया गया कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">शून्य</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः किया गया कार्य शून्य है क्योंकि बल और विस्थापन लंबवत हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूचकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) अम्ल नीले लिटमस को लाल कर देते हैं, और क्षारक लाल लिटमस को नीला कर देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) लिटमस और हल्दी प्राकृतिक सूचक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) मेथिल ऑरेंज और फिनॉल्फ्थेलीन संश्लेषित सूचक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीले लिटमस को लाल</span><span style=\"font-family:'Mangal'\"> करते हैं; क्षारक </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाल लिटमस को नीला</span><span style=\"font-family:'Mangal'\"> करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">लिटमस</span><span style=\"font-family:'Mangal'\"> (लाइकेन से) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हल्दी</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राकृतिक</span><span style=\"font-family:'Mangal'\"> सूचक हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेथिल ऑरेंज</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">फिनॉल्फ्थेलीन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">संश्लेषित</span><span style=\"font-family:'Mangal'\"> सूचक हैं, जो अम्ल और क्षारक की जाँच में उपयोग होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी प्रतिरोधक में धारा और उसके सिरों के बीच विभवांतर मापने के लिए ऐमीटर और वोल्टमीटर क्रमशः जोड़े जाते हैं:</span></p>", "option1": m:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) वह गुण जिससे धातुओं को पीटकर पतली चादरें बनाई जा सकती हैं, आघातवर्ध्यता कहलाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) सोना सबसे अधिक तन्य धातु है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) धातुओं को खींचकर पतले तार बनाने की क्षमता तन्यता कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) पीटकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">पतली चादरें</span><span style=\"font-family:'Mangal'\"> बनाना = </span><span style=\"font-weight:bold;font-family:'Mangal'\">आघातवर्ध्यता</span><span style=\"font-family:'Mangal'\">; सोना और चाँदी सबसे अधिक आघातवर्ध्य धातुएँ हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोना</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे अधिक तन्य</span><span style= amily:'Mangal'\">प्रोकैरियोटिक</span><span style=\"font-family:'Mangal'\"> कोशिकाएँ हैं (pro = आदिम, karyon = केंद्रक), जैसे जीवाणु।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें अधिकांश कोशिकीय क्रियाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीधे कोशिकाद्रव्य में</span><span style=\"font-family:'Mangal'\"> होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप और जंतु कोशिकाओं में सुस्पष्ट केंद्रक और झिल्ली-बद्ध कोशिकांग होते हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूकैरियोटिक</span><span style=\"font-family:'Mangal'\"> (eu = सत्य)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसी कोशिकाएँ प्रोकैरियोटिक कोशिकाएँ हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रासायनिक रूप से साबुन हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबी शृंखला वाले ऐल्कोहॉलों के एस्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबी शृंखला वाले हाइड्रोकार्बन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सल्फोनिक अम्लों के सोडियम लवण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबी शृंखला वाले कार्बोक्सिलिक अम्लों के सोडियम या पोटैशियम लवण</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">साबुन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी शृंखला वाले कार्बोक्सिलिक अम्लों (वसा अम्लों) के सोडियम या पोटैशियम लवण</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साबुन के अणु के दो सिरे होते हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनिक सिरा</span><span style=\"font-family:'Mangal'\"> जल से और </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी कार्बन शृंखला</span><span style=\"font-family:'Mangal'\"> तेल से अंतःक्रिया करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए साबुन मिसेल बनाकर जल में तैलीय मैल को हटा पाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साबुन लंबी शृंखला वाले कार्बोक्सिलिक अम्लों के सोडियम या पोटैशियम लवण हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): कुछ लोगों को अपने चश्मे में द्विफोकसी लेंस की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ऐसे लोग निकट-दृष्टि और दूर-दृष्टि दोनों दोषों से ग्रस्त होते हैं; द्विफोकसी लेंस का ऊपरी भाग दूर की दृष्टि के लिए अवतल और निचला भाग निकट की दृष्टि के लिए उत्तल होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयु के साथ पक्ष्माभी पेशियाँ कमज़ोर होती हैं और नेत्र लेंस का लचीलापन घटता है (जरा-दूरदृष्टिता), और कुछ लोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">निकट-दृष्टि और दूर-दृष्टि दोनों</span><span style=\"font-family:'Mangal'\"> दोषों से ग्रस्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे लोगों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विफोकसी लेंस</span><span style=\"font-family:'Mangal'\"> चाहिए → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्य द्विफोकसी लेंस का ऊपरी भाग </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल</span><span style=\"font-family:'Mangal'\"> (दूर की दृष्टि) और निचला भाग </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल</span><span style=\"font-family:'Mangal'\"> (निकट की दृष्टि) होता है → R सत्य है और बताता है कि एक लेंस क्यों पर्याप्त नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक यौगिक में द्रव्यमान के अनुसार 40% सल्फर और 60% ऑक्सीजन है। स्थिर अनुपात के नियम के अनुसार, 20 g सल्फर से पूर्णतः संयोग करके यह यौगिक बनाने के लिए कितनी ऑक्सीजन चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 g</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 g</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 g</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 g</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिर अनुपात का नियम (प्राउस्ट): किसी यौगिक में तत्व द्रव्यमान के </span><span style=\"font-weight:bold;font-family:'Mangal'\">निश्चित अनुपात</span><span style=\"font-family:'Mangal'\"> में संयोग करते हैं, चाहे स्रोत कोई भी हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सल्फर : ऑक्सीजन = 40 : 60 = द्रव्यमान से </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 g सल्फर के लिए ऑक्सीजन = (20 × 3) / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 30 g ऑक्सीजन चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपकला ऊतक के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) यह शरीर का बाहरी आवरण बनाता है और मुख, फेफड़ों तथा रक्त वाहिकाओं जैसे आंतरिक अंगों का अस्तर भी बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) इसकी कोशिकाएँ बहुत कम अंतराकोशिकीय स्थान के साथ सघन रूप से व्यवस्थित होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) फेफड़ों में गैसों के विनिमय के लिए उपकला पतली, चपटी कोशिकाओं की एक ही परत होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) उपकला ऊतक </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वचा</span><span style=\"font-family:'Mangal'\"> बनाता है और मुख, फेफड़ों, रक्त वाहिकाओं और आंत का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अस्तर</span><span style=\"font-family:'Mangal'\"> बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) इसकी कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सघन रूप से व्यवस्थित</span><span style=\"font-family:'Mangal'\"> होती हैं, बहुत कम अंतराकोशिकीय स्थान के साथ, जिससे रोगाणुओं का प्रवेश रुकता है और जल की हानि कम होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">विनिमय</span><span style=\"font-family:'Mangal'\"> (गैसों और द्रवों का तीव्र विसरण) के लिए उपकला </span><span style=\"font-weight:bold;font-family:'Mangal'\">पतली, चपटी कोशिकाओं की एक परत</span><span style=\"font-family:'Mangal'\"> होती है, जो फेफड़ों और रक्त वाहिकाओं के अस्तर में पाई जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी सीधे धारावाही चालक द्वारा उसके पास किसी बिंदु पर उत्पन्न चुंबकीय क्षेत्र:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक से सभी दूरियों पर समान होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक से दूरी बढ़ने पर घटता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक से दूरी बढ़ने पर बढ़ता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">का परिमाण होता है परंतु दिशा नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र एक ऐसी राशि है जिसका </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिमाण और दिशा</span><span style=\"font-family:'Mangal'\"> दोनों होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधे धारावाही चालक के चारों ओर क्षेत्र रेखाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">संकेंद्री वृत्त</span><span style=\"font-family:'Mangal'\"> होती हैं, और दूर जाने पर ये वृत्त बड़े और एक-दूसरे से दूर होते जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दी गई धारा से उत्पन्न चुंबकीय क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">चालक से दूरी बढ़ने पर घटता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्षेत्र दूरी के साथ घटता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध जल-में-तेल (oil-in-water) इमल्शन है। निम्नलिखित में से कौन-सा तेल-में-जल (water-in-oil) इमल्शन का उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैनिशिंग क्रीम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मक्खन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नमक का विलयन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">इमल्शन</span><span style=\"font-family:'Mangal'\"> वह कोलॉइड है जिसमें परिक्षिप्त प्रावस्था और परिक्षेपण माध्यम दोनों द्रव होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">oil-in-water</span><span style=\"font-family:'Mangal'\"> इमल्शन: दूध और वैनिशिंग क्रीम (जल में तेल की बूँदें परिक्षिप्त)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">water-in-oil</span><span style=\"font-family:'Mangal'\"> इमल्शन: </span><span style=\"font-weight:bold;font-family:'Mangal'\">मक्खन</span><span style=\"font-family:'Mangal'\">, बॉडी लोशन और कोल्ड क्रीम (तेल में जल की बूँदें परिक्षिप्त)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नमक का विलयन वास्तविक विलयन है, कोलॉइड नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः water-in-oil इमल्शन मक्खन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रीनहाउस प्रभाव के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) कार्बन डाइऑक्साइड, मीथेन और जलवाष्प जैसी ग्रीनहाउस गैसें बाहर जाने वाली ऊष्मा के एक भाग को रोककर पृथ्वी को जीवन के लिए पर्याप्त गर्म रखती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) मानवीय क्रियाकलापों से अतिरिक्त CO₂ ग्रीनहाउस प्रभाव को बढ़ाती है और वैश्विक तापन का कारण बनती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) शुक्र, बुध से अधिक गर्म है, यद्यपि बुध सूर्य के अधिक निकट है, क्योंकि शुक्र के वायुमंडल में अनियंत्रित ग्रीनहाउस प्रभाव होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">CO₂, मीथेन और जलवाष्प</span><span style=\"font-family:'Mangal'\"> बाहर जाने वाली ऊष्मा का एक भाग रोकती हैं; यह प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को जीवन के लिए पर्याप्त गर्म रखता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) मानवीय क्रियाकलापों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अतिरिक्त CO₂</span><span style=\"font-family:'Mangal'\"> इस प्रभाव को बढ़ाती है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">वैश्विक तापन</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) सूर्य से दूर होने के बावजूद </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुक्र, बुध से अधिक गर्म</span><span style=\"font-family:'Mangal'\"> है, क्योंकि उसका वायुमंडल </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनियंत्रित ग्रीनहाउस प्रभाव</span><span style=\"font-family:'Mangal'\"> उत्पन्न करता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक धावक बिंदु O से बिंदु A तक 100 m पूर्व की ओर दौड़ता है और फिर O की ओर 60 m वापस दौड़कर बिंदु B पर रुकता है। तय की गई कुल दूरी और विस्थापन का परिमाण क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">160 m और 160 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 m और 60 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">160 m और 40 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 m और 160 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूरी = पूरे पथ की लंबाई = OA + AB = 100 + 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">160 m</span><span style=\"font-family:'Mangal'\"> (दूरी के लिए केवल संख्यात्मक मान चाहिए, दिशा नहीं).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन = प्रारंभिक बिंदु O और अंतिम बिंदु B के बीच की न्यूनतम दूरी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, O से 100 − 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 m</span><span style=\"font-family:'Mangal'\"> पूर्व में है → विस्थापन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 m</span><span style=\"font-family:'Mangal'\"> (पूर्व की ओर).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूरी 160 m और विस्थापन 40 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समतल दर्पण द्वारा बने प्रतिबिंब के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) प्रतिबिंब सदैव आभासी और सीधा होता है, और वस्तु के आकार के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) प्रतिबिंब दर्पण के पीछे उतनी ही दूरी पर बनता है जितनी दूरी पर वस्तु सामने होती है, और यह पार्श्व परिवर्तित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) प्रतिबिंब वास्तविक होता है और इसे पर्दे पर प्राप्त किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) समतल दर्पण सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी, सीधा</span><span style=\"font-family:'Mangal'\"> और वस्तु के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान आकार</span><span style=\"font-family:'Mangal'\"> का प्रतिबिंब बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) प्रतिबिंब दर्पण के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे उतनी ही दूरी</span><span style=\"font-family:'Mangal'\"> पर बनता है जितनी दूरी पर वस्तु सामने है, और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पार्श्व परिवर्तित</span><span style=\"font-family:'Mangal'\"> होता है (बायाँ दायाँ दिखता है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) प्रतिबिंब </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी</span><span style=\"font-family:'Mangal'\"> है, अतः इसे पर्दे पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राप्त नहीं</span><span style=\"font-family:'Mangal'\"> किया जा सकता → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्साकशी में दोनों टीमें ज़ोर से खींच रही हैं, फिर भी रस्सी नहीं हिलती। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी पर कोई बल नहीं लग रहा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी का द्रव्यमान बहुत अधिक है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों टीमों द्वारा लगाए गए बल परिमाण में बराबर और दिशा में विपरीत हैं (संतुलित बल)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी और हाथों के बीच घर्षण शून्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परिमाण में बराबर परंतु दिशा में विपरीत</span><span style=\"font-family:'Mangal'\"> दो बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलित बल</span><span style=\"font-family:'Mangal'\"> कहलाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्साकशी में जब दोनों टीमों के बल संतुलित होते हैं, तो रस्सी </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं हिलती</span><span style=\"font-family:'Mangal'\">, भले ही उस पर बड़े बल लग रहे हों।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि एक टीम अधिक बल से खींचे, तो बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंतुलित</span><span style=\"font-family:'Mangal'\"> हो जाते हैं और रस्सी बड़े बल की दिशा में चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रस्सी इसलिए स्थिर रहती है क्योंकि बल संतुलित हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): हीरा ज्ञात सबसे कठोर पदार्थ है, जबकि ग्रेफाइट चिकना और फिसलनदार है, यद्यपि दोनों केवल कार्बन से बने हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): हीरे और ग्रेफाइट के भौतिक गुण इसलिए भिन्न हैं क्योंकि उनके कार्बन परमाणु अलग-अलग तरीके से बंधे हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हीरा</span><span style=\"font-family:'Mangal'\"> ज्ञात </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे कठोर</span><span style=\"font-family:'Mangal'\"> पदार्थ है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्रेफाइट</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">चिकना और फिसलनदार</span><span style=\"font-family:'Mangal'\"> है (और विद्युत का अच्छा चालक) → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों कार्बन के रूप (अपररूप) हैं जिनके रासायनिक गुण समान हैं, परंतु उनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन परमाणु अलग-अलग तरीके से बंधे</span><span style=\"font-family:'Mangal'\"> हैं, जिससे उनके भौतिक गुण बहुत भिन्न हैं → R सत्य है और A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक्सॉन के सिरे पर विद्युत आवेग रसायनों का स्रावण कराता है, जो एक अंतराल को पार करके अगले न्यूरॉन के डेंड्राइट में वैसा ही आवेग शुरू करते हैं। यह अंतराल कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डेंड्राइट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकाकाय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिनैप्स (अंतर्ग्रथन)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिवर्ती चाप</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवेग डेंड्राइट से कोशिकाकाय तक और फिर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक्सॉन</span><span style=\"font-family:'Mangal'\"> के साथ उसके सिरे तक जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक्सॉन के सिरे पर आवेग </span><span style=\"font-w
