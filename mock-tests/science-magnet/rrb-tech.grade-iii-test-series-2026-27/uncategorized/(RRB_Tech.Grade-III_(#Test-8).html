में</span><span style=\"font-family:'Mangal'\"> होता है, और मेथेनैल कोशिकाओं के घटकों से तेज़ी से अभिक्रिया करके जीवद्रव्य को स्कंदित कर देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेनॉल </span><span style=\"font-weight:bold;font-family:'Mangal'\">दृक् तंत्रिका को भी प्रभावित करके अंधापन</span><span style=\"font-family:'Mangal'\"> पैदा करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रंग ऐल्कोहॉल को विषैला नहीं बनाता, मेथेनॉल ईंधन के रूप में नहीं मिलाया जाता, और विकृत ऐल्कोहॉल पीना कभी सुरक्षित नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेथेनॉल एथेनॉल को पीने के अयोग्य बनाता है और रंग उसकी पहचान कराता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साबुन और अपमार्जकों (डिटर्जेंट) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कठोर जल में साबुन उसमें उपस्थित कैल्सियम और मैग्नीशियम लवणों से अभिक्रिया करके एक अविलेय पदार्थ बनाता है, जिसे स्कम (मैल) कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अपमार्जक कठोर जल में भी प्रभावी रहते हैं क्योंकि उनके आवेशित सिरे कैल्सियम और मैग्नीशियम आयनों के साथ अविलेय अवक्षेप नहीं बनाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. साबुन का विलयन धुँधला इसलिए दिखता है क्योंकि साबुन के मिसेल प्रकाश को प्रकीर्णित करने के लिए बहुत छोटे होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कठोर जल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम और मैग्नीशियम लवण</span><span style=\"font-family:'Mangal'\"> होते हैं; साबुन उनसे अभिक्रिया करता है, अतः झाग कठिनाई से बनता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्कम</span><span style=\"font-family:'Mangal'\"> नामक अविलेय पदार्थ बचा रहता है, इसीलिए कठोर जल में अधिक साबुन लगता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपमार्जकों</span><span style=\"font-family:'Mangal'\"> (प्रायः सल्फ़ोनिक अम्लों के सोडियम लवण या क्लोराइड/ब्रोमाइड आयनों वाले अमोनियम लवण) के आवेशित सिरे </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम और मैग्नीशियम आयनों के साथ अविलेय अवक्षेप नहीं बनाते</span><span style=\"font-family:'Mangal'\">, अतः वे कठोर जल में काम करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. साबुन के मिसेल </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश को प्रकीर्णित करने के लिए पर्याप्त बड़े</span><span style=\"font-family:'Mangal'\"> होते हैं, इसीलिए साबुन का विलयन धुँधला दिखता है; आयन-आयन प्रतिकर्षण के कारण वे कोलॉइड के रूप में विलयन में बने रहते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि पिता के लिंग गुणसूत्र XY और माता के XX हों, तो नर शिशु (पुत्र) होने की प्रायिकता कितने प्रतिशत है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता (XX) प्रत्येक संतान को केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> गुणसूत्र दे सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता (XY) समान संभावना से </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> या </span><span style=\"font-weight:bold;font-family:'Mangal'\">Y</span><span style=\"font-family:'Mangal'\"> गुणसूत्र देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता से X → </span><span style=\"font-weight:bold;font-family:'Mangal'\">XX</span><span style=\"font-family:'Mangal'\"> → पुत्री; पिता से Y → </span><span style=\"font-weight:bold;font-family:'Mangal'\">XY</span><span style=\"font-family:'Mangal'\"> → पुत्र। अतः पुत्र होने की संभावना </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 में 1 = 50%</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतान का लिंग इस पर निर्भर करता है कि वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता</span><span style=\"font-family:'Mangal'\"> से कौन-सा गुणसूत्र पाती है; 25% और 75% मेंडल के 3 : 1 अनुपात को गलत लागू करने से आते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पुत्र होने की प्रायिकता 50% है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रधातुओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मिश्रधातु दो या अधिक धातुओं, या एक धातु और एक अधातु का समांगी मिश्रण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पीतल लगभग 80% ताँबे और 20% टिन की मिश्रधातु है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मिश्रधातु के घटकों को भौतिक विधियों से अलग नहीं किया जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो या अधिक धातुओं, या एक धातु और एक अधातु के समांगी मिश्रण</span><span style=\"font-family:'Mangal'\"> को मिश्रधातु कहते हैं; यह पिघली धातुओं को मिलाकर बनाई जाती है, जो ठंडी होकर एक ही धातु जैसे दिखने वाला पदार्थ बनाती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीतल</span><span style=\"font-family:'Mangal'\"> लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">80% ताँबे और 20% ज़िंक</span><span style=\"font-family:'Mangal'\"> की मिश्रधातु है; लगभग 80% ताँबा और 20% टिन वाली मिश्रधातु </span><span style=\"font-weight:bold;font-family:'Mangal'\">काँसा</span><span style=\"font-family:'Mangal'\"> है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मिश्रधातु के घटकों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">भौतिक विधियों से अलग नहीं</span><span style=\"font-family:'Mangal'\"> किया जा सकता → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आँखों पर पट्टी बँधा एक छात्र ताली बजाने वाले मित्र की ओर फिर भी संकेत कर सकता है। इसका मुख्य कारण है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि पास वाले कान की ओर तेज़ी से चलती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि केवल एक कान सुनता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कर्णावर्त (कॉक्लिया) केवल एक कान में काम करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि दोनों कानों तक थोड़े अलग-अलग समय पर पहुँचती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि कान में प्रवेश करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्णपटह कंपन करता है</span><span style=\"font-family:'Mangal'\">, छोटी अस्थिकाएँ कंपन को बढ़ाती हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कर्णावर्त कंपनों को विद्युत संकेतों में बदलता है</span><span style=\"font-family:'Mangal'\"> जो मस्तिष्क तक जाते हैं; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोनों</span><span style=\"font-family:'Mangal'\"> कानों में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो कान होने से मस्तिष्क ध्वनि की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिशा</span><span style=\"font-family:'Mangal'\"> ज्ञात कर पाता है: वह तुलना करता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">कौन-सा कान ध्वनि पहले सुनता है</span><span style=\"font-family:'Mangal'\">, दोनों कानों के बीच के बहुत छोटे समय अंतर से, जो प्रायः एक सेकंड के हज़ारवें भाग से भी कम होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि सभी दिशाओं में समान चाल से चलती है, और दोनों कान तथा दोनों कर्णावर्त काम करते हैं, इसलिए विकल्प A, B और C गलत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दिशा इसलिए ज्ञात होती है क्योंकि ध्वनि दोनों कानों तक थोड़े अलग-अलग समय पर पहुँचती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सांद्र सल्फ्यूरिक अम्ल को तनु करते समय अम्ल को लगातार हिलाते हुए धीरे-धीरे जल में मिलाना चाहिए, कभी भी जल को अम्ल में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): अम्ल को जल में घोलना अत्यधिक ऊष्माक्षेपी प्रक्रम है, और उत्पन्न ऊष्मा से मिश्रण छलककर जलन (बर्न) पैदा कर सकता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अम्ल या क्षारक को जल में घोलने का प्रक्रम अत्यधिक ऊष्माक्षेपी</span><span style=\"font-family:'Mangal'\"> होता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए सांद्र नाइट्रिक अम्ल या सल्फ्यूरिक अम्ल को सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगातार हिलाते हुए धीरे-धीरे जल में</span><span style=\"font-family:'Mangal'\"> मिलाना चाहिए; यदि इसके बजाय जल को सांद्र अम्ल में मिलाया जाए, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पन्न ऊष्मा से मिश्रण छलककर जलन पैदा कर सकता है</span><span style=\"font-family:'Mangal'\">, और अत्यधिक स्थानीय तापन से काँच का पात्र टूट भी सकता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल को अधिक मात्रा के जल में मिलाने से ऊष्मा जल द्वारा अवशोषित हो जाती है। अतः R ही वह कारण है जिससे A का नियम अपनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक किसान अपने खेत में गन्ने के तने की दो प्रकार की कलमें लगाता है: प्रकार A, जो तने के दो पर्वों (नोड) के बीच के भाग से काटी गई हैं, और प्रकार B, जिनमें से प्रत्येक में एक पर्व है। दो सप्ताह बाद केवल प्रकार B की कलमों से नए प्ररोह निकलते हैं। सबसे उपयुक्त व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकार A की कलमें सूख गईं क्योंकि उनमें मिट्टी से जल अवशोषित करने के लिए जाइलम नहीं था</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकार A की कलमों में शीर्षस्थ विभज्योतक नहीं था, जो केवल पूरे पौधे के सिरे पर होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकार B की कलमों में अंतर्वेशी विभज्योतक होता है, जो पर्वसंधि के आधार पर या पर्व के ठीक ऊपर स्थित है, और जिसकी लगातार विभाजित होती कोशिकाएँ नए प्ररोह बनाती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकार B की कलमें इसलिए अंकुरित हुईं क्योंकि पर्व में स्टार्च के रूप में बहुत सा भोजन संचित रहता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर्वेशी विभज्योतक</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्वसंधि (इंटरनोड) के आधार पर या पर्व (नोड) के ठीक ऊपर</span><span style=\"font-family:'Mangal'\"> स्थित होता है; पर्व तने का वह बिंदु है जहाँ से शाखाएँ या पत्तियाँ निकलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए बाड़ (हेज) को काटने पर कुछ समय बाद पर्वों से अधिक शाखाएँ निकलती हैं और बाड़ झाड़ीदार हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पर्व वाली</span><span style=\"font-family:'Mangal'\"> गन्ने की कलमें इसलिए अंकुरित होती हैं क्योंकि उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्वों पर यह विभज्योतक ऊतक</span><span style=\"font-family:'Mangal'\"> होता है; दो पर्वों के बीच से ली गई कलमों (प्रकार A) में विभज्योतक नहीं होता, अतः वे अंकुरित नहीं होतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीर्षस्थ विभज्योतक जड़ों और तनों के सिरों पर होता है, और यहाँ अंकुरण जाइलम या संचित स्टार्च के अभाव से तय नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रकार B की कलमें पर्वों पर स्थित अंतर्वेशी विभज्योतक के कारण अंकुरित होती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): यूरेनियम जैसे भारी परमाणुओं के नाभिकों में प्रोटॉनों की तुलना में न्यूट्रॉन कहीं अधिक होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): नाभिक के अंदर प्रत्येक प्रोटॉन हर दूसरे प्रोटॉन को प्रतिकर्षित करता है, और न्यूट्रॉन उस नाभिकीय बल को सुदृढ़ करते हैं जो नाभिक के सभी कणों को आपस में बाँधे रखता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हल्के परमाणुओं में प्रायः प्रोटॉन और न्यूट्रॉन की संख्या बराबर होती है (कार्बन में छह-छह), परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु जितने भारी होते जाते हैं, उनके नाभिकों में न्यूट्रॉन प्रोटॉनों से कहीं अधिक</span><span style=\"font-family:'Mangal'\"> होते जाते हैं। यूरेनियम में 92 प्रोटॉन और 146 न्यूट्रॉन हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नाभिक का प्रत्येक प्रोटॉन हर दूसरे प्रोटॉन को प्रतिकर्षित</span><span style=\"font-family:'Mangal'\"> करता है क्योंकि सभी पर धन आवेश है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूट्रॉन उस नाभिकीय बल को सुदृढ़</span><span style=\"font-family:'Mangal'\"> करते हैं जो नाभिक के सभी कणों को बाँधे रखता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए भारी परमाणुओं को नाभिक में सब कुछ कसकर बाँधे रखने के लिए कहीं अधिक न्यूट्रॉन चाहिए। R ही A का कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार विराम से चलकर 6 s में एकसमान रूप से 15 m/s का वेग प्राप्त करती है। फिर वह 8 s तक 15 m/s के नियत वेग से चलती है, और अंत में ब्रेक लगाने पर 4 s में एकसमान रूप से विराम में आ जाती है। कार द्वारा तय की गई कुल दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">195 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">165 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वेग-समय ग्राफ पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्राफ की रेखा और समय-अक्ष के बीच घिरा क्षेत्रफल</span><span style=\"font-family:'Mangal'\"> विस्थापन देता है (यहाँ यह दूरी के बराबर है, क्योंकि कार एक ही दिशा में चलती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला भाग (वेग 6 s में 0 से 15 m/s तक एकसमान रूप से बढ़ता है): त्रिभुज का क्षेत्रफल = ½ × 6 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा भाग (8 s तक 15 m/s का नियत वेग): आयत का क्षेत्रफल = 15 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा भाग (वेग 4 s में 15 m/s से 0 तक एकसमान रूप से घटता है): त्रिभुज का क्षेत्रफल = ½ × 4 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूरी = 45 + 120 + 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">195 m</span><span style=\"font-family:'Mangal'\"> (पूरे 18 s के लिए 15 m/s मानने पर गलत उत्तर 270 m आता).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तय की गई कुल दूरी 195 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ट्रक के उत्तल पश्च-दृश्य दर्पण की वक्रता त्रिज्या 4.0 m है। एक कार दर्पण से 6.0 m पीछे है। कार के प्रतिबिंब की स्थिति और आवर्धन क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के पीछे 3.0 m, +0.50</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के पीछे 1.5 m, +0.25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के सामने 1.5 m, −0.25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण के पीछे 2.0 m, +0.33</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तल दर्पण के लिए R = +4.0 m, अतः फोकस दूरी f = R/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2.0 m</span><span style=\"font-family:'Mangal'\">; बिंब दूरी u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6.0 m</span><span style=\"font-family:'Mangal'\"> (बिंब दर्पण के सामने है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर्पण सूत्र: 1/v + 1/u = 1/f → 1/v = 1/f − 1/u = 1/2 − (−1/6) = 1/2 + 1/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2/3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1.5 m</span><span style=\"font-family:'Mangal'\">; धनात्मक चिह्न का अर्थ है कि प्रतिबिंब </span><span style=\"font-weight:bold;font-family:'Mangal'\">दर्पण के पीछे</span><span style=\"font-family:'Mangal'\"> बनता है (आभासी)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्धन m = −v/u = −(1.5)/(−6.0) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.25</span><span style=\"font-family:'Mangal'\">: प्रतिबिंब आभासी, सीधा और आकार में 0.25 गुना छोटा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दर्पण के पीछे 1.5 m पर है और आवर्धन +0.25 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैज्ञानिक नामकरण और वर्गीकरण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वैज्ञानिक नाम में वंश (जीनस) का नाम पहले आता है और बड़े अक्षर से शुरू होता है, जबकि जाति (स्पीशीज़) का नाम छोटे अक्षरों में लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वैज्ञानिक नाम छपाई में तिरछे (इटैलिक) अक्षरों में लिखा जाता है, या हाथ से लिखने पर रेखांकित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कार्ल वोज़ द्वारा 1977 में प्रस्तावित तीन डोमेन प्रणाली में तीन डोमेन मोनेरा, प्रोटिस्टा और यूकैरिया हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वैज्ञानिक नामकरण का नियम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">वंश का नाम बड़े अक्षर से शुरू होता है और पहले आता है</span><span style=\"font-family:'Mangal'\">, उसके बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">जाति का नाम छोटे अक्षरों में</span><span style=\"font-family:'Mangal'\">, जैसे Panthera tigris → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वैज्ञानिक नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">छपाई में तिरछे अक्षरों में लिखा जाता है, या हाथ से लिखने पर रेखांकित</span><span style=\"font-family:'Mangal'\"> किया जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कार्ल वोज़ (1977) ने आनुवंशिक आँकड़ों के आधार पर तीन डोमेन प्रणाली प्रस्तावित की, और तीन डोमेन </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैक्टीरिया, आर्किया और यूकैरिया</span><span style=\"font-family:'Mangal'\"> हैं; मोनेरा और प्रोटिस्टा पाँच जगत प्रणाली के जगत हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कूड़े के ढेर में फेंके गए प्लास्टिक के थैले और काँच की बोतलें वर्षों तक ज्यों की त्यों बनी रहती हैं, जबकि वहाँ फेंके गए सब्ज़ियों के छिलके कुछ ही दिनों में सड़ जाते हैं। इसकी सबसे उपयुक्त व्याख्या निम्नलिखित में से कौन-सी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अजैव निम्नीकरणीय पदार्थ भी एंज़ाइमों द्वारा टूटते हैं, परंतु बहुत धीरे-धीरे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सब्ज़ियों के छिलके ऊष्मा और दाब से टूटते हैं, जबकि प्लास्टिक और काँच को एंज़ाइम चाहिए</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लास्टिक और काँच निष्क्रिय हैं, इसलिए वे पारिस्थितिकी तंत्र के किसी सदस्य को कभी हानि नहीं पहुँचा सकते</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एंज़ाइम अपनी क्रिया में विशिष्ट होते हैं, और जीवाणुओं तथा अन्य मृतजीवियों के एंज़ाइम प्लास्टिक और काँच को नहीं तोड़ सकते; इन पर केवल ऊष्मा और दाब जैसे भौतिक प्रक्रम कार्य करते हैं, इसलिए ये लंबे समय तक बने रहते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">एंज़ाइम अपनी क्रिया में विशिष्ट होते हैं</span><span style=\"font-family:'Mangal'\">: किसी विशेष पदार्थ को तोड़ने के लिए विशिष्ट एंज़ाइम चाहिए, इसीलिए कोयला खाने की कोशिश करने पर हमें कोई ऊर्जा नहीं मिलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सब्ज़ियों के छिलके </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> हैं: जीवाणुओं और अन्य मृतजीवियों के पास उन्हें तोड़ने वाले एंज़ाइम होते हैं, अतः वे कुछ दिनों में सड़ जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लास्टिक और काँच </span><span style=\"font-weight:bold;font-family:'Mangal'\">अजैव निम्नीकरणीय</span><span style=\"font-family:'Mangal'\"> हैं: इन पर केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊष्मा और दाब जैसे भौतिक प्रक्रम</span><span style=\"font-family:'Mangal'\"> कार्य करते हैं, और सामान्य पर्यावरणीय परिस्थितियों में ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबे समय तक बने रहते</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अजैव निम्नीकरणीय पदार्थ निष्क्रिय होकर बस बने रह सकते हैं, या पारिस्थितिकी तंत्र के विभिन्न सदस्यों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">हानि</span><span style=\"font-family:'Mangal'\"> भी पहुँचा सकते हैं, अतः विकल्प C गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अंतर एंज़ाइमों की विशिष्टता से समझाया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मेंढकों और अधिकांश मछलियों में निषेचन मादा के शरीर के अंदर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): मछलियाँ और मेंढक एक बार में सैकड़ों से हज़ारों अंडे देते हैं, और उनके बच्चों की उत्तरजीविता कम होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मेंढकों और अधिकांश मछलियों</span><span style=\"font-family:'Mangal'\"> जैसे अनेक जलीय जंतुओं में मादा अंडे जल में छोड़ती है और नर उन पर शुक्राणु छोड़ता है, अतः निषेचन </span><span style=\"font-weight:bold;font-family:'Mangal'\">शरीर के बाहर</span><span style=\"font-family:'Mangal'\"> होता है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाह्य निषेचन</span><span style=\"font-family:'Mangal'\"> है → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाह्य निषेचन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़ी संख्या में अंडे</span><span style=\"font-family:'Mangal'\"> दिए जाते हैं (मेंढक एक बार में 5,000–50,000, मछलियाँ सैकड़ों से हज़ारों), परंतु अनेक अंडे जल-धाराओं से नष्ट हो जाते हैं या अन्य जंतु उन्हें खा जाते हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">बच्चों की उत्तरजीविता कम</span><span style=\"font-family:'Mangal'\"> होती है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मादा के शरीर के अंदर निषेचन (आंतरिक निषेचन) सरीसृपों, पक्षियों और स्तनधारियों में होता है, जहाँ अंडे कम बनते हैं और उत्तरजीविता अधिक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सन् 1665 में स्वयं बनाए गए सूक्ष्मदर्शी से सबसे पहले कोशिका किसने देखी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एंटोन वॉन ल्यूवेनहॉक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रॉबर्ट हुक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रॉबर्ट ब्राउन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैथियास श्लाइडेन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रॉबर्ट हुक</span><span style=\"font-family:'Mangal'\"> ने सन् </span><span style=\"font-weight:bold;font-family:'Mangal'\">1665</span><span style=\"font-family:'Mangal'\"> में स्वयं बनाए गए सूक्ष्मदर्शी (लगभग 200-300X आवर्धन) से सबसे पहले कोशिका देखी; उन्होंने कॉर्क की पतली परत में छोटे-छोटे डिब्बे जैसे कक्ष देखे और उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका</span><span style=\"font-family:'Mangal'\"> नाम दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">एंटोन वॉन ल्यूवेनहॉक</span><span style=\"font-family:'Mangal'\"> ने सबसे पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीवित</span><span style=\"font-family:'Mangal'\"> कोशिकाएँ देखीं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">रॉबर्ट ब्राउन</span><span style=\"font-family:'Mangal'\"> ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्रक</span><span style=\"font-family:'Mangal'\"> की खोज की, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैथियास श्लाइडेन</span><span style=\"font-family:'Mangal'\"> कोशिका सिद्धांत के संस्थापकों में से एक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे पहले कोशिका देखने वाले वैज्ञानिक रॉबर्ट हुक थे </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रहीय पवनों और दाब पेटियों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पृथ्वी के घूर्णन के कारण ग्रहीय पवनें उत्तरी गोलार्ध में दाईं ओर और दक्षिणी गोलार्ध में बाईं ओर विक्षेपित होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विषुवत रेखा के निकट सूर्य के तीव्र तापन से गर्म वायु ऊपर उठती है, जिससे विषुवतीय निम्न दाब पेटी बनती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ध्रुवीय क्षेत्रों में अत्यंत कम ताप के कारण ठंडी, घनी वायु नीचे बैठती है, जिससे ध्रुवीय निम्न दाब पेटियाँ बनती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पृथ्वी का घूर्णन ग्रहीय पवनों को उनके सीधे मार्ग से विक्षेपित करता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तरी गोलार्ध में दाईं ओर और दक्षिणी गोलार्ध में बाईं ओर</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विषुवत रेखा के निकट </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीव्र तापन से गर्म वायु ऊपर उठती है</span><span style=\"font-family:'Mangal'\">, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">विषुवतीय निम्न दाब पेटी</span><span style=\"font-family:'Mangal'\"> बनती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ध्रुवों के आसपास (90° उत्तर और दक्षिण) अत्यंत कम ताप से ठंडी, घनी वायु </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे बैठती है</span><span style=\"font-family:'Mangal'\">, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्रुवीय उच्च दाब पेटियाँ</span><span style=\"font-family:'Mangal'\"> बनती हैं, निम्न दाब पेटियाँ नहीं; इन उच्च दाब क्षेत्रों से वायु उप-ध्रुवीय निम्न दाब पेटियों की ओर बहती है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुर्घटना के बाद एक रोगी के पश्च-मस्तिष्क का मेडुला क्षतिग्रस्त हो जाता है। निम्नलिखित में से कौन-सी क्रिया सबसे अधिक प्रभावित होने की संभावना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्र लिखने का निर्णय लेना और कुर्सी खिसकाना, जो ऐच्छिक क्रियाएँ हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आँख पर तेज़ प्रकाश पड़ने पर पुतली के आकार में परिवर्तन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्तदाब, लार-स्राव और वमन का नियंत्रण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भोजन के बाद पेट भरा होने की संवेदना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्तदाब, लार-स्राव और वमन जैसी अनैच्छिक क्रियाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्च-मस्तिष्क के मेडुला द्वारा नियंत्रित</span><span style=\"font-family:'Mangal'\"> होती हैं; अनेक अनैच्छिक क्रियाएँ मध्य-मस्तिष्क और पश्च-मस्तिष्क द्वारा नियंत्रित होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लिखना और कुर्सी खिसकाना </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐच्छिक (सोच-समझकर की गई) क्रियाएँ</span><span style=\"font-family:'Mangal'\"> हैं, जिनका निर्णय अग्र-मस्तिष्क में होता है और उसके प्रेरक क्षेत्रों को भेजा जाता है जो ऐच्छिक पेशियों को नियंत्रित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पुतली के आकार में परिवर्तन</span><span style=\"font-family:'Mangal'\"> एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरल प्रतिवर्ती क्रिया</span><span style=\"font-family:'Mangal'\"> का उदाहरण है, मेडुला-नियंत्रित क्रिया नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पेट भरा होने की संवेदना</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">अग्र-मस्तिष्क</span><span style=\"font-family:'Mangal'\"> के एक अलग भाग में स्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">भूख केंद्र</span><span style=\"font-family:'Mangal'\"> के कारण होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेडुला की क्षति से रक्तदाब, लार-स्राव और वमन का नियंत्रण सबसे अधिक प्रभावित होगा </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यौगिकों की विलेयता और विद्युत चालकता के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम क्लोराइड और कॉपर सल्फेट जैसे आयनिक यौगिक प्रायः जल में विलेय होते हैं परंतु किरोसिन और पेट्रोल जैसे विलायकों में अविलेय होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चीनी जल में घुल जाती है और उसका विलयन विद्युत का चालन करता है क्योंकि वह विलयन में आयन देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कपूर और नैफ़्थलीन जैसे सहसंयोजक यौगिक जल में अविलेय होते हैं परंतु किरोसिन और पेट्रोल में घुल जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सोडियम क्लोराइड और कॉपर सल्फेट जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनिक यौगिक</span><span style=\"font-family:'Mangal'\"> प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में विलेय</span><span style=\"font-family:'Mangal'\"> परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">किरोसिन और पेट्रोल में अविलेय</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चीनी एक सहसंयोजक यौगिक है जो जल में विलेय है, परंतु वह विलयन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयन नहीं देती</span><span style=\"font-family:'Mangal'\">, अतः उसका विलयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत का चालन नहीं करता</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कपूर और नैफ़्थलीन जैसे अधिकांश </span><span style=\"font-weight:bold;font-family:'Mangal'\">सहसंयोजक यौगिक</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में अविलेय परंतु किरोसिन और पेट्रोल में विलेय</span><span style=\"font-family:'Mangal'\"> होते हैं; ये विद्युत का चालन भी नहीं करते → सही।</span></p><p style= \"> हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">काला-अज़ार</span><span style=\"font-family:'Mangal'\"> उत्पन्न करने वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">लीशमैनिया</span><span style=\"font-family:'Mangal'\"> की कोशिका के </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक सिरे पर चाबुक जैसी संरचना</span><span style=\"font-family:'Mangal'\"> होती है और उसका शरीर अधिक संगठित होता है; इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विखंडन चाबुक जैसी संरचना के सापेक्ष एक निश्चित दिशा-विन्यास में</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पाइरोगाइरा एक बहुकोशिकीय तंतु है जो खंडन द्वारा प्रजनन करता है, और प्लाज़्मोडियम इस विवरण से मेल नहीं खाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह जीव लीशमैनिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्लोर-क्षार प्रक्रम और उसके उत्पादों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्लोर-क्षार प्रक्रम में ऐनोड पर क्लोरीन गैस और कैथोड पर हाइड्रोजन गैस निकलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सोडियम हाइड्रॉक्साइड विलयन कैथोड के पास बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विरंजक चूर्ण शुष्क सोडियम हाइड्रॉक्साइड पर क्लोरीन की क्रिया से बनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड के जलीय विलयन (ब्राइन) से विद्युत प्रवाहित करने पर वह अपघटित होता है: 2NaCl(aq) + 2H₂O(l) → 2NaOH(aq) + Cl₂(g) + H₂(g); यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोर-क्षार प्रक्रम</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनोड पर क्लोरीन गैस और कैथोड पर हाइड्रोजन गैस निकलती है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोडियम हाइड्रॉक्साइड विलयन कैथोड के पास बनता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विरंजक चूर्ण, Ca(ClO)₂, </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुष्क बुझे चूने, Ca(OH)₂, पर क्लोरीन की क्रिया</span><span style=\"font-family:'Mangal'\"> से बनता है, सोडियम हाइड्रॉक्साइड पर नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल के प्रयोग में गोल, पीले बीजों वाले मटर के पौधे (RRYY) का संकरण झुर्रीदार, हरे बीजों वाले पौधे (rryy) से कराया जाता है। एक F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> पौधा (RrYy) कितने प्रकार के युग्मक बनाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी F</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> पौधे </span><span style=\"font-weight:bold;font-family:'Mangal'\">RrYy</span><span style=\"font-family:'Mangal'\"> होते हैं: उन्हें प्रत्येक जनक से जीनों का एक समुच्चय मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीज का आकार और बीज का रंग जैसे लक्षण </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वतंत्र रूप से वंशागत</span><span style=\"font-family:'Mangal'\"> होते हैं, ngal'\">49</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FISH में </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट 20 = 4 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MANGO में </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट 30 = 5 × 6 → नियम: कूट = (अक्षरों की संख्या) × (अक्षरों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">+ 1</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PENCIL में </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> अक्षर हैं → कूट = 6 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 36 = 6 × 6 और 49 = 7 × 7 (वर्ग हैं, n × (n + 1) नहीं); 48 = 6 × 8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'PENCIL' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OUF LSE IQD ? CMB</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KJU</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FTR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GTF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FOC</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें; लुप्त समूह चौथा पद है, अतः वह IQD और CMB के बीच फिट होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: O → L → I → ? → C: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\"> → I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> (और F − 3 = C ✓)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: U → S → Q → ? → M: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → Q − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> (और O − 2 = M ✓)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: F → E → D → ? → B: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1</span><span style=\"font-family:'Mangal'\"> → D − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> (और C − 1 = B ✓)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">FOC (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B की माता है। B, C का पति है। C, D की माता है। D, E की बहन है। E, F का एकमात्र पौत्र है। F का विवाह A से हुआ है। F का D से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता का पिता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता का पिता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की माता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F का विवाह A से हुआ है और A, B की माता है → F और A पति-पत्नी हैं, अतः F, B का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता</span><span style=\"font-family:'Mangal'\"> है (A स्त्री है, अतः F पुरुष है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, C का पति है और C, D की माता है → B और C पति-पत्नी हैं, अतः B, D का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, E की बहन है → D और E के माता-पिता एक ही (B और C) हैं; E, F का पौत्र है और B का पुत्र है → संगत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः F, B का पिता है और B, D का पिता है → F, D के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता का पिता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: F पुरुष है (पिता की माता नहीं), F, B के पक्ष का है, C के नहीं (माता का पिता नहीं), और F, D का माता-पिता नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः F, D के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता का पिता (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीना बिंदु X से चलकर 4 m उत्तर की ओर जाती है। फिर वह दाएँ मुड़कर 6 m चलती है, पुनः दाएँ मुड़कर 9 m चलती है। अंत में वह बाएँ मुड़कर 2 m चलती है और बिंदु Y पर रुकती है। बिंदु Y, बिंदु X के सापेक्ष किस दिशा में है? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पश्चिम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पश्चिम</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 m उत्तर → (0, 4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके दाईं ओर मुड़ना → पूर्व, 6 m → (6, 4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके दाईं ओर मुड़ना → दक्षिण, 9 m → (6, −5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाईं ओर मुड़ना → पूर्व, 2 m → Y = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">8, −5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y, X से 8 m पूर्व और 5 m दक्षिण में है → वह X के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पूर्व</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: Y, X के उत्तर में नहीं है (y = −5) और पश्चिम में भी नहीं (x = +8)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बिंदु Y, बिंदु X के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण-पूर्व (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JFM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SOV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLR</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DZG</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JFM: J − 4 = F, F + 7 = M → (−4, +7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SOV: S − 4 = O, O + 7 = V → (−4, +7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DZG: D − 4 = Z (4 − 4 = 0 → 26 = Z), Z + 7 = G (26 + 7 = 33 → 7 = G) → (−4, +7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLR: P − 4 = L, L + 6 = R → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">−4, +6</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (−4, +7) का पालन करते हैं; केवल PLR नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">PLR (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्या 6382951 के प्रत्येक अंक को बाएँ से दाएँ अवरोही क्रम में व्यवस्थित किया जाता है। इस प्रकार बनी नई संख्या में बाएँ से तीसरे और दाएँ से दूसरे अं eading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 13 23 49 95 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">193</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">187</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">190</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">197</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 × 2 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23 × 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49 × 2 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">95</span><span style=\"font-family:'Mangal'\"> → संक्रियाएँ बारी-बारी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">× 2 + 3</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">× 2 − 3</span><span style=\"font-family:'Mangal'\"> हैं</span></p><p style=\"margin-top:
