<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>17.) RRB Tech.Grade-III (#Test-8 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुनार बनकर आए एक व्यक्ति ने एक महिला के सोने के कंगन एक विलयन में डुबोए। कंगन नए जैसे चमकते हुए बाहर आए, परंतु उनका भार काफ़ी घट गया। उसने जो विलयन प्रयोग किया, वह सबसे अधिक संभवतः था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तनु हाइड्रोक्लोरिक अम्ल, जो सोने को धीरे-धीरे घोल देता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अकेला सांद्र नाइट्रिक अम्ल, जो सोने को घोल देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फेट का विलयन, जिसमें से सोना ताँबे को विस्थापित करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐक्वा रेजिया, सांद्र हाइड्रोक्लोरिक अम्ल और सांद्र नाइट्रिक अम्ल का ताज़ा बनाया 3:1 मिश्रण, जो सोने को घोल सकता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोना सक्रियता श्रेणी में सबसे नीचे है; यह तनु अम्लों से अभिक्रिया नहीं करता, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अकेला हाइड्रोक्लोरिक अम्ल या अकेला नाइट्रिक अम्ल सोने को नहीं घोल सकता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऐक्वा रेजिया</span><span style=\"font-family:'Mangal'\"> ('शाही जल') </span><span style=\"font-weight:bold;font-family:'Mangal'\">सांद्र हाइड्रोक्लोरिक अम्ल और सांद्र नाइट्रिक अम्ल का 3:1 अनुपात में ताज़ा बनाया मिश्रण</span><span style=\"font-family:'Mangal'\"> है; यह अत्यंत संक्षारक है और उन गिने-चुने अभिकर्मकों में से है जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">सोने और प्लैटिनम को घोल सकते हैं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंगनों को ऐक्वा रेजिया में डुबोने से उनकी सतह से सोने की एक परत घुल गई। वे नए और चमकीले दिखे, परंतु उनका भार घट गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोना ताँबे से कम अभिक्रियाशील है, अतः वह कॉपर सल्फेट विलयन से ताँबे को विस्थापित नहीं कर सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह विलयन ऐक्वा रेजिया था </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि तरंग में माध्यम के कण विक्षोभ के संचरण की दिशा के समांतर कंपन करते हैं, इसलिए ध्वनि एक अनुदैर्ध्य तरंग है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रकाश एक अनुप्रस्थ तरंग है जो निर्वात में चल सकती है, इसीलिए सूर्य और अन्य तारों का प्रकाश पृथ्वी तक पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वायु में ध्वनि तरंग में वायु के कण संपीडनों के साथ-साथ स्रोत से श्रोता तक चलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि तरंगों में माध्यम के कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">संचरण की दिशा के समांतर आगे-पीछे कंपन</span><span style=\"font-family:'Mangal'\"> करते हैं; ऐसी तरंगें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुदैर्ध्य तरंगें</span><span style=\"font-family:'Mangal'\"> हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सभी तरंगें यांत्रिक नहीं होतीं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश एक अनुप्रस्थ तरंग</span><span style=\"font-family:'Mangal'\"> है जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">माध्यम की आवश्यकता नहीं</span><span style=\"font-family:'Mangal'\"> और जो निर्वात में चल सकती है, इसीलिए सूर्य और अन्य तारों का प्रकाश पृथ्वी तक पहुँचता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">माध्यम के कण तरंग के साथ नहीं चलते</span><span style=\"font-family:'Mangal'\">; वे केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपनी माध्य स्थितियों के इर्द-गिर्द कंपन</span><span style=\"font-family:'Mangal'\"> करते हैं जबकि संपीडन और विरलन आगे बढ़ते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 kg द्रव्यमान की एक वस्तु चिकनी सतह पर 12 m/s के नियत वेग से चल रही है। वह एक खुरदुरे भाग में प्रवेश करती है जहाँ उस पर 6 N का घर्षण बल लगता है, और साथ ही 2 N का एक अतिरिक्त नियत विरोधी बल भी लगता है। विराम में आने से पहले वस्तु खुरदुरे भाग पर जितनी दूरी तय करती है, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों विरोधी बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही दिशा</span><span style=\"font-family:'Mangal'\"> में (गति के विपरीत) लगते हैं, अतः नेट बल का परिमाण उनका </span><span style=\"font-weight:bold;font-family:'Mangal'\">योग</span><span style=\"font-family:'Mangal'\"> है: 6 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 N</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के दूसरे नियम से त्वरण का परिमाण a = F/m = 8 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">, जो वेग के विपरीत दिशा में है (वस्तु धीमी होती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गतिकी समीकरण v² = u² + 2as में u = 12 m/s, v = 0 और a = −2 m/s² रखने पर: 0 = 144 − 4s.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः s = 144 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु विराम में आने से पहले 36 m चलती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जंतु समूह को उसके शारीरिक संगठन से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914069156_image001.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">पोरीफ़ेरा</span><span style=\"font-family:'Mangal'\"> (&#39;छिद्रधारी&#39;): स्पंज </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुकोशिकीय हैं परंतु उनमें ऊतकों और अंगों का संगठन नहीं</span><span style=\"font-family:'Mangal'\"> होता; शरीर के अनेक छिद्रों से जल बहता रहता है, जो भोजन और ऑक्सीजन लाता है &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइडेरिया</span><span style=\"font-family:'Mangal'\"> (हाइड्रा, जेलीफ़िश, प्रवाल): </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊतक स्तर का संगठन</span><span style=\"font-family:'Mangal'\">, शिकार पकड़ने के लिए स्पर्शक और भोजन ग्रहण तथा अपशिष्ट निष्कासन दोनों के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही द्वार</span><span style=\"font-family:'Mangal'\"> &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">निमेटोडा</span><span style=\"font-family:'Mangal'\"> (गोलकृमि): बेलनाकार शरीर जिसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो द्वार, मुख और गुदा</span><span style=\"font-family:'Mangal'\">, तथा अंग-तंत्र स्तर का संगठन &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकाइनोडर्मेटा</span><span style=\"font-family:'Mangal'\"> (&#39;काँटेदार त्वचा&#39;, जैसे तारामछली): </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम कार्बोनेट का बना कठोर आंतरिक कंकाल</span><span style=\"font-family:'Mangal'\"> &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(ii), (b)-(iv), (c)-(i), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक चमकीला भूरे रंग का चूर्ण X चीनी मिट्टी की प्याली में गर्म करने पर सतह से काला हो जाता है। गर्म काले पदार्थ पर हाइड्रोजन गैस प्रवाहित करने पर X का भूरा रंग वापस आ जाता है। X और काला पदार्थ क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबा और कॉपर(II) ऑक्साइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहा और आयरन(III) ऑक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबा और कॉपर सल्फाइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक और ज़िंक ऑक्साइड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ताँबे के चूर्ण को गर्म करने</span><span style=\"font-family:'Mangal'\"> पर उसकी सतह पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">काले कॉपर(II) ऑक्साइड</span><span style=\"font-family:'Mangal'\"> की परत चढ़ जाती है, क्योंकि ताँबे में ऑक्सीजन जुड़ती है: 2Cu + O₂ → 2CuO (ताँबे का ऑक्सीकरण).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गर्म कॉपर(II) ऑक्साइड पर हाइड्रोजन गैस प्रवाहित करने</span><span style=\"font-family:'Mangal'\"> पर काली परत फिर भूरी हो जाती है क्योंकि ताँबा बनता है: CuO + H₂ → Cu + H₂O. यहाँ CuO ऑक्सीजन खोता है (अपचयन) और H₂ ऑक्सीजन प्राप्त करती है (ऑक्सीकरण)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लोहा चमकीला भूरा नहीं होता, ज़िंक ऑक्साइड श्वेत होता है, और वायु में गर्म करने से कॉपर सल्फाइड नहीं बनता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X ताँबा है और काला पदार्थ कॉपर(II) ऑक्साइड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृत्रिम वृक्क (डायलिसिस) में नाइट्रोजनी अपशिष्ट रक्त से अपोहन द्रव में किस प्रक्रिया द्वारा जाते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परासरण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विसरण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सक्रिय परिवहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुनरवशोषण</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृत्रिम वृक्क में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अर्धपारगम्य आस्तर</span><span style=\"font-family:'Mangal'\"> वाली अनेक नलिकाएँ होती हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपोहन द्रव</span><span style=\"font-family:'Mangal'\"> से भरी टंकी में लटकी रहती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस द्रव का परासरण दाब रक्त के समान होता है परंतु इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजनी अपशिष्ट नहीं होते</span><span style=\"font-family:'Mangal'\">, इसलिए अपशिष्ट </span><span style=\"font-weight:bold;font-family:'Mangal'\">विसरण</span><span style=\"font-family:'Mangal'\"> द्वारा रक्त से द्रव में चले जाते हैं, और शुद्ध रक्त रोगी के शरीर में वापस पंप कर दिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृक्क के विपरीत, डायलिसिस में उपयोगी पदार्थों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनरवशोषण नहीं</span><span style=\"font-family:'Mangal'\"> होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अपशिष्ट विसरण द्वारा अपोहन द्रव में जाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्युत हॉट प्लेट 220 V लाइन पर काम करती है और उसमें 22 Ω की दो प्रतिरोध कुंडलियाँ हैं, जिन्हें अलग-अलग, श्रेणीक्रम में या पार्श्वक्रम में प्रयोग किया जा सकता है। तीनों स्थितियों में लाइन से ली गई धारा क्रमशः है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 A, 5 A और 20 A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 A, 20 A और 5 A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 A, 10 A और 20 A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 A, 10 A और 5 A</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओम के नियम से I = V/R: प्रतिरोधक से बहने वाली धारा उसके प्रतिरोध के व्युत्क्रमानुपाती होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">एक कुंडली अलग से प्रयोग करने पर</span><span style=\"font-family:'Mangal'\">: R = 22 Ω, अतः I = 220 / 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कुंडलियाँ श्रेणीक्रम में</span><span style=\"font-family:'Mangal'\">: R = 22 + 22 = 44 Ω, अतः I = 220 / 44 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 A</span><span style=\"font-family:'Mangal'\"> (दोनों कुंडलियों से समान धारा बहती है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कुंडलियाँ पार्श्वक्रम में</span><span style=\"font-family:'Mangal'\">: प्रत्येक कुंडली को पूरा 220 V मिलता है और वह 10 A लेती है; कुल धारा शाखा धाराओं का योग है, I = 10 + 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 A</span><span style=\"font-family:'Mangal'\"> (तुल्य प्रतिरोध 11 Ω).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धाराएँ 10 A, 5 A और 20 A हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निरपेक्ष अपवर्तनांकों की सारणी (जल 1.33, किरोसिन 1.44, तारपीन का तेल 1.47, क्राउन काँच 1.52, हीरा 2.42, वायु 1.0003) पर आधारित निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किरोसिन, तारपीन के तेल और जल में से प्रकाश जल में सबसे तेज़ चलता है, क्योंकि तीनों में जल का अपवर्तनांक सबसे कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. सूचीबद्ध माध्यमों में हीरे का प्रकाशिक घनत्व सबसे अधिक और वायु का सबसे कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. हीरे का अपवर्तनांक 2.42 होने का अर्थ है कि हीरे में प्रकाश की चाल वायु में प्रकाश की चाल की 2.42 गुनी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी माध्यम का निरपेक्ष अपवर्तनांक n = c/v है, अर्थात् वायु (निर्वात) में प्रकाश की चाल और माध्यम में प्रकाश की चाल का अनुपात; अपवर्तनांक जितना कम, उस माध्यम में प्रकाश उतना तेज़ चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जल (1.33) का अपवर्तनांक किरोसिन (1.44) और तारपीन के तेल (1.47) से कम है, अतः तीनों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश जल में सबसे तेज़ चलता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">हीरे (2.42) का प्रकाशिक घनत्व सबसे अधिक</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु (1.0003) का सबसे कम</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अपवर्तनांक 2.42 का अर्थ है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायु में प्रकाश की चाल हीरे में प्रकाश की चाल की 2.42 गुनी</span><span style=\"font-family:'Mangal'\"> है, इसका उल्टा नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्रा अपनी आँखों से लगभग 25 cm दूर रखी पुस्तक पढ़ती है और फिर दूर खड़े एक वृक्ष की ओर देखती है। उसकी आँखों में कौन-सा परिवर्तन होता है जिससे दूर का वृक्ष स्पष्ट दिखाई देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्ष्माभी पेशियाँ सिकुड़ती हैं, नेत्र लेंस मोटा हो जाता है और उसकी फोकस दूरी घट जाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुतली छोटी हो जाती है, जिससे नेत्र लेंस की फोकस दूरी बढ़ जाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पक्ष्माभी पेशियाँ शिथिल होती हैं, नेत्र लेंस पतला हो जाता है और उसकी फोकस दूरी बढ़ जाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेटिना पीछे खिसक जाता है ताकि दूर के वृक्ष का प्रतिबिंब ग्रहण कर सके</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेत्र लेंस की वक्रता </span><span style=\"font-weight:bold;font-family:'Mangal'\">पक्ष्माभी पेशियों</span><span style=\"font-family:'Mangal'\"> द्वारा बदली जा सकती है; वक्रता बदलने से लेंस की </span><span style=\"font-weight:bold;font-family:'Mangal'\">फोकस दूरी</span><span style=\"font-family:'Mangal'\"> बदलती है। इस क्षमता को </span><span style=\"font-weight:bold;font-family:'Mangal'\">समंजन</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पास की पुस्तक पढ़ते समय पक्ष्माभी पेशियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिकुड़ती</span><span style=\"font-family:'Mangal'\"> हैं, लेंस की वक्रता और मोटाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">बढ़ती</span><span style=\"font-family:'Mangal'\"> है, और उसकी फोकस दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">घटती</span><span style=\"font-family:'Mangal'\"> है, जिससे पास की वस्तुएँ स्पष्ट दिखती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूर के वृक्ष को देखने पर पक्ष्माभी पेशियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">शिथिल</span><span style=\"font-family:'Mangal'\"> होती हैं, नेत्र लेंस </span><span style=\"font-weight:bold;font-family:'Mangal'\">पतला</span><span style=\"font-family:'Mangal'\"> हो जाता है, उसकी फोकस दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">बढ़</span><span style=\"font-family:'Mangal'\"> जाती है, और दूर की वस्तु स्पष्ट दिखती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुतली केवल आँख में प्रवेश करने वाले प्रकाश की मात्रा नियंत्रित करती है, और रेटिना खिसकता नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पक्ष्माभी पेशियाँ शिथिल होती हैं और लेंस की फोकस दूरी बढ़ जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम की ओर प्रक्षेपित एक धनावेशित कण (अल्फा कण) चुंबकीय क्षेत्र द्वारा उत्तर की ओर विक्षेपित हो जाता है। चुंबकीय क्षेत्र की दिशा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे की ओर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गतिशील धन आवेश उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">गति की दिशा में धारा</span><span style=\"font-family:'Mangal'\"> के तुल्य है, अतः यहाँ धारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> की ओर है; उस पर बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span><span style=\"font-family:'Mangal'\"> की ओर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लेमिंग के वाम-हस्त नियम</span><span style=\"font-family:'Mangal'\"> से, बाएँ हाथ की तर्जनी, मध्यमा और अँगूठे को परस्पर लंबवत रखने पर तर्जनी चुंबकीय क्षेत्र, मध्यमा धारा और अँगूठा बल की दिशा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मध्यमा को पश्चिम (धारा) और अँगूठे को उत्तर (बल) की ओर रखने पर तर्जनी </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊपर</span><span style=\"font-family:'Mangal'\"> की ओर होती है, अतः चुंबकीय क्षेत्र ऊपर की ओर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(इलेक्ट्रॉन के लिए धारा उसकी गति के विपरीत ली जाती।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चुंबकीय क्षेत्र ऊपर की ओर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के प्रकाश में रखने पर सफ़ेद सिल्वर क्लोराइड धूसर हो जाता है। यह किस प्रकार की अभिक्रिया का उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन अभिक्रिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विस्थापन अभिक्रिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्विविस्थापन अभिक्रिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपघटन अभिक्रिया</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्य के प्रकाश में सिल्वर क्लोराइड, सिल्वर और क्लोरीन में टूट जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2AgCl(s) → 2Ag(s) + Cl₂(g)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही अभिकारक सरल उत्पादों में टूटता है, इसलिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है; यहाँ अपघटन के लिए ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश</span><span style=\"font-family:'Mangal'\"> से मिलती है। धूसर रंग बनी हुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिल्वर धातु</span><span style=\"font-family:'Mangal'\"> के कारण होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संयोजन अभिक्रिया में दो या अधिक अभिकारक मिलकर एक उत्पाद बनाते हैं, जो यहाँ होने वाली अभिक्रिया के ठीक विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अपघटन अभिक्रिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक नर्सरी थोड़े समय में एक ही जनक पौधे के समरूप हज़ारों रोग-मुक्त ऑर्किड पौधे तैयार करना चाहती है। सबसे उपयुक्त विधि है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनक पौधे के पर-परागण से प्राप्त बीजों से पौधे उगाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु निर्माण, जैसा राइज़ोपस में होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुनर्जनन, जनक पौधे को अनेक छोटे टुकड़ों में काटकर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊतक संवर्धन, जिसमें पौधे के वर्धी सिरे की कोशिकाओं को कृत्रिम माध्यम में उगाकर कैलस बनाया जाता है, जिसे हॉर्मोन युक्त माध्यम में स्थानांतरित करने पर पादपक (प्लांटलेट) बनते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऊतक संवर्धन</span><span style=\"font-family:'Mangal'\"> में पौधे के </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्धी सिरे</span><span style=\"font-family:'Mangal'\"> से ऊतक या कोशिकाएँ लेकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कृत्रिम माध्यम</span><span style=\"font-family:'Mangal'\"> में रखी जाती हैं, जहाँ वे तेज़ी से विभाजित होकर कोशिकाओं का एक छोटा समूह बनाती हैं जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैलस</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैलस को वृद्धि और विभेदन के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">हॉर्मोन युक्त एक अन्य माध्यम</span><span style=\"font-family:'Mangal'\"> में स्थानांतरित किया जाता है, और बने </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादपकों</span><span style=\"font-family:'Mangal'\"> को मिट्टी में लगाकर परिपक्व पौधे बनाए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक जनक से रोग-मुक्त परिस्थितियों में अनेक पौधे</span><span style=\"font-family:'Mangal'\"> उगाए जा सकते हैं; यह तकनीक प्रायः ऑर्किड जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">सजावटी पौधों</span><span style=\"font-family:'Mangal'\"> के लिए प्रयोग होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर-परागण से मिले बीजों के पौधे जनक के समरूप नहीं होंगे, और पौधे राइज़ोपस की तरह बीजाणुओं से या प्लैनेरिया की तरह काटे जाने पर प्रजनन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऊतक संवर्धन सबसे उपयुक्त विधि है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समस्थानिक को उसके उपयोग से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914069156_image002.png\" style=\"width: 554px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iii), (d)-(iv)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) यूरेनियम का समस्थानिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">यूरेनियम-235</span><span style=\"font-family:'Mangal'\"> नाभिकीय विद्युत संयंत्र में विद्युत उत्पादन के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाभिकीय रिएक्टर में ईंधन</span><span style=\"font-family:'Mangal'\"> के रूप में प्रयुक्त होता है &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) कोबाल्ट का रेडियोसक्रिय समस्थानिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोबाल्ट-60</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैंसर के विकिरण उपचार</span><span style=\"font-family:'Mangal'\"> में प्रयुक्त होता है &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयोडीन-131</span><span style=\"font-family:'Mangal'\"> का उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">घेंघा और थायरॉइड कैंसर</span><span style=\"font-family:'Mangal'\"> के उपचार में होता है &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन-14</span><span style=\"font-family:'Mangal'\"> का उपयोग पुरातत्व और भूविज्ञान में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राचीन जीवाश्मों और कलाकृतियों की आयु ज्ञात करने</span><span style=\"font-family:'Mangal'\"> में होता है &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(ii), (b)-(i), (c)-(iv), (d)-(iii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रिस-क्रॉस विधि से ऐलुमिनियम आयन (Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\">) और कार्बोनेट आयन (CO₃</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\">) से बने यौगिक का रासायनिक सूत्र है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlCO₃</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₂(CO₃)₃</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₃(CO₃)₂</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al(CO₃)₃</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक का सूत्र लिखने के लिए पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">धनायन</span><span style=\"font-family:'Mangal'\"> का और फिर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऋणायन</span><span style=\"font-family:'Mangal'\"> का प्रतीक लिखते हैं, प्रतीकों के नीचे उनके आवेश लिखते हैं, और आवेश-संख्याओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिस-क्रॉस</span><span style=\"font-family:'Mangal'\"> करते हैं: Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> और CO₃</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> → 3 कार्बोनेट के पास और 2 ऐलुमिनियम के पास जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब एक ही प्रकार के दो या अधिक बहुपरमाणुक आयन हों तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोष्ठक</span><span style=\"font-family:'Mangal'\"> लगाते हैं, अतः तीन कार्बोनेट आयनों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">(CO₃)₃</span><span style=\"font-family:'Mangal'\"> लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al₂(CO₃)₃</span><span style=\"font-family:'Mangal'\"> है। जाँच: कुल धन आवेश 2 × (+3) = +6 और कुल ऋण आवेश 3 × (−2) = −6, अतः यौगिक उदासीन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यौगिक के सूत्र में आयनों के आवेश नहीं दर्शाए जाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सूत्र Al₂(CO₃)₃ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातुओं की जल से अभिक्रिया के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कैल्सियम जल में तैरने लगता है क्योंकि बनने वाली हाइड्रोजन गैस के बुलबुले धातु की सतह से चिपक जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मैग्नीशियम ठंडे जल से अभिक्रिया करके मैग्नीशियम हाइड्रॉक्साइड और हाइड्रोजन बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. सीसा, ताँबा, चाँदी और सोना जैसी धातुएँ जल से बिल्कुल अभिक्रिया नहीं करतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कैल्सियम जल से सोडियम और पोटैशियम की तुलना में कम तीव्रता से अभिक्रिया करता है: Ca + 2H₂O → Ca(OH)₂ + H₂, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन के बुलबुले सतह से चिपकने के कारण वह तैरने लगता है</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैग्नीशियम ठंडे जल से अभिक्रिया नहीं करता</span><span style=\"font-family:'Mangal'\">; वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">गर्म जल</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करके मैग्नीशियम हाइड्रॉक्साइड और हाइड्रोजन बनाता है (और फिर उसी कारण तैरता है) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीसा, ताँबा, चाँदी और सोना जैसी धातुएँ जल से बिल्कुल अभिक्रिया नहीं करतीं</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मटर की एक कली से पुंकेसर हटाकर उसे मलमल की थैली से ढक दिया जाता है। इस फूल से फल नहीं बनता। इसका सबसे संभावित कारण है कि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसके वर्तिकाग्र तक कोई परागकण नहीं पहुँच सका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैली ने सूर्य का प्रकाश रोक दिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थैली ने फूल तक पानी पहुँचने से रोक दिया</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फूल में अंडाशय नहीं था</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पुंकेसर</span><span style=\"font-family:'Mangal'\"> हटाने से फूल के अपने परागकण हट जाते हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">मलमल की थैली</span><span style=\"font-family:'Mangal'\"> बाहर के परागकणों को वर्तिकाग्र तक पहुँचने से रोक देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्तिकाग्र तक कोई परागकण नहीं पहुँचता</span><span style=\"font-family:'Mangal'\">, परागण नहीं हो पाता, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">फल नहीं बनता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस कली पर थैली लगाई गई हो परंतु पुंकेसर बने रहें, उससे फल बनता है; अतः थैली सूर्य का प्रकाश या पानी रोककर फल बनना नहीं रोकती, और फूल में अंडाशय होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे पता चलता है कि फल बनने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">परागकणों का वर्तिकाग्र तक स्थानांतरण</span><span style=\"font-family:'Mangal'\"> आवश्यक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः फल इसलिए नहीं बनता क्योंकि वर्तिकाग्र तक कोई परागकण नहीं पहुँच सका </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): लंबी प्रयास भुजा वाले उत्तोलक (लीवर) से छोटे प्रयास द्वारा भारी भार उठाया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): उत्तोलक भार उठाने के लिए किए जाने वाले कुल कार्य को कम कर देता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तोलक के लिए यांत्रिक लाभ = भार / प्रयास = </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रयास भुजा / भार भुजा</span><span style=\"font-family:'Mangal'\">; प्रयास भुजा बढ़ाने पर उसी भार को हिलाने के लिए आवश्यक प्रयास कम हो जाता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु प्रयास, छोटा होते हुए भी, </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक दूरी तक चलना</span><span style=\"font-family:'Mangal'\"> पड़ता है, अतः प्रयास लगाने वाले द्वारा किया गया </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुल कार्य समान ही रहता है</span><span style=\"font-family:'Mangal'\"> → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तोलक किसी कार्य के लिए आवश्यक </span><span style=\"font-weight:bold;font-family:'Mangal'\">बल</span><span style=\"font-family:'Mangal'\"> को कम करता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुल कार्य को नहीं</span><span style=\"font-family:'Mangal'\">; मशीनें ऊर्जा उत्पन्न नहीं करतीं, वे केवल उसका अधिक प्रभावी उपयोग करने में सहायता करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़्लास्क में जल के ऊपर तार की जाली पर रखे अंकुरित सेम के बीजों को एक ओर से खुले डिब्बे में रखा जाता है, ताकि प्रकाश उसी ओर से आए। दो-तीन दिन बाद प्ररोह प्रकाश की ओर मुड़ जाते हैं। अब फ़्लास्क को इस प्रकार घुमाया जाता है कि प्ररोह प्रकाश से दूर की ओर हों, और उसे कुछ दिन बिना छेड़े छोड़ दिया जाता है। क्या प्रेक्षण होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरा प्ररोह, अपने पुराने मुड़े भाग सहित, सीधा होकर फिर प्रकाश की ओर मुड़ जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्ररोह और जड़ के पुराने भाग अपनी दिशा नहीं बदलते, परंतु नई वृद्धि फिर से प्रकाश की ओर मुड़ती है, जिससे पता चलता है कि प्रकाशानुवर्ती मुड़ाव नई वृद्धि द्वारा होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्ररोह बढ़ना पूरी तरह बंद कर देते हैं, क्योंकि पौधा प्रकाश की दिशा में दूसरे परिवर्तन की अनुक्रिया नहीं कर सकता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब जड़ें प्रकाश की ओर मुड़ती हैं जबकि प्ररोह उससे दूर मुड़ते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ओर से आते प्रकाश में दो-तीन दिन बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्ररोह प्रकाश की ओर और जड़ें प्रकाश से दूर मुड़ जाती हैं</span><span style=\"font-family:'Mangal'\">। यह प्रकाशानुवर्तन है, एक दिशात्मक (अनुवर्ती) वृद्धि गति।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़्लास्क को घुमाकर प्ररोहों को प्रकाश से दूर की ओर करने और बिना छेड़े छोड़ने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्ररोह और जड़ के पुराने भाग अपनी दिशा नहीं बदलते</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">नई वृद्धि प्रकाश की ओर दिशा बदलती है</span><span style=\"font-family:'Mangal'\">, जिससे पता चलता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाशानुवर्ती मुड़ाव नई वृद्धि द्वारा होता है</span><span style=\"font-family:'Mangal'\">। यह गति वृद्धि के कारण होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जड़ें सदैव प्रकाश से दूर मुड़ती हैं, अतः विकल्प D गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नई वृद्धि प्रकाश की ओर मुड़ती है जबकि पुराने भाग वैसे ही रहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सूर्य के हानिकारक पराबैंगनी विकिरण को अवशोषित करने वाली ओज़ोन परत समताप मंडल में स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): क्षोभ मंडल औसतन लगभग 12 km की ऊँचाई तक फैला है, और यही वह परत है जिसमें मौसम बनता है और ऊँचाई के साथ ताप घटता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">समताप मंडल</span><span style=\"font-family:'Mangal'\"> (लगभग 12–50 km) वह परत है जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओज़ोन परत UV विकिरण को अवशोषित करती है</span><span style=\"font-family:'Mangal'\"> और ऊँचाई के साथ ताप बढ़ता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्षोभ मंडल</span><span style=\"font-family:'Mangal'\"> की औसत ऊँचाई लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km</span><span style=\"font-family:'Mangal'\"> है; यह पृथ्वी की सतह से गर्म होता है, इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">मौसम बनता है</span><span style=\"font-family:'Mangal'\">, और इसका ताप </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊँचाई के साथ घटता है</span><span style=\"font-family:'Mangal'\"> (लगभग 6.5°C प्रति km) → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु R क्षोभ मंडल, एक भिन्न परत, का वर्णन करता है; यह नहीं समझाता कि ओज़ोन परत समताप मंडल में क्यों है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वसंत में जड़ों में संचित शर्करा ऊपर कलियों तक जाती है; ग्रीष्म में पत्तियों में बनी शर्करा नीचे जड़ों तक जाती है। भोजन का यह परिवहन होता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम द्वारा, केवल ऊपर की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम द्वारा, ऊपर और नीचे दोनों ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लोएम द्वारा, केवल नीचे की ओर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लोएम द्वारा, ऊपर और नीचे दोनों ओर</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों में भोजन (शर्करा) के परिवहन को </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थानांतरण</span><span style=\"font-family:'Mangal'\"> कहते हैं, और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लोएम</span><span style=\"font-family:'Mangal'\"> में होता है; जाइलम जल और खनिज ले जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुक्रोज़ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ATP</span><span style=\"font-family:'Mangal'\"> की ऊर्जा से फ्लोएम में भेजा जाता है; फिर जल परासरण द्वारा प्रवेश करके दाब बढ़ाता है, जिससे पदार्थ कम दाब वाले ऊतकों की ओर चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए फ्लोएम पौधे की आवश्यकता के अनुसार भोजन को </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोनों दिशाओं</span><span style=\"font-family:'Mangal'\"> में ले जा सकता है: वसंत में ऊपर कलियों तक और ग्रीष्म में नीचे जड़ों तक।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भोजन फ्लोएम द्वारा ऊपर और नीचे दोनों ओर जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औद्योगिक उपयोग के लिए दिया जाने वाला एथेनॉल नीला रंगा जाता है और उसमें थोड़ी मात्रा में एक विषैला पदार्थ मिलाया जाता है, और तब उसे विकृत ऐल्कोहॉल (डिनेचर्ड ऐल्कोहॉल) कहते हैं। इस प्रथा के विषय में निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीला रंग ऐल्कोहॉल को पीने के अयोग्य बनाता है, जबकि मेथेनॉल केवल रंग देने के लिए मिलाया जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेनॉल इसलिए मिलाया जाता है क्योंकि वह एथेनॉल से अधिक स्वच्छ ईंधन है और जलने पर केवल कार्बन डाइऑक्साइड और जल देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेथेनॉल इसे पीने के अयोग्य बनाने के लिए मिलाया जाता है, और रंग पहचान के लिए मिलाया जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकृत ऐल्कोहॉल थोड़ी मात्रा में पीना सुरक्षित है क्योंकि एथेनॉल मेथेनॉल के प्रभाव को उदासीन कर देता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औद्योगिक एथेनॉल के दुरुपयोग को रोकने के लिए उसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेथेनॉल जैसे विषैले पदार्थ मिलाकर उसे पीने के अयोग्य</span><span style=\"font-family:'Mangal'\"> बनाया जाता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहचान के लिए रंग मिलाकर उसे नीला</span><span style=\"font-family:'Mangal'\"> किया जाता है। यही विकृत ऐल्कोहॉल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मेथेनॉल की बहुत थोड़ी मात्रा भी मृत्यु का कारण बन सकती है</span><span style=\"font-family:'Mangal'\">: </span><span style=\"font-weight:bold;font-family:'Mangal'\">यकृत में मेथेनॉल का ऑक्सीकरण मेथेनैल
