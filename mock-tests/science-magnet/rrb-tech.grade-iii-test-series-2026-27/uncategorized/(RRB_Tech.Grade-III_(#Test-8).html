margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WM9 → W + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">, M + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">; 9 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\"> → ZS36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZR36 (R = M + 5), YS36 (Y = W + 2) और ZS32 (32 ≠ 9 × 4) में एक-एक भाग नियम तोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः WM9, </span><span style=\"font-weight:bold;font-family:'Mangal'\">ZS36 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ बक्से J, K, L, M, N, O, P और Q एक के ऊपर एक रखे हैं, परंतु आवश्यक नहीं कि इसी क्रम में हों। K ऊपर से चौथे स्थान पर रखा है। K और P के बीच केवल दो बक्से रखे हैं। P और N के बीच केवल L रखा है। N और J के बीच केवल तीन बक्से रखे हैं। M, O के ठीक ऊपर रखा है। Q, M के नीचे किसी स्थान पर रखा है। J सबसे ऊपर नहीं रखा है। N और O के बीच कितने बक्से रखे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों को 1 (ऊपर) से 8 (नीचे) तक क्रमांक दें। K ऊपर से चौथा → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K और P के बीच दो बक्से → P = 1 या P = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और N के बीच केवल L → N, P से 2 स्थान दूर और L बीच में। दोनों स्थितियाँ जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति P = 7: N = 5, L = 6 (N = 9 असंभव). N और J के बीच तीन बक्से → J = 1 या 9 → J = 1, परंतु J सबसे ऊपर नहीं है ✗.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति P = 1: N = 3, L = 2. N और J के बीच तीन बक्से → </span><span style=\"font-weight:bold;font-family:'Mangal'\">J = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष स्थान 5, 6, 8 पर M, O, Q: M, O के ठीक ऊपर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">M = 5, O = 6</span><span style=\"font-family:'Mangal'\">, और Q = 8, M के नीचे ✓.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम (ऊपर → नीचे): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P, L, N, K, M, O, J, Q</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N (3) और O (6) के बीच के बक्से: K और M → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः N और O के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो (विकल्प C)</span><span style=\"font-family:'Mangal'\"> बक्से रखे हैं।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UP - WK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GK - IE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RT - TN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MB - OV</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GK − IE: G + 2 = I, K − 6 = E → (+2, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RT − TN: R + 2 = T, T − 6 = N → (+2, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MB − OV: M + 2 = O, B − 6 = V (2 − 6 = −4 → 26 − 4 = 22 = V) → (+2, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UP − WK: U + 2 = W, P − 5 = K → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, −5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (+2, −6) का पालन करते हैं; केवल UP − WK नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">UP - WK (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, W का भाई है। W, R का पिता है। T, J का पिता है। J, R का पुत्र है। J का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री का पति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पुत्री का पति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री का पुत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पुत्री का पुत्र</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, J का पिता है और J, R का पुत्र है → T और R, J के दो माता-पिता हैं, अर्थात् T और R पति-पत्नी हैं; T पिता है, अतः R, J की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता</span><span style=\"font-family:'Mangal'\"> है (R स्त्री है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W, R का पिता है → R, W की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुत्री</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, W का भाई है → P और W के माता-पिता एक ही हैं → R, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पुत्री</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J, R का पुत्र है → J, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पुत्री का पुत्र</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: J, R का पुत्र है, पति नहीं (विकल्प A और B), और R, W की पुत्री है, P की नहीं (विकल्प C)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः J, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पुत्री का पुत्र (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह समुच्चय चुनिए जिसमें संख्याएँ उसी प्रकार संबंधित हैं जिस प्रकार निम्नलिखित समुच्चयों की संख्याएँ संबंधित हैं। (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5, 8, 33)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 4, 53)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 3, 68)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4, 10, 24)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 9, 45)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 2, 84)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5, 8, 33): 5² = 25; 25 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 4, 53): 7² = 49; 49 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">53</span><span style=\"font-family:'Mangal'\"> → नियम: तीसरी संख्या = (पहली संख्या)</span><span style=\"font-weight:bold;font-family:'Mangal'\">²</span><span style=\"font-family:'Mangal'\"> + दूसरी संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 3, 68): 8² + 3 = 64 + 3 = 67 ≠ 68 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4, 10, 24): 4² + 10 = 16 + 10 = 26 ≠ 24 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 9, 45): 6² + 9 = 36 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 2, 84): 9² + 2 = 81 + 2 = 83 ≠ 84 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समुच्चय </span><span style=\"font-weight:bold;font-family:'Mangal'\">(6, 9, 45) (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ मित्र अमित, बेला, चिराग, दिव्या, ईशा, फ़रहान, गोपाल और हिना एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। चिराग, अमित के दाईं ओर तीसरे स्थान पर बैठा है। चिराग और हिना के बीच केवल एक व्यक्ति बैठा है। बेला, हिना के दाईं ओर दूसरे स्थान पर बैठी है। ईशा, बेला के ठीक बाईं ओर बैठी है। दिव्या, ईशा के दाईं ओर तीसरे स्थान पर बैठी है। फ़रहान, हिना के ठीक बाईं ओर बैठा है। गोपाल के बाईं ओर तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिराग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेला</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिव्या</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईशा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख केंद्र की ओर है, अतः ‘दाएँ’ = दक्षिणावर्त (clockwise) और ‘बाएँ’ = वामावर्त (anticlockwise)। सीटों को दक्षिणावर्त 1 से 8 तक क्रमांक दें, </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमित सीट 1 पर</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिराग, अमित के दाईं ओर तीसरे स्थान पर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">चिराग = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिराग और हिना के बीच एक व्यक्ति → हिना = 4 + 2 = 6 या 4 − 2 = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेला, हिना के दाईं ओर दूसरे स्थान पर → बेला = हिना + 2: यदि हिना = 2 हो, तो बेला = 4 = चिराग की सीट ✗ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिना = 6, बेला = 8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईशा, बेला के ठीक बाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ईशा = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिव्या, ईशा के दाईं ओर तीसरे स्थान पर → 7 + 3 = 10 → सीट 10 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> → दिव्या = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़रहान, हिना के ठीक बाईं ओर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़रहान = 5</span><span style=\"font-family:'Mangal'\">; शेष सीट 3 </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोपाल</span><span style=\"font-family:'Mangal'\"> की है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (अमित से दक्षिणावर्त): </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमित – दिव्या – गोपाल – चिराग – फ़रहान – हिना – ईशा – बेला</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोपाल (सीट 3) के बाईं ओर (वामावर्त) तीसरा: दिव्या (पहली), अमित (दूसरा), </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेला</span><span style=\"font-family:'Mangal'\"> (तीसरी)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गोपाल के बाईं ओर तीसरे स्थान पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">बेला (विकल्प B)</span><span style=\"font-family:'Mangal'\"> बैठी है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZKC XLE UMH QNL ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LOP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LOQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOQ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPQ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: Z → X → U → Q: −2, −3, −4 → अगला </span><span style=\"font-weight:bold;font-family:'Mangal'\">−5</span><span style=\"font-family:'Mangal'\"> → Q − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: K → L → M → N: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\"> → N + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: C → E → H → L: +2, +3, +4 → अगला </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → L + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LOP, MOQ और LPQ में LOQ से एक-एक अक्षर भिन्न है, अतः वे पैटर्न का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">LOQ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख किए विद्यार्थियों की एक कतार में रवि आगे से 9वें और प्रिया पीछे से 7वें स्थान पर है। जब रवि और प्रिया अपने स्थान आपस में बदल लेते हैं, तो रवि आगे से 15वें स्थान पर हो जाता है। कतार में कुल कितने विद्यार्थी हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थान बदलने के बाद रवि वहाँ खड़ा है जहाँ प्रिया खड़ी थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि का नया स्थान आगे से 15वाँ → प्रिया का मूल स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">आगे से 15वाँ</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रिया </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे से 7वें</span><span style=\"font-family:'Mangal'\"> स्थान पर भी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल विद्यार्थी = (आगे से स्थान) + (पीछे से स्थान) − 1 = 15 + 7 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(रवि का मूल स्थान, 9वाँ, गिनती के लिए आवश्यक नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कतार में </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> विद्यार्थी हैं।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित संख्या-युग्मों में, पहली संख्या पर कुछ गणितीय संक्रियाएँ करके दूसरी संख्या प्राप्त की गई है। X और Y के स्थान पर कौन-सी संख्याएँ आनी चाहिए ताकि :: के बाईं ओर की दो संख्याओं का पैटर्न वही हो जो :: के दाईं ओर की दो संख्याओं का है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X : 29 :: 20 : Y</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 12, Y = 45</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 12, Y = 40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 14, Y = 45</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 10, Y = 50</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही संक्रिया से X से 29 और 20 से Y बनना चाहिए। प्रत्येक विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 12, Y = 45: 12 × 2 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span><span style=\"font-family:'Mangal'\"> और 20 × 2 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span><span style=\"font-family:'Mangal'\"> → एक ही नियम (</span><span style=\"font-weight:bold;font-family:'Mangal'\">× 2 + 5</span><span style=\"font-family:'Mangal'\">) दोनों ओर काम करता है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 12, Y = 40: 12 × 2 + 5 = 29 परंतु 20 × 2 + 5 = 45 ≠ 40 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 14, Y = 45: 14 × 2 + 1 = 29 परंतु 20 × 2 + 1 = 41 ≠ 45 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X = 10, Y = 50: 10 × 3 − 1 = 29 परंतु 20 × 3 − 1 = 59 ≠ 50 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल विकल्प A में एक ही नियम दोनों युग्मों पर लागू होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">X = 12, Y = 45 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला क्रम के आधार पर, निम्नलिखित चार में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QSV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHK</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QSV: Q + 2 = S, S + 3 = V → (+2, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPS: N + 2 = P, P + 3 = S → (+2, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FHK: F + 2 = H, H + 3 = K → (+2, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG: C + 2 = E, E + 2 = G → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+2, +3) का पालन करते हैं; केवल CEG नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">CEG (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित त्रिकों में, अक्षरों का प्रत्येक समूह एक निश्चित तर्क के अनुसार अगले समूह से संबंधित है। दिए गए विकल्पों में से वह त्रिक चुनिए जो उसी तर्क का पालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IRON - NORI - RION</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILE - ELIM - IMLE</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">REST - TSER - ERST</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HOPE - HPEO - EPHO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIND - DINF - FNID</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN - PALN - PLNA</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IRON → NORI: शब्द को </span><span style=\"font-weight:bold;font-family:'Mangal'\">उल्टा</span><span style=\"font-family:'Mangal'\"> लिखा गया है (I R O N → N O R I)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IRON → RION: मूल शब्द के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहले दो अक्षर आपस में बदले</span><span style=\"font-family:'Mangal'\"> गए हैं (I R → R I), शेष वही (O N)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILE → ELIM (उल्टा) → IMLE (M I → I M, फिर L E) → वही नियम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">REST → TSER (उल्टा ✓) → ERST (R E → E R, फिर S T ✓) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HOPE → HPEO: HOPE का उल्टा EPOH है, HPEO नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIND → DINF (उल्टा ✓) → FNID: F I बदलने पर IFND बनता है, FNID नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN → PALN: PLAN का उल्टा NALP है, PALN नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्रिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">REST - TSER - ERST (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि '+' का अर्थ 'घटाना', '−' का अर्थ 'गुणा', '×' का अर्थ 'भाग' और '÷' का अर्थ 'जोड़' है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 − 2 + (48 × 3) ÷ 14 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्नों को उनके अर्थ से बदलें: 12 × 2 − 48 ÷ 3 + 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (पहले ÷ और ×): 12 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span><span style=\"font-family:'Mangal'\">; 48 ÷ 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 24 − 16 + 14 = 8 + 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई अक्षर शृंखला को देखिए और प्रश्न का उत्तर दीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) R A V I N D R A N A T H T A G O R E B H A R A T (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला के बाईं ओर छोर से छठे अक्षर और दाएँ ont-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी पेन किताबें हैं। कोई किताब कुर्सी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कोई पेन कुर्सी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ किताबें पेन नहीं हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: पेन का वृत्त किताब के वृत्त के पूरी तरह अंदर है (सभी पेन किताबें हैं), और कुर्सी का वृत्त किताब के वृत्त से पूरी तरह बाहर है (कोई किताब कुर्सी नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कोई पेन कुर्सी नहीं है → प्रत्येक पेन किताब के अंदर है और कोई कुर्सी किताब के अंदर नहीं है, अतः कोई पेन कुर्सी नहीं हो सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ किताबें पेन नहीं हैं → पेन का वृत्त किताब के वृत्त के ठीक बराबर भी हो सकता है (सभी किताबें पेन हो सकती हैं); कथन इसे नहीं रोकते → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति अखिल, बिनोद, चारु, दीपक, एकता, फ़िरोज़, गौरव और हीरा एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं। एकता के बाईं ओर केवल तीन व्यक्ति बैठे हैं। बिनोद, एकता का निकटतम पड़ोसी है और अखिल के दाईं ओर तीसरे स्थान पर बैठा है। दीपक, चारु के बाईं ओर तीसरे स्थान पर बैठा है। फ़िरोज़, चारु का निकटतम पड़ोसी नहीं है। चारु, हीरा के बाईं ओर दूसरे स्थान पर बैठा है। पंक्ति के सबसे बाएँ छोर पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीपक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिनोद</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अखिल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़िरोज़</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी का मुख उत्तर की ओर है, अतः बाएँ-दाएँ वैसे ही हैं जैसे हम देखते हैं। सीटों को बाएँ से दाएँ 1 से 8 तक क्रमांक दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एकता के बाईं ओर केवल तीन व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकता = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिनोद, एकता का पड़ोसी (सीट 3 या 5) है और अखिल के दाईं ओर तीसरे स्थान पर है → बिनोद = 3 होने पर अखिल सीट 0 पर आएगा, असंभव → </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिनोद = 5, अखिल = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारु, हीरा के बाईं ओर दूसरे स्थान पर और दीपक, चारु के बाईं ओर तीसरे स्थान पर → दीपक, चारु, हीरा की सीटें (c − 3, c, c + 2)। खाली सीटें 1, 3, 6, 7, 8 हैं → केवल c = 6 संभव → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दीपक = 3, चारु = 6, हीरा = 8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़िरोज़ और गौरव सीट 1 और 7 लेते हैं; फ़िरोज़, चारु (सीट 6) का पड़ोसी नहीं है → फ़िरोज़ ≠ 7 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़िरोज़ = 1, गौरव = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़िरोज़ – अखिल – दीपक – एकता – बिनोद – चारु – गौरव – हीरा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे बाएँ छोर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ़िरोज़ (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह त्रिक चुनिए जो नीचे दिए गए दो त्रिकों के समान पैटर्न का पालन करता है। दोनों त्रिक एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK-MM-JO</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TF-QH-NJ</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB-TD-QF</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB-TD-QE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB-UD-RF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XB-UD-RG</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK → MM → JO: पहले अक्षर P − 3 = M, M − 3 = J; दूसरे अक्षर K + 2 = M, M + 2 = O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TF → QH → NJ: T − 3 = Q, Q − 3 = N; F + 2 = H, H + 2 = J → नियम: प्रत्येक चरण में पहला अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\">, दूसरा अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB → TD → QF: W − 3 = T, B + 2 = D; T − 3 = Q, D + 2 = F ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB → TD → QE: D + 2 = F है, E नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WB → UD: W − 3 = T है, U नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XB → UD → RG: D + 2 = F है, G नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्रिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">WB-TD-QF (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चहक बिंदु A से चलकर 6 m दक्षिण की ओर जाती है। फिर वह बाएँ मुड़कर 5 m चलती है। फिर वह पुनः बाएँ मुड़कर 9 m चलती है। एक बार फिर वह बाएँ मुड़कर 2 m चलती है। अंत में वह एक बार और बाएँ मुड़कर 3 m चलती है और बिंदु B पर रुकती है। बिंदु A पर फिर से पहुँचने के लिए उसे किस दिशा में चलना चाहिए? (जब तक अन्यथा न कहा जाए, सभी मोड़ 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 m दक्षिण → (0, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख करके बाईं ओर मुड़ना → पूर्व, 5 m → (5, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख करके बाईं ओर मुड़ना → उत्तर, 9 m → (5, 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख करके बाईं ओर मुड़ना → पश्चिम, 2 m → (3, 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम की ओर मुख करके बाईं ओर मुड़ना → दक्षिण, 3 m → B = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">3, 0</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, A से ठीक 3 m पूर्व में है, अतः A पर पहुँचने के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> की ओर चलना होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> की ओर चलना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में \"QEHU\" को \"153\" और \"ZBKN\" को \"159\" लिखा जाता है। उसी भाषा में \"SWGJ\" का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">165</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">177</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">169</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">171</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला में अक्षरों के स्थान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QEHU: Q = 17, E = 5, H = 8, U = 21 → योग = 51; 51 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">153</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZBKN: Z = 26, B = 2, K = 11, N = 14 → योग = 53; 53 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">159</span><span style=\"font-family:'Mangal'\"> → नियम: कूट = (अक्षरों के स्थानों का योग) </span><span style=\"font-weight:bold;font-family:'Mangal'\">× 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SWGJ: S = 19, W = 23, G = 7, J = 10 → योग = 59; 59 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">177</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 165 = 55 × 3, 169 तीन का गुणज नहीं है, 171 = 57 × 3. कोई भी योग 59 के संगत नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः \"SWGJ\" का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">177 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹7,450 की धनराशि P, Q और R में इस प्रकार बाँटी जाती है कि यदि उनके हिस्सों में क्रमशः ₹150, ₹250 और ₹350 की वृद्धि कर दी जाए, तो नई राशियाँ 2 : 3 : 5 के अनुपात में हो जाती हैं। Q का मूल हिस्सा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,460</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,490</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,050</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,210</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृद्धि के बाद कुल राशि = 7,450 + (150 + 250 + 350) = 7,450 + 750 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बढ़ी हुई राशियाँ 2 : 3 : 5 के अनुपात में हैं, कुल भाग = 2 + 3 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक भाग = 8,200 / 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹820</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q की बढ़ी हुई राशि = 3 × 820 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,460</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q का मूल हिस्सा = 2,460 − 250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,210</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: P = 2 × 820 − 150 = 1,490; R = 5 × 820 − 350 = 3,750; 1,490 + 2,210 + 3,750 = 7,450 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः Q का मूल हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,210 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति ने दो प्रकार के सेब खरीदे, एक ₹2 में 3 सेब की दर से और दूसरा ₹6 प्रति सेब की दर से। उसने प्रत्येक प्रकार के समान संख्या में सेब खरीदे और सभी सेब ₹6 प्रति सेब की दर से बेच दिए। उसका लाभ प्रतिशत ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">78%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">77%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक प्रकार के समान संख्या में सेब लें, मान लीजिए प्रत्येक प्रकार के 3 सेब (3 का गुणज लेने से पहली लागत पूर्ण संख्या रहती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले प्रकार के 3 सेबों की लागत = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे प्रकार के 3 सेबों की लागत = 3 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 सेबों का कुल क्रय मूल्य = 2 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 सेबों का कुल विक्रय मूल्य = 6 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ = 36 − 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ % = 16 / 20 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसका लाभ प्रतिशत </span><span style=\"font-weight:bold;font-family:'Mangal'\">80% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 विद्यार्थियों का औसत भार 1.5 kg बढ़ जाता है जब 45 kg भार वाले एक विद्यार्थी के स्थान पर एक नया विद्यार्थी आ जाता है। नए विद्यार्थी का भार क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">62 kg</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्यार्थियों की संख्या 10 ही रहती है, और औसत 1.5 kg बढ़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भार में वृद्धि = 10 × 1.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 45 kg वाला विद्यार्थी बदला गया है, अतः नए विद्यार्थी का भार जाने वाले विद्यार्थी से 15 kg अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए विद्यार्थी का भार = 45 + 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: नया सदस्य = पुराना सदस्य + (संख्या × औसत में वृद्धि) = 45 + 10 × 1.5 = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नए विद्यार्थी का भार </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 kg (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमित अकेला एक दीवार 36 घंटे में बना सकता है, जबकि बिमल अमित से तीन गुना तेज काम करता है। पहले घंटे में अमित अकेला काम करता है, दूसरे घंटे में बिमल अकेला काम करता है, और तीसरे घंटे में दोनों साथ काम करते हैं। यदि वे इसी क्रम में काम करते रहें, तो दीवार कितने घंटों में पूरी होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमित का 1 घंटे का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/36</span><span style=\"font-family:'Mangal'\">; बिमल तीन गुना तेज है, अतः उसका 1 घंटे का काम = 3/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों का मिलकर 1 घंटे का काम = 1/36 + 3/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक 3-घंटे के चक्र (अमित, फिर बिमल, फिर दोनों) में काम = 1/36 + 3/36 + 4/36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 चक्रों (12 घंटे) के बाद: (4 × 8) / 36 = 32/36, शेष काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13वाँ घंटा (अमित अकेला): 1/36 काम → शेष = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14वाँ घंटा (बिमल अकेला): 3/36 काम → शेष = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दीवार ठीक 14वें घंटे के अंत में पूरी होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दीवार </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> घंटों में पूरी होगी।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गिरीश ने एक परीक्षा में 664 अंक प्राप्त किए और वह अधिकतम अंकों के 84% से 8 अंक कम था। उसी परीक्षा में उसके मित्र ने 472 अंक प्राप्त किए। उसके मित्र द्वारा प्राप्त अंकों का प्रतिशत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गिरीश 84% से 8 अंक कम था, अतः अधिकतम अंकों का 84% = 664 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकतम अंक M लें: (M × 84) / 100 = 672</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M = (672 × 100) / 84 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मित्र का प्रतिशत = 472 / 800 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">59%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 800 का 59% = 472 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मित्र ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">59% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> अंक प्राप्त किए।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालिका में एक वर्ष में पाँच कंपनियों A, B, C, D और E की आय और व्यय (₹ मिलियन में) दिए गए हैं। लाभ या हानि = आय − व्यय।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914437428_image001.png\" width=\"269\" height=\"85\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंपनियों B और C के संयुक्त लाभ या हानि का कंपनियों A और E के संयुक्त लाभ या हानि से अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 : 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 : 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक कंपनी का लाभ या हानि = आय − व्यय (₹ मिलियन):</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B = 180 − 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20</span><span style=\"font-family:'Mangal'\"> (20 की हानि); C = 220 − 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60</span><span style=\"font-family:'Mangal'\"> (60 का लाभ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और C का संयुक्त परिणाम = −20 + 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+40</span><span style=\"font-family:'Mangal'\"> (40 का लाभ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 150 − 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+30</span><span style=\"font-family:'Mangal'\">; E = 200 − 170 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और E का संयुक्त परिणाम = 30 + 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60</span><span style=\"font-family:'Mangal'\"> (60 का लाभ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट अनुपात = 40 : 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 3 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹6,300 की धनराशि रवि और श्याम के बीच बाँटी जाती है। रवि अपना हिस्सा 10% वार्षिक चक्रवृद्धि ब्याज (वार्षिक संयोजित) पर 2 वर्ष के लिए निवेश करता है, जबकि श्याम अपना हिस्सा उसी दर पर 3 वर्ष के लिए निवेश करता है। यदि दोनों को अपनी-अपनी निवेश अवधि के अंत में समान मिश्रधन प्राप्त होता है, तो रवि का हिस्सा (₹ में) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,150</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि का हिस्सा ₹x और श्याम का हिस्सा ₹(6,300 − x) लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10% वार्षिक चक्रवृद्धि ब्याज पर मिश्रधन प्रति वर्ष 1.1 से गुणित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्ष बाद रवि का मिश्रधन = x × (1.1)²; 3 वर्ष बाद श्याम का मिश्रधन = (6,300 − x) × (1.1)³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान मिश्रधन: x × (1.1)² = (6,300 − x) × (1.1)³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पक्षों को (1.1)² से भाग दें: x = (6,300 − x) × 1.1 → x = 6,930 − 1.1x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.1x = 6,930 → x = 6,930 / 2.1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,300</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्याम का हिस्सा = 6,300 − 3,300 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 3,300 × 1.21 = 3,993 और 3,000 × 1.331 = 3,993 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: रवि : श्याम = (1 + R/100) : 1 = 11 : 10, अतः रवि का हिस्सा = (6,300 × 11) / 21 = 3,300</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रवि का हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,300 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक टैंक का तीन-आठवाँ भाग पेट्रोल से भरा है, शेष भाग का दो-पाँचवाँ भाग डीज़ल से भरा है, फिर भी शेष बचे भाग का तीन-चौथाई भाग मिट्टी के तेल से भरा है और शेष 12 लीटर पानी है। टैंक की क्षमता क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">128 लीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 लीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 लीटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">144 लीटर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टैंक की क्षमता C लीटर लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेट्रोल = 3C/8, अतः शेष भाग = C − 3C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5C/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डीज़ल = 5C/8 का 2/5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/4</span><span style=\"font-family:'Mangal'\">, अतः शेष भाग = 5C/8 − C/4 = 5C/8 − 2C/8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3C/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिट्टी का तेल = 3C/8 का 3/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9C/32</span><span style=\"font-family:'Mangal'\">, अतः शेष भाग = 3C/8 − 9C/32 = 12C/32 − 9C/32 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3C/32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही शेष भाग पानी है: 3C/32 = 12 → C = (12 × 32) / 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">128 लीटर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: पेट्रोल 48 + डीज़ल 32 + मिट्टी का तेल 36 + पानी 12 = 128 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: पानी = C × (5/8) × (3/5) × (1/4) = 3C/32 = 12 → C = 128</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः टैंक की क्षमता </span><span style=\"font-weight:bold;font-family:'Mangal'\">128 लीटर (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण x² − 7x + 12 = 0 और x² + px + q = 0 का ठीक एक मूल उभयनिष्ठ है, और दूसरे समीकरण का अन्य मूल −5 है। निम्नलिखित में से p और q के संभावित मान कौन-से हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = −1, q = −20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = 2, q = −15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = 1, q = 20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">p = −2, q = −15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² − 7x + 12 = 0 के मूल: (x − 3)(x − 4) = 0 → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 या 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समीकरण का एक मूल इनमें से एक है और दूसरा मूल −5 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 1: मूल 3 और −5 → समीकरण = (x − 3)(x + 5) = x² + 2x − 15 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = 2, q = −15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 2: मूल 4 और −5 → समीकरण = (x − 4)(x + 5) = x² + x − 20 → p = 1, q = −20 (विकल्पों में नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्पों की जाँच: x² − x − 20 = (x − 5)(x + 4) → मूल 5, −4 ✗; x² + x + 20 के वास्तविक मूल नहीं हैं ✗; x² − 2x − 15 = (x − 5)(x + 3) → मूल 5, −3 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल x² + 2x − 15 के मूल 3 (उभयनिष्ठ) और −5 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: मूलों का योग = −p और गुणनफल = q → p = −(3 + (−5)) = 2, q = 3 × (−5) = −15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संभावित मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = 2, q = −15 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक आयताकार खेत की भुजाएँ मापने में एक भुजा 8% अधिक और दूसरी भुजा 10% कम ली जाती है। इन मापों से परिकलित क्षेत्रफल में त्रुटि प्रतिशत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8% कमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2% कमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8% वृद्धि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.8% कमी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तविक भुजाएँ 100 इकाई और 100 इकाई लें, अतः वास्तविक क्षेत्रफल = 100 × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,000 वर्ग इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मापी गई पहली भुजा = 100 × 108% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">108</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मापी गई दूसरी भुजा = 100 × 90% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिकलित क्षेत्रफल = 108 × 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,720 वर्ग इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रुटि = 9,720 − 10,000 = −280, अर्थात् क्षेत्रफल 10,000 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">280 कम</span><span style=\"font-family:'Mangal'\"> आता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रुटि प्रतिशत = 280 / 10,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8% कमी</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: कुल % परिवर्तन = a + b + ab/100 = 8 − 10 + (8 × (−10)) / 100 = −2 − 0.8 = −2.8%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्षेत्रफल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8% कमी (विकल्प A)</span><span style=\"font-family:'Mangal'\"> आती है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पिता और उसके पुत्र की वर्तमान आयु का योग 62 वर्ष है। छह वर्ष पहले उनकी आयु के संख्यात्मक मानों का गुणनफल 504 था। पिता की वर्तमान आयु (वर्षों में) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 वर्ष पहले की आयु पिता की f वर्ष और पुत्र की s वर्ष लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान आयु का योग = 62, अतः 6 वर्ष पहले योग = 62 − 6 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50</span><span style=\"font-family:'Mangal'\"> → f + s = 50</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 वर्ष पहले गुणनफल: f × s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">504</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः f और s समीकरण t² − 50t + 504 = 0 के मूल हैं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणनखंड: 504 = 36 × 14 और 36 + 14 = 50 → (t − 36)(t − 14) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता बड़ा है, अतः f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\"> और s = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> (6 वर्ष पहले)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की वर्तमान आयु = 36 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: पुत्र की वर्तमान आयु = 14 + 6 = 20; 42 + 20 = 62 ✓; 36 × 14 = 504 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पिता की वर्तमान आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित बारंबारता वितरण का माध्यक है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789914437428_image002.png\" width=\"269\" height=\"51\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल बारंबारता N = 6 + 9 + 12 + 15 + 10 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">61</span><span style=\"font-family:'Mangal'\"> (विषम)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्यक = ((N + 1) / 2)वें प्रेक्षण का मान = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31वाँ</span><span style=\"font-family:'Mangal'\"> प्रेक्षण</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संचयी बारंबारताएँ: x = 2 → 6; x = 4 → 15; x = 6 → 27; x = 8 → 42; x = 10 → 52; x = 12 → 61</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28वें से 42वें तक सभी प्रेक्षणों का मान 8 है, अतः 31वाँ प्रेक्षण = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: माध्यक = वह x जिसकी संचयी बारंबारता सबसे पहले (N + 1) / 2 तक पहुँचे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः माध्यक </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक नाव बिंदु A से बिंदु B तक धारा के अनुकूल जाने और फिर धारा के प्रतिकूल A और B के मध्य-बिंदु C तक वापस आने में 14 घंटे लेती है। यदि धारा की चाल 2 km/h और शांत जल में नाव की चाल 10 km/h है, तो A और B के बीच की दूरी क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा के अनुकूल चाल = 10 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h</span><span style=\"font-family:'Mangal'\">; धारा के प्रतिकूल चाल = 10 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी AB = D km लें। नाव D km धारा के अनुकूल और फिर D/2 km धारा के प्रतिकूल जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span st
