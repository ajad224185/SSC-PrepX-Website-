=\"font-family:'Mangal'\">इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">वलयों को गिनने से वृक्ष की आयु का अनुमान</span><span style=\"font-family:'Mangal'\"> मिल जाता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुकूल परिस्थितियों वाले वर्ष में वलय </span><span style=\"font-weight:bold;font-family:'Mangal'\">चौड़ा</span><span style=\"font-family:'Mangal'\"> और प्रतिकूल परिस्थितियों वाले वर्ष में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संकरा</span><span style=\"font-family:'Mangal'\"> बनता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वलय की चौड़ाई उस वर्ष की </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलवायु</span><span style=\"font-family:'Mangal'\"> बताती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयु</span><span style=\"font-family:'Mangal'\"> तो वलयों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">संख्या</span><span style=\"font-family:'Mangal'\"> से मिलती है, उनकी चौड़ाई से नहीं, अतः R, A की व्याख्या नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रा में जनक के शरीर पर एक कली (मुकुल) विकसित होती है। पूरी तरह परिपक्व होने पर इस कली का क्या होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह बीजाणुओं में टूटकर जल में फैल जाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह दूसरे हाइड्रा की कली से संलयित हो जाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह जुड़ी रहकर एक कॉलोनी बना लेती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह अलग होकर एक नया स्वतंत्र जीव बन जाती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रा में जनक के शरीर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक निश्चित स्थान पर बार-बार कोशिका विभाजन</span><span style=\"font-family:'Mangal'\"> से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कली (मुकुल)</span><span style=\"font-family:'Mangal'\"> नामक उभार बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कली जनक से जुड़े रहते हुए ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक छोटे जीव</span><span style=\"font-family:'Mangal'\"> के रूप में बढ़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरी तरह परिपक्व होने पर वह जनक के शरीर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग</span><span style=\"font-family:'Mangal'\"> होकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">नया स्वतंत्र जीव</span><span style=\"font-family:'Mangal'\"> बन जाती है; यही मुकुलन है, जो अलैंगिक प्रजनन का एक रूप है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु ब्रेड की फफूँद जैसे जीवों में बनते हैं, हाइड्रा में नहीं, और दो कलियों का कोई संलयन नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः परिपक्व कली अलग होकर एक नया स्वतंत्र जीव बन जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गाय जैसे घास खाने वाले जंतु की छोटी आँत बाघ जैसे मांस खाने वाले जंतु की तुलना में बहुत लंबी होती है। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास में अधिक प्रोटीन होता है, जिसे पचने में अधिक समय लगता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास का सेल्यूलोज पचने में लंबा समय लेता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मांस आमाशय में ही अवशोषित हो जाता है, अतः छोटी आँत पर्याप्त है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शाकाहारी जंतुओं का शरीर मांसाहारियों से बड़ा होता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटी आँत कार्बोहाइड्रेट, प्रोटीन और वसा के पूर्ण पाचन का स्थल है, और जंतुओं में उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबाई</span><span style=\"font-family:'Mangal'\"> उनके भोजन के अनुसार </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न</span><span style=\"font-family:'Mangal'\"> होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घास में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सेल्यूलोज</span><span style=\"font-family:'Mangal'\"> प्रचुर होता है, जो केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीरे-धीरे</span><span style=\"font-family:'Mangal'\"> पचता है, अतः शाकाहारियों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबी छोटी आँत</span><span style=\"font-family:'Mangal'\"> चाहिए ताकि सेल्यूलोज को पचने का पर्याप्त समय मिल सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मांस अधिक सरलता से पचता है, इसलिए बाघ जैसे मांसाहारी </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटी</span><span style=\"font-family:'Mangal'\"> आँत से ही काम चला लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">भोजन के प्रकार</span><span style=\"font-family:'Mangal'\"> से तय होती है, शरीर के आकार से नहीं, और प्रोटीन का पाचन दोनों जंतुओं की छोटी आँत में ही पूरा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गाय की छोटी आँत इसलिए लंबी है क्योंकि घास का सेल्यूलोज पचने में लंबा समय लेता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनोइक अम्ल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. हाइड्रोक्लोरिक अम्ल के विपरीत, जो पूर्णतः आयनित होता है, एथेनोइक अम्ल एक दुर्बल अम्ल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. एथेनोइक अम्ल सोडियम हाइड्रोजनकार्बोनेट से अभिक्रिया करके हाइड्रोजन गैस देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. एथेनोइक अम्ल अम्ल उत्प्रेरक की उपस्थिति में एथेनॉल से अभिक्रिया करके एस्टर और जल देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. HCl जैसे खनिज अम्ल जल में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्णतः आयनित</span><span style=\"font-family:'Mangal'\"> होते हैं, जबकि एथेनोइक अम्ल जैसे कार्बोक्सिलिक अम्ल केवल आंशिक रूप से आयनित होते हैं और इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">दुर्बल अम्ल</span><span style=\"font-family:'Mangal'\"> हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. एथेनोइक अम्ल सोडियम हाइड्रोजनकार्बोनेट से अभिक्रिया करके सोडियम एथेनोएट, जल और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> देता है, जो तेज़ बुदबुदाहट के रूप में दिखती है; हाइड्रोजन गैस नहीं बनती → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अम्ल उत्प्रेरक की उपस्थिति में शुद्ध एथेनॉल के साथ एथेनोइक अम्ल मीठी गंध वाला </span><span style=\"font-weight:bold;font-family:'Mangal'\">एस्टर और जल</span><span style=\"font-family:'Mangal'\"> देता है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">एस्टरीकरण</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किस तत्व की द्रव्यमान संख्या 27 है और उसमें 14 न्यूट्रॉन उपस्थित हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्लोरीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐलुमिनियम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी परमाणु की द्रव्यमान संख्या उसके नाभिक में प्रोटॉनों और न्यूट्रॉनों की कुल संख्या होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटॉनों की संख्या = द्रव्यमान संख्या − न्यूट्रॉनों की संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 27 − 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटॉनों की संख्या ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु क्रमांक</span><span style=\"font-family:'Mangal'\"> है, और परमाणु क्रमांक 13 वाला तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐलुमिनियम (Al)</span><span style=\"font-family:'Mangal'\"> है, जिसमें 13 प्रोटॉन और 14 न्यूट्रॉन होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मैग्नीशियम में 12, सोडियम में 11 और क्लोरीन में 17 प्रोटॉन होते हैं, अतः इनमें से कोई उपयुक्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह तत्व ऐलुमिनियम है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वंशागति के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वंशागति की गुणसूत्र-आधारित क्रियाविधि मेंडल के प्रयोगों के परिणामों को समझाती है और सभी लैंगिक प्रजनन करने वाले जीवों में काम करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अलैंगिक प्रजनन करने वाले जीव भी वंशागति के समान नियमों का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रजनन के दौरान उत्पन्न विभिन्नताएँ कभी वंशागत नहीं हो सकतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रत्येक लक्षण गुणसूत्रों पर स्थित कारकों के एक युग्म से नियंत्रित होता है, जिसमें एक कारक प्रत्येक जनक से आता है, और यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुणसूत्र-आधारित क्रियाविधि</span><span style=\"font-family:'Mangal'\"> मेंडल के परिणामों को समझाती है तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी लैंगिक प्रजनन करने वाले जीवों</span><span style=\"font-family:'Mangal'\"> में काम करती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अलैंगिक प्रजनन करने वाले जीव भी अपने गुणसूत्र अगली पीढ़ी को देते हैं, अतः वे भी वंशागति के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान नियमों का पालन</span><span style=\"font-family:'Mangal'\"> करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रजनन के दौरान उत्पन्न विभिन्नताएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">वंशागत हो सकती हैं</span><span style=\"font-family:'Mangal'\">, और ऐसी वंशागत विभिन्नताएँ जीवों की उत्तरजीविता बढ़ा सकती हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक लेंस बीच की तुलना में किनारों पर मोटा है। इसके विषय में निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह समांतर किरणों को एक बिंदु पर अभिसरित करता है और उत्तल लेंस है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह उत्तल लेंस है और केवल वास्तविक प्रतिबिंब बनाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह समांतर किरणों को अपसरित करता है और अवतल लेंस है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह अवतल लेंस है और समांतर किरणों को अभिसरित करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भीतर की ओर वक्रित दो गोलीय सतहों से घिरा लेंस बीच की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">किनारों</span><span style=\"font-family:'Mangal'\"> पर मोटा होता है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्वि-अवतल लेंस</span><span style=\"font-family:'Mangal'\"> है, जिसे सामान्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल लेंस</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुख्य अक्ष के समांतर किरणें इससे अपवर्तन के बाद मुख्य अक्ष के एक बिंदु, अर्थात् उसके मुख्य फोकस, से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपसरित होती प्रतीत</span><span style=\"font-family:'Mangal'\"> होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्योंकि यह प्रकाश किरणों को फैला देता है, अवतल लेंस को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपसारी लेंस</span><span style=\"font-family:'Mangal'\"> भी कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीच में मोटा </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल लेंस</span><span style=\"font-family:'Mangal'\"> ही समांतर किरणों को एक बिंदु पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिसरित</span><span style=\"font-family:'Mangal'\"> करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह लेंस समांतर किरणों को अपसरित करता है और अवतल लेंस है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): दृढ़ दीवार को लगातार धकेलने वाला व्यक्ति थक जाता है, यद्यपि दीवार पर कोई कार्य नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): किसी वस्तु पर कार्य तभी होता है जब लगाया गया बल वस्तु में बल की दिशा में विस्थापन उत्पन्न करे।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अचर बल द्वारा किया गया कार्य = बल × बल की दिशा में विस्थापन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीवार को धकेलने पर दीवार </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिलती नहीं</span><span style=\"font-family:'Mangal'\">, अतः विस्थापन शून्य है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">दीवार पर किया गया कार्य शून्य</span><span style=\"font-family:'Mangal'\"> है → A का दूसरा भाग सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फिर भी व्यक्ति थकता है क्योंकि उसकी पेशियाँ बार-बार </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिकुड़ती और फैलती</span><span style=\"font-family:'Mangal'\"> हैं और शरीर की </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंतरिक ऊर्जा</span><span style=\"font-family:'Mangal'\"> खर्च करती हैं → A का पहला भाग सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R कार्य होने की शर्त बताता है, और R में बताए गए विस्थापन का न होना ही दीवार पर कार्य को शून्य बनाता है, अतः R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़सलों पर छिड़के गए कीटनाशी बहकर एक तालाब में पहुँच जाते हैं। निम्नलिखित में से कौन-सा आगे होने वाली घटना का सही वर्णन करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल उन्हें पूरी तरह अपघटित कर देता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे जल में ही रहते हैं और कभी जीवों तक नहीं पहुँचते</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे प्रत्येक पोषक स्तर पर बराबर मात्रा में उपस्थित रहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे जलीय पौधों और जंतुओं के माध्यम से खाद्य शृंखला में प्रवेश करते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़सलों की रक्षा के लिए प्रयोग किए गए कीटनाशी बहकर मिट्टी में और तालाब जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल निकायों</span><span style=\"font-family:'Mangal'\"> में पहुँच जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल से उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलीय पौधे और जंतु ग्रहण कर लेते हैं</span><span style=\"font-family:'Mangal'\">, और यह उनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">खाद्य शृंखला में प्रवेश</span><span style=\"font-family:'Mangal'\"> करने का एक तरीका है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अजैव निम्नीकरणीय होने के कारण वे अपघटित नहीं होते, और प्रत्येक ऊँचे पोषक स्तर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकाधिक सांद्रित</span><span style=\"font-family:'Mangal'\"> होते जाते हैं, अतः उनकी मात्रा हर स्तर पर बराबर नहीं होती; इस वृद्धि को जैव आवर्धन कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कीटनाशी जलीय पौधों और जंतुओं के माध्यम से खाद्य शृंखला में प्रवेश करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मॉस जैसे ब्रायोफाइट पादप जगत के उभयचर कहलाते हैं क्योंकि वे:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रजनन के लिए जल चाहते हैं, क्योंकि उनकी नर कोशिकाएँ तैरकर मादा कोशिकाओं तक पहुँचती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीठे जल और समुद्री जल दोनों में रह सकते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परिवहन के लिए सुविकसित ज़ाइलम और फ्लोएम रखते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे बीज बनाते हैं जिन्हें अंकुरण के लिए नमी चाहिए</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मॉस और लिवरवर्ट जैसे ब्रायोफाइट पौधों के जल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थल</span><span style=\"font-family:'Mangal'\"> की ओर बढ़ने का संकेत हैं, परंतु वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">नमी पर निर्भर</span><span style=\"font-family:'Mangal'\"> रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे नम और छायादार स्थानों में रहते हैं, और उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रजनन के लिए जल चाहिए</span><span style=\"font-family:'Mangal'\">, क्योंकि उनकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">नर प्रजनन कोशिकाओं को तैरकर</span><span style=\"font-family:'Mangal'\"> मादा कोशिकाओं तक पहुँचना होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थल पर रहते हुए भी प्रजनन के लिए जल की आवश्यकता ही उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादप उभयचर</span><span style=\"font-family:'Mangal'\"> कहलाने का कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">संवहनी ऊतक</span><span style=\"font-family:'Mangal'\"> (ज़ाइलम और फ्लोएम) </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> होते, और वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीज नहीं बनाते</span><span style=\"font-family:'Mangal'\">; बीज केवल जिम्नोस्पर्म और एंजियोस्पर्म में आते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वे पादप जगत के उभयचर इसलिए कहलाते हैं क्योंकि उन्हें प्रजनन के लिए जल चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): विषुवतीय क्षेत्र पूरे वर्ष अपेक्षाकृत गर्म रहते हैं, जबकि ध्रुवीय क्षेत्र बहुत ठंडे होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): विषुवतीय क्षेत्र पर पड़ने वाला सौर विकिरण ध्रुवों की तुलना में अधिक बड़े क्षेत्र पर फैल जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोलाकार</span><span style=\"font-family:'Mangal'\"> है, इसलिए सूर्य की किरणें अलग-अलग अक्षांशों पर अलग-अलग कोणों से पड़ती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अभिकथन:</span><span style=\"font-family:'Mangal'\"> पृथ्वी के असमान तापन के कारण विषुवतीय क्षेत्र पूरे वर्ष अपेक्षाकृत गर्म रहते हैं और ध्रुवीय क्षेत्र बहुत ठंडे रहते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कारण:</span><span style=\"font-family:'Mangal'\"> विषुवत रेखा के पास किरणें </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग सीधी</span><span style=\"font-family:'Mangal'\"> पड़ती हैं, अतः सौर विकिरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटे क्षेत्र पर संकेंद्रित</span><span style=\"font-family:'Mangal'\"> रहता है और उसे अधिक गर्म करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्रुवों के पास किरणें </span><span style=\"font-weight:bold;font-family:'Mangal'\">तिरछी</span><span style=\"font-family:'Mangal'\"> पड़ती हैं, अतः वही विकिरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़े क्षेत्र पर फैल</span><span style=\"font-family:'Mangal'\"> जाता है और उसे कम गर्म करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R कहता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">विषुवतीय क्षेत्र</span><span style=\"font-family:'Mangal'\"> पर विकिरण बड़े क्षेत्र पर फैलता है; यह तथ्य का उल्टा है (बड़े क्षेत्र पर फैलना </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्रुवों</span><span style=\"font-family:'Mangal'\"> पर होता है) → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़ेरिक आयन Fe</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> है और हाइड्रॉक्साइड आयन OH</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−</span><span style=\"font-family:'Mangal'\"> है। फ़ेरिक हाइड्रॉक्साइड का सूत्र है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FeOH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe(OH)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">OH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe(OH)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक में कुल धन आवेश कुल ऋण आवेश के बराबर होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवेशों की अदला-बदली कीजिए: Fe</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> का 3 हाइड्रॉक्साइड आयन का पादांक बन जाता है और OH</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−</span><span style=\"font-family:'Mangal'\"> का 1 आयरन का पादांक बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रॉक्साइड एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुपरमाणुक आयन</span><span style=\"font-family:'Mangal'\"> है, अतः जब उसके एक से अधिक आयन हों, तब उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोष्ठक</span><span style=\"font-family:'Mangal'\"> में लिखा जाता है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">Fe(OH)</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवेश जाँचने पर 1 × (+3) = +3 तथा 3 × (−1) = −3, अतः यौगिक उदासीन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe(OH)</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> तो फ़ेरस हाइड्रॉक्साइड होगा, जो Fe</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> से बनता है, और FeOH तथा Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\  "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. शुक्राणु बनाने के अतिरिक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृषण एक हार्मोन</span><span style=\"font-family:'Mangal'\"> भी बनाते हैं जो शुक्राणु उत्पादन को नियंत्रित करता है और यौवनारंभ में लड़कों में दिखने वाले शारीरिक परिवर्तन लाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वृषण त्वचा की थैली </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृषणकोश</span><span style=\"font-family:'Mangal'\"> में रहते हैं, जो उन्हें शरीर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">थोड़ा ठंडा</span><span style=\"font-family:'Mangal'\"> रखती है, और यह कम तापमान शुक्राणु बनने के लिए आवश्यक है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. शुक्राणु ले जाने वाली शुक्रवाहिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूत्रमार्ग</span><span style=\"font-family:'Mangal'\"> में खुलती है, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूत्र और शुक्राणु का साझा मार्ग</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सभी 1, 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक अवतल लेंस वस्तु के आकार का एक-तिहाई प्रतिबिंब बनाता है। यदि फोकस दूरी 12 cm है, तो वस्तु दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल लेंस सदैव आभासी, सीधा और छोटा प्रतिबिंब बनाता है, अतः आवर्धन धनात्मक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">m = v/u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1/3</span><span style=\"font-family:'Mangal'\">, जिससे v = u/3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल लेंस के लिए f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−12 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र: 1/v − 1/u = 1/f</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3/u − 1/u = 1/(−12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2/u = −1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−24 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऋणात्मक चिह्न बताता है कि वस्तु लेंस के बाईं ओर 24 cm की दूरी पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु दूरी 24 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): 5% (m/v) ग्लूकोस विलयन में 100 mL विलयन में 5 g ग्लूकोस होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): द्रव्यमान-आयतन प्रतिशत यह बताता है कि 100 mL विलयन में विलेय का कितना द्रव्यमान (g में) उपस्थित है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विलयन की सांद्रता को </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान-आयतन प्रतिशत</span><span style=\"font-family:'Mangal'\"> (% m/v) के रूप में व्यक्त किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह प्रतिशत </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 mL विलयन में उपस्थित विलेय का द्रव्यमान (g में)</span><span style=\"font-family:'Mangal'\"> बताता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 5% (m/v) ग्लूकोस विलयन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 g ग्लूकोस को घोलकर 100 mL विलयन</span><span style=\"font-family:'Mangal'\"> बनाया गया होता है, और ग्लूकोस विलयन प्रायः इसी रूप में मिलता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सीधे R में दिए गए द्रव्यमान-आयतन प्रतिशत के अर्थ से निकलता है, अतः R, A की व्याख्या करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक यौगिकों के नामकरण के नियमों के अनुसार यौगिक N</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन ऑक्साइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डाइनाइट्रोजन टेट्राऑक्साइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन टेट्रॉक्साइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डाइनाइट्रोजन टेट्रॉक्साइड</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक यौगिकों के नाम में प्रत्येक तत्व के </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणुओं की संख्या</span><span style=\"font-family:'Mangal'\"> उपसर्ग से दिखाई जाती है, और दूसरे तत्व का नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">-आइड</span><span style=\"font-family:'Mangal'\"> पर समाप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> में नाइट्रोजन के दो परमाणु हैं, अतः पहला भाग </span><span style=\"font-weight:bold;font-family:'Mangal'\">डाइनाइट्रोजन</span><span style=\"font-family:'Mangal'\"> है, और ऑक्सीजन के चार परमाणु हैं, अतः दूसरे भाग में ऑक्साइड के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">टेट्रा-</span><span style=\"font-family:'Mangal'\"> उपसर्ग लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब उपसर्ग 'a' पर समाप्त हो और अगला शब्द स्वर से आरंभ हो, तब 'a' हटा दिया जाता है: tetra + oxide = </span><span style=\"font-weight:bold;font-family:'Mangal'\">tetroxide</span><span style=\"font-family:'Mangal'\">, tetraoxide नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन के लिए डाइ- उपसर्ग छोड़ा नहीं जा सकता, क्योंकि नाइट्रोजन के परमाणुओं की संख्या एक से अधिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः N</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> डाइनाइट्रोजन टेट्रॉक्साइड कहलाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो वस्तुएँ A और B एक ही बिंदु से चलकर सीधी सड़क पर एक ही दिशा में चलती हैं। स्थिति-समय ग्राफ़ पर B की रेखा A की रेखा से अधिक खड़ी (तीव्र ढाल वाली) है। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B का वेग A से अधिक है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का वेग B से अधिक है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और B का वेग समान है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B विराम में है और A चल रही है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति-समय ग्राफ़ दर्शाता है कि वस्तु की </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिति</span><span style=\"font-family:'Mangal'\"> समय के साथ कैसे बदलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस ग्राफ़ से वेग का परिमाण ज्ञात किया जा सकता है, क्योंकि रेखा का </span><span style=\"font-weight:bold;font-family:'Mangal'\">ढाल</span><span style=\"font-family:'Mangal'\"> स्थिति में परिवर्तन को समय में परिवर्तन से भाग देने पर मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक खड़ी</span><span style=\"font-family:'Mangal'\"> रेखा का अर्थ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान समय अंतराल में अधिक विस्थापन</span><span style=\"font-family:'Mangal'\">, और इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक वेग</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B की रेखा A की रेखा से अधिक खड़ी है, अतः B समान समय में A से अधिक दूरी तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः B का वेग A से अधिक है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी के वायुमंडल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्षोभमंडल में ऊँचाई के साथ तापमान लगभग 6.5°C प्रति km की दर से घटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. समतापमंडल में ऊँचाई के साथ तापमान बढ़ता है, इसलिए वायु का ऊर्ध्वाधर मिश्रण बहुत कम होता है और मौसम क्षोभमंडल तक ही सीमित रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बाह्य अंतरिक्ष पृथ्वी से लगभग 10 km ऊपर से आरंभ होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. क्षोभमंडल पृथ्वी की सतह से गर्म होता है, अतः उसका तापमान ऊँचाई के साथ लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.5°C प्रति km</span><span style=\"font-family:'Mangal'\"> की दर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">घटता</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. समतापमंडल में तापमान ऊँचाई के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">बढ़ता</span><span style=\"font-family:'Mangal'\"> है; इससे यह परत शांत रहती है क्योंकि वायु का </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्ध्वाधर मिश्रण नहीं</span><span style=\"font-family:'Mangal'\"> होता, और इसलिए मौसम नीचे क्षोभमंडल में ही रहता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बाह्य अंतरिक्ष पृथ्वी से लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 km</span><span style=\"font-family:'Mangal'\"> ऊपर से आरंभ होता है, 10 km से नहीं; समतापमंडल के ऊपर मध्यमंडल, तापमंडल और बहिर्मंडल हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति दूर की वस्तुएँ स्पष्ट देख सकता है, परंतु पुस्तक को आराम से पढ़ने के लिए उसे आँखों से 25 cm से बहुत दूर रखना पड़ता है। यह दोष और उसे ठीक करने वाला लेंस हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीर्घदृष्टि, उत्तल लेंस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकटदृष्टि, अवतल लेंस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकटदृष्टि, उत्तल लेंस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दीर्घदृष्टि, अवतल लेंस</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्य आँख </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 cm से अनंत तक</span><span style=\"font-family:'Mangal'\"> की वस्तुएँ स्पष्ट देखती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो व्यक्ति दूर की वस्तुएँ स्पष्ट देखता है परंतु पढ़ने की सामग्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 cm से बहुत दूर</span><span style=\"font-family:'Mangal'\"> रखनी पड़ती है, उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">दीर्घदृष्टि</span><span style=\"font-family:'Mangal'\"> (दूरदृष्टिता) है: उसका निकट बिंदु आँख से दूर चला गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस आँख में पास की वस्तु से आने वाला प्रकाश </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेटिना के पीछे</span><span style=\"font-family:'Mangal'\"> फोकस होता है, क्योंकि नेत्र गोलक बहुत छोटा हो गया है या लेंस की फोकसन शक्ति कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अभिसारी (उत्तल) लेंस</span><span style=\"font-family:'Mangal'\"> रेटिना पर प्रतिबिंब बनाने के लिए आवश्यक अतिरिक्त फोकसन शक्ति देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह दोष दीर्घदृष्टि है और इसे उत्तल लेंस से ठीक किया जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बलों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी गुटके पर विपरीत दिशाओं में लगने वाले 10 N और 6 N के दो बल 16 N का नेट बल उत्पन्न करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रस्साकशी में यदि दोनों दल रस्सी को बराबर बल से खींचें, तो रस्सी नहीं हिलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. किसी नल के दोनों सिरों पर लगाए गए बराबर और विपरीत बल उसे घुमा देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जब दो बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> दिशाओं में लगते हैं, तब नेट बल उनका </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतर</span><span style=\"font-family:'Mangal'\"> होता है: 10 N − 6 N = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 N</span><span style=\"font-family:'Mangal'\">, बड़े बल की दिशा में; 16 N तो तब नेट बल होता जब दोनों एक ही दिशा में लगते → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विपरीत दिशाओं में बराबर खिंचाव </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलित</span><span style=\"font-family:'Mangal'\"> होते हैं, रस्सी पर नेट बल शून्य होता है, अतः रस्सी </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं हिलती</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. नल या हैंडलबार जैसी लंबी वस्तु के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोनों सिरों पर</span><span style=\"font-family:'Mangal'\"> लगाए गए बराबर और विपरीत बल अपने प्रभाव में निरस्त नहीं होते, बल्कि वस्तु को </span><span style=\"font-weight:bold;font-family:'Mangal'\">घुमा</span><span style=\"font-family:'Mangal'\"> देते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">डोंगी में बैठा एक व्यक्ति चप्पू से जल को पीछे की ओर धकेलता है और डोंगी आगे बढ़ती है। डोंगी आगे इसलिए बढ़ती है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चप्पू डोंगी को सीधे आगे धकेलता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल पीछे की ओर बहकर डोंगी को अपने साथ खींचता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यक्ति चप्पू चलाते समय आगे की ओर झुकता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल चप्पू को बराबर बल से आगे की ओर धकेलता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब डोंगी चलाने वाला व्यक्ति चप्पू से जल को </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे</span><span style=\"font-family:'Mangal'\"> धकेलता है, तो यह क्रिया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के तृतीय नियम से जल चप्पू को </span><span style=\"font-weight:bold;font-family:'Mangal'\">बराबर परिमाण</span><span style=\"font-family:'Mangal'\"> के बल से </span><span style=\"font-weight:bold;font-family:'Mangal'\">आगे</span><span style=\"font-family:'Mangal'\"> धकेलता है; यह प्रतिक्रिया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चप्पू डोंगी में बैठे व्यक्ति के हाथ में है, अतः चप्पू पर लगा यह आगे का बल </span><span style=\"font-weight:bold;font-family:'Mangal'\">चप्पू और डोंगी को आगे</span><span style=\"font-family:'Mangal'\"> बढ़ा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल को अधिक ज़ोर से धकेलने पर चप्पू पर आगे का बल बड़ा होता है और डोंगी का वेग बढ़ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः डोंगी आगे इसलिए बढ़ती है क्योंकि जल चप्पू को बराबर बल से आगे की ओर धकेलता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गति के ग्राफ़ों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. एक समान वेग से चल रही कार का वेग-समय ग्राफ़ समय अक्ष के समांतर एक सरल रेखा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. स्थिति-समय ग्राफ़ का ढाल वस्तु का वेग देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. नीचे की ओर ढलती सरल रेखा वाला वेग-समय ग्राफ़ वेग की दिशा में त्वरण दर्शाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जब वेग समय के साथ नहीं बदलता, तब वेग-समय ग्राफ़ </span><span style=\"font-weight:bold;font-family:'Mangal'\">समय अक्ष के समांतर सरल रेखा</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ग्राफ़ का ढाल Y-अक्ष की राशि के X-अक्ष की राशि के सापेक्ष परिवर्तन की दर देता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिति-समय ग्राफ़ का ढाल वेग</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वेग-समय ग्राफ़ पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे की ओर</span><span style=\"font-family:'Mangal'\"> ढलती सरल रेखा का अर्थ है कि वेग घट रहा है, अतः त्वरण अचर है और वेग की दिशा के </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घरेलू परिपथ में भू-संपर्क तार का मुख्य उद्देश्य है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिरोध घटाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा की आपूर्ति करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत आघात से बचाना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वोल्टेज बढ़ाना</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घरेलू परिपथ में </span><span style=\"font-weight:bold;font-family:'Mangal'\">भू-संपर्क तार</span><span style=\"font-family:'Mangal'\"> घर के पास पृथ्वी में गहराई में गाड़ी गई धातु की प्लेट से जुड़ा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह विद्युत इस्तरी, टोस्टर या रेफ्रिजरेटर जैसे उपकरणों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">धात्विक आवरण</span><span style=\"font-family:'Mangal'\"> से जोड़ा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि धारा के रिसाव से आवरण विद्युतमय हो जाए, तो भू-संपर्क तार </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम प्रतिरोध का मार्ग</span><span style=\"font-family:'Mangal'\"> देकर धारा को पृथ्वी तक पहुँचा देता है और आवरण को पृथ्वी के विभव पर रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए उपकरण छूने वाले व्यक्ति को </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंभीर विद्युत आघात नहीं</span><span style=\"font-family:'Mangal'\"> लगता; भू-संपर्क तार न धारा देता है और न वोल्टेज बदलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भू-संपर्क तार का मुख्य उद्देश्य विद्युत आघात से बचाना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा अक्षर-संख्या समूह दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आएगा जिससे वह तार्किक रूप से पूर्ण हो जाए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 2, C 6, E 12, G 20, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I 30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I 28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H 30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I 32</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षरों और संख्याओं को अलग-अलग पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अक्षर: A, C, E, G, ?: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\"> → ? = G + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ: 2, 6, 12, 20, ?: अंतर हैं 6 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, 12 − 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, 20 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंतर हर बार 2 से बढ़ रहे हैं, और अगला अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\"> है → ? = 20 + 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(जाँच: प्रत्येक संख्या दो क्रमागत संख्याओं का गुणनफल भी है: 1 × 2, 2 × 3, 3 × 4, 4 × 5, और अगला 5 × 6 = 30 ✓)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह I 30 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I 28 में फिर से केवल 8 जोड़ा गया है, H 30 में अक्षर केवल एक स्थान आगे गया है, तथा I 32 में 12 जोड़ा गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">I 30 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BDXZ EGUW HJRT KMOQ ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPMN</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPLN</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPLN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NQLN</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के चारो tion_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GOAL : # :: % : TIDE</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = KSWH, % = PEHJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = KSXH, % = PEHI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = KSWH, % = PEHI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = KSWG, % = PEHI</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समूह से दूसरे समूह तक का परिवर्तन दोनों युग्मों में समान होना चाहिए। प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: GOAL → KSWH: G + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">, O + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, A − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\"> (1 − 4 = −3 → −3 + 26 = 23 = W), L − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> → (+4, +4, −4, −4); PEHI → TIDE: P + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\">, E + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, H − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\">, I − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> → (+4, +4, −4, −4) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: PEHJ → TIDE के लिए J − 4 = E चाहिए, परंतु J − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: GOAL → KSXH के लिए A − 4 = X चाहिए, परंतु A − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: GOAL → KSWG के लिए L − 4 = G चाहिए, परंतु L − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = KSWH, % = PEHI (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्या 546598492 के प्रत्येक अंक को बाएँ से दाएँ आरोही क्रम में व्यवस्थित किया जाता है। इस प्रकार बनी नई संख्या में बाएँ से तीसरे और दाएँ से तीसरे अंकों का योग क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"> ont-family:'Mangal'\">अतः अभीष्ट योग </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित संख्या-युग्मों में, पहली संख्या पर कुछ गणितीय संक्रियाएँ करके दूसरी संख्या प्राप्त की गई है। वह युग्म चुनिए जिसकी संख्याएँ उसी प्रकार संबंधित हैं जिस प्रकार दिए गए युग्मों की संख्याएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 - 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 - 64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 - 36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 - 100</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 - 30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 - 120</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा नियम खोजें जो दोनों युग्मों में पहली संख्या को दूसरी संख्या में बदल दे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 → 25: 25 = 5², और 5 = 3 + 2 → (3 + 2)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 → 64: 64 = 8², और 8 = 6 + 2 → (6 + 2)² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: दूसरी संख्या = (पहली संख्या + 2)².</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: (5 + 2)² = 7² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">49</span><span style=\"font-family:'Mangal'\"> है, 36 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: (8 + 2)² = 10² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: (4 + 2)² = 6² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span><span style=\"font-family:'Mangal'\"> है, 30 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: (9 + 2)² = 11² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">121</span><span style=\"font-family:'Mangal'\"> है, 120 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इसी नियम का पालन करने वाला युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 - 100 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित
