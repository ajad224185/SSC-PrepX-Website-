ng": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दोनों दिशाओं की चालें ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा के अनुकूल चाल = 8 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा के विपरीत चाल = 8 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना स्थान की दूरी d km है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुकूल समय + विपरीत समय = 4 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d/10 + d/6 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 और 6 का LCM (लघुत्तम समापवर्त्य) 30 लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3d + 5d) / 30 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8d = 120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 15/10 = 1.5 घंटे तथा 15/6 = 2.5 घंटे; कुल 4 घंटे ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दूरी = [कुल समय × (u² − v²)] / (2u), जहाँ u = 8 तथा v = 2 है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [4 × (64 − 4)] / 16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km (विकल्प B)</span><span style=\"font-family:'Mangal'\"> दूर है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 4 × 7 + 9 − 24 ÷ 6 − 15 + 63 ÷ 9 × 4 − 18</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोष्ठक नहीं हैं, अतः पहले भाग और गुणा बाएँ से दाएँ करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63 ÷ 9 × 4 = 7 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक 28 + 9 − 4 − 15 + 28 − 18 बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब बाएँ से दाएँ जोड़ और घटाव करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 + 9 = 37</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">37 − 4 = 33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33 − 15 = 18</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 + 28 = 46</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46 − 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 6 अंकों की संख्या 3X48Y9, 11 से विभाज्य है, जहाँ X और Y अंक हैं, तो (X − Y) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई संख्या 11 से तब विभाज्य होती है जब (दाईं ओर से गिनने पर) विषम स्थानों के अंकों के योग और सम स्थानों के अंकों के योग का अंतर 0 या 11 का गुणज हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर से अंक: 9, Y, 8, 4, X, 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विषम स्थानों का योग = 9 + 8 + X = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 + X</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सम स्थानों का योग = Y + 4 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 + Y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = (17 + X) − (7 + Y) = 10 + X − Y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X और Y अंक हैं, अतः X − Y का मान −9 से 9 के बीच है, इसलिए 10 + X − Y का मान 1 से 19 के बीच है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस सीमा में 11 का एकमात्र गुणज 11 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 + X − Y = 11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X − Y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: X = 5 तथा Y = 4 लेने पर संख्या 354849 = 11 × 32,259 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः (X − Y) का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 पुरुष या 5 महिलाएँ एक कार्य को 12 दिन में पूरा कर सकती हैं। 3 पुरुष 4 दिन कार्य करके चले जाते हैं। शेष कार्य को 5 दिन में पूरा करने के लिए कितनी महिलाओं की आवश्यकता होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरे कार्य को 1 मानें, तथा ध्यान दें कि 3 पुरुषों का एक दिन का कार्य 5 महिलाओं के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 पुरुषों का एक दिन का कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 पुरुषों द्वारा 4 दिन में किया गया कार्य = 4 × (1/12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष कार्य = 1 − 1/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 महिलाएँ पूरा कार्य 12 दिन में करती हैं, अतः एक महिला का एक दिन का कार्य = 1 / (5 × 12) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2/3 कार्य के लिए आवश्यक महिला-दिन = (2/3) × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 दिन में पूरा करने के लिए महिलाएँ = 40 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 8 महिलाएँ 5 दिन में 8 × 5 × (1/60) = 40/60 = 2/3 कार्य करती हैं ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> महिलाओं की आवश्यकता होगी।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित धनराशि साधारण ब्याज पर 8 वर्ष में स्वयं की तीन गुनी हो जाती है। उसी दर पर वह कितने वर्षों में स्वयं की छह गुनी हो जाएगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 वर्ष</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साधारण ब्याज में ब्याज समय के अनुक्रमानुपाती होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना धनराशि P है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 वर्ष में मिश्रधन 3P है, अतः ब्याज = 3P − P = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2P</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धनराशि के 6P होने के लिए ब्याज = 6P − P = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5P</span><span style=\"font-family:'Mangal'\"> चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2P ब्याज के लिए 8 वर्ष लगते हैं, अतः P ब्याज के लिए 8 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 वर्ष</span><span style=\"font-family:'Mangal'\"> लगेंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5P ब्याज के लिए 5 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष</span><span style=\"font-family:'Mangal'\"> लगेंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दर = (2P × 100) / (P × 8) = 25% वार्षिक, अतः 5P ब्याज का समय = (5P × 100) / (P × 25)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः धनराशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 वर्ष (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में स्वयं की छह गुनी हो जाएगी।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यापारी एक वस्तु के अंकित मूल्य पर 20% की छूट देता है और फिर भी 28% का लाभ कमाता है। वस्तु के क्रय मूल्य और अंकित मूल्य का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 : 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 8</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छूट और लाभ दोनों से एक ही विक्रय मूल्य मिलता है, अतः दोनों व्यंजकों को बराबर रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छूट से विक्रय मूल्य = अंकित मूल्य × (100% − 20%) = MP × </span><span style=\"font-weight:bold;font-family:'Mangal'\">80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ से विक्रय मूल्य = क्रय मूल्य × (100% + 28%) = CP × </span><span style=\"font-weight:bold;font-family:'Mangal'\">128%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MP × 80% = CP × 128%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CP / MP = 80 / 128</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पदों में 16 का भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 5/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CP : MP = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 : 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: यदि MP = ₹800 हो, तो SP = ₹640 तथा CP = 640 / 1.28 = ₹500, और 500 : 800 = 5 : 8 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: CP : MP = (100 − छूट%) : (100 + लाभ%)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 80 : 128</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 5 : 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रय मूल्य और अंकित मूल्य का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 : 8 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मोटर चालक 45 मिनट में 30 km की दूरी तय करता है। वह पहले 10 मिनट x km/h की चाल से, अगले 15 मिनट 3x km/h की चाल से तथा शेष समय x km/h की चाल से चलता है। x का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालें km/h में हैं, अतः प्रत्येक समय-खंड को घंटों में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष समय = 45 − 10 − 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 मिनट = 1/6 घंटा, 15 मिनट = 1/4 घंटा तथा 20 मिनट = 1/3 घंटा</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक खंड के लिए दूरी = चाल × समय।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला खंड = x × (1/6) = x/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा खंड = 3x × (1/4) = 3x/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा खंड = x × (1/3) = x/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूरी = x/6 + 3x/4 + x/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2x + 9x + 4x) / 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">15x/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15x/12 = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (30 × 12) / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 24 × (1/6) = 4 km, 72 × (1/4) = 18 km, 24 × (1/3) = 8 km; कुल 30 km ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की वर्तमान आयु का दोगुना, उसके पुत्र की वर्तमान आयु के नौ गुने से 6 वर्ष कम है, तथा पुत्र की वर्तमान आयु का पाँच गुना, पिता की वर्तमान आयु से 8 वर्ष अधिक है। उनकी वर्तमान आयुओं में कितना अंतर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 वर्ष</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना पिता की वर्तमान आयु F वर्ष तथा पुत्र की वर्तमान आयु S वर्ष है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली शर्त: 2F = 9S − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी शर्त: 5S = F + 8, अतः F = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5S − 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली शर्त में F = 5S − 8 रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2(5S − 8) = 9S − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10S − 16 = 9S − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F = (5 × 10) − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 42 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 2 × 42 = 84 = (9 × 10) − 6 ✓ तथा 5 × 10 = 50 = 42 + 8 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उनकी वर्तमान आयुओं में अंतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 वर्ष (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित वितरण का माध्य 50 है और कुल बारंबारता 60 है। (3x + 2y) का मान क्या है?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790406824244_image002.png\" width=\"442\" height=\"137\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">76</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">82</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो अज्ञात के लिए दो समीकरण चाहिए: एक कुल बारंबारता से और एक माध्य से।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल बारंबारता: 6 + 14 + x + 10 + y = 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span><span style=\"font-family:'Mangal'\"> … (1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ग चिह्न 10, 30, 50, 70 तथा 90 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σfx = (6 × 10) + (14 × 30) + (x × 50) + (10 × 70) + (y × 90)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 60 + 420 + 50x + 700 + 90y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,180 + 50x + 90y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्य = Σfx / N, अतः 50 = (1,180 + 50x + 90y) / 60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,180 + 50x + 90y = 3,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50x + 90y = 1,820</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 से भाग देने पर: 5x + 9y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">182</span><span style=\"font-family:'Mangal'\"> … (2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1) से x = 30 − y, इसे (2) में रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5(30 − y) + 9y = 182</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 + 4y = 182</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> तथा x = 30 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3x + 2y = (3 × 22) + (2 × 8) = 66 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">82</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः (3x + 2y) का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">82 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">78 विद्यार्थियों की एक कक्षा ने भौतिकी की परीक्षा दी। 17 विद्यार्थियों के अंकों का औसत 70 था। शेष विद्यार्थियों के अंकों का औसत 90 था। पूरी कक्षा के अंकों का औसत (एक दशमलव स्थान तक पूर्णांकित) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85.6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80.7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84.4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">92.1</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसत, कुल योग में संख्या का भाग देने पर मिलता है, अतः कुल योग से चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 विद्यार्थियों के कुल अंक = 17 × 70 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष विद्यार्थी = 78 − 17 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">61</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61 विद्यार्थियों के कुल अंक = 61 × 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,490</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरी कक्षा के कुल अंक = 1,190 + 5,490 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6,680</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कक्षा का औसत = 6,680 / 78 = 85.64…</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दशमलव स्थान तक पूर्णांकित करने पर = </span><span style=\"font-weight:bold;font-family:'Mangal'\">85.6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: भारित औसत = [(n₁ × a₁) + (n₂ × a₂)] / (n₁ + n₂)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [(17 × 70) + (61 × 90)] / 78</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 85.6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पूरी कक्षा के अंकों का औसत </span><span style=\"font-weight:bold;font-family:'Mangal'\">85.6 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान ज्ञात कीजिए: 14 − 6 × 5 + 18 ÷ 3 × 2</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले गुणा और भाग बाएँ से दाएँ करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 ÷ 3 × 2 = 6 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक 14 − 30 + 12 बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 − 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−16 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक बेलन की त्रिज्या 25% बढ़ा दी जाती है और उसकी ऊँचाई x% घटा दी जाती है जिससे बेलन का आयतन अपरिवर्तित रहता है। x ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना मूल त्रिज्या = r तथा मूल ऊँचाई = h है, अतः मूल आयतन V = πr²h है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई त्रिज्या = r × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.25r</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई x% घटती है, अतः नई ऊँचाई = h × (100 − x)/100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया आयतन = π × (1.25r)² × h × (100 − x)/100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयतन समान रहता है, अतः π × (1.25r)² × h × (100 − x)/100 = πr²h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5625 × (100 − x)/100 = 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 − x = 100 / 1.5625 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 100 − 64 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: π × (1.25r)² × 0.64h = π × 1.5625 × 0.64 × r²h = πr²h ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Shortcut:</span><span style=\"font-family:'Mangal'\"> त्रिज्या × 5/4 → r² × 25/16, अतः ऊँचाई × 16/25 होनी चाहिए; कमी = 9/25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो वृत्तों के केंद्र C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> और C</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> हैं तथा उनकी त्रिज्याएँ क्रमशः r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> और r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> हैं। यदि उनके केंद्रों के बीच की दूरी r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> − r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> के बराबर है, तो दोनों वृत्तों पर कितनी उभयनिष्ठ स्पर्श रेखाएँ खींची जा सकती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केंद्रों के बीच की दूरी की तुलना दोनों त्रिज्याओं से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केंद्रों के बीच की दूरी = r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> − r</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">, अर्थात् त्रिज्याओं का अंतर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब केंद्रों के बीच की दूरी त्रिज्याओं के अंतर के बराबर होती है, तो छोटा वृत्त बड़े वृत्त के अंदर रहता है और उसे ठीक एक बिंदु पर स्पर्श करता है: वृत्त अंतःस्पर्श करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उभयनिष्ठ स्पर्श रेखा दोनों वृत्तों को स्पर्श करनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पर्श बिंदु पर एक ही रेखा दोनों वृत्तों को स्पर्श करती है, अतः वहाँ एक उभयनिष्ठ स्पर्श रेखा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई अन्य रेखा दोनों को स्पर्श नहीं कर सकती, क्योंकि छोटे वृत्त का हर दूसरा बिंदु बड़े वृत्त के पूरी तरह अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उभयनिष्ठ स्पर्श रेखाओं की संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संदर्भ के लिए: दूर-दूर स्थित वृत्तों की 4 उभयनिष्ठ स्पर्श रेखाएँ होती हैं, बाह्य स्पर्श करने वाले वृत्तों की 3, प्रतिच्छेद करने वाले वृत्तों की 2, अंतःस्पर्श करने वाले वृत्तों की 1 तथा एक के अंदर स्थित दूसरे वृत्त की 0.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उभयनिष्ठ स्पर्श रेखाओं की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A एक कार्य को 60 दिन में पूरा कर सकता है। B, A से 50% कम कुशल है तथा C, B से 50% अधिक कुशल है। यदि B और C मिलकर 20 दिन कार्य करें, तो शेष कार्य को A अकेला कितने दिन में पूरा करेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32 दिन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A से शुरू करके कुशलताओं को एक दिन के कार्य में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का एक दिन का कार्य = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, 50% कम कुशल है, अतः B का एक दिन का कार्य = (1/60) × 50% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, B से 50% अधिक कुशल है, अतः C का एक दिन का कार्य = (1/120) × 150% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(B + C) का एक दिन का कार्य = 1/120 + 1/80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2 + 3) / 240</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">5/240</span><span style=\"font-family:'Mangal'\"> = 1/48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और C द्वारा 20 दिन में किया गया कार्य = 20 × (1/48) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष कार्य = 1 − 5/12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A अकेले का समय = (7/12) / (1/60) = (7/12) × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शेष कार्य को A अकेला </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 दिन (विकल्प B)</span><span style=\"font-family:'Mangal'\"> में पूरा करेगा।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 3 : 5 :: 7.2 : x तथा 6 : 9 :: y : 12 है, तो x और y का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 : 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 : 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समानुपात a : b :: c : d में बाह्य पदों का गुणनफल मध्य पदों के गुणनफल के बराबर होता है: a × d = b × c.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला समानुपात: 3 : 5 :: 7.2 : x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 × x = 5 × 7.2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3x = 36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा समानुपात: 6 : 9 :: y : 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 × 12 = 9 × y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 = 9y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x : y = 12 : 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पदों में 4 का भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 : 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x और y का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 : 2 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 cm व्यास के एक ठोस गोले को दो बराबर भागों में काटा जाता है। दोनों भागों का कुल पृष्ठीय क्षेत्रफल कितना है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,386 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,772 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,079 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,732.5 cm²</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोले की त्रिज्या = 21 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10.5 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोले को दो भागों में काटने पर पूरा वक्र पृष्ठ बना रहता है और दो समतल वृत्ताकार फलक जुड़ जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरे गोले का वक्र पृष्ठ = 4πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो समतल फलक = 2 × πr² = 2πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों भागों का कुल पृष्ठीय क्षेत्रफल = 4πr² + 2πr² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6 × (22/7) × 10.5 × 10.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6 × 22 × 1.5 × 10.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6 × 346.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,079 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: प्रत्येक अर्धगोले का TSA = 3πr², अतः दो भाग = 2 × 3πr² = 6πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6 × (22/7) × 110.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2,079 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों भागों का कुल पृष्ठीय क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,079 cm² (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक चुनाव में तीन उम्मीदवार P, Q और R खड़े हुए। P को 22% मत तथा Q को 46% मत मिले, जबकि R दूसरे स्थान पर रहा। यदि Q ने चुनाव 5,880 मतों से जीता, तो मतों की कुल संख्या कितनी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले R का भाग ज्ञात करें, क्योंकि जीत का अंतर दूसरे स्थान वाले से होता है, P से नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R का भाग = 100% − 22% − 46% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R का 32%, P के 22% से अधिक है, अतः R वास्तव में दूसरे स्थान पर है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R पर Q की बढ़त = कुल मतों का 46% − 32% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल मतों का 14% = 5,880</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल मत = (5,880 / 14) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: Q = 42,000 × 46% = 19,320 तथा R = 42,000 × 32% = 13,440; अंतर = 5,880 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मतों की कुल संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">42,000 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> थी।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाबर पट्टी में लुप्त हो जाने वाली नदियाँ उसके दक्षिण में फिर से धरातल पर आ जाती हैं और एक नम, दलदली क्षेत्र बनाती हैं। यह क्षेत्र किस नाम से जाना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बांगर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खादर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाबर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तराई</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तराई</span><span style=\"font-family:'Mangal'\"> भाबर के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिण</span><span style=\"font-family:'Mangal'\"> में स्थित नम और दलदली पट्टी है, जहाँ भाबर में लु "}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राष्ट्रीय सांख्यिकी कार्यालय द्वारा 5 जून 2026 को जारी अनंतिम अनुमानों के अनुसार 2025-26 में भारत का वास्तविक GDP किस दर से बढ़ा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.7%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.1%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.9%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सांख्यिकी एवं कार्यक्रम कार्यान्वयन मंत्रालय</span><span style=\"font-family:'Mangal'\"> (राष्ट्रीय सांख्यिकी कार्यालय) द्वारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 जून 2026</span><span style=\"font-family:'Mangal'\"> को जारी </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनंतिम अनुमानों</span><span style=\"font-family:'Mangal'\"> के अनुसार </span><span style=\"font-weight:bold;font-family:'Mangal'\">2025-26</span><span style=\"font-family:'Mangal'\"> में भारत का </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक GDP</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.7%</span><span style=\"font-family:'Mangal'\"> बढ़ा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">2024-25</span><span style=\"font-family:'Mangal'\"> में वास्तविक GDP </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.1%</span><span style=\"font-family:'Mangal'\"> बढ़ा था, अर्थात् 2025-26 में वृद्धि </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.6</span><span style=\"font-family:'Mangal'\"> प्रतिशत बिंदु अधिक रही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025-26 की </span><span style=\"font-weight:bold;font-family:'Mangal'\">चौथी तिमाही</span><span style=\"font-family:'Mangal'\"> (जनवरी से मार्च) में वास्तविक GDP </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.8%</span><span style=\"font-family:'Mangal'\"> बढ़ा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025-26 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सांकेतिक (नॉमिनल) GDP</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">8.9%</span><span style=\"font-family:'Mangal'\"> बढ़ा और 2025-26 के लिए स्थिर कीमतों पर वास्तविक GDP </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹323.12 लाख करोड़</span><span style=\"font-family:'Mangal'\"> अनुमानित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वृद्धि दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.7% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में किस तिथि को 'राष्ट्रीय अंतरिक्ष दिवस' घोषित किया गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23 अगस्त</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 फ़रवरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 जुलाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 मई</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 अगस्त</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय अंतरिक्ष दिवस</span><span style=\"font-family:'Mangal'\"> मनाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">23 अगस्त 2023</span><span style=\"font-family:'Mangal'\"> को ISRO के </span><span style=\"font-weight:bold;font-family:'Mangal'\">चंद्रयान-3</span><span style=\"font-family:'Mangal'\"> मिशन के </span><span style=\"font-weight:bold;font-family:'Mangal'\">विक्रम</span><span style=\"font-family:'Mangal'\"> लैंडर ने चंद्रमा के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिणी ध्रुव</span><span style=\"font-family:'Mangal'\"> के निकट सॉफ्ट लैंडिंग की थी और उस स्थान का नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">शिव शक्ति</span><span style=\"font-family:'Mangal'\"> बिंदु रखा गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला राष्ट्रीय अंतरिक्ष दिवस </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 अगस्त 2024</span><span style=\"font-family:'Mangal'\"> को \"चाँद को छूते हुए जीवन को छूना: भारत की अंतरिक्ष गाथा\" विषय के साथ मनाया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">28 फ़रवरी</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय विज्ञान दिवस</span><span style=\"font-family:'Mangal'\"> (रमन प्रभाव की खोज, 1928), </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 मई</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">राष्ट्रीय प्रौद्योगिकी दिवस</span><span style=\"font-family:'Mangal'\"> (पोखरण-II परमाणु परीक्षण, 1998) मनाया जाता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 जुलाई</span><span style=\"font-family:'Mangal'\"> 1969 के अपोलो 11 चंद्रमा अवतरण की तिथि है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राष्ट्रीय अंतरिक्ष दिवस </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 अगस्त (विकल्प A)</span><span style=\"font-family:'Mangal'\"> को मनाया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1973 के सर्वोच्च न्यायालय के निम्नलिखित में से किस ऐतिहासिक निर्णय में यह व्यवस्था दी गई कि संसद संशोधनों के द्वारा संविधान के 'मूल ढाँचे' में परिवर्तन नहीं कर सकती?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चंपकम दोरायराजन मामला</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिनर्वा मिल्स मामला</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केशवानंद भारती मामला</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोलकनाथ मामला</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">केशवानंद भारती</span><span style=\"font-family:'Mangal'\"> मामले (केशवानंद भारती बनाम केरल राज्य) में, जिसका निर्णय सर्वोच्च न्यायालय की </span><span style=\"font-weight:bold;font-family:'Mangal'\">13 न्यायाधीशों</span><span style=\"font-family:'Mangal'\"> की पीठ ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 अप्रैल 1973</span><span style=\"font-family:'Mangal'\"> को दिया, बहुमत ने कहा कि संसद </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुच्छेद 368</span><span style=\"font-family:'Mangal'\"> के अंतर्गत संविधान के किसी भी भाग में संशोधन कर सकती है, परंतु उसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">मूल ढाँचे</span><span style=\"font-family:'Mangal'\"> को नहीं बदल सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे पहले </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोलकनाथ</span><span style=\"font-family:'Mangal'\"> मामले (</span><span style=\"font-weight:bold;font-family:'Mangal'\">1967</span><span style=\"font-family:'Mangal'\">) में कहा गया था कि संसद मौलिक अधिकारों में संशोधन नहीं कर सकती; केशवानंद भारती निर्णय ने इस मत को पलट दिया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मिनर्वा मिल्स</span><span style=\"font-family:'Mangal'\"> मामले (</span><span style=\"font-weight:bold;font-family:'Mangal'\">1980</span><span style=\"font-family:'Mangal'\">) में सर्वोच्च न्यायालय ने मूल ढाँचे के सिद्धांत को लागू करते हुए </span><span style=\"font-weight:bold;font-family:'Mangal'\">42वें संविधान संशोधन अधिनियम, 1976</span><span style=\"font-family:'Mangal'\"> के उन खंडों को रद्द कर दिया, जिन्होंने संविधान संशोधनों को न्यायिक समीक्षा से बाहर कर दिया था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">चंपकम दोरायराजन</span><span style=\"font-family:'Mangal'\"> मामला (</span><span style=\"font-weight:bold;font-family:'Mangal'\">1951</span><span style=\"font-family:'Mangal'\">) शिक्षण संस्थाओं में आरक्ष
