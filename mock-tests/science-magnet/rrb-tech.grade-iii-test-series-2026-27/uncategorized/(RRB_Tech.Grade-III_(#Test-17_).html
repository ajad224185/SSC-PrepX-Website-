<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>35.) RRB Tech.Grade-III (#Test-17   - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 Ω, 6 Ω और 4 Ω के तीन प्रतिरोधक समांतर क्रम में जोड़े गए हैं। समतुल्य प्रतिरोध ________ है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.05 Ω</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 Ω</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 Ω</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समांतर क्रम में जुड़े प्रतिरोधकों के लिए समतुल्य प्रतिरोध का व्युत्क्रम अलग-अलग प्रतिरोधों के व्युत्क्रमों का योग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/R = 1/12 + 1/6 + 1/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1/12 + 2/12 + 3/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6/12 = 1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समांतर संयोजन का समतुल्य प्रतिरोध सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे छोटे प्रतिरोध से कम</span><span style=\"font-family:'Mangal'\"> होता है, यहाँ 4 Ω से कम, जिससे 22 Ω संभव नहीं; 22 Ω तो श्रेणी क्रम का मान होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Shortcut:</span><span style=\"font-family:'Mangal'\"> 1/R = 1/R</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> + 1/R</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> + 1/R</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> = (1 + 2 + 3) / 12 = 1/2, अतः R = 2 Ω.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समतुल्य प्रतिरोध 2 Ω है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790405918444_image001.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(i), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पोरीफेरा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">भोजन के कण छिद्रों से भीतर लाने के लिए जल धाराओं पर निर्भर</span><span style=\"font-family:'Mangal'\">: स्पंज शिकार नहीं पकड़ सकते और अपने छिद्रों से बहते जल के साथ आए कणों को ही खाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नाइडेरिया</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊतक स्तर का संगठन; शिकार पकड़ने के लिए स्पर्शक</span><span style=\"font-family:'Mangal'\">: हाइड्रा, जेलीफ़िश और प्रवाल में विशिष्ट कोशिकाएँ विशेष कार्य करती हैं, जैसे शिकार पकड़ने के लिए स्पर्शक।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्लैटीहेल्मिन्थीज</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">चपटा शरीर और द्विपार्श्व सममिति; परजीवी रूपों में हुक और चूषक</span><span style=\"font-family:'Mangal'\">: चपटे शरीर के कारण गैसों का विसरण बिना विशेष अंगों के हो जाता है, और हुक तथा चूषक परजीवी को परपोषी से जकड़े रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऐनेलिडा</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">खंडों में बँटा बेलनाकार शरीर; अंग तंत्र स्तर का संगठन</span><span style=\"font-family:'Mangal'\">: केंचुआ इसका उदाहरण है, और खंडीभवन से इन्हें लचीली और सटीक गति मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्यों में यह किससे तय होता है कि बच्चा लड़का होगा या लड़की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता द्वारा दिए गए गुणसूत्र से</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता द्वारा दिया गया गुणसूत्र X है या Y, इससे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस तापमान पर निषेचित अंडाणु विकसित होता है, उससे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्मनज में गुणसूत्रों की कुल संख्या से</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलग-अलग जातियाँ नवजात का लिंग तय करने के लिए बहुत भिन्न युक्तियाँ अपनाती हैं; कुछ पूरी तरह तापमान जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्यावरणीय संकेतों</span><span style=\"font-family:'Mangal'\"> पर निर्भर रहती हैं, परंतु मनुष्य नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक व्यक्ति में दो लिंग गुणसूत्र होते हैं: स्त्री में </span><span style=\"font-weight:bold;font-family:'Mangal'\">XX</span><span style=\"font-family:'Mangal'\"> और पुरुष में </span><span style=\"font-weight:bold;font-family:'Mangal'\">XY</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता बच्चे को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सदैव X</span><span style=\"font-family:'Mangal'\"> गुणसूत्र देती है, अतः उसका योगदान लिंग तय नहीं कर सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता या तो X देता है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">लड़की (XX)</span><span style=\"font-family:'Mangal'\"> होती है, या Y देता है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">लड़का (XY)</span><span style=\"font-family:'Mangal'\"> होता है, और इसीलिए आधे बच्चे लड़के और आधे लड़कियाँ होने की अपेक्षा रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बच्चे का लिंग इस पर निर्भर है कि पिता द्वारा दिया गया गुणसूत्र X है या Y </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): ठोस सोडियम क्लोराइड विद्युत का चालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ठोस आयनिक यौगिक में उसकी दृढ़ संरचना के कारण आयन गति नहीं कर सकते।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी पदार्थ से विद्युत के चालन के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐसे आवेशित कण चाहिए जो गति कर सकें</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ठोस सोडियम क्लोराइड में Na</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">+</span><span style=\"font-family:'Mangal'\"> और Cl</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−</span><span style=\"font-family:'Mangal'\"> आयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">दृढ़ संरचना</span><span style=\"font-family:'Mangal'\"> में जकड़े रहते हैं, अतः वे गति नहीं कर सकते, और ठोस विद्युत का </span><span style=\"font-weight:bold;font-family:'Mangal'\">चालन नहीं</span><span style=\"font-family:'Mangal'\"> करता → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R इसी दृढ़ संरचना और आयनों की अगतिशीलता को सही बताता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही आयन लवण को जल में घोलने या पिघलाने पर गति करने लगते हैं, इसीलिए आयनिक यौगिक विलयन में और पिघली हुई अवस्था में चालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्य 28 दिन के मासिक धर्म चक्र में दिन 1 से 5 के दौरान क्या होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंडाशय से एक परिपक्व अंडाणु मुक्त होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भाशय की भीतरी परत कुछ रक्त के साथ बाहर निकल जाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भाशय की भीतरी परत मोटी और रक्त वाहिकाओं से भरपूर हो जाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्मनज गर्भाशय की दीवार में स्थापित हो जाता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मासिक धर्म चक्र प्रायः 21 से 35 दिनों में, अधिकतर लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 दिनों</span><span style=\"font-family:'Mangal'\"> में दोहराता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">दिन 1 से 5 मासिक धर्म</span><span style=\"font-family:'Mangal'\"> के दिन हैं: निषेचन न होने के कारण गर्भाशय की मोटी परत की अब आवश्यकता नहीं रहती, और वह कुछ रक्त के साथ योनि से </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाहर निकल</span><span style=\"font-family:'Mangal'\"> जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिन 6 से 14 तक यह परत धीरे-धीरे </span><span style=\"font-weight:bold;font-family:'Mangal'\">फिर से बनती</span><span style=\"font-family:'Mangal'\"> है और अंडाणु परिपक्व होता है, तथा अंडोत्सर्जन, अर्थात् अंडाणु का मुक्त होना, चक्र के लगभग मध्य में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिन 15 से 28 तक परत </span><span style=\"font-weight:bold;font-family:'Mangal'\">और मोटी तथा रक्त वाहिकाओं से भरपूर</span><span style=\"font-family:'Mangal'\"> हो जाती है, युग्मनज के लिए तैयार; स्थापन तभी होता है जब निषेचन हुआ हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दिन 1 से 5 के दौरान गर्भाशय की भीतरी परत कुछ रक्त के साथ बाहर निकल जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. तार की लंबाई बढ़ाने पर पदार्थ की प्रतिरोधकता बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विद्युत टोस्टर और विद्युत इस्तरी की कुंडलियाँ शुद्ध धातु के बजाय मिश्रधातु की बनाई जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. परिपथ में विद्युत धारा की दिशा परंपरा से इलेक्ट्रॉनों के प्रवाह की दिशा के विपरीत ली जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रतिरोधकता </span><span style=\"font-weight:bold;font-family:'Mangal'\">पदार्थ</span><span style=\"font-family:'Mangal'\"> और उसके तापमान का गुण है; लंबाई बढ़ाने से तार का </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिरोध</span><span style=\"font-family:'Mangal'\"> बढ़ता है, उसकी प्रतिरोधकता नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैंगनिन और कॉन्स्टैंटन</span><span style=\"font-family:'Mangal'\"> जैसी मिश्रधातुओं की प्रतिरोधकता शुद्ध धातुओं से बहुत अधिक होती है और वे उच्च तापमान पर सरलता से ऑक्सीकृत नहीं होतीं, इसलिए तापन कुंडलियाँ मिश्रधातु की बनती हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विद्युत धारा को पहले धन आवेशों का प्रवाह माना गया था, इसलिए परंपरा से धारा की दिशा इलेक्ट्रॉनों के प्रवाह के </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत</span><span style=\"font-family:'Mangal'\"> ली जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक जहाज़ समुद्र में ऊर्ध्वाधर नीचे की ओर पराश्रव्य संकेत भेजता है और डूबी हुई वस्तु से प्रतिध्वनि 6 s बाद प्राप्त करता है। यदि समुद्री जल में ध्वनि की चाल 1500 m/s हो, तो वस्तु की गहराई है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4500 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9000 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">250 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2250 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोनार में पराश्रव्य संकेत जहाज़ से वस्तु तक जाकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">लौटता</span><span style=\"font-family:'Mangal'\"> है, अतः 6 s में वह गहराई का </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुना</span><span style=\"font-family:'Mangal'\"> पथ तय करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तय की गई कुल दूरी = चाल × समय</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1500 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9000 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु की गहराई = 9000 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4500 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Shortcut:</span><span style=\"font-family:'Mangal'\"> गहराई = (v × t) / 2 = (1500 × 6) / 2 = 4500 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वस्तु की गहराई 4500 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे सीधे धारावाही तार के चारों ओर चुंबकीय क्षेत्र रेखाएँ होती हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार के समांतर सरल रेखाएँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार से बाहर की ओर निकलती सरल रेखाएँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार को केंद्र मानकर बने संकेंद्री वृत्त</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार को एक फोकस मानकर बने दीर्घवृत्त</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब सीधे तार में धारा बहती है, तब उसके चारों ओर गत्ते पर छिड़का लोहे का चूर्ण </span><span style=\"font-weight:bold;font-family:'Mangal'\">संकेंद्री वृत्तों</span><span style=\"font-family:'Mangal'\"> के पैटर्न में व्यवस्थित हो जाता है, जिनके केंद्र में तार होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से किसी भी वृत्त पर रखी कंपास की सुई वृत्त की </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्पर्श रेखा</span><span style=\"font-family:'Mangal'\"> की दिशा में ठहरती है, जिससे पुष्टि होती है कि क्षेत्र रेखाएँ वृत्त हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तार से </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूर जाने पर वृत्त बड़े</span><span style=\"font-family:'Mangal'\"> होते जाते हैं, जो दर्शाता है कि दूरी के साथ क्षेत्र दुर्बल होता जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समांतर सरल रेखाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिनालिका के भीतर</span><span style=\"font-family:'Mangal'\"> का पैटर्न हैं, सीधे तार के चारों ओर का नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सीधे धारावाही तार के चारों ओर क्षेत्र रेखाएँ तार को केंद्र मानकर बने संकेंद्री वृत्त हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूची I का सूची II से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790405918444_image002.png\" width=\"442\" height=\"136\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही उत्तर चुनिए:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(ii), (d)-(iii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(ii), (c)-(i), (d)-(iv)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(iv), (d)-(ii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">रेत में मिला कपूर</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्ध्वपातन</span><span style=\"font-family:'Mangal'\">: धीरे गर्म करने पर कपूर सीधे वाष्प में बदल जाता है और ठंडी कीप पर सफ़ेद ठोस के रूप में जम जाता है, जबकि रेत पीछे रह जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जल में मिला सरसों का तेल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">पृथक्कारी कीप</span><span style=\"font-family:'Mangal'\">: दोनों द्रव आपस में नहीं मिलते, हल्का तेल ऊपरी परत बनाता है, और नीचे की जल की परत को स्टॉपकॉक से पहले निकाल लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बुरादे में मिली लोहे की कीलें</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबक</span><span style=\"font-family:'Mangal'\">: लोहे के चुंबकीय गुण से, जो बुरादे में नहीं होता, कीलें अलग कर ली जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">संतृप्त विलयन से कॉपर सल्फेट</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिस्टलीकरण</span><span style=\"font-family:'Mangal'\">: गर्म संतृप्त विलयन को छानकर ठंडा किया जाता है, और शुद्ध क्रिस्टल अलग हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही मिलान (a)-(iii), (b)-(i), (c)-(ii), (d)-(iv) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़ेरस सल्फेट के हरे क्रिस्टलों को सूखी क्वथन नली में तेज़ गर्म किया जाता है। बनने वाले उत्पाद हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FeO, SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> और H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FeS और O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> और SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe और SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्म करने पर फ़ेरस सल्फेट क्रिस्टलों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरा रंग</span><span style=\"font-family:'Mangal'\"> बदल जाता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">जलते हुए सल्फर की विशिष्ट गंध</span><span style=\"font-family:'Mangal'\"> आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ही अभिकारक सरल उत्पादों में टूटता है, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपघटन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2FeSO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">(s) → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">(s) + SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">(g) + SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">(g)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">फ़ेरिक ऑक्साइड</span><span style=\"font-family:'Mangal'\"> (Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">) ठोस के रूप में बचता है, जबकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">सल्फर डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सल्फर ट्राइऑक्साइड</span><span style=\"font-family:'Mangal'\"> गैसों के रूप में निकल जाती हैं, और इन्हीं गैसों से गंध आती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्पाद Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> और SO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सभी क्षारक जल में घुलनशील होते हैं और क्षार कहलाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. शुष्क HCl गैस शुष्क नीले लिटमस पत्र का रंग नहीं बदलती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अधातु ऑक्साइड प्रकृति में अम्लीय होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी क्षारक जल में नहीं घुलते</span><span style=\"font-family:'Mangal'\">; केवल जल में घुलनशील क्षारक ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षार</span><span style=\"font-family:'Mangal'\"> कहलाते हैं, जो छूने में साबुन जैसे, स्वाद में कड़वे और संक्षारक होते हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. HCl अम्लीय व्यवहार तभी दिखाता है जब वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">+</span><span style=\"font-weight:bold;font-family:'Mangal'\">(aq) आयन</span><span style=\"font-family:'Mangal'\"> बनाए, और इसके लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल</span><span style=\"font-family:'Mangal'\"> चाहिए; शुष्क HCl गैस में ऐसे आयन नहीं होते, इसलिए वह शुष्क नीले लिटमस को लाल नहीं करती → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अधातु ऑक्साइड कार्बन डाइऑक्साइड क्षारक कैल्सियम हाइड्रॉक्साइड से अभिक्रिया करके लवण और जल देता है, ठीक अम्ल की तरह, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधातु ऑक्साइड अम्लीय</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 2 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हृदय की धड़कन और भोजन देखकर मुँह में पानी आने जैसी अनैच्छिक क्रियाएँ मुख्यतः किसके द्वारा नियंत्रित होती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्रमस्तिष्क</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेरुरज्जु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मध्यमस्तिष्क और पश्चमस्तिष्क</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज्ञानेंद्रियाँ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्तिष्क के तीन मुख्य भाग हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">अग्रमस्तिष्क</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">मध्यमस्तिष्क</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चमस्तिष्क</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हृदय का धड़कना</span><span style=\"font-family:'Mangal'\"> या मनपसंद भोजन देखकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुँह में पानी आना</span><span style=\"font-family:'Mangal'\"> जैसी क्रियाएँ हमारे सोचे बिना होती हैं; ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनैच्छिक क्रियाएँ</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसी अनेक अनैच्छिक क्रियाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">मध्यमस्तिष्क और पश्चमस्तिष्क</span><span style=\"font-family:'Mangal'\"> द्वारा नियंत्रित होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अग्रमस्तिष्क सोचने वाला भाग है और कुर्सी खिसकाने जैसी </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐच्छिक</span><span style=\"font-family:'Mangal'\"> क्रियाओं को नियंत्रित करता है, तथा मेरुरज्जु प्रतिवर्ती चापों को सँभालती है और मस्तिष्क तक तथा मस्तिष्क से संकेत ले जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये अनैच्छिक क्रियाएँ मुख्यतः मध्यमस्तिष्क और पश्चमस्तिष्क द्वारा नियंत्रित होती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बोर के परमाणु मॉडल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. K-कोश नाभिक के सबसे निकट का कोश है और इसकी ऊर्जा सबसे कम होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इलेक्ट्रॉन दो अनुमत कोशों के बीच में कहीं भी घूम सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. इलेक्ट्रॉन दोनों कोशों की ऊर्जाओं के अंतर के बराबर निश्चित ऊर्जा अवशोषित या उत्सर्जित करके दूसरे कोश में चला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बोर के मॉडल में कोशों को नाभिक से बढ़ती दूरी के क्रम में K, L, M, N कहा जाता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">K-कोश (n = 1) सबसे निकट है तथा उसकी ऊर्जा सबसे कम</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल अनुमत कोशों में</span><span style=\"font-family:'Mangal'\"> ही घूम सकते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">उनके बीच में नहीं</span><span style=\"font-family:'Mangal'\"> → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रत्येक कोश की ऊर्जा निश्चित होती है, अतः इलेक्ट्रॉन दूसरे कोश में तभी जा सकता है जब वह दोनों कोशों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्जा के अंतर के ठीक बराबर ऊर्जा अवशोषित या उत्सर्जित</span><span style=\"font-family:'Mangal'\"> करे → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे कमरे में प्रतिध्वनि स्पष्ट सुनाई न देने का मुख्य कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूल ध्वनि और प्रतिध्वनि के बीच समय अंतराल बहुत कम होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कम दूरियों पर ध्वनि की तीव्रता बहुत तेज़ी से घट जाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि की आवृत्ति बहुत अधिक होती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि बहुत धीमी चलती है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिध्वनि वह परावर्तित ध्वनि है जो मूल ध्वनि के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग</span><span style=\"font-family:'Mangal'\"> ध्वनि के रूप में कान तक पहुँचती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मस्तिष्क दोनों को तभी अलग कर पाता है जब परावर्तित ध्वनि मूल ध्वनि से पर्याप्त देर बाद पहुँचे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे कमरे में दीवारें इतनी पास होती हैं कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">परावर्तन बहुत जल्दी पहुँच जाते हैं</span><span style=\"font-family:'Mangal'\">, और मस्तिष्क उन्हें मूल ध्वनि से अलग नहीं कर पाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कमरा छोटा होने मात्र से ध्वनि की चाल, आवृत्ति और तीव्रता नहीं बदलतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिध्वनि स्पष्ट इसलिए नहीं सुनाई देती क्योंकि मूल ध्वनि और प्रतिध्वनि के बीच समय अंतराल बहुत कम होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब सूर्य के प्रकाश की एक पतली किरण-पुंज छोटे छेद से धुएँ से भरे कमरे में प्रवेश करती है, तो किरण-पुंज का पथ दिखाई देने लगता है। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धुएँ द्वारा प्रकाश का वर्ण-विक्षेपण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धुएँ में पूर्ण आंतरिक परावर्तन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडलीय अपवर्तन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धुएँ के कणों द्वारा प्रकाश का प्रकीर्णन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कमरे का धुआँ वायु में निलंबित </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूक्ष्म कणों</span><span style=\"font-family:'Mangal'\"> से बना होता है, कोलॉइड की तरह।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब किरण-पुंज इन कणों से टकराता है, तो प्रकाश सभी दिशाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकीर्णित</span><span style=\"font-family:'Mangal'\"> हो जाता है, और इस प्रकीर्णित प्रकाश का कुछ भाग किरण-पुंज के प्रत्येक बिंदु से हमारी आँखों तक पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">किरण-पुंज का पथ दिखाई देने लगता है</span><span style=\"font-family:'Mangal'\">; कोलॉइडी कणों द्वारा प्रका pan style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कोशिका झिल्ली </span><span style=\"font-weight:bold;font-family:'Mangal'\">लिपिड (वसा) और प्रोटीन</span><span style=\"font-family:'Mangal'\"> से बनी होती है; लिपिड एक द्विपरत बनाते हैं जिसमें प्रोटीन धँसे रहते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. झिल्ली के </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रोटीन द्वारपाल (Gatekeeper)</span><span style=\"font-family:'Mangal'\"> की तरह कार्य करते हैं और पदार्थों को कोशिका के भीतर तथा बाहर जाने में सहायता करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. झिल्ली के अणु उसके भीतर </span><span style=\"font-weight:bold;font-family:'Mangal'\">बगल में खिसक सकते हैं, पलट सकते हैं और घूम सकते हैं</span><span style=\"font-family:'Mangal'\">, इसीलिए झिल्ली को </span><span style=\"font-weight:bold;font-family:'Mangal'\">तरल</span><span style=\"font-family:'Mangal'\"> कहा जाता है; वे अपने स्थान पर स्थिर नहीं रहते → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पंप 200 kg जल को 20 s में 15 m की ऊँचाई तक उठाता है। g = 10 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span
