-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EARL में बचा हुआ अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है, और 8541 में बचा हुआ अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> है, अतः R = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘R’ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B, C, D, E, F और G में से प्रत्येक एक ही सप्ताह के अलग-अलग दिन, सोमवार से शुरू होकर रविवार तक, एक संग्रहालय देखने जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A गुरुवार को जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और E के बीच केवल दो व्यक्ति जाते हैं, और E, A से पहले नहीं जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, E से ठीक पहले जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B मंगलवार को जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, B के ठीक बाद जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, A के बाद परंतु C से पहले जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शनिवार को संग्रहालय कौन देखने जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिनों को क्रम से क्रमांकित करते हैं: सोमवार = 1, मंगलवार = 2, बुधवार = 3, गुरुवार = 4, शुक्रवार = 5, शनिवार = 6, रविवार = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A गुरुवार को जाता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और E के बीच केवल दो व्यक्ति जाते हैं, और E, A से पहले नहीं जाता → E = 4 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> (रविवार)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, E से ठीक पहले जाता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 6</span><span style=\"font-family:'Mangal'\"> (शनिवार)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B मंगलवार को जाता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, B के ठीक बाद जाता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 3</span><span style=\"font-family:'Mangal'\"> (बुधवार)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, A (दिन 4) के बाद परंतु C (दिन 6) से पहले जाता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 5</span><span style=\"font-family:'Mangal'\"> (शुक्रवार)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब केवल सोमवार बचा है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: सोमवार को D, मंगलवार को B, बुधवार को F, गुरुवार को A, शुक्रवार को G, शनिवार को C, रविवार को E.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शनिवार को संग्रहालय </span><span style=\"font-weight:bold;font-family:'Mangal'\">C (विकल्प C)</span><span style=\"font-family:'Mangal'\"> देखने जाता है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HLQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MQU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PSV</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह में पहले अक्षर से दूसरे तक और दूसरे से तीसरे तक का अंतर लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGK: C → G में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">, G → K में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> → दोनों अंतर समान</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MQU: M → Q में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">, Q → U में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> → दोनों अंतर समान</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PSV: P → S में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\">, S → V में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → दोनों अंतर समान</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HLQ: H → L में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">, परंतु L → Q में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → अंतर समान नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूहों में बीच का अक्षर अन्य दोनों के ठीक मध्य में है; केवल HLQ में ऐसा नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">HLQ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति P, Q, R, S, T, U और V एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T पंक्ति के ठीक मध्य में बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, T के बाईं ओर दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, R के ठीक बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T और Q के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U पंक्ति के अंतिम दाएँ छोर पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q का निकटतम पड़ोसी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R और V के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 7 तक क्रमांकित करते हैं। सभी सात व्यक्ति उत्तर दिशा की ओर मुख करके बैठे हैं, इसलिए बायाँ और दायाँ सामान्य रूप से ही लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T पंक्ति के ठीक मध्य में है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, T के बाईं ओर दूसरे स्थान पर है → R = 4 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, R के ठीक बाईं ओर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T और Q के बीच केवल एक व्यक्ति है → Q = 4 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, क्योंकि 4 − 2 = 2 पहले से R की सीट है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U अंतिम दाएँ छोर पर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब P और V के लिए सीट 3 और 5 बची हैं। P, Q (सीट 6) का निकटतम पड़ोसी नहीं है, अतः P सीट 5 पर नहीं बैठ सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 3</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">S, R, P, T, V, Q, U</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R सीट 2 पर और V सीट 5 पर है, अतः उनके बीच सीट 3 और 4 के व्यक्ति हैं, अर्थात् P और T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\"> व्यक्ति।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R और V के बीच बैठे व्यक्तियों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HMR : DIV</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KWB : GSF</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PBT : LXW</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NQE : JMI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CGK : YDO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NQE : JLI</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking":  (2 − 4 = −2 → −2 + 26 = 24 = X), परंतु T + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> है, W नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, CGK : YDO → C − 4 = Y ✓ (3 − 4 = −1 → −1 + 26 = 25 = Y), परंतु G − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\"> है, D नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, NQE : JLI → N − 4 = J ✓, परंतु Q − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> है, L नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">NQE : JMI (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KD 21 एक निश्चित तर्क के अनुसार MH 15 से संबंधित है। उसी तर्क के अनुसार PT 30, RX 24 से संबंधित है। उसी तर्क के अनुसार BJ 17 निम्नलिखित में से किस विकल्प से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DM 11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DN 11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CN 11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DN 12</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2p '\">दी गई अक्षर, संख्या और प्रतीक शृंखला को देखिए और उसके बाद दिए गए प्रश्न का उत्तर दीजिए। सभी संख्याएँ एक अंक की हैं। गिनती केवल बाएँ से दाएँ की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) 5 K 3 @ R 8 2 M 6 $ P 9 &amp; W 4 1 % L 7 * 3 (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला में ऐसी कितनी संख्याएँ हैं जिनमें से प्रत्येक के ठीक पहले एक अक्षर और ठीक बाद एक प्रतीक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला की प्रत्येक संख्या को एक-एक करके लें और उसके ठीक पहले तथा ठीक बाद वाले अवयव को देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5: यह पहला अवयव है, अतः इसके पहले कुछ नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 (K के बाद वाला): ठीक पहले K है, जो अक्षर है, और ठीक बाद @ है, जो प्रतीक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8: ठीक पहले R है, जो अक्षर है, परंतु ठीक बाद 2 है, जो संख्या है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2: ठीक पहले 8 है, जो संख्या है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6: ठीक पहले M है, जो अक्षर है, और ठीक बाद $ है, जो प्रतीक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9: ठीक पहले P है, जो अक्षर है, और ठीक बाद &amp; है, जो प्रतीक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4: ठीक पहले W है, जो अक्षर है, परंतु ठीक बाद 1 है, जो संख्या है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1: ठीक पहले 4 है, जो संख्या है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7: ठीक पहले L है, जो अक्षर है, और ठीक बाद * है, जो प्रतीक है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 (अंतिम): ठीक पहले * है, जो प्रतीक है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः संख्याएँ 3, 6, 9 और 7 दोनों शर्तों पर खरी उतरती हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार</span><span style=\"font-family:'Mangal'\"> संख्याएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति A, B, C, D, E, F, G और H एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B के दाईं ओर तीसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, B के ठीक बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, C और E दोनों का निकटतम पड़ोसी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, B के ठीक दाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F के ठीक सामने कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठों व्यक्तियों का मुख केंद्र की ओर है, अतः ‘दाएँ’ = वामावर्त (anticlockwise) और ‘बाएँ’ = दक्षिणावर्त (clockwise)। सीटों को दाईं ओर (वामावर्त) 1 से 8 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">B सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है, तथा 8 के बाद फिर 1 आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B के दाईं ओर तीसरे स्थान पर → A = 1 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A के ठीक दाईं ओर → C = 4 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के दाईं ओर दूसरे स्थान पर → E = 5 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, B के ठीक बाईं ओर → D = 1 − 1 = 0 → 0 + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, C (सीट 5) और E (सीट 7) दोनों का निकटतम पड़ोसी है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, B के ठीक दाईं ओर → F = 1 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">, और अंतिम बची सीट 3 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 8): </span><span style=\"font-weight:bold;font-family:'Mangal'\">B – F – H – A – C – G – E – D</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ के वृत्त में सामने वाला व्यक्ति 4 सीट दूर बैठता है: F सीट 2 पर है, अतः F के सामने सीट 2 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> है, जो G की सीट है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः F के ठीक सामने </span><span style=\"font-weight:bold;font-family:'Mangal'\">G (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, N की बहन है। N, O का पति है। P, O की पुत्री है। M का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की बहन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की माता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता या पिता का जीवनसाथी भी संतान का माता या पिता होता है, और एक ही माता-पिता की दो संतानें भाई-बहन होती हैं। P से शुरू करके एक-एक चरण चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N, O का पति है, अतः N और O पति-पत्नी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, O की पुत्री है, अतः O, P की माता है, और O का पति N, </span><span style=\"font-weight:bold;font-family:'Mangal'\">P का पिता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M, N की बहन है, अतः M, </span><span style=\"font-weight:bold;font-family:'Mangal'\">P के पिता की बहन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता की बहन होने के लिए M को O की बहन होना पड़ता; पिता की माता होने के लिए M को N की माता होना पड़ता; और बहन होने के लिए M और P के माता-पिता समान होने चाहिए थे।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः M, P की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता की बहन (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘+’ का अर्थ ‘×’, ‘−’ का अर्थ ‘÷’, ‘×’ का अर्थ ‘−’ और ‘÷’ का अर्थ ‘+’ है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 − 6 + 5 × 12 ÷ 9 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">37</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक चिह्न को उसके लिए दिए गए अर्थ से बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">‘−’ → ÷, ‘+’ → ×, ‘×’ → −, ‘÷’ → +</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समीकरण बनता है: 48 ÷ 6 × 5 − 12 + 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें: पहले भाग और गुणा, बाएँ से दाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब घटाना और जोड़ना, बाएँ से दाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(43 तब आता है जब 12 जोड़ा और 9 घटाया जाए, 31 तब जब पहले 12 + 9 करके पूरा योग घटाया जाए, तथा 29 तब जब 40 − 12 के बाद 9 छूट जाए।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">37 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B की पुत्री है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B का अर्थ है कि ‘A, B का पति है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B का अर्थ है कि ‘A, B की माता है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का भाई है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P + Q − R × S’ है, तो P का S से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B का पति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P + Q − R × S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P, Q की पुत्री है, अतः Q, P का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q − R → Q, R का पति है, अतः Q और R पति-पत्नी हैं, और इसलिए R, P की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R × S → R, S की माता है, अतः P और S के माता-पिता समान हैं, Q और R.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P पुत्री है, अतः P, S की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता होने के लिए P को S की माता होना पड़ता; पुत्री होने के लिए S को P का माता या पिता होना पड़ता; और भाई की पत्नी होने के लिए शृंखला में कोई विवाह होना चाहिए था।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, S की </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BMY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DPW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FQT</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चारों समूहों में अक्षरों के बीच के अंतर अलग-अलग हैं, अतः प्रत्येक समूह के पहले और तीसरे अक्षर को देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BMY: B = 2, Y = 25 → 2 + 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\">, अतः B और Y विपरीत अक्षर हैं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DPW: D = 4, W = 23 → 4 + 23 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\">, अतः D और W विपरीत अक्षर हैं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKS: H = 8, S = 19 → 8 + 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\">, अतः H और S विपरीत अक्षर हैं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FQT: F = 6, T = 20 → 6 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span><span style=\"font-family:'Mangal'\">, अतः F और T विपरीत अक्षर नहीं हैं (F का विपरीत अक्षर U है)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूहों में पहला और तीसरा अक्षर विपरीत अक्षर हैं; केवल FQT इस नियम को तोड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">FQT (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी गुलाब फूल हैं। कुछ फूल लिली हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ गुलाब लिली हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कुछ लिली फूल हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी गुलाब फूल हैं → गुलाबों का वृत्त पूरी तरह फूलों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ फूल लिली हैं → फूलों का वृत्त और लिली का वृत्त कम से कम एक भाग में एक-दूसरे को काटते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ गुलाब लिली हैं → लिली का वृत्त फूलों के वृत्त को काटता है, परंतु वह कटा हुआ भाग पूरी तरह गुलाबों के वृत्त के बाहर भी हो सकता है, अतः यह केवल एक संभावना है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ लिली फूल हैं → यह ‘कुछ फूल लिली हैं’ को ही उल्टी ओर से पढ़ना है; जहाँ दोनों वृत्त कटते हैं, वह भाग लिली भी है और फूल भी → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (II) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच मित्रों P, Q, R, S और T में से प्रत्येक का भार अलग-अलग है। P, Q से भारी है परंतु R से हल्का है। S, R से भारी है। T, Q से हल्का है। इनमें से दूसरा सबसे भारी कौन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले संकेत के तीनों मित्रों को एक पंक्ति में, सबसे भारी से शुरू करके लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q से भारी है परंतु R से हल्का है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R &gt; P &gt; Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, R से भारी है → S, R के आगे आएगा → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S &gt; R &gt; P &gt; Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, Q से हल्का है → T, Q के बाद आएगा → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S &gt; R &gt; P &gt; Q &gt; T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे भारी से क्रम S, R, P, Q, T है, और दूसरा सबसे भारी </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(S सबसे भारी है, P तीसरा सबसे भारी है, और Q चौथा है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरा सबसे भारी मित्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">R (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि अपने घर से चलना शुरू करके दक्षिण की ओर 9 km चलता है। फिर वह बाएँ मुड़कर 12 km चलता है। वह फिर बाएँ मुड़कर 14 km चलता है और रुक जाता है। अब वह अपने घर से कितनी दूरी पर और किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 km, दक्षिण-पूर्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km, उत्तर-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 km, उत्तर-पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, उत्तर-पूर्व</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर को मूल बिंदु लें; पूर्व = +x, उत्तर = +y, और 1 इकाई = 1 km.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर 9 km चलता है → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, −9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण की ओर मुख किए हुए बाएँ मुड़ने पर उसका मुख पूर्व की ओर हो जाता है; 12 km चलता है → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, −9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व की ओर मुख किए हुए बाएँ मुड़ने पर उसका मुख उत्तर की ओर हो जाता है; 14 km चलता है → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">12, 5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह घर से 12 km पूर्व और 5 km उत्तर में रुकता है, जिसका अर्थ है कि वह घर के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पूर्व</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घर से दूरी = √(12² + 5²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(144 + 25) = √169 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(दक्षिण-पूर्व के लिए उसे प्रारंभिक रेखा से नीचे रुकना पड़ता, परंतु 14 km उत्तर, 9 km दक्षिण से अधिक है; 12 km में उत्तर वाला भाग छूट जाता है, तथा 15 km कर्ण की लंबाई नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रवि अपने घर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">13 km, उत्तर-पूर्व (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'SPOON' को 'TOPNO' लिखा जाता है। उसी भाषा में 'CHAIR' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGBIS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BGBHS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGBHS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHBHS</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द की तुलना उसके कूट से एक-एक अक्षर करके करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\">, P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, O + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, O − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\">, N + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पहले, तीसरे और पाँचवें स्थान के अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक स्थान आगे</span><span style=\"font-family:'Mangal'\"> जाते हैं, और दूसरे तथा चौथे स्थान के अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक स्थान पीछे</span><span style=\"font-family:'Mangal'\"> जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही नियम CHAIR पर लागू करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\">, H − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, A + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">, I − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, R + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूट DGBHS बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(DGBIS में चौथा अक्षर पीछे के बजाय आगे गया है, BGBHS में पहला अक्षर पीछे गया है, तथा DHBHS में दूसरा अक्षर अपरिवर्तित रह गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'CHAIR' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">DGBHS (विकल्प C)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे संख्याओं के दो समुच्चय दिए गए हैं। प्रत्येक समुच्चय में, पहली संख्या पर एक निश्चित गणितीय संक्रिया करने पर दूसरी संख्या मिलती है, दूसरी संख्या पर एक अन्य संक्रिया करने पर तीसरी संख्या मिलती है, और तीसरी संख्या पर एक अन्य संक्रिया करने पर चौथी संख्या मिलती है। दोनों समुच्चयों में यही तीन संक्रियाएँ प्रयुक्त हैं। वह विकल्प चुनिए जो उसी क्रम में इन्हीं तीन संक्रियाओं का पालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 - 10 - 13 - 26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 - 14 - 17 - 34</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 - 12 - 16 - 32</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 - 16 - 19 - 39</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 - 8 - 11 - 23</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 - 18 - 21 - 42</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए दोनों समुच्चयों के प्रत्येक चरण में प्रयुक्त संक्रिया ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला चरण: 5 → 10 और 7 → 14 → संख्या को </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 से गुणा</span><span style=\"font-family:'Mangal'\"> किया गया है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा चरण: 10 → 13 और 14 → 17 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 जोड़ा</span><span style=\"font-family:'Mangal'\"> गया है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा चरण: 13 → 26 और 17 → 34 → संख्या को </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 से गुणा</span><span style=\"font-family:'Mangal'\"> किया गया है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शृंखला है: × 2, + 3, × 2. प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: 6 × 2 = 12 ✓, 12 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span><span style=\"font-family:'Mangal'\"> है, 16 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: 8 × 2 = 16 ✓, 16 + 3 = 19 ✓, 19 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\"> है, 39 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: 4 × 2 = 8 ✓, 8 + 3 = 11 ✓, 11 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span><span style=\"font-family:'Mangal'\"> है, 23 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: 9 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span><span style=\"font-family:'Mangal'\"> ✓, 18 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\"> ✓, 21 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इन्हीं संक्रियाओं का पालन करने वाला समुच्चय </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 - 18 - 21 - 42 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">COLD - OCLD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN - LPNA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MIND - IMDN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GATE - AGET</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह में पहले समूह के ही अक्षर हैं, अतः देखें कि अक्षरों के स्थान कैसे बदलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN → LPNA: पहले दो अक्षर P, L आपस में बदलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">LP</span><span style=\"font-family:'Mangal'\"> बनते हैं, और अंतिम दो अक्षर A, N आपस में बदलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">NA</span><span style=\"font-family:'Mangal'\"> बनते हैं ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MIND → IMDN: M, I से </span><span style=\"font-weight:bold;font-family:'Mangal'\">IM</span><span style=\"font-family:'Mangal'\"> और N, D से </span><span style=\"font-weight:bold;font-family:'Mangal'\">DN</span><span style=\"font-family:'Mangal'\"> बनता है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GATE → AGET: G, A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">AG</span><span style=\"font-family:'Mangal'\"> और T, E से </span><span style=\"font-weight:bold;font-family:'Mangal'\">ET</span><span style=\"font-family:'Mangal'\"> बनता है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">COLD → इसी नियम से O, C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">OC</span><span style=\"font-family:'Mangal'\"> और D, L = </span><span style=\"font-weight:bold;font-family:'Mangal'\">DL</span><span style=\"font-family:'Mangal'\"> बनता है, अर्थात् OCDL, परंतु युग्म में OC</span><span style=\"font-weight:bold;font-family:'Mangal'\">LD</span><span style=\"font-family:'Mangal'\"> दिया है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म इस नियम का पालन करते हैं: पहले दो अक्षर आपस में बदलें, फिर अंतिम दो अक्षर आपस में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">COLD - OCLD (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,650 पर 8% वार्षिक दर से 5 मार्च 2023 से 19 मई 2023 तक की अवधि का साधारण ब्याज (₹ में) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹60</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹58</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹64</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹72</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले दिन गिनें। उधार लेने का दिन नहीं गिना जाता, चुकाने का दिन गिना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 मार्च के बाद मार्च के शेष दिन = 31 − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">26</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अप्रैल के दिन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19 मई तक मई के दिन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल समय = 26 + 30 + 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">75 दिन</span><span style=\"font-family:'Mangal'\"> = 75/365 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [3,650 × 8 × (75/365)] / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,650 / 365 = 10, अतः SI = (10 × 8 × 75) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 6,000 / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साधारण ब्याज </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹60 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक स्टेशनरी व्यापारी 15 पेन ₹1,800 में खरीदता है और उन्हें 12 पेन ₹1,500 की दर से बेचता है। कुल ₹1,350 का लाभ कमाने के लिए इन दरों पर कितने पेन खरीदे और बेचे जाने चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">270</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">250</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों लॉट अलग-अलग आकार के हैं, अतः एक पेन का क्रय मूल्य और विक्रय मूल्य ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पेन का क्रय मूल्य = 1,800 / 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पेन का विक्रय मूल्य = 1,500 / 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पेन पर लाभ = 125 − 120 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,350 के लाभ के लिए पेनों की संख्या = 1,350 / 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">270</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 270 पेनों का क्रय मूल्य 270 × ₹120 = ₹32,400 तथा विक्रय मूल्य 270 × ₹125 = ₹33,750, लाभ ₹1,350 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">270 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> पेन खरीदे और बेचे जाने चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह सबसे बड़ी संख्या कौन-सी है जो 47, 59 और 74 को विभाजित करने पर प्रत्येक बार समान शेषफल छोड़ती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि प्रत्येक बार समान शेषफल बचता है, तो संख्याओं के अंतर भाजक से पूर्णतः विभाज्य होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">59 − 47 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">74 − 59 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">74 − 47 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट संख्या 12, 15 और 27 का HCF (महत्तम समापवर्तक) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 = 2 × 2 × 3, 15 = 3 × 5 तथा 27 = 3 × 3 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HCF = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 47 = (3 × 15) + 2, 59 = (3 × 19) + 2 तथा 74 = (3 × 24) + 2, प्रत्येक बार समान शेषफल 2 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समान शेषफल छोड़ने वाली सबसे बड़ी संख्या = संख्याओं के अंतरों का HCF</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= HCF (12, 15, 27)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसी सबसे बड़ी संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कंपनी में 1,200 कर्मचारी हैं। नीचे दी गई सारणी में कर्मचारियों का उसके विभागों में प्रतिशत वितरण दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790406824244_image001.png\" width=\"442\" height=\"152\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि बिक्री विभाग के 15% कर्मचारियों को IT विभाग में स्थानांतरित कर दिया जाए, तो IT विभाग में कुल कर्मचारियों का कितना प्रतिशत हो जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23.5%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन दो प्रतिशतों की आवश्यकता है, उन्हें कर्मचारियों की संख्या में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिक्री विभाग में कर्मचारी = 1,200 × 30% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IT विभाग में कर्मचारी = 1,200 × 20% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिक्री से स्थानांतरित कर्मचारी = 360 × 15% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IT की नई संख्या = 240 + 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">294</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंपनी की कुल संख्या अब भी 1,200 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IT का नया प्रतिशत = (294 / 1,200) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: IT का नया भाग = 20% + (30% का 15%) = 20% + 4.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 24.5%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः IT विभाग में कुल कर्मचारियों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">24.5% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> हो जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेखा एक मीनार के शिखर को 30° के उन्नयन कोण पर देखती है। वह मीनार के पाद से 20√3 m की दूरी पर खड़ी है और उसकी आँखों का स्तर भूमि से 1.6 m ऊपर है। मीनार की कुल ऊँचाई कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21.6 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23.2 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36.24 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोण रेखा की आँख से मापा गया है, अतः पहले मीनार की उसकी आँखों के स्तर से ऊपर की ऊँचाई ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बनने वाले समकोण त्रिभुज में क्षैतिज दूरी 20√3 m तथा उन्नयन कोण 30° है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan 30° = (आँखों के स्तर से ऊपर की ऊँचाई) / (20√3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/√3 = h / (20√3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = (20√3) / √3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब उसकी आँखों की भूमि से ऊँचाई जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीनार की कुल ऊँचाई = 20 + 1.6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21.6 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मीनार की कुल ऊँचाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">21.6 m (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक फर्म का वार्षिक लाभ तीन साझेदारों में 5 : 8 : 11 के अनुपात में बाँटा जाता है। यदि सबसे बड़ा हिस्सा सबसे छोटे हिस्से से ₹36,000 अधिक है, तो सबसे बड़ा हिस्सा एक साझेदार के औसत हिस्से से कितना अधिक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹24,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹16,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹18,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना हिस्से 5x, 8x तथा 11x हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे बड़ा हिस्सा − सबसे छोटा हिस्सा = 11x − 5x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6x = 36,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल लाभ = 5x + 8x + 11x = 24x = 24 × 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,44,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक साझेदार का औसत हिस्सा = 1,44,000 / 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे बड़ा हिस्सा = 11x = 11 × 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹66,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभीष्ट अंतर = 66,000 − 48,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹18,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: औसत हिस्सा = 8x (5x, 8x, 11x का मध्य पद), अतः अंतर = 11x − 8x = 3x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3 × 6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹18,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे बड़ा हिस्सा औसत हिस्से से </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹18,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> अधिक है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पेन का मूल्य ₹120 तथा एक पेंसिल का मूल्य ₹4.50 है। यदि x पेनों और y पेंसिलों का कुल मूल्य ₹516 है और x + y = 12 है, तो (x² + y²) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्या और कुल मूल्य से दो समीकरण बनाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + y = 12 … (1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120x + 4.5y = 516 … (2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1) से y = 12 − x, इसे (2) में रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120x + 4.5(12 − x) = 516</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120x + 54 − 4.5x = 516</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">115.5x = 462</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 462 / 115.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = 12 − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x² + y² = 4² + 8² = 16 + 64 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: (4 × ₹120) + (8 × ₹4.50) = ₹480 + ₹36 = ₹516 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः (x² + y²) का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि का व्यय उसकी बचत से 200% अधिक है। यदि उसका व्यय 5% घट जाए और बचत 40% बढ़ जाए, तो उसकी आय कितने प्रतिशत बढ़ जाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.75%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल प्रतिशत पूछा गया है, अतः बचत ₹2 मान लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यय, बचत से 200% अधिक है, अतः व्यय = ₹2 × 300% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय = व्यय + बचत = 6 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया व्यय = ₹6 × 95% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5.70</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई बचत = ₹2 × 140% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2.80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई आय = 5.70 + 2.80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹8.50</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय में वृद्धि = 8.50 − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹0.50</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिशत वृद्धि = (0.50 / 8) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसकी आय </span><span style=\"font-weight:bold;font-family:'Mangal'\">6.25% (विकल्प C)</span><span style=\"font-family:'Mangal'\"> बढ़ जाती है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति शांत जल में 8 km/h की चाल से नाव चला सकता है। नदी 2 km/h की चाल से बहती है। उसे किसी स्थान तक जाकर वापस आने में 4 घंटे लगते हैं। वह स्थान कितनी दूर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 km</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marki
