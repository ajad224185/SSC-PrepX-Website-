span style=\"font-weight:bold;font-family:'Mangal'\">288</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 80 = 16 × 5 and 288 = 16 × 18, and 5 and 18 have no common factor, so the HCF is 16 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Positive difference = 288 − 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">208</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: other number = (HCF × LCM) / given number</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (16 × 1,440) / 80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 288</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the positive difference between the two numbers is </span><span style=\"font-weight:bold;font-family:'Mangal'\">208 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: 7 1/2 − [2 1/4 ÷ {1 1/4 − 1/2 × (1 1/2 − 1/3 − 1/6)}]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 1/2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 1/2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 1/2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 1/2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work from the innermost bracket outwards, as the BODMAS order requires.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Innermost bracket: 1 1/2 − 1/3 − 1/6 = 3/2 − 1/3 − 1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking the LCM (लघुत्तम समापवर्त्य) 6, this is (9 − 2 − 1)/6 = 6/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Next the multiplication inside the curly bracket: 1/2 × 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Curly bracket: 1 1/4 − 1/2 = 5/4 − 2/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the division inside the square bracket: 2 1/4 ÷ 3/4 = 9/4 × 4/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Last the subtraction: 7 1/2 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of the expression is </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 1/2 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of money is divided among A, B and C in such a way that 2 times A's share, 3 times B's share and 4 times C's share are all equal. If B's share is ₹1,200 more than C's share, what is the total sum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹14,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹13,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹16,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹15,600</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Equal multiples give the ratio, so let the common value be k.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2A = 3B = 4C = k</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = k/2, B = k/3 and C = k/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B's share is ₹1,200 more than C's share.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k/3 − k/4 = 1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking the LCM (लघुत्तम समापवर्त्य) 12, (4k − 3k)/12 = 1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k/12 = 1,200, so k = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 14,400 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹7,200</span><span style=\"font-family:'Mangal'\">, B = 14,400 / 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,800</span><span style=\"font-family:'Mangal'\">, C = 14,400 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: ₹4,800 − ₹3,600 = ₹1,200 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total sum = ₹7,200 + ₹4,800 + ₹3,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total sum is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,600 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": "Tुध नोपiय यी पुध nहंृधन यी ृयदौ पय पुध nहंृधन यी giिनस in ो ौcुयिय iौ 5 : 3. Iी 40 ंयनध giिनस ुयin पुध ौcुयिय ोnक पुध nहंृधन यी ृयदौ ौपोदौ पुध ौोंध, पुध नोपiय ृधcयंधौ 5 : 4. Hयथ ंोnद ृयदौ ोनध पुधनध in पुध ौcुयिय?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">160</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the numbers as multiples of the first ratio, since only the girls change.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the number of boys be 5x and the number of girls be 3x.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 40 girls join, the girls become 3x + 40.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5x) : (3x + 40) = 5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cross multiply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 × 5x = 5 × (3x + 40)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20x = 15x + 200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of boys = 5x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: x = 40, so the girls were 120 and become 160, and 200 : 160 = 5 : 4 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of boys in the school is </span><span style=\"font-weight:bold;font-family:'Mangal'\">200 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By selling an article for ₹720, a man loses 10%. At what price should he sell the same article to gain 15%?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹920</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹900</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹828</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹880</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cost price is the same in both cases, so find it first from the loss.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At a loss of 10%, the selling price is 90% of the cost price.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹720 = cost price × 90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost price = 720 / 90% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a gain of 15%, the selling price is 115% of the cost price.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required selling price = ₹800 × 115% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹920</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: new SP = old SP × (100% + gain %) / (100% − loss %)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 720 × (115 / 90)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= ₹920</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he should sell the article for </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹920 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the mode of the following frequency distribution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790237259981_image002.png\" width=\"442\" height=\"131\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mode of grouped data lies in the class with the highest frequency.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The highest frequency is </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\">, so the modal class is </span><span style=\"font-weight:bold;font-family:'Mangal'\">20-30</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lower limit of the modal class (l) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Size of the class interval (h) = 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\">) = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the class preceding the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) = 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frequency of the class succeeding the modal class (f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">) = 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mode = l + [(f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\">) / (2f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\"> − f</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">)] × h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + [(20 − 12) / (40 − 12 − 8)] × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + (8 / 20) × 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20 + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mode of the distribution is </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A man is 24 years older than his son. In 2 years, the man will be twice as old as his son. What is the present age of the son?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 years</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The gap between their ages never changes, so take the son's age as the variable.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the son's present age be x years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The man's present age = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(x + 24) years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 2 years the son will be (x + 2) years old and the man will be (x + 26) years old.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 26 = 2(x + 2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x + 26 = 2x + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: the son is 22 and the man is 46; in 2 years they are 24 and 48, and 48 = 2 × 24 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the present age of the son is </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 years (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x</span><span style=\"font-family:'Mangal'\"> = 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y+1</span><span style=\"font-family:'Mangal'\"> and 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x−9</span><span style=\"font-family:'Mangal'\">, then what is the value of x?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write both sides of each equation with the same base, then compare the powers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First equation: 8 = 2³, so 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y+1</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3(y+1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3y+3</span><span style=\"font-family:'Mangal'\">, so x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3y + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second equation: 9 = 3², so 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2y</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">x−9</span><span style=\"font-family:'Mangal'\">, so 2y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">x − 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Put x = 3y + 3 in 2y = x − 9.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y = 3y + 3 − 9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2y = 3y − 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = (3 × 6) + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\"> = 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\"> = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\"> ✓ and 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">21−9</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of x is </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A wall is 8 m long, 6 m high and 22.5 cm thick. How many bricks, each measuring 25 cm × 12.5 cm × 7.5 cm, are needed to build the wall?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,320</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,608</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5,120</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,840</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bring every measurement to the same unit first, then divide the volumes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Length of the wall = 8 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">800 cm</span><span style=\"font-family:'Mangal'\">, height = 6 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600 cm</span><span style=\"font-family:'Mangal'\">, thickness = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22.5 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of the wall = 800 × 600 × 22.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,08,00,000 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of one brick = 25 × 12.5 × 7.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,343.75 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of bricks = volume of the wall / volume of one brick</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,08,00,000 / 2,343.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,608</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of bricks needed is </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,608 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A leak at the bottom of a full cistern can empty it in 8 hours. A tap that lets in 6 litres of water per minute is turned on, and now the full cistern is emptied in 12 hours. What is the capacity of the cistern?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8,640 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5,760 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,320 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,080 litres</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cistern still empties, so the leak takes out more water than the tap lets in.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the capacity of the cistern be C litres.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water taken out by the leak in 1 hour = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/8 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water let in by the tap in 1 hour = 6 × 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">360 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With both working, the cistern empties in 12 hours, so the net outflow in 1 hour = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C/12 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/8 − 360 = C/12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/8 − C/12 = 360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Taking the LCM (लघुत्तम समापवर्त्य) 24, (3C − 2C)/24 = 360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C/24 = 360, so C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,640 litres</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: the leak takes out 8,640 / 8 = 1,080 litres per hour and the tap lets in 360 litres, so the net outflow is 720 litres per hour and 8,640 / 720 = 12 hours ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the capacity of the cistern is </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,640 litres (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A trader bought 400 kg of wheat at ₹30 per kg. He sold 100 kg of it at a profit of 20%. At what rate per kg must he sell the remaining wheat so that he earns a profit of 25% on the whole lot?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹37.50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹38</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the total cost price first, then the total selling price the target profit needs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total cost price = 400 × ₹30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total selling price for a 25% profit = ₹12,000 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price of the first 100 kg = 100 × ₹30 × 120% = 100 × ₹36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price still needed = ₹15,000 − ₹3,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹11,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wheat still to be sold = 400 − 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required rate = 11,400 / 300 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹38</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he must sell the remaining wheat at </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹38 (Option D)</span><span style=\"font-family:'Mangal'\"> per kg.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amit's salary is 20% more than Bharat's salary, and Bharat's salary is 25% less than Chetan's salary. Amit's salary is what per cent of Chetan's salary?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">85%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">95%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Chetan's salary is the base of the last comparison, so start from him.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let Chetan's salary be </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹100</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bharat's salary is 25% less than Chetan's salary.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bharat's salary = ₹100 × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amit's salary is 20% more than Bharat's salary.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amit's salary = ₹75 × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹90</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required percentage = (90 / 100) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: net factor = 120% × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Amit's salary is </span><span style=\"font-weight:bold;font-family:'Mangal'\">90% (Option B)</span><span style=\"font-family:'Mangal'\"> of Chetan's salary.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A man has to cover a distance of 6 km in 45 minutes. He covers half of this distance in two-thirds of the given time. At what speed must he cover the remaining distance to reach exactly on time?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km/h</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find what is left of the distance and of the time, then divide.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Half of the distance = 6 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 km</span><span style=\"font-family:'Mangal'\">, so the distance still left is also </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time used = 45 × (2/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time still left = 45 − 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Change the time into hours: 15 minutes = 15/60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(1/4) hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required speed = distance / time</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3 / (1/4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3 × 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he must cover the remaining distance at </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 km/h (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The curved surface area of a right circular cone is 550 cm² and the diameter of its base is 14 cm. What is the volume of the cone? (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,232 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,078 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,540 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">924 cm³</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The curved surface area gives the slant height, and the slant height gives the vertical height.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Radius, r = 14 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Curved surface area of a cone = π × r × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">550 = (22/7) × 7 × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">550 = 22 × l, so l = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now use the right triangle formed by r, h and l.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = √(l² − r²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √(625 − 49)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= √576</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volume of a cone = (π × r² × h) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [(22/7) × 7 × 7 × 24] / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22 × 7 × 24) / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 3,696 / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the volume of the cone is </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,232 cm³ (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of ₹6,250 amounts to ₹7,290 in 2 years at compound interest, compounded annually. What is the rate of interest per annum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Use the amount formula for compound interest.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = P × (1 + R/100)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7,290 = 6,250 × (1 + R/100)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(1 + R/100)² = 7,290 / 6,250 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.1664</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the square root of both sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 + R/100 = √1.1664 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.08</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R/100 = 0.08, so R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: ₹6,250 × 108% = ₹6,750 and ₹6,750 × 108% = ₹7,290 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the rate of interest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">8% (Option B)</span><span style=\"font-family:'Mangal'\"> per annum.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: (12.5 × 12.5) + (2 × 12.5 × 7.5) + (7.5 × 7.5)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">380</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">390</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">420</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The expression has the form a² + 2ab + b², so use the identity instead of multiplying the decimals out.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Here a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12.5</span><span style=\"font-family:'Mangal'\"> and b = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a² + 2ab + b² = (a + b)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (12.5 + 7.5)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: a² + 2ab + b² = (a + b)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (12.5 + 7.5)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of the expression is </span><span style=\"font-weight:bold;font-family:'Mangal'\">400 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The value of 3tan²x - 3sec²x + 4 is equal to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the common factor 3 out of the first two terms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3tan²x − 3sec²x + 4 = 3(tan²x − sec²x) + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the identity 1 + tan²x = sec²x, we get tan²x − sec²x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the expression = (3 × (−1)) + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= −3 + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of the expression is </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series? 97, 80, 65, 52, 41, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the difference between one term and the next.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 − 97 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−17</span><span style=\"font-family:'Mangal'\">; 65 − 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−15</span><span style=\"font-family:'Mangal'\">; 52 − 65 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−13</span><span style=\"font-family:'Mangal'\">; 41 − 52 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the series falls by 17, then 15, then 13, then 11: each gap is 2 less than the one before it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The next gap is </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\">, so ? = 41 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(28 uses a gap of 13, 36 uses a gap of 5, and 29 uses a gap of 12.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKJP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIHM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPOU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RUTZ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of every letter and look at the three gaps inside each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKJP: H = 8, K = 11, J = 10, P = 16 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPOU: M = 13, P = 16, O = 15, U = 21 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RUTZ: R = 18, U = 21, T = 20, Z = 26 → (+3, −1, +6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIHM: F = 6, I = 9, H = 8, M = 13 → +3 ✓, −1 ✓, but 8 + 6 = 14 = N, and the cluster has </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three clusters follow (+3, −1, +6); in FIHM the last gap is +5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">FIHM (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This question is based on the following words.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OUT USE TUG RIP</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many letters are there between the second letter of the first word from the right and the second letter of the first word from the left as per the English alphabetical order?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The four words in order are OUT, USE, TUG and RIP.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first word from the right is </span><span style=\"font-weight:bold;font-family:'Mangal'\">RIP</span><span style=\"font-family:'Mangal'\">, and its second letter is </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first word from the left is </span><span style=\"font-weight:bold;font-family:'Mangal'\">OUT</span><span style=\"font-family:'Mangal'\">, and its second letter is </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of each of these two letters: I = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> and U = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number of letters lying between them = 21 − 9 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(12 counts one of the two letters as well, and 10 and 14 come from a wrong position.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number of letters between them is </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nine people, P, Q, R, S, T, U, V, W and X, are sitting in a row, all facing south.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit to the right of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S sits third to the left of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U sits at the extreme eastern end of the row.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between S and V.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W sits to the immediate left of V.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit between P and W.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q sits to the immediate right of P.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X sits at one of the two ends of the row.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who sits third to the left of R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All nine face south, so ‘left’ and ‘right’ are the persons’ own left and right; a person facing south has the </span><span style=\"font-weight:bold;font-family:'Mangal'\">west on the right</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">east on the left</span><span style=\"font-family:'Mangal'\">. Number the seats 1 to 9 from the western end, so moving to a person's left adds 1 and moving to a person's right subtracts 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit to the right of T → seats 1 and 2 lie to the right of T, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S sits third to the left of T → S = 3 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U sits at the extreme eastern end → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 9</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between S and V → V is either seat 4 or seat 8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W sits to the immediate left of V → if V were seat 8, W would be seat 9, which is U's seat, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 4</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">W = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit between P and W → P is either seat 2 or seat 8.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q sits to the immediate right of P → if P were seat 2, Q would be seat 1, and seats 7 and 8 would be left for R and X, neither of which is an end seat; but X sits at an end, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 8</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The seats left are 1 and 2, and X sits at an end → </span><span style=\"font-weight:bold;font-family:'Mangal'\">X = 1</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (seats 1 → 9, west to east): </span><span style=\"font-weight:bold;font-family:'Mangal'\">X, R, T, V, W, S, Q, P, U</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R sits at seat 2, so third to the left of R is seat 2 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">, which is W's seat.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the person who sits third to the left of R is </span><span style=\"font-weight:bold;font-family:'Mangal'\">W (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a row of 54 people facing north, Geeta sits 19th from the left end. If only 19 people sit between Barun and Geeta, then what is Barun’s position from the right end of the line?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16th</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17th</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18th</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19th</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Geeta sits 19th from the left end, so 18 people sit to her left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 19 people sit between Barun and Geeta, so Barun can sit either to the right of Geeta or to her left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To her left, Barun's position would be 19 − 19 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1</span><span style=\"font-family:'Mangal'\">, which is not a seat, so Barun sits to her right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Barun's position from the left end = 19 + 19 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">39</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Position from the right end = total number of people − position from the left end + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 54 − 39 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Barun's position from the right end is </span><span style=\"font-weight:bold;font-family:'Mangal'\">16th (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of :: ?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PLAN : # :: % : GIFT</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXR, % = HGIP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXR, % = HGIQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OMXR, % = HGIP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = ONXS, % = HGIP</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The change from the first cluster to the second cluster must be the same in both pairs. Test each option.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option A: PLAN → ONXR: P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\">, A − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\"> (1 − 3 = −2 → −2 + 26 = 24 = X), N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> → (−1, +2, −3, +4); HGIP → GIFT: H − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, G + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, I − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\">, P + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> → (−1, +2, −3, +4) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option B: HGIQ → GIFT needs Q + 4 = T, but Q + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option C: PLAN → OMXR needs L + 2 = M, but L + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Option D: PLAN → ONXS needs N + 4 = S, but N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = ONXR, % = HGIP (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B means that ‘A is the mother of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B means that ‘A is the brother of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B means that ‘A is the husband of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B means that ‘A is the daughter of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘P $ Q @ R # S’, then how is P related to S?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daughter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sister</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A is the mother of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A # B → A is the brother of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A &amp; B → A is the husband of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A $ B → A is the daughter of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the expression: P $ Q @ R # S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R # S → R is the brother of S, so R and S have the same parents.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q @ R → Q is the mother of R, and R and S have the same parents, so Q is the mother of S as well.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P $ Q → P is the daughter of Q, so P and S have the same parents, and P is a girl.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Mother and Daughter would place P one generation away from S, and Brother would make P a boy.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, P is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sister (Option D)</span><span style=\"font-family:'Mangal'\"> of S.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meena is walking towards the south. She turns 90° in the clockwise direction, then turns 180° in the clockwise direction, and then turns 90° in the anticlockwise direction. In which direction is she walking now?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">East</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">North</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">West</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take the four directions in clockwise order: north, east, south, west. A 90° turn in the clockwise direction moves one step forward in this order, a 180° turn moves two steps forward, and a 90° turn in the anticlockwise direction moves one step back.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meena starts walking towards the </span><span style=\"font-weight:bold;font-family:'Mangal'\">south</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First turn, 90° clockwise: south → </span><span style=\"font-weight:bold;font-family:'Mangal'\">west</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second turn, 180° clockwise: west → north → </span><span style=\"font-weight:bold;font-family:'Mangal'\">east</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third turn, 90° anticlockwise: east → </span><span style=\"font-weight:bold;font-family:'Mangal'\">north</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So after the three turns she is walking towards the north.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(South is where she started, and west and east are the directions she faced in between.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Meena is now walking towards the </span><span style=\"font-weight:bold;font-family:'Mangal'\">North (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HK is related to 9 in a certain way. In the same way, DM is related to 27. To which of the following is FQ related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of each letter in the English alphabet and look for a rule that gives the number.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HK: H = 8, K = 11 → 11 − 8 = 3, and 3 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DM: D = 4, M = 13 → 13 − 4 = 9, and 9 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the rule is: number = (the gap between the positions of the two letters) × 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of the positions does not work, because 8 + 11 = 19 and 4 + 13 = 17 are not 9 and 27.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FQ: F = 6, Q = 17 → 17 − 6 = 11, and 11 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(30 and 36 come from a gap of 10 and 12, and 22 doubles the gap instead of tripling it.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, FQ is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">33 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HBD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MGI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RLN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QKN</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write the position of every letter and look at the two gaps inside each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HBD: H = 8, B = 2, D = 4 → 8 −
