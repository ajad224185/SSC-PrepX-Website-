<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्योदय के कुछ समय बाद सूर्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूर्व</span><span style=\"font-family:'Mangal'\"> में होता है, अतः प्रत्येक छाया </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> की ओर पड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इशिता की छाया उसकी बाईं ओर पड़ी, अतः पश्चिम उसकी बाईं ओर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब चारों दिशाओं को एक-एक करके जाँचें: उत्तर की ओर मुख करने पर पश्चिम बाईं ओर होता है; पूर्व की ओर मुख करने पर उत्तर बाईं ओर होता है; दक्षिण की ओर मुख करने पर पूर्व बाईं ओर होता है; पश्चिम की ओर मुख करने पर दक्षिण बाईं ओर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर</span><span style=\"font-family:'Mangal'\"> की ओर मुख करने पर ही पश्चिम बाईं ओर पड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इशिता का मुख </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर (विकल्प B)</span><span style=\"font-family:'Mangal'\"> की ओर था।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘4’ और ‘8’ को आपस में बदल दिया जाए, तो निम्नलिखित व्यंजक का मान क्या होगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 ÷ 8 + 6 × 4 − 9</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">39</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">63</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले व्यंजक को 8 के स्थान पर 4 और 4 के स्थान पर 8 रखकर फिर से लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 ÷ 8 + 6 × 4 − 9 बदलकर 72 ÷ 4 + 6 × 8 − 9 हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब BODMAS लागू करें (+ और − से पहले × और ÷): 72 ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span><span style=\"font-family:'Mangal'\">; 6 × 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान 18 + 48 − 9 = 66 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">57</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(24 तो बदलने से पहले वाले व्यंजक का मान है, तथा 63 में अंतिम चरण छूट जाता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">57 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गौरव की कक्षा में ऊपर से 14वीं और नीचे से 98वीं रैंक है। उसकी कक्षा में कुल कितने विद्यार्थी हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">110</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">113</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">111</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले दोनों रैंक जोड़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर से गौरव तक के विद्यार्थी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\">, और गौरव से नीचे तक के विद्यार्थी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">98</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन्हें जोड़ने पर 14 + 98 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">112</span><span style=\"font-family:'Mangal'\"> आता है, परंतु इस योग में गौरव की गणना दो बार हो जाती है, क्योंकि वह दोनों रैंकों में गिना जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः एक घटाएँ: कुल = 112 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">111</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(112 में गौरव के दो बार गिने जाने का ध्यान नहीं रखा गया है, तथा 110 में एक विद्यार्थी अधिक घटा दिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कक्षा में कुल </span><span style=\"font-weight:bold;font-family:'Mangal'\">111 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> विद्यार्थी हैं।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">YBG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JMQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CFK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ILQ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">YBG: Y + 3 = B (25 + 3 = 28 → 28 − 26 = 2 = B), B + 5 = G → (+3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CFK: C + 3 = F, F + 5 = K → (+3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ILQ: I + 3 = L, L + 5 = Q → (+3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JMQ: J + 3 = M, M + 4 = Q → (+3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+3, +5) का पालन करते हैं; केवल JMQ नहीं (M + 5 = R होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">JMQ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सी संख्या दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर आएगी? 20, 20, 400, 23, 23, 529, 26, 26, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">661</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">676</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">761</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">861</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला को तीन-तीन पदों के समूहों में पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला समूह: 20, 20, 400 → तीसरा पद 20 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">400</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा समूह: 23, 23, 529 → तीसरा पद 23 × 23 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">529</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक समूह में तीसरा पद, दो बार दोहराई गई संख्या का वर्ग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा समूह: 26, 26, ? → ? = 26 × 26 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">676</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(661 और 761 किसी संख्या के वर्ग ही नहीं हैं, तथा 861, 26 का वर्ग नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">676 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JNMQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFEI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHGL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTSW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JNMQ: J + 4 = N, N − 1 = M, M + 4 = Q → (+4, −1, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BFEI: B + 4 = F, F − 1 = E, E + 4 = I → (+4, −1, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PTSW: P + 4 = T, T − 1 = S, S + 4 = W → (+4, −1, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHGL: D + 4 = H, H − 1 = G, G + 5 = L → (+4, −1, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+4, −1, +4) का पालन करते हैं; केवल DHGL नहीं (G + 4 = K होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">DHGL (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">‘PLASTIC’ शब्द में अक्षरों के ऐसे कितने युग्म हैं जिनमें से प्रत्येक के बीच शब्द में उतने ही अक्षर हैं जितने अंग्रेज़ी वर्णमाला क्रम में उनके बीच होते हैं? (अक्षरों को आगे और पीछे दोनों दिशाओं में गिना जा सकता है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द को प्रत्येक अक्षर के स्थान के साथ लिखें: P (16), L (12), A (1), S (19), T (20), I (9), C (3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक युग्म के लिए शब्द में उनके बीच के अक्षर और वर्णमाला में उनके बीच के अक्षर गिनें, और युग्म को तभी रखें जब दोनों गिनतियाँ समान हों।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और S: शब्द में इनके बीच L तथा A हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> अक्षर; वर्णमाला में इनके बीच Q तथा R हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> अक्षर ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और T: शब्द में इनके बीच L, A तथा S हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> अक्षर; वर्णमाला में इनके बीच Q, R तथा S हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> अक्षर ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और T: शब्द में इनके बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई</span><span style=\"font-family:'Mangal'\"> अक्षर नहीं है; वर्णमाला में भी इनके बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई</span><span style=\"font-family:'Mangal'\"> अक्षर नहीं है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष सभी युग्म इस शर्त पर खरे नहीं उतरते, जैसे L और A के बीच शब्द में कोई अक्षर नहीं है परंतु वर्णमाला में दस अक्षर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\"> युग्म हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ पेन किताबें हैं। सभी किताबें फाइलें हैं। कोई फाइल कुर्सी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) कुछ पेन फाइलें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) कोई किताब कुर्सी नहीं है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी किताबें फाइलें हैं → किताबों का वृत्त पूरी तरह फाइलों के वृत्त के अंदर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई फाइल कुर्सी नहीं है → फाइलों का वृत्त और कुर्सियों का वृत्त एक-दूसरे को कहीं भी नहीं छूते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कुछ पेन फाइलें हैं → कुछ पेन किताबें हैं, और प्रत्येक किताब एक फाइल है, अतः वे पेन फाइलें भी हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कोई किताब कुर्सी नहीं है → प्रत्येक किताब फाइलों के वृत्त के अंदर है, और फाइलों के वृत्त का कोई भाग कुर्सी नहीं है, अतः कोई किताब कुर्सी नहीं हो सकती → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों निष्कर्ष केवल संभावना नहीं, बल्कि निश्चित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार एक निश्चित दूरी एकसमान चाल से तय करती है। यदि चाल 10 km/h अधिक होती, तो यात्रा में 1 घंटा कम लगता। यदि चाल 10 km/h कम होती, तो यात्रा में 2 घंटे अधिक लगते। दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 km</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सामान्य चाल v km/h तथा दूरी d km मानें, अतः सामान्य समय d/v घंटे है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 km/h अधिक चाल से 1 घंटा बचता है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d/v − d/(v + 10) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 km/h कम चाल से 2 घंटे अधिक लगते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d/(v − 10) − d/v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समीकरण से: (d × 10) / [v(v + 10)] = 1, अतः d × 10 = v² + 10v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समीकरण से: (d × 10) / [v(v − 10)] = 2, अतः d × 10 = 2v² − 20v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों को बराबर करने पर: v² + 10v = 2v² − 20v, जिससे v² = 30v, अतः v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d × 10 = 30² + (10 × 30) = 900 + 300 = 1,200, अतः d = </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 120/30 = 4 घंटे, 120/40 = 3 घंटे तथा 120/20 = 6 घंटे ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 km (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो रेलगाड़ियाँ स्टेशन P और Q से एक ही समय पर चलकर एक-दूसरे की ओर आती हैं। मिलने के बाद पहली रेलगाड़ी Q तक पहुँचने में 9 घंटे और दूसरी रेलगाड़ी P तक पहुँचने में 4 घंटे लेती है। यदि पहली रेलगाड़ी की चाल 48 km/h है, तो दूसरी रेलगाड़ी की चाल क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 km/h</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने के बाद प्रत्येक रेलगाड़ी ठीक उतनी दूरी तय करती है जितनी दूसरी पहले ही तय कर चुकी थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालें v₁ और v₂ तथा मिलने तक का समय T घंटे मानें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली रेलगाड़ी के आगे बची दूरी = v₂ × T, जिसे वह 9 घंटे में तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v₁ × 9 = v₂ × T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी रेलगाड़ी के आगे बची दूरी = v₁ × T, जिसे वह 4 घंटे में तय करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v₂ × 4 = v₁ × T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले संबंध में दूसरे से भाग देने पर: (9 × v₁) / (4 × v₂) = v₂ / v₁</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 9 × v₁² = 4 × v₂², जिससे v₁ / v₂ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 / 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v₂ = 48 × (3/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">72 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: v₁ : v₂ = √(दूसरी का मिलने के बाद का समय) : √(पहली का मिलने के बाद का समय) = √4 : √9 = 2 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरी रेलगाड़ी की चाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">72 km/h (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B और C अकेले-अकेले एक काम को क्रमशः 12 दिन, 18 दिन और 36 दिन में पूरा कर सकते हैं। उन्होंने मिलकर काम पूरा किया और कुल ₹6,600 प्राप्त किए। मजदूरी में C का हिस्सा कितना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹2,200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,650</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹1,100</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मजदूरी किए गए काम के अनुपात में बँटती है, जो एक दिन के काम का अनुपात होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल काम को 12, 18 और 36 का LCM (लघुत्तम समापवर्त्य) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36 इकाई</span><span style=\"font-family:'Mangal'\"> मानें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का एक दिन का काम = 36 / 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B का एक दिन का काम = 36 / 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C का एक दिन का काम = 36 / 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 इकाई</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मजदूरी का अनुपात = 3 : 2 : 1, अतः कुल </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 भाग</span><span style=\"font-family:'Mangal'\"> हुए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C का हिस्सा = 6,600 × (1/6) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: किसी श्रमिक का हिस्सा = कुल मजदूरी × (उसका एक दिन का काम / सबका एक दिन का काम)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मजदूरी में C का हिस्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,100 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 5 + 1/(3 + 1/(2 + 1/4))</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">155/31</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">169/31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">164/31</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">160/31</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे भीतरी कोष्ठक से आरंभ करके बाहर की ओर बढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 + 1/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/(9/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 + 4/9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31/9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/(31/9) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9/31</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 + 9/31 = (155 + 9)/31 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">164/31</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यंजक का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">164/31 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार वर्ष पहले एक पति, उसकी पत्नी और उनके पुत्र की औसत आयु 28 वर्ष थी। छह वर्ष पहले पत्नी और पुत्र की औसत आयु 21 वर्ष थी। पति की वर्तमान आयु क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46 वर्ष</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक औसत को योग में बदलें, फिर दोनों योगों को वर्तमान समय पर लाएँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार वर्ष पहले तीनों की कुल आयु = 28 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब से तीनों में से प्रत्येक की आयु 4 वर्ष बढ़ चुकी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीनों की वर्तमान कुल आयु = 84 + (3 × 4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">96 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह वर्ष पहले पत्नी और पुत्र की कुल आयु = 21 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी और पुत्र की वर्तमान कुल आयु = 42 + (2 × 6) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पति की वर्तमान आयु = 96 − 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: पति की आयु = (तीनों की वर्तमान कुल आयु) − (शेष दो की वर्तमान कुल आयु)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पति की वर्तमान आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 वर्ष (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल और बिमल की मासिक आय का अनुपात 4 : 5 तथा उनके मासिक व्यय का अनुपात 5 : 7 है। यदि दोनों में से प्रत्येक प्रति माह ₹9,000 बचाता है, तो अनिल की मासिक आय क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹30,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹27,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹24,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बचत = आय − व्यय, अतः दोनों को अलग-अलग चरों में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आय 4x और 5x तथा व्यय 5y और 7y मानें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल के लिए: 4x − 5y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बिमल के लिए: 5x − 7y = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y हटाने के लिए पहले समीकरण को 7 से और दूसरे को 5 से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28x − 35y = 63,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25x − 35y = 45,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घटाने पर: 3x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18,000</span><span style=\"font-family:'Mangal'\">, अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल की आय = 4x = 4 × 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹24,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: y = (24,000 − 9,000)/5 = 3,000, अतः बिमल की आय 30,000 − व्यय 21,000 = ₹9,000 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अनिल की मासिक आय </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹24,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण युग्म 3x + 4y = 12 तथा 6x + ky = 24 के अपरिमित रूप से अनेक हल होने के लिए k का मान क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो रैखिक समीकरणों के अपरिमित रूप से अनेक हल तब होते हैं जब एक समीकरण दूसरे का गुणज हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a₁x + b₁y = c₁ तथा a₂x + b₂y = c₂ के लिए इसका अर्थ है a₁/a₂ = b₁/b₂ = c₁/c₂.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ a₁/a₂ = 3/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तथा c₁/c₂ = 12/24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः b₁/b₂ भी 1/2 होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4/k = 1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 4 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: k = 8 लेने पर दूसरा समीकरण 6x + 8y = 24 बनता है, जो पहले का ठीक 2 गुना है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः k का मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,080 संख्या के कितने गुणनखंड हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले संख्या को अभाज्य घातों के गुणनफल के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,080 = 2 × 540 = 2 × 2 × 270 = 2 × 2 × 2 × 135</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">135 = 3 × 45 = 3 × 3 × 15 = 3 × 3 × 3 × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 1,080 = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> × 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> × 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी गुणनखंड में 2 की घात 4 प्रकार से (0, 1, 2 या 3), 3 की घात 4 प्रकार से और 5 की घात 2 प्रकार से ली जा सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुणनखंडों की संख्या = 4 × 4 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: यदि N = p</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">a</span><span style=\"font-family:'Mangal'\"> × q</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">b</span><span style=\"font-family:'Mangal'\"> × r</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">c</span><span style=\"font-family:'Mangal'\"> हो, तो गुणनखंडों की संख्या = (a + 1)(b + 1)(c + 1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 + 1)(3 + 1)(1 + 1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 32</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गुणनखंडों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्ष 2024 के पहले छमाही (जनवरी से जून) में सुलेखा ने औसतन हर महीने 2.2 kg चीनी का उपयोग किया। पूरे वर्ष 2024 में उसने औसतन हर महीने 2.5 kg चीनी का उपयोग किया। जुलाई से दिसंबर 2024 के बीच उसका औसत चीनी उपयोग कितना था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.7 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.2 kg</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक औसत को कुल मात्रा में बदलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनवरी से जून तक उपयोग की गई चीनी = 2.2 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">13.2 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूरे वर्ष 2024 में उपयोग की गई चीनी = 2.5 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जुलाई से दिसंबर तक उपयोग की गई चीनी = 30 − 13.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">16.8 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह 6 महीनों का कुल उपयोग है, अतः इसे 6 से भाग दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जुलाई से दिसंबर का औसत = 16.8 / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: वार्षिक औसत दोनों छमाही औसतों का माध्य होता है, अतः दूसरी छमाही = (2 × 2.5) − 2.2 = 2.8 kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसका औसत चीनी उपयोग </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.8 kg (विकल्प A)</span><span style=\"font-family:'Mangal'\"> था।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 cm आंतरिक व्यास वाले एक बेलनाकार पाइप से पानी 5 m प्रति सेकंड की दर से बहता है। 8 m लंबे, 6 m चौड़े और 1.925 m गहरे एक आयताकार टंकी को भरने में कितना समय लगेगा? (π = 22/7 लें)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 मिनट</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सेकंड में पाइप से निकलने वाला पानी एक बेलन के रूप में होता है जिसकी ऊँचाई पानी द्वारा तय दूरी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप की त्रिज्या = 7/2 = 3.5 cm = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.035 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुप्रस्थ काट का क्षेत्रफल = π × r² = (22/7) × 0.035 × 0.035 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.00385 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 सेकंड में बहने वाला पानी = 0.00385 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.01925 m³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">टंकी का आयतन = 8 × 6 × 1.925 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">92.4 m³</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = 92.4 / 0.01925 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,800 सेकंड</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,800 / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समय = टंकी का आयतन / (अनुप्रस्थ काट का क्षेत्रफल × बहाव की चाल)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः टंकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 मिनट (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में भर जाएगी।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कारखाने के 1,200 श्रमिकों में से 45% महिलाएँ हैं। महिलाओं में से 60% तथा पुरुषों में से 25% स्नातक हैं। कारखाने के कितने श्रमिक स्नातक नहीं हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">489</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">648</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">735</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">711</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले श्रमिकों को महिलाओं और पुरुषों में बाँटें, फिर प्रत्येक समूह में स्नातकों की गणना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">महिलाएँ = 1,200 × 45% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">540</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुरुष = 1,200 − 540 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">660</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्नातक महिलाएँ = 540 × 60% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">324</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्नातक पुरुष = 660 × 25% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">165</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल स्नातक = 324 + 165 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">489</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्नातक न होने वाले श्रमिक = 1,200 − 489 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">711</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: स्नातक न होने वाली महिलाएँ 216 और पुरुष 495 हैं; 216 + 495 = 711 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः स्नातक न होने वाले श्रमिकों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">711 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक परीक्षा में 40 विद्यार्थियों द्वारा प्राप्त अंक नीचे दिए गए हैं। अंकों का समांतर माध्य ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790075865811_image001.png\" width=\"442\" height=\"137\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27.5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्यक्ष विधि में प्रत्येक वर्ग के स्थान पर उसका मध्य-मान लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मध्य-मान: (0 + 10)/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">, 15, 25, 35 तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब प्रत्येक मध्य-मान को उसकी बारंबारता से गुणा करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σfx = (5 × 5) + (15 × 8) + (25 × 12) + (35 × 10) + (45 × 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 25 + 120 + 300 + 350 + 225</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,020</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σf = 5 + 8 + 12 + 10 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्य = Σfx / Σf</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 1,020 / 40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">25.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंकों का समांतर माध्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">25.5 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुकानदार ने एक साइकिल 12% की हानि पर बेची। यदि वह उसे ₹1,050 अधिक में बेचता, तो उसे 9% का लाभ होता। साइकिल का क्रय मूल्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,800</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹5,250</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹5,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹5,500</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों प्रतिशत एक ही क्रय मूल्य पर हैं, अतः दोनों विक्रय मूल्यों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला विक्रय मूल्य = क्रय मूल्य × 88%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा विक्रय मूल्य = क्रय मूल्य × 109%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों विक्रय मूल्यों का अंतर = क्रय मूल्य × (109% − 88%) = क्रय मूल्य × </span><span style=\"font-weight:bold;font-family:'Mangal'\">21%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह अंतर ₹1,050 दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रय मूल्य × 21% = 1,050</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रय मूल्य = (1,050 / 21) × 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 5,000 × 88% = ₹4,400 और 4,400 + 1,050 = ₹5,450, जो 5,000 × 109% है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: क्रय मूल्य = (अतिरिक्त राशि / कुल प्रतिशत अंतर) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साइकिल का क्रय मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,000 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे दो सह-अभाज्य पूर्णांकों के सभी संभव भिन्न युग्मों की संख्या ज्ञात कीजिए जिनका गुणनफल 180 है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे पहले 180 को अभाज्य घातों के गुणनफल के रूप में लिखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> × 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> × 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संख्याएँ तभी सह-अभाज्य होती हैं जब उनमें कोई उभयनिष्ठ अभाज्य गुणनखंड न हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक पूरी अभाज्य घात, अर्थात् 4 या 9 या 5, युग्म की किसी एक ही संख्या में जाएगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्म इस प्रकार बनते हैं: (1, 180), (4, 45), (5, 36), (9, 20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> भिन्न युग्म प्राप्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 3 भिन्न अभाज्य गुणनखंड होने पर सह-अभाज्य युग्मों की संख्या = 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> / 2 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे युग्मों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साधारण ब्याज पर दी गई एक धनराशि 3 वर्षों में ₹7,800 तथा 5 वर्षों में ₹9,000 हो जाती है। ब्याज की वार्षिक दर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूलधन वही रहता है, अतः बढ़ी हुई राशि केवल ब्याज है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5 − 3) = 2 वर्षों का ब्याज = 9,000 − 7,800 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 वर्ष का ब्याज = 1,200 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 वर्षों का ब्याज = 600 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूलधन = 7,800 − 1,800 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 = (6,000 × R × 1) / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: R = (एक वर्ष का ब्याज / मूलधन) × 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ब्याज की दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">10% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान धारिता वाले तीन बर्तनों में दूध और पानी के मिश्रण क्रमशः 1 : 2, 2 : 1 और 3 : 2 के अनुपात में हैं। तीनों मिश्रणों को एक बड़े बर्तन में उँडेल दिया जाता है। बड़े बर्तन में दूध और पानी का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 : 8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 : 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 : 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 4</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसी धारिता लें जो तीनों अनुपातों से पूरी-पूरी विभाजित हो जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात प्रत्येक बर्तन को 3, 3 और 5 भागों में बाँटते हैं, अतः प्रत्येक बर्तन की धारिता </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 लीटर</span><span style=\"font-family:'Mangal'\"> लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला बर्तन: दूध = 30 × (1/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 L</span><span style=\"font-family:'Mangal'\">, पानी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा बर्तन: दूध = 30 × (2/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 L</span><span style=\"font-family:'Mangal'\">, पानी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा बर्तन: दूध = 30 × (3/5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 L</span><span style=\"font-family:'Mangal'\">, पानी = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल दूध = 10 + 20 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">48 L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल पानी = 20 + 10 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 L</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात = 48 : 42 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 : 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 48 + 42 = 90 लीटर, जो तीनों बर्तनों का कुल मिश्रण है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूध और पानी का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 : 7 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यापारी दो मोबाइल फोन ₹19,800 प्रति फोन के भाव से बेचता है। एक पर उसे 10% लाभ और दूसरे पर 10% हानि होती है। इस सौदे में उसे कुल कितना लाभ या हानि हुई?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹400 की हानि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹400 का लाभ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹360 की हानि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न लाभ न हानि</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्रय मूल्य बराबर हैं किंतु क्रय मूल्य बराबर नहीं, अतः दोनों क्रय मूल्य अलग-अलग ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला फोन: विक्रय मूल्य = क्रय मूल्य × 110%, अतः क्रय मूल्य = 19,800 / 1.10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹18,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा फोन: विक्रय मूल्य = क्रय मूल्य × 90%, अतः क्रय मूल्य = 19,800 / 0.90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹22,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल क्रय मूल्य = 18,000 + 22,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹40,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल विक्रय मूल्य = 19,800 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹39,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्रय मूल्य कम है, इसलिए हानि होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हानि = 40,000 − 39,600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समान विक्रय मूल्य पर बराबर लाभ और हानि प्रतिशत होने पर सदैव हानि होती है, यहाँ ₹40,000 का 1% = ₹400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः व्यापारी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹400 की हानि (विकल्प A)</span><span style=\"font-family:'Mangal'\"> हुई।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहित ने 3 दिन काम करके एक काम का एक-चौथाई भाग पूरा किया। इसके बाद साहिल ने शेष काम 18 दिन में पूरा किया। यदि रोहित और साहिल आरंभ से ही साथ मिलकर काम करते, तो काम कितने दिन में पूरा होता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 दिन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले ज्ञात करें कि प्रत्येक अकेले पूरा काम कितने दिन में करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहित 3 दिन में काम का 1/4 भाग करता है, अतः पूरा काम करने में उसे 3 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 दिन</span><span style=\"font-family:'Mangal'\"> लगेंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष काम = 1 − 1/4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साहिल 18 दिन में काम का 3/4 भाग करता है, अतः पूरा काम करने में उसे 18 × (4/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 दिन</span><span style=\"font-family:'Mangal'\"> लगेंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहित का एक दिन का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/12</span><span style=\"font-family:'Mangal'\"> तथा साहिल का एक दिन का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों का एक दिन का काम = 1/12 + 1/24 = (2 + 1)/24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/24 = 1/8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साथ मिलकर लगने वाला समय = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: साथ मिलकर समय = (12 × 24) / (12 + 24) = 288 / 36 = 8 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः काम </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 दिन (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में पूरा होता।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 sin²30° + 3 tan²60° − 2 cos²45° का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अनुपात का मानक मान रखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sin 30° = 1/2, अतः sin²30° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">tan 60° = √3, अतः tan²60° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cos 45° = 1/√2, अतः cos²45° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 sin²30° = 4 × (1/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 tan²60° = 3 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 cos²45° = 2 × (1/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक = 1 + 9 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक समलंब ABCD में AB∥CD तथा AB = 16 cm और CD = 8 cm है। ΔABC और ΔACD के क्षेत्रफलों का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4:3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2:1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3:5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1:2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकर्ण AC समलंब को दो त्रिभुजों ABC और ACD में बाँटता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔABC का आधार AB तथा ΔACD का आधार CD लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AB और CD दोनों समांतर भुजाएँ हैं, अतः उनके बीच की दूरी दोनों त्रिभुजों के लिए समान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस उभयनिष्ठ ऊँचाई को h मानें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔABC का क्षेत्रफल = (1/2) × 16 × h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ΔACD का क्षेत्रफल = (1/2) × 8 × h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनुपात = 8h : 4h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समान ऊँचाई वाले त्रिभुजों के क्षेत्रफल उनके आधारों के अनुपात में होते हैं, यहाँ 16 : 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अभीष्ट अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">2:1 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(√7 + √3)/(√7 − √3) + (√7 − √3)/(√7 + √3) का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2√21</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों भिन्नों को समान हर पर लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समान हर = (√7 − √3)(√7 + √3) = 7 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंश = (√7 + √3)² + (√7 − √3)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(√7 + √3)² = 7 + 3 + 2√21 = 10 + 2√21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(√7 − √3)² = 7 + 3 − 2√21 = 10 − 2√21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंशों का योग = 10 + 2√21 + 10 − 2√21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मान = 20 / 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: (√a + √b)/(√a − √b) + (√a − √b)/(√a + √b) का मान = 2(a + b) / (a − b)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (2 × 10) / 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹5,500 का ऋण 20% वार्षिक चक्रवृद्धि ब्याज पर दो बराबर वार्षिक किस्तों में चुकाया जाना है। प्रत्येक किस्त का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:
