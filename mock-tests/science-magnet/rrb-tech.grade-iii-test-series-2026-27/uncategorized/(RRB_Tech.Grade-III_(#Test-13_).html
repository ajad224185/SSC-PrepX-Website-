ोन्यक्रिया करने वाले जीव पर्यावरण के अजैविक घटकों के साथ मिलकर पारिस्थितिकी तंत्र बनाते</span><span style=\"font-family:'Mangal'\"> हैं, जिसमें जीवित भाग उसके जैविक घटक हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. क्लोरोफ़िल की उपस्थिति में सूर्य के प्रकाश की ऊर्जा से अकार्बनिक पदार्थों से शर्करा और मंड जैसे कार्बनिक यौगिक बनाने वाले जीव </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्पादक</span><span style=\"font-family:'Mangal'\"> कहलाते हैं, उपभोक्ता नहीं; उपभोक्ता तो बने-बनाए भोजन पर निर्भर रहता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बगीचे में घास, वृक्ष और फूलदार पौधों के साथ मेंढक, कीट और पक्षी रहते हैं, जो आपस में अन्योन्यक्रिया करते हैं और अजैव परिवेश से प्रभावित होते हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">बगीचा एक पारिस्थितिकी तंत्र</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धमनियों की भित्ति मोटी और लचीली होती है, जबकि शिराओं में जगह-जगह कपाट होते हैं। शिराओं में कपाट इसलिए आवश्यक हैं क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे ऑक्सीजनित रक्त ले जाती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनकी भित्ति एक कोशिका मोटी होती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वे धमनियों से अधिक मोटी होती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनमें रक्त कम दाब पर होता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्त हृदय से </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च दाब</span><span style=\"font-family:'Mangal'\"> पर निकलता है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">धमनियों</span><span style=\"font-family:'Mangal'\"> की भित्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटी और लचीली</span><span style=\"font-family:'Mangal'\"> होती है, जो इस दाब को सह सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी अंग की कोशिकाओं से होकर जब रक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">शिराओं</span><span style=\"font-family:'Mangal'\"> में पहुँचता है, तब वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">उच्च दाब पर नहीं</span><span style=\"font-family:'Mangal'\"> रह जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इतने कम दाब पर रक्त सरलता से पीछे लौट सकता है, इसलिए शिराओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कपाट</span><span style=\"font-family:'Mangal'\"> होते हैं जो रक्त को केवल हृदय की ओर ही बहने देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शिराओं की भित्ति मोटी होने की आवश्यकता नहीं; एक कोशिका मोटी भित्ति तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकाओं</span><span style=\"font-family:'Mangal'\"> की होती है, और अधिकांश शिराओं का रक्त विऑक्सीजनित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कपाट इसलिए आवश्यक हैं क्योंकि शिराओं में रक्त कम दाब पर होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में श्वसन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ग्लूकोज़ का पहले कोशिकाद्रव्य में पाइरूवेट में विखंडन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ऑक्सीजन की उपस्थिति में पाइरूवेट का विखंडन माइटोकॉन्ड्रिया में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रक्त में कार्बन डाइऑक्साइड मुख्यतः हीमोग्लोबिन द्वारा ले जाई जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रत्येक श्वसन पथ का पहला चरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">छह कार्बन वाले ग्लूकोज़ का तीन कार्बन वाले पाइरूवेट में कोशिकाद्रव्य में विखंडन</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इसके बाद पाइरूवेट का विखंडन </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन की उपस्थिति में माइटोकॉन्ड्रिया</span><span style=\"font-family:'Mangal'\"> में होता है, जिससे कार्बन डाइऑक्साइड और जल बनते हैं; यही वायवीय श्वसन है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड जल में ऑक्सीजन से अधिक घुलनशील</span><span style=\"font-family:'Mangal'\"> है, अतः वह रक्त में मुख्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">घुली हुई अवस्था</span><span style=\"font-family:'Mangal'\"> में ले जाई जाती है; हीमोग्लोबिन तो ऑक्सीजन ले जाने वाला वर्णक है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से किस जंतु समूह के शरीर में असंख्य छिद्र होते हैं, जिनसे जल लगातार बहता हुआ कोशिकाओं तक भोजन और ऑक्सीजन पहुँचाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइडेरिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एनेलिडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोरीफेरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेमाटोडा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पोरीफेरा</span><span style=\"font-family:'Mangal'\"> नाम का अर्थ ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">छिद्रधारी</span><span style=\"font-family:'Mangal'\"> है, और स्पंज इसी समूह में आते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पंज के शरीर के अनेक छिद्रों से जल लगातार भीतर बहता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">भोजन कण तथा ऑक्सीजन एक-एक कोशिका तक पहुँचाकर अपशिष्ट बाहर ले जाता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पंज जल में एक ही स्थान पर स्थिर रहते हैं, इसलिए जल का यही प्रवाह उनके लिए भोजन खोजने का काम कर देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नाइडेरिया</span><span style=\"font-family:'Mangal'\"> जैसे हाइड्रा स्पर्शकों से शिकार पकड़ते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">एनेलिडा</span><span style=\"font-family:'Mangal'\"> जैसे केंचुए का शरीर खंडों में बँटा होता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नेमाटोडा</span><span style=\"font-family:'Mangal'\"> बेलनाकार गोलकृमि होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह समूह पोरीफेरा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही लंबे सीधे तार के पास एक निश्चित बिंदु पर कंपास रखा है। तार में धारा बढ़ाने पर कंपास की सुई का विक्षेप:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बढ़ जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घट जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शून्य हो जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपनी दिशा उलट देता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारावाही तार अपने चारों ओर चुंबकीय क्षेत्र उत्पन्न करता है, और यही क्षेत्र कंपास की सुई को घुमाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">किसी दिए गए बिंदु पर चुंबकीय क्षेत्र का परिमाण तार में धारा बढ़ने के साथ बढ़ता</span><span style=\"font-family:'Mangal'\"> है, अतः सुई अधिक कोण से घूम जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए धारा बढ़ाने पर विक्षेप </span><span style=\"font-weight:bold;font-family:'Mangal'\">बढ़ जाता</span><span style=\"font-family:'Mangal'\"> है, और उतनी ही धारा पर कंपास को तार से दूर ले जाने पर विक्षेप घट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्षेप की दिशा तभी उलटती जब धारा की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिशा</span><span style=\"font-family:'Mangal'\"> उलटी जाती, जो यहाँ नहीं हुआ है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सुई का विक्षेप बढ़ जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन यौगिकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. इनके गलनांक और क्वथनांक कम होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ये सामान्यतः विद्युत के कुचालक होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कार्बन अपने चारों संयोजी इलेक्ट्रॉन खोकर स्थायी विन्यास प्राप्त करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मेथेन और एथेनॉल जैसे कार्बन यौगिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम तापमान</span><span style=\"font-family:'Mangal'\"> पर पिघलते और उबलते हैं, जिससे पता चलता है कि उनके </span><span style=\"font-weight:bold;font-family:'Mangal'\">अणुओं के बीच</span><span style=\"font-family:'Mangal'\"> आकर्षण बल दुर्बल है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इनमें परमाणु साझा इलेक्ट्रॉन युग्मों से जुड़े होते हैं और कोई आयन नहीं बनते, अतः कार्बन यौगिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत के कुचालक</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कार्बन में चार संयोजी इलेक्ट्रॉन होते हैं, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">चारों को खोने</span><span style=\"font-family:'Mangal'\"> पर छह प्रोटॉन वाले नाभिक के पास केवल दो इलेक्ट्रॉन बचेंगे, जिसके लिए बहुत अधिक ऊर्जा चाहिए; इसलिए कार्बन अपने संयोजी इलेक्ट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">साझा</span><span style=\"font-family:'Mangal'\"> करता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से तत्वों का कौन-सा प्रतीक सही लिखा गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोबाल्ट के लिए CO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आर्गन के लिए Ag</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक के लिए Zn</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम के लिए Pb</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी तत्व के प्रतीक का पहला अक्षर सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़ा</span><span style=\"font-family:'Mangal'\"> और दूसरा अक्षर, यदि हो, सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा</span><span style=\"font-family:'Mangal'\"> लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Zn</span><span style=\"font-family:'Mangal'\"> ही </span><span style=\"font-weight:bold;font-family:'Mangal'\">ज़िंक</span><span style=\"font-family:'Mangal'\"> का सही प्रतीक है, जिसमें Z बड़ा और n छोटा लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोबाल्ट के लिए CO गलत है, उसका प्रतीक </span><span style=\"font-weight:bold;font-family:'Mangal'\">Co</span><span style=\"font-family:'Mangal'\"> है; CO लिखने पर वह कार्बन मोनोऑक्साइड बन जाता है, जो एक यौगिक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ag</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिल्वर</span><span style=\"font-family:'Mangal'\"> का प्रतीक है, जबकि आर्गन का प्रतीक </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ar</span><span style=\"font-family:'Mangal'\"> है; और </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pb</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">लेड</span><span style=\"font-family:'Mangal'\"> का प्रतीक है, जबकि पोटैशियम का प्रतीक </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ज़िंक के लिए Zn सही लिखा गया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">काँच के प्रिज़्म से श्वेत प्रकाश गुज़रने पर मिलने वाली रंगों की पट्टी के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. लाल प्रकाश सबसे कम और बैंगनी प्रकाश सबसे अधिक मुड़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. रंगों का क्रम VIBGYOR शब्द से याद रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. एक बार बन जाने पर रंगों की यह पट्टी फिर से श्वेत प्रकाश में नहीं मिलाई जा सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रिज़्म में भिन्न-भिन्न रंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न-भिन्न कोणों</span><span style=\"font-family:'Mangal'\"> से मुड़ते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाल सबसे कम और बैंगनी सबसे अधिक</span><span style=\"font-family:'Mangal'\"> मुड़ता है, इसी से रंग अलग-अलग हो जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. पट्टी में रंगों का क्रम बैंगनी, जामुनी, नीला, हरा, पीला, नारंगी और लाल होता है, जिसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">VIBGYOR</span><span style=\"font-family:'Mangal'\"> शब्द से याद रखा जाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. पहले प्रिज़्म के पास </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरा उल्टा प्रिज़्म</span><span style=\"font-family:'Mangal'\"> रखने पर रंग फिर मिल जाते हैं और परदे पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्वेत धब्बा</span><span style=\"font-family:'Mangal'\"> मिलता है, अतः श्वेत प्रकाश पुनः बनाया जा सकता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब कोई व्यक्ति पास रखी वस्तु को देखता है, तब पक्ष्माभी पेशियाँ:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिकुड़ती हैं और लेंस को पतला कर देती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शिथिल होती हैं और लेंस को पतला कर देती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिकुड़ती हैं और लेंस को मोटा कर देती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शिथिल होती हैं और लेंस को मोटा कर देती हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेत्र लेंस की वक्रता </span><span style=\"font-weight:bold;font-family:'Mangal'\">पक्ष्माभी पेशियों</span><span style=\"font-family:'Mangal'\"> द्वारा कुछ सीमा तक बदली जा सकती है, और वक्रता बदलने से लेंस की </span><span style=\"font-weight:bold;font-family:'Mangal'\">फोकस दूरी</span><span style=\"font-family:'Mangal'\"> बदल जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पास रखी वस्तु को स्पष्ट देखने के लिए नेत्र को </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम फोकस दूरी</span><span style=\"font-family:'Mangal'\"> वाला लेंस चाहिए, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक वक्र और मोटा</span><span style=\"font-family:'Mangal'\"> लेंस।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पक्ष्माभी पेशियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">सिकुड़ती</span><span style=\"font-family:'Mangal'\"> हैं, लेंस </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटा</span><span style=\"font-family:'Mangal'\"> हो जाता है और उसकी फोकस दूरी घट जाती है, जिससे रेटिना पर फिर से स्पष्ट प्रतिबिंब बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूर की वस्तु के लिए ये पेशियाँ शिथिल हो जाती हैं, लेंस पतला हो जाता है और उसकी फोकस दूरी बढ़ जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पक्ष्माभी पेशियाँ सिकुड़ती हैं और लेंस को मोटा कर देती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समतल फ़र्श पर एक भारी बक्से को एक समान चाल से धकेला जा रहा है। इस विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बक्से का भार और फ़र्श का अभिलंब बल एक-दूसरे को संतुलित करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. घर्षण बक्से पर उसकी गति की दिशा के विपरीत लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धक्का देना बंद कर दें तो बक्सा उसी चाल से चलता रहेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बक्से का </span><span style=\"font-weight:bold;font-family:'Mangal'\">भार</span><span style=\"font-family:'Mangal'\"> नीचे की ओर तथा फ़र्श का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अभिलंब बल</span><span style=\"font-family:'Mangal'\"> सतह के लंबवत ऊपर की ओर लगता है; ये दोनों </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतुलित</span><span style=\"font-family:'Mangal'\"> रहते हैं, इसीलिए बक्सा न फ़र्श में धँसता है और न ऊपर उठता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. संपर्क में आई सतहें फिसलने का विरोध करती हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण बल बक्से की गति के विपरीत</span><span style=\"font-family:'Mangal'\"> लगता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धक्का देना बंद करते ही क्षैतिज दिशा में केवल घर्षण बचता है, इसलिए बक्सा </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीमा होकर रुक जाता</span><span style=\"font-family:'Mangal'\"> है; एक समान चाल बनाए रखने के लिए बल लगातार लगाना पड़ता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गीली रुई पर रखी ब्रेड का एक टुकड़ा गरम और अंधेरी जगह पर तीन दिन बाद रुई जैसी वृद्धि दिखाता है। सूक्ष्मदर्शी से देखने पर धागे जैसी रचनाओं के सिरे पर गोल थैलियाँ दिखती हैं। इन थैलियों में होते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कलिकाएँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">युग्मक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रेड पर उगी रुई जैसी वृद्धि एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कवक जाल</span><span style=\"font-family:'Mangal'\"> है, जो एक कवक है, और उसकी धागे जैसी रचनाओं को कवक तंतु कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक तंतु के सिरे पर एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोल थैली</span><span style=\"font-family:'Mangal'\"> होती है जिसमें बहुत बड़ी संख्या में छोटे-छोटे </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीजाणु</span><span style=\"font-family:'Mangal'\"> बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीजाणु हल्के और प्रायः एककोशिकीय होते हैं, अतः वायु की धाराओं में सरलता से तैरते हैं, और नमी तथा पोषक पदार्थ मिलते ही नए जीव में अंकुरित हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कलिकाएँ</span><span style=\"font-family:'Mangal'\"> जनक शरीर के प्रवर्ध होती हैं, जैसे यीस्ट और हाइड्रा में; </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीज</span><span style=\"font-family:'Mangal'\"> केवल बीजधारी पौधों में बनते हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">युग्मक</span><span style=\"font-family:'Mangal'\"> लैंगिक प्रजनन में भाग लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इन थैलियों में बीजाणु होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): वायु में चलने वाली ध्वनि तरंग अनुदैर्घ्य तरंग होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ध्वनि तरंग में माध्यम के कण तरंग की चलने की दिशा के लंबवत कंपन करते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंग वायु में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संपीडन और विरलन</span><span style=\"font-family:'Mangal'\"> की शृंखला के रूप में चलती है, और वायु के कण तरंग की चलने की दिशा के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समांतर</span><span style=\"font-family:'Mangal'\"> कंपन करते हैं; ऐसी तरंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुदैर्घ्य तरंग</span><span style=\"font-family:'Mangal'\"> कहलाती है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R कहता है कि कण संचरण की दिशा के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबवत</span><span style=\"font-family:'Mangal'\"> कंपन करते हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुप्रस्थ तरंग</span><span style=\"font-family:'Mangal'\"> का वर्णन है, ध्वनि तरंग का नहीं → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल की सतह पर और तनी हुई डोरी पर चलने वाली तरंगें अनुप्रस्थ होती हैं; वायु में ध्वनि नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल के ऊपरी भाग पर सूर्य की किरणों के लंबवत रखे एकांक क्षेत्रफल पर एकांक समय में प्राप्त सौर ऊर्जा की औसत मात्रा लगभग है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.14 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">140 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.4 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस राशि को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सौर नियतांक</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसका मान लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.4 किलोवाट प्रति वर्ग मीटर</span><span style=\"font-family:'Mangal'\"> होता है, जो लगभग 1400 जूल प्रति सेकंड प्रति वर्ग मीटर के बराबर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसे वायुमंडल के ऊपरी भाग पर मापा जाता है, अतः यह वह ऊर्जा है जो वायुमंडल में किसी भी अवशोषण, प्रकीर्णन या परावर्तन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहले</span><span style=\"font-family:'Mangal'\"> उपलब्ध रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सौर नियतांक से पृथ्वी का ऊर्जा संतुलन समझा जाता है और यह आकलन किया जाता है कि दिए गए क्षेत्रफल से कितनी सौर शक्ति मिल सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इसका मान लगभग 1.4 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी धातु के तार के प्रतिरोध के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. तार की लंबाई दोगुनी करने पर यह दोगुना हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. उसी पदार्थ और उतनी ही लंबाई का मोटा तार लेने पर यह बढ़ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. प्रतिरोधकता तार के पदार्थ का अभिलक्षणिक गुण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. तार का प्रतिरोध उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबाई के अनुक्रमानुपाती</span><span style=\"font-family:'Mangal'\"> होता है, अतः लंबाई दोगुनी करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिरोध दोगुना</span><span style=\"font-family:'Mangal'\"> हो जाता है और परिपथ की धारा आधी रह जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रतिरोध </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुप्रस्थ काट के क्षेत्रफल के व्युत्क्रमानुपाती</span><span style=\"font-family:'Mangal'\"> होता है, अतः उसी पदार्थ और उतनी ही लंबाई का </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटा</span><span style=\"font-family:'Mangal'\"> तार लेने पर प्रतिरोध </span><span style=\"font-weight:bold;font-family:'Mangal'\">घट</span><span style=\"font-family:'Mangal'\"> जाता है और धारा बढ़ जाती है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिरोधकता</span><span style=\"font-family:'Mangal'\"> केवल पदार्थ और उसके तापमान पर निर्भर करती है, तार की लंबाई या मोटाई पर नहीं, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पदार्थ का अभिलक्षणिक गुण</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिवर्ती चाप में आवेग का सही पथ निम्नलिखित में से कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही → मस्तिष्क → मेरुरज्जु → पेशी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही → मेरुरज्जु → मस्तिष्क → पेशी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही → मोटर न्यूरॉन → मेरुरज्जु → पेशी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही → मेरुरज्जु → मोटर न्यूरॉन → पेशी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">प्रतिवर्ती चाप</span><span style=\"font-family:'Mangal'\"> उत्तेजना पहचानने वाली तंत्रिका और पेशी को चलाने वाली तंत्रिका के बीच का सरल संबंध है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्राही उत्तेजना ग्रहण करता है और संवेदी न्यूरॉन आवेग को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेरुरज्जु</span><span style=\"font-family:'Mangal'\"> तक पहुँचाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेरुरज्जु में आवेग तुरंत </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोटर न्यूरॉन</span><span style=\"font-family:'Mangal'\"> को सौंप दिया जाता है, जो उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेशी</span><span style=\"font-family:'Mangal'\"> तक ले जाती है और पेशी प्रतिक्रिया कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवेग मस्तिष्क तक भी पहुँचता है, परंतु बाद में; यदि हर प्रतिक्रिया पहले सोची जाती, तो गरम वस्तु पर रखा हाथ हटाने से पहले ही जल जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही पथ ग्राही → मेरुरज्जु → मोटर न्यूरॉन → पेशी है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति P, Q, R, S, T, U, V और W दो समानांतर पंक्तियों में चार-चार की संख्या में बैठे हैं। P, Q, R और S पंक्ति 1 में बैठे हैं और सभी का मुख दक्षिण दिशा की ओर है। T, U, V और W पंक्ति 2 में बैठे हैं और सभी का मुख उत्तर दिशा की ओर है। पंक्ति 1 का प्रत्येक व्यक्ति पंक्ति 2 के एक व्यक्ति के सामने बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और R एक-दूसरे के निकटतम पड़ोसी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q पंक्ति 1 के किसी एक छोर पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S का मुख U के सामने है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V पंक्ति 2 के किसी एक छोर पर बैठा है और T का निकटतम पड़ोसी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U, W के ठीक बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P का मुख W के सामने है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q के सामने कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पंक्ति 2 की सीटों को 1 से 4 तक इस प्रकार क्रमांकित करते हैं कि उत्तर की ओर मुख किए पंक्ति 2 के व्यक्तियों के लिए सीट 1 सबसे बाईं ओर हो; अतः सीट 1 से सीट 4 की ओर जाना उनके दाईं ओर जाना है। पंक्ति 1 का जो व्यक्ति पंक्ति 2 की सीट i वाले व्यक्ति के सामने है, उसे भी सीट संख्या i दी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U, W के ठीक बाईं ओर बैठा है → U और W आसपास की दो सीटों पर हैं, जिनमें U की सीट संख्या छोटी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V पंक्ति 2 के किसी एक छोर पर है और T का निकटतम पड़ोसी है → या तो V = 1 और T = 2, या V = 4 और T = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति V = 1, T = 2: तब U और W सीट 3 और 4 पर होंगे → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 3, W = 4</span><span style=\"font-family:'Mangal'\">. S का मुख U के सामने है → S = 3, और P का मुख W के सामने है → P = 4. अब P और R को निकटतम पड़ोसी होना चाहिए, परंतु सीट 4 के पास केवल सीट 3 है जिस पर S है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति V = 4, T = 3: तब U और W सीट 1 और 2 पर होंगे → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 1, W = 2</span><span style=\"font-family:'Mangal'\">. S का मुख U के सामने है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 1</span><span style=\"font-family:'Mangal'\">, और P का मुख W के सामने है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और R निकटतम पड़ोसी हैं → R = 1 या 3; सीट 1 पर S है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 3</span><span style=\"font-family:'Mangal'\">, और बची हुई सीट 4 पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> बैठेगा, जो एक छोर है ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था: पंक्ति 1 (सीट 1 से 4) </span><span style=\"font-weight:bold;font-family:'Mangal'\">S, P, R, Q</span><span style=\"font-family:'Mangal'\">; पंक्ति 2 (सीट 1 से 4) </span><span style=\"font-weight:bold;font-family:'Mangal'\">U, W, T, V</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q सीट 4 पर है, अतः Q के सामने पंक्ति 2 की सीट 4 वाला व्यक्ति, अर्थात् V है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः Q के सामने </span><span style=\"font-weight:bold;font-family:'Mangal'\">V (विकल्प D)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति A, B, C, D, E, F और G एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। A, B के दाईं ओर तीसरे स्थान पर बैठा है। C, A और G दोनों का निकटतम पड़ोसी है। E, C के बाईं ओर दूसरे स्थान पर बैठा है। F, B के ठीक बाईं ओर बैठा है। D से उसकी दाईं ओर की ओर गिनने पर D और F के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सातों व्यक्तियों का मुख केंद्र की ओर है, अतः ‘दाएँ’ = वामावर्त (anticlockwise) और ‘बाएँ’ = दक्षिणावर्त (clockwise)। सीटों को दाईं ओर (वामावर्त) 1 से 7 तक क्रमांकित करते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">B सीट 1 पर</span><span style=\"font-family:'Mangal'\">; दाईं ओर जाने पर 1 जुड़ता है और बाईं ओर जाने पर 1 घटता है, तथा 7 के बाद फिर 1 आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B के दाईं ओर तीसरे स्थान पर → A = 1 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, A का निकटतम पड़ोसी है → C = 3 या 5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, C के बाईं ओर दूसरे स्थान पर → E = C − 2. यदि C = 3 हो तो E = 1 होगा, जो B की सीट है ✗, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">C = 5</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G भी C का निकटतम पड़ोसी है → सीट 5 के पास सीट 4 (A) और सीट 6 हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, B के ठीक बाईं ओर → F = 1 − 1 = 0 → 0 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब केवल सीट 2 बची है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">D = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (सीट 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">B – D – E – A – C – G – F</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D (सीट 2) से उसकी दाईं ओर गिनने पर सीट 3, 4, 5, 6 पर क्रमशः E, A, C और G हैं, और सीट 7 पर F है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उस दिशा में D और F के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार</span><span style=\"font-family:'Mangal'\"> व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अरुण और भावना बिंदु O से एक साथ चलना शुरू करते हैं। अरुण 6 km उत्तर की ओर चलता है, फिर मुड़कर 8 km पूर्व की ओर चलता है और बिंदु X पर रुक जाता है। भावना 9 km दक्षिण की ओर चलती है, फिर मुड़कर 8 km पूर्व की ओर चलती है और बिंदु Y पर रुक जाती है। बिंदु X और बिंदु Y के बीच न्यूनतम दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 km</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अरुण: 6 km उत्तर → (0, 6); फिर 8 km पूर्व → X = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">8, 6</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भावना: 9 km दक्षिण → (0, −9); फिर 8 km पूर्व → Y = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">8, −9</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X और Y दोनों O से 8 km पूर्व में हैं, अतः वे एक ही उत्तर-दक्षिण रेखा पर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूरी XY = 6 + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(17 km और 13 km तब आते जब पूर्व की ओर दोनों दूरियाँ असमान होतीं, तथा 16 km में एक km छूट जाता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X और Y के बीच न्यूनतम दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर DEAL एक निश्चित तर्क के अनुसार CFZM से संबंधित है। उसी तर्क के अनुसार PORT निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OPQT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NPQU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OPSU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OPQU</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DEAL − CFZM: D − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">, E + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-family:'Mangal'\">, A − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\"> (1 − 1 = 0 → 0 + 26 = 26 = Z), L + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: पहला और तीसरा अक्षर एक स्थान पीछे जाते हैं, दूसरा और चौथा अक्षर एक स्थान आगे जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PORT: P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, O + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, R − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, T + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\"> → OPQU</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OPQT में अंतिम अक्षर अपरिवर्तित रह जाता है, NPQU में P दो स्थान पीछे चला जाता है, और OPSU में R एक स्थान आगे चला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः PORT, </span><span style=\"font-weight:bold;font-family:'Mangal'\">OPQU (विकल्प D)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पार्क में खड़ी एक महिला की ओर संकेत करते हुए विकास ने कहा, “वह मेरे पिता की इकलौती बहन की पुत्री है।” उस महिला का विकास से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की बहन की पुत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता के भाई की पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन की पुत्री</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो दो व्यक्ति भाई-बहन होते हैं उनके माता-पिता समान होते हैं, अतः विकास से शुरू करके एक-एक चरण चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपने पिता</span><span style=\"font-family:'Mangal'\"> की बात कर रहा है, अतः विकास से पहला चरण उसके पिता तक जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकास के पिता की इकलौती </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहन</span><span style=\"font-family:'Mangal'\">, विकास के पिता की बहन है; उसके और विकास के पिता के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह महिला उसी बहन की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुत्री</span><span style=\"font-family:'Mangal'\"> है, अतः वह महिला विकास के पिता की बहन की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता की बहन की पुत्री के लिए संबंध विकास की माता से होकर जाना पड़ता; पिता के भाई की पुत्री के लिए बहन नहीं, भाई चाहिए; पिता की बहन तो स्वयं उस महिला की माता है, वह महिला नहीं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वह महिला विकास के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता की बहन की पुत्री (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'GARDEN' को 'TZIWVM' लिखा जाता है। उसी भाषा में 'ORCHID' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LIXRSW</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MIXSRW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LIXSRW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LJXSRW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का स्थान लिखकर उसकी तुलना उसके कूट अक्षर के स्थान से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G (7) → 27 − 7 = 20 = T, A (1) → 27 − 1 = 26 = Z, R (18) → 27 − 18 = 9 = I, D (4) → 27 − 4 = 23 = W, E (5) → 27 − 5 = 22 = V, N (14) → 27 − 14 = 13 = M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रत्येक अक्षर उसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">विपरीत अक्षर</span><span style=\"font-family:'Mangal'\"> से बदला जाता है, अर्थात् स्थान n के बदले स्थान 27 − n आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यही नियम ORCHID पर लागू करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O (15) → 27 − 15 = 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, R (18) → 27 − 18 = 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span><span style=\"font-family:'Mangal'\">, C (3) → 27 − 3 = 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, H (8) → 27 − 8 = 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, I (9) → 27 − 9 = 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, D (4) → 27 − 4 = 23 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कूट LIXSRW बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(LIXRSW और LJXSRW में क्रम या एक अक्षर का कूट बदल गया है, तथा MIXSRW में O के लिए 28 − 15 ले लिया गया है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'ORCHID' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">LIXSRW (विकल्प C)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R और S चार अलग-अलग विषय पढ़ते हैं: इतिहास, गणित, भौतिकी और रसायन, तथा चार अलग-अलग शहरों में रहते हैं: आगरा, भोपाल, चेन्नई और दिल्ली, परंतु आवश्यक नहीं कि इसी क्रम में हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आगरा में रहने वाला रसायन पढ़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इतिहास पढ़ने वाला दिल्ली में रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P न तो इतिहास पढ़ता है और न ही रसायन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R भोपाल या चेन्नई में नहीं रहता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S न तो दिल्ली में रहता है और न ही आगरा में।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S गणित नहीं पढ़ता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P भोपाल में रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q दिल्ली में नहीं रहता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा संयोजन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P - भौतिकी - भोपाल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R - इतिहास - दिल्ली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S - गणित - चेन्नई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q - इतिहास - आगरा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P भोपाल में रहता है, और S न दिल्ली में रहता है न आगरा में, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">S चेन्नई में रहता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R भोपाल या चेन्नई में नहीं रहता, अतः R आगरा या दिल्ली में रहता है, और इन दोनों में से दूसरा शहर Q के लिए बचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q दिल्ली में नहीं रहता, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q आगरा में</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">R दिल्ली में</span><span style=\"font-family:'Mangal'\"> रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आगरा में रहने वाला रसायन पढ़ता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q रसायन पढ़ता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इतिहास पढ़ने वाला दिल्ली में रहता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R इतिहास पढ़ता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब P और S के लिए गणित और भौतिकी बचे हैं। S गणित नहीं पढ़ता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S भौतिकी</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">P गणित</span><span style=\"font-family:'Mangal'\"> पढ़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम स्थिति: P गणित पढ़ता है और भोपाल में रहता है, Q रसायन पढ़ता है और आगरा में रहता है, R इतिहास पढ़ता है और दिल्ली में रहता है, S भौतिकी पढ़ता है और चेन्नई में रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही संयोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">R - इतिहास - दिल्ली (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED एक निश्चित तर्क के अनुसार 11 से संबंधित है। उसी तर्क के अनुसार CAP, 20 से संबंधित है। उसी तर्क के अनुसार FIG निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का अंग्रेज़ी वर्णमाला में स्थान लिखकर उनका योग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BED: B = 2, E = 5, D = 4 → 2 + 5 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CAP: C = 3, A = 1, P = 16 → 3 + 1 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: संख्या = अक्षरों के स्थानों का योग।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FIG: F = 6, I = 9, G = 7 → 6 + 9 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(21 और 24 में एक इकाई कम या अधिक ले ली गई है, तथा 20 तो CAP के लिए दी गई संख्या है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः FIG, </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B की माता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B का अर्थ है कि ‘A, B का भाई है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B का अर्थ है कि ‘A, B का पिता है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B की पुत्री है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P + Q × R − T’ है, तो P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता की माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता की बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A, B का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P + Q × R − T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R − T → R, T का भाई है, अतः R और T के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q × R → Q, R का पिता है। चूँकि R और T के माता-पिता समान हैं, इसलिए Q, T का भी पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P, Q की माता है, अतः P, T के पिता की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(माता की माता के लिए Q को T की माता होना पड़ता; पिता की बहन और भाई की पत्नी अंतिम चरण की माता से मेल नहीं खातीं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T के पिता की माता (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए समीकरण को सही बनाने के लिए किन दो चिह्नों को आपस में बदलना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 ÷ 6 + 5 × 7 − 9 = 38</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">− and ÷</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">÷ and ×</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+ and −</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+ and ×</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जैसा दिया है, 48 ÷ 6 + 5 × 7 − 9 = 8 + 35 − 9 = 34 आता है, जो 38 नहीं है, अतः दो चिह्नों को आपस में बदलना होगा। प्रत्येक विकल्प आज़माएँ और BODMAS लागू करें (+ और − से पहले × और ÷)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A, − और ÷ बदलने पर: 48 − 6 + 5 × 7 ÷ 9, जो पूर्ण संख्या नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B, ÷ और × बदलने पर: 48 × 6 + 5 ÷ 7 − 9, जो पूर्ण संख्या नहीं है ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C, + और − बदलने पर: 48 ÷ 6 − 5 × 7 + 9 = 8 − 35 + 9 = −18 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D, + और × बदलने पर: 48 ÷ 6 × 5 + 7 − 9 = 8 × 5 + 7 − 9 = 40 + 7 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आपस में बदले जाने वाले दो चिह्न </span><span style=\"font-weight:bold;font-family:'Mangal'\">+ and × (विकल्प D)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MP - BE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJ - VZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QT - FI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CF - RU</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MP - BE: M − 11 = B (13 − 11 = 2 = B), P − 11 = E → (−11, −11)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4, 12, 15)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 21, 25)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 24, 26)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समुच्चय को पहली संख्या से तीसरी संख्या तक पढ़ें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 18, 21): दूसरी संख्या = 6 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18</span><span style=\"font-family:'Mangal'\">; तीसरी संख्या = 18 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 27, 30): दूसरी संख्या = 9 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27</span><span style=\"font-family:'Mangal'\">; तीसरी संख्या = 27 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: दूसरी संख्या = पहली संख्या × 3, और तीसरी संख्या = दूसरी संख्या + 3.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5, 15, 20): 5 × 3 = 15 ✓, परंतु 15 + 3 = 18 होता है, 20 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4, 12, 15): 4 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</s
