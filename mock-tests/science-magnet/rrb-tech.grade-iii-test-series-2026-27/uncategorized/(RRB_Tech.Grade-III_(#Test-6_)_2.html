gin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lens formula </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/v − 1/u = 1/f</span><span style=\"font-family:'Mangal'\">: 1/v = 1/f + 1/u = 1/20 − 1/30 = (3 − 2) ÷ 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/60</span><span style=\"font-family:'Mangal'\"> → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60 cm</span><span style=\"font-family:'Mangal'\"> (positive → on the other side of the lens, so the image is real and can be taken on a screen).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Magnification m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">v/u</span><span style=\"font-family:'Mangal'\"> = 60 ÷ (−30) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\">; the negative sign shows the image is </span><span style=\"font-weight:bold;font-family:'Mangal'\">inverted</span><span style=\"font-family:'Mangal'\"> and real.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Image height h' = m × h = −2 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6 cm</span><span style=\"font-family:'Mangal'\">, i.e. 6 cm tall, inverted (the object lies between F₁ and 2F₁, so the image is beyond 2F₂ and enlarged).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the image is 60 cm away on the other side, real, inverted and 6 cm tall </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bus travelling at 54 km/h on a straight road sees an obstacle 60 m ahead. The driver takes 0.6 s to react before applying the brakes, after which the bus decelerates uniformly at 2.5 m/s². The bus will:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">hit the obstacle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">stop 6 m before the obstacle</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">stop 15 m before the obstacle</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">stop 9 m before the obstacle</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Speed of the bus u = 54 km/h = 54 × (1000 ÷ 3600) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During the reaction time the bus moves at constant speed: distance = 15 × 0.6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After braking, the acceleration is opposite to the velocity (a = −2.5 m/s²) and v = 0. Using </span><span style=\"font-weight:bold;font-family:'Mangal'\">v² = u² + 2as</span><span style=\"font-family:'Mangal'\">: 0 = 15² − 2 × 2.5 × s → s = 225 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total stopping distance = 9 + 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 m</span><span style=\"font-family:'Mangal'\">, which is less than 60 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the bus stops 60 − 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 m</span><span style=\"font-family:'Mangal'\"> before the obstacle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the bus stops 6 m before the obstacle </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match the scientist with the contribution:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789734263720_image002.png\" style=\"width: 800px; height: 300px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">J. J. Thomson</span><span style=\"font-family:'Mangal'\">&#39;s most significant discovery was that of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">electron</span><span style=\"font-family:'Mangal'\">, which was the first subatomic particle to be identified and a part of every atom (1897) &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">James Chadwick</span><span style=\"font-family:'Mangal'\"> (1932) discovered a new subatomic particle with mass nearly equal to that of a proton but with </span><span style=\"font-weight:bold;font-family:'Mangal'\">no electrical charge</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">neutron</span><span style=\"font-family:'Mangal'\"> &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Niels Bohr</span><span style=\"font-family:'Mangal'\"> (1913) proposed that electrons do not move randomly but follow </span><span style=\"font-weight:bold;font-family:'Mangal'\">fixed circular paths</span><span style=\"font-family:'Mangal'\"> called </span><span style=\"font-weight:bold;font-family:'Mangal'\">stationary states, orbits or shells</span><span style=\"font-family:'Mangal'\"> &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-3, (b)-1, (c)-2 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A student adds zinc granules to dilute nitric acid but does not obtain hydrogen gas, although zinc gives hydrogen with dilute hydrochloric acid. Which of the following is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zinc is placed below hydrogen in the activity series, so it cannot displace hydrogen from any acid</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HNO₃ is a strong oxidising agent that oxidises the hydrogen produced to water and is itself reduced to oxides of nitrogen; only Mg and Mn give H₂ with very dilute HNO₃</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nitric acid does not react with metals at all</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nitric acid is a weak acid, so it does not ionise enough to give hydrogen</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Metals react with dilute acids to give a salt and hydrogen: Metal + Dilute acid → Salt + Hydrogen; zinc is </span><span style=\"font-weight:bold;font-family:'Mangal'\">above hydrogen</span><span style=\"font-family:'Mangal'\"> in the activity series, so it does give H₂ with dilute HCl.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hydrogen gas is </span><span style=\"font-weight:bold;font-family:'Mangal'\">not evolved</span><span style=\"font-family:'Mangal'\"> when a metal reacts with </span><span style=\"font-weight:bold;font-family:'Mangal'\">nitric acid</span><span style=\"font-family:'Mangal'\">, because </span><span style=\"font-weight:bold;font-family:'Mangal'\">HNO₃ is a strong oxidising agent</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nitric acid </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxidises the hydrogen produced to water</span><span style=\"font-family:'Mangal'\"> and is itself </span><span style=\"font-weight:bold;font-family:'Mangal'\">reduced</span><span style=\"font-family:'Mangal'\"> to nitrogen oxides such as N₂O, NO or NO₂.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The exceptions are </span><span style=\"font-weight:bold;font-family:'Mangal'\">magnesium and manganese</span><span style=\"font-family:'Mangal'\">, which react with </span><span style=\"font-weight:bold;font-family:'Mangal'\">very dilute</span><span style=\"font-family:'Mangal'\"> nitric acid to evolve hydrogen gas.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, HNO₃ oxidises the hydrogen formed, and only Mg and Mn give H₂ with very dilute HNO₃ </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the scattering of light:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The path of a beam of light passing through a true solution is visible.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Very fine particles scatter mainly blue light.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. If the size of the scattering particles is large enough, the scattered light may even appear white.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The path of light through a </span><span style=\"font-weight:bold;font-family:'Mangal'\">true solution</span><span style=\"font-family:'Mangal'\"> is </span><span style=\"font-weight:bold;font-family:'Mangal'\">not visible</span><span style=\"font-family:'Mangal'\">; it becomes visible through a </span><span style=\"font-weight:bold;font-family:'Mangal'\">colloidal solution</span><span style=\"font-family:'Mangal'\">, where the particle size is relatively larger (Tyndall effect) → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The colour of scattered light depends on the size of the scattering particles: </span><span style=\"font-weight:bold;font-family:'Mangal'\">very fine particles scatter mainly blue light</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Particles of larger size scatter light of longer wavelengths, and if the particles are </span><span style=\"font-weight:bold;font-family:'Mangal'\">large enough</span><span style=\"font-family:'Mangal'\"> the scattered light may even appear </span><span style=\"font-weight:bold;font-family:'Mangal'\">white</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 2 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": "An ोिहंiniहं नयक AB iौ ौहौूधnकधक ुयनप्रयnपोििद ृधपथधधn पुध ूियधौ यी ो ुयनौध-ौुयध ंोgnधप, थiपु पुध nयनपु ूियध ृिधयथ ोnक पुध ौयहपु ूियध ोृयॅध पुध नयक. Wुधn cहननधnप iौ ूोौौधक ीनयं B पय A, पुध नयक iौ कiौूिोcधक पयथोनकौ पुध िधीप. Iी पुध कiनधcपiयn यी पुध cहननधnप iौ नधॅधनौधक (A पय B) AND पुध ूियधौ यी पुध ंोgnधप ोनध ोिसय inपधनcुोngधक, पुध नयक थiिि ृध कiौूिोcधक:", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">towards the right</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">towards the left</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">not at all, as the two changes cancel the force</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">vertically upwards</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A current-carrying conductor in a magnetic field experiences a </span><span style=\"font-weight:bold;font-family:'Mangal'\">force</span><span style=\"font-family:'Mangal'\"> whose direction depends on the direction of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">current</span><span style=\"font-family:'Mangal'\"> and the direction of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">magnetic field</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Reversing the current</span><span style=\"font-family:'Mangal'\"> alone reverses the displacement: the rod would move towards the </span><span style=\"font-weight:bold;font-family:'Mangal'\">right</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Interchanging the poles</span><span style=\"font-family:'Mangal'\"> (reversing the field) alone also reverses the direction of the force.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When </span><span style=\"font-weight:bold;font-family:'Mangal'\">both</span><span style=\"font-family:'Mangal'\"> are reversed, the direction of the force is reversed </span><span style=\"font-weight:bold;font-family:'Mangal'\">twice</span><span style=\"font-family:'Mangal'\">, so the rod is again displaced towards the </span><span style=\"font-weight:bold;font-family:'Mangal'\">left</span><span style=\"font-family:'Mangal'\">, the same as originally.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the rod is displaced towards the left </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about lenses:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. A concave lens always gives a virtual, erect and diminished image, irrespective of the position of the object.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A ray of light passing through the optical centre of a lens emerges without any deviation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. If one half of a convex lens is covered with black paper, the lens still forms a complete image of the object, though the image is dimmer.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Whatever the object position (from infinity up to the optical centre), a </span><span style=\"font-weight:bold;font-family:'Mangal'\">concave lens</span><span style=\"font-family:'Mangal'\"> always forms a </span><span style=\"font-weight:bold;font-family:'Mangal'\">virtual, erect and diminished</span><span style=\"font-family:'Mangal'\"> image between F₁ and O → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A ray through the </span><span style=\"font-weight:bold;font-family:'Mangal'\">optical centre</span><span style=\"font-family:'Mangal'\"> of a lens passes </span><span style=\"font-weight:bold;font-family:'Mangal'\">without suffering any deviation</span><span style=\"font-family:'Mangal'\">; this is one of the standard rays used in ray diagrams → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Every part of the lens forms the </span><span style=\"font-weight:bold;font-family:'Mangal'\">whole image</span><span style=\"font-family:'Mangal'\">; covering one half only reduces the light passing through, so a </span><span style=\"font-weight:bold;font-family:'Mangal'\">complete but dimmer</span><span style=\"font-family:'Mangal'\"> image is formed → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During a severe winter in a hill station, a bottle of pure ethanoic acid in a laboratory is found to have solidified, while the bottle of vinegar next to it is still liquid. The pure ethanoic acid froze because:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">it reacted with moisture in the air to form a solid salt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ethanoic acid is a strong acid that crystallises when its water evaporates</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the melting point of pure ethanoic acid is 290 K, so it freezes in cold climates, which is why it is called glacial acetic acid</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">vinegar is more concentrated than pure ethanoic acid and hence stays liquid</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ethanoic acid (acetic acid, CH₃COOH) belongs to the carboxylic acids; carboxylic acids are </span><span style=\"font-weight:bold;font-family:'Mangal'\">weak acids</span><span style=\"font-family:'Mangal'\">, not strong ones.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">melting point of pure ethanoic acid is 290 K</span><span style=\"font-family:'Mangal'\"> (about 17°C), so it often </span><span style=\"font-weight:bold;font-family:'Mangal'\">freezes during winter</span><span style=\"font-family:'Mangal'\"> in cold climates.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This freezing behaviour gives pure ethanoic acid the name </span><span style=\"font-weight:bold;font-family:'Mangal'\">glacial acetic acid</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vinegar is only a </span><span style=\"font-weight:bold;font-family:'Mangal'\">5–8% solution</span><span style=\"font-family:'Mangal'\"> of acetic acid in water, so it does not freeze at the same temperature as the pure acid.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pure acid froze because its melting point is 290 K </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Blood is neither a true solution nor a true suspension; it is a colloid.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The particles of a colloid have a size between 1 nm and 1000 nm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Unlike a suspension, the particles of a colloid do not settle over time but remain uniformly dispersed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Blood is </span><span style=\"font-weight:bold;font-family:'Mangal'\">neither a true solution nor a true suspension</span><span style=\"font-family:'Mangal'\">; it is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">colloid</span><span style=\"font-family:'Mangal'\"> (like milk, tomato sauce and ice cream) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Solutions, suspensions and colloids differ mainly in particle size: solution particles are smaller than 1 nm, </span><span style=\"font-weight:bold;font-family:'Mangal'\">colloid particles lie between 1 and 1000 nm</span><span style=\"font-family:'Mangal'\">, and suspension particles are larger than 1000 nm → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Unlike suspensions, colloidal particles </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not settle</span><span style=\"font-family:'Mangal'\"> over time; they remain </span><span style=\"font-weight:bold;font-family:'Mangal'\">uniformly dispersed</span><span style=\"font-family:'Mangal'\"> throughout the mixture, as in a solution → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Frogs and butterflies do not hatch directly as small adults; instead a larva (tadpole or caterpillar) hatches from the egg, feeds and grows, and later transforms into the adult. The best explanation for this intermediate larval stage is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the yolk in each of the many eggs is just enough to produce a larva, which then feeds on organic matter to accumulate nutrition before transforming into the adult</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the eggs of these animals contain no yolk at all, so the embryo must feed from the day it is laid</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the larva is needed to protect the egg from predators until the adult develops inside it</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the mother feeds the larva with milk until it becomes an adult</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fish, amphibians and insects produce </span><span style=\"font-weight:bold;font-family:'Mangal'\">several hundred to several thousand eggs</span><span style=\"font-family:'Mangal'\"> at a time; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">yolk</span><span style=\"font-family:'Mangal'\"> in each egg contains nutritive substances for the developing embryo.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A mother's body cannot provide large quantities of yolk for so many eggs, so the yolk in each egg is </span><span style=\"font-weight:bold;font-family:'Mangal'\">just enough to produce a larva</span><span style=\"font-family:'Mangal'\">, which hatches from the egg.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">larva</span><span style=\"font-family:'Mangal'\"> gets nutrition by eating organic matter (such as rotten food and manure) and grows, which is an </span><span style=\"font-weight:bold;font-family:'Mangal'\">intermediate feeding stage</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Once enough nutrition is accumulated, a </span><span style=\"font-weight:bold;font-family:'Mangal'\">transformation</span><span style=\"font-family:'Mangal'\"> takes place and the adult body is formed, as in butterflies and frogs (mammals, not frogs or insects, feed their young with milk).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the larval stage exists because the yolk is only enough to produce a larva </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Steam is passed over hot iron: Fe(s) + H₂O(g) → Fe₃O₄(s) + H₂(g). When this equation is balanced using the smallest whole-number coefficients, the coefficients of Fe, H₂O and H₂ are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 4, 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 2, 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 4, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 4, 4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">While balancing, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">formulae cannot be altered</span><span style=\"font-family:'Mangal'\">; only coefficients are placed before them (4H₂O, never H₂O₄).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Start with the compound having the most atoms, Fe₃O₄: to balance </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen</span><span style=\"font-family:'Mangal'\"> (1 on the left, 4 on the right), write </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H₂O</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now hydrogen is 8 on the left (4H₂O) and 2 on the right (H₂) → write </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H₂</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Finally iron is 1 on the left and 3 on the right → write </span><span style=\"font-weight:bold;font-family:'Mangal'\">3Fe</span><span style=\"font-family:'Mangal'\">: 3Fe(s) + 4H₂O(g) → Fe₃O₄(s) + 4H₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: Fe 3 = 3, H 8 = 8, O 4 = 4, balanced; (g) with H₂O shows water is used as steam.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the coefficients are 3, 4, 4 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध धnपनद यी ूधौपiciकधौ inपय ीययक cुोinौ:1. Pधौपiciकधौ थोौुधक inपय पुध ौयiि यन थोपधन ृयकiधौ ोनध ोृौयनृधक ृद ूिोnपौ ोियng थiपु थोपधन ोnक ंinधनोिस.2. Sincध ुहंोn ृधingौ यccहूद पुध पयू िधॅिध in ोnद ीययक cुोin, पुध ंोसiंहं cयncधnपनोपiयn यी पुधौध cुधंicोिस ोccहंिहोपधौ in ुहंोn ृयकiधौ.3. Bधcोहौध यी ृiिययgicोि ंोgniीicोपiयn, ीययक gनोinौ, ॅधgधपोृिधौ, ीनहiपौ ोnक धॅधn ंधोप cयnपोin ूधौपiciकध नधौiकहधौ पुोप cोnnयप ोिथोदौ ृध नधंयॅधक ृद थोौुing.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Pesticides and other chemicals used to protect crops are </span><span style=\"font-weight:bold;font-family:'Mangal'\">washed into the soil or water bodies</span><span style=\"font-family:'Mangal'\">, from where they are </span><span style=\"font-weight:bold;font-family:'Mangal'\">absorbed by plants</span><span style=\"font-family:'Mangal'\"> along with water and minerals (and by aquatic plants and animals) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. These chemicals accumulate progressively at each trophic level; as </span><span style=\"font-weight:bold;font-family:'Mangal'\">human beings occupy the top level</span><span style=\"font-family:'Mangal'\"> in any food chain, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">maximum concentration</span><span style=\"font-family:'Mangal'\"> accumulates in our bodies → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Because of this </span><span style=\"font-weight:bold;font-family:'Mangal'\">biological magnification</span><span style=\"font-family:'Mangal'\">, food grains such as wheat and rice, vegetables, fruits and even meat contain </span><span style=\"font-weight:bold;font-family:'Mangal'\">pesticide residues</span><span style=\"font-family:'Mangal'\"> that </span><span style=\"font-weight:bold;font-family:'Mangal'\">cannot always be removed</span><span style=\"font-family:'Mangal'\"> by washing or other means → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A pea plant with round seeds and violet flowers is crossed with a plant having wrinkled seeds and white flowers. All the progeny have round seeds, but about half of them have violet flowers and half have white flowers. The genetic make-up of the round-seeded, violet-flowered parent is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RrVV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RrVv</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">rrVv</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RRVv</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The wrinkled, white parent shows both recessive traits, so it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">rrvv</span><span style=\"font-family:'Mangal'\"> and gives only the gamete </span><span style=\"font-weight:bold;font-family:'Mangal'\">rv</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">All</span><span style=\"font-family:'Mangal'\"> progeny are round-seeded → every offspring received </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> from the first parent, so that parent must be </span><span style=\"font-weight:bold;font-family:'Mangal'\">RR</span><span style=\"font-family:'Mangal'\"> (if it were Rr, about half the progeny would be wrinkled).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Half</span><span style=\"font-family:'Mangal'\"> the progeny are violet and half white → the first parent gives V to half and v to half, so it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vv</span><span style=\"font-family:'Mangal'\"> (VV would make all progeny violet).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A single copy of the dominant factor is enough to show the trait, while both copies must be recessive to show the recessive trait.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the parent is RRVv </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the nervous system:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The connections of a reflex arc are made in the spinal cord, at the point where the input nerve and the output nerve first meet each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Inside the skull, the brain is contained in a fluid-filled balloon which provides shock absorption.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Reflex arcs stopped being useful once complex neuron networks (brains) came into existence in animals.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Nerves from all over the body meet in a bundle in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">spinal cord</span><span style=\"font-family:'Mangal'\"> on their way to the brain; reflex arc connections are made at the point where the </span><span style=\"font-weight:bold;font-family:'Mangal'\">input nerve and output nerve first meet</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The brain sits inside the bony skull, and within it the brain is contained in a </span><span style=\"font-weight:bold;font-family:'Mangal'\">fluid-filled balloon</span><span style=\"font-family:'Mangal'\"> which provides further </span><span style=\"font-weight:bold;font-family:'Mangal'\">shock absorption</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Even after complex neuron networks came into existence, reflex arcs </span><span style=\"font-weight:bold;font-family:'Mangal'\">continue to be more efficient</span><span style=\"font-family:'Mangal'\"> for quick responses (e.g. pulling the hand back from a flame) → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When we breathe in, the rib cage expands and the space inside the chest increases, so air moves into the lungs. Which structural feature of the rib cage makes this expansion possible?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The ribs are attached to the breast bone (sternum) in front by flexible cartilage</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The ribs are fused to the breast bone by fixed joints</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 12 pairs of ribs are attached only to the spine and are free in front</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The ribs are made of cartilage instead of bone</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Humans have </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 pairs of ribs</span><span style=\"font-family:'Mangal'\">, which together form the rib cage that protects the heart and lungs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The ribs are attached to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">spine at the back</span><span style=\"font-family:'Mangal'\"> and to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">breast bone (sternum) in the front</span><span style=\"font-family:'Mangal'\">, joined by </span><span style=\"font-weight:bold;font-family:'Mangal'\">flexible cartilage</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This flexibility of the rib–sternum cartilage allows the rib cage to </span><span style=\"font-weight:bold;font-family:'Mangal'\">expand and contract during breathing</span><span style=\"font-family:'Mangal'\">, increasing and decreasing the space in the chest so that air moves in and out of the lungs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If the ribs were fused by fixed joints, the rib cage could not expand; ribs are bones, not cartilage.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the flexible cartilage joining the ribs to the sternum makes the expansion possible </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): In human males, the testes are located outside the abdominal cavity, in the scrotum.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): The formation of sperms requires a temperature higher than the normal body temperature.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The formation of germ-cells (sperms) takes place in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">testes</span><span style=\"font-family:'Mangal'\">, which are located </span><span style=\"font-weight:bold;font-family:'Mangal'\">outside the abdominal cavity in the scrotum</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The testes are kept outside because sperm formation requires a </span><span style=\"font-weight:bold;font-family:'Mangal'\">lower</span><span style=\"font-family:'Mangal'\"> temperature than the normal body temperature, not a higher one → R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(The testes also secrete the hormone testosterone, which regulates sperm formation and brings about the changes seen in boys at puberty.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is true but R is false </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A tractor pulling a harrow alone with a force F gives it an acceleration of 6 m/s². The same tractor pulling a trolley alone with the same force F gives it an acceleration of 3 m/s². If the harrow is placed on the trolley and the tractor pulls the trolley with the same force F (ignoring friction), the acceleration will be:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 m/s²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 m/s²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 m/s²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m/s²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From Newton's second law, mass of the harrow m₁ = F/a₁ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/6</span><span style=\"font-family:'Mangal'\"> and mass of the trolley m₂ = F/a₂ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the harrow is placed on the trolley, the two move together as a </span><span style=\"font-weight:bold;font-family:'Mangal'\">single system</span><span style=\"font-family:'Mangal'\"> of mass m₁ + m₂ = F/6 + F/3 = F/6 + 2F/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Acceleration of the system a = F/(m₁ + m₂) = F ÷ (F/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Adding the accelerations would wrongly give 9 m/s²; the combined mass is larger, so the acceleration is smaller than either.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the acceleration is 2 m/s² </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about sound waves:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The amplitude of a sound wave is the maximum change in the density of air in a compression (or rarefaction) compared with the average density.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. As a sound wave travels away from a point source, its intensity increases because the wave gains energy from the medium.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. A microphone converts sound energy into electrical energy.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Sound propagates as density oscillations; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">amplitude</span><span style=\"font-family:'Mangal'\"> is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">maximum change in density</span><span style=\"font-family:'Mangal'\"> in a compression (or rarefaction) compared with the average density → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. As the wave travels away from the source, the same energy is </span><span style=\"font-weight:bold;font-family:'Mangal'\">spread over a larger area</span><span style=\"font-family:'Mangal'\">, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">intensity decreases</span><span style=\"font-family:'Mangal'\"> with distance; the wave does not gain energy from the medium → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In a </span><span style=\"font-weight:bold;font-family:'Mangal'\">microphone</span><span style=\"font-family:'Mangal'\">, sound waves make a thin diaphragm vibrate and these vibrations are converted into an </span><span style=\"font-weight:bold;font-family:'Mangal'\">electrical signal</span><span style=\"font-family:'Mangal'\">, that is, sound energy to electrical energy (a speaker does the opposite) → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The solubility (g per 100 g of water) of four salts was measured at 10°C and 80°C: potassium nitrate 21 and 167; sodium chloride 36 and 37; potassium chloride 35 and 54; ammonium chloride 24 and 66. If a saturated solution of each salt prepared at 80°C is cooled to 10°C, the salt from which the SMALLEST mass of crystals separates out is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sodium chloride</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Potassium nitrate</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ammonium chloride</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Potassium chloride</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On cooling a saturated solution, the mass of solid that separates out equals the </span><span style=\"font-weight:bold;font-family:'Mangal'\">difference in solubility</span><span style=\"font-family:'Mangal'\"> between the two temperatures (per 100 g of water).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Potassium nitrate: 167 − 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">146 g</span><span style=\"font-family:'Mangal'\">; ammonium chloride: 66 − 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 g</span><span style=\"font-family:'Mangal'\">; potassium chloride: 54 − 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sodium chloride: 37 − 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 g</span><span style=\"font-family:'Mangal'\">; its solubility hardly changes with temperature, so almost no crystals separate on cooling.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the smallest mass of crystals separates from sodium chloride </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Most of the refraction of the light rays entering the eye occurs at the outer surface of the cornea.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): The eye lens is composed of a fibrous, jelly-like material.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Light enters the eye through the cornea, the transparent bulge on the front of the eyeball; </span><span style=\"font-weight:bold;font-family:'Mangal'\">most of the refraction</span><span style=\"font-family:'Mangal'\"> of the entering light occurs at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">outer surface of the cornea</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">eye lens</span><span style=\"font-family:'Mangal'\"> is indeed composed of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">fibrous, jelly-like material</span><span style=\"font-family:'Mangal'\">, whose curvature can be modified by the ciliary muscles → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But the composition of the lens is not the reason why the cornea does most of the refracting; the crystalline lens merely provides the </span><span style=\"font-weight:bold;font-family:'Mangal'\">finer adjustment of focal length</span><span style=\"font-family:'Mangal'\"> needed to focus objects at different distances on the retina → R does not explain A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a healthy adult, the kidneys form about 180 litres of initial filtrate every day, yet only about 1–2 litres of urine are excreted. The reason for this large difference is that:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">most of the filtrate evaporates through the skin as sweat</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the urinary bladder stores the remaining filtrate for several days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">only 1–2 litres of blood pass through the kidneys each day</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">most of the filtrate (water along with glucose, amino acids and salts) is selectively re-absorbed as the urine flows along the kidney tubules</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The basic filtration unit of the kidney is a cluster of very thin-walled blood capillaries; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">initial filtrate</span><span style=\"font-family:'Mangal'\"> formed in a healthy adult is about </span><span style=\"font-weight:bold;font-family:'Mangal'\">180 litres daily</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">As the filtrate flows along the tubule, useful substances (</span><span style=\"font-weight:bold;font-family:'Mangal'\">glucose, amino acids, salts and a major amount of water</span><span style=\"font-family:'Mangal'\">) are </span><span style=\"font-weight:bold;font-family:'Mangal'\">selectively re-absorbed</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The amount of water re-absorbed depends on how much excess water there is in the body and how much dissolved waste has to be excreted.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because most of the filtrate is re-absorbed, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">urine actually excreted is only about a litre or two</span><span style=\"font-family:'Mangal'\"> a day.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the difference is due to selective re-absorption in the kidney tubules </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the least number which when divided by 5, 6, 3 and 4 leaves a remainder 2, but when divided by 7 leaves no remainder.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">147</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">198</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">182</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A number that leaves remainder 2 on division by 5, 6, 3 and 4 is of the form (LCM of 5, 6, 3, 4) × k + 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM (लघुत्तम समापवर्त्य) of 5, 6, 3, 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\">, so the number = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60k + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the values one by one for divisibility by 7:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 1: 62 = 7 × 8 + 6 → not divisible</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 2: 122 = 7 × 17 + 3 → not divisible</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 3: 182 = 7 × 26 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">divisible</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the least such number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">182 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mr. X borrowed an amount of ₹50,000 for 40 months. If he repaid ₹1,625 as monthly installment, then find the simple rate of interest.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.8%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total amount repaid = 1,625 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹65,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simple interest paid = 65,000 − 50,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time = 40 months = 40 ÷ 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10/3 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100 → 15,000 = [50,000 × R × (10/3)] / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15,000 = (500 × R × 10) ÷ 3 → 15,000 = 5,000R ÷ 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = (15,000 × 3) ÷ 5,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: R = (SI × 100) ÷ (P × T) = (15,000 × 100) ÷ [50,000 × (10/3)] = 9%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the rate of simple interest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">9% (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The lengths of the three sides of a triangle are 7 cm, 15 cm and 20 cm. Find the area (in cm²) of the incircle of this triangle. (Use π = 3.14)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.28</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.56</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Semi-perimeter s = (7 + 15 + 20) ÷ 2 = 42 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the triangle (Heron's formula) = √[s(s − a)(s − b)(s − c)] = √[21 × 14 × 6 × 1] = √1,764 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Radius of the incircle r = Area ÷ s = 42 ÷ 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the incircle = πr² = 3.14 × 2² = 3.14 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12.56 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: inradius r = Δ ÷ s, then incircle area = πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the incircle is </span><span style=\"font-weight:bold;font-family:'Mangal'\">12.56 cm² (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The distance between two towns P and Q is 300 km. A car starts from P towards Q at 7:00 am at a speed of 45 km/h. Another car starts from Q towards P at 9:00 am at a speed of 55 km/h. At what time will the two cars meet?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11:00 am</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11:10 am</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11:06 am</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11:30 am</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From 7:00 am to 9:00 am (2 hours) only the first car moves: distance covered = 45 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance still between the cars at 9:00 am = 300 − 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From 9:00 am both move towards each other: relative speed = 45 + 55 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time to meet = 210 ÷ 100 = 2.1 hours = 2 hours + 0.1 × 60 minutes = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 hours 6 minutes</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meeting time = 9:00 am + 2 h 6 min = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11:06 am</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the cars meet at </span><span style=\"font-weight:bold;font-family:'Mangal'\">11:06 am (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In an examination, a student who scored 32% of the maximum marks failed by 42 marks, while another student who scored 52% of the maximum marks passed by 38 marks. Find the maximum marks of the examination.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">450</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the maximum marks be M.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pass marks = 32% of M + 42 (first student fell short by 42)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pass marks = 52% of M − 38 (second student had 38 extra)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32% of M + 42 = 52% of M − 38</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52% of M − 32% of M = 42 + 38 → 20% of M = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M = (80 × 100) ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: pass marks = 32% of 400 + 42 = 128 + 42 = 170 = 52% of 400 − 38 = 208 − 38 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: maximum marks = (difference of marks) ÷ (difference of percentages) × 100 = 80 ÷ 20 × 100 = 400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the maximum marks are </span><span style=\"font-weight:bold;font-family:'Mangal'\">400 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A factory has two machines, X and Y. Machine X can produce 200 units in 5 hours, and machine Y can produce 180 units in 6 hours. If both machines work together for 3 hours and then only machine X works for 2 more hours, how many units are produced in total?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">350 units</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">310 units</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">290 units</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">280 units</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rate of machine X = 200 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 units per hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rate of machine Y = 180 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 units per hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both together for 3 hours = (40 + 30) × 3 = 70 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X alone for 2 more hours = 40 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total = 210 + 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">290 units</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total production is </span><span style=\"font-weight:bold;font-family:'Mangal'\">290 units (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": "Tुध ोॅधनोgध थधigुप यी ोिि पुध ौपहकधnपौ यी ो cिोौौ iौ 36.5 ाg. Tुध ोॅधनोgध थधigुप यी ोिि पुध ृयदौ in पुध cिोौौ iौ 40 ाg ोnक पुोप यी ोिि पुध giिनस iौ 32.3 ाg. Tुध नोपiय यी पुध nहंृधन यी ृयदौ पय पुध nहंृधन यी giिनस in पुध cिोौौ iौ:", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 : 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 : 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 6</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the number of boys be b and the number of girls be g.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total weight: 40b + 32.3g = 36.5(b + g)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40b − 36.5b = 36.5g − 32.3g → </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.5b = 4.2g</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">b/g = 4.2 ÷ 3.5 = 42/35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6/5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: with 6 boys and 5 girls, total = 240 + 161.5 = 401.5 kg → average = 401.5 ÷ 11 = 36.5 kg ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut (alligation): boys : girls = (36.5 − 32.3) : (40 − 36.5) = 4.2 : 3.5 = 6 : 5</span></p><p style=\"
