margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the ratio of boys to girls is </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 : 5 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The hypotenuse of a right-angled triangle is 34 cm and the difference between the other two sides is 14 cm. What is the area of the triangle?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">220 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">480 cm²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the perpendicular sides be a and b (a &gt; b). Then a − b = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> and, by Pythagoras, a² + b² = 34² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,156</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a − b)² = a² + b² − 2ab → 14² = 1,156 − 2ab</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">196 = 1,156 − 2ab → 2ab = 1,156 − 196 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ab = </span><span style=\"font-weight:bold;font-family:'Mangal'\">480</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area = ½ × a × b = ½ × 480 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: a = 30, b = 16 → 30 − 16 = 14 and 30² + 16² = 900 + 256 = 1,156 = 34² ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: area = (hypotenuse² − difference²) ÷ 4 = (1,156 − 196) ÷ 4 = 240 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the triangle is </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 cm² (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The population of a city is increased from 64,000 to 93,500 in a year. Calculate the percentage increase in the population (rounded off to two decimal places).</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46.64%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46.39%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46.09%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46.56%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increase in population = 93,500 − 64,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">29,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Percentage increase = (increase ÷ original) × 100% = 29,500 ÷ 64,000 × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">29,500 ÷ 64,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.4609375</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.4609375 × 100% = 46.09375% ≈ </span><span style=\"font-weight:bold;font-family:'Mangal'\">46.09%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: percentage increase = (new − old) ÷ old × 100% = 29,500 ÷ 640 = 46.09%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the percentage increase is </span><span style=\"font-weight:bold;font-family:'Mangal'\">46.09% (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of three prime numbers is 100. If one of these numbers exceeds another by 36, what is the product of the three numbers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,886</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,154</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,626</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,402</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of three odd numbers is always odd, but 100 is even, so one of the primes must be the only even prime, </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum of the other two primes = 100 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">98</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let them be p and q with p − q = 36 and p + q = 98.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Adding: 2p = 134 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = 67</span><span style=\"font-family:'Mangal'\">; then q = 98 − 67 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">31</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both 67 and 31 are prime ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product = 2 × 31 × 67 = 62 × 67 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,154</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the product is </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,154 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 15% of A is equal to 20% of B and 10% of B is equal to 25% of C, what is the ratio of A : B : C?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8:7:6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20:15:6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12:9:7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22:17:11</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15% of A = 20% of B → 15A = 20B → A/B = 20/15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/3</span><span style=\"font-family:'Mangal'\"> → A : B = 4 : 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10% of B = 25% of C → 10B = 25C → B/C = 25/10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5/2</span><span style=\"font-family:'Mangal'\"> → B : C = 5 : 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Make B equal in both ratios (LCM of 3 and 5 = 15):</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A : B = 4 : 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 : 15</span><span style=\"font-family:'Mangal'\">; B : C = 5 : 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 : 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A : B : C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 : 15 : 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 15% of 20 = 3 = 20% of 15 ✓; 10% of 15 = 1.5 = 25% of 6 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A : B : C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20:15:6 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 apples were bought at ₹1,240 per hundred and were sold at a profit of ₹935. Find the selling price (in ₹) per dozen of apples.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">266</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">271</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">256</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">261</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost price of 100 apples = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,240</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price of 100 apples = cost price + profit = 1,240 + 935 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,175</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price of 1 apple = 2,175 ÷ 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹21.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price of 1 dozen (12 apples) = 21.75 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹261</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the selling price per dozen is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹261 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The table shows the percentage distribution of the monthly expenditure of a family whose total monthly expenditure is ₹36,000.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789734729474_image001.png\" width=\"269\" height=\"30\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If this data is drawn as a pie chart, what is the central angle of the sector for Food, and by how much (in ₹) does the amount spent on Rent exceed the amount spent on Transport?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">90°, ₹5,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108°, ₹9,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120°, ₹3,600</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">108°, ₹5,400</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a pie chart, the central angle of a sector = (percentage ÷ 100) × 360°.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Central angle for Food = 30% of 360° = 30 ÷ 100 × 360° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">108°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rent − Transport = 25% − 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15%</span><span style=\"font-family:'Mangal'\"> of the total expenditure</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15% of ₹36,000 = (36,000 × 15) ÷ 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: Rent = ₹9,000, Transport = ₹3,600 → 9,000 − 3,600 = ₹5,400 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">108°, ₹5,400 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arrange the following in descending order: 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\">, 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">, 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\"> &gt; 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\"> &gt; 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> &gt; 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\"> &gt; 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> &gt; 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To compare powers, rewrite them with the same exponent. HCF (महत्तम समापवर्तक) of 60, 40 and 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\"> = (2³)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\"> = (3²)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With the same exponent 20, the larger the base, the larger the number: 9 &gt; 8 &gt; 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 9</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> &gt; 8</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\">, i.e. 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\"> &gt; 2</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the descending order is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">40</span><span style=\"font-weight:bold;font-family:'Mangal'\"> &gt; 2</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">60</span><span style=\"font-weight:bold;font-family:'Mangal'\"> &gt; 5</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-weight:bold;font-family:'Mangal'\"> (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mean of the following frequency distribution is 36. Find the value of x.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789734729474_image002.png\" width=\"269\" height=\"35\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">32</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Class marks (mid-values): 15, 25, 35, 45, 55</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σf = 5 + 8 + x + 10 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 + x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σfx = (5 × 15) + (8 × 25) + (x × 35) + (10 × 45) + (7 × 55) = 75 + 200 + 35x + 450 + 385 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,110 + 35x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mean = Σfx ÷ Σf → 36 = (1,110 + 35x) ÷ (30 + x)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36(30 + x) = 1,110 + 35x → 1,080 + 36x = 1,110 + 35x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36x − 35x = 1,110 − 1,080 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: Σf = 60, Σfx = 1,110 + 1,050 = 2,160 → 2,160 ÷ 60 = 36 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 2sin²θ + 5cos²θ = 4.25 and θ is an acute angle, then find the value of cot θ.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">√3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/√3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write 5cos²θ as 2cos²θ + 3cos²θ so that sin²θ + cos²θ = 1 can be used.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2sin²θ + 2cos²θ + 3cos²θ = 4.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2(sin²θ + cos²θ) + 3cos²θ = 4.25 → 2 + 3cos²θ = 4.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3cos²θ = 2.25 → cos²θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.75 = 3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cos θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3/2</span><span style=\"font-family:'Mangal'\"> (θ is acute, so cos θ is positive) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">θ = 30°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cot θ = cot 30° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, cot θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In triangle PQR, point S lies on side QR such that QS : SR = 2 : 5. If the area of triangle PQS is 60 cm², find the area of triangle PQR.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">210 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Triangles PQS and PQR have the same vertex P and their bases QS and QR lie on the same line QR, so they have the same height.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area is proportional to the base when the height is the same.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QS : QR = QS : (QS + SR) = 2 : (2 + 5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area(PQS) : Area(PQR) = 2 : 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area(PQR) = (60 × 7) ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of triangle PQR is </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 cm² (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A shopkeeper claims to sell sugar at a profit of 10%, but he uses a weight that is 12% less than the marked weight. What is his actual profit percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27.5%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the cost price of sugar be ₹100 per kg.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For each \"1 kg\" sold he charges 10% profit: selling price = ₹100 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹110</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But he actually gives only 1 kg × 88% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.88 kg</span><span style=\"font-family:'Mangal'\">, whose cost = ₹100 × 0.88 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹88</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Actual profit = 110 − 88 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹22</span><span style=\"font-family:'Mangal'\"> on a cost of ₹88</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Profit % = 22 ÷ 88 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: actual profit % = [(100 + claimed profit %) ÷ (100 − weight shortfall %) − 1] × 100% = (110 ÷ 88 − 1) × 100% = 25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, his actual profit is </span><span style=\"font-weight:bold;font-family:'Mangal'\">25% (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If a + b + c = 5, abc = −24 and a³ + b³ + c³ = 83, find the value of ab + bc + ca.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Identity: a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let ab + bc + ca = p. Then a² + b² + c² = (a + b + c)² − 2p = 25 − </span><span style=\"font-weight:bold;font-family:'Mangal'\">2p</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Left side: 83 − 3 × (−24) = 83 + 72 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">155</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right side: 5 × (25 − 2p − p) = 5 × (25 − 3p)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">155 = 5(25 − 3p) → 31 = 25 − 3p → 3p = −6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: a = 4, b = 3, c = −2 give sum 5, abc = −24, cubes 64 + 27 − 8 = 83 and ab + bc + ca = 12 − 6 − 8 = −2 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, ab + bc + ca = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ramesh is four times as old as his son, and his daughter is 2 years younger than his son. If the sum of the ages of the three 4 years ago was 64 years, what is Ramesh's present age?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 years</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the son's present age be x years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ramesh's present age = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4x</span><span style=\"font-family:'Mangal'\">; daughter's present age = </span><span style=\"font-weight:bold;font-family:'Mangal'\">x − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum of present ages = 4x + x + (x − 2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6x − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 years ago, each of the three was 4 years younger, so the sum was (6x − 2) − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6x − 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6x − 14 = 64 → 6x = 78 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ramesh's present age = 4 × 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 4 years ago the ages were 48, 9 and 7 → 48 + 9 + 7 = 64 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Ramesh's present age is </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 years (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 180 m long train running at 54 km/h crosses another 270 m long train running in the opposite direction in 10 seconds. How long will the second train take to cross a 390 m long platform?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 seconds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 seconds</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 seconds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 seconds</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance covered while the trains cross each other = 180 + 270 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">450 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Relative speed (opposite directions) = 450 ÷ 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Speed of the first train = 54 km/h = (54 × 5) ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Speed of the second train = 45 − 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To cross the platform, the second train covers 270 + 390 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">660 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time = 660 ÷ 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 seconds</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the second train takes </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 seconds (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A can complete a piece of work in 10 days and B can complete it in 15 days. They work together for 2 days, after which A leaves and B completes the remaining work alone. In how many days is the whole work completed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 days</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done by A in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span><span style=\"font-family:'Mangal'\">; by B in 1 day = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Together in 1 day = 1/10 + 1/15 = (3 + 2) ÷ 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work done together in 2 days = (2 × 1) ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remaining work = 1 − 1/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 ÷ 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B alone finishes 2 ÷ 3 of the work in (2 ÷ 3) ÷ (1/15) = 2 ÷ 3 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total time = 2 + 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the whole work is completed in </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 days (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Anil started a business with ₹40,000. After 4 months, Sunil joined him with some capital. At the end of the year, the profit was divided between Anil and Sunil in the ratio 5 : 4. What was Sunil's capital?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹48,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹52,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a partnership, profit is shared in the ratio of (capital × time).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Anil: ₹40,000 for 12 months → 40,000 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,80,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sunil: ₹x for 12 − 4 = 8 months → </span><span style=\"font-weight:bold;font-family:'Mangal'\">8x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,80,000 : 8x = 5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,80,000 × 4 = 5 × 8x → 19,20,000 = 40x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 19,20,000 ÷ 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 4,80,000 : 3,84,000 = 5 : 4 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Sunil's capital was </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Meena deposits ₹20,000 in a bank that pays interest at 8% per annum, compounded quarterly. What amount will she have in her account after 6 months?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,808</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹21,632</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,816</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compounded quarterly → rate per quarter = 8% ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2%</span><span style=\"font-family:'Mangal'\">, and 6 months = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 quarters</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount after the 1st quarter = ₹20,000 × 102% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20,400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Amount after the 2nd quarter = ₹20,400 × 102% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20,808</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: A = P × (1 + R/400)^(4T) = 20,000 × (1.02)² = 20,000 × 1.0404 = ₹20,808</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the amount after 6 months is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹20,808 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify the following. 112 ÷ [16 ÷ 8 × {18 + 12 − (3 + 10 − (4 + 7))}]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS: solve the innermost bracket first and work outwards.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(4 + 7) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3 + 10 − 11) = 13 − 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">{18 + 12 − 2} = 30 − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">[16 ÷ 8 × 28] = 2 × 28 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">56</span><span style=\"font-family:'Mangal'\"> (division and multiplication from left to right)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112 ÷ 56 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UX 4 is related to QT 12 in a certain way. In the same way, GJ 6 is related to CF 18. To which of the following is LO 8 related to following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IK 23</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HJ 24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IL 21</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HK 24</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UX 4 → QT 12: U − 4 = Q, X − 4 = T; 4 × 3 = 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJ 6 → CF 18: G − 4 = C, J − 4 = F; 6 × 3 = 18 → rule: each letter </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span><span style=\"font-family:'Mangal'\">, number </span><span style=\"font-weight:bold;font-family:'Mangal'\">× 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LO 8 → L − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\">, O − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">; 8 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24</span><span style=\"font-family:'Mangal'\"> → HK 24</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IK 23, HJ 24 and IL 21 do not come from LO 8 by this rule (I = L − 3, J = O − 5, 21 ≠ 24).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, LO 8 is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">HK 24 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": "Rधीधन पय पुध ीियियथing िधपपधन, nहंृधन ोnक ौदंृिय ौधनiधौ ोnक ोnौथधन पुध तहधौपiयn पुोप ीियियथौ. Cयहnपing पय ृध कयnध ीनयं िधीप पय नigुप यnिद. Aिि nहंृधनौ ोनध ौingिध-कigiप nहंृधनौ.(Lधीप) A 5 # B @ 3 M % 7 K 2 &ोंूे N $ 4 P + D 8 * 6 T ! 1 (Rigुप)Hयथ ंोnद ौहcु ौदंृियस ोनध पुधनध, धोcु यी थुicु iौ iंंधकiोपिधद ूनधcधकधक ृद ो िधपपधन ोnक ोिसय iंंधकiोपिधद ीियियथधक ृद ो nहंृधन?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Four</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Five</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check each symbol: the term before it must be a letter and the term after it must be a number.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">#: preceded by 5 (number) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">@: B </span><span style=\"font-weight:bold;font-family:'Mangal'\">@</span><span style=\"font-family:'Mangal'\"> 3 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">%: M </span><span style=\"font-weight:bold;font-family:'Mangal'\">%</span><span style=\"font-family:'Mangal'\"> 7 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">&amp;: preceded by 2 (number) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">$: N </span><span style=\"font-weight:bold;font-family:'Mangal'\">$</span><span style=\"font-family:'Mangal'\"> 4 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+: followed by D (letter) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">*: preceded by 8 (number) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">!: T </span><span style=\"font-weight:bold;font-family:'Mangal'\">!</span><span style=\"font-family:'Mangal'\"> 1 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, there are </span><span style=\"font-weight:bold;font-family:'Mangal'\">Four</span><span style=\"font-family:'Mangal'\"> such symbols </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘I’ stands for ‘+’ , ‘J’ stands for ‘×’, ‘K’ stands for ‘÷’, and ‘L’ stands for ‘-’ what will come in place of the question mark ‘?’ in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 J 5 I 40 K 8 L 10 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Replace the letters by the signs: 9 × 5 + 40 ÷ 8 − 10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS (÷ and × first): 9 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45</span><span style=\"font-family:'Mangal'\">; 40 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now 45 + 5 − 10 = 50 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B, C, D, E, F and G are sitting around a circular table, facing the centre. Only two people sit between B and A, when counted from the left of B. Only three people sit between D and C, when counted from the right of C. A sits to the immediate left of C. E sits second to the right of F. G is not an immediate neighbour of A. How many people sit between E and B, when counted from the left of E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Four</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Place C first. A sits to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">immediate left of C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three people between D and C counted from the right of C → D is fourth to the right of C, i.e. </span><span style=\"font-weight:bold;font-family:'Mangal'\">third to the left of C</span><span style=\"font-family:'Mangal'\"> (7 seats), so D is second to the left of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two people between B and A counted from the left of B → A is third to the left of B → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B is third to the right of A</span><span style=\"font-family:'Mangal'\">, i.e. second to the right of C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Going left from C we now have: C, A, (empty), D, (empty), B, (empty).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E sits second to the right of F → the two of them take two empty seats with exactly one seat between them: either F between D and B with E between A and D, or F between B and C with E between D and B.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G is not a neighbour of A → G cannot sit between A and D → G sits between B and C; hence </span><span style=\"font-weight:bold;font-family:'Mangal'\">F sits between D and B and E sits between A and D</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (going left from C): </span><span style=\"font-weight:bold;font-family:'Mangal'\">C – A – E – D – F – B – G</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Counting from the left of E: D, F and then B → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Two</span><span style=\"font-family:'Mangal'\"> people sit between E and B.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Two (Option B)</span><span style=\"font-family:'Mangal'\"> people sit between E and B.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DM - LK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KU - SR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QV - YT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR - PP</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare each letter of the second cluster with the corresponding letter of the first cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DM − LK: D + 8 = L, M − 2 = K → (+8, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KU − SR: K + 8 = S, U − 3 = R → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+8, −3</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QV − YT: Q + 8 = Y, V − 2 = T → (+8, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR − PP: H + 8 = P, R − 2 = P → (+8, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three pairs follow (+8, −2); only KU − SR does not.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">KU - SR (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Town B is to the west of Town X. Town C is to the east of Town X. Town D is to the south of Town C. Town C is to the west of Town A. What is the position of Town X with respect to Town A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">South</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">North</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">East</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">West</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Place the towns on an east–west line (west on the left, east on the right).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Town C is to the east of Town X → order: </span><span style=\"font-weight:bold;font-family:'Mangal'\">X … C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Town C is to the west of Town A → order: </span><span style=\"font-weight:bold;font-family:'Mangal'\">X … C … A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Town B is to the west of X and Town D is to the south of C; they do not change the X–A line.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So X lies to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">west</span><span style=\"font-family:'Mangal'\"> of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Town X is to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">West (Option D)</span><span style=\"font-family:'Mangal'\"> of Town A.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B means that ‘A is the sister of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B means that ‘A is the son of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B means that ‘A is the wife of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B means that ‘A is the father of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘P + Q – R × S – T’, then how is P related to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Son's daughter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daughter's daughter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Son's wife</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daughter</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A is the sister of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B → A is the son of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A is the wife of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A is the father of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the expression: P + Q – R × S – T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P is the sister of Q. P and Q are siblings, so they have the same parents.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q – R → Q is the son of R. So P is a daughter of R.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R × S → R is the wife of S. R and S are husband and wife, so P is the daughter of S as well.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S – T → S is the son of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, P is the daughter of S and S is the son of T → P is </span><span style=\"font-weight:bold;font-family:'Mangal'\">T's son's daughter (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": "Rधोक पुध giॅधn ौपोपधंधnप(ौ) ोnक cयncिहौiयnौ cोनधीिहिद. Aौौहंing पुोप पुध inीयनंोपiयn giॅधn in पुध ौपोपधंधnपौ iौ पनहध, धॅधn iी iप ोूूधोनौ पय ृध ोप ॅोनiोncध थiपु cयंंयnिद ाnयथn ीोcपौ, कधciकध थुicु यी पुध giॅधn cयncिहौiयnौ ियgicोििद ीियियथ(ौ) ीनयं पुध ौपोपधंधnप(ौ).Sपोपधंधnपौ: Aिि ोूूिधौ ोनध ंोngयौ. Aिि ंोngयौ ोनध ृोििस. Nय ृोिि iौ ो cोप.Cयncिहौiयnौ:(I): Nय ोूूिध iौ ो cोप.(II): Sयंध ृोििस ोनध ोूूिधौ.", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both conclusions (I) and (II) follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Neither conclusion (I) nor (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (II) follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (I) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Draw the diagram: the circle of apples lies inside mangos, mangos lies inside balls, and the circle of cats is completely outside balls.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (I): No apple is a cat → every apple is inside balls and no ball is a cat, so no apple can be a cat → </span><span style=\"font-weight:bold;font-family:'Mangal'\">follows</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (II): Some balls are apples → all apples are balls (through mangos), so the apples are balls that are apples → </span><span style=\"font-weight:bold;font-family:'Mangal'\">follows</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both conclusions (I) and (II) follow </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WZC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKM</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare the consecutive letters of each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGJ: D + 3 = G, G + 3 = J → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPS: M + 3 = P, P + 3 = S → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WZC: W + 3 = Z, Z + 3 = C (26 + 3 = 29 → 3 = C) → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKM: H + 3 = K, K + 2 = M → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three clusters follow (+3, +3); only HKM does not.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">HKM (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD is related to UNDC in a certain way based on the English alphabetical order. In the same way, FARM is related to IZUL. To which of the following options is LAMP related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OZPO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OYPO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OZQO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NZPO</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD → UNDC: R + 3 = U, O − 1 = N, A + 3 = D, D − 1 = C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FARM → IZUL: F + 3 = I, A − 1 = Z (1 − 1 = 0 → 26 = Z), R + 3 = U, M − 1 = L → rule: (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, −1, +3, −1</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LAMP → L + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, A − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">, M + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OYPO, OZQO and NZPO each differ from OZPO in one letter, so they do not follow the rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, LAMP is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">OZPO (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a code language, 'MILK' is coded as PKOM and 'ROAD' is coded as UQDF. How will 'TEXT' be coded in the same language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGZV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGAV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VGAV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WFAV</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILK → PKOM: M + 3 = P, I + 2 = K, L + 3 = O, K + 2 = M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD → UQDF: R + 3 = U, O + 2 = Q, A + 3 = D, D + 2 = F → rule: (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, +2, +3, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TEXT → T + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">, E + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, X + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (24 + 3 = 27 → 1 = A), T + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGZV, VGAV and WFAV each differ from WGAV in one letter, so they do not follow the rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, ‘TEXT’ is coded as </span><span style=\"font-weight:bold;font-family:'Mangal'\">WGAV (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Refer to the following letter, number and symbol series and answer the question that follows. All numbers are single-digit numbers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Left) K 4 @ M 7 B $ 2 P &amp; 9 W # E 3 Z % 6 R + 1 Q (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If all the symbols are dropped from the series, which of the following will be seventh from the right?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Z</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Drop the symbols (@, $, &amp;, #, %, +); the remaining series is:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K 4 M 7 B 2 P 9 W E 3 Z 6 R 1 Q (</span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span><span style=\"font-family:'Mangal'\"> terms)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seventh from the right = (16 − 7 + 1) = 10th from the left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Counting from the left: K(1) 4(2) M(3) 7(4) B(5) 2(6) P(7) 9(8) W(9) </span><span style=\"font-weight:bold;font-family:'Mangal'\">E(10)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the seventh element from the right is </span><span style=\"font-weight:bold;font-family:'Mangal'\">E (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The position(s) of how many letters will remain unchanged if each letter in the word PLANET is arranged in the English alphabetical order?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span st
