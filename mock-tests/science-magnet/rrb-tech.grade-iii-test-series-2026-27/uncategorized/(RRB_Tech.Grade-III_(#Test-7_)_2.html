"solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the 1 km race: when A runs 1,000 m, B runs 1,000 − 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">950 m</span><span style=\"font-family:'Mangal'\"> → B : A = 950 : 1,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 : 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the 800 m race: when B runs 800 m, C runs 800 − 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">760 m</span><span style=\"font-family:'Mangal'\"> → C : B = 760 : 800 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 : 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a 200 m race, when A runs 200 m: B runs (200 × 19) ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">190 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the same time, C runs (190 × 19) ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">180.5 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A beats C by 200 − 180.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19.5 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: C's distance = 200 × (19/20)²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (200 × 361) ÷ 400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 180.5 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A beats C by </span><span style=\"font-weight:bold;font-family:'Mangal'\">19.5 m (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": "A ौcुयिय थोnपौ पय कiौपनiृहपध 60 ूधnciिस ोnक 75 धनोौधनौ पय ौपहकधnपौ, ौहcु पुोप ोिि यी पुधं gधप ोn धतहोि nहंृधन यी ूधnciिस ोnक ोn धतहोि nहंृधन यी धनोौधनौ थiपु nय iपधंौ िधीप यॅधन. Wुोप iौ पुध ंोसiंहं nहंृधन यी ौपहकधnपौ थुय cोn नधcधiॅध पुiौ giीप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each student gets the same number of pencils and the same number of erasers with nothing left over, so the number of students must divide both 60 and 75 exactly.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The maximum such number = HCF (महत्तम समापवर्तक) of 60 and 75.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 = 2² × 3 × 5 and 75 = 3 × 5²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HCF = 3 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 60 ÷ 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 pencils</span><span style=\"font-family:'Mangal'\"> each and 75 ÷ 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 erasers</span><span style=\"font-family:'Mangal'\"> each, nothing left over ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the maximum number of students is </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 machines can pack 5,400 boxes in 9 hours. How many machines are needed to pack 12,000 boxes in 10 hours at the same rate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Boxes packed by 6 machines in 1 hour = 5,400 ÷ 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Boxes packed by 1 machine in 1 hour = 600 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Boxes to be packed per hour now = 12,000 ÷ 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Machines needed = 1,200 ÷ 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut (chain rule): (M₁ × H₁) / W₁ = (M₂ × H₂) / W₂ → (6 × 9) ÷ 5,400 = (M₂ × 10) ÷ 12,000 → M₂ = 6 × 9 × 12,000 ÷ (5,400 × 10) = 12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 (Option C)</span><span style=\"font-family:'Mangal'\"> machines are needed.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The internal surface area (in m²) of an open cuboidal tank whose internal length, internal breadth and internal height are given as 3 m, 11 m, and 9 m, respectively, is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">295</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">285</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">303</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">314</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An open tank has no top, so its internal surface = base + 4 side walls.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Base area = l × b = 3 × 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">33 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two walls of size l × h = 2 × 3 × 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two walls of size b × h = 2 × 11 × 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">198 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total internal surface area = 33 + 54 + 198 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">285 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: open-box surface area = lb + 2h(l + b)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 × 11) + 2 × 9 × (3 + 11)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 33 + 252</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">285 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the internal surface area is </span><span style=\"font-weight:bold;font-family:'Mangal'\">285 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sum of money doubles itself in 5 years when invested at compound interest, compounded annually. In how many years will the same sum become 16 times itself at the same rate of interest?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 years</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the sum be P and the rate be R% per annum. Under compound interest the sum is multiplied by the same factor in every equal period.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 5 years: P × (1 + R/100)⁵ = 2P → (1 + R/100)⁵ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 = 2 × 2 × 2 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2⁴</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the sum must double </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 times</span><span style=\"font-family:'Mangal'\"> in succession: 5 years for each doubling.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time = 4 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 years</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: (1 + R/100)</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">20</span><span style=\"font-family:'Mangal'\"> = [(1 + R/100)⁵]⁴ = 2⁴ = 16 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: if a sum becomes k times in t years at CI, it becomes kⁿ times in n × t years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sum becomes 16 times in </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 years (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the smallest 5-digit number which is exactly divisible by 16, 24 and 36.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,080</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,008</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10,224</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9,936</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A number divisible by 16, 24 and 36 must be a multiple of their LCM (लघुत्तम समापवर्त्य).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 = 2⁴, 24 = 2³ × 3, 36 = 2² × 3²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LCM = 2⁴ × 3² = 16 × 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The smallest 5-digit number is 10,000. Divide it by 144: 144 × 69 = 9,936, so 10,000 = 144 × 69 + </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Remainder is 64, so add (144 − 64) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span><span style=\"font-family:'Mangal'\"> to reach the next multiple of 144.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required number = 10,000 + 80 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,080</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 10,080 ÷ 144 = 70 ✓ (9,936 is a multiple of 144 but has only 4 digits)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: required number = 10,000 + (LCM − remainder when 10,000 is divided by LCM)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the smallest such 5-digit number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,080 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Simplify: 0.96 ÷ 0.16 + 2.75 − 1.875 × 2</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS: division and multiplication first, then addition and subtraction from left to right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.96 ÷ 0.16 = 96 ÷ 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.875 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Expression = 6 + 2.75 − 3.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 + 2.75 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8.75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.75 − 3.75 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sum of the squares of two consecutive odd natural numbers is 2050. The sum of the two numbers is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the two consecutive odd natural numbers be n and n + 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n² + (n + 2)² = 2050</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n² + n² + 4n + 4 = 2050 → 2n² + 4n − 2046 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Divide by 2: </span><span style=\"font-weight:bold;font-family:'Mangal'\">n² + 2n − 1023 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Factorise: 1023 = 33 × 31 and 33 − 31 = 2, so (n + 33)(n − 31) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n = 31 (n is a natural number, so n = −33 is rejected)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The numbers are </span><span style=\"font-weight:bold;font-family:'Mangal'\">31 and 33</span><span style=\"font-family:'Mangal'\">; check: 31² + 33² = 961 + 1,089 = 2,050 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 31 + 33 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sum of the two numbers is </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Veer can prepare one wooden table in 2 days, and Manoj can prepare the same table in 4 days. If they work together, in how many days will they prepare 111 tables?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">152</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">148</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">144</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Veer's 1 day work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 ÷ 2 table</span><span style=\"font-family:'Mangal'\">; Manoj's 1 day work = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/4 table</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Together in 1 day = 1 ÷ 2 + 1/4 = (2 + 1) ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/4 table</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time for 1 table together = 1 ÷ (3/4) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4/3 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time for 111 tables = (111 × 4) ÷ 3 = 37 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">148 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: in 148 days they make (148 × 3) ÷ 4 = 111 tables ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, they will prepare 111 tables in </span><span style=\"font-weight:bold;font-family:'Mangal'\">148 days (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The value of (1 + sec 15° + cot 75°)(1 − cosec 15° + tan 75°) is equal to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Use complementary angles: cot 75° = cot (90° − 15°) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">tan 15°</span><span style=\"font-family:'Mangal'\"> and tan 75° = tan (90° − 15°) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">cot 15°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Expression = (1 + sec 15° + tan 15°)(1 − cosec 15° + cot 15°)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write in terms of sin and cos (let θ = 15°): first bracket = (cos θ + 1 + sin θ) ÷ cos θ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second bracket = (sin θ − 1 + cos θ) ÷ sin θ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product = [(sin θ + cos θ) + 1][(sin θ + cos θ) − 1] ÷ (sin θ cos θ) = [(sin θ + cos θ)² − 1] ÷ (sin θ cos θ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(sin θ + cos θ)² = sin²θ + cos²θ + 2 sin θ cos θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 + 2 sin θ cos θ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product = (1 + 2 sin θ cos θ − 1) ÷ (sin θ cos θ) = 2 sin θ cos θ ÷ (sin θ cos θ) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If x = 3⁴ × 3³ and y = 3⁵, then the value of x ÷ y² is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Use the laws of indices: aᵐ × aⁿ = aᵐ</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">+n</span><span style=\"font-family:'Mangal'\">, (aᵐ)ⁿ = aᵐⁿ and aᵐ ÷ aⁿ = aᵐ</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−n</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 3⁴ × 3³ = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">4+3</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3⁷</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">y² = (3⁵)² = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x ÷ y² = 3⁷ ÷ 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\"> = 3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">7−10</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−3</span><span style=\"font-family:'Mangal'\"> = 1/3³ = 1/27 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/27</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, x ÷ y² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/27 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Priya invested ₹5,000 at 10% per annum compound interest, compounded annually. If she received an amount of ₹6,655 after n years, find the value of n.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At 10% per annum compounded annually, the amount grows by × 110% every year.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 1 year: ₹5,000 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹5,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 2 years: ₹5,500 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,050</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After 3 years: ₹6,050 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,655</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the amount ₹6,655 is reached after </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 years</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: A = P(1 + R/100)ⁿ → 6,655 ÷ 5,000 = 1.331 = (1.1)³ → n = 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of n is </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A library has an average number of 612 visitors on Sundays and 240 on other days. The average number of visitors per day in a month of 30 days beginning with a Sunday is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">310</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">298</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">302</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">315</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The month begins with a Sunday, so the Sundays fall on days 1, 8, 15, 22 and 29 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 Sundays</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Other days = 30 − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 days</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total visitors on Sundays = 5 × 612 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3,060</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total visitors on other days = 25 × 240 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total visitors in the month = 3,060 + 6,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9,060</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average per day = 9,060 ÷ 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">302</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the average number of visitors per day is </span><span style=\"font-weight:bold;font-family:'Mangal'\">302 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An article is sold at a profit of 20%. If the selling price had been increased by ₹100, the profit percentage would have doubled. What was the cost price of the article?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹250</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹400</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the cost price be ₹C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Selling price at 20% profit = C × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.2C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Doubled profit = 40%, so the new selling price = C × 140% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.4C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The new selling price is ₹100 more: 1.4C − 1.2C = 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.2C = 100 → C = 100 ÷ 0.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: SP at 20% = ₹600; SP + 100 = ₹700 = 40% profit on ₹500 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: the extra ₹100 equals the extra 20% of the cost price, so CP = (100 × 100) ÷ 20 = ₹500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the cost price of the article was </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹500 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Exercise Dharma Guardian 2026, the 7th edition of a joint military exercise, commenced on 24 February 2026 at the Foreign Training Node, Chaubattia (Uttarakhand). It is held between India and which country?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Australia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Japan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">France</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">United States of America</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Dharma Guardian</span><span style=\"font-family:'Mangal'\"> is the annual joint military exercise between the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indian Army</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Japan Ground Self-Defense Force (JGSDF)</span><span style=\"font-family:'Mangal'\">, held alternately in India and Japan.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">7th edition</span><span style=\"font-family:'Mangal'\"> began on </span><span style=\"font-weight:bold;font-family:'Mangal'\">24 February 2026</span><span style=\"font-family:'Mangal'\"> at the Foreign Training Node, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chaubattia, Uttarakhand</span><span style=\"font-family:'Mangal'\">, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 personnel</span><span style=\"font-family:'Mangal'\"> from each side: the Indian contingent from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ladakh Scouts</span><span style=\"font-family:'Mangal'\">, the Japanese troops from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">32nd Infantry Regiment</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its aim was to practise </span><span style=\"font-weight:bold;font-family:'Mangal'\">joint operations in a semi-urban environment</span><span style=\"font-family:'Mangal'\"> (counter-terrorism drills such as cordon-and-search and heliborne operations).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India's exercise with </span><span style=\"font-weight:bold;font-family:'Mangal'\">Australia</span><span style=\"font-family:'Mangal'\"> is </span><span style=\"font-weight:bold;font-family:'Mangal'\">AUSTRAHIND</span><span style=\"font-family:'Mangal'\">, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">France</span><span style=\"font-family:'Mangal'\"> it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Shakti</span><span style=\"font-family:'Mangal'\">, and with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">USA</span><span style=\"font-family:'Mangal'\"> it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yudh Abhyas</span><span style=\"font-family:'Mangal'\"> (22nd edition, September 2026).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the partner country is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Japan (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following Acts in India specifically deals with controlling air pollution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act, 1981</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act, 1988</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act, 1984</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act, 1990</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act</span><span style=\"font-family:'Mangal'\"> was enacted by Parliament in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1981</span><span style=\"font-family:'Mangal'\">, after India took part in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">United Nations Conference on the Human Environment, Stockholm (1972)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It gives the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Central Pollution Control Board (CPCB)</span><span style=\"font-family:'Mangal'\"> and State Boards the power to control air pollution; the CPCB itself had been set up under the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Water (Prevention and Control of Pollution) Act, 1974</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Environment (Protection) Act</span><span style=\"font-family:'Mangal'\"> came later, in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1986</span><span style=\"font-family:'Mangal'\">; 1988, 1984 and 1990 are not the year of the Air Act.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct Act is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Air (Prevention and Control of Pollution) Act, 1981 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 12th International Day of Yoga (21 June 2026), whose main national event was led by the Prime Minister at Kolkata, was observed with which theme?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yoga for One Earth, One Health</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yoga for Self and Society</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yoga for Healthy Ageing</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yoga for Vasudhaiva Kutumbakam</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">International Day of Yoga 2026</span><span style=\"font-family:'Mangal'\"> (21 June, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">12th</span><span style=\"font-family:'Mangal'\"> edition since 2015) had the theme </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Yoga for Healthy Ageing\"</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The main national event was led by PM </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Red Road, Kolkata</span><span style=\"font-family:'Mangal'\"> (West Bengal); over </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 Indian missions abroad</span><span style=\"font-family:'Mangal'\"> held programmes at about </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,500 locations</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 iconic and heritage sites</span><span style=\"font-family:'Mangal'\"> in India hosted events.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">\"Yoga for One Earth, One Health\"</span><span style=\"font-family:'Mangal'\"> was the theme of </span><span style=\"font-weight:bold;font-family:'Mangal'\">2025</span><span style=\"font-family:'Mangal'\"> (main event at Visakhapatnam), </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Yoga for Self and Society\"</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">2024</span><span style=\"font-family:'Mangal'\"> (Srinagar) and </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Yoga for Vasudhaiva Kutumbakam\"</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">2023</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the 2026 theme is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Yoga for Healthy Ageing (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Noida International Airport at Jewar, whose Phase I was inaugurated by the Prime Minister on 28 March 2026 and where commercial flights began on 15 June 2026, is located in which district of Uttar Pradesh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gautam Buddh Nagar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ghaziabad</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bulandshahr</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aligarh</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Noida International Airport</span><span style=\"font-family:'Mangal'\"> is at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jewar</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gautam Buddh Nagar</span><span style=\"font-family:'Mangal'\"> district of Uttar Pradesh, in the National Capital Region.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PM </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> inaugurated </span><span style=\"font-weight:bold;font-family:'Mangal'\">Phase I</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">28 March 2026</span><span style=\"font-family:'Mangal'\">; the phase has </span><span style=\"font-weight:bold;font-family:'Mangal'\">one runway</span><span style=\"font-family:'Mangal'\"> and a terminal for </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.2 crore (12 million) passengers a year</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Commercial flight operations began on 15 June 2026</span><span style=\"font-family:'Mangal'\"> with an </span><span style=\"font-weight:bold;font-family:'Mangal'\">IndiGo</span><span style=\"font-family:'Mangal'\"> flight arriving </span><span style=\"font-weight:bold;font-family:'Mangal'\">from Lucknow</span><span style=\"font-family:'Mangal'\">. Later the same day, about </span><span style=\"font-weight:bold;font-family:'Mangal'\">170 farmers</span><span style=\"font-family:'Mangal'\"> who had given land for the project flew on an inaugural flight to Lucknow; Civil Aviation Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">K. Rammohan Naidu</span><span style=\"font-family:'Mangal'\"> attended.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ghaziabad</span><span style=\"font-family:'Mangal'\"> has the Hindon civil enclave; Bulandshahr and Aligarh are neighbouring districts, not the airport's location.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the district is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gautam Buddh Nagar (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who won the men's singles title at the BWF World Championships 2026, held at the Indira Gandhi Indoor Stadium, New Delhi, in August 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kodai Naraoka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Alex Lanier</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kunlavut Vitidsarn</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shi Yuqi</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">BWF World Championships 2026</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Indira Gandhi Indoor Stadium, New Delhi</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">17–23 August 2026</span><span style=\"font-family:'Mangal'\">, the first World Championships in India since </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hyderabad 2009</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Men's singles final → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Alex Lanier</span><span style=\"font-family:'Mangal'\"> (France) beat </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kodai Naraoka</span><span style=\"font-family:'Mangal'\"> (Japan) </span><span style=\"font-weight:bold;font-family:'Mangal'\">21-11, 21-11</span><span style=\"font-family:'Mangal'\">, becoming the </span><span style=\"font-weight:bold;font-family:'Mangal'\">first Frenchman</span><span style=\"font-family:'Mangal'\"> to win the men's singles world title.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Women's singles → </span><span style=\"font-weight:bold;font-family:'Mangal'\">An Se Young</span><span style=\"font-family:'Mangal'\"> (Korea) beat Akane Yamaguchi (Japan) 21-17, 21-14; mixed doubles → Thom Gicquel/Delphine Delrue (France).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India's </span><span style=\"font-weight:bold;font-family:'Mangal'\">Treesa Jolly and Gayatri Gopichand</span><span style=\"font-family:'Mangal'\"> won </span><span style=\"font-weight:bold;font-family:'Mangal'\">bronze</span><span style=\"font-family:'Mangal'\"> in women's doubles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Kunlavut Vitidsarn (Thailand) and Shi Yuqi (China) were not in the 2026 men's singles final.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the men's singles champion is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Alex Lanier (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Prarthana Samaj, a socio-religious reform movement started in Bombay in 1867, was founded by which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Keshab Chandra Sen</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jyotirao Phule</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Atmaram Pandurang</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dayanand Saraswati</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Prarthana Samaj</span><span style=\"font-family:'Mangal'\"> was founded in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bombay</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1867</span><span style=\"font-family:'Mangal'\"> by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dr Atmaram Pandurang</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">M.G. Ranade</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">R.G. Bhandarkar</span><span style=\"font-family:'Mangal'\"> were its most prominent members.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It worked for widow remarriage, women's education and against caste restrictions, in the spirit of the Brahmo Samaj.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Keshab Chandra Sen</span><span style=\"font-family:'Mangal'\"> led the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brahmo Samaj</span><span style=\"font-family:'Mangal'\"> (and founded the Brahmo Samaj of India in 1866); his visit to Bombay inspired the Prarthana Samaj.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Jyotirao Phule</span><span style=\"font-family:'Mangal'\"> founded the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Satyashodhak Samaj</span><span style=\"font-family:'Mangal'\"> (Pune, 1873); </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dayanand Saraswati</span><span style=\"font-family:'Mangal'\"> founded the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Arya Samaj</span><span style=\"font-family:'Mangal'\"> (Bombay, 1875).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the founder is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Atmaram Pandurang (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who among the following is NOT part of the Trinity of Carnatic Music?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Tyagaraja</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Muthuswami Dikshitar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shyama Shastri</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Swathi Thirunal</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Trinity of Carnatic Music</span><span style=\"font-family:'Mangal'\"> consists of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tyagaraja</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Muthuswami Dikshitar</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Shyama Shastri</span><span style=\"font-family:'Mangal'\">; all three were born in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Thiruvarur</span><span style=\"font-family:'Mangal'\"> (Tamil Nadu) in the 18th century.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Swathi Thirunal</span><span style=\"font-family:'Mangal'\"> Rama Varma was the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Maharaja of Travancore</span><span style=\"font-family:'Mangal'\"> (reigned 1829–1846) and a noted composer, but he is </span><span style=\"font-weight:bold;font-family:'Mangal'\">not</span><span style=\"font-family:'Mangal'\"> one of the Trinity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the person who is NOT part of the Trinity is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Swathi Thirunal (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On 2 November 2025, ISRO launched CMS-03, the heaviest communication satellite ever sent to a Geosynchronous Transfer Orbit from Indian soil. Which launch vehicle was used?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LVM3-M5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GSLV-F16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PSLV-C61</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SSLV-D3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">CMS-03</span><span style=\"font-family:'Mangal'\">, a multi-band communication satellite of about </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,400 kg</span><
