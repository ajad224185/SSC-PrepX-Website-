 style=\"font-family:'Mangal'\">The organisms living in these hot springs are mostly </span><span style=\"font-weight:bold;font-family:'Mangal'\">heat-loving bacteria called thermophiles</span><span style=\"font-family:'Mangal'\">, not cold-loving algae.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So these springs are natural laboratories for studying how the first cells may have formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the springs resemble early-Earth conditions and host thermophiles </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "A ौपहकधnप cोn cिधोिनद ौधध यniयn ूधिध cिधिस ोnक पुधiन nहcिधi थiपु पुध ौcुयिय िigुप ंicनयौcयूध, ृहप थोnपौ पय यृौधनॅध पुध नiृयौयंधौ ोnक ो ॅiनहौ पुोप iौ ोपपोcाing पुध cिधिस. Wुicु यी पुध ीियियथing iौ cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A 40X objective lens on the same light microscope will show the ribosomes and the virus clearly</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electron microscope is needed, because it uses a beam of electrons and can show structures at the nanometre scale</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A hand lens is sufficient, since the limit of resolution of the eye is 0.1 mm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Neither can be seen, because ribosomes and viruses are non-living and do not scatter light</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Most plant and animal cells, the nucleus and most bacteria fall in the size range that can be seen with a </span><span style=\"font-weight:bold;font-family:'Mangal'\">light microscope</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ribosomes, viruses, mitochondria and the smallest bacteria</span><span style=\"font-family:'Mangal'\"> are so small that they need an </span><span style=\"font-weight:bold;font-family:'Mangal'\">electron microscope</span><span style=\"font-family:'Mangal'\"> to be seen.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electron microscope uses a </span><span style=\"font-weight:bold;font-family:'Mangal'\">beam of electrons instead of light</span><span style=\"font-family:'Mangal'\"> and lets scientists see cell structure at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">nanometre scale</span><span style=\"font-family:'Mangal'\"> (1 nm = one-billionth of a metre) with remarkable clarity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Changing the objective lens of a light microscope or using a hand lens does not give this resolution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, an electron microscope is needed </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which statement best describes the application of the Right Hand Thumb Rule to a straight current-carrying conductor?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Thumb points in current direction, fingers curl in magnetic field direction</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fingers point in current direction, thumb curls in magnetic field direction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Thumb points in magnetic field direction, fingers curl in current direction</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Left hand is used for current, right for magnetic field</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Right-hand thumb rule:</span><span style=\"font-family:'Mangal'\"> hold the current-carrying straight conductor in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">right hand</span><span style=\"font-family:'Mangal'\"> so that the </span><span style=\"font-weight:bold;font-family:'Mangal'\">thumb points in the direction of the current</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Then the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fingers wrapped around the conductor</span><span style=\"font-family:'Mangal'\"> give the </span><span style=\"font-weight:bold;font-family:'Mangal'\">direction of the magnetic field lines</span><span style=\"font-family:'Mangal'\">, which are concentric circles around the wire.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Options B and C reverse the roles of the thumb and the fingers, and the rule uses only the right hand.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This rule is also called </span><span style=\"font-weight:bold;font-family:'Mangal'\">Maxwell's corkscrew rule</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the thumb points along the current and the fingers curl along the field </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Separate aqueous solutions of four salts (sodium chloride, ammonium chloride, potassium nitrate and sodium carbonate) are tested with red litmus paper. The solution that turns red litmus blue is that of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sodium chloride</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ammonium chloride</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">potassium nitrate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">sodium carbonate</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A salt solution that turns </span><span style=\"font-weight:bold;font-family:'Mangal'\">red litmus blue</span><span style=\"font-family:'Mangal'\"> is </span><span style=\"font-weight:bold;font-family:'Mangal'\">basic</span><span style=\"font-family:'Mangal'\"> (pH more than 7); the nature of a salt solution depends on the strength of the acid and base from which the salt is formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Sodium chloride</span><span style=\"font-family:'Mangal'\"> (NaOH + HCl) and </span><span style=\"font-weight:bold;font-family:'Mangal'\">potassium nitrate</span><span style=\"font-family:'Mangal'\"> (KOH + HNO₃) are salts of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">strong acid and a strong base</span><span style=\"font-family:'Mangal'\">: neutral, pH 7; no change in litmus.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ammonium chloride</span><span style=\"font-family:'Mangal'\"> (NH₄OH + HCl) is a salt of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">strong acid and a weak base</span><span style=\"font-family:'Mangal'\">: acidic, pH less than 7; it would turn blue litmus red, not red litmus blue.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Sodium carbonate</span><span style=\"font-family:'Mangal'\"> (NaOH + H₂CO₃) is a salt of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">strong base and a weak acid</span><span style=\"font-family:'Mangal'\">: basic, pH more than 7; it turns red litmus blue.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the solution is sodium carbonate </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the electrolytic refining of copper:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The impure copper is made the anode and a thin strip of pure copper is made the cathode.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Acidified copper sulphate solution is used as the electrolyte.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The insoluble impurities settle below the cathode as cathode mud.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. In electrolytic refining, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">impure metal is made the anode</span><span style=\"font-family:'Mangal'\"> and a </span><span style=\"font-weight:bold;font-family:'Mangal'\">thin strip of pure metal is made the cathode</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A solution of the metal salt is used as the electrolyte: for copper, </span><span style=\"font-weight:bold;font-family:'Mangal'\">acidified copper sulphate solution</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. On passing current, pure copper from the anode dissolves into the electrolyte and an equal amount of pure copper is deposited on the cathode; soluble impurities go into the solution, while </span><span style=\"font-weight:bold;font-family:'Mangal'\">insoluble impurities settle at the bottom of the anode as anode mud</span><span style=\"font-family:'Mangal'\">, not cathode mud → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Keeling curve shows the atmospheric CO₂ concentration rising from about 315 ppm in 1960 to about 420 ppm in 2025, but the line is not smooth; it has a regular sawtooth (zig-zag) pattern every year. The sawtooth pattern is due to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">monthly changes in the amount of fossil fuel burnt by industries</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">seasonal dips caused by yearly plant growth in the Northern Hemisphere absorbing CO₂</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">volcanic eruptions that release CO₂ once every year</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the oceans absorbing CO₂ only in winter and releasing it in summer</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Keeling curve</span><span style=\"font-family:'Mangal'\"> records atmospheric CO₂ rising from about </span><span style=\"font-weight:bold;font-family:'Mangal'\">315 ppm in 1960 to about 420 ppm in 2025</span><span style=\"font-family:'Mangal'\">, a rise of about 35%, unprecedented in human history, caused by burning fossil fuels and deforestation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">sawtooth pattern</span><span style=\"font-family:'Mangal'\"> on the curve shows </span><span style=\"font-weight:bold;font-family:'Mangal'\">seasonal dips</span><span style=\"font-family:'Mangal'\">: each year, plant growth in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Northern Hemisphere</span><span style=\"font-family:'Mangal'\"> absorbs CO₂ through photosynthesis in the growing season, lowering the concentration, which rises again when growth slows.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fossil fuel burning explains the long-term upward trend, not the regular yearly zig-zag; volcanoes do not erupt on a yearly schedule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sawtooth is due to seasonal absorption of CO₂ by plant growth in the Northern Hemisphere </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following characteristics of pea was a dominant trait, used by Mendel in his experiments?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dwarf plants</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Tall plants</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Green seeds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wrinkled seeds</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mendel studied pairs of </span><span style=\"font-weight:bold;font-family:'Mangal'\">contrasting traits</span><span style=\"font-family:'Mangal'\"> in the garden pea, such as tall and short plants and round and wrinkled seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When a pure </span><span style=\"font-weight:bold;font-family:'Mangal'\">tall</span><span style=\"font-family:'Mangal'\"> plant was crossed with a pure </span><span style=\"font-weight:bold;font-family:'Mangal'\">short (dwarf)</span><span style=\"font-family:'Mangal'\"> plant, all the F1 progeny were </span><span style=\"font-weight:bold;font-family:'Mangal'\">tall</span><span style=\"font-family:'Mangal'\">; the trait that appears in the F1 generation is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">dominant</span><span style=\"font-family:'Mangal'\"> trait.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So </span><span style=\"font-weight:bold;font-family:'Mangal'\">tallness</span><span style=\"font-family:'Mangal'\"> is dominant, while </span><span style=\"font-weight:bold;font-family:'Mangal'\">dwarfness</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">green seed colour</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">wrinkled seed shape</span><span style=\"font-family:'Mangal'\"> are </span><span style=\"font-weight:bold;font-family:'Mangal'\">recessive</span><span style=\"font-family:'Mangal'\"> traits.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the dominant trait is tall plants </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A neutral atom has 17 electrons and 18 neutrons in it. According to the Bohr-Bury scheme, which of the following is correct for this atom?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electronic configuration 2, 8, 8 and mass number 36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electronic configuration 2, 8, 7 and mass number 35</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electronic configuration 2, 7, 8 and mass number 35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electronic configuration 2, 8, 7 and mass number 17</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The maximum number of electrons in a shell is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2n²</span><span style=\"font-family:'Mangal'\">: K-shell (n = 1) holds 2, L-shell (n = 2) holds 8, M-shell (n = 3) can hold 18 (but the outermost shell holds at most 8).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electrons are filled </span><span style=\"font-weight:bold;font-family:'Mangal'\">stepwise from the shell closest to the nucleus outward</span><span style=\"font-family:'Mangal'\">: the L-shell is filled only after the K-shell is complete, and so on.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17 electrons → K = 2, L = 8, M = 7, i.e. configuration </span><span style=\"font-weight:bold;font-family:'Mangal'\">2, 8, 7</span><span style=\"font-family:'Mangal'\">, which is chlorine (atomic number 17), as in Table 8.4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A neutral atom has equal numbers of protons and electrons, so protons = 17; </span><span style=\"font-weight:bold;font-family:'Mangal'\">mass number = protons + neutrons = 17 + 18 = 35</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the configuration is 2, 8, 7 and the mass number is 35 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): A drink prepared by adding a spoon of salt and a spoon of sugar to any convenient volume of water is Oral Rehydration Solution (ORS).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): ORS is prepared by adding specified amounts of salt and sugar to a fixed amount of water.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ORS</span><span style=\"font-family:'Mangal'\"> is prepared by adding </span><span style=\"font-weight:bold;font-family:'Mangal'\">specified amounts of salt and sugar to a fixed amount of water</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If the amount of salt or sugar, or the volume of water, is changed from the specified recipe, the result is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">salt-sugar solution but not ORS</span><span style=\"font-family:'Mangal'\">; not all sugary drinks made at home or sold in the market are ORS → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is why the right proportion of solute and solvent (the </span><span style=\"font-weight:bold;font-family:'Mangal'\">concentration</span><span style=\"font-family:'Mangal'\">) is always essential when preparing a solution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two onion bulbs are grown in jars of water. On Day 3 the root tips of the bulb in Jar B are cut off by about 1 cm, while the roots in Jar A are left untouched. Over the next four days the roots in Jar A keep growing, but those in Jar B stop growing in length. The correct explanation is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cutting removed the xylem of the root, so the plant could no longer absorb water</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">roots grow only from their tips, which contain continuously dividing cells (the root apical meristem)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">roots grow from the base of the bulb, so cutting the tip should have had no effect and the observation is wrong</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the cut roots stop growing because the lateral meristem that increases their length was removed</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In Activity 3.1, the roots in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jar A</span><span style=\"font-family:'Mangal'\"> continue to grow in length, while the roots in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jar B stop growing after the tips are cut</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The conclusion is that </span><span style=\"font-weight:bold;font-family:'Mangal'\">roots grow only from their tips</span><span style=\"font-family:'Mangal'\">, because the tips consist of cells which </span><span style=\"font-weight:bold;font-family:'Mangal'\">divide continuously</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">These growth zones at the tips of roots and shoots are called </span><span style=\"font-weight:bold;font-family:'Mangal'\">apical meristems</span><span style=\"font-family:'Mangal'\">; they help the plant grow in length.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The lateral meristem increases the girth (diameter) of a stem, not its length; and water absorption is not what stopped the growth.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, growth stopped because the dividing cells of the root apical meristem were removed </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A small piece of sodium is dropped into water: Na + H₂O → NaOH + H₂. When this skeletal equation is balanced with the smallest whole-number coefficients, the coefficients of Na, H₂O, NaOH and H₂ are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2, 2, 2, 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 1, 1, 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2, 1, 2, 1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 2, 1, 2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An equation is </span><span style=\"font-weight:bold;font-family:'Mangal'\">balanced</span><span style=\"font-family:'Mangal'\"> only if the number of atoms of each element is the same on both sides; the unbalanced form Na + H₂O → NaOH + H₂ is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">skeletal equation</span><span style=\"font-family:'Mangal'\"> (H: 2 on the left, 3 on the right).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Balance hydrogen first: with </span><span style=\"font-weight:bold;font-family:'Mangal'\">2H₂O</span><span style=\"font-family:'Mangal'\"> (4 H) on the left, write </span><span style=\"font-weight:bold;font-family:'Mangal'\">2NaOH</span><span style=\"font-family:'Mangal'\"> (2 H) + </span><span style=\"font-weight:bold;font-family:'Mangal'\">H₂</span><span style=\"font-family:'Mangal'\"> (2 H) on the right → 4 = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now sodium: 2 on the right (2NaOH), so write </span><span style=\"font-weight:bold;font-family:'Mangal'\">2Na</span><span style=\"font-family:'Mangal'\"> on the left; oxygen: 2 (2H₂O) = 2 (2NaOH).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Balanced equation: </span><span style=\"font-weight:bold;font-family:'Mangal'\">2Na + 2H₂O → 2NaOH + H₂</span><span style=\"font-family:'Mangal'\">. Check: Na 2 = 2, H 4 = 4, O 2 = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the coefficients are 2, 2, 2, 1 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about Dalton's Atomic Theory:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Atoms of a given element are identical in mass and chemical properties.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The theory explains why substances combine in fixed proportions and why there is no loss or gain of mass in a chemical reaction, by proposing that atoms are indivisible and merely rearrange.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Atoms of different elements have the same mass but different chemical properties.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Dalton's postulate: atoms of a given element are </span><span style=\"font-weight:bold;font-family:'Mangal'\">identical in mass and chemical properties</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Dalton's theory explains the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Law of Constant Proportions</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Law of Conservation of Mass</span><span style=\"font-family:'Mangal'\">: atoms are indivisible and are neither created nor destroyed in a reaction; they merely </span><span style=\"font-weight:bold;font-family:'Mangal'\">rearrange</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Dalton's postulate is that atoms of </span><span style=\"font-weight:bold;font-family:'Mangal'\">different elements have different masses</span><span style=\"font-family:'Mangal'\"> and different chemical properties, not the same mass → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A student sets up an aquarium with fish, water, an oxygen pump (aerator) and fish food bought from the market, but the tank needs regular cleaning and feeding. Which single change would make the aquarium closer to a self-sustaining system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Installing a more powerful oxygen pump</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Adding a larger quantity of fish food at one time</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Adding a few aquatic plants and animals</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fitting coloured lights to make the fish more active</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In designing an aquarium, the fish need free space for swimming, </span><span style=\"font-weight:bold;font-family:'Mangal'\">water, oxygen and food</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Oxygen can be supplied through an </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen pump (aerator)</span><span style=\"font-family:'Mangal'\"> and fish food is available in the market, but these make the tank dependent on the student, not self-sustaining.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Adding a few </span><span style=\"font-weight:bold;font-family:'Mangal'\">aquatic plants and animals</span><span style=\"font-family:'Mangal'\"> can make the aquarium a </span><span style=\"font-weight:bold;font-family:'Mangal'\">self-sustaining system</span><span style=\"font-family:'Mangal'\">: the plants produce oxygen and food, and the living organisms interact with one another and with the non-living components, like an ecosystem.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bigger pump, more food or coloured lights do not create these interactions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, adding a few aquatic plants and animals is the change needed </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which meristematic tissue is responsible for the increase in the diameter of a plant stem?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lateral meristem</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apical meristem</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Intercalary meristem</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Permanent tissue</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plants have three types of meristematic tissue: </span><span style=\"font-weight:bold;font-family:'Mangal'\">apical</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">lateral</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">intercalary</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cells of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">lateral meristem</span><span style=\"font-family:'Mangal'\"> divide and add new cells inward and outward in a concentric manner, which </span><span style=\"font-weight:bold;font-family:'Mangal'\">increases the diameter (girth)</span><span style=\"font-family:'Mangal'\"> of the stem.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">apical meristem</span><span style=\"font-family:'Mangal'\"> at the tips of the root and shoot increases the </span><span style=\"font-weight:bold;font-family:'Mangal'\">length</span><span style=\"font-family:'Mangal'\"> of the plant; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">intercalary meristem</span><span style=\"font-family:'Mangal'\"> lies at the base of leaves or internodes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Permanent tissue</span><span style=\"font-family:'Mangal'\"> has lost the ability to divide, so it cannot add new cells.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the increase in diameter is due to the lateral meristem </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Clean iron nails are placed in three test tubes: A contains ordinary water; B contains boiled distilled water with a layer of oil on top; C contains anhydrous calcium chloride and is corked. After a few days, rusting is seen in:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">test tube A only</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">test tubes A and B</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">test tubes A and C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">all three test tubes</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rusting of iron needs </span><span style=\"font-weight:bold;font-family:'Mangal'\">both air (oxygen) and water</span><span style=\"font-family:'Mangal'\"> to be present.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Test tube </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\">: the nails are exposed to water that contains dissolved air → </span><span style=\"font-weight:bold;font-family:'Mangal'\">nails rust</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Test tube </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">: the water was boiled to drive out dissolved air and the oil layer prevents air from dissolving again; water is present but </span><span style=\"font-weight:bold;font-family:'Mangal'\">no air</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">no rusting</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Test tube </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">: anhydrous calcium chloride absorbs the moisture from the air, so the nails are exposed to </span><span style=\"font-weight:bold;font-family:'Mangal'\">dry air only</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">no rusting</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, rusting is seen in test tube A only </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the human menstrual cycle:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. If an egg is not fertilised, it remains viable for about a day and then degenerates.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Ovulation, the release of a mature egg from the ovary, takes place on Day 1 of a typical 28-day cycle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Menstruation usually lasts 3 to 7 days.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. If the egg is </span><span style=\"font-weight:bold;font-family:'Mangal'\">not fertilised</span><span style=\"font-family:'Mangal'\">, it remains viable for </span><span style=\"font-weight:bold;font-family:'Mangal'\">about a day</span><span style=\"font-family:'Mangal'\"> and then degenerates → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In a typical 28-day cycle, Day 1–5 is menstruation, Day 6–14 the uterine lining rebuilds while the egg matures, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">ovulation occurs around Day 14</span><span style=\"font-family:'Mangal'\">, not on Day 1 → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. When fertilisation does not occur, the thickened uterine lining sheds and leaves the body with some blood through the vagina; this is menstruation, which usually lasts </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 to 7 days</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From the organisms grass, wheat, mango, goat, human, cow, elephant and fish, which of the following constitutes a valid food chain?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → wheat → mango</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → fish → goat</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Goat → cow → elephant</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → goat → human</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">food chain</span><span style=\"font-family:'Mangal'\"> is a series of organisms </span><span style=\"font-weight:bold;font-family:'Mangal'\">feeding on one another</span><span style=\"font-family:'Mangal'\">, each taking part at a different biotic level; each step of the chain forms a </span><span style=\"font-weight:bold;font-family:'Mangal'\">trophic level</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → goat → human: </span><span style=\"font-weight:bold;font-family:'Mangal'\">grass</span><span style=\"font-family:'Mangal'\"> (producer, first trophic level) is eaten by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">goat</span><span style=\"font-family:'Mangal'\"> (herbivore, primary consumer), and the goat is eaten by a </span><span style=\"font-weight:bold;font-family:'Mangal'\">human</span><span style=\"font-family:'Mangal'\"> (consumer at the next trophic level) → a valid chain.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → wheat → mango lists only producers, none of which feeds on another; goat → cow → elephant lists only herbivores that do not eat one another.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass → fish → goat is invalid because a goat does not feed on fish.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the valid food chain is grass → goat → human </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about DNA copying in reproduction:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. DNA copying is accompanied by the creation of an additional cellular apparatus, after which the two DNA copies separate, each with its own cellular apparatus.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The process of copying DNA is absolutely reliable, so the two cells formed are always identical to each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The inbuilt tendency for variation during reproduction is the basis for evolution.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Simply pushing one DNA copy out of the cell would not work, as it would have no organised cellular structure; so DNA copying is </span><span style=\"font-weight:bold;font-family:'Mangal'\">accompanied by the creation of an additional cellular apparatus</span><span style=\"font-family:'Mangal'\">, and then the copies separate, each with its own apparatus; effectively the cell divides into two → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">No bio-chemical reaction is absolutely reliable</span><span style=\"font-family:'Mangal'\">, so DNA copying has </span><span style=\"font-weight:bold;font-family:'Mangal'\">some variations</span><span style=\"font-family:'Mangal'\"> each time; the copies are similar to, but may not be identical to, the original → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Surviving cells are similar to but subtly different from each other; this </span><span style=\"font-weight:bold;font-family:'Mangal'\">inbuilt tendency for variation</span><span style=\"font-family:'Mangal'\"> during reproduction is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">basis for evolution</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A force acting on a trolley along its direction of motion stays constant at 20 N while the trolley moves the first 3 m, and then decreases uniformly to zero over the next 2 m. The total work done by the force on the trolley is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70 J</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a constant force, work done W = F × s; on a force-displacement graph this is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">area of the rectangle</span><span style=\"font-family:'Mangal'\"> under the graph.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Even when the force is not constant, the work done equals the </span><span style=\"font-weight:bold;font-family:'Mangal'\">area under the force-displacement graph</span><span style=\"font-family:'Mangal'\"> between the initial and final positions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First part (constant force): area of rectangle = 20 N × 3 m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second part (force falling uniformly from 20 N to 0 over 2 m): area of triangle = ½ × 2 m × 20 N = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Total work = 60 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 J</span><span style=\"font-family:'Mangal'\"> (treating the force as 20 N for the full 5 m would wrongly give 100 J).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the total work done is 80 J </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Solid sodium chloride does not exist as single, independent NaCl units.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Ionic compounds form three-dimensional crystals in which the ions are arranged in a repeating pattern; in sodium chloride each Na⁺ ion is surrounded by six Cl⁻ ions and each Cl⁻ ion by six Na⁺ ions.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Once Na⁺ and Cl⁻ ions are formed, they are held together by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">electrostatic force of attraction</span><span style=\"font-family:'Mangal'\"> between the oppositely charged ions, which is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ionic bond</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ionic compounds usually </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not remain as single units</span><span style=\"font-family:'Mangal'\">; they form </span><span style=\"font-weight:bold;font-family:'Mangal'\">three-dimensional (3-D) crystals</span><span style=\"font-family:'Mangal'\"> in which the ions are arranged in a </span><span style=\"font-weight:bold;font-family:'Mangal'\">repeating pattern</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In sodium chloride, </span><span style=\"font-weight:bold;font-family:'Mangal'\">each Na⁺ is surrounded by six Cl⁻ ions and each Cl⁻ by six Na⁺ ions</span><span style=\"font-family:'Mangal'\"> (the crystal lattice shows these ions as points) → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This repeating 3-D arrangement is exactly why no single NaCl unit exists on its own in the solid → R explains A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A compass needle is placed just below a straight wire. When current is passed through the wire, the needle deflects. This shows that:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a current-carrying wire attracts iron objects</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a current-carrying wire produces a magnetic field around it</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the wire becomes electrically charged</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">the compass needle loses its magnetism</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A compass needle is a small magnet, and it is deflected only by a </span><span style=\"font-weight:bold;font-family:'Mangal'\">magnetic field</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When current flows through the wire, the needle deflects; when the current stops, it returns to its original position.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This shows that an </span><span style=\"font-weight:bold;font-family:'Mangal'\">electric current produces a magnetic field around the conductor</span><span style=\"font-family:'Mangal'\">, as first observed by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Hans Christian Oersted</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The wire does not become charged and the needle does not lose its magnetism; attracting iron is not what deflects a compass.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, a current-carrying wire produces a magnetic field around it </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each vowel in the word MACHINE is changed to the letter immediately following it in the English alphabetical order and each consonant is changed to the letter immediately preceding it in the English alphabetical order. Which of the following letters will be third from the right in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Word: M A C H I N E (vowels A, I, E; consonants M, C, H, N)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vowels move one letter ahead: A → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">, I → </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, E → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consonants move one letter back: M → </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, C → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\">, H → </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, N → </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New group of letters (same positions): </span><span style=\"font-weight:bold;font-family:'Mangal'\">L B B G J M F</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Counting from the right: F (1st), M (2nd), </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\"> (3rd)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the third letter from the right is </span><span style=\"font-weight:bold;font-family:'Mangal'\">J (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ! B means that ‘A is the wife of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B means that ‘A is the son of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B means that ‘A is the father of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = B means that ‘A is the sister of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘R = I + G ÷ H ! T’, then how is R related to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's mother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's sister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's father</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's brother</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ! B → A is the wife of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A is the son of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A is the father of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = B → A is the sister of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the expression: R = I + G ÷ H ! T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = I → R is the sister of I. R and I are siblings, so they have the same parents.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I + G → I is the son of G. So R is a daughter of G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G ÷ H → G is the father of H. So R and H are both children of G, that is, R is the sister of H.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H ! T → H is the wife of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, R is the sister of H and H is the wife of T → R is </span><span style=\"font-weight:bold;font-family:'Mangal'\">T's wife's sister (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Statements: Some doctors are eagles. No snakes are doctors.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) Some eagles are not snakes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) All eagles are doctors.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Neither conclusion (I) nor (II) follows.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (II) follows.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both conclusions (I) and (II) follow.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (I) follows.</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Draw the diagram: the circle of doctors overlaps the circle of eagles (some doctors are eagles), and the circle of snakes lies completely outside the circle of doctors.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (I): Some eagles are not snakes → the eagles that are doctors lie inside doctors, and no snake is inside doctors, so those eagles are certainly not snakes → </span><span style=\"font-weight:bold;font-family:'Mangal'\">follows</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (II): All eagles are doctors → only ‘some doctors are eagles’ is given; the eagle circle may extend outside doctors → </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not follow</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only conclusion (I) follows </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">142 is related to 287 following a certain logic. Following the same logic, 219 is related to 441. To which of the given options is 356 related, following the same logic? (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13: Operations on 13 such as adding/subtracting/multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">709</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">721</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">715</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">712</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">142 → 287: 142 × 2 = 284; 284 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">287</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">219 → 441: 219 × 2 = 438; 438 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">441</span><span style=\"font-family:'Mangal'\"> → rule: second number = </span><span style=\"font-weight:bold;font-family:'Mangal'\">(first number × 2) + 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">356 → 356 × 2 = 712; 712 + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">715</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the other options: 709 = 712 − 3, 712 = 356 × 2 (the + 3 is missing), 721 = 712 + 9; none follows the rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 356 is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">715 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seven people, K, L, M, N, O, P and Q, are sitting in a row, all facing south. Only L sits to the right of K. Only three people sit between L and O. N sits second to the left of O. M sits to the immediate right of O. Q is not an immediate neighbour of M. Who sits at the eastern end of the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All seven face south, so ‘left’ and ‘right’ are the persons’ own left and right; a person facing south has the </span><span style=\"font-weight:bold;font-family:'Mangal'\">west on the right</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">east on the left</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Number the seats 1 to 7 from the persons’ left to their right (seat 1 = east end, seat 7 = west end).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only L sits to the right of K → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 6, L = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three people between L and O → </span><span style=\"font-weight:bold;font-family:'Mangal'\">O = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N sits second to the left of O → </span><span style=\"font-weight:bold;font-family:'Mangal'\">N = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M sits to the immediate right of O → </span><span style=\"font-weight:bold;font-family:'Mangal'\">M = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q is not a neighbour of M (seat 4) → Q cannot take seat 5 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 2, P = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (persons’ left → right): </span><span style=\"font-weight:bold;font-family:'Mangal'\">N – Q – O – M – P – K – L</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seat 1, the persons’ extreme left, is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">eastern end</span><span style=\"font-family:'Mangal'\"> → N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">N (Option C)</span><span style=\"font-family:'Mangal'\"> sits at the eastern end of the row.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a code language, 'BLAST' is coded as LBCTS and 'CHAIR' is coded as HCCRI. How will 'FRUIT' be coded in the same language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWIT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWTI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FRWTI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFVTI</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BLAST → LBCTS: the first two letters are interchanged (B L → </span><span style=\"font-weight:bold;font-family:'Mangal'\">L B</span><span style=\"font-family:'Mangal'\">), the middle letter is moved 2 ahead (A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">), and the last two letters are interchanged (S T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T S</span><span style=\"font-family:'Mangal'\">).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CHAIR → HCCRI: C H → </span><span style=\"font-weight:bold;font-family:'Mangal'\">H C</span><span style=\"font-family:'Mangal'\">; A + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">; I R → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R I</span><span style=\"font-family:'Mangal'\"> → same rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FRUIT → F R → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R F</span><span style=\"font-family:'Mangal'\">; U + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">; I T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T I</span><span style=\"font-family:'Mangal'\"> → RFWTI</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RFWIT keeps the last two letters in order, FRWTI keeps the first two, and RFVTI uses U + 1; none follows the rule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, ‘FRUIT’ is coded as </span><span style=\"font-weight:bold;font-family:'Mangal'\">RFWTI (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language, \"JUMOC\" is coded as \"15\" and \"QYATXZR\" is coded as \"21\". What is the code for \"VTGZXAIW\" in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"f
