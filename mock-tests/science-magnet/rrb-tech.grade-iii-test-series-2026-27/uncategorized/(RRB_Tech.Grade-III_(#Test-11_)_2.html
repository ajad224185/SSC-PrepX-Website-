p:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72.0009</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">71.9982</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The two numbers are 6.03 and 5.97; square each one and add.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6.03)² = 6.03 × 6.03 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">36.3609</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(5.97)² = 5.97 × 5.97 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35.6409</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 36.3609 + 35.6409 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">72.0018</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 6.03 = 6 + 0.03 and 5.97 = 6 − 0.03, so use (a + b)² + (a − b)² = 2(a² + b²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (6² + 0.03²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (36 + 0.0009)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 36.0009 = 72.0018</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">72.0018 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The mean of the n observations 1, 4, 9, 16, …, n² is 72.5. What is the value of n?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The observations are the squares 1², 2², 3², …, n² and their mean is 72.5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 1² + 2² + … + n² = n(n + 1)(2n + 1) / 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mean = Sum / n = (n + 1)(2n + 1) / 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(n + 1)(2n + 1) / 6 = 72.5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(n + 1)(2n + 1) = 72.5 × 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">435</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2n² + 3n + 1 = 435 → 2n² + 3n − 434 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(n − 14)(2n + 31) = 0 → n = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> (n is a positive whole number)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: (15 × 29) / 6 = 435 / 6 = 72.5 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 435 = 15 × 29 = (n + 1)(2n + 1) gives n = 14 at once</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value of n is </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which number, when added to each of the numbers 3, 7, 13 and 25, makes the resulting numbers proportional?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The four numbers are 3, 7, 13 and 25; let x be added to each.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3 + x) : (7 + x) :: (13 + x) : (25 + x)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product of the extremes = product of the means: (3 + x)(25 + x) = (7 + x)(13 + x)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75 + 28x + x² = 91 + 20x + x²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28x − 20x = 91 − 75</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8x = 16 → x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: the numbers become 5, 9, 15, 27 and 5 : 9 = 15 : 27 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: x = (bc − ad) / [(a + d) − (b + c)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [(7 × 13) − (3 × 25)] / [(3 + 25) − (7 + 13)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (91 − 75) / (28 − 20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 16 / 8 = 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A delivery rider starts 6 minutes 40 seconds late but still manages to reach a destination 21 km away on time by riding 12 km/hr faster than his usual speed. What is his usual speed in km/hr?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">41</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The distance is 21 km, the rider is late by 6 minutes 40 seconds and rides 12 km/h faster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 minutes 40 seconds = 400 seconds = 400/3,600 hour = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/9 hour</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let the usual speed be v km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time at the usual speed − time at the higher speed = time saved</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21/v − 21/(v + 12) = 1/9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">[21 × (v + 12 − v)] / [v(v + 12)] = 1/9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">252 / [v(v + 12)] = 1/9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v(v + 12) = 252 × 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,268</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v² + 12v − 2,268 = 0 → (v + 54)(v − 42) = 0 → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 21/42 hour = 30 minutes; 21/54 hour = 23 minutes 20 seconds; difference = 6 minutes 40 seconds ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: v(v + 12) = 2,268; test the options: 42 × 54 = 2,268 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, his usual speed is </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 (Option C)</span><span style=\"font-family:'Mangal'\"> km/h.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the least value that must be assigned to A so that the 8-digit number 109A7760 is divisible by 16?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A number is divisible by 16 when the number formed by its last four digits is divisible by 16.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The last four digits of 109A7760 are </span><span style=\"font-weight:bold;font-family:'Mangal'\">7760</span><span style=\"font-family:'Mangal'\">; the digit A is not among them.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7,760 / 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">485</span><span style=\"font-family:'Mangal'\"> (no remainder)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So 109A7760 is divisible by 16 for every digit A from 0 to 9.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The least digit is 0, so A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 1,09,07,760 / 16 = 6,81,735 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: divisibility by 16 depends only on the last four digits.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the least value of A is </span><span style=\"font-weight:bold;font-family:'Mangal'\">0 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If a + b + c = 9 and ab + bc + ca = 23, then what is the value of ab(a + b) + bc(b + c) + ca(c + a) + 3abc?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">198</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">216</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">207</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">184</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given: a + b + c = 9 and ab + bc + ca = 23.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Expand the first three terms: ab(a + b) + bc(b + c) + ca(c + a) = a²b + ab² + b²c + bc² + c²a + ca²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Identity: (a + b + c)(ab + bc + ca) = a²b + ab² + b²c + bc² + c²a + ca² + 3abc</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the given expression = (a + b + c)(ab + bc + ca)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 9 × 23 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">207</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check with a = 1, b = 3, c = 5 (sum = 9; ab + bc + ca = 3 + 15 + 5 = 23):</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3 × 4) + (15 × 8) + (5 × 6) + (3 × 15) = 12 + 120 + 30 + 45 = 207 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: ab(a + b) + bc(b + c) + ca(c + a) + 3abc = (a + b + c)(ab + bc + ca)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is </span><span style=\"font-weight:bold;font-family:'Mangal'\">207 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the product of the common prime factors of the numbers 2,730, 4,620 and 3,570.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">420</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">105</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">630</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">210</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Write each number as a product of prime factors.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,730 = 2 × 3 × 5 × 7 × 13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,620 = 2² × 3 × 5 × 7 × 11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,570 = 2 × 3 × 5 × 7 × 17</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Prime factors common to all three: </span><span style=\"font-weight:bold;font-family:'Mangal'\">2, 3, 5 and 7</span><span style=\"font-family:'Mangal'\"> (13, 11 and 17 each occur in only one number)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Product = 2 × 3 × 5 × 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: HCF (महत्तम समापवर्तक) of the three numbers = 2 × 3 × 5 × 7 = 210; every common prime occurs in it exactly once, so the HCF itself is the required product.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the product of the common prime factors is </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P and Q invest in a business in the ratio 3 : 5. They earn a profit of ₹72,000. One-third of the profit is shared equally, and the rest is shared in the ratio of their investments. Find the profit share of Q.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹42,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹39,000</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The profit is ₹72,000 and the investment ratio P : Q is 3 : 5.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Part shared equally = 72,000 × (1/3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹24,000</span><span style=\"font-family:'Mangal'\">, so each gets 24,000 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹12,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rest of the profit = 72,000 − 24,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q's part of the rest = 48,000 × (5/8) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹30,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q's total share = 12,000 + 30,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹42,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: P gets 12,000 + [48,000 × (3/8)] = 12,000 + 18,000 = 30,000; 30,000 + 42,000 = 72,000 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the profit share of Q is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹42,000 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the weighted arithmetic mean of the first 6 multiples of 8, where each multiple’s weight is half of its value. Give your answer correct to two decimal places.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52.52</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.36</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34.67</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43.67</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first 6 multiples of 8 are 8, 16, 24, 32, 40 and 48.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Their weights (half of each value) are 4, 8, 12, 16, 20 and 24.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σw = 4 + 8 + 12 + 16 + 20 + 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Σwx = (8 × 4) + (16 × 8) + (24 × 12) + (32 × 16) + (40 × 20) + (48 × 24)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 32 + 128 + 288 + 512 + 800 + 1,152 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2,912</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Weighted mean = Σwx / Σw</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2,912 / 84</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 34.666… ≈ </span><span style=\"font-weight:bold;font-family:'Mangal'\">34.67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: each weight is x/2, so the weighted mean = Σx² / Σx</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= [8² × (1 + 4 + 9 + 16 + 25 + 36)] / [8 × (1 + 2 + 3 + 4 + 5 + 6)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (8 × 91) / 21 = 728 / 21 ≈ 34.67</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the weighted mean is </span><span style=\"font-weight:bold;font-family:'Mangal'\">34.67 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a 400 m race, A runs at 8 m/s and B runs at 6.4 m/s. How much head start (in metres) should A give B so that the race ends in a dead heat?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The race is 400 m; A runs at 8 m/s and B at 6.4 m/s.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time taken by A to run 400 m = 400 / 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 seconds</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a dead heat, B must also finish in 50 seconds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance B covers in 50 seconds = 6.4 × 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">320 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Head start = 400 − 320 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: head start = race length × [1 − (speed of B / speed of A)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 400 × [1 − (6.4/8)]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 400 × 0.2 = 80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A should give B a head start of </span><span style=\"font-weight:bold;font-family:'Mangal'\">80 (Option A)</span><span style=\"font-family:'Mangal'\"> metres.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75% of the canvas used to make a closed cylinder of radius 7 cm and height 13 cm is reused to make a conical hat (curved surface only) of base radius 10 cm. What is the slant height (in cm) of the conical hat?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cylinder has radius 7 cm and height 13 cm; the hat has base radius 10 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Canvas of the closed cylinder = its total surface area = 2πr(r + h)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × (22/7) × 7 × (7 + 13)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 2 × 22 × 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">880 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Canvas reused = 880 × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">660 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Curved surface area of the cone = π × r × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(22/7) × 10 × l = 660</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">l = 660 / [(22/7) × 10]</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (660 × 7) / 220 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: π cancels on both sides: 75% × 2r(r + h) = R × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.75 × 2 × 7 × 20 = 10 × l</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">210 = 10l → l = 21</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the slant height of the hat is </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 (Option D)</span><span style=\"font-family:'Mangal'\"> cm.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mr. Verma spends 25% of his monthly income on food and 15% on his children's education. Of the remaining income, he spends 30% on rent and transport together, and then 25% of what is left on medical expenses. If he is left with ₹18,900 after all these expenses, what is his monthly income?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹54,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹63,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹60,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹56,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The amount left at the end is ₹18,900; let the monthly income be ₹I.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Food and education = 25% + 15% = 40% of I, so the remaining income = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.6I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rent and transport take 30% of this, so the amount left = 0.6I × 70% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.42I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Medical expenses take 25% of this, so the amount left = 0.42I × 75% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.315I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.315I = 18,900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I = 18,900 / 0.315 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹60,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: 60,000 × 60% = 36,000; 36,000 × 70% = 25,200; 25,200 × 75% = 18,900 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: Income × 60% × 70% × 75% = amount left</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I × 0.6 × 0.7 × 0.75 = 18,900</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I = 18,900 / 0.315 = 60,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, his monthly income is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹60,000 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Bogibeel Bridge, India's longest rail-cum-road bridge, which links Dibrugarh and Dhemaji districts of Assam, is built over which river?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Barak</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Teesta</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Subansiri</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brahmaputra</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bogibeel Bridge</span><span style=\"font-family:'Mangal'\"> is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.94 km</span><span style=\"font-family:'Mangal'\"> double-deck rail-cum-road bridge over the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brahmaputra</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Assam</span><span style=\"font-family:'Mangal'\">, linking </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dibrugarh</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Dhemaji</span><span style=\"font-family:'Mangal'\"> districts.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Prime Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> inaugurated it on </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 December 2018</span><span style=\"font-family:'Mangal'\">; it is India's longest rail-cum-road bridge.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Barak</span><span style=\"font-family:'Mangal'\"> flows through the Barak Valley of southern Assam, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Teesta</span><span style=\"font-family:'Mangal'\"> flows through Sikkim and West Bengal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the river is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brahmaputra (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Millennium Development Goals (MDGs) aimed to reduce extreme poverty by which year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2008</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2015</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2005</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2014</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Millennium Development Goals (MDGs)</span><span style=\"font-family:'Mangal'\"> were </span><span style=\"font-weight:bold;font-family:'Mangal'\">eight</span><span style=\"font-family:'Mangal'\"> goals that grew out of the UN </span><span style=\"font-weight:bold;font-family:'Mangal'\">Millennium Declaration</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">September 2000</span><span style=\"font-family:'Mangal'\">, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">2015</span><span style=\"font-family:'Mangal'\"> as the deadline.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Goal 1 set the target to </span><span style=\"font-weight:bold;font-family:'Mangal'\">halve, between 1990 and 2015</span><span style=\"font-family:'Mangal'\">, the proportion of people living in extreme poverty.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The MDGs were succeeded by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 Sustainable Development Goals (SDGs)</span><span style=\"font-family:'Mangal'\"> of the 2030 Agenda, adopted in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2015</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the target year is </span><span style=\"font-weight:bold;font-family:'Mangal'\">2015 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which club won the 135th Durand Cup on 23 August 2026 by defeating Mohun Bagan 4-1 in the final?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">East Bengal</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NorthEast United</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bengaluru FC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mohammedan SC</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">East Bengal</span><span style=\"font-family:'Mangal'\"> beat </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mohun Bagan 4-1</span><span style=\"font-family:'Mangal'\"> in the final of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">135th Durand Cup</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 August 2026</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kolkata</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Edmund Lalrindika</span><span style=\"font-family:'Mangal'\"> scored a </span><span style=\"font-weight:bold;font-family:'Mangal'\">hat-trick</span><span style=\"font-family:'Mangal'\"> in the first half and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bipin Singh</span><span style=\"font-family:'Mangal'\"> also scored; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Manvir Singh</span><span style=\"font-family:'Mangal'\"> scored Mohun Bagan's only goal.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was East Bengal's </span><span style=\"font-weight:bold;font-family:'Mangal'\">17th</span><span style=\"font-family:'Mangal'\"> Durand Cup title, equalling Mohun Bagan's record of </span><span style=\"font-weight:bold;font-family:'Mangal'\">17</span><span style=\"font-family:'Mangal'\"> titles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">NorthEast United</span><span style=\"font-family:'Mangal'\"> had won the 2025 edition.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the winner is </span><span style=\"font-weight:bold;font-family:'Mangal'\">East Bengal (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the World Happiness Report 2026, released in March 2026, what is India's rank?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">118th</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126th</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">116th</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">104th</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">India ranked </span><span style=\"font-weight:bold;font-family:'Mangal'\">116th</span><span style=\"font-family:'Mangal'\"> in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">World Happiness Report 2026</span><span style=\"font-family:'Mangal'\">, up from </span><span style=\"font-weight:bold;font-family:'Mangal'\">118th</span><span style=\"font-family:'Mangal'\"> in the 2025 report; it was </span><span style=\"font-weight:bold;font-family:'Mangal'\">126th</span><span style=\"font-family:'Mangal'\"> in 2023.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Finland</span><span style=\"font-family:'Mangal'\"> topped the list for the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ninth consecutive year</span><span style=\"font-family:'Mangal'\">, followed by </span><span style=\"font-weight:bold;font-family:'Mangal'\">Iceland, Denmark, Costa Rica and Sweden</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Afghanistan</span><span style=\"font-family:'Mangal'\"> ranked last.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Among India's neighbours, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nepal</span><span style=\"font-family:'Mangal'\"> ranked </span><span style=\"font-weight:bold;font-family:'Mangal'\">99th</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pakistan</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">104th</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The report is published by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Wellbeing Research Centre, University of Oxford</span><span style=\"font-family:'Mangal'\">, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gallup</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">UN Sustainable Development Solutions Network</span><span style=\"font-family:'Mangal'\">; the 2026 edition focused on social media and the wellbeing of young people.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, India's rank is </span><span style=\"font-weight:bold;font-family:'Mangal'\">116th (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">On 18 July 2026, Vikram-1, the first orbital rocket launched from India by a private company, lifted off from the Satish Dhawan Space Centre, Sriharikota. Which company built it?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Agnikul Cosmos</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Skyroot Aerospace</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pixxel</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dhruva Space</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Vikram-1</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Skyroot Aerospace</span><span style=\"font-family:'Mangal'\"> lifted off on </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 July 2026</span><span style=\"font-family:'Mangal'\"> from the </span><span style=\"font-weight:bold;font-family:'Mangal'\">First Launch Pad</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Satish Dhawan Space Centre, Sriharikota</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was the first time a private Indian company undertook an orbital launch, and Skyroot achieved it in its </span><span style=\"font-weight:bold;font-family:'Mangal'\">first attempt</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">four-stage</span><span style=\"font-family:'Mangal'\"> rocket (three solid stages and a liquid upper stage with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">RAMAN-I</span><span style=\"font-family:'Mangal'\"> engine) placed Skyroot's own </span><span style=\"font-weight:bold;font-family:'Mangal'\">SCOPE</span><span style=\"font-family:'Mangal'\"> satellite and other payloads in </span><span style=\"font-weight:bold;font-family:'Mangal'\">low Earth orbit</span><span style=\"font-family:'Mangal'\"> at about </span><span style=\"font-weight:bold;font-family:'Mangal'\">450 km</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><s nt-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Guru Bipin Singh</span><span style=\"font-family:'Mangal'\"> with </span><span style=\"font-weight:bold;font-family:'Mangal'\">Manipuri</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kalamandalam Gopi</span><span style=\"font-family:'Mangal'\"> with </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kathakali</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the artist is </span><span style=\"font-weight:bold;font-family:'Mangal'\">C. V. Chandrashekhar (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Exercise Malabar 2025, in which INS Sahyadri represented India alongside the navies of Australia, Japan and the United States, was held in November 2025 at:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Visakhapatnam</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Yokosuka</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Darwin</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Guam</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Exercise Malabar 2025</span><span style=\"font-family:'Mangal'\"> was held at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Guam</span><
