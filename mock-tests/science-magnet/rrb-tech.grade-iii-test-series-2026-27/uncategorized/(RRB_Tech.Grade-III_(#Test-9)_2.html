<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>20.) RRB Tech.Grade-III (#Test-9 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rahul starts from Point A and walks 5 km towards the north. He then turns right and walks 4 km, turns left and walks 7 km, and finally turns right and walks 5 km to reach Point B. What is the shortest distance between Point A and Point B, and in which direction is Point B with respect to Point A? (All turns are 90-degree turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 km, North-east</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, North-east</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 km, North-west</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 km, North-east</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take A as the origin; east = +x, north = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km north → (0, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing north → east, 4 km → (4, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Left turn while facing east → north, 7 km → (4, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing north → east, 5 km → B = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">9, 12</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B is 9 km east and 12 km north of A → B lies to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">north-east</span><span style=\"font-family:'Mangal'\"> of A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortest distance AB = √(9² + 12²) = √(81 + 144) = √225 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(21 km is the total distance walked, not the shortest distance.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 km, North-east (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 13 33 73 153 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">313</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">303</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">323</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">306</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the differences between consecutive terms:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">33 − 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">73 − 33 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">153 − 73 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span><span style=\"font-family:'Mangal'\"> → each difference is </span><span style=\"font-weight:bold;font-family:'Mangal'\">double</span><span style=\"font-family:'Mangal'\"> the previous one</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Next difference = 80 × 2 = 160 → next term = 153 + 160 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">313</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing term is </span><span style=\"font-weight:bold;font-family:'Mangal'\">313 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WD - TG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR - EU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LT - IX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK - MN</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare each letter of the second cluster with the corresponding letter of the first cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WD − TG: W − 3 = T, D + 3 = G → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR − EU: H − 3 = E, R + 3 = U → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PK − MN: P − 3 = M, K + 3 = N → (−3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LT − IX: L − 3 = I, T + 4 = X → (−3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three pairs follow (−3, +3); only LT − IX does not (T + 3 would be W).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">LT - IX (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language, ‘OVEN’ is coded as ‘6218’ and ‘MOVE’ is coded as ‘5621’. What is the code for ‘N’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each letter is coded by one digit (not necessarily in the same order).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OVEN → 6218 and MOVE → 5621</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Common letters in the two words: </span><span style=\"font-weight:bold;font-family:'Mangal'\">O, V, E</span><span style=\"font-family:'Mangal'\">; common digits in the two codes: </span><span style=\"font-weight:bold;font-family:'Mangal'\">6, 2, 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So O, V, E take the digits 6, 2, 1 (in some order).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The letter left in OVEN is N and the digit left in 6218 is </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> → N = 8 (similarly M = 5).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the code for ‘N’ is </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a class of 48 students, Riya's rank is 17th from the top. Sonu's rank is 5 places below Riya's. What is Sonu's rank from the bottom of the class?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">26th</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28th</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22nd</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27th</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Riya is 17th from the top; Sonu is 5 places below her → Sonu's rank from the top = 17 + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22nd</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rank from the bottom = (total students) − (rank from the top) + 1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 48 − 22 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27th</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(26th and 28th come from forgetting or double-counting the ‘+ 1’; 22nd is the rank from the top.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Sonu's rank from the bottom is </span><span style=\"font-weight:bold;font-family:'Mangal'\">27th (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H is the father of L. F is the wife of H. T is the mother of F. L is the brother of M. How is T related to M?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's mother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mother's mother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Brother's wife</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F is the wife of H → F and H are husband and wife; H is the father of L, so F is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother</span><span style=\"font-family:'Mangal'\"> of L.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L is the brother of M → L and M have the same parents → F is also the </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother of M</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T is the mother of F → T is M's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's mother</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The other options are wrong: T is two generations above M (not a sister), T is F's mother, not the mother of M's wife (Option B), and T is not married to M's brother (Option D).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, T is M's </span><span style=\"font-weight:bold;font-family:'Mangal'\">mother's mother (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HILQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TUXB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCFK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NORW</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare the consecutive letters of each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HILQ: H + 1 = I, I + 3 = L, L + 5 = Q → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCFK: B + 1 = C, C + 3 = F, F + 5 = K → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NORW: N + 1 = O, O + 3 = R, R + 5 = W → (+1, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TUXB: T + 1 = U, U + 3 = X, X + 4 = B (24 + 4 = 28 → 28 − 26 = 2 = B) → (+1, +3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three clusters follow (+1, +3, +5); only TUXB does not (X + 5 would be C).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">TUXB (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Manu starts from Point A and drives 21 km towards East. He then takes a right turn, drives 20 km, turns right and drives 23 km. He then takes a right turn and drives 25 km. He takes a final right turn, drives 2 km and stops at Point P. How far (shortest distance) and towards which direction should he drive in order to reach Point A again? (All turns are 90-degree turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 km to the South</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km to the South</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 km to the South</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 km to the South</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Take A as the origin; east = +x, north = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21 km east → (21, 0)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing east → south, 20 km → (21, −20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing south → west, 23 km → (−2, −20)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing west → north, 25 km → (−2, 5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Right turn while facing north → east, 2 km → P = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">0, 5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P is 5 km due north of A, so to reach A he must drive </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 km towards the south</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, he should drive </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 km to the South (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JTS, SCB, BLK, KUT, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CDT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TDC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TCD</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DCT</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look at each position of the clusters separately (after Z, continue from A).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First letters: J → S → B → K: +9, +9 (19 + 9 = 28 → 2 = B), +9 → next K + 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second letters: T → C → L → U: +9 (20 + 9 = 29 → 3 = C), +9, +9 → next U + 9 = 21 + 9 = 30 → 30 − 26 = 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third letters: S → B → K → T: +9 (19 + 9 = 28 → 2 = B), +9, +9 → next T + 9 = 20 + 9 = 29 → 29 − 26 = 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So every letter moves </span><span style=\"font-weight:bold;font-family:'Mangal'\">+9</span><span style=\"font-family:'Mangal'\"> at each step; the missing cluster is TDC.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">TDC (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language, 'green tea cup' is coded as 'la po ki', 'hot tea now' is coded as 'ki mo ru' and 'cup of hot' is coded as 'sa mo la'. (All the codes are two-letter codes only.) What is the code for 'green' in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">la</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ki</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">po</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">mo</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the words common to two sentences and the codes common to the same two sentences.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sentences 1 and 2: common word </span><span style=\"font-weight:bold;font-family:'Mangal'\">tea</span><span style=\"font-family:'Mangal'\">, common code </span><span style=\"font-weight:bold;font-family:'Mangal'\">ki</span><span style=\"font-family:'Mangal'\"> → tea = ki</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sentences 2 and 3: common word </span><span style=\"font-weight:bold;font-family:'Mangal'\">hot</span><span style=\"font-family:'Mangal'\">, common code </span><span style=\"font-weight:bold;font-family:'Mangal'\">mo</span><span style=\"font-family:'Mangal'\"> → hot = mo</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sentences 1 and 3: common word </span><span style=\"font-weight:bold;font-family:'Mangal'\">cup</span><span style=\"font-family:'Mangal'\">, common code </span><span style=\"font-weight:bold;font-family:'Mangal'\">la</span><span style=\"font-family:'Mangal'\"> → cup = la</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sentence 1: green tea cup → la po ki; tea = ki and cup = la, so the remaining code </span><span style=\"font-weight:bold;font-family:'Mangal'\">po</span><span style=\"font-family:'Mangal'\"> is for green.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the code for 'green' is </span><span style=\"font-weight:bold;font-family:'Mangal'\">po (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘A’ stands for ‘÷’, ‘B’ stands for ‘×’, ‘C’ stands for ‘+’ and ‘D’ stands for ‘−’, what will come in place of the question mark (?) in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">96 A 8 B 5 C 14 D 27 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">43</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">53</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">47</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">49</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Replace the letters by the signs: 96 ÷ 8 × 5 + 14 − 27</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS (÷ and × first, from left to right): 96 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span><span style=\"font-family:'Mangal'\">; 12 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now 60 + 14 − 27 = 74 − 27 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">47</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">47 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the following number-pairs, the second number is obtained by applying certain mathematical operations to the first number. Select the set in which the numbers are related in the same way as are the numbers of the following sets. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13: Operations on 13 such as adding/subtracting/multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 - 71</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 - 128</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 - 55</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 - 43</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 - 86</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 - 33</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 → 71: 8² = 64; 64 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">71</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 → 128: 11² = 121; 121 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">128</span><span style=\"font-family:'Mangal'\"> → rule: second number = (first number)</span><span style=\"font-weight:bold;font-family:'Mangal'\">²</span><span style=\"font-family:'Mangal'\"> + 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the options:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 → 7² + 7 = 49 + 7 = 56 ≠ 55 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 → 6² + 7 = 36 + 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">43</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 → 9² + 7 = 81 + 7 = 88 ≠ 86 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 → 5² + 7 = 25 + 7 = 32 ≠ 33 ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the set is </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 - 43 (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What will come in the place of ‘?’ in the following equation, if ‘+’ and ‘-‘ are interchanged and ‘×’ and ‘÷’ are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36 - 1 ÷ 9 + 6 × 6 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Interchange the signs: 36 + 1 × 9 − 6 ÷ 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Apply BODMAS (÷ and × first): 1 × 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\">; 6 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now 36 + 9 − 1 = 45 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the answer is </span><span style=\"font-weight:bold;font-family:'Mangal'\">44 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B means that ‘A is the son of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B means that ‘A is the brother of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B means that ‘A is the wife of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B means that ‘A is the father of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If ‘P % Q − R @ S + T’, then how is P related to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Daughter's husband's father</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Son's wife's brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Wife's father</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Son's wife's father</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Given:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A is the son of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A − B → A is the brother of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A @ B → A is the wife of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A % B → A is the father of B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the expression: P % Q − R @ S + T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P % Q → P is the father of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q − R → Q is the brother of R. Q and R are siblings, so they have the same parents. So P is also the father of R.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R @ S → R is the wife of S.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S + T → S is the son of T.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, P is the father of R, R is the wife of S and S is the son of T → P is </span><span style=\"font-weight:bold;font-family:'Mangal'\">T's son's wife's father (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Six people, A, B, C, D, E and F, are sitting in a row, facing south. Only two people sit to the right of B. D sits second to the left of B. Only one person sits between B and F. A sits to the immediate left of F. E sits at one of the extreme ends of the row. Who sits second to the right of C?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All face south, so each person's </span><span style=\"font-weight:bold;font-family:'Mangal'\">right is towards the west</span><span style=\"font-family:'Mangal'\"> and left is towards the east. Number the seats 1 (west end) to 6 (east end): ‘to the right’ = smaller seat number, ‘to the left’ = larger seat number.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people sit to the right of B → </span><span style=\"font-weight:bold;font-family:'Mangal'\">B = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D sits second to the left of B → D = 3 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only one person sits between B and F → F = 1 or 5; seat 5 is D's → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sits to the immediate left of F → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E sits at an extreme end; seat 1 is F's → </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 6</span><span style=\"font-family:'Mangal'\">, and the remaining seat 4 goes to </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (west → east): </span><span style=\"font-weight:bold;font-family:'Mangal'\">F – A – B – C – D – E</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second to the right of C (seat 4) → seat 4 − 2 = 2 → A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (Option A)</span><span style=\"font-family:'Mangal'\"> sits second to the right of C.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H, I, J, K, L, and M are sitting around a circular table facing the center. K sits to the immediate right of J. Only two people sit between I and M when counted from the left of I. L sits to the immediate right of H. H is not an immediate neighbor of I. Who sits to the immediate left of J?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All face the centre, so ‘right’ means clockwise and ‘left’ means anticlockwise. Number the seats 1 to 6 clockwise, with </span><span style=\"font-weight:bold;font-family:'Mangal'\">J at seat 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K sits to the immediate right of J → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two people sit between I and M (counted from the left of I) → in a circle of six, I and M sit </span><span style=\"font-weight:bold;font-family:'Mangal'\">opposite</span><span style=\"font-family:'Mangal'\"> each other (seats 3 apart).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L sits to the immediate right of H → L = H + 1; the free seats are 3, 4, 5, 6.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I and M must take two opposite free seats → (3, 6) only, since 4 is opposite 1 (J's seat). So H and L take seats 4 and 5 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">H = 4, L = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H is not a neighbour of I → I ≠ 3 (3 is next to 4) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">I = 6, M = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (clockwise from J): </span><span style=\"font-weight:bold;font-family:'Mangal'\">J – K – M – H – L – I</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Immediate left (anticlockwise) of J (seat 1) is seat 6 → I.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">I (Option D)</span><span style=\"font-family:'Mangal'\"> sits to the immediate left of J.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HEZ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EAW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TPL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LHD</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Compare the consecutive letters of each cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EAW: E − 4 = A, A − 4 = W (1 − 4 = −3 → 26 − 3 = 23 = W) → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TPL: T − 4 = P, P − 4 = L → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LHD: L − 4 = H, H − 4 = D → (−4, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HEZ: H − 3 = E, E − 5 = Z (5 − 5 = 0 → 26 = Z) → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">−3, −5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three clusters follow (−4, −4); only HEZ does not.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the odd one out is </span><span style=\"font-weight:bold;font-family:'Mangal'\">HEZ (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Refer to the given letter series and answer the question that follows. Counting to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Left) P A K E B D O U M I R F E C R N T O S T G L (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">How many such consonants are there, each of which is immediately preceded by a vowel and also immediately followed by a vowel?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">None</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vowels are A, E, I, O, U; we need the pattern </span><span style=\"font-weight:bold;font-family:'Mangal'\">vowel – consonant – vowel</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Scan the series from left to right and look at the letter before and after each consonant:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\"> E → K is preceded by A and followed by E ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> I → M is preceded by U and followed by I ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E C R → C is followed by R (a consonant) ✗; O S T → S is followed by T ✗; O U M → U is a vowel, not counted.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No other consonant has a vowel on both sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, there are </span><span style=\"font-weight:bold;font-family:'Mangal'\">Two</span><span style=\"font-family:'Mangal'\"> such consonants </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U and V live on seven different floors of the same building. The lowermost floor is numbered 1, the floor above it is numbered 2, and so on till the topmost floor is numbered 7. Only two people live above T. S lives immediately below T. Only two people live between S and Q. V lives immediately above P. U lives on an even-numbered floor, at some place above R. R does not live on the lowermost floor. How many people live between V and U?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Four</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only two people live above T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S lives immediately below T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Two people between S and Q → Q = 4 + 3 = 7 or 4 − 3 = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V lives immediately above P → V and P need two consecutive free floors; U lives on an even floor above R, and R ≠ 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Case Q = 1: free floors 2, 3, 6, 7 → the consecutive pair for (P, V) is (2, 3) or (6, 7); U must be even (2 or 6) and above R → if (P, V) = (2, 3), U = 6, R = 7 is above U ✗; if (P, V) = (6, 7), U = 2, R = 3 is above U ✗.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Case Q = 7: free floors 1, 2, 3, 6 → (P, V) = (1, 2) or (2, 3); U even → if (P, V) = (2, 3), U = 6 and R = 1, but R is not on the lowermost floor ✗ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">(P, V) = (1, 2), U = 6, R = 3</span><span style=\"font-family:'Mangal'\"> ✓.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Final arrangement (floor 1 → 7): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P, V, R, S, T, U, Q</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">People between V (floor 2) and U (floor 6): R, S, T → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Three</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Three (Option D)</span><span style=\"font-family:'Mangal'\"> people live between V and U.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the pair which follows the same pattern as that followed by the two pairs given below. Both pairs follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FKM : HHQ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTB : TQF</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : NMA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : NMZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW : OMA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPW : NNA</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FKM → HHQ: F + 2 = H, K − 3 = H, M + 4 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTB → TQF: R + 2 = T, T − 3 = Q, B + 4 = F → rule: </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, −3, +4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the options:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → NMA: L + 2 = N, P − 3 = M, W + 4 = A (23 + 4 = 27 → 27 − 26 = 1 = A) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → NMZ: W + 4 = A, not Z ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LPW → OMA: L + 2 = N, not O ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPW → NNA: K + 2 = M, not N; P − 3 = M, not N ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pair is </span><span style=\"font-weight:bold;font-family:'Mangal'\">LPW : NMA (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UO 7 is related to WR -2 in a certain way. In the same way, EK 12 is related to GN 3. To which of the following is VW 2 related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VX -5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XW -6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZ -7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GT -8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UO 7 → WR −2: U + 2 = W, O + 3 = R; 7 − 9 = −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">EK 12 → GN 3: E + 2 = G, K + 3 = N; 12 − 9 = 3 → rule: first letter </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">, second letter </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\">, number </span><span style=\"font-weight:bold;font-family:'Mangal'\">−9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VW 2 → V + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, W + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">; 2 − 9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−7</span><span style=\"font-family:'Mangal'\"> → XZ −7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the others: VX −5 (V is not V + 2), XW −6 (W is not W + 3), GT −8 (letters do not follow the rule).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, VW 2 is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">XZ -7 (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Read the given statement(s) and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statement(s).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Statements: Some pots are cups. No cup is a plate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I) Some pots are not plates.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II) No pot is a plate.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (I) follows.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only conclusion (II) follows.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both conclusions (I) and (II) follow.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Neither conclusion (I) nor (II) follows.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Draw the diagram: the circles of pots and cups overlap (some pots are cups), and the circle of plates lies completely outside the circle of cups (no cup is a plate).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (I): Some pots are not plates → the pots that are cups can never be plates (no cup is a plate), so at least those pots are not plates → </span><span style=\"font-weight:bold;font-family:'Mangal'\">follows</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Conclusion (II): No pot is a plate → the pots that are not cups may still overlap with plates; nothing in the statements rules this out → </span><span style=\"font-weight:bold;font-family:'Mangal'\">does not follow</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only conclusio
