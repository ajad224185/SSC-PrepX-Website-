3in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Revenue    ratio AC : sleeper : general = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>10    : 15 : 12</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Total    parts = 10 + 15 + 12 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>37</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">One    part = 1,11,000 / 37 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹3,000</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sleeper-class    revenue = 15 × 3,000 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹45,000</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    AC = 30,000, general = 36,000; 30,000 + 45,000 + 36,000 = 1,11,000    ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    compound ratio = product of the corresponding terms of the two    ratios</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the amount collected from the sleeper class is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹45,000    (Option B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">If    cos A − sin A = √2 sin A, then what is the value of (cos A −    sin A)/(cos A + sin A)?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">sinA</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">cosA</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">cotA</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">tanA</span></span></span></span></span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Given    cos A − sin A = √2 sin A → cos A = √2 sin A + sin A = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(√2    + 1) sin A</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">So    cos A + sin A = (√2 + 1) sin A + sin A = (√2 + 2) sin A =    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>√2(√2    + 1) sin A</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Required    ratio = (cos A − sin A)/(cos A + sin A) = √2 sin A / [√2(√2    + 1) sin A] = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>1/(√2    + 1)</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Rationalise:    1/(√2 + 1) = (√2 − 1)/((√2 + 1)(√2 − 1)) = (√2 −    1)/(2 − 1) = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>√2    − 1</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Now    tan A = sin A/cos A = sin A / [(√2 + 1) sin A] = 1/(√2 + 1) =    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>√2    − 1</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">So    the required ratio equals tan A.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    divide numerator and denominator by cos A: (1 − tan A)/(1 + tan    A); with tan A = √2 − 1 this gives (2 − √2)/√2 = √2 −    1 = tan A</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the value is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>tanA    (Option D)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    median of the data 5, 9, 14, 21, 8, 17, (x + 3), 12, 25 and 6 is    12.5. Find the value of x.</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">10</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">11</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">12</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Arrange    the nine known values in ascending order: 5, 6, 8, 9, 12, 14, 17,    21, 25</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">There    are 10 observations (even), so median = mean of the </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>5th    and 6th</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    observations</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">If    (x + 3) were 12 or less, the 5th and 6th values would be 9 and 12    → median 10.5 (not 12.5)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">If    (x + 3) were 14 or more, the 5th and 6th values would be 12 and 14    → median 13 (not 12.5)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">So    (x + 3) lies between 12 and 14 and is itself the 6th observation:    (12 + (x + 3)) / 2 = 12.5</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">12    + x + 3 = 25 → x = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>10</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    with x + 3 = 13 the data in order is 5, 6, 8, 9, 12, 13, 14, 17,    21, 25 → median = (12 + 13) / 2 = 12.5 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    for n even, median = [(n/2)th + (n/2 + 1)th observation] / 2</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the value of x is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>10    (Option B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    sum of the radius of the base and the height of a solid cylinder    is 35 cm. If the ratio of its curved surface area to its total    surface area is 3 : 5, find the difference between the total    surface area and the curved surface area of the cylinder. (Use π    = 22/7)</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">616    cm²</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">1,848    cm²</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">1,232    cm²</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">3,080    cm²</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Let    the radius be r and the height be h, with r + h = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>35    cm</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">CSA    = 2πrh and TSA = 2πr(r + h), so CSA : TSA = h : (r + h) = 3 : 5</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">h/35    = 3/5 → h = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>21    cm</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    and r = 35 − 21 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>14    cm</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">TSA    − CSA = 2πr(r + h) − 2πrh = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>2πr²</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    (the area of the two circular ends)</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">=    2 × (22/7) × 14 × 14 = 2 × 22 × 2 × 14 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>1,232    cm²</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    CSA = 2 × (22/7) × 14 × 21 = 1,848; TSA = 1,848 + 1,232 =    3,080; 1,848 : 3,080 = 3 : 5 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    TSA − CSA of a cylinder = 2πr²</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the required difference is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>1,232    cm² (Option C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    average of 25 numbers is 40. The average of the first 12 numbers    is 38 and the average of the last 12 numbers is 41. What is the    13th number?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">48</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">50</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">52</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">54</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sum    of all 25 numbers = 25 × 40 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>1,000</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sum    of the first 12 numbers = 12 × 38 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>456</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sum    of the last 12 numbers = 12 × 41 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>492</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    first 12 and the last 12 together cover 24 numbers, leaving only    the 13th number.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">13th    number = 1,000 − (456 + 492) = 1,000 − 948 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>52</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    middle term = total sum − (sum of the first group + sum of the    last group)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the 13th number is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>52    (Option C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    car starts at a speed of 40 km/h and increases its speed by 6 km/h    at the end of every 30 minutes. What is the average speed of the    car (in km/h) for the first 2.5 hours of the journey?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">50</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">52</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">54</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">56</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">2.5    hours = 5 intervals of 30 minutes (1/2 hour each).</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Speeds    in the five intervals: 40, 46, 52, 58, 64 km/h (each 6 more than    the previous)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Distance    in each interval = speed × (1/2) hour:</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">40    × (1/2) = 20 km; 46 × (1/2) = 23 km; 52 × (1/2) = 26 km; 58 ×    (1/2) = 29 km; 64 × (1/2) = 32 km</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Total    distance = 20 + 23 + 26 + 29 + 32 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>130    km</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Average    speed = total distance / total time = 130 / 2.5 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>52    km/h</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    equal time intervals → average speed = mean of the speeds = (40    + 46 + 52 + 58 + 64) / 5 = 260 / 5 = 52</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the average speed of the car is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>52    (Option B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    km/h.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    train running at 63 km/h takes 30 sec to pass a platform. Next it    takes 18 sec to pass a man cycling at 9 km/h in the same direction    in which the train is going. The ratio of the length of the train    to the length of the platform is:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">18    : 17</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">8    : 7</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">21    : 19</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">10    : 9</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Speed    of the train = 63 km/h = (63 × 5) / 18 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>17.5    m/s</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Passing    the platform in 30 s: train length + platform length = 17.5 × 30    = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>525    m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Relative    speed with respect to the cyclist (same direction) = 63 − 9 = 54    km/h = (54 × 5) / 18 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>15    m/s</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Passing    the cyclist in 18 s: train length = 15 × 18 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>270    m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Platform    length = 525 − 270 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>255    m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Ratio    train : platform = 270 : 255 = (divide by 15) </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>18    : 17</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    km/h → m/s: multiply by 5/18</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the required ratio is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>18    : 17 (Option A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Simplify    the given expression: 45 − 4 of (36 ÷ 12 × 3) + 15 ÷ 5 × 2</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">21</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">51</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">15</span></span></span></span></span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Apply    BODMAS: brackets first, then \"of\", then ÷ and × from    left to right, then + and −.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Bracket:    36 ÷ 12 = 3, then 3 × 3 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>9</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom :normal\"><span style=\"font-weight:normal\">Simple    interest for 2 years = ₹1,500, so SI for 1 year = 1,500 / 2 =    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹750</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">CI    − SI for 2 years = 1,560 − 1,500 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹60</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    = interest for 1 year on the first year's interest ₹750</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Rate    R = 60 / 750 × 100% = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>8%</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Sum    P = (750 × 100) / 8 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹9,375</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Amount    after 2 years = 9,375 + 1,560 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹10,935</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Interest    in the 3rd year = 10,935 × 8% = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹874.80</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">CI    for 3 years = 1,560 + 874.80 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹2,434.80</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    CI for 3 years = P[(1 + R/100)³ − 1] = 9,375 × (1.259712 −    1) = 2,434.80</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the compound interest for three years is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹2,434.80    (Option D)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">If    the polynomial x³ + kx² − 5x + 6 is exactly divisible b al\">=    8 + 4k − 10 + 6 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>4k    + 4</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Set    p(2) = 0: 4k + 4 = 0 → k = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>−1</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    x³ − x² − 5x + 6 at x = 2: 8 − 4 − 10 + 6 = 0 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    remainder theorem says the remainder on dividing p(x) by (x − a)    is p(a)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the value of k is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>−1    (Option C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Simplify:    45² − 44² + 43² − 42² + 41² − 40² + 39² − 38²</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">328</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">332</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">336</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">324</span></span></span></span></span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Use    the identity a² − b² = (a + b)(a − b). Here every pair has a    − b = 1, so a² − b² = a + b.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">45²    − 44² = (45 + 44)(45 − 44) = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>89</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><sp ed value is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>332    (Option B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    largest four-digit number which, when divided by 14, 9 and 6,    leaves remainder 2 in each case is:</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9956</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9948</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9984</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">9998</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    number leaving remainder 2 with 14, 9 and 6 = (a common multiple    of 14, 9 and 6) + 2</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">LCM    (</span></span></span></span><span><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">लघुत्तम    समापवर्त्य</span></span></span></span></span></span><span style=\"font-size:12pt\"><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">)    of 14, 9 and 6: 14 = 2 × 7, 9 = 3², 6 = 2 × 3 → LCM = 2 × 3²    × 7 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>126</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Largest    4-digit number = 9999; 9999 / 126 = 79 remainder 45 (126 × 79 =    </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>9,954</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">)</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Largest    4-digit multiple of 126 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>9,954</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Required    number = 9,954 + 2 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>9,956</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    9,956 / 14 = 711 rem 2; 9,956 / 9 = 1,106 rem 2; 9,956 / 6 = 1,659    rem 2 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    required number = (largest 4-digit multiple of the LCM) + common    remainder</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the required number is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>9956    (Option A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    rectangular park is 10 m longer than it is wide. A path of uniform    width 3 m runs all around the outside of the park. If the area of    the path is 336 m², what is the perimeter of the park (excluding    the path)?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">100    m</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">90    m</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">120    m</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">80    m</span></span></span></span></span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Let    the width of the park be w m, so its length = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(w    + 10) m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Path    of width 3 m on all sides adds 6 m to each dimension: outer    rectangle = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>(w    + 16) m × (w + 6) m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Area    of the path = outer area − park area</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">(w    + 16)(w + 6) − w(w + 10) = 336</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">w²    + 22w + 96 − w² − 10w = 336 → 12w + 96 = 336</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">12w    = 240 → w = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>20    m</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">;    length = 20 + 10 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>30    m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    outer 36 × 26 = 936; park 30 × 20 = 600; path = 936 − 600 =    336 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Perimeter    of the park = 2(30 + 20) = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>100    m</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    area of a path of width d around a rectangle l × b (outside) =    2d(l + b) + 4d² = 6(l + b) + 36</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the perimeter of the park is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>100    m (Option A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    two-digit number is 6.25 times the sum of its digits. If its    digits are reversed, the number decreases by 18. What is the    original number?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">57</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">84</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">75</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">93</span></span></span></span></span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Let    the tens digit be a and the units digit be b, so the number = 10a    + b.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    number is 6.25 times the digit sum: 10a + b = 6.25(a + b)</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Multiply    by 4: 40a + 4b = 25a + 25b → 15a = 21b → </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>5a    = 7b</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Digits    are 0 to 9, so a = 7 and b = 5 → number = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>75</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check    the second condition: reversed number = 57 and 75 − 57 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>18</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    ✓</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check    the first: 7 + 5 = 12 and 12 × 6.25 = 75 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    (number − reversed number) = 9(a − b) = 18 → a − b = 2,    which 75 satisfies</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the original number is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>75    (Option C)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 89, "question": "  <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">The    table gives the central angles of a pie chart showing the    department-wise distribution of the 3,600 employees of a company.    In every department, the ratio of the number of men to the number    of women is 5 : 4.</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789929262561_html_b86fbffb0a5ea291.png\" width=\"269\" height=\"28\" > </p>    <p style=\"orphans:2;widows:2\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">How    many women work in the Marketing department?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">300</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">270</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">200</span></span></span></span></span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">240</span></span></span></span></span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">A    pie chart has 360° in all, so the number of employees in a sector    = (its central angle / 360°) × total</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Employees    in Marketing = (54/360) × 3,600 = 54 × 10 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>540</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Men    : women = 5 : 4, so women = 4/(5 + 4) = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>4/9</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">    of the department</span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Women    in Marketing = 540 × (4/9) = 60 × 4 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>240</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    men = 540 × (5/9) = 300; 300 + 240 = 540 ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    3,600 employees / 360° = 10 employees per degree</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the number of women in Marketing is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>240    (Option D)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">An    article is sold at a profit of 20%. If the cost price is increased    by ₹40 and the selling price is reduced by ₹80, then the    profit would be 10%. What is the original cost price of the    article?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span>₹<span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">1,200</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span>₹<span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">1,280</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span>₹<span style=\"font-family:'Mangal'\"><span style=\"font-si
