n (I) follows </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAP is related to RCTV in a certain way based on the English alphabetical order. In the same way, KIND is related to FPKM. To which of the given options is MOVE related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OQXG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GXQP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HXQO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GXQO</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAP → RCTV: write the word in reverse, PART, then move each letter </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">: P + 2 = R, A + 2 = C, R + 2 = T, T + 2 = V ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KIND → FPKM: reverse gives DNIK; D + 2 = F, N + 2 = P, I + 2 = K, K + 2 = M ✓ → rule: </span><span style=\"font-weight:bold;font-family:'Mangal'\">reverse the word, then each letter +2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MOVE → reverse gives EVOM; E + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, V + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">X</span><span style=\"font-family:'Mangal'\">, O + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, M + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> → GXQO</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check the others: OQXG is +2 without reversing, GXQP has P (M + 3), HXQO has H (E + 3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, MOVE is related to </span><span style=\"font-weight:bold;font-family:'Mangal'\">GXQO (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If 1 is added to each odd digit and 2 is subtracted from each even digit in the number 7364528, what will be the sum of the digits which are second from the left and third from the right in the new number thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Digits of 7364528: 7, 3, 6, 4, 5, 2, 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Odd digits + 1: 7 → 8, 3 → 4, 5 → 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Even digits − 2: 6 → 4, 4 → 2, 2 → 0, 8 → 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">New number: </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 4 4 2 6 0 6</span><span style=\"font-family:'Mangal'\"> → 8442606</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second from the left: </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">; third from the right: 6 (1st), 0 (2nd), </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\"> (3rd)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sum = 4 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the required sum is </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What should come in place of ? in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BQGZ EOLV HMQR KKVN ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIZJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIAJ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MIAJ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NJAJ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Look at each position of the clusters separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First letters: B → E → H → K: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → K + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Second letters: Q → O → M → K: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → K − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">I</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Third letters: G → L → Q → V: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> → V + 5 = 22 + 5 = 27 → 27 − 26 = 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fourth letters: Z → V → R → N: each </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span><span style=\"font-family:'Mangal'\"> → N − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NIZJ, MIAJ and NJAJ each differ from NIAJ in one letter, so they do not follow the pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the missing cluster is </span><span style=\"font-weight:bold;font-family:'Mangal'\">NIAJ (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": "A ंोौयn थुiपधथोौुधौ पुध थोििस यी ो ुयहौध थiपु ो ौियहपiयn यी ो ौहृौपोncध X. Tथय पय पुनधध कोदौ िोपधन पुध थोििस ोcतहiनध ो ौुinद ीiniौु. X ोnक पुध cयंूयहnक नधौूयnौiृिध ीयन पुध ौुinद ीiniौु ोनध नधौूधcपiॅिधद:", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium hydroxide and calcium carbonate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium oxide and calcium hydroxide</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium carbonate and calcium oxide</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium hydroxide and calcium sulphate</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A solution of </span><span style=\"font-weight:bold;font-family:'Mangal'\">slaked lime, calcium hydroxide, Ca(OH)₂</span><span style=\"font-family:'Mangal'\">, produced by the reaction of quick lime (calcium oxide) with water, is used for </span><span style=\"font-weight:bold;font-family:'Mangal'\">whitewashing</span><span style=\"font-family:'Mangal'\"> walls; so X is calcium hydroxide.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium hydroxide </span><span style=\"font-weight:bold;font-family:'Mangal'\">reacts slowly with the carbon dioxide in air</span><span style=\"font-family:'Mangal'\"> to form a thin layer of </span><span style=\"font-weight:bold;font-family:'Mangal'\">calcium carbonate</span><span style=\"font-family:'Mangal'\"> on the walls: Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium carbonate is formed after </span><span style=\"font-weight:bold;font-family:'Mangal'\">two to three days</span><span style=\"font-family:'Mangal'\"> of whitewashing and gives a </span><span style=\"font-weight:bold;font-family:'Mangal'\">shiny finish</span><span style=\"font-family:'Mangal'\"> to the walls; marble also has the formula CaCO₃.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Calcium oxide is the raw material for making X, not the whitewash itself, and calcium sulphate plays no part here.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, X is calcium hydroxide and the shiny finish is due to calcium carbonate </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): The Sun appears slightly flattened (oval) at sunrise and sunset because the atmosphere disperses sunlight.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Because of atmospheric refraction, the Sun is visible to us about 2 minutes before the actual sunrise.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Sun </span><span style=\"font-weight:bold;font-family:'Mangal'\">appears flattened</span><span style=\"font-family:'Mangal'\"> at sunrise and sunset because of </span><span style=\"font-weight:bold;font-family:'Mangal'\">atmospheric refraction</span><span style=\"font-family:'Mangal'\">, not dispersion (dispersion is the splitting of white light into its colours by a prism or raindrops) → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because of atmospheric refraction, the Sun is </span><span style=\"font-weight:bold;font-family:'Mangal'\">visible about 2 minutes before the actual sunrise</span><span style=\"font-family:'Mangal'\"> and remains visible about 2 minutes after the actual sunset; the actual sunrise means the actual crossing of the horizon by the Sun → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the time difference between actual and apparent sunset is about 2 minutes, and both this and the flattening are effects of atmospheric refraction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": "A ौोपहनोपधक ौियहपiयn यी ो cयंूयहnक B ोप 60°C cयnपोinौ 287 g यी B in 100 g यी थोपधन, थुiिध ोप 40°C यnिद 241 g यी B cोn नधंोin कiौौियॅधक in 100 g यी थोपधन. A ौपहकधnप ूनधूोनधौ ो ौोपहनोपधक ौियहपiयn यी B ोप 60°C हौing 50 g यी थोपधन ोnक पुधn cयियस iप ौियिथद पय 40°C. Tुध ंोौौ यी B पुोप ौधूोनोपधौ यहप ोौ cनदौपोिस iौ:", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46 g</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23 g</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">120.5 g</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">143.5 g</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In 100 g of water, a saturated solution at 60°C holds </span><span style=\"font-weight:bold;font-family:'Mangal'\">287 g</span><span style=\"font-family:'Mangal'\"> of B, but at 40°C only </span><span style=\"font-weight:bold;font-family:'Mangal'\">241 g</span><span style=\"font-family:'Mangal'\"> can remain dissolved; the difference, 287 − 241 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">46 g</span><span style=\"font-family:'Mangal'\">, separates out as pure solid (crystals) on cooling.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The student used only </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 g of water</span><span style=\"font-family:'Mangal'\">, i.e. half the amount, so every mass is halved: dissolved at 60°C = 143.5 g and dissolved at 40°C = 120.5 g.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mass of crystals = 143.5 − 120.5 = 46 / 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">23 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is the principle of crystallization: the solubility of a substance differs at different temperatures.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 23 g of B separates out as crystals </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">From each pair of chromosomes, a germ cell receives:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">One chromosome, from either parent</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both chromosomes of the pair</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only the mother's chromosome</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only the father's chromosome</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each body cell has two copies of each chromosome, one from the male parent and one from the female parent.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When germ cells are formed, </span><span style=\"font-weight:bold;font-family:'Mangal'\">every germ cell takes one chromosome from each pair</span><span style=\"font-family:'Mangal'\">, and this chromosome may be of </span><span style=\"font-weight:bold;font-family:'Mangal'\">either maternal or paternal origin</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When two germ cells combine at fertilisation, the zygote </span><span style=\"font-weight:bold;font-family:'Mangal'\">gets the pair back</span><span style=\"font-family:'Mangal'\">, so the normal chromosome number is restored in the progeny.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The genes are not carried as one long thread of DNA but on </span><span style=\"font-weight:bold;font-family:'Mangal'\">separate independent pieces, each called a chromosome</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, a germ cell receives one chromosome of each pair, from either parent </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Three atoms P, Q and R have the following composition: P has 20 protons and 20 neutrons, Q has 19 protons and 21 neutrons, and R has 18 protons and 22 neutrons. Which of the following is correct about P, Q and R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They are atoms of three different elements having the same mass number, 40</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They are isotopes of the same element</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They have the same atomic number but different mass numbers</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They have the same number of electrons in the neutral state</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The atomic number (number of protons) </span><span style=\"font-weight:bold;font-family:'Mangal'\">uniquely identifies an element</span><span style=\"font-family:'Mangal'\">: P (20 protons) is calcium, Q (19 protons) is potassium and R (18 protons) is argon. These are three </span><span style=\"font-weight:bold;font-family:'Mangal'\">different elements</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mass number = protons + neutrons: P = 20 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">, Q = 19 + 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">, R = 18 + 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">40</span><span style=\"font-family:'Mangal'\">; the total number of nucleons is the same in all three.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Isotopes have the same atomic number with different mass numbers; here the atomic numbers differ, so B and C are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the neutral state the number of electrons equals the number of protons, so P, Q and R have 20, 19 and 18 electrons respectively; D is wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, P, Q and R are atoms of different elements with the same mass number 40 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप gधनं-cिधिस in ौधसहोििद नधूनयकहcing यनgोniौंौ:1. Mोnद ंिहपicिधििहोन यनgोniौंौ ुोॅध ौूधciोि िinधोgधौ यी cिधिस (gधनं-cिधिस) in ौूधciोिiौधक यनgोnौ पुोप cयnपोin यnिद ुोिी पुध nहंृधन यी cुनयंयौयंधौ ोnक ुोिी पुध ोंयहnप यी DNA cयंूोनधक पय पुध ृयकद cिधिसे पुधौध ोनध ूनयकहcधक ृद ंधiयौiौ.2. In cयंूिधस यनgोniौंौ, पुध िोनgधन gधनं-cिधि पुोप cयnपोinौ पुध ीययक ौपयनधौ iौ cयnॅधnपiयnोििद cोििधक पुध ंोिध gोंधपध, थुiिध पुध ौंोििधन ंयपiिध gधनं-cिधि iौ पुध ीधंोिध gोंधपध.3. Wुधn gधनं-cिधिस ीनयं पथय inकiॅiकहोिस cयंृinध पय ीयनं ो nधथ inकiॅiकहोि, पुध nयनंोि nहंृधन यी cुनयंयौयंधौ ोnक DNA cयnपधnप iौ नध-धौपोृिiौुधक.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. If each generation simply combined the full DNA of two individuals, the DNA would double every generation; the solution is that many multicellular organisms have </span><span style=\"font-weight:bold;font-family:'Mangal'\">germ-cells with only half the number of chromosomes and half the amount of DNA</span><span style=\"font-family:'Mangal'\">, produced by the process of cell division called </span><span style=\"font-weight:bold;font-family:'Mangal'\">meiosis</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. It is the other way round: the </span><span style=\"font-weight:bold;font-family:'Mangal'\">motile germ-cell is conventionally called the male gamete</span><span style=\"font-family:'Mangal'\">, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">germ-cell containing stored food is called the female gamete</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. When germ-cells from two individuals combine during sexual reproduction, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">number of chromosomes and the DNA content are re-established to the normal amount</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A mixture of methane and chlorine is exposed to sunlight. Which of the following correctly gives the products and the type of reaction?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₃Cl and HCl are formed; it is an addition reaction because chlorine adds across a bond</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₂=CH₂ and HCl are formed; it is an oxidation reaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">No reaction occurs, because saturated hydrocarbons are completely inert</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₃Cl and HCl are formed; it is a substitution reaction in which chlorine replaces the hydrogen atoms of methane one by one</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Saturated hydrocarbons are fairly unreactive and inert in the presence of most reagents, but </span><span style=\"font-weight:bold;font-family:'Mangal'\">in the presence of sunlight, chlorine is added to hydrocarbons in a very fast reaction</span><span style=\"font-family:'Mangal'\">, replacing the hydrogen atoms </span><span style=\"font-weight:bold;font-family:'Mangal'\">one by one</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CH₄ + Cl₂ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">CH₃Cl + HCl</span><span style=\"font-family:'Mangal'\"> (in the presence of sunlight).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A reaction in which </span><span style=\"font-weight:bold;font-family:'Mangal'\">one type of atom or a group of atoms takes the place of another</span><span style=\"font-family:'Mangal'\"> is called a </span><span style=\"font-weight:bold;font-family:'Mangal'\">substitution reaction</span><span style=\"font-family:'Mangal'\">; here a chlorine atom takes the place of a hydrogen atom.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is not an addition reaction (methane has no double or triple bond), and a number of products are usually formed when higher alkanes react with chlorine.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, CH₃Cl and HCl are formed by a substitution reaction </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ball is thrown vertically upwards and reaches its highest point. Consider the following statements about the ball at the highest point:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The kinetic energy of the ball is zero.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The force acting on the ball is zero.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The potential energy of the ball is maximum.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. At the highest point the ball momentarily stops; an object that does not move has </span><span style=\"font-weight:bold;font-family:'Mangal'\">zero kinetic energy</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Even at the highest point the </span><span style=\"font-weight:bold;font-family:'Mangal'\">gravitational force (weight) still acts</span><span style=\"font-family:'Mangal'\"> on the ball, which is why it comes down; the acceleration due to gravity is not zero there → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The greater the height of an object above the Earth's surface, the greater is its potential energy, so at the highest point the </span><span style=\"font-weight:bold;font-family:'Mangal'\">potential energy is maximum</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A refrigerator rated 300 W is operated for 10 hours a day for 30 days. If the cost of electrical energy is ₹5.00 per unit, the cost of running the refrigerator for the month is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹450</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹900</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electrical energy = power × time; total time = 10 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 hours</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Energy consumed = 300 W × 300 h = 90,000 Wh = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 kWh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The commercial unit of electrical energy is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">kilowatt hour (kWh)</span><span style=\"font-family:'Mangal'\">, commonly known as a </span><span style=\"font-weight:bold;font-family:'Mangal'\">'unit'</span><span style=\"font-family:'Mangal'\"> (1 kWh = 3.6 × 10⁶ J), so 90 kWh = 90 units.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cost = 90 × ₹5.00 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹450</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the cost for the month is ₹450 </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": "Aौौधनपiयn (A): Mयौप ंिहपicिधििहोन यनgोniौंौ हौध cुधंicोि cयंंहnicोपiयn (ुयनंयnधौ) ोौ ो ौधcयnक ंधोnौ यी cयnपनिय ोnक cययनकinोपiयn, ृधौiकधौ िधधcपनicोि iंूिहसधौ.Rधोौयn (R): Eिधcपनicोि iंूिहसधौ cोn नधोcु यnिद पुयौध cिधिस पुोप ोनध cयnnधcपधक ृद nधनॅयहौ पiौौहध, ोnक ो cिधि पुोप ुोौ पनोnौंiपपधक ोn iंूिहसध पोाधौ ौयंध पiंध पय नधौधप ृधीयनध iप cोn gधnधनोपध ोnक पनोnौंiप ो nधथ iंूिहसध.", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Most multicellular organisms use </span><span style=\"font-weight:bold;font-family:'Mangal'\">chemical communication between cells</span><span style=\"font-family:'Mangal'\"> as another means of communication besides electrical impulses; the compounds used for this are called </span><span style=\"font-weight:bold;font-family:'Mangal'\">hormones</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Electrical impulses have limitations: they </span><span style=\"font-weight:bold;font-family:'Mangal'\">reach only those cells that are connected by nervous tissue</span><span style=\"font-family:'Mangal'\">, not every cell in the body, and once a cell has generated and transmitted an impulse it </span><span style=\"font-weight:bold;font-family:'Mangal'\">takes some time to reset</span><span style=\"font-family:'Mangal'\"> its mechanisms, so cells cannot continually create and transmit impulses → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A chemical released by a stimulated cell diffuses around it and can reach all cells of the body, steadily and persistently, so these limitations of electrical impulses are exactly why chemical communication is used.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave lens of focal length 20 cm forms an image of an object at a distance of 15 cm from the lens. The object is placed at a distance of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8.6 cm from the lens</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 cm from the lens</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35 cm from the lens</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 cm from the lens</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a concave lens the focal length is negative: f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−20 cm</span><span style=\"font-family:'Mangal'\">; a concave lens always forms a virtual, erect image on the same side as the object, so the image distance is v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−15 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lens formula: 1/v − 1/u = 1/f → 1/u = 1/v − 1/f = (−1/15) − (−1/20) = −1/15 + 1/20.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/u = (−4 + 3) / 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−1/60</span><span style=\"font-family:'Mangal'\">, so u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−60 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The negative sign shows that the object is on the left of the lens, 60 cm from it; the image (15 cm) lies between the focus and the optical centre, as expected for a concave lens.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the object is placed 60 cm from the lens </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about mature red blood cells (RBCs) in humans:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Mature RBCs do not have a nucleus, which provides more space for haemoglobin so that a larger amount of oxygen can be carried.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Since they lack a nucleus, RBCs cannot repair or divide themselves.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Because they lack a nucleus, RBCs are long-lived and survive for several years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Mature human RBCs are </span><span style=\"font-weight:bold;font-family:'Mangal'\">enucleate</span><span style=\"font-family:'Mangal'\"> (they have no nucleus); the absence of a nucleus </span><span style=\"font-weight:bold;font-family:'Mangal'\">provides more space for haemoglobin</span><span style=\"font-family:'Mangal'\">, allowing it to transport a larger amount of oxygen to all cells of the body → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Since RBCs lack a nucleus, they </span><span style=\"font-weight:bold;font-family:'Mangal'\">cannot repair or divide themselves</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. As a result of lacking a nucleus, RBCs have a </span><span style=\"font-weight:bold;font-family:'Mangal'\">short lifespan</span><span style=\"font-family:'Mangal'\"> and survive for approximately </span><span style=\"font-weight:bold;font-family:'Mangal'\">120 days</span><span style=\"font-family:'Mangal'\">, not several years → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In Mendel's experiment, the F₁ tall pea plants (Tt) obtained from a cross between a pure tall (TT) and a pure short (tt) plant were self-pollinated, and 400 F₂ plants were obtained. The expected number of F₂ plants that are tall but carry a copy of the short trait (Tt), and the expected number of short plants, are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 and 100</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 and 100</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 and 100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 and 200</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When Tt plants are self-pollinated, each parent contributes either T or t to the progeny, giving the F₂ genotypes </span><span style=\"font-weight:bold;font-family:'Mangal'\">TT : Tt : tt in the ratio 1 : 2 : 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Out of 400 F₂ plants: TT = ¼ × 400 = 100, </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tt = ½ × 400 = 200</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">tt = ¼ × 400 = 100</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Both TT and Tt are tall</span><span style=\"font-family:'Mangal'\"> (T is dominant), so 300 plants are tall, of which 200 are Tt; </span><span style=\"font-weight:bold;font-family:'Mangal'\">only tt plants are short</span><span style=\"font-family:'Mangal'\">, so 100 plants are short.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is the 3 : 1 phenotypic ratio of tall to short seen in the F₂ generation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, 200 plants are Tt and 100 plants are short </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": "Xिदधं, पुध पiौौहध पुोप पनोnौूयनपौ थोपधन ोnक ंinधनोिस ीनयं पुध नययपौ पय यपुधन ूोनपौ यी ो ूिोnप, cयnौiौपौ यी पनोcुधiकौ, ॅधौौिधस, सिदधं ूोनधncुदंो ोnक सिदधं ीiृनधौ. Wुicु यी पुध ीियियथing ौपोपधंधnपौ ोृयहप पुधौध cयंूयnधnपौ iौ cयननधcप?", "option1": "Tनोcुधiकौ ोnक ॅधौौिधस ोनध िiॅing, पुin-थोििधक cिधिस पुोप cयnकहcप थोपधन", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Xylem parenchyma is the only living component of xylem</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Xylem fibres are the only living component of xylem and they store food</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All four components of xylem are dead at maturity</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Xylem is a complex permanent tissue made up of different types of cells working together: </span><span style=\"font-weight:bold;font-family:'Mangal'\">tracheids, vessels, xylem parenchyma and xylem fibres</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Tracheids and vessels are tubular and thick-walled</span><span style=\"font-family:'Mangal'\">; tracheids, vessels and xylem fibres are </span><span style=\"font-weight:bold;font-family:'Mangal'\">primarily sclerenchymatous</span><span style=\"font-family:'Mangal'\">, i.e. dead cells with thick lignified walls.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Xylem parenchyma is the only living component of xylem</span><span style=\"font-family:'Mangal'\">; it is not the fibres that are living.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So options A, C and D are incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, xylem parenchyma is the only living component of xylem </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A student observes a goldfish in an aquarium and finds that it opens and closes its mouth and gill covers much more often per minute than the student breathes. The best explanation is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fish take in oxygen from the air at the water surface, so they must keep opening their mouths</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The amount of dissolved oxygen in water is fairly low compared to the oxygen in air, so the rate of breathing in aquatic organisms is much faster than in terrestrial organisms</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water is denser than air, so the fish needs many rapid movements to force water past its gills</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fish respire anaerobically and must remove carbon dioxide rapidly through the mouth</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Terrestrial animals breathe oxygen from the atmosphere, while animals living in water use the </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen dissolved in water</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fishes take in water through their mouths and force it past the </span><span style=\"font-weight:bold;font-family:'Mangal'\">gills</span><span style=\"font-family:'Mangal'\">, where the dissolved oxygen is taken up by the blood.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since the </span><span style=\"font-weight:bold;font-family:'Mangal'\">amount of dissolved oxygen in water is fairly low compared to the amount of oxygen in air</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">rate of breathing in aquatic organisms is much faster</span><span style=\"font-family:'Mangal'\"> than that in terrestrial organisms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fish do not take oxygen from the air, and they respire aerobically using dissolved oxygen.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the faster breathing is because water contains much less oxygen than air </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about digestion in the human alimentary canal:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The gastric glands in the wall of the stomach release pepsin, which is a fat-digesting enzyme.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Bile salts break large fat globules into smaller globules, increasing the efficiency of enzyme action, just as soap acts on dirt.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Pancreatic juice contains trypsin for digesting proteins and lipase for breaking down emulsified fats.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The gastric glands release hydrochloric acid, mucus and </span><span style=\"font-weight:bold;font-family:'Mangal'\">pepsin</span><span style=\"font-family:'Mangal'\">, which is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">protein-digesting</span><span style=\"font-family:'Mangal'\"> enzyme, not a fat-digesting one → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Fats are present in the intestine as large globules, which makes enzyme action difficult; </span><span style=\"font-weight:bold;font-family:'Mangal'\">bile salts break them into smaller globules</span><span style=\"font-family:'Mangal'\"> (emulsification), increasing the efficiency of enzyme action, similar to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">emulsifying action of soaps on dirt</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">pancreas</span><span style=\"font-family:'Mangal'\"> secretes pancreatic juice containing </span><span style=\"font-weight:bold;font-family:'Mangal'\">trypsin for digesting proteins</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">lipase for breaking down emulsified fats</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 2 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A single circular loop of wire carrying a current I produces a magnetic field B at its centre. The wire is now wound into a circular coil of 50 turns of the same radius, and the same current I is passed through it. The magnetic field at the centre of the coil is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, because the field at the centre depends only on the current</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 B, because the current in each turn is in the same direction and the field due to each turn adds up</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B/50, because the current is shared among the 50 turns</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2500 B, because the field is proportional to the square of the number of turns</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The magnetic field produced by a current-carrying wire at a given point depends </span><span style=\"font-weight:bold;font-family:'Mangal'\">directly on the current</span><span style=\"font-family:'Mangal'\"> passing through it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a circular coil having </span><span style=\"font-weight:bold;font-family:'Mangal'\">n turns</span><span style=\"font-family:'Mangal'\">, the field produced is </span><span style=\"font-weight:bold;font-family:'Mangal'\">n times as large</span><span style=\"font-family:'Mangal'\"> as that produced by a single turn.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is because the </span><span style=\"font-weight:bold;font-family:'Mangal'\">current in each circular turn has the same direction</span><span style=\"font-family:'Mangal'\">, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">field due to each turn just adds up</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With 50 turns and the same current, the field at the centre becomes 50 × B; the current is not shared among the turns (the same current flows through every turn in series).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the field at the centre is 50 B </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about eye donation:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. People who use spectacles, or those who have been operated for cataract, can still donate their eyes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The eyes must be removed within 4–6 hours after death, so the nearest eye bank must be informed immediately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. One pair of donated eyes can give vision to up to four corneal blind people.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Eye donors can belong to any age group or sex; </span><span style=\"font-weight:bold;font-family:'Mangal'\">people who use spectacles, or those operated for cataract, can still donate their eyes</span><span style=\"font-family:'Mangal'\">, as can people with diabetes, hypertension or asthma → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Eyes must be removed within 4–6 hours after death</span><span style=\"font-family:'Mangal'\">, so the nearest eye bank must be informed immediately; the eye bank team removes the eyes at the home of the deceased or at a hospital in only 10–15 minutes, without any disfigurement → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">One pair of donated eyes gives vision to up to four corneal blind people</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Persons infected with or who died of AIDS, hepatitis B or C, rabies, acute leukaemia, tetanus, cholera, meningitis or encephalitis cannot donate eyes.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a factory, a clean aluminium article is made the anode and electrolysed with dilute sulphuric acid. What happens to the article, and what is this process called?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The aluminium dissolves into the acid as aluminium sulphate; the process is called pickling</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hydrogen evolved at the anode removes the oxide layer, making the article shine; the process is called electrolytic refining</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Oxygen evolved at the anode reacts with the aluminium to form a thicker protective oxide layer, which can also be dyed; the process is called anodising</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A layer of copper is deposited on the article; the process is called electroplating</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aluminium develops a thin oxide layer when exposed to air, and this oxide coat makes it resistant to further corrosion; </span><span style=\"font-weight:bold;font-family:'Mangal'\">anodising</span><span style=\"font-family:'Mangal'\"> is the process of forming a </span><span style=\"font-weight:bold;font-family:'Mangal'\">thicker oxide layer</span><span style=\"font-family:'Mangal'\"> of aluminium on an aluminium article.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During anodising, the clean aluminium article is made the </span><span style=\"font-weight:bold;font-family:'Mangal'\">anode</span><span style=\"font-family:'Mangal'\"> and electrolysed with </span><span style=\"font-weight:bold;font-family:'Mangal'\">dilute sulphuric acid</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxygen gas evolved at the anode reacts with aluminium</span><span style=\"font-family:'Mangal'\"> to make a </span><span style=\"font-weight:bold;font-family:'Mangal'\">thicker protective oxide layer</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This anodised oxide layer can be </span><span style=\"font-weight:bold;font-family:'Mangal'\">dyed easily</span><span style=\"font-family:'Mangal'\"> to give aluminium articles an attractive finish; the article does not dissolve, and no copper is deposited.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, a thicker protective oxide layer forms, and the process is anodising </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The waste we generate may be biodegradable or non-biodegradable. Which of the following groups contains an item that is NOT biodegradable?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass, wood and plastic</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass, flowers and leather</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fruit-peels, cake and lime-juice</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cake, wood and grass</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Substances that are broken down by biological processes (by the enzymes of bacteria and other saprophytes) are </span><span style=\"font-weight:bold;font-family:'Mangal'\">biodegradable</span><span style=\"font-family:'Mangal'\">; those that are not broken down in this way are </span><span style=\"font-weight:bold;font-family:'Mangal'\">non-biodegradable</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Grass, flowers, leather, wood, fruit-peels, cake and lime-juice are all materials of biological origin and are </span><span style=\"font-weight:bold;font-family:'Mangal'\">biodegradable</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Plastic is non-biodegradable</span><span style=\"font-family:'Mangal'\">: it persists for a long time in the environment; changes in packaging and more things becoming disposable have made much of our waste non-biodegradable.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the group 'grass, wood and plastic' contains a non-biodegradable item, while the other three groups contain only biodegradable items.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the group with a non-biodegradable item is grass, wood and plastic </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): While walking, the force of friction applied by the ground on the foot acts in the forward direction and helps the person move.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): While pushing the ground backwards, the foot tends to slide backwards, and the force of friction opposes this tendency.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">While walking or running, a person </span><span style=\"font-weight:bold;font-family:'Mangal'\">pushes the ground backwards</span><span style=\"font-family:'Mangal'\"> with the feet, and the ground applies an opposite force on the feet to move the person forward; this force is in the form of </span><span style=\"font-weight:bold;font-family:'Mangal'\">friction</span><span style=\"font-family:'Mangal'\">, so here friction </span><span style=\"font-weight:bold;font-family:'Mangal'\">helps</span><span style=\"font-family:'Mangal'\"> the person move rather than opposing them → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the foot pushes the ground, it </span><span style=\"font-weight:bold;font-family:'Mangal'\">tries to slide backwards</span><span style=\"font-family:'Mangal'\">; the force of friction acts on it in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">forward direction</span><span style=\"font-family:'Mangal'\"> because friction opposes this tendency to slide → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Without friction the foot would slip backwards and the person would fall. R is exactly why the friction on the foot is forward, so R explains A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a grassland, grass is eaten by grasshoppers, rabbits and deer; grasshoppers are eaten by frogs and birds; frogs are eaten by snakes; and rabbits, deer and snakes are eaten by a tiger. This pattern of feeding relationships is called X, and the greatest number of individuals in the grassland is generally found at Y. X and Y are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Food chain; the top carnivore</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Food web; the primary consumer level</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Food web; the producer level</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Trophic level; the tertiary consumer level</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each organism is generally </span><span style=\"font-weight:bold;font-family:'Mangal'\">eaten by two or more other kinds of organisms</span><span style=\"font-family:'Mangal'\">, which in turn are eaten by several others, so instead of a straight food chain the relationship is shown as a series of </span><span style=\"font-weight:bold;font-family:'Mangal'\">branching lines called a food web</span><span style=\"font-family:'Mangal'\"> → X is a food web.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A food web consists of many food chains: e.g. grass → grasshopper → frog → snake → tiger is one chain within it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">There are generally a </span><span style=\"font-weight:bold;font-family:'Mangal'\">greater number of individuals at the lower trophic levels</span><span style=\"font-family:'Mangal'\"> of an ecosystem, with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">greatest number being of the producers</span><span style=\"font-family:'Mangal'\"> (here, the grass) → Y is the producer level.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is because energy is lost at each step, so very little usable energy remains after four trophic levels.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, X is a food web and Y is the producer level </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about how we perceive sound:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The loudness of sound is commonly measured in decibels (dB); normal conversation is about 60 dB, while firecrackers can exceed 100 dB.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Elephants can detect infrasound, while dogs, cats, bats and dolphins can detect ultrasound.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Intensity of sound is a subjective quantity that depends on the listener, whereas loudness is a measurable physical quantity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Sound loudness is commonly measured in </span><span style=\"font-weight:bold;font-family:'Mangal'\">decibels (dB)</span><span style=\"font-family:'Mangal'\">: very soft sounds like rustling leaves are a few dB, </span><span style=\"font-weight:bold;font-family:'Mangal'\">normal conversation is about 60 dB</span><span style=\"font-family:'Mangal'\">, and very loud sounds such as </span><span style=\"font-weight:bold;font-family:'Mangal'\">firecrackers can exceed 100 dB</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Humans cannot hear infrasound or ultrasound, but some animals can: </span><span style=\"font-weight:bold;font-family:'Mangal'\">elephants detect infrasound</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">dogs, cats, bats and dolphins detect ultrasound</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. It is the other way round: </span><span style=\"font-weight:bold;font-family:'Mangal'\">intensity is a measurable quantity</span><span style=\"font-family:'Mangal'\">, whereas </span><span style=\"font-weight:bold;font-family:'Mangal'\">loudness depends on the listener's hearing ability</span><span style=\"font-family:'Mangal'\">; the two are often used interchangeably only in everyday language → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An element M has the electronic configuration 2, 8, 2. It reacts with oxygen to form a compound that is slightly soluble in water. The formula of the compound, the type of bond in it, and the electrical conductivity of its aqueous solution are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M₂O, covalent, does not conduct electricity</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO₂, ionic, conducts electricity</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO, ionic, conducts electricity</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MO, covalent, does not conduct electricity</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M has only </span><span style=\"font-weight:bold;font-family:'Mangal'\">two electrons in its valence shell</span><span style=\"font-family:'Mangal'\">; an atom with fewer than four valence electrons generally </span><span style=\"font-weight:bold;font-family:'Mangal'\">donates</span><span style=\"font-family:'Mangal'\"> them, so M loses two electrons to form the cation </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> (valency 2).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Oxygen (2, 6) gains two electrons to form the anion </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> (valency 2); criss-crossing the valencies gives the formula </span><span style=\"font-weight:bold;font-family:'Mangal'\">MO</span><span style=\"font-family:'Mangal'\"> (as in magnesium oxide).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since a metal has combined with a non-metal by transfer of electrons, the bond is </span><span style=\"font-weight:bold;font-family:'Mangal'\">ionic</span><span style=\"font-family:'Mangal'\">; ionic compounds are typically formed when metals combine with non-metals.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The dissolved part of an ionic compound provides </span><span style=\"font-weight:bold;font-family:'Mangal'\">free ions</span><span style=\"font-family:'Mangal'\"> in water, so the aqueous solution </span><span style=\"font-weight:bold;font-family:'Mangal'\">conducts electricity</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size
