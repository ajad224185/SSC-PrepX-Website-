:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the compound is MO, ionic, and its solution conducts electricity </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about pollen and seed production and the events after pollination in flowering plants:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Wind-pollinated grasses such as maize and wheat release approximately 5,00,000–10,00,000 pollen grains per flower, yet form an estimated average of only 50–200 seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Insect-pollinated plants such as sunflower release approximately 20,000–40,000 pollen grains per flower and form an estimated average of 800–1,000 seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. After fertilisation, the ovule enlarges to form the fruit while the ovary develops into the seed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Wind-pollinated grasses</span><span style=\"font-family:'Mangal'\"> (maize, wheat) release approximately </span><span style=\"font-weight:bold;font-family:'Mangal'\">5,00,000–10,00,000 pollen grains per flower</span><span style=\"font-family:'Mangal'\"> but form an estimated average of only </span><span style=\"font-weight:bold;font-family:'Mangal'\">50–200 seeds</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Insect-pollinated plants</span><span style=\"font-family:'Mangal'\"> (e.g. sunflower) release approximately </span><span style=\"font-weight:bold;font-family:'Mangal'\">20,000–40,000 pollen grains per flower</span><span style=\"font-family:'Mangal'\"> and form an estimated average of </span><span style=\"font-weight:bold;font-family:'Mangal'\">800–1,000 seeds</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. It is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ovary</span><span style=\"font-family:'Mangal'\"> surrounding the ovules that enlarges and develops into a </span><span style=\"font-weight:bold;font-family:'Mangal'\">fruit</span><span style=\"font-family:'Mangal'\">, while the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ovules develop into seeds</span><span style=\"font-family:'Mangal'\"> inside the fruit; the statement has it reversed → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A motor develops a power of 85 W for 30 s. What is the work done by the motor?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">255 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">250 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2500 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2550 J</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Power is the rate at which work is done: P = W / t, so W = P × t.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W = 85 W × 30 s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">2550 J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the work done by the motor is 2550 J </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): When granulated zinc is warmed with sodium hydroxide solution, hydrogen gas is evolved and sodium zincate is formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): All metals react with bases to produce hydrogen gas.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When pieces of granulated </span><span style=\"font-weight:bold;font-family:'Mangal'\">zinc</span><span style=\"font-family:'Mangal'\"> are warmed with </span><span style=\"font-weight:bold;font-family:'Mangal'\">sodium hydroxide</span><span style=\"font-family:'Mangal'\"> solution, </span><span style=\"font-weight:bold;font-family:'Mangal'\">hydrogen gas</span><span style=\"font-family:'Mangal'\"> is formed: 2NaOH(aq) + Zn(s) → Na₂ZnO₂(s) (sodium zincate) + H₂(g) → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">However, reactions of a base with a metal to give hydrogen gas are </span><span style=\"font-weight:bold;font-family:'Mangal'\">not possible with all metals</span><span style=\"font-family:'Mangal'\"> → R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the reaction in A is a property of particular metals like zinc, not a general rule for all metals.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is true but R is false </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A small mirror fitted in a wall of Agra Fort allows a visitor on the terrace to see the full image of the Taj Mahal, which is a very large building. The mirror is most likely:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave mirror, because it converges light from the whole building to a point</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A convex mirror, because it is curved outwards and so has a wider field of view, giving a full-length erect but diminished image</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A plane mirror, because it forms an image of the same size as the object</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A concave mirror, because it forms a magnified image of distant objects</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">full-length image of a tall building or tree can be seen in a small convex mirror</span><span style=\"font-family:'Mangal'\"> because a convex mirror has a </span><span style=\"font-weight:bold;font-family:'Mangal'\">wider field of view</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Convex mirrors are </span><span style=\"font-weight:bold;font-family:'Mangal'\">curved outwards</span><span style=\"font-family:'Mangal'\">, which is why they view a much larger area than plane mirrors; one such convex mirror is fitted in a wall of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Agra Fort facing the Taj Mahal</span><span style=\"font-family:'Mangal'\">, so that a full image of the Taj Mahal can be seen from the terrace adjoining the wall.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A convex mirror always gives an </span><span style=\"font-weight:bold;font-family:'Mangal'\">erect, though diminished, image</span><span style=\"font-family:'Mangal'\">; this is the same reason it is used as a rear-view mirror in vehicles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A plane mirror of small size cannot show the whole building, and a concave mirror does not give an erect full view of a large distant object.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mirror is a convex mirror with a wide field of view </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": "\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match the cell structure with its function:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789928759614_image001.png\" style=\"width: 900px; height: 200px;\" /></p>", "option1": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iii), (c)-(i), (d)-(iv)</span></p>", "option2": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option3": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option4": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) The </span><span style=\"font-weight:bold;font-family:'Mangal'\">nucleolus</span><span style=\"font-family:'Mangal'\"> is the dense round body in the nucleus where the </span><span style=\"font-weight:bold;font-family:'Mangal'\">synthesis of ribosomal subunits</span><span style=\"font-family:'Mangal'\"> takes place &rarr; (ii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) The inner membrane of a mitochondrion is folded into finger-like projections called </span><span style=\"font-weight:bold;font-family:'Mangal'\">cristae</span><span style=\"font-family:'Mangal'\">, which </span><span style=\"font-weight:bold;font-family:'Mangal'\">increase the surface area for chemical reactions and facilitate energy production</span><span style=\"font-family:'Mangal'\"> &rarr; (iv).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Leucoplasts</span><span style=\"font-family:'Mangal'\"> are colourless plastids that </span><span style=\"font-weight:bold;font-family:'Mangal'\">store food material such as starch, oils or proteins</span><span style=\"font-family:'Mangal'\"> (e.g. starch in potato cells) &rarr; (i).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lysosomes</span><span style=\"font-family:'Mangal'\"> are single membrane-bound sacs filled with </span><span style=\"font-weight:bold;font-family:'Mangal'\">enzymes that break down unwanted proteins, carbohydrates, fats and even damaged parts of the cell</span><span style=\"font-family:'Mangal'\"> &rarr; (iii).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-(ii), (b)-(iv), (c)-(i), (d)-(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bus moving at 72 km/h enters a speed-limit zone and the driver slows it down uniformly to 54 km/h in 20 s. The acceleration of the bus and the distance it travels during these 20 s are respectively:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.9 m/s² and 350 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.25 m/s² and 400 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+0.25 m/s² and 300 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−0.25 m/s² and 350 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Convert the velocities to SI units: u = 72 km/h = (72 × 1000) / 3600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 m/s</span><span style=\"font-family:'Mangal'\"> and v = 54 km/h = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average acceleration a = (v − u)/t = (15 − 20) / 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−0.25 m/s²</span><span style=\"font-family:'Mangal'\">; the negative sign shows that the acceleration is opposite to the direction of velocity (the bus is slowing down).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Distance travelled with constant acceleration: s = ut + ½at² = 20 × 20 + ½ × (−0.25) × 20² = 400 − 50 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">350 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: s = (average velocity) × t = ½(20 + 15) × 20 = 17.5 × 20 = 350 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the acceleration is −0.25 m/s² and the distance is 350 m </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध धसपनोcपiयn यी ंधपोिस:1. Mधनcहनद iौ यृपोinधक ीनयं iपौ यनध cinnोृोन (HgS) ृद ुधोपing in ोiन ोियnध, ृधcोहौध पुध यसiकधौ यी ंधपोिस ियथ in पुध ोcपiॅiपद ौधनiधौ cोn ृध नधकहcधक पय पुध ंधपोि ृद ुधोपing.2. Sयकiहं, ंोgnधौiहं ोnक cोिciहं ोनध यृपोinधक ृद पुध िधधcपनियदौiौ यी पुधiन ंियपधn cुियनiकधौ, in थुicु पुध ंधपोि iौ कधूयौiपधक ोप पुध cोपुयकध.3. Aिहंiniहं cोn ृध यृपोinधक ीनयं ोिहंiniहं यसiकध ृद ुधोपing iप थiपु cोनृयn, ृधcोहौध cोनृयn ुोौ ो gनधोपधन ोीीiniपद ीयन यसदgधn पुोn ोिहंiniहं.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Metals low in the activity series are very unreactive, and their </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxides can be reduced to metals by heating alone</span><span style=\"font-family:'Mangal'\">: cinnabar is first converted to mercuric oxide, 2HgS + 3O₂ → 2HgO + 2SO₂, and on further heating 2HgO → 2Hg + O₂ → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Highly reactive metals are obtained by electrolytic reduction: </span><span style=\"font-weight:bold;font-family:'Mangal'\">sodium, magnesium and calcium</span><span style=\"font-family:'Mangal'\"> are obtained by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">electrolysis of their molten chlorides</span><span style=\"font-family:'Mangal'\">, with the </span><span style=\"font-weight:bold;font-family:'Mangal'\">metal deposited at the cathode</span><span style=\"font-family:'Mangal'\"> and chlorine liberated at the anode → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carbon cannot reduce the oxides of sodium, magnesium, calcium and aluminium</span><span style=\"font-family:'Mangal'\">, because these metals have </span><span style=\"font-weight:bold;font-family:'Mangal'\">more affinity for oxygen than carbon</span><span style=\"font-family:'Mangal'\">; aluminium is obtained by the electrolytic reduction of aluminium oxide → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Under clear sky conditions the maximum insolation reaching the Earth's surface is about 1 kW/m². The solar energy received by a 1 m² surface held perpendicular to the Sun's rays in one hour is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.6 × 10³ J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.0 × 10³ J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.6 × 10⁶ J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.4 × 10⁶ J</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Energy = intensity × area × time; here the intensity (insolation) is 1 kW/m² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1000 J s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−1</span><span style=\"font-weight:bold;font-family:'Mangal'\"> m</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Time = 1 hour = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3600 s</span><span style=\"font-family:'Mangal'\"> and area = 1 m².</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E = 1000 × 1 × 3600 = 3,600,000 J = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.6 × 10⁶ J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This energy is equal to </span><span style=\"font-weight:bold;font-family:'Mangal'\">one unit of electricity</span><span style=\"font-family:'Mangal'\"> (1 kWh) as shown on a household electricity bill, and is roughly the energy needed to melt 5 kg of ice and heat the water obtained to 100°C.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(The maximum insolation, 1 kW/m², is lower than the solar constant of about 1.4 kW/m² because some energy is absorbed and scattered by the atmosphere.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the energy received is 3.6 × 10⁶ J </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the combustion of carbon compounds:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Blackened bottoms of cooking vessels indicate that the air holes of the stove are blocked and fuel is being wasted.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. A flame is produced only when gaseous substances burn; this is why coal in an angithi sometimes just glows red and gives out heat without a flame.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Saturated hydrocarbons always give a clean blue flame, even when the supply of air is limited.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Gas or kerosene stoves have air inlets so that an oxygen-rich mixture burns with a clean blue flame; </span><span style=\"font-weight:bold;font-family:'Mangal'\">blackened bottoms of vessels show that the air holes are blocked and fuel is being wasted</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">A flame is produced only when gaseous substances burn</span><span style=\"font-family:'Mangal'\">; coal or charcoal in an angithi sometimes just </span><span style=\"font-weight:bold;font-family:'Mangal'\">glows red and gives out heat without a flame</span><span style=\"font-family:'Mangal'\">, while the volatile substances in wood or charcoal burn with a flame in the beginning → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Saturated hydrocarbons generally give a clean flame, but </span><span style=\"font-weight:bold;font-family:'Mangal'\">limiting the supply of air results in incomplete combustion of even saturated hydrocarbons, giving a sooty flame</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": "Tथय ृयसधौ यी ंोौौधौ 2 ाg ोnक 3 ाg ोनध ूिोcधक यn ो ीनicपiयnिधौौ ुयनप्रयnपोि ौहनीोcध ोnक cयnnधcपधक ृद ो िigुप ौपनing. A ुयनप्रयnपोि ीयनcध यी 10 N ूिहिस पुध 2 ाg ृयस ौय पुोप ृयपु ृयसधौ ंयॅध पयgधपुधन. Tुध पधnौiयn in पुध ौपनing iौ:", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 N</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Treating the two boxes and the string as a </span><span style=\"font-weight:bold;font-family:'Mangal'\">single system</span><span style=\"font-family:'Mangal'\">, the internal force (tension) need not be considered and only the external force matters: a = F/(m₁ + m₂) = 10 / (2 + 3) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The 3 kg box is pulled only by the tension T in the string, so T = m₂a = 3 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 N</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check with the 2 kg box: the net force on it is F − T = 10 − 6 = 4 N, giving a = 4 / 2 = 2 m/s², the same acceleration.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By Newton's third law the string pulls the 2 kg box backwards and the 3 kg box forwards with the same force T; analysing the boxes individually gives the same result as treating them as one system.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the tension in the string is 6 N </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match the natural source with the acid it contains:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789928759614_image002.png\" width=\"269\" height=\"116\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(iii), (d)-(i)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(ii), (d)-(i)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(iii), (d)-(i)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tamarind</span><span style=\"font-family:'Mangal'\"> contains </span><span style=\"font-weight:bold;font-family:'Mangal'\">tartaric acid</span><span style=\"font-family:'Mangal'\"> → (iv).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tomato</span><span style=\"font-family:'Mangal'\"> contains </span><span style=\"font-weight:bold;font-family:'Mangal'\">oxalic acid</span><span style=\"font-family:'Mangal'\"> → (ii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) The stinging hair of </span><span style=\"font-weight:bold;font-family:'Mangal'\">nettle</span><span style=\"font-family:'Mangal'\"> leaves inject </span><span style=\"font-weight:bold;font-family:'Mangal'\">methanoic acid</span><span style=\"font-family:'Mangal'\">, which causes a burning pain → (iii).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sour milk (curd)</span><span style=\"font-family:'Mangal'\"> contains </span><span style=\"font-weight:bold;font-family:'Mangal'\">lactic acid</span><span style=\"font-family:'Mangal'\"> → (i).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(Vinegar contains acetic acid, and orange and lemon contain citric acid.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-(iv), (b)-(ii), (c)-(iii), (d)-(i) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After a meal rich in carbohydrates, the level of sugar in a healthy person's blood rises. Which of the following correctly describes how the body responds?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pancreas releases more insulin, and less once the sugar level falls (feedback control)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The adrenal glands secrete adrenaline, which converts the extra blood sugar into fat</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The thyroid gland secretes more thyroxin, which removes sugar from the blood</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pancreas secretes insulin at a fixed rate throughout the day, regardless of the blood sugar level</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">timing and amount of hormone released are regulated by feedback mechanisms</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the sugar level in the blood rises, this is </span><span style=\"font-weight:bold;font-family:'Mangal'\">detected by the cells of the pancreas</span><span style=\"font-family:'Mangal'\">, which respond by </span><span style=\"font-weight:bold;font-family:'Mangal'\">producing more insulin</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">As the </span><span style=\"font-weight:bold;font-family:'Mangal'\">blood sugar level falls, insulin secretion is reduced</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If insulin is not secreted in proper amounts the blood sugar level rises, causing many harmful effects, which is why some diabetic patients are given insulin injections; adrenaline and thyroxin do not regulate blood sugar in this way, and insulin is not secreted at a fixed rate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the response is the feedback-regulated secretion of insulin by the pancreas </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Lichens are used as natural bioindicators to measure air quality.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): A lichen is a symbiotic association in which the fungal partner provides protection while the algal partner photosynthesises and provides food.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Lichens are natural bioindicators</span><span style=\"font-family:'Mangal'\"> used to measure air quality, because they </span><span style=\"font-weight:bold;font-family:'Mangal'\">change colour with air pollutants</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Lichens are biologically </span><span style=\"font-weight:bold;font-family:'Mangal'\">symbiotic</span><span style=\"font-family:'Mangal'\">: one partner is an </span><span style=\"font-weight:bold;font-family:'Mangal'\">autotrophic alga</span><span style=\"font-family:'Mangal'\"> and the other a </span><span style=\"font-weight:bold;font-family:'Mangal'\">heterotrophic fungus</span><span style=\"font-family:'Mangal'\">; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fungal partner provides protection</span><span style=\"font-family:'Mangal'\"> while the </span><span style=\"font-weight:bold;font-family:'Mangal'\">algal partner photosynthesises and provides food</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But R describes the composition of a lichen; it does not explain why lichens indicate air quality (that is because they respond to pollutants by changing colour).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a house, an electric iron, a room heater and a geyser are all plugged into a single socket through a multi-plug. After a few minutes the fuse wire of that circuit melts and the supply is cut off. The most likely reason is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A short circuit occurred because the live wire came into direct contact with the neutral wire</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The supply voltage dropped below 220 V, so the appliances drew less current</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The earth wire carried the current of all three appliances and heated the fuse</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Overloading: connecting too many appliances to a single socket made the current exceed the safe limit, and the Joule heating melted the fuse and broke the circuit</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electric fuse is an important component of all domestic circuits; it </span><span style=\"font-weight:bold;font-family:'Mangal'\">prevents damage to appliances and the circuit due to overloading</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Overloading is sometimes caused by connecting too many appliances to a single socket</span><span style=\"font-family:'Mangal'\">; here three high-power appliances on one socket make the current exceed the rating of the circuit.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the current exceeds the safe limit, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Joule heating that takes place in the fuse melts it, breaking the electric circuit</span><span style=\"font-family:'Mangal'\"> and cutting off the supply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A short circuit needs direct contact between the live and neutral wires, a voltage drop would reduce the current, and the earth wire normally carries no current, so A, B and C are wrong.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the fuse melted because of overloading </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ ोृयहप पुध िधधcपनicोि नधौiौपiॅiपद यी ौहृौपोncधौ ोप 20°C:1. Siिॅधन ुोौ पुध ियथधौप नधौiौपiॅiपद (1.60 × 10−8 Ω ं) ोंयng ंधपोिस, ौय iप iौ पुध ृधौप cयnकहcपयन.2. Nicुनयंध, ोn ोिियद यी nicािध, cुनयंiहं, ंोngोnधौध ोnक iनयn, ुोौ ो नधौiौपiॅiपद (100 × 10−6 Ω ं) ंहcु ुigुधन पुोn पुोप यी iपौ cयnौपiपहधnप ूहनध ंधपोिस.3. Tुध नधौiौपोncध यी ो cयnकहcपयन cुोngधौ थiपु पधंूधनोपहनध, ृहप पुध नधौiौपiॅiपद यी iपौ ंोपधनiोि कयधौ nयप.Wुicु यी पुध ौपोपधंधnपौ iौ/ोनध cयननधcप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Resistivity is a characteristic property of the material; </span><span style=\"font-weight:bold;font-family:'Mangal'\">silver (1.60 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m) has the lowest resistivity</span><span style=\"font-family:'Mangal'\"> of all metals, lower than copper (1.62 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) and aluminium (2.63 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m), so it is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">best conductor</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Nichrome</span><span style=\"font-family:'Mangal'\"> has a resistivity of </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−6</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m</span><span style=\"font-family:'Mangal'\">, far higher than nickel (6.84 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m), chromium (12.9 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m) or iron (10.0 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m); alloys generally have higher resistivity than their constituent metals, which is why heating elements are made of alloys → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Both the resistance and the resistivity of a material vary with temperature</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since the sexual act is a very intimate connection of bodies, many diseases can be sexually t yle=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Check:    savings 25, expenditure 75 → new expenditure 87, new savings 122    − 87 = 35 = 25 × 140% ✓</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the value of r is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>25    (Option B)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">5    men and 15 women can complete a task in 10 days, while 15 men and    5 women can complete it in 20 days. In how many days will 40 women    complete the task?</span></span></span></span></span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">15    days</span></span></span></span></span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">4    days</span></span></span></span></span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">30    days</span></span></span></span></span family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Selling    price of 1 mango = 28 / 25 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹1.12</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Profit    on 1 mango = 1.12 − 1 = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>₹0.12</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Profit    % = 0.12 / 1 × 100% = </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>12%</b></span></span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0.03in\">    <span><span style=\"font-family:'Mangal'\"><span style=\"font-size:12pt\"><span><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Shortcut:    profit % = (CP articles − SP articles) / SP articles × 100% =    (28 − 25) / 25 × 100% = 12%</span></span></span></span></span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-size:12pt\"><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">Therefore,    the profit percentage is </span></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><b>12%    (Option A)</b></span></span></span><span><span style=\"font-family:'Mangal'\"><span style=\"font-style:normal\"><span style=\"font-weight:normal\">.</span></span></span></span></span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphan
