ht:bold;font-family:'Mangal'\">(25/36)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The two present values together make up the loan.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × (5/6) + x × (25/36) = 5,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × (30 + 25)/36 = 5,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x × (55/36) = 5,500</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 5,500 × (36/55) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Check: after one year the debt is 5,500 × 120% = ₹6,600; paying ₹3,600 leaves ₹3,000, which grows to 3,000 × 120% = ₹3,600 and is cleared by the second instalment ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, each instalment is </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,600 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ravi’s monthly salary is 25% more than Suman’s monthly salary. By what per cent is Suman’s salary less than Ravi’s salary?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22.5%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18.75%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The two percentages are taken on different bases, so fix a convenient value first.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Let Suman's salary be </span><span style=\"font-weight:bold;font-family:'Mangal'\">100</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ravi's salary = 100 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">125</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the comparison is with Ravi's salary, so the base becomes 125.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Difference = 125 − 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Required percentage = (25 / 125) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: if A is x% more than B, then B is less than A by [x / (100 + x)] × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (25 / 125) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 20%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Suman's salary is less than Ravi's by </span><span style=\"font-weight:bold;font-family:'Mangal'\">20% (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The table below shows the number of students who appeared for and passed a school examination in three years.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790075968408_image002.png\" width=\"442\" height=\"88\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In which year was the pass percentage the highest, and what was that percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2024, 77%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025, 80%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2023, 70%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2024, 80%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Find the pass percentage of each year separately.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pass percentage = (students passed / students appeared) × 100%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2023: (560 / 800) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">70%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2024: (693 / 900) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">77%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2025: (600 / 750) × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Comparing 70%, 77% and 80%, the largest is </span><span style=\"font-weight:bold;font-family:'Mangal'\">80%</span><span style=\"font-family:'Mangal'\">, which belongs to 2025.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the pass percentage was highest in </span><span style=\"font-weight:bold;font-family:'Mangal'\">2025, 80% (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A circular garden has a radius of 21 m. A path 3.5 m wide is laid outside the garden all along its boundary. What is the area of the path? (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">462 m²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">484 m²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">500.5 m²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">517 m²</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The path is the ring between two circles with the same centre.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Inner radius = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Outer radius = 21 + 3.5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24.5 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Area of the path = π × (outer radius² − inner radius²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22/7) × (24.5² − 21²)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22/7) × (600.25 − 441)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (22/7) × 159.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">500.5 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: outer² − inner² = (24.5 + 21)(24.5 − 21) = 45.5 × 3.5 = 159.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the area of the path is </span><span style=\"font-weight:bold;font-family:'Mangal'\">500.5 m² (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A block of mass 25 kg lying on a floor is pushed with a horizontal force of 60 N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The floor offers a force of friction of 10 N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The acceleration of the block is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.4 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.4 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.8 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The applied force and the force of friction act in opposite directions, so the net force is their difference.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Net force F = 60 − 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 N</span><span style=\"font-family:'Mangal'\">, acting in the direction of the push.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By Newton's second law, F = ma, so a = F/m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a = 50 / 25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">, in the direction of the net force.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the acceleration of the block is 2 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the nucleus of a cell:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The nuclear membrane is double-layered and has pores.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Chromosomes are seen as rod-shaped structures only when the cell is about to divide.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The functional segments of DNA are called nucleoids.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The nucleus has a </span><span style=\"font-weight:bold;font-family:'Mangal'\">double-layered covering</span><span style=\"font-family:'Mangal'\"> called the nuclear membrane, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">pores</span><span style=\"font-family:'Mangal'\"> in it allow material to pass between the nucleus and the cytoplasm → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In a cell that is not dividing, the DNA lies as an entangled mass of chromatin; the </span><span style=\"font-weight:bold;font-family:'Mangal'\">chromatin gets organised into rod-shaped chromosomes only when the cell is about to divide</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The functional segments of DNA are called </span><span style=\"font-weight:bold;font-family:'Mangal'\">genes</span><span style=\"font-family:'Mangal'\">; a nucleoid is the region of a prokaryotic cell that holds its genetic material → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electric iron operating at 220 V consumes energy at a rate of 840 W when the heating is at its maximum. What is the resistance of the coil used in the iron?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57.6 Ω</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55.6 Ω</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50.6 Ω</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">47.6 Ω</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An electric iron is a purely resistive appliance, so the electrical energy supplied to it is given out entirely as heat.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The power consumed is P = VI, so the current drawn is I = P/V.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I = 840 / 220 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.82 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By Ohm's law the resistance of the coil is R = V/I.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = 220 / 3.82 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">57.6 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the resistance of the coil is 57.6 Ω </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Two magnetic field lines can cross each other at a point.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): The direction of the magnetic field at a point is the direction in which the north pole of a compass needle placed at that point points.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">If two field lines crossed at a point, there would be </span><span style=\"font-weight:bold;font-family:'Mangal'\">two different directions of the magnetic field at that one point</span><span style=\"font-family:'Mangal'\">, and a compass needle placed there would have to point two ways at once; that is impossible, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">field lines never cross</span><span style=\"font-family:'Mangal'\"> → A is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The direction of the magnetic field at a point is indeed taken as the direction in which the </span><span style=\"font-weight:bold;font-family:'Mangal'\">north pole of a compass needle placed there points</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R is in fact the very statement that rules out the crossing of two field lines.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is false but R is true </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The atomic number of sodium is 11. When a sodium atom loses its only valence electron, the ion so formed has:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 protons and 10 electrons</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 protons and 11 electrons</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 protons and 11 electrons</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 protons and 10 electrons</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The atomic number of sodium is 11, so a sodium atom has </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 protons</span><span style=\"font-family:'Mangal'\"> and </span><span style=\"font-weight:bold;font-family:'Mangal'\">11 electrons</span><span style=\"font-family:'Mangal'\">, with only one electron in its valence shell.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Losing an electron does not change the nucleus, so the number of </span><span style=\"font-weight:bold;font-family:'Mangal'\">protons stays 11</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only the electrons are lost, so the number of </span><span style=\"font-weight:bold;font-family:'Mangal'\">electrons falls to 10</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">With one positive charge more than the negative charges, the particle becomes the sodium cation Na+; cations and anions together are called ions.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the ion has 11 protons and 10 electrons </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match List I with List II:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790142992894_image001.png\" style=\"width: 808px; height: 200px;\" /></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the correct answer:</span></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(iv), (c)-(i), (d)-(iii)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(ii), (c)-(i), (d)-(iii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Root hair</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Absorption of water and minerals</span><span style=\"font-family:'Mangal'\">: these hair-like projections of the epidermal cells of the root increase the surface area for absorption from the soil.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Stomata</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gaseous exchange and transpiration</span><span style=\"font-family:'Mangal'\">: these pores in the epidermis of a leaf let gases in and out and let water vapour escape.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Cuticle</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Reduces loss of water</span><span style=\"font-family:'Mangal'\">: the waxy layer of cutin over the epidermis is thick in plants of dry habitats and checks water loss.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Xylem</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Transport of water and minerals</span><span style=\"font-family:'Mangal'\">: it carries water and minerals from the roots to the other parts of the plant.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-(ii), (b)-(i), (c)-(iv), (d)-(iii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The refractive index of water is 1.33. Taking the speed of light in air as 3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s, the speed of light in water is nearly:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.26 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.99 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.33 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.00 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The refractive index of a medium with respect to air is the ratio of the speed of light in air to the speed of light in that medium.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">n = (speed of light in air) / (speed of light in water)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Substituting the given values,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.33 = (3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">) / v</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">v = (3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">) / 1.33 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2.26 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The speed is smaller than in air, as it must be, because water is optically denser than air.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the speed of light in water is nearly 2.26 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): The path of a beam of light is seen when it passes through chalk powder mixed in water, but not when it passes through salt dissolved in water.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): The particles of a suspension are large enough to scatter a beam of light, while the particles of a solution are not.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When a beam of light is passed through chalk powder mixed in water, its path is </span><span style=\"font-weight:bold;font-family:'Mangal'\">clearly seen</span><span style=\"font-family:'Mangal'\">, while through a salt solution the path is </span><span style=\"font-weight:bold;font-family:'Mangal'\">not seen</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The particles of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">suspension are large enough to scatter light</span><span style=\"font-family:'Mangal'\">, so the beam becomes visible; the particles of a </span><span style=\"font-weight:bold;font-family:'Mangal'\">solution are too small</span><span style=\"font-family:'Mangal'\"> to scatter it → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The scattering by the large particles is exactly the reason why the beam is seen in one case and not in the other, so R explains A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This scattering of a beam of light by particles, which makes its path visible, is called the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Tyndall effect</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A driver uses a mirror fitted on the side of the vehicle. It always gives an erect and diminished image of the traffic behind and covers a wide field of view. This mirror is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Concave</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plane</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Convex</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Plano-concave</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">convex mirror</span><span style=\"font-family:'Mangal'\"> always forms an image that is </span><span style=\"font-weight:bold;font-family:'Mangal'\">virtual, erect and smaller than the object</span><span style=\"font-family:'Mangal'\">, wherever the object is placed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Because the image is diminished, a convex mirror can show a </span><span style=\"font-weight:bold;font-family:'Mangal'\">much wider field of view</span><span style=\"font-family:'Mangal'\"> than a plane mirror of the same size, which is what a driver needs.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is why convex mirrors are used as the rear-view, or wing, mirrors fitted on the sides of vehicles.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">concave mirror</span><span style=\"font-family:'Mangal'\"> would give an enlarged image for a near object and an inverted image for a distant one, and a </span><span style=\"font-weight:bold;font-family:'Mangal'\">plane mirror</span><span style=\"font-family:'Mangal'\"> would show the same size but a far narrower view.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the mirror is convex </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The tendril of a climbing plant coils around a support and bends sharply without breaking. The living tissue whose corners are unevenly thickened with pectin and which gives this flexibility is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sclerenchyma</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Collenchyma</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Parenchyma</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Xylem</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Collenchyma</span><span style=\"font-family:'Mangal'\"> is made of living cells whose </span><span style=\"font-weight:bold;font-family:'Mangal'\">corners are unevenly thickened</span><span style=\"font-family:'Mangal'\"> by the deposition of </span><span style=\"font-weight:bold;font-family:'Mangal'\">pectin</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pectin gives a rubber-like flexibility, so collenchyma provides support while still allowing stems and tendrils to bend without breaking.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Sclerenchyma</span><span style=\"font-family:'Mangal'\"> cells are mostly dead and have thick lignified walls, so they make a part stiff and brittle rather than flexible.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Parenchyma</span><span style=\"font-family:'Mangal'\"> has thin-walled, loosely packed cells and gives little support, while </span><span style=\"font-weight:bold;font-family:'Mangal'\">xylem</span><span style=\"font-family:'Mangal'\"> is a conducting tissue for water and minerals.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the tissue is collenchyma </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Match List I with List II:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790142992894_image002.png\" style=\"width: 808px; height: 200px;\" /></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Select the correct answer:</span></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(ii), (d)-(iv)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(ii), (c)-(i), (d)-(iv)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(i), (c)-(ii), (d)-(iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Insulin</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pancreas</span><span style=\"font-family:'Mangal'\">: it regulates the level of sugar in the blood.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Thyroxin</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Thyroid gland</span><span style=\"font-family:'Mangal'\">: it regulates metabolism so that growth takes place in a balanced way.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Testosterone</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Testes</span><span style=\"font-family:'Mangal'\">: it brings about the changes of puberty in boys.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Growth hormone</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pituitary gland</span><span style=\"font-family:'Mangal'\">: it stimulates growth in all the organs of the body.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct matching is (a)-(iii), (b)-(i), (c)-(ii), (d)-(iv) </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Iron reacts with steam to give Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> and hydrogen. The balanced equation for this reaction is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3Fe + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 3H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Fe + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3Fe + 3H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3Fe + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">An equation is balanced when the number of atoms of each element is the same on both sides.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Start with Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">, the formula with the largest number of atoms, and balance oxygen first: 4 oxygen atoms on the right need </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> on the left.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Now the left side has 8 hydrogen atoms, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> is needed on the right.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Iron is balanced last: 3 iron atoms on the right need </span><span style=\"font-weight:bold;font-family:'Mangal'\">3Fe</span><span style=\"font-family:'Mangal'\"> on the left, giving 3Fe + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Counting again: Fe 3 and 3, H 8 and 8, O 4 and 4, so the equation is balanced.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the balanced equation is 3Fe + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O → Fe</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">O</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\"> + 4H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about groups of plants:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Bryophytes have true roots, stems and leaves.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Pteridophytes have vascular tissues but do not produce seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. In gymnosperms the seeds are enclosed inside fruits.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Bryophytes such as mosses and liverworts have only </span><span style=\"font-weight:bold;font-family:'Mangal'\">root-like rhizoids</span><span style=\"font-family:'Mangal'\"> and simple stem-like and leaf-like parts, not true roots, stems and leaves → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. In a pteridophyte such as a fern the stem shows </span><span style=\"font-weight:bold;font-family:'Mangal'\">xylem and phloem</span><span style=\"font-family:'Mangal'\">, which carry water and food, and these plants </span><span style=\"font-weight:bold;font-family:'Mangal'\">do not produce seeds</span><span style=\"font-family:'Mangal'\">; they still need water for reproduction → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The name gymnosperm comes from words meaning </span><span style=\"font-weight:bold;font-family:'Mangal'\">naked seed</span><span style=\"font-family:'Mangal'\">, so their seeds are not enclosed in fruits; seeds enclosed in fruits are the mark of </span><span style=\"font-weight:bold;font-family:'Mangal'\">angiosperms</span><span style=\"font-family:'Mangal'\"> → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 2 is correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">While opening a bottle cap using a bottle opener, the resistance offered by the cap acts as the ______.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Effort</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Energy source</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Load</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Machine</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bottle opener is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">lever</span><span style=\"font-family:'Mangal'\">, and every lever has three parts: the </span><span style=\"font-weight:bold;font-family:'Mangal'\">fulcrum</span><span style=\"font-family:'Mangal'\">, the </span><span style=\"font-weight:bold;font-family:'Mangal'\">load</span><span style=\"font-family:'Mangal'\"> and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">effort</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">load</span><span style=\"font-family:'Mangal'\"> is the force that has to be overcome by the lever, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">effort</span><span style=\"font-family:'Mangal'\"> is the force we apply on it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">While opening a bottle, the hand applies the effort, the edge of the opener resting on the cap acts as the fulcrum, and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">resistance offered by the cap is the load</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The opener is the machine itself, so it cannot be the load, and a lever is not a source of energy.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the resistance offered by the cap acts as the load </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): Both parents contribute equally to the DNA of the progeny.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Mendel worked out the main rules of inheritance through his experiments on garden peas.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Since a trait of the progeny can be determined by either parent, </span><span style=\"font-weight:bold;font-family:'Mangal'\">both parents must contribute equally to the DNA of the progeny</span><span style=\"font-family:'Mangal'\">, and each plant therefore carries two sets of all genes, one from each parent → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Mendel did work out the main rules of inheritance from his experiments on garden peas</span><span style=\"font-family:'Mangal'\">, which is a correct statement in itself → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">But R only names the scientist and the plant he used; it does not explain why the contribution of the two parents is equal, which follows from each germ cell carrying one set of genes.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true but R is not the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a flower, the pollen grains produced by the stamen are received by which part of the pistil, and the egg cell lies inside which structure?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Style and ovary</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stigma and ovule</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ovary and style</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stigma and anther</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">stamen</span><span style=\"font-family:'Mangal'\"> is the male part of a flower and produces the yellowish </span><span style=\"font-weight:bold;font-family:'Mangal'\">pollen grains</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The pistil is the female part; its terminal part, which may be sticky, is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">stigma</span><span style=\"font-family:'Mangal'\">, and pollen grains land on it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The swollen bottom part of the pistil is the ovary, and it contains the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ovules</span><span style=\"font-family:'Mangal'\">; </span><span style=\"font-weight:bold;font-family:'Mangal'\">each ovule has an egg cell</span><span style=\"font-family:'Mangal'\"> in it.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">After the pollen lands on the stigma, a tube grows down through the style so that the male germ-cell can reach the egg cell inside the ovule.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the two parts are the stigma and the ovule </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): A great deal of energy is lost when green plants are eaten by the primary consumers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): Of the energy taken in, much is lost as heat and some is spent on digestion and on doing work, and only the rest goes towards growth and reproduction.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When green plants are eaten by the primary consumers, </span><span style=\"font-weight:bold;font-family:'Mangal'\">a great deal of the energy is lost</span><span style=\"font-family:'Mangal'\"> and only a small part is passed on to the next level → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Of the energy an organism takes in, </span><span style=\"font-weight:bold;font-family:'Mangal'\">a great deal is lost as heat, some goes into digestion and into doing work, and only the rest goes towards growth and reproduction</span><span style=\"font-family:'Mangal'\"> → R is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is exactly these losses that make the energy available at each higher level smaller, so R is the reason for A.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This is also why a food chain in nature rarely has more than three or four trophic levels.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, both A and R are true and R is the correct explanation of A </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following metals does NOT react with oxygen even at a high temperature?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Iron</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Aluminium</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Copper</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gold</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Different metals differ widely in how readily they combine with oxygen.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Gold</span><span style=\"font-family:'Mangal'\"> and silver do </span><span style=\"font-weight:bold;font-family:'Mangal'\">not react with oxygen even at high temperatures</span><span style=\"font-family:'Mangal'\">, which is why gold keeps its shine for centuries.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Iron</span><span style=\"font-family:'Mangal'\"> does not burn as a block, but iron filings sprinkled into a flame burn vigorously.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Copper</span><span style=\"font-family:'Mangal'\"> does not burn either, yet the hot metal gets coated with a black layer of copper(II) oxide, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">aluminium</span><span style=\"font-family:'Mangal'\"> forms a thin, tightly held oxide layer on its surface.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, gold does not react with oxygen even at a high temperature </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about a velocity-time graph drawn for motion along a straight line:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. A straight line parallel to the time axis means that the acceleration is zero.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The slope of the line gives the acceleration.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The area between the line and the time axis gives the change in acceleration.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. A line </span><span style=\"font-weight:bold;font-family:'Mangal'\">parallel to the time axis</span><span style=\"font-family:'Mangal'\"> means the velocity does not change with time, so the slope is zero and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">acceleration is zero</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The slope of a graph gives the rate of change of the quantity on the Y-axis, so on a velocity-time graph the </span><span style=\"font-weight:bold;font-family:'Mangal'\">slope gives the acceleration</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The area between the line and the time axis gives the </span><span style=\"font-weight:bold;font-family:'Mangal'\">displacement</span><span style=\"font-family:'Mangal'\"> of the object, not any change in acceleration → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What type of solution causes water to move out of a cell through the plasma membrane, making the cell shrink?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dilute solution</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hypertonic solution</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hypotonic solution</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Isotonic solution</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The movement of water through a selectively permeable membrane is called </span><span style=\"font-weight:bold;font-family:'Mangal'\">osmosis</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water always moves from the side where it is present in a larger amount and the solute in a smaller amount, towards the side where the solute is more concentrated.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a </span><span style=\"font-weight:bold;font-family:'Mangal'\">hypertonic solution</span><span style=\"font-family:'Mangal'\"> the solute concentration outside the cell is </span><span style=\"font-weight:bold;font-family:'Mangal'\">higher</span><span style=\"font-family:'Mangal'\"> than inside, so water moves out of the cell and the cell shrinks.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a hypotonic solution the outside is more dilute, so water enters and the cell swells; in an isotonic solution the two concentrations are equal, so there is no net movement of water.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the cell shrinks in a hypertonic solution </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A bus moving in a straight line at 54 km/h is brought to rest in 6 s by applying the brakes. The magnitude of its average acceleration is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">First change the initial velocity to SI units.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">u = 54 km/h = (54 × 1000) / 3600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">, and the final velocity v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Average acceleration = (final velocity − initial velocity) / time interval</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (0 − 15) / 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2.5 m/s</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The minus sign only shows that the acceleration is opposite to the direction of motion, so its magnitude is 2.5 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the magnitude of the average acceleration is 2.5 m/s</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Baking soda is sodium hydrogencarbonate.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Washing soda is Na</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">O and is a basic salt.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Bleaching powder is obtained by the action of chlorine on dry slaked lime.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Baking soda is </span><span style=\"font-weight:bold;font-family:'Mangal'\">sodium hydrogencarbonate, NaHCO</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, made from sodium chloride, water, carbon dioxide and ammonia → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Washing soda is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Na</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">CO</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">3</span><span style=\"font-weight:bold;font-family:'Mangal'\">.10H</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:sub;font-family:'Mangal'\">2</span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\"> and it is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">basic salt</span><span style=\"font-family:'Mangal'\">, used in the glass, soap and paper industries and as a cleaning agent at home → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bleaching powder</span><span style=\"font-family:'Mangal'\"> is produced by the action of </span><span style=\"font-weight:bold;font-family:'Mangal'\">chlorine on dry slaked lime</span><span style=\"font-family:'Mangal'\">, and the chlorine itself comes from the electrolysis of brine → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, all three statements are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sample of copper sulfate carries a small amount of an insoluble impurity. To obtain large, shiny, well-shaped blue crystals from it, the hot saturated solution should be:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Filtered and then cooled slowly</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cooled quickly in ice-cold water</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Boiled until it dries up</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Stirred hard while it cools</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The hot saturated solution is </span><span style=\"font-weight:bold;font-family:'Mangal'\">filtered while it is still hot</span><span style=\"font-family:'Mangal'\"> so that the insoluble impurity is left behind on the filter paper.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The clear filtrate is then </span><span style=\"font-weight:bold;font-family:'Mangal'\">cooled slowly without disturbing it</span><span style=\"font-family:'Mangal'\">, which gives the particles time to come together in a regular arrangement.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Slow, undisturbed cooling therefore produces </span><span style=\"font-weight:bold;font-family:'Mangal'\">large, shiny, well-shaped blue crystals</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rapid cooling in ice-cold water or stirring gives many small, poorly formed crystals, and boiling the solution to dryness leaves the impurity behind with the solid.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the solution should be filtered and then cooled slowly </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the human female reproductive system:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. One egg is produced every month by one of the ovaries.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The fertilised egg divides to form a ball of cells called an embryo.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The embryo is implanted in the lining of the oviduct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>
