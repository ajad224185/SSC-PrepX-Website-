", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The ovaries of a girl already hold thousands of immature eggs at birth, and after puberty </span><span style=\"font-weight:bold;font-family:'Mangal'\">one egg is produced every month by one of the two ovaries</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The fertilised egg, the zygote, starts dividing at once and forms a </span><span style=\"font-weight:bold;font-family:'Mangal'\">ball of cells called an embryo</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. The embryo is carried into the uterus and is </span><span style=\"font-weight:bold;font-family:'Mangal'\">implanted in the lining of the uterus</span><span style=\"font-family:'Mangal'\">, whose thick, well-supplied lining nourishes it; the oviduct is only the passage in which fertilisation takes place → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A boy stretches the rubber band of a slingshot and holds it stretched. The energy stored in the band at this moment is due to its:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Motion</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Temperature</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Change of shape</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Mass</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Work has to be done on the band to stretch it, and this work is stored in the band while it stays stretched.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The band is at rest in the hand, so the stored energy cannot be kinetic energy; it is stored because the band has been </span><span style=\"font-weight:bold;font-family:'Mangal'\">deformed, that is, its shape has been changed</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Energy stored in an object because of its deformation, or in a system of objects because of their relative positions, is called </span><span style=\"font-weight:bold;font-family:'Mangal'\">potential energy</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When the band is released, the internal forces bring it back to its original shape and the stored energy is passed on as </span><span style=\"font-weight:bold;font-family:'Mangal'\">kinetic energy</span><span style=\"font-family:'Mangal'\"> to the stone.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the stored energy is due to the change of shape </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. All the interacting organisms of an area, together with the non-living constituents, form an ecosystem.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Organisms that make organic compounds from inorganic substances using sunlight are called consumers.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. A garden is an ecosystem.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">All the interacting organisms in an area together with the non-living constituents of the environment form an ecosystem</span><span style=\"font-family:'Mangal'\">, the living part being its biotic components → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Organisms that make organic compounds such as sugar and starch from inorganic substances using the energy of sunlight in the presence of chlorophyll are the </span><span style=\"font-weight:bold;font-family:'Mangal'\">producers</span><span style=\"font-family:'Mangal'\">, not the consumers; consumers depend on the food already made → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. A garden has grasses, trees and flowering plants along with frogs, insects and birds, which interact with one another and are affected by the non-living surroundings, so a </span><span style=\"font-weight:bold;font-family:'Mangal'\">garden is an ecosystem</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Arteries have thick elastic walls, while veins carry valves along their length. The valves are needed in veins because:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They carry oxygenated blood</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Their walls are one cell thick</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They are thicker than arteries</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Blood in them is at low pressure</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Blood leaves the heart under </span><span style=\"font-weight:bold;font-family:'Mangal'\">high pressure</span><span style=\"font-family:'Mangal'\">, so </span><span style=\"font-weight:bold;font-family:'Mangal'\">arteries</span><span style=\"font-family:'Mangal'\"> need </span><span style=\"font-weight:bold;font-family:'Mangal'\">thick, elastic walls</span><span style=\"font-family:'Mangal'\"> to take that pressure.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">By the time blood has passed through the capillaries of an organ and entered the </span><span style=\"font-weight:bold;font-family:'Mangal'\">veins</span><span style=\"font-family:'Mangal'\">, it is </span><span style=\"font-weight:bold;font-family:'Mangal'\">no longer under high pressure</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">At such a low pressure the blood could easily slip backwards, so veins carry </span><span style=\"font-weight:bold;font-family:'Mangal'\">valves</span><span style=\"font-family:'Mangal'\"> that let the blood flow only towards the heart.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The walls of veins therefore need not be thick; it is the </span><span style=\"font-weight:bold;font-family:'Mangal'\">capillaries</span><span style=\"font-family:'Mangal'\"> whose walls are one cell thick, and the blood in most veins is deoxygenated.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the valves are needed because the blood in the veins is at low pressure </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about respiration in human beings:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Glucose is first broken down into pyruvate in the cytoplasm.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The break-down of pyruvate using oxygen takes place in the mitochondria.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Carbon dioxide is carried in the blood mainly by haemoglobin.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The first step of every respiratory pathway is the break-down of </span><span style=\"font-weight:bold;font-family:'Mangal'\">glucose, a six-carbon molecule, into pyruvate, a three-carbon molecule, in the cytoplasm</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Pyruvate is then broken down in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">mitochondria in the presence of oxygen</span><span style=\"font-family:'Mangal'\">, giving carbon dioxide and water; this is aerobic respiration → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Carbon dioxide is more soluble in water than oxygen</span><span style=\"font-family:'Mangal'\">, so it is carried mostly in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">dissolved form</span><span style=\"font-family:'Mangal'\"> in the blood; haemoglobin is the pigment that carries oxygen → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In which of the following animal groups does the body carry numerous pores through which water flows continuously, bringing food and oxygen to the cells?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Cnidaria</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Annelida</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Porifera</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Nematoda</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The name </span><span style=\"font-weight:bold;font-family:'Mangal'\">Porifera</span><span style=\"font-family:'Mangal'\"> itself means </span><span style=\"font-weight:bold;font-family:'Mangal'\">pore-bearers</span><span style=\"font-family:'Mangal'\">, and sponges belong to this group.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Water flows in continuously through the many pores of a sponge's body, </span><span style=\"font-weight:bold;font-family:'Mangal'\">bringing food particles and oxygen to the individual cells and carrying the waste away</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sponges stay fixed at one place in water, so this flow of water takes the place of any search for food.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Cnidarians</span><span style=\"font-family:'Mangal'\"> such as hydra catch prey with tentacles, </span><span style=\"font-weight:bold;font-family:'Mangal'\">annelids</span><span style=\"font-family:'Mangal'\"> such as the earthworm have a segmented body, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">nematodes</span><span style=\"font-family:'Mangal'\"> are cylindrical roundworms.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the group is Porifera </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A compass is placed at a fixed point near a long straight wire that carries current. When the current in the wire is increased, the deflection of the compass needle:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Increases</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Decreases</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Becomes zero</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reverses its direction</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A current-carrying wire produces a magnetic field around itself, and it is this field that turns the compass needle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">magnitude of the magnetic field at a given point increases as the current through the wire increases</span><span style=\"font-family:'Mangal'\">, so the needle is turned through a larger angle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The deflection therefore </span><span style=\"font-weight:bold;font-family:'Mangal'\">increases</span><span style=\"font-family:'Mangal'\"> when the current is increased, and it decreases when the compass is moved farther from the wire at the same current.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The deflection would be reversed only if the </span><span style=\"font-weight:bold;font-family:'Mangal'\">direction</span><span style=\"font-family:'Mangal'\"> of the current were reversed, which is not the case here.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the deflection of the needle increases </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about carbon compounds:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. They have low melting points and low boiling points.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. They are generally poor conductors of electricity.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Carbon attains a stable configuration by losing its four valence electrons.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Carbon compounds such as methane and ethanol melt and boil at </span><span style=\"font-weight:bold;font-family:'Mangal'\">low temperatures</span><span style=\"font-family:'Mangal'\">, which shows that the forces of attraction </span><span style=\"font-weight:bold;font-family:'Mangal'\">between their molecules</span><span style=\"font-family:'Mangal'\"> are weak → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Since the atoms in them are joined by shared pairs of electrons and no ions are formed, carbon compounds are </span><span style=\"font-weight:bold;font-family:'Mangal'\">poor conductors of electricity</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Carbon has four valence electrons, but </span><span style=\"font-weight:bold;font-family:'Mangal'\">losing all four</span><span style=\"font-family:'Mangal'\"> would leave a nucleus of six protons holding only two electrons, which needs far too much energy; carbon therefore </span><span style=\"font-weight:bold;font-family:'Mangal'\">shares</span><span style=\"font-family:'Mangal'\"> its valence electrons → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following symbols of elements is written correctly?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO for cobalt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ag for argon</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Zn for zinc</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pb for potassium</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The first letter of the symbol of an element is always a </span><span style=\"font-weight:bold;font-family:'Mangal'\">capital letter</span><span style=\"font-family:'Mangal'\"> and the second letter, if there is one, is always a </span><span style=\"font-weight:bold;font-family:'Mangal'\">small letter</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Zn</span><span style=\"font-family:'Mangal'\"> is the correct symbol of </span><span style=\"font-weight:bold;font-family:'Mangal'\">zinc</span><span style=\"font-family:'Mangal'\">, written with a capital Z and a small n.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">CO</span><span style=\"font-family:'Mangal'\"> is wrong for cobalt, whose symbol is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Co</span><span style=\"font-family:'Mangal'\">; written as CO it would read as carbon monoxide, which is a compound.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ag</span><span style=\"font-family:'Mangal'\"> is the symbol of </span><span style=\"font-weight:bold;font-family:'Mangal'\">silver</span><span style=\"font-family:'Mangal'\">, while argon is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ar</span><span style=\"font-family:'Mangal'\">; and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Pb</span><span style=\"font-family:'Mangal'\"> is the symbol of </span><span style=\"font-weight:bold;font-family:'Mangal'\">lead</span><span style=\"font-family:'Mangal'\">, while potassium is </span><span style=\"font-weight:bold;font-family:'Mangal'\">K</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, Zn for zinc is written correctly </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the band of colours obtained when white light passes through a glass prism:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Red light bends the least and violet light bends the most.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The order of the colours is remembered by the word VIBGYOR.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Once formed, the band of colours cannot be combined back into white light.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. Different colours bend through </span><span style=\"font-weight:bold;font-family:'Mangal'\">different angles</span><span style=\"font-family:'Mangal'\"> in a prism; </span><span style=\"font-weight:bold;font-family:'Mangal'\">red bends the least and violet the most</span><span style=\"font-family:'Mangal'\">, which is why the colours separate → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The order of the colours in the band is Violet, Indigo, Blue, Green, Yellow, Orange and Red, remembered by the word </span><span style=\"font-weight:bold;font-family:'Mangal'\">VIBGYOR</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. If a </span><span style=\"font-weight:bold;font-family:'Mangal'\">second, inverted prism</span><span style=\"font-family:'Mangal'\"> is placed close to the first, the colours meet again and a </span><span style=\"font-weight:bold;font-family:'Mangal'\">white patch</span><span style=\"font-family:'Mangal'\"> is obtained on the screen, so white light can be recombined → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">When a person looks at a nearby object, the ciliary muscles:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Contract and make the lens thinner</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Relax and make the lens thinner</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Contract and make the lens thicker</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Relax and make the lens thicker</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The curvature of the eye lens can be changed to some extent by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ciliary muscles</span><span style=\"font-family:'Mangal'\">, and a change in curvature changes the </span><span style=\"font-weight:bold;font-family:'Mangal'\">focal length</span><span style=\"font-family:'Mangal'\"> of the lens.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">To see a nearby object clearly the eye needs a lens of </span><span style=\"font-weight:bold;font-family:'Mangal'\">shorter focal length</span><span style=\"font-family:'Mangal'\">, which means a </span><span style=\"font-weight:bold;font-family:'Mangal'\">more curved, thicker</span><span style=\"font-family:'Mangal'\"> lens.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">So the ciliary muscles </span><span style=\"font-weight:bold;font-family:'Mangal'\">contract</span><span style=\"font-family:'Mangal'\">, the lens becomes </span><span style=\"font-weight:bold;font-family:'Mangal'\">thicker</span><span style=\"font-family:'Mangal'\"> and its focal length decreases, and a sharp image is again formed on the retina.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">For a distant object the muscles relax, the lens becomes thin and its focal length increases.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the ciliary muscles contract and make the lens thicker </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about a heavy box that is being pushed along a level floor at a steady speed:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The weight of the box and the normal force from the floor balance each other.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. Friction acts on the box opposite to the direction of its motion.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. If the push is stopped, the box goes on moving at the same speed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The </span><span style=\"font-weight:bold;font-family:'Mangal'\">weight</span><span style=\"font-family:'Mangal'\"> of the box acts downward and the </span><span style=\"font-weight:bold;font-family:'Mangal'\">normal force</span><span style=\"font-family:'Mangal'\"> of the floor acts upward, perpendicular to the surface; these two are </span><span style=\"font-weight:bold;font-family:'Mangal'\">balanced</span><span style=\"font-family:'Mangal'\">, which is why the box does not sink into the floor or rise from it → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The surfaces in contact resist sliding, so the </span><span style=\"font-weight:bold;font-family:'Mangal'\">force of friction acts opposite to the motion</span><span style=\"font-family:'Mangal'\"> of the box → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Once the push is stopped, friction is the only horizontal force left, so the box </span><span style=\"font-weight:bold;font-family:'Mangal'\">slows down and comes to rest</span><span style=\"font-family:'Mangal'\">; a force has to be applied continuously to keep it moving at a steady speed → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 2 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A slice of bread kept on wet cotton in a warm, dark place shows a cottony growth after three days. Under a microscope the thread-like structures end in round sacs. These sacs contain:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Buds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Spores</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Seeds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gametes</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The cottony growth on the bread is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">mould</span><span style=\"font-family:'Mangal'\">, which is a fungus, and its thread-like structures are called hyphae.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Each hypha ends in a </span><span style=\"font-weight:bold;font-family:'Mangal'\">round sac</span><span style=\"font-family:'Mangal'\"> in which a large number of tiny </span><span style=\"font-weight:bold;font-family:'Mangal'\">spores</span><span style=\"font-family:'Mangal'\"> are formed.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Spores are light and usually single-celled, so they float easily in air currents, and they germinate into a new individual as soon as they get moisture and nutrients.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Buds</span><span style=\"font-family:'Mangal'\"> are outgrowths of the parent body, as in yeast and hydra; </span><span style=\"font-weight:bold;font-family:'Mangal'\">seeds</span><span style=\"font-family:'Mangal'\"> are formed only by seed plants, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">gametes</span><span style=\"font-family:'Mangal'\"> take part in sexual reproduction.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sacs contain spores </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Assertion (A): A sound wave travelling through air is a longitudinal wave.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Reason (R): In a sound wave the particles of the medium vibrate perpendicular to the direction in which the wave travels.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true and R is the correct explanation of A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Both A and R are true but R is not the correct explanation of A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is true but R is false</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A is false but R is true</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A sound wave travels through air as a series of </span><span style=\"font-weight:bold;font-family:'Mangal'\">compressions and rarefactions</span><span style=\"font-family:'Mangal'\">, and the particles of the air vibrate </span><span style=\"font-weight:bold;font-family:'Mangal'\">parallel</span><span style=\"font-family:'Mangal'\"> to the direction in which the wave travels; such a wave is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">longitudinal wave</span><span style=\"font-family:'Mangal'\"> → A is true.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R says the particles vibrate </span><span style=\"font-weight:bold;font-family:'Mangal'\">perpendicular</span><span style=\"font-family:'Mangal'\"> to the direction of propagation, which describes a </span><span style=\"font-weight:bold;font-family:'Mangal'\">transverse wave</span><span style=\"font-family:'Mangal'\">, not a sound wave → R is false.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Waves on the surface of water and on a stretched string are transverse; sound in air is not.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, A is true but R is false </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The average amount of solar energy received per unit time on unit area held perpendicular to the Sun rays at the top of the atmosphere is about:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.14 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">140 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.4 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">This quantity is called the </span><span style=\"font-weight:bold;font-family:'Mangal'\">solar constant</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its value is about </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.4 kilowatt per square metre</span><span style=\"font-family:'Mangal'\">, which is the same as about 1400 joule per second per square metre.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is measured at the top of the atmosphere, so it is the energy available </span><span style=\"font-weight:bold;font-family:'Mangal'\">before</span><span style=\"font-family:'Mangal'\"> any absorption, scattering or reflection takes place in the atmosphere.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The solar constant is used to work out the energy balance of the Earth and to estimate how much solar power a given area can supply.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the value is about 1.4 kW/m</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Consider the following statements about the resistance of a metal wire:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. It becomes twice as large when the length of the wire is doubled.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. It becomes larger when a thicker wire of the same material and length is used.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. Resistivity is a characteristic property of the material of the wire.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the statements is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 2 and 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">All 1, 2 and 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Only 1 and 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. The resistance of a wire is </span><span style=\"font-weight:bold;font-family:'Mangal'\">directly proportional to its length</span><span style=\"font-family:'Mangal'\">, so doubling the length </span><span style=\"font-weight:bold;font-family:'Mangal'\">doubles the resistance</span><span style=\"font-family:'Mangal'\"> and the current in the circuit falls to half → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. The resistance is </span><span style=\"font-weight:bold;font-family:'Mangal'\">inversely proportional to the area of cross-section</span><span style=\"font-family:'Mangal'\">, so a </span><span style=\"font-weight:bold;font-family:'Mangal'\">thicker</span><span style=\"font-family:'Mangal'\"> wire of the same material and length has a </span><span style=\"font-weight:bold;font-family:'Mangal'\">smaller</span><span style=\"font-family:'Mangal'\"> resistance and carries a larger current → incorrect.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">Resistivity</span><span style=\"font-family:'Mangal'\"> depends only on the material and its temperature, not on the length or thickness of the wire, so it is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">characteristic property of the material</span><span style=\"font-family:'Mangal'\"> → correct.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, only 1 and 3 are correct </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In a reflex arc, which of the following represents the correct path of the impulse?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Receptor → brain → spinal cord → muscle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Receptor → spinal cord → brain → muscle</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Receptor → motor neuron → spinal cord → muscle</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Receptor → spinal cord → motor neuron → muscle</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A </span><span style=\"font-weight:bold;font-family:'Mangal'\">reflex arc</span><span style=\"font-family:'Mangal'\"> is a simple connection between the nerve that detects a stimulus and the nerve that moves a muscle.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The receptor picks up the stimulus and the sensory neuron carries the impulse to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">spinal cord</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In the spinal cord the impulse is passed on at once to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">motor neuron</span><span style=\"font-family:'Mangal'\">, which carries it to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">muscle</span><span style=\"font-family:'Mangal'\">, and the muscle responds.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The impulse does reach the brain as well, but only afterwards; if every response had to be thought about first, a hand on a hot object would be burnt before it was pulled back.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the correct path is Receptor → spinal cord → motor neuron → muscle </span><span style=\"font-weight:bold;font-family:'Mangal'\">(Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Who were the chief guests at the 77th Republic Day celebrations of India on 26 January 2026 at Kartavya Path, New Delhi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The President and the Prime Minister of France</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The King and the Prime Minister of Spain</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Presidents of the European Council and the European Commission</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The President and the Vice President of Brazil</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The chief guests at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">77th Republic Day</span><span style=\"font-family:'Mangal'\"> celebrations on </span><span style=\"font-weight:bold;font-family:'Mangal'\">26 January 2026</span><span style=\"font-family:'Mangal'\"> at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kartavya Path, New Delhi</span><span style=\"font-family:'Mangal'\">, were the heads of the two main institutions of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">European Union</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They were </span><span style=\"font-weight:bold;font-family:'Mangal'\">Antonio Costa</span><span style=\"font-family:'Mangal'\">, President of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">European Council</span><span style=\"font-family:'Mangal'\">, and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ursula von der Leyen</span><span style=\"font-family:'Mangal'\">, President of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">European Commission</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They came on a State visit at the invitation of Prime Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">During the visit they also took part in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">16th India European Union Summit</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the chief guests were </span><span style=\"font-weight:bold;font-family:'Mangal'\">the Presidents of the European Council and the European Commission (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following states is NOT covered under the Atal Bhujal Yojana?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Maharashtra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Rajasthan</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Jharkhand</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Uttar Pradesh</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Atal Bhujal Yojana</span><span style=\"font-family:'Mangal'\"> covers </span><span style=\"font-weight:bold;font-family:'Mangal'\">seven</span><span style=\"font-family:'Mangal'\"> states: </span><span style=\"font-weight:bold;font-family:'Mangal'\">Gujarat, Haryana, Karnataka, Madhya Pradesh, Maharashtra, Rajasthan and Uttar Pradesh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Jharkhand</span><span style=\"font-family:'Mangal'\"> is not one of them.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The scheme was approved with an outlay of </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,000 crore</span><span style=\"font-family:'Mangal'\">, half of it a </span><span style=\"font-weight:bold;font-family:'Mangal'\">World Bank</span><span style=\"font-family:'Mangal'\"> loan and half central budgetary support, both passed on to the states as grants.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is run by the Department of Water Resources, River Development and Ganga Rejuvenation of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Jal Shakti</span><span style=\"font-family:'Mangal'\"> and works through community participation in about </span><span style=\"font-weight:bold;font-family:'Mangal'\">8,350</span><span style=\"font-family:'Mangal'\"> gram panchayats of </span><span style=\"font-weight:bold;font-family:'Mangal'\">78</span><span style=\"font-family:'Mangal'\"> districts.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the state not covered is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Jharkhand (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">According to the data released by the National Statistics Office on 14 September 2026, India's retail inflation in August 2026 was:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.46%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.18%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.10%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.82%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Retail inflation, measured by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Consumer Price Index (CPI)</span><span style=\"font-family:'Mangal'\">, was </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.82%</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">August 2026</span><span style=\"font-family:'Mangal'\">, the highest in </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 months</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Food inflation, measured by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Consumer Food Price Index (CFPI)</span><span style=\"font-family:'Mangal'\">, was </span><span style=\"font-weight:bold;font-family:'Mangal'\">5.95%</span><span style=\"font-family:'Mangal'\"> in August 2026 against </span><span style=\"font-weight:bold;font-family:'Mangal'\">5.52%</span><span style=\"font-family:'Mangal'\"> in July 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The August figure stayed above the </span><span style=\"font-weight:bold;font-family:'Mangal'\">4%</span><span style=\"font-family:'Mangal'\"> inflation target of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Reserve Bank of India</span><span style=\"font-family:'Mangal'\"> for the third month in a row.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The data are released every month by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">National Statistics Office (NSO)</span><span style=\"font-family:'Mangal'\"> of the Ministry of Statistics and Programme Implementation.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the retail inflation was </span><span style=\"font-weight:bold;font-family:'Mangal'\">4.82% (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">In August 2026, who became the first woman Director General of the Geological Survey of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Asit Saha</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Debala Mitra</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Varsha Ashok Aglawe</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vidya Krishnamurthi</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Varsha Ashok Aglawe</span><span style=\"font-family:'Mangal'\"> took charge as the </span><span style=\"font-weight:bold;font-family:'Mangal'\">54th Director General</span><span style=\"font-family:'Mangal'\"> of the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Geological Survey of India (GSI)</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">August 2026</span><span style=\"font-family:'Mangal'\"> and is the first woman to head the organisation in its </span><span style=\"font-weight:bold;font-family:'Mangal'\">176-year</span><span style=\"font-family:'Mangal'\"> history.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">She succeeded </span><span style=\"font-weight:bold;font-family:'Mangal'\">Asit Saha</span><span style=\"font-family:'Mangal'\"> and had joined the GSI in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1992</span><span style=\"font-family:'Mangal'\">, after working with the Indian Bureau of Mines.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The GSI was set up in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1851</span><span style=\"font-family:'Mangal'\">, at first to look for coal deposits for the railways, and is headquartered at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Kolkata</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It works under the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Ministry of Mines</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the first woman Director General is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Varsha Ashok Aglawe (Option C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Santosh Trophy is the national championship of which sport in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Football</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Hockey</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Badminton</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Volleyball</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Santosh Trophy</span><span style=\"font-family:'Mangal'\"> is the national championship of </span><span style=\"font-weight:bold;font-family:'Mangal'\">football</span><span style=\"font-family:'Mangal'\"> in India, played between teams of the states and of a few government bodies.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was started in </span><span style=\"font-weight:bold;font-family:'Mangal'\">1941</span><span style=\"font-family:'Mangal'\"> and is organised by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">All India Football Federation (AIFF)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is named after </span><span style=\"font-weight:bold;font-family:'Mangal'\">Sir Manmatha Nath Roy Chowdhury, the Maharaja of Santosh</span><span style=\"font-family:'Mangal'\">, a former president of the Indian Football Association.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">West Bengal</span><span style=\"font-family:'Mangal'\"> has won the trophy the most times, </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span><span style=\"font-family:'Mangal'\"> in all.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the sport is </span><span style=\"font-weight:bold;font-family:'Mangal'\">football (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Alluri Sitarama Raju International Airport, inaugurated by Prime Minister Narendra Modi on 1 August 2026 at Bhogapuram, is located in which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Odisha</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Andhra Pradesh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Telangana</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Karnataka</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Alluri Sitarama Raju International Airport</span><span style=\"font-family:'Mangal'\"> is at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Bhogapuram village</span><span style=\"font-family:'Mangal'\"> in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vizianagaram district</span><span style=\"font-family:'Mangal'\"> of </span><span style=\"font-weight:bold;font-family:'Mangal'\">Andhra Pradesh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was inaugurated by Prime Minister </span><span style=\"font-weight:bold;font-family:'Mangal'\">Narendra Modi</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 August 2026</span><span style=\"font-family:'Mangal'\">, and commercial flights began on </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 August 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It is a </span><span style=\"font-weight:bold;font-family:'Mangal'\">greenfield</span><span style=\"font-family:'Mangal'\"> airport built on the </span><span style=\"font-weight:bold;font-family:'Mangal'\">public private partnership</span><span style=\"font-family:'Mangal'\"> model and is developed and operated by </span><span style=\"font-weight:bold;font-family:'Mangal'\">GMR</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It serves the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Visakhapatnam</span><span style=\"font-family:'Mangal'\"> region and lies about </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 km</span><span style=\"font-family:'Mangal'\"> from Visakhapatnam city.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the state is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Andhra Pradesh (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">COP30, the 30th Conference of the Parties to the UN Framework Convention on Climate Change, held in November 2025, took place in which city?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Belem</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Baku</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Dubai</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Sharm el-Sheikh</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">COP30</span><span style=\"font-family:'Mangal'\">, the 30th Conference of the Parties to the </span><span style=\"font-weight:bold;font-family:'Mangal'\">United Nations Framework Convention on Climate Change</span><span style=\"font-family:'Mangal'\">, was held at </span><span style=\"font-weight:bold;font-family:'Mangal'\">Belem</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">Brazil</span><span style=\"font-family:'Mangal'\"> in </span><span style=\"font-weight:bold;font-family:'Mangal'\">November 2025</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Its president was </span><span style=\"font-weight:bold;font-family:'Mangal'\">Andre Correa do Lago</span><span style=\"font-family:'Mangal'\"> of Brazil.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The conference adopted the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Belem Package</span><span style=\"font-family:'Mangal'\">, a set of </span><span style=\"font-weight:bold;font-family:'Mangal'\">29</span><span style=\"font-family:'Mangal'\"> decisions agreed by consensus among </span><span style=\"font-weight:bold;font-family:'Mangal'\">195</span><span style=\"font-family:'Mangal'\"> Parties; its central decision is called the </span><span style=\"font-weight:bold;font-family:'Mangal'\">global mutirao</span><span style=\"font-family:'Mangal'\">, a Portuguese word for collective effort.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The package called for a </span><span style=\"font-weight:bold;font-family:'Mangal'\">tripling</span><span style=\"font-family:'Mangal'\"> of adaptation finance by </span><span style=\"font-weight:bold;font-family:'Mangal'\">2035</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the city is </span><span style=\"font-weight:bold;font-family:'Mangal'\">Belem (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which type of RAM is faster and DOES NOT require refreshing?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DRAM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Flash Memory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SRAM</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">SRAM (Static Random Access Memory)</span><span style=\"font-family:'Mangal'\"> stores each bit in a flip-flop circuit, so the bit holds its value as long as power is supplied and no refreshing is needed; this also makes it </span><span style=\"font-weight:bold;font-family:'Mangal'\">faster</span><span style=\"font-family:'Mangal'\">, and it is used as </span><span style=\"font-weight:bold;font-family:'Mangal'\">cache memory</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">DRAM (Dynamic Random Access Memory)</span><span style=\"font-family:'Mangal'\"> stores each bit as charge on a tiny capacitor; the charge leaks away, so the contents must be </span><span style=\"font-weight:bold;font-family:'Mangal'\">refreshed</span><span style=\"font-family:'Mangal'\"> again and again, which makes DRAM slower, though it is cheaper and denser and is used as main memory.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ROM</span><span style=\"font-family:'Mangal'\"> is read-only memory and </span><span style=\"font-weight:bold;font-family:'Mangal'\">Flash memory</span><span style=\"font-family:'Mangal'\"> is non-volatile storage, so neither of them is a type of RAM in this sense.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the memory is </span><span style=\"font-weight:bold;font-family:'Mangal'\">SRAM (Option D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Supreme Court (Number of Judges) Amendment Bill, 2026, passed by the Lok Sabha on 3 August 2026, raises the number of judges of the Supreme Court of India, excluding the Chief Justice of India, from 33 to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">37</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">34</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">31</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">Supreme Court (Number of Judges) Amendment Bill, 2026</span><span style=\"font-family:'Mangal'\"> raises the number of judges of the Supreme Court, excluding the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Chief Justice of India</span><span style=\"font-family:'Mangal'\">, from </span><span style=\"font-weight:bold;font-family:'Mangal'\">33</span><span style=\"font-family:'Mangal'\"> to </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The sanctioned strength of the court therefore becomes </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\"> judges including the Chief Justice of India.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The Bill amends the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Supreme Court (Number of Judges) Act, 1956</span><span style=\"font-family:'Mangal'\"> and replaces an ordinance issued earlier in 2026.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">It was introduced in the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Lok Sabha</span><span style=\"font-family:'Mangal'\"> on </span><span style=\"font-weight:bold;font-family:'Mangal'\">20 July 2026</span><span style=\"font-family:'Mangal'\"> by the Ministry of Law and Justice and was passed by the Lok Sabha on </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 August 2026</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the number is </span><span style=\"font-weight:bold;font-family:'Mangal'\">37 (Option A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The SHAKTI family of indigenous microprocessors, on which the IRIS chip for space applications is based, was developed by which institute?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IIT Bombay</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IIT Madras</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IISc Bengaluru</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C-DAC Pune</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">The </span><span style=\"font-weight:bold;font-family:'Mangal'\">SHAKTI</span><span style=\"font-family:'Mangal'\"> family of indigenous microprocessors was developed by </span><span style=\"font-weight:bold;font-family:'Mangal'\">IIT Madras</span><span style=\"font-family:'Mangal'\"> under the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Digital India RISC-V (DIR-V)</span><span style=\"font-family:'Mangal'\"> programme of the Ministry of Electronics and Information Technology.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SHAKTI processors are built on </span><span style=\"font-weight:bold;font-family:'Mangal'\">RISC-V</span><span style=\"font-family:'Mangal'\">, an open-source instruction set architecture, which lets designers build custom processors without paying for a licence.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">IRIS</span><span style=\"font-family:'Mangal'\">, the Indigenous RISC-V Controller for Space Applications, was derived from the SHAKTI baseline: the design was conceived by the </span><span style=\"font-weight:bold;font-family:'Mangal'\">ISRO Inertial Systems Unit, Thiruvananthapuram</span><span style=\"font-family:'Mangal'\">, and the chip was fabricated at the </span><span style=\"font-weight:bold;font-family:'Mangal'\">Semi-Conductor Laboratory, Chandigarh</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Therefore, the institute is </span><span style=\"font-weight:bold;font-family:'Mangal'\">IIT Madras (Option B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}];

    const contentDiv = document.createElement('div');

        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';

        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {

    return contentDiv;
}
