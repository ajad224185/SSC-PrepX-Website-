:'Mangal'\">अपशिष्ट</span><span style=\"font-family:'Mangal'\"> भी अपरा के माध्यम से </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता के रक्त</span><span style=\"font-family:'Mangal'\"> में जाकर हटाए जाते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस फूल में पुंकेसर या स्त्रीकेसर में से केवल एक ही होता है, दोनों नहीं, वह एकलिंगी कहलाता है। निम्नलिखित में से पौधों के किस युग्म में एकलिंगी फूल होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पपीता और तरबूज़</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गुड़हल और सरसों</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पपीता और गुड़हल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरसों और तरबूज़</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुंकेसर (नर भाग) और स्त्रीकेसर (मादा भाग) फूल के प्रजनन भाग हैं और इनमें जनन कोशिकाएँ होती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस फूल में पुंकेसर </span><span style=\"font-weight:bold;font-family:'Mangal'\">या</span><span style=\"font-family:'Mangal'\"> स्त्रीकेसर में से </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक ही</span><span style=\"font-family:'Mangal'\"> हो, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकलिंगी</span><span style=\"font-family:'Mangal'\"> है, जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पपीता</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">तरबूज़</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिस फूल में पुंकेसर और स्त्रीकेसर </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोनों</span><span style=\"font-family:'Mangal'\"> हों, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विलिंगी</span><span style=\"font-family:'Mangal'\"> है, जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">गुड़हल</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सरसों</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः एकलिंगी फूलों वाला युग्म पपीता और तरबूज़ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिरोधकों के संयोजन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. श्रेणी संयोजन में प्रत्येक प्रतिरोधक से समान धारा प्रवाहित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. समांतर संयोजन में प्रत्येक प्रतिरोधक के सिरों के बीच विभवांतर समान होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. समांतर संयोजन का तुल्य प्रतिरोध अलग-अलग प्रतिरोधों में सबसे बड़े प्रतिरोध से अधिक होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">श्रेणी</span><span style=\"font-family:'Mangal'\"> परिपथ में धारा हर भाग में समान रहती है, इसलिए प्रत्येक प्रतिरोधक से </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान धारा</span><span style=\"font-family:'Mangal'\"> प्रवाहित होती है (और कुल विभवांतर V₁ + V₂ + V₃ का योग है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">समांतर</span><span style=\"font-family:'Mangal'\"> संयोजन में प्रत्येक प्रतिरोधक समान दो बिंदुओं के बीच जुड़ा होता है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक के सिरों पर विभवांतर समान</span><span style=\"font-family:'Mangal'\"> है (और कुल धारा I₁ + I₂ + I₃ है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. समांतर संयोजन में 1/Rₚ = 1/R₁ + 1/R₂ + …, अतः कुल प्रतिरोध </span><span style=\"font-weight:bold;font-family:'Mangal'\">घट</span><span style=\"font-family:'Mangal'\"> जाता है, अर्थात् वह प्रत्येक अलग प्रतिरोध से कम होता है (श्रेणी में वह किसी भी एक प्रतिरोध से अधिक होता है) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 kg द्रव्यमान का एक नारियल 10 m की ऊँचाई से गीली रेत पर गिरता है और रेत में गड्ढा बनाकर रुक जाता है। यदि रेत 3000 N का औसत प्रतिरोधी बल लगाती है और नारियल की पूरी ऊर्जा गड्ढा बनाने में लगती है, तो गड्ढे की गहराई है (g = 10 m/s²):</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 cm</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेत से टकराने से ठीक पहले नारियल की ऊर्जा = खोई गई स्थितिज ऊर्जा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">mgh</span><span style=\"font-family:'Mangal'\"> = 1.5 × 10 × 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">150 J</span><span style=\"font-family:'Mangal'\"> (यांत्रिक ऊर्जा संरक्षण से यही रेत पर उसकी गतिज ऊर्जा है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कार्य-ऊर्जा प्रमेय</span><span style=\"font-family:'Mangal'\"> से, रेत के प्रतिरोधी बल द्वारा किया गया कार्य इस ऊर्जा के बराबर है: F × d = 150 J.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 150 ÷ 3000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.05 m</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गड्ढे की गहराई 5 cm है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रोजन चक्र में जीवाणुओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नाइट्रोसोमोनास अमोनिया को नाइट्राइट (NO₂⁻) में बदलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. नाइट्रोबैक्टर नाइट्राइट को नाइट्रेट (NO₃⁻) में बदलता है; यह प्रक्रिया नाइट्रीकरण कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. स्यूडोमोनास नाइट्रेट को अमोनिया में बदलता है; यह प्रक्रिया विनाइट्रीकरण कहलाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोसोमोनास</span><span style=\"font-family:'Mangal'\"> जैसे नाइट्रीकारी जीवाणु अमोनिया को </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्राइट</span><span style=\"font-family:'Mangal'\"> में बदलते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोबैक्टर</span><span style=\"font-family:'Mangal'\"> नाइट्राइट को </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रेट</span><span style=\"font-family:'Mangal'\"> में बदलता है; अमोनिया का नाइट्राइट और नाइट्रेट में बदलना </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रीकरण</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्यूडोमोनास</span><span style=\"font-family:'Mangal'\"> जैसे विनाइट्रीकारी जीवाणु नाइट्रेट को वापस </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रोजन गैस (N₂)</span><span style=\"font-family:'Mangal'\"> में बदलते हैं, अमोनिया में नहीं; यह विनाइट्रीकरण चक्र को पूरा करता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकांग का कौन-सा युग्म अपना स्वयं का DNA और राइबोसोम रखता है, एक ऐसा लक्षण जो संकेत देता है कि इनका विकासीय इतिहास एककोशिकीय जीवों से जुड़ा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माइटोकॉन्ड्रिया और क्लोरोप्लास्ट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गॉल्जी उपकरण और लाइसोसोम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राइबोसोम और अंतर्द्रव्यी जालिका</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाइसोसोम और रिक्तिकाएँ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">माइटोकॉन्ड्रिया</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लास्टिड (क्लोरोप्लास्ट)</span><span style=\"font-family:'Mangal'\"> में कुछ जीवाणुओं जैसे लक्षण हैं: दोनों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपना DNA और राइबोसोम</span><span style=\"font-family:'Mangal'\"> होते हैं और ये अपने कुछ प्रोटीन स्वयं बना सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये लक्षण संकेत देते हैं कि दोनों का विकासीय इतिहास एककोशिकीय जीवों से जुड़ा है; दोनों दोहरी झिल्ली से घिरे कोशिकांग भी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राइबोसोम, गॉल्जी उपकरण और लाइसोसोम में DNA नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह युग्म माइटोकॉन्ड्रिया और क्लोरोप्लास्ट है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": "\r\n\r\n\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कायिक प्रवर्धन की विधि को उसके विवरण से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733944661_image001.png\" style=\"width: 800px; height: 200px;\" /></p>", "option1": "\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option2": "\r\n\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option3": "\r\n\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option4": "\r\n\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कटिंग, ग्राफ्टिंग, लेयरिंग और ऊतक संवर्धन प्राकृतिक कायिक प्रवर्धन से विकसित की गई विधियाँ हैं।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्राफ्टिंग</span><span style=\"font-family:'Mangal'\"> में स्वस्थ जड़युक्त पौधे (पौधा A) की टहनी पर चीरा लगाकर उसमें दूसरे पौधे/किस्म (पौधा B) के तने की कटिंग लगाई जाती है &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">लेयरिंग</span><span style=\"font-family:'Mangal'\"> में लचीली टहनी (जैसे नींबू की) का मध्य भाग मिट्टी में दबाया जाता है; 10&ndash;15 दिनों में जड़ें निकलती हैं और फिर टहनी को जनक पौधे से काट दिया जाता है &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊतक संवर्धन</span><span style=\"font-family:'Mangal'\"> में प्ररोह शीर्ष (शीर्षस्थ विभज्योतक) से स्वस्थ पादपक बड़ी संख्या में तैयार किए जाते हैं, जिससे विषाणु-संक्रमित पौधे हटाने में मदद मिलती है (जैसे केले की खेती में) &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक जहाज़ से ऊर्ध्वाधर नीचे भेजा गया सोनार संकेत 4 s बाद वापस प्राप्त होता है। यदि समुद्री जल में ध्वनि की चाल 1500 m/s हो, तो उस स्थान पर समुद्र की गहराई है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3000 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6000 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">375 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">750 m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोनार संकेत जहाज़ से समुद्र तल तक जाकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">वापस</span><span style=\"font-family:'Mangal'\"> आता है, इसलिए कुल समय 4 s में गहराई की </span><span style=\"font-weight:bold;font-family:'Mangal'\">दोगुनी</span><span style=\"font-family:'Mangal'\"> दूरी तय होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समुद्र तल तक पहुँचने का समय = 4 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गहराई = चाल × समय = 1500 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3000 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(पूरे 4 s लेने पर 6000 m आता, जो तय की गई कुल दूरी है, गहराई नहीं।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः समुद्र की गहराई 3000 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा युग्म केवल प्राकृतिक पारिस्थितिकी तंत्र का है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बगीचा और तालाब</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फसल का खेत और वन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वन और झील</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक्वेरियम और तालाब</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पारिस्थितिकी तंत्र किसी क्षेत्र के सभी परस्पर क्रिया करने वाले जीवों और पर्यावरण के निर्जीव घटकों से मिलकर बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">वन, तालाब और झील</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राकृतिक</span><span style=\"font-family:'Mangal'\"> पारिस्थितिकी तंत्र हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बगीचे, फसल के खेत और एक्वेरियम</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">मानव-निर्मित (कृत्रिम)</span><span style=\"font-family:'Mangal'\"> पारिस्थितिकी तंत्र हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्राकृतिक पारिस्थितिकी तंत्र का युग्म वन और झील है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पारिस्थितिकी तंत्र में ऊर्जा प्रवाह के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पारिस्थितिकी तंत्र में ऊर्जा का प्रवाह एकदिशीय होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. स्थलीय पारिस्थितिकी तंत्र में हरे पादप अपनी पत्तियों पर पड़ने वाले सूर्य के प्रकाश की ऊर्जा का लगभग 1% ग्रहण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आहार शृंखलाओं में सामान्यतः केवल तीन या चार चरण होते हैं, क्योंकि चार पोषक स्तरों के बाद बहुत कम उपयोगी ऊर्जा बचती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. स्वपोषियों द्वारा ग्रहण की गई ऊर्जा सौर निवेश में वापस नहीं जाती, और शाकाहारियों तक पहुँची ऊर्जा स्वपोषियों में नहीं लौटती। प्रवाह </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकदिशीय</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. हरे पादप अपनी पत्तियों पर पड़ने वाले सूर्य के प्रकाश का लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">1%</span><span style=\"font-family:'Mangal'\"> ग्रहण करके भोजन ऊर्जा में बदलते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. अगले पोषक स्तर तक केवल लगभग 10% ऊर्जा पहुँचती है, इसलिए हर चरण पर हानि इतनी अधिक है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार</span><span style=\"font-family:'Mangal'\"> पोषक स्तरों के बाद बहुत कम उपयोगी ऊर्जा बचती है; अतः आहार शृंखलाओं में केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 या 4 चरण</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दंत चिकित्सक रोगी के दाँत का बड़ा प्रतिबिंब देखने के लिए दर्पण का उपयोग करता है। उपयोग किया गया दर्पण और दर्पण के सापेक्ष दाँत की स्थिति है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण, दाँत ध्रुव और मुख्य फोकस के बीच</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तल दर्पण, दाँत उसके सामने कहीं भी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण, दाँत मुख्य फोकस और वक्रता केंद्र के बीच</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समतल दर्पण, दाँत उसके बहुत पास</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दंत चिकित्सक रोगियों के दाँतों के बड़े प्रतिबिंब देखने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल दर्पण</span><span style=\"font-family:'Mangal'\"> का उपयोग करते हैं (इसी कारण अवतल दर्पण शेविंग दर्पण के रूप में भी उपयोग होते हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवतल दर्पण </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीधा और बड़ा (आभासी)</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब तभी बनाता है जब वस्तु </span><span style=\"font-weight:bold;font-family:'Mangal'\">ध्रुव P और मुख्य फोकस F के बीच</span><span style=\"font-family:'Mangal'\"> रखी हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु F और C के बीच होने पर प्रतिबिंब बड़ा तो होता है परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक और उल्टा</span><span style=\"font-family:'Mangal'\"> (C से परे बनता है), जो सीधे देखने के लिए उपयुक्त नहीं; उत्तल दर्पण सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब देता है, और समतल दर्पण </span><span style=\"font-weight:bold;font-family:'Mangal'\">समान आकार</span><span style=\"font-family:'Mangal'\"> का।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अवतल दर्पण, दाँत P और F के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयताकार काँच के स्लैब से प्रकाश के अपवर्तन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. निर्गत किरण आपतित किरण की दिशा के समांतर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जिस सतह पर किरण काँच से वायु में जाती है, वहाँ वह अभिलंब की ओर मुड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निर्गत किरण आपतित किरण के सापेक्ष थोड़ी पार्श्व में खिसक जाती है (पार्श्व विस्थापन)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. दोनों समांतर फलकों (वायु-काँच और काँच-वायु) पर मुड़ाव </span><span style=\"font-weight:bold;font-family:'Mangal'\">बराबर और विपरीत</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए निर्गत किरण आपतित किरण के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समांतर</span><span style=\"font-family:'Mangal'\"> होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">सघन</span><span style=\"font-family:'Mangal'\"> माध्यम (काँच) से </span><span style=\"font-weight:bold;font-family:'Mangal'\">विरल</span><span style=\"font-family:'Mangal'\"> माध्यम (वायु) में जाने पर प्रकाश अभिलंब से </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूर</span><span style=\"font-family:'Mangal'\"> मुड़ता है (वायु से काँच में प्रवेश करते समय वह अभिलंब की ओर मुड़ता है) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. समांतर होते हुए भी निर्गत किरण थोड़ी </span><span style=\"font-weight:bold;font-family:'Mangal'\">पार्श्व में खिसक</span><span style=\"font-family:'Mangal'\"> जाती है। यही </span><span style=\"font-weight:bold;font-family:'Mangal'\">पार्श्व विस्थापन</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चंद्रयान-3 की सॉफ्ट लैंडिंग के दौरान विक्रम लैंडर को अपना वेग घटाना था। न्यूटन के तीसरे नियम के अनुसार, इंजन चलाने से लैंडर की चाल कैसे घटी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंजन को गति की विपरीत दिशा में चलाया गया, जिससे निकलने वाली गैसों ने लैंडर को आगे धकेला</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंजन को गति की दिशा में चलाया गया, जिससे निकलने वाली गैसों ने लैंडर पर उसकी गति के विपरीत बल लगाया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंजन बंद कर दिया गया ताकि चंद्रमा का गुरुत्व लैंडर को धीमा करे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकलने वाली गैसों ने चंद्रमा की सतह को धकेला और सतह ने लैंडर को पीछे धकेला</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रॉकेट इंजन गैस उत्पन्न करके उसे बाहर फेंकता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूटन के तीसरे नियम</span><span style=\"font-family:'Mangal'\"> से निकलने वाली गैस रॉकेट पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">बराबर और विपरीत बल</span><span style=\"font-family:'Mangal'\"> लगाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि इंजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">गति की दिशा में</span><span style=\"font-family:'Mangal'\"> चलाया जाए, तो निष्कासित गैसें आगे जाती हैं और लैंडर पर उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">गति के विपरीत</span><span style=\"font-family:'Mangal'\"> बल लगाती हैं, जिससे वह धीमा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चंद्रयान-3 के विक्रम लैंडर ने इसी प्रक्रिया से अपना वेग घटाकर चंद्रमा के दक्षिणी ध्रुव के पास सॉफ्ट लैंडिंग के लिए आवश्यक चाल प्राप्त की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(गति के विपरीत दिशा में इंजन चलाने से लैंडर आगे धकेला जाता और उसकी चाल बढ़ती।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इंजन को गति की दिशा में चलाया गया </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल मशीन (उत्तोलक) को उसके वर्ग से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733944661_image002.png\" style=\"width: 500px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-2, (c)-3</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-3, (c)-1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ठेला (व्हील बैरो)</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्ग II उत्तोलक</span><span style=\"font-family:'Mangal'\">: भार आलंब और प्रयास के बीच होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कैंची</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्ग I उत्तोलक</span><span style=\"font-family:'Mangal'\">: आलंब भार और प्रयास के बीच होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">चिमटी</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">वर्ग III उत्तोलक</span><span style=\"font-family:'Mangal'\">: प्रयास आलंब और भार के बीच होता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-2, (b)-1, (c)-3 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिक्रिया 2PbO(s) + C(s) → 2Pb(s) + CO₂(g) पर विचार कीजिए। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड ऑक्साइड अपचयित होता है और कार्बन उपचयित होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड ऑक्साइड उपचयित होता है और कार्बन अपचयित होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड उपचयित होता है और कार्बन डाइऑक्साइड अपचयित होती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड ऑक्साइड और कार्बन दोनों अपचयित होते हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उपचयन</span><span style=\"font-family:'Mangal'\"> ऑक्सीजन का ग्रहण (या हाइड्रोजन का ह्रास) है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपचयन</span><span style=\"font-family:'Mangal'\"> ऑक्सीजन का ह्रास (या हाइड्रोजन का ग्रहण) है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">PbO ऑक्सीजन खोकर</span><span style=\"font-family:'Mangal'\"> Pb बनता है → लेड ऑक्साइड </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपचयित</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन ऑक्सीजन ग्रहण करके</span><span style=\"font-family:'Mangal'\"> CO₂ बनता है → कार्बन </span><span style=\"font-weight:bold;font-family:'Mangal'\">उपचयित</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि एक अभिकारक उपचयित और दूसरा अपचयित होता है, यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेडॉक्स</span><span style=\"font-family:'Mangal'\"> अभिक्रिया है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लेड ऑक्साइड अपचयित होता है और कार्बन उपचयित होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादप समूहों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. फर्न जैसे टेरिडोफाइटा में संवहन ऊतक (जाइलम और फ्लोएम) सहित वास्तविक जड़, तना और पत्तियाँ होती हैं, परंतु वे बीज नहीं बनाते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जिम्नोस्पर्म में बीज फलों के भीतर बंद नहीं होते और प्रायः शंकुओं पर खुले (अनावृत) रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. ब्रायोफाइटा और टेरिडोफाइटा की तरह जिम्नोस्पर्म को भी निषेचन के लिए जल की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. टेरिडोफाइटा (जैसे फर्न) में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जाइलम और फ्लोएम</span><span style=\"font-family:'Mangal'\"> सहित </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक जड़, तना और पत्तियाँ</span><span style=\"font-family:'Mangal'\"> होती हैं, परंतु वे प्रजनन के लिए अब भी जल पर निर्भर हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीज नहीं बनाते</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जिम्नोस्पर्म ('नग्न बीज') के बीज </span><span style=\"font-weight:bold;font-family:'Mangal'\">फलों में बंद नहीं</span><span style=\"font-family:'Mangal'\"> होते और प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">शंकुओं पर अनावृत</span><span style=\"font-family:'Mangal'\"> रहते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जिम्नोस्पर्म को </span><span style=\"font-weight:bold;font-family:'Mangal'\">निषेचन के लिए जल की आवश्यकता नहीं</span><span style=\"font-family:'Mangal'\"> होती; इसीलिए चीड़ और साइकस ठंडे और शुष्क क्षेत्रों के लिए अनुकूलित हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वातित पेय (जल में घुली कार्बन डाइऑक्साइड) की बोतल को ठंडा रखने की तुलना में गर्म रखने पर उसकी फिज़ (गैस) कहीं जल्दी निकल जाती है। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उच्च ताप पर CO₂ जल से तेज़ी से अभिक्रिया करके ठोस बनाती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताप बढ़ने पर द्रव में गैस की विलेयता बढ़ती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताप बढ़ने पर द्रव में गैस की विलेयता घटती है, इसलिए अधिक CO₂ बाहर निकल जाती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वातित पेय एक विषमांगी मिश्रण है जो गर्म होने पर अलग हो जाता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडा जैसा वातित पेय जल में कार्बन डाइऑक्साइड गैस का </span><span style=\"font-weight:bold;font-family:'Mangal'\">समांगी मिश्रण (विलयन)</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव में घुली </span><span style=\"font-weight:bold;font-family:'Mangal'\">गैस की विलेयता</span><span style=\"font-family:'Mangal'\"> ताप बढ़ने पर सामान्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">घटती</span><span style=\"font-family:'Mangal'\"> है (द्रव में ठोस विलेय की विलेयता सामान्यतः ताप के साथ बढ़ती है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए पेय के गर्म होने पर कम CO₂ घुली रह पाती है और अधिक गैस बुलबुलों के रूप में निकल जाती है, जिससे फिज़ जल्दी खत्म हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कारण ताप बढ़ने पर गैस की विलेयता का घटना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक सर्वेक्षण में जीव Q बहुकोशिकीय और तंतुमय शरीर वाला पाया गया, जिसमें कोशिका भित्ति है, क्लोरोफिल नहीं है, और जो मृत कार्बनिक पदार्थ पर उससे पोषक तत्व अवशोषित करके उगता है। पाँच जगत वर्गीकरण में Q किस जगत का है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लांटी (पादप)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फंजाई (कवक)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटिस्टा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोनेरा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुकोशिकीय</span><span style=\"font-family:'Mangal'\"> है और उसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका भित्ति</span><span style=\"font-family:'Mangal'\"> है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरोफिल नहीं</span><span style=\"font-family:'Mangal'\">, इसलिए वह अपना भोजन नहीं बना सकता। वह पादप नहीं है (प्लांटी स्वपोषी होते हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">मृत कार्बनिक पदार्थ</span><span style=\"font-family:'Mangal'\"> पर उगता है और अपने तंतुमय शरीर (कवक जाल बनाने वाले कवक तंतु) से पोषक तत्व </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवशोषित</span><span style=\"font-family:'Mangal'\"> करता है। यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कवकों</span><span style=\"font-family:'Mangal'\"> का विशिष्ट मृतोपजीवी पोषण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रोटिस्टा अधिकतर एककोशिकीय यूकैरियोट हैं और मोनेरा एककोशिकीय प्रोकैरियोट, अतः Q इनमें से किसी में नहीं आता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः Q जगत फंजाई (कवक) का है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लिंग निर्धारण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कुछ सरीसृपों में निषेचित अंडों को जिस तापमान पर रखा जाता है, वह तय करता है कि विकसित होने वाले जंतु नर होंगे या मादा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. घोंघे जैसे कुछ जंतुओं में व्यक्ति अपना लिंग बदल सकते हैं, जो दर्शाता है कि उनमें लिंग आनुवंशिक रूप से निर्धारित नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मनुष्यों में संतान का लिंग उस लिंग गुणसूत्र से तय होता है जो उसे माता से मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कुछ प्रजातियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्यावरणीय संकेतों</span><span style=\"font-family:'Mangal'\"> पर निर्भर हैं: कुछ सरीसृपों में निषेचित अंडों को रखने का </span><span style=\"font-weight:bold;font-family:'Mangal'\">तापमान</span><span style=\"font-family:'Mangal'\"> लिंग निर्धारित करता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">घोंघे</span><span style=\"font-family:'Mangal'\"> जैसे जंतुओं में व्यक्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">लिंग बदल</span><span style=\"font-family:'Mangal'\"> सकते हैं, अतः उनमें लिंग आनुवंशिक रूप से निर्धारित नहीं होता → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मनुष्यों में माता सदैव X गुणसूत्र देती है; संतान का लिंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता</span><span style=\"font-family:'Mangal'\"> से मिले गुणसूत्र से तय होता है (X → लड़की, Y → लड़का) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 km/h की चाल से चलती एक कार अपने ब्रेक के नियत मंदन से लगभग 28 m में रुक जाती है। यदि वही कार 108 km/h की चाल से चले और ब्रेक वही मंदन उत्पन्न करें, तो रुकने की दूरी लगभग होगी:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">112.5 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">28 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">84 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों स्थितियों में ब्रेक का मंदन a समान है और अंतिम वेग v = 0 है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">v² = u² + 2as</span><span style=\"font-family:'Mangal'\"> से: 0 = u² − 2as → </span><span style=\"font-weight:bold;font-family:'Mangal'\">s = u²/2a</span><span style=\"font-family:'Mangal'\">, अर्थात् रुकने की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">चाल के वर्ग</span><span style=\"font-family:'Mangal'\"> के समानुपाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a = 4 m/s² लेकर जाँच: u = 54 km/h = 15 m/s → s = 225 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28.1 m</span><span style=\"font-family:'Mangal'\">; u = 108 km/h = 30 m/s → s = 900 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">112.5 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चाल दोगुनी होने पर रुकने की दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार गुनी</span><span style=\"font-family:'Mangal'\"> हो जाती है: 4 × 28.1 ≈ 112.5 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रुकने की दूरी लगभग 112.5 m है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): कॉपर सल्फेट पिघली हुई अवस्था में विद्युत का चालन करता है, परंतु ठोस अवस्था में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): पिघली हुई अवस्था में कॉपर और सल्फेट आयन जालक में स्थिर रहते हैं, जबकि ठोस अवस्था में वे स्वतंत्र रूप से गति कर सकते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर सल्फेट Cu²⁺ और SO₄²⁻ आयनों से बना </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयनिक यौगिक</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ठोस अवस्था</span><span style=\"font-family:'Mangal'\"> में आयन प्रबल बलों द्वारा क्रिस्टल जालक में </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिर स्थितियों</span><span style=\"font-family:'Mangal'\"> में बँधे रहते हैं, इसलिए वे गति नहीं कर पाते और ठोस विद्युत का </span><span style=\"font-weight:bold;font-family:'Mangal'\">चालन नहीं</span><span style=\"font-family:'Mangal'\"> करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत चालन के लिए आयनों का </span><span style=\"font-weight:bold;font-family:'Mangal'\">गति के लिए स्वतंत्र</span><span style=\"font-family:'Mangal'\"> होना आवश्यक है; ऐसा यौगिक के </span><span style=\"font-weight:bold;font-family:'Mangal'\">गलित</span><span style=\"font-family:'Mangal'\"> होने या </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल में घुलने</span><span style=\"font-family:'Mangal'\"> पर होता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R इसका उल्टा कहता है (पिघली हुई अवस्था में आयन स्थिर और ठोस में स्वतंत्र) → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मटर के पौधों में ऊँचाई वृद्धि प्रेरित करने वाले एक पादप हॉर्मोन की मात्रा पर निर्भर करती है, जो स्वयं उसे बनाने वाले एंज़ाइम की दक्षता पर निर्भर है। यदि इस एंज़ाइम के जीन में ऐसा परिवर्तन हो जाए जिससे एंज़ाइम कम दक्ष हो जाए, तो पौधा होगा:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबा, क्योंकि कम हॉर्मोन अधिक वृद्धि को प्रेरित करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटा (बौना), क्योंकि हॉर्मोन कम बनता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मध्यम ऊँचाई का, क्योंकि लक्षण मिश्रित हो जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अप्रभावित, क्योंकि जीन ऐसे लक्षणों का नियंत्रण नहीं करते</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिकीय DNA प्रोटीन बनाने की सूचना का स्रोत है; DNA का वह भाग जो एक प्रोटीन की सूचना देता है, उस प्रोटीन का </span><span style=\"font-weight:bold;font-family:'Mangal'\">जीन</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि हॉर्मोन बनाने वाला एंज़ाइम </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षता</span><span style=\"font-family:'Mangal'\"> से काम करे, तो बहुत हॉर्मोन बनता है और पौधा </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबा</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि जीन में परिवर्तन से एंज़ाइम </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम दक्ष</span><span style=\"font-family:'Mangal'\"> हो जाए, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">हॉर्मोन कम</span><span style=\"font-family:'Mangal'\"> बनता है और पौधा </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटा</span><span style=\"font-family:'Mangal'\"> होता है। इसी प्रकार जीन लक्षणों का नियंत्रण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पौधा छोटा होगा </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादपों में परिवहन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. फ्लोएम में भोजन का स्थानांतरण ATP से प्राप्त ऊर्जा का उपयोग करके होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दिन में, जब रंध्र खुले होते हैं, वाष्पोत्सर्जन खिंचाव जाइलम में जल की गति का प्रमुख प्रेरक बल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जल के परिवहन में मूल दाब की सबसे महत्वपूर्ण भूमिका दिन में होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जाइलम के परिवहन (जो मुख्यतः भौतिक बलों से समझाया जाता है) के विपरीत, फ्लोएम में स्थानांतरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्जा</span><span style=\"font-family:'Mangal'\"> का उपयोग करता है: सुक्रोज़ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ATP</span><span style=\"font-family:'Mangal'\"> की ऊर्जा से फ्लोएम में भेजा जाता है, जिससे परासरण दाब बढ़ता है और जल व पदार्थ आगे बढ़ते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दिन में रंध्र खुले रहते हैं, और पत्ती की कोशिकाओं से जल के वाष्पन से बना </span><span style=\"font-weight:bold;font-family:'Mangal'\">वाष्पोत्सर्जन खिंचाव</span><span style=\"font-family:'Mangal'\"> जाइलम में जल की गति का </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रमुख प्रेरक बल</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मूल दाब की भूमिका </span><span style=\"font-weight:bold;font-family:'Mangal'\">रात में</span><span style=\"font-family:'Mangal'\"> अधिक महत्वपूर्ण होती है, दिन में नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शिमला जैसे पहाड़ी क्षेत्रों में सूर्यास्त के बाद ढलानों से नीचे घाटी की ओर बहती ठंडी हवा महसूस होती है। यह हवा इसलिए बनती है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घाटी का तल ढलानों से तेज़ी से ठंडा होता है, इसलिए घाटी के तल से हवा ऊपर उठती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ढलानों के ऊपर की गर्म हवा ऊपर उठकर ढलानों पर निम्न दाब क्षेत्र बनाती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्यास्त के बाद ढलानें तेज़ी से ऊष्मा खोकर घाटी के तल से अधिक ठंडी हो जाती हैं, इसलिए ढलानों के ऊपर की ठंडी, सघन हवा नीचे घाटी में बहती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी का घूर्णन हवा को ढलानों से नीचे की ओर विक्षेपित करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ढलानें और घाटी का तल एक ही दर से गर्म और ठंडे नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सूर्यास्त के बाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्वतीय ढलानें तेज़ी से ऊष्मा खोकर</span><span style=\"font-family:'Mangal'\"> ठंडी हो जाती हैं, जबकि घाटी का तल अपेक्षाकृत गर्म रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ढलानों के ऊपर की </span><span style=\"font-weight:bold;font-family:'Mangal'\">ठंडी, सघन हवा</span><span style=\"font-family:'Mangal'\"> नीचे </span><span style=\"font-weight:bold;font-family:'Mangal'\">घाटी में बहती</span><span style=\"font-family:'Mangal'\"> है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पर्वतीय समीर</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(दिन में इसका उल्टा होता है: गर्म ढलानों पर हवा ऊपर उठती है और घाटी की ठंडी हवा ऊपर आती है, जो घाटी समीर है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह हवा इसलिए बनती है क्योंकि ढलानों के ऊपर की ठंडी, सघन हवा नीचे बहती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): रदरफोर्ड का परमाणु मॉडल परमाणु के स्थायित्व की व्याख्या नहीं कर सका।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): नाभिक के चारों ओर वृत्ताकार पथ में घूमता इलेक्ट्रॉन लगातार त्वरित होता है, इसलिए उसे ऊर्जा खोकर सर्पिल पथ में अंदर की ओर जाते हुए अंततः नाभिक में गिर जाना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रदरफोर्ड के ग्रहीय मॉडल में इलेक्ट्रॉन नाभिक के चारों ओर वैसे ही घूमते हैं जैसे ग्रह सूर्य के चारों ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृत्ताकार पथ में चलता कण लगातार दिशा बदलता है, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वरित</span><span style=\"font-family:'Mangal'\"> है; त्वरित आवेशित इलेक्ट्रॉन को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊर्जा खोकर</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्पिल पथ में अंदर</span><span style=\"font-family:'Mangal'\"> जाते हुए धनावेशित नाभिक में गिर जाना चाहिए → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ऐसा होता तो परमाणु नष्ट हो जाते; परंतु परमाणु स्थायी हैं। अतः रदरफोर्ड का मॉडल </span><span style=\"font-weight:bold;font-family:'Mangal'\">परमाणु के स्थायित्व की व्याख्या नहीं कर सका</span><span style=\"font-family:'Mangal'\"> → A सत्य है, और R इस सीमा का ठीक यही कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बाद में बोर ने स्थिर कक्षाओं का विचार देकर, जिनमें इलेक्ट्रॉन ऊर्जा नहीं खोता, इस कठिनाई को दूर किया।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 kW शक्ति अंकन वाला एक विद्युत ओवन 5 A धारा अंकन वाले घरेलू परिपथ (220 V) से जोड़ा जाता है। क्या होने की अपेक्षा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओवन सामान्य रूप से चलता है और ठीक 5 A धारा लेता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओवन लगभग 9.1 A धारा लेता है, जो 5 A अंकन से अधिक है, इसलिए परिपथ का फ्यूज़ पिघलकर परिपथ तोड़ देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओवन सामान्य से कम धारा लेता है क्योंकि परिपथ केवल 5 A के लिए अंकित है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भू-संपर्क तार अतिरिक्त धारा ले जाता है और ओवन सामान्य रूप से चलता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओवन द्वारा ली गई धारा: I = P/V = 2000 ÷ 220 ≈ </span><span style=\"font-weight:bold;font-family:'Mangal'\">9.1 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह परिपथ के </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 A अंकन</span><span style=\"font-family:'Mangal'\"> (बल्ब, पंखे आदि के लिए) से बहुत अधिक है; गीज़र और ओवन जैसे अधिक शक्ति अंकन वाले उपकरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 A</span><span style=\"font-family:'Mangal'\"> वाले परिपथ पर चलाए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अत्यधिक धारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्यूज़</span><span style=\"font-family:'Mangal'\"> तार को गर्म करती है (जूल तापन), जिससे वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिघलकर</span><span style=\"font-family:'Mangal'\"> परिपथ तोड़ देता है और वायरिंग व उपकरण की रक्षा होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भू-संपर्क तार केवल उपकरण के धात्विक आवरण में रिसने वाली धारा के लिए सुरक्षा मार्ग है; वह कार्यकारी धारा नहीं ले जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः फ्यूज़ पिघलता है और परिपथ टूट जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पादपों में गति के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रकाशानुवर्तन में प्ररोह प्रकाश की ओर मुड़कर अनुक्रिया करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. जब प्रतान किसी आधार के संपर्क में आता है, तो आधार से सटा प्रतान का भाग दूर वाले भाग की तुलना में तेज़ी से बढ़ता है, जिससे प्रतान आधार के चारों ओर लिपट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. बीजांड की ओर पराग नलिका की वृद्धि रसायनानुवर्तन का उदाहरण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्ररोह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश की ओर</span><span style=\"font-family:'Mangal'\"> मुड़ते हैं (जड़ें उससे दूर मुड़ती हैं); प्रकाश के प्रति यह दिशात्मक वृद्धि अनुक्रिया </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाशानुवर्तन</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p
