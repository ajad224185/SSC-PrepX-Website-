;font-size:12pt\"><span style=\"font-family:'Mangal'\">76</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">88</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">a = 3x और b = 2y के साथ (a + b)² = a² + b² + 2ab का प्रयोग करने पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(3x + 2y)² = 9x² + 4y² + 2 × (3x)(2y) = 9x² + 4y² + </span><span style=\"font-weight:bold;font-family:'Mangal'\">12xy</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10² = 9x² + 4y² + 12 × 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 = 9x² + 4y² + </span><span style=\"font-weight:bold;font-family:'Mangal'\">36</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9x² + 4y² = 100 − 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">64</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">64 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तालिका में चार परिवारों की तीन महीनों की बिजली खपत (kWh में) दी गई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789733413805_image001.png\" width=\"269\" height=\"149\" alt ></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन महीनों में किस परिवार ने सबसे अधिक बिजली की खपत की, और उसने सबसे कम खपत वाले परिवार से कितनी अधिक (kWh में) खपत की?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, और 18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, और 15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C, और 27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B, और 27</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक परिवार का तीन महीनों का योग:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A = 120 + 135 + 150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">405 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B = 141 + 130 + 161 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">432 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C = 110 + 150 + 154 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">414 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D = 145 + 125 + 150 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">420 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे अधिक = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B (432)</span><span style=\"font-family:'Mangal'\">, सबसे कम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (405)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 432 − 405 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">27 kWh</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">B, और 27 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुकान एक वस्तु का मूल्य 50% बढ़ाकर अंकित करती है और फिर अंकित मूल्य पर 20% की छूट देती है। यदि अंतिम विक्रय मूल्य ₹2,400 है, तो क्रय मूल्य (₹ में) क्या था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,800</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,050</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्रय मूल्य ₹100 लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंकित मूल्य = ₹100 × 150% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹150</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विक्रय मूल्य = ₹150 × 80% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹120</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विक्रय मूल्य = क्रय मूल्य का 120% → क्रय मूल्य = 2,400 ÷ 1.2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: SP = CP × 1.5 × 0.8 = 1.2 CP → CP = 2,400 ÷ 1.2 = 2,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रय मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹2,000 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो रेलगाड़ियाँ, 310 m और 320 m लंबी, समांतर पटरियों पर विपरीत दिशाओं में चलती हैं। पहली 67 km/h और दूसरी 59 km/h की चाल से चलती है। वे एक-दूसरे को पार करने में कितना समय लेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 सेकंड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 सेकंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16 सेकंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 सेकंड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विपरीत दिशाएँ → सापेक्ष चाल = 67 + 59 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">126 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">126 km/h = (126 × 5) ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पार करने की कुल दूरी = 310 + 320 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">630 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = 630 ÷ 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 सेकंड</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रेलगाड़ियाँ एक-दूसरे को </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 सेकंड (विकल्प A)</span><span style=\"font-family:'Mangal'\"> में पार करती हैं।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 एक जैसे पेनों का क्रय मूल्य ₹450 है और 6 एक जैसी कॉपियों का क्रय मूल्य ₹240 है। ऐसे 20 पेनों और 9 कॉपियों का कुल क्रय मूल्य (₹ में) ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">900</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">920</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">980</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">960</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 पेन का मूल्य = 450 ÷ 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 कॉपी का मूल्य = 240 ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 पेनों का मूल्य = 20 × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹600</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 कॉपियों का मूल्य = 9 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹360</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल = 600 + 360 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल क्रय मूल्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹960 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मीनार के एक ही ओर, एक ही सीधी रेखा पर स्थित दो बिंदुओं से मीनार के शीर्ष के उन्नयन कोण 30° और 60° हैं। यदि दोनों बिंदुओं के बीच की दूरी 20 m है, तो मीनार की ऊँचाई ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8√3 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10√3 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीनार की ऊँचाई h और निकट वाला बिंदु मीनार के पाद से x दूरी पर लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकट बिंदु से: tan 60° = h ÷ x → √3 = h/x → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = h/√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूर वाले बिंदु से: tan 30° = h ÷ (x + 20) → 1/√3 = h/(x + 20) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x + 20 = h√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घटाने पर: h√3 − h/√3 = 20 → h(3 − 1)/√3 = 20 → 2h/√3 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">h = 20 × √3 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 30° और 60° कोणों के लिए, ऊँचाई = (बिंदुओं के बीच की दूरी) × √3 ÷ 2 = 20 × √3 ÷ 2 = 10√3 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मीनार की ऊँचाई </span><span style=\"font-weight:bold;font-family:'Mangal'\">10√3 m (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्जुन ने एक वस्तु ₹x में खरीदी। उसने इसे भावना को 10% हानि पर बेच दिया। भावना ने इसके परिवहन पर ₹120 खर्च किए और इसे चेतन को 25% लाभ पर बेच दिया। यदि चेतन ने इसे ₹1,500 में खरीदा, तो x का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,080</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,320</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चेतन का मूल्य ज्ञात है, इसलिए उल्टे क्रम में चलते हैं: चेतन → भावना → अर्जुन।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भावना की कुल लागत × 125% = ₹1,500 → भावना की कुल लागत = 1,500 ÷ 1.25 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भावना का क्रय मूल्य = 1,200 − 120 (परिवहन) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,080</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्जुन ने 10% हानि पर बेचा: x × 90% = 1,080 → x = 1,080 ÷ 0.9 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹1,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,200 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक मध्यम रूप से विषम वितरण ( Moderately skewed ) के लिए बहुलक 42 और माध्यिका 48 है। आनुभविक संबंध का प्रयोग करके माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आनुभविक संबंध: बहुलक = (3 × माध्यिका) − (2 × माध्य)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 = (3 × 48) − (2 × माध्य)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42 = 144 − (2 × माध्य) → 2 × माध्य = 144 − 42 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">102</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माध्य = 102 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">51</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: माध्य = (3 × माध्यिका − बहुलक) ÷ 2 = (144 − 42) ÷ 2 = 51</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः माध्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">51 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X व्यक्तियों को एक काम 24 दिनों में पूरा करने का ठेका दिया गया। 5 व्यक्ति काम पर नहीं आए, और शेष व्यक्तियों ने काम 30 दिनों में पूरा किया। X का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों स्थितियों में कुल काम समान है: व्यक्ति × दिन स्थिर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योजना: X × 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">24X</span><span style=\"font-family:'Mangal'\"> व्यक्ति-दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तविक: (X − 5) × 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30X − 150</span><span style=\"font-family:'Mangal'\"> व्यक्ति-दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24X = 30X − 150 → 6X = 150 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">X = 25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 25 × 24 = 600 = 20 × 30 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 7 अंकों की संख्या 82A5316, 22 से पूर्णतः विभाज्य है, तो A का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 = 2 × 11, अतः संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span><span style=\"font-family:'Mangal'\"> दोनों से विभाज्य होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 से विभाज्यता: अंतिम अंक 6 (सम) है → A के हर मान के लिए विभाज्य।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 से विभाज्यता: (दाईं ओर से विषम स्थानों के अंकों का योग) − (सम स्थानों के अंकों का योग) 0 या 11 का गुणज होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर से विषम स्थान: 6 + 3 + A + 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17 + A</span><span style=\"font-family:'Mangal'\">; सम स्थान: 1 + 5 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर = 17 + A − 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 + A</span><span style=\"font-family:'Mangal'\">, जो 0 या 11 का गुणज होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 + A = 11 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">A = 2</span><span style=\"font-family:'Mangal'\"> (A एक अंक है, अतः 9 + A = 22 संभव नहीं).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी निश्चित राशि पर, समान ब्याज दर से, 2 वर्षों का साधारण ब्याज ₹66 और चक्रवृद्धि ब्याज ₹69 है। राशि (₹ में) क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">358</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">363</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">356</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">367</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 वर्ष का साधारण ब्याज = 66 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹33</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्षों में CI − SI = 69 − 66 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3</span><span style=\"font-family:'Mangal'\"> = पहले वर्ष के ब्याज (₹33) पर 1 वर्ष का ब्याज</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दर = 3 ÷ 33 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100/11 %</span><span style=\"font-family:'Mangal'\"> वार्षिक</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राशि = SI × 100 ÷ (R × T) = 66 × 100 ÷ (100/11 × 2) = (66 × 11) ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹363</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: 2 वर्षों के लिए, राशि = (SI ÷ 2)² ÷ (CI − SI) = 33² ÷ 3 = 1,089 ÷ 3 = 363</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः राशि </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹363 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सरल कीजिए: 144 ÷ 12 × 5 + 18 − 7</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">61</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">65</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">71</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें: पहले भाग और गुणा, बाएँ से दाएँ, फिर जोड़ और घटाव।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">144 ÷ 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 + 18 − 7 = 78 − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">71</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मान </span><span style=\"font-weight:bold;font-family:'Mangal'\">71 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पाइप एक टंकी को 8 घंटे में भर सकता है। टंकी के तल में रिसाव होने के कारण, टंकी 10 घंटे में भरती है। रिसाव अकेले पूरी भरी हुई टंकी को कितने घंटे में खाली कर सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">45 घंटे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35 घंटे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 घंटे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 घंटे</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप अकेला 1 घंटे में टंकी का </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/8</span><span style=\"font-family:'Mangal'\"> भरता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाइप और रिसाव मिलकर 1 घंटे में टंकी का </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span><span style=\"font-family:'Mangal'\"> भरते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रिसाव प्रति घंटा खाली करता है = 1/8 − 1/10 = (5 − 4) ÷ 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/40</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रिसाव अकेला भरे टंकी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 घंटे</span><span style=\"font-family:'Mangal'\"> में खाली करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: समय = (8 × 10) ÷ (10 − 8) = 80 ÷ 2 = 40 घंटे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रिसाव अकेला टंकी को </span><span style=\"font-weight:bold;font-family:'Mangal'\">40 घंटे (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में खाली कर सकता है।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्यालय में विद्यार्थियों की संख्या हर वर्ष 12.5% बढ़ती है। यदि वर्तमान में विद्यालय में 1,280 विद्यार्थी हैं, तो 2 वर्ष बाद कितने विद्यार्थी होंगे, यह मानते हुए कि वृद्धि वार्षिक चक्रवृद्धि है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,620</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,640</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,584</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.5% = 1/8, अतः हर वर्ष संख्या पिछले वर्ष की 9/8 हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 वर्ष बाद = (1,280 × 9) ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,440</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 वर्ष बाद = (1,440 × 9) ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,620</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: A = P × (1 + R/100)ⁿ = 1,280 × (9/8)² = (1,280 × 81) ÷ 64 = 1,620</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विद्यालय में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,620 विद्यार्थी (विकल्प B)</span><span style=\"font-family:'Mangal'\"> होंगे।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक हॉल में 6 बेलनाकार खंभे हैं, प्रत्येक की त्रिज्या 0.7 m और ऊँचाई 5 m है। प्रत्येक खंभे के वक्र पृष्ठ पर ₹30 प्रति वर्ग मीटर की दर से पेंट किया जाना है। सभी 6 खंभों पर पेंट करने की कुल लागत ज्ञात कीजिए। (π = 22/7 लें)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,960</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,620</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹3,300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹4,200</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक खंभे का वक्र पृष्ठीय क्षेत्रफल = 2πrh = 2 × (22/7) × 0.7 × 5 = 2 × 22 × 0.1 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 खंभों का वक्र पृष्ठीय क्षेत्रफल = 6 × 22 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">132 m²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लागत = 132 × ₹30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पेंट करने की कुल लागत </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹3,960 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुनीता की मासिक आय ₹40,000 है और वह इसका 10% बचाती है। यदि उसकी आय 25% बढ़ जाए और उसका व्यय 20% बढ़ जाए, तो उसकी बचत कितने प्रतिशत बढ़ेगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">70%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">75%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान बचत = ₹40,000 × 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹4,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान व्यय = 40,000 − 4,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹36,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई आय = ₹40,000 × 125% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹50,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नया व्यय = ₹36,000 × 120% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹43,200</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई बचत = 50,000 − 43,200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹6,800</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बचत में वृद्धि = 6,800 − 4,000 = ₹2,800 → 2,800 ÷ 4,000 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">70%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसकी बचत </span><span style=\"font-weight:bold;font-family:'Mangal'\">70% (विकल्प A)</span><span style=\"font-family:'Mangal'\"> बढ़ेगी।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 5, 12.5, 18.4 और x समानुपात में हैं, तो x का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">46</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार संख्याएँ a, b, c, d समानुपात में होती हैं जब a : b = c : d, अर्थात् a × d = b × c.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 × x = 12.5 × 18.4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.5 × 18.4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">230</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 230 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">46</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: x = (b × c) ÷ a = (12.5 × 18.4) ÷ 5 = 46</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">46 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B की पुत्री है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B का अर्थ है कि ‘A, B की पत्नी है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B का अर्थ है कि ‘A, B का पुत्र है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पति है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P + Q − R × S ÷ T’ है, तो P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पुत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री की पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P + Q − R × S ÷ T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P, Q की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q – R → Q, R की पत्नी है। Q और R पति-पत्नी हैं, इसलिए P, R की भी पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R × S → R, S का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S ÷ T → S, T का पति है। S और T पति-पत्नी हैं, इसलिए R, T का भी पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, R की पुत्री है और R, T का पुत्र है → P, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T के पुत्र की पुत्री (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U और V एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं। Q, T के दाईं ओर तीसरे स्थान पर बैठा है। S, P के दाईं ओर दूसरे स्थान पर बैठा है। T, R और S दोनों का निकटतम पड़ोसी है। V, Q का निकटतम पड़ोसी नहीं है। R के बाईं ओर से गिनने पर R और P के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले T को रखें; Q, T के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाएँ तीसरे</span><span style=\"font-family:'Mangal'\"> स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, R और S दोनों का निकटतम पड़ोसी है → R और S, T के दोनों ओर बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">दाएँ दूसरे</span><span style=\"font-family:'Mangal'\"> स्थान पर है → P, S के बाईं ओर दूसरे स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 1: S, T के ठीक दाईं ओर और R, T के ठीक बाईं ओर → S के बाईं ओर दूसरी सीट R की है, अतः P को R होना पड़ेगा → </span><span style=\"font-weight:bold;font-family:'Mangal'\">संभव नहीं</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिति 2: S, T के ठीक बाईं ओर और R, T के ठीक दाईं ओर → P, S के बाईं ओर दूसरे स्थान पर; S और P के बीच की सीट तथा R और Q के बीच की सीट U और V के लिए बचती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V, Q का पड़ोसी नहीं है → V, S और P के बीच बैठता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">U, R और Q के बीच</span><span style=\"font-family:'Mangal'\"> बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (दक्षिणावर्त, अर्थात् प्रत्येक व्यक्ति के दाईं ओर की ओर): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P – V – S – T – R – U – Q</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R के बाईं ओर से गिनें: T, S, V और फिर P → R और P के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> व्यक्ति।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R और P के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> व्यक्ति बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, K का पुत्र है। K, D की पत्नी है। T, P का पिता है। T, D का भाई है। R का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता के भाई का पुत्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई का पुत्र</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिता का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता के भाई का पुत्र</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K, D की पत्नी है → K और D पति-पत्नी हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, K का पुत्र है → R, D का भी पुत्र है (एक की संतान दोनों पति-पत्नी की संतान मानी जाती है) → D, R का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, D का भाई है → T, R के पिता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, P का पिता है → P, R के पिता के भाई की संतान है, अर्थात् R और P चचेरे भाई-बहन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P की ओर से: R का पिता D, P के पिता का भाई है, और R, D का पुत्र है → R, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता के भाई का पुत्र</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: R, P का भतीजा नहीं है (भाई का पुत्र), R, D का पुत्र है न कि D का भाई (पिता का भाई), और D, P के पिता का भाई है, माता का भाई नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः R, P के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पिता के भाई का पुत्र (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर XYME, ABPH से एक निश्चित प्रकार से संबंधित है। उसी प्रकार LFHU, OIKX से संबंधित है। उसी तर्क के अनुसार INGV निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KPIX</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LRKY</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LRJZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LQJY</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYME → ABPH: X + 3 = A (24 + 3 = 27 → 1), Y + 3 = B, M + 3 = P, E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LFHU → OIKX: L + 3 = O, F + 3 = I, H + 3 = K, U + 3 = X → नियम: प्रत्येक अक्षर </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> बढ़ता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">INGV → I + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\">, N + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, G + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span><span style=\"font-family:'Mangal'\">, V + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Y</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">INGV के प्रत्येक अक्षर में 3 जोड़ने पर कोई अन्य विकल्प प्राप्त नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः INGV, </span><span style=\"font-weight:bold;font-family:'Mangal'\">LQJY (विकल्प D)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख किए 42 व्यक्तियों की एक पंक्ति में मीना दाएँ छोर से 15वें स्थान पर है। यदि रवि मीना के बाईं ओर 11वें स्थान पर बैठा है, तो पंक्ति के बाईं ओर छोर से रवि का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">17वाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16वाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18वाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15वाँ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से मीना का स्थान = 42 − 15 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">28वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रवि, मीना के बाईं ओर 11वें स्थान पर → बाएँ से रवि का स्थान = 28 − 11 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">17वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रवि बाएँ छोर से </span><span style=\"font-weight:bold;font-family:'Mangal'\">17वें (विकल्प A)</span><span style=\"font-family:'Mangal'\"> स्थान पर है।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DJ - HN</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KR - OV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MS - QX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TB - XF</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DJ − HN: D + 4 = H, J + 4 = N → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KR − OV: K + 4 = O, R + 4 = V → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MS − QX: M + 4 = Q, S + 5 = X → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, +5</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TB − XF: T + 4 = X, B + 4 = F → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (+4, +4) का पालन करते हैं; केवल MS − QX नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">MS - QX (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘+’ और ‘−’ को आपस में बदल दिया जाए तथा ‘×’ और ‘÷’ को आपस में बदल दिया जाए, तो निम्नलिखित समीकरण में ‘?’ के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">162 ÷ 27 × 486 − 235 + 190 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">64</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">44</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्न बदलें: (162 × 27) ÷ 486 + 235 − 190</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (पहले × और ÷, बाएँ से दाएँ): 162 × 27 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4374</span><span style=\"font-family:'Mangal'\">; 4374 ÷ 486 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 9 + 235 − 190 = 244 − 190 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DKP : HJR</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RCW : VBY</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MHT : QIV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MHT : QGV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MHT : PGV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MHT : QGU</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DKP → HJR: D + 4 = H, K − 1 = J, P + 2 = R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RCW → VBY: R + 4 = V, C − 1 = B, W + 2 = Y → पैटर्न (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+4, −1, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MHT → M + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, H − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, T + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QIV, PGV और QGU में QGV से एक-एक अक्षर भिन्न है, अतः वे पैटर्न का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">MHT : QGV (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A, B, C, D, E, F और G में से प्रत्येक की परीक्षा एक ही सप्ताह के सोमवार से रविवार तक अलग-अलग दिन है। D की परीक्षा बुधवार को है। B की परीक्षा G के ठीक अगले दिन है। A और E के बीच केवल दो व्यक्तियों की परीक्षा है। C की परीक्षा D के ठीक पहले वाले दिन है। E की परीक्षा न तो शनिवार को है और न ही सोमवार को। F की परीक्षा G के ठीक पहले वाले दिन है। निम्नलिखित में से किसकी परीक्षा रविवार को है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिनों को 1 (सोमवार) से 7 (रविवार) तक क्रमांक दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D = बुधवार = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">; C, D के ठीक पहले → C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\"> (मंगलवार).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, G के ठीक पहले और B, G के ठीक बाद → F, G, B </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगातार तीन दिन</span><span style=\"font-family:'Mangal'\"> घेरते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाली दिन 1, 4, 5, 6, 7 हैं; लगातार तीन खाली दिन केवल 4–5–6 या 5–6–7 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और E के बीच दो व्यक्ति → A और E में 3 दिन का अंतर; F, G, B के 4–5–6 पर होने पर खाली दिन 1 और 7 (6 का अंतर) ✗, अतः F, G, B </span><span style=\"font-weight:bold;font-family:'Mangal'\">5, 6, 7</span><span style=\"font-family:'Mangal'\"> पर और A, E </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 और 4</span><span style=\"font-family:'Mangal'\"> पर ✓.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E सोमवार को नहीं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">E = 4 (गुरुवार), A = 1 (सोमवार)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: सोम A, मंगल C, बुध D, गुरु E, शुक्र F, शनि G, </span><span style=\"font-weight:bold;font-family:'Mangal'\">रवि B</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रविवार को </span><span style=\"font-weight:bold;font-family:'Mangal'\">B (विकल्प C)</span><span style=\"font-family:'Mangal'\"> की परीक्षा है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शब्द MARGINS के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाता है। इस प्रकार बने नए अक्षर-समूह में बाएँ से चौथे अक्षर और दाएँ से पहले अक्षर के बीच अंग्रेज़ी वर्णमाला क्रम में कितने अक्षर हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MARGINS के अक्षरों को वर्णमाला क्रम में लगाएँ: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A G I M N R S</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से चौथा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> (13); दाएँ से पहला = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\"> (19)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला में M और S के बीच के अक्षर: N, O, P, Q, R → 19 − 13 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उनके बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> अक्षर हैं।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BZR FVU JRX NNA ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RJC</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RJD</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SJD</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RKD</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: B → F → J → N: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\"> → अगला N + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: Z → V → R → N: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−4</span><span style=\"font-family:'Mangal'\"> → अगला N − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">J</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: R → U → X → A: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> (X = 24, 24 + 3 = 27 → 1 = A) → अगला A + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">RJD (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह मित्र E, F, G, H, L और M एक सीधी पंक्ति में उत्तर की ओर मुख करके बैठे हैं। L और M के बीच केवल चार व्यक्ति बैठे हैं। E, M के ठीक बाईं ओर बैठा है। E और H के बीच केवल एक व्यक्ति बैठा है। G, F के बाईं ओर किसी स्थान पर बैठा है। F और G के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 6 तक क्रमांक दें (सभी उत्तर की ओर मुख किए हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L और M के बीच चार व्यक्ति → L और M दोनों छोरों (सीट 1 और 6) पर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E, M के ठीक बाईं ओर है → M बाएँ छोर पर नहीं हो सकता, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">M = 6, E = 5, L = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E और H के बीच एक व्यक्ति → H = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\"> (सीट 7 नहीं होती).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G, F के बाईं ओर है → खाली सीटें 2 और 4 से </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 2, F = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">L – G – H – F – E – M</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">G (2) और F (4) के बीच केवल H है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक</span><span style=\"font-family:'Mangal'\"> व्यक्ति।</span></p><p style=\"margin-t nt-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): सभी पहाड़ियाँ नदियाँ हैं → कथन कहता है कि सभी नदियाँ पहाड़ियाँ हैं, इसका उल्टा नहीं; पहाड़ियों में ऐसी वस्तुएँ हो सकती हैं जो नदियाँ नहीं हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PU – KY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GM – BQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SX – NB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">JT – EY</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span>
