<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LAMP और PALE में तीन अक्षर उभयनिष्ठ हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">L, A, P</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उनके कूट ‘5382’ और ‘2351’ में तीन अंक उभयनिष्ठ हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">5, 3, 2</span><span style=\"font-family:'Mangal'\"> → ये L, A और P के कूट हैं (किसी क्रम में)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LAMP का एकमात्र अक्षर जो PALE में नहीं है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> है, और ‘5382’ का एकमात्र अंक जो ‘2351’ में नहीं है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘M’ का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से हाइड्रोकार्बन संकलन अभिक्रियाएँ करते हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₂H₆, C₃H₈, C₃H₆, C₂H₂, CH₄</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₂H₆ और CH₄</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₃H₈ और C₃H₆</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₂H₂ और C₂H₆</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₃H₆ और C₂H₂</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संकलन अभिक्रियाएँ (जैसे निकैल या पैलेडियम उत्प्रेरक की उपस्थिति में हाइड्रोजन का जुड़ना) </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंतृप्त</span><span style=\"font-family:'Mangal'\"> हाइड्रोकार्बन देते हैं, जिनके कार्बन परमाणुओं के बीच द्विबंध या त्रिबंध होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₂H₆ (एथेन), C₃H₈ (प्रोपेन) और CH₄ (मेथेन) केवल एकल बंध वाले </span><span style=\"font-weight:bold;font-family:'Mangal'\">संतृप्त</span><span style=\"font-family:'Mangal'\"> हाइड्रोकार्बन (ऐल्केन) हैं → ये संकलन अभिक्रिया नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₃H₆ (प्रोपीन) ऐल्कीन के सूत्र CₙH₂ₙ पर खरा उतरता है → एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्विबंध</span><span style=\"font-family:'Mangal'\">; C₂H₂ (एथाइन) ऐल्काइन है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्रिबंध</span><span style=\"font-family:'Mangal'\"> → दोनों </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंतृप्त</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः C₃H₆ और C₂H₂ संकलन अभिक्रियाएँ करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): ग्रह तारों की तुलना में अधिक टिमटिमाते हैं क्योंकि वे पृथ्वी के बहुत निकट हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ग्रह प्रकाश के विस्तृत स्रोत के रूप में दिखाई देता है, इसलिए उसके अनेक बिंदु-आकार स्रोतों से आने वाले प्रकाश की मात्रा में परिवर्तन औसत होकर शून्य हो जाते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तारे बहुत दूर हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिंदु स्रोतों</span><span style=\"font-family:'Mangal'\"> की तरह व्यवहार करते हैं; उनके प्रकाश का वायुमंडलीय अपवर्तन लगातार बदलता रहता है, इसलिए आँख में प्रवेश करने वाले प्रकाश की मात्रा घटती-बढ़ती है और तारा </span><span style=\"font-weight:bold;font-family:'Mangal'\">टिमटिमाता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्रह बहुत निकट हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">विस्तृत स्रोत</span><span style=\"font-family:'Mangal'\"> (अनेक बिंदु स्रोतों का समूह) के रूप में दिखते हैं; इन स्रोतों के प्रकाश के परिवर्तन </span><span style=\"font-weight:bold;font-family:'Mangal'\">औसत होकर शून्य</span><span style=\"font-family:'Mangal'\"> हो जाते हैं, जिससे टिमटिमाहट समाप्त हो जाती है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ग्रह </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं टिमटिमाते</span><span style=\"font-family:'Mangal'\">, भले ही वे पृथ्वी के अधिक निकट हों → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खिड़की के पास रखा एक गमले का पौधा एक ओर से आते प्रकाश की ओर मुड़ जाता है। इस मुड़ने में ऑक्सिन की भूमिका को निम्नलिखित में से कौन-सा सही बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सिन प्ररोह के प्रकाशित पार्श्व में एकत्र होकर उन कोशिकाओं को लंबा बनाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सिन प्रकाश से नष्ट हो जाता है, इसलिए प्ररोह का प्रकाशित पार्श्व बढ़ना बंद कर देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सिन मूल शीर्ष पर संश्लेषित होकर ऊपर प्ररोह तक जाता है और मुड़ने का कारण बनता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सिन प्ररोह के छायादार पार्श्व की ओर विसरित होकर उन कोशिकाओं को लंबा होने के लिए प्रेरित करता है, जिससे प्ररोह प्रकाश की ओर मुड़ जाता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सिन</span><span style=\"font-family:'Mangal'\"> एक पादप हॉर्मोन है जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्ररोह शीर्ष</span><span style=\"font-family:'Mangal'\"> पर संश्लेषित होता है और कोशिकाओं को लंबा होने में मदद करता है; अन्य पादप हॉर्मोनों की तरह यह अपने कार्य-स्थल तक विसरित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब प्रकाश एक ओर से आता है, तो ऑक्सिन प्ररोह के </span><span style=\"font-weight:bold;font-family:'Mangal'\">छायादार पार्श्व की ओर विसरित</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छायादार पार्श्व में ऑक्सिन की अधिक सांद्रता उन कोशिकाओं को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबा होने</span><span style=\"font-family:'Mangal'\"> के लिए प्रेरित करती है, इसलिए प्ररोह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश की ओर</span><span style=\"font-family:'Mangal'\"> मुड़ता दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऑक्सिन छायादार पार्श्व में जाकर उन कोशिकाओं को लंबा करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): आँधी-तूफ़ान के दौरान बिजली की चमक पहले दिखाई देती है और गर्जन बाद में सुनाई देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ध्वनि तरंगें अनुदैर्ध्य तरंगें हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश लगभग 3 × 10⁸ m/s की चाल से चलता है, जबकि वायु में ध्वनि केवल लगभग 340 m/s की चाल से; इसलिए बिजली का प्रकाश हम तक लगभग तुरंत पहुँचता है और गर्जन बाद में → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंग में माध्यम के कण संचरण की दिशा के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समांतर</span><span style=\"font-family:'Mangal'\"> कंपन करते हैं, अतः ध्वनि तरंगें </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुदैर्ध्य</span><span style=\"font-family:'Mangal'\"> हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु यह देरी प्रकाश की तुलना में ध्वनि की </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुत कम चाल</span><span style=\"font-family:'Mangal'\"> के कारण है, ध्वनि तरंगों की अनुदैर्ध्य प्रकृति के कारण नहीं → R, A की व्याख्या नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दूधवाला ताज़े दूध (pH लगभग 6) में बहुत थोड़ा बेकिंग सोडा मिला देता है। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध का pH 6 से नीचे गिर जाता है और वह जल्दी दही में जम जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">pH थोड़ा क्षारीय हो जाता है, इसलिए बनने वाला लैक्टिक अम्ल उदासीन हो जाता है और दूध को दही में जमने में अधिक समय लगता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेकिंग सोडा अम्लीय है, इसलिए यह लैक्टिक अम्ल बनने की गति बढ़ा देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूध का pH 6 ही रहता है क्योंकि बेकिंग सोडा एक उदासीन लवण है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताज़े दूध का pH लगभग 6 होता है; दही बनते समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैक्टिक अम्ल</span><span style=\"font-family:'Mangal'\"> बनता है और pH </span><span style=\"font-weight:bold;font-family:'Mangal'\">घटता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बेकिंग सोडा (सोडियम हाइड्रोजनकार्बोनेट, NaHCO₃) एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">हल्का, असंक्षारक क्षारकीय लवण</span><span style=\"font-family:'Mangal'\"> है, इसलिए इसे मिलाने पर दूध का pH 6 से </span><span style=\"font-weight:bold;font-family:'Mangal'\">थोड़ा क्षारीय</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षारीय स्थिति में बना लैक्टिक अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदासीन</span><span style=\"font-family:'Mangal'\"> हो जाता है, इसलिए दूध को दही में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जमने में अधिक समय</span><span style=\"font-family:'Mangal'\"> लगता है (दूधवाला इसीलिए इसे मिलाता है, ताकि दूध जल्दी न फटे)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः pH थोड़ा क्षारीय हो जाता है और दूध को जमने में अधिक समय लगता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): कंडरा (टेंडन) संधि पर एक हड्डी को दूसरी हड्डी से जोड़ती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): कंडरा दृढ़ संयोजी ऊतक की मज़बूत, लचीली पट्टियाँ हैं जो पेशी के संकुचन के बल को हड्डी तक पहुँचाती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कंडरा (टेंडन)</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेशी को हड्डी से</span><span style=\"font-family:'Mangal'\"> जोड़ती है; संधि पर हड्डी को हड्डी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्नायु (लिगामेंट)</span><span style=\"font-family:'Mangal'\"> जोड़ता है → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कंडरा दृढ़ संयोजी ऊतक की मज़बूत, लचीली पट्टी है; पेशी के संकुचन पर कंडरा इस बल को हड्डी तक पहुँचाती है, जिससे संधि पर गति होती है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दूर-दृष्टि दोष (हाइपरमेट्रोपिया) वाली आँख का निकट बिंदु 1 m है। व्यक्ति को 25 cm (सामान्य आँख का निकट बिंदु) पर रखी पुस्तक पढ़ने योग्य बनाने के लिए आवश्यक लेंस की शक्ति है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−3 D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+3 D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+1 D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">+4 D</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संशोधक लेंस को पुस्तक (25 cm पर रखी) का </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी प्रतिबिंब</span><span style=\"font-family:'Mangal'\"> व्यक्ति के निकट बिंदु </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 m</span><span style=\"font-family:'Mangal'\"> पर, पुस्तक की ओर ही, बनाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वस्तु दूरी u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−25 cm</span><span style=\"font-family:'Mangal'\">, प्रतिबिंब दूरी v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−100 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र: 1/f = 1/v − 1/u = −1/100 + 1/25 = (−1 + 4) ÷ 100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3/100</span><span style=\"font-family:'Mangal'\"> → f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+33.3 cm</span><span style=\"font-family:'Mangal'\"> = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+0.333 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शक्ति P = 1/f = 1 ÷ 0.333 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3 D</span><span style=\"font-family:'Mangal'\">; धनात्मक चिह्न </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल (अभिसारी)</span><span style=\"font-family:'Mangal'\"> लेंस दर्शाता है, जैसा दूर-दृष्टि दोष में अपेक्षित है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः आवश्यक शक्ति +3 D है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परागण के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. गेहूँ, मक्का और चावल जैसे वायु-परागित पौधों में परागकण हल्के और छोटे होते हैं तथा बड़ी संख्या में बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वायु-परागित पौधों में वर्तिकाग्र लंबा और पंखदार होता है ताकि परागकणों को पकड़ सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कीट-परागित फूलों में परागकण बड़े, चिपचिपे या काँटेदार होते हैं ताकि वे कीट के शरीर से चिपक सकें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वायु-परागण गेहूँ, मक्का और चावल में होता है; इनके परागकण </span><span style=\"font-weight:bold;font-family:'Mangal'\">हल्के, छोटे और बड़ी संख्या में</span><span style=\"font-family:'Mangal'\"> बनते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. वायु-परागित पौधों में वर्तिकाग्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबा और पंखदार</span><span style=\"font-family:'Mangal'\"> होता है ताकि पराग को पकड़ सके → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कीट-परागण में परागकण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़े, चिपचिपे या काँटेदार</span><span style=\"font-family:'Mangal'\"> होते हैं ताकि कीट के शरीर से चिपक सकें, और वर्तिकाग्र भी चिपचिपा होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन परमाणु स्पीशीज़ की संरचना इस प्रकार है: X में 18 प्रोटॉन और 19 न्यूट्रॉन; Y में 17 प्रोटॉन और 18 न्यूट्रॉन; Z में 17 प्रोटॉन और 20 न्यूट्रॉन हैं। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y और Z समभारिक हैं, तथा Z और X समस्थानिक हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X और Y एक ही तत्व के समस्थानिक हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X, Y और Z सभी एक ही तत्व के समस्थानिक हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Y और Z एक ही तत्व के समस्थानिक हैं, तथा Z और X समभारिक हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान संख्या A = प्रोटॉन + न्यूट्रॉन: X = 18 + 19 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\">; Y = 17 + 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">35</span><span style=\"font-family:'Mangal'\">; Z = 17 + 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Y और Z</span><span style=\"font-family:'Mangal'\"> का परमाणु क्रमांक समान (17, क्लोरीन) परंतु द्रव्यमान संख्या भिन्न (35 और 37) है → ये एक ही तत्व के </span><span style=\"font-weight:bold;font-family:'Mangal'\">समस्थानिक</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Z और X</span><span style=\"font-family:'Mangal'\"> की द्रव्यमान संख्या समान (37) परंतु परमाणु क्रमांक भिन्न (17 और 18) है → ये </span><span style=\"font-weight:bold;font-family:'Mangal'\">समभारिक</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">X (18 प्रोटॉन, आर्गन) Y और Z से भिन्न तत्व है, इसलिए वह उनका समस्थानिक नहीं हो सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः Y और Z समस्थानिक हैं तथा Z और X समभारिक हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक कार्बोनेट अयस्क को सीमित वायु में तेज़ गर्म किया जाता है: ZnCO₃(s) → ZnO(s) + CO₂(g). ज़िंक के निष्कर्षण का यह चरण कहलाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भर्जन (रोस्टिंग)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत अपघटनी अपचयन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निस्तापन (कैल्सीनेशन)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत अपघटनी परिष्करण</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सक्रियता श्रेणी के मध्य की धातुएँ (Zn, Fe, Pb, Cu) मुख्यतः सल्फाइड या कार्बोनेट के रूप में मिलती हैं, और धातु को उसके </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्साइड</span><span style=\"font-family:'Mangal'\"> से प्राप्त करना आसान है, इसलिए इन अयस्कों को पहले ऑक्साइड में बदला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बोनेट अयस्कों</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">सीमित वायु</span><span style=\"font-family:'Mangal'\"> में तेज़ गर्म करके ऑक्साइड में बदला जाता है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">निस्तापन</span><span style=\"font-family:'Mangal'\"> है: ZnCO₃(s) → ZnO(s) + CO₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(</span><span style=\"font-weight:bold;font-family:'Mangal'\">सल्फाइड अयस्कों</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक वायु</span><span style=\"font-family:'Mangal'\"> में तेज़ गर्म करके ऑक्साइड में बदला जाता है; वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">भर्जन</span><span style=\"font-family:'Mangal'\"> है: 2ZnS + 3O₂ → 2ZnO + 2SO₂.)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाद में ऑक्साइड का कार्बन से अपचयन किया जाता है (ZnO + C → Zn + CO); विद्युत अपघटनी परिष्करण निष्कर्षण के बाद का शोधन चरण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह चरण निस्तापन है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय क्षेत्र रेखाओं के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. छड़ चुंबक के भीतर क्षेत्र रेखाओं की दिशा उसके दक्षिणी ध्रुव से उत्तरी ध्रुव की ओर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दो चुंबकीय क्षेत्र रेखाएँ कभी एक-दूसरे को नहीं काटतीं, क्योंकि प्रतिच्छेद बिंदु पर कंपास सुई को दो दिशाओं में इंगित करना पड़ता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जिस क्षेत्र में क्षेत्र रेखाएँ सघन (पास-पास) होती हैं, वहाँ चुंबकीय क्षेत्र दुर्बल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. परिपाटी के अनुसार चुंबक के बाहर क्षेत्र रेखाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तरी ध्रुव</span><span style=\"font-family:'Mangal'\"> से निकलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिणी ध्रुव</span><span style=\"font-family:'Mangal'\"> में मिलती हैं; चुंबक के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भीतर</span><span style=\"font-family:'Mangal'\"> वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिणी ध्रुव से उत्तरी ध्रुव</span><span style=\"font-family:'Mangal'\"> की ओर जाती हैं, जिससे बंद वक्र बनते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दो क्षेत्र रेखाएँ कभी </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं काटतीं</span><span style=\"font-family:'Mangal'\">, क्योंकि प्रतिच्छेद बिंदु पर कंपास सुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो दिशाओं</span><span style=\"font-family:'Mangal'\"> में इंगित करती, जो संभव नहीं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. क्षेत्र रेखाओं की </span><span style=\"font-weight:bold;font-family:'Mangal'\">निकटता</span><span style=\"font-family:'Mangal'\"> क्षेत्र की सापेक्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबलता</span><span style=\"font-family:'Mangal'\"> दर्शाती है: जहाँ रेखाएँ सघन हैं, वहाँ क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रबल</span><span style=\"font-family:'Mangal'\"> होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहसंयोजक यौगिकों के नामकरण की उपसर्ग प्रणाली के अनुसार, निम्नलिखित में से कौन-सा नाम सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H₂S – डाइहाइड्रोजन सल्फाइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CS₂ – कार्बन डाइसल्फाइड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SF₆ – सल्फर पेंटाफ्लोराइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PCl₃ – मोनोफॉस्फोरस ट्राइक्लोराइड</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उपसर्ग मोनो- (1), डाइ- (2), ट्राइ- (3), टेट्रा- (4), पेंटा- (5), हेक्सा- (6) प्रत्येक तत्व के परमाणुओं की संख्या बताते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहले तत्व</span><span style=\"font-family:'Mangal'\"> के लिए उपसर्ग </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोनो-</span><span style=\"font-family:'Mangal'\"> प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं लिखा</span><span style=\"font-family:'Mangal'\"> जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">CS₂</span><span style=\"font-family:'Mangal'\">: एक कार्बन और दो सल्फर परमाणु → </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइसल्फाइड</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H₂S: जब </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन पहला तत्व</span><span style=\"font-family:'Mangal'\"> हो, तो उसके आगे कोई उपसर्ग नहीं लगता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन सल्फाइड</span><span style=\"font-family:'Mangal'\">, डाइहाइड्रोजन सल्फाइड नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SF₆ में छह फ्लोरीन परमाणु हैं → सल्फर </span><span style=\"font-weight:bold;font-family:'Mangal'\">हेक्सा</span><span style=\"font-family:'Mangal'\">फ्लोराइड, पेंटाफ्लोराइड नहीं; PCl₃ → बिना मोनो- के </span><span style=\"font-weight:bold;font-family:'Mangal'\">फॉस्फोरस ट्राइक्लोराइड</span><span style=\"font-family:'Mangal'\"> → दोनों गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही नाम CS₂ – कार्बन डाइसल्फाइड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में अपरा (प्लेसेंटा) के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्लेसेंटा गर्भाशय की भित्ति में धँसी एक तश्तरी (डिस्क) जैसी संरचना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. इसमें भ्रूण की ओर अंकुर (विलाई) और माता की ओर रक्त स्थान होते हैं, जो माता से भ्रूण तक ग्लूकोज़ और ऑक्सीजन के जाने के लिए बड़ा पृष्ठीय क्षेत्रफल देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. विकासशील भ्रूण से उत्पन्न अपशिष्ट पदार्थ प्लेसेंटा के माध्यम से माता के रक्त में स्थानांतरित
