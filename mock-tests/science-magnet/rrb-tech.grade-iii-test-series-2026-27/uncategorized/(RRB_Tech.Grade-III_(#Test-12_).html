<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>25.) RRB Tech.Grade-III (#Test-12   - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

<span style=\"font-family:'Mangal'\">यदि जीन में ऐसा परिवर्तन हो जाए कि एंजाइम </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम दक्षता से</span><span style=\"font-family:'Mangal'\"> कार्य करे, तो प्रक्रिया धीमी हो जाती है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हार्मोन कम मात्रा में</span><span style=\"font-family:'Mangal'\"> बनता है, जिससे पौधा बौना रह जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कम दक्षता वाला एंजाइम बनना बंद नहीं होता: जीन उसे बनाता तो है, केवल हार्मोन कम बनता है, इसलिए पौधा इसी कारण से बौना है, न कि निर्माण पूरी तरह रुक जाने के कारण।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पौधा बौना होगा क्योंकि हार्मोन कम मात्रा में बनता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लवणों और क्रिस्टलन जल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. जलयोजित कॉपर सल्फेट की एक सूत्र इकाई में क्रिस्टलन जल के पाँच अणु होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. धोने का सोडा, Na₂CO₃.10H₂O, जल की स्थायी कठोरता दूर करने में प्रयुक्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. नीले कॉपर सल्फेट के क्रिस्टल गर्म करने पर सफ़ेद हो जाते हैं, और नीला रंग कभी वापस नहीं लाया जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्रिस्टलन जल</span><span style=\"font-family:'Mangal'\"> किसी लवण की एक सूत्र इकाई में उपस्थित जल अणुओं की निश्चित संख्या है; जलयोजित कॉपर सल्फेट </span><span style=\"font-weight:bold;font-family:'Mangal'\">CuSO₄.5H₂O</span><span style=\"font-family:'Mangal'\"> है, अतः इसमें ऐसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">पाँच</span><span style=\"font-family:'Mangal'\"> अणु होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">धोने का सोडा, Na₂CO₃.10H₂O</span><span style=\"font-family:'Mangal'\">, सोडियम क्लोराइड से प्राप्त होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल की स्थायी कठोरता दूर करने</span><span style=\"font-family:'Mangal'\"> में प्रयुक्त होता है, साथ ही काँच, साबुन तथा कागज़ उद्योग में भी → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. गर्म करने पर नीले क्रिस्टल अपना क्रिस्टलन जल खो देते हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सफ़ेद</span><span style=\"font-family:'Mangal'\"> हो जाते हैं, परंतु जल की कुछ बूँदें डालने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीला रंग लौट आता</span><span style=\"font-family:'Mangal'\"> है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत की पहली परखनली शिशु का जन्म 1978 में कोलकाता में हुआ था। इस कार्य के प्रणेता वैज्ञानिक थे:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुभाष मुखोपाध्याय</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पी. माहेश्वरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बीरबल साहनी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">राम बक्स सिंह</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोलकाता के </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुभाष मुखोपाध्याय</span><span style=\"font-family:'Mangal'\"> ने पात्रे निषेचन पर अपने प्रायोगिक कार्य से </span><span style=\"font-weight:bold;font-family:'Mangal'\">1978</span><span style=\"font-family:'Mangal'\"> में जन्मी भारत की पहली परखनली शिशु का मार्ग प्रशस्त किया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पात्रे निषेचन (IVF)</span><span style=\"font-family:'Mangal'\"> में अंड और शुक्राणु को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मादा के शरीर के बाहर</span><span style=\"font-family:'Mangal'\">, प्रायः प्रयोगशाला की प्लेट में मिलाया जाता है, और फिर निषेचित अंड को गर्भाशय में रखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे शिशु को प्रायः परखनली शिशु कहते हैं, यद्यपि यह प्रक्रम वास्तव में संवर्धन प्लेट में होता है, परखनली में नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पी. माहेश्वरी</span><span style=\"font-family:'Mangal'\"> को पादप प्रजनन पर उनके कार्य के लिए भारतीय भ्रूणविज्ञान का जनक कहा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः वे वैज्ञानिक सुभाष मुखोपाध्याय थे </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुष्पी पौधे की संरचना को उससे बनने वाली रचना से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790065019381_image001.png\" style=\"width: 652px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iv), (b)-(iii), (c)-(i), (d)-(ii)</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(ii), (d)-(i)</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(iv), (c)-(i), (d)-(ii)</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iv), (c)-(iii), (d)-(ii)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अंडाशय</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">फल</span><span style=\"font-family:'Mangal'\">: निषेचन के बाद अंडाशय तेज़ी से बढ़कर पककर फल बन जाता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">बीजांड</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीज</span><span style=\"font-family:'Mangal'\">: बीजांड के चारों ओर कठोर आवरण बन जाता है और वह धीरे-धीरे बीज में बदल जाता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">युग्मनज</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">भ्रूण</span><span style=\"font-family:'Mangal'\">: युग्मनज कई बार विभाजित होकर बीजांड के भीतर भ्रूण बनाता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">परागकण</span><span style=\"font-family:'Mangal'\"> &rarr; </span><span style=\"font-weight:bold;font-family:'Mangal'\">नर युग्मक</span><span style=\"font-family:'Mangal'\">: परागकण नर युग्मक बनाता है, जो परागनलिका से होता हुआ बीजांड तक पहुँचता है।</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(iv), (c)-(i), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा व्यंजक परिपथ में व्यय विद्युत शक्ति नहीं देता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I²R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IR²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V²/R</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत शक्ति विद्युत ऊर्जा के व्यय होने की दर है, और यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = VI</span><span style=\"font-family:'Mangal'\"> से दी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसमें ओम के नियम V = IR का प्रयोग करने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = I²R</span><span style=\"font-family:'Mangal'\"> मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी व्यंजक में I = V/R रखने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = V²/R</span><span style=\"font-family:'Mangal'\"> मिलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IR² जैसा कोई संबंध नहीं है, अतः यह व्यंजक शक्ति नहीं दर्शाता; एक वाट उस युक्ति की शक्ति है जो 1 V के विभवांतर पर 1 A धारा लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः IR² विद्युत शक्ति नहीं देता </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड नाइट्रेट के विलयन में पोटैशियम आयोडाइड का विलयन मिलाने पर जल में अघुलनशील एक पीला पदार्थ नीचे बैठ जाता है। यह पदार्थ और अभिक्रिया का प्रकार हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड नाइट्रेट; संयोजन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम नाइट्रेट; विस्थापन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड आयोडाइड; अपघटन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड आयोडाइड; द्वि-विस्थापन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिक्रिया है: Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नीचे बैठने वाला अघुलनशील पीला पदार्थ </span><span style=\"font-weight:bold;font-family:'Mangal'\">लेड आयोडाइड</span><span style=\"font-family:'Mangal'\"> है, और दूसरा उत्पाद पोटैशियम नाइट्रेट विलयन में ही रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड और पोटैशियम आयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">आपस में अपने साथी बदल लेते</span><span style=\"font-family:'Mangal'\"> हैं, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्वि-विस्थापन अभिक्रिया</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि इसमें एक अघुलनशील लवण बनता है, इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवक्षेपण अभिक्रिया</span><span style=\"font-family:'Mangal'\"> भी कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह द्वि-विस्थापन अभिक्रिया से बना लेड आयोडाइड है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. किसी रासायनिक अभिक्रिया में उत्पादों का कुल द्रव्यमान अभिकारकों के कुल द्रव्यमान के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. किसी भी स्रोत से लिए गए शुद्ध जल में हाइड्रोजन और ऑक्सीजन सदैव 1 : 8 के द्रव्यमान अनुपात में होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निश्चित अनुपात का नियम मिश्रणों पर भी उसी प्रकार लागू होता है जैसे यौगिकों पर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव्यमान संरक्षण का नियम</span><span style=\"font-family:'Mangal'\"> है: रासायनिक अभिक्रिया में द्रव्यमान न तो बनता है न नष्ट होता है, अतः दोनों योग बराबर रहते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. नदी, नलकूप या समुद्र, किसी से भी शुद्ध किए गए 9 g जल से सदैव </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 g हाइड्रोजन और 8 g ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> मिलते हैं, अर्थात् द्रव्यमान अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 : 8</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निश्चित अनुपात का नियम </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल यौगिकों</span><span style=\"font-family:'Mangal'\"> पर लागू होता है; मिश्रण किसी भी अनुपात में बनाया जा सकता है, अतः यह मिश्रणों पर लागू नहीं होता → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमरबेल (क्युस्कुटा) एक झाड़ीदार पौधे पर उगती है और उसे मारे बिना उससे अपना भोजन लेती है। यह पोषण विधि है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परजीवी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मृतजीवी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्वपोषी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सहजीवी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जो जीव </span><span style=\"font-weight:bold;font-family:'Mangal'\">पौधों या जंतुओं को मारे बिना उनसे पोषण</span><span style=\"font-family:'Mangal'\"> प्राप्त करते हैं, वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">परजीवी पोषण</span><span style=\"font-family:'Mangal'\"> दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमरबेल</span><span style=\"font-family:'Mangal'\"> जिस पौधे पर उगती है उसी से अपना भोजन लेती है, और किलनी, जूँ, जोंक तथा फीताकृमि इसी प्रकार जंतुओं से भोजन लेते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">मृतजीवी पोषण</span><span style=\"font-family:'Mangal'\"> में, जैसे ब्रेड की फफूँद और कुकुरमुत्ते में, भोजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">शरीर के बाहर</span><span style=\"font-family:'Mangal'\"> ही तोड़ा जाता है और फिर अवशोषित कर लिया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हरे पौधे जैसा </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वपोषी</span><span style=\"font-family:'Mangal'\"> जीव कार्बन डाइऑक्साइड और जल से अपना भोजन स्वयं बनाता है, जो अमरबेल नहीं कर सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह पोषण विधि परजीवी है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आसवन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रभाजी आसवन तब प्रयुक्त होता है जब दो द्रवों के क्वथनांकों में 25°C से कम का अंतर हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ऐसीटोन (क्वथनांक 56°C) और जल को साधारण आसवन द्वारा अलग किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आसवन के समय अधिक क्वथनांक वाला द्रव पहले वाष्पित होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रभाजी आसवन</span><span style=\"font-family:'Mangal'\"> उस मिश्रण के लिए प्रयुक्त होता है जिसके घटकों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्वथनांकों में 25°C से कम का अंतर</span><span style=\"font-family:'Mangal'\"> हो, जैसे कच्चे पेट्रोलियम के पृथक्करण में → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ऐसीटोन </span><span style=\"font-weight:bold;font-family:'Mangal'\">56°C</span><span style=\"font-family:'Mangal'\"> पर और जल </span><span style=\"font-weight:bold;font-family:'Mangal'\">100°C</span><span style=\"font-family:'Mangal'\"> पर उबलता है; इस बड़े अंतर के कारण एक द्रव दूसरे की वाष्प बनने से पहले ही वाष्पित हो जाता है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">साधारण आसवन</span><span style=\"font-family:'Mangal'\"> इन्हें अलग कर देता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. आसवन में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम क्वथनांक वाला द्रव पहले वाष्पित</span><span style=\"font-family:'Mangal'\"> होता है, और फिर उसकी वाष्प को ठंडा करके द्रव में बदला जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ़िल्टर पेपर की एक पट्टी पर काली स्याही का एक धब्बा लगाया जाता है और पट्टी का निचला सिरा जल में डुबोया जाता है, धब्बे को जल-तल के ऊपर रखते हुए। जैसे-जैसे जल ऊपर चढ़ता है, धब्बा कई रंगीन धब्बों में बँट जाता है। ऐसा इसलिए होता है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल स्याही के रंजकों से अभिक्रिया करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रंजक कागज़ पर भिन्न-भिन्न दर से ऊपर चढ़ते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कागज़ एक को छोड़कर सभी रंजक रोक लेता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रंजक भिन्न-भिन्न तापों पर वाष्पित होते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">काली स्याही कोई एक पदार्थ नहीं है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कई रंगीन रंजकों का मिश्रण</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल जैसे-जैसे कागज़ में ऊपर चढ़ता है, वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">रंजकों को अपने साथ ऊपर ले जाता</span><span style=\"font-family:'Mangal'\"> है, और प्रत्येक रंजक </span><span style=\"font-weight:bold;font-family:'Mangal'\">भिन्न दर</span><span style=\"font-family:'Mangal'\"> से ऊपर चढ़ता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसलिए कुछ समय बाद रंजक पट्टी पर अलग-अलग ऊँचाइयों पर रह जाते हैं और अलग-अलग रंगीन धब्बों के रूप में दिखाई देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिश्रण के घटकों को अलग करने की इस विधि को </span><span style=\"font-weight:bold;font-family:'Mangal'\">पेपर क्रोमैटोग्राफ़ी</span><span style=\"font-family:'Mangal'\"> कहते हैं, और इसी से पालक की पत्तियों या फूलों की पंखुड़ियों के वर्णक भी अलग किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रंजक कागज़ पर भिन्न-भिन्न दर से ऊपर चढ़ते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे समय तक बिना प्रयोग के रखे ताँबे के बर्तन पर हरी परत जम जाती है। नींबू या इमली के रस से रगड़ने पर वह फिर चमकने लगता है। इसका कारण यह है कि रस का अम्ल:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबे पर एक सुरक्षात्मक परत बना देता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबे को कॉपर सल्फाइड में बदल देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बर्तन पर जमी हरी परत को घोल देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परत को अपचयित करके ताँबा बना देता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ताँबा वायु में उपस्थित </span><span style=\"font-weight:bold;font-family:'Mangal'\">नम कार्बन डाइऑक्साइड</span><span style=\"font-family:'Mangal'\"> के साथ धीरे-धीरे अभिक्रिया करता है और अपनी चमकदार भूरी सतह खो देता है। इसकी सतह पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्षारीय कॉपर कार्बोनेट</span><span style=\"font-family:'Mangal'\"> की हरी परत बन जाती है। आसपास उपस्थित पदार्थों द्वारा धातु पर होने वाले इस प्रभाव को </span><span style=\"font-weight:bold;font-family:'Mangal'\">संक्षारण</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नींबू का रस और इमली का रस </span><span style=\"font-weight:bold;font-family:'Mangal'\">खट्टे पदार्थ हैं, अर्थात् इनमें अम्ल होते</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरे क्षारीय कॉपर कार्बोनेट को घोल देता</span><span style=\"font-family:'Mangal'\"> है, जिससे उसके नीचे की साफ ताँबे की सतह दिखाई देने लगती है और बर्तन फिर से चमकदार दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अम्ल न तो कोई सुरक्षात्मक परत बनाता है और न ही धातु को कॉपर सल्फाइड में परिवर्तित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अम्ल बर्तन पर जमी हरी परत को घोल देता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में हॉर्मोनों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. थायरॉक्सिन शरीर में कार्बोहाइड्रेट, प्रोटीन और वसा के उपापचय का नियमन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. थायरॉक्सिन बनाने के लिए थायरॉइड ग्रंथि को आयोडीन चाहिए, इसलिए आयोडीन युक्त नमक की सलाह दी जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. गले का फूल जाना, जिसे घेंघा कहते हैं, रक्त में अधिक इंसुलिन का लक्षण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. थायरॉइड ग्रंथि से स्रावित </span><span style=\"font-weight:bold;font-family:'Mangal'\">थायरॉक्सिन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बोहाइड्रेट, प्रोटीन और वसा के उपापचय का नियमन</span><span style=\"font-family:'Mangal'\"> करता है, जिससे शरीर को वृद्धि के लिए सर्वोत्तम संतुलन मिले → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. थायरॉक्सिन बनाने के लिए थायरॉइड ग्रंथि को </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयोडीन</span><span style=\"font-family:'Mangal'\"> चाहिए, और भोजन से यह पर्याप्त मात्रा में न मिल पाने के कारण </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयोडीन युक्त नमक</span><span style=\"font-family:'Mangal'\"> के प्रयोग की सलाह दी जाती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">गले का फूलना (घेंघा)</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">थायरॉक्सिन की कमी</span><span style=\"font-family:'Mangal'\"> का लक्षण है, अधिक इंसुलिन का नहीं; इंसुलिन अग्न्याशय से स्रावित होता है और रक्त में शर्करा के स्तर का नियमन करता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईथेन, C₂H₆ के एक अणु में कितने सहसंयोजक आबंध होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन </span><span style=\"font-weight:bold;font-family:'Mangal'\">चतुःसंयोजक</span><span style=\"font-family:'Mangal'\"> है, अतः प्रत्येक कार्बन परमाणु चार आबंध बनाता है, और हाइड्रोजन एक आबंध बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ईथेन में दोनों कार्बन परमाणु पहले आपस में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल आबंध</span><span style=\"font-family:'Mangal'\"> से जुड़ते हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 आबंध</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके बाद प्रत्येक कार्बन की तीन संयोजकताएँ शेष रहती हैं, जिन्हें तीन-तीन हाइड्रोजन परमाणु पूरा करते हैं, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">3 + 3 = 6 कार्बन-हाइड्रोजन आबंध</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल सहसंयोजक आबंध = 1 + 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ईथेन में 7 सहसंयोजक आबंध होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": "  <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पृथ्वी तंत्र के मंडल को उसके उदाहरण से सुमेलित कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790065019381_image002.png\" width=\"442\" height=\"136\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(i), (b)-(iii), (c)-(iv), (d)-(ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(ii), (d)-(iv)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(ii), (b)-(i), (c)-(iv), (d)-(iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-(iii), (b)-(i), (c)-(iv), (d)-(ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">हिममंडल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिमालय के हिमनद</span><span style=\"font-family:'Mangal'\">: यह ठोस रूप में जल है, अर्थात् बर्फ़ और हिम।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्थलमंडल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्कन का पठार</span><span style=\"font-family:'Mangal'\">: यह ठोस चट्टानों, मृदा, स्थलरूपों और पृथ्वी के आंतरिक भाग से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जलमंडल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंगा-ब्रह्मपुत्र नदी तंत्र</span><span style=\"font-family:'Mangal'\">: यह द्रव जल है, जैसे नदियाँ, झीलें, महासागर और भूजल।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जैवमंडल</span><span style=\"font-family:'Mangal'\"> → </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रवाल भित्तियाँ</span><span style=\"font-family:'Mangal'\">: इसमें सभी जीव और उनके आवास सम्मिलित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-(iii), (b)-(i), (c)-(iv), (d)-(ii) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्याज़ का रस और वैनिला एसेंस जैसे पदार्थ, जिनकी गंध अम्लीय या क्षारकीय माध्यम में बदल जाती है, कहलाते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गंधीय सूचक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सार्वत्रिक सूचक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्राकृतिक सूचक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संश्लेषित सूचक</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सूचक</span><span style=\"font-family:'Mangal'\"> किसी परिवर्तन के द्वारा, जिसे हम अनुभव कर सकें, बताता है कि विलयन अम्लीय है या क्षारकीय।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन पदार्थों की </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंध</span><span style=\"font-family:'Mangal'\"> अम्लीय या क्षारकीय माध्यम में बदल जाती है, उन्हें </span><span style=\"font-weight:bold;font-family:'Mangal'\">गंधीय सूचक</span><span style=\"font-family:'Mangal'\"> कहते हैं; </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्याज़ के रस</span><span style=\"font-family:'Mangal'\"> में भिगोई कपड़े की पट्टियाँ तथा </span><span style=\"font-weight:bold;font-family:'Mangal'\">वैनिला एसेंस</span><span style=\"font-family:'Mangal'\"> और लौंग का तेल इसी प्रकार प्रयोग किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सार्वत्रिक सूचक</span><span style=\"font-family:'Mangal'\"> कई सूचकों का मिश्रण है, जो हाइड्रोजन आयन की भिन्न सांद्रताओं पर भिन्न रंग दिखाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लिटमस, हल्दी और लाल पत्तागोभी का रस </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्राकृतिक सूचक</span><span style=\"font-family:'Mangal'\"> हैं, जो रंग बदलकर काम करते हैं, गंध बदलकर नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इन्हें गंधीय सूचक कहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मुख से ली जाने वाली गर्भनिरोधक गोलियाँ गर्भधारण को मुख्यतः किस प्रकार रोकती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शुक्रवाहिका को अवरुद्ध करके</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">योनि में अवरोध बनाकर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंडवाहिनी को अवरुद्ध करके</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हॉर्मोन संतुलन बदलकर</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भनिरोधक विधियाँ कुछ वर्गों में बँटी हैं, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुख से ली जाने वाली गोलियाँ</span><span style=\"font-family:'Mangal'\"> हॉर्मोन वाले वर्ग में आती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये गोलियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">शरीर का हॉर्मोन संतुलन बदल देती</span><span style=\"font-family:'Mangal'\"> हैं जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंड का मोचन नहीं होता</span><span style=\"font-family:'Mangal'\">, और इसलिए निषेचन हो ही नहीं पाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हॉर्मोन संतुलन बदलने के कारण इनसे दुष्प्रभाव भी हो सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">शुक्रवाहिका</span><span style=\"font-family:'Mangal'\"> या </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंडवाहिनी</span><span style=\"font-family:'Mangal'\"> को अवरुद्ध करना शल्य विधि है, जबकि कंडोम एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवरोध</span><span style=\"font-family:'Mangal'\"> की तरह काम करता है जो शुक्राणुओं को अंड तक पहुँचने नहीं देता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ये गोलियाँ हॉर्मोन संतुलन बदलकर कार्य करती हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मानव कंकाल तंत्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मनुष्य में पसलियों के 12 जोड़े होते हैं, जो मिलकर पसली पिंजर बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. दो कशेरुकाओं के बीच उपास्थि की एक गद्दी होती है जो कुशन का कार्य करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. खोपड़ी की हड्डियाँ कब्जा संधि से जुड़ी होती हैं, इसलिए खोपड़ी मुड़ सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मनुष्य में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पसलियों के 12 जोड़े</span><span style=\"font-family:'Mangal'\"> होते हैं, जो मिलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">पसली पिंजर</span><span style=\"font-family:'Mangal'\"> बनाते हैं और हृदय व फेफड़ों की रक्षा करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रत्येक दो कशेरुकाओं के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">उपास्थि की एक गद्दी</span><span style=\"font-family:'Mangal'\"> होती है, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुशन</span><span style=\"font-family:'Mangal'\"> की तरह काम करती है और हमें मेरुरज्जु को चोट पहुँचाए बिना झुकने तथा मुड़ने देती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. खोपड़ी की चपटी हड्डियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अचल संधियों</span><span style=\"font-family:'Mangal'\"> से जुड़ी होती हैं, अतः वे हिल नहीं सकतीं; इसी से शरीर के चलने पर भी मस्तिष्क सुरक्षित रहता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिकनी सतह पर सपाट रखे एक छल्ले की भीतरी दीवार के साथ-साथ एक कंचे को चलाया जाता है। एक-दो चक्कर के बाद छल्ला अचानक उठा लिया जाता है। इसके बाद कंचा चलता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटी त्रिज्या के वृत्त में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छल्ले के केंद्र की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उतनी ही त्रिज्या के वृत्त में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधी रेखा में</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब तक छल्ला वहाँ है, उसकी भीतरी दीवार कंचे को लगातार </span><span style=\"font-weight:bold;font-family:'Mangal'\">केंद्र की ओर</span><span style=\"font-family:'Mangal'\"> धकेलती है, और यही बल कंचे को वृत्तीय पथ पर बनाए रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छल्ला उठाते ही कंचे पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐसा कोई बल नहीं</span><span style=\"font-family:'Mangal'\"> रह जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कंचा उसी </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिशा में चलता रहता है जो उस क्षण उसकी थी</span><span style=\"font-family:'Mangal'\">, अर्थात् उस बिंदु पर वृत्त की </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्पर्श रेखा</span><span style=\"font-family:'Mangal'\"> के अनुदिश।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्पर्श रेखा वृत्त से केवल एक ही बिंदु पर मिलती है, इसलिए अब कंचा सीधी रेखा में चलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कंचा सीधी रेखा में चलता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मानव भ्रूण के विकास के समय विकसित हो रही उँगलियों के बीच की कोशिकाएँ मर जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): क्रमबद्ध कोशिका मृत्यु एक आनुवंशिक रूप से नियंत्रित प्रक्रम है जो सामान्य विकास के लिए आवश्यक है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भ्रूण के विकास के समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">विकसित हो रही उँगलियों के बीच की कोशिकाएँ हटा दी जाती</span><span style=\"font-family:'Mangal'\"> हैं, और इसी से अलग-अलग उँगलियाँ बनती हैं; ऐसा न हो तो हमारे हाथ जालयुक्त होते → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">क्रमबद्ध कोशिका मृत्यु</span><span style=\"font-family:'Mangal'\"> चुनी हुई कोशिकाओं के नष्ट होने का </span><span style=\"font-weight:bold;font-family:'Mangal'\">आनुवंशिक रूप से नियंत्रित और सुव्यवस्थित प्रक्रम</span><span style=\"font-family:'Mangal'\"> है, जो सामान्य विकास, कोशिकीय गुणवत्ता नियंत्रण और प्रतिरक्षा के लिए आवश्यक है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उँगलियों के बीच की कोशिकाओं का मरना इसी प्रक्रम का एक उदाहरण है, अतः R ही A का कारण है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब यह नियंत्रण बिगड़ जाता है और कोशिकाएँ बिना रुके विभाजित होती रहती हैं, तो उनसे अर्बुद (ट्यूमर) बन जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 kg द्रव्यमान का एक बच्चा सीसॉ के आलंब से 1.5 m की दूरी पर बैठा है। 60 kg द्रव्यमान के बच्चे को आलंब से कितनी दूरी पर बैठना चाहिए कि सीसॉ संतुलित रहे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.25 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.75 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 m</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीसॉ एक उत्तोलक है, और यह तब संतुलित रहता है जब प्रयास × प्रयास भुजा = भार × भार भुजा हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माना अभीष्ट दूरी d है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 × 1.5 = 60 × d</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 = 60 × d</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">d = 60/60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्थात् भारी बच्चे को आलंब के अधिक पास बैठना पड़ता है; बल जितना बड़ा होगा, उसे संतुलित करने के लिए भुजा उतनी ही छोटी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 60 kg के बच्चे को आलंब से 1 m दूर बैठना चाहिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ वृद्ध व्यक्तियों में आँख का क्रिस्टलीय लेंस दुधिया और धुँधला हो जाता है, जिससे दृष्टि आंशिक या पूर्ण रूप से चली जाती है। इस स्थिति को कहते हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मोतियाबिंद</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकट दृष्टि दोष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जरा दूरदृष्टिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूर दृष्टि दोष</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृद्धावस्था में आँख का क्रिस्टलीय लेंस कभी-कभी </span><span style=\"font-weight:bold;font-family:'Mangal'\">दुधिया और धुँधला</span><span style=\"font-family:'Mangal'\"> हो जाता है, और इस स्थिति को </span><span style=\"font-weight:bold;font-family:'Mangal'\">मोतियाबिंद</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे दृष्टि </span><span style=\"font-weight:bold;font-family:'Mangal'\">आंशिक या पूर्ण रूप से चली जाती</span><span style=\"font-family:'Mangal'\"> है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">शल्य चिकित्सा</span><span style=\"font-family:'Mangal'\"> द्वारा दृष्टि लौटाई जा सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">निकट दृष्टि दोष</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूर दृष्टि दोष</span><span style=\"font-family:'Mangal'\"> अपवर्तन दोष हैं, जिनमें वस्तु का प्रतिबिंब दृष्टिपटल के आगे या पीछे बनता है और अवतल या उत्तल लेंस से इनका संशोधन किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जरा दूरदृष्टिता</span><span style=\"font-family:'Mangal'\"> में आयु के साथ निकट बिंदु दूर हटता जाता है, जिससे पास की वस्तुएँ सुविधा से नहीं दिखतीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः इस स्थिति को मोतियाबिंद कहते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): प्ररोह का एक ओर से आते प्रकाश की ओर मुड़ना वृद्धि से स्वतंत्र गति है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): प्रकाश या गुरुत्व जैसे पर्यावरणीय उद्दीपनों से होने वाली पादप अंगों की दिशिक गतियाँ अनुवर्तन गति कहलाती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पौधों में दो प्रकार की गतियाँ होती हैं, एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि पर निर्भर</span><span style=\"font-family:'Mangal'\"> और दूसरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि से स्वतंत्र</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्ररोह का प्रकाश की ओर मुड़ना इसलिए होता है क्योंकि प्ररोह </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाश से दूर वाली ओर अधिक वृद्धि</span><span style=\"font-family:'Mangal'\"> करता है, अतः यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृद्धि पर निर्भर</span><span style=\"font-family:'Mangal'\"> गति है → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश या गुरुत्व जैसे पर्यावरणीय उद्दीपन </span><span style=\"font-weight:bold;font-family:'Mangal'\">पादप अंगों की वृद्धि की दिशा</span><span style=\"font-family:'Mangal'\"> बदल देते हैं, और ऐसी दिशिक गतियों को </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुवर्तन गति</span><span style=\"font-family:'Mangal'\"> कहते हैं, जो उद्दीपन की ओर या उससे दूर हो सकती हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छुईमुई की पत्तियों का स्पर्श से मुड़ जाना दूसरे प्रकार की गति है, जो वृद्धि पर निर्भर नहीं करती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक व्यक्ति देखता है कि दर्पण में उसका प्रतिबिंब सदा सीधा बनता है, चाहे वह कितनी ही दूर या पास खड़ा हो। यह दर्पण हो सकता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल अवतल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल उत्तल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">या तो समतल या अवतल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">या तो समतल या उत्तल</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p
