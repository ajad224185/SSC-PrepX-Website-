style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">समतल दर्पण</span><span style=\"font-family:'Mangal'\"> सदा </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी, सीधा और वस्तु के बराबर आकार</span><span style=\"font-family:'Mangal'\"> का प्रतिबिंब बनाता है, वस्तु की दूरी चाहे जो हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तल दर्पण</span><span style=\"font-family:'Mangal'\"> अनंत और ध्रुव के बीच कहीं भी रखी वस्तु का सदा </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी, सीधा और छोटा</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब बनाता है; इसीलिए इसे पश्च-दृश्य दर्पण के रूप में प्रयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल दर्पण</span><span style=\"font-family:'Mangal'\"> सीधा प्रतिबिंब केवल तभी बनाता है जब वस्तु ध्रुव और फोकस के बीच हो; शेष सभी स्थितियों में प्रतिबिंब वास्तविक और उलटा बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि हर दूरी पर प्रतिबिंब सीधा ही रहता है, यह दर्पण अवतल नहीं हो सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह दर्पण या तो समतल है या उत्तल </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): सूर्यास्त के समय क्षितिज को वास्तव में पार कर लेने के बाद भी सूर्य लगभग दो मिनट तक दिखाई देता रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): पृथ्वी की सतह से जैसे-जैसे ऊपर जाते हैं, वायु का अपवर्तनांक बढ़ता जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तविक सूर्यास्त का अर्थ है सूर्य का क्षितिज को वास्तव में पार करना, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">वायुमंडलीय अपवर्तन</span><span style=\"font-family:'Mangal'\"> के कारण उसके बाद भी सूर्य लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो मिनट</span><span style=\"font-family:'Mangal'\"> तक दिखाई देता रहता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तारों और सूर्य का प्रकाश वायुमंडल में इसलिए अपवर्तित होता है क्योंकि यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">धीरे-धीरे बदलते अपवर्तनांक</span><span style=\"font-family:'Mangal'\"> वाला माध्यम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपर जाने पर वायु विरल होती जाती है, अतः ऊँचाई के साथ वायु का अपवर्तनांक </span><span style=\"font-weight:bold;font-family:'Mangal'\">घटता</span><span style=\"font-family:'Mangal'\"> है, बढ़ता नहीं → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हमारे शरीर की तंत्रिका कोशिकाओं में प्रवाहित होने वाली कमजोर आयनिक धाराएँ चुंबकीय क्षेत्र उत्पन्न करती हैं। शरीर के अंदर उत्पन्न होने वाला यह चुंबकीय क्षेत्र चिकित्सा निदान में उपयोग की जाने वाली किस तकनीक का आधार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अल्ट्रासाउंड स्कैनिंग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक्स-रे इमेजिंग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एंडोस्कोपी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुंबकीय अनुनाद इमेजिंग (MRI)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब हम किसी वस्तु को छूते हैं, तो तंत्रिकाएँ पेशियों तक एक विद्युत आवेग ले जाती हैं, और यह आवेग एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अल्पकालिक चुंबकीय क्षेत्र</span><span style=\"font-family:'Mangal'\"> उत्पन्न करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये क्षेत्र अत्यंत क्षीण होते हैं, लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">पृथ्वी के चुंबकीय क्षेत्र के एक अरबवें भाग</span><span style=\"font-family:'Mangal'\"> के बराबर, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">हृदय तथा मस्तिष्क</span><span style=\"font-family:'Mangal'\"> में ये सबसे प्रबल होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शरीर के भीतर का यह चुंबकीय क्षेत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">चुंबकीय अनुनाद इमेजिंग (MRI)</span><span style=\"font-family:'Mangal'\"> का आधार है, जिससे चिकित्सा निदान के लिए शरीर के विभिन्न भागों के चित्र प्राप्त किए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अल्ट्रासाउंड स्कैनिंग</span><span style=\"font-family:'Mangal'\"> पराश्रव्य तरंगों का और </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक्स-रे इमेजिंग</span><span style=\"font-family:'Mangal'\"> X-किरणों का उपयोग करता है, इनमें से कोई भी शरीर के अपने चुंबकीय क्षेत्र पर निर्भर नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह तकनीक चुंबकीय अनुनाद इमेजिंग (MRI) है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशोरावस्था में लड़के की आवाज़ पहले की तुलना में भारी हो जाती है। इसका मुख्य कारण यह है कि उसके स्वर तंतु:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छोटे और पतले हो जाते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ समय के लिए कंपन करना बंद कर देते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे और मोटे हो जाते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नए तंतुओं से बदल दिए जाते हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में ध्वनि </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्वर तंतुओं</span><span style=\"font-family:'Mangal'\"> के कंपन से उत्पन्न होती है, जो स्वर यंत्र के भीतर तने हुए पेशीय फलक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किशोरावस्था में लड़के के स्वर तंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">लंबे और मोटे</span><span style=\"font-family:'Mangal'\"> हो जाते हैं, इसलिए वे </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम आवृत्ति से कंपन</span><span style=\"font-family:'Mangal'\"> करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे ध्वनि की आवृत्ति घट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">तारत्व (पिच)</span><span style=\"font-family:'Mangal'\"> आवृत्ति का हमारा बोध है: कम आवृत्ति </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम तारत्व</span><span style=\"font-family:'Mangal'\"> के रूप में सुनाई देती है, इसीलिए आवाज़ भारी लगती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः स्वर तंतु लंबे और मोटे हो जाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जंतुओं के नर और मादा युग्मकों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. शुक्राणु लाखों की संख्या में बनते हैं, जबकि अंड बहुत कम संख्या में बनते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अंड में संचित पोषक पदार्थ होते हैं, जबकि शुक्राणु में नहीं होते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. शुक्राणु और अंड दोनों सक्रिय रूप से गतिशील होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. नर में युग्मक निर्माण से </span><span style=\"font-weight:bold;font-family:'Mangal'\">असंख्य छोटे शुक्राणु</span><span style=\"font-family:'Mangal'\"> बनते हैं, जबकि मादा में प्रायः एक समय पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक बड़ा अंड</span><span style=\"font-family:'Mangal'\"> परिपक्व होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अंड में </span><span style=\"font-weight:bold;font-family:'Mangal'\">संचित पोषक पदार्थ</span><span style=\"font-family:'Mangal'\"> होते हैं जो प्रारंभिक भ्रूण का पोषण करते हैं, जबकि शुक्राणु मुख्यतः आनुवंशिक पदार्थ और एक पूँछ से बना होता है और उसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">संचित भोजन नहीं</span><span style=\"font-family:'Mangal'\"> होता → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">शुक्राणु अपनी लंबी पूँछ के कारण सक्रिय रूप से गतिशील</span><span style=\"font-family:'Mangal'\"> होता है, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंड गतिहीन</span><span style=\"font-family:'Mangal'\"> होता है और अंडवाहिनी में आगे बढ़ाया जाता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक विद्युत बल्ब का तंतु 10 मिनट तक 0.5 A की धारा लेता है। इस समय में परिपथ से प्रवाहित विद्युत आवेश की मात्रा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">300 C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">30 C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">600 C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विद्युत धारा आवेश के प्रवाह की दर है, अतः I = Q/t.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यहाँ I = 0.5 A और t = 10 मिनट = </span><span style=\"font-weight:bold;font-family:'Mangal'\">600 s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q = I × t</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= 0.5 × 600 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">300 C</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ऐम्पियर का अर्थ है प्रति सेकंड एक कूलॉम आवेश का प्रवाह, अतः 0.5 A की धारा प्रत्येक सेकंड 0.5 C आवेश ले जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रवाहित आवेश 300 C है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में वंशागति के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पिता और माता संतान को लगभग बराबर मात्रा में आनुवंशिक पदार्थ देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. प्रत्येक लक्षण के लिए हर संतान में दो रूप होते हैं, एक-एक प्रत्येक जनक से।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मानव कोशिका के गुणसूत्रों के 23 जोड़ों में से 22 जोड़े लिंग गुणसूत्र होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पिता और माता दोनों संतान को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगभग बराबर मात्रा में आनुवंशिक पदार्थ</span><span style=\"font-family:'Mangal'\"> देते हैं, अतः प्रत्येक लक्षण पितृ तथा मातृ DNA दोनों से प्रभावित हो सकता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चूँकि प्रत्येक जनक उसी जीन की एक प्रति देता है, इसलिए हर संतान में </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक लक्षण के दो रूप</span><span style=\"font-family:'Mangal'\"> होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. मानव गुणसूत्रों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बाईस जोड़े अलिंगसूत्र</span><span style=\"font-family:'Mangal'\"> होते हैं; केवल शेष </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक जोड़ा</span><span style=\"font-family:'Mangal'\"> ही लिंग गुणसूत्रों का होता है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल में ओज़ोन की मात्रा किस दशक में तेज़ी से घटने लगी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1950 के दशक में</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1980 के दशक में</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1920 के दशक में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2010 के दशक में</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वायुमंडल में ओज़ोन की मात्रा </span><span style=\"font-weight:bold;font-family:'Mangal'\">1980 के दशक में तेज़ी से</span><span style=\"font-family:'Mangal'\"> घटने लगी थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह कमी </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरोफ़्लोरोकार्बन (CFC)</span><span style=\"font-family:'Mangal'\"> जैसे रसायनों के उपयोग से जुड़ी थी, जो प्रशीतक के रूप में और अग्निशामकों में प्रयुक्त होते थे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ओज़ोन परत पृथ्वी की सतह को </span><span style=\"font-weight:bold;font-family:'Mangal'\">पराबैंगनी विकिरण</span><span style=\"font-family:'Mangal'\"> से बचाती है, जो जीवों के लिए अत्यंत हानिकारक है और मनुष्य में </span><span style=\"font-weight:bold;font-family:'Mangal'\">त्वचा कैंसर</span><span style=\"font-family:'Mangal'\"> का कारण बनता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तेज़ी से कमी 1980 के दशक में आरंभ हुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक हाथी किसी वृक्ष के तने से छाल का पूरा छल्ला उतार देता है। अगले कुछ सप्ताहों में वृक्ष मरने लगता है। छाल के साथ कटने वाला वह ऊतक जिसके कारण ऐसा होता है, है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाइलम, जो जल ऊपर ले जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाह्यत्वचा, जो जल की हानि रोकती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लोएम, जो भोजन नीचे ले जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैंबियम, जो छाल मोटी करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृक्ष की </span><span style=\"font-weight:bold;font-family:'Mangal'\">छाल</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉर्क कोशिकाओं</span><span style=\"font-family:'Mangal'\"> से बनी होती है, जो मृत होती हैं तथा जल और गैसों के लिए अपारगम्य होती हैं, और इसके ठीक नीचे </span><span style=\"font-weight:bold;font-family:'Mangal'\">फ्लोएम</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छाल का पूरा छल्ला उतारने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">तने के चारों ओर का फ्लोएम कट जाता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">फ्लोएम </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्तियों में बने भोजन को तने और जड़ों तक नीचे</span><span style=\"font-family:'Mangal'\"> पहुँचाता है, अतः जड़ों को भोजन नहीं मिलता और कुछ सप्ताहों में वृक्ष मर जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जाइलम</span><span style=\"font-family:'Mangal'\"> तने में और भीतर होता है और हटता नहीं, इसलिए कुछ समय तक जड़ों से जल ऊपर चढ़ता रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः भोजन नीचे ले जाने वाला फ्लोएम उत्तरदायी है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): समुद्री धाराओं से बने बड़े वृत्ताकार प्रतिरूप, जिन्हें गायर कहते हैं, उत्तरी गोलार्ध में दक्षिणावर्त घूमते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): समुद्री धाराएँ ऊष्मा को भूमध्यरेखीय क्षेत्रों से ध्रुवों की ओर ले जाती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गतिमान समुद्री जल राशियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पृथ्वी के घूर्णन</span><span style=\"font-family:'Mangal'\"> से विक्षेपित होकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">गायर</span><span style=\"font-family:'Mangal'\"> नामक बड़े वृत्ताकार प्रतिरूप बनाती हैं; ये उत्तरी गोलार्ध में </span><span style=\"font-weight:bold;font-family:'Mangal'\">दक्षिणावर्त</span><span style=\"font-family:'Mangal'\"> और दक्षिणी गोलार्ध में वामावर्त घूमते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समुद्री धाराएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऊष्मा को भूमध्य रेखा से ध्रुवों की ओर</span><span style=\"font-family:'Mangal'\"> भी ले जाती हैं, जिससे पृथ्वी पर तापमान का अंतर घटता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गायर के घूमने की दिशा पृथ्वी के घूर्णन से होने वाले विक्षेपण के कारण है, ऊष्मा के स्थानांतरण के कारण नहीं, अतः R, A का कारण नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हीरे का अपवर्तनांक 2.42 है। वायु में प्रकाश की चाल 3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s लेते हुए, हीरे में प्रकाश की चाल लगभग है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.42 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.26 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.24 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.00 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">किसी माध्यम का निरपेक्ष अपवर्तनांक n = c/v होता है, जहाँ c वायु में और v उस माध्यम में प्रकाश की चाल है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः v = c/n</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= (3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">) / 2.42</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">= </span><span style=\"font-weight:bold;font-family:'Mangal'\">1.24 × 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश निर्वात में सबसे तेज़, 3 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s की चाल से चलता है, और 2.42 अपवर्तनांक का अर्थ है कि हीरे के भीतर प्रकाश की चाल घटकर लगभग उसकी दो-पाँचवीं रह जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः हीरे में प्रकाश की चाल लगभग 1.24 × 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\"> m/s है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">घरेलू विद्युत परिपथों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. हमारे घरों में AC विद्युत शक्ति 220 V पर, 50 Hz आवृत्ति के साथ प्राप्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. हरे विद्युतरोधी आवरण वाला तार प्रायः आपूर्ति का भू-संपर्क तार होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लघु पथन के समय परिपथ में धारा तेज़ी से घट जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. घरों में विद्युन्मय और उदासीन तार के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">AC विद्युत शक्ति 220 V</span><span style=\"font-family:'Mangal'\"> पर, </span><span style=\"font-weight:bold;font-family:'Mangal'\">50 Hz आवृत्ति</span><span style=\"font-family:'Mangal'\"> के साथ प्राप्त होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">भू-संपर्क तार</span><span style=\"font-family:'Mangal'\"> पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">हरा विद्युतरोधी आवरण</span><span style=\"font-family:'Mangal'\"> होता है और यह पृथ्वी में गहराई पर गाड़ी गई धातु की प्लेट से जुड़ा होता है, जबकि विद्युन्मय तार पर लाल और उदासीन तार पर काला आवरण होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">लघु पथन के समय धारा बहुत अधिक बढ़ जाती</span><span style=\"font-family:'Mangal'\"> है, और यही बड़ी धारा फ़्यूज़ के तार को पिघलाकर परिपथ तोड़ देती है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समीकरण HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + H₂O को संतुलित करना है। HNO₃ और H₂O के गुणांक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 और 1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाईं ओर Ca(NO₃)₂ में </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो नाइट्रेट समूह</span><span style=\"font-family:'Mangal'\"> हैं, अतः बाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2HNO₃</span><span style=\"font-family:'Mangal'\"> चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तब बाईं ओर 2HNO₃ से 2 और Ca(OH)₂ से 2, अर्थात् कुल </span><span style=\"font-weight:bold;font-family:'Mangal'\">4 हाइड्रोजन परमाणु</span><span style=\"font-family:'Mangal'\"> हो जाते हैं, इसलिए दाईं ओर </span><span style=\"font-weight:bold;font-family:'Mangal'\">2H₂O</span><span style=\"font-family:'Mangal'\"> चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतुलित समीकरण है: 2HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2H₂O.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: ऑक्सीजन बाईं ओर (2 × 3) + 2 = 8 और दाईं ओर 6 + 2 = 8, तथा कैल्सियम दोनों ओर 1 है, अतः प्रत्येक तत्व के परमाणुओं की संख्या दोनों ओर समान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गुणांक 2 और 2 हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक साँप-नौका दौड़ में 100 नाविकों में से प्रत्येक 200 N का क्षैतिज बल लगाता है। भूलवश उनमें से 5 नाविक शेष 95 की दिशा के विपरीत चप्पू चलाते हैं। नाव पर नेट बल है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20,000 N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19,000 N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18,000 N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000 N</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सही दिशा में चप्पू चलाने वाले 95 नाविकों द्वारा लगाया गया बल = 95 × 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19,000 N</span><span style=\"font-family:'Mangal'\">, आगे की ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गलत दिशा में चप्पू चलाने वाले 5 नाविकों द्वारा लगाया गया बल = 5 × 200 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000 N</span><span style=\"font-family:'Mangal'\">, पीछे की ओर।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये दोनों बल विपरीत दिशाओं में लगते हैं, अतः नेट बल का परिमाण इनका अंतर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नेट बल = 19,000 − 1,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18,000 N</span><span style=\"font-family:'Mangal'\">, जो बड़े बल की दिशा में, अर्थात् आगे की ओर लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नाव पर नेट बल 18,000 N है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ जंतु समूहों के कंकाल के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. स्पंजों में कोशिकीय स्तर का संगठन होता है और उनमें कोई कंकाल नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. तारा मछली और समुद्री अर्चिन में कैल्सियम कार्बोनेट का कठोर आंतरिक कंकाल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कीटों और केकड़ों में हड्डी का बना आंतरिक कंकाल होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">पोरीफेरा (स्पंज)</span><span style=\"font-family:'Mangal'\"> समुद्री जल में रहते हैं, इनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिकीय स्तर का संगठन</span><span style=\"font-family:'Mangal'\"> होता है और </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई कंकाल नहीं</span><span style=\"font-family:'Mangal'\"> होता → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. तारा मछली और समुद्री अर्चिन जैसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकाइनोडर्मेटा</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैल्सियम कार्बोनेट का कठोर आंतरिक कंकाल</span><span style=\"font-family:'Mangal'\"> होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कीट और केकड़े </span><span style=\"font-weight:bold;font-family:'Mangal'\">आर्थ्रोपोडा</span><span style=\"font-family:'Mangal'\"> हैं, और इनका प्रमुख लक्षण </span><span style=\"font-weight:bold;font-family:'Mangal'\">कठोर बाह्य कंकाल</span><span style=\"font-family:'Mangal'\"> है, हड्डी का कंकाल नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-सा भारत में स्थित वैश्विक जैव विविधता हॉटस्पॉट नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिमी घाट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हिमालय</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थार मरुस्थल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इंडो-बर्मा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">जैव विविधता हॉटस्पॉट</span><span style=\"font-family:'Mangal'\"> वह क्षेत्र है जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थानिक जातियाँ</span><span style=\"font-family:'Mangal'\"> बहुत अधिक हों और जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवास की भारी क्षति</span><span style=\"font-family:'Mangal'\"> भी हुई हो।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत में स्थित वैश्विक हॉटस्पॉट हैं: </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिमी घाट</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिमालय</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">इंडो-बर्मा</span><span style=\"font-family:'Mangal'\"> (जिसमें पूर्वोत्तर भारत आता है) और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुंडालैंड</span><span style=\"font-family:'Mangal'\"> (जिसमें निकोबार द्वीप समूह आता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">थार मरुस्थल</span><span style=\"font-family:'Mangal'\"> पश्चिमी भारत का एक विशिष्ट भू-भाग है, परंतु इसे इन हॉटस्पॉट में नहीं गिना जाता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर थार मरुस्थल है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): प्रकृति में खाद्य शृंखला में प्रायः केवल तीन या चार पोषक स्तर ही होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): प्रत्येक पोषक स्तर पर बहुत-सी ऊर्जा ऊष्मा के रूप में नष्ट हो जाती है, इसलिए चार स्तरों के बाद उपयोगी ऊर्जा बहुत कम बचती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाद्य शृंखला के प्रत्येक चरण पर ऊर्जा की हानि इतनी अधिक होती है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार पोषक स्तरों के बाद उपयोगी ऊर्जा बहुत कम बचती</span><span style=\"font-family:'Mangal'\"> है, इसीलिए खाद्य शृंखलाएँ छोटी होती हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब भी ऊर्जा का एक रूप दूसरे रूप में बदलता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">कुछ ऊर्जा ऐसे रूपों में वातावरण में चली जाती</span><span style=\"font-family:'Mangal'\"> है जिनका पुनः उपयोग नहीं हो सकता; प्रत्येक पोषक स्तर पर ली गई ऊर्जा का बड़ा भाग ऊष्मा के रूप में नष्ट हो जाता है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक स्तर पर होने वाली यही हानि स्तरों की संख्या को सीमित करती है, अतः R ही A की सही व्याख्या है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ तत्वों के प्रतीक उनके लैटिन नामों से बने हैं। निम्नलिखित में से कौन-सा प्रतीक तत्व के लैटिन नाम से नहीं बना है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिंक के लिए Zn</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम के लिए Na</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिल्वर के लिए Ag</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेड के लिए Pb</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Na</span><span style=\"font-family:'Mangal'\"> सोडियम के लैटिन नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">नैट्रियम</span><span style=\"font-family:'Mangal'\"> से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Ag</span><span style=\"font-family:'Mangal'\"> सिल्वर के लैटिन नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">अर्जेंटम</span><span style=\"font-family:'Mangal'\"> से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Pb</span><span style=\"font-family:'Mangal'\"> लेड के लैटिन नाम </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लंबम</span><span style=\"font-family:'Mangal'\"> से बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Zn</span><span style=\"font-family:'Mangal'\"> स्वयं </span><span style=\"font-weight:bold;font-family:'Mangal'\">जिंक</span><span style=\"font-family:'Mangal'\"> नाम से ही लिया गया है, जिसमें पहला अक्षर और उसी नाम का एक बाद वाला अक्षर लिया जाता है, जैसे क्लोरीन के लिए Cl.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक प्रतीक में पहला अक्षर बड़ा और दूसरा, यदि हो, छोटा लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जिंक के लिए Zn लैटिन नाम से नहीं बना है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कूट भाषा में 'PET' को 123 और 'NEAR' को 152 लिखा जाता है। उसी भाषा में 'TRAIN' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">310</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">196</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">218</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">288</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अक्षर का अंग्रेज़ी वर्णमाला में स्थान लिखकर उनका योग करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PET: P = 16, E = 5, T = 20 → योग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">41</span><span style=\"font-family:'Mangal'\">; PET में 3 अक्षर हैं → 41 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">123</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NEAR: N = 14, E = 5, A = 1, R = 18 → योग = </span><span style=\"font-weight:bold;font-family:'Mangal'\">38</span><span style=\"font-family:'Mangal'\">; NEAR में 4 अक्षर हैं → 38 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">152</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नियम है: कूट = (अक्षरों के स्थानों का योग) × (अक्षरों की संख्या)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAIN: T = 20, R = 18, A = 1, I = 9, N = 14 → योग = 20 + 18 + 1 + 9 + 14 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">62</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TRAIN में 5 अक्षर हैं → 62 × 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">310</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(288 में 62 × 5 गलत निकाला गया है; 196 और 218 न योग में बैठते हैं और न नियम में।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 'TRAIN' को </span><span style=\"font-weight:bold;font-family:'Mangal'\">310 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित में से कौन-से अक्षर-समूह # और % के स्थान पर आने चाहिए ताकि :: के बाईं ओर के अक्षर-समूह युग्म के बीच का पैटर्न और संबंध, :: के दाईं ओर के युग्म के समान हो?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TNQ : # :: % : GBE</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OPL, % = LZJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OPL, % = BXZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = OLP, % = LZJ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\"># = YPV, % = LZJ</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले समूह से दूसरे समूह तक का परिवर्तन दोनों युग्मों में समान होना चाहिए। प्रत्येक विकल्प जाँचें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प A: TNQ → OPL: T − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, N + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, Q − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\"> → (−5, +2, −5); LZJ → GBE: L − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, Z + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-family:'Mangal'\"> (26 + 2 = 28 → 28 − 26 = 2 = B), J − 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span><span style=\"font-family:'Mangal'\"> → (−5, +2, −5) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प B: TNQ → OPL = (−5, +2, −5); BXZ → GBE: B + 5 = G, X + 4 = B, Z + 5 = E → (+5, +4, +5) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प C: TNQ → OLP = (−5, </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\">, −1) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प D: TNQ → YPV = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">, +2, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">) ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\"># = OPL, % = LZJ (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N, O की माता है। O, P की पत्नी है। P, Q का भाई है। N का Q से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन के पति की माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी की माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q से शुरू करके एक-एक चरण चलें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q का भाई है → P, Q का </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई</span><span style=\"font-family:'Mangal'\"> है, और P तथा Q के माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O, P की पत्नी है → O और P पति-पत्नी हैं, अतः O, Q के भाई की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्नी</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N, O की माता है → N, Q के भाई की पत्नी की </span><span style=\"font-weight:bold;font-family:'Mangal'\">माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बहन के पति की माता के लिए P को Q की बहन होना पड़ता; भाई की पत्नी में N छूट जाती है; पत्नी की माता के लिए Q का विवाह O से होना पड़ता।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः N, Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पत्नी की माता (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आठ व्यक्ति P, Q, R, S, T, U, V और W एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं। T के दाईं ओर केवल तीन व्यक्ति बैठे हैं। Q पंक्ति के सबसे बाएँ छोर पर बैठा है। Q और R के बीच केवल एक व्यक्ति बैठा है। W, T के ठीक बाईं ओर बैठा है। S, V के ठीक दाईं ओर बैठा है। P पंक्ति के किसी एक छोर पर बैठा है। R के दाईं ओर तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 8 तक क्रमांकित करते हैं। सभी उत्तर दिशा की ओर मुख करके बैठे हैं, इसलिए बायाँ और दायाँ सामान्य रूप से ही लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T के दाईं ओर केवल तीन व्यक्ति → T = 8 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q सबसे बाएँ छोर पर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q और R के बीच केवल एक व्यक्ति → R = 1 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W, T के ठीक बाईं ओर → W = 5 − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P किसी एक छोर पर है, और सीट 1 पर Q है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 8</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब सीट 2, 6 और 7, S, U और V के लिए बची हैं। S, V के ठीक दाईं ओर है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 6, S = 7</span><span style=\"font-family:'Mangal'\">, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 2</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q – U – R – W – T – V – S – P</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R (सीट 3) के दाईं ओर तीसरा: 3 + 3 = सीट 6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">V (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIK−JLN CEG−FHJ</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB−ACE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ−ZBD</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ−ACE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB−ZCD</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे समूह के प्रत्येक अक्षर की तुलना पहले समूह के संगत अक्षर से करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIK − JLN: G + 3 = J, I + 3 = L, K + 3 = N → (+3, +3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CEG − FHJ: C + 3 = F, E + 3 = H, G + 3 = J → (+3, +3, +3) ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के भीतर भी अक्षर (+2, +2) से बढ़ते हैं: G, I, K और C, E, G.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विकल्प जाँचें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB − ACE: XZB के भीतर X + 2 = Z और Z + 2 = B (26 + 2 = 28 → 28 − 26 = 2 = B) ✓; X + 3 = A (24 + 3 = 27 → 27 − 26 = 1 = A), Z + 3 = C, B + 3 = E ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ − ZBD: X + 3 = A है, Z नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XYZ − ACE: XYZ के भीतर अक्षर (+1, +1) से बढ़ते हैं, और Y + 3 = B है, C नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZB − ZCD: X + 3 = A है, Z नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">XZB−ACE (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F, G, H, K, L और N ने छह अलग-अलग वर्षों 2016, 2017, 2018, 2019, 2020 और 2021 में एक-एक कार खरीदी, परंतु आवश्यक नहीं कि इसी क्रम में हो। F ने सम संख्या वाले वर्ष में कार खरीदी, परंतु 2016 में नहीं। H और K के कार खरीदने के वर्षों के बीच के वर्षों में ठीक दो व्यक्तियों ने कार खरीदी। N ने F के कार खरीदने के वर्ष के ठीक अगले वर्ष में कार खरीदी। L ने H से पहले कार खरीदी। K के बाद केवल एक व्यक्ति ने कार खरीदी। H के बाद कितने व्यक्तियों ने कार खरीदी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पाँच</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छहों वर्ष क्रम में लिखें: 2016, 2017, 2018, 2019, 2020, 2021.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K के बाद केवल एक व्यक्ति ने कार खरीदी → </span><span style=\"font-weight:bold;font-family:'Mangal'\">K = 2020</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F ने 2016 के अतिरिक्त किसी सम वर्ष में खरीदी, और 2020 पर K है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">F = 2018</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">N ने F के ठीक अगले वर्ष खरीदी → </span><span style=\"font-weight:bold;font-family:'Mangal'\">N = 2019</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H और K के बीच ठीक दो व्यक्ति → दोनों वर्षों का अंतर 3 है → H = 2020 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2017</span><span style=\"font-family:'Mangal'\"> (2020 + 3 = 2023 सूची में नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L ने H से पहले खरीदी → बचा हुआ पहले का एकमात्र वर्ष </span><span style=\"font-weight:bold;font-family:'Mangal'\">L = 2016</span><span style=\"font-family:'Mangal'\"> है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">G = 2021</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम (2016 → 2021): </span><span style=\"font-weight:bold;font-family:'Mangal'\">L, H, F, N, K, G</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H (2017) के बाद कार खरीदने वाले: F, N, K और G → </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कस्बा P, कस्बा Q से 12 km उत्तर में है। कस्बा R, कस्बा P से 9 km पूर्व में है। कस्बा S, कस्बा R से 5 km दक्षिण में है। कस्बा T, कस्बा S से 4 km पूर्व में है। कस्बा Q के सापेक्ष कस्बा T किस दिशा में है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पश्चिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण-पूर्व</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर-पश्चिम</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कस्बा Q को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q से 12 km उत्तर में है → P = (0, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R, P से 9 km पूर्व में है → R = (9, 12)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S, R से 5 km दक्षिण में है → S = (9, 7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, S से 4 km पूर्व में है → T = (</span><span style=\"font-weight:bold;font-family:'Mangal'\">13, 7</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T, Q से 13 km पूर्व और 7 km उत्तर में है, अतः T, Q के उत्तर-पूर्व में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(दक्षिण-पूर्व और दक्षिण-पश्चिम के लिए T को Q से नीचे होना पड़ता, तथा उत्तर-पश्चिम के लिए उसे Q के पश्चिम में होना पड़ता।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कस्बा T, कस्बा Q के </span><span style=\"font-weight:bold;font-family:'Mangal'\">उत्तर-पूर्व (विकल्प C)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O, N, W, M और A अक्षरों का प्रयोग करके, सभी अक्षरों का उपयोग करते हुए परंतु प्रत्येक शब्द में प्रत्येक अक्षर का केवल एक बार प्रयोग करते हुए, कितने अर्थपूर्ण पाँच-अक्षरीय अंग्रेज़ी शब्द बनाए जा सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो से अधिक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी पाँच अक्षरों का प्रयोग करना है, अतः O, N, W, M और A से बना पाँच अक्षरों का अंग्रेज़ी शब्द खोजें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें केवल दो स्वर A और O हैं, अतः शब्द व्यंजन, स्वर, व्यंजन, स्वर, व्यंजन के क्रम में बनेगा: W, O, M, A, N.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">WOMAN</span><span style=\"font-family:'Mangal'\"> बनता है, जो एक अर्थपूर्ण अंग्रेज़ी शब्द है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन पाँच अक्षरों की कोई अन्य व्यवस्था (जैसे MANOW, NOMAW, WAMON) अंग्रेज़ी शब्द नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ठीक </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक</span><span style=\"font-family:'Mangal'\"> अर्थपूर्ण शब्द बनाया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">एक (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BCD CDE EFG HIJ LMN ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QRT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PQR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QRS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RST</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के तीनों अक्षर क्रमागत हैं, अतः केवल पहले अक्षरों की तुलना करें: B, C, E, H, L, ?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B → C में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+1</span><span style=\"font-family:'Mangal'\">, C → E में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+2</span><span style=\"font-family:'Mangal'\">, E → H में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\">, H → L में </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">, अतः अगला चरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\"> होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> (12 + 5 = 17 = Q), और समूह Q, R, S → QRS</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PQR में +4 लिया गया है, RST में +6, तथा QRT तीन क्रमागत अक्षरों से नहीं बना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">QRS (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IGD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QPL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GEB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OMJ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">IGD: I − 2 = G, G − 3 = D → (−2, −3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GEB: G − 2 = E, E − 3 = B → (−2, −3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OMJ: O − 2 = M, M − 3 = J → (−2, −3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QPL: Q − 1 = P, P − 4 = L → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">−1, −4</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (−2, −3) का पालन करते हैं; केवल QPL नहीं (Q − 2 = O होता)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">QPL (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 11 19 35 67 ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">129</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">135</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">133</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">131</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक पद की तुलना उसके पिछले पद से करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 = (7 × 2) − 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">19 = (11 × 2) − 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">35 = (19 × 2) − 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">67 = (35 × 2) − 3 → नियम: अगला पद = (पिछला पद × 2) − 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला पद = (67 × 2) − 3 = 134 − 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">131</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(यदि − 3 वाला चरण छोड़ दिया जाए तो 134 आता; 129 और 135 किसी चरण में नहीं बैठते।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">131 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 एक निश्चित तर्क के अनुसार 49 से संबंधित है। उसी तर्क के अनुसार 9, 31 से संबंधित है। उसी तर्क के अनुसार 12 निम्नलिखित में से किससे संबंधित है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">42</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों दिए गए युग्मों पर लागू होने वाला एक नियम ज्ञात करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ लगभग तीन गुनी हो रही हैं, अतः मानें: दूसरी संख्या = (पहली संख्या × 3) + एक निश्चित संख्या।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15 → (15 × 3) + 4 = 45 + 4 = </span><span styl
