र जीवों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक समान लक्षण</span><span style=\"font-family:'Mangal'\"> होते हैं, और प्रत्येक निचला समूह अपने ऊपर के समूह का भाग है; अतः वंश पैंथेरा के सभी सदस्य कुल फेलिडी में आते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पैंथेरा और फेलिडी क्रमशः वंश और कुल हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्धसूत्री विभाजन (मियोसिस) के अंत में एक जनक कोशिका से बनती हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संतति कोशिकाएँ, जिनमें से प्रत्येक में जनक कोशिका के बराबर गुणसूत्र होते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार संतति कोशिकाएँ, जिनमें से प्रत्येक में जनक कोशिका के आधे गुणसूत्र होते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार संतति कोशिकाएँ, जिनमें से प्रत्येक में जनक कोशिका के बराबर गुणसूत्र होते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो संतति कोशिकाएँ, जिनमें से प्रत्येक में जनक कोशिका के आधे गुणसूत्र होते हैं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अर्धसूत्री विभाजन</span><span style=\"font-family:'Mangal'\"> प्रजनन अंगों की कोशिकाओं में होता है और यह एक के बाद एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो विभाजनों</span><span style=\"font-family:'Mangal'\"> में पूरा होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पहला विभाजन</span><span style=\"font-family:'Mangal'\"> गुणसूत्रों की संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">आधी</span><span style=\"font-family:'Mangal'\"> कर देता है, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">दूसरा विभाजन</span><span style=\"font-family:'Mangal'\"> उन कोशिकाओं को फिर से बाँट देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस प्रकार एक जनक कोशिका से </span><span style=\"font-weight:bold;font-family:'Mangal'\">चार संतति कोशिकाएँ</span><span style=\"font-family:'Mangal'\"> बनती हैं, और प्रत्येक में जनक कोशिका के </span><span style=\"font-weight:bold;font-family:'Mangal'\">आधे</span><span style=\"font-family:'Mangal'\"> गुणसूत्र होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसीलिए युग्मकों में गुणसूत्रों की संख्या आधी होती है, और निषेचन पर सामान्य संख्या फिर से बन जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसके विपरीत समसूत्री विभाजन </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\"> संतति कोशिकाएँ देता है, जिनमें जनक कोशिका के </span><span style=\"font-weight:bold;font-family:'Mangal'\">बराबर</span><span style=\"font-family:'Mangal'\"> गुणसूत्र होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अर्धसूत्री विभाजन से चार कोशिकाएँ बनती हैं जिनमें आधे गुणसूत्र होते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संवर्धन पात्र में उगती सामान्य जंतु कोशिकाएँ पड़ोसी कोशिकाओं से स्पर्श होते ही विभाजित होना बंद कर देती हैं। अर्बुद (ट्यूमर) से ली गई कोशिकाएँ नहीं रुकतीं और एक-दूसरे पर ढेर बनती जाती हैं। ऐसा इसलिए है क्योंकि अर्बुद कोशिकाओं ने खो दिया है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">विभाजित होने की क्षमता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपनी कोशिका भित्ति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संपर्क संदमन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्वसन की क्षमता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनेक जंतु कोशिकाओं में कोशिका विभाजन प्रायः पड़ोसी कोशिकाओं के </span><span style=\"font-weight:bold;font-family:'Mangal'\">संपर्क में आने पर रुक जाता</span><span style=\"font-family:'Mangal'\"> है; इसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">संपर्क संदमन</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">कैंसर कोशिकाएँ</span><span style=\"font-family:'Mangal'\"> संपर्क संदमन का नियंत्रण </span><span style=\"font-weight:bold;font-family:'Mangal'\">खो देती</span><span style=\"font-family:'Mangal'\"> हैं और </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनियंत्रित रूप से विभाजित</span><span style=\"font-family:'Mangal'\"> होती रहती हैं, जिससे अर्बुद बनते हैं। इसीलिए पात्र में अर्बुद कोशिकाओं का ढेर बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">पादप कोशिकाएँ</span><span style=\"font-family:'Mangal'\"> अपनी </span><span style=\"font-weight:bold;font-family:'Mangal'\">दृढ़ कोशिका भित्ति</span><span style=\"font-family:'Mangal'\"> के कारण संपर्क संदमन </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> दर्शातीं और वृद्धि का भिन्न प्रतिरूप अपनाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कैंसर कोशिकाओं ने विभाजित होने की क्षमता </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> खोई है; वे सामान्य कोशिकाओं से अधिक विभाजित होती हैं। जंतु कोशिकाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोशिका भित्ति होती ही नहीं</span><span style=\"font-family:'Mangal'\">, इसलिए वह भी नहीं खो सकती।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अर्बुद कोशिकाओं ने संपर्क संदमन खो दिया है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कार विराम से चलना शुरू करती है और 5 सेकंड तक 2 m/s² के एकसमान त्वरण से चलती है। इस समयांतराल में कार द्वारा तय की गई दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25 मीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">50 मीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 मीटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 मीटर</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है: प्रारंभिक वेग u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0</span><span style=\"font-family:'Mangal'\"> (विराम से), त्वरण a = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">, समय t = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5 s</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गति का दूसरा समीकरण: s = ut + ½at²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">s = (0 × 5) + (½ × 2 × 5²) = 0 + (½ × 2 × 25) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्यान दें: 50 m तब आता है जब ½ छूट जाए, और 10 m अंतिम वेग (v = at = 10 m/s) है, दूरी नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तय की गई दूरी 25 मीटर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनों के आवेशों के साथ क्रिस-क्रॉस विधि का उपयोग करने पर, निम्नलिखित में से कौन-सा रासायनिक सूत्र सही लिखा गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">AlOH₃ (ऐलुमिनियम हाइड्रॉक्साइड)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ca₂(CO₃)₂ (कैल्सियम कार्बोनेट)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al₂(SO₄)₃ (ऐलुमिनियम सल्फेट)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MgOH₂ (मैग्नीशियम हाइड्रॉक्साइड)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आयनिक यौगिक के लिए धनायन और ऋणायन की आवेश संख्याओं को क्रिस-क्रॉस करके पादांक (सबस्क्रिप्ट) लिखे जाते हैं; जब एक ही प्रकार के दो या अधिक </span><span style=\"font-weight:bold;font-family:'Mangal'\">बहुपरमाणुक आयन</span><span style=\"font-family:'Mangal'\"> हों, तो </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोष्ठक</span><span style=\"font-family:'Mangal'\"> लगाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-weight:bold;font-family:'Mangal'\"> और SO₄</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> के क्रिस-क्रॉस से </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al₂(SO₄)₃</span><span style=\"font-family:'Mangal'\"> बनता है, जिसमें कोष्ठक में तीन सल्फेट आयन हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Al</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">3+</span><span style=\"font-family:'Mangal'\"> और OH⁻ से </span><span style=\"font-weight:bold;font-family:'Mangal'\">Al(OH)₃</span><span style=\"font-family:'Mangal'\"> बनता है, AlOH₃ नहीं (कोष्ठक दर्शाता है कि एक ऐलुमिनियम आयन से तीन हाइड्रॉक्साइड आयन जुड़े हैं); इसी प्रकार Mg</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> और OH⁻ से </span><span style=\"font-weight:bold;font-family:'Mangal'\">Mg(OH)₂</span><span style=\"font-family:'Mangal'\">, MgOH₂ नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Ca</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2+</span><span style=\"font-family:'Mangal'\"> और CO₃</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">2−</span><span style=\"font-family:'Mangal'\"> से Ca₂(CO₃)₂ बनता है, जिसे सरलतम अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">CaCO₃</span><span style=\"font-family:'Mangal'\"> में लिखना होता है, क्योंकि दोनों आयनों के आवेश बराबर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही लिखा गया सूत्र Al₂(SO₄)₃ है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु की संरचना के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बोर के मॉडल में L-कोश (n = 2) के इलेक्ट्रॉन की ऊर्जा K-कोश (n = 1) के इलेक्ट्रॉन से अधिक होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. न्यूट्रॉन हाइड्रोजन सहित सभी परमाणुओं के नाभिक में पाए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. न्यूट्रॉन उदासीन होने के कारण नाभिक में प्रोटॉनों के बीच प्रतिकर्षण घटाने में सहायक होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. बोर के मॉडल में नाभिक के सबसे निकट K-कोश (n = 1) की ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे कम</span><span style=\"font-family:'Mangal'\"> है; नाभिक से दूर जाने पर कोशों की ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">बढ़ती</span><span style=\"font-family:'Mangal'\"> है, अतः L-कोश के इलेक्ट्रॉन की ऊर्जा K-कोश के इलेक्ट्रॉन से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. न्यूट्रॉन </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन को छोड़कर</span><span style=\"font-family:'Mangal'\"> सभी परमाणुओं के नाभिक में पाए जाते हैं (सामान्य हाइड्रोजन परमाणु में 1 प्रोटॉन और 0 न्यूट्रॉन) → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. नाभिक में प्रत्येक प्रोटॉन दूसरे प्रत्येक प्रोटॉन को प्रतिकर्षित करता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूट्रॉन</span><span style=\"font-family:'Mangal'\"> उदासीन होने के कारण प्रोटॉनों के बीच दूरी बढ़ाकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">इस प्रतिकर्षण को घटाते</span><span style=\"font-family:'Mangal'\"> हैं और नाभिकीय बल को भी मज़बूत करते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे खेतों से घिरी एक झील में, जहाँ रासायनिक उर्वरकों का भारी उपयोग होता है, बड़ी संख्या में मछलियाँ मरी पाई जाती हैं और जल की सतह शैवाल की मोटी हरी परत से ढकी है। मछलियों की मृत्यु का सबसे संभावित कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उर्वरकों ने मछलियों को सीधे विषाक्त कर दिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शैवाल ने जल में ओज़ोन छोड़ी, जिसने मछलियों को मार दिया</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उर्वरकों से आए अतिरिक्त नाइट्रेट ने शैवाल प्रस्फुटन कराया, जिसने जल की ऑक्सीजन समाप्त कर दी (सुपोषण)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उर्वरकों ने झील के जल को मछलियों के लिए अत्यधिक अम्लीय बना दिया</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कृषि में उर्वरकों का अत्यधिक उपयोग नदियों और झीलों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अत्यधिक नाइट्रोजन (नाइट्रेट के रूप में)</span><span style=\"font-family:'Mangal'\"> मिला देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ये पोषक तत्व शैवाल की व्यापक वृद्धि (</span><span style=\"font-weight:bold;font-family:'Mangal'\">शैवाल प्रस्फुटन</span><span style=\"font-family:'Mangal'\">) कराते हैं, जो जल की सतह पर हरी परत के रूप में दिखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शैवाल की यह अतिवृद्धि जल निकाय की </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन समाप्त</span><span style=\"font-family:'Mangal'\"> कर देती है, जिससे </span><span style=\"font-weight:bold;font-family:'Mangal'\">मछलियाँ मर जाती</span><span style=\"font-family:'Mangal'\"> हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोषक-प्रेरित शैवाल अतिवृद्धि द्वारा ऑक्सीजन की यह कमी </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुपोषण (यूट्रोफिकेशन)</span><span style=\"font-family:'Mangal'\"> कहलाती है; यह जल निकायों और तटीय मत्स्य पालन के लिए खतरा है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मछलियों की मृत्यु सुपोषण के कारण हुई </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): एक अकेली स्थिर घिरनी भार उठाने के लिए आवश्यक प्रयास का परिमाण घटा देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): स्थिर घिरनी केवल लगाए गए बल की दिशा बदलती है, इसलिए उसका यांत्रिक लाभ 1 होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिर घिरनी</span><span style=\"font-family:'Mangal'\"> आवश्यक बल का परिमाण </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं घटाती</span><span style=\"font-family:'Mangal'\">; वह केवल उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिशा बदलती</span><span style=\"font-family:'Mangal'\"> है → A असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि प्रयास और भार परिमाण में बराबर होते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिर घिरनी का यांत्रिक लाभ 1</span><span style=\"font-family:'Mangal'\"> है → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थिर घिरनी की सुविधा यह है कि भार को सीधे ऊपर की ओर बल लगाकर उठाने की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे की ओर</span><span style=\"font-family:'Mangal'\"> खींचना आसान है; 1 से अधिक यांत्रिक लाभ के लिए चल घिरनी या घिरनियों का निकाय चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी से एक भारी नाव को थामे एक नाविक पाता है कि यदि वह रस्सी को घाट के खंभे के चारों ओर एक बार लपेट दे, तो उसे बहुत कम बल लगाना पड़ता है, और दो लपेटों में और भी कम। इसका कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी का प्रत्येक लपेट नाव के रस्सी पर लगने वाले भार को घटा देता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के तीसरे नियम से खंभा नाव को पीछे धकेलता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक अतिरिक्त लपेट रस्सी और खंभे के बीच घर्षण बढ़ाता है, और यह वृद्धि एक लपेट से अपेक्षित वृद्धि से कहीं अधिक होती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रस्सी खिंचकर प्रत्येक लपेट में स्थितिज ऊर्जा संचित करती है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब भी सतहें संपर्क में होती हैं, घर्षण उपस्थित रहता है; यहाँ संपर्क </span><span style=\"font-weight:bold;font-family:'Mangal'\">रस्सी और खंभे</span><span style=\"font-family:'Mangal'\"> के बीच है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खुरदुरे खंभे के चारों ओर रस्सी का प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">अतिरिक्त लपेट</span><span style=\"font-family:'Mangal'\"> रस्सी और खंभे के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">पकड़ बढ़ाता</span><span style=\"font-family:'Mangal'\"> है, अर्थात् </span><span style=\"font-weight:bold;font-family:'Mangal'\">घर्षण</span><span style=\"font-family:'Mangal'\"> बढ़ाता है, और इसलिए उसी भार को थामने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">आवश्यक बल घटा</span><span style=\"font-family:'Mangal'\"> देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लपेट जोड़ने से प्रयास में कमी केवल एक लपेट से अपेक्षित कमी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कहीं अधिक</span><span style=\"font-family:'Mangal'\"> होती है। यहाँ घर्षण संपर्क के छोटे परिवर्तनों के साथ सरल रैखिक रूप से नहीं बढ़ता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी प्रकार रस्सी और खंभे के बीच का घर्षण बड़े जहाज़ों को घाट पर सुरक्षित थामे रखता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अतिरिक्त लपेट रस्सी और खंभे के बीच घर्षण बढ़ाते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पार्क में 20 kg और 40 kg के दो बच्चे समान ऊँचाई की दो अलग-अलग फिसलपट्टियों (एक सीधी और एक वक्र) के शीर्ष से विराम से फिसलना शुरू करते हैं। घर्षण और वायु प्रतिरोध नगण्य मानते हुए, तल पर उनकी चाल के विषय में निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40 kg का बच्चा 20 kg के बच्चे से दोगुनी चाल से तल पर पहुँचता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबी वक्र फिसलपट्टी वाला बच्चा अधिक चाल से तल पर पहुँचता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 kg का बच्चा तेज़ी से पहुँचता है क्योंकि हल्का पिंड अधिक त्वरित होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों समान चाल से तल पर पहुँचते हैं, जो केवल फिसलपट्टी की ऊँचाई पर निर्भर करती है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब कोई वस्तु केवल गुरुत्व के अधीन चलती है, तो उसकी </span><span style=\"font-weight:bold;font-family:'Mangal'\">यांत्रिक ऊर्जा संरक्षित</span><span style=\"font-family:'Mangal'\"> रहती है: खोई गई स्थितिज ऊर्जा प्राप्त गतिज ऊर्जा के बराबर होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शीर्ष पर ऊर्जा = </span><span style=\"font-weight:bold;font-family:'Mangal'\">mgh</span><span style=\"font-family:'Mangal'\">; तल पर यह पूरी गतिज है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">½mv²</span><span style=\"font-family:'Mangal'\">. बराबर करने पर: mgh = ½mv² → </span><span style=\"font-weight:bold;font-family:'Mangal'\">v = √(2gh)</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">द्रव्यमान m कट जाता है, इसलिए तल पर चाल </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल ऊँचाई h</span><span style=\"font-family:'Mangal'\"> पर निर्भर करती है, बच्चे के द्रव्यमान या फिसलपट्टी के आकार (लंबाई) पर नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दोनों बच्चे समान चाल से तल पर पहुँचते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कायिक प्रवर्धन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कायिक प्रवर्धन से उगाए गए पौधे बीजों से उत्पन्न पौधों की तुलना में जल्दी फूल और फल दे सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कायिक प्रवर्धन से केला, संतरा, गुलाब और चमेली जैसे पौधों का प्रवर्धन संभव होता है, जिन्होंने बीज बनाने की क्षमता खो दी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कायिक प्रवर्धन से उत्पन्न पौधे बीजों से उत्पन्न पौधों की तुलना में कहीं अधिक विभिन्नता दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. कायिक प्रवर्धन से उगाए गए पौधे बीजों से उत्पन्न पौधों की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल्दी फूल और फल</span><span style=\"font-family:'Mangal'\"> दे सकते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लेयरिंग और ग्राफ्टिंग जैसी विधियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">केला, संतरा, गुलाब और चमेली</span><span style=\"font-family:'Mangal'\"> जैसे पौधों का प्रवर्धन संभव बनाती हैं, जिन्होंने </span><span style=\"font-weight:bold;font-family:'Mangal'\">बीज बनाने की क्षमता खो दी</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. कायिक प्रवर्धन से उत्पन्न पौधे जनक पौधे से इतने </span><span style=\"font-weight:bold;font-family:'Mangal'\">आनुवंशिक रूप से समान</span><span style=\"font-family:'Mangal'\"> होते हैं कि उनमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">उसके सभी लक्षण</span><span style=\"font-family:'Mangal'\"> होते हैं; विभिन्नता लैंगिक प्रजनन का लक्षण है, कायिक प्रवर्धन का नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेलगाड़ियों में चाय पहले प्लास्टिक के गिलासों में दी जाती थी, जिन्हें विक्रेता को लौटाना पड़ता था; फिर स्वच्छता के लिए डिस्पोज़ेबल प्लास्टिक कप लाए गए। विकल्प के रूप में डिस्पोज़ेबल मिट्टी के कप (कुल्हड़) सुझाए गए, परंतु उन्हें बड़े पैमाने पर नहीं अपनाया गया। कुल्हड़ न अपनाने का मुख्य कारण था:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिट्टी के कप अजैव निम्नीकरणीय हैं और पर्यावरण में बने रहते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिट्टी के कप गर्म चाय नहीं रख सकते</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिट्टी के कप कागज़ के कपों से महँगे हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बड़े पैमाने पर कुल्हड़ बनाने से उपजाऊ ऊपरी मिट्टी की हानि होती</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले रेलगाड़ियों में चाय </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्लास्टिक के गिलासों</span><span style=\"font-family:'Mangal'\"> में दी जाती थी, जिन्हें लौटाना पड़ता था; स्वच्छता की दिशा में कदम के रूप में </span><span style=\"font-weight:bold;font-family:'Mangal'\">डिस्पोज़ेबल प्लास्टिक कप</span><span style=\"font-family:'Mangal'\"> लाए गए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लास्टिक कपों के विकल्प के रूप में </span><span style=\"font-weight:bold;font-family:'Mangal'\">डिस्पोज़ेबल मिट्टी के कप (कुल्हड़)</span><span style=\"font-family:'Mangal'\"> सुझाए गए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु कुल्हड़ </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़े पैमाने पर</span><span style=\"font-family:'Mangal'\"> बनाने से </span><span style=\"font-weight:bold;font-family:'Mangal'\">उपजाऊ ऊपरी मिट्टी की हानि</span><span style=\"font-family:'Mangal'\"> होती, इसलिए यह टिकाऊ समाधान नहीं था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब रेलगाड़ियों में इसके बजाय </span><span style=\"font-weight:bold;font-family:'Mangal'\">डिस्पोज़ेबल कागज़ के कप</span><span style=\"font-family:'Mangal'\"> उपयोग किए जा रहे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कुल्हड़ उपजाऊ ऊपरी मिट्टी की हानि के कारण नहीं अपनाए गए </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. सीधे राजमार्ग पर उच्च नियत वेग से चलती बस का त्वरण शून्य होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. तरणताल के एक सिरे से दूसरे सिरे तक जाकर प्रारंभिक बिंदु पर लौटने वाले तैराक की औसत चाल अशून्य परंतु औसत वेग शून्य होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. वाहन के स्पीडोमीटर का रीडिंग उसके वेग की दिशा बताता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. त्वरण इस पर निर्भर करता है कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">वेग कितनी तेज़ी से बदलता</span><span style=\"font-family:'Mangal'\"> है, न कि वस्तु कितनी तेज़ चल रही है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">नियत वेग</span><span style=\"font-family:'Mangal'\"> से चलती बस का त्वरण उच्च चाल पर भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">शून्य</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. तैराक लिए गए समय में दूरी (ताल की लंबाई का दोगुना) तय करता है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">औसत चाल अशून्य</span><span style=\"font-family:'Mangal'\"> है; परंतु विस्थापन </span><span style=\"font-weight:bold;font-family:'Mangal'\">शून्य</span><span style=\"font-family:'Mangal'\"> है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">औसत वेग शून्य</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. स्पीडोमीटर का रीडिंग (लगभग) वेग का </span><span style=\"font-weight:bold;font-family:'Mangal'\">परिमाण</span><span style=\"font-family:'Mangal'\"> देता है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिशा</span><span style=\"font-family:'Mangal'\"> टायरों की दिशा से मिलती है, स्पीडोमीटर से नहीं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक प्रयोग में NaCl और सांद्र H₂SO₄ से बनी शुष्क HCl गैस को पहले सूखे नीले लिटमस पत्र और फिर गीले नीले लिटमस पत्र से परखा जाता है। निम्नलिखित में से कौन-सा परिणाम और उसके कारण को सही बताता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल गीला लिटमस लाल होता है, क्योंकि HCl से H⁺ आयन केवल जल की उपस्थिति में बनते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों पत्र लाल होते हैं, क्योंकि HCl किसी भी अवस्था में प्रबल अम्ल है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल सूखा लिटमस लाल होता है, क्योंकि जल अम्ल को तनु कर देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई भी पत्र रंग नहीं बदलता, क्योंकि HCl गैस उदासीन है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">शुष्क HCl गैस</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूखे</span><span style=\"font-family:'Mangal'\"> लिटमस पत्र का रंग </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> बदलती, परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">गीले</span><span style=\"font-family:'Mangal'\"> नीले लिटमस को </span><span style=\"font-weight:bold;font-family:'Mangal'\">लाल</span><span style=\"font-family:'Mangal'\"> कर देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">HCl अणुओं से H⁺</span><span style=\"font-family:'Mangal'\"> का पृथक होना </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल के बिना</span><span style=\"font-family:'Mangal'\"> संभव नहीं; हाइड्रोजन आयन केवल जल की उपस्थिति में बनते हैं: HCl + H₂O → H₃O⁺ + Cl⁻.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हाइड्रोजन आयन अकेले नहीं रह सकते; वे जल के अणुओं के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">H⁺(aq) या हाइड्रोनियम आयन (H₃O⁺)</span><span style=\"font-family:'Mangal'\"> के रूप में रहते हैं, और यही आयन अम्लीय गुण दर्शाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शुष्क गैस में H⁺(aq) नहीं होते और सूखा लिटमस अपरिवर्तित रहता है, जबकि गीले लिटमस की नमी HCl को आयनित होने देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल गीला लिटमस लाल होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. विद्युत बल्बों के तंतुओं के लिए लगभग केवल टंगस्टन का उपयोग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विद्युत संचरण लाइनों के लिए सामान्यतः ताँबे और ऐलुमिनियम का उपयोग होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. रबर और काँच जैसे विद्युतरोधकों की प्रतिरोधकता 10</span><span style=\"font-size:8pt;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-family:'Mangal'\"> Ω m की कोटि की होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. विद्युत बल्बों के </span><span style=\"font-weight:bold;font-family:'Mangal'\">तंतुओं</span><span style=\"font-family:'Mangal'\"> के लिए लगभग केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">टंगस्टन</span><span style=\"font-family:'Mangal'\"> का उपयोग होता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत संचरण लाइनों</span><span style=\"font-family:'Mangal'\"> के लिए सामान्यतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">ताँबे और ऐलुमिनियम</span><span style=\"font-family:'Mangal'\"> का उपयोग होता है (इनकी प्रतिरोधकता बहुत कम है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. धातुओं और मिश्रधातुओं की प्रतिरोधकता बहुत कम, </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−8</span><span style=\"font-weight:bold;font-family:'Mangal'\"> से 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">−6</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m</span><span style=\"font-family:'Mangal'\"> के परास में होती है; रबर और काँच जैसे विद्युतरोधकों की प्रतिरोधकता बहुत अधिक, </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">12</span><span style=\"font-weight:bold;font-family:'Mangal'\"> से 10</span><span style=\"font-size:8pt;font-weight:bold;vertical-align:super;font-family:'Mangal'\">17</span><span style=\"font-weight:bold;font-family:'Mangal'\"> Ω m</span><span style=\"font-family:'Mangal'\"> की कोटि की होती है → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंडल ने गोल, हरे बीज वाले मटर के पौधे (RRyy) का संकरण झुर्रीदार, पीले बीज वाले पौधे (rrYY) से कराया। सभी F₁ पौधों के बीज गोल और पीले थे। F₁ पौधों के स्व-परागण से F₂ पीढ़ी में चार प्रकार के बीज मिले। इनमें से कौन-से दो प्रकार नए संयोजन हैं, जो किसी भी जनक में नहीं थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल पीले और गोल हरे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल हरे और झुर्रीदार पीले</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल पीले और झुर्रीदार हरे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">झुर्रीदार पीले और झुर्रीदार हरे</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनक </span><span style=\"font-weight:bold;font-family:'Mangal'\">गोल हरे (RRyy)</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">झुर्रीदार पीले (rrYY)</span><span style=\"font-family:'Mangal'\"> हैं; F₁ (RrYy) गोल पीला है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F₁ के युग्मक RY, Ry, rY और ry के संयोग से F₂ (16 संयोजन) में चार प्रकार के बीज बनते हैं। मेंडल की 556 बीजों की गणना में: 315 गोल पीले, 108 गोल हरे, 101 झुर्रीदार पीले और 32 झुर्रीदार हरे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गोल हरे</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">झुर्रीदार पीले</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">जनकीय</span><span style=\"font-family:'Mangal'\"> संयोजन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">गोल पीले</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">झुर्रीदार हरे</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">नए संयोजन</span><span style=\"font-family:'Mangal'\"> हैं, जो इसलिए बनते हैं क्योंकि बीज के आकार और रंग को नियंत्रित करने वाले कारक </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनर्संयोजित</span><span style=\"font-family:'Mangal'\"> होते हैं; दोनों लक्षण स्वतंत्र रूप से वंशागत होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नए संयोजन गोल पीले और झुर्रीदार हरे हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): छुई-मुई (मिमोसा) का पौधा तंत्रिका ऊतक या पेशी ऊतक न होने पर भी स्पर्श की अनुक्रिया में अपनी पत्तियाँ मोड़ लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): पादप कोशिकाएँ जंतु पेशी कोशिकाओं की तरह संकुचनशील प्रोटीनों का उपयोग करने के बजाय अपने भीतर जल की मात्रा बदलकर, फूलकर या सिकुड़कर, अपना आकार बदलती हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छुई-मुई के पौधे में </span><span style=\"font-weight:bold;font-family:'Mangal'\">तंत्रिका ऊतक या पेशी ऊतक नहीं</span><span style=\"font-family:'Mangal'\"> होता, फिर भी वह स्पर्श का पता लगाकर अनुक्रिया में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्तियाँ हिलाता</span><span style=\"font-family:'Mangal'\"> है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह गति इसलिए होती है क्योंकि पादप कोशिकाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपने भीतर जल की मात्रा बदलकर आकार बदलती</span><span style=\"font-family:'Mangal'\"> हैं (फूलना या सिकुड़ना); जंतु पेशी कोशिकाएँ इसके बजाय विशेष संकुचनशील प्रोटीनों का उपयोग करती हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोशिका आकार का यह जल-आधारित परिवर्तन ही बिना पेशियों के पत्तियों के मुड़ने का कारण है; सूचना स्वयं विद्युत-रासायनिक साधनों से पहुँचती है, क्योंकि पादपों में सूचना संवहन के लिए कोई विशेष ऊतक नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं और R, A की सही व्याख्या है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबाई l और अनुप्रस्थ काट क्षेत्रफल A वाले तार का प्रतिरोध 2 Ω है। उसी पदार्थ के दूसरे तार की लंबाई 3l और अनुप्रस्थ काट क्षेत्रफल A/2 है। दूसरे तार का प्रतिरोध है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 Ω</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6 Ω</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/3 Ω</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 Ω</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चालक के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = ρl/A</span><span style=\"font-family:'Mangal'\">: प्रतिरोध लंबाई के अनुक्रमानुपाती और अनुप्रस्थ काट क्षेत्रफल के व्युत्क्रमानुपाती है; दोनों तारों के लिए ρ समान है (समान पदार्थ)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R₁ = ρl/A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R₂ = ρ(3l)/(A/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 × (ρl/A)</span><span style=\"font-family:'Mangal'\"> = 6 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबाई तिगुनी होने से प्रतिरोध 3 गुना, और क्षेत्रफल आधा होने से 2 गुना और → 3 × 2 = 6 गुना।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरे तार का प्रतिरोध 12 Ω है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संधि को उसके प्रकार से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789734186576_image001.png\" style=\"width: 900px; height: 300px;\" /></p>", "option1": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option2": "\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "option3": "\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option4": "\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंधे</span><span style=\"font-family:'Mangal'\"> में ऊपरी बाँह की हड्डी का गोल सिरा कंधे की हड्डी के उथले गड्ढे में बैठता है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कंदुक-खल्लिका संधि</span><span style=\"font-family:'Mangal'\"> है, जो आगे, पीछे, बगल और वृत्ताकार गतियाँ देती है &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोहनी</span><span style=\"font-family:'Mangal'\"> दरवाज़े के कब्जे की तरह केवल एक दिशा में मुड़ती और सीधी होती है; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">हिंज संधि</span><span style=\"font-family:'Mangal'\"> है (घुटने में भी यही होती है) &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">खोपड़ी रीढ़ की हड्डी</span><span style=\"font-family:'Mangal'\"> से </span><span style=\"font-weight:bold;font-family:'Mangal'\">धुराग्र संधि</span><span style=\"font-family:'Mangal'\"> द्वारा जुड़ी है, जो सिर को दरवाज़े की घुंडी की तरह अगल-बगल घुमाने देती है &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 cm ऊँची एक वस्तु 20 cm फोकस दूरी के उत्तल लेंस के सामने 30 cm पर रखी है। बनने वाला प्रतिबिंब है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से दूसरी ओर 60 cm पर, वास्तविक, उल्टा और 6 cm ऊँचा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से उसी ओर 12 cm पर, आभासी, सीधा और 1.2 cm ऊँचा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से दूसरी ओर 60 cm पर, आभासी, सीधा और 6 cm ऊँचा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस से दूसरी ओर 30 cm पर, वास्तविक, उल्टा और 3 cm ऊँचा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चिह्न परिपाटी: वस्तु दूरी u = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−30 cm</span><span style=\"font-family:'Mangal'\">, उत्तल लेंस की फोकस दूरी f = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+20 cm</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लेंस सूत्र </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/v − 1/u = 1/f</span><span style=\"font-family:'Mangal'\">: 1/v = 1/f + 1/u = 1/20 − 1/30 = (3 − 2) ÷ 60 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/60</span><span style=\"font-family:'Mangal'\"> → v = </span><span style=\"font-weight:bold;font-family:'Mangal'\">+60 cm</span><span style=\"font-family:'Mangal'\"> (धनात्मक → लेंस की दूसरी ओर, अतः प्रतिबिंब वास्तविक है और पर्दे पर लिया जा सकता है).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आवर्धन m = </span><span style=\"font-weight:bold;font-family:'Mangal'\">v/u</span><span style=\"font-family:'Mangal'\"> = 60 ÷ (−30) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\">; ऋणात्मक चिह्न दर्शाता है कि प्रतिबिंब </span><span style=\"font-weight:bold;font-family:'Mangal'\">उल्टा</span><span style=\"font-family:'Mangal'\"> और वास्तविक है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिबिंब की ऊँचाई h' = m × h = −2 × 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−6 cm</span><span style=\"font-family:'Mangal'\">, अर्थात् 6 cm ऊँचा, उल्टा (वस्तु F₁ और 2F₁ के बीच है, अतः प्रतिबिंब 2F₂ से परे और बड़ा बनता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः प्रतिबिंब दूसरी ओर 60 cm पर, वास्तविक, उल्टा और 6 cm ऊँचा है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीधी सड़क पर 54 km/h की चाल से चलती एक बस को 60 m आगे एक अवरोध दिखाई देता है। चालक ब्रेक लगाने से पहले प्रतिक्रिया में 0.6 s लेता है, जिसके बाद बस 2.5 m/s² के एकसमान मंदन से धीमी होती है। बस:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवरोध से टकरा जाएगी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवरोध से 6 m पहले रुक जाएगी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवरोध से 15 m पहले रुक जाएगी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अवरोध से 9 m पहले रुक जाएगी</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बस की चाल u = 54 km/h = 54 × (1000 ÷ 3600) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिक्रिया समय में बस नियत चाल से चलती है: दूरी = 15 × 0.6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रेक लगने के बाद त्वरण वेग के विपरीत है (a = −2.5 m/s²) और v = 0. </span><span style=\"font-weight:bold;font-family:'Mangal'\">v² = u² + 2as</span><span style=\"font-family:'Mangal'\"> से: 0 = 15² − 2 × 2.5 × s → s = 225 ÷ 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल रुकने की दूरी = 9 + 45 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">54 m</span><span style=\"font-family:'Mangal'\">, जो 60 m से कम है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बस अवरोध से 60 − 54 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 m</span><span style=\"font-family:'Mangal'\"> पहले रुक जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बस अवरोध से 6 m पहले रुक जाएगी </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वैज्ञानिक को उसके योगदान से सुमेलित कीजिए:</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><img alt=\"\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789734186576_image002.png\" style=\"width: 981px; height: 200px;\" /></p>", "option1": "\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2</span></p>", "option2": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2</span></p>", "option3": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1</span></p>", "option4": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-2, (b)-1, (c)-3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">जे. जे. थॉमसन</span><span style=\"font-family:'Mangal'\"> की सबसे महत्वपूर्ण खोज </span><span style=\"font-weight:bold;font-family:'Mangal'\">इलेक्ट्रॉन</span><span style=\"font-family:'Mangal'\"> की थी; यह पहचाना गया पहला उप-परमाणुक कण है, जो हर परमाणु का भाग है (1897) &rarr; (3).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">जेम्स चैडविक</span><span style=\"font-family:'Mangal'\"> (1932) ने प्रोटॉन के लगभग बराबर द्रव्यमान परंतु </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिना विद्युत आवेश</span><span style=\"font-family:'Mangal'\"> वाले नए उप-परमाणुक कण (</span><span style=\"font-weight:bold;font-family:'Mangal'\">न्यूट्रॉन</span><span style=\"font-family:'Mangal'\">) की खोज की &rarr; (1).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">नील्स बोर</span><span style=\"font-family:'Mangal'\"> (1913) ने प्रस्तावित किया कि इलेक्ट्रॉन यादृच्छिक रूप से नहीं घूमते, बल्कि </span><span style=\"font-weight:bold;font-family:'Mangal'\">स्थिर अवस्थाओं, कक्षाओं या कोशों</span><span style=\"font-family:'Mangal'\"> नामक </span><span style=\"font-weight:bold;font-family:'Mangal'\">निश्चित वृत्ताकार पथों</span><span style=\"font-family:'Mangal'\"> में चलते हैं &rarr; (2).</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक छात्र तनु नाइट्रिक अम्ल में ज़िंक के दाने डालता है परंतु हाइड्रोजन गैस प्राप्त नहीं होती, जबकि ज़िंक तनु हाइड्रोक्लोरिक अम्ल के साथ हाइड्रोजन देता है। निम्नलिखित में से कौन-सा सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक सक्रियता श्रेणी में हाइड्रोजन से नीचे है, इसलिए वह किसी भी अम्ल से हाइड्रोजन विस्थापित नहीं कर सकता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HNO₃ एक प्रबल ऑक्सीकारक है जो बनी हुई हाइड्रोजन को जल में ऑक्सीकृत कर देता है और स्वयं नाइट्रोजन के ऑक्साइडों में अपचयित हो जाता है; केवल Mg और Mn अति तनु HNO₃ से H₂ देते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रिक अम्ल धातुओं से बिल्कुल अभिक्रिया नहीं करता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रिक अम्ल दुर्बल अम्ल है, इसलिए हाइड्रोजन देने योग्य आयनित नहीं होता</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धातुएँ तनु अम्लों से अभिक्रिया करके लवण और हाइड्रोजन देती हैं: धातु + तनु अम्ल → लवण + हाइड्रोजन; ज़िंक सक्रियता श्रेणी में </span><span style=\"font-weight:bold;font-family:'Mangal'\">हाइड्रोजन से ऊपर</span><span style=\"font-family:'Mangal'\"> है, इसलिए वह तनु HCl से H₂ देता ही है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब धातु </span><span style=\"font-weight:bold;font-family:'Mangal'\">नाइट्रिक अम्ल</span><span style=\"font-family:'Mangal'\"> से अभिक्रिया करती है तो हाइड्रोजन गैस </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं निकलती</span><span style=\"font-family:'Mangal'\">, क्योंकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">HNO₃ प्रबल ऑक्सीकारक</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नाइट्रिक अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">बनी हुई हाइड्रोजन को जल में ऑक्सीकृत</span><span style=\"font-family:'Mangal'\"> कर देता है और स्वयं N₂O, NO या NO₂ जैसे नाइट्रोजन ऑक्साइडों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपचयित</span><span style=\"font-family:'Mangal'\"> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अपवाद </span><span style=\"font-weight:bold;font-family:'Mangal'\">मैग्नीशियम और मैंगनीज़</span><span style=\"font-family:'Mangal'\"> हैं, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">अति तनु</span><span style=\"font-family:'Mangal'\"> नाइट्रिक अम्ल से अभिक्रिया करके हाइड्रोजन गैस देते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः HNO₃ बनी हुई हाइड्रोजन को ऑक्सीकृत कर देता है, और केवल Mg और Mn अति तनु HNO₃ से H₂ देते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश के प्रकीर्णन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वास्तविक विलयन से गुज़रने वाले प्रकाश पुंज का पथ दिखाई देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. अति सूक्ष्म कण मुख्यतः नीले प्रकाश का प्रकीर्णन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. यदि प्रकीर्णन करने वाले कणों का आकार पर्याप्त बड़ा हो, तो प्रकीर्णित प्रकाश सफ़ेद भी दिखाई दे सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तविक विलयन</span><span style=\"font-family:'Mangal'\"> से गुज़रने वाले प्रकाश का पथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">दिखाई नहीं देता</span><span style=\"font-family:'Mangal'\">; यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोलॉइडी विलयन</span><span style=
