rgin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. वस्तु की स्थिति चाहे जो हो (अनंत से प्रकाशिक केंद्र तक), </span><span style=\"font-weight:bold;font-family:'Mangal'\">अवतल लेंस</span><span style=\"font-family:'Mangal'\"> सदैव F₁ और O के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">आभासी, सीधा और छोटा</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब बनाता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. लेंस के </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाशिक केंद्र</span><span style=\"font-family:'Mangal'\"> से गुज़रने वाली किरण </span><span style=\"font-weight:bold;font-family:'Mangal'\">बिना किसी विचलन</span><span style=\"font-family:'Mangal'\"> के निकलती है; यह किरण आरेखों में प्रयुक्त मानक किरणों में से एक है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. लेंस का प्रत्येक भाग </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूरा प्रतिबिंब</span><span style=\"font-family:'Mangal'\"> बनाता है; आधा ढकने से केवल गुज़रने वाला प्रकाश घटता है, इसलिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">पूरा परंतु कम चमकीला</span><span style=\"font-family:'Mangal'\"> प्रतिबिंब बनता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक पर्वतीय स्थान पर कड़ाके की सर्दी में प्रयोगशाला में रखी शुद्ध एथेनॉइक अम्ल की बोतल जमी हुई मिलती है, जबकि उसके पास रखी सिरके की बोतल अब भी द्रव है। शुद्ध एथेनॉइक अम्ल इसलिए जम गया क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उसने वायु की नमी से अभिक्रिया करके ठोस लवण बना लिया</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉइक अम्ल प्रबल अम्ल है जो जल के वाष्पित होने पर क्रिस्टलित हो जाता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शुद्ध एथेनॉइक अम्ल का गलनांक 290 K है, इसलिए यह ठंडी जलवायु में जम जाता है, इसीलिए इसे ग्लेशियल ऐसीटिक अम्ल कहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिरका शुद्ध एथेनॉइक अम्ल से अधिक सांद्र है और इसलिए द्रव बना रहता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एथेनॉइक अम्ल (ऐसीटिक अम्ल, CH₃COOH) कार्बोक्सिलिक अम्लों में आता है; कार्बोक्सिलिक अम्ल </span><span style=\"font-weight:bold;font-family:'Mangal'\">दुर्बल अम्ल</span><span style=\"font-family:'Mangal'\"> हैं, प्रबल नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">शुद्ध एथेनॉइक अम्ल का गलनांक 290 K</span><span style=\"font-family:'Mangal'\"> (लगभग 17°C) है, इसलिए यह ठंडी जलवायु में प्रायः </span><span style=\"font-weight:bold;font-family:'Mangal'\">सर्दियों में जम जाता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी जमने के गुण के कारण शुद्ध एथेनॉइक अम्ल को </span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्लेशियल ऐसीटिक अम्ल</span><span style=\"font-family:'Mangal'\"> कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सिरका जल में ऐसीटिक अम्ल का केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">5–8% विलयन</span><span style=\"font-family:'Mangal'\"> है, इसलिए वह शुद्ध अम्ल के ताप पर नहीं जमता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः शुद्ध अम्ल इसलिए जमा क्योंकि उसका गलनांक 290 K है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. रक्त न तो वास्तविक विलयन है और न ही वास्तविक निलंबन; यह एक कोलॉइड है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. कोलॉइड के कणों का आकार 1 nm से 1000 nm के बीच होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निलंबन के विपरीत, कोलॉइड के कण समय के साथ नीचे नहीं बैठते, बल्कि एकसमान रूप से परिक्षिप्त रहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. रक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">न तो वास्तविक विलयन है और न ही वास्तविक निलंबन</span><span style=\"font-family:'Mangal'\">; यह एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोलॉइड</span><span style=\"font-family:'Mangal'\"> है (दूध, टमाटर सॉस और आइसक्रीम की तरह) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. विलयन, निलंबन और कोलॉइड मुख्यतः कण के आकार में भिन्न हैं: विलयन के कण 1 nm से छोटे, </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोलॉइड के कण 1 से 1000 nm के बीच</span><span style=\"font-family:'Mangal'\">, और निलंबन के कण 1000 nm से बड़े होते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. निलंबन के विपरीत, कोलॉइडी कण समय के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">नीचे नहीं बैठते</span><span style=\"font-family:'Mangal'\">; वे विलयन की तरह पूरे मिश्रण में </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकसमान रूप से परिक्षिप्त</span><span style=\"font-family:'Mangal'\"> रहते हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मेंढक और तितली सीधे छोटे वयस्क के रूप में अंडे से नहीं निकलते; बल्कि अंडे से लार्वा (टैडपोल या इल्ली) निकलता है, जो खाकर बढ़ता है और बाद में वयस्क में रूपांतरित होता है। इस मध्यवर्ती लार्वा अवस्था की सबसे उपयुक्त व्याख्या है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनेक अंडों में से प्रत्येक में पीतक (योक) केवल लार्वा बनाने भर का होता है, जो फिर वयस्क में रूपांतरित होने से पहले कार्बनिक पदार्थ खाकर पोषण संचित करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन जंतुओं के अंडों में पीतक बिल्कुल नहीं होता, इसलिए भ्रूण को अंडा देने के दिन से ही खाना पड़ता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लार्वा की आवश्यकता अंडे को परभक्षियों से बचाने के लिए होती है जब तक उसके भीतर वयस्क विकसित न हो जाए</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता लार्वा को वयस्क बनने तक दूध पिलाती है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मछलियाँ, उभयचर और कीट एक बार में </span><span style=\"font-weight:bold;font-family:'Mangal'\">कई सौ से कई हज़ार अंडे</span><span style=\"font-family:'Mangal'\"> देते हैं; प्रत्येक अंडे के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीतक (योक)</span><span style=\"font-family:'Mangal'\"> में विकासशील भ्रूण के लिए पोषक पदार्थ होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता का शरीर इतने अंडों के लिए बड़ी मात्रा में पीतक नहीं दे सकता, इसलिए प्रत्येक अंडे का पीतक </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल लार्वा बनाने भर</span><span style=\"font-family:'Mangal'\"> का होता है, जो अंडे से निकलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">लार्वा</span><span style=\"font-family:'Mangal'\"> कार्बनिक पदार्थ (जैसे सड़ा भोजन और खाद) खाकर पोषण प्राप्त करता है और बढ़ता है; यह एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">मध्यवर्ती भोजन अवस्था</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पर्याप्त पोषण संचित होने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">रूपांतरण</span><span style=\"font-family:'Mangal'\"> होता है और वयस्क शरीर बनता है, जैसे तितली और मेंढक में (दूध स्तनधारी पिलाते हैं, मेंढक या कीट नहीं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लार्वा अवस्था इसलिए होती है क्योंकि पीतक केवल लार्वा बनाने भर का होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्म लोहे पर भाप प्रवाहित की जाती है: Fe(s) + H₂O(g) → Fe₃O₄(s) + H₂(g). सबसे छोटे पूर्ण-संख्या गुणांकों से संतुलित करने पर Fe, H₂O और H₂ के गुणांक क्रमशः हैं:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 4, 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 2, 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1, 4, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3, 4, 4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतुलन करते समय </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूत्र नहीं बदले जा सकते</span><span style=\"font-family:'Mangal'\">; केवल उनके आगे गुणांक लगाए जाते हैं (4H₂O, कभी H₂O₄ नहीं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सबसे अधिक परमाणुओं वाले यौगिक Fe₃O₄ से शुरू कीजिए: </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन</span><span style=\"font-family:'Mangal'\"> संतुलित करने के लिए (बाईं ओर 1, दाईं ओर 4) </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H₂O</span><span style=\"font-family:'Mangal'\"> लिखिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब हाइड्रोजन बाईं ओर 8 (4H₂O) और दाईं ओर 2 (H₂) है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">4H₂</span><span style=\"font-family:'Mangal'\"> लिखिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंत में लोहा बाईं ओर 1 और दाईं ओर 3 है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">3Fe</span><span style=\"font-family:'Mangal'\"> लिखिए: 3Fe(s) + 4H₂O(g) → Fe₃O₄(s) + 4H₂(g).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: Fe 3 = 3, H 8 = 8, O 4 = 4, संतुलित; H₂O के साथ (g) दर्शाता है कि जल भाप के रूप में प्रयुक्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः गुणांक 3, 4, 4 हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आहार शृंखलाओं में कीटनाशियों के प्रवेश के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. मिट्टी या जल निकायों में बह गए कीटनाशी जल और खनिजों के साथ पौधों द्वारा अवशोषित कर लिए जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. चूँकि मनुष्य किसी भी आहार शृंखला के शीर्ष स्तर पर है, इन रसायनों की अधिकतम सांद्रता मानव शरीर में संचित होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जैविक आवर्धन के कारण खाद्यान्न, सब्ज़ियों, फलों और यहाँ तक कि माँस में भी कीटनाशियों के अवशेष होते हैं, जिन्हें धोने से सदैव नहीं हटाया जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. फसलों की रक्षा के लिए प्रयुक्त कीटनाशी और अन्य रसायन </span><span style=\"font-weight:bold;font-family:'Mangal'\">मिट्टी या जल निकायों में बह जाते</span><span style=\"font-family:'Mangal'\"> हैं, जहाँ से वे जल और खनिजों के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पौधों द्वारा अवशोषित</span><span style=\"font-family:'Mangal'\"> हो जाते हैं (और जलीय पौधों व जंतुओं द्वारा भी) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. ये रसायन प्रत्येक पोषक स्तर पर उत्तरोत्तर संचित होते हैं; चूँकि </span><span style=\"font-weight:bold;font-family:'Mangal'\">मनुष्य किसी भी आहार शृंखला के शीर्ष स्तर</span><span style=\"font-family:'Mangal'\"> पर है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकतम सांद्रता</span><span style=\"font-family:'Mangal'\"> हमारे शरीर में संचित होती है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. इसी </span><span style=\"font-weight:bold;font-family:'Mangal'\">जैविक आवर्धन</span><span style=\"font-family:'Mangal'\"> के कारण गेहूँ और चावल जैसे खाद्यान्न, सब्ज़ियों, फलों और यहाँ तक कि माँस में भी </span><span style=\"font-weight:bold;font-family:'Mangal'\">कीटनाशियों के अवशेष</span><span style=\"font-family:'Mangal'\"> होते हैं, जिन्हें धोने या अन्य उपायों से </span><span style=\"font-weight:bold;font-family:'Mangal'\">सदैव नहीं हटाया जा सकता</span><span style=\"font-family:'Mangal'\"> → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गोल बीज और बैंगनी फूल वाले मटर के पौधे का संकरण झुर्रीदार बीज और सफ़ेद फूल वाले पौधे से कराया जाता है। सभी संतति के बीज गोल हैं, परंतु उनमें से लगभग आधे के फूल बैंगनी और आधे के सफ़ेद हैं। गोल बीज, बैंगनी फूल वाले जनक का आनुवंशिक संघटन है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RrVV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RrVv</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">rrVv</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RRVv</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">झुर्रीदार, सफ़ेद जनक दोनों अप्रभावी लक्षण दर्शाता है, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">rrvv</span><span style=\"font-family:'Mangal'\"> है और केवल युग्मक </span><span style=\"font-weight:bold;font-family:'Mangal'\">rv</span><span style=\"font-family:'Mangal'\"> देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">सभी</span><span style=\"font-family:'Mangal'\"> संतति गोल बीज वाली है → प्रत्येक संतति को पहले जनक से </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\"> मिला, अतः वह जनक </span><span style=\"font-weight:bold;font-family:'Mangal'\">RR</span><span style=\"font-family:'Mangal'\"> होना चाहिए (यदि Rr होता, तो लगभग आधी संतति झुर्रीदार होती)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">आधी</span><span style=\"font-family:'Mangal'\"> संतति बैंगनी और आधी सफ़ेद है → पहला जनक आधों को V और आधों को v देता है, अतः वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">Vv</span><span style=\"font-family:'Mangal'\"> है (VV होने पर सारी संतति बैंगनी होती)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रभावी कारक की एक प्रति लक्षण दिखाने के लिए पर्याप्त है, जबकि अप्रभावी लक्षण के लिए दोनों प्रतियाँ अप्रभावी होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः जनक RRVv है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तंत्रिका तंत्र के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. प्रतिवर्ती चाप के संबंध मेरुरज्जु में उस बिंदु पर बनते हैं जहाँ निवेशी तंत्रिका और निर्गमी तंत्रिका पहली बार एक-दूसरे से मिलती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. खोपड़ी के भीतर मस्तिष्क द्रव से भरे एक गुब्बारे में रहता है, जो आघात-अवशोषण प्रदान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जंतुओं में जटिल न्यूरॉन जाल (मस्तिष्क) के अस्तित्व में आने के बाद प्रतिवर्ती चाप उपयोगी नहीं रहे।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. पूरे शरीर से आने वाली तंत्रिकाएँ मस्तिष्क की ओर जाते हुए </span><span style=\"font-weight:bold;font-family:'Mangal'\">मेरुरज्जु</span><span style=\"font-family:'Mangal'\"> में एक बंडल में मिलती हैं; प्रतिवर्ती चाप के संबंध वहीं बनते हैं जहाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">निवेशी और निर्गमी तंत्रिका पहली बार मिलती</span><span style=\"font-family:'Mangal'\"> हैं → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. मस्तिष्क हड्डी की खोपड़ी के भीतर होता है, और उसके अंदर मस्तिष्क </span><span style=\"font-weight:bold;font-family:'Mangal'\">द्रव से भरे गुब्बारे</span><span style=\"font-family:'Mangal'\"> में रहता है, जो अतिरिक्त </span><span style=\"font-weight:bold;font-family:'Mangal'\">आघात-अवशोषण</span><span style=\"font-family:'Mangal'\"> देता है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. जटिल न्यूरॉन जाल के अस्तित्व में आने के बाद भी प्रतिवर्ती चाप त्वरित अनुक्रियाओं (जैसे लौ से हाथ खींचना) के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिक दक्ष बने हुए</span><span style=\"font-family:'Mangal'\"> हैं → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 2 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जब हम साँस अंदर लेते हैं, तो पसली पिंजर फैलता है और छाती के भीतर स्थान बढ़ता है, जिससे वायु फेफड़ों में जाती है। पसली पिंजर की कौन-सी संरचनात्मक विशेषता इस फैलाव को संभव बनाती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसलियाँ सामने उरोस्थि (स्टर्नम) से लचीली उपास्थि द्वारा जुड़ी होती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसलियाँ उरोस्थि से अचल संधियों द्वारा जुड़ी (फ्यूज़) होती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसलियों के 12 युग्म केवल रीढ़ से जुड़े होते हैं और सामने स्वतंत्र रहते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसलियाँ हड्डी के बजाय उपास्थि की बनी होती हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मनुष्य में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पसलियों के 12 युग्म</span><span style=\"font-family:'Mangal'\"> होते हैं, जो मिलकर पसली पिंजर बनाते हैं और हृदय व फेफड़ों की रक्षा करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसलियाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">पीछे रीढ़</span><span style=\"font-family:'Mangal'\"> से और </span><span style=\"font-weight:bold;font-family:'Mangal'\">सामने उरोस्थि (स्टर्नम)</span><span style=\"font-family:'Mangal'\"> से जुड़ी होती हैं, और यह जुड़ाव </span><span style=\"font-weight:bold;font-family:'Mangal'\">लचीली उपास्थि</span><span style=\"font-family:'Mangal'\"> से होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पसली–उरोस्थि उपास्थि की यह लचक पसली पिंजर को </span><span style=\"font-weight:bold;font-family:'Mangal'\">साँस लेते समय फैलने और सिकुड़ने</span><span style=\"font-family:'Mangal'\"> देती है, जिससे छाती में स्थान बढ़ता-घटता है और वायु फेफड़ों में आती-जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि पसलियाँ अचल संधियों से जुड़ी होतीं, तो पसली पिंजर फैल नहीं पाता; पसलियाँ हड्डियाँ हैं, उपास्थि नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पसलियों को उरोस्थि से जोड़ने वाली लचीली उपास्थि इस फैलाव को संभव बनाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मनुष्य के नर में वृषण उदर गुहा के बाहर, वृषण कोष (स्क्रोटम) में स्थित होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): शुक्राणुओं के निर्माण के लिए सामान्य शरीर ताप से अधिक ताप की आवश्यकता होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जनन कोशिकाओं (शुक्राणुओं) का निर्माण </span><span style=\"font-weight:bold;font-family:'Mangal'\">वृषणों</span><span style=\"font-family:'Mangal'\"> में होता है, जो </span><span style=\"font-weight:bold;font-family:'Mangal'\">उदर गुहा के बाहर वृषण कोष</span><span style=\"font-family:'Mangal'\"> में स्थित होते हैं → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृषण बाहर इसलिए रखे जाते हैं क्योंकि शुक्राणु निर्माण के लिए सामान्य शरीर ताप से </span><span style=\"font-weight:bold;font-family:'Mangal'\">कम</span><span style=\"font-family:'Mangal'\"> ताप चाहिए, अधिक नहीं → R असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(वृषण टेस्टोस्टेरॉन हॉर्मोन भी स्रावित करते हैं, जो शुक्राणु निर्माण का नियमन करता है और यौवनारंभ पर लड़कों में दिखने वाले परिवर्तन लाता है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A सत्य है परंतु R असत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक ट्रैक्टर केवल हैरो को बल F से खींचता है तो उसे 6 m/s² का त्वरण मिलता है। वही ट्रैक्टर केवल ट्रॉली को उसी बल F से खींचता है तो उसे 3 m/s² का त्वरण मिलता है। यदि हैरो को ट्रॉली पर रखकर ट्रैक्टर उसी बल F से ट्रॉली को खींचे (घर्षण नगण्य), तो त्वरण होगा:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9 m/s²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 m/s²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4.5 m/s²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1.5 m/s²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूटन के दूसरे नियम से, हैरो का द्रव्यमान m₁ = F/a₁ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/6</span><span style=\"font-family:'Mangal'\"> और ट्रॉली का द्रव्यमान m₂ = F/a₂ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">हैरो को ट्रॉली पर रखने पर दोनों एक </span><span style=\"font-weight:bold;font-family:'Mangal'\">एकल निकाय</span><span style=\"font-family:'Mangal'\"> की तरह चलते हैं, जिसका द्रव्यमान m₁ + m₂ = F/6 + F/3 = F/6 + 2F/6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">F/2</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निकाय का त्वरण a = F/(m₁ + m₂) = F ÷ (F/2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 m/s²</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(त्वरणों को जोड़ने से गलत उत्तर 9 m/s² आता; संयुक्त द्रव्यमान बड़ा है, इसलिए त्वरण दोनों से कम है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्वरण 2 m/s² है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि तरंगों के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि तरंग का आयाम संपीडन (या विरलन) में वायु के घनत्व का औसत घनत्व की तुलना में अधिकतम परिवर्तन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. बिंदु स्रोत से दूर जाते हुए ध्वनि तरंग की तीव्रता बढ़ती है क्योंकि तरंग माध्यम से ऊर्जा प्राप्त करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. माइक्रोफ़ोन ध्वनि ऊर्जा को विद्युत ऊर्जा में बदलता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 2 और 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी 1, 2 और 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल 1 और 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1. ध्वनि घनत्व के दोलनों के रूप में संचरित होती है; </span><span style=\"font-weight:bold;font-family:'Mangal'\">आयाम</span><span style=\"font-family:'Mangal'\"> संपीडन (या विरलन) में औसत घनत्व की तुलना में </span><span style=\"font-weight:bold;font-family:'Mangal'\">घनत्व का अधिकतम परिवर्तन</span><span style=\"font-family:'Mangal'\"> है → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2. स्रोत से दूर जाने पर वही ऊर्जा </span><span style=\"font-weight:bold;font-family:'Mangal'\">बड़े क्षेत्रफल पर फैल</span><span style=\"font-family:'Mangal'\"> जाती है, इसलिए दूरी के साथ </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीव्रता घटती</span><span style=\"font-family:'Mangal'\"> है; तरंग माध्यम से ऊर्जा प्राप्त नहीं करती → गलत।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3. </span><span style=\"font-weight:bold;font-family:'Mangal'\">माइक्रोफ़ोन</span><span style=\"font-family:'Mangal'\"> में ध्वनि तरंगें पतली डायाफ्राम को कंपित करती हैं और ये कंपन </span><span style=\"font-weight:bold;font-family:'Mangal'\">विद्युत संकेत</span><span style=\"font-family:'Mangal'\"> में बदले जाते हैं, अर्थात् ध्वनि ऊर्जा से विद्युत ऊर्जा (स्पीकर इसका उल्टा करता है) → सही।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल 1 और 3 सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार लवणों की विलेयता (g प्रति 100 g जल) 10°C और 80°C पर मापी गई: पोटैशियम नाइट्रेट 21 और 167; सोडियम क्लोराइड 36 और 37; पोटैशियम क्लोराइड 35 और 54; अमोनियम क्लोराइड 24 और 66. यदि प्रत्येक लवण का 80°C पर बना संतृप्त विलयन 10°C तक ठंडा किया जाए, तो जिस लवण से क्रिस्टलों का सबसे कम द्रव्यमान अलग होगा, वह है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम नाइट्रेट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अमोनियम क्लोराइड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम क्लोराइड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संतृप्त विलयन को ठंडा करने पर अलग होने वाले ठोस का द्रव्यमान दोनों तापों पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">विलेयता के अंतर</span><span style=\"font-family:'Mangal'\"> (प्रति 100 g जल) के बराबर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पोटैशियम नाइट्रेट: 167 − 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">146 g</span><span style=\"font-family:'Mangal'\">; अमोनियम क्लोराइड: 66 − 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 g</span><span style=\"font-family:'Mangal'\">; पोटैशियम क्लोराइड: 54 − 35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">19 g</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम क्लोराइड: 37 − 36 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 g</span><span style=\"font-family:'Mangal'\">; इसकी विलेयता ताप के साथ लगभग नहीं बदलती, इसलिए ठंडा करने पर लगभग कोई क्रिस्टल अलग नहीं होता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रिस्टलों का सबसे कम द्रव्यमान सोडियम क्लोराइड से अलग होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): आँख में प्रवेश करने वाली प्रकाश किरणों का अधिकांश अपवर्तन कॉर्निया की बाहरी सतह पर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): नेत्र लेंस रेशेदार, जेली जैसे पदार्थ का बना होता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश नेत्रगोलक के सामने के पारदर्शी उभार कॉर्निया से आँख में प्रवेश करता है; प्रवेश करने वाले प्रकाश का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अधिकांश अपवर्तन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉर्निया की बाहरी सतह</span><span style=\"font-family:'Mangal'\"> पर होता है → A सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">नेत्र लेंस</span><span style=\"font-family:'Mangal'\"> वास्तव में </span><span style=\"font-weight:bold;font-family:'Mangal'\">रेशेदार, जेली जैसे पदार्थ</span><span style=\"font-family:'Mangal'\"> का बना है, जिसकी वक्रता पक्ष्माभी पेशियाँ बदल सकती हैं → R सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु लेंस का संघटन इसका कारण नहीं है कि कॉर्निया अधिकांश अपवर्तन करता है; क्रिस्टलीय लेंस तो केवल भिन्न दूरियों की वस्तुओं को रेटिना पर फोकस करने के लिए </span><span style=\"font-weight:bold;font-family:'Mangal'\">फोकस दूरी का सूक्ष्म समायोजन</span><span style=\"font-family:'Mangal'\"> करता है → R, A की व्याख्या नहीं करता।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक स्वस्थ वयस्क में वृक्क प्रतिदिन लगभग 180 लीटर प्रारंभिक निस्यंद (फ़िल्ट्रेट) बनाते हैं, फिर भी केवल लगभग 1–2 लीटर मूत्र ही उत्सर्जित होता है। इस बड़े अंतर का कारण है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश निस्यंद पसीने के रूप में त्वचा से वाष्पित हो जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूत्राशय शेष निस्यंद को कई दिनों तक संग्रहित रखता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिदिन केवल 1–2 लीटर रक्त ही वृक्कों से गुज़रता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकांश निस्यंद (ग्लूकोज़, अमीनो अम्ल और लवणों सहित जल) मूत्र के वृक्क नलिकाओं में बहने के दौरान चयनात्मक रूप से पुनः अवशोषित हो जाता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वृक्क की मूल निस्यंदन इकाई अत्यंत पतली भित्ति वाली रक्त केशिकाओं का गुच्छ है; स्वस्थ वयस्क में बनने वाला </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रारंभिक निस्यंद</span><span style=\"font-family:'Mangal'\"> लगभग </span><span style=\"font-weight:bold;font-family:'Mangal'\">180 लीटर प्रतिदिन</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निस्यंद के नलिका में बहने के दौरान उपयोगी पदार्थ (</span><span style=\"font-weight:bold;font-family:'Mangal'\">ग्लूकोज़, अमीनो अम्ल, लवण और जल की प्रमुख मात्रा</span><span style=\"font-family:'Mangal'\">) </span><span style=\"font-weight:bold;font-family:'Mangal'\">चयनात्मक रूप से पुनः अवशोषित</span><span style=\"font-family:'Mangal'\"> हो जाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुनः अवशोषित जल की मात्रा इस पर निर्भर करती है कि शरीर में कितना अतिरिक्त जल है और कितना घुला अपशिष्ट उत्सर्जित करना है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चूँकि अधिकांश निस्यंद पुनः अवशोषित हो जाता है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">वास्तव में उत्सर्जित मूत्र प्रतिदिन केवल एक-दो लीटर</span><span style=\"font-family:'Mangal'\"> होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः यह अंतर वृक्क नलिकाओं में चयनात्मक पुनः अवशोषण के कारण है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह सबसे छोटी संख्या ज्ञात कीजिए जिसे 5, 6, 3 और 4 से भाग देने पर शेषफल 2 बचता है, परंतु 7 से भाग देने पर कोई शेषफल नहीं बचता।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">168</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">147</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">198</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">182</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5, 6, 3 और 4 से भाग देने पर शेषफल 2 देने वाली संख्या (5, 6, 3, 4 का LCM) × k + 2 के रूप की होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5, 6, 3, 4 का LCM (लघुत्तम समापवर्त्य) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60</span><span style=\"font-family:'Mangal'\">, अतः संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">60k + 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 से विभाज्यता के लिए मानों की एक-एक करके जाँच करें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 1: 62 = 7 × 8 + 6 → विभाज्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 2: 122 = 7 × 17 + 3 → विभाज्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">k = 3: 182 = 7 × 26 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">विभाज्य</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसी सबसे छोटी संख्या </span><span style=\"font-weight:bold;font-family:'Mangal'\">182 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">श्री X ने ₹50,000 की राशि 40 महीनों के लिए उधार ली। यदि उसने ₹1,625 की मासिक किस्त के रूप में चुकाया, तो साधारण ब्याज की दर ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.8%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चुकाई गई कुल राशि = 1,625 × 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹65,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया गया साधारण ब्याज = 65,000 − 50,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹15,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = 40 महीने = 40 ÷ 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10/3 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SI = (P × R × T) / 100 → 15,000 = [50,000 × R × (10/3)] / 100</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15,000 = (500 × R × 10) ÷ 3 → 15,000 = 5,000R ÷ 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R = (15,000 × 3) ÷ 5,000 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: R = (SI × 100) ÷ (P × T) = (15,000 × 100) ÷ [50,000 × (10/3)] = 9%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः साधारण ब्याज की दर </span><span style=\"font-weight:bold;font-family:'Mangal'\">9% (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक त्रिभुज की तीन भुजाओं की लंबाइयाँ 7 cm, 15 cm और 20 cm हैं। इस त्रिभुज के अंतःवृत्त का क्षेत्रफल (cm² में) ज्ञात कीजिए। (π = 3.14 लें)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6.28</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25.12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3.14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12.56</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अर्ध-परिमाप s = (7 + 15 + 20) ÷ 2 = 42 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">21 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज का क्षेत्रफल (हीरोन का सूत्र) = √[s(s − a)(s − b)(s − c)] = √[21 × 14 × 6 × 1] = √1,764 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">42 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतःवृत्त की त्रिज्या r = क्षेत्रफल ÷ s = 42 ÷ 21 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 cm</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतःवृत्त का क्षेत्रफल = πr² = 3.14 × 2² = 3.14 × 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12.56 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: अंतःत्रिज्या r = Δ ÷ s, फिर अंतःवृत्त का क्षेत्रफल = πr²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अंतःवृत्त का क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">12.56 cm² (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो नगरों P और Q के बीच की दूरी 300 km है। एक कार P से Q की ओर सुबह 7:00 बजे 45 km/h की चाल से चलती है। दूसरी कार Q से P की ओर सुबह 9:00 बजे 55 km/h की चाल से चलती है। दोनों कारें किस समय मिलेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 11:00 बजे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 11:10 बजे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 11:06 बजे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 11:30 बजे</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 7:00 से 9:00 बजे तक (2 घंटे) केवल पहली कार चलती है: तय दूरी = 45 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">90 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 9:00 बजे कारों के बीच शेष दूरी = 300 − 90 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुबह 9:00 बजे से दोनों एक-दूसरे की ओर चलती हैं: सापेक्ष चाल = 45 + 55 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 km/h</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने का समय = 210 ÷ 100 = 2.1 घंटे = 2 घंटे + 0.1 × 60 मिनट = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 घंटे 6 मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मिलने का समय = सुबह 9:00 + 2 घंटे 6 मिनट = </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुबह 11:06 बजे</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कारें </span><span style=\"font-weight:bold;font-family:'Mangal'\">सुबह 11:06 बजे (विकल्प C)</span><span style=\"font-family:'Mangal'\"> मिलेंगी।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक परीक्षा में, अधिकतम अंकों का 32% प्राप्त करने वाला एक विद्यार्थी 42 अंकों से अनुत्तीर्ण हो गया, जबकि अधिकतम अंकों का 52% प्राप्त करने वाला दूसरा विद्यार्थी 38 अंकों से उत्तीर्ण हो गया। परीक्षा के अधिकतम अंक ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">450</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अधिकतम अंक M लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तीर्णांक = M का 32% + 42 (पहला विद्यार्थी 42 अंक कम रहा)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तीर्णांक = M का 52% − 38 (दूसरे विद्यार्थी के पास 38 अंक अधिक थे)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M का 32% + 42 = M का 52% − 38</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M का 52% − M का 32% = 42 + 38 → M का 20% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">80</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M = (80 × 100) ÷ 20 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: उत्तीर्णांक = 400 का 32% + 42 = 128 + 42 = 170 = 400 का 52% − 38 = 208 − 38 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: अधिकतम अंक = (अंकों का अंतर) ÷ (प्रतिशतों का अंतर) × 100 = 80 ÷ 20 × 100 = 400</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अधिकतम अंक </span><span style=\"font-weight:bold;font-family:'Mangal'\">400 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> हैं।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कारखाने में दो मशीनें X और Y हैं। मशीन X 5 घंटे में 200 इकाइयाँ बना सकती है, और मशीन Y 6 घंटे में 180 इकाइयाँ बना सकती है। यदि दोनों मशीनें 3 घंटे साथ काम करें और फिर केवल मशीन X 2 घंटे और काम करे, तो कुल कितनी इकाइयाँ बनेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">350 इकाइयाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">310 इकाइयाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">290 इकाइयाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">280 इकाइयाँ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": t-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5 : 6</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लड़कों की संख्या b और लड़कियों की संख्या g लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल भार: 40b + 32.3g = 36.5(b + g)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">40b − 36.5b = 36.5g − 32.3g → </span><span style=\"font-weight:bold;font-family:'Mangal'\">3.5b = 4.2g</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">b/g = 4.2 ÷ 3.5 = 42/35 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6/5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 6 लड़कों और 5 लड़कियों के साथ, कुल = 240 + 161.5 = 401.5 kg → औसत = 401.5 ÷ 11 = 36.5 kg ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut (मिश्रण विधि): लड़के : लड़कियाँ = (36.5 − 32.3) : (40 − 36.5) = 4.2 : 3.5 = 6 : 5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लड़कों और लड़कियों का अनुपात </span><span style=\"font-weight:bold;font-family:'Mangal'\">6 : 5 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक समकोण त्रिभुज का कर्ण 34 cm है और अन्य दो भुजाओं का अंतर 14 cm है। त्रिभुज का क्षेत्रफल क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">220 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">260 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">480 cm²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंब भुजाएँ a और b (a &gt; b) लें। तब a − b = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14</span><span style=\"font-family:'Mangal'\"> और पाइथागोरस प्रमेय से a² + b² = 34² = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,156</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a − b)² = a² + b² − 2ab → 14² = 1,156 − 2ab</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">196 = 1,156 − 2ab → 2ab = 1,156 − 196 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">960</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ab = </span><span style=\"font-weight:bold;font-family:'Mangal'\">480</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षेत्रफल = ½ × a × b = ½ × 480 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">240 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: a = 30, b = 16 → 30 − 16 = 14 और 30² + 16² = 900 + 256 = 1,156 = 34² ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: क्षेत्रफल = (कर्ण² − अंतर²) ÷ 4 = (1,
