t-family:'Mangal'\">माध्य = Σfx ÷ Σf → 36 = (1,110 + 35x) ÷ (30 + x)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36(30 + x) = 1,110 + 35x → 1,080 + 36x = 1,110 + 35x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">36x − 35x = 1,110 − 1,080 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 30</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: Σf = 60, Σfx = 1,110 + 1,050 = 2,160 → 2,160 ÷ 60 = 36 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः x = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि 2sin²θ + 5cos²θ = 4.25 और θ एक न्यून कोण है, तो cot θ का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">√3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1/√3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5cos²θ को 2cos²θ + 3cos²θ लिखें ताकि sin²θ + cos²θ = 1 का प्रयोग किया जा सके।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2sin²θ + 2cos²θ + 3cos²θ = 4.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2(sin²θ + cos²θ) + 3cos²θ = 4.25 → 2 + 3cos²θ = 4.25</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3cos²θ = 2.25 → cos²θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.75 = 3/4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cos θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3/2</span><span style=\"font-family:'Mangal'\"> (θ न्यून कोण है, अतः cos θ धनात्मक) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">θ = 30°</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">cot θ = cot 30° = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः cot θ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">√3 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज PQR में बिंदु S भुजा QR पर इस प्रकार स्थित है कि QS : SR = 2 : 5 है। यदि त्रिभुज PQS का क्षेत्रफल 60 cm² है, तो त्रिभुज PQR का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">210 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">180 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">200 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">240 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रिभुज PQS और PQR का शीर्ष P समान है और उनके आधार QS और QR एक ही रेखा QR पर हैं, अतः उनकी ऊँचाई समान है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊँचाई समान होने पर क्षेत्रफल आधार के समानुपाती होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QS : QR = QS : (QS + SR) = 2 : (2 + 5) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 : 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षेत्रफल(PQS) : क्षेत्रफल(PQR) = 2 : 7</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्षेत्रफल(PQR) = (60 × 7) ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 cm²</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः त्रिभुज PQR का क्षेत्रफल </span><span style=\"font-weight:bold;font-family:'Mangal'\">210 cm² (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक दुकानदार चीनी को 10% लाभ पर बेचने का दावा करता है, परंतु वह ऐसा बाट प्रयोग करता है जो अंकित भार से 12% कम है। उसका वास्तविक लाभ प्रतिशत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">25%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">27.5%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चीनी का क्रय मूल्य ₹100 प्रति kg लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक \"1 kg\" बेचने पर वह 10% लाभ लेता है: विक्रय मूल्य = ₹100 × 110% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹110</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु वह वास्तव में केवल 1 kg × 88% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.88 kg</span><span style=\"font-family:'Mangal'\"> देता है, जिसकी लागत = ₹100 × 0.88 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹88</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वास्तविक लाभ = 110 − 88 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹22</span><span style=\"font-family:'Mangal'\">, ₹88 की लागत पर</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लाभ % = 22 ÷ 88 × 100% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: वास्तविक लाभ % = [(100 + दावा किया गया लाभ %) ÷ (100 − भार में कमी %) − 1] × 100% = (110 ÷ 88 − 1) × 100% = 25%</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उसका वास्तविक लाभ </span><span style=\"font-weight:bold;font-family:'Mangal'\">25% (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि a + b + c = 5, abc = −24 और a³ + b³ + c³ = 83 है, तो ab + bc + ca का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">−2</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सर्वसमिका: a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ab + bc + ca = p लें। तब a² + b² + c² = (a + b + c)² − 2p = 25 − </span><span style=\"font-weight:bold;font-family:'Mangal'\">2p</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बायाँ पक्ष: 83 − 3 × (−24) = 83 + 72 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">155</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दायाँ पक्ष: 5 × (25 − 2p − p) = 5 × (25 − 3p)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">155 = 5(25 − 3p) → 31 = 25 − 3p → 3p = −6 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">p = −2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: a = 4, b = 3, c = −2 से योग 5, abc = −24, घन 64 + 27 − 8 = 83 और ab + bc + ca = 12 − 6 − 8 = −2 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ab + bc + ca = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रमेश की आयु अपने पुत्र की आयु की चार गुनी है, और उसकी पुत्री अपने भाई से 2 वर्ष छोटी है। यदि 4 वर्ष पहले तीनों की आयु का योग 64 वर्ष था, तो रमेश की वर्तमान आयु क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">48 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">52 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">60 वर्ष</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की वर्तमान आयु x वर्ष लें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रमेश की वर्तमान आयु = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4x</span><span style=\"font-family:'Mangal'\">; पुत्री की वर्तमान आयु = </span><span style=\"font-weight:bold;font-family:'Mangal'\">x − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्तमान आयु का योग = 4x + x + (x − 2) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6x − 2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4 वर्ष पहले तीनों में से प्रत्येक 4 वर्ष छोटा था, अतः योग था (6x − 2) − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6x − 14</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6x − 14 = 64 → 6x = 78 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">x = 13</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रमेश की वर्तमान आयु = 4 × 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 वर्ष</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 4 वर्ष पहले आयु 48, 9 और 7 थीं → 48 + 9 + 7 = 64 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रमेश की वर्तमान आयु </span><span style=\"font-weight:bold;font-family:'Mangal'\">52 वर्ष (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">54 km/h की चाल से चल रही 180 m लंबी एक रेलगाड़ी विपरीत दिशा में चल रही 270 m लंबी दूसरी रेलगाड़ी को 10 सेकंड में पार करती है। दूसरी रेलगाड़ी 390 m लंबे प्लेटफ़ॉर्म को पार करने में कितना समय लेगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22 सेकंड</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20 सेकंड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">24 सेकंड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">18 सेकंड</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रेलगाड़ियों के एक-दूसरे को पार करने में तय दूरी = 180 + 270 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">450 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सापेक्ष चाल (विपरीत दिशाएँ) = 450 ÷ 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">45 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली रेलगाड़ी की चाल = 54 km/h = (54 × 5) ÷ 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी रेलगाड़ी की चाल = 45 − 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">30 m/s</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्लेटफ़ॉर्म पार करने के लिए दूसरी रेलगाड़ी 270 + 390 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">660 m</span><span style=\"font-family:'Mangal'\"> तय करती है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समय = 660 ÷ 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 सेकंड</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दूसरी रेलगाड़ी </span><span style=\"font-weight:bold;font-family:'Mangal'\">22 सेकंड (विकल्प A)</span><span style=\"font-family:'Mangal'\"> लेती है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A एक काम को 10 दिनों में और B उसे 15 दिनों में पूरा कर सकता है। वे 2 दिन साथ काम करते हैं, जिसके बाद A चला जाता है और B शेष काम अकेले पूरा करता है। पूरा काम कितने दिनों में पूरा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">11 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 दिन</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A का 1 दिन का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/10</span><span style=\"font-family:'Mangal'\">; B का 1 दिन का काम = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों का 1 दिन का काम = 1/10 + 1/15 = (3 + 2) ÷ 30 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 दिनों में साथ किया गया काम = (2 × 1) ÷ 6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1/3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष काम = 1 − 1/3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 ÷ 3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B अकेला 2 ÷ 3 काम (2 ÷ 3) ÷ (1/15) = 2 ÷ 3 × 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 दिनों</span><span style=\"font-family:'Mangal'\"> में पूरा करता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुल समय = 2 + 10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 दिन</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पूरा काम </span><span style=\"font-weight:bold;font-family:'Mangal'\">12 दिनों (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में पूरा होता है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल ने ₹40,000 से एक व्यापार शुरू किया। 4 महीने बाद सुनील कुछ पूँजी के साथ उसके साथ जुड़ गया। वर्ष के अंत में लाभ अनिल और सुनील के बीच 5 : 4 के अनुपात में बाँटा गया। सुनील की पूँजी कितनी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹45,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹48,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹52,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">साझेदारी में लाभ (पूँजी × समय) के अनुपात में बाँटा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अनिल: ₹40,000, 12 महीनों के लिए → 40,000 × 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4,80,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुनील: ₹x, 12 − 4 = 8 महीनों के लिए → </span><span style=\"font-weight:bold;font-family:'Mangal'\">8x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,80,000 : 8x = 5 : 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4,80,000 × 4 = 5 × 8x → 19,20,000 = 40x</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">x = 19,20,000 ÷ 40 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जाँच: 4,80,000 : 3,84,000 = 5 : 4 ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सुनील की पूँजी </span><span style=\"font-weight:bold;font-family:'Mangal'\">₹48,000 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> थी।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मीना एक बैंक में ₹20,000 जमा करती है जो 8% वार्षिक दर से त्रैमासिक चक्रवृद्धि ब्याज देता है। 6 महीने बाद उसके खाते में कितनी राशि होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,808</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹21,632</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">₹20,816</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">त्रैमासिक चक्रवृद्धि → प्रति तिमाही दर = 8% ÷ 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2%</span><span style=\"font-family:'Mangal'\">, और 6 महीने = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2 तिमाही</span><span style=\"font-family:'Mangal'\">।</ R: K + 8 = S, U − 3 = R → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+8, −3</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QV − YT: Q + 8 = Y, V − 2 = T → (+8, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HR − PP: H + 8 = P, R − 2 = P → (+8, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन युग्म (+8, −2) का पालन करते हैं; केवल KU − SR नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">KU - SR (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नगर B, नगर X के पश्चिम में है। नगर C, नगर X के पूर्व में है। नगर D, नगर C के दक्षिण में है। नगर C, नगर A के पश्चिम में है। नगर A के सापेक्ष नगर X की स्थिति क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पश्चिम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नगरों को एक पूर्व–पश्चिम रेखा पर रखें (बाईं ओर पश्चिम, दाईं ओर पूर्व)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नगर C, नगर X के पूर्व में है → क्रम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">X … C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नगर C, नगर A के पश्चिम में है → क्रम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">X … C … A</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नगर B, X के पश्चिम में और नगर D, C के दक्षिण में है; ये X–A रेखा को नहीं बदलते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः X, A के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम</span><span style=\"font-family:'Mangal'\"> में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः नगर X, नगर A के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पश्चिम (विकल्प D)</span><span style=\"font-family:'Mangal'\"> में है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B का अर्थ है कि ‘A, B की बहन है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B का अर्थ है कि ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B का अर्थ है कि ‘A, B की पत्नी है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B का अर्थ है कि ‘A, B का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि ‘P + Q – R × S – T’ है, तो P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पुत्री</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री की पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्र की पत्नी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिया है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A + B → A, B की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A – B → A, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A × B → A, B की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A ÷ B → A, B का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब व्यंजक: P + Q – R × S – T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P, Q की बहन है। P और Q भाई-बहन हैं, अतः उनके माता-पिता समान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q – R → Q, R का पुत्र है। इसलिए P, R की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R × S → R, S की पत्नी है। R और S पति-पत्नी हैं, इसलिए P, S की भी पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S – T → S, T का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, S की पुत्री है और S, T का पुत्र है → P, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T के पुत्र की पुत्री (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: सभी सेब आम हैं। सभी आम गेंदें हैं। कोई गेंद बिल्ली नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(I): कोई सेब बिल्ली नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(II): कुछ गेंदें सेब हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">आरेख बनाएँ: सेब का वृत्त आम के अंदर, आम का वृत्त गेंद के अंदर, और बिल्ली का वृत्त गेंद से पूरी तरह बाहर है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I): कोई सेब बिल्ली नहीं है → प्रत्येक सेब गेंद के अंदर है और कोई गेंद बिल्ली नहीं है, अतः कोई सेब बिल्ली नहीं हो सकता → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (II): कुछ गेंदें सेब हैं → सभी सेब (आम के माध्यम से) गेंदें हैं, अतः जो सेब हैं वे ऐसी गेंदें हैं जो सेब हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WZC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKM</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DGJ: D + 3 = G, G + 3 = J → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MPS: M + 3 = P, P + 3 = S → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WZC: W + 3 = Z, Z + 3 = C (26 + 3 = 29 → 3 = C) → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKM: H + 3 = K, K + 2 = M → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+3, +3) का पालन करते हैं; केवल HKM नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">HKM (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर ROAD, UNDC से एक निश्चित प्रकार से संबंधित है। उसी प्रकार FARM, IZUL से संबंधित है। उसी तर्क के अनुसार LAMP निम्नलिखित में से किस विकल्प से संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OZPO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OYPO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OZQO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">NZPO</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD → UNDC: R + 3 = U, O − 1 = N, A + 3 = D, D − 1 = C</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FARM → IZUL: F + 3 = I, A − 1 = Z (1 − 1 = 0 → 26 = Z), R + 3 = U, M − 1 = L → नियम: (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, −1, +3, −1</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LAMP → L + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span><span style=\"font-family:'Mangal'\">, A − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span><span style=\"font-family:'Mangal'\">, M + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, P − 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">O</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">OYPO, OZQO और NZPO में OZPO से एक-एक अक्षर भिन्न है, अतः वे नियम का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः LAMP, </span><span style=\"font-weight:bold;font-family:'Mangal'\">OZPO (विकल्प A)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक कूट भाषा में 'MILK' को PKOM और 'ROAD' को UQDF लिखा जाता है। उसी भाषा में 'TEXT' को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGZV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGAV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">VGAV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WFAV</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MILK → PKOM: M + 3 = P, I + 2 = K, L + 3 = O, K + 2 = M</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ROAD → UQDF: R + 3 = U, O + 2 = Q, A + 3 = D, D + 2 = F → नियम: (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+3, +2, +3, +2</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">TEXT → T + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">W</span><span style=\"font-family:'Mangal'\">, E + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, X + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> (24 + 3 = 27 → 1 = A), T + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">V</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">WGZV, VGAV और WFAV में WGAV से एक-एक अक्षर भिन्न है, अतः वे नियम का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘TEXT’ को </span><span style=\"font-weight:bold;font-family:'Mangal'\">WGAV (विकल्प B)</span><span style=\"font-family:'Mangal'\"> लिखा जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित अक्षर, संख्या और प्रतीक शृंखला को देखिए और प्रश्न का उत्तर दीजिए। सभी संख्याएँ एक-अंकीय हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) K 4 @ M 7 B $ 2 P &amp; 9 W # E 3 Z % 6 R + 1 Q (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शृंखला से सभी प्रतीक हटा दिए जाएँ, तो निम्नलिखित में से कौन-सा दाएँ से सातवाँ होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">W</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Z</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतीक (@, $, &amp;, #, %, +) हटाएँ; शेष शृंखला है:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K 4 M 7 B 2 P 9 W E 3 Z 6 R 1 Q (</span><span style=\"font-weight:bold;font-family:'Mangal'\">16</span><span style=\"font-family:'Mangal'\"> पद)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ से सातवाँ = (16 − 7 + 1) = बाएँ से 10वाँ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से गिनें: K(1) 4(2) M(3) 7(4) B(5) 2(6) P(7) 9(8) W(9) </span><span style=\"font-weight:bold;font-family:'Mangal'\">E(10)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ से सातवाँ पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">E (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शब्द PLANET के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाए, तो कितने अक्षरों की स्थिति अपरिवर्तित रहेगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूल शब्द: P L A N E T (स्थान 1 से 6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला क्रम: </span><span style=\"font-weight:bold;font-family:'Mangal'\">A E L N P T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थान-दर-स्थान तुलना: P/A ✗, L/E ✗, A/L ✗, </span><span style=\"font-weight:bold;font-family:'Mangal'\">N/N ✓</span><span style=\"font-family:'Mangal'\">, E/P ✗, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T/T ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जिन अक्षरों की स्थिति अपरिवर्तित है: N (चौथा) और T (छठा) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो (विकल्प B)</span><span style=\"font-family:'Mangal'\"> अक्षरों की स्थिति अपरिवर्तित रहेगी।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं। वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LNJ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रत्येक समूह के क्रमागत अक्षरों की तुलना करें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RTP: R + 2 = T, T − 4 = P → (+2, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GIE: G + 2 = I, I − 4 = E → (+2, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">XZW: X + 2 = Z, Z − 3 = W → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+2, −3</span><span style=\"font-family:'Mangal'\">)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">LNJ: L + 2 = N, N − 4 = J → (+2, −4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन समूह (+2, −4) का पालन करते हैं; केवल XZW नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">XZW (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68 एक निश्चित तर्क से 8 से संबंधित है। उसी तर्क से 125, 11 से संबंधित है। उसी तर्क के अनुसार 229 निम्नलिखित में से किससे संबंधित है? (नोट: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना। उदाहरण: 13 पर जोड़ना/घटाना/गुणा करना मान्य है, परंतु 13 को 1 और 3 में तोड़कर संक्रिया करना मान्य नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">13</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68 → 8: 8 × 8 + 4 = 64 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">68</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">125 → 11: 11 × 11 + 4 = 121 + 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">125</span><span style=\"font-family:'Mangal'\"> → नियम: पहली संख्या = (दूसरी संख्या)² + 4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">229 → 229 − 4 = 225 = 15 × 15 → दूसरी संख्या = </span><span style=\"font-weight:bold;font-family:'Mangal'\">15</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प जाँचें: 14² + 4 = 200, 16² + 4 = 260, 13² + 4 = 173; इनमें कोई भी 229 नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः 229, </span><span style=\"font-weight:bold;font-family:'Mangal'\">15 (विकल्प C)</span><span style=\"font-family:'Mangal'\"> से संबंधित है।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि + का अर्थ −, − का अर्थ ×, × का अर्थ ÷ और ÷ का अर्थ + है, तो निम्नलिखित समीकरण में प्रश्नचिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">72 − 2 ÷ 15 + 96 × 8 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">147</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">151</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">141</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">159</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए अनुसार चिह्न बदलें: 72 × 2 + 15 − 96 ÷ 8</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BODMAS लागू करें (पहले ÷ और ×): 72 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">144</span><span style=\"font-family:'Mangal'\">; 96 ÷ 8 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अब 144 + 15 − 12 = 159 − 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">147</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">147 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T और U में से प्रत्येक ने अलग-अलग अंक प्राप्त किए हैं। S और Q के बीच केवल दो व्यक्तियों ने अंक प्राप्त किए हैं। केवल एक व्यक्ति ने R से अधिक अंक प्राप्त किए हैं। R और S के बीच केवल तीन व्यक्तियों ने अंक प्राप्त किए हैं। T ने U से अधिक परंतु P से कम अंक प्राप्त किए हैं। कितने व्यक्तियों ने T से अधिक अंक प्राप्त किए हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह व्यक्तियों को सबसे अधिक अंक (पहला) से सबसे कम अंक (छठा) तक क्रम दें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R से अधिक अंक केवल एक व्यक्ति के हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = दूसरा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R और S के बीच तीन व्यक्ति → S = छठा (दूसरा − 4 संभव नहीं) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">S = छठा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S और Q के बीच दो व्यक्ति → Q = तीसरा (छठा + 4 संभव नहीं) → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = तीसरा</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष स्थान पहला, चौथा और पाँचवाँ P, T, U के हैं, जहाँ P &gt; T &gt; U → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = पहला, T = चौथा, U = पाँचवाँ</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम क्रम: P &gt; R &gt; Q &gt; T &gt; U &gt; S.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T से अधिक अंक वाले: P, R, Q → </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">तीन (विकल्प B)</span><span style=\"font-family:'Mangal'\"> व्यक्तियों ने T से अधिक अंक प्राप्त किए हैं।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नचिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">FVM ITK LRI OPG ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SNE</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RNF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">SNT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RNE</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समूहों के प्रत्येक स्थान को अलग-अलग देखें।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहले अक्षर: F → I → L → O: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">+3</span><span style=\"font-family:'Mangal'\"> → अगला O + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरे अक्षर: V → T → R → P: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → अगला P − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरे अक्षर: M → K → I → G: प्रत्येक </span><span style=\"font-weight:bold;font-family:'Mangal'\">−2</span><span style=\"font-family:'Mangal'\"> → अगला G − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त समूह </span><span style=\"font-weight:bold;font-family:'Mangal'\">RNE (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P, Q, R, S, T, U और V एक ही इमारत की सात अलग-अलग मंज़िलों पर रहते हैं। इमारत की सबसे निचली मंज़िल की संख्या 1 है, उसके ऊपर वाली की 2, और इसी प्रकार सबसे ऊपरी मंज़िल की संख्या 7 है। R के ऊपर केवल तीन व्यक्ति रहते हैं। R और T के बीच केवल एक व्यक्ति रहता है। Q, T के ठीक नीचे रहता है। S, V के ठीक ऊपर रहता है। P, R के ठीक ऊपर रहता है। U किस मंज़िल संख्या पर रहता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंज़िल संख्या 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंज़िल संख्या 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंज़िल संख्या 6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मंज़िल संख्या 3</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R के ऊपर तीन व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">R = 4</span><span style=\"font-family:'Mangal'\">; P, R के ठीक ऊपर → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R और T के बीच एक व्यक्ति → T = 2 या T = 6; Q, T के ठीक नीचे → (T, Q) = (2, 1) या (6, 5)। मंज़िल 5 पर P है, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">T = 2, Q = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">खाली मंज़िलें: 3, 6, 7. S, V के ठीक ऊपर → सटी हुई खाली मंज़िलें केवल 6 और 7 हैं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">V = 6, S = 7</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष मंज़िल U की है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">U = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (ऊपर → नीचे): 7 S, 6 V, 5 P, 4 R, 3 U, 2 T, 1 Q.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः U </span><span style=\"font-weight:bold;font-family:'Mangal'\">मंज़िल संख्या 3 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> पर रहता है।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J, U की माता है। U, N की बहन है। D, R का पिता है। R, N का पुत्र है। J का D से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की बहन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पत्नी की माता</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D, R का पिता है और R, N का पुत्र है → D और N, R के दो माता-पिता हैं, अर्थात् D और N पति-पत्नी हैं; D पिता है, अतः N माता है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">N, D की पत्नी है</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U, N की बहन है → U और N के माता-पिता एक ही हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J, U की माता है → J, N की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः J, N की माता है और N, D की पत्नी है → J, D की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्नी की माता</span><span style=\"font-family:'Mangal'\"> है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अन्य विकल्प गलत हैं: J, N की माता है, D की नहीं; J, N की बहन नहीं है (पत्नी की बहन); और D की पत्नी N है, J नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः J, D की </span><span style=\"font-weight:bold;font-family:'Mangal'\">पत्नी की माता (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात विद्यार्थी I, J, K, P, Q, R और Z एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं। Z, K के ठीक बाईं ओर बैठा है। P के बाईं ओर कोई नहीं बैठा है। P और I के बीच केवल चार व्यक्ति बैठे हैं। J के दाईं ओर केवल तीन व्यक्ति बैठे हैं। Q, J का निकटतम पड़ोसी नहीं है। पंक्ति के सबसे दाएँ छोर पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">I</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Z</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सीटों को बाएँ से दाएँ 1 से 7 तक क्रमांक दें (सभी उत्तर की ओर मुख किए हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P के बाईं ओर कोई नहीं → </span><span style=\"font-weight:bold;font-family:'Mangal'\">P = 1</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P और I के बीच चार व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">I = 6</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">J के दाईं ओर तीन व्यक्ति → </span><span style=\"font-weight:bold;font-family:'Mangal'\">J = 4</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Z, K के ठीक बाईं ओर है → Z और K को दो सटी हुई खाली सीटें चाहिए; खाली सीटें 2, 3, 5, 7 हैं, अतः </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z = 2, K = 3</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q और R सीट 5 और 7 पर हैं; Q, J (सीट 4) का पड़ोसी नहीं है → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q = 7, R = 5</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम व्यवस्था (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">P – Z – K – J – R – I – Q</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सबसे दाएँ छोर पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q (विकल्प C)</span><span style=\"font-family:'Mangal'\"> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रोहित अपने कार्यालय से चलकर 3 m उत्तर की ओर गया। फिर वह दाएँ मुड़कर 7 m चला और फिर दाएँ मुड़कर 9 m चला। अंत में वह दाएँ मुड़कर 15 m चला और बैंक पहुँचा। बैंक और उसके कार्यालय के बीच न्यूनतम दूरी क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">12 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">14 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्यालय को मूल बिंदु लें; पूर्व = +x, उत्तर = +y.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3 m उत्तर → (0, 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ मुड़ना → पूर्व, 7 m → (7, 3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ मुड़ना → दक्षिण, 9 m → (7, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ मुड़ना → पश्चिम, 15 m → बैंक = (−8, −6)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बैंक, कार्यालय से 8 m पश्चिम और 6 m दक्षिण में है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न्यूनतम दूरी = √(8² + 6²) = √(64 + 36) = √100 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 m</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः न्यूनतम दूरी </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 m (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में 'heavy metal music' को 'mx zb kg', 'heavy storm warning' को 'kw vg mx' और 'crazy metal storm' को 'zb rq vg' लिखा जाता है (सभी कूट दो-अक्षर के हैं)। 'warning music' का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">kg rq</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">mx rq</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">kw kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">zb vg</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">‘heavy’ वाक्य 1 और 2 में उभयनिष्ठ है; उभयनिष्ठ कूट केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">mx</span><span style=\"font-family:'Mangal'\"> है → heavy = mx</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">‘metal’ वाक्य 1 और 3 में उभयनिष्ठ है; उभयनिष्ठ कूट केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">zb</span><span style=\"font-family:'Mangal'\"> है → metal = zb</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">‘storm’ वाक्य 2 और 3 में उभयनिष्ठ है; उभयनिष्ठ कूट केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">vg</span><span style=\"font-family:'Mangal'\"> है → storm = vg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1: शेष शब्द ‘music’ = शेष कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 2: शेष शब्द ‘warning’ = शेष कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">kw</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘warning music’ = </span><span style=\"font-weight:bold;font-family:'Mangal'\">kw kg</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘warning music’ का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">kw kg (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है।</s gin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः लुप्त पद </span><span style=\"font-weight:bold;font-family:'Mangal'\">146 (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वह युग्म चुनिए जो नीचे दिए गए दो युग्मों के समान पैटर्न का पालन करता है। दोनों युग्म एक ही पैटर्न का पालन करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BEK : ORX</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GLT : TYG</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHM : QUY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHM : QUZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHM : PUZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHM : QVZ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BEK → ORX: B + 13 = O, E + 13 = R, K + 13 = X</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GLT → TYG: G + 13 = T, L + 13 = Y, T + 13 = G</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(T वर्णमाला का 20वाँ अक्षर है; 20 + 13 = 33, और 33 − 26 = 7 = G, अर्थात् गिनती वर्णमाला में घूमकर आगे बढ़ती है।)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पैटर्न: </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रत्येक अक्षर 13 स्थान आगे बढ़ता है</span><span style=\"font-family:'Mangal'\">, और Z के बाद फिर A से गिनती चलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">DHM → D + 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\">, H + 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">U</span><span style=\"font-family:'Mangal'\">, M + 13 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">Z</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QUY, PUZ और QVZ में QUZ से एक-एक अक्षर भिन्न है, अतः वे पैटर्न का पालन नहीं करते।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">DHM : QUZ (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भारत और पाकिस्तान के बीच 'सिंधु जल संधि' निम्नलिखित में से किस वर्ष हस्ताक्षरित हुई थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1960</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1947</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1955</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1963</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family: al'\">कांग्रेस </span><span style=\"font-weight:bold;font-family:'Mangal'\">सूरत अधिवेशन (1907)</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरमपंथियों</span><span style=\"font-family:'Mangal'\"> और </span><span style=\"font-weight:bold;font-family:'Mangal'\">गरमपंथियों</span><span style=\"font-family:'Mangal'\"> में बँट गई थी।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों गुट </span><span style=\"font-weight:bold;font-family:'Mangal'\">1916 के लखनऊ अधिवेशन</span><span style=\"font-family:'Mangal'\"> में </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुनः एक</span><span style=\"font-family:'Mangal'\"> हुए, जिसकी अध्यक्षता </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंबिका चरण मजूमदार</span><span style=\"font-family:'Mangal'\"> ने की।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी अधिवेशन में कांग्रेस और </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुस्लिम लीग</span><span style=\"font-family:'Mangal'\"> के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">लखनऊ समझौता</span><span style=\"font-family:'Mangal'\"> हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">अमृतसर अधिवेशन (1919)</span><span style=\"font-family:'Mangal'\"> जलियाँवाला बाग हत्याकांड के बाद हुआ, और </span><span style=\"font-weight:bold;font-family:'Mangal'\">नागपुर अधिवेशन (1920)</span><span style=\"font-family:'Mangal'\"> में असहयोग कार्यक्रम और कांग्रेस का नया संविधान स्वीकार हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः पुनर्मिलन </span><span style=\"font-weight:bold;font-family:'Mangal'\">लखनऊ अधिवेशन 1916 (विकल्प B)</span><span style=\"font-family:'Mangal'\"> में हुआ।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20वाँ G20 शिखर सम्मेलन (22–23 नवंबर 2025), जो अफ्रीकी महाद्वीप पर आयोजित पहला G20 शिखर सम्मेलन था, किस शहर में हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केप टाउन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नैरोबी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अदीस अबाबा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जोहान्सबर्ग</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">20वाँ G20 शिखर सम्मेलन</span><span style=\"font-family:'Mangal'\"> </span><span style=\"font-weight:bold;font-family:'Mangal'\">22–23 नवंबर 2025</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">जोहान्सबर्ग एक्सपो सेंटर</span><span style=\"font-family:'Mangal'\">, </span><span style=\"font-weight:bold;font-family:'Mangal'\">जोहान्सबर्ग, दक्षिण अफ्रीका</span><span style=\"font-family:'Mangal'\"> में हुआ → </span><span style=\"font-weight:bold;font-family:'Mangal'\">अफ्रीकी महाद्वीप पर पहला G20 शिखर सम्मेलन</span><span style=\"font-family:'Mangal'\">।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">थीम → </span><span style=\"font-weight:bold;font-family:'Mangal'\">\"Solidarity, Equality, Sustainability\"</span><span style=\"font-family:'Mangal'\"> (एकजुटता, समानता, स्थिरता); नेताओं ने </span><span style=\"font-weight:bold;font-family:'Mangal'\">122 अनुच्छेदों वाला जोहान्सबर्ग नेताओं का घोषणापत्र</span><span style=\"font-family:'Mangal'\"> अपनाया।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रधानमंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">नरेंद्र मोदी</span><span style=\"font-family:'Mangal'\"> शामिल हुए; </span><span style=\"font-weight:bold;font-family:'Mangal'\">अमेरिका</span><span style=\"font-family:'Mangal'\"> ने शिखर सम्मेलन में कोई प्रतिनिधि नहीं भेजा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पिछला (19वाँ) शिखर सम्मेलन 2024 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">रियो डी जनेरियो, ब्राज़ील</span><span style=\"font-family:'Mangal'\"> में हुआ था।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केप टाउन दक्षिण अफ्रीका में है पर मेज़बान नहीं था; नैरोबी (केन्या) और अदीस अबाबा (इथियोपिया) G20 मेज़बान शहर नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः मेज़बान शहर </span><span style=\"font-weight:bold;font-family:'Mangal'\">जोहान्सबर्ग (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जून 2026 में DRDO ने लगातार तीन उड़ान-परीक्षण किए, जिनसे भारत ICBM श्रेणी तक की मिसाइलों को रोकने में सक्षम देशों में शामिल हुआ। इसी शृंखला में किस नौसैनिक मिसाइल का पहला उड़ान-परीक्षण हुआ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ब्रह्मोस-NG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नौसैनिक जहाज-रोधी मिसाइल-मध्यम दूरी (NASM-MR)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुशा LR-SAM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निर्भय</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Mangal'\">10–11 जून 2026</span><span style=\"font-family:'Mangal'\"> को </span><span style=\"font-weight:bold;font-family:'Mangal'\">DRDO</span><span style=\"font-family:'Mangal'\"> ने अपनी बहु-स्तरीय </span><span style=\"font-weight:bold;font-family:'Mangal'\">बैलिस्टिक मिसाइल रक्षा (BMD)</span><span style=\"font-family:'Mangal'\"> प्रणाली के </span><span style=\"font-weight:bold;font-family:'Mangal'\">लगातार तीन उड़ान-परीक्षण</span><span style=\"font-family:'Mangal'\"> किए; इंटरसेप्टर मिसाइलों ने अपने लक्ष्यों को भेदा।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इन परीक्षणों से भारत </span><span style=\"font-weight:bold;font-family:'Mangal'\">अंतरमहाद्वीपीय बैलिस्टिक मिसाइल (ICBM)</span><span style=\"font-family:'Mangal'\"> श्रेणी तक की मिसाइलों को रोकने की BMD क्षमता वाले चुनिंदा देशों में शामिल हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसी शृंखला में </span><span style=\"font-weight:bold;font-family:'Mangal'\">नौसैनिक जहाज-रोधी मिसाइल-मध्यम दूरी (NASM-MR)</span><span style=\"font-family:'Mangal'\"> का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पहला उड़ान-परीक्षण</span><span style=\"font-family:'Mangal'\"> हुआ।</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रक्षा मंत्री </span><span style=\"font-weight:bold;font-family:'Mangal'\">राजनाथ सिंह</span><span style=\"font-family:'Mangal'\"> और DRDO अध्यक्ष राजेश कुमार सिंह ने टीमों को बधाई दी; </span><span style=\"font-weight:bo
