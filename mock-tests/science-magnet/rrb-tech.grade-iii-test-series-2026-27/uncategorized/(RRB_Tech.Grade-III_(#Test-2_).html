, पत्तियों के मुरझाने का कारण</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) ऐब्सिसिक अम्ल — (3) प्ररोह के शीर्ष पर बनता है, कोशिकाओं को लंबा होने में सहायता करता है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) जिबरेलिन — (4) तने की वृद्धि में सहायता करता है</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-1, (b)-3, (c)-2, (d)-4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-1, (c)-2, (d)-4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-3, (b)-2, (c)-1, (d)-4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a)-4, (b)-1, (c)-2, (d)-3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(a) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सिन</span><span style=\"font-family:'Mangal'\"> प्ररोह के शीर्ष पर बनता है और कोशिकाओं को लंबा होने में सहायता करता है → (3).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(b) </span><span style=\"font-weight:bold;font-family:'Mangal'\">साइटोकाइनिन</span><span style=\"font-family:'Mangal'\"> कोशिका विभाजन को बढ़ावा देता है; यह फलों और बीजों में अधिक मात्रा में होता है → (1).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(c) </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऐब्सिसिक अम्ल</span><span style=\"font-family:'Mangal'\"> वृद्धि को रोकता है; इसका एक प्रभाव पत्तियों का मुरझाना है → (2).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(d) </span><span style=\"font-weight:bold;font-family:'Mangal'\">जिबरेलिन</span><span style=\"font-family:'Mangal'\">, ऑक्सिन की तरह, तने की वृद्धि में सहायता करता है → (4).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सही सुमेलन (a)-3, (b)-1, (c)-2, (d)-4 है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अचानक तेज़ गतिविधि, जैसे तेज़ दौड़ने के दौरान, व्यक्ति को प्रायः पेशियों में ऐंठन (क्रैम्प) हो जाती है. ऐसा इसलिए होता है क्योंकि:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशियों में ग्लूकोज़ पूरी तरह CO₂ और जल में टूट जाता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशियों में यीस्ट जैसे किण्वन से एथेनॉल बनता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ग्लूकोज़ की कमी से पेशियाँ श्वसन बंद कर देती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशी कोशिकाओं में ऑक्सीजन की कमी के कारण पाइरुवेट लैक्टिक अम्ल में बदल जाता है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अचानक गतिविधि के दौरान पेशी कोशिकाओं में </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन की कमी</span><span style=\"font-family:'Mangal'\"> हो जाती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इस स्थिति में पाइरुवेट (तीन कार्बन वाला अणु) </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैक्टिक अम्ल</span><span style=\"font-family:'Mangal'\"> में बदल जाता है, जो भी तीन कार्बन वाला अणु है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पेशियों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">लैक्टिक अम्ल के जमाव</span><span style=\"font-family:'Mangal'\"> से ऐंठन होती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ और जल में पूर्ण विघटन के लिए ऑक्सीजन (वायवीय) चाहिए, और एथेनॉल यीस्ट में बनता है, पेशियों में नहीं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐंठन इसलिए होती है क्योंकि ऑक्सीजन की कमी से पाइरुवेट लैक्टिक अम्ल में बदल जाता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): मेंडल के लंबे और बौने मटर के पौधे के संकरण में F1 पीढ़ी के सभी पौधे मध्यम ऊँचाई के थे.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): लंबापन एक प्रभावी लक्षण है, जो केवल एक प्रति उपस्थित होने पर भी अभिव्यक्त होता है.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबे × बौने संकरण की F1 पीढ़ी में </span><span style=\"font-weight:bold;font-family:'Mangal'\">सभी पौधे लंबे</span><span style=\"font-family:'Mangal'\"> थे; बीच की, \"मध्यम ऊँचाई\" के पौधे नहीं थे → A असत्य है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लंबेपन ('T') जैसे लक्षण, जो एक प्रति उपस्थित होने पर भी अभिव्यक्त होते हैं, </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रभावी लक्षण</span><span style=\"font-family:'Mangal'\"> कहलाते हैं → R सत्य है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F1 पौधों को लंबापन और बौनापन दोनों विरासत में मिले, परंतु केवल लंबापन अभिव्यक्त हुआ; बौनापन F2 के एक-चौथाई पौधों में फिर दिखा.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A असत्य है परंतु R सत्य है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक लड़का एक चट्टान के सामने ताली बजाता है और 0.6 s बाद प्रतिध्वनि सुनता है. यदि वायु में ध्वनि की चाल 340 m/s है, तो लड़के से चट्टान की दूरी है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">204 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">68 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">102 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">51 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रतिध्वनि में ध्वनि परावर्तक सतह तक जाती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">और वापस आती है</span><span style=\"font-family:'Mangal'\">, इसलिए वह दूरी का दोगुना तय करती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ध्वनि द्वारा तय कुल दूरी = चाल × समय = 340 × 0.6 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">204 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">चट्टान की दूरी = 204 ÷ 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">102 m</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: d = (v × t) ÷ 2 = (340 × 0.6) ÷ 2 = 102 m.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः चट्टान 102 m दूर है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक खाद्य शृंखला में उत्पादक (घास) के पास 10,000 J ऊर्जा उपलब्ध है. 10 प्रतिशत नियम के अनुसार द्वितीयक उपभोक्ता (तीसरे पोषक स्तर) को उपलब्ध ऊर्जा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">100 J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1,000 J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3,000 J</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">औसतन एक पोषक स्तर की केवल </span><span style=\"font-weight:bold;font-family:'Mangal'\">10%</span><span style=\"font-family:'Mangal'\"> ऊर्जा ही अगले स्तर तक पहुँचती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहला पोषक स्तर (उत्पादक): </span><span style=\"font-weight:bold;font-family:'Mangal'\">10,000 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरा पोषक स्तर (शाकाहारी): 10,000 का 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1,000 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरा पोषक स्तर (द्वितीयक उपभोक्ता, छोटे मांसाहारी): 1,000 का 10% = </span><span style=\"font-weight:bold;font-family:'Mangal'\">100 J</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः द्वितीयक उपभोक्ता को 100 J मिलती है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिकथन (A): वायुमंडल के ऊपरी स्तरों में ओज़ोन, ऑक्सीजन (O₂) अणुओं पर UV विकिरण की क्रिया से बनती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कारण (R): ओज़ोन जीवों के लिए एक घातक विष है.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं और R, A की सही व्याख्या है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A सत्य है परंतु R असत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A असत्य है परंतु R सत्य है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उच्च ऊर्जा वाला UV विकिरण O₂ को मुक्त ऑक्सीजन परमाणुओं में तोड़ता है (O₂ + UV → O + O), और प्रत्येक O परमाणु O₂ से मिलकर </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओज़ोन</span><span style=\"font-family:'Mangal'\"> बनाता है (O + O₂ → O₃) → A सत्य है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O₂ के विपरीत, जो वायवीय जीवन के लिए आवश्यक है, </span><span style=\"font-weight:bold;font-family:'Mangal'\">ओज़ोन एक घातक विष</span><span style=\"font-family:'Mangal'\"> है → R सत्य है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परंतु ओज़ोन का विषैला होना यह नहीं बताता कि ऊपरी वायुमंडल में वह </span><span style=\"font-weight:bold;font-family:'Mangal'\">कैसे</span><span style=\"font-family:'Mangal'\"> बनती है; उसका बनना O₂ पर UV की क्रिया से होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऊपरी वायुमंडल की ओज़ोन पृथ्वी को UV विकिरण से बचाती है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अभिक्रिया ZnO + C → Zn + CO में निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZnO ऑक्सीकृत होता है और C अपचयित होता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ZnO और C दोनों ऑक्सीकृत होते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C ऑक्सीकृत होता है और ZnO अपचयित होता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न ऑक्सीकरण होता है न अपचयन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीकरण = </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन का जुड़ना</span><span style=\"font-family:'Mangal'\"> (या हाइड्रोजन का निकलना); अपचयन = </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीजन का निकलना</span><span style=\"font-family:'Mangal'\"> (या हाइड्रोजन का जुड़ना).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन (C) ऑक्सीजन प्राप्त कर CO बनता है → कार्बन </span><span style=\"font-weight:bold;font-family:'Mangal'\">ऑक्सीकृत</span><span style=\"font-family:'Mangal'\"> होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ज़िंक ऑक्साइड (ZnO) ऑक्सीजन खोकर Zn बनता है → ZnO </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपचयित</span><span style=\"font-family:'Mangal'\"> होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक अभिकारक ऑक्सीकृत और दूसरा अपचयित होता है, इसलिए यह रेडॉक्स अभिक्रिया है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः C ऑक्सीकृत होता है और ZnO अपचयित होता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अलैंगिक जनन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) हाइड्रा में एक कलिका बढ़कर जनक से अलग होकर स्वतंत्र रूप से रहने लगती है; इसे मुकुलन कहते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) राइज़ोपस में बीजाणु कवक-तंतुओं (हाइफी) के सिरे पर थैली जैसी संरचना में बनते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) पादपों में कायिक प्रवर्धन में दो जनक भाग लेते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) हाइड्रा में कलिका बढ़कर जनक से </span><span style=\"font-weight:bold;font-family:'Mangal'\">अलग</span><span style=\"font-family:'Mangal'\"> होकर स्वतंत्र रूप से रहती है → यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">मुकुलन</span><span style=\"font-family:'Mangal'\"> है → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) राइज़ोपस में बीजाणु कवक-तंतुओं पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">थैली जैसी संरचना</span><span style=\"font-family:'Mangal'\"> में बनते हैं (एस्परजिलस में फूले हुए आशय पर) → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) कायिक प्रवर्धन अलैंगिक है और इसमें </span><span style=\"font-weight:bold;font-family:'Mangal'\">केवल एक जनक</span><span style=\"font-family:'Mangal'\"> भाग लेता है → गलत.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्कीनों की समजातीय श्रेणी में C₃H₆ के ठीक बाद आने वाला सदस्य और दोनों के आणविक द्रव्यमान का अंतर क्रमशः है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₄H₈ और 14 u</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₄H₁₀ और 14 u</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₄H₈ और 12 u</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₃H₈ और 2 u</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समजातीय श्रेणी के क्रमागत सदस्यों में </span><span style=\"font-weight:bold;font-family:'Mangal'\">–CH₂– इकाई</span><span style=\"font-family:'Mangal'\"> का अंतर होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐल्कीन: C₂H₄, C₃H₆, </span><span style=\"font-weight:bold;font-family:'Mangal'\">C₄H₈</span><span style=\"font-family:'Mangal'\">, C₅H₁₀ … अतः C₃H₆ के बाद का सदस्य C₄H₈ है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">–CH₂– का द्रव्यमान = 12 + (2 × 1) = </span><span style=\"font-weight:bold;font-family:'Mangal'\">14 u</span><span style=\"font-family:'Mangal'\">, इसलिए आणविक द्रव्यमान 14 u बढ़ता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C₄H₁₀ ऐल्केन है, ऐल्कीन नहीं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः अगला सदस्य C₄H₈ है और अंतर 14 u है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केरोसिन का अपवर्तनांक 1.44 और जल का 1.33 है, यद्यपि केरोसिन का द्रव्यमान घनत्व जल से कम है. निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) केरोसिन जल की तुलना में प्रकाशिक रूप से सघन है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) केरोसिन में प्रकाश जल की तुलना में धीमा चलता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) प्रकाशिक रूप से सघन माध्यम का द्रव्यमान घनत्व सदैव अधिक होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) जिस माध्यम का </span><span style=\"font-weight:bold;font-family:'Mangal'\">अपवर्तनांक अधिक</span><span style=\"font-family:'Mangal'\"> है, वह प्रकाशिक रूप से सघन है; 1.44 &gt; 1.33, इसलिए केरोसिन प्रकाशिक रूप से सघन है → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) </span><span style=\"font-weight:bold;font-family:'Mangal'\">प्रकाशिक रूप से सघन</span><span style=\"font-family:'Mangal'\"> माध्यम में प्रकाश की चाल कम होती है, इसलिए केरोसिन में प्रकाश जल से धीमा चलता है → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) प्रकाशिक घनत्व और द्रव्यमान घनत्व एक ही बात </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> हैं; केरोसिन प्रकाशिक रूप से सघन है परंतु उसका द्रव्यमान घनत्व जल से कम है → गलत.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल (i) और (ii) सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">परमाणु द्रव्यमान H = 1 u, C = 12 u, O = 16 u और Na = 23 u लेते हुए, निम्नलिखित में से किसका आणविक द्रव्यमान या सूत्र इकाई द्रव्यमान सबसे अधिक है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कार्बन डाइऑक्साइड (CO₂)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सोडियम ऑक्साइड (Na₂O)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल (H₂O)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऑक्सीजन गैस (O₂)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ = (12 × 1) + (16 × 2) = 12 + 32 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">44 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Na₂O = (23 × 2) + (16 × 1) = 46 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">62 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">H₂O = (1 × 2) + (16 × 1) = 2 + 16 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">18 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O₂ = 16 × 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">32 u</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः सोडियम ऑक्साइड का सूत्र इकाई द्रव्यमान सबसे अधिक, 62 u है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर-T के विषय में निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह यांत्रिक अवरोध की तरह कार्य करता है जो शुक्राणु को अंडाणु तक पहुँचने से रोकता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इसे गर्भधारण रोकने के लिए गर्भाशय में रखा जाता है, परंतु यह यौन संचारित रोगों से सुरक्षा नहीं देता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह एक हार्मोनी विधि है जो शरीर में हार्मोनों का संतुलन बदलती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यह यौन संचारित रोगों और गर्भधारण दोनों से सुरक्षा देता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">लूप या </span><span style=\"font-weight:bold;font-family:'Mangal'\">कॉपर-T जैसे गर्भनिरोधक साधन गर्भाशय में रखे जाते हैं</span><span style=\"font-family:'Mangal'\"> ताकि गर्भधारण न हो.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">गर्भाशय में जलन के कारण इनके दुष्प्रभाव हो सकते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कॉपर-T अवरोध की तरह कार्य </span><span style=\"font-weight:bold;font-family:'Mangal'\">नहीं</span><span style=\"font-family:'Mangal'\"> करता, इसलिए यह </span><span style=\"font-weight:bold;font-family:'Mangal'\">यौन संचारित रोगों से कोई सुरक्षा नहीं</span><span style=\"font-family:'Mangal'\"> देता; कंडोम कुछ हद तक यह सुरक्षा देता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यांत्रिक अवरोध विधियाँ (कंडोम) और हार्मोनी विधियाँ (गोलियाँ) अलग श्रेणियाँ हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः कॉपर-T गर्भधारण रोकता है, STD नहीं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 Ω और 40 Ω के दो प्रतिरोध समांतर क्रम में जुड़े हैं, और यह संयोजन 2 Ω के प्रतिरोध के साथ श्रेणी क्रम में 5 V की बैटरी से जुड़ा है. बैटरी से ली गई धारा है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.1 A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">0.5 A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1 A</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2.5 A</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">समांतर भाग: 1/Rp = 1/10 + 1/40 = (4 + 1)/40 = 5/40 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">Rp = 8 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Shortcut: दो प्रतिरोधों के लिए Rp = (R1 × R2)/(R1 + R2) = (10 × 40)/50 = 8 Ω.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">2 Ω के साथ श्रेणी क्रम: कुल R = 8 + 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10 Ω</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">धारा I = V/R = 5/10 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0.5 A</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ली गई धारा 0.5 A है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश के प्रकीर्णन के विषय में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) साफ आकाश नीला दिखता है क्योंकि वायु के सूक्ष्म कण नीले प्रकाश को लाल की तुलना में अधिक प्रकीर्णित करते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) अंतरिक्ष यात्री को आकाश काला दिखता है क्योंकि वहाँ प्रकाश को प्रकीर्णित करने के लिए वायुमंडल नहीं होता.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) खतरे के संकेत लाल रंग के होते हैं क्योंकि लाल प्रकाश कोहरे या धुएँ से सबसे कम प्रकीर्णित होता है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">इनमें से कौन-सा/से कथन सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल (i) और (iii)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी (i), (ii) और (iii)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(i) वायु के अणु और सूक्ष्म कण </span><span style=\"font-weight:bold;font-family:'Mangal'\">छोटी तरंगदैर्ध्य (नीले)</span><span style=\"font-family:'Mangal'\"> को लंबी तरंगदैर्ध्य (लाल) की तुलना में बहुत अधिक प्रकीर्णित करते हैं; प्रकीर्णित नीला प्रकाश हमारी आँखों तक पहुँचता है, इसलिए आकाश नीला दिखता है → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(ii) वायुमंडल न होने पर </span><span style=\"font-weight:bold;font-family:'Mangal'\">कोई प्रकीर्णन नहीं</span><span style=\"font-family:'Mangal'\"> होता, इसलिए अंतरिक्ष यात्री को या बहुत अधिक ऊँचाई पर आकाश काला दिखता है → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(iii) लाल प्रकाश (तरंगदैर्ध्य नीले की लगभग 1.8 गुनी) कोहरे या धुएँ से </span><span style=\"font-weight:bold;font-family:'Mangal'\">सबसे कम प्रकीर्णित</span><span style=\"font-family:'Mangal'\"> होता है, इसलिए लाल संकेत दूर से उसी रंग में दिखते हैं → सही.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः तीनों कथन सही हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश संश्लेषण के दौरान होने वाली घटनाओं का सही क्रम है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">जल का विघटन → क्लोरोफिल द्वारा प्रकाश का अवशोषण → CO₂ का अपचयन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">क्लोरोफिल द्वारा प्रकाश का अवशोषण → जल का विघटन → CO₂ का कार्बोहाइड्रेट में अपचयन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CO₂ का अपचयन → जल का विघटन → प्रकाश का अवशोषण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">प्रकाश का अवशोषण → CO₂ का अपचयन → जल का विघटन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पहली घटना: </span><span style=\"font-weight:bold;font-family:'Mangal'\">क्लोरोफिल द्वारा प्रकाश ऊर्जा का अवशोषण</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दूसरी घटना: प्रकाश ऊर्जा का रासायनिक ऊर्जा में रूपांतरण और </span><span style=\"font-weight:bold;font-family:'Mangal'\">जल के अणुओं का विघटन</span><span style=\"font-family:'Mangal'\"> हाइड्रोजन और ऑक्सीजन में.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीसरी घटना: </span><span style=\"font-weight:bold;font-family:'Mangal'\">कार्बन डाइऑक्साइड का कार्बोहाइड्रेट में अपचयन</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः क्रम है प्रकाश का अवशोषण → जल का विघटन → CO₂ का अपचयन </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प B)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं. वह कौन-सा है जो उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CFI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKN</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UXB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PSV</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CFI: C + 3 = F, F + 3 = I → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">HKN: H + 3 = K, K + 3 = N → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PSV: P + 3 = S, S + 3 = V → (+3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">UXB: U + 3 = X, X + 4 = B → (+3, </span><span style=\"font-weight:bold;font-family:'Mangal'\">+4</span><span style=\"font-family:'Mangal'\">) — भिन्न</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम </span><span style=\"font-weight:bold;font-family:'Mangal'\">UXB (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई शृंखला में ? के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7, 15, 24, 34, 45, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">57</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">56</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">58</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">55</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर: 15 − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">8</span><span style=\"font-family:'Mangal'\">, 24 − 15 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">9</span><span style=\"font-family:'Mangal'\">, 34 − 24 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">10</span><span style=\"font-family:'Mangal'\">, 45 − 34 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">11</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतर हर बार 1 बढ़ता है → अगला अंतर = </span><span style=\"font-weight:bold;font-family:'Mangal'\">12</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अगला पद = 45 + 12 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">57</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ? = </span><span style=\"font-weight:bold;font-family:'Mangal'\">57 (विकल्प A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए. यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कथन: कुछ फल, सब्ज़ियाँ हैं. सभी सब्ज़ियाँ, जानवर हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष: (I) कुछ जानवर, फल हैं. (II) कुछ फल, जानवर नहीं हैं.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कुछ फल, सब्ज़ियाँ हैं → \"फल\" और \"सब्ज़ियाँ\" के वृत्त एक-दूसरे को काटते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सभी सब्ज़ियाँ, जानवर हैं → पूरा \"सब्ज़ियाँ\" वृत्त \"जानवर\" के अंदर है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उभयनिष्ठ भाग (जो फल सब्ज़ियाँ हैं) \"जानवर\" के अंदर है → कुछ जानवर, फल हैं → निष्कर्ष (I) </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण करता है</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष फल जानवर हो भी सकते हैं और नहीं भी — कथनों से यह तय नहीं होता → निष्कर्ष (II) </span><span style=\"font-weight:bold;font-family:'Mangal'\">अनुसरण नहीं करता</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः केवल निष्कर्ष (I) अनुसरण करता है </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प A)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शब्द PLANET के प्रत्येक अक्षर को अंग्रेज़ी वर्णमाला क्रम में व्यवस्थित किया जाए, तो कितने अक्षरों की स्थिति अपरिवर्तित रहेगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">मूल शब्द: P L A N E T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वर्णमाला क्रम: A E L N P T</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थान-दर-स्थान तुलना: P/A ✗, L/E ✗, A/L ✗, </span><span style=\"font-weight:bold;font-family:'Mangal'\">N/N ✓</span><span style=\"font-family:'Mangal'\">, E/P ✗, </span><span style=\"font-weight:bold;font-family:'Mangal'\">T/T ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो अक्षर (N और T) अपनी स्थिति पर बने रहते हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर की ओर मुख किए 100 विद्यार्थियों की एक पंक्ति में सुखी का स्थान बाएँ से 25वाँ और अभिषेक का स्थान दाएँ से 34वाँ है. रमेश दोनों के ठीक बीच में बैठा है, तो सुखी के सापेक्ष रमेश का स्थान ज्ञात कीजिए.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">22वाँ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">20वाँ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">21वाँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">23वाँ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बाएँ से अभिषेक का स्थान = 100 − 34 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">67वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुखी बाएँ से 25वाँ है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">रमेश ठीक बीच में → बाएँ से स्थान = (25 + 67)/2 = 92/2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">46वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सुखी के सापेक्ष रमेश = 46 − 25 = सुखी के दाएँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">21वाँ</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः रमेश सुखी से </span><span style=\"font-weight:bold;font-family:'Mangal'\">21वाँ (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">सात व्यक्ति A, B, C, D, E, F और G एक पंक्ति में उत्तर की ओर मुख करके बैठे हैं. B के दाएँ केवल दो व्यक्ति बैठे हैं. F, D के ठीक बाएँ बैठा है. B और D के बीच केवल दो व्यक्ति बैठे हैं. C, A के ठीक दाएँ बैठा है. G, E के ठीक बाएँ बैठा है. E पंक्ति के किसी एक छोर पर बैठा है. पंक्ति के बाएँ छोर से तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों को बाएँ से दाएँ 1 से 7 तक क्रमांकित करें (उत्तर की ओर मुख, दायाँ = बड़ी संख्या).</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B के दाएँ केवल दो व्यक्ति → B = स्थान </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B और D के बीच दो व्यक्ति → D = स्थान 2 (स्थान 8 नहीं है) → D = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">; F, D के ठीक बाएँ → F = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E किसी छोर पर; स्थान 1 भरा है → E = </span><span style=\"font-weight:bold;font-family:'Mangal'\">7</span><span style=\"font-family:'Mangal'\">; G, E के ठीक बाएँ → G = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष स्थान 3 और 4 पर A और C, जहाँ C, A के ठीक दाएँ → A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span><span style=\"font-family:'Mangal'\">, C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम पंक्ति (बाएँ → दाएँ): </span><span style=\"font-weight:bold;font-family:'Mangal'\">F</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">C</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-weight:bold;font-family:'Mangal'\">  </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः बाएँ से तीसरा </span><span style=\"font-weight:bold;font-family:'Mangal'\">A (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में ‘sun rises early’ को ‘pk mz lt’ लिखा जाता है और ‘rises above hill’ को ‘mz rt vc’ लिखा जाता है. उस भाषा में ‘rises’ को कैसे लिखा जाएगा? (सभी कूट केवल दो-अक्षर के हैं.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">mz</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">pk</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">lt</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">rt</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 1: sun rises early → pk mz lt</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">वाक्य 2: rises above hill → mz rt vc</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों वाक्यों में केवल एक शब्द उभयनिष्ठ है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">rises</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों वाक्यों में केवल एक कूट उभयनिष्ठ है: </span><span style=\"font-weight:bold;font-family:'Mangal'\">mz</span><span style=\"font-family:'Mangal'\">.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ‘rises’ का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">mz (विकल्प A)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में ‘CREW’ को ‘3685’ लिखा जाता है और ‘WEAR’ को ‘5816’ लिखा जाता है. उस कूट भाषा में ‘A’ का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">1</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">CREW → 3 6 8 5 और WEAR → 5 8 1 6</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों शब्दों में उभयनिष्ठ अक्षर: </span><span style=\"font-weight:bold;font-family:'Mangal'\">W, E, R</span><span style=\"font-family:'Mangal'\">; केवल WEAR में </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\"> है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दोनों कूटों में उभयनिष्ठ अंक: </span><span style=\"font-weight:bold;font-family:'Mangal'\">5, 8, 6</span><span style=\"font-family:'Mangal'\">; केवल 5816 में </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span><span style=\"font-family:'Mangal'\"> है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः A का कूट </span><span style=\"font-weight:bold;font-family:'Mangal'\">1 (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित अक्षर शृंखला को देखकर प्रश्न का उत्तर दीजिए. गिनती केवल बाएँ से दाएँ की जानी है.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) M T K A B D F E R S T U P L M N O Q R (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसे कितने व्यंजन हैं, जिनमें से प्रत्येक के ठीक पहले भी व्यंजन है और ठीक बाद भी व्यंजन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शृंखला में स्वर: A, E, U, O. बाकी सभी अक्षर व्यंजन हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">ऐसा व्यंजन खोजें जिसके दोनों ओर व्यंजन हों:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\"> K → हाँ (1)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\"> T → हाँ (2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P </span><span style=\"font-weight:bold;font-family:'Mangal'\">L</span><span style=\"font-family:'Mangal'\"> M → हाँ (3)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">L </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\"> N → हाँ (4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">M </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\"> O → O स्वर है → नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">O </span><span style=\"font-weight:bold;font-family:'Mangal'\">Q</span><span style=\"font-family:'Mangal'\"> R → O स्वर है → नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">B </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\"> F → हाँ (5)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः ऐसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span><span style=\"font-family:'Mangal'\"> व्यंजन हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प C)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में A + B का अर्थ है ‘A, B की माता है’, A − B का अर्थ है ‘A, B का भाई है’, A × B का अर्थ है ‘A, B की बहन है’ और A ÷ B का अर्थ है ‘A, B की पुत्री है’. इसके आधार पर, यदि ‘P + Q ÷ R − S × T’ है, तो P का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पत्नी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">भाई की पुत्री</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक को दाईं ओर से, T से शुरू करके खोलें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S × T → S, T की बहन है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R − S → R, S का भाई है → R, T का </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q ÷ R → Q, R की पुत्री है → Q, T के भाई की पुत्री है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P + Q → P, Q की माता है; R, Q का पिता है (R पुरुष है, क्योंकि वह S का भाई है) → P और R, Q के माता-पिता अर्थात् पति-पत्नी हैं → P, R की पत्नी है → P, T के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पत्नी</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः P, T के </span><span style=\"font-weight:bold;font-family:'Mangal'\">भाई की पत्नी (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कबीर बिंदु A से चलना शुरू करता है और 15 km दक्षिण की ओर जाता है. फिर वह बाएँ मुड़कर 10 km जाता है, बाएँ मुड़कर 22 km जाता है. फिर वह बाएँ मुड़कर 18 km जाता है. अंत में वह बाएँ मुड़कर 7 km जाता है और बिंदु P पर रुकता है. बिंदु A पर वापस पहुँचने के लिए उसे कितनी दूरी (न्यूनतम दूरी) और किस दिशा में जाना चाहिए? (सभी मोड़ केवल 90 डिग्री के हैं, जब तक अन्यथा न कहा जाए.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km पश्चिम की ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8 km पूर्व की ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7 km पूर्व की ओर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">10 km पश्चिम की ओर</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दिशाएँ: दक्षिण → बाएँ = पूर्व → बाएँ = उत्तर → बाएँ = पश्चिम → बाएँ = दक्षिण</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दक्षिण 15 km, पूर्व 10 km, उत्तर 22 km, पश्चिम 18 km, दक्षिण 7 km</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">उत्तर–दक्षिण: −15 + 22 − 7 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">0 km</span><span style=\"font-family:'Mangal'\"> (A के समान स्तर पर)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पूर्व–पश्चिम: 10 − 18 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">−8 km</span><span style=\"font-family:'Mangal'\"> → P, A से </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 km पश्चिम</span><span style=\"font-family:'Mangal'\"> में है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">A पर पहुँचने के लिए उसे </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 km पूर्व की ओर</span><span style=\"font-family:'Mangal'\"> जाना होगा.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः उत्तर </span><span style=\"font-weight:bold;font-family:'Mangal'\">8 km पूर्व की ओर (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं. कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BE − FI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KN − OR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJ − LN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PS − TW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BE − FI: B + 4 = F, E + 4 = I → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KN − OR: K + 4 = O, N + 4 = R → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">PS − TW: P + 4 = T, S + 4 = W → (+4, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">GJ − LN: G + 5 = L, J + 4 = N → (</span><span style=\"font-weight:bold;font-family:'Mangal'\">+5</span><span style=\"font-family:'Mangal'\">, +4) — भिन्न</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">GJ − LN (विकल्प C)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">निम्नलिखित चार संख्या-युग्मों में से तीन एक निश्चित प्रकार से समान हैं और एक समूह बनाते हैं. कौन-सा संख्या-युग्म उस समूह से संबंधित नहीं है? (नोट: संक्रियाएँ पूरी संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में तोड़े बिना.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(6, 37)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(8, 65)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(9, 82)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(7, 51)</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">6² + 1 = 36 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">37</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">8² + 1 = 64 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">65</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">9² + 1 = 81 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">82</span><span style=\"font-family:'Mangal'\"> ✓</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">7² + 1 = 49 + 1 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">50</span><span style=\"font-family:'Mangal'\">, 51 नहीं ✗</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः विषम युग्म </span><span style=\"font-weight:bold;font-family:'Mangal'\">(7, 51) (विकल्प D)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह बॉक्स A, B, C, D, E और F एक के ऊपर एक रखे हैं, परंतु आवश्यक नहीं कि इसी क्रम में हों. C के नीचे केवल दो बॉक्स रखे हैं. C और E के बीच केवल एक बॉक्स रखा है. F के ऊपर केवल A रखा है. B, D से ऊपर किसी स्थान पर रखा है. E और B के बीच कितने बॉक्स रखे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">कोई नहीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दो</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">स्थानों को 1 (सबसे नीचे) से 6 (सबसे ऊपर) तक क्रमांकित करें.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C के नीचे केवल दो बॉक्स → C = </span><span style=\"font-weight:bold;font-family:'Mangal'\">3</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">F के ऊपर केवल A → A = </span><span style=\"font-weight:bold;font-family:'Mangal'\">6</span><span style=\"font-family:'Mangal'\">, F = </span><span style=\"font-weight:bold;font-family:'Mangal'\">5</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">C और E के बीच एक बॉक्स → E = 1 या 5; 5 भरा है → E = </span><span style=\"font-weight:bold;font-family:'Mangal'\">1</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">शेष स्थान 2 और 4 पर B और D, जहाँ B, D से ऊपर → D = </span><span style=\"font-weight:bold;font-family:'Mangal'\">2</span><span style=\"font-family:'Mangal'\">, B = </span><span style=\"font-weight:bold;font-family:'Mangal'\">4</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंतिम ढेर (ऊपर → नीचे): </span><span style=\"font-weight:bold;font-family:'Mangal'\">A, F, B, C, D, E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">E (1) और B (4) के बीच: स्थान 2 और 3 → </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\"> बॉक्स (D और C)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः E और B के बीच </span><span style=\"font-weight:bold;font-family:'Mangal'\">दो</span><span style=\"font-family:'Mangal'\"> बॉक्स हैं </span><span style=\"font-weight:bold;font-family:'Mangal'\">(विकल्प D)</span><span style=\"font-family:'Mangal'\">.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दी गई अक्षर, संख्या और प्रतीक शृंखला को देखकर प्रश्न का उत्तर दीजिए. सभी संख्याएँ केवल एक अंक की हैं.</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">(बायाँ) A 4 &amp; P % 7 @ 8 T 6 &amp; K 2 R 5 # 3 E Ω C D (दायाँ)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">यदि शृंखला से सभी संख्याएँ हटा दी जाएँ, तो निम्नलिखित में से कौन दाएँ से सातवाँ होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">#</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">संख्याएँ (4, 7, 8, 6, 2, 5, 3) हटाएँ:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नई शृंखला: A &amp; P % @ T &amp; K R # E Ω C D</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">दाएँ से गिनें: D (1), C (2), Ω (3), E (4), # (5), R (6), </span><span style=\"font-weight:bold;font-family:'Mangal'\">K (7)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः दाएँ से सातवाँ </span><span style=\"font-weight:bold;font-family:'Mangal'\">K (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">एक निश्चित कूट भाषा में A + B का अर्थ है 'A, B का पिता है', A − B का अर्थ है 'A, B का भाई है', A × B का अर्थ है 'A, B का पुत्र है' और A ÷ B का अर्थ है 'A, B की बहन है'. यदि 'S − T + U ÷ V × N' है, तो S का N से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">बहन का पति</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पति का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">पुत्री का पति</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">माता का भाई</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">व्यंजक को दाईं ओर से, N से शुरू करके खोलें:</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">V × N → V, N का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पुत्र</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">U ÷ V → U, V की बहन है → U और V भाई-बहन हैं, अतः उनके माता-पिता समान हैं → U भी N की संतान है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T + U → T, U (और V) का पिता है → N, U और V की दूसरी जनक, माता है → T और N पति-पत्नी हैं → T, N का </span><span style=\"font-weight:bold;font-family:'Mangal'\">पति</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">S − T → S, T का भाई है → S, N के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पति का भाई</span><span style=\"font-family:'Mangal'\"> है</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः S, N के </span><span style=\"font-weight:bold;font-family:'Mangal'\">पति का भाई (विकल्प B)</span><span style=\"font-family:'Mangal'\"> है.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अंग्रेज़ी वर्णमाला क्रम के आधार पर KRQD का संबंध PNTB से एक निश्चित प्रकार से है. उसी प्रकार BHXG का संबंध GDAE से है. समान तर्क के अनुसार MQPJ का संबंध निम्नलिखित में से किससे है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RMTH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RMSH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">QMSH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">RNSH</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">KRQD → PNTB: K + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">P</span><span style=\"font-family:'Mangal'\">, R − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">N</span><span style=\"font-family:'Mangal'\">, Q + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">T</span><span style=\"font-family:'Mangal'\">, D − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">B</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">BHXG → GDAE: B + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">G</span><span style=\"font-family:'Mangal'\">, H − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">D</span><span style=\"font-family:'Mangal'\">, X + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">A</span><span style=\"font-family:'Mangal'\">, G − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">E</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">नियम: (+5, −4, +3, −2)</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">MQPJ → M + 5 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">R</span><span style=\"font-family:'Mangal'\">, Q − 4 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">M</span><span style=\"font-family:'Mangal'\">, P + 3 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">S</span><span style=\"font-family:'Mangal'\">, J − 2 = </span><span style=\"font-weight:bold;font-family:'Mangal'\">H</span><span style=\"font-family:'Mangal'\"> → RMSH</span></p><p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">अतः MQPJ का संबंध </span><span style=\"font-weight:bold;font-family:'Mangal'\">RMSH (विकल्प B)</span><span style=\"font-family:'Mangal'\"> से है.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह मित्र P, Q, R, S, T और U एक वृत्ताकार मेज़ के चारों ओर केंद्र की ओर मुख करके बैठे हैं. R, P के दाएँ दूसरे स्थान पर बैठा है. Q के बाएँ से गिनने पर Q और S के बीच केवल एक व्यक्ति बैठा है. T, R के ठीक बाएँ बैठा है. U, P का निकटतम पड़ोसी नहीं है. S के बाएँ तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Q</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:2pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">छह स्थान; केंद्र की ओर मुख वाले व्यक्तियों के लिए \"बायाँ\" = दक्षिणावर्त, \"दायाँ\
