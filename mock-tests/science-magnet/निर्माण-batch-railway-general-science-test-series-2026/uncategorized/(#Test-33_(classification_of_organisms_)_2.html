<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>66.) #Test-33 (classification of organisms  - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is an endemic species found only in India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Nilgiri tahr</span><span>                 </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Tiger</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Elephant</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Elephant</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-family:'Arial Unicode MS';font-size:12pt\">Endemic species are naturally restricted to a particular geographical region. Nilgiri tahr, Lion-tailed macaque, Nepenthes khasiana and Neelakurinji are endemic species found in India.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which condition characterises a biodiversity hotspot?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Low number of species and no habitat loss</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Large number of migratory species only</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Large geographical area only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Large number of endemic species and significant habitat loss</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-family:'Arial Unicode MS';font-size:12pt\">Regions that support a large number of endemic species and have undergone significant habitat loss are known as biodiversity hotspots.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is NOT a global biodiversity hotspot associated with India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Western Ghats</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Thar Desert</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Himalayas</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Indo-Burma</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-family:'Arial Unicode MS';font-size:12pt\">Western Ghats, Indo-Burma, Himalayas and Sundaland are global biodiversity hotspots associated with India. Indo-Burma includes North East India, while Sundaland includes the Nicobar Islands.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Aristotle mainly grouped animals on the basis of which characteristic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cell structure</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Mode of nutrition</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Habitat</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>DNA similarity</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-family:'Arial Unicode MS';font-size:12pt\">Aristotle grouped animals according to their habitat—land, water and air. He also used their external appearances. This system had limitations because it depended mainly on easily observable external characteristics.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which two kingdoms were included in the two-kingdom classification system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Monera and Protista</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Protista and Fungi</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Plantae and Fungi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Plantae and Animalia</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-family:'Arial Unicode MS';font-size:12pt\">In the two-kingdom system, all living organisms were divided into Plantae and Animalia. Plantae included organisms that synthesise their own food, while Animalia included organisms that depend on other organisms for food.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Why was the kingdom Protista introduced in the three-kingdom classification system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>To include all multicellular animals</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>To include unicellular microscopic organisms</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>To include only fungi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>To include all photosynthetic organisms</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Organisms such as Amoeba and Paramecium are unicellular and could not be properly placed in Plantae or Animalia. Therefore, a third kingdom, Protista, was introduced to include unicellular microscopic organisms.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which feature led to the separation of bacteria from Protista into the kingdom Monera?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Bacteria lack a true membrane-bound nucleus</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Bacteria are always multicellular</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Bacteria have a chitin cell wall</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Bacteria are always heterotrophic</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Amoeba has a true membrane-bound nucleus, whereas bacteria do not. This important cellular difference led to bacteria being placed in a separate kingdom called Monera.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which scientist proposed the five-kingdom classification in 1969?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Aristotle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Carolus Linnaeus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Ernst Haeckel</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Robert H. Whittaker</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Robert H. Whittaker proposed the five-kingdom classification in 1969, grouping living organisms into Monera, Protista, Fungi, Plantae and Animalia.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is a characteristic of Kingdom Monera?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Multicellular eukaryotes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Unicellular prokaryotes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Unicellular organisms with a true nucleus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Multicellular autotrophs only</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Bacteria and cyanobacteria are single-celled prokaryotes grouped under Kingdom Monera. Prokaryotic cells do not have a true membrane-bound nucleus.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which organisms were among the first to produce oxygen through photosynthesis?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Fungi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Protozoans</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cyanobacteria</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Bryophytes</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Cyanobacteria, also called blue-green algae, were among the first organisms to produce oxygen through photosynthesis. About 2.5 billion years ago, oxygen accumulated in the atmosphere and made the Earth suitable for other forms of life.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following correctly describes Kingdom Protista?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Multicellular prokaryotic organisms</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Only multicellular autotrophic organisms</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Single-celled organisms without a true nucleus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Single-celled eukaryotic organisms</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Protists are single-celled eukaryotic organisms that generally live in water or moist places. Some are autotrophic, while others are heterotrophic.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>The cell wall of fungi is mainly made up of:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Chitin</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cellulose</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Starch</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Protein</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Fungi are mostly multicellular eukaryotes with a cell wall made of chitin. They are heterotrophic and cannot make their own food.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Why is yeast placed in Kingdom Fungi even though it is unicellular?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>It performs photosynthesis</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>It has no cell wall</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>It is a prokaryote</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Its cell wall is made up of chitin</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Yeast is an exception because it is a unicellular fungus. It is placed under Kingdom Fungi because its cell wall is made up of chitin.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following fungi are used to make enzymes and antibiotics?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Aspergillus and Penicillium</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Yeast and mushroom</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Rhizobium and Aspergillus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Lactobacillus and Penicillium</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Aspergillus and Penicillium are used to make enzymes and antibiotics. Fungi are also important decomposers and help in recycling nutrients.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is an example of Thallophyta?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Marchantia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Fern</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spirogyra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Pine</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Arial Unicode MS'\">Spirogyra is an example of Thallophyta. Thallophytes are among the simplest plant forms and are mostly found in water or moist environments.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which structures perform root-like functions in bryophytes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Mycelia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Thallus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Rhizoids</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cones</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bryophytes have root-like structures called rhizoids and may also possess simple stem-like and leaf-like structures. They generally grow in moist and shady places.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Why are bryophytes called the ‘amphibians of the plant kingdom’?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They live permanently in water</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They possess both roots and flowers</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They produce seeds in water</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They live on land but require water for reproduction</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Bryophytes can live on moist land, but water is required for their reproduction. Therefore, they are called the ‘amphibians of the plant kingdom’.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is an example of Bryophyta?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spirogyra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Marchantia</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Fern</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Pine</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Marchantia and moss are examples of Bryophyta. Bryophytes commonly grow as green mats in moist and shady places, especially during the monsoon.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which feature distinguishes Pteridophytes from Bryophytes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Presence of vascular tissues</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Dependence on water for reproduction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Absence of seeds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Ability to live on land</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pteridophytes possess specialised vascular tissues called xylem and phloem, which transport water and food throughout the plant. Bryophytes lack vascular tissues.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is a characteristic of Pteridophytes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They produce flowers and fruits</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They possess true roots, stems and leaves</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Their seeds are exposed on cones</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>They lack vascular tissues</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Pteridophytes, such as ferns, possess true roots, stems and leaves. They also have well-developed vascular tissues for transportation.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which feature of Gymnosperms helps reduce water loss?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Broad leaves</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Absence of roots</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Soft stems</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Needle-like or scale-like leaves</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Gymnosperms are well-adapted to cold and dry regions. Their needle-like or scale-like leaves reduce water loss and help them withstand harsh conditions.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span>Which of the following is an example of Gymnosperms?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Pine</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Moss</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spirogyra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Marchantia</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Pines and cycads are Gymnosperms. They are well-adapted to cold and dry regions and do not require aquatic conditions for fertilisation.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which statement about Pteridophytes is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They produce seeds but not flowers</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They do not require water for reproduction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They require aquatic conditions for reproduction and do not produce seeds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">They lack true roots, stems and leaves</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Pteridophytes are adapted to land and possess vascular tissues, but they still require aquatic conditions for reproduction and do not produce seeds.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following is a major criterion for dividing animals into Non-chordata and Chordata?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Presence or absence of a notochord</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Presence or absence of legs</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Mode of nutrition</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Type of habitat</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">A major criterion for classifying animals is the presence or absence of a notochord, which is a flexible rod-shaped structure. Non-chordates lack a notochord, whereas chordates possess it at least during some stage of life.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following is a characteristic of Porifera?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Body has numerous pores</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Body is divided into segments</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Jointed legs are present</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spiny skin is present</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Poriferans have numerous pores on their body. Water enters through these pores and circulates through a canal system, helping in feeding, respiration and removal of wastes.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which special cells are present in Cnidarians for capturing prey and defence?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Collar cells</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Stinging cells</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Flame cells</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Blood cells</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Cnidarians possess specialised stinging cells on their tentacles. These cells help them capture prey and protect themselves from predators.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which feature is characteristic of Platyhelminthes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cylindrical and unsegmented body</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Jointed appendages</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Flat, ribbon-like body</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spiny skin</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Platyhelminthes are commonly called flatworms because they have a flat, ribbon-like body. Some are free-living, while many are parasites.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which feature distinguishes Nematoda from Platyhelminthes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Presence of jointed legs</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Segmented body</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Presence of a shell</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Cylindrical, unsegmented body</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Nematodes are commonly called roundworms. They have a long, cylindrical and unsegmented body, unlike the flat body of Platyhelminthes.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which feature is characteristic of Arthropoda?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Jointed appendages and a hard external skeleton</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Soft body with a muscular foot</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Hard internal skeleton of calcium carbonate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Absence of body segmentation</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Arthropods have jointed appendages, segmented bodies and a hard external skeleton. Insects, crabs and spiders belong to this group.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which of the following is a characteristic of Mollusca?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Jointed appendages</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Numerous pores</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Soft body with a distinct head, muscular foot and hump</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Spiny skin with a notochord</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Molluscs have soft bodies with a distinct head, a muscular foot and a hump. In many molluscs, a shell develops to protect the soft body. Snails, squids and octopuses are examples.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Vertebrates are classified into how many major groups?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Four</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Five</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Eight</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Vertebrates are classified into five groups—fish, amphibians, reptiles, birds and mammals based on broad patterns of habitat use, body covering and reproduction.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which structures help fish to move and breathe in water?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Fins and gills</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Wings and lungs</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Feathers and hollow bones</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Thick fur and lungs</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">Fins and gills are structural adaptations in fish. Fins help them move efficiently through water, while gills allow them to breathe in water.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which structural feature in mammals improves the survival of their young ones?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Gills</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Scales</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Mammary glands</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Exoskeleton</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">In mammals, mammary glands represent an important structural and functional change. They improve the survival of young ones by providing nourishment.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">Which is the correct sequence of taxonomic categories from the broadest to the most specific level?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Kingdom </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Class </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Phylum </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Order </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Family </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Genus </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Species</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Kingdom </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Phylum </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Class </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Order </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Family </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Genus </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Species</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Species </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Genus </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Family </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Order </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Class </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Phylum </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Kingdom</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:8pt;font-size:12pt\"><span>Kingdom </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Phylum </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Order </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Class </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Family </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Species </span><span style=\"font-family:'Arial Unicode MS'\">→ </span><span>Genus</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt\"><span style=\"font-size:12pt;font-family:'Mangal'\">The correct hierarchy is Kingdom </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Phylum </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Class </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Order </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Family </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Genus </span><span style=\"font-size:12pt\">→</span><span style=\"font-size:12pt;font-family:'Mangal'\"> Species. Classification moves from broad groups towards smaller and more specific groups.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:11pt;font-size:12pt\"><span style=\"font-family:'Mangal'\">What is the genus of a tiger?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:8p
