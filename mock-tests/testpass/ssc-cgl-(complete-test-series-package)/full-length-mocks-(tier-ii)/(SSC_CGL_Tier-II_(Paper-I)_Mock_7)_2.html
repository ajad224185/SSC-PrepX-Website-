<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>25.) SSC CGL Tier-II (Paper-I) Mock 7 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

antage from something, especially a trust, will, or life insurance policy.\n  <br> \n  <b>Boisterous-</b> noisy, energetic, and cheerful.\n  <br> \n  <b>Benevolent-</b> well-meaning and kindly.\n  <br> \n  <b>Boring-</b> not interesting; tedious.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>Select the most appropriate meaning of the highlighted idiom.</b> \n  <br> They were sunbathing \n  <b>in their birthday suits</b>.\n  <br>", "option1": "Not wearing any clothes\n  <br>", "option2": "A suit which covers one’s entire body\n  <br>", "option3": "Birthday celebrations\n  <br>", "option4": "A suit which is designed for only birthday functions\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>In your birthday suit- </b>not wearing any clothes.\n  <br>Used in a sentence- The child was in birthday suit and ran about the yard.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "<b>Select the option that can be used as a one-word substitute for the given group of words.</b> \n  <br>A person who loves and collects books\n  <br>", "option1": "Booker\n  <br>", "option2": "Bibliophile\n  <br>", "option3": "Bookworm\n  <br>", "option4": "Biographer\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Bibliophile-</b> a person who collects or has a great love of books.\n  <br>Meanings of other options are as follows:\n  <br> \n  <b>Booker-</b> a person employed to engage performers for a theatre or similar.\n  <br> \n  <b>Bookworm-</b> a person who enjoys reading.\n  <br> \n  <b>Biographer-</b> a person who writes an account of someone's life.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "<b>Select the most appropriate meaning of the highlighted idiom. </b> \n  <br>The coach was trying to \n  <b>twist the player’s arm</b> by asking him to practice throughout the day.\n  <br>", "option1": "To try to force someone to do something\n  <br>", "option2": "To refrain from resting\n  <br>", "option3": "To train someone in warfare\n  <br>", "option4": "To console the weak\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Twist someone’s arm</b>-force someone to do something.\n  <br>Used in a sentence- I've twisted his arm and he'll get you some tickets.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the most appropriate ANTONYM of the given word.\n  <br>Fanatic\n  <br>", "option1": "Extremist\n  <br>", "option2": "Tolerant\n  <br>", "option3": "Lunatic\n  <br>", "option4": "Fantastic\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Fanatic-</b> a person filled with excessive and single-minded zeal, especially for an extreme religious or political cause.\n  <br>Synonyms-zealot, extremist, militant, devotee.\n  <br>Antonyms-conservative, \n  <b>tolerant</b>, moderate.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Extremist-</b> a person who holds extreme political or religious views, especially one who advocates illegal, violent, or other extreme action.\n  <br> \n  <b>Tolerant-</b> showing willingness to allow the existence of opinions or behaviour that one does not necessarily agree with.\n  <br> \n  <b>Lunatic-</b> a person who is mentally ill (not in technical use).\n  <br> \n  <b>Fantastic-</b> extraordinarily good or attractive.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the INCORRECTLY spelt word.\n  <br>", "option1": "Occesion\n  <br>", "option2": "Humorous\n  <br>", "option3": "Mysterious\n  <br>", "option4": "Scissors\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct spelling of the word is ‘Occasion’ which means ‘a particular event, or the time at which it takes place.’\n  <br>All other options are correctly spelled and their meanings are as follows:\n  <br> \n  <b>Humorous-</b> causing laughter and amusement; comic.\n  <br> \n  <b>Mysterious-</b> difficult or impossible to understand, explain, or identify.\n  <br> \n  <b>Scissors-</b> an instrument used for cutting cloth, paper, and other material, consisting of two blades laid one on top of the other and fastened in the middle so as to allow them to be opened and closed by a thumb and finger inserted through rings on the end of their handles.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the most appropriate meaning of the given idiom.\n  <br>Cast aside\n  <br>", "option1": "To blow up\n  <br>", "option2": "To bear with\n  <br>", "option3": "To display\n  <br>", "option4": "To reject\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Cast aside-</b> discard or reject someone or something.\n  <br>Used in a sentence- They cast aside the principles of their youth.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the option that can be used as a one-word substitute for the given group of words. \n  <br>A group of policemen\n  <br>", "option1": "rosary\n  <br>", "option2": "shoal\n  <br>", "option3": "posse\n  <br>", "option4": "team\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A group of policemen is called posse. Hence, option(c) is the correct answer.\n  <br> Rosary: a string of beads for keeping count in a rosary.\n  <br> Shoal: a large number of fish swimming together.\n  <br> Team: a group of players forming one side in a competitive game.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "<b>Fill in the blank with the most appropriate option.</b> \n  <br>When Romeo first laid eyes on Juliet, he was struck with such ____________ that his need for her became like a drug that could only be satisfied by returned feelings.\n  <br>", "option1": "Cacophony\n  <br>", "option2": "Riposte\n  <br>", "option3": "Limerence\n  <br>", "option4": "Sanctimony\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘limerence’ to fill in the blank.\n  <br> \n  <b>Limerence</b>- the state of being obsessively infatuated with someone.\n  <br> \n  <b>Cacophony</b>- a harsh discordant mixture of sounds.\n  <br> \n  <b>Riposte</b>- a quick, clever reply to an insult or criticism.\n  <br> \n  <b>Sanctimony</b>- the action or practice of acting as if one were morally superior to other people.\n  <br> As per the meanings of all the options given ‘limerence’ is the most appropriate option to fill in the blank.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "<b>Fill in the blank with the most appropriate option.</b> \n  <br>It can be used to treat __________ cerebrovascular disease, centrically retinitis, arteriosclerosis, coronary heart disease, pre-block syndrome, thrombophlebitis, etc.\n  <br>", "option1": "Obdurate\n  <br>", "option2": "Heresy\n  <br>", "option3": "Otiose\n  <br>", "option4": "Postulate\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\"Obdurate\" means stubborn or unyielding, and it fits the context of the sentence.\n  <br>Meanings of the options:\n  <br> (a) Obdurate - stubborn or unyielding.\n  <br> (b) Heresy - a belief or opinion that contradicts established religious or social doctrines.\n  <br> (c) Otiose - useless or futile.\n  <br> (d) Postulate - to propose or assume the existence of something as a basis for reasoning or argument.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Fill in the blank with the most appropriate option.</b> \n  <br>I shall try to moderate my reply, despite the ________ terms of the question. \n  <br>", "option1": "Sentiment\n  <br>", "option2": "Accidental\n  <br>", "option3": "Sententious\n  <br>", "option4": "Plagiarized\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence implies that the question was phrased in a pompous or moralizing manner, and the speaker is trying to respond in a measured or reasonable way.\n  <br> \"Sententious\" means using moralizing or pompous language, which fits the context of the sentence.\n  <br>Meanings of the options:\n  <br> (a) Sentiment - an emotion or feeling.\n  <br> (b) Accidental - happening by chance or unintentionally.\n  <br> (c) Sententious - using moralizing or pompous language.\n  <br> (d) Plagiarised - copied or stolen from someone else's work.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Parts of the given sentence have been given as options. One of them contains a grammatical error. Select the option that has the error. </b> \n  <br>You have to come in with an idea before the deadline.\n  <br>", "option1": "You have to \n  <br>", "option2": "before the deadline.\n  <br>", "option3": "come in with an idea\n  <br>", "option4": "No Error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use phrasal verb ‘come up’ instead of ‘come in’ to correct the sentence.\n  <br> \n  <b>Come up</b>- (of an issue, situation, or problem) occur or present itself, especially unexpectedly.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Select the most appropriate option that can substitute the highlighted segment in the given sentence.</b> \n  <br>He seldom watches films, \n  <b>does he?</b> \n  <br>", "option1": "Doesn’t he?\n  <br>", "option2": "Shall he?\n  <br>", "option3": "Isn’t he?\n  <br>", "option4": "No improvement\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>The given sentence is grammatically and contextually correct.\n  <br> Question tags are the small questions that often come at the ends of sentences in speech.\n  <br> If the main clause is positive, the question tag is usually negative, and if the main clause is negative, the question tag is positive. Some words are negative in meaning. \n  <br> For example - hardly, seldom, scarcely, rarely, barely, etc. Hence, they will take positive question tags after them.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Select the most appropriate option that can substitute the highlighted segment in the given sentence.</b> \n  <br>The council endeavoured \n  <b>to set up on</b> a system of appeals in the case of bishops, in which the see of Rome was made to play a great part.\n  <br>", "option1": "to set off\n  <br>", "option2": "to set forward\n  <br>", "option3": "to set over\n  <br>", "option4": "to set up\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Substitute ‘to set up on’ with ‘to set up’ to correct the sentence.\n  <br> \n  <b>Set up</b>- establish a business, institution, or other organization.\n  <br> Use of ‘on’ is redundant in the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the correct active or passive form of the given sentence.</b> \n  <br>Surya drove the truck to the depot.\n  <br>", "option1": "The truck was drove by Surya to the depot.\n  <br>", "option2": "The truck was driving by Surya to the depot.\n  <br>", "option3": "The truck is being driven by Surya to the depot.\n  <br>", "option4": "The truck was driven by Surya to the depot.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice: </b> In Active voice the subject is the one doing the action.\n  <br> \n  <b>Passive Voice:</b> In Passive voice the subject is the recipient of the action.\n  <br> To convert active voice into passive voice the object becomes the subject and the subject becomes the object. Subject + verb + object Object+3rd form of verb + by +Subject.\n  <br>  In Simple Past Tense as presented in the question the structure for changing tense into active to passive is\n  <br> Subject + V2+ object Object+ was/were V3+ by + subject.\n  <br> For Example- Active- I did yoga.\n  <br> Passive- Yoga was done by me.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Tुध ीियियथing ौधnपधncध ुोौ ृधधn ौूिiप inपय ीयहन ौधgंधnपौ ोnक giॅधn ोौ यूपiयnौ. Iकधnपiीद पुध ौधgंधnप पुोप cयnपोinौ ो gनोंंोपicोि धननयन. Tुधn cोंध पुध थयना in cियिधgध, यनiginोि पुधंध थनiपध थiपु nधथ iकधोिस यी cयंूयौiपiयn यन ोप िधोौप nधथ ंधपुयकौ यी ौहggधौपing पुयौध iकधोिस.", "option1": "Then came the work in college,\n  <br>", "option2": "ideals of composition or at least\n  <br>", "option3": "new methods of suggesting those ideals.\n  <br>", "option4": "original theme write with new\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in part (d) of the sentence. \n  <br> The verb \"write\" should be changed to its past participle form, \"written,\" to maintain grammatical agreement with the subject \"original theme.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "<b>Select the option that will improve the highlighted part of the given sentence.</b> \n  <br>Sandeep and Gaurav are both great singers, \n  <b>but Sandeep is the best.</b> \n  <br>", "option1": "but Sandeep is one of the best\n  <br>", "option2": "but Sandeep is better \n  <br>", "option3": "and yet both of are equally good at it\n  <br>", "option4": "but Sandeep is good \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘but Sandeep is better’ instead of ‘but Sandeep is the best’ to improve the sentence.\n  <br> When there is a comparison between any two things or people comparative degree of comparison has to be used.\n  <br> Comparative degree of ‘good’ is ‘better’, superlative degree of ‘good’ is ‘best’.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "<b>Select the option that expresses the given sentence in active voice. </b> \n  <br>By whom was the decision to cancel the meeting made?\n  <br>", "option1": "Who made the decision to cancel the meeting?\n  <br>", "option2": "The decision to cancel the meeting was made by whom?\n  <br>", "option3": "The decision was made to cancel the meeting by whom?\n  <br>", "option4": "Whose decision was it to cancel the meeting?\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the sentence \"By whom was the decision to cancel the meeting made?\", the subject is \"the decision,\" and it is being acted upon by the object, \"by whom.\" \n  <br> This sentence is in passive voice.\n  <br> To convert this sentence into active voice, we need to change the sentence so that the subject performs the action. \n  <br>The active voice version of the sentence is \"Who made the decision to cancel the meeting?\". In this sentence, the subject is \"who,\" and it performs the action of canceling the meeting.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "<b>Select the option that expresses the given sentence in passive voice. </b> \n  <br>\"The artist is painting the mural.\"\n  <br>", "option1": "The murals are being painted by the artist.\n  <br>", "option2": "The mural was being painted by the artist.\n  <br>", "option3": "The mural is painted by the artist.\n  <br>", "option4": "The mural is being painted by the artist.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "To convert this active voice sentence into passive voice, we need to follow the appropriate rules. \n  <br> Since the active voice sentence is in the present continuous tense (\"is painting\"), we need to change it to the passive voice while maintaining the tense.\n  <br> The correct conversion to the present continuous tense in passive voice is \"is being painted,\" which is found in option (d). The other options don't follow the correct tense conversion or include the subject.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "<b>The following sentence has been split into four segments and given as options. Identify the segment that contains a grammatical error.</b> \n  <br>The man besides her was wearing a brown suit and hat.\n  <br>", "option1": "her was wearing\n  <br>", "option2": "a brown suit\n  <br>", "option3": "The man besides\n  <br>", "option4": "and hat.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use of ‘besides’ is wrong in the sentence.\n  <br> \n  <b>Beside- </b>at the side of; next to.\n  <br> \n  <b>Besides- </b>in addition to; apart from.\n  <br> Though both of them sound similar they have different meanings and used in different context.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "<b> Choose the correct indirect speech conversion of the following direct speech:</b> \n  <br>Michael said, \"I am going to the store this evening.\"\n  <br>", "option1": "Michael said that he was going to the store that evening.\n  <br>", "option2": "Michael said that he is going to the store this evening.\n  <br>", "option3": "Michael said that he would go to the store that evening.\n  <br>", "option4": "Michael said that he went to the store this evening.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "To convert this direct speech into indirect speech, we need to follow the appropriate rules. Since the direct speech is in the present continuous tense (\"I am going\"), we need to change it to the past continuous tense in the indirect speech.\n  <br> The correct conversion to the past continuous tense is \"he was going,\" which is found in option (a). The other options don't follow the correct tense conversion.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.</b> \n  <br>From the options P, Q, R, and S select the appropriate sentences for S2 and S3, respectively.\n  <br>( de more food for her neighbors, as the passage states, \"For her first wish, she asked the fairy to make her garden grow twice as fast so she could share even more food with her neighbors.\"\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Which of the following best describes Sarah's motivation for her second wish?</b> \n  <br>", "option1": "Her desire to become famous\n  <br>", "option2": "Her experience witnessing illness in her village\n  <br>", "option3": "Her eagerness to show off her healing powers\n  <br>", "option4": "Her wish to gain control over the village\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Her experience witnessing illness in her village, as the passage states, \"For her second wish, she asked for the ability to heal the sick, as she had seen many people in the village suffer from illness.\"\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>How did Sarah's final wish differ from her first two wishes?</b> \n  <br>", "option1": "It was less selfless and more focused on her own desires\n  <br>", "option2": "It was focused on helping others instead of herself\n  <br>", "option3": "It was more focused on material wealth\n  <br>", "option4": "It was unrelated to the village\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) It was less selfless and more focused on her own desires, as the passage states, \"Finally, Sarah wished for something purely for herself. She wished for the ability to fly, so she could explore the world and see all its beauty.\"\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>Considering the entire passage, which of the following best describes Sarah's character?</b> \n  <br>", "option1": "Ambitious and cunning\n  <br>", "option2": "Kind-hearted and generous\n  <br>", "option3": "Adventurous and reckless\n  <br>", "option4": "Prideful and envious\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Kind-hearted and generous, as the passage consistently describes Sarah as a person who is eager to help others, shares her harvest with her neighbors, and uses her wishes to benefit both her community and herself in a balanced way. The passage states, \"Sarah was beloved by everyone in the village, for she always had a smile on her face and was eager to help anyone in need,\" which further supports the idea that she is kind-hearted and generous.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "<b>Select the most appropriate option for blank no. 1.</b> \n  <br>", "option1": "hoarded\n  <br>", "option2": "tucked\n  <br>", "option3": "expended\n  <br>", "option4": "submerged\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) tucked, as it means hidden or placed out of the way. \n  <br>The other options are:\n  <br> (a) hoarded: accumulated and hidden away, often secretly.\n  <br> (c) expended: used up or consumed.\n  <br> (d) submerged: covered or hidden under water.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>Select the most appropriate option for blank no. 2.</b> \n  <br>", "option1": "winding\n  <br>", "option2": "arid\n  <br>", "option3": "parallel\n  <br>", "option4": "cluttered\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) winding, as it means following a twisting or curving course. \n  <br>The other options are:\n  <br> (b) arid: lacking in interest or excitement; dry.\n  <br> (c) parallel: extending in the same direction and always the same distance apart.\n  <br> (d) cluttered: filled with a messy or disorganized collection of things.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>Select the most appropriate option for blank no. 3.</b> \n  <br>", "option1": "suffused\n  <br>", "option2": "bereft\n  <br>", "option3": "repelled\n  <br>", "option4": "fumigated\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) suffused, as it means gradually spread through or over. The other options are:\n  <br> (b) bereft: deprived of or lacking something.\n  <br> (c) repelled: driven or forced back or away.\n  <br> (d) fumigated: exposed to fumes, typically in order to disinfect or eradicate pests.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>Select the most appropriate option for blank no. 4.</b> \n  <br>", "option1": "whimsical\n  <br>", "option2": "negligible\n  <br>", "option3": "austere\n  <br>", "option4": "cumbersome\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) whimsical, as it means playfully quaint or fanciful. The other options are:\n  <br> (b) negligible: so small or unimportant as to be not worth considering.\n  <br> (c) austere: severe or strict in manner, attitude, or appearance.\n  <br> (d) cumbersome: large or heavy and therefore difficult to carry or use.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>Why is M0 considered significant in a country's financial system?</b> \n  <br>", "option1": "It includes near-money assets such as savings accounts.\n  <br>", "option2": "It encompasses demand deposits held by the public at commercial banks.\n  <br>", "option3": "It represents the foundation of a country's money supply and is directly controlled by the central bank.\n  <br>", "option4": "It provides a more comprehensive understanding of the economy's liquidity.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) It represents the foundation of a country's money supply and is directly controlled by the central bank. M0 is significant because it forms the basis of the money supply and can be directly influenced by the central bank's actions.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>Which of the following components is NOT included in the M2 monetary aggregate?</b> \n  <br>", "option1": "Physical currency, such as coins and banknotes\n  <br>", "option2": "Commercial banks' deposits held with the central bank\n  <br>", "option3": "Demand deposits held by the public at commercial banks\n  <br>", "option4": "Long-term, interest-bearing instruments\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) Long-term, interest-bearing instruments. M2 includes near-money assets such as savings accounts, money market accounts, and other short-term, interest-bearing instruments, but not long-term ones.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>How do central banks use the relationship between M0, M1, and M2 in managing the economy?</b> \n  <br>", "option1": "By focusing solely on M0 as it is the most comprehensive measure of money supply\n  <br>", "option2": "By monitoring the fluctuations in these aggregates to better manage the money supply and maintain a stable economy\n  <br>", "option3": "By ignoring the relationship between these aggregates and relying only on fiscal policy\n  <br>", "option4": "By prioritizing M2 as it is the least liquid and therefore least relevant for economic stability\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) By monitoring the fluctuations in these aggregates to better manage the money supply and maintain a stable economy. Central banks use the relationship between M0, M1, and M2 to make informed decisions about interest rates, inflation, and economic growth. Understanding these monetary aggregates and their fluctuations enables central banks to maintain a stable and healthy economy by adjusting monetary policy as needed.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>According to the passage, what are the three economic challenges that the Indian government is grappling with?</b> \n  <br>", "option1": "Inflation, bilateral trade agreements, and secure employment\n  <br>", "option2": "Interest rates, multilateral trade agreements, and income inequality\n  <br>", "option3": "Inflation, interest rates, exchange rates, trade agreements, and secure employment\n  <br>", "option4": "Exchange rates, industrial growth, and human development\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Inflation, interest rates, exchange rates, trade agreements, and secure employment. These are the three economic challenges mentioned in the passage that the Indian government is facing.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>Which of the following statements best describes the economists' views on solving the \"poly-crisis\" in India?</b> \n  <br>", "option1": "Economists have a systemic solution and agree on the prioritization of economic challenges.\n  <br>", "option2": "There is a consensus among economists on how to address the separate parts of the crisis.\n  <br>", "option3": "Economists are divided on various aspects of solving the crisis, including central bank independence and inflation.\n  <br>", "option4": "Economists unanimously support prioritizing employment over inflation.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Economists are divided on various aspects of solving the crisis, including central bank independence and inflation. The passage states that there is no consensus among economists on how to address the separate parts of the crisis.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>What is one key factor that has contributed to China's remarkable economic growth and Vietnam's recent spurt, as suggested in the passage?</b> \n  <br>", "option1": "Adoption of free trade policies\n  <br>", "option2": "High levels of human development, including universal education and good public health systems\n  <br>", "option3": "A focus on industrial technology development\n  <br>", "option4": "Rapid growth in per capita income\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) High levels of human development, including universal education and good public health systems. The passage suggests that these factors contributed to China's and Vietnam's economic growth when they opened up to foreign investors.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "<b>According to the passage, what was the disagreement between trade-and-growth economists like Jagdish Bhagwati and economists like Amartya Sen who advocated the human development theory of growth?</b> \n  <br>", "option1": "Jोgकiौु Bुोgथोपi ृिधiधॅधक in ूनiयनiपप्रing नधकiौपनiृहपiयn यी थधोिपु, थुiिध Aंोनपदो Sधn ीयcहौधक यn incनधोौing पुध ौप्रध यी पुध धcयnयंic ूiध.", "option2": "Jagdish Bhagwati argued that basic human development must precede growth, while Amartya Sen believed that increasing the size of the economic pie must come first.\n  <br>", "option3": "Jagdish Bhagwati believed that the size of the economic pie must be increased before it can be redistributed, while Amartya Sen argued that basic human development must precede growth.\n  <br>", "option4": "Amartya Sen focused on the importance of trade agreements, while Jagdish Bhagwati emphasized the role of human development in economic growth.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Jagdish Bhagwati believed that the size of the economic pie must be increased before it can be redistributed, while Amartya Sen argued that basic human development must precede growth. The passage highlights this disagreement between the two economists.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "ब्रह्मपुत्र नदी का उद्गम कहाँ से होता है?\n  <br>", "option1": "कैलाश श्रेणी का चेमायुंगडुंग ग्लेशियर\n  <br>", "option2": "मैपचाचुंगो के ग्लेशियर\n  <br>", "option3": "गैरसैंण के पास गढ़वाल पहाड़ियाँ\n  <br>", "option4": "नेपाल हिमालय में मिलम ग्लेशियर\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "ब्रह्मपुत्र नदी का उद्गम कैलाश श्रेणी के चेमायुंगडुंग ग्लेशियर से होता है। बंगाल की खाड़ी में गिरने से पहले यह चीन, भारत और बांग्लादेश से होकर बहती है।\n  <br> ब्रह्मपुत्र को तिब्बत में यारलुंग त्सांगपो, अरुणाचल प्रदेश में सियांग/दिहांग नदी और बांग्लादेश में जमुना के नाम से भी जाना जाता है।\n  <br> ब्रह्मपुत्र नदी भारत में आयतन के हिसाब से सबसे बड़ी नदी है।\n  <br> ब्रह्मपुत्र नदी की प्रमुख सहायक नदियाँ लोहित, दिबांग, सुबनसिरी, जियाभराली, धनसिरी, मानस, तोरसा, संकोश और तीस्ता हैं।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "निम्नलिखित में से किसने 'द लाइट ऑफ एशिया: द पोएम दैट डिफाइंड द बुद्धा' लिखा, जो अभूतपूर्व कविता 'द लाइट ऑफ एशिया' का वर्णन करेगा?\n  <br>", "option1": "जयराम रमेश\n  <br>", "option2": "सलमान रुश्दी\n  <br>", "option3": "चेतन भगत\n  <br>", "option4": "शशि थरूर\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "जयराम रमेश एक पूर्व भारतीय मंत्री हैं जिन्होंने 2021 में 'द लाइट ऑफ एशिया: द पोएम दैट डिफाइन्ड द बुद्धा' पुस्तक लिखी थी।\n  <br>यह पुस्तक सर एडविन अर्नोल्ड की कविता 'द लाइट ऑफ एशिया' पर एक टिप्पणी है, जो पहली बार 1879 में प्रकाशित हुई थी। रमेश की पुस्तक अर्नोल्ड की कविता की आधुनिक व्याख्या प्रदान करती है और समकालीन दुनिया के लिए बुद्ध की शिक्षाओं की प्रासंगिकता की पड़ताल करती है।\n  <br>जयराम रमेश भारतीय राष्ट्रीय कांग्रेस से संबंधित एक भारतीय राजनीतिज्ञ हैं। वह राज्यसभा में कर्नाटक राज्य का प्रतिनिधित्व करने वाले संसद सदस्य हैं।\n  <br> \n  <b>नोट -</b> रमेश को उनकी पुस्तक \"ए चेकर्ड ब्रिलिएंस: द मेनी लाइव्स ऑफ वीके कृष्णा मेनन\" के लिए 2020 कमलादेवी चट्टोपाध्याय एनआईएफ बुक पुरस्कार का विजेता घोषित किया गया।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "निम्नलिखित में से किस लोकप्रिय रसोई सामग्री को 'चीनी खाने वाला कवक' कहा जाता है?\n  <br>", "option1": "पाक चूर्ण\n  <br>", "option2": "ख़मीर\n  <br>", "option3": "सिरका\n  <br>", "option4": "केचप\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (b) खमीर है। यीस्ट एक एकल-कोशिका कवक है जिसका उपयोग बेकिंग से लेकर ब्रेड और अन्य पके हुए सामानों को खमीर करने में किया जाता है। इसका उपयोग बीयर और वाइन बनाने में भी किया जाता है।\n  <br>यीस्ट एक चीनी खाने वाला कवक है और यह चीनी को कार्बन डाइऑक्साइड और अल्कोहल में बदल देता है। कार्बन डाइऑक्साइड के बुलबुले के कारण पका हुआ माल ऊपर उठता है और बेकिंग के दौरान अल्कोहल वाष्पित हो जाता है।\n  <br>• यीस्ट का वैज्ञानिक नाम सैक्रोमाइसेस सेरेविसियाहै।\n  <br>पाक चूर्ण एक खमीरीकरण एजेंट है जिसमें बेकिंग सोडा और एक एसिड होता है, जैसे टार्टर की क्रीम।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "निम्नलिखित में से कौन अखिल भारतीय किसान कांग्रेस के पहले महासचिव थे?\n  <br>", "option1": "एन.जी. रंगा\n  <br>", "option2": "आचार्य नरेंद्र देव\n  <br>", "option3": "सरदार वल्लभभाई पटेल\n  <br>", "option4": "स्वामी सहजानंद सरस्वती\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "एन.जी. रंगा अखिल भारतीय किसान कांग्रेस के पहले महासचिव थे।\n  <br> एन. जी. रंगा, एक भारतीय स्वतंत्रता सेनानी, शास्त्रीय उदारवादी, सांसद और किसान नेता थे।\n  <br> वे स्वतंत्र पार्टी के संस्थापक अध्यक्ष थे।\n  <br> \n  <b>आचार्य नरेंद्र देव</b> एक समाजवादी नेता और भारतीय राष्ट्रीय कांग्रेस के सदस्य थे। वह एक समाजवादी राजनीतिक दल प्रजा सोशलिस्ट पार्टी के संस्थापक भी थे।\n  <br> \n  <b>सरदार वल्लभभाई पटेल</b> एक राष्ट्रवादी नेता और भारतीय राष्ट्रीय कांग्रेस के सदस्य थे। वह भारत के गृह मंत्री और भारत के पहले उप प्रधान मंत्री भी थे।\n  <br> \n  <b>स्वामी सहजानंद सरस्वती</b> एक हिंदू भिक्षु और समाज सुधारक थे। वह बिहार प्रांतीय किसान सभा के संस्थापक भी थे, जो एक किसान संगठन था जो किसानों के अधिकारों के लिए लड़ता था।\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "भारतीय राष्ट्रीय कांग्रेस के संबंध में निम्नलिखित में से कौन सा/से कथन सही है/हैं?\n  <br>A. भारतीय राष्ट्रीय कांग्रेस की स्थापना 1885 में हुई थी।\n  <br>B. भारतीय राष्ट्रीय कांग्रेस का पहला अधिवेशन बम्बई में हुआ।\n  <br>C. ए.ओ. ह्यूम ने भारतीय राष्ट्रीय कांग्रेस के गठन में महत्वपूर्ण भूमिका निभाई।\n  <br>", "option1": "केवल A और B\n  <br>", "option2": "केवल B और C\n  <br>", "option3": "A, B, और C\n  <br>", "option4": "केवल A और C\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "भारतीय राष्ट्रीय कांग्रेस की स्थापना 1885 में हुई थी। यह सत्य है। भारतीय राष्ट्रीय कांग्रेस की स्थापना 28 दिसंबर, 1885 को बॉम्बे (अब मुंबई) में हुई थी।\n  <br>भारतीय राष्ट्रीय कांग्रेस का पहला अधिवेशन बम्बई में हुआ। यह भी सत्य है। भारतीय राष्ट्रीय कांग्रेस का पहला अधिवेशन 28 से 31 दिसंबर, 1885 को बंबई में आयोजित किया गया था।\n  <br>ए.ओ. ह्यूम ने भारतीय राष्ट्रीय कांग्रेस के गठन में महत्वपूर्ण भूमिका निभाई। यह भी सत्य है।\n  <br>ए.ओ. ह्यूम एक सेवानिवृत्त ब्रिटिश सिविल सेवक थे जो भारत में बढ़ती अशांति से चिंतित थे। उन्होंने भारतीय राष्ट्रीय कांग्रेस के पहले महासचिव के रूप में भी कार्य किया।\n  <br>इसलिए, तीनों कथन सही हैं।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "हिमालय पर्वत श्रृंखला के संबंध में निम्नलिखित में से कौन सा/से कथन सही है/हैं?\n  <br>A. हिमालय विश्व की सबसे ऊँची पर्वत श्रृंखला है।\n  <br>B. हिमालय पांच देशों में फैला है: भारत, नेपाल, भूटान, चीन और पाकिस्तान।\n  <br>C. विश्व की सबसे ऊँची चोटी माउंट एवरेस्ट, हिमालय में स्थित है।\n  <br>", "option1": "केवल A और B\n  <br>", "option2": "केवल B और C\n  <br>", "option3": "A, B, और C\n  <br>", "option4": "केवल A और C\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c) है। हिमालय दुनिया की सबसे ऊंची पर्वत श्रृंखला है, जो पांच देशों तक फैली हुई है: भारत, नेपाल, भूटान, चीन और पाकिस्तान। विश्व की सबसे ऊँची चोटी माउंट एवरेस्ट हिमालय में स्थित है। इसलिए, तीनों कथन सही हैं।\n  <br>कथन A सही है क्योंकि हिमालय दुनिया की सबसे ऊंची पर्वत श्रृंखला है, जिसमें माउंट एवरेस्ट समुद्र तल से 29,032 फीट (8,848 मीटर) की ऊंचाई पर सबसे ऊंची चोटी है।\n  <br>कथन b सही है क्योंकि हिमालय पाँच देशों तक फैला है: भारत, नेपाल, भूटान, चीन और पाकिस्तान।\n  <br>कथन C सही है क्योंकि माउंट एवरेस्ट हिमालय में स्थित है।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "भारतीय संविधान का निम्नलिखित में से कौन सा अनुच्छेद सार्वजनिक रोजगार से संबंधित मामलों में भारत के सभी नागरिकों को अवसर की समानता की गारंटी देता है?\n  <br>", "option1": "अनुच्छेद 15\n  <br>", "option2": "अनुच्छेद 16 (1) और 16 (2)\n  <br>", "option3": "अनुच्छेद 16(3)\n  <br>", "option4": "अनुच्छेद 16 (3), (4), और (5)\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर b है)। भारतीय संविधान के अनुच्छेद 16(1) और 16(2) सार्वजनिक रोजगार से संबंधित मामलों में भारत के सभी नागरिकों को अवसर की समानता की गारंटी देते हैं।\n  <br>अनुच्छेद 16(1) में कहा गया है कि राज्य के अधीन किसी भी कार्यालय में रोजगार या नियुक्ति से संबंधित मामलों में सभी नागरिकों के लिए अवसर की समानता होगी। इसका मतलब यह है कि किसी भी नागरिक के साथ सार्वजनिक रोजगार में धर्म, नस्ल, जाति, लिंग, वंश, जन्म स्थान, निवास या इनमें से किसी के आधार पर भेदभाव नहीं किया जा सकता है।\n  <br>अनुच्छेद 16(2) में कहा गया है कि कोई भी नागरिक केवल धर्म, मूलवंश, जाति, लिंग, वंश, जन्म स्थान, निवास या इनमें से किसी के आधार पर किसी भी रोजगार या कार्यालय के लिए अयोग्य नहीं होगा या उसके साथ भेदभाव नहीं किया जाएगा। राज्य के अंतर्गत. इसका मतलब यह है कि राज्य सार्वजनिक रोजगार में किसी भी नागरिक के साथ भेदभाव नहीं कर सकता, भले ही वे नौकरी के लिए योग्य न हों।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "भारतीय दंड संहिता का मसौदा किसने तैयार किया था?\n  <br>", "option1": "लॉर्ड कैनिंग\n  <br>", "option2": "लॉर्ड मैकाले\n  <br>", "opt ही हैं। इसलिए, विकल्प (c) सही है।\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "निम्नलिखित में से किसने पंचतंत्र का फारसी भाषा में अनुवाद किया?\n  <br>", "option1": "फ़ैज़ी\n  <br>", "option2": "अब्राहम सरहिंद\n  <br>", "option3": "मौलाना शाह मोहम्मद शाहाबादी\n  <br>", "option4": "अबुल फज़ल\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "फ़ैज़ी एक फ़ारसी कवि और विद्वान थे जिन्होंने मुग़ल सम्राट अकबर के अधीन दरबारी के रूप में कार्य किया था। उन्हें अनवर-ए-सुहैली शीर्षक के तहत पंचतंत्र का फ़ारसी में अनुवाद करने का श्रेय दिया जाता है।\n  <br>अनुवाद का कार्य अकबर द्वारा करवाया गया था, जो पंचतंत्र को अपने फ़ारसी भाषी विषयों के लिए अधिक सुलभ बनाना चाहता था। फ़ैज़ी का अनुवाद एक बड़ी सफलता थी, और इसने फ़ारसी भाषी दुनिया भर में पंचतंत्र को लोकप्रिय बनाने में मदद की।\n  <br>इब्राहीम सरहिंद और मौलाना शाह मोहम्मद शाहाबादी भी पंचतंत्र के फ़ारसी में अनुवाद में शामिल थे, लेकिन उनका योगदान फ़ैज़ी जितना महत्वपूर्ण नहीं था। अबुल फज़ल एक इतिहासकार और दरबारी था जो अकबर के अधीन कार्यरत था।\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "निम्नलिखित में से कौन सा विदेशी यात्री शाहजहाँ के शासनकाल के दौरान भारत आया था?\n  <br>1. फ्रांसिस वर्नियर\n  <br>2. पीटर मुंडी\n  <br>3. निकोलाओन मनुची\n  <br>कोड:\n  <br>", "option1": "केवल 1\n  <br>", "option2": "केवल 2 और 3\n  <br>", "option3": "केवल 1 और 2\n  <br>", "option4": "1, 2 और 3\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>फ्रांसिस वर्नियर:</b> फ्रांसिस वर्नियर एक फ्रांसीसी यात्री था जो शाहजहाँ के शासनकाल के दौरान भारत आया था। उन्होंने एक सैन्य साहसी के रूप में कार्य किया और बाद में मुगल सम्राट की सेवा में एक जनरल बन गए।\n  <br> \n  <b>पीटर मुंडी:</b> पीटर मुंडी, जिन्हें पिएत्रो डेला वैले के नाम से भी जाना जाता है, एक इतालवी यात्री थे जिन्होंने शाहजहाँ के शासनकाल के दौरान भारत का दौरा किया था। उन्होंने भारत सहित मध्य पूर्व और एशिया में बड़े पैमाने पर यात्रा की और अपने यात्रा लेखों में अपनी टिप्पणियों और अनुभवो  "positive_marking": "1", "solution_text": "बिंद्यारानी देवी ने दक्षिण कोरिया में आयोजित एशियन वेटलिफ्टिंग चैंपियनशिप 2023 में महिलाओं के 55 किग्रा वर्ग में रजत पदक जीता।\n  <br> उन्होंने गैर-ओलंपिक 55 किग्रा वर्ग में कुल 194 किग्रा (स्नैच 83 किग्रा और क्लीन एंड जर्क में 111 किग्रा) वजन उठाया। चेन गुआन लिंग (चीन) ने 204 किग्रा (स्नैच 90 किग्रा + क्लीन एंड जर्क 114 किग्रा) के संयुक्त भार के साथ स्वर्ण पदक जीता और वो थी क्विन्ह न्हू (वियतनाम) ने 192 किग्रा के भार के साथ कांस्य पदक जीता।\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "सितवे बंदरगाह कहाँ है, जिसका उद्घाटन शिपमेंट हाल ही में कोलकाता बंदरगाह से किया गया था?\n  <br>", "option1": "म्यांमार\n  <br>", "option2": "भारत\n  <br>", "option3": "बांग्लादेश\n  <br>", "option4": "नेपाल\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "कोलकाता से उद्घाटन शिपमेंट, एमवी-आईटीटी लायन (V-273), 20,000 बैग सीमेंट लेकर 9 मई को म्यांमार के सिटवे बंदरगाह पर पहुंचने की उम्मीद है।\n  <br> भारत ने कलादान मल्टीमॉडल ट्रांजिट ट्रांसपोर्ट परियोजना के तहत म्यांमार में सिटवे बंदरगाह का संचालन किया है।\n  <br> बंदरगाह का निर्माण भारत सरकार की सहायता के तहत किया गया था और इसका उद्देश्य भारत और म्यांमार के बीच व्यापार और वाणिज्य को बढ़ावा देना है।\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "इनोवेशन इनक्यूबेशन रिसर्च एंड एंटरप्रेन्योरशिप सेंटर का उद्घाटन किस राज्य में किया गया?\n  <br>", "option1": "कर्नाटक\n  <br>", "option2": "आंध्र प्रदेश\n  <br>", "option3": "तेलंगाना\n  <br>", "option4": "महाराष्ट्र\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "भारत के तेलंगाना राज्य में केआईटीएस वारंगल परिसर में सेंटर फॉर इनोवेशन इनक्यूबेशन रिसर्च एंड एंटरप्रेन्योरशिप का उद्घाटन किया गया।\n  <br> तेलंगाना के आईटी मंत्री के तारक रामाराव ने केंद्र का उद्घाटन किया।\n  <br> इस केंद्र का उद्देश्य छात्र समुदाय में नवाचार और उद्यमिता को बढ़ावा देना और छात्रों, शिक्षकों और युवा शोधकर्ताओं के बीच अनुसंधान और नवीन कौशल विकसित कर text": "माइक्रोसॉफ्ट एक्सेल और अन्य स्प्रेडशीट प्रोग्राम में, कंट्रोल+स्पेस दबाने से सक्रिय सेल वाला पूरा कॉलम चयनित हो जाता है। एक या अधिक पंक्तियों और स्तंभों का चयन करने के लिए निम्नलिखित चरणों पर विचार करें:\n  <br>चरण: #1 पूरे कॉलम का चयन करने के लिए शीर्ष पर अक्षर का चयन करें या कॉलम में किसी भी सेल पर क्लिक करें और फिर कंट्रोल + स्पेस दबाएं।\n  <br>चरण: #2 संपूर्ण पंक्ति का चयन करने के लिए पंक्ति संख्या का चयन करें या पंक्ति में किसी भी सेल पर क्लिक करें और फिर शिफ्ट + स्पेस दबाएँ।\n  <br>चरण: #3 गैर-आसन्न पंक्तियों या स्तंभों का चयन करने के लिए, कंट्रोल दबाए रखें और पंक्ति या स्तंभ संख्याओं का चयन करें।\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "कंप्यूटर शब्दावली में, एसएमपीएस का पूर्ण रूप क्या है?\n  <br>", "option1": "स्विच्ड मोड पावर सप्लाई\n  <br>", "option2": "सेटल्ड मोड पावर सप्लाई\n  <br>", "option3": "स्विच मोड पैकेट स्विच\n  <br>", "option4": "सप्लाई मोड पैकेट स्विच\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> एसएमपीएस (SMPS) का अर्थ स्विच्ड-मोड पावर सप्लाई है। यह एक इलेक्ट्रॉनिक बिजली आपूर्ति है जो विद्युत ऊर्जा को कुशलतापूर्वक परिवर्तित करने के लिए एक स्विचिंग नियामक का उपयोग करती है।\n  <br> इसे स्विचिंग मोड पावर सप्लाई के रूप में भी जाना जाता है।\n  <br> यह बिजली आपूर्ति इकाई (पीएसयू) है जिसका उपयोग आमतौर पर कंप्यूटर में वोल्टेज को कंप्यूटर की स्वीकार्य सीमा में परिवर्तित करने के लिए किया जाता है।\n  <br> इस डिवाइस में पावर हैंडलिंग इलेक्ट्रॉनिक घटक हैं जो विद्युत शक्ति को कुशलतापूर्वक परिवर्तित करते हैं।\n  <br> स्विच्ड मोड पावर सप्लाई समग्र बिजली हानि को कम करने के लिए एक बेहतरीन पावर रूपांतरण तकनीक का उपयोग करती है।\n  <br> डिवाइस स्विचिंग रेगुलेटर का उपयोग करता है जो आउटपुट वोल्टेज को विनियमित और स्थिर करने के लिए लोड करंट को चालू और बंद करता है।\n  <br>", "question_heading": ""}, {"sr_no": 146, "question": "निम्नलिखित में से कौन सा यूनिक्स पर आधारित एक फ्री ओपन-सोर्स ऑपरेटिंग सिस्टम (OS) है?\n  <br>", "option1": "विंडोज़\n  <br>", "option2": "लिनक्स\n  <br>",
