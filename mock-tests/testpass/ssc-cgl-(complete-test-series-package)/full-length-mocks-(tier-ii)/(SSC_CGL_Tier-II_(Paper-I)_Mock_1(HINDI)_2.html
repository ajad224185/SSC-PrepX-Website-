the IBSA trio of BRICS\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) BRICS group's diplomatic bankruptcy and inability to secure UN Security Council membership.\n  <br>The relevant lines supporting this answer are: \"A formulation, frozen in time, patronizingly supporting ‘the aspiration’ of Brazil, India, and South Africa to play a greater role in the UN, figures in every BRICS communiqué, showing the grouping’s utter diplomatic bankruptcy.\"\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "Which of the following statements is correct?\n  <br>I. The headquarters of the World Bank is in New York.\n  <br>II. The International Monetary Fund (IMF) was established in the year 1944.\n  <br>", "option1": "Only II\n  <br>", "option2": "Both I and II\n  <br>", "option3": "Neither I nor II\n  <br>", "option4": "Only I\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The first statement is incorrect as the headquarters of the World Bank is in Washington, D.C., not New York. The second statement is correct. The IMF was established in 1944 at the Bretton Woods Conference and officially created in 1945.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "Identify the correct statement.\n  <br>", "option1": "The Reserve Bank of India is the custodian of the country's gold reserves.\n  <br>", "option2": "The State Bank of India is the central bank of India.\n  <br>", "option3": "The headquarters of the Reserve Bank of India is in Mumbai.\n  <br>", "option4": "The Reserve Bank of India was established in 1947.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The headquarters of the Reserve Bank of India is in Mumbai. This statement is correct. \n  <br>The RBI is the custodian of the country's foreign exchange reserves, not gold reserves. The State Bank of India is a commercial bank, not the central bank. The central bank of India is the RBI, which was established in 1935, not 1947.\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "What was the common element among \n  <br>(i) G.D. Birla \n  <br>(ii) Ambalal Sarabhai and \n  <br>(iii) WalchandHirachand\n  <br>", "option1": "They were leading members of the socialist movement in India\n  <br>", "option2": "They were Indian industrialists\n  <br>", "option3": "They were nationalist leaders\n  <br>", "option4": "All of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The common element among G.D. Birla, Ambalal Sarabhai, and Walchand Hirachand is that they were Indian industrialists. Therefore, the correct answer is (b) They were Indian industrialists.\n  <br>Walchand Hirachand Doshi was an Indian industrialist and the founder of the Walchand group. He established India's first modern shipyard, first aircraft factory, and first car factory. He was also a signatory to the Bombay Manifesto dated 26 May 1936, which opposed the socialist and Marxist ideas of Jawaharlal Nehru.\n  <br>Ambalal Sarabhai was an Indian industrialist in Ahmedabad. He also participated in India's independence movements. Sarabhai was founder of Sarabhai group of Companies, like Sarabhai Textiles, Calico Textile Mills, Sarabhai Chemicals & others. Ambalal Sarabhai was one of the mill owners and the president of the Ahmedabad Mill Owners Association, founded in 1891 to develop the textile industry in Ahmedabad.\n  <br>Birla is often referred to as a ‘nationalist businessman’, who took part in the country’s freedom struggle. He also supported the freedom movement monetarily.\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "<p>Who among the following started the Indian Agriculture Service?</p>", "option1": "<p>Lord Curzon</p>", "option2": "<p>William Bentinck</p>", "option3": "<p>Lord Minto</p>", "option4": "<p>Lord Rippon</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p>Lord Minto II started the Indian Agriculture Service in 1906. Therefore, the correct answer is (c) Lord Minto.<br />\nDuring the severe famines of 1899–1900, Lord Curzon, the then Viceroy of India, was convinced that the Government of India must urgently concentrate on the agricultural sector to overcome the damages caused by frequent famines.<br />\nAs a consequence, Agriculture Research Institute (now the Indian Agricultural Research Institute (IARI)), together with a college for advanced agriculture training, was established at Pusa in the year 1905 and its director was the agriculture adviser to the Government of India till 1929.  It was relocated to Delhi in 1936. </p>", "question_heading": ""}, {"sr_no": 110, "question": "The Tattvabodhini Sabha’ was established by\n  <br>", "option1": "Devendranath Tagore in 1839\n  <br>", "option2": "Keshab Chandra Sen in 1857\n  <br>", "option3": "Akshay Kumar Datta in 1850\n  <br>", "option4": "Dwarakanath Tagore in 1840\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Tattwabodhini Sabha was a group started in Calcutta on 6 October 1839 by Devendranath Tagore as a splinter group of the Brahmo Samaj, reformers of Hinduism and Indian Society. \n  <br>The main objective of the Sabha was to promote a more rational and humanist form of Hinduism based on the Vedanta, the Upanishads that form the last part of the Vedas. \n  <br>The Sabha published a journal called Tattvabodhini Patrika, which promoted a rational and humanist form of Hinduism.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "Kanha National Park belongs to which one of the following biogeographical areas in the world?\n  <br>", "option1": "Tropical Sub-humid Forests\n  <br>", "option2": "Tropical Humid Forests\n  <br>", "option3": "Tropical Dry Forests\n  <br>", "option4": "Tropical Moist Forests\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c). Kanha National Park belongs to the Tropical Dry Forests biogeographical area in the world.\n  <br>Kanha National Park is located in the central Indian state of Madhya Pradesh. It is a vast expanse of grassland and forest, and it is home to a variety of wildlife, including the Bengal tiger, the Indian leopard, and the barasingha.\n  <br>The Tropical Dry Forests biogeographical area is characterized by its hot, dry climate. The trees in these forests are typically deciduous, meaning that they lose their leaves during the dry season. The vegetation in these forests is also typically sparse, with large areas of open grassland.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "'El Nino' associated with the formation of the South West Monsoon of India is\n  <br>", "option1": "an abnormally warm ocean current\n  <br>", "option2": "a periodic warm air-mass\n  <br>", "option3": "a periodic warm wind\n  <br>", "option4": "a periodic low-pressure center\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a). El Niño is an abnormally warm ocean current that occurs in the Pacific Ocean. \n  <br>It is associated with the formation of the South West Monsoon of India because it weakens the trade winds that normally blow from the east to the west across the Pacific Ocean. \n  <br>This weakening of the trade winds allows warm water from the western Pacific Ocean to flow towards the east, which disrupts the monsoon pattern in India.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Which one among the following is not an igneous rock?\n  <br>", "option1": "Granite\n  <br>", "option2": "Basalt\n  <br>", "option3": "Gabbro\n  <br>", "option4": "Gneiss\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Gneiss is a metamorphic rock formed through the process of metamorphism, whereas granite, basalt, and gabbro are all examples of igneous rocks. \n  <br>Igneous rock (derived from the Latin word ignis meaning fire), or magmatic rock, is one of the three main rock types, the others being sedimentary and metamorphic. Igneous rock is formed through the cooling and solidification of magma or lava.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Which one of the following statements with regard to the Indian Railways is not correct?\n  <br>", "option1": "The Indian rail networks have been developed throughout the Konkan coast\n  <br>", "option2": "There is a very low density of railway lines in the Himalayan region\n  <br>", "option3": "The north Indian plain has a dense network of railway\n  <br>", "option4": "At present, India has the largest railway network in the world\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d). India does not have the largest railway network in the world. That title belongs to the United States. India's railway network is the fourth largest in the world, after the United States, China, and Russia.\n  <br>Indian Railways is the fourth largest national railway system in the world by size, with a total route length of 68,043 km (42,280 mi), running track length of 102,831 km (63,896 mi) and track length of 128,305 km (79,725 mi) as of 31 March 2022.\n  <br>The government has committed to electrifying India's entire rail network by 2023–24, and become a \"net zero” (carbon emissions) railway\" by 2030.\n  <br>The other statements are correct:\n  <br> The Indian rail networks have been developed throughout the Konkan coast.\n  <br> There is very low density of railway lines in the Himalayan region.\n  <br> The north Indian plain has a dense network of railway.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "Which one of the following Indian cities is not located on a river bank?\n  <br>", "option1": "Agra\n  <br>", "option2": "Bhagalpur\n  <br>", "option3": "Bhopal\n  <br>", "option4": "Kanpur\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Agra is a city in the state of Uttar Pradesh in India which situates in the banks of River Yamuna. Bhagalpur is a city of historical importance on the southern banks of the river Ganges in the Indian state of Bihar. Kanpur is the administrative headquarters of Kanpur Nagar district and Kanpur division. It is located on the west bank of the Ganges River. However, Bhopal is not located on the bank of a river. It is situated on the Malwa Plateau in central India and does not have a river flowing directly through the city.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "The idea of a Constituent Assembly was put forward for the first time by\n  <br>", "option1": "M.N. Roy\n  <br>", "option2": "Dr. B. R. Ambedhkar\n  <br>", "option3": "Dr. Rajendra Prasad\n  <br>", "option4": "Sardar Vallabhbhai Patel\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idea of a constituent assembly was first proposed in 1934 by M.N. Roy. However, the actual constituent assembly was formed in 1946 on the basis of the cabinet mission plan. Hence, Option (a) is correct.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Which one of the following is not matched correctly\n  <br>", "option1": "Fundamental Rights - Part III\n  <br>", "option2": "State - Part VI\n  <br>", "option3": "Citizenship - Part II\n  <br>", "option4": "Fundamental Duties - Part VI - A\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The provisions related to Fundamental Duties are included in the Part IV -A of the Constitution. This Part was added to the Constitution by 42nd Amendment Act ,1976. Hence, Option (d) is Incorrect, all other options are correctly matched. \n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Which of the following factors is/are responsible for the elephantine size of our Constitution\n  <br>", "option1": "Geographical Factors\n  <br>", "option2": "Historical Factors\n  <br>", "option3": "Dominance of Legal Experts in the Constituent Assembly\n  <br>", "option4": "All of the above \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "There are many factors, that are responsible for the elephantine size of our Constitution. Such as - Geographical factors I.e., the vastness of the country and its diversity. Historical Factors like the influence of GOI Act 1935, which was very bulky. Single constitution for both the centre and the states and there was the Dominating strength of the legal experts in the constituent Assembly, which was also responsible for the lengthiest constitution. Apart from these there are other reasons also. Hence, all the given options are correct.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "What do you call the rate of formation of new organic matter by consumers?\n  <br>", "option1": "Tertiary productivity\n  <br>", "option2": "Primary productivity\n  <br>", "option3": "Net productivity\n  <br>", "option4": "Secondary productivity\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Secondary productivity\n  <br> Primary productivity is the process where inorganic substances are synthesized by organisms to produce simple organic materials. Primary producers, or autotrophs, are responsible for this phenomenon. Common examples of primary producers include diatoms, dinoflagellates, and coccolithophores.\n  <br> The production of organic matter by consumers is called secondary productivity. In secondary productivity, the energy is obtained by the transfer of energy through the food chain.\n  <br> The amount of new biomass (weight) that is produced by meat‐eating animals (carnivores) in a given period of time.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Which enzyme in the pancreatic juice helps in breaking down fats?\n  <br>", "option1": "Protease\n  <br>", "option2": "Pepsin\n  <br>", "option3": "Lipase\n  <br>", "option4": "Amylase\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Lipase is an enzyme that breaks down fats into fatty acids and glycerol. It is secreted by the pancreas and is found in pancreatic juice. Lipase is also found in the small intestine, where it helps to digest fats from food.\n  <br>Lipase is a water-soluble enzyme, which means that it can only work in an aqueous environment. The pancreas secretes lipase in an inactive form called prolipase. Prolipase is activated by bile salts, which are produced by the liver.\n  <br> Protease is an enzyme that breaks down proteins. It is found in the pancreas and small intestine. Protease helps the body to digest proteins.\n  <br> Pepsin is a protease that is found in the stomach. Pepsin helps the body to digest proteins in the stomach.\n  <br> Amylase is an enzyme that breaks down carbohydrates. It is found in the saliva and pancreas. Amylase helps the body to digest carbohydrates in the mouth and small intestine.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Buckminsterfullerene is a nano-particle characterized by spherical geometry and a hollow interior that contains how many carbon atoms?\n  <br>", "option1": "60\n  <br>", "option2": "50\n  <br>", "option3": "40\n  <br>", "option4": "70\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "60 carbon atoms\n  <br> Buckminsterfullerene is a spherical molecule in which 60 carbon atoms are arranged in interlocking hexagonal and pentagonal rings of carbon atoms.\n  <br>  Carbon is capable of forming many allotropes (structurally different forms of the same element) due to its valency. \n  <br> Well-known forms of carbon include diamond and graphite. \n  <br> In recent decades, many more allotropes have been discovered and researched, including ball shapes such as buckminsterfullerene and sheets such as graphene.\n  <br> Graphite, diamond, and buckminsterfullerene are three different forms of carbon.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "The pH of a neutral solution is ______.\n  <br>", "option1": "7\n  <br>", "option2": "0\n  <br>", "option3": "8\n  <br>", "option4": "14\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "pH7\n  <br> pH is a measure of how acidic/basic water is. The range goes from 0 - 14, with 7 being neutral. pHs of less than 7 indicate acidity, whereas a pH of greater than 7 indicates a base.\n  <br> It happens that at pH 7, the concentrations of H+ and OH- are equal. This is why pH 7 is considered the neutral pH. Below pH 7, the concentration of H+ is greater than the concentration of OH-, making the water acidic.\n  <br> Anything below 7.0 is acidic, and anything above 7.0 is alkaline, or basic.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Which of the following is not a type of RNA?\n  <br>", "option1": "Messenger RNA (mRNA)\n  <br>", "option2": "Transfer RNA (tRNA)\n  <br>", "option3": "Ribosomal RNA (rRNA)\n  <br>", "option4": "Plasma RNA (pRNA)\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) Plasma RNA (pRNA). There are three main types of RNA: Messenger RNA (mRNA), Transfer RNA (tRNA), and Ribosomal RNA (rRNA). Plasma RNA (pRNA) is not a recognized type of RNA.\n  <br> Messenger RNA (mRNA): This is the type of RNA that carries the genetic information from DNA to the ribosomes, where it is translated into proteins.\n  <br> Transfer RNA (tRNA): This is the type of RNA that carries amino acids to the ribosomes, where they are assembled into proteins.\n  <br> Ribosomal RNA (rRNA): This is the type of RNA that makes up the ribosomes, the organelles that are responsible for protein synthesis.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "Where is the recently launched Phukot Karnali Hydro Electric Project, with a capacity of 480MW, located?\n  <br>", "option1": "India \n  <br>", "option2": "Nepal \n  <br>", "option3": "Bhutan \n  <br>", "option4": "Sri Lanka\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The recently launched Phukot Karnali Hydro Electric Project, with an installed capacity of 480MW, is located in Nepal. \n  <br> The project aims to utilize the flow from the Karnali River for power generation, and the generated power will be integrated into Nepal's power system. \n  <br> The MoU for the development of this project was signed between NHPC Limited and Vidhyut Utpadan Company Limited (VUCL) of Nepal in New Delhi, in the presence of both Prime Minister Modi and Nepal's Prime Minister Pushpa Kamal Dahal 'Prachanda'.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "What is the full form of the portal GOBARdhan, which was recently launched by the Ministery for Jal Shakti?\n  <br>", "option1": "Galvanizing Organic Bio-Agro Resources Dhan \n  <br>", "option2": "Greening of Organic Biomass and Agricultural Resources Dhan \n  <br>", "option3": "Government Organization for Bio-Agro Resources Development \n  <br>", "option4": "Generating Organic Biogas and Agricultural Resources Development\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The recently launched initiative by the Government of India, GOBARdhan, stands for Galvanizing Organic Bio-Agro Resources Dhan. \n  <br> This initiative aims to promote a circular economy by converting waste to wealth. \n  <br> The Minister for Jal Shakti, Gajendra Singh Shekhawat, launched the Unified Registration Portal for GOBARdhan, which serves as a one-stop repository for assessing investment and participation in the Biogas/CBG (Compressed Biogas) sector at the pan India level. \n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "Who won two gold medals in the men's 100 and 200-meter races at the Flanders Cup 2023 athletics in Merksem, Belgium?\n  <br>", "option1": "Amlan Borgohain \n  <br>", "option2": "Sapna Kumari \n  <br>", "option3": "Amber Vanden Bosch \n  <br>", "option4": "Sandeep Singh Maan\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Amlan Borgohain won two gold medals in the men's 100 and 200-meter races at the Flanders Cup 2023 athletics in Merksem, Belgium. \n  <br> He emerged as the fastest man of the meet by clocking 10.70 seconds in the 100-meter race. \n  <br> Sapna Kumari finished behind Amber Vanden Bosch in the women's 100m hurdles.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Who recently won the 2023 International Booker Prize for their book 'Time Shelter'?\n  <br>", "option1": "Georgi Gospodinov \n  <br>", "option2": "Angela Rodel \n  <br>", "option3": "Both Georgi Gospodinov and Angela Rodel \n  <br>", "option4": "Geetanjali Shree and Daisy Rockwell\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Georgi Gospodinov and Angela Rodel won the 2023 International Booker Prize for their book 'Time Shelter'.\n  <br> It is also the first book in Bulgarian to win the prize.\n  <br> The International Booker Prize (formerly known as the Man Booker International Prize) is an international literary award hosted in the United Kingdom.\n  <br> Geetanjali Shree and Daisy Rockwell are the winners of the previous year for their novel Tomb of Sand.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Which countries have recently started the joint naval drill exercise named 'Tiger Shark 40'?\n  <br>", "option1": "Bangladesh and India \n  <br>", "option2": "Bangladesh and Sri Lanka \n  <br>", "option3": "Bangladesh and the United States \n  <br>", "option4": "Bangladesh and Myanmar\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Currently conducting \"Tiger Shark 40\" is a joint naval drill exercise between Bangladesh and the United States.\n  <br> It started at BNS Nirvik in Chattogram which involves participation from the Bangladesh Army and Navy as well as US Special Forces.\n  <br> Commodore Swords Command is responsible for managing this training exercise.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "Which film won the Best Film award at the International Indian Film Academy Awards (IIFA) 2023?\n  <br>", "option1": "Drishyam 2 \n  <br>", "option2": "Vikram Vedha \n  <br>", "option3": "Gangubai Kathiawadi \n  <br>", "option4": "Rocketry: The Nambi Effect\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Best Film award at the International Indian Film Academy Awards (IIFA) 2023 was won by Drishyam 2.\n  <br> Hrithik Roshan won the Best Actor award for his performance in Vikram Vedha.\n  <br> Alia Bhatt won the Best Actor (Female) award for Gangubai Kathiawadi.\n  <br> R Madhavan won the Best Director award for Rocketry: The Nambi Effect.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "Who clinched his maiden BWF World Tour title at the Malaysia Masters Super 500 badminton tournament in 2023?\n  <br>", "option1": "H.S. Prannoy \n  <br>", "option2": "Weng Hong Yang\n  <br>", "option3": "Akane Yamaguchi \n  <br>", "option4": "Kang Min-hyuk\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "H.S. Prannoy, the Indian shuttler ranked No. 9 in the world, won his maiden BWF World Tour title at the Malaysia Masters Super 500 badminton tournament in 2023.\n  <br> In the finals, he defeated Weng Hong Yang of China in a thrilling match with a score of 21-19, 13-21, 21-18.\n  <br> H.S. Prannoy had previously clinched the title at the 2017 US Open.\n  <br> In the women's singles category, Akane Yamaguchi emerged as the winner.\n  <br> Kang Min-hyuk and Seo Seung-jae secured the title in the men's doubles category.\n  <br> Baek Ha-na and Lee So-hee were the winners in the women's doubles category.\n  <br> Dechapol Puavaranukroh and Sapsiree Taerattanachai triumphed in the mixed doubles category.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "With reference to Simple Network Management Protocol (SNMP), which of the following statements is FALSE?\n  <br>I. SNMP is a protocol of the network layer used to monitor the network.\n  <br>II. SNMP protocol is embedded in multiple local devices such as routers, switches, servers and firewalls.\n  <br>", "option1": "Only I\n  <br>", "option2": "Only II\n  <br>", "option3": "Both I and II\n  <br>", "option4": "Neither I nor II\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> SNMP stands for Simple Network Management Protocol, and it \n  <b>is an application layer protocol</b> for managing and monitoring networked devices.\n  <br> Multiple local devices, such as routers, switches, servers, firewalls, and wireless access points, use the SNMP protocol, which may be accessed by their IP address.\n  <br> The User Datagram Protocol is used to implement it (UDP).\n  <br> UDP is a connectionless protocol that functions similarly to the Transmission Control Protocol (TCP) but does not require error-checking or recovery services.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Swipe is a command primarily used with which of the following devices?\n  <br>", "option1": "Mouse\n  <br>", "option2": "Printer\n  <br>", "option3": "Touchscreen\n  <br>", "option4": "Scanner\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Swipe is a command that is commonly used on \n  <b>touchscreen</b> devices like smartphones and tablets.\n  <br> Some laptops with trackpads and desktop PCs with trackpad input also support it.\n  <br> A swipe is when you move your finger across a touchscreen or trackpad quickly.\n  <br> In a photo viewing app, for example, swiping the screen from right to left normally displays the next picture.\n  <br> You may also switch between home screens by swiping left or right on most smartphones.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Servlets, which provide platform-independent method for building Web based applications are written in which language?\n  <br>", "option1": "ASP\n  <br>", "option2": "C#\n  <br>", "option3": "Python\n  <br>", "option4": "Java\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A servlet is a \n  <b>Java web application</b> that runs on a server.\n  <br> It is similar to an applet, but instead of being processed on the client's PC, it is processed on the server.\n  <br> When a user clicks a link, fills out a form, or takes another action on a website, servlets are frequently invoked.\n  <br> Servlets are one of many tools available to web developers for creating dynamic webpages and processing data sent by visitors.\n  <br> Servlets make creating Web applications simple for programmers who are already familiar with the Java programming language.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "Which of the following devices is NOT equipped with a USB port?\n  <br>", "option1": "Internal Hard Drive\n  <br>", "option2": "External Hard Drive\n  <br>", "option3": "Printer\n  <br>", "option4": "Digital Camera\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>Internal Hard Drive devices</b> is NOT equipped with a USB port.\n  <br> The most prevalent form of computer port in today's PCs is the Universal Serial Bus (USB).\n  <br> Keyboards, mice, game controllers, printers, scanners, digital cameras, and removable media drives can all be connected to it.\n  <br> You may attach up to 127 peripherals to a single USB port and use them all at once with the help of a few USB hubs.\n  <br> Older ports, such as serial and parallel connectors, are slower than USB.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "Process of identifying and resolving a error or fault in a software or computer system is known as________.\n  <br>", "option1": "Hacking\n  <br>", "option2": "Spamming\n  <br>", "option3": "Defragging\n  <br>", "option4": "Troubleshooting\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The process of diagnosing the source of a problem is known as \n  <b>troubleshooting.</b> \n  <br> It is used to troubleshoot issues with hardware, software, and a variety of other goods.\n  <br> When a computer or program becomes broken, unresponsive, or behaves abnormally, it can be repaired and restored.\n  <br> Troubleshooting is used to keep a system or program in the desired state, particularly when it encounters or exhibits a problem.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "FSB connects CPU with which of the following other component?\n  <br>", "option1": "PCI Card\n  <br>", "option2": "RAM\n  <br>", "option3": "SSD\n  <br>", "option4": "HDD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The frontside bus (FSB) connects the processor to the \n  <b>system memory</b> \n  <b>(RAM)</b> and other motherboard components.\n  <br> The system chipset, AGP card, PCI devices, and other peripherals are among these components.\n  <br> The FSB is also known as the \"system bus\" since it is the main path from the processor to the rest of the motherboard.\n  <br> Like the processor, the frontside bus's speed is measured in Megahertz or Gigahertz.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "Brouter is a network device that combines a router with__________.\n  <br>", "option1": "Bluetooth\n  <br>", "option2": "Bridge\n  <br>", "option3": "Bus\n  <br>", "option4": "Backup Storage Device\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A Brouter is a networking device that may act as a \n  <b>bridge</b> and a router at the same time.\n  <br> It may route data to particular systems inside a network as well as forward data between networks.\n  <br> It can work at the Data Link Layer or the Network Layer.\n  <br> When configured as a router, Brouter is full duplex and it is half duplex when configured as a bridge.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "Ethernet, repeaters and networking hubs are the examples of hardware in the_________.\n  <br>", "option1": "Data Link Layer\n  <br>", "option2": "Physical Layer\n  <br>", "option3": "Transport Layer\n  <br>", "option4": "Session Layer\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> In the OSI model, the \n  <b>physical layer</b> interacts with actual hardware and signalling mechanisms.\n  <br> The physical layer of the OSI network model is the only one that deals with the physical connection between two separate stations.\n  <br> Protocols and other higher-layer objects are not addressed by the physical layer.\n  <br> Network adapters, ethernet, repeaters, networking hubs, are the examples of Physical layer.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "In Windows 10, which shortcut key can be used to add a virtual desktop?\n  <br>", "option1": "Windows key + Down arrow key\n  <br>", "option2": "Windows key + Up arrow key\n  <br>", "option3": "Windows key + Ctrl + D\n  <br>", "option4": "Windows key + Shift + Up arrow\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Windows key + Down arrow key : Minimizes app windows\n  <br> Windows key + Up arrow key : Maximizes app windows\n  <br> \n  <b>Windows key + Ctrl + D : Adds a virtual desktop</b> \n  <br> Windows key + Shift + Up arrow : Stretches the desktop window to the top and bottom of the screen\n  <br> Windows key + Number : Opens the app pinned to the taskbar in the position specified by the number\n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "In Microsoft Power-point, which shortcut key can be used to apply subscript formatting?\n  <br>", "option1": "Ctrl + Equal sign\n  <br>", "option2": "Ctrl + Shift + Plus sign\n  <br>", "option3": "Ctrl + Shift + >\n  <br>", "option4": "Ctrl + M \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Ctrl + Equal sign : Used to Apply superscript formatting\n  <br> \n  <b>Ctrl + Shift + Plus sign : Used to Apply subscript formatting</b> \n  <br> Ctrl + Shift + > : Increases the font size\n  <br> Ctrl + M : Used to insert a new slide\n  <br> Ctrl + Shift + Tab : Switches between outline and thumbnail pane\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "Which of the following types of memory cards is most commonly used to deliver high-capacity memory in a tiny package?\n  <br>", "option1": "SDHC Card\n  <br>", "option2": "CompactFlash\n  <br>", "option3": "Smart Media Card\n  <br>", "option4": "SD Card\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>SD cards</b> are a type of non-volatile flash memory that can be used in portable and mobile devices.\n  <br> It is one of the most prevalent sorts of memory cards.\n  <br> It is designed to fit a lot of memory into a small package.\n  <br> It can be found in a variety of small portable devices, including handheld computers, digital video camcorders, digital cameras, and cell phones.\n  <br> SD cards also come in a variety of storage capacities.\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "PostScript language is a page description language developed by which company?\n  <br>", "option1": "Adobe\n  <br>", "option2": "Corel\n  <br>", "option3": "IBM\n  <br>", "option4": "Apple\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> PostScript is a page description language (PDL) that specifies the text and graphic content of a web page.\n  <br> It can be used to specify how visuals and text appear on screen and in print.\n  <br> \n  <b>Adobe created the language</b> in 1984, and it has undergone numerous revisions and updates since then.\n  <br> Like other computer languages, PostScript supports a variety of data types, including numbers, arrays, and texts.\n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "In Microsoft Word, which of the following font case capitalizes all the all letters of your text?\n  <br>", "option1": "Capitalize Each Word\n  <br>", "option2": "Uppercase\n  <br>", "option3": "Toggle Case\n  <br>", "option4": "Lowercase\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In Microsoft Word, in order to change the case of selected text in a document, consider the following steps:\n  <br>Step : #1 Select the text you want to change.\n  <br>Step : #2 Locate the Font group in the Home Tab and click the drop-down arrow in 'Change Case' button.\n  <br>Step : #3 Select the desired case with a left click.\n  <br>The case menu offers four options:\n  <br> \n  <b>Lowercase:</b> It changes the text from uppercase to lowercase in the document.\n  <br> \n  <b>Sentence case:</b> It capitalizes the first letter of each sentence in the document.\n  <br> \n  <b>Uppercase:</b> \n  <b>It capitalizes all the all letters of your text in the document.</b> \n  <br> \n  <b>Capitalize Each Word:</b> It capitalizes the first letter of each word in the document.\n  <br> \n  <b>Toggle Case:</b> It allows you to shift between two case views in the document.\n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "Which one of the following is the standard language for object-oriented databases?\n  <br>", "option1": "XQuery\n  <br>", "option2": "SQL\n  <br>", "option3": "OQL\n  <br>", "option4": "GraphQL\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The standard language for object-oriented databases is \n  <b>OQL,</b> \n  <b>which stands for Object Query Language.</b> \n  <br> OQL represents data as variables, functions or data structures.\n  <br> Companies that need to store vast amounts of complicated data frequently use these databases.\n  <br> OQL allows you to run queries and retrieve data from object databases.\n  <br> It is made to work closely with programming languages like C++, Smalltalk, and Java.\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "An electronic version of a traditional print book that can be downloaded via Internet is called as_________.\n  <br>", "option1": "eBook\n  <br>", "option2": "ePad\n  <br>", "option3": "eDrive\n  <br>", "option4": "eInk\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A digital publication that can be read on a computer, e-reader, or other electronic device is referred to as an \n  <b>eBook.</b> \n  <br> eBooks can be downloaded in a variety of file formats.\n  <br> Some formats are open and may be read on a variety of devices, while others are proprietary and can only be viewed on a single device, such as an iPad or Kindle.\n  <br> An eBook is a non-editable book that has been converted to a digital format that may be read on a computer screen or on a mobile device.\n  <br>", "question_heading": ""}, {"sr_no": 146, "question": "In Inीयनंोपiयn पधcुnिययgद, __________iौ ो cधnपनोिप्रधक ूिोcध थुधनध कोपो iौ ौपयनधक ोnक ंोinपोinधक in ोn यनgोnप्रधक थोद.", "option1": "Data Bank\n  <br>", "option2": "Recycle Bin\n  <br>", "option3": "Repository\n  <br>", "option4": " own as \n  <b>flaming or bashing.</b> \n  <br> These remarks, known as \"flames,\" can be transmitted via e-mail or instant messaging systems, or posted in online discussion forums or newsgroups. \n  <br> Online discussion forums, sometimes known as bulletin boards, are the most popular site where flaming occurs.\n  <br> Flaming frequently results in insults being traded among members of a particular forum.\n  <br>", "question_heading": ""}, {"sr_no": 149, "question": "Webmaster is defined as person who__________.\n  <br>", "option1": "owns a domain name\n  <br>", "option2": "maintains a website\n  <br>", "option3": "works for a web hosting firm\n  <br>", "option4": "knows one or more web scripting languages\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A webmaster is a person who is responsible for the \n  <b>maintenance of a website.</b> \n  <br> A webmaster could be a web developer and the same person who created a website.\n  <br> A webmaster's responsibilities include maintaining a functional website.\n  <br> A webmaster can maintain track of all aspects of a website.\n  <br> They keep track on its search engine rankings, functionality, speed, and design.\n  <br>", "question_heading": ""}, {"sr_no": 150, "question": "Site that largely copies the content of another site without permission is called as________.\n  <br>", "option1": "Scraper site\n  <br>", "option2": "Showcase website\n  <br>", "option3": "Torrents website\n  <br>", "option4": "Media-sharing site\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A \n  <b>scraper site</b> is one that uses web scraping to copy content from other websites.\n  <br> The content is then replicated in order to generate cash, mainly through advertising and occasionally through the sale of user data.\n  <br> Scraper sites are designed to collect user information such as e-mail addresses so that spam e-mail can be sent to them.\n  <br> Search engines like Google could be classified as scraper sites.\n  <br>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
