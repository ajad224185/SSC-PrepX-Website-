<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) SSC CGL Tier-II (Paper-I) Mock 1(HINDI - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

he way.\n  <br>", "option1": "Movement\n  <br>", "option2": "Flight\n  <br>", "option3": "Shifting\n  <br>", "option4": "Settling\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Migrate</b>- (of a person) move to a new area or country in order to find work or better living conditions.\n  <br>Synonyms: relocate, move, shift, emigrate, immigrate, transplant.\n  <br>Antonyms: stay, remain, \n  <b>settle</b>, inhabit, stay put, nest.\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Movement</b>: Act or process of changing position or location.\n  <br> \n  <b>Flight</b>: Act of moving through the air, typically by using wings.\n  <br> \n  <b>Shift</b>: Act of moving or changing position or direction.\n  <br> \n  <b>Settle</b>: Act of establishing oneself or others in a comfortable or permanent position.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A disastrous event or situation causing great distress or harm.\n  <br>", "option1": "Disaster\n  <br>", "option2": "Combustion\n  <br>", "option3": "Calamity\n  <br>", "option4": "Sabotage\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Calamity</b>: A disastrous event or situation causing great distress or harm.\n  <br>Meanings of other three options are as follows:\n  <br> \n  <b>Disaster</b>: A sudden event or misfortune causing extensive damage or suffering.\n  <br> \n  <b>Combustion</b>: The process of burning or a chemical reaction that produces heat and light.\n  <br> \n  <b>Sabotage</b>: Deliberate destruction or obstruction of something, often with malicious intent.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Select the most appropriate option to fill in the blank.\n  <br>Eight years later, however, watching their opportunity when many buccaneers were absent in the larger island, the Spaniards attacked Tortuga, and massacred every _________ they could seize.\n  <br>", "option1": "Settler\n  <br>", "option2": "Inhabit\n  <br>", "option3": "Occupied \n  <br>", "option4": "Migrant\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘settler’ to fill in the blank.\n  <br>Meanings of all options:\n  <br> \n  <b>Settler</b>: A person who establishes a new residence or colony in a different region or territory.\n  <br> \n  <b>Inhabit</b>: To live or dwell in a particular place or environment.\n  <br> \n  <b>Occupied</b>: Being in use, taken, or held by someone or something.\n  <br> \n  <b>Migrant</b>: A person who moves from one place to another, typically in search of better living conditions or work opportunities.\n  <br>As per the context of the passage ‘settler’ is the most appropriate option to fill in the blank. Though ‘migrant’ is also grammatically correct to fill in the blank but if we pay attention to the passage, we can easily infer that attackers would probably go after the settlers of a place rather than the migrants.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>Don't invite Joe to lunch, he's just \n  <b>as conceited as a barber's cat</b> lately.\n  <br>", "option1": "Barely managed to escape\n  <br>", "option2": "Very narcissistic\n  <br>", "option3": "Always taking calculated decisions\n  <br>", "option4": "Deficiency of funds\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>As conceited as a barber’s cat- </b>very narcissistic or vain.\n  <br>Used in a sentence- No one in the neighborhood cares for the Smiths. They're always as conceited as a barber's cat whenever they're socializing with us.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Select the most appropriate option from the given options to fill in the blank.\n  <br>The Doctor called, and shouted, and fired signals, and Duke made ___________ lamentations; but there was no response.\n  <br>", "option1": "Pitiable\n  <br>", "option2": "Pitiful\n  <br>", "option3": "Piteous\n  <br>", "option4": "Pitiless\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘piteous’ to fill in the blank.\n  <br> \n  <b>Pitiable</b>: Deserving or arousing pity or compassion.\n  <br> \n  <b>Pitiful</b>: Evoking or deserving pity or sympathy due to being weak, sad, or inadequate.\n  <br> \n  <b>Piteous</b>: Eliciting or expressing feelings of pity or compassion.\n  <br> \n  <b>Pitiless</b>: Showing no pity or mercy; harsh and cruel.\n  <br>As per the meanings of all options ‘piteous’ is the most appropriate option to fill in the blank. \n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "Fयन पुध ीयहन-ौधnपधncध (S1 पय S4) ूोनोgनोूु ृिधयथ, ौधnपधncधौ S1 ोnक S4 ोनध giॅधn. Fनयं पुध यूपiयnौ P, Q, R ोnक S ौिधधcप पुध ोूूनयूनiोपध ौधnपधncधौ ीयन S2 ोnक S3, नधौूधcपiॅिधद. (S1) Tुध नियध यी पुध Gयॅधनnयन यन Lप. Gयॅधनnयनौ ुोौ cुोngधक धौूधciोििद in Sपोपधौ निहधक ृद पुध Oूूयौiपiयn. (S2) (S3) (S4) Iप iौ यnध ंयनध नधोौयn थुद पुध यीीicध यी पुध Gयॅधनnयन ौुयिहक ृध ंोकध ोn िधधcपधक यीीicध, ोौ iौ पुध nयनं in ोिि कधंयcनोciधौ, ोnक nयप nयंinोपधक ोौ iप iौ nयथ. (P) Tुयहgु Gयॅधनnयनौ ोnक Lप. Gयॅधनnयनौ कय ोौ पुधद ूिधोौध पुधद ोनध यीपधn ंiौहnकधनौपययक थुधn पुध nधधक ीयन cधnपनोि incिहौiयn ोनiौधौ. Cयंूोनing cधnपनोि gयॅधनnंधnप थiपु Iंूधनiोि ूयथधन कiौूिोदौ पुध ौपहnपधक पुinाing यी यूूयौiपiयn ोnक iपौ ौुधnोnigोnौ पय कधीोंध पुध gयॅधनnंधnप in Pयथधन. (Q) Onध ुयूधौ पुोप Gयॅधनnयनौ ोnक Lप. Gयॅधनnयनौ थiिि ुोnिकध पुधौध पiधौ ंयनध ौधnौiपiॅिधद. Gयॅधनnयनौ ौुयिहक नधोिiौध पुोप पुधद ोनध nयप ूनय-cयnौिहस यी ोn iंूधनiोि ूयथधन ोnक Inकiो cधोौधक पय ृध यnध ौincध iप ोपपोinधक ीनधधकयं — पुiौ थiिि यnिद हौुधन in पुध पथiिigुप यी यहन कधंयcनोcद ोnक Gयॅधनnयनौ थiिि nयप ोcप ोौ पुध gहोनकनोiिस यी पुध Cयnौपiपहपiयn, ोौ पुधद ौुयिहक ृध कयing. (R) Inकiो हौधक पय ीियियथ ो कदोनcुद थुधn पुध ौदौपधं यी कयहृिध gयॅधनnंधnप थोौ ीiनौप inपनयकहcधक in 1919 ीयन पुध ूनयॅincधौ यी Bनiपiौु Inकiो. (S) Inकiो ीियियथौ ो ीधकधनोि ौपनहcपहनध थiपु gयॅधनnंधnपौ in पुध Sपोपधौ ोnक ोप पुध Cधnपनध, धोcु थiपु पुधiन यथn कiौपincप ौधnौध यी नधौूयnौiृiिiपiधौ ोnक कयंोinौ पय ीहncपiयn.", "option1": "P, R\n  <br>", "option2": "R, Q\n  <br>", "option3": "S, Q\n  <br>", "option4": "R, P\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is indeed option (c) S, Q.\n  <br> In the given paragraph, S1 mentions the changing role of Governors or Lt. Governors in States ruled by the Opposition. The appropriate sentence to follow S1 and provide further information on this topic is S.\n  <br> \n  <b>(S) India follows a federal structure with governments in the States and at the Centre, each with their own distinct sense of responsibilities and domains to function.</b> \n  <br> This sentence (S) is a suitable continuation after S1 because it provides context about India's federal structure and the distinct responsibilities of governments at the State and Central levels. It helps set the stage for discussing the changing role of Governors.\n  <br> Following S2, the next sentence should provide further insight or commentary related to the topic. The appropriate sentence for S3 is:\n  <br> \n  <b>(Q) One hopes that Governors and Lt. Governors will handle these ties more sensitively. Governors should realize that they are not pro-consuls of an imperial power and India ceased to be one since it attained freedom — this will only usher in the twilight of our democracy and Governors will not act as the guardrails of the Constitution, as they should be doing.</b> \n  <br> This sentence (Q) discusses the expectations and responsibilities of Governors and Lt. Governors, highlighting the need for sensitivity in handling ties and emphasizing their role as the guardrails of the Constitution. It provides relevant commentary and further expands on the topic introduced in S1 and continued in S2.\n  <br> Therefore, the correct answer is option (c) S, Q, with S2 being \"India follows a federal structure with governments in the States and at the Centre, each with their own distinct sense of responsibilities and domains to function\" and S3 being \"One hopes that Governors and Lt. Governors will handle these ties more sensitively.\"\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don’t find any error, mark ‘No error’ as your answer.\n  <br>She enjoys to read books, especially those on history and culture.\n  <br>", "option1": "She enjoys to read books\n  <br>", "option2": "No error\n  <br>", "option3": "especially those on\n  <br>", "option4": "history and culture\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in the verb structure \"enjoys to read\". In English, after the verb \"enjoy\", we use the gerund (-ing form) instead of the infinitive (to + verb). So, it should be \"She enjoys reading books\".\n  <br> The correct sentence is: \"She enjoys reading books, especially those on history and culture.\"\n  <br> To understand this better, remember that some verbs can be followed by the gerund form but not the to-infinitive form. \n  <br> \"Enjoy\" is one of these verbs. Other verbs in this category include avoid, consider, delay, deny, finish, keep, miss, practice, resist, and suggest. \n  <br> So, you would say \"She finished doing her homework\" rather than \"She finished to do her homework\". It's important to learn which verbs follow this pattern in English.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the most appropriate option to fill in the blank.\n  <br>At a certain season of our life we are _____________ to consider every spot as the possible site of a house.\n  <br>", "option1": "Loaded\n  <br>", "option2": "Allowing\n  <br>", "option3": "Accustomed \n  <br>", "option4": "Allowed \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘accustomed’ to fill in the blank.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Loaded</b> - carrying a load or burden.\n  <br> \n  <b>Allowing</b> - giving permission or consent.\n  <br> \n  <b>Accustomed</b> - familiar with, used to.\n  <br> \n  <b>Allowed</b> - permitted or authorized.\n  <br>As per the context of the sentence given and meanings of all options ‘accustomed’ is the most appropriate option to fill in the blank.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.\n  <br>The professor elucidated the esoteric principles of quantum mechanics with precision and clarity.\n  <br>", "option1": "The professor elucidated\n  <br>", "option2": "the esoteric principles of quantum\n  <br>", "option3": "mechanics with precision and clarity\n  <br>", "option4": "No Error\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The provided sentence is grammatically correct. Each segment is appropriately structured, and there are no errors in subject-verb agreement or other grammatical aspects. \n  <br>The sentence effectively communicates that the professor explained the complex principles of quantum mechanics with precision and clarity.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the INCORRECTLY spelt word.\n  <br>", "option1": "Arachnophobia \n  <br>", "option2": "Acrophobia \n  <br>", "option3": "Xenophonia \n  <br>", "option4": "Claustrophobia \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer to the question is: (c) Xenophonia. The correct term for the fear of strangers or foreigners is \"Xenophobia.\"\n  <br>Meanings of all options:\n  <br> \n  <b>Arachnophobia</b>: The fear or strong aversion to spiders.\n  <br> \n  <b>Acrophobia</b>: The fear of heights or high places.\n  <br> \n  <b>Claustrophobia</b>: The fear of confined or enclosed spaces.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the option that expresses the given sentence in reported speech.\n  <br>Mayank said to Shraddha, “Are you angry with me?”\n  <br>", "option1": "Mayank asked Shraddha if she was angry with her.\n  <br>", "option2": "Mayank asked Shraddha if she was angry with him.\n  <br>", "option3": "Mayank asked Shraddha if she was angry with me.\n  <br>", "option4": "Mayank asked Shraddha why she was angry with him.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Direct Speech</b> is a report of the exact words used by a speaker or writer. The words spoken appear within inverted commas “……” and should be exactly word to word as spoken or written.\n  <br> \n  <b>Indirect</b> \n  <b>Speech</b> \n  <b>(Reported speech)</b> is when we report what someone said in our own words. We do not use inverted commas, do not inscribe the exact words as spoken or written by someone. \n  <br>In reported speech, we need to change the tense of the reporting verb and make other necessary changes. The reporting verb \"said\" is changed to \"asked\" because it is a question. The pronouns also need to be changed to reflect the perspective of the reported speaker.\n  <br> In option (a) the pronoun \"her\" is incorrect because it refers to Mayank, but the original sentence states that Mayank asked Shraddha if she was angry with him.\n  <br> Option (b) correctly changes the pronoun \"me\" to \"him\" to reflect the perspective of Mayank.\n  <br> The pronoun \"me\" is incorrect in option (c) because it refers to the reported speaker (Mayank), but the original sentence indicates that Mayank asked Shraddha if she was angry with him.\n  <br> Option (d) changes the question from \"Are you angry with me?\" to \"why she was angry with him.\" It alters the meaning of the sentence and does not accurately represent the original question.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the option that expresses the given sentence in passive voice.\n  <br>While John cooks the food, Angela decorates the dining room.\"\n  <br>", "option1": "While the food is cooked by John, the dining room is decorated by Angela.\n  <br>", "option2": "The food is cooked by John, while Angela is decorated the dining room.\n  <br>", "option3": "While John is cooking by food, Angela is decorated by the dining room.\n  <br>", "option4": "The food is being cooked by John, while the dining room is being decorated by Angela.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In passive voice, the subject of the active sentence becomes the object of the passive sentence, and the verb is changed to a passive form. \n  <br> Let's break down the sentence and apply the rules:\n  <br> Active voice: While John cooks the food, Angela decorates the dining room.\n  <br> Identify the subject, verb, and object in the active sentence:\n  <br> Subject: John\n  <br> Verb: cooks\n  <br> Object: the food\n  <br> Second subject: Angela\n  <br> Second verb: decorates\n  <br> Second object: the dining room\n  <br> Convert the objects into subjects and the subjects into objects in the passive sentence.\n  <br> Change the verb to its passive form:\n  <br> \"cooks\" changes to \"is cooked\" (verb + past participle)\n  <br> \"decorates\" changes to \"is decorated\" (verb + past participle)\n  <br> Include the \"by\" phrase to indicate the doer of the action.\n  <br> Putting it all together, we get the passive voice sentence:\n  <br> \"While the food is cooked by John, the dining room is decorated by Angela.\"\n  <br> Therefore, the correct answer is option (a).\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate option that can substitute the highlighted segment in the given sentence. If there is no need to substitute it, select ‘No substitution required’.\n  <br> Edward II is \n  <b>tragic than</b> some other plays by the dramatist.\n  <br>", "option1": "as least tragic as\n  <br>", "option2": "No substitution required\n  <br>", "option3": "the most tragic\n  <br>", "option4": "less tragic than\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (d) \"less tragic than.\"\n  <br>Let's analyze the given sentence and the options:\n  <br>\"Edward II is tragic than some other plays by the dramatist.\"\n  <br>The highlighted segment in the sentence is \"tragic than.\" This segment is incorrect because it does not follow the correct comparative form.\n  <br>Now let's consider each option:\n  <br> \"\n  <b>As least tragic as</b>\" - This option does not provide the correct comparative form. It should be \"as least tragic as\" instead of \"as least tragic as.\"\n  <br> \"\n  <b>No substitution required</b>\" - This option suggests that the highlighted segment is already correct, but as explained above, it is not.\n  <br> \"\n  <b>The most tragic</b>\" - This option changes the meaning of the sentence. It implies that Edward II is the most tragic among all plays by the dramatist, rather than comparing it to other plays.\n  <br> \"\n  <b>Less tragic than</b>\" - This option correctly provides the comparative form by using \"less tragic than.\" It implies that Edward II is not as tragic as some other plays by the dramatist.\n  <br>The correct answer is option (d) \"less tragic than\" because it provides the appropriate comparative form and maintains the intended meaning of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>He sighed again, gripping her shoulders, his gaze \n  <b>stern</b>.\n  <br>", "option1": "Flippant\n  <br>", "option2": "Permissive \n  <br>", "option3": "Desolate\n  <br>", "option4": "Noxious\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Stern</b> (adjective): Serious and strict in manner or attitude; not showing or allowing any kind of leniency or indulgence.\n  <br>Synonyms: strict, severe, harsh, firm, rigid, austere.\n  <br>Antonyms: lenient, gentle, lax, indulgent, \n  <b>permissive.</b> \n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Flippant</b> - lacking seriousness or respect, showing a lack of concern or seriousness, often inappropriately or irreverently.\n  <br> \n  <b>Permissive</b> - allowing or characterized by great freedom or leeway; not strict or restrictive in enforcing rules or regulations.\n  <br> \n  <b>Desolate</b> - deserted, empty, or barren; feeling or showing great unhappiness, loneliness, or emptiness.\n  <br> \n  <b>Noxious</b> - harmful, poisonous, or unpleasant; capable of causing harm or damage to living beings or the environment.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "Select the most appropriate option to fill in the blank.\n  <br>I decided to read a book to ______ time while waiting for my flight at the airport.\n  <br>", "option1": "Ignore\n  <br>", "option2": "Kill\n  <br>", "option3": "Move \n  <br>", "option4": "Ease \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (b) kill.\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Ignore</b>: to pay no attention to or disregard something. However, in this context, it doesn't convey the intended meaning of passing time or finding an activity to occupy oneself.\n  <br> \n  <b>Kill (time)</b>: to spend or pass time in an enjoyable or engaging way. This option fits the context well, suggesting that the person decided to read a book as a means of making the time pass more quickly and enjoyable.\n  <br> \n  <b>Move</b>: to change or shift position. This option doesn't fit the context because it doesn't convey the idea of passing time or finding an activity to occupy oneself.\n  <br> \n  <b>Ease</b>: to make something less difficult or more comfortable. This option doesn't fit the context because it doesn't convey the idea of passing time or finding an activity to occupy oneself.\n  <br>Therefore, the most suitable option for the given sentence is (b) kill, which means spending time in an enjoyable or engaging way.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who is excessively concerned with their own interests, welfare, or well-being.\n  <br>", "option1": "Narcissist\n  <br>", "option2": "Egoist \n  <br>", "option3": "Selfish\n  <br>", "option4": "Dictator\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that can be used as a one-word substitute for the given group of words \"A person who is excessively concerned with their own interests, welfare, or well-being.\" is (b) Egoist.\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Narcissist</b>: a person who has an excessive interest or admiration for oneself, especially their physical appearance or abilities. A narcissist is characterized by self-centeredness and a grandiose sense of self-importance.\n  <br> \n  <b>Egoist</b>: a person who is excessively concerned with their own interests, welfare, or well-being. An egoist is primarily focused on themselves and may disregard the needs or feelings of others.\n  <br> \n  <b>Selfish</b>: a person who is primarily concerned with their own interests and lacks consideration for others. Selfish individuals prioritize their own needs and desires above those of others.\n  <br> \n  <b>Dictator</b>: a ruler who has complete control and power over a country, often obtained and maintained through force. While a dictator may have a high level of self-importance, the term doesn't specifically denote excessive admiration for one's appearance.\n  <br> Among the options provided, (b) Egoist best describes a person who is excessively concerned with their own interests, welfare, or well-being.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Identify the INCORRECTLY spelt word in the given sentence.\n  <br>It may not sound like any bath you've ever taken (when was the last time you lathered up in a patchouli-scented product?), but this convoction is a surprisingly accurate take on its intended essence.\n  <br>", "option1": "Essence\n  <br>", "option2": "Lathered\n  <br>", "option3": "Patchouli\n  <br>", "option4": "Convoction\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The incorrectly spelled word in the given sentence is (d) convoction. The correct spelling should be \"concoction.\"\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Essence</b>: the intrinsic nature or indispensable quality of something. In this sentence, it refers to the intended fundamental nature or quality.\n  <br> \n  <b>Lathered</b>: covered with lather, which is a frothy mixture of soap and water. In this sentence, it describes the act of applying lather during a bath or shower.\n  <br> \n  <b>Patchouli</b>: a fragrant oil derived from a plant (Pogostemon cablin) used in perfumes and soaps. It has a distinctive, musky scent. In this sentence, it refers to the scented product used during a bath.\n  <br> Convoction (incorrect): The correct spelling is \"\n  <b>Concoction</b>,\" which means a mixture or combination of ingredients or elements. In this sentence, it refers to the particular mixture being described.\n  <br>Therefore, the incorrectly spelled word is (d) convoction, and it should be corrected to \"concoction\" to maintain proper spelling.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Replace the highlighted word with its synonym to make the sentence more meaningful.\n  <br>I delight in his lack of patience with everyone from students to politicians who demonstrate inexcusable ignorance, incompetence or \n  <b>obfuscation</b>. \n  <br>", "option1": "Illuminate\n  <br>", "option2": "Obscurity\n  <br>", "option3": "Standard\n  <br>", "option4": "Revelation\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Obfuscation</b> refers to the act of deliberately making something unclear, confusing, or difficult to understand.\n  <br>Synonyms: confuse, \n  <b>obscure</b>, muddle, befuddle.\n  <br>Antonyms: clarify, elucidate, illuminate, reveal.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Illuminate</b>: to clarify, shed light on, or make something clear and understandable.\n  <br> \n  <b>Obscurity</b>: the state of being unclear, unknown, or difficult to understand or perceive.\n  <br> \n  <b>Standard</b>: a widely accepted or recognized level of quality, excellence, or norm.\n  <br> \n  <b>Revelation</b>: the act of disclosing or revealing something previously unknown or hidden.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Select the appropriate idiom that can replace the highlighted phrase in the following sentence.\n  <br>The political debate turned into a \n  <b>chaotic situation</b> as the candidates started hurling insults at each other.\n  <br>", "option1": "at stone’s throw\n  <br>", "option2": "carpet bomb\n  <br>", "option3": "a bear garden\n  <br>", "option4": "at sixes and sevens\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The appropriate idiom that can replace the highlighted phrase \"chaotic situation\" in the sentence is (c) a bear garden.\n  <br>Meanings of the options:\n  <br> \n  <b>At a stone's throw</b>: very close in distance, implying proximity. However, it doesn't convey the sense of chaos or disorder.\n  <br> \n  <b>Carpet bomb</b>: to bombard or attack extensively and indiscriminately. This phrase doesn't capture the specific meaning of chaos in the given context.\n  <br> \n  <b>A bear garden</b>: a chaotic or rowdy situation, often characterized by aggressive or unruly behavior. This idiom accurately conveys the sense of disorder and tumultuousness.\n  <br> \n  <b>At sixes and sevens</b>: in a state of confusion or disorder. While this option does convey a sense of disorder, it doesn't capture the context of a political debate or the act of hurling insults.\n  <br>Therefore, the most suitable idiom to replace the highlighted phrase is (c) a bear garden, indicating a chaotic situation.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Fयन पुध ीयहन-ौधnपधncध (S1 पय S4) ूोनोgनोूु ृिधयथ, ौधnपधncधौ S1 ोnक S4 ोनध giॅधn. Fनयं पुध यूपiयnौ P, Q, R, ोnक S ौिधधcप पुध ोूूनयूनiोपध ौधnपधncधौ ीयन S2 ोnक S3, नधौूधcपiॅिधद. (S1) On Jहnध 30, 2023, पुध Kोनnोपोाो Higु Cयहनप कiौंiौौधक Tथiपपधन’ौ cुोििधngध पय पुध iौौहोncध यी ृियcाing यनकधनौ ृद पुध Miniौपनद यी Eिधcपनयnicौ ोnक Inीयनंोपiयn Tधcुnिययgद (MधiपY) in cयnnधcपiयn थiपु पुध पोाing कयथn यी Tथiपपधन ोccयहnपौ ोnक ौूधciीic पथधधपौ. (S2) (S3) (S4) Mयनधयॅधन, iप धसुiृiपौ ो nधथ पनधnक पय ुinकधन कigiपोि नigुपौ ोnक पुध धसधनciौध यी ीनधध ौूधधcु यn पुध gनयहnकौ यी पुध कiौौधंinोपiयn यी ीोिसध ौूधधcु. (P) Tुध Higु Cयहनप ोिसय हnकधनुोnकधिकद ूनोiौधक Tथiपपधन ीयन हूुियकing iपौ ॅोिहधौ ोnक ूियiciधौ ोृयॅध धॅधनदपुing िधसध, पुयहgु iप थोौ धॅiकधnप पुोप पुध ुहकgधंधnप थोौ gयing पय ृध ोgोinौप पुधं. (Q) Tुध Higु Cयहनप ोकंयniौुधक Tथiपपधन ीयन nयप cयंूिदing थiपु पुध यनकधनौ ोnक iंूयौधक ोn ोौपयहnकing cयौप यी ₹50 िोाु यn पुध Uniपधक Sपोपधौ-ृोौधक ौयciोि ंधकiो cयंूोnद. (R) Tुध iौौहोncध यी ो थोनning ीनयं पुध cयहनप ुोौ ोिसय ोcपधक ोौ ौोिप यn थयहnकौ ोौ iप cनधोपधौ ो ूधनcधूपiयn पुोप पुध ूयथधन िiधौ थiपुin पुध ौपोपध ोnक पुधनध iौ nयपुing थध cोn कय ोृयहप iप. (S) Tुध ुहकgंधnप हnकधनंinधौ पुध नigुप पय ीनधध ौूधधcु ोnक धसूनधौौiयn ोnक ोिसय ूोॅधौ पुध थोद ीयन पुध ौपोपध पय धसधनciौध हncुधcाधक ूयथधन थुiिध पोाing कयथn cयnपधnप थiपुयहप ीियियथing धौपोृिiौुधक ूनयcधकहनध.", "option1": "Q, R\n  <br>", "option2": "P, S\n  <br>", "option3": "Q, S\n  <br>", "option4": "P, R\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (c) Q, S.\n  <br> In the given paragraph, the first sentence (S1) introduces the dismissal of Twitter's challenge to blocking orders by the Ministry of Electronics and Information Technology (MeitY). The final sentence (S4) highlights how this dismissal hinders digital rights and free speech.\n  <br> Sentence S2 needs to provide relevant information that follows logically from S1. \n  <b>Option Q, \"The High Court admonished Twitter for not complying with the orders and imposed an astounding cost of ₹50 lakh on the United States-based social media company,\"</b> is an appropriate choice as it presents the consequence faced by Twitter due to non-compliance with the orders.\n  <br> Sentence S3 should then continue the flow of the paragraph, expanding on the implications of the judgment. \n  <b>Option S, \"The judgment undermines the right to free speech and expression and also paves the way for the state to exercise unchecked power while taking down content without following established procedure,\"</b> aligns well with the theme of the paragraph, discussing the impact of the judgment on free speech and the state's power.\n  <br> Therefore, option (c) Q, S is the correct answer as it provides a coherent and logical progression of ideas in the paragraph.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Select the most appropriate option to fill in the blank.\n  <br>The gray eyes held a glint of something ________ than humor, but his lips twisted into a satirical smile.\n  <br>", "option1": "Mostly\n  <br>", "option2": "Most\n  <br>", "option3": "As\n  <br>", "option4": "More\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (d) more.\n  <br>Here's a detailed explanation of why the other options don't fit:\n  <br> \n  <b>Mostly</b>: This option doesn't fit in the context because \"mostly\" suggests a predominance or majority, which doesn't convey the intended meaning of something different than humor.\n  <br> \n  <b>Most</b>: Similar to option (a), \"most\" implies a majority or highest degree, which doesn't align with the intended meaning of something different than humor.\n  <br> \n  <b>As</b>: This option is incorrect because \"as\" is a comparative word that needs a second part to establish a comparison. In the given sentence, there is no second part of the comparison.\n  <br> \n  <b>More</b>: This is the correct option. \"More\" is used to indicate a greater degree or extent. In the sentence, it implies that the glint in the gray eyes is something beyond or different from humor. The use of \"more\" suggests that the glint holds a different quality or characteristic, enhancing the description of the person's expression.\n  <br>Therefore, the most suitable option for the given sentence is (d) more, as it conveys the intended meaning of something different than humor.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. The season of elections is upon us. \n  <br>B. The Opposition’s search for a winning electoral strategy to challenge the dominance of the Bharatiya Janata Party must \n  <br>C. The state of the nation, riven by endless schisms, dehumanising insensitivity to the human condition, and an accentuated assault on constitutional fundamentals presents an exceptional situation meriting an extraordinary response. \n  <br>D. An objective scrutiny of the state of ‘Naya Bharat and Shreshta Bharat’ lays bare as never before, the nation’s depressing social and political realities.\n  <br>E. contend with the inherent contradictions of a fractured polity that has birthed the disarrayed political parties but which must now come together in a unity of larger purpose. \n  <br>", "option1": "ABECD\n  <br>", "option2": "ACDBE\n  <br>", "option3": "DAECB\n  <br>", "option4": "DABEC \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order to form a meaningful and coherent paragraph is (a) ABECD.\n  <br> The paragraph discusses the state of the nation, the upcoming elections, and the challenges faced by the opposition party. Let's analyze each sentence:\n  <br> A. \"The season of elections is upon us.\"\n  <br>This sentence sets the context by stating that the election season is approaching.\n  <br> B. \"The Opposition’s search for a winning electoral strategy to challenge the dominance of the Bharatiya Janata Party must...\"\n  <br>This sentence introduces the opposition party's search for an electoral strategy to challenge the dominance of the Bharatiya Janata Party (BJP).\n  <br> E. \"...contend with the inherent contradictions of a fractured polity that has birthed the disarrayed political parties but which must now come together in a unity of larger purpose.\"\n  <br>This sentence highlights the inherent contradictions within the fractured polity and emphasizes the need for disarrayed political parties to come together for a common purpose.\n  <br> C. \"The state of the nation, riven by endless schisms, dehumanizing insensitivity to the human condition, and an accentuated assault on constitutional fundamentals presents an exceptional situation meriting an extraordinary response.\"\n  <br>This sentence describes the state of the nation, emphasizing the endless schisms, dehumanizing insensitivity, and assault on constitutional fundamentals, which demand an extraordinary response.\n  <br> D. \"An objective scrutiny of the state of ‘Naya Bharat and Shreshta Bharat’ lays bare as never before, the nation’s depressing social and political realities.\"\n  <br>This sentence presents the need for an objective scrutiny of the state of the nation, highlighting the depressing social and political realities that are exposed.\n  <br> Putting these sentences together in the order ABECD, we get a coherent and meaningful paragraph that discusses the election season, the challenges faced by the opposition, the fractured polity, and the state of the nation.\n  <br>Therefore, the correct answer is option (a) ABECD.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the option that expresses the given sentence in active voice.\n  <br>Give me the book.\n  <br>", "option1": "The book was given by me.\n  <br>", "option2": "Let the book be given by me.\n  <br>", "option3": "Let the book be given to me.\n  <br>", "option4": "The book is given by me.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given imperative sentence is \"Give me the book.\" In order to transform it into the passive voice, we need to change the structure so that the object becomes the subject and the subject becomes the agent of the action.\n  <br>Let's analyze the options:\n  <br> \n  <b>The book was given by me.</b> - This option correctly transforms the sentence into the passive voice, where the book becomes the subject and \"was given\" indicates the passive voice construction. However, the preposition \"by\" should be followed by the agent of the action, so this option is not suitable.\n  <br> \n  <b>Let the book be given by me.</b> - This option correctly transforms the first half of the sentence into the passive voice using the construction \"let + object + be + past participle.\" The sentence indicates that someone is requesting or allowing the book to be given by the speaker. This option is an incorrect transformation of the sentence into the passive voice since it does not define the receiver and in active voice the subject is asking for the book not giving it to someone else.\n  <br> \n  <b>Let the book be given to me.</b> - This option correctly transforms the sentence into the passive voice using the construction \"\n  <b>let + object + be + past participle.</b>\" The sentence indicates that someone is requesting or allowing the book to be given to the speaker. This option is a correct transformation of the sentence into the passive voice.\n  <br> \n  <b>The book is given by me.</b> - This option does not correctly transform the sentence into the passive voice because the active voice is maintained, and the subject \"book\" is still the subject in the sentence.\n  <br>Therefore, the correct answer is (c) Let the book be given to me, which transforms the imperative sentence into the passive voice.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the option that expresses the given sentence in indirect speech.\n  <br>My mother said to me, “Go play in the backyard.”\n  <br>", "option1": "My mother said to me go play in the backyard.\n  <br>", "option2": "My mother told me to play in the backyard.\n  <br>", "option3": "My mother assured me not to play in the backyard.\n  <br>", "option4": "My mother refused me to play in the backyard.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that expresses the given sentence in indirect speech is (b) My mother told me to play in the backyard.\n  <br>To convert a sentence from direct speech to indirect speech, you typically follow these rules:\n  <br> Reporting verb: Identify the reporting verb in the direct speech sentence. In this case, the reporting verb is \"said.\"\n  <br> Reporting clause: Introduce the reported speech using an appropriate reporting clause such as \"told,\" \"said to,\" \"asked,\" etc.\n  <br> Change of pronouns and verb forms: Adjust the pronouns and verb forms to match the perspective of the reporting clause.\n  <br>Applying these rules to the given sentence, \"My mother said to me, 'Go play in the backyard',\" the indirect speech transformation is:\n  <br>Direct speech: \"Go play in the backyard.\"\n  <br>Indirect speech: My mother told me to play in the backyard.\n  <br>Explanation of options:\n  <br> \n  <b>My mother said to me go play in the backyard.</b> - This option is incorrect as it presents the reported speech without the appropriate reporting clause and without adjusting the pronouns and verb forms.\n  <br> \n  <b>My mother told me to play in the backyard.</b> - This option correctly presents the reported speech with the reporting clause \"told\" and adjusts the pronouns and verb forms to match the indirect speech.\n  <br> \n  <b>My mother assured me not to play in the backyard.</b> - This option changes the meaning of the original sentence, as \"assured\" implies the opposite of the original directive. It is not an accurate representation of the indirect speech transformation.\n  <br> \n  <b>My mother refused me to not play in the backyard.</b> - This option also changes the meaning of the original sentence, as \"refused\" implies a denial or rejection of the request. It is not an accurate representation of the indirect speech transformation.\n  <br> Therefore, the correct answer is (b) My mother told me to play in the backyard, which accurately represents the given sentence in indirect speech by using the appropriate reporting verb, adjusting the pronouns, and maintaining the correct tense.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the appropriate idiom that can replace the highlighted phrase in the following sentence.\n  <br>In the face of adversity, it is often said that \n  <b>cowards</b> falter while the brave endure, however, I believe that even those labelled as cowards have the potential to muster extraordinary courage when pushed to their limits. \n  <br>", "option1": "Fifth wheel \n  <br>", "option2": "Feel blue \n  <br>", "option3": "Yellow bellies \n  <br>", "option4": "Full of beans \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The appropriate idiom that can replace the highlighted phrase \"labelled as cowards\" in the sentence is (c) Yellow bellies.\n  <br>Here are the meanings of all the options:\n  <br> \n  <b>Fifth wheel</b>: Someone or something that is unnecessary, surplus, or superfluous to a situation or group. It doesn't convey the meaning of being labeled as cowards.\n  <br> \n  <b>Feel blue</b>: To feel sad or depressed. This option doesn't capture the meaning of being labeled as cowards.\n  <br> \n  <b>Yellow bellies</b>: A term used to describe someone who is considered cowardly or lacking courage. It aligns well with the context of the sentence, as it refers to individuals labeled as cowards.\n  <br> \n  <b>Full of beans</b>: To be energetic, lively, or enthusiastic. This idiom doesn't fit the context of being labeled as cowards.\n  <br>Among the options provided, (c) Yellow bellies is the most suitable idiom to replace the highlighted phrase, as it accurately conveys the meaning of individuals who are considered cowards.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "<b>Select the option to fill in the blank no. 1. </b> \n  <br>", "option1": "Shared\n  <br>", "option2": "Sharing\n  <br>", "option3": "Share\n  <br>", "option4": "To Share\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘sharing’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>Shared</b>: past tense or past participle of \"share,\" meaning to divide or distribute something among others.\n  <br> \n  <b>Sharing</b>: gerund form of \"share,\" meaning the act of dividing or distributing something among others.\n  <br> \n  <b>Share</b>: base form of the verb, meaning to divide or distribute something among others.\n  <br> \n  <b>To share</b>: infinitive form of the verb, indicating the purpose or intention to divide or distribute something among others.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>Select the option to fill in the blank no. 2. </b> \n  <br>", "option1": "They\n  <br>", "option2": "The\n  <br>", "option3": "Them\n  <br>", "option4": "There\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘the’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>They</b>: pronoun referring to multiple people or things as the subject of a sentence.\n  <br> \n  <b>The</b>: definite article used to specify or identify a particular noun.\n  <br> \n  <b>Them</b>: pronoun used as the object of a verb or preposition to refer to multiple people or things.\n  <br> \n  <b>There</b>: adverb used to indicate a place or location.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "<b>Select the option to fill in the blank no. 3. </b> \n  <br>", "option1": "For\n  <br>", "option2": "In\n  <br>", "option3": "Of\n  <br>", "option4": "At\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘of’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>For</b>: preposition indicating the purpose, goal, or intended recipient.\n  <br> \n  <b>In</b>: preposition indicating location or inclusion within something.\n  <br> \n  <b>Of</b>: preposition indicating possession, association, or origin.\n  <br> \n  <b>At</b>: preposition indicating location or a specific point in time.\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "<b>Select the option to fill in the blank no. 4. </b> \n  <br>", "option1": "At\n  <br>", "option2": "For\n  <br>", "option3": "To\n  <br>", "option4": "With\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘to’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>At</b>: preposition indicating location or a specific point in time.\n  <br> \n  <b>For</b>: preposition indicating purpose, benefit, or intended recipient.\n  <br> \n  <b>To</b>: preposition indicating direction or movement towards something or someone.\n  <br> \n  <b>With</b>: preposition indicating association or accompaniment.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Select the option to fill in the blank no. 5. </b> \n  <br>", "option1": "To\n  <br>", "option2": "For\n  <br>", "option3": "Of\n  <br>", "option4": "With\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘of’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>To</b>: preposition indicating direction or movement towards something or someone.\n  <br> \n  <b>For</b>: preposition indicating purpose, benefit, or intended recipient.\n  <br> \n  <b>Of</b>: preposition indicating possession, association, or origin.\n  <br> \n  <b>With</b>: preposition indicating association or accompaniment.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "What distinguishes a situation of potential injustice for an animal like Susan?\n  <br>", "option1": "The presence of various hurdles, both frivolous and serious, in her life\n  <br>", "option2": "The deliberate destruction of her home by another creature\n  <br>", "option3": "Being free in sanitary conditions \n  <br>", "option4": "The interference of another creature that obstructs her goals\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) The deliberate destruction of her home by another creature.\n  <br>Refer to, \"What, though, if Susan’s home was destroyed deliberately by a creature that ought to have known better?\"\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "According to Martha Nussbaum, what is the key consideration in determining if Susan, as a non-human animal, has suffered injustice?\n  <br>", "option1": "Whether Susan is capable of understanding the concept of justice\n  <br>", "option2": "The extent to which Susan's suffering is comparable to that of a human being\n  <br>", "option3": "Whether our conception of justice should encompass non-human animals\n  <br>", "option4": "The severity of the hurdles and challenges Susan faces in her life\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (c) Whether our conception of justice should encompass non-human animals.\n  <br>Refer to, \"Should the fact that she is a non-human animal matter? Should not our conception of justice make space for Susan?\"\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "How does the passage argue for including non-human animals in our conception of justice?\n  <br>", "option1": "By highlighting the similarities between the suffering of humans and non-human animals\n  <br>", "option2": "By suggesting that non-human animals should be granted constitutional rights\n  <br>", "option3": "By emphasizing the need for a more enlightened approach to animal welfare within our legal system\n  <br>", "option4": "By proposing that animals should be considered legal persons with standing in court\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (c) By emphasizing the need for a more enlightened approach to animal welfare within our legal system.\n  <br>Refer to, \"To confer personhood on animals will unquestionably bring with it various vexing quandaries. Should this, though, stop us from seeing the Constitution as a tool for ensuring justice for animals? Is there not enough room available within the abstract guarantees of the Constitution for a more enlightened approach to animal welfare?\"\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "In what context does the passage mention the Supreme Court of India's involvement in the jallikattu case?\n  <br>", "option1": "To illustrate the court's previous ruling declaring the practice illegal\n  <br>", "option2": "To highlight the court's opportunity to establish a fairer animal welfare code\n  <br>", "option3": "To examine the court's contradictory response to arguments of personhood for animals\n  <br>", "option4": "To showcase the retrograde effort of the court in resolving the conflict\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) To highlight the court's opportunity to establish a fairer animal welfare code.\n  <br>Refer to, \"The case offered a signal opportunity for the Court to usher India’s animal welfare code onto a fairer path.\"\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "How does the Government of Tamil Nadu defend the amendments to the Union law on animal welfare?\n  <br>", "option1": "By asserting the importance of preserving the state's tradition and culture\n  <br>", "option2": "By claiming that the amendments align with the verdict in A. Nagaraja\n  <br>", "option3": "By arguing that animals should be treated as legal persons with fundamental rights\n  <br>", "option4": "By emphasizing the legislative competence of the government to amend the law\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (a) By asserting the importance of preserving the state's tradition and culture.\n  <br>Refer to, \"The government said the law (which later received the President of India’s assent) was made with a view to preserving the State’s tradition and culture.\"\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "How does the Supreme Court respond to claims of personhood for animals in the jallikattu case?\n  <br>", "option1": "By conferring fundamental rights on animals similar to those of humans\n  <br>", "option2": "By testing the amending law's reasonableness within the framework of Article 14\n  <br>", "option3": "By asserting that animal rights can only be invoked by juridical entities\n  <br>", "option4": "By declaring that animals cannot be considered legal persons under the Constitution\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) By asserting that animal rights can only be invoked by juridical entities.\n  <br>The relevant lines supporting this answer are: \"But having said this, the Court then claims that the amending law can still be tested on an anvil of reasonableness that is contained in Article 14 of the Constitution. But that right too, it says, cannot be invoked by any animal as a person, but only 'at the instance of a human being or a juridical person who may espouse the cause of animal welfare.'\"\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "Why does the author find the Court's response to claims of personhood contradictory?\n  <br>", "option1": "The Court suggests that the amending law can be tested on the basis of reasonableness despite denying animal personhood.\n  <br>", "option2": "The Court acknowledges that animals cannot invoke rights but claims they can be protected through human intervention.\n  <br>", "option3": "The Court states that animals cannot enjoy fundamental rights but can still be considered juridical entities.\n  <br>", "option4": "The Court argues that fundamental rights cannot be conferred on animals while invoking Article 14 for testing the law's reasonableness.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) The Court suggests that the amending law can be tested on the basis of reasonableness despite denying animal personhood.\n  <br>The relevant lines supporting this answer are: \"The Court begins by holding that there is no precedent bestowing fundamental rights on animals in India... the Court then claims that the amending law can still be tested on an anvil of reasonableness that is contained in Article 14 of the Constitution.\"\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "According to the passage, what role should the Constitution play in ensuring animal welfare?\n  <br>", "option1": "The Constitution should explicitly bestow fundamental rights on animals.\n  <br>", "option2": "The Constitution should treat the advancement of animal welfare as a parliamentary prerogative.\n  <br>", "option3": "The Constitution should be interpreted to accommodate basic requirements of animal welfare.\n  <br>", "option4": "The Constitution should exclude animals from considerations of justice and welfare.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) The Constitution should be interpreted to accommodate basic requirements of animal welfare.\n  <br>The relevant lines supporting this answer are: \"Instead, what we can do is to see how best to mend our conception of rights to partake basic requirements of animal welfare as intrinsic to our constitutional arrangement... we must see it as our collective obligation to extend our commitment to justice not only to human beings but to animals too.\"\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "How does the author question the Court's approach to animal welfare and constitutional rights?\n  <br>", "option1": "By challenging the Court's assertion that animals are not persons under the Constitution.\n  <br>", "option2": "By suggesting that animal rights should be given equal weight to human rights within the constitutional framework.\n  <br>", "option3": "By criticizing the Court for not thoroughly analyzing the impact of the Tamil Nadu amendments on equal treatment.\n  <br>", "option4": "By questioning whether the Court's contradictory reasoning reflects a fair exercise of judicial power.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) By suggesting that animal rights should be given equal weight to human rights within the constitutional framework.\n  <br>The relevant lines supporting this answer are: \"The answer to the debate lies not necessarily in seeing animals as persons with standing, or in bestowing on them a set of justiciable rights. Instead, what we can do is to see how best to mend our conception of rights to partake basic requirements of animal welfare as intrinsic to our constitutional arrangement.\"\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "What does the author argue should be our collective obligation regarding justice?\n  <br>", "option1": "Extending our commitment to justice to both human beings and animals.\n  <br>", "option2": "Prioritizing animal welfare over human rights within our constitutional framework.\n  <br>", "option3": "Pहनौहing ोn ोकॅोncधक िधgोि ीनोंधथयना पुोप नधcयgnप्रधौ ोniंोिस ोौ िधgोि ूधनौयnौ.", "option4": "Rधcयgnप्रing ोniंोिसै ूधनौयnुययक थiपु ीहnकोंधnपोि नigुपौ cयnीधननधक ृद Pोिनiोंधnप.", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) Extending our commitment to justice to both human beings and animals.\n  <br>The relevant lines supporting this answer are: \"Indeed, we must see it as our collective obligation to extend our commitment to justice not only to human beings but to animals too.\"\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What is the primary reason behind the continued existence of multilateral groupings like the Non-Aligned Movement (NAM) and G-77, despite losing their relevance?\n  <br>", "option1": "They have managed to adapt to changing geopolitical dynamics.\n  <br>", "option2": "They continue to attract numerous nations seeking admission.\n  <br>", "option3": "The Secretariats of these groupings actively engage in various activities.\n  <br>", "option4": "They maintain their existence for historical and symbolic purposes.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) They have managed to adapt to changing geopolitical dynamics.\n  <br>The relevant lines supporting this answer are: \"Mysterious are the ways in which multilateral groupings prosper and wither away... The Non-Aligned Movement (NAM) and G-77 had their heyday in the Cold War era. Later they lost their relevance, but they still exist.\"\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "What led to the increased global economic stress and damaged India-China ties, ultimately impacting the BRICS group?\n  <br>", "option1": "The COVID-19 pandemic, the Galwan clash, and the Ukraine conflict\n  <br>", "option2": "The diminishing power of Russia and policy divergences on China and Myanmar\n  <br>", "option3": "The loss of relevance and policy divergences within the BRICS group\n  <br>", "option4": "The decreased participation and involvement of Brazil and South Africa\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) The COVID-19 pandemic, the Galwan clash, and the Ukraine conflict.\n  <br>The relevant lines supporting this answer are: \"COVID-19, the Galwan clash, and the Ukraine conflict resulted in increased global economic stress, damaged India-China ties, and turned Russia into a diminishing power.\"\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "How did China manage to bring South Africa into the BRICS group?\n  <br>", "option1": "By gaining support from Brazil and India for including South Africa\n  <br>", "option2": "By playing a trump card and offering South Africa membership in BRIC\n  <br>", "option3": "By convincing South Africa to join BRIC instead of the IBSA group\n  <br>", "option4": "By leveraging its influence and convincing South Africa to join BRICS\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) By playing a trump card and offering South Africa membership in BRIC.\n  <br>The relevant lines supporting this answer are: \"Rebuffed, China played a trump card, and decided to bring South Africa into BRIC, thus turning it into BRICS.\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What were the key areas of focus for the BRICS group in terms of geopolitical and economic dimensions?\n  <br>", "option1": "Strengthening democracy and promoting regional cooperation\n  <br>", "option2": "Launching new initiatives for economic development and cooperation\n  <br>", "option3": "Addressing global and regional issues from a non-western perspective\n  <br>", "option4": "Ensuring the dominating influence of the West is curbed\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) Addressing global and regional issues from a non-western perspective.\n  <br>The relevant lines supporting this answer are: \"By articulating a common view on key global and regional issues, it projected a non-western view. This strengthened the world’s march towards multipolarity, thus helping to curb the dominating influence of the West.\"\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "What does the mention of a frozen formulation in every BRICS communiqué indicate?\n  <br>", "option1": "BRICS group's diplomatic bankruptcy and inability to secure UN Security Council membership\n  <br>", "option2": "The reluctance of China and Russia to fully support Brazil, India, and South Africa's UN aspirations\n  <br>", "option3": "BRICS group's ongoing efforts to enhance their role within the United Nations\n  <br>", "option4": "The lack of progress and cooperation within
