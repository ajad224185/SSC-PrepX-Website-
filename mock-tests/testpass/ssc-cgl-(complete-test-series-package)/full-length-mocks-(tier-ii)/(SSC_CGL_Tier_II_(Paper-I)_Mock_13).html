<strong>Lipase </strong>is the digestive enzyme of fat.</li>\r\n\t<li>Ptyalin is the digestive enzyme of the <strong>Saliva.</strong></li>\r\n\t<li><strong>Hydrochloric acid </strong>is produced naturally in the human stomach to help the digestion of food.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>How much fertiliser subsidy was approved by the Cabinet for 2023-24 Kharif Season?</p>", "option1": "\r\n<p>Rs 1.04 lakh crore</p>", "option2": "\r\n<p>Rs 1.06 lakh crore</p>", "option3": "\r\n<p>Rs 1.08 lakh crore</p>", "option4": "\r\n<p>Rs 1.09 lakh crore</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct Answer is <u><strong>Rs 1.08 lakh crore</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li> The Union Cabinet has approved <strong>Rs 1.08 lakh</strong> crore fertiliser subsidy for the <strong>2023-24 Kharif season</strong>.</li>\r\n\t<li>The package includes <strong>Rs 70,000 crore for urea</strong> and <strong>Rs 38,000 crore for Di-ammonium Phosphate, or DAP</strong>.</li>\r\n\t<li>The total subsidy amount is lower than last year, but still higher than normal.</li>\r\n\t<li>The government has ensured that rising global fertilizer prices do not hurt India&#39;s farmers.</li>\r\n\t<li>The reduced fertilizer subsidy of <strong>Rs 1.08 lakh crore for the April-September kharif season</strong> will not lead to higher prices for farmers.</li>\r\n\t<li>The package is expected to benefit over 120 million farmers in the country.</li>\r\n\t<li>The government is committed to providing farmers with affordable fertilizers to help them increase production and productivity.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Consumer Protection Act proposes to give the Consumer Protection against</p>", "option1": "\r\n<p>Highly priced substandard goods</p>", "option2": "\r\n<p>Cheating by selling substandard goods</p>", "option3": "\r\n<p>Not getting one&#39;s money&#39;s worth</p>", "option4": "\r\n<p>Denial of relief if the product is not up to the mark</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Denial of relief if the product is not up to the mark .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  2nd  sentence  from the  1st  paragraph:-</li>\r\n\t<li><em><em>&quot;Spreading awareness about the rights of consumers and relief open to them <strong>in case they did not get their money&#39;s worth of goods and services has rightly been identified as the first priority </strong>.&quot;</em></em></li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that  the consumer protection act proposes to give Consumer protection against the denial of relief if the product isn&#39;t up to the mark.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>Government contributed to the consumer Protection Movement by</p>", "option1": "\r\n<p>Enactment of the Consumer Protection Act</p>", "option2": "\r\n<p>Clearing the backlog cases in the consumer court</p>", "option3": "\r\n<p>Toning up a district-level redressal machinery</p>", "option4": "\r\n<p>Setting up infrastructure</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>Setting up infrastructure .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  3rd  sentence  from the  2nd  paragraph:-\r\n\t<ul>\r\n\t\t<li><em>&quot;Government efforts remain confined at best to <strong>set up the infrastructure </strong>after the formal launch of the movement with the enactment of the Consumer Protection Act.&quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that<strong>the </strong><strong>government contributed to the consumer Protection Movement by</strong>setting up infrastructure.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n<p>Role of consumer bodies is</p>", "option1": "\r\n<p>To maintain minimum standards of quality</p>", "option2": "\r\n<p>To function as a government</p>", "option3": "\r\n<p>To make a plea to industry to exercise self - control</p>", "option4": "\r\n<p>To exercise social control over the market</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>To exercise social control over the market .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  2nd last  sentence  from the  2nd  paragraph:-\r\n\t<ul>\r\n\t\t<li><em>&quot;This is possible only if consumer bodies take over the watchdog role performed by the Government till now and exercise <strong>social control over the market </strong>to see the benefit of liberalization are not reaped by traders alone.&quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that<strong>the role of consumer bodies is to exercise social control over the market.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n<p>Spreading Consumer Protection Movement to the rural areas needs</p>", "option1": "\r\n<p>A multi-media approach</p>", "option2": "\r\n<p>Consumer organization to canvass this</p>", "option3": "\r\n<p>Message to be conveyed by village bodies</p>", "option4": "\r\n<p>Official patronage</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is A multi-media approach.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  1st  sentence  from the  2nd  paragraph - <em><em>&quot;While this may not be a difficult task in urban areas, where the movement is concentrated at present, taking it to the vast rural hinterland calls for a <strong>multi-media approach </strong>in which radio and television have a crucial role to play.&quot;</em></em></li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that   spreading Consumer Protection Movement to the rural areas needsa multi-media approach.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p><strong>Select the option in which the word &lsquo;extravagant&rsquo; can be used in the same context as mentioned in the passage.</strong></p>", "option1": "\r\n<p>The doctor made some __________ assertions about his research on tropical diseases.</p>", "option2": "\r\n<p>The infrastructural changes of the department will cater to __________ and wastage of resources.</p>", "option3": "\r\n<p>My mother yelled at me for me being _________.</p>", "option4": "\r\n<p>In some countries, maintaining a healthy lifestyle is linked to being ________.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Option 1</strong>.</p>\r\n\r\n<ul>\r\n\t<li>To select the option in which the word <strong>extravagant </strong>has been used in the same context as mentioned in the passage, we first need to understand the context in which the word was used.</li>\r\n\t<li>The <strong>second </strong>and <strong>third </strong>line of the <strong>second </strong>paragraph from the given passage states that -\r\n\t<ul>\r\n\t\t<li><em>&#39;The idea came from a study done in 1993, which found that college students who listened to Mozart&rsquo;s Sonata for Two Pianos in D Major (K 448) showed modest improvement in a test of spatial reasoning. This finding was later stretched into something more <strong>extravagant </strong>by the musician and entrepreneur Don Campbell ...&#39;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Extravagant </strong>is an adjective that means <strong>excessive or elaborate. </strong></li>\r\n\t<li>So, in the passage &#39;<strong>extravagant&#39; </strong>has been used to explain how a modest improvement was taken out of proportions. </li>\r\n\t<li>Of the given sentences, this meaning is applicable in <strong>option 1 </strong>where a doctor has made assertions that are out of proportion regarding his research. </li>\r\n\t<li>So, <strong>option 1 </strong>is the correct answer.</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct sentence</u> - </strong><em>The doctor made some <strong><u>extravagant</u></strong>assertions about his research on tropical diseases.</em></p>\r\n\r\n<ul>\r\n\t<li>In <strong>option 2, </strong>the blank needs a noun and not an adjective. The noun form of <strong>extravagant </strong>which is <strong>extravagance </strong>can fit here.\r\n\r\n\t<ul>\r\n\t\t<li><em>The infrastructural changes of the department will cater to <strong>extravagance </strong>and wastage of resources.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Extravagant </strong>can also mean lacking restraint in spending money or using resources.</li>\r\n\t<li>This meaning is applicable for <strong>options 3 and 4.</strong>\r\n\t<ul>\r\n\t\t<li>My mother yelled at me for me being <strong>extravagant</strong>.</li>\r\n\t\t<li> In some countries, maintaining a healthy lifestyle is linked to being <strong>extravagant</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>In what way were the writer of the passage and the elderly uncle similar?</p>", "option1": "\r\n<p>They both loved reading books.</p>", "option2": "\r\n<p>They both attended the car launch.</p>", "option3": "\r\n<p>They knew and liked each other.</p>", "option4": "\r\n<p>They both believed in punctuality.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>They both believed in punctuality</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the second paragraph says &quot;<em>A few days later, I was reminded of the same scene as <strong>I arrived to attend a book launch at the exact time given on the invitation card</strong></em>&#39;&#39;, the fourth sentence of the second paragraph says &#39;&#39;<em><strong>Shortly, as one elderly uncle landed</strong>, he laughingly told the author, &quot;Had you mentioned 3 p.m., instead of 4 p.m., many would have been here already</em>&#39;&#39; and the last sentence of the second paragraph concludes &#39;&#39;<em>However, most guests arrived by 5.30 p.m., followed by the chief guest, a politician, who arrived by 6 p.m., and the event finally commenced, and <strong>early birds like me and the uncle</strong> heaved a sigh of relief</em>.&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that <strong>the writer of the passage and the elderly uncle were similar as they both believed in punctuality</strong>.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 4.</p>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>Who was getting the invitations printed?</p>", "option1": "\r\n<p>An Indian couple living in India, who wanted to get their son married in India.</p>", "option2": "\r\n<p>A non-Indian couple who wanted to get their son married in India.</p>", "option3": "\r\n<p>An Indian couple settled abroad, who wanted to get their son married in India.</p>", "option4": "\r\n<p>An Indian couple who wanted to get their son married abroad.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>An Indian couple settled abroad, who wanted to get their son married in India</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the passage says &quot;<em><strong>If you want guests to arrive from 7 p.m., get 6 p.m. mentioned on the card as this is India</strong> where most people prefer arriving late, certainly an hour or even later than the appointed time</em>&#39;&#39; and the second sentence of the first paragraph says &#39;&#39;<em>I couldn&#39;t agree more as I overheard this suggestion  by a young employee at a printing press to <strong>an NRI couple finalizing the wedding cards of their son</strong></em>. &#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that <strong>an Indian couple who settled abroad, who wanted to get their son married in India was getting the invitations printed</strong>.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>&quot;I couldn&#39;t agree more as I overheard this suggestion...&quot;</p>\r\n\r\n<p>What suggestion is being referred to here?</p>", "option1": "\r\n<p>The time should not be mentioned in an invitation.</p>", "option2": "\r\n<p>The guests should be told to come on time.</p>", "option3": "\r\n<p>If one wants the guests to come at a particular time, then one should mention the time as one hour before.</p>", "option4": "\r\n<p>In India, one should not feel bad if guests do not come at the time mentioned in the invitation.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>If one wants the guests to come at a particular time, then one should mention the time as one hour before</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The given passage is all about <strong>punctuality in life</strong>.</li>\r\n\t<li>The first sentence of the passage says &quot;<em><strong>If you want guests to arrive from 7 p.m., get 6 p.m. mentioned on the card</strong> as this is India where most people prefer arriving late, certainly an hour or even later than the appointed time</em>&#39;&#39; and the second sentence of the first paragraph says &#39;&#39;<em><strong>I couldn&#39;t agree more as I overheard this suggestion</strong> by a young employee at a printing press to an NRI couple finalizing the wedding cards of their son</em>.&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that the suggestion referred here is &#39;&#39;<strong>If one wants the guests to come at a particular time, then one should mention the time as one hour before</strong>.&#39;&#39;</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>\r\n\r\n<ul>\r\n\t<li>Given below are the points, we should keep in mind while solving questions of reading comprehension-\r\n\t<ul>\r\n\t\t<li>Identify the purpose of reading. Try to go through the question first then the passage so that you can just focus on the things you need to look at in the passage.</li>\r\n\t\t<li>Anticipate what may lie ahead. Look out for specific information in the passage.</li>\r\n\t\t<li>Read the passage quickly to get a general idea of meaning or to find specific information, e.g. figures or names.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>What lesson did the writer learn in Singapore?</p>", "option1": "\r\n<p>One could get a free ride to the University hostel.</p>", "option2": "\r\n<p>One should never miss a bus.</p>", "option3": "\r\n<p>Not being punctual has disadvantages.</p>", "option4": "\r\n<p>Being punctual earns you respect.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>Not being punctual has disadvantages</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the fourth paragraph says &quot;<em><strong>Nearly a decade ago, when my schoolmates and I were busy shopping on our last day in Singapore after a week-long convention at a local university, our bus driver left us as we did not return to the bus at the time given by him</strong>, though we were late hardly by two or three minutes</em>&#39;&#39;, the second sentence of the fourth paragraph says &#39;&#39;<strong><em>We ended up shelling out dollars out of our pocket as we missed the free ride back to the university&#39;s hostel</em></strong>&#39;&#39; and the last sentence of the fourth paragraph says &#39;&#39;<em><strong>It was, of course, a lesson which certainly made me an early bird forever</strong>, and I know being one has many advantages in life!</em>&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that the lesson that the writer learnt in Singapore was not being punctual has disadvantages.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n<p>The type of threats to the security of a computer system or network are:</p>\r\n\r\n<p>(i) Interruption</p>\r\n\r\n<p>(ii) Interception</p>\r\n\r\n<p>(iii) Modification</p>\r\n\r\n<p>(iv) Creation</p>\r\n\r\n<p>(v) Fabrication</p>\r\n\r\n<p>Which of the following options is correct?</p>", "option1": "\r\n<p>i, ii, iii and iv only</p>", "option2": "\r\n<p>ii, iii, iv and v only</p>", "option3": "\r\n<p>i, ii, iii and v only</p>", "option4": "\r\n<p>All i, ii, iii, iv and v</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>i, ii, iii, and v only.</strong></u></p>\r\n\r\n<p>There are different types of security attacks that affect the communication process in the network and they are as follows:</p>\r\n\r\n<p><strong>Interruption </strong>:</p>\r\n\r\n<p>This type of attack is due to the obstruction of any kind during the communication process between one or more systems. So the systems which are used become unusable after this attack by unauthorized users which results in the wastage of systems.</p>\r\n\r\n<p><strong>Interception </strong>:</p>\r\n\r\n<p>The phenomenon of confidentiality plays an important role in this type of attack. The data or message which is sent by the sender is intercepted by an unauthorized individual where the message will be changed to a different form or it will be used by the individual for his malicious process. So the confidentiality of the message is lost in this type of attack.</p>\r\n\r\n<p><strong>Modification </strong>:</p>\r\n\r\n<p>As the name indicates the message which is sent by the sender is modified and sent to the destination by an unauthorized user. The integrity of the message is lost by this type of attack. The receiver cannot receive the exact message which is sent by the source which results in the poor performance of the network.</p>\r\n\r\n<p><strong>Fabrication </strong>:</p>\r\n\r\n<p>In this type of attack, a fake message is inserted into the network by an unauthorized user as if it is a valid user. This results in the loss of confidentiality, authenticity, and integrity of the message.</p>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>Which one of the following is not true about searching for content on the Internet?</p>", "option1": "\r\n<p>Use quotation marks</p>", "option2": "\r\n<p>Use complex search terms</p>", "option3": "\r\n<p>Use specific keywords</p>", "option4": "\r\n<p>Vary your search engine</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Use complex search terms</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>The<strong> Internet</strong> is referred to as a  world network that connects billions of computers across the world with one another. It uses a commonplace <strong>web protocol suite (TCP/IP)</strong> to attach billions of computer or digital device users worldwide.</li>\r\n\t<li>The<strong> Internet</strong> is a collection of computers that share information.</li>\r\n\t<li>There is no centralized administration for the Internet, whether for technical implementation or policies, for access and use.</li>\r\n\t<li>The Internet has millions of small home, educational, business and government networks.</li>\r\n\t<li>To <strong>search for content </strong>on the <strong>Internet</strong>, the user needs to use <strong>quotation marks </strong>after a question sentence. One must use <strong>specific keywords </strong>for searching on the Internet. Users should <strong>avoid complex search terms</strong>.</li>\r\n\t<li>The <strong>Internet </strong>was developed by <strong>Bob Kahn</strong> and <strong>Vint Cerf </strong>in the year <strong>1970</strong>. They began the planning of what we tend to these days grasp because of the &lsquo;Internet.&rsquo;</li>\r\n\t<li>At the very beginning, the Internet was known as <strong>ARPANET,</strong> which stands for <strong>Advanced Research Projects Agency Network</strong>. This was presupposed to be a communications system for the accumulation of the US of America - a network that might conjointly survive a nuclear attack.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>Which of the following statements is incorrect about the Windows operating system?</p>", "option1": "\r\n<p>Windows NT was developed by Oracle and marketed by Microsoft.</p>", "option2": "\r\n<p>Windows 10 was released in 2015.</p>", "option3": "\r\n<p>The Windows 1.0 operating system was an extension of MS-DOS.</p>", "option4": "\r\n<p>Windows NT supports preemptive multitasking</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is (1)</strong></p>\r\n\r\n<p>Windows NT was developed by Oracle and marketed by Microsoft.</p>\r\n\r\n<ul>\r\n\t<li>The first version of <strong>Windows NT, </strong>a proprietary graphical operating system created by Microsoft, was made available on July 27, 1993.</li>\r\n\t<li>Microsoft announced the release date of <strong>Windows 10 </strong>on July 29, 2015, on June 1.</li>\r\n\t<li><strong>Windows 1.0 </strong>was not a full operating system; rather, it was only an addition to MS-DOS, a previously available Microsoft product.</li>\r\n\t<li>A graphical user interface for <strong>MS-DOS </strong>was the initial version of Microsoft Windows. Yet, this product grew into a fully functional and contemporary operating system in the latter 1990s.</li>\r\n\t<li>Nearly all operating systems today, including the most recent versions of Windows, macOS, Linux (including Android), and iOS, enable <strong>preemptive multitasking.</strong></li>\r\n\t<li>Microsoft Windows is a personal computer operating system (OS) created by the Microsoft Corporation. It is also known as Windows and Windows OS (PCs).</li>\r\n\t<li>The Windows OS quickly took control of the PC market because it offered the first graphical user interface (GUI) for IBM-compatible Computers.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n<p>Which of the following options contains extensions of MS-Office files?</p>", "option1": "\r\n<p>xlsx, docx, pdfx</p>", "option2": "\r\n<p>xlsx, docx, pptx</p>", "option3": "\r\n<p>xls, doc, pdf</p>", "option4": "\r\n<p>ppt, doc, pdf</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>xlsx, docx, pptx</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>.xlsx, .docx, .pptx contains extensions of MS-Office files.</strong></li>\r\n\t<li>XLSX &ndash; is an <strong>Excel workbook.</strong></li>\r\n\t<li>DOCX is part of <strong>Microsoft Office Open XML </strong>specification (also known as OOXML or OpenXML) and was introduced with Office 2007. DOCX is a zipped, XML-based file format. Microsoft Word 2007 and later use DOCX as the default file format when creating a new document. Support for loading and saving legacy DOC files is also included (Docx &ndash; Word document).</li>\r\n\t<li>PPTX &ndash; is a <strong>PowerPoint Open XML Presentation file.</strong></li>\r\n\t<li>Office Open XML (OOXML) format was introduced with Microsoft Office 2007 and became the default format of Microsoft Excel ever since. Excel-related file extensions of this format include: .xlsx, .xlsm, .xltx, .xltm.</li>\r\n\t<li><strong>XLS </strong>&ndash; Legacy Excel worksheets; officially designated &quot;Microsoft Excel Worksheet&quot;.</li>\r\n\t<li><strong>DOC </strong>&ndash; Legacy Word document.</li>\r\n\t<li>The <strong>Portable Document Format (PDF) </strong> is a file format developed by Adobe.</li>\r\n\t<li><strong>PPT </strong>&ndash; Legacy PowerPoint presentation.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>Which of the following action cannot be performed on a received e-mail?</p>", "option1": "\r\n<p>Reply to the email</p>", "option2": "\r\n<p>Add attachment</p>", "option3": "\r\n<p>Forward the email</p>", "option4": "\r\n<p>Delete the email</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 2 i.e.,<strong><u>Add attachment</u></strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Attachment </strong>can be added through while sending an email to a recipient.</li>\r\n\t<li><strong>Electronic Mail or e-mail </strong>is a method of exchanging messages between people using electronic devices.</li>\r\n\t<li><strong>Ray Tomlinson </strong>is universally credited as the creator of e-mail as part of a program for <strong>ARPANET in 1971.</strong></li>\r\n\t<li>He developed the first system able to send mail between users on different hosts across the ARPANET, using the <strong>@ sign </strong>to link the user name with the destination server.</li>\r\n\t<li>By the mid of the <strong>1970s, </strong>this was the form recognized as email.</li>\r\n\t<li>Email operates across computer networks primarily the <strong>Internet.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>&#39;Ctrl + X&#39; shortcut key is used for _______.</p>", "option1": "\r\n<p>Paste the contents of the clipboard</p>", "option2": "\r\n<p>To copy the formatting of the selected text from the document</p>", "option3": "\r\n<p>Cut selected text from a document and place it on the clipboard</p>", "option4": "\r\n<p>To copy selected text from a document and place it on the clipboard</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is (3)</strong></p>\r\n\r\n<p>Cut selected text from a document and place it on the clipboard</p>\r\n\r\n<ul>\r\n\t<li>Control + x is the combination of the control key and a key that is often called &quot;x&quot; (lower-case letter ex) in computer terminology.</li>\r\n\t<li>This combination is typically used to cut chosen text and save it to the clipboard so that it can be pasted elsewhere.</li>\r\n\t<li>Ctrl+X, also known as Control+X and C-x, X, is a keyboard shortcut that is frequently used to cut a selected area of text, an image, or another object.</li>\r\n\t<li>If you accidentally cut something, you can undo your last action and recover the object by pressing Ctrl + Z.</li>\r\n</ul>\r\n\r\n<p>These shortcuts come in handy for text processing and file management tasks in particular.</p>\r\n\r\n<ul>\r\n\t<li>Save using Ctrl-S.</li>\r\n\t<li>Open using Ctrl-O.</li>\r\n\t<li>New (Ctrl-N).</li>\r\n\t<li>Copy with Ctrl-C.</li>\r\n\t<li>Paste using Ctrl-V.</li>\r\n\t<li>Snip with Ctrl-X.</li>\r\n\t<li>Undo is accessible by pressing Ctrl-Z.</li>\r\n\t<li>Strike all with Ctrl-A.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n<p>______ is a temporary memory.</p>", "option1": "\r\n<p>Random Access Memory</p>", "option2": "\r\n<p>Read As Memory</p>", "option3": "\r\n<p>Read Access Memory</p>", "option4": "\r\n<p>Random As Memory</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Random Access Memory</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><u><strong> Random Access Memory(RAM)</strong></u>\r\n\r\n\t<ul>\r\n\t\t<li>It directly provides the required information to the processor.</li>\r\n\t\t<li>RAM is a volatile memory.</li>\r\n\t\t<li>It provides temporary storage for data and instructions.</li>\r\n\t\t<li>RAM is classified into two categories:</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li>Static Random Access Memory</li>\r\n\t<li>Dynamic Random Access Memory.</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li><u><strong>Read-Only Memory(ROM)</strong></u>\r\n\r\n\t<ul>\r\n\t\t<li>It is used for storing standard processing programs that permanently reside in the computers.</li>\r\n\t\t<li>Generally, designers program ROM chips at the time of manufacturing circuits.</li>\r\n\t\t<li>It is a non-volatile memory.</li>\r\n\t\t<li>It can only be read not written.</li>\r\n\t\t<li>ROM is classified into three categories:</li>\r\n\t</ul>\r\n\r\n\t<ol>\r\n\t\t<li>Programmable ROM</li>\r\n\t\t<li>Erasable Programmable ROM</li>\r\n\t\t<li>Electrically Erasable Programmable ROM</li>\r\n\t</ol>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n<p>An example for magnetic storage device is:</p>", "option1": "\r\n<p>OMR</p>", "option2": "\r\n<p>Hard Disk</p>", "option3": "\r\n<p>CD-ROM disc</p>", "option4": "\r\n<p>Memory Strip</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option<strong><u>2,</u></strong>i.e.<u><strong>Hard Disk</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Magnetic storage </strong>is one of the most affordable ways to store large amounts of data.</li>\r\n\t<li><strong>Magnetic storage </strong>uses the two types of magnetic polarities to represent the binary information consisting of zeros and ones.</li>\r\n\t<li><strong>Magnetic storage devices </strong>store data by magnetizing particles on a disk or tape. Commonly used devices that use magnetic storage include <strong>magnetic tape </strong>,<strong>floppy disks </strong>and <strong>hard-disk drives </strong>.</li>\r\n\t<li>The <strong>hard disk </strong>is a spindle of magnetic <strong>disks </strong>, called platters, that record and store information. Because the data is stored magnetically, information recorded to the <strong>hard disk </strong>remains intact after you turn your computer off.</li>\r\n\t<li>An <strong>example </strong>of a <strong>hard drive </strong>is the location on a desktop computer where a person could save their research paper.</li>\r\n\t<li>IBM made the first commercial <strong>hard disk </strong>drive-based computer and called it <strong>RAMAC </strong>&ndash; short for &ldquo;Random Access Method of Accounting And Control.&rdquo;</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>A bridge has access to the _____ address of a station on the same network.</p>", "option1": "\r\n<p>Physical(MAC)</p>", "option2": "\r\n<p>Network</p>", "option3": "\r\n<p>Service access point</p>", "option4": "\r\n<p>All of the above.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Physical(MAC)</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Whether you work in a <strong>wired network </strong>office/home or a <strong>wireless one </strong>, one thing is common for both environments: It takes both <strong>network software </strong>and <strong>hardware </strong>(cables, routers, etc.) to <strong>transfer data </strong>from your computer to another&mdash;or from a computer thousands of miles away to yours. And in the end, to get the data you want right to you, it comes down to <strong>addresses </strong>.</li>\r\n\t<li>So not surprisingly, along with an <strong>IP address </strong>(which is networks software), there&#39;s also a <strong>hardware address </strong>. Typically it is tied to a key <strong>connection device </strong>in your computer called the <strong>network interface card </strong>, or <strong>NIC </strong>. The NIC is essentially a computer circuit card that makes it possible for your computer to connect to a network.</li>\r\n\t<li>A <strong>NIC turns data into an electrical signal </strong>that can be transmitted over the network. Every NIC has a hardware address that&#39;s known as a <strong>MAC </strong>, for <strong>Media Access Control </strong>. Where IP addresses are associated with <strong>TCP/IP </strong>(networking software), <strong>MAC addresses </strong>are linked to the <strong>hardware of network adapters </strong>.</li>\r\n\t<li>A <strong>MAC address is given to a network adapter when it is manufactured </strong>. It is hardwired or hard-coded onto your computer&#39;s network interface card (NIC) and is <strong>unique </strong>to it. Something called the <strong>ARP (Address Resolution Protocol) translates an IP address into a MAC address </strong>. The ARP is like a passport that takes data from an IP address through an actual piece of computer hardware.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>Which of the following is a very-high-speed semiconductor memory which can speed up the CPU?</p>", "option1": "\r\n<p>Primary Memory</p>", "option2": "\r\n<p>Main Memory </p>", "option3": "\r\n<p>Secondary Memory</p>", "option4": "\r\n<p>Cache Memory</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>&bull; Cache memory is a high-speed semiconductor memory that increases the speed of the CPU. It acts as a buffer between the CPU and main memory. Cache memory is used to store the input given by the user. It is the fastest memory that provides high-speed data access to the computer microprocessor.</p>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>Which of the following statements is incorrect regarding the input devices of a computer?</p>", "option1": "\r\n<p>It converts the input data into digital form.</p>", "option2": "\r\n<p>Data entered through the keyboard is transferred directly to the Memory Data Register (MDR).</p>", "option3": "\r\n<p>Mouse is an input device.</p>", "option4": "\r\n<p>They are used to send data to the computer.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is (2)</strong></p>\r\n\r\n<p>Data entered through the keyboard is transferred directly to the Memory Data Register (MDR).</p>\r\n\r\n<ul>\r\n\t<li>Input devices include keyboards, scanners, mice, joysticks, and digital cameras.</li>\r\n\t<li>The input device, which is the hardware used to accept data from people, is referred to as the input unit of a computer. Human input is transformed into data that computers can understand by input devices.</li>\r\n\t<li>The most frequent and well-liked input method for entering data into computers is the keyboard.</li>\r\n\t<li>Text, photos, videos, and sounds can all be submitted into a computer system using an input device. The most popular method for entering text is the keyboard.</li>\r\n\t<li>An input device is a piece of computer hardware used to provide control and data signals to a data processing system, such as a computer or information appliance.</li>\r\n\t<li>Memory data register (MDR): Stores data that needs to be transferred to main memory or contents found at the address stored in the MAR.</li>\r\n\t<li>The instruction that is presently being decoded and executed is stored in the current instruction register (CIR). The results of processing are stored in the accumulator (ACC).</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n<p>A half byte is called a</p>", "option1": "\r\n<p>Byte</p>", "option2": "\r\n<p>Nibble</p>", "option3": "\r\n<p>Bit</p>", "option4": "\r\n<p>Word size</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Nibble</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>A half byte</strong> is called a <strong>Nibble</strong>.</li>\r\n\t<li>A bit is the smallest unit of storage.</li>\r\n\t<li>A bit stores just a 0 or 1.</li>\r\n\t<li>Computers are designed to store data and execute instructions in bit multiples called bytes.</li>\r\n\t<li><u>One nibble is equal to 4 bits</u>.</li>\r\n\t<li>Computer storage and memory are often measured in megabytes (MB) and gigabytes (GB).\r\n\t<ul>\r\n\t\t<li>1 kilobyte (KB) = 1024 bytes</li>\r\n\t\t<li>1 megabyte (MB) = 1024 kilobytes</li>\r\n\t\t<li>1 gigabyte (GB) = 1024 megabytes</li>\r\n\t\t<li>1 terabyte (TB) = 1024 gigabytes</li>\r\n\t\t<li>1 petabyte (PB) = 1024 terabytes</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>What is the purpose of bookmarks in the context of web browsing?</p>", "option1": "\r\n<p>Saving and organizing specific websites so that you can visit them frequently.</p>", "option2": "\r\n<p>Moving through the websites you have visited recently.</p>", "option3": "\r\n<p>Saving an image from a website to your computer.</p>", "option4": "\r\n<p>Plug-in small applications that allow you to view certain types of content in your web browser.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Saving and organizing specific websites so that you can visit them frequently</strong></u>.</p>\r\n\r\n<p>A <strong>bookmark </strong>is a placeholder for a web page that allows you to quickly access that page instead of browsing or searching for it.</p>\r\n\r\n<ul>\r\n\t<li>Instead of typing a web page, clicking a bookmark will take you to that page immediately.</li>\r\n\t<li>Using the World Wide Web browser, <strong>a bookmark is a saved link to a web page that has been added to the list of saved links </strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>To connect networks of similar protocols which of the following are used?</p>", "option1": "\r\n<p>Routers</p>", "option2": "\r\n<p>Switches</p>", "option3": "\r\n<p>Gateways</p>", "option4": "\r\n<p>Dial-up routers</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 2 </strong>, i.e.,<u><strong>Switches</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Repeater </strong>&ndash; A repeater operates at the physical layer. Its job is to regenerate the signal over the same network before the signal becomes too weak or corrupted so as to extend the length to which the signal can be transmitted over the same network. An important point to be noted about repeaters is that they do not amplify the signal. When the signal becomes weak, they copy the signal bit by bit and regenerate it at the original strength. It is a 2 port device.</li>\r\n\t<li><strong>Hub </strong>&ndash; A hub is basically a multiport repeater. A hub connects multiple wires coming from different branches, for example, the connector in star topology which connects different stations. Hubs cannot filter data, so data packets are sent to all connected devices.  In other words, collision domain of all hosts connected through Hub remains one.  Also, they do not have intelligence to find out best path for data packets which leads to inefficiencies and wastage.</li>\r\n\t<li><strong>Bridge </strong>&ndash; A bridge operates at data link layer. A bridge is a repeater, with add on the functionality of filtering content by reading the MAC addresses of source and destination. It is also used for interconnecting two LANs working on the same protocol. It has a single input and single output port, thus making it a 2 port device.</li>\r\n\t<li><strong>Switch </strong>&ndash; A switch is a multiport bridge with a buffer and a design that can boost its efficiency(a large number of ports imply less traffic) and performance. A switch is a data link layer device. The switch can perform error checking before forwarding data, that makes it very efficient as it does not forward packets that have errors and forward good packets selectively to correct port only.  In other words, switch divides collision domain of hosts, but broadcast domain remains same.</li>\r\n\t<li><strong>Routers</strong>&ndash; A router is a device like a switch that routes data packets based on their IP addresses. Router is mainly a Network Layer device. Routers normally connect LANs and WANs together and have a dynamically updating routing table based on which they make decisions on routing the data packets. Router divide broadcast domains of hosts connected through it.</li>\r\n\t<li><strong>Gateway </strong>&ndash; A gateway, as the name suggests, is a passage to connect two networks together that may work upon different networking models. They basically work as the messenger agents that take data from one system, interpret it, and transfer it to another system. Gateways are also called protocol converters and can operate at any network layer. Gateways are generally more complex than switch or router.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>FTP stands for :</p>", "option1": "\r\n<p>File transfer program</p>", "option2": "\r\n<p>File transfer protocol</p>", "option3": "\r\n<p>File transfer port</p>", "option4": "\r\n<p>File transfer pin</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>File transfer protocol</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><u><strong>FTP stands  for  File Transfer Protocol</strong></u> and, as the name implies, it is a way of transferring files between computers.\r\n\r\n\t<ul>\r\n\t\t<li>It is also one of those wonderful computer terms that&rsquo;s both a noun and a verb.</li>\r\n\t\t<li>As a noun, FTP is the <strong>name for a method of sending files </strong>, but also the name of the program that actually <strong>sends the files.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Originally, <strong>FTP was developed to send and receive files </strong>in the old text-based computers and networks of the pre-graphical era of computers (before the mid-1980s).</li>\r\n\t<li>You use FTP <strong>to access a remote computer on the network </strong>to get or receive files or to put or send files. </li>\r\n\t<li>In the modern context, using FTP in Windows is similar to opening a Windows Explorer window for a remote folder on a network computer.</li>\r\n\t<li>A computer on the Internet that offers FTP access is said to be an  <strong>FTP host or FTP server </strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>Which of the following is both an input and an output device?</p>", "option1": "\r\n<p>Touch screen</p>", "option2": "\r\n<p>LCD projector panel</p>", "option3": "\r\n<p>Audio cards</p>", "option4": "\r\n<p>Printer</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is (1)</strong></p>\r\n\r\n<p>Touch screen</p>\r\n\r\n<ul>\r\n\t<li>A touchscreen or touch screen is an assembly of a touch panel for input and a display for output.</li>\r\n\t<li>Instead of using a mouse, touchpad, or other similar devices, the user can interact directly with what has been displayed thanks to the touchscreen.</li>\r\n\t<li>Devices like gaming consoles, laptops, electronic voting machines, and point-of-sale (POS) systems frequently have touchscreens.</li>\r\n</ul>\r\n\r\n<p><strong>LCD projector panel: </strong>- Although it is no longer manufactured, a projection panel&mdash;also known as an overhead display or LCD panel&mdash;was once used in place of a data projector. With an overhead projector, it functions. A fan is used to keep the translucent LCD  on the panel cool.</p>\r\n\r\n<p><strong>Audio cards: </strong>- A sound card, often known as an audio card, is an add-on component that plugs into an ISA or PCI slot on a motherboard to allow a computer to receive, process, and output sound.</p>\r\n\r\n<p>Printer:  A printer is a  hardware output device  that is used to  generate hard copies  and  print any document . A document can be of any type such as a text file, image, or a combination of both. It accepts input commands by users on a computer or on other devices to print documents.</p>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>Which of the following are included in the digital payment system?</p>\r\n\r\n<p>a) RTGS</p>\r\n\r\n<p>b) Demand draft</p>\r\n\r\n<p>c) NEFT</p>\r\n\r\n<p>d) Cheque</p>\r\n\r\n<p>Choose the correct option from the following:</p>", "option1": "\r\n<p>a, c and d</p>", "option2": "\r\n<p>b and d only</p>", "option3": "\r\n<p>a and c only</p>", "option4": "\r\n<p>b, c and d</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Digital Payment: </strong> A digital payment occurs when goods or services are purchased through the use of various electronic mediums. There is no use of cash or cheques in this type of payment method.</p>\r\n\r\n<p><strong>10 Types of Digital Payment Methods in India</strong></p>\r\n\r\n<ol>\r\n\t<li>Banking cards</li>\r\n\t<li>USSD</li>\r\n\t<li>Aadhaar Enabled Payment System (AEPS)</li>\r\n\t<li>UPI</li>\r\n\t<li>Mobile Wallets</li>\r\n\t<li>Bank pre-paid cards</li>\r\n\t<li>Point of Sale (PoS)</li>\r\n\t<li>Internet Banking</li>\r\n\t<li>Mobile Banking</li>\r\n\t<li>Bharat Interface for Money (BHIM) app</li>\r\n</ol>\r\n\r\n<p><strong>Internet Banking: </strong></p>\r\n\r\n<ol>\r\n\t<li>Internet banking refers to the process of carrying out <strong>banking transactions online.</strong></li>\r\n\t<li>These may include many services such as transferring funds, opening a new fixed or recurring deposit, closing an account, etc. Internet banking is also referred to as e-banking or virtual banking. Internet banking is usually used to make online fund transfers via  <strong>NEFT, RTGS, or IMPS.</strong></li>\r\n\t<li>Banks offer customers all types of banking services through their website and a customer can log into his/her account by using a username and password.</li>\r\n\t<li>Unlike visiting a physical bank, there are time restrictions for internet banking services and they can be availed at any time and on all 365 days in a year.</li>\r\n</ol>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n<p>CPU of a personal computer is______.</p>", "option1": "\r\n<p>ROM</p>", "option2": "\r\n<p>Microcontroller</p>", "option3": "\r\n<p>RAM</p>", "option4": "\r\n<p>Microprocessor</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Central Processing Unit</p>\r\n\r\n<ul>\r\n\t<li>It is the main part of the computer. <strong>CPU chip or main processor</strong> is that part in the computer which performs or executes all the instructions or programs.</li>\r\n\t<li>The Central Processing Unit (CPU), the principal part of any digital computer system, generally composed of the main memory, control unit, and arithmetic-logic unit.</li>\r\n\t<li>It constitutes the physical heart of the entire computer system, it is linked to various peripheral equipment, including input/output devices and auxiliary storage units.</li>\r\n\t<li>In modern computers, the CPU is contained on an integrated circuit chip called a microprocessor.</li>\r\n\t<li>The control unit part controls the input and output devices.</li>\r\n\t<li>Arithmetic-logic  units do basic operations like addition, multiplication, and division. </li>\r\n\t<li>A primary storage device is a medium that holds a memory for a short period of time while a computer is running.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n<p>The place where accessories are connected in computer is known as</p>", "option1": "\r\n<p>Port </p>", "option2": "\r\n<p>Ring</p>", "option3": "\r\n<p>Bus</p>", "option4": "\r\n<p>Zip</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Port</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>PORT </strong>:\r\n\r\n\t<ul>\r\n\t\t<li>A &#39;Port&#39; in computer terminology, is the <strong>communication endpoint </strong>  using which an external device can be connected to the computer.</li>\r\n\t\t<li>The <strong>motherboard contains slots called &#39;ports&#39;</strong>into which a cable of an external device is plugged.</li>\r\n\t\t<li>The identification of a port for a particular transport protocol and address is done through a <strong>16-bit unsigned number </strong>called the &#39; <strong>port number </strong>&#39;.</li>\r\n\t\t<li><strong>Some important types of Port </strong>- Serial Port, Parallel Port,  PS/2 Port, Universal Serial Bus (or USB) Port, VGA Port, Modem Port, Power Connector, Firewire Port, Ethernet Port, Game Port, and Digital Video Interface (DVI) port.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>RING </strong>:\r\n\t<ul>\r\n\t\t<li>In &#39;Ring&#39; topology of computer networking, <strong>all terminals are linked to each other in form of a ring </strong>and the data circulate from one terminal to another until it reaches the destination point.</li>\r\n\t\t<li>This type of networking <strong>does not require a </strong><strong>network server </strong>to control the connectivity between workstations.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>BUS </strong>:\r\n\t<ul>\r\n\t\t<li>In this type of computer networking, the <strong>terminals are connected to a single central cable also called &#39;backbone&#39; </strong>.</li>\r\n\t\t<li>Here, in the case of &#39;bus&#39; topology, only one terminal can transmit a signal at a time and the signal travels in both directions to all the terminals till it finds the destination point.</li>\r\n\t\t<li>Since only a single cable is used in this type of networking, it is <strong>less expensive </strong>than others.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>ZIP </strong>:\r\n\t<ul>\r\n\t\t<li>&#39;Zip&#39; file in computer terminology refers to a <strong>collection of different files compiled into a single compressed file of smaller size </strong>.</li>\r\n\t\t<li>This zipping of files saves disk space as the <strong>zipped archive </strong>takes up less space in comparison to its uncompressed version.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n<p>A graphic tablet is a/an ________.</p>", "option1": "\r\n<p>Formatter</p>", "option2": "\r\n<p>network adapter</p>", "option3": "\r\n<p>output device</p>", "option4": "\r\n<p>input device</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>A graphic tablet </strong>is an <u><strong>input device.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>It is a computer input device that allows the user <strong>to draw images, animations and graphics with a special pen-like stylus </strong>, similar to the way a person draws images with a pencil and paper.</li>\r\n\t<li>These tablets may also be used <strong>to capture data or hand-written signatures </strong>.</li>\r\n\t<li>It can also be used to trace the image from a sheet of paper that is glued or otherwise fixed to the tablet board.</li>\r\n\t<li>Capturing data in this manner, by drawing or reaching the corners of linear polylines or curves, is called digitizing.</li>\r\n\t<li><strong>In 1957, the Stylator </strong>was the <strong>first graphic tablet resembling contemporary tablets </strong>used for computer recognition by handwriting.</li>\r\n</ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
