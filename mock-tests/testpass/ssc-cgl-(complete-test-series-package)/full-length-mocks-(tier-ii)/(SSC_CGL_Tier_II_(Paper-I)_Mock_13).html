<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>44.) SSC CGL Tier II (Paper-I) Mock 13 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

<script>

const questions = [{"sr_no": 1, "question": "\r\n<div>\r\n<p>Eight friends&mdash;P, Q, R, S, T, U, V and W are sitting around a circular table for a meeting facing center. P is second to the right of V who is third to the right of Q. S is second to the left of U who sits between V and P. R is not a neighbour of Q or T.</p>\r\nWho is third to the right of V?</div>", "option1": "\r\n<p>Q</p>", "option2": "\r\n<p>R</p>", "option3": "\r\n<p>W</p>", "option4": "\r\n<p>T</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>8 friends: P, Q, R, S, T, U, V and W</p>\r\n\r\n<p>1) P is second to the right of V who is third to the right of Q.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987457_1742987457616286_thump.png\" style=\"width: 200px; height: 189px;\" /></figure>\r\n\r\n<p>2) S is second to the left of U who sits between V and P.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987486_1742987486438229_thump.png\" style=\"width: 200px; height: 199px;\" /></figure>\r\n\r\n<p>3) R is not a neighbour of Q or T.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987539_1742987539851449_thump.png\" style=\"width: 200px; height: 184px;\" /></figure>\r\n\r\n<p>Hence, &lsquo;R&rsquo; is third to the right of V.</p>", "question_heading": ""}, {"sr_no": 2, "question": "\r\n<p>If A @ B means A is the grandson of B A # B means A is the wife of B and if A * B means A is the father of B, then what does X * Y @ Z # W mean, if Z has only 1 child?</p>", "option1": "\r\n<p><span>W is the mother of X</span></p>", "option2": "\r\n<p><span>W is the father of X</span></p>", "option3": "\r\n<p><span>X is the mother of W</span></p>", "option4": "\r\n<p><span>X is the father of W</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Family Chart:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987596_1742987596860766_thump.png\" style=\"width: 150px; height: 228px;\" /></figure>\r\n\r\n<p>Given:</p>\r\n\r\n<p>A @ B means A is the grandson of B.</p>\r\n\r\n<p>A # B means A is the wife of B.</p>\r\n\r\n<p>A * B means A is the father of B.</p>\r\n\r\n<p>Let us first decode the given symbols and then draw a family tree.</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td colspan=\"4\">\r\n\t\t\t<p><strong>A is</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Symbol</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>@</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>#</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>*</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Meaning</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>grandson</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>wife</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>father</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td colspan=\"4\">\r\n\t\t\t<p><strong>to B</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>Now break the code of &lsquo;X * Y @ Z # W</p>\r\n\r\n<p><strong>1) X * Y</strong></p>\r\n\r\n<p>X * Y means X is the father of Y.</p>\r\n\r\n<p><strong>2) Y @ Z</strong></p>\r\n\r\n<p>Y @ Z means Y is the grandson of Z.</p>\r\n\r\n<p><strong>3) Z # W</strong></p>\r\n\r\n<p>Z # W means Z is the wife of W.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987662_1742987662364241_thump.png\" style=\"width: 100px; height: 162px;\" /></figure>\r\n\r\n<p>Hence, W is the father of X.</p>", "question_heading": ""}, {"sr_no": 3, "question": "\r\n<p>If x ∶ y = 1 ∶ 3, y ∶ z = 5 ∶ k, z ∶ t = 2 ∶ 5 and t ∶ x = 3 ∶ 4, then what is the value of k?</p>", "option1": "\r\n<p><span>1/2</span></p>", "option2": "\r\n<p>1/3</p>", "option3": "\r\n<p>2</p>", "option4": "\r\n<p>3</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>It is given that,</p>\r\n\r\n<p>x ∶ y = 1 ∶ 3, y ∶ z = 5 ∶ k, z ∶ t = 2 ∶ 5 and t ∶ x = 3 ∶ 4</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{x}{y}\\)</span> = <span class=\"math-tex\">\\(\\frac{1}{3}\\)</span>, <span class=\"math-tex\">\\(\\frac{y}{z}\\)</span> = <span class=\"math-tex\">\\(\\frac{5}{k}\\)</span>, <span class=\"math-tex\">\\(\\frac{z}{t}\\)</span> = <span class=\"math-tex\">\\(\\frac{2}{5}\\)</span>, <span class=\"math-tex\">\\(\\frac{t}{x} \\)</span> = <span class=\"math-tex\">\\(\\frac{3}{4} \\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\( \\frac{x}{y}\\ \\times\\ \\frac{y}{z}\\ =\\ \\frac{1}{3}\\ \\times\\ \\frac{5}{k}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{x}{z}\\ =\\ \\frac{5}{3k}\\)</span>  --------(1)</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\( \\frac{x}{t}\\ \\times\\ \\frac{t}{z}\\ =\\ \\frac{4}{3}\\ \\times\\ \\frac{5}{2}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{x}{z}\\ =\\ \\frac{10}{3}\\)</span>  --------(2)</p>\r\n\r\n<p>From equation (1) &amp; (2) we get,</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{5}{3k}\\ =\\ \\frac{10}{3}\\)</span></p>\r\n\r\n<p>&rArr; k = <span class=\"math-tex\">\\(\\frac{1}{2}\\)</span></p>\r\n\r\n<p><strong>&there4; The value of k is 1/2.</strong></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<p>Select the option that is related to the third letter number cluster in the same way as the second letter number cluster is related to the first letter number cluster.</p>\r\n\r\n<p>PV7 : SY14 :: GT9 : ?</p>", "option1": "\r\n<p>LW16</p>", "option2": "\r\n<p>JX18</p>", "option3": "\r\n<p>NY16</p>", "option4": "\r\n<p>JW18</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is,</p>\r\n\r\n<p><strong>Alphabets of second letter number cluster is changing to the next 3rd alphabet according to the English alphabet.</strong></p>\r\n\r\n<p>P(16) + 3 = S (19)</p>\r\n\r\n<p>V (22) + 3 = Y (25)</p>\r\n\r\n<p><strong>And number in the first letter number cluster is multiply by 2, (7 &times; 2 = 14).</strong></p>\r\n\r\n<p><strong>PV7 : SY14</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987737_1742987737699056_thump.png\" style=\"width: 100px; height: 97px;\" /></figure>\r\n\r\n<p>Similarly, Fourth letter number cluster is related the third letter number cluster.</p>\r\n\r\n<p><strong>G (7) + 3 = J (10)</strong></p>\r\n\r\n<p><strong>T (20) +3 = W (23)</strong></p>\r\n\r\n<p>And the number in the third letter number cluster will be multiply by 2.</p>\r\n\r\n<p><strong>9 &times; 2 = 18</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987821_1742987821344166_thump.png\" style=\"width: 100px; height: 96px;\" /></figure>\r\n\r\n<p><strong>So, the Fourth letter cluster will be as JW18.</strong></p>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;JW18&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n<p>What is the least number which when divided by 42,72 and 84 leaves the remainders 25, 55 and 67 respectively?</p>", "option1": "\r\n<p>521</p>", "option2": "\r\n<p>512</p>", "option3": "\r\n<p><span>504</span></p>", "option4": "\r\n<p><span>487</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>&rArr; 42 - 25 = 17</p>\r\n\r\n<p><span>&rArr; 72 - 55 = 17</span></p>\r\n\r\n<p><span>&rArr; 84 - 67 = 17</span></p>\r\n\r\n<p><span>Now, LCM (42, 72, 84) = 504</span></p>\r\n\r\n<p>Hence, required number = 504 - 17 = 487</p>\r\n\r\n<p><strong>&there4; The correct answer is 487.</strong></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>Select the figure from among the given options that can replace the question mark (?) in the following series.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987944_1742987944922956_thump.png\" style=\"width: 300px; height: 76px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988042_1742988042179893_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988065_1742988065226490_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988122_1742988122983061_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988146_1742988146748630_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The figure that will replace the question mark (?) in the following figure series is shown below:</p>\r\n\r\n<p>1) In series arrow rotating in a clockwise direction.</p>\r\n\r\n<p>2) In series square change its position in each corner of figure and also change one by one shaded part to non-shaded part.</p>\r\n\r\n<p>3) In series circle change its position in each corner of figure and also change one by one shaded part to non-shaded part.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988221_1742988221519504_thump.png\" style=\"width: 250px; height: 64px;\" /></figure>\r\n\r\n<p>Hence, &lsquo; <strong>option 4 </strong>&rsquo; is the correct answer.</p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n<p>Consider the given statement to be true and decide which of the conclusions logically follows from the statement.</p>\r\n\r\n<p><strong>Statement:</strong></p>\r\n\r\n<p>Use &lsquo;Calvin Klein&rsquo; jeans. Nothing comes between me and my Calvins. &mdash; An advertisement.</p>\r\n\r\n<p><strong>Conclusions:</strong></p>\r\n\r\n<p>I. Catchy slogans do not attract people.</p>\r\n\r\n<p>II. People like dark shades of jeans.</p>", "option1": "\r\n<p>Only conclusion I follows.</p>", "option2": "\r\n<p>Only conclusion II follows.</p>", "option3": "\r\n<p>Either conclusion I or II follows.</p>", "option4": "\r\n<p>Neither conclusion I nor II follows.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>The given statement is an advertisement that says &quot;Use &#39;Calvin Klein&#39; jeans. Nothing comes between me and my Calvins.&quot;</p>\r\n\r\n<p><strong>Conclusion (I)</strong> cannot be inferred from the statement because the statement is itself a catchy slogan aimed at attracting people to use Calvin Klein jeans.</p>\r\n\r\n<p><strong>Conclusion (II)</strong> also cannot be inferred from the statement because the statement does not provide any information about people&#39;s preferences for the shade of their jeans. It only promotes Calvin Klein jeans without mentioning their color or shade.</p>\r\nHence, The correct answer is <strong>&quot;<span>Neither conclusion I nor II follows</span>&quot;</strong>.</div>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n<p>At what percent of compound interest per annum, a sum of money will double in 14 years?[Use <span class=\"math-tex\">\\(2^{1\\over14}\\)</span> = 1.050]</p>", "option1": "\r\n<p>4%</p>", "option2": "\r\n<p>5%</p>", "option3": "\r\n<p>6%</p>", "option4": "\r\n<p>7.14%</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Let&#39;s assume that the principal amount is &quot;P&quot; and the rate of compound interest per annum is &quot;r&quot;. According to the question, the principal amount will double in 14 years.</p>\r\n\r\n<p>We can use the formula for compound interest to find the amount after 14 years:</p>\r\n\r\n<p>A = P(1 + r/100)<sup>14</sup></p>\r\n\r\n<p>According to the question, the amount after 14 years is twice the principal amount:</p>\r\n\r\n<p>2P = P(1 + r/100)<sup>14</sup></p>\r\n\r\n<p>Simplifying the above equation, we get:</p>\r\n\r\n<p>(1 + r/100)<sup>14</sup> = 2</p>\r\n\r\n<p>Taking the 14th root on both sides, we get</p>\r\n\r\n<p>&rArr; 1 + r/100 = 2<sup>(1/14)</sup></p>\r\n\r\n<p><span>&rArr; </span>r/100 = 0.05</p>\r\n\r\n<p><span>&rArr; </span>r = 5</p>\r\n\r\n<p><strong>Hence, the rate of compound interest per annum at which the sum of money will double in 14 years is 5%.</strong></p>", "question_heading": ""}, {"sr_no": 9, "question": "\r\n<p>Three statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.</p>\r\n\r\n<p>Statements:</p>\r\n\r\n<p>1. No bed is a chair.</p>\r\n\r\n<p>2. All tables are beds.</p>\r\n\r\n<p>3. No cupboard is a bed.</p>\r\n\r\n<p>Conclusions:</p>\r\n\r\n<p>I. No table is a chair.</p>\r\n\r\n<p>II. No cupboard is a table.</p>\r\n\r\n<p>III. Some beds are tables.</p>", "option1": "\r\n<p><span>Only conclusions I and III follow</span></p>", "option2": "\r\n<p><span>Only conclusions II and III follow</span></p>", "option3": "\r\n<p><span>Only conclusion I follows</span></p>", "option4": "\r\n<p><span>All of the conclusions follow</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>According to the given statements, the Venn diagram will be:</p>\r\n\r\n<p>Next, we will check all the conclusions as:</p>\r\n\r\n<p>I. No table is a chair &rarr; Follow &rarr; Since given all tables are beds and no bed is chair. Thus, no table is a chair is true.</p>\r\n\r\n<p>II. No cupboard is a table  <span>&rarr; Follow  &rarr;  </span><span>Since given all tables are beds and no bed is chair. Thus, no cupboard is a table is true.</span></p>\r\n\r\n<p>III. Some beds are tables  <span>&rarr; Follow  &rarr;  </span><span>Since given all tables are beds and no bed is chair. Thus, some beds are tables is true.</span></p>\r\n\r\n<p>Thus, <strong>all the conclusions </strong>follow.</p>\r\n\r\n<p>Hence, the correct answer is &#39;<u><strong>option 4</strong></u>&#39;.</p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n<p><span>A trader marked the price of his commodity so as to include a profit of 25%. He allowed a discount of 16% on the marked price, What is the actual profit he earns?</span></p>", "option1": "\r\n<p>9%</p>", "option2": "\r\n<p>5%</p>", "option3": "\r\n<p><span>16%</span></p>", "option4": "\r\n<p>20%</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Solution:</strong></p>\r\n\r\n<p>Let&#39;s assume that the cost price of the goods is Rs. 100.</p>\r\n\r\n<p>The retailer marks all his goods so it includes 25% profit, so the marked price would be:</p>\r\n\r\n<p>Rs. 100 + 25% of Rs. 100 = Rs. 125</p>\r\n\r\n<p>The retailer allowed a discount of 16% on the marked price:</p>\r\n\r\n<p>Discount = 16% of Rs. 125 = Rs. 20</p>\r\n\r\n<p>Selling price = Marked price - Discount = Rs. 125 - Rs.20 = Rs.105</p>\r\n\r\n<p>Now, let&#39;s calculate the profit:</p>\r\n\r\n<p>Profit = Selling price - Cost price = Rs. 105 - Rs. 100 = Rs. 5</p>\r\n\r\n<p><strong>Therefore, the retailer&#39;s actual profit on his sales is Rs. 5 or 5% of the cost price.</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n\r\n<p>A bag contains 3 red marbles, 4 blue marbles, and 5 green marbles. If two marbles are randomly selected from the bag with replacement, what is the probability that the two marbles are the same color?</p>", "option1": "\r\n\r\n<p>19/72</p>", "option2": "\r\n\r\n<p>23/72</p>", "option3": "\r\n\r\n<p>25/72</p>", "option4": "\r\n\r\n<p>29/72</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>25/72.</strong></p>\r\n\r\n<ul>\r\n\t<li>Replacement is an important factor in the calculation of this problem.</li>\r\n\t<li>The probability of selecting two marbles of the same color with replacement is 25/72</li>\r\n\t<li>The probability can be calculated by multiplying the individual probabilities of selecting the same color marble twice.</li>\r\n\t<li>The formula for this is P(same color) =(P(color1))2 + ( P (color2))2+ ( P (color3))2</li>\r\n\t<li>The number of possible outcomes is calculated by multiplying the total number of marbles in the bag by the number of selections.</li>\r\n\t<li>The number of favorable outcomes is calculated by multiplying the number of marbles of the same color by itself.</li>\r\n\t<li>The probability of selecting two marbles of the same color with replacement can also be calculated by multiplying the probability of selecting one marble of a certain color by itself.</li>\r\n\t<li>The formula for this is P(same color) = (P(color1))2 + (P(color2))2 + (P(color3))2</li>\r\n\t<li> In this question, P(same color) = (3/12)2 + (4/12)2 + (5/12)2 = 25/72</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p>During a storm, a tree broke at a point 5 m above the ground in such a way that the top of the tree touched the ground 12 m away from where it originally stood. What was the height of the tree before it broke?</p>", "option1": "\r\n<p>18 m</p>", "option2": "\r\n<p>13 m</p>", "option3": "\r\n<p>17 m</p>", "option4": "\r\n<p>12 m</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used : </strong></p>\r\n\r\n<p><strong>Pythagoras Theorem:</strong> In a right-angled triangle, the square of the hypotenuse side is equal to the sum of squares of the other two sides.</p>\r\n\r\n<p>H<sup>2</sup> = B<sup>2</sup> + P<sup>2</sup></p>\r\n\r\n<p>Where, H = Hypotenuse, B = Base, and P = Perpendicular</p>\r\n\r\n<p>Let the original height of the tree be represented by &#39;h&#39;.</p>\r\n\r\n<p>Using the Pythagoras Theorem,</p>\r\n\r\n<p><span>H</span><sup>2  = B</sup><sup>2  + P</sup><sup>2</sup></p>\r\n\r\n<p>&rArr; h<sup>2</sup> = 12<sup>2</sup> + 5<sup>2</sup></p>\r\n\r\n<p>&rArr; h<sup>2</sup> = 169</p>\r\n\r\n<p>&rArr; h = <span class=\"math-tex\">\\(\\sqrt{169}\\)</span> = 13 m</p>\r\n\r\n<p>Height of the Tree Before it Broke = 13 +5 = 18 m</p>\r\n\r\n<p><strong>&there4; Option (1) is the correct answer.</strong></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<p>Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.</p>\r\n\r\n<p>TSF, RPJ, PMN, NJR, ?</p>", "option1": "\r\n<p>LGN</p>", "option2": "\r\n<p>KGU</p>", "option3": "\r\n<p>LGV</p>", "option4": "\r\n<p>JFV</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Table show alphabet serial number &ndash;</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988471_1742988471363030_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p>The pattern followed is,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988518_1742988518626591_thump.png\" style=\"width: 100px; height: 422px;\" /></figure>\r\n\r\n<p>Hence, <span>&ldquo;LGV&rdquo; </span> is the complete series.</p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>Select the option in which the given figure is embedded (rotation is NOT allowed).</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988583_1742988583232507_thump.png\" style=\"width: 69px; height: 69px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988627_1742988627411890_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988652_1742988652532402_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988720_1742988720740092_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988759_1742988759799997_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The option in which the given figure is embedded when rotation is not allowed is shown below:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988835_1742988835694850_thump.png\" style=\"width: 300px; height: 389px;\" /></figure>\r\n\r\n<p>Hence, <strong>&quot;Option 2&quot; </strong>is the correct answer.</p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p>Three different positions of the same dice are shown, the six faces of which are numbered from 1 to 6. Select the number that will be on the face opposite to the one having &#39;1&#39;.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988887_1742988887661864_thump.png\" style=\"width: 200px; height: 74px;\" /></figure>", "option1": "\r\n<p>4</p>", "option2": "\r\n<p>6</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>5</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>In First and Third dice 2, 3 are common in both dice.</p>\r\n\r\n<p>Third dice is rotated 180 <sup>0</sup> clockwise the other adjacent side of 2, 3 is &#39;6&#39;.</p>\r\n\r\n<p><span>Logic :  If two dice have the same two face value in the given image then the third number is opposite to each other.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988956_1742988956633839_thump.png\" style=\"width: 180px; height: 67px;\" /></figure>\r\n\r\n<p>&there4; Here, &#39;6&#39; is opposite face of &#39;1&#39;.</p>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;6&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<p>Three statements are given, followed by three conclusions numbered I, II and III. Assuming that the information given in the statements is true, even if it appears to be different than commonly known facts, decide which of the conclusions logically follow(S) from the statements.</p>\r\n\r\n<p><strong>Statements:</strong></p>\r\n\r\n<p>1. No leaves are green.</p>\r\n\r\n<p>2. All fruits are greens. </p>\r\n\r\n<p>3. Some sweets are fruits.</p>\r\n\r\n<p><strong>Conclusions:</strong></p>\r\n\r\n<p>I. No leaves are fruits.</p>\r\n\r\n<p>II. All sweets are greens. </p>\r\n\r\n<p>III. Some leaves can be greens. </p>", "option1": "\r\n<p>Both conclusions I and II follow.</p>", "option2": "\r\n<p>Both conclusions I and III follow.</p>", "option3": "\r\n<p>Only conclusion III follows.</p>", "option4": "\r\n<p>Only conclusion I follows.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The least possible Venn diagram for the given statements is as shown below :-</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989030_1742989030294844_thump.png\" style=\"width: 190px; height: 61px;\" /></figure>\r\n\r\n<p><span><u>Conclusions </u>:</span></p>\r\n\r\n<p>I. No leaves are fruits &rarr; True (As <span>All fruits are greens and No leaves are green so, No leaves are fruits,  </span>hence,  <span>true </span>)</p>\r\n\r\n<p>II. All sweets are greens  <span>&rarr; False (As All fruits are greens and Some sweets are fruits so, All sweets are greens,  </span>hence, <span> false)</span></p>\r\n\r\n<p>III. Some leaves can be greens  <span>&rarr; False (As No leaves are green so, Some leaves can be greens, hence, false)</span></p>\r\n\r\n<p><span>&there4; Here, the conclusion I is true.</span></p>\r\n\r\n<p><span>Hence, the correct answer is <strong>&quot;Only conclusion I follows&quot;. </strong></span></p>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>The mess charges for 35 students for 24 days is Rs. 6,300. In how many days will the mess charges be Rs. 3,375 for 25 students?</p>", "option1": "\r\n<p>12</p>", "option2": "\r\n<p>15</p>", "option3": "\r\n<p>18</p>", "option4": "\r\n<p>21</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let the mess charges Rs. 3375 for 25 students for X days.</p>\r\n\r\n<p>Mess charge for,</p>\r\n\r\n<p>&rArr; 35 students &rarr; 24 days &rarr; 6300</p>\r\n\r\n<p>&rArr; 35 students &rarr; 1 day &rarr;  <span class=\"math-tex\">\\(\\frac{6300}{24}\\)</span></p>\r\n\r\n<p>&rArr; 1 student &rarr; 1 day &rarr;  <span class=\"math-tex\">\\(\\frac{6300}{24\\ ×\\ 35}\\)</span></p>\r\n\r\n<p>Hence, mess charge for per person per day is, </p>\r\n\r\n<p>&rArr;  <span>\\(\\frac{6300}{24\\ &times;\\ 35}\\) </span> = 7.5</p>\r\n\r\n<p>Mess charge for 25 persons for x days,</p>\r\n\r\n<p>&rArr; 7.5 &times; 25 &times; X = 3375</p>\r\n\r\n<p>&rArr; X = 18 days</p>\r\n\r\n<p><strong>&there4; The number of days is 18.</strong></p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>If x <sup>140 </sup> + 2x <sup>151 </sup> + k is divisible by x + 1, then the value of k is</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>-3</p>", "option3": "\r\n<p>2</p>", "option4": "\r\n<p>-2</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>x <sup>140 </sup>+ 2x <sup>151 </sup>+ k is divisible by x + 1.</p>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>x + 1 is the factor of x <sup>140 </sup> + 2x <sup>151 </sup>+ k</p>\r\n\r\n<p>x + 1 = 0</p>\r\n\r\n<p><span>=&gt;  </span>x = - 1</p>\r\n\r\n<p><span>=&gt;  </span>(-1) <sup>140 </sup>+ 2(-1) <sup>151 </sup>+ k = 0</p>\r\n\r\n<p><span>=&gt;  </span>1 - 2 + k = 0</p>\r\n\r\n<p><span>=&gt;  </span>k - 1 = 0</p>\r\n\r\n<p><span>=&gt;  </span>k = 1</p>\r\n\r\n<p><span>&there4; </span><strong>The answer is 1.</strong></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<p><span>The average of 5 Consecutive numbers A, B, C, D and E is 12. What is the product of A and D ?</span></p>", "option1": "\r\n<p>140</p>", "option2": "\r\n<p>120</p>", "option3": "\r\n<p><span>110</span></p>", "option4": "\r\n<p><span>130</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Formula Used:</strong></p>\r\n\r\n<p>Average = Sum of all observations &divide; Number of Observations</p>\r\n\r\n<p><strong>Solution:</strong></p>\r\n\r\n<p>Let&#39;s assume that the middle number is C, and then we can express all the numbers in terms of C.</p>\r\n\r\n<p>So the five consecutive numbers are:</p>\r\n\r\n<p>A = C - 2<br />\r\nB = C - 1<br />\r\nC = C<br />\r\nD = C + 1<br />\r\nE = C + 2</p>\r\n\r\n<p>We know that the average of these five numbers is 12, so we can write:</p>\r\n\r\n<p>(A + B + C + D + E)/5 = 12</p>\r\n\r\n<p>Substituting the values of A, B, C, D, and E, we get:</p>\r\n\r\n<p>[(C - 2) + (C - 1) + C + (C + 1) + (C + 2)]/5 = 12</p>\r\n\r\n<p>Simplifying this expression, we get:</p>\r\n\r\n<p>5C/5 = 12</p>\r\n\r\n<p>&rArr; C = 12</p>\r\n\r\n<p>So the middle number is 12, and the other four numbers are:</p>\r\n\r\n<p>A = 10<br />\r\nB = 11<br />\r\nD = 13<br />\r\nE = 14</p>\r\n\r\n<p>The product of A and D is:</p>\r\n\r\n<p>A x D = 10 x 13 = 130</p>\r\n\r\n<p><strong>Therefore, the product of A and D is 130.</strong></p>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>Find the missing number from the below options.</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>64</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>39</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>51</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>53</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>34</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>27</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>79</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>12</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>?</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p> </p>", "option1": "\r\n<p>65</p>", "option2": "\r\n<p>78</p>", "option3": "\r\n<p>34</p>", "option4": "\r\n<p>86</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The pattern followed here is,</p>\r\n\r\n<p>In row 1 &rarr; (6 &times; 4) + (3 &times; 9) = 24 + 27 = 51</p>\r\n\r\n<p>In row 2 &rarr; (5 &times; 3) + (3 &times; 4) = 15 + 12 = 27</p>\r\n\r\n<p><strong>In row 3 &rarr; (7 &times; 9) + (1 &times; 2) = 63 + 02 = 65</strong></p>\r\n\r\n<p>Hence, 65 is the correct answer.</p>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n<p>Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.</p>\r\n\r\n<p>a_ bca _ _ ca _ b _ _ abc</p>", "option1": "\r\n<p>aaacba</p>", "option2": "\r\n<p>bacaaa</p>", "option3": "\r\n<p>abacaa</p>", "option4": "\r\n<p>aabaca</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>Given sequence: a_ bca _ _ ca _ b _ _ abc</span></p>\r\n\r\n<ol>\r\n\t<li>aaacba &rarr; a <strong>a</strong>bc - a <strong>aa </strong>c - a <strong>c</strong>b <strong>b</strong>- <strong>a</strong>abc</li>\r\n\t<li>bacaaa <span>&rarr;  </span>a<strong>b </strong>bc - a <strong>ac </strong>c -a <strong>a</strong>b <strong>a</strong>- <strong>a</strong>abc</li>\r\n\t<li>abacaa  <span>&rarr;  </span>a<strong>a </strong>bc - a <strong>ba </strong>c - a <strong>c</strong>b <strong>a</strong>- <strong>a</strong>abc</li>\r\n\t<li>aabaca  <span>&rarr;  </span>a<strong>a </strong>bc - a <strong>ab </strong>c - a <strong>a</strong>b <strong>c</strong>- <strong>a</strong>abc</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li>Here,  <span>a a bc  </span>is repeated</li>\r\n</ul>\r\n\r\n<p>Hence, &lsquo;<strong><span>aabaca</span></strong>&rsquo; is the correct answer.</p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<p>P and Q can do a job in 2 days; Q and R can do it in 4 days; and P and R in 12/5 days. What is the number of days required for P alone to do the job?</p>", "option1": "\r\n<p>5/2</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>14/5</p>", "option4": "\r\n<p><span>6</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p>Efficiency = <span class=\"math-tex\">\\(\\frac{Work\\ done}{Time\\ taken}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>It is given that P and Q are doing the job in 2 days, Q and R in 4 days &amp; P and R in 12/5 days.</p>\r\n\r\n<p>First take the LCM of 2, 4, 12/5 which is 12. Now let 12 be the total work.</p>\r\n\r\n<p>Hence, using the above formula</p>\r\n\r\n<p>&rArr; Efficiency (P+ Q) = 12/2 = 6  </p>\r\n\r\n<p>&rArr; Efficiency (Q + R) = 12/ 4 = 3</p>\r\n\r\n<p>&rArr; Efficiency (P + R) =  <span class=\"math-tex\">\\(\\frac{12}{\\frac{12}{5}}\\) </span> = 5</p>\r\n\r\n<p><span>&rArr;  </span>2 &times; Efficiency (P + Q + R) = 6 + 3 + 5</p>\r\n\r\n<p><span>&rArr; Efficiency (P + Q + R) = 14/2 = 7</span></p>\r\n\r\n<p><span>&rArr; Efficiency (P) = 7 - 3 = 4</span></p>\r\n\r\n<p><span>Time is taken by P alone =  <span>\\(\\frac{Total\\ Work}{Efficiency\\ of\\ P}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 12/4 = 3</span></p>\r\n\r\n<p><strong><span>&there4; P will take 3 days to do the job alone.</span></strong></p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p>A pipe can fill a water tank three times as fast as another pipe. If both are used together, these can fill the tank in 36 minutes. How much time will be taken by the slower pipe alone to fill the tank? </p>", "option1": "\r\n<p><span>192 minutes</span></p>", "option2": "\r\n<p><span>108 minutes</span></p>", "option3": "\r\n<p><span>144 minutes</span></p>", "option4": "\r\n<p><span>160 minutes</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let the slower pipe fill the tank in x minutes.</p>\r\n\r\n<p>Then, the faster pipe can fill the same tank in (x/3) minutes.</p>\r\n\r\n<p>When both pipes are used together, they can fill the tank in 36 minutes. So their combined rate of filling the tank is = 1/36 tank per minute</p>\r\n\r\n<p>The slower pipe fills the tank at a rate of 1/x tank per minute.</p>\r\n\r\n<p>The faster pipe fills the tank at a rate of 1/(x/3) = 3/x tank per minute.</p>\r\n\r\n<p>&rArr; 1/x + 3/x = 1/36</p>\r\n\r\n<p><span>&rArr; </span>4/x = 1/36</p>\r\n\r\n<p><span>&rArr; </span>36 &times; 4 = x</p>\r\n\r\n<p>So, x = 144.</p>\r\n\r\n<p><strong>Therefore, the slower pipe alone can fill the tank in 144 minutes.</strong></p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>If <span class=\"math-tex\">\\(\\rm x=\\frac{2}{3+\\sqrt7}\\)</span>, then (x - 3)<sup>2</sup> =</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>6</p>", "option4": "\r\n<p>7</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span class=\"math-tex\">\\(\\dfrac{2}{3+\\sqrt7}\\)</span></p>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>Multiplying both numerator and denominator by (3 - &radic;7), we get,</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\dfrac{2}{3+\\sqrt7}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{2 × (3-\\sqrt7)}{(3+\\sqrt7)(3-\\sqrt7)}\\)</span></p>\r\n\r\n<p>= <span class=\"math-tex\">\\(\\dfrac{2 × (3 - \\sqrt7)}{9-7}\\)</span></p>\r\n\r\n<p>= <span class=\"math-tex\">\\(\\dfrac{2 × (3 - \\sqrt7)}{2}\\)</span></p>\r\n\r\n<p>= 3 - &radic;7</p>\r\n\r\n<p>Now, putting the value of x = 3 - &radic;7 in, (x - 3)<sup>2</sup></p>\r\n\r\n<p>= (3 - &radic;7 - 3)<sup>2</sup></p>\r\n\r\n<p>= (- &radic;7)<sup>2</sup></p>\r\n\r\n<p>= 7</p>\r\n\r\n<p><span>&there4; </span><strong>The answer is 7.</strong></p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>Which of the following letter-clusters will replace the question mark (?) in the given series?</p>\r\n\r\n<p>BRAIN, DRAIN, DTAIN, ?, DTCKN, DTCKP</p>", "option1": "\r\n<p>DTACN</p>", "option2": "\r\n<p>DTCIP</p>", "option3": "\r\n<p>DTCIN</p>", "option4": "\r\n<p>DRCIN</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989363_1742989363618194_thump.png\" style=\"width: 400px; height: 84px;\" /></figure>\r\n\r\n<p>The logic followed here is:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989394_1742989394382233_thump.png\" style=\"width: 100px; height: 267px;\" /></figure>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;DTCIN&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n<p>8 <sup>x+1 </sup> = 64, what is the value of 3 <sup>2x+1 </sup>?</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>9</p>", "option4": "\r\n<p>27</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>8 <sup>x+1 </sup> = 64</p>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>8 <sup>X+1 </sup>= 64</p>\r\n\r\n<p>8 <sup>X+1 </sup>= 8 <sup>2</sup></p>\r\n\r\n<p>x + 1 = 2 (as the bases are same)</p>\r\n\r\n<p>x = 2 - 1</p>\r\n\r\n<p>x = 1</p>\r\n\r\n<p>Putting the value of x = 1,</p>\r\n\r\n<p>3 <sup>2X+1</sup></p>\r\n\r\n<p>= 3 <sup>2&times;1+1</sup></p>\r\n\r\n<p>= 3 <sup>2+1</sup></p>\r\n\r\n<p>= 3 <sup>3</sup></p>\r\n\r\n<p>= 27</p>\r\n\r\n<p><strong>The answer is 27.</strong></p>", "question_heading": ""}, {"sr_no": 27, "question": "\r\n<p>Select the correct combination of mathematical signs to replace the * signs and to balance the given equation.</p>\r\n\r\n<p>( <span>\\(\\sqrt {729 * 9}\\) </span>) * 67 * 81 * (4 * 6) * 19</p>", "option1": "\r\n<p>+, -, +, &divide;, =, &times; </p>", "option2": "\r\n<p>&times;, +, -, +, &times;, =</p>", "option3": "\r\n<p>+, -, &divide;, =, -, &times; </p>", "option4": "\r\n<p>&divide;, +, =, -, &times;, +</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong><span>Explanation:</span></strong></p>\r\n\r\n<div><span>We substitute the values in the given equation and solve it using BODMAS rule</span><br />\r\nOption 1) <span>+, -, +, &divide;, =, &times; </span><br />\r\n<span><u><strong>( <span class=\"math-tex\">\\(\\sqrt {729 + 9}\\) </span>)</strong></u>- 67 + 81 &divide; (4 = 6) &times; 19<br />\r\n27.1 -  67 +  <u><strong>81 </strong></u></span><u><strong><span>&divide;</span></strong></u><span><u><strong> 4</strong></u>=  6  &times; 19<br />\r\n27.1 -  67 + 20.25 = <u><strong>6 </strong></u></span><u><strong><span>&times;  19</span></strong></u><br />\r\n<span><u><strong>27.1</strong></u> - 67<u><strong>+ 20.25</strong></u> = 114<br />\r\n<u><strong>47.35 - 67</strong></u>= 114<br />\r\n-19.65 </span>&ne; <span> 114</span></div>\r\n\r\n<p>Option 2) &times;, +, -, +, &times;, =<br />\r\n<u><strong><span>( \\(\\sqrt {729 &times; 9}\\)</span></strong><strong>)</strong></u>+ 67 - 81 + <u><strong>(4 &times; 6)</strong></u>= 19<br />\r\n<u><strong>81 + 67</strong></u>- 81<u><strong>+ </strong></u><strong><u>24</u></strong> = 19<br />\r\n<u><strong>172 - 81</strong></u>= 19<br />\r\n91 <span>&ne; </span> 19</p>\r\n\r\n<p>Option 3) +, -, &divide;, =, -, &times; <br />\r\n<u><strong><span>( \\(\\sqrt {729 + 9}\\)</span></strong><strong>)</strong></u>- 67 &divide; 81 = <u><strong>(4 - 6)</strong></u>&times; 19<br />\r\n27.1 - <u><strong>67 &divide; 81</strong></u>= -2 &times; 19<br />\r\n<span>27.1 - 0.8  =<u><strong>-2</strong></u></span><u><strong><span> &times; 19</span></strong></u><br />\r\n<u><strong><span>27.1 - 0.8</span></strong></u><span> = -38</span><br />\r\n26.3 &ne; -38</p>\r\n\r\n<p><span>Option 4) &divide;, +, =, -, &times;, +</span><br />\r\n<u><strong><span>( \\(\\sqrt {729 &divide; 9}\\)</span></strong></u><span><u><strong>)</strong></u>+ 67 = 81 - <u><strong>(4 &times; 6)</strong></u>+ 19<br />\r\n<u><strong>9 + 67</strong></u>= <u><strong>81</strong></u>- 24  <u><strong>+ 19</strong></u></span><br />\r\n76 = <strong><u>100 - 24</u></strong><br />\r\n76 = 76 </p>\r\n\r\n<p><strong>Hence, the correct answer is option 4.</strong></p>", "question_heading": ""}, {"sr_no": 28, "question": "\r\n<p>Akash exercises for 2 days and reduces his weight by 1 kg. When he started exercising, his weight was 60 kg. Today Akash&#39;s weight is 55 kg. For how many days did he exercise?</p>", "option1": "\r\n<p>10 days</p>", "option2": "\r\n<p>9 days</p>", "option3": "\r\n<p>7 <span>days</span></p>", "option4": "\r\n<p>8 days</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>Akash exercises for 2 days and reduces his weight by 1 kg.</span></p>\r\n\r\n<p><span>When he started exercising, his weight was = 60 kg</span></p>\r\n\r\n<p><span>Today Akash&#39;s weight = 55 kg</span></p>\r\n\r\n<p><strong><span>Calculation:</span></strong></p>\r\n\r\n<p><span>The difference of weight of Akash = (60 - 55) kg = 5 kg</span></p>\r\n\r\n<p>Now, a<span>ccording to the question</span></p>\r\n\r\n<p><span>Akash exercises for 2 days and reduces his weight by 1 kg.</span></p>\r\n\r\n<p><span>&rArr; 2 days = 1 kg</span></p>\r\n\r\n<p><span>So, (2 &times; 5) days = (1 &times; 5) kg</span></p>\r\n\r\n<p><span>&rArr; 10 days = 5 kg</span></p>\r\n\r\n<p><span>So, he exercised for 10 days.</span></p>\r\n\r\n<p><strong><span>&there4; The required answer is 10 days.</span></strong></p>", "question_heading": ""}, {"sr_no": 29, "question": "\r\n<p><span>If PEDAGOGUE is coded as DEPNFZEUG, then how would HAMSTRING be coded?</span></p>", "option1": "\r\n<p><span>MAHSUTGNI</span></p>", "option2": "\r\n<p><span>ASRNGITMH</span></p>", "option3": "\r\n<p><span>SMAHTGNIR</span></p>", "option4": "\r\n<p><span>MAHQSRGNI </span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989562_1742989562256614_thump.png\" style=\"width: 400px; height: 84px;\" /></figure>\r\n\r\n<p><span>The logic followed here is:</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989624_1742989624794066_thump.png\" style=\"width: 200px; height: 104px;\" /></figure>\r\n\r\n<p>Similarly,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989668_1742989668766613_thump.png\" style=\"width: 200px; height: 105px;\" /></figure>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;MAHQSRGNI&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n<p>Count the number of triangles in the following figure.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989754_1742989754876959_thump.png\" style=\"width: 150px; height: 147px;\" /></figure>", "option1": "\r\n<p>11</p>", "option2": "\r\n<p>18</p>", "option3": "\r\n<p>14</p>", "option4": "\r\n<p>16</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989779_1742989779964232_thump.png\" style=\"width: 150px; height: 158px;\" /></figure>\r\n\r\n<p>There are 16 triangles namely,</p>\r\n\r\n<p>BOC, ADO, BCG, BOG, AFD, AOF, BEF, AGE,</p>\r\n\r\n<p>ABG, BAF, ABD, ABE, BAO, BHO, ACB and AHO</p>\r\n\r\n<p>Hence, &lsquo;16&rsquo; is the correct answer. </p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p>Which one is the largest among the following?</p>", "option1": "\r\n<p>0.725</p>", "option2": "\r\n<p><span class=\"math-tex\">\\(0.72\\bar5\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(0.7\\overline{25}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(0.\\overline{725}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>a.<span class=\"math-tex\">\\(\\bar b\\)</span> = a.bbbb....</p>\r\n\r\n<p>a.0<span class=\"math-tex\">\\(\\bar b\\)</span> = a.0bbbb....</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the above options,</p>\r\n\r\n<p>(1) 0.725 = 0.725</p>\r\n\r\n<p>(2) <span class=\"math-tex\">\\(0.72\\bar5\\)</span> = 0.72555....</p>\r\n\r\n<p>(3) <span class=\"math-tex\">\\(0.7\\overline{25}\\)</span> = 0.7252525...</p>\r\n\r\n<p>(4) <span class=\"math-tex\">\\(0.\\overline{725}\\)</span> = 0.725725725....</p>\r\n\r\n<p>By above option we can see that, option (4) is largest among all.</p>\r\n\r\n<p><strong>&there4; The required answer is <span class=\"math-tex\">\\(0.\\overline{725}\\)</span></strong>.</p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>Two trains travel in the same direction at 50 km/hr and 32 km/hr respectively. A man in the slower train observes that 15 seconds elapse before the faster train completely passes him. What is the length of the faster train?</p>", "option1": "\r\n<p>150 m</p>", "option2": "\r\n<p>125 m</p>", "option3": "\r\n<p>75 m</p>", "option4": "\r\n<div><span class=\"math-tex\">\\(\\frac{625}{3}\\)</span> m</div>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Speed of train (s<sub>1</sub>) = 50 km/hr</p>\r\n\r\n<p>Speed of train (s<sub>2</sub>) = 32 km/hr</p>\r\n\r\n<p>Time = 15 s</p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>If the trains travel in the same direction,</p>\r\n\r\n<p>Relative speed of the trains = (s<sub>1</sub> - s<sub>2</sub>)</p>\r\n\r\n<p>Length of faster train = speed &times; time</p>\r\n\r\n<p>To convert km/h to m/s we multiply the given number by <span class=\"math-tex\">\\(\\frac{5}{{18}}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the above concept,</p>\r\n\r\n<p><span>Since the trains travel in the same direction, relative speed of the trains is (s 1  - s 2 )</span></p>\r\n\r\n<p><span>&rArr; (50 - 32) km/hr = 18 km/hr</span></p>\r\n\r\n<p>Now, t<span>o convert km/h to m/s we multiply the given number by  \\(\\frac{5}{{18}}\\)</span></p>\r\n\r\n<p>&rArr; (18 &times; <span class=\"math-tex\">\\(\\frac{5}{{18}}\\)</span>) = 5 m/s</p>\r\n\r\n<p>Now, the length of faster train = (5 &times; 15) =<strong> 75 m</strong></p>\r\n\r\n<p><strong>&there4; The length of the faster train is 75 m.</strong></p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>Which of the following symbols should replace the question mark (?) in the given expression in order to make the expression &#39;M &lt; N&#39; definitely true?</p>\r\n\r\n<p>K &ge; I &gt; N &ge; G ? D &ge; M</p>", "option1": "\r\n<p>&lt;</p>", "option2": "\r\n<p>&ge;</p>", "option3": "\r\n<p>&le;</p>", "option4": "\r\n<p>&gt;</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>To make the expression &#39;M &lt; N&#39; definitely true, we need to choose the appropriate symbol to replace the question mark (?) in the given expression:</p>\r\n\r\n<p>K &ge; I &gt; N &ge; G ? D &ge; M</p>\r\n\r\n<p>In order for &#39;M &lt; N&#39; to be true, the symbol that should replace the question mark should indicate a relationship where M is less than N. Among the options provided:</p>\r\n\r\n<p>&lt; (less than)<br />\r\n&ge; (greater than or equal to)<br />\r\n&le; (less than or equal to)<br />\r\n(greater than)</p>\r\n\r\n<p>We can eliminate options 2) (&ge;) and 3) (&le;) because they do not represent a relationship where M is less than N.</p>\r\n\r\n<p>Therefore, the correct answer is &gt;.</p>", "question_heading": ""}, {"sr_no": 34, "question": "\r\n<p>If 18 <sup>th </sup>February, 2005 falls on Friday then what will be the day on 18th February, 2007?</p>", "option1": "\r\n<p>Sunday</p>", "option2": "\r\n<p>Monday</p>", "option3": "\r\n<p>Tuesday</p>", "option4": "\r\n<p>Wednesday</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u><strong>Given:</strong></u></p>\r\n\r\n<p>18 <sup>th </sup> February , 2005 is <strong>Friday </strong>.</p>\r\n\r\n<p><u><strong>Concept:</strong></u></p>\r\n\r\n<p>The number of days in <strong>a normal year </strong>is 365 i.e. <strong>52 week 1 day</strong></p>\r\n\r\n<p>So, we can say every year we get <strong>1 odd day </strong>.</p>\r\n\r\n<p><span>The number of days in <strong>a leap year </strong>is 366 i.e. <strong>52 week 2 days</strong></span></p>\r\n\r\n<p><span>So, we can say every leap year we get <strong>2 odd days </strong>.</span></p>\r\n\r\n<p><u><strong><span>Calculation:</span></strong></u></p>\r\n\r\n<p><span>There has <strong>no leap year </strong>between 2005 and 2007.</span></p>\r\n\r\n<p><u><span>From 18</span></u><span>th</span><u><span> February , 2005 to 18</span></u><span>th <u> February , 2006 </u>:<strong>There has only</strong></span></p>\r\n\r\n<p><strong><span> 1 odd day.</span></strong></p>\r\n\r\n<p><span>So, <strong> 18</strong></span><strong><span>th  February , 2006 = Friday + 1 = Saturday.</span></strong></p>\r\n\r\n<p><u>From 18</u><span>th</span><u>February , 2006 to 18</u><span>th</span><u> February , 2007</u>: <strong>There has only</strong></p>\r\n\r\n<p><strong> 1 odd day.</strong></p>\r\n\r\n<p><span>So, <strong> 18</strong></span><strong><span>th  February , 2007 = Saturday + 1 = Sunday.</span></strong></p>\r\n\r\n<p><span>Hence, the correct answer is <strong>&quot;Sunday&quot; </strong>.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>The second number in the given number pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) are followed in all the number pairs, EXCEPT one. Find that odd number pair.</p>", "option1": "\r\n<p>441 : 49</p>", "option2": "\r\n<p>729 : 81</p>", "option3": "\r\n<p>369 : 41</p>", "option4": "\r\n<p>343 : 47</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The pattern followed here is:</p>\r\n\r\n<p><strong>Logic: First number &divide; Second number = 9</strong></p>\r\n\r\n<p><strong>Explanation:</strong></p>\r\n\r\n<p>Option 1. 441 &divide; 49  = 9</p>\r\n\r\n<p>Option 2. 729 &divide; 81 =  9</p>\r\n\r\n<p>Option 3. 369 &divide; 41 = 9</p>\r\n\r\n<p><strong>Option 4. 343 &divide; 47 = 7. 29  i.e., &ne; 9</strong></p>\r\n\r\n<p>Hence, <strong>343 : 47   </strong>is the <strong>correct answer </strong>.</p>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n<p>The sequence of folding a piece of paper and the manner in which the folded paper has been cut is shown in the following figures. How would this paper look when unfolded?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989995_1742989995205287_thump.png\" style=\"width: 200px; height: 64px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990187_1742990187420361_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990218_1742990218160729_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990274_1742990274961318_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990300_1742990300476187_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>The given figure when unfolded is as follows:</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990364_1742990364374871_thump.png\" style=\"width: 300px; height: 73px;\" /></figure>\r\n\r\n<p>Hence, this paper will look as the above figure when unfolded.</p>\r\n\r\n<p>Hence, <strong>&ldquo;option figure 2&rdquo;  </strong>is the correct answer.</p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n\r\n<p>Four letter-clusters have been given out of which three are alike in some manner and one is different. Select the one that is different.</p>", "option1": "\r\n\r\n<p>QSUWY</p>", "option2": "\r\n\r\n<p>GIKMO</p>", "option3": "\r\n\r\n<p>PRTVY</p>", "option4": "", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<ol>\r\n\t<li><span>QSUWY &rarr; Q + 2 = S; S + 2 = U; U + 2 = W; W + 2 = Y</span></li>\r\n\t<li><span>GIKMO &rarr; G + 2 = I; I + 2 = K; K + 2 = M; M + 2 = O </span></li>\r\n\t<li><strong><span>PRTVY &rarr; P + 2 = R; R + 2 = T; T + 2 = V; V + 3 = Y</span></strong></li>\r\n\t<li><span>ACEGI &rarr; A + 2 = C; C + 2 = E; E + 2 = G; G + 2 = I</span></li>\r\n</ol>\r\n\r\n<p><span>Hence, &#39; <strong>PRTVY </strong>&#39; is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": "\r\n<p>Read the given question and decide which of the following arguments is/are strong.</p>\r\n\r\n<p><strong>Statement:</strong></p>\r\n\r\n<p>Should all the indirect taxes in India be combined into a single Goods and Services Tax (GST)?</p>\r\n\r\n<p><strong>Arguments:</strong></p>\r\n\r\n<p>I. Yes. This will considerably simplify the tax collection mechanism and the cost of collecting tax will also reduce.</p>\r\n\r\n<p>II. Yes. The manufacturers and traders will be benefited by this, which in turn will boost tax collection.</p>\r\n\r\n<p>III. No. No other country has adopted such a system.</p>", "option1": "\r\n<p>Only argument I is strong.</p>", "option2": "\r\n<p>Only argument II is strong.</p>", "option3": "\r\n<p>Only arguments I and II are strong.</p>", "option4": "\r\n<p>Only argument III is strong.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>The given statement presents a question about whether all the indirect taxes in India should be combined into a single Goods and Services Tax (GST). Three arguments are given in support of different positions:</p>\r\n\r\n<p><strong>Argument I</strong> is strong because combining all indirect taxes into a single GST is expected to simplify the tax collection mechanism and reduce the cost of collecting tax. With fewer taxes to manage and a simpler tax structure, the government may be able to reduce the cost of tax collection and make the process more efficient.</p>\r\n\r\n<p><strong>Argument II</strong> is also strong because manufacturers and traders may benefit from a single GST as it will simplify their tax obligations and reduce the compliance burden. This, in turn, may lead to increased compliance and boost tax collection.</p>\r\n\r\n<p><strong>Argument III</strong> is weak because the fact that no other country has adopted such a system does not necessarily mean that it is not a good idea for India. The Indian economy has its own unique characteristics and challenges, and it may require a different approach to tax collection and management than other countries.</p>\r\n\r\n<p>So, both argument I and argument II are strong, while argument III is weak.</p>\r\n\r\n<p>Hence, The correct answer is <strong>&quot;<span>Only arguments I and II are strong</span>&quot;.</strong></p>\r\n</div>", "question_heading": ""}, {"sr_no": 39, "question": "\r\n\r\n<p>A television manufacturer earns 20% profit by selling each T.V. set for Rs 14,400. If the production cost is increased by 15%, what should be the new selling price of a T.V. set so as to gain a profit of 15%?</p>", "option1": "\r\n\r\n<p>15,870</p>", "option2": "\r\n\r\n<p>13,800</p>", "option3": "\r\n\r\n<p>12,000</p>", "option4": "\r\n\r\n<p>15,000</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>P% = 20%</p>\r\n\r\n<p>SP = Rs. 14,400</p>\r\n\r\n<p>New CP = 1.15CP</p>\r\n\r\n<p><strong>Concept used: </strong></p>\r\n\r\n<p>CP = <span class=\"math-tex\">\\(\\dfrac{100}{100 + P\\%} × SP\\)</span></p>\r\n\r\n<p>SP = <span class=\"math-tex\">\\(\\dfrac{100 + P\\%}{100} × CP \\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>&rArr; CP = <span class=\"math-tex\">\\(\\dfrac{100}{100 + 20} × 14400\\)</span></p>\r\n\r\n<p>&rArr; CP = Rs. 12,000</p>\r\n\r\n<p>New CP = 1.15 &times; 12000 = Rs. 13,800</p>\r\n\r\n<p>To gain 15% profit, the new SP must be,</p>\r\n\r\n<p>&rArr; SP = <span class=\"math-tex\">\\(\\dfrac{100 + 15}{100} × 13800 \\)</span></p>\r\n\r\n<p>&rArr; SP = 1.15 &times; 13800 = Rs. 15,870</p>\r\n\r\n<p><strong>&there4; The new selling price of a T.V. set so as to gain a profit of 15% must be Rs. 15,870.</strong></p>\r\n\r\n<p> In questions where CP is increased by m% and the profit also should be increased by m%, the new SP can be calculated as,</p>\r\n\r\n<p>SP = (1+ <span class=\"math-tex\">\\(\\dfrac{m}{100}\\)</span>)2 &times; CP</p>\r\n\r\n<p>where, SP = New selling price</p>\r\n\r\n<p>CP = Earlier cost price</p>\r\n\r\n<p>In this question,</p>\r\n\r\n<p>CP = Rs. 12,000</p>\r\n\r\n<p>New SP = (1.15)2 &times; 12000 = Rs. 15,870</p>", "question_heading": ""}, {"sr_no": 40, "question": "Iी &िसतहये&कiॅiकधे&नौतहये ंधोnौ &िसतहये&पiंधौे&नौतहये, &िसतहये&पiंधौे&नौतहये ंधोnौ &िसतहये&कiॅiकधे&नौतहये, &िसतहये+&नौतहये ंधोnौ &िसतहये-&नौतहये ोnक &िसतहये-&नौतहये ंधोnौ &िसतहये+&नौतहये, ौिधधcप पुध nहंृधन ीनयं ोंयng पुध giॅधn यूपiयnौ पुोप cोn नधूिोcध पुध तहधौपiयn ंोना (?) in पुध ीियियथing धतहोपiयn. 12 &कiॅiकधे 3 + 4 &nकोौुे 28 &पiंधौे 7 = 18 &पiंधौे 3 &कiॅiकधे (? + 9)", "option1": "\r\n<p>20</p>", "option2": "\r\n<p>15</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>16</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div> \r\n<p>Decoding the information,           </p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Sign</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Means</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>Given:</p>\r\n\r\n<p>12 &divide; 3 + 4 &ndash; 28 &times; 7 = 18 &times; 3 &divide; (? + 9)</p>\r\n\r\n<p>Let the &ldquo;?&rdquo; is &lsquo;Z&rsquo;</p>\r\n\r\n<p>After replacing the signs from left to right and using the BODMAS rule,</p>\r\n\r\n<p>=&gt; 12 &times; 3 - 4 +<strong><em><u>28 &divide; 7</u></em></strong>=<strong><em><u>18 &divide; 3</u></em></strong>&times; (Z - 9)</p>\r\n\r\n<p>=&gt;<strong><em><u>12 &times; 3</u></em></strong>- 4 + 4 = 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; <strong><em><u>36</u></em></strong>- 4<strong><em><u>+ 4</u></em></strong>= 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; <strong><em><u>40 - 4</u></em></strong> = 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; 36 =<strong><em><u>6</u></em></strong>&times; (Z - 9)</p>\r\n\r\n<p>=&gt; Z &ndash; 9 =<strong><em><u>36 &divide; 6</u></em></strong></p>\r\n\r\n<p>=&gt; Z<strong><em><u>- 9</u></em></strong>= 6</p>\r\n\r\n<p>=&gt; Z =<strong><em><u>6 + 9</u></em></strong></p>\r\n\r\n<p>=&gt; Z = 15</p>\r\nHence,  <strong>&ldquo;15&rdquo; </strong> is the correct answer.</div>", "question_heading": ""}, {"sr_no": 41, "question": "\r\n<p>Two men P and Q start from a place walking at 5 km and 6.5 km per hour respectively. What is the time they will take to be 92 km apart if they walk in opposite directions?</p>", "option1": "\r\n<p>4 hr</p>", "option2": "\r\n<p>8 hr</p>", "option3": "\r\n<p>2 hr</p>", "option4": "\r\n<p>6 hr</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Speed of P (s<sub>1</sub>) = 5 km/hr</p>\r\n\r\n<p>Speed of Q (s<sub>2</sub>) = 6.5 m/hr</p>\r\n\r\n<p>Distance = 92 km</p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>If two persons walked in the opposite direction,</p>\r\n\r\n<p>Relative speed = (s<sub>1</sub> + s<sub>2</sub>)</p>\r\n\r\n<p>Time = <span class=\"math-tex\">\\(\\frac{Distance}{{Speed}}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the above concept,</p>\r\n\r\n<p>The relative speed of the two men = (5 + 6.5) = 11.5 km/hr</p>\r\n\r\n<p>Now, according to the question</p>\r\n\r\n<p><span>Time =  \\(\\frac{Distance}{{Speed}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{92}{{11.5}}\\)</span> = <strong>8 hr</strong></p>\r\n\r\n<p><strong>&there4; The required time i
