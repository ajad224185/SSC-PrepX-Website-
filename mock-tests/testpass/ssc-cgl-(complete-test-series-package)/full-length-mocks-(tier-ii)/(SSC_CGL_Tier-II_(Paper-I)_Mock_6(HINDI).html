<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>22.) SSC CGL Tier-II (Paper-I) Mock 6(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

olution_text": "", "question_heading": ""}, {"sr_no": 57, "question": "निम्नलिखित पाँच आकृतियों में से चार किसी न किसी प्रकार से समान हैं और एक उस प्रकार से इनसे भिन्न है। विषम आकृति का चयन कीजिए।\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694782453732image38.png\"> \n  <br> \n  <br>", "option1": "I\n  <br>", "option2": "II\n  <br>", "option3": "III\n  <br>", "option4": "IV\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 58, "question": "निम्नलिखित शब्दों को उसी क्रम में व्यवस्थित कीजिए जिस क्रम में वे अंग्रेजी शब्दकोश में दिखाई देंगे।\n  <br>1. Antecedent\n  <br>2. Antechamber\n  <br>3. Antediluvian\n  <br>4. Antemeridian\n  <br>5. Antepenultimate\n  <br>", "option1": "4,3,2,1,5\n  <br>", "option2": "2,1,3,4,5\n  <br>", "option3": "1,2,3,4,5\n  <br>", "option4": "2,3,5,4,1\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 59, "question": "निम्न का मान ज्ञात कीजिए।\n  <br> 2,5,17,71,359,?\n  <br>", "option1": "573\n  <br>", "option2": "1457\n  <br>", "option3": "879\n  <br>", "option4": "2159\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "2 × 2 + 1 = 5\n  <br>5 × 3 + 2 = 17\n  <br>17 × 4 + 3 = 71\n  <br>71 × 5 + 4 = 359\n  <br>359 × 6 + 5 = 2154 + 5\n  <br> = 2159\n  <br>", "question_heading": ""}, {"sr_no": 60, "question": "निम्नलिखित श्रृंखला में लुप्त संख्या ज्ञात कीजिए।\n  <br>1, 4, 11, 26, ?, 120\n  <br>", "option1": "59\n  <br>", "option2": "75\n  <br>", "option3": "57\n  <br>", "option4": "74\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "1+3=4\n  <br>4+7=11 (7=3×2+1)\n  <br>11+15=26 (15=7×2+1)\n  <br>26+(15×2+1)=57\n  <br>57+(31×2)+1=57+63=120\n  <br>", "question_heading": ""}, {"sr_no": 61, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The proposal received \n  <b>unanimous </b>approval from the board members.\n  <br>", "option1": "Partial\n  <br>", "option2": "Unruly\n  <br>", "option3": "Divided\n  <br>", "option4": "Unequivocal\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The antonym of \"unanimous\" (complete agreement) is \"divided\" (disagreement or lack of consensus among the members).\n  <br>The other options do not convey the opposite meaning: \"partial\" means incomplete, \"unanimous\" is the same as the highlighted word, and \"unequivocal\" means clear and unambiguous.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>The study of the structure and function of cells.\n  <br>", "option1": "Physiology\n  <br>", "option2": "Histology\n  <br>", "option3": "Cytology\n  <br>", "option4": "Oncology\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The study of the structure and function of cells is called \"cytology.\"\n  <br>The other options are incorrect: \"physiology\" is the study of the functions and mechanisms in living organisms, \"histology\" is the study of the microscopic structure of tissues, and \"oncology\" is the study of cancer.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. In addition to being used as a sweetener, honey has a long history of medicinal use and is believed to have antibacterial and anti-inflammatory properties.\n  <br>B. Bees collect nectar from flowers and convert it into honey through a process of regurgitation and evaporation.\n  <br>C. Honey is a natural sweet substance produced by bees and is one of the oldest known sweeteners.\n  <br>D. Honey has been an important part of human diets and cultures for thousands of years and is still widely consumed around the world today.\n  <br>", "option1": "CBAD\n  <br>", "option2": "ACBD\n  <br>", "option3": "DCBA\n  <br>", "option4": "BADC\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct sequence of sentences is: \"Honey is a natural sweet substance produced by bees and is one of the oldest known sweeteners (C). Bees collect nectar from flowers and convert it into honey through a process of regurgitation and evaporation (B). In addition to being used as a sweetener, honey has a long history of medicinal use and is believed to have antibacterial and anti-inflammatory properties (A). Honey has been an important part of human diets and cultures for thousands of years and is still widely consumed around the world today (D).\"\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the most appropriate option to fill in the blank.\n  <br>The ________ of the internet has revolutionized the way we communicate and access information.\n  <br>", "option1": "proliferation\n  <br>", "option2": "decline\n  <br>", "option3": "cessation\n  <br>", "option4": "reduction\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \"proliferation\" (rapid increase or spread) of the internet has revolutionized the way we communicate and access information. The other options do not fit the context: \"decline\" means a decrease, \"cessation\" means a complete stop, and \"reduction\" means a decrease in size or amount.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>The politician's speech was \n  <b>full of hot air</b> and lacked any concrete plans.\n  <br>", "option1": "Lacking substance or truth\n  <br>", "option2": "Filled with enthusiasm\n  <br>", "option3": "Very inspiring and motivational\n  <br>", "option4": "Containing too much detail\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"full of hot air\" means that something is lacking substance or truth, often used to describe empty or insincere talk. The other options do not convey the correct meaning: \"filled with enthusiasm\" means excited, \"very inspiring and motivational\" means uplifting and encouraging, and \"containing too much detail\" means overly detailed or complicated.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The ________ of the company's stock has been steadily increasing.\n  <br>", "option1": "bare\n  <br>", "option2": "bear\n  <br>", "option3": "pear\n  <br>", "option4": "pair\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct homophone to fill in the blank is \"bear,\" as in \"the bear of the company's stock has been steadily increasing\" (meaning the weight or burden). The other options are incorrect: \"bare\" means uncovered or naked, \"pear\" is a type of fruit, and \"pair\" means a set of two.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The book provides a comprehensive ________ of the major events that shaped the 20th century.\n  <br>", "option1": "overview\n  <br>", "option2": "understatement\n  <br>", "option3": "declination\n  <br>", "option4": "rarity\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A comprehensive \"overview\" (general review or summary) of the major events fits best in this context. The other options are not appropriate: \"understatement\" means a statement that is less strong than the facts, \"declination\" means a refusal or decline, and \"rarity\" refers to something uncommon or infrequent.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The government's new policy aims to ________ the gap between the rich and the poor.\n  <br>", "option1": "exacerbate\n  <br>", "option2": "magnify\n  <br>", "option3": "eradicate\n  <br>", "option4": "bridge\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The government's new policy aims to \"bridge\" (connect, link or reduce) the gap between the rich and the poor. The other options do not fit the context: \"exacerbate\" means to make something worse, \"magnify\" means to make something appear larger or more important, and \"eradicate\" means to destroy or eliminate completely.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The ________ of her speech left everyone in the audience feeling motivated and inspired.\n  <br>", "option1": "eloquence\n  <br>", "option2": "pretense\n  <br>", "option3": "blunder\n  <br>", "option4": "monotony\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \"eloquence\" (fluent or persuasive speaking or writing) of her speech left everyone feeling motivated and inspired. The other options do not fit the context: \"pretense\" means a false display or claim, \"blunder\" refers to a mistake or error, and \"monotony\" means a lack of variety or interest.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>Fear or hatred of strangers or foreigners.\n  <br>", "option1": "Xenophobia\n  <br>", "option2": "Claustrophobia\n  <br>", "option3": "Agoraphobia\n  <br>", "option4": "Hydrophobia\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\"Xenophobia\" is the fear or hatred of strangers or foreigners. The other options are incorrect: \"claustrophobia\" is the fear of confined spaces, \"agoraphobia\" is the fear of open or public spaces, and \"hydrophobia\" is the fear of water.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who is skilled in telling stories and anecdotes.\n  <br>", "option1": "Raconteur\n  <br>", "option2": "Connoisseur\n  <br>", "option3": "Dilettante\n  <br>", "option4": "Philanthropist\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A \"raconteur\" is a person who is skilled in telling stories and anecdotes. The other options are incorrect: \"connoisseur\" is an expert judge in matters of taste, \"dilettante\" is a person who cultivates an area of interest without real commitment or knowledge, and \"philanthropist\" is a person who seeks to promote the welfare of others.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The \n  <b>diligent</b> student worked tirelessly to complete the assignment.\n  <br>", "option1": "Lazy\n  <br>", "option2": "Meticulous\n  <br>", "option3": "Persistent\n  <br>", "option4": "Industrious\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate antonym of the highlighted word \"diligent\" (hardworking, industrious) is \"lazy\" (unwilling to work or use energy). The other options are not antonyms: \"meticulous\" means showing great attention to detail, \"persistent\" means continuing firmly in a course of action, and \"industrious\" means diligent and hardworking.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate SYNONYM of the highlighted word.\n  <br>The \n  <b>enigmatic</b> painting left the viewers puzzled.\n  <br>", "option1": "Cryptic\n  <br>", "option2": "Transparent\n  <br>", "option3": "Lucid\n  <br>", "option4": "Obvious\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate synonym for the highlighted word \"enigmatic\" (difficult to interpret or understand) is \"cryptic\" (having a meaning that is mysterious or obscure). The other options are antonyms: \"transparent\" means easily understood or detected, \"lucid\" means expressed clearly, and \"obvious\" means easily perceived or understood.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the most appropriate SYNONYM of the highlighted word.\n  <br>The manager's decision was \n  <b>arbitrary</b> and lacked proper justification.\n  <br>", "option1": "Systematic\n  <br>", "option2": "Random\n  <br>", "option3": "Methodical\n  <br>", "option4": "Planned\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate synonym for the underlined word \"arbitrary\" (based on random choice or personal whim) is \"random\" (made, done, or chosen without method or conscious decision). The other options are antonyms: \"systematic\" means done or acting according to a plan or system, \"methodical\" means orderly or systematic, and \"planned\" means designed or arranged in advance.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.\n  <br>From the options P, Q, R, and S, select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) The family gathered around the table, eagerly waiting for the delicious feast.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) They were all grateful to be in each other's company.\n  <br> (P) The turkey, the centerpiece of the meal, was perfectly roasted and golden brown.\n  <br>(Q) Everyone took a moment to share what they were thankful for.\n  <br>(R) Plates were filled with a variety of dishes, each more appetizing than the last.\n  <br>(S) The house was filled with laughter and conversations from different corners.\n  <br>", "option1": "P, Q\n  <br>", "option2": "R, S\n  <br>", "option3": "Q, R\n  <br>", "option4": "S, P\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of sentences is:\n  <br>(S1) The family gathered around the table, eagerly waiting for the delicious feast.\n  <br>(S2) The turkey, the centerpiece of the meal, was perfectly roasted and golden brown (P).\n  <br>(S3) Everyone took a moment to share what they were thankful for (Q).\n  <br>(S4) They were all grateful to be in each other's company.\n  <br>The paragraph is about a family gathering for a feast. Sentence P follows S1 logically by describing the main dish, and sentence Q follows P by explaining what the family members did during the meal, which also connects well to the concluding sentence, S4.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.\n  <br>From the options P, Q, R, and S, select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) Jane walked into the library, feeling a sense of calm wash over her.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) She couldn't wait to get lost in the world of her favorite author.\n  <br> (P) She walked past the shelves, running her fingers lightly over the spines of the books.\n  <br>(Q) The quiet atmosphere and the smell of old books were comforting to her.\n  <br>(R) The children's section was filled with bright colors and giggling kids.\n  <br>(S) The librarian greeted her with a warm smile as she headed to her usual spot.\n  <br>", "option1": "P, R\n  <br>", "option2": "Q, S\n  <br>", "option3": "R, Q\n  <br>", "option4": "S, P\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of sentences is:\n  <br>(S1) Jane walked into the library, feeling a sense of calm wash over her.\n  <br>(S2) The quiet atmosphere and the smell of old books were comforting to her (Q).\n  <br>(S3) The librarian greeted her with a warm smile as she headed to her usual spot (S).\n  <br>(S4) She couldn't wait to get lost in the world of her favorite author.\n  <br>The paragraph is about Jane's experience in the library. Sentence Q follows S1 logically by explaining the reasons for her sense of calm, and sentence S follows Q by describing her interaction with the librarian as she goes to her usual spot, which connects well with the concluding sentence, S4.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Choose the option that correctly transforms the given sentence into passive voice.\n  <br>The committee has approved the new policy.\n  <br>", "option1": "The new policy was approved by the committee.\n  <br>", "option2": "The new policy has been approved by the committee.\n  <br>", "option3": "The new policy has approved by the committee.\n  <br>", "option4": "The new policy is approved by the committee.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the present perfect tense (has approved). When transforming it into passive voice, we maintain the tense and use the auxiliary verb \"has been\" followed by the past participle of the main verb (approved).\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Choose the option that correctly transforms the given sentence into active voice.\n  <br>The artwork was admired by many visitors.\n  <br>", "option1": "Many visitors had admired the artwork.\n  <br>", "option2": "Many visitors admired the artwork.\n  <br>", "option3": "Many visitors have admired the artwork.\n  <br>", "option4": "Many visitors were admired the artwork.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple past passive voice (was admired). When transforming it into active voice, we maintain the tense and use the simple past tense of the main verb (admired).\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Choose the option that correctly transforms the given sentence into passive voice.\n  <br>The construction company will build a new bridge across the river.\n  <br>", "option1": "A new bridge will be built by the construction company across the river.\n  <br>", "option2": "A new bridge across the river was built by the construction company.\n  <br>", "option3": "A new bridge across the river is built by the construction company.\n  <br>", "option4": "A new bridge will build by the construction company across the river.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple future tense (will build). When transforming it into passive voice, we maintain the tense and use \"will be\" followed by the past participle of the main verb (built).\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Choose the option that correctly transforms the given sentence into active voice.\n  <br>The proposal was unanimously rejected by the board.\n  <br>", "option1": "The board had unanimously rejected the proposal.\n  <br>", "option2": "The board unanimously rejected the proposal.\n  <br>", "option3": "The board has unanimously rejected the proposal.\n  <br>", "option4": "The board was unanimously rejected the proposal.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple past passive voice (was unanimously rejected). When transforming it into active voice, we maintain the tense and use the simple past tense of the main verb (rejected).\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Choose the option that correctly changes the given direct speech to indirect speech.\n  <br>Mark said, \"I will meet you tomorrow.\"\n  <br>", "option1": "Mark said that he would meet me the next day.\n  <br>", "option2": "Mark said that he will meet me tomorrow.\n  <br>", "option3": "Mark said that he would meet me tomorrow.\n  <br>", "option4": "Mark said that he will meet me the next day.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given direct speech, the sentence is in the simple future tense (will meet). When converting it into indirect speech, we change \"will\" to \"would\" and \"tomorrow\" to \"the next day.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Choose the option that correctly changes the given indirect speech to direct speech.\n  <br>Ananya said, “My grandfather took tablets.”\n  <br>", "option1": "Ananya said that her grandfather has taken tablets.\n  <br>", "option2": "Ananya said that her grandfather was taking tablets.\n  <br>", "option3": "Ananya said that her grandfather had been taking tablets.\n  <br>", "option4": "Ananya said that her grandfather had taken tablets.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>The given sentence is ‘Indirect Speech’.\n  <br>Indirect Speech - Reporting the message of the speaker in our own words.\n  <br>Direct Speech - Reporting the message of the speaker in the exact words as spoken by\n  <br>him.\n  <br>Tense - Past simple (Subject+V2+Object) changes to Past perfect\n  <br>(Subject+had+V3+Object).\n  <br>The sentence thus formed is - Ananya said that her grandfather had taken tablets.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Choose the option that correctly changes the given direct speech to indirect speech.\n  <br>Varun said, “I visited my grandparents for the weekend.”\n  <br>", "option1": "Varun said that he had visited his grandparents for the weekend.\n  <br>", "option2": "Varun said that he had been visiting his grandparents for the weekend.\n  <br>", "option3": "Varun said that he has visite ation\n  <br>", "option3": "she has determined\n  <br>", "option4": "No improvement\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\"Determined\" is the past participle of the verb \"determine,\" which should be used as an adjective to modify \"she.\" So, the correct sentence is \"She is very tired, but she is determined to finish the race.\"\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "Select the option that best improves the highlighted part of the sentence.\n  <br>Neither the students nor the teachers \n  <b>was aware</b> of the change in the schedule.\n  <br>", "option1": "were aware\n  <br>", "option2": "are aware\n  <br>", "option3": "have been aware\n  <br>", "option4": "No improvement\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The subject of the sentence is \"Neither the students nor the teacher,\" which is plural. Therefore, the verb should be plural as well. So, the correct sentence is \"Neither the students nor the teachers were aware of the change in the schedule.\"\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "Select the option to fill in blank no. 1.\n  <br>", "option1": "significant\n  <br>", "option2": "simple\n  <br>", "option3": "essential\n  <br>", "option4": "basic\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"significant\" means important, notable, or having an impact. In the given sentence, the word \"complex\" suggests that the missing word should be something that is important or significant. Therefore, the correct option is (a) significant.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "Select the option to fill in the blank no. 2.\n  <br>", "option1": "neurons\n  <br>", "option2": "muscles\n  <br>", "option3": "bones\n  <br>", "option4": "tissues\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_ learn to let go of negative thoughts and feelings that can cause tension in our bodies and minds. Therefore, the correct option is (d) Reduced tension.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "How can meditation help with stress and anxiety?\n  <br>", "option1": "By making us more aware of our negative thoughts and feelings\n  <br>", "option2": "By suppressing our negative thoughts and feelings\n  <br>", "option3": "By distracting us from our negative thoughts and feelings\n  <br>", "option4": "By encouraging us to dwell on our negative thoughts and feelings\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that when we meditate, we focus on our breath and become more aware of our thoughts and emotions. This can help us to manage stress and anxiety more effectively, as we learn to let go of negative thoughts and feelings. Therefore, the correct option is (a) By making us more aware of our negative thoughts and feelings.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "What physical health benefits can meditation provide?\n  <br>", "option1": "Increased heart rate and blood pressure\n  <br>", "option2": "Reduced chronic pain and improved sleep quality\n  <br>", "option3": "Higher risk of addiction\n  <br>", "option4": "Reduced immune system function\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that meditation has been found to improve physical health by lowering blood pressure, reducing chronic pain, boosting the immune system, and improving sleep quality. Therefore, the correct option is (b) Reduced chronic pain and improved sleep quality.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "What is one type of meditation mentioned in the passage?\n  <br>", "option1": "Hypnotherapy\n  <br>", "option2": "Psychoanalysis\n  <br>", "option3": "Loving-kindness meditation\n  <br>", "option4": "Cognitive-behavioral therapy\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage mentions several types of meditation, including mindfulness, loving-kindness, and transcendental meditation. Therefore, the correct option is (c) Loving-kindness meditation.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "What is the overall effect of regular meditation practice?\n  <br>", "option1": "Increased stress and anxiety\n  <br>", "option2": "Improved cognitive function and concentration\n  <br>", "option3": "Reduced happiness and well-being\n  <br>", "option4": "Worsened mental health\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that with regular practice, meditation can improve cognitive function and concentration, as well as increase feelings of happiness and well-being. Therefore, the correct option is (b) Improved cognitive function and concentration.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "What is one of the most significant challenges facing the global economy?\n  <br>", "option1": "Growing income inequality between developed and developing countries.\n  <br>", "option2": "The decline of emerging economies.\n  <br>", "option3": "The rapid growth of developed countries.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that one of the most significant challenges facing the global economy is the growing income inequality between developed and developing countries. The other options (b) and (c) are incorrect as they are not mentioned in the passage.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What is the impact of globalization on employment and wages?\n  <br>", "option1": "Increased job security for workers in developed countries.\n  <br>", "option2": "Decline in wages and job security for many workers, particularly in the manufacturing sector.\n  <br>", "option3": "A decline in employment opportunities in emerging economies.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that many workers in developed countries have seen their jobs outsourced to emerging economies, where labor is cheaper. This has led to a decline in wages and job security for many workers, particularly in the manufacturing sector. The other options (a), (c), and (d) are incorrect as they are not mentioned in the passage.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "What are some of the solutions to address the challenges facing the global economy?\n  <br>", "option1": "Greater investment in education and training programs.\n  <br>", "option2": "Increasing infrastructure spending.\n  <br>", "option3": "Promoting entrepreneurship.\n  <br>", "option4": "All of the above.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that to address the challenges facing the global economy, many experts are calling for greater investment in education and training programs, increasing infrastructure spending, promoting entrepreneurship, and investing in new technologies that can create new jobs and industries. Therefore, option (d) is correct, and the other options are incorrect.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "What role do interest rates play in the economy?\n  <br>", "option1": "They affect only borrowing and lending.\n  <br>", "option2": "They affect only investment and inflation.\n  <br>", "option3": "They affect borrowing, lending, investment, and inflation.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that interest rates affect various aspects of the economy, such as borrowing, lending, investment, and inflation.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What is the impact of low interest rates on the economy?\n  <br>", "option1": "Increased borrowing and investment and decreased inflation.\n  <br>", "option2": "Decreased borrowing and investment and increased inflation.\n  <br>", "option3": "Increased borrowing and investment and increased inflation.\n  <br>", "option4": "Decreased borrowing and investment and decreased inflation.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that low interest rates make borrowing cheaper and encourage consumers and businesses to take out loans to finance purchases and investments, which can boost economic growth. Low interest rates can also lead to higher inflation as people have more money to spend.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "Who sets interest rates in the economy?\n  <br>", "option1": "Banks\n  <br>", "option2": "Consumers\n  <br>", "option3": "Central banks\n  <br>", "option4": "Investors\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that central banks play a critical role in setting interest rates, and their decisions can have a significant impact on the economy. The Federal Reserve, for example, sets the federal funds rate, which is the interest rate that banks charge each other for overnight loans. By changing this rate, the Federal Reserve can influence the overall interest rates in the economy.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "निम्नलिखित में से कौन मोहनजोदड़ो की महत्वपूर्ण खोज है/हैं?\n  <br>", "option1": "एक दाढ़ी वाले आदमी की स्टीटाइट मूर्ति\n  <br>", "option2": "कांस्य नृत्य करने वाली लड़की\n  <br>", "option3": "महान स्नानघर\n  <br>", "option4": "उपरोक्त सभी\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "मोहनजोदड़ो की महत्वपूर्ण खोजों में दाढ़ी वाले आदमी की स्टीटाइट मूर्ति, कांस्य नृत्य करने वाली लड़की और महान स्नानघर शामिल हैं। इसलिए, सही उत्तर (d) उपरोक्त सभी है।\n  <br> \n  <b>दाढ़ी वाले आदमी की स्टीटाइट मूर्ति: </b>यह कलाकृति, जिसे अक्सर \"पुजारी-राजा\" के रूप में जाना जाता है, एक दाढ़ी वाले आदमी की एक छोटी साबुन की मूर्ति है। यह आकृति एक स्वरूप वाले वस्त्र से सुशोभित है, और सावधानीपूर्वक विवरण सिंधु घाटी सभ्यता की उच्च शिल्प कौशल का सुझाव देता है।\n  <br> \n  <b>कांस्य नृत्य करती हुई लड़की: </b>यह एक नृत्य मुद्रा में एक लड़की की छोटी, लगभग 4 इंच ऊंची, कांस्य प्रतिमा है। मूर्ति, इसके आकार के बावजूद, उसके बाएं हाथ को एक हार और चूड़ियों से ढकी हुई है, जो सभ्यता की उन्नत धातु क्षमताओं को दर्शाती है।\n  <br> \n  <b>महान स्नानघर: </b>महान स्नानघर एक बड़ा, सार्वजनिक जल टंकी है जिसका उपयोग संभवतः अनुष्ठानिक उद्देश्यों के लिए किया जाता था। यह मोहनजोदड़ो के खंडहरों में सबसे प्रसिद्ध संरचनाओं में से एक है। ईंटों से बना और टार जैसे पदार्थ से सील किया गया स्नानघर, सभ्यता की उन्नत अभियांत्रिकी और शहरी नियोजन कौशल को प्रदर्शित करता है।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "शिवालिक पहाड़ियाँ निम्नलिखित में से किसका भाग हैं?\n  <br>", "option1": "अरावली\n  <br>", "option2": "पश्चिमी घाट\n  <br>", "option3": "हिमालय\n  <br>", "option4": "इनमें से कोई नहीं\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c) हिमालय है। शिवालिक पहाड़ियाँ, जिन्हें शिवालिक पहाड़ियाँ और चुरिया पहाड़ियाँ भी कहा जाता है, बाहरी हिमालय की एक पर्वत श्रृंखला है जो सिंधु नदी से पूर्व की ओर ब्रह्मपुत्र नदी के करीब 2,400 किमी (1,500 मील) तक फैली हुई है, जो भारतीय उपमहाद्वीप के उत्तरी हिस्सों तक फैली हुई है।\n  <br>इसकी चौड़ाई 10-50 किमी (6.2-31.1 मील) है और औसत ऊंचाई 1,500-2,000 मीटर (4,900-6,600 फीट) है।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "किस मामले में, कानून के अधिकार के बिना पुलिस द्वारा घरेलू दौरे को भारतीय संविधान के अनुच्छेद 21 का उल्लंघन माना गया था, यह मानते हुए कि गोपनीयता का अधिकार अनुच्छेद 19 ीर के तापस्थापी के रूप में कार्य करता है, एक स्थिर प्रमुख तापमान बनाए रखने के लिए तापमान की लगातार निगरानी और समायोजन करता है।\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "अप्रैल 2023 में, 'मिर्चा' चावल को भौगोलिक संकेत (जीआई) टैग से सम्मानित किया गया था। चावल की इस किस्म का संबंध बिहार के किस जिले से है?\n  <br>", "option1": "पूर्वी चंपारण\n  <br>", "option2": "पश्चिमी चंपारण\n  <br>", "option3": "भागलपुर\n  <br>", "option4": "गया\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "बिहार के पश्चिम चंपारण जिले की मिर्चा चावल की किस्म को हाल ही में जीआई टैग प्रदान किया गया है ।\n  <br> इस चावल के दाने आकार और आकृति में काली मिर्च के समान होते हैं, इसलिए इसे मिर्चा या मार्चा चावल कहा जाता है।\n  <br> चावल सुगंधित चुरा (चावल के टुकड़े) पैदा करने की अपनी क्षमता के लिए भी प्रसिद्ध है।\n  <br> बिहार से जीआई टैग वाली कुछ अन्य वस्तुएं - सिलाओ खाजा, मधुबनी पेंटिंग, बिहार की शाही लीची, बिहार का पिपली का कार्य, मघई पान, बिहार का सिक्की घास उत्पाद, कतरनी चावल, भागलपुर रेशम, भागलपुर जर्दालू, आदि।\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "अप्रैल 2023 में, निम्नलिखित में से किस राज्य सरकार ने एक स्वस्थ और समृद्ध राज्य बनाने के लिए एक जन आंदोलन बनाने के लिए 'सीएम दी योगशाला' कार्यक्रम शुरू किया?\n  <br>", "option1": "राजस्थान\n  <br>", "option2": "पंजाब\n  <br>", "option3": "हिमाचल प्रदेश\n  <br>", "option4": "केरल\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "मुख्यमंत्री भगवंत मान ने दिल्ली के मुख्यमंत्री अरविंद केजरीवाल के साथ \"सीएम दी योगशाला\" अभियान शुरू किया।\n  <br> निवासियों को योग और ध्यान की सुविधाएं प्रदान की जाएंगी।\n  <br> पंजाब के राज्यपाल - बनवारीलाल पुरोहित\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "फिक्शन श्रेणी में पुलित्जर पुरस्कार 2023 के विजेता कौन थे?\n  <br>", "option1": "बारबरा किंग्सोल्वर और हर्नान डियाज़\n  <br>", "option2": "हुआ सू\n  <br>", "option3": "सानाज़ टूसी\n  <br>", "option4": "बेवर्ली गेज\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "फिक्शन श्रेणी में पुलित्जर पुरस्कार 2023 के विजेता उनके उपन्यास 'डेमन कॉपरहेड' के लिए बारबरा किंग्सोल्वर और उनके उपन्यास 'ट्रस्ट' के लिए हर्नान डियाज़ थे।\n  <br> नाटक श्रेणी में सानाज़ टूसी ने जीत हासिल की।\n  <br> जीवनी श्रेणी में बेवर्ली गेज ने जीत हासिल की।\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "2023 लॉरियस वर्ल्ड स्पोर्ट्स अवार्ड्स में किसे स्पोर्ट्समैन ऑफ द ईयर नामित किया गया है?\n  <br>", "option1": "लियोनेल मेसी\n  <br>", "option2": "रोनाल्डो\n  <br>", "option3": "डेविड बेकहम\n  <br>", "option4": "एमबीप्पे\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अर्जेंटीना के प्रसिद्ध फुटबॉल खिलाड़ी लियोनेल मेस्सी को 2023 लॉरियस वर्ल्ड स्पोर्ट्स अवार्ड्स में स्पोर्ट्समैन ऑफ द ईयर नामित किया गया है। यह प्रतिष्ठित पुरस्कार पिछले वर्ष फुटबॉल के मैदान पर मेसी की असाधारण उपलब्धियों को मान्यता देता है।\n  <br>मेस्सी की उल्लेखनीय उपलब्धियों में से एक फीफा विश्व कप में अर्जेंटीना पुरुष फुटबॉल टीम को जीत दिलाना था।\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "केंद्रीय स्वास्थ्य सचिव राजेश भूषण द्वारा हाल ही में लॉन्च किया गया SAKSHAM (सक्षम) क्या है?\n  <br>", "option1": "एक शिक्षण प्रबंधन सूचना प्रणाली (LMIS)\n  <br>", "option2": "एक स्वास्थ्य देखभाल प्रबंधन मंच\n  <br>", "option3": "चिकित्सा अनुसंधान परियोजना\n  <br>", "option4": "एक स्वास्थ्य जागरूकता अभियान\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "केंद्रीय स्वास्थ्य सचिव राजेश भूषण द्वारा हाल ही में लॉन्च किया गया SAKSHAM (सक्षम), \"सतत स्वास्थ्य प्रबंधन के लिए उन्नत ज्ञान को प्रोत्साहित करना\" का संक्षिप्त रूप है। यह नई दिल्ली में राष्ट्रीय स्वास्थ्य और परिवार कल्याण संस्थान (NIHFW) द्वारा विकसित एक शिक्षण प्रबंधन सूचना प्रणाली (LMIS) है।\n  <br> सक्षम एक समर्पित और एकीकृत मंच के रूप में कार्य करता है जिसे देश भर के सभी स्वास्थ्य पेशेवरों को ऑनलाइन प्रशिक्षण और चिकित्सा शिक्षा प्रदा
