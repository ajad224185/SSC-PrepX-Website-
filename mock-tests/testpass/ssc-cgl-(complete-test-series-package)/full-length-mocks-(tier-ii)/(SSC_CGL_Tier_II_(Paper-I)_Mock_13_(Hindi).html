\n\t</ul>\r\n\t</li>\r\n\t<li>The meanings of the other options are as follows - \r\n\t<ul>\r\n\t\t<li><strong>Irritate </strong>(किसी को नाराज़ करना)<strong>- </strong>make (someone) annoyed or a little angry. - <em>Do not <strong>irritate </strong>your mother.</em></li>\r\n\t\t<li><strong>Hesitate </strong>(संकोच करना)<strong>- </strong>pause in indecision before saying or doing something. - <em>I sometimes <strong>hesitate </strong>to say what I am really thinking.</em></li>\r\n\t\t<li><strong>Perforate </strong>(छिद्रित)<strong>- </strong>pierce and make a hole or holes in. - <em>Before you can open the aspirin bottle, you must first <strong>perforate </strong>the plastic safety seal that covers the cap.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, <strong>option 1 </strong>is the correct answer.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 85, "question": "\r\n<p>The pension of the High court judges is given from ___________.</p>", "option1": "\r\n<p>Consolidated fund of India</p>", "option2": "\r\n<p>Consolidated fund of State</p>", "option3": "\r\n<p>Contingency fund of India</p>", "option4": "\r\n<p>None of the above</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<ul>\r\n\t<li>The correct answer is <u><strong>Consolidated fund of India</strong></u>.</li>\r\n\t<li>The <strong>Salaries and allowances </strong>of Judges of the High Courts are charged on the Consolidated Fund of States whereas their Pensions are Charged on the Consolidated Fund of India.</li>\r\n\t<li><strong>Please note: The salaries are given by the state but the pension of Persons appointed central Government is given by the Central government only.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>List of some expenditure charged  upon the Consolidated Fund of India</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Salaries and allowances of the President.</li>\r\n\t<li>Emoluments and allowances of the Chairman and Deputy Chairman of the Rajya Sabha.</li>\r\n\t<li>Salaries and allowances of the Speaker and Deputy Speaker of the Lok Sabha.</li>\r\n\t<li>Salaries and Allowances of the Supreme Court Judges.</li>\r\n\t<li>Pensions of the judges of Supreme Court and High Courts.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 86, "question": "\r\n<p>कांग्रेस और मुस्लिम लीग के बीच हस्ताक्षरित समझौता जिसने हिंदुओं और मुसलमानों दोनों के लिए संयुक्त राजनीतिक अभियान का मार्ग प्रशस्त किया, के रूप में जाना जाता है:</p>", "option1": "\r\n<p>कैबिनेट मिशन योजना</p>", "option2": "\r\n<p>लखनऊ समझौता</p>", "option3": "\r\n<p>पूना समझौता</p>", "option4": "\r\n<p>वेवेल योजना</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>लखनऊ समझौता</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>कांग्रेस और मुस्लिम लीग के बीच हस्ताक्षरित <strong>लखनऊ समझौते</strong> ने हिंदुओं और मुसलमानों दोनों के लिए एक संयुक्त राजनीतिक अभियान का मार्ग प्रशस्त किया।</li>\r\n\t<li>दोनों पक्षों का संयुक्त अधिवेशन दिसम्बर 1916 में लखनऊ (उत्तर प्रदेश) में हुआ।</li>\r\n\t<li><strong>लखनऊ समझौता भारतीय राष्ट्रीय कांग्रेस और मुस्लिम लीग पार्टियों</strong> के बीच एक समझौता था।</li>\r\n\t<li><strong>मुस्लिम लीग</strong> की स्थापना <strong>13 दिसंबर 1906 को ढाका, बांग्लादेश </strong>में हुई थी।\r\n\t<ul>\r\n\t\t<li><strong>मुस्लिम लीग</strong> की स्थापना <strong>नवाब ख्वाजा सलीमुल्लाह</strong> ने की थी।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>भारतीय राष्ट्रीय कांग्रेस की स्थापना वर्ष 1885 में हुई थी।\r\n\t<ul>\r\n\t\t<li><strong>भारतीय राष्ट्रीय कांग्रेस की स्थापना एलन ऑक्टेवियन ह्यूम (ए.ओ. ह्यूम) ने की थी।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 87, "question": "\r\n<p><strong>Direction: Select the option that represents the correct passive voice form of the given sentence.</strong></p>\r\n\r\n<p>The nurse asked me not to make any noise when the baby slept.</p>", "option1": "\r\n<p>The baby asked the nurse not to make any noise when he slept.</p>", "option2": "\r\n<p>I was asked by the nurse not to make any noise when the baby slept.</p>", "option3": "\r\n<p>The nurse asked me not to make any noise as the baby was sleeping.</p>", "option4": "\r\n<p>I asked the nurse not to make any noise when the baby slept.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>I was asked by the nurse not to make any noise when the baby slept .&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in  Active Voice.  As per the given question we have to change it into  Passive Voice. </li>\r\n\t<li>The structure of the given sentence is as follows:\r\n\t<ul>\r\n\t\t<li>Subject + V2 + Object. (Active Voice)</li>\r\n\t\t<li>Subject (objective case)+ was/were + V3 + Object (subjective case). (Passive Voice)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li><em>Their cousin showed them some rare photographs.  (Active Voice)</em></li>\r\n\t\t<li><em>They were shown some rare photographs by their cousin.  (Passive Voice)</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>In the first part of the sentence:\r\n\t<ul>\r\n\t\t<li>The subject  of the given sentence is  &#39;The nurse&#39;.</li>\r\n\t\t<li>The object  of the given sentence is  &#39;me&#39;. </li>\r\n\t\t<li>The subject  will be put in place of  the object  and  the object  will be put in place of  the subject.</li>\r\n\t\t<li>And  &#39;asked&#39;  will be changed into  &#39;was asked&#39;. </li>\r\n\t\t<li>&quot;I&quot; is a singular pronoun and we must use  &quot;was&quot;  with it.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, as per the points mentioned above, we find that the correct answer is  Option 2.</li>\r\n</ul>\r\n\r\n<p>Correct sentence :  <em>I was asked by the nurse not to make any noise when the baby slept. </em></p>", "question_heading": ""}, {"sr_no": 88, "question": "\r\n<p>&#39;माउण्ट न्यूमेन&#39; निम्नलिखित में से किस खनिज के लिए प्रसिद्ध है?</p>", "option1": "\r\n<p>तांबा</p>", "option2": "\r\n<p>बाॅक्साइट</p>", "option3": "\r\n<p>लौह अयस्क</p>", "option4": "\r\n<p>मैंगनीज</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>लौह अयस्क</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>पश्चिमी ऑस्ट्रेलिया में माउंट न्यूमैन ओपन-कट आयरन ओर माइन को माउंट व्हेलबैक आयरन ओर माइन के नाम से भी जाना जाता है।</strong></li>\r\n\t<li>खदान का अधिकांश भाग BHP बिलिटन के पास है और इसे 50 साल पहले विकसित किया गया था। माउंट व्हेलबैक हर साल लाखों टन उच्च श्रेणी के लौह अयस्क का उत्पादन करने वाले BHP के पिलबारा संचालन की रीढ़ रहा है।</li>\r\n\t<li>न्यूमैन ऑपरेशंस पश्चिमी ऑस्ट्रेलिया लौह अयस्क (WAIO) का एक हिस्सा है और इसमें पश्चिमी ऑस्ट्रेलिया के पिलबारा क्षेत्र में दो खनन स्थल शामिल हैं। यह न्यायपार्ली लोगों की पारंपरिक भूमि पर स्थित है।</li>\r\n\t<li>न्यूमैन ईस्ट और न्यूमैन वेस्ट को मिलाकर, न्यूमैन ऑपरेशंस का कुल लौह अयस्क उत्पादन में लगभग 78 मिलियन टन का योगदान है। न्यूमैन ऑपरेशंस BHP, मित्सुई और ITOCHU के बीच 85:15 के संयुक्त उद्यम का हिस्सा है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 89, "question": "\r\n<p>Select the option that will improve the underlined part of the given sentence.</p>\r\n\r\n<p>In this argument, charity is <u>private benevolent and social welfare is public.</u></p>", "option1": "\r\n<p>privately benevolence and social welfare is public.</p>", "option2": "\r\n<p>private benevolence and social welfare is public.</p>", "option3": "\r\n<p>privately benevolent and social welfare is publicity.</p>", "option4": "\r\n<p>privacy benevolent and social welfare is public.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>private benevolence and social welfare is public </strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The error lies in the incorrect usage of  an adjective with an adjective.</li>\r\n\t<li>&#39;Private&#39;  and  &#39;benevolent&#39;  both are  adjectives,  thus, it is incorrect to use both together.</li>\r\n\t<li>An adjective is succeeded by a noun, thus, the adjective &#39;benevolent&#39; needs to be replaced with its noun form i.e. &#39;benevolence&#39;.</li>\r\n\t<li>Thus, the correct answer is <strong>option 2.</strong></li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em> In this argument, charity is <strong>private benevolence and social welfare is public.</strong></em></p>\r\n\r\n<ul>\r\n\t<li>Adjective:  A word that is used to modify a noun or a pronoun.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 90, "question": "\r\n<p><strong><u>Directions </u>: Choose the word or phrase which is an antonym or most opposite in meaning to the word or phrase underlined and mark the answer.</strong></p>\r\n\r\n<p><u><strong>Abrupt</strong></u>decisions are often wrong.</p>", "option1": "\r\n<p>Gradual</p>", "option2": "\r\n<p>Rough</p>", "option3": "\r\n<p>Sharp</p>", "option4": "\r\n<p>Hurried</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Gradual&#39; </strong>.</p>\r\n\r\n<ul>\r\n\t<li>Let us look at the meanings of the  given word  and the  correct answer .\r\n\t<ul>\r\n\t\t<li>Abrupt:  sudden and unexpected.</li>\r\n\t\t<li>Gradual:  taking place or progressing slowly or by degrees.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>According to the given sentence, decisions made in haste are often wrong. </li>\r\n\t<li>Thus, the word  &#39;gradual&#39;  is the most appropriate  antonym  of  &#39;abrupt&#39; .</li>\r\n\t<li>Hence,  option 1)  is the correct answer.</li>\r\n\t<li>Let us look at the meanings of the other words given in the options.</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Word</strong></td>\r\n\t\t\t<td><strong>Meaning</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Rough</td>\r\n\t\t\t<td>not smooth or even; harsh.<br />\r\n\t\t\t<strong>E.g., </strong>Their skin was very <strong>rough </strong>.  </td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Sharp</td>\r\n\t\t\t<td> having a keen edge suitable for cutting.<br />\r\n\t\t\t<strong>E.g., </strong>He placed a <strong>sharp </strong>knife on his neck. </td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Hurried</td>\r\n\t\t\t<td>\r\n\t\t\t<p>done very or too quickly.<br />\r\n\t\t\t<strong>E.g., </strong>Their <strong>hurried </strong>departure made us suspicious. </p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 91, "question": "\r\n<p><strong>Direction: Select the correct active/passive form from the given sentence.</strong></p>\r\n\r\n<p>The police will investigate the case.</p>", "option1": "\r\n<p>The case will investigated by the police.</p>", "option2": "\r\n<p>The case is to be investigated by the police.</p>", "option3": "\r\n<p>The case would be investigated by the police.</p>", "option4": "\r\n<p>The case will be investigated by the police.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> option 4) i.e. &#39;</strong>The case will be investigated by the police.<strong>&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in the active voice. We have to change the sentence into passive form. </li>\r\n\t<li>The given sentence is written in the <strong>future indefinite tense</strong> form. </li>\r\n\t<li>The structure of these kinds of sentences is:\r\n\t<ul>\r\n\t\t<li><strong>Active Voice:</strong> Subject + will + V1 + Object.</li>\r\n\t\t<li><strong>Passive Voice:</strong> Object + will + be + V3 + by + Subject</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Let&rsquo;s see an example:\r\n\t<ul>\r\n\t\t<li><strong>Active voice:</strong> Mona will complete the task.</li>\r\n\t\t<li><strong>Passive voice:</strong><em>The task will be completed by Mona.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The <strong>subject</strong> of the given sentence is &#39;The police&#39; and the <strong>object</strong> of the given sentence is &#39;the case&#39;. </li>\r\n\t<li>So, in the passive voice, the position of &lsquo;subject&rsquo; and &lsquo;object&rsquo; will be interchanged. </li>\r\n\t<li>Also here, &#39;will investigate&#39; will be changed into &#39;will be investigated.&#39;</li>\r\n\t<li>Add <strong>&#39;by&#39;</strong> before the subject.</li>\r\n</ul>\r\n\r\n<p> </p>\r\n\r\n<p><u><strong>Correct Sentence:</strong></u><em>The case will be investigated by the police.</em></p>", "question_heading": ""}, {"sr_no": 92, "question": "\r\n<p>मई 2023 में, फिच ने वित्त वर्ष 24 के लिए भारत की जीडीपी वृद्धि का अनुमान घटाकर ________ कर दिया।</p>", "option1": "\r\n<p>6 %</p>", "option2": "\r\n<p>8 %</p>", "option3": "\r\n<p>10 %</p>", "option4": "\r\n<p>12 %</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>6%</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>फिच ने </strong>इस साल के लिए <strong>भारत की GDP वृद्धि का अनुमान 6.2 से घटाकर 6%</strong> कर दिया है।</li>\r\n\t<li><strong>फिच रेटिंग्स ने 2023-24 के लिए भारत के सकल घरेलू उत्पाद के विकास के अनुमान को 6.2% से घटाकर 6% कर दिया है, जो उच्च मुद्रास्फीति,</strong> ब्याज दरों और कमजोर वैश्विक मांग जैसे कारकों के कारण है।</li>\r\n\t<li>भारतीय अर्थव्यवस्था के 2024-25 में 6.7% की वृद्धि दर के साथ पलटाव की उम्मीद है, जो पहले के 6.9% के अनुमान से थोड़ा कम है।</li>\r\n\t<li>फिच रेटिंग्स ने स्थिर दृष्टिकोण के साथ &#39;बीबीबी-&#39; पर भारत की दीर्घकालिक विदेशी मुद्रा जारीकर्ता डिफ़ॉल्ट रेटिंग की फिर से पुष्टि की है, जो डिफ़ॉल्ट जोखिम और पर्याप्त भुगतान क्षमता की कम उम्मीदों को दर्शाता है।</li>\r\n\t<li>नीचे की ओर संशोधन के बावजूद, भारत लचीला निवेश संभावनाओं द्वारा समर्थित फिच रेटिंग्स द्वारा रेटेड सबसे तेजी से बढ़ते संप्रभु देशों में से एक है।</li>\r\n\t<li>2023-24 के लिए धीमी वृद्धि का अनुमान महामारी से प्रेरित घरेलू मांग में कमी और वैश्विक मांग में कमी को दिया गया है।</li>\r\n\t<li><strong>फिच रेटिंग्स इंक</strong> एक <strong>अमेरिकी क्रेडिट रेटिंग एजेंसी</strong> है और <strong>&quot;बिग थ्री क्रेडिट रेटिंग एजेंसियों&quot;</strong> में से एक है।</li>\r\n\t<li>अन्य दो मूडीज और स्टैंडर्ड एंड पुअर्स हैं।</li>\r\n\t<li>यह 1975 में अमेरिकी प्रतिभूति और विनिमय आयोग द्वारा नामित तीन राष्ट्रीय स्तर पर मान्यता प्राप्त सांख्यिकीय रेटिंग संगठनों (NRSRO) में से एक है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n\r\n<p>भूमध्यरेखा ग्लोब को विभाजित करती है?</p>", "option1": "\r\n\r\n<p>क्षैतिज समान अर्द्ध भागों में</p>", "option2": "\r\n\r\n<p>तिर्यक अर्द्ध भागों में</p>", "option3": "\r\n\r\n<p>दो असमान भागों में</p>", "option4": "\r\n\r\n<p>ऊर्ध्वाधर समान अर्द्ध भागों में</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <strong>क्षैतिजिक समान अर्द्ध भागों में</strong> है।</p>\r\n\r\n<ul>\r\n\t<li>भूमध्य रेखा एक काल्पनिक रेखा है, जो पृथ्वी को दो समान भागों में विभाजित करती है, अर्थात् उत्तरी गोलार्ध और दक्षिणी गोलार्ध में।</li>\r\n\t<li>कर्क रेखा (ट्रॉपिक ऑफ़ कैंसर) पृथ्वी पर अक्षांश का समचतुर्भुज वृत्त है, जिसके सीधे ऊपर सूर्य होता है।</li>\r\n\t<li>मकर रेखा (ट्रॉपिक ऑफ़ कैपरीकॉन) सबसे दक्षिणी अक्षांश है, जहाँ सूर्य सीधे ऊपर होता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": "\r\n<p><strong>Directions: In the given sentence, identify the segment which contains a grammatical error.</strong></p>\r\n\r\n<p>My tailor is made some very stylish dresses for me as well as for my daughter.</p>", "option1": "\r\n<p>for me as well as</p>", "option2": "\r\n<p>is made</p>", "option3": "\r\n<p>for my daughter</p>", "option4": "\r\n<p>very stylish dresses</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; is made &#39; i.e. this part of the sentencehas an error .</p>\r\n\r\n<ul>\r\n\t<li>The given sentence is talking about <strong>a tailor who made some stylish dresses </strong>.</li>\r\n\t<li>In the given sentence, the  use of the singular verb&#39; is &#39;  is  incorrect .</li>\r\n\t<li>The <strong>verb  &#39;is&#39;</strong> is used <strong>to give the position of somebody or something or the place where somebody or something is situated </strong>.</li>\r\n\t<li>The <strong>verb &#39;has&#39; </strong>is used <strong>with many nouns to talk about doing something </strong>.</li>\r\n\t<li>Therefore, the  singular form of the verb &#39;has&#39;  should be used  in place of  the  singular form of the verb &#39;is&#39; .</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is  option 2 .</p>\r\n\r\n<p>Correct sentence:<em>My tailor <strong>has made </strong>some very stylish dresses for me as well as for my daughter </em>.</p>\r\n\r\n<ul>\r\n\t<li>दिया गया वाक्य एक दर्जी के बारे में बात कर रहा है जिसने कुछ स्टाइलिश कपड़े बनाए।</li>\r\n\t<li>दिए गए वाक्य में <strong>एकवचन क्रिया &#39;is&#39; </strong>का प्रयोग <strong>गलत है </strong>।</li>\r\n\t<li><strong>क्रिया &#39;is&#39; </strong>का प्रयोग <strong>किसी व्यक्ति या वस्तु या वह स्थान जहाँ कोई या कुछ स्थित है, की स्थिति बताने के लिए किया जाता है </strong>।</li>\r\n\t<li><strong>क्रिया &#39;has&#39; </strong>का प्रयोग <strong>किसी काम के बारे में बताने के लिए अनेक संज्ञाओं के साथ </strong> किया जाता है।</li>\r\n\t<li>इसलिए,  <strong>क्रिया के एकवचन रूप</strong>&#39;is&#39;  के स्थान पर <strong>क्रिया के एकवचन रूप</strong>&#39;has&#39;  का प्रयोग करना चाहिए।</li>\r\n</ul>\r\n\r\n<p>अत: सही उत्तर  विकल्प 2 है  ।</p>\r\n\r\n<p>सही वाक्य:<em>My tailor has made some very stylish dresses for me as well as for my daughter </em>.</p>", "question_heading": ""}, {"sr_no": 95, "question": "\r\n<p><strong>Choose the word closest in meaning to the given word, from among the options:</strong></p>\r\n\r\n<p>ENCROACH</p>", "option1": "\r\n<p>Approach</p>", "option2": "\r\n<p>Intrude</p>", "option3": "\r\n<p>Destroy</p>", "option4": "\r\n<p>Damage</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Intrude&#39;.</p>\r\n\r\n<ul>\r\n\t<li>ENCROACH is a verb which means to intrude on (a person&#39;s territory, rights, personal life, etc.).\r\n\t<ul>\r\n\t\t<li>Example - <em>She has no right to <strong>encroach </strong>on my time.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The meaning of the given options are as follows - \r\n\t<ul>\r\n\t\t<li>Approach - come near or nearer to (someone or something) in distance or time. - <em>He didn&#39;t <strong>approach </strong>the front door at once.</em></li>\r\n\t\t<li>Intrude - put oneself deliberately into a place or situation where one is unwelcome or uninvited. -<em> He didn&#39;t want to <strong>intrude </strong>upon their conversation.</em></li>\r\n\t\t<li>Destroy - end the existence of (something) by damaging or attacking it. - <em>The disease <strong>destroys </strong>the body&#39;s ability to fight off illness.  </em></li>\r\n\t\t<li>Damage - physical harm that impairs the value, usefulness, or normal function of something. - <em>The fall caused considerable <strong>damage </strong>to her knee.  </em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the above meanings it is evident that intrude is the word closest in meaning to the given word <strong>encroach</strong>.</li>\r\n\t<li>Hence, option 2 is the correct answer. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 96, "question": "\r\n<p>On the bank of which river, Gurdwara Gobind Ghat is situated?</p>", "option1": "\r\n<p>Falgu</p>", "option2": "\r\n<p>Gomti</p>", "option3": "\r\n<p>Ganga</p>", "option4": "\r\n<p>Kosi</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Ganga</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Gurdwara Gobind Ghat</strong> is located on the banks of the river Ganga and is in the vicinity of <strong>Takht Sri Patna Sahib.</strong></li>\r\n\t<li>The place is also known as<strong> Kangan Ghat.</strong></li>\r\n\t<li>In Sikh historical sources, this is the place where Guru Gobind Singh threw his <strong>gold bangle (Kangan)</strong> and passed on the knowledge of Sri Guru Granth Sahib Ji to<strong> Pandit Shiv Dutt</strong>, a devotee of<strong> Sri Ram Chandra.</strong></li>\r\n\t<li>The place is celebrated for the folklores pertaining to the childhood of Guru Gobind Singh.</li>\r\n\t<li>It is believed that he used to play with his playmates on the bank of the Ganges.</li>\r\n\t<li>The ghat is located near <strong>Patna Sahib Station</strong> in the state of Bihar.</li>\r\n\t<li>It is marked by a gateway with the Gurudwara on top of it.</li>\r\n</ul>\r\n\r\n<p><u><strong>Guru Gobind Singh</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Guru Gobind Singh was the <strong>tenth Sikh Guru</strong>, a<strong> spiritual master, warrior, poet and philosopher. </strong></li>\r\n\t<li>He was born in Patna, Bihar on <strong>22 December 1666</strong> while his father was visiting Bengal and Assam.</li>\r\n\t<li>His <strong>birth name</strong> was <strong>Gobind Das/Rai,</strong> and a shrine named <strong>Takht Sri Patna Harimandar Sahib</strong>.</li>\r\n\t<li>Guru Gobind Singh was <strong>formally installed as the leader of the Sikhs at the age of nine</strong>, becoming the <strong>tenth and final human Sikh Guru.</strong></li>\r\n\t<li>Among his notable contributions to Sikhism are founding the Sikh warrior community called<strong> Khalsa </strong>in <strong>1699</strong> and introducing the<strong> Five Ks</strong>, the five articles of faith that Khalsa Sikhs wear at all times.</li>\r\n\t<li>Guru Gobind Singh is credited with the <strong>Dasam Granth </strong>whose hymns are a sacred part of Sikh prayers and Khalsa rituals. </li>\r\n\t<li>He is also credited as the one who finalized and enshrined the Guru Granth Sahib as Sikhism&#39;s primary scripture and eternal Guru.</li>\r\n\t<li>The Guru died on 7 October 1708</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n<p>Consider the following statements:</p>\r\n\r\n<p>1. Governor by his discretion, can summon the House and call for a floor test anytime.</p>\r\n\r\n<p>2. Governor has the power to dissolve the assembly on the aid and advice of the cabinet. </p>\r\n\r\n<p>Which of the above-given statement is/are correct?</p>", "option1": "\r\n<p>1 only</p>", "option2": "\r\n<p>2 only</p>", "option3": "\r\n<p>Both 1 and 2</p>", "option4": "\r\n<p>Neither 1 nor 2</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>2 only</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Indian Express</strong>: &#39;Governor didn&rsquo;t act in accordance with law&#39; The court said that then Maharashtra Governor Bhagat Singh Koshyari was not justified in calling for a floor test on 30 June 2022, as he did not have objective material to show that the incumbent government had lost the confidence of the House.</li>\r\n</ul>\r\n\r\n<p><strong>Floor Test:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Floor Test</strong> is a term used for the test of the majority. If there are doubts against the Chief Minister (CM) of a State, he/she can be asked to prove the majority in the House.</li>\r\n\t<li><strong>In the absence of a clear majority, when there is more than one individual stake to form the government, the Governor may call for a special session to see who has the majority to form the government</strong>.</li>\r\n\t<li>Some legislators may be absent or choose not to vote. The numbers are then considered based only on those MLAs who were present to vote.</li>\r\n\t<li>Article 174 of the Constitution authorizes the Governor to summon, dissolve and prorogue the state legislative assembly.</li>\r\n\t<li><strong>Article 174(2)(b) of the Constitution gives powers to the Governor to dissolve the Assembly on the aid and advice of the cabinet.</strong> However, the Governor can apply his mind when the advice comes from a Chief Minister whose majority could be in doubt. <em><strong>Hence statement 2 is correct.</strong></em></li>\r\n\t<li>According to<strong> Article 175(2), the Governor can summon the House and call for a floor test</strong> to prove whether the government has the numbers.</li>\r\n\t<li>However, the Governor can exercise the above only as per Article 163 of the Constitution which says that the Governor acts on the aid and advice of the Council of Ministers headed by the Chief Minister.</li>\r\n\t<li><strong>When the House is in session, it is the Speaker who can call for a floor test. But when the Assembly is not in session</strong>, the Governor&rsquo;s residuary powers under <strong>Article 163</strong> allow him to call for a floor test. <em><strong>Hence statement 1 is incorrect.</strong></em>\r\n\t<ul>\r\n\t\t<li><strong>Article 163 (1) essentially limits any discretionary power of the Governor</strong> only to cases where the Constitution expressly specifies that the Governor must act on his own and apply an independent mind.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The Governor can exercise his discretionary power under <strong>Article 174</strong>, when the chief minister has lost the support of the House and his strength is debatable.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 98, "question": "\r\n\r\n<p>निम्न में से कौन-सी भूकम्पीय लहरें सर्वाधिक विनाशकारी होती हैं?</p>", "option1": "\r\n\r\n<p>P-लहरें/तरंग</p>", "option2": "\r\n\r\n<p>S- लहरें/तरंग</p>", "option3": "\r\n\r\n<p>सतही तरंगें</p>", "option4": "\r\n\r\n<p>इनमे से कोई भी नहीं</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्&zwj;तर <u>सतही तरंगें</u>है।</p>\r\n\r\n<ul>\r\n\t<li>सतही तरंगें:\r\n\t<ul>\r\n\t\t<li>सतही तरंगें प्रकृति में जल तरंगों के समान होती हैं और पृथ्वी की सतह के ठीक नीचे चलती हैं।</li>\r\n\t\t<li>वे आम तौर पर तब उत्पन्न होते हैं जब भूकंप का स्रोत पृथ्वी की सतह के करीब होता है।</li>\r\n\t\t<li>हालाँकि सतही तरंगें S-तरंगों की तुलना में अधिक धीमी गति से चलती हैं, वे आयाम में बहुत बड़ी हो सकती हैं और भूकंपीय तरंग का सबसे विनाशकारी प्रकार हो सकती हैं।</li>\r\n\t\t<li>सतही तरंगें दो प्रकार की होती हैं:</li>\r\n\t\t<li>रेले तरंगें, जिन्हें ग्राउंड रोल भी कहा जाता है, पानी की सतह पर समान तरंगों के रूप में यात्रा करती हैं।</li>\r\n\t\t<li>प्रेम तरंगें जमीन के क्षैतिज कतरन का कारण बनती हैं। वे आमतौर पर रेले तरंगों की तुलना में थोड़ी तेज यात्रा करते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>भूकंपीय तरंगे:\r\n\t<ul>\r\n\t\t<li>भूकंपीय तरंगें ऊर्जा की तरंगें हैं जो पृथ्वी की परतों के माध्यम से यात्रा करती हैं।</li>\r\n\t\t<li>भूकंपीय तरंगें पृथ्वी के भीतर सामग्री की अचानक गति के कारण होती हैं, जैसे भूकंप के दौरान एक गलती के साथ फिसलना, ज्वालामुखी विस्फोट, विस्फोट, भूस्खलन, हिमस्खलन, और यहां तक कि बहने वाली नदियां भी भूकंपीय तरंगों का कारण बन सकती हैं।</li>\r\n\t\t<li>भूकंपीय तरंगों के प्रकार:</li>\r\n\t\t<li>भूकंपीय तरंगें तीन प्रकार की होती हैं: P-तरंगें, S-तरंगें और सरफेस तरंगें।</li>\r\n\t\t<li>P-तरंगों और S-तरंगों को कभी-कभी सामूहिक रूप से बॉडी तरंगें कहा जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>P-तरंगें:\r\n\t<ul>\r\n\t\t<li>P-तरंगें, जिन्हें प्राथमिक तरंगों या दबाव तरंगों के रूप में भी जाना जाता है,पृथ्वी के माध्यम से सबसे बड़े वेग सेयात्रा करती हैं।</li>\r\n\t\t<li>जब वे हवा में यात्रा करते हैं, तो वे ध्वनि तरंगों का रूप लेते हैं - वे हवा के माध्यम से ध्वनि की गति  (330 ms-1) से यात्रा करते हैं लेकिन ग्रेनाइट में5000 ms-1 पर यात्रा कर सकते हैं।</li>\r\n\t\t<li>उनकी गति के कारण, वे भूकंप के दौरान भूकंप के दौरान दर्ज की जाने वाली पहली तरंगें हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>S-तरंगें:\r\n\t<ul>\r\n\t\t<li>S-तरंगें, जिन्हें द्वितीयक तरंगें, शीयर वेव्स या शेकिंग वेव्स के रूप में भी जाना जाता है, अनुप्रस्थ तरंगें हैं जो P-तरंगों की तुलना में धीमी गति से यात्रा करती हैं।</li>\r\n\t\t<li>इस मामले में, कण गति तरंग प्रसार की दिशा के लंबवत है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 99, "question": "\r\n<p><strong>Direction: Select the correct active/passive form from the given sentence.</strong></p>\r\n\r\n<p>A meeting should be organized in Goa.</p>", "option1": "\r\n<p>Let organize a meeting in Goa.</p>", "option2": "\r\n<p>Let us organize a meeting in Goa.</p>", "option3": "\r\n<p>Let us organized a meeting in Goa.</p>", "option4": "\r\n<p>Let be organize a meeting in Goa.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 2) i.e.  &#39; Let us organize a meeting in Goa. &#39;</p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in the passive voice. We have to change the sentence into the active form. </li>\r\n\t<li>The given sentence is written in the passive form of  &#39;Present indefinite tense.&#39;  It has a <strong>tone of suggestion.</strong></li>\r\n\t<li>The structure of these kinds of sentences is:\r\n\t<ul>\r\n\t\t<li>Passive Voice:Object + should be + V3 </li>\r\n\t\t<li>Active Voice:  Let + V1 + Object.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Let&rsquo;s see another example:\r\n\t<ul>\r\n\t\t<li>Passive voice:  A conference should be arranged in Delhi.</li>\r\n\t\t<li> Active voice:<em>Let us arrange a conference in Delhi.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The  object  of the given sentence is &#39; A meeting &#39;. </li>\r\n\t<li>So, in the active voice, the position of the &lsquo;object&rsquo; changed. </li>\r\n\t<li>Also here, &#39; should be organized &#39; will be changed into &#39; organize &#39;.</li>\r\n\t<li>Add  <strong>&#39;Let us&#39;  </strong>at the beginning of the sentence.</li>\r\n</ul>\r\n\r\n<p><u>Correct Sentence:</u><em>Let us organize a meeting in Goa.</em></p>", "question_heading": ""}, {"sr_no": 100, "question": "\r\n<p>Select the option that will improve the underlined part of the given sentence.</p>\r\n\r\n<p>The newly launched policy is <u>aimed to reduce corruption and plug </u>the loopholes.</p>", "option1": "\r\n<p>aimed to reduce corruption and plugging</p>", "option2": "\r\n<p>aimed at reducing corruption and plug</p>", "option3": "\r\n<p>aimed at reducing corruption and plugging</p>", "option4": "\r\n<p>No improvement required</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong> &#39;aimed at reducing corruption and plugging&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>There are some verbs that take fixed prepositions with them.\r\n\t<ul>\r\n\t\t<li>Example:  <strong>Refrain from, aim at, abstain from, etc</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>And these combinations of verbs always take gerund with them.</li>\r\n\t<li>Thus, the correct answer is <strong>option 3.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct sentence:</strong></u><em>The newly launched policy is <u><strong>aimed at reducing corruption and plugging</strong></u> the loopholes.</em></p>\r\n\r\n<ul>\r\n\t<li>A <strong>gerund </strong> is a verb that&rsquo;s acting as a noun. By that, we mean that the verb&mdash;the word that describes the action that&rsquo;s happening, like &ldquo; <strong>biking </strong>,&rdquo; &ldquo; <strong>thinking </strong>,&rdquo; &ldquo; <strong>running </strong>,&rdquo; or &ldquo; <strong>speaking </strong>&rdquo;&mdash;becomes a thing, a concept that can now be the sentence&rsquo;s subject, direct object, indirect object, or the object of a preposition. </li>\r\n\t<li>It doesn&rsquo;t stop being a verb, but the role it plays in a sentence shifts from describing the action to being a focal point. </li>\r\n\t<li>Here are two examples of sentences that contain gerunds:\r\n\t<ul>\r\n\t\t<li>As a food blogger, <strong>eating </strong>is an involved production for Shoshanna. </li>\r\n\t\t<li>Fazal turned off his phone and shut the door so he could focus on <strong>studying </strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 101, "question": "\r\n\r\n\r\n<p>जब प्रकाश वायु से जल में गमन करता है, तब प्रकाश के लिए नीचे दिया गया कौन-सा एक कथन सत्य है?</p>", "option1": "\r\n\r\n\r\n<p>इसके वेग में वृद्धि होती है।</p>", "option2": "\r\n\r\n\r\n<p>इसकी आवृत्ति में कमी होती है।</p>", "option3": "\r\n\r\n\r\n<p>इसकी तरंगदैर्ध्य और आवृति दोनों में वृद्धि होती है।</p>", "option4": "\r\n\r\n\r\n<p>इसकी तरंगदैर्ध्य और वेग दोनों में कमी होती है।</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p><u><strong>स्पष्टीकरण:</strong></u></p>\r\n\r\n<p><strong>प्रकाश का अपवर्तन:</strong></p>\r\n\r\n<ul>\r\n\t<li>जब एक माध्यम से दूसरे माध्यम में गमन करने वाली प्रकाश की किरण दूसरे माध्यम में प्रवेश करती है, तो वह अपने पथ से विचलित हो जाती है।</li>\r\n\t<li>जब प्रकाश एक माध्यम से दूसरे माध्यम में जाता है, तो अंतरापृष्ठ पर प्रकाश के परावर्तन की दिशा में परिवर्तन को <strong>प्रकाश का अपवर्तन </strong>कहा जाता है।</li>\r\n\t<li>जब प्रकाश की किरण<strong> विरल माध्यम से सघन माध्यम </strong>(वायु से जल की ओर)में प्रवेश करती है तो वहदो माध्यमों के अंतरापृष्ठ के  आपतित बिंदु पर से अभिलंब की ओर विचलित हो जाती है।</li>\r\n\t<li><strong>आवृत्ति ही </strong>एकमात्र इकाई है जो <strong>नहीं बदलती है।</strong></li>\r\n\t<li>जो इकाई बदलती है <strong>वह तरंग दैर्ध्य और वेग है।</strong></li>\r\n\t<li>अपवर्तनांक भी निर्वात में दी गई तरंगदैर्घ्य के लिए प्रकाश के वेग c  और किसी पदार्थ में उसके वेग v से अनुपात के बराबर होता है, अर्थात,</li>\r\n</ul>\r\n\r\n<p><strong>n = (c/v)</strong></p>\r\n\r\n<ul>\r\n\t<li>इस प्रकार, जब प्रकाश एक माध्यम से दूसरे माध्यम में जाता है तो<strong> वेग, तरंग दैर्ध्य और अपवर्तनांक </strong>परिवर्तित हो जाते हैं लेकिन आवृत्ति अपरिवर्तित रहती है।</li>\r\n\t<li>इसी प्रकार <strong>सघन माध्यम से विरल माध्यम</strong> में जाने पर किरण <strong>अभिलंब से दूर विचलित हो जाती है।</strong></li>\r\n\t<li>यदि प्रकाश अंतरापृष्ठ पर लंबवत, अर्थात अभिलंब के समांतर आपतित होता है, तो यह दूसरे माध्यम में बिना विचलित हुए प्रवेश करता है।</li>\r\n</ul>\r\n\r\n<p>अत:, जब प्रकाश वायु से जल में गमन करता है तो उसकी <u><strong>तरंगदैर्घ्य तथा वेग दोनों में कमी हो जाती है।</strong></u></p>", "question_heading": ""}, {"sr_no": 102, "question": "\r\n<p>सूची-I को सूची-II से सुमेलित कीजिए और सूचियों के नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>सूची-I</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>सूची-II</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(A)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अनुच्छेद - 324</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>1.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अनुसूचित जाति के लिए राष्ट्रीय आयोग</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(B)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अनुच्छेद - 315</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>2.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>वित्त आयोग</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(C)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अनुच्छेद - 280</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>3.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>लोक सेवा आयोग</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(D)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अनुच्छेद - 338</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>4.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>निर्वाचन आयोग</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "option1": "\r\n<p>A - 4, B - 3, C - 2, D - 1</p>", "option2": "\r\n<p>A - 3, B - 2, C - 1, D - 4</p>", "option3": "\r\n<p>A - 1, B - 3, C - 4, D - 2</p>", "option4": "\r\n<p>A - 3, B - 2, C - 4, D - 1</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर<u><strong>A - 4, B - 3, C - 2, D - 1</strong></u>है।</p>\r\n\r\n<p><strong>अनुच्छेद 324 :</strong></p>\r\n\r\n<ul>\r\n\t<li>भारतीय संविधान में अनुच्छेद 324 चुनाव आयोग को संसद, प्रत्येक राज्य के विधानमंडल के लिए, और संविधान के तहत आयोजित राष्ट्रपति और उपराष्ट्रपति के कार्यालयों के लिए चुनावों को निर्देशित, नियंत्रित और संचालित करने की शक्ति देता है।</li>\r\n\t<li>संविधान का अनुच्छेद 324 &quot;चुनावों के अधीक्षण, निर्देशन और नियंत्रण&quot; को एक चुनाव आयोग में निहित करता है, जिसमें &quot;मुख्य चुनाव आयुक्त और अन्य चुनाव आयुक्तों शामिल होते हैं। अन्य चुनाव आयुक्तों की संख्या राष्ट्रपति समय-समय पर तय कर सकते हैं।</li>\r\n</ul>\r\n\r\n<p><strong>अनुच्छेद 315 :</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>संघ </strong>के लिए एक <strong>लोक सेवा आयोग</strong> और प्रत्येक <strong>राज्य</strong> के लिए एक <strong>लोक सेवा आयोग</strong> होगा।</li>\r\n\t<li>दो या दो से अधिक राज्य सहमत हो सकते हैं कि राज्यों के उस समूह के लिए एक लोक सेवा आयोग होगा, और यदि उस आशय का संकल्प सदन द्वारा पारित किया जाता है या जहाँ दो सदन हैं, उनमें से प्रत्येक के विधानमंडल के प्रत्येक सदन द्वारा राज्य, संसद कानून द्वारा उन राज्यों की जरूरतों को पूरा करने के लिए एक संयुक्त राज्य लोक सेवा आयोग की नियुक्ति के लिए प्रावधान कर सकती है।</li>\r\n\t<li>पूर्वोक्त किसी भी कानून में ऐसे <strong>आकस्मिक और परिणामी प्रावधान</strong> हो सकते हैं जो कानून के उद्देश्यों को प्रभावी करने के लिए आवश्यक या वांछनीय हो सकते हैं।</li>\r\n\t<li>संघ के लिए लोक सेवा आयोग, यदि किसी <strong>राज्य के राज्यपाल</strong> द्वारा ऐसा करने का अनुरोध किया जाता है, तो वह राष्ट्रपति के अनुमोदन से राज्य की सभी या किसी भी आवश्यकता को पूरा करने के लिए सहमत हो सकता है। </li>\r\n\t<li>इस संविधान में <strong>संघ लोक सेवा आयोग या किसी राज्य लोक सेवा आयोग के सन्दर्भों को</strong>, जब तक कि संदर्भ से अन्यथा अपेक्षित न हो, संघ की आवश्यकताओं की सेवा करने वाले <strong>आयोग</strong> या, जैसा भी मामला हो, राज्य के संबंध में विचाराधीन विशेष मामला के रूप में माना जाएगा।</li>\r\n</ul>\r\n\r\n<p><strong>अनुच्छेद 280</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>अनुच्छेद 280</strong> के अनुसार, <strong>वित्त आयोग</strong> की स्थापना <strong>5 वर्ष</strong> की अवधि के लिए की जाती है।</li>\r\n\t<li><strong>वित्त आयोग</strong> भारत के राष्ट्रपति द्वारा गठित एक <strong>&#39;संवैधानिक निकाय&#39;</strong> है जो केंद्र के करों में राज्यों के भाग पर राष्ट्रपति को अपना सुझाव देता है।</li>\r\n\t<li>वित्त आयोग का गठन राष्ट्रपति द्वारा 5 वर्ष की अवधि के लिए किया जाता है।</li>\r\n\t<li>राष्ट्रपति वित्त आयोग की रिपोर्ट <strong>संसद के दोनों सदनों के समक्ष रखता है।</strong></li>\r\n\t<li>वित्त आयोग केंद्र और राज्यों के बीच साझा किए जाने वाले शुद्ध करों के वितरण से संबंधित राष्ट्रपति को सिफारिश करता है।</li>\r\n\t<li>वित्त आयोग में एक <strong>अध्यक्ष और चार सदस्य</strong> होते हैं।</li>\r\n</ul>\r\n\r\n<p><strong>अनुच्छेद 338</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>अनुच्छेद 338 के अनुसार,</strong> अनुसूचित जातियों के लिए एक आयोग होगा जिसे अनुसूचित जातियों के लिए राष्ट्रीय आयोग के रूप में जाना जाएगा।\r\n\r\n\t<ul>\r\n\t\t<li>अनुसूचित जाति और अनुसूचित जनजाति के लिए विशेष अधिकारी की नियुक्ति राष्ट्रपति द्वारा की जाएगी।</li>\r\n\t\t<li>अनुसूचित जातियों और अनुसूचित जनजातियों के लिए इस संविधान में निर्धारित सुरक्षा उपायों से संबंधित सभी मामलों की जांच करना और राष्ट्रपति द्वारा आदेशित अवधि में ऐसे सुरक्षा उपायों के संचालन पर राष्ट्रपति को रिपोर्ट करना विशेष अधिकारी की जिम्मेदारी है। और राष्ट्रपति ऐसी सभी रिपोर्ट संसद के प्रत्येक सदन के समक्ष प्रस्तुत कराएंगे।</li>\r\n\t\t<li>अनुच्छेद 340 (1) के अनुसार नियुक्त आयोग की रिपोर्ट प्राप्त करने के बाद राष्ट्रपति आदेश द्वारा नामित एंग्लो-इंडियन समुदाय और अन्य पिछड़े समूहों को इस अनुच्छेद में अनुसूचित जातियों और अनुसूचित जनजातियों की परिभाषाओं में शामिल कर सकते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 103, "question": "\r\n<p><strong>Directions: Choose the correct form of expression to complete the sentence:</strong></p>\r\n\r\n<p>The worker received ______ when he was injured at work.</p>", "option1": "\r\n<p>compendium</p>", "option2": "\r\n<p>contribution</p>", "option3": "\r\n<p>refund</p>", "option4": "\r\n<p>compensation</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; compensation &#39; .</p>\r\n\r\n<ul>\r\n\t<li>Let  us  explore  the  given options:\r\n\t<ul>\r\n\t\t<li>The noun  &#39;compensation&#39;  is  something, typically money, awarded to someone in recognition of loss, suffering or injury . (मुआवजा)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - He is seeking  compensation  for injuries suffered at work.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39;compendium&#39;  is  a collection or set of similar items . (समान वस्तुओं का संग्रह या समूह)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - An invaluable  compendium  of useful information about language.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39;contribution&#39;  is  a gift or payment to a common fund or collection . (एक सामान्य निधि या संग्रह के लिए एक उपहार या भुगतान)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - The agency is mainly financed from voluntary  contributions .</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39;refund&#39;  is  a repayment of a sum of money. ( एक राशि का पुनर्भुगतान)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - You may be allowed to claim a  refund  of the tax.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Complete Sentence:<em>The worker received  compensation  when he was injured at work </em>.</p>", "question_heading": ""}, {"sr_no": 104, "question": "\r\n<p><strong>Choose the word closest in meaning to the given word, from among the options:</strong></p>\r\n\r\n<p>FORSAKE</p>", "option1": "\r\n<p>Separate</p>", "option2": "\r\n<p>Abandon</p>", "option3": "\r\n<p>Forgo</p>", "option4": "\r\n<p>Disintegrate</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Abandon&#39; .</p>\r\n\r\n<ul>\r\n\t<li>FORSAKE  is a verb which means to abandon or leave.\r\n\t<ul>\r\n\t\t<li>Example -  <em>I still love him and I would never <strong>forsake </strong>him.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The meaning of the given options are as follows - \r\n\t<ul>\r\n\t\t<li>Separate  - forming or viewed as a unit apart or by itself. - <em>He raised two  <strong>separate  </strong>issues.</em></li>\r\n\t\t<li>Abandon  - cease to support or look after (someone); desert. - <em> We cannot  <strong>abandon  </strong>the puppies in the cold. </em></li>\r\n\t\t<li>Forgo  - go without (something desirable). - <em>I cannot  <strong>forgo  </strong>dessert even if my stomach is full.   </em></li>\r\n\t\t<li>Disintegrate  - break up into small parts as the result of impact or decay. -  <em>Many meteors <strong>disintegrate </strong>during their passage through the atmosphere. </em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the above meanings it is evident that  abandon  is the word closest in meaning to the given word  forsake .</li>\r\n\t<li>Hence,  option 2  is the correct answer. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 105, "question": "\r\n<p>निम्नलिखित में से किस संयुक्त राष्ट्र संगठन ने 17 मई 2023 को सहायक प्रौद्योगिकी पर स्वास्थ्य अनुसंधान विभाग (DHR) के साथ सहयोग किया है?</p>", "option1": "\r\n<p>UNESCO</p>", "option2": "\r\n<p>विश्व बैंक</p>", "option3": "\r\n<p>UNDP</p>", "option4": "\r\n<p>WHO</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>WHO</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>केंद्र सरकार ने 17 मई 2023 को सहायक प्रौद्योगिकी पर स्वास्थ्य अनुसंधान विभाग (DHR) और <strong>विश्व स्वास्थ्य संगठन (WHO)</strong> के बीच परियोजना सहयोग समझौते पर हस्ताक्षर करने की मंजूरी दे दी है।</li>\r\n\t<li>समझौते पर <strong>5 साल</strong> की अवधि के लिए हस्ताक्षर किए जाएंगे।</li>\r\n\t<li>यह समझौता सहायक <strong>प्रौद्योगिकी के विकास, उत्पादन और वितरण के लिए राष्ट्रीय और उप-राष्ट्रीय क्षमता को मजबूत करने पर</strong> केंद्रित होगा।</li>\r\n\t<li><strong>समझौता दिव्यांग लोगों के बीच सहायक प्रौद्योगिकी </strong>के उपयोग को बढ़ावा देने पर भी ध्यान केंद्रित करेगा।</li>\r\n\t<li>समझौते को WHO द्वारा वित्त पोषित किया जाएगा।</li>\r\n\t<li>इस समझौते से <strong>भारत में 1 मिलियन से अधिक दिव्यांग लोगों</strong> को लाभ होने की उम्मीद है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 106, "question": "\r\n<p><strong>Identify the segment in the sentence which contains a grammatical error.</strong></p>\r\n\r\n<p>Schools was brought to an abrupt standstill when the lockdown was imposed.</p>", "option1": "\r\n<p>was imposed</p>", "option2": "\r\n<p>when the lockdown</p>", "option3": "\r\n<p>to an abrupt stand still</p>", "option4": "\r\n<p>Schools was brought</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The erroneous part is <strong>&#39;Schools was brought&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is grammatically incorrect.</li>\r\n\t<li>Here, <strong>&#39;Schools were brought&#39; </strong>should be used instead of <strong>&#39;Schools was brought&#39;.</strong></li>\r\n\t<li>In the given sentence &#39; <strong>Schools </strong>&#39; is <strong>a plural noun </strong>.</li>\r\n\t<li>Hence, it should be followed by <strong>a plural helping verb.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 4.</strong></li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sentence:</u></strong><em><strong>Schools were brought </strong>to an abrupt standstill when the lockdown was imposed.</em></p>\r\n\r\n<ul>\r\n\t<li>दिया गया वाक्य व्याकरण की दृष्टि से गलत है।</li>\r\n\t<li>यहां <strong>&#39;Schools was brought&#39; </strong>के बजाय <strong>&#39;Schools were brought&#39; </strong>का इस्तेमाल किया जाना चाहिए।</li>\r\n\t<li>दिए गए वाक्य में &#39; <strong>Schools </strong>&#39; एक <strong>plural noun </strong>है। इसलिए, इसके बाद <strong>plural helping verb </strong>होनी चाहिए।</li>\r\n\t<li>अत: सही उत्तर <strong>विकल्प 4 </strong>है। </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 107, "question": "\r\n<p>Direction: Select the most appropriate homonym to fill in the blank.</p>\r\n\r\n<p>Most towns have a spooky old woman with a lot of cats who all the neighbourhood kids suspect of being a ______.</p>", "option1": "\r\n<p>wish</p>", "option2": "\r\n<p>which</p>", "option3": "\r\n<p>wich</p>", "option4": "\r\n<p>witch</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is- &#39;witch.&#39;</p>\r\n\r\n<ul>\r\n\t<li> Words like &#39;witch&#39;, &#39;wich&#39;, and &#39;which&#39; are called homophones.</li>\r\n\t<li>This means that they sound the same but have different spellings and meanings.</li>\r\n\t<li>Let us see the <strong>meanings </strong>of the words:\r\n\t<ul>\r\n\t\t<li>Wish: a feeling that you want to have something or that something should happen. (इच्&zwj;छा, चाह, अभिलाषा, कामना, आकांक्षा)</li>\r\n\t\t<li>Which: used in questions to ask somebody to be exact, when there are a number of people or things to choose from. ((अनेक व्&zwj;यक्तियों या वस्&zwj;तुओं में बिल्&zwj;कुल सही को चुनने के लिए प्रयुक्त) कौन-सा?)</li>\r\n\t\t<li>Wich: a saltworks, a bundle of thread. (एक नमक का काम, धागे का एक बंडल)</li>\r\n\t\t<li>Witch: (in past times and in stories) a woman who is thought to have magic powers. ((पूर्व समय और कहानियों में) जादूगरनी, टोनहाई या जादू-टोना करने वाली स्&zwj;त्री)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The given sentence talks about a woman who is strange and frightening. </li>\r\n\t<li>The option &quot;witch &quot; is correct in this context.</li>\r\n</ul>\r\n\r\n<p>Correct sentence:<em>Most towns have a spooky old woman with a lot of cats who all the neighbourhood kids suspect of being a <u>witch</u>.</em></p>", "question_heading": ""}, {"sr_no": 108, "question": "\r\n<p><strong>Direction: Select the option that will improve the underlined part of the given sentence. In case no improvement is needed, select &#39;No improvement required&#39;.</strong></p>\r\n\r\n<p>It has been my great misfortune <strong><u>to follow a speech more notable</u></strong> for its volume than for any sense.</p>", "option1": "\r\n<p>following a speech most notable</p>", "option2": "\r\n<p>No improvement required</p>", "option3": "\r\n<p>to follow a speech much notable</p>", "option4": "\r\n<p>to have being following a speech more notable</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here, the correct answer is<strong> No improvement required</strong></p>\r\n\r\n<p>The givensentence is grammatically correct in its current form. It properly uses the structure &quot;It has been my great misfortune to follow a speech...&quot; to express the speaker&#39;s regret.</p>\r\n\r\n<ul>\r\n\t<li><strong>The phrase &quot;more notable for its volume than for any sense&quot; correctly compares the loudness of the speech to its meaning, using &quot;more notable&quot; to effectively convey the message.</strong></li>\r\n\t<li>The other options provided do not improve the sentence but rather introduce grammatical errors or awkward phrasing.</li>\r\n\t<li><strong>Therefore, no improvements are required for the given sentence.</strong></li>\r\n\t<li>The first option, &quot;following a speech most notable&quot; creates an incomplete sentence, altering the meaning conveyed originally by leaving out the crucial &#39;to follow&#39;.</li>\r\n\t<li>The third option, &quot;to follow a speech much notable&quot; isn&#39;t grammatically valid in English because &#39;much&#39; usually modifies uncountable nouns, it isn&#39;t typically used with &#39;notable&#39; which is an adjective.</li>\r\n\t<li>The fourth option, &quot;to have being following a speech more notable&quot; is grammatically incorrect as &#39;to have being&#39; should be &#39;to have been&#39;. Furthermore, even if corrected to &#39;to have been&#39; it would create an awkward sentence.</li>\r\n\t<li><strong>Therefore, given the above analysis, the original sentence does not need any changes, and hence the correct option would be 2) No improvement required[</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 109, "question": "\r\n<p>1887 में भारतीय राष्ट्रीय कांग्रेस के अध्यक्ष कौन थे?</p>", "option1": "\r\n<p>गोपाल कृष्ण गोखले</p>", "option2": "\r\n<p>दादाभाई नौरोजी</p>", "option3": "\r\n<p>बदरुद्दीन तैयबजी</p>", "option4": "\r\n<p>सुरेन्द्रनाथ बनर्जी</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>बदरुद्दीन तैयबजी</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>ब्रिटिश राज </strong>के दौरान, <strong>बदरुद्दीन तैयबजी </strong>(10 अक्टूबर 1844 - 19 अगस्त 1906) एक<strong> भारतीय वकील, कार्यकर्ता और राजनीतिज्ञ </strong>थे।</li>\r\n\t<li><strong>बंबई के उच्च न्यायालय</strong> में <strong>बैरिस्टर </strong>के रूप में काम करने वाले पहले भारतीय <strong>तैयबजी</strong> थे।</li>\r\n\t<li><strong>1887 </strong>में, उन्होंने <strong>भारतीय राष्ट्रीय कांग्रेस के तीसरे अध्यक्ष</strong> का पद संभाला।</li>\r\n\t<li>उन्होंने <strong>भारतीय राष्ट्रीय कांग्रेस के पहले मुस्लिम अध्यक्ष</strong> के रूप में कार्य किया और इसके <strong>संस्थापक सदस्यों</strong> में से एक थे।</li>\r\n\t<li><strong>1874</strong> में, उन्होंने बंबई में <strong>अंजुमन-ए-इस्लाम कॉलेज</strong> की स्थापना की।</li>\r\n\t<li>तैयबजी ने <strong>जनाना व्यवस्था को कमजोर करने</strong> और<strong> महिलाओं की आजादी </strong>के लिए भी अभियान चलाया।</li>\r\n\t<li><strong>गोपाल कृष्ण गोखले (9 मई 1866 - 19 फरवरी 1915):</strong>\r\n\t<ul>\r\n\t\t<li>वह स्वतंत्रता के संघर्ष के दौरान भारत में <strong>एक समाज सुधारक और &quot;उदारवादी&quot; राजनीतिक व्यक्ति</strong> थे।</li>\r\n\t\t<li>गोखले<strong> सर्वेंट्स ऑफ इंडिया सोसाइटी </strong>के <strong>संस्थापक</strong>  थे।</li>\r\n\t\t<li>वह <strong>भारतीय राष्ट्रीय कांग्रेस के एक प्रमुख सदस्य </strong>थे।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>दादाभाई नौरोजी (4 सितंबर 1825 - 30 जून 1917):</strong>\r\n\t<ul>\r\n\t\t<li>वह भारत में एक <strong>लेखक, व्यवसायी, विद्वान और राजनीतिक</strong> हस्ती थे।</li>\r\n\t\t<li>उन्होंने <strong>1886 से 1887, 1893 से 1894 और 1906 से 1907 </strong>तक इसके दूसरे, नौवें और 22वें अध्यक्ष के रूप में <strong>भारतीय राष्ट्रीय कांग्रेस</strong> की अध्यक्षता की।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>सुरेंद्रनाथ बनर्जी (10 नवंबर 1848 - 6 अगस्त 1925):</strong>\r\n\t<ul>\r\n\t\t<li>उन्होंने ब्रिटिश शासन के तहत <strong>भारतीय राष्ट्रवादी आंदोलन</strong> का नेतृत्व किया।</li>\r\n\t\t<li>उन्होंने एक राष्ट्रवादी समूह <strong>इंडियन नेशनल एसोसिएशन</strong> की स्थापना की।</li>\r\n\t\t<li>वह <strong>भारतीय राष्ट्रीय कांग्रेस के संस्थापक सदस्यों</strong> में से एक थे।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 110, "question": "\r\n\r\n<p>इंद्राणी रहमान भारत के किस शास्त्रीय नृत्य से संबद्ध थीं?</p>\r\n\r\n<p>I. भरतनाट्यम नृत्य</p>\r\n\r\n<p>II. ओडिसी नृत्य</p>", "option1": "\r\n\r\n<p>न तो I  और न ही II</p>", "option2": "\r\n\r\n<p>I और II दोनों</p>", "option3": "\r\n\r\n<p>केवल II</p>", "option4": "\r\n\r\n<p>केवल।</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <u><strong>I और II दोनों</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>इंद्राणी रहमान भरतनाट्यम, कुचिपुड़ी, कथकली और ओडिसी की एक  भारतीय शास्त्रीय नृत्यांगना थीं, जिसे उन्होंने पश्चिम में लोकप्रिय बनाया और बाद में 1976 में न्यूयॉर्क में बस गईं। </strong></li>\r\n\t<li>1952 में, उन्होंने मिस इंडिया पेजेंट जीता।</li>\r\n\t<li>उन्होंने अपने अंतरराष्ट्रीय दौरों के दौरान भारतीय शास्त्रीय नृत्य ओडिसी को लोकप्रिय बनाया ।</li>\r\n\t<li>इंद्राणी को 1969 में पद्मश्री और प्रदर्शन कला में संगीत नाटक अकादमी पुरस्कार और तारकनाथ दास पुरस्कार भी मिला था।</li>\r\n\t<li>संगीत नाटक अकादमी के अनुसार,भारत में आठ शास्त्रीय नृत्य हैं, जिनमें भरतनाट्यम, कुचिपुड़ी, कथकली, मोहिनीअट्टम, ओडिसी, मणिपुरी, कथक और सत्त्रिया शामिल हैं।</li>\r\n\t<li>भरतनाट्यम-\r\n\t<ul>\r\n\t\t<li>यह तमिलनाडु का शास्त्रीय नृत्य है ।</li>\r\n\t\t<li>भरतनाट्यम की एक अन्य प्रसिद्ध प्रस्तावक रुक्मिणी देवी अरुंडेल को नृत्य को वैश्विक पहचान देने के लिए याद किया जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>कुचिपुड़ी-\r\n\t<ul>\r\n\t\t<li>यह आंध्र प्रदेश का शास्त्रीय नृत्य है।</li>\r\n\t\t<li>राधा रेड्डी और राजा रेड्डी , यामिनी कृष्णमूर्ति, इंद्राणी रहमान , आदि प्रसिद्ध प्रस्तावक हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>कथकली-\r\n\t<ul>\r\n\t\t<li>यह केरल का शास्त्रीय नृत्य है।</li>\r\n\t\t<li>गुरु कुंचू कुरुप, गोपी नाथ, कोट्टकल शिवरामन, रीता गांगुली,  आदि प्रसिद्ध प्रस्तावक हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>कथक-\r\n\t<ul>\r\n\t\t<li>यह उत्तर प्रदेश का शास्त्रीय नृत्य है।</li>\r\n\t\t<li>बिरजू महाराज, लच्छू महाराज, सितारा देवी, दमयंती जोशी,   आदि प्रसिद्ध प्रस्तावक हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 111, "question": "\r\n<p><strong>Direction: Select the most appropriate option to fill in the blank.</strong></p>\r\n\r\n<p>My friend passed the exam at the first ______.</p>", "option1": "\r\n<p>attempt</p>", "option2": "\r\n<p>trial</p>", "option3": "\r\n<p>struggle</p>", "option4": "\r\n<p>task</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;attempt.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us see the <strong>meanings </strong>of the given options:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Attempt: </strong>an act of trying to do something. (प्रयत्&zwj;न, प्रयास, कोशिश)</li>\r\n\t\t<li><strong>Trial: </strong>the process in a court of law where a judge, etc. listens to the evidence and decides if somebody is guilty of a crime or not. (मुक़दमा; न्&zwj;यायालय में न्&zwj;यायाधीश आदि के द्वारा साक्ष्&zwj;यों की जाँच)</li>\r\n\t\t<li><strong>Struggle: </strong>a fight in which somebody tries to do or get something when this is difficult. (संघर्ष (किसी कठिन काम को कर पाने या कठिन लक्ष्&zwj;य को प्राप्&zwj;त करने के लिए))</li>\r\n\t\t<li><strong>Task: </strong>a piece of work that has to be done, especially an unpleasant or difficult one. (नियत कार्य (विशेषतः अप्रिय या कठिन))</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The given sentence states that his friend passed the exam at the first act of trying to pass it.</li>\r\n\t<li>Hence, the correct answer is Option 1.</li>\r\n</ul>\r\n\r\n<p>Correct sentence: <em>My friend passed the exam at the first <u><strong>attempt</strong></u>.</em></p>", "question_heading": ""}, {"sr_no": 112, "question": "\r\n<p><strong>Examine the four jumbled sentences. Out of the given options, pick the one that gives their correct order.</strong></p>\r\n\r\n<p>A. Wasserkopf returns to his school and asks for a refund of his tuition fee.</p>\r\n\r\n<p>B. &lsquo;Refund&rsquo; by Karinthy is a hilarious play about a student named Wasserkopf.</p>\r\n\r\n<p>C. However, the situation changes when the Mathematics teacher asks him to calculate the total amount.</p>\r\n\r\n<p>D. He further declares that he had learnt nothing at school in all the years.</p>", "option1": "\r\n<p>CBAD</p>", "option2": "\r\n<p>BADC</p>", "option3": "\r\n<p>BCAD</p>", "option4": "\r\n<p>ADCB</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>BADC </strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The given question is an example of a  Para Jumble.</li>\r\n\t<li>We know that the first statement of a para jumbled question is usually  an independent general statement, a noun, a universal fact, starting of an incident, or it starts with &#39;most&#39; or &#39;once&#39;. </li>\r\n\t<li><strong>Sentence B </strong>will be the starting line because it contains the main idea of the para jumble i.e. Refund(a play).</li>\r\n\t<li><strong>Sentence A </strong>states that Wasserkopf returned to his school and asked for a refund of his tuition fee. So, <strong>A</strong>will follow <strong>B</strong>.</li>\r\n\t<li>Further, <strong>Sentence D </strong>states that he further declared that he was asking for a refund because he had learned nothing at school &amp; <strong>Sentence C </strong>states that the situation changed when the Mathematics teacher asked him to calculate the total amount of his refund. So, <strong>C</strong>will follow <strong>D</strong>.</li>\r\n\t<li>Thus, the correct sequence is:\r\n\t<ul>\r\n\t\t<li><strong>B </strong>: &lsquo;Refund&rsquo; by Karinthy is a hilarious play about a student named Wasserkopf.</li>\r\n\t\t<li><strong>A </strong>: Wasserkopf returns to his school and asks for a refund of his tuition fee.</li>\r\n\t\t<li><strong>D </strong>: He further declares that he had learnt nothing at school in all the years.</li>\r\n\t\t<li><strong>C </strong>: However, the situation changes when the Mathematics teacher asks him to calculate the total amount.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sequence:</u></strong><em>&lsquo;Refund&rsquo; by Karinthy is a hilarious play about a student named Wasserkopf. Wasserkopf returns to his school and asks for a refund of his tuition fee. He further declares that he had learnt nothing at school in all the years. However, the situation changes when the Mathematics teacher asks him to calculate the total amount.</em></p>", "question_heading": ""}, {"sr_no": 113, "question": "\r\n<p><strong>Direction: Choose the correct direct speech of the following sentence from the options given below:</strong></p>\r\n\r\n<p>He ordered them to lock the door.</p>", "option1": "\r\n<p>He said to them, &ldquo;Lock the door. &quot;</p>", "option2": "\r\n<p>He said to them, &ldquo;Please lock the door.&quot;</p>", "option3": "\r\n<p>He told them, &quot;You locked the door.&quot;</p>", "option4": "\r\n<p>He tells them, &quot;Lock the door.&quot;</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer: <strong>He said to them, &ldquo;Lock the door. &quot;</strong></p>\r\n\r\n<ul>\r\n\t<li>The rules of changing Indirect to  <strong>Direct speech </strong>for <strong>imperative sentence </strong>conversions.\r\n\r\n\t<ul>\r\n\t\t<li>The reporting verb asked, demanded, ordered, enquired, and offered  is changed to  said/said to as per the nature of the sentence.</li>\r\n\t\t<li>The first person in the reported speech changes according to the subject of reporting speech.</li>\r\n\t\t<li>In Reported Speech change of the second person depends on the object of reporting speech.</li>\r\n\t\t<li>The third person remains unchanged.</li>\r\n\t\t<li>Imperative sentences  do not normally have an expressed subject.</li>\r\n\t\t<li>This is because the subject &lsquo;you&rsquo; is usually understood.</li>\r\n\t\t<li>In order to change an imperative sentence into direct speech, we must remove a  to-infinitive  from direct speech.\r\n\t\t<ul>\r\n\t\t\t<li>Example: </li>\r\n\t\t\t<li><em>The old woman said to the boy, &lsquo;Go to the auditorium.&rsquo;</em></li>\r\n\t\t\t<li><em>The old woman ordered the boy to go to the auditorium.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The correct answer is   Option 1 .</li>\r\n</ul>\r\n\r\n<p>Correct sentence:<em>He said to them, &ldquo;Lock the door. &quot;</em></p>", "question_heading": ""}, {"sr_no": 114, "question": "\r\n<p>Ag एक महंगी, मुलायम, सफेद और चमकदार धातु का रासायनिक प्रतीक है जिसे आमतौर पर ________ के रूप में जाना जाता है</p>", "option1": "\r\n<p>एल्युमीनियम</p>", "option2": "\r\n<p>निकेल</p>", "option3": "\r\n<p>मरकरी</p>", "option4": "\r\n<p>चांदी</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>चांदी</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>चांदी</strong> एक रासायनिक तत्व है जिसका प्रतीक &quot;<strong>Ag</strong>&quot; है और इसकी परमाणु संख्या &quot;<strong>47</strong>&quot; है।</li>\r\n\t<li><strong>चांदी धातु (Ag)</strong> बिजली का एक <strong>अच्छा चालक</strong> है और यह वातावरण में रासायनिक रूप से सक्रिय नहीं है।</li>\r\n\t<li><strong>चांदी</strong> को <strong>आवर्त सारणी</strong> में एक <strong>संक्रमण धातु</strong> के रूप में वर्गीकृत किया गया है।</li>\r\n\t<li><strong>चांदी</strong> एक <strong>सफेद, मुलायम कीमती धातु</strong> है जिसका उपयोग <strong>गहने बनाने</strong> में किया जाता है।</li>\r\n\t<li><strong>एल्युमिनियम</strong> (<strong>Al</strong>) एक <strong>चांदी-सफेद धातु</strong> है जिसका उपयोग रसोई के <strong>बर्तनों</strong>, <strong>खिड़की के फ्रेम</strong> और <strong>हवाई जहाज</strong> के हिस्सों में किया जाता है।</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>तत्व</strong></td>\r\n\t\t\t<td><strong>प्रतीक</strong></td>\r\n\t\t\t<td><strong>परमाणु संख्या</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>एल्युमीनियम</strong></td>\r\n\t\t\t<td>Al</td>\r\n\t\t\t<td>13</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>निक्केल</strong></td>\r\n\t\t\t<td>Ni</td>\r\n\t\t\t<td>28</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>मरकरी</strong></td>\r\n\t\t\t<td>Hg</td>\r\n\t\t\t<td>80</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 115, "question": "\r\n<p><strong>In the following question, out of the four alternatives, choose the one which can be substituted for the given words/sentence.</strong></p>\r\n\r\n<p>That which lasts for a short time</p>", "option1": "\r\n<p>Rotatory</p>", "option2": "\r\n<p>Regular</p>", "option3": "\r\n<p>Transitory</p>", "option4": "\r\n<p>Repository</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is- &#39;Transitory.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us see the <strong>meanings </strong>of the words:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Rotatory: </strong>occurring in rotation. (नियमित आवर्तन में होना)</li>\r\n\t\t<li><strong>Regular: </strong>done or happening often. (प्रायः किया जाने या घटित होते रहने वाला)</li>\r\n\t\t<li><strong>Transitory: </strong>continuing or existing only for a short time. (थोड़ी अवधि के लिए ही अस्तित्व में या जारी रहनेवाला; क्षणिक, क्षणभंगुर)</li>\r\n\t\t<li><strong>Repository: </strong>a place or container in which something is stored in large quantities. (वह स्थान जहाँ बड़ी मात्रा में चीज़ें संग्रहित की जाती हैं, भंडार, संग्रह केंद्र)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, that which lasts for a short time is called <strong>&quot;Transitory.&quot;</strong></li>\r\n\t<li>The <strong>option 3</strong> is correct in this context.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 116, "question": "\r\n<p><strong>Select the most appropriate idiom from the following options that can substitute the underlined part of the given sentence.</strong></p>\r\n\r\n<p>Dheerubai, a source of inspiration to the present generation, <u>started life very poor and then later in life became very rich</u>.</p>", "option1": "\r\n<p>Dragged his feet</p>", "option2": "\r\n<p>Got it off his chest</p>", "option3": "\r\n<p>Went from rags to riches</p>", "option4": "\r\n<p>Felt the pinch</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> &#39;Went from rags to riches&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The most appropriate idiom that can substitute the underlined part <strong>&quot;started life very poor and then later in life became very rich&quot;</strong> is<strong> &quot;went from rags to riches&quot;.</strong></li>\r\n\t<li>This idiom means <strong>to start life very poor and become rich later. </strong></li>\r\n\t<li>Origin of this idiom:\r\n\t<ul>\r\n\t\t<li>The idiom<strong> &quot;rags to riches&quot; </strong>originates from the idea that someone who starts with nothing, symbolized by &quot;<strong>rags</strong>,&quot; can achieve great wealth and success, symbolized by &quot;<strong>riches</strong>,&quot; through hard work and determination.</li>\r\n\t\t<li>It is often associated with the American Dream, the idea that anyone can achieve success and prosperity through hard work and determination, regardless of social status or background.</li>\r\n\t\t<li>The phrase is believed to have been first coined by Horatio Alger Jr., an American writer of children&#39;s books in the 19th century, who wrote many stories about young people from humble backgrounds who became successful through hard work and perseverance.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Answer:</u></strong><em>Went from rags to riches.</em></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meaning of other words:\r\n\t<ul>\r\n\t\t<li><strong>Dragged his feet: </strong>to delay or to act slowly on something</li>\r\n\t\t<li><strong>Got it off his chest:</strong> to tell someone about something that has been worrying you, so that you feel better</li>\r\n\t\t<li><strong>Felt the pinch: </strong>to experience financial difficulties. </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 117, "question": "\r\n<p><strong>Directions: Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p>\r\n\r\n<p>A. This means that decisions should not be taken under any kind of pressure to benefit individuals or only a small section of society.</p>\r\n\r\n<p>B. First, there should be transparency in making decisions; secrecy breeds corruption.</p>\r\n\r\n<p>C. There are certain values that civil servants need to imbibe in themselves for better administration.</p>\r\n\r\n<p>D. Then, all decisions must be taken only in the public interest, to benefit the community at large.</p>", "option1": "\r\n<p>CADB</p>", "option2": "\r\n<p>BADC</p>", "option3": "\r\n<p>CBDA</p>", "option4": "\r\n<p>DABC</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;CBDA .&#39;</p>\r\n\r\n<ul>\r\n\t<li>The sentence &#39; C&#39; is  independent  of any other sentence as it is giving general information about &quot; the steps that should be followed by civil servants <strong>for better administration </strong>&quot;. Hence, &#39; C&#39; is the  first part .</li>\r\n\t<li>Sentence  B  will come after  C   as  it is giving information about the first step i.e. <strong>there should be transparency in making decisions as secrecy breeds corruption </strong>.</li>\r\n\t<li>Sentence  D  will come after  B  as  it is giving information about the next step i.e. <strong>all decisions must be taken only in the public interest, to benefit the community at large</strong>.</li>\r\n\t<li>The sentence &#39; A&#39; is the  concludingpart  as  it further explains or elaborates why all decisions must be taken only in the public interest  (decisions should not be taken under any kind of pressure to benefit individuals or only a small section of society).</li>\r\n</ul>\r\n\r\n<p><u>Paragraph after rearranging the sentences</u>: <em>There are certain values that civil servants need to imbibe in themselves for better administration. First, there should be transparency in making decisions; secrecy breeds corruption. Then, all decisions must be taken only in the public interest, to benefit the community at large. This means that decisions should not be taken under any kind of pressure to benefit individuals or only a small section of society.</em></p>\r\n\r\n<ul>\r\n\t<li><u>Important Rules to Solve the Para Jumbles </u>:\r\n\r\n\t<ul>\r\n\t\t<li>Read the sentences  attentively and try to  comprehend the idea or theme of the sentence  and  eliminate the irrelevant  options.</li>\r\n\t\t<li>Try to  identify the opening  (independent sentence)  and closing sentences  (concluding sentence) .</li>\r\n\t\t<li>Try to  identify the mandatory pairs . Two sentences can be connected through various connectors and other determinants.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>वाक्य  &#39;C&#39;  किसी अन्य वाक्य से स्वतंत्र है क्योंकि यह &quot;बेहतर प्रशासन के लिए सिविल सेवकों द्वारा अनुसरण किए जाने वाले कदमों&quot; के बारे में सामान्य जानकारी दे रहा है। अतः &#39; C&#39; पहला भाग है।</li>\r\n\t<li>वाक्य  B, C के बाद आएगा क्योंकि यह पहले चरण के बारे में जानकारी दे रहा है यानी निर्णय लेने में पारदर्शिता होनी चाहिए क्योंकि गोपनीयता भ्रष्टाचार को जन्म देती है।</li>\r\n\t<li>वाक्य  D, B के बाद आएगा क्योंकि यह अगले चरण के बारे में जानकारी दे रहा है अर्थात सभी निर्णय केवल जनहित में लिए जाने चाहिए, ताकि बड़े पैमाने पर समुदाय को लाभ हो।</li>\r\n\t<li>वाक्य &#39; A&#39; समापन भाग है क्योंकि यह आगे बताता है या विस्तृत करता है कि सभी निर्णय केवल सार्वजनिक हित में क्यों लिए जाने चाहिए (निर्णय किसी भी प्रकार के दबाव में व्यक्तियों या समाज के केवल एक छोटे से वर्ग को लाभ के लिए नहीं लिया जाना चाहिए)।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 118, "question": "\r\n<p><strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p>\r\n\r\n<p>A. Both are bodies of water.</p>\r\n\r\n<p>B. On the other hand, most of the lakes are freshwater bodies usually surrounded by land.</p>\r\n\r\n<p>C. Oceans and lakes have much in common, however, they are also quite different.</p>\r\n\r\n<p>D. Oceans are huge water bodies of salty water and they cover about three-fourths of the surface area of the earth that surrounds the continents.</p>", "option1": "\r\n<p>ACBD</p>", "option2": "\r\n<p>CADB</p>", "option3": "\r\n<p>DCBA</p>", "option4": "\r\n<p>CDAB</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>CADB</strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The given question is an example of a Para Jumble.</li>\r\n\t<li>We know that the first statement of a para jumbled question is usually an independent general statement, a noun, a universal fact, starting of an incident, or it starts with &#39;most&#39; or &#39;once&#39;.\r\n\t<ul>\r\n\t\t<li><strong>Sentence C</strong> will be the first sentence because it is an independent general statement. It tells us that Oceans and lakes are different.</li>\r\n\t\t<li><strong>Sentence A</strong> will be the next sentence because it is connected with the previous sentence and further tells us that both are water bodies.</li>\r\n\t\t<li><strong>Sentence D</strong> and <strong>Sentence B</strong> are connected. Sentence B will come at last because it contains the phrase <strong>&#39;on the other hand&#39;</strong>.</li>\r\n\t\t<li>The phrase<strong> &#39;on the other hand&#39;</strong> is <strong>used to introduce a contrasting point of view, fact, or situation.</strong>\r\n\t\t<ul>\r\n\t\t\t<li><strong>For Example - </strong>&quot;Being a child star is bittersweet. On one hand, you&#39;re loved by millions, but <strong>on the other hand,</strong> you&#39;re forever remembered for what you did years ago&quot;</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>Thus, the correct sequence is:\r\n\t\t<ul>\r\n\t\t\t<li><strong>C</strong>: Oceans and lakes have much in common, however they are also quite different.</li>\r\n\t\t\t<li><strong>A</strong>: Both are bodies of water.</li>\r\n\t\t\t<li><strong>D</strong>: Oceans are huge water bodies of salty water and they cover about three-fourths of the surface area of the earth that surrounds the continents.</li>\r\n\t\t\t<li><strong>B</strong>: On the other hand, most of the lakes are freshwater bodies usually surrounded by land.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sequence:</u></strong><em>Oceans and lakes have much in common, however they are also quite different. Both are bodies of water. Oceans are huge water bodies of salty water and they cover about three-fourths of the surface area of the earth that surrounds the continents. On the other hand, most of the lakes are freshwater bodies usually surrounded by land.</em></p>", "question_heading": ""}, {"sr_no": 119, "question": "\r\n<p>Which of the following is/are the components of the Human Capital Index released by the World Bank?</p>\r\n\r\n<p>a. Mortality rates of children under 5 years</p>\r\n\r\n<p>b. Expected years of Quality-Adjusted Schooling</p>\r\n\r\n<p>c. Per Capita income</p>\r\n\r\n<p>Select the correct answer using the code given below.</p>", "option1": "\r\n<p>c only</p>", "option2": "\r\n<p>a and c only</p>", "option3": "\r\n<p>a and b only</p>", "option4": "\r\n<p>a, b and c</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>a and b only.</strong></u></p>\r\n\r\n<p><strong>Human Capital Index:</strong></p>\r\n\r\n<ul>\r\n\t<li>The Human Capital Index <strong>is a part of the Human Capital Project</strong> launched to explore strategies to augment human resource development across the world.</li>\r\n\t<li><strong>The Human Capital Index ranks 174 countries in 2020</strong> based on outcomes in education and health indicators and the impact they have on future productivity.</li>\r\n\t<li>The World Development Report, of which both the Human Capital Project and Human Capital Index are parts, <strong>aims to measure the development levels of various countries using standardised parameters. </strong></li>\r\n\t<li><strong>The HCI is a number between 0 and 1</strong> indicating the expected productivity of a child born now after they attain 18 years of age under the present conditions.</li>\r\n\t<li>India has ranked 116 out of 174 countries ranked in HCI with the HCI value at 0.49 in 2020.</li>\r\n\t<li><strong>The Three key areas being measured are:</strong>\r\n\t<ul>\r\n\t\t<li>Mortality rates of children under 5 years</li>\r\n\t\t<li>Expected years of Quality-Adjusted Schooling</li>\r\n\t\t<li>Health Environment\r\n\t\t<ul>\r\n\t\t\t<li>Rate of stunting in children under 5 years</li>\r\n\t\t\t<li>Adult survival rates. <em><strong>Hence, statements a and b are correct and statement c is not correct.</strong></em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The following are the<strong> key findings of the HCI Report for India:</strong>\r\n\t<ul>\r\n\t\t<li>Human Capital Index: <strong>Children born in India now would be 44 per cent productive </strong>when they grow up as compared to children of the same age who enjoy complete education and full health.</li>\r\n\t\t<li>Mortality rates of children under 5 years: <strong>96% of children born in India survive up to the age of 5 years</strong></li>\r\n\t\t<li>Expected years of Quality-Adjusted Schooling: <strong>A child who starts school at age 4 can expect to get 10.2 years of school by their 18th birthday.</strong></li>\r\n\t\t<li>Harmonized Test Scores: <strong>Indian students score 355 out of 625 where 625 is advanced attainment and 300 is minimum attainment.</strong></li>\r\n\t\t<li>Learning Adjusted Years of School: Factoring in learning outcomes, children in India get effective schooling of 5.8 years on average.</li>\r\n\t\t<li>Adult Survival Rate: 83 per cent of 15-year-olds are expected to survive beyond 60 years of age in India</li>\r\n\t\t<li>Healthy Growth: 62 per cent of children under 5 years of age in India have a healthy growth rate.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 120, "question": "\r\n<p>आहार नली में अंगों द्वारा स्रावित कौन सा रस वसा के पाचन में महत्वपूर्ण भूमिका निभाता है?</p>", "option1": "\r\n<p>अग्नाशयी रस, लार</p>", "option2": "\r\n<p>हाइड्रोक्लोरिक अम्ल, श्लेम</p>", "option3": "\r\n<p>पित्त रस, अग्नाशयी रस</p>", "option4": "\r\n<p>लार, हाइड्रोक्लोरिक अम्ल</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>पित्त रस, अग्नाशयी रस</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>अंगों द्वारा स्रावित पित्त रस, अग्नाशयी रस वसा के पाचन में महत्वपूर्ण भूमिका निभाता है।</li>\r\n\t<li><strong>पित्त रस</strong> यकृत द्वारा स्रावित होता है।\r\n\t<ul>\r\n\t\t<li>इसमें किसी भी प्रकार के एंजाइम नहीं होते हैं।</li>\r\n\t\t<li>पित्त रस भोजन को क्षारीय बनाने और वसा के अणुओं को तोड़ने में सहायता करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>अग्नाशयी रस अग्न्याशय </strong> द्वारा स्रावित होता है।\r\n\t<ul>\r\n\t\t<li>इसमें एमाइलेज, ट्रिप्सिन, अग्नाशयी लाइपेज, न्यूक्लियेज, एमाइलेज और लाइपेज जैसे एंजाइम होते हैं।</li>\r\n\t\t<li>अग्नाशयी रस का स्राव हार्मोन स्रावी और कोलेसिस्टोकिनिन द्वारा नियंत्रित किया जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>लाइपेज</strong> वसा का पाचक एंजाइम है।</li>\r\n\t<li>ट्यालिन <strong>लार </strong>का पाचक एंजाइम है।</li>\r\n\t<li><strong>हाइड्रोक्लोरिक अम्ल</strong> भोजन के पाचन में सहायता करने के लिए मानव आमाशय में स्वाभाविक रूप से उत्पन्न होता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>2023-24 खरीफ ऋतु के लिए कैबिनेट ने कितनी उर्वरक सब्सिडी को मंजूरी दी?</p>", "option1": "\r\n<p>1.04 लाख करोड़ रुपये</p>", "option2": "\r\n<p>1.06 लाख करोड़ रुपये</p>", "option3": "\r\n<p>1.08 लाख करोड़ रुपये</p>", "option4": "\r\n<p>1.09 लाख करोड़ रुपये</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>1.08 लाख करोड़ रुपये</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>केंद्रीय मंत्रिमंडल ने <strong>2023-24 खरीफ ऋतु</strong> के लिए <strong>1.08 लाख करोड़ रुपये</strong> की उर्वरक सब्सिडी को मंजूरी दी है।</li>\r\n\t<li>पैकेज में यूरिया के लिए <strong>70,000 करोड़ रुपये और डाई-अमोनियम फॉस्फेट या DAP के लिए 38,000 करोड़ रुपये</strong> शामिल हैं।</li>\r\n\t<li>कुल सब्सिडी राशि पिछले वर्ष की तुलना में कम है लेकिन अभी भी सामान्य से अधिक है।</li>\r\n\t<li>सरकार ने सुनिश्चित किया है कि बढ़ती वैश्विक उर्वरक कीमतों से भारत के किसानों को नुकसान न हो।</li>\r\n\t<li><strong>अप्रैल-सितंबर के खरीफ ऋतु के लिए 1.08 लाख करोड़ रुपये</strong> की घटी हुई उर्वरक सब्सिडी से किसानों के लिए कीमतों में बढ़ोतरी नहीं होगी।</li>\r\n\t<li>पैकेज से देश के 120 मिलियन से अधिक किसानों को लाभ होने की उम्मीद है।</li>\r\n\t<li>सरकार किसानों को उत्पादन और उत्पादकता बढ़ाने में मदद करने के लिए किफायती उर्वरक उपलब्ध कराने के लिए प्रतिबद्ध है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Consumer Protection Act proposes to give the Consumer Protection against</p>", "option1": "\r\n<p>Highly priced substandard goods</p>", "option2": "\r\n<p>Cheating by selling substandard goods</p>", "option3": "\r\n<p>Not getting one&#39;s money&#39;s worth</p>", "option4": "\r\n<p>Denial of relief if the product is not up to the mark</p>", "answer": "3", "negative_marking": "1.00", "po
