र बैठे हैं; उनमें से चार कोनों पर बैठे हैं, जबकि चार भुजाओं के बीच में बैठे हैं। कोनों पर बैठने वाले </span>केंद्रोन्मुख <span>हैं, जबकि भुजाओं के बीच में बैठने वाले बाहर की ओर सम्मुख है। </span></p>\r\n\r\n<p>1. <span>F, D के बाएं चौथे स्थान पर बैठा है। D बाहर की ओर सम्मुख है।</span></p>\r\n\r\n<p>2. <span>C, F के निकटतम दाएं बैठा है। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990576_1742990576743064_thump.png\" style=\"width: 151px; height: 176px;\" /></figure>\r\n\r\n<p>3. <span>E, B के निकटतम दाएं और F के निकटतम बाएं बैठा है। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990601_1742990601667355_thump.png\" style=\"width: 150px; height: 162px;\" /></figure>\r\n\r\n<p>4. <span>H, E के दाएं दूसरे स्थान पर बैठा है। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990668_1742990668111537_thump.png\" style=\"width: 150px; height: 161px;\" /></figure>\r\n\r\n<p>5. <span>A, H के दाएं तीसरे स्थान पर बैठा है। </span></p>\r\n\r\n<p>6. <span>G और B के बीच केवल दो व्यक्ति बैठे हैं।</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990694_1742990694343245_thump.png\" style=\"width: 150px; height: 156px;\" /></figure>\r\n\r\n<p>स्पष्ट रूप से, D के बाएं से दूसरे स्थान पर <span>A</span> है।</p>\r\n\r\n<p>अतः सही उत्तर <strong>&#39;बाएं से दूसरा&#39;</strong> है।</p>", "question_heading": ""}, {"sr_no": 43, "question": "\r\n<div>यदि ABCD एक आयत दिखाया गया है, तो\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990769_1742990769733959_thump.png\" style=\"width: 200px; height: 140px;\" /></figure>\r\n</div>", "option1": "\r\n<p>x = 10, y = 2</p>", "option2": "\r\n<p>x = 12, y = 8</p>", "option3": "\r\n<p>x = 2, y = 10</p>", "option4": "\r\n<p>x = 20, y = 0</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त अवधारणा:-</strong></p>\r\n\r\n<p>एक आयत 4 भुजाओं वाले बंद आकार का बहुभुज होता है जिसमें विपरीत भुजाएँ माप में समान होती हैं।</p>\r\n\r\n<p><strong>व्याख्या:-</strong></p>\r\n\r\n<p>दिया है कि ABCD एक आयत है। इस आयत की भुजाएँ हैं,</p>\r\n\r\n<p>&rArr; AB = 12</p>\r\n\r\n<p><span>&rArr; BC = 8</span></p>\r\n\r\n<p><span>&rArr; CD = x + y</span></p>\r\n\r\n<p><span>&rArr; AD = x - y</span></p>\r\n\r\n<p>अब, जैसा कि हम जानते हैं कि एक आयत में सम्मुख भुजाएँ बराबर होती हैं। इस प्रकार,</p>\r\n\r\n<p><span>&rArr; CD = AB</span></p>\r\n\r\n<p><span>&rArr; x + y = 12       ....(1)</span></p>\r\n\r\n<p><span>साथ ही,</span></p>\r\n\r\n<p>&rArr; AD = BC</p>\r\n\r\n<p>&rArr; x - y = 8       ....(2)</p>\r\n\r\n<p>समीकरण (1) और (2) दोनों को जोड़ने पर,</p>\r\n\r\n<p><span>&rArr; (x +  y) + (x - y) =  12 + 8</span></p>\r\n\r\n<p><span>&rArr; 2</span>x = 20 </p>\r\n\r\n<p><span>&rArr; x = 20 / 2</span></p>\r\n\r\n<p><span>&rArr; x = 10  </span></p>\r\n\r\n<p>x का यह मान समीकरण (1) में रखने पर<span>,</span></p>\r\n\r\n<p><span>&rArr; (10) + y = 12 </span></p>\r\n\r\n<p>&rArr;  y = 12 - 10</p>\r\n\r\n<p>&rArr; y = 2 </p>\r\n\r\n<p>इसलिए, अभीष्ट मान x = 10 और y = 2 हैं।</p>\r\n\r\n<p><strong>अतः, सही विकल्प 1 है।</strong></p>", "question_heading": ""}, {"sr_no": 44, "question": "\r\n\r\n<p>दिए गए संयोजन का सही दर्पण प्रतिबिंब का चयन कीजिए जब दर्पण को दर्शाए अनुसार &#39;PQ&#39; पर रखा जाता है।</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991076_1742991076236961_thump.png\" style=\"width: 180px; height: 101px;\" /></p>", "option1": "\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990989_1742990989704463_thump.png\" style=\"width: 150px; height: 22px;\" /></p>", "option2": "\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991050_1742991050359381_thump.png\" style=\"width: 150px; height: 22px;\" /></p>", "option3": "\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990902_1742990902472648_thump.png\" style=\"width: 170px; height: 24px;\" /></p>", "option4": "\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990956_1742990956274978_thump.png\" style=\"width: 150px; height: 21px;\" /></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>दी गई आकृति की सही दर्पण प्रतिबिंब जब दर्पण को दाईं ओर रखा जाता है:</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990874_1742990874822081_thump.png\" style=\"width: 200px; height: 62px;\" /></p>\r\n\r\n<p>अतः, सही उत्तर &quot;विकल्प (2)&quot; है।</p>\r\n\r\n<p>दर्पण प्रतिबिंब में <strong>बायां पक्ष और दायां पक्ष आपस में बदल जाता है लेकिन ऊपर और नीचे समान रहता है।</strong></p>\r\n\r\n<p><strong>किसी वस्तु का जल में परावर्तन उसका जल प्रतिबिम्ब है।</strong> यह किसी वस्तु को <strong>उर्ध्वाधर अर्थात् उल्टा करके</strong> प्रकट होता है।</p>\r\n\r\n<p>यदि दर्पण प्रतिबिंब <strong>नीचे क्षैतिज रूप से </strong>है तो आकृति का जल प्रतिबिम्ब आकृति के दर्पण प्रतिबिम्ब जैसा दिखता है।</p>\r\n\r\n<p><strong>जल का प्रतिबिंब सिर्फ एक ऐसा प्रतिबिम्ब है जहां </strong>प्रतिबिंब<strong> के ऊपर और नीचे के हिस्से बदल जाते हैं तथा प्रतिबिंब के बाएं और दाएं हिस्से समान रहते हैं।</strong></p>", "question_heading": ""}, {"sr_no": 45, "question": "<p>दिए गए कथन और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्य रूप से ज्ञात तथ्यों से भिन्न प्रतीत होती हो, दिए गए कथन के आधार पर तय कीजिए कि कौन सा निष्कर्ष सत्य है : </p><p><strong>कथन :</strong> P ≥ Q = Z ≤ S = M > N</p><p><strong>निष्कर्ष :</strong></p><p>I. P <span>≥ Z </span></p><p><span>II. P < S</span></p>", "option1": "<p>I और II दोनों सत्य हैं</p>", "option2": "<p>न तो I और न ही II सत्य है</p>", "option3": "<p>केवल I सत्य है</p>", "option4": "<p>केवल II सत्य है</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<div><p>दिया गया कथन है: P ≥ Q = Z ≤ S = M > N </p><p><strong>निष्कर्ष :</strong></p><p>I. P ≥ Z → सत्य है (जैसा कि P ≥ Q = Z दिया गया है; जैसे P ≥ Q और Q = Z इसलिए P ≥ Z सत्य है)।</p><p>II. P < S → असत्य है (जैसा कि P ≥ Q = Z ≤ S या तो P ≤ S या P ≥ S देता है और P और S के बीच कोई निश्चित संबंध निर्धारित नहीं किया जा सकता है)।</p> अतः सही उत्तर<strong> \"केवल I सत्य है\" </strong>है।</div>", "question_heading": ""}, {"sr_no": 46, "question": "<p>संख्या <span class=\"math-tex\">\\(\\sqrt{0.0001}\\)</span>, _____ है। </p>", "option1": "<p>0.01 से छोटी एक परिमेय संख्या</p>", "option2": "<p>एक परिमेय संख्या</p>", "option3": "<p>एक अपरिमेय संख्या</p>", "option4": "<p>न तो एक परिमेय संख्या न ही अपरिमेय संख्या</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>संकल्पना:</strong></p><div><span><strong>अपरिमेय संख्या:</strong> एक अपरिमेय संख्या एक प्रकार की वास्तविक संख्या होती है, जिसे साधारण भिन्न के रूप में नहीं दर्शाया जा सकता है।</span></div><div></div><div><span><strong>परिमेय संख्या:</strong> परिमेय संख्या अंकगणित में, एक संख्या है जिसे दो पूर्णांकों के भागफल p/q के रूप में इस प्रकार दर्शाया जा सकता है कि q</span> ≠ 0</div><p><strong>व्याख्या:</strong></p><p>⇒ <span class=\"math-tex\">\\(\\sqrt{0.0001}\\ =\\ \\sqrt{\\frac{1}{10000}}\\)</span></p><p>⇒ <span class=\"math-tex\">\\(\\sqrt{\\frac{1}{10000}}\\ =\\ \\frac{1}{100}\\)</span>, <span>जो एक परिमेय संख्या है।</span></p><p><strong>∴ <span class=\"math-tex\">\\(\\sqrt{0.0001}\\)</span><span>एक परिमेय संख्या है।</span></strong></p>", "question_heading": ""}, {"sr_no": 47, "question": "<p>तीन संख्याएँ <span>3 &ratio; 2 &ratio; 5</span> के अनुपात में हैं और उनके वर्गों का योग 1862 है l वे संख्याएँ क्या हैं? </p>", "option1": "<p>24, 16 और 40 </p>", "option2": "<p>15, 10 और 25 </p>", "option3": "<p>12, 8 और 20 </p>", "option4": "<p>21, 14 और 35</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>दिया गया है:</strong></p><p>तीन संख्याओं का अनुपात 3 : 2 : 5 है। </p><p>उनके वर्गों का योग 1862 के बराबर है।</p><p><strong>प्रयुक्त अवधारणा:</strong></p><p>अनुपात का गुणधर्म।</p><p><strong>गणना:</strong></p><p>माना, तीन संख्याएँ 3x : 2x : 5x हैं। </p><p>इसलिए,</p><p>(3x)<sup>2</sup> + (2x)<sup>2</sup> + (5x)<sup>2</sup> = 1862</p><p>⇒ 9x<sup>2</sup> + 4x<sup>2</sup> + 25x<sup>2</sup> = 1862</p><p><span>⇒ 38 x</span><sup>2  = 1862</sup></p><p>⇒ x<sup>2</sup> = 1862/38</p><p><span>⇒ x</span><sup>2  = 49</sup></p><p>⇒ x = √49 = 7</p><p>इसलिए, संख्याएँ हैं: 3 × 7 = 21, 2 × 7 = 14, और 5 × 7 = 35</p><p>∴<strong> संख्याएँ 21, 14 और 35 हैं।</strong></p>", "question_heading": ""}, {"sr_no": 48, "question": "<span class=\"math-tex\">\\(\\frac{\\sin 18^{\\circ}}{\\cos 72^{\\circ}}+\\frac{\\tan 26^{\\circ}}{\\cot 64^{\\circ}}=\\)</span>", "option1": "<p>3/2</p>", "option2": "<p>2/3</p>", "option3": "<p>2</p>", "option4": "<p>1</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>प्रयुक्त सूत्र:</strong></p><p>sin (90° - θ) = cos θ </p><p>tan (90° - θ) = cot θ </p><p><strong>गणना:</strong></p><p><span class=\"math-tex\">\\(\\frac{\\sin 18^{\\circ}}{\\cos 72^{\\circ}}+\\frac{\\tan 26^{\\circ}}{\\cot 64^{\\circ}}\\)</span></p><p>⇒ <span class=\"math-tex\">\\(\\frac{\\sin (90^{\\circ} - 72^{\\circ})}{\\cos 72^{\\circ}}+\\frac{\\tan(90^{\\circ}- 64^{\\circ})}{\\cot 64^{\\circ}}\\)</span></p><p>उपरोक्त सूत्र का प्रयोग करके</p><p>⇒<span class=\"math-tex\">\\(\\frac{\\cos 72^{\\circ}}{\\cos 72^{\\circ}}+\\frac{cot\\ 64^{\\circ}}{\\cot 64^{\\circ}}\\)</span></p><p>⇒ 1 + 1  </p><p>∴ <span class=\"math-tex\">\\(\\frac{\\sin 18^{\\circ}}{\\cos 72^{\\circ}}+\\frac{\\tan 26^{\\circ}}{\\cot 64^{\\circ}}\\)</span> = 2</p>", "question_heading": ""}, {"sr_no": 49, "question": "<p>यदि अमन किसी कार्य को अकेले 5 दिनों में कर सकता है, सागर अकेले कार्य को 10 दिनों में कर सकता है और सतीश अकेले कार्य को 15 दिनों में कर सकता है, तो ऐसे 11 कार्यों को पूरा करने में उन्हें कितने दिन लगेंगे?</p>", "option1": "<p>27 दिन</p>", "option2": "<p>29 दिन</p>", "option3": "<p>30 दिन</p>", "option4": "<p>28 दिन</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>दिया गया है:</strong></p><p>अमन द्वारा किसी कार्य को <span>अकेले </span>करने में लगने वाला समय = 5 दिन</p><p>सागर द्वारा किसी <span>कार्य </span>को <span>अकेले </span>करने में <span>लगने वाला  समय</span> = 10 दिन</p><p>सतीश द्वारा किसी <span>कार्य </span>को <span>अकेले </span>करने में <span>लगने वाला  समय</span> = 15 दिन</p><p><strong>प्रयुक्त अवधारणा:</strong></p><p>कार्य = दक्षता × समय</p><p><strong>गणना:</strong></p><p>5, 10 और 15 का लघुत्तम समापवर्त्य 30 है।</p><p>अमन की दक्षता = (30/5) = 6 इकाई/दिन</p><p>सागर की <span>दक्षता </span>= (30/10) = 3 <span>इकाई</span>/दिन</p><p>सतीश की <span>दक्षता </span>= (30/15) = 2 <span>इकाई</span>/दिन</p><p>अब, ऐसे 11 कार्यों को पूरा करने में लगने वाला समय</p><p>⇒ [<span class=\"math-tex\">\\(\\frac{30}{{(6+3+2}}\\)</span>× 11]</p><p>⇒ (<span class=\"math-tex\">\\(\\frac{30}{{11}}\\)</span> × 11) = 30 दिन</p><p><strong>∴ अभीष्ट समय 30 दिन है।</strong></p>", "question_heading": ""}, {"sr_no": 50, "question": "\r\n<p>एक कूट भाषा में, &#39;<span>CARPETS</span>&#39; को &#39;<span>7-107</span>&#39; और &#39;<span>DRIVE</span>&#39; को &#39;<span>5-77</span>&#39; के रूप में लिखा जाता है। उस भाषा में &#39;<span>GOLDEN</span>&#39; को कैसे लिखा जाएगा?</p>", "option1": "\r\n<p>6-78</p>", "option2": "\r\n<p>6-105</p>", "option3": "\r\n<p>6-108</p>", "option4": "\r\n<p>6-57</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991197_1742991197214068_thump.png\" style=\"width: 400px; height: 95px;\" /></figure>\r\n\r\n<p>यहाँ अनुसरण किया गया तर्क है :-</p>\r\n\r\n<p><span>दिए गए शब्द को &quot;X-Y&quot; के रूप में कूटबद्ध किया गया है।</span></p>\r\n\r\n<p><span>X = एक शब्द में अक्षरों की संख्या।</span></p>\r\n\r\n<p><span>Y = किसी शब्द के विपरीत वर्णमाला स्थितीय मान  वाले अक्षरों का योग।</span></p>\r\n\r\n<p>&#39;CARPETS&#39; को &#39;7-107&#39; के रूप में लिखा जाता है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991414_1742991414811129_thump.png\" style=\"width: 200px; height: 173px;\" /></figure>\r\n\r\n<p>शब्द <strong>&#39;CARPETS&#39;</strong> में अक्षरों की संख्या<span> = 7</span></p>\r\n\r\n<p>विपरीत वर्ण<span>माला</span> स्थितीय अक्षरों का योग = 24 + 26 + 9 + 11 + 22 + 7 + 8</p>\r\n\r\n<p>विपरीत वर्ण<span>माला</span> स्थितीय अक्षरों का योग <span>= 107</span></p>\r\n\r\n<p><span>और</span></p>\r\n\r\n<p>&#39;DRIVE&#39; को &#39;5-77&#39; के रूप में लिखा जाता है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991438_1742991438226902_thump.png\" style=\"width: 200px; height: 227px;\" /></figure>\r\n\r\n<p>शब्द <span>&#39;DRIVE&#39;</span> में अक्षरों की संख्या<span> = 5</span></p>\r\n\r\n<p><span>विपरीत वर्णमाला स्थितीय अक्षरों का योग</span> = 23 + 9 + 18 + 5 + 22</p>\r\n\r\n<p>विपरीत वर्ण<span>माला</span> स्थितीय अक्षरों का योग <span>= 77</span></p>\r\n\r\n<p><span>इसी तरह,</span></p>\r\n\r\n<p><span>&#39;GOLDEN&#39; को लिखा जायेगा :</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991504_1742991504451380_thump.png\" style=\"width: 200px; height: 197px;\" /></figure>\r\n\r\n<p><span>शब्द  &#39;GOLDEN&#39;  में अक्षरों की संख्या = 6</span></p>\r\n\r\n<p><span>विपरीत वर्णमाला स्थितीय अक्षरों का योग</span> = 20 + 12 + 15 + 23 + 22 + 13</p>\r\n\r\n<p>विपरीत वर्ण<span>माला</span> स्थितीय अक्षरों का योग <span>= 105</span></p>\r\n\r\n<p>&there4; यहाँ &#39;GOLDEN&#39; को &#39;6-105&#39; के रूप में लिखा जाता है।</p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;6-105&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 51, "question": "\r\n<p>30 पंखों का विक्रय मूल्य, 25 पंखों के क्रय मूल्य के बराबर है। प्रतिशत में <span>लाभ अथवा हानि</span> कितनी है?</p>", "option1": "\r\n<p>16<span>\\(\\frac{2}{3}\\)</span>% लाभ</p>", "option2": "\r\n<p>15% हानि</p>", "option3": "\r\n<p>16<span>\\(\\frac{2}{3}\\)</span>% हानि</p>", "option4": "\r\n<p>न हानि, न लाभ</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया है:</span></p>\r\n\r\n<p><span>30 पंखों का विक्रय मूल्य, 25 पंखों के क्रय मूल्य के बराबर है।</span></p>\r\n\r\n<p><span>प्रयुक्त सूत्र:</span></p>\r\n\r\n<p>लाभ = विक्रय मूल्य - क्रय मूल्य</p>\r\n\r\n<p>लाभ प्रतिशत = (लाभ / क्रय मूल्य) x 100</p>\r\n\r\n<p>हानि = क्रय मूल्य - विक्रय मूल्य</p>\r\n\r\n<p>हानि प्रतिशत = (हानि / क्रय मूल्य) x 100</p>\r\n\r\n<p><strong>गणना<span>:</span></strong></p>\r\n\r\n<p>1 पंखे का क्रय मूल्य x है। </p>\r\n\r\n<p>इसलिए, 25 पंखों का क्रय मूल्य = 25x</p>\r\n\r\n<p>और 30 पंखों का विक्रय मूल्य = 25 <span>पंखों का क्रय मूल्य</span> = 25x</p>\r\n\r\n<p>इसलिए, 30 पंखों पर हानि = 30 पंखों का क्रय मूल्य  - 30 पंखों का विक्रय मूल्य  </p>\r\n\r\n<p>&rArr; 30x - 25x = 5x.</p>\r\n\r\n<p>हानि प्रतिशत = हानि प्रतिशत = (हानि / क्रय मूल्य) x 100</p>\r\n\r\n<p>&rArr; (5x/30x) x 100 = 16.67%. = 16<span class=\"math-tex\">\\(\\frac{2}{3}\\)</span>%</p>\r\n\r\n<p><span>इसलिए, 30 पंखों के विक्रय पर 6<span class=\"math-tex\">\\(\\frac{2}{3}\\)</span>% की हानि होती है। </span></p>", "question_heading": ""}, {"sr_no": 52, "question": "\r\n<p>बच्चे के जन्म के समय पति-पत्नी की औसत आयु 30 वर्ष है। बच्चे के जन्म के 3 वर्ष बाद परिवार की औसत आयु और बच्चे के जन्म के समय पति-पत्नी की औसत आयु के बीच कितना अंतर है?</p>", "option1": "\r\n<p>3</p>", "option2": "\r\n<p>10</p>", "option3": "\r\n<p>17</p>", "option4": "\r\n<p>7</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>एक बच्चे के जन्म के समय पति और पत्नी की औसत आयु = 30 वर्ष</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>औसत = प्रेक्षणों का योग / प्रेक्षणों की संख्या</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>प्रश्नानुसार,</p>\r\n\r\n<p>बच्चे के जन्म के समय पति और पत्नी की औसत आयु</p>\r\n\r\n<p>&rArr; <span>A 1  </span>= 30------(1)</p>\r\n\r\n<p><strong>पति और पत्नी की कुल आयु = 60 वर्ष</strong></p>\r\n\r\n<p><span>बच्चे के जन्म के 3 वर्ष बाद</span></p>\r\n\r\n<p>परिवार की कुल <span>आयु </span>= पति की <span>आयु </span>+ 3 + पत्नी की <span>आयु </span>+ 3 + 3</p>\r\n\r\n<p><span>परिवार की कुल आयु = 60 + 3 + 3 + 3 = 69</span></p>\r\n\r\n<p><span>परिवार की नई औसत आयु</span></p>\r\n\r\n<p><span>A 2  = 69/3 = 23         -----(2)</span></p>\r\n\r\n<p><span>इसलिए, अभीष्ट अंतर</span></p>\r\n\r\n<p><span>A 2  - A 1 = |23 - 30| = 7 वर्ष   (∵ आयु ऋणात्मक नहीं हो सकती है)</span></p>\r\n\r\n<p><strong>&there4; परिवार की औसत आयु का अभीष्ट अंतर 7 वर्ष है।</strong></p>", "question_heading": ""}, {"sr_no": 53, "question": "\r\n\r\n<p>एक डिब्बे में 5 लाल गेंदें और 8 नीली गेंदें हैं। यदि डिब्बे में से एक गेंद यादृच्छिक रूप से चयन किया जाता है, तो इसके लाल रंग के होने की क्या प्रायिकता है?</p>", "option1": "\r\n\r\n<p>8/13</p>", "option2": "\r\n\r\n<p>5/8</p>", "option3": "\r\n\r\n<p>5/18</p>", "option4": "\r\n\r\n<p>5/13</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <strong>5/13</strong> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>किसी घटना के घटित होने की प्रायिकता</strong> उस घटना के घटित होने के पद्धति की संख्या है, जिसे संभावित परिणामों की संख्या से विभाजित किया जाता है।</li>\r\n\t<li><strong>चरण:</strong>\r\n\t<ul>\r\n\t\t<li>डिब्बे से एक लाल गेंद चुनने की प्रायिकता ज्ञात करना</li>\r\n\t\t<li>डिब्बे में लाल गेंदों की संख्या गिनें और डिब्बे में गेंदों की कुल संख्या से विभाजित करें।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>इस समस्या में, कुल 13 गेंदों में से 5 लाल गेंदें हैं</li>\r\n\t<li>इसलिए लाल गेंद चुनने की प्रायिकता 5/13 है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 54, "question": "\r\n<div>&Delta;STU में, SE और TF माध्यिकाएँ एक दूसरे को O पर प्रतिच्छेद करती हैं। यदि UT = 34 सेमी, TF = 22.5 सेमी और SE = 24 सेमी है, तो &ang;TOE का मान कितना होगा?</div>", "option1": "\r\n<p><span>75 </span>डिग्री</p>", "option2": "\r\n<p><span>60 </span>डिग्री</p>", "option3": "\r\n<p><span>45 डिग्री</span></p>", "option4": "\r\n<p><span>90 </span>डिग्री</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया है:</span></p>\r\n\r\n<p>&Delta;STU में, SE और TF माध्यिकाएँ हैं जो एक दूसरे को O पर प्रतिच्छेद करती हैं।</p>\r\n\r\n<p><span>UT</span> = 34 सेमी, <span>TF </span>= 22.5 सेमी और <span>SE </span>= 24 सेमी</p>\r\n\r\n<p><span>प्रयुक्त अवधारणा:</span></p>\r\n\r\n<p>1. एक त्रिभुज की माध्यिकाएँ एक दूसरे को 2 : 1 के अनुपात में विभाजित करती हैं।</p>\r\n\r\n<p>2. पाइथागोरस प्रमेय: आधार<sup>2</sup> + लम्ब<sup>2</sup> = कर्ण<sup>2</sup></p>\r\n\r\n<p>3. <span>पाइथागोरस प्रमेय केवल समकोण त्रिभुजों पर लागू होता है।</span></p>\r\n\r\n<p><span>प्रश्नानुसार</span>,</p>\r\n\r\n<p>चूँकि, SE माध्यिका है, TE = EU = 34/2 = 17 सेमी</p>\r\n\r\n<p>अवधारणा के अनुसार,</p>\r\n\r\n<p>TO : OF = SO : OE = 2 : 1</p>\r\n\r\n<p>इस प्रकार,</p>\r\n\r\n<p>TO = 22.5 &times; 2/(2 + 1) = 15 सेमी</p>\r\n\r\n<p><span>OE = 24 &times; 1/(2 + 1) = 8 </span>सेमी</p>\r\n\r\n<p><span>&Delta;TOE में, TO = 15 सेमी, OE = 8 सेमी, तथा TE = 17 सेमी</span></p>\r\n\r\n<p>जैसा कि हम देख सकते हैं,<span> TO</span><sup>2  + OE</sup><sup>2  = TE</sup><sup>2</sup></p>\r\n\r\n<p>इसलिए, <span>&Delta;TOE, O पर एक समकोण त्रिभुज है। </span></p>\r\n\r\n<p><span>अब, </span>&ang;TOE <span>का मान </span>= 90&deg; </p>\r\n\r\n<p><strong><strong>&there4; </strong><span>&ang;TOE का मान 90&deg; है।</span></strong></p>", "question_heading": ""}, {"sr_no": 55, "question": "\r\n<p><span>वस्तुओं की बिक्री के लिए क्रय मूल्य से कितना अधिक मूल्य अंकित किया जाना चाहिए, ताकि 20% की व्यापार छूट और 6 \\(\\frac{1}{4}\\) % की </span>नकद<span> छूट देने के बाद, क्रय मूल्य पर 20% का कुल लाभ अर्जित हो सके?</span></p>", "option1": "\r\n<p>क्रय मूल्य <span>से 60% अथिक</span></p>", "option2": "\r\n<p>क्रय मूल्य <span>से 40% अधिक</span></p>", "option3": "\r\n<p>क्रय मूल्य <span>से 50% अधिक</span></p>", "option4": "\r\n<p>क्रय मूल्य से 55% अधिक</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त सूत्र:-</strong></p>\r\n\r\n<p>प्रतिशत मात्राओं की तुलना करने का एक तरीका है। मान लीजिए, y का x% <span>संख्या 20 </span>है। फिर, x और y के बीच संबंध को समीकरण के रूप में दिया जाता है,</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\dfrac{x}{100}\\times y=20\\)</span></p>\r\n\r\n<p><strong>व्याख्या:-</strong></p>\r\n\r\n<p>मान लीजिए, वस्तु का क्रय मूल्य = 100 <span>रुपये</span></p>\r\n\r\n<p>साथ ही, माना अंकित मूल्य = x <span>रुपये</span></p>\r\n\r\n<p>अब, चूँकि <span>कुल</span> लाभ, क्रय मूल्य का 20% है। तो, विक्रय मूल्य (SP),</p>\r\n\r\n<p>&rArr; विक्रय मूल्य = क्रय मूल्य + लाभ</p>\r\n\r\n<p><span>&rArr; SP = 100 + (100 का 20%)</span></p>\r\n\r\n<p><span>&rArr; SP = 100 + (20 &times; 100) / 100</span></p>\r\n\r\n<p><span>&rArr; SP  = 100 + 20</span></p>\r\n\r\n<p><span>&rArr; SP  = 120 रुपये </span></p>\r\n\r\n<p>अब, यह देखते हुए कि व्यापार छूट 20% है और नकद छूट 6<span>6 \\(\\frac{1}{4}\\) %</span> है। तो, अंकित मूल्य (MP) का (100- 6)% का (100 - 20)%, विक्रय मूल्य के बराबर होगा।</p>\r\n\r\n<p><span>&rArr; x का (100 - 20)% का (100 - 6 \\(\\frac{1}{4}\\) )% = 120</span></p>\r\n\r\n<p><span>&rArr; x का (80)% का (100 -  \\(\\frac{25}{4}\\) )% = 120</span></p>\r\n\r\n<p><span>&rArr;  \\(\\dfrac{375}{4}\\times \\dfrac{1}{100}\\times \\dfrac{80}{100}x=120\\)</span></p>\r\n\r\n<p>इसे आगे हल करने पर, हमें प्राप्त होता है,</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\begin{aligned} &amp; \\Rightarrow \\frac{3}{4} x=120 \\\\ &amp; \\Rightarrow x=\\frac{120 \\times 4}{3}\\\\ &amp; \\Rightarrow x=160 \\end{aligned}\\)</span></p>\r\n\r\n<p>चूँकि, 160, <span>100 से 60% </span>अधिक है। इसलिए,</p>\r\n\r\n<p>&rArr; अंकित मूल्य = क्रय मूल्य + (क्रय मूल्य का 60%)</p>\r\n\r\n<p>इसलिए, वस्तु का क्रय मूल्य 60% अधिक अंकित किया जाना चाहिए।</p>\r\n\r\n<p>अतः, सही विकल्प 1 है।</p>", "question_heading": ""}, {"sr_no": 56, "question": "\r\n<div>\r\n<p>निम्नलिखित जानकारी का ध्यानपूर्वक अध्ययन कीजिये और दिए गये प्रश्नों के उत्तर दीजिये।</p>\r\n\r\n<p>&#39;A $ B&#39; का अर्थ है &#39;A, B का बेटा है&#39;, &#39;A # B&#39; का अर्थ है &#39;A, B का पिता है&#39;, &#39;A @ B&#39; का अर्थ है &#39;A, B की बेटी है&rsquo; और &lsquo;A + B&#39; अर्थ है &#39;A, B की माँ है&#39;।</p>\r\nयदि (P + K @ V $ L # X) है, तो परिवार में सबसे बड़ा सदस्य कौन है?</div>", "option1": "\r\n<p>P</p>", "option2": "\r\n<p>K</p>", "option3": "\r\n<p>L</p>", "option4": "\r\n<p>X</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>पांच सदस्य: P, K, V, L, X</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>कूट</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>$</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>#</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>@</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>अर्थ</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>बेटा</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>पिता</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>बेटी</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>माँ</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p> </p>\r\n\r\n<p>दिया गया समीकरण: P + K @ V $ L # X</p>\r\n\r\n<p>इसका तात्पर्य है कि P, K की माँ है, K, V की बेटी है, V, L का बेटा है और L, X का पिता है</p>\r\n\r\n<p>निम्नलिखित प्रतीकों का उपयोग करके वंश-वृक्ष को तैयार करने पर:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991755_1742991755446596_thump.png\" style=\"width: 160px; height: 215px;\" /></figure>\r\n\r\n<p>इसलिए यह वंश-वृक्ष प्राप्त होता है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991777_1742991777343590_thump.png\" style=\"width: 160px; height: 184px;\" /></figure>\r\n\r\n<p>अतः L परिवार का सबसे बड़ा सदस्य है।</p>", "question_heading": ""}, {"sr_no": 57, "question": "\r\n<p>दिए गए <span>स्वरूप</span> का ध्यानपूर्वक अध्ययन करें और उस संख्या का चयन करें जो उसमें प्रश्नवाचक चिह्न (?) प्रतिस्थापित कर सकता है।</p>\r\n\r\n<p><span>(15, 5, 150) (16, 4, 128) (7, 7, 98) (11, 4, ?)</span></p>", "option1": "\r\n<p>88</p>", "option2": "\r\n<p>102</p>", "option3": "\r\n<p>132</p>", "option4": "\r\n<p>78</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया स्वरूप है:</p>\r\n\r\n<p><strong>(पहली संख्या &times; दूसरी संख्या) &times; 2 = तीसरी संख्या</strong></p>\r\n\r\n<ul>\r\n\t<li>(15, 5, 150)</li>\r\n</ul>\r\n\r\n<p>          &rArr; <span>(</span><u><span>15 &times; 5</span></u><span>)</span> &times; 2 = 150</p>\r\n\r\n<p>          &rArr;  75 &times; 2 = 150</p>\r\n\r\n<p>          &rArr; <span>150 = 150</span></p>\r\n\r\n<ul>\r\n\t<li>(16, 4, 128)</li>\r\n</ul>\r\n\r\n<p>          &rArr; <span>(</span><u><span>16 &times; 4</span></u><span>)</span> &times; 2 = 128</p>\r\n\r\n<p>          &rArr; 64 &times; 2 = 128</p>\r\n\r\n<p>          &rArr; <span>128 = 128</span></p>\r\n\r\n<ul>\r\n\t<li>(7, 7, 98)</li>\r\n</ul>\r\n\r\n<p>          &rArr; <span>(<u>7 &times; 7</u>)</span> &times; 2 = 98</p>\r\n\r\n<p>          &rArr; 49 &times; 2 = 98</p>\r\n\r\n<p>          &rArr; <span>98 = 98</span></p>\r\n\r\n<ul>\r\n\t<li><span>(11, 4, ?)</span></li>\r\n</ul>\r\n\r\n<p><span>          &rArr; (<u>11 &times; 4</u>) </span>&times; 2 = ?</p>\r\n\r\n<p>          &rArr; 44 &times; 2 = ?</p>\r\n\r\n<p>          &rArr; <span>88</span></p>\r\n\r\n<p>प्रश्नवाचक <span>चिह्न </span>को प्रतिस्थापित करने वाली संख्या &#39;<strong>88</strong>&#39; है<span>।</span></p>\r\n\r\n<p>अत:, सही उत्तर &#39;<strong>88</strong>&#39; है<span>।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": "\r\n<p>चार अक्षर समूह दिए गए हैं जिनमें से तीन किसी न किसी रूप में एक जैसे हैं जबकि एक भिन्न है। तब विषम का चयन कीजिए।</p>", "option1": "\r\n<p>LPR</p>", "option2": "\r\n<p>DHJ</p>", "option3": "\r\n<p>INP</p>", "option4": "\r\n<p>CGI</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991887_1742991887617465_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p>यहाँ अनुसरित तर्क इस प्रकार है:</p>\r\n\r\n<div>1)\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991912_1742991912725777_thump.png\" style=\"width: 100px; height: 54px;\" /></figure>\r\n</div>\r\n\r\n<div>2) \r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742991976_1742991976634034_thump.png\" style=\"width: 100px; height: 53px;\" /></figure>\r\n</div>\r\n\r\n<div>3) \r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742992038_1742992038630229_thump.png\" style=\"width: 100px; height: 54px;\" /></figure>\r\n</div>\r\n\r\n<div>4) \r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742992101_1742992101600328_thump.png\" style=\"width: 100px; height: 53px;\" /></figure>\r\n</div>\r\n\r\n<p>यह <strong>&quot;INP&quot;</strong> को विषम के रूप में दिखाता है।</p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;INP&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 59, "question": "\r\n\r\n<p>एक शर्ट जिसका सूचीबद्ध मूल्य 150 रुपये है दो उत्तरोत्तर छूटों के बाद 105  रुपये पर उपलब्ध है। यदि दूसरी छूट 12.5% है, तो पहली छूट ज्ञात कीजिए। </p>", "option1": "\r\n\r\n<p>15%</p>", "option2": "\r\n\r\n<p>20%</p>", "option3": "\r\n\r\n<p>25%</p>", "option4": "\r\n\r\n<p>17%</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>हल:</strong><br />\r\nमाना पहली छूट x% है।</p>\r\n\r\n<p>पहली छूट के बाद, शर्ट का मूल्य = 150 का (100 - x)%</p>\r\n\r\n<p>दूसरी छूट के बाद, शर्ट का मूल्य = [(100 - x)% 150] का (100-12.5)%</p>\r\n\r\n<p>दिया गया है कि दोनों छूट के बाद शर्ट का मूल्य = 105 रुपये</p>\r\n\r\n<p>इसलिए, हम निम्न समीकरण बना सकते हैं:</p>\r\n\r\n<p>87.5/100 &times; [(100 - x)/100 &times; 150] = 105</p>\r\n\r\n<p>&rArr; 875/1000 &times;(100-x)&times;3/2 = 105</p>\r\n\r\n<p>&rArr; 175/200 &times;(100-x) = 70</p>\r\n\r\n<p>&rArr; 100-x = 70&times;200/175</p>\r\n\r\n<p>&rArr; 100-x = 80</p>\r\n\r\n<p>&rArr; x = 20</p>\r\n\r\n<p>इस समीकरण को हल करने पर हमें x = 20% प्राप्त होता है।</p>\r\n\r\n<p><strong>अतः, पहली छूट 20% थी।</strong></p>\r\n\r\n<p>आइए पहली छूट को x% के रूप में निरूपित करें।</p>\r\n\r\n<p>हम जानते हैं कि दोनों छूटों के बाद शर्ट का मूल्य 105 रुपये है।</p>\r\n\r\n<p>तो हम निम्नलिखित समीकरण स्थापित कर सकते हैं और x के लिए हल कर सकते हैं:</p>\r\n\r\n<p>150(100 - x)/100(100 - 12.5) / 100 = 105.</p>\r\n\r\n<p>&rArr; 150 &times; (100 - x) &times; 0.875 = 105 &times; 100</p>\r\n\r\n<p>&rArr; 150 &times; 0.875 &times; (100 - x) = 10500</p>\r\n\r\n<p>&rArr; 131.25 &times; (100 - x) = 10500</p>\r\n\r\n<p>&rArr; 100 - x = 10500 / 131.25</p>\r\n\r\n<p>&rArr; 100 - x = 80</p>\r\n\r\n<p>&rArr; x = 100 - 80 = 20%</p>\r\n\r\n<p><strong>अतः, पहली छूट 20% थी।</strong></p>", "question_heading": ""}, {"sr_no": 60, "question": "\r\n<p>10,000 रुपये के मूलधन पर चक्रवृद्धि ब्याज के तहत 2 वर्ष में 4,400 रुपये का ब्याज अर्जित होता है। वार्षिक रुप से संयोजित चक्रवृद्धि ब्याज की दर कितनी होगी?</p>", "option1": "\r\n<p>21%</p>", "option2": "\r\n<p>18%</p>", "option3": "\r\n<p>10%</p>", "option4": "\r\n<p>20%</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>मूलधन = 10,000 रुपये</p>\r\n\r\n<p>2 वर्ष का चक्रवृद्धि ब्याज = 4,400 <span>रुपये</span></p>\r\n\r\n<p>समय = 2 वर्ष</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>A = P(1 + <span class=\"math-tex\">\\(\\frac{R}{{100}}\\)</span>)<sup>T</sup></p>\r\n\r\n<p>जहाँ, A = मिश्रधन, P = मूलधन, R = ब्याज की दर, T = समय</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>2 वर्ष का चक्रवृद्धि ब्याज = 4,400 <span>रुपये</span></p>\r\n\r\n<p>इसलिए, 2 वर्ष के अंत में <span>मिश्रधन </span>= (10,000 + 4,400) <span>रुपये </span>= 14,400</p>\r\n\r\n<p>उपरोक्त अवधारणा के अनुसार,</p>\r\n\r\n<p><span>A = P(1 +  \\(\\frac{R}{{100}}\\) )<sup>T</sup></span></p>\r\n\r\n<p><span>&rArr; 14,400 = 10,000(1 + <span class=\"math-tex\">\\(\\frac{R}{{100}}\\)</span>)<sup>2</sup></span></p>\r\n\r\n<p><span>&rArr; (1 +  \\(\\frac{R}{{100}}\\) )<sup>2</sup> = <span class=\"math-tex\">\\(\\frac{14,400}{{10,000}}\\)</span></span></p>\r\n\r\n<p><span>&rArr;  (1 +  \\(\\frac{R}{{100}}\\) ) = <span class=\"math-tex\">\\(\\frac{12}{{10}}\\)</span></span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{R}{{100}}\\)</span> = (<span class=\"math-tex\">\\(\\frac{12}{{10}}\\)</span> - 1)</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{R}{{100}}\\)</span> = <span class=\"math-tex\">\\(\\frac{1}{{5}}\\)</span></p>\r\n\r\n<p>&rArr; R = 20%</p>\r\n\r\n<p><strong>&there4; अभीष्ट दर 20% है।</strong></p>", "question_heading": ""}, {"sr_no": 61, "question": "\r\n\r\n<p>Select the most appropriate option to fill in blank number 4.</p>", "option1": "\r\n\r\n<p>woman&#39;s</p>", "option2": "\r\n\r\n<p>children&#39;s</p>", "option3": "\r\n\r\n<p>adult&#39;s</p>", "option4": "\r\n\r\n<p>man&#39;s</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- &#39;man&#39;s.&#39;</p>\r\n\r\n<ul>\r\n\t<li>According to the paragraph, most women in 1859 were primarily just wives and mothers.</li>\r\n\t<li>They didn&#39;t have outside jobs because doing so would make their husbands upset.</li>\r\n\t<li>Because of this sentiment, Laura penned her stories under a man&#39;s name.</li>\r\n\t<li>So, out of all the options, the most appropriate answer is &quot;man&#39;s&quot; in this context.</li>\r\n\t<li>Therefore, the correct answer is Option 4.</li>\r\n</ul>\r\n\r\n<p><u>Correct paragraph:</u><em>Can you <u>imagine</u> a deaf woman writing stories about a war? Well, Laura Redden Searing did this. Moreover, she went to foreign countries to write stories. She was very ill when she was 11 years old. Because of this, she lost her <u>hearing</u>. She went to the Missouri School for the Deaf. Laura was 19 years old when she went to work for a newspaper. She wrote about people, places and art. In 1859, most women were just wives and <u>mothers</u>. They did not work outside the home; otherwise, their husbands would be angry. Due to this feeling, Laura used a <u><strong>man&#39;s</strong></u> name when she wrote her stories. She called herself Howard Glyndon. </em></p>", "question_heading": ""}, {"sr_no": 62, "question": "\r\n\r\n<p>Select the most appropriate option to fill in blank number 2.</p>", "option1": "\r\n\r\n<p>hearing</p>", "option2": "\r\n\r\n<p>suffering</p>", "option3": "\r\n\r\n<p>enduring</p>", "option4": "\r\n\r\n<p>inspiring</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- &#39;hearing.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us see the <strong>meanings </strong>of the given options:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Hearing: </strong>the ability to hear. (सुनने की क्षमता, श्रवण-शक्ति)</li>\r\n\t\t<li><strong>Suffering: </strong>the state of undergoing pain, distress, or hardship. (पीड़ा, कष्&zwj;ट या वेदना)</li>\r\n\t\t<li><strong>Enduring: </strong>lasting over a period of time; durable. (स्&zwj;थायी, टिकाऊ)</li>\r\n\t\t<li><strong>Inspiring: </strong>having the effect of inspiring someone; giving someone positive or creative feelings. (प्रेरक, प्रेरणापूर्ण)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Here, the sentence refers to losing an ability due to illness.</li>\r\n\t<li><strong>Option</strong> 1 is correct in this context.</li>\r\n</ul>\r\n\r\n<p><u>Correct paragraph:</u><em>Can you <u><strong>imagine</strong></u> a deaf woman writing stories about a war? Well, Laura Redden Searing did this. Moreover, she went to foreign countries to write stories. She was very ill when she was 11 years old. Because of this, she lost her <u><strong>hearing</strong></u>. She went to the Missouri School for the Deaf. Laura was 19 years old when she went to work for a newspaper. She wrote about people, places and art. In 1859, most women were just wives and ______ (3) _______. They did not work outside the home; otherwise, their husbands would be angry. Due to this feeling, Laura used a ______ (4) _______ name when she wrote her stories. She called herself Howard Glyndon.</em></p>", "question_heading": ""}, {"sr_no": 63, "question": "\r\n\r\n<p>Select the most appropriate option to fill in blank number 3.</p>", "option1": "\r\n\r\n<p>artists</p>", "option2": "\r\n\r\n<p>writers</p>", "option3": "\r\n\r\n<p>mothers</p>", "option4": "\r\n\r\n<p>teachers</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- &#39;mothers.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The sentence refers to the time of 1859  when most girls were married at a very early age and they had two designations, wives and mothers.</li>\r\n\t<li>There were rarely artists, writers or teachers.</li>\r\n\t<li>So, out of all the options, the most appropriate answer is <strong>&quot;mothers&quot; </strong>in this context.</li>\r\n\t<li>Therefore, the correct answer is <strong>Option 3</strong>.</li>\r\n</ul>\r\n\r\n<p><u>Correct paragraph</u>:<em>Can you <u>imagine</u> a deaf woman writing stories about a war? Well, Laura Redden Searing did this. Moreover, she went to foreign countries to write stories. She was very ill when she was 11 years old. Because of this, she lost her <u>hearing</u>. She went to the Missouri School for the Deaf. Laura was 19 years old when she went to work for a newspaper. She wrote about people, places and art. In 1859, most women were just wives and <u><strong>mothers</strong></u>. They did not work outside the home; otherwise, their husbands would be angry. Due to this feeling, Laura used a ______ (4) _______ name when she wrote her stories. She called herself Howard Glyndon.</em></p>", "question_heading": ""}, {"sr_no": 64, "question": "\r\n\r\n<p>Select the most appropriate option to fill in blank number 1.</p>", "option1": "\r\n\r\n<p>malign</p>", "option2": "\r\n\r\n<p>create</p>", "option3": "\r\n\r\n<p>conjure</p>", "option4": "\r\n\r\n<p>imagine</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- &#39;imagine.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us see the <strong>meanings </strong>of the given options:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Malign: </strong>to say or write bad things about somebody/something publicly especially in a unfair manner. (दुर्भावनापूर्वक लेख से या मौखिक निंदा करके किसी को सार्वजनिक रूप से बदनाम करना)</li>\r\n\t\t<li><strong>Create: </strong>to cause something new to happen or exist. (कुछ नया उत्&zwj;पन्&zwj;न, रचना, बनाना, करना; अस्तित्व में लाना)</li>\r\n\t\t<li><strong>Conjure: </strong>to do tricks by clever, quick hand movements, that appear to be magic. (जादू करने जैसी हाथ की सफ़ाई दिखाना; बाज़ीगरी दिखाना)</li>\r\n\t\t<li><strong>Imagine: </strong>to form a picture or idea in your mind of what something/somebody might be like. (किसी व्&zwj;यक्ति या वस्&zwj;तु के विषय में कुछ कल्&zwj;पना करना, मन में उसका चित्र या उसके विषय में कोई धारणा बनाना)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Here, the sentence refers to framing a picture in our mind of stories (about war) writing by a deaf woman.</li>\r\n\t<li><strong>Option</strong> 4 is correct in this context.</li>\r\n</ul>\r\n\r\n<p><u>Correct paragraph:</u><em>Can you <u><strong>imagine</strong></u> a deaf woman writing stories about a war? Well, Laura Redden Searing did this. Moreover, she went to foreign countries to write stories. She was very ill when she was 11 years old. Because of this, she lost her ______ (2) _______. She went to the Missouri School for the Deaf. Laura was 19 years old when she went to work for a newspaper. She wrote about people, places and art. In 1859, most women were just wives and ______ (3) _______. They did not work outside the home; otherwise, their husbands would be angry. Due to this feeling, Laura used a ______ (4) _______ name when she wrote her stories. She called herself Howard Glyndon. </em></p>", "question_heading": ""}, {"sr_no": 65, "question": "\r\n\r\n<p><strong>Select the most appropriate title for the given passage.</strong></p>", "option1": "\r\n\r\n<p>Wolfgang Amadeus Mozart &ndash; A Short Biography</p>", "option2": "\r\n\r\n<p>Are You Buying a Mozart CD for Your Child?</p>", "option3": "\r\n\r\n<p>A Brief Summary of the Studies on Mozart from 1993 to 1999</p>", "option4": "\r\n\r\n<p>The Mozart Effect and Child Intelligence &ndash; A Myth</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>&#39;The Mozart Effect and Child Intelligence &ndash; A Myth&#39;. </strong></p>\r\n\r\n<ul>\r\n\t<li>The given passage talks about a certain phenomenon called the &quot; <strong>Mozart Effect&quot;. </strong></li>\r\n\t<li>In the first paragraph, the passage introduces this topic and explains why it is called so. </li>\r\n\t<li>In the remaining paragraphs, the passage explains how this phenomenon was taken out of proportions from a simple study to a worldwide practice for profit-oriented ventures. </li>\r\n\t<li>The passage categorically states how several studies have shown that this effect does not have a lot of influence on a child&#39;s intelligence. </li>\r\n\t<li>Thus, the passage proves that the Mozart Effect is in fact a myth. </li>\r\n\t<li>Hence,  <strong>option 4  </strong>or  The Mozart Effect and Child Intelligence &ndash; A Myth  is  the most appropriate title for the given passage.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 66, "question": "\r\n\r\n<p><strong>A child prodigy is someone who:</strong></p>", "option1": "\r\n\r\n<p>performs complex tasks at a very young age</p>", "option2": "\r\n\r\n<p>displays his/her talent in front of kings and queens</p>", "option3": "\r\n\r\n<p>shows modest improvement in spatial reasoning</p>", "option4": "\r\n\r\n<p>listens to music when he/she is an infant</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>&#39;performs complex tasks at a very young age&#39; </strong>.</p>\r\n\r\n<ul>\r\n\t<li>The passage is a critique on a technique called <strong> the &quot;Mozart Effect&quot;. </strong></li>\r\n\t<li>The passage talks about Mozart a music composer in the <strong>first </strong>paragraph, where the <strong>last </strong>line states - \r\n\t<ul>\r\n\t\t<li><em>&#39;He was history&rsquo;s greatest child prodigy, performing astonishing feats of memory and musical dexterity for kings and queens at a very early age.&#39;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From this line, we can conclude that Mozart was considered a &#39; <strong>child prodigy&#39;  </strong>because of his great ability in music which allowed him to perform for royalty even as a child. </li>\r\n\t<li>Thus, a child prodigy is s <strong>omeone who has the ability to perform complex adult tasks at a young age. </strong></li>\r\n\t<li>This makes  <strong>option 1  </strong>the correct answer. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 67, "question": "\r\n<p><strong>The study on the impact of Mozart&rsquo;s work on the spatial reasoning of college student was re-attempted in:</strong></p>", "option1": "\r\n<p>1997</p>", "option2": "\r\n<p>1998</p>", "option3": "\r\n<p>1993</p>", "option4": "\r\n<p>1999</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;1999&#39; </strong>. </p>\r\n\r\n<ul>\r\n\t<li>The  <strong>second  </strong>line of the  <strong>last  </strong>paragraph in the given passage states that:\r\n\r\n\t<ul>\r\n\t\t<li><em>&#39; The original experiment with college students was reviewed in <strong>1999 </strong>, and the increase in the students&rsquo; spatial skills was found to be negligible.&#39;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence,  <strong>option 4  </strong>or <strong>1999 </strong>is the correct answer. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 68, "question": "\r\n<p><strong>Directions: In the following questions, an idiomatic expression/proverb has been given, followed by some alternatives. Choose the one which best expresses the meaning of the given idiom/proverb.</strong></p>\r\n\r\n<p>A snake in the grass</p>", "option1": "\r\n<p>Secret or hidden enemy</p>", "option2": "\r\n<p>Unforeseen happening</p>", "option3": "\r\n<p>Unrecognisable danger</p>", "option4": "\r\n<p>Unreliable person</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>Secret or hidden enemy.&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The meaning of the proverb<strong>&#39;</strong><strong>A snake in the grass</strong><strong>&#39;</strong>isa<strong> secretly faithless friend; a deceitful or treacherous person.</strong>\r\n\r\n\t<ul>\r\n\t\t<li>Example:<em> Did you hear that Daria&#39;s best friend stole money from her bank account? What <u><strong>a snake in the grass</strong></u>.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, the most appropriate meaning of the given proverb is &#39; Secret or hidden enemy.&#39;</li>\r\n\t<li>Thus, the correct answer is Option 1.</li>\r\n\t<li>There may be confusion between Options 1 and 4. </li>\r\n\t<li>The meaning of the phrase &quot;secret or hidden enemy&quot; is a person who cannot be seen or observed clearly.</li>\r\n\t<li>The meaning of the phrase <strong>&quot;unreliable person&quot; </strong>is a person who cannot be trusted.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 69, "question": "\r\n<p>निम्नलिखित युग्मों में से कौन-सा सही सुमेलित है?</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(a)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>दीवान-ए-बंदगनी</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>फिरोज शाह तुगलक</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(b)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>दीवान-ए-मुस्तखराज</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>बलबन</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(c)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>दीवान-ए-कोही</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>अलाउद्दीन खिलजी</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(d)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>दीवान-ए-अर्ज</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>मुहम्मद-बिन-तुगलक</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p> </p>", "option1": "\r\n<p>(a)</p>", "option2": "\r\n<p>(b)</p>", "option3": "\r\n<p>(c)</p>", "option4": "\r\n<p>(d)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही युग्म &quot;<u><strong>दीवान-ए-बंदगनी-फिरोज शाह तुगलक</strong></u>&quot; है।</p>\r\n\r\n<ul>\r\n\t<li>फिरोज शाह तुगलक ने दीवान-ए-बंदगनी विभाग की स्थापना की थी।</li>\r\n\t<li>यह एक<strong> गुलाम-उन्मुख </strong>विभाग था।</li>\r\n\t<li>यह इसलिए महत्वपूर्ण था क्योंकि उस समय दिल्ली में गुलामों की एक बड़ी आबादी थी।</li>\r\n\t<li>इसकी देखरेख करना दीवान-ए-बंदगनी की जिम्मेदारी थी।</li>\r\n\t<li>इस विभाग का प्रभारी अधिकारी <strong>वकील-ए-दार</strong> होता था।</li>\r\n\t<li>फिरोज शाह तुगलक<strong> ने युद्ध के दौरान पराजित सैनिकों और युवकों को बंदी बनाकर गुलामों की संख्या बढ़ाई थी।</strong></li>\r\n</ul>\r\n\r\n<p>अतः, हम यह निष्कर्ष निकाल सकते हैं कि &quot;<strong>दीवान-ए-बंदगनी-फिरोज शाह तुगलक&quot; </strong>सही सुमेलित है।</p>\r\n\r\n<p><u><strong>दीवान-ए-मुस्तखराज</strong></u></p>\r\n\r\n<ul>\r\n\t<li>अलाउद्दीन खिलजी ने भू-राजस्व प्रशासन में एक महत्वपूर्ण कदम, कम लागत पर<strong> एक बड़ी सेना बनाए रखने के लिए, </strong>उठाया था।</li>\r\n\t<li>दीवान-ए-मुस्तखराज को<strong> राजस्व वसूली जानने </strong>और इकक्ठा करने के लिए प्रस्तुत किया गया था।</li>\r\n\t<li>यह <strong>कलेक्टरों</strong> से बकाया वसूल करने के लिए था।</li>\r\n\t<li><u><strong>दीवान-ए-कोही</strong></u></li>\r\n\t<li>यह <strong>मुहम्मद तुगलक </strong>द्वारा शुरू किया गया एक कृषि विभाग है।</li>\r\n\t<li>दोआब में खेती में सुधार करने के लिए, सुल्तान ने अलग से <strong>दीवान-ए-अमीर-कोही नामक एक कृषि विभाग की स्थापना की थी।</strong></li>\r\n\t<li>विभाग ने दोआब को एक ऐसे अधिकारी के नेतृत्व में विकास खंडो में विभाजित किया था, जो <strong>किसानों को ऋण देगा</strong> और उन्हें बेहतर फसलों की खेती में शामिल करेगा।</li>\r\n\t<li><u><strong>दीवान-ए-अर्ज</strong></u></li>\r\n\t<li>सल्तनत के <strong>सैन्य विभाग</strong> को <strong>दीवान-ए-अर्ज</strong> कहा जाता था।</li>\r\n\t<li>इसकी स्थापना <strong>बलबन</strong> द्वारा की गई थी।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 70, "question": "\r\n<p><strong>Choose the most appropriate option -</strong></p>\r\n\r\n<p>Ashin said, &quot;Shall I ever win a gold medal?&quot; (Change into Indirect Speech)</p>", "option1": "\r\n<p>Ashin exclaimed if he shall ever win a gold medal.</p>", "option2": "\r\n<p>Ashin said that shall he ever won a gold medal.</p>", "option3": "\r\n<p>Ashin asked if he shall ever have won a gold medal.</p>", "option4": "\r\n<p>Ashin wondered if he would ever win a gold medal.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Ashin wondered if he would ever win a gold medal.&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is an  <strong>interrogative sentence.</strong></li>\r\n\t<li>While changing the narration of an  <strong>interrogative sentence </strong>, we need to follow these steps</li>\r\n\t<li>If there is a yes-no question in the direct speech, we make the following changes-\r\n\t<ul>\r\n\t\t<li>The reporting verb said is changed into<strong><u>wondered</u></strong> as the subject is asking the question to themselves only. </li>\r\n\t\t<li>the reported speech will start with <strong><em>whether/if </em></strong></li>\r\n\t\t<li>The  <strong>first person &#39;I&#39; </strong> will be changed into  <strong>&#39;he&#39;.</strong></li>\r\n\t\t<li>The  <strong>modal verb &#39;shall&#39; </strong>changes to  <strong>&#39; would&#39;. </strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>\r\n\t<p>Eventually, we will get the final sentence-Ashin wondered if he would ever win a gold medal.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p>Hence,  <strong>option 4  </strong>is the correct answer. </p>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 71, "question": "\r\n<p>Which of the following countries won the ACC Men&#39;s Premier Cup in May 2023?</p>", "option1": "\r\n<p>Bhutan</p>", "option2": "\r\n<p>India</p>", "option3": "\r\n<p>Sri Lanka</p>", "option4": "\r\n<p>Nepal</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Nepal</strong></u>.</p>\r\n\r\n<p><img src=\"https://appxcontent.kaxa.in/test-series-assets/uploads/production/images/content/2022_05_12/star.png\" />  <strong><u>In News</u></strong></p>\r\n\r\n<ul>\r\n\t<li>Nepal won the ACC Men&#39;s Premier Cup in May 2023.</li>\r\n\t<li><strong>Nepal</strong> won the <strong>ACC Men&#39;s Premier Cup</strong>, qualifying for Asia Cup for the first time.</li>\r\n\t<li>Nepal <strong>defeated UAE</strong> in the finals.</li>\r\n\t<li><strong>ACC Men&#39;s Premier Cup:</strong>\r\n\t<ul>\r\n\t\t<li>The <strong>2023 ACC Men&#39;s Premier Cup</strong> was a cricket tournament.</li>\r\n\t\t<li>It was the inaugural edition of the ACC Men&#39;s Premier Cup, and it served as the final stage of qualification for the 2023 Asia Cup tournament.</li>\r\n\t\t<li>The winner of the tournament<strong> qualified for the 2023 Asia Cup.</strong></li>\r\n\t\t<li>The top three teams including also qualified for the 2023 ACC Emerging Teams Asia Cup.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 72, "question": "\r\n<p><strong>Directions: Choose the correct form of expression to complete the sentence:</strong></p>\r\n\r\n<p>In order to give up smoking, you need to exercise great ______.</p>", "option1": "\r\n<p>will-power</p>", "option2": "\r\n<p>abstinence</p>", "option3": "\r\n<p>effort</p>", "option4": "\r\n<p>endeavour</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; will-power &#39; .</p>\r\n\r\n<ul>\r\n\t<li>Let  us  explore  the  given options:\r\n\t<ul>\r\n\t\t<li>The noun  &#39;will-power&#39;  is  the control exerted to do something or restrain impulses . (इच्छा शक्ति)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - Most of our bad habits are due to laziness or lack of willpower.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39; abstinence &#39;  is  the practice of restraining oneself from indulging in something, typically alcohol or sex . (अपने आप को किसी चीज में लिप्त होने से रोकने का अभ्यास है, आमतौर पर शराब)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - I started drinking again after six years of abstinence.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39; effort &#39;  is  a vigorous or determined attempt . (एक जोरदार या दृढ़ प्रयास)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - He was a keen gardener, winning many prizes for his effort.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The noun  &#39; endeavour &#39;  is  an attempt to achieve a goal . (एक लक्ष्य को प्राप्त करने का प्रयास)\r\n\t\t<ul>\r\n\t\t\t<li>For Example - He is endeavouring to help the Third World</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Complete Sentence:<em>In order to give up smoking, you need to exercise great  will-power .</em></p>", "question_heading": ""}, {"sr_no": 73, "question": "\r\n<p>वर्ष 1787 में किस नियम का अध्ययन किया गया था, जिसमें कहा गया था कि किसी गैस का आयतन उसके पूर्ण तापमान के साथ बढ़ता है और यदि उसका पूर्ण तापमान घटता है, तो उसका आयतन घट जाएगा?</p>", "option1": "\r\n<p>बॉयल का नियम</p>", "option2": "\r\n<p>डाल्टन का नियम</p>", "option3": "\r\n<p>आवोगाद्रो का नियम</p>", "option4": "\r\n<p>चार्ल्स का नियम</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>चार्ल्स का नियम </strong>है।</p>\r\n\r\n<ul>\r\n\t<li><strong>आवोगाद्रो का नियम डाल्टन </strong> के<strong> परमाणु सिद्धांत के निष्कर्ष और गे लुसाक के आयतन संयोजन</strong> के नियम को जोड़ता है।</li>\r\n\t<li>इसमें कहा गया है कि  <strong>तापमान और दाब की समान परिस्थितियों में सभी गैसों के समान आयतन में समान संख्या में अणु होते हैं।</strong></li>\r\n\t<li><strong>गणितीय रूप से  इसे V &prop; n</strong> के रूप में लिखा जा सकता है, जहाँ  n गैस के <strong>मोल्स की संख्या है।</strong></li>\r\n\t<li>गैस के  <strong>एक मोल में अणुओं की संख्या 6.022 x 1023 </strong> होती है और इसे <strong>आवोगाद्रो स्थिरांक के रूप</strong> में जाना जाता है। </li>\r\n\t<li><strong>गे लुसाक का नियम:</strong>\r\n\t<ul>\r\n\t\t<li>स्थिर आयतन पर, गैस की एक निश्चित मात्रा का दाब सीधे तापमान के साथ बदलता रहता है।</li>\r\n\t\t<li>गणितीय रूप से, <span class=\"math-tex\">\\({p \\over T} = Constant = k_3\\)</span></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>चार्ल्स का नियम:</strong>\r\n\t<ul>\r\n\t\t<li>स्थिर दाब पर किसी गैस के निश्चित द्रव्यमान का आयतन उसके परम ताप के समानुपाती होता है।</li>\r\n\t\t<li>गणितीय रूप से, <span class=\"math-tex\">\\({V \\over T} = Constant = k_2 \\)</span></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>बॉयल के नियम:</strong>\r\n\t<ul>\r\n\t\t<li>स्थिर ताप पर गैस की निश्चित मात्रा का दाब उसके आयतन के व्युत्क्रमानुपाती होता है।</li>\r\n\t\t<li>गणितीय रूप से, <span class=\"math-tex\">\\(p ∝ {1 \\over V}\\)</span></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 74, "question": "\r\n\r\n<p>निम्नलिखित में से किस समूह को &#39;पादप जगत का उभयचर&#39; कहा जाता है?</p>", "option1": "\r\n\r\n<p>ब्रायोफाइट</p>", "option2": "\r\n\r\n<p>थैलोफाइट</p>", "option3": "\r\n\r\n<p>टेरिडोफाइट</p>", "option4": "\r\n\r\n<p>जिम्नोस्पर्म</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सहीउत्तर <u><strong>ब्रायोफाइट </strong></u>है।</p>\r\n\r\n<p><u><strong>व्याख्या:</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>ब्रायोफाइट में विभिन्न मॉस और लिवरवर्ट</strong> शामिल हैं।</li>\r\n\t<li>ये <strong>असंवहनी एम्ब्रियोफाइट </strong>हैं, जो एक स्वतंत्र गैमेटोफाइट और परजीवी स्पोरोफाइट की उपस्थिति की विशेषता है।</li>\r\n\t<li>ब्रायोफाइट आमतौर पर <strong>पहाड़ियों में नम, छायांकित क्षेत्रों में उगते हैं।</strong></li>\r\n\t<li>इन्हें <strong>पादप जगत के उभयचर</strong> कहा जाता है<strong> क्योंकि ये मिट्टी में रह सकते हैं, लेकिन यौन प्रजनन के लिए पानी पर निर्भर होते हैं।</strong></li>\r\n\t<li>हालांकि, उनके शुक्राणु, जिन्हें एथेरोज़ोइड के रूप में जाना जाता है, कशाभी होते हैं और उन्हें निषेचित करने के लिए तैरने और अंडों तक पहुंचने के लिए पानी की आवश्यकता होती है। नतीजतन, उन्हें यौन प्रजनन के लिए पानी की आवश्यकता होती है।</li>\r\n\t<li>ब्रायोफाइट्स का पादप शरीर शैवाल की तुलना में अधिक विभेदित होता है।</li>\r\n\t<li><strong>पारिस्थितिक महत्व :</strong>\r\n\t<ul>\r\n\t\t<li>कुछ काई शाकाहारी स्तनधारियों, पक्षियों और अन्य जानवरों के लिए भोजन प्रदान करते हैं।</li>\r\n\t\t<li>लाइकेन के साथ काई शैलों पर बसने वाले पहले जीव हैं। इसलिए, ये जैविक अनुक्रम में मदद करते हैं।</li>\r\n\t\t<li>मॉस मिट्टी पर घनी चटाई बनाती है।</li>\r\n\t\t<li>मार्केन्शिया में फेफड़े और लीवर के संक्रमण को ठीक करने के औषधीय गुण होते हैं। इसमें एंटी-ट्यूमर गुण भी होते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>थैलोफाइट:</strong>\r\n\t<ul>\r\n\t\t<li>थैलोफाइट्स, जिन्हें <strong>शैवाल </strong>भी कहा जाता है, पादप जगत<strong> का प्राथमिक विभाजन</strong> हैं।</li>\r\n\t\t<li>इनमें तने, जड़ें, पत्तियां और अन्य संवहनी पौधों के भाग नहीं होते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>टेरिडोफाइट:</strong>\r\n\t<ul>\r\n\t\t<li>टेरिडोफाइट <strong>आद्य</strong><strong>बीजरहित संवहनी पौधे</strong> हैं जिन्हें <strong>क्रिप्टोगैम </strong>भी कहा जाता है।</li>\r\n\t\t<li>टेरिडोफाइट ठंडे, नम छायादार स्थानों में पाए जाते हैं, कुछ टेरिडोफाइट रेतीली-मिट्टी की स्थिति में अच्छी तरह से पनप सकते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>जिम्नोस्पर्म:</strong>\r\n\t<ul>\r\n\t\t<li>जिम्नोस्पर्म <strong>ऐसे पौधे</strong> होते हैं जिनमें बीजांड किसी अंडाशय भित्ति से ढका नहीं होता है और निषेचन से पहले और बाद दोनों में खुला रहता है।</li>\r\n\t\t<li>ये पौधे ज्यादातर उत्तरी गोलार्ध के ठंडे हिस्सों में पाए जाते हैं, जहां वे व्यापक वन बनाते हैं।</li>\r\n\t\t<li>ये <strong>बीज पौधों के छोटे समूह</strong> हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 75, "question": "\r\n\r\n<p><strong>Identify the segment in the sentence which contains a grammatical error.</strong></p>\r\n\r\n<p>Parents must monitor what them children access on the internet as they are easily influenced.</p>", "option1": "\r\n\r\n<p>what them children</p>", "option2": "\r\n\r\n<p>Parents must monitor</p>", "option3": "\r\n\r\n<p>as they are easily influenced</p>", "option4": "\r\n\r\n<p>access on the internet</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The erroneous part is <strong>&#39;what them children&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is grammatically incorrect.</li>\r\n\t<li>Here, <strong>&#39;what their children&#39; </strong>should be used instead of <strong>&#39;what them children&#39;. </strong></li>\r\n\t<li>&#39; <strong>Them </strong>&#39; is <strong>a third personal plural pronoun </strong>used after a preposition or as the <strong>object </strong>of a verb while &#39; <strong>their </strong>&#39; is (possessive) belonging to, from, of, or relating to, them. </li>\r\n\t<li>&#39; <strong>Them </strong>&#39; and &#39; <strong>their </strong>&#39; are <strong>personal pronouns </strong>.\r\n\t<ul>\r\n\t\t<li><em>Example: She is helped by &quot; <strong>them </strong>&quot;. (accusative case/objective case )</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&lsquo; <strong>Their </strong>&rsquo; is called <strong>&lsquo;possessive adjective&rsquo; </strong>because it is used with noun and does the work of an <strong>adjective </strong>.\r\n\t<ul>\r\n\t\t<li><em>Example: It is &lsquo; <strong>their </strong>&rsquo; house. (possessive case)</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is <strong>Option 1.</strong></li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sentence:</u></strong><em> Parents must monitor <strong>what their children </strong>access on the internet as they are easily influenced </em>. </p>\r\n\r\n<ul>\r\n\t<li>दिया गया वाक्य व्याकरण की दृष्टि से गलत है।</li>\r\n\t<li>यहां <strong>&#39;what them children&#39; </strong>के स्थान पर <strong>&#39;what their children&#39; </strong>का प्रयोग किया जाना चाहिए।</li>\r\n\t<li>&#39; <strong>Them </strong>&#39; एक <strong>third personal plural pronoun </strong> है जिसका उपयोग किसी <strong>preposition </strong> के बाद या <strong>verb </strong>के <strong>object </strong> के रूप में किया जाता है, जबकि &#39; <strong>their </strong>&#39; ( <strong>possessive </strong>) का उपयोग निष्क्रिय संबंध को दिखाने के लिए किया जाता है।</li>\r\n\t<li>&#39; <strong>Them </strong>&#39; और &#39; <strong>Their </strong>&#39;<strong>personal pronouns </strong>हैं।\r\n\t<ul>\r\n\t\t<li><em>Example: She is helped by &quot; them &quot;. (accusative case/objective case )</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&#39; <strong>Their </strong>&#39; को &#39;अधिकार विशेषण&#39; कहा जाता है क्योंकि यह संज्ञा के साथ प्रयोग किया जाता है और विशेषण का कार्य करता है।\r\n\t<ul>\r\n\t\t<li><em>Example: It is &lsquo; their &rsquo; house (possessive case)</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>अत: सही उत्तर <strong>विकल्प 1 </strong>है। </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 76, "question": "\r\n<p>Good governance day is observed annually on 25th December, the birth anniversary of __________.</p>", "option1": "\r\n<p>L.K. Advani</p>", "option2": "\r\n<p>I.K. Gujral</p>", "option3": "\r\n<p>Atal Bihari Vajpayee</p>", "option4": "\r\n<p>A.P.J. Abdul Kalam</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u>Atal Bihari Vajpayee.</u></p>\r\n\r\n<ul>\r\n\t<li><u>Good Governance Day</u> is observed <strong><u>annually</u></strong>on <u><strong>25th  December</strong></u>the birth anniversary of <u><strong>Atal Bihari Vajpayee</strong></u>.\r\n\r\n\t<ul>\r\n\t\t<li>The birth anniversary of former Prime Minister and Bharat Ratna Atal Bihari Vajpayee is celebrated as Good Governance Day across the country.</li>\r\n\t\t<li>The day aims to let the <strong>citizens, </strong>the <strong>students,</strong> who are the future of the country <strong>know </strong>about the <strong>government&#39;s responsibilities and duties</strong> that it needs to fulfill.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Shri Atal Bihari Vajpayee was born on 25 December 1924 in Gwalior, Madhya Pradesh.</li>\r\n\t<li>He was one of the <strong>founding members</strong> of the <strong>Bharatiya Jana Sangh</strong> and later became its <strong>national president</strong>.</li>\r\n\t<li><strong>Atal Bihari Vajpayee</strong> won the election from Lucknow parliamentary constituency and became the <strong>tenth Prime Minister of India</strong>.</li>\r\n\t<li><strong>Atal Bihari Vajpayee</strong> has given his membership in both the <strong>Lok Sabha</strong> and the <strong>Rajya Sabha</strong>.</li>\r\n\t<li>He was awarded <strong>Bharat Ratna</strong>, India&#39;s highest honour in the year <strong>2015</strong>.</li>\r\n\t<li><strong>Atal Bihari Vajpayee</strong> was the first <strong>Foreign Minister of India</strong> to give a speech in <strong>Hindi </strong>at the <strong>United Nations</strong>.</li>\r\n\t<li>He died in <strong>Delhi </strong>on <strong>16 August 2018</strong> due to a prolonged illness.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 77, "question": "\r\n<p><strong>Select the most appropriate ANTONYM of the given word.</strong></p>\r\n\r\n<p>PRECIOUS</p>", "option1": "\r\n<p>costly</p>", "option2": "\r\n<p>worthless</p>", "option3": "\r\n<p>ugly</p>", "option4": "\r\n<p>plentiful</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; worthless .&#39;</p>\r\n\r\n<ul>\r\n\t<li>The given word &#39; Precious &#39; means <strong>of great value; not to be wasted or treated carelessly </strong>. (क़ीमती, बहुमूल्&zwj;य)\r\n\r\n\t<ul>\r\n\t\t<li>Example:<em>Friendship is one of the most <strong>precious </strong>things in our life </em>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Let&#39;s see the  meaning  of other given options:-\r\n\t<ul>\r\n\t\t<li>&#39; Costly &#39;means  c<strong>osting a lot of money; expensive </strong>. (बड़ी लागत वाला; महँगा, क़ीमती)\r\n\t\t<ul>\r\n\t\t\t<li>Example: <em>It was too <strong>costly </strong>to fix her car after the accident </em>.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>&#39; Worthless &#39;means <strong>having no value or use </strong>. (बेकार, किसी काम का नहीं, व्&zwj;यर्थ का)\r\n\t\t<ul>\r\n\t\t\t<li>Example: <em>The boots may be nice, but they&#39;re <strong>worthless </strong>if they don&#39;t fit you </em>.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>&#39; <strong>Ugly </strong>&#39;means <strong>unpleasant to look at or listen to; not attractive </strong>. (भद्दा; कुरूप, बदसूरत)\r\n\t\t<ul>\r\n\t\t\t<li>Example: <em>My car may be <strong>ugly </strong>, but it runs pretty well </em>.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>&#39; <strong>Plentiful </strong>&#39;means <strong>available in large amounts or numbers </strong>. (बड़ी मात्रा में राशि में उपलब्&zwj;ध)\r\n\t\t<ul>\r\n\t\t\t<li>Example: <em>There was a <strong>plentiful </strong>amount of food at the family reunion </em>.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is  option 2 .</p>\r\n\r\n<ul>\r\n\t<li>The  antonyms  of the word &#39; Precious &#39; are  &quot;Worthless, <strong>Valueless</strong>,  Cheap &quot; .</li>\r\n\t<li>The  synonyms  of the word &#39; Precious &#39; are  &quot;<strong>Valuable</strong>,<strong>Priceless</strong>,<strong>Extravagant</strong>&quot; .</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 78, "question": "\r\n\r\n\r\n<p>World Sportsperson of the Year with a Disability Award was given to Catherine Debrunner at the Laureus World Sports Awards 2023. She is associated with which sports?</p>", "option1": "\r\n\r\n\r\n<p>Table Tennis</p>", "option2": "\r\n\r\n\r\n<p>Cricket</p>", "option3": "\r\n\r\n\r\n<p>Badminton</p>", "option4": "\r\n\r\n\r\n<p>Athletics</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p>The correct answer is <u><strong>Athletics</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>World Sportsperson of the Year with a Disability Award was given to <strong>Catherine Debrunner</strong> at the Laureus World Sports Awards 2023.</li>\r\n\t<li>She is associated with <strong>Athletics</strong>.</li>\r\n\t<li>This was her first Laureus World Sportsperson of the Year with a Disability Award for her <strong>successful 2022 season</strong>.</li>\r\n\t<li>She has competed for Team Switzerland at the <strong>2019 World Para Athletics Championships</strong> where she won a gold and silver medal.</li>\r\n\t<li><strong>Laureus Sports Awards:</strong>\r\n\t<ul>\r\n\t\t<li>The Laureus World Sports Awards is an annual award ceremony honoring remarkable individuals from the world of sports along with the greatest sporting achievements throughout the year.</li>\r\n\t\t<li>It was<strong> established in 1999</strong> by <strong>Laureus Sport for Good Foundation</strong> founding patrons Daimler and Richemont and supported by its global partners<strong> Mercedes-Benz and IWC Schaffhausen.</strong></li>\r\n\t\t<li>The first ceremony was held on <strong>May 25, 2000 in Monte Carlo.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 79, "question": "\r\n<p>In India, who among the following is responsible for auditing all receipts and expenditure of the Union and State governments?</p>", "option1": "\r\n<p>Attorney General for India</p>", "option2": "\r\n<p>Advocate General</p>", "option3": "\r\n<p>Union Public Service Commission</p>", "option4": "\r\n<p>Comptroller and Auditor- General</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Option 4</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li> In India, the<strong> Comptroller and Auditor General (CAG)</strong> is responsible for auditing all receipts and expenditure of<strong> the Union and State governments. </strong></li>\r\n\t<li><strong>The CAG</strong> is an independent constitutional authority and is appointed by the<strong> President of India.</strong></li>\r\n\t<li>Its primary role is to ensure that the government&#39;s financial transactions are conducted in accordance with the laws and regulations in place and that public funds are used efficiently and effectively.</li>\r\n\t<li><strong>The CAG submits </strong>its reports to the <strong>President or Governor,</strong> as the case may be, who then lays them before the Parliament or State Legislature.</li>\r\n\t<li><strong>The Attorney General for India is the chief legal advisor to the Government of India and is responsible for providing legal advice and guidance to the government on various matters.</strong> The role of the Attorney General includes:\r\n\t<ul>\r\n\t\t<li><strong>Providing legal advice:</strong> The Attorney General is responsible for providing legal advice and opinions to the Government of India on matters of law and policy. This includes advising on the constitutional validity of laws, treaties, and agreements entered into by the government.</li>\r\n\t\t<li><strong>Representing the government in court: </strong>The Attorney General represents the Government of India in all legal proceedings in the Supreme Court of India and other courts of law. He/she is also responsible for ensuring that the government&#39;s legal position is adequately presented and defended in court.</li>\r\n\t\t<li><strong>Initiation of Contempt Proceedings:</strong> The Attorney General has the power to initiate contempt proceedings in the Supreme Court of India against any person who is found to have committed contempt of court.</li>\r\n\t\t<li><strong>Providing legal opinion on references made by the President:</strong> The President of India may refer any legal matter to the Attorney General for his/her opinion, and the Attorney General is required to provide a legal opinion on such references.</li>\r\n\t\t<li><strong>Providing legal opinion on matters referred by the Ministries: </strong>The Ministries of the Government of India may also refer legal matters to the Attorney General for his/her opinion and advice.</li>\r\n\t\t<li><strong>Appointment of Law Officers:</strong> The Attorney General is also responsible for the appointment of the Solicitor General and other law officers of the government.</li>\r\n\t\t<li>Overall, the Attorney General for India plays a crucial role in ensuring that the government&#39;s legal interests are protected and that the government operates within the framework of the law.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>The Advocate General </strong>is a legal officer who provides legal opinions to the<strong> Court of Justice of the European Union (CJEU)</strong> in cases brought before it.\r\n\t<ul>\r\n\t\t<li>The role of the Advocate General is to assist the Court in the decision-making process by offering impartial and independent legal advice on the interpretation of <strong>EU law.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>The Union Public Service Commission (UPSC) </strong>is a central government agency responsible for conducting recruitment examinations and selection processes for various <strong>Group A and Group B</strong> posts in the Indian civil services.\r\n\t<ul>\r\n\t\t<li><strong>Established in 1926, </strong>the UPSC is headquartered in <strong>New Delhi</strong> and is governed by a<strong> chairman and a group of members who are appointed by the President of India.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 80, "question": "\r\n<p><strong>Choose the word which can be the best substitute for the given phrase.</strong></p>\r\n\r\n<p>&lsquo;That which cannot be corrected&rsquo;.</p>", "option1": "\r\n<p>unintelligible</p>", "option2": "\r\n<p>indelible</p>", "option3": "\r\n<p>illegible</p>", "option4": "\r\n<p>incorrigible</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;incorrigible &#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The most appropriate word for the given group of words is &#39; <strong>Incorrigible </strong>&#39;.</li>\r\n\t<li>It means &#39;(used about a person or his/her behaviour) very bad; too bad to be corrected or improved&#39;. [(व्&zwj;यक्ति या उसका आचरण) बहुत ख़राब, असुधार्य, सुधारातीत]\r\n\t<ul>\r\n\t\t<li><em>Example: an <strong>incorrigible </strong>liar...</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Answer:  </u></strong><em>incorrigible .</em></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the <strong>meaning </strong>of other words:\r\n\r\n\t<ul>\r\n\t\t<li><strong>unintelligible </strong>: impossible to understand. (जो समझ में न आ सके; दुर्बोध)</li>\r\n\t\t<li><strong>indelible </strong>: that cannot be removed or washed out. (जो हटाया या धोया न जा सके; अमिट, अलोप्&zwj;य, स्&zwj;थायी)</li>\r\n\t\t<li><strong>illegible </strong>: difficult or impossible to read. (जिसे पढ़ना कठिन या असंभव हो; अपाठ्&zwnj;य, दुर्वाच्य) </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 81, "question": "\r\n<p><strong>Direction: Select the right sentence -</strong></p>\r\n\r\n<p>He said to him, &quot;Please wait here till I return&quot;.</p>", "option1": "\r\n<p>He requested him to wait there till he returned</p>", "option2": "\r\n<p>He told him please wait here till I return</p>", "option3": "\r\n<p>He said him wait till I return here</p>", "option4": "\r\n<p>He ordered him to wait till he returned</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>He requested him to wait there till he returned.&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The rules of Direct and Indirect speech for imperative sentences conversions.\r\n\t<ul>\r\n\t\t<li>The reporting verb said/said to is changed to asked, demanded, requested, ordered, enquired, and offered as per the nature of the sentence.</li>\r\n\t\t<li>The first person in the reported speech changes according to the subject of reporting speech.</li>\r\n\t\t<li>In Reported Speech change of the second person depends on the object of reporting speech.</li>\r\n\t\t<li>The third person remains unchanged.</li>\r\n\t\t<li>Imperative sentences do not normally have an expressed subject.</li>\r\n\t\t<li>This is because the subject &lsquo;you&rsquo; is usually understood.</li>\r\n\t\t<li>When the reporting verb is in the past (said) and the direct speech is in the present indefinite tense (simple present tense), then the indirect (reported) speech will change into the past indefinite tense.</li>\r\n\t\t<li>In order to change an imperative sentence into indirect speech, we use a to-infinitive.</li>\r\n\t\t<li><strong>Here</strong> changes to there.\r\n\t\t<ul>\r\n\t\t\t<li>Example: </li>\r\n\t\t\t<li><em>The old woman said to the boy, &lsquo;Please help me till he returns.&rsquo;</em></li>\r\n\t\t\t<li><em><em>The old woman requested the boy to help him till he returned.</em></em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The correct answer is  <strong>Option 1</strong>.</li>\r\n</ul>\r\n\r\n<p><strong>Correct sentence:</strong><em>He requested him to wait there till he returned.</em></p>", "question_heading": ""}, {"sr_no": 82, "question": "\r\n<p><strong>Select the sentences that contains no spelling errors.</strong></p>", "option1": "\r\n<p>Her conscienc wouldn&#39;t allow her to accept the bribe, even though it would have been easy money.</p>", "option2": "\r\n<p>Her conscience wouldn&#39;t allow her to accept the bribe, even though it would have been easy money.</p>", "option3": "\r\n<p>Her conscencie wouldn&#39;t allow her to accept the bribe, even though it would have been easy money.</p>", "option4": "\r\n<p>Her concscience wouldn&#39;t allow her to accept the bribe, even though it would have been easy money.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 2), i.e., &quot; Her conscience wouldn&#39;t allow her to accept the bribe, even though it would have been easy money.&quot;</p>\r\n\r\n<ul>\r\n\t<li>We can note that the spelling of &#39; conscience &#39; is wrong in option 1 (conscienc), option 3 ( conscencie), and option 4 ( concscience ).</li>\r\n\t<li>&#39;<strong>Conscience</strong>&#39; means<strong> &#39;</strong><strong>the sense of right and wrong that guides a person&#39;s behavior (विवेक).&#39;</strong></li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li><em>A guilty <strong>conscience </strong>feels continual fear.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, &#39; conscience &#39; is correctly spelt in <strong>Option 2.</strong></li>\r\n\t<li>Hence, option 2 is the correct answer.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 83, "question": "\r\n<p>कौन सा राष्ट्रीय उद्यान रॉयल बंगाल टाइगर की आबादी के लिए विख्यात है?</p>", "option1": "\r\n<p>कुम्भलगढ़ वन्यजीव अभयारण्य</p>", "option2": "\r\n<p>मरुभूमि राष्ट्रीय उद्यान</p>", "option3": "\r\n<p>रणथंभौर राष्ट्रीय उद्यान</p>", "option4": "\r\n<p>सरिस्का टाइगर रिजर्व</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>रणथंभौर राष्ट्रीय उद्यान</strong></u> है।</p>\r\n\r\n<p><strong>रणथंभौर राष्ट्रीय उद्यान:</strong></p>\r\n\r\n<ul>\r\n\t<li>यह उत्तरी भारत के राजस्थान में एक राष्ट्रीय उद्यान है, जिसका क्षेत्रफल 1,334 किमी2 (515 वर्ग मील) है।</li>\r\n\t<li><strong>यह उत्तर में बनास नदी और दक्षिण में चंबल नदी से घिरा है।</strong></li>\r\n\t<li>इसका नाम ऐतिहासिक <strong>रणथंभौर किले</strong> के नाम पर रखा गया है, जो उद्यान के भीतर स्थित है।</li>\r\n\t<li>रणथंभौर राष्ट्रीय उद्यान <strong>1955 में सवाई माधोपुर क्रीड़ा अभयारण्य </strong>के रूप में स्थापित किया गया था, शुरू में 282 किमी2 (109 वर्ग मील) के क्षेत्र को आच्छादित किया गया था।</li>\r\n\t<li>इसे 1973 में बाघ अभयारण्य परियोजना में से एक घोषित किया गया और 1 नवंबर, 1980 को एक राष्ट्रीय उद्यान बन गया।</li>\r\n\t<li>1984 में, आस-पास के जंगलों को <strong>सवाई मान सिंह अभयारण्य और केलादेवी अभयारण्य</strong> घोषित किया गया था।</li>\r\n\t<li>1992 में, बाघ अभयारण्य का<strong> विस्तार उत्तर में केलादेवी अभयारण्य और दक्षिण में सवाई मानसिंह अभयारण्य को </strong>अन्य जंगलों के साथ<strong> शामिल करने के लिए किया गया था।</strong></li>\r\n\t<li>रणथंभौर राष्ट्रीय उद्यान <strong>पर्णपाती जंगलों</strong> और वन्यजीवों जैसे बंगाल टाइगर, भारतीय तेंदुआ, नीलगाय, जंगली सूअर, सांभर, धारीदार लकड़बग्घा, स्लोथ बियर, दक्षिणी मैदानी स्लेटी लंगूर, रीसस मकाक, मगर मगरमच्छ और चीतल आ आवास स्थल है।</li>\r\n\t<li>अभयारण्य विभिन्न प्रकार के पेड़ों, पौधों, पक्षियों और सरीसृपों का घर है, <strong>साथ ही भारत में सबसे बड़े बरगद के पेड़ों वाले अभयारण्यों में से एक है।</strong></li>\r\n\t<li>राजस्थान वन्य जीवन के बारे मे\r\n\t<ul>\r\n\t\t<li>राजस्थान में रणथंभौर राष्ट्रीय और सरिस्का राष्ट्रीय उद्यान और मुकुंदरा एक बाघ अभयारण्य के रूप में है।</li>\r\n\t\t<li>UNESCO विश्व धरोहर स्थल केवलादेव राष्ट्रीय उद्यान के साथ-साथ ताल छापर, वन विहार और जोरबीड राज्य में पक्षी स्थलों के लिए हैं।</li>\r\n\t\t<li>मरुभूमि राष्ट्रीय उद्यान ग्रेट इंडियन बस्टर्ड की गंभीर रूप से लुप्तप्राय प्रजातियों का घर है।</li>\r\n\t\t<li>इनके अलावा, राजस्थान बड़ी संख्या में तेंदुए, ब्लैकबक, ग्रेट इंडियन स्पॉटेड ईगल और मार्श मगरमच्छों का घर है। </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>कुम्भलगढ़ वन्यजीव अभयारण्य\r\n\t<ul>\r\n\t\t<li>लोकप्रिय, कुंभलगढ़ किले के आसपास, कुंभलगढ़ वन्यजीव अभयारण्य राजस्थान के राजसमंद जिले में स्थित है।</li>\r\n\t\t<li>अभयारण्य राजसमंद, उदयपुर और पाली जिलों के कुछ हिस्सों को कवर करते हुए 610.5 वर्ग किमी के क्षेत्र में फैला हुआ है।</li>\r\n\t\t<li>इसमें अरावली की चार पहाड़ी और पर्वत श्रृंखलाएँ भी शामिल हैं - कुम्भलगढ़ श्रृंखला; सादरी श्रृंखला; देसूरी श्रृंखला और बोखाड़ा श्रृंखला।</li>\r\n\t\t<li>राजस्थान में वन्यजीव अभयारण्य कुछ लुप्तप्राय प्रजातियों सहित विभिन्न प्रकार के जानवरों के घर होने के लिए जाना जाता है।</li>\r\n\t\t<li>अभयारण्य में शीर्ष शिकारी तेंदुआ है जो सांभर, नीलगाय, चौसिंघा (चार सींग वाला मृग), चिंकारा और भारतीय खरगोश जैसे जानवरों का शिकार करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 84, "question": "\r\n<p><strong>Find the misspelt word.</strong></p>", "option1": "\r\n<p>Pennetrate</p>", "option2": "\r\n<p>Irritate</p>", "option3": "\r\n<p>Hesitate</p>", "option4": "\r\n<p>Perforate</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The misspelt word is &#39;<strong>Pennetrate</strong>&#39;</p>\r\n\r\n<ul>\r\n\t<li>The correct spelling for the word is <strong><em>penetrate </em></strong>which means go into or through (something), especially with force or effort. (घुसना)\r\n\r\n\t<ul>\r\n\t\t<li><strong>Example - </strong><em>These fine particles <strong>penetrate </strong>deep into the lungs. </em></li>\r
