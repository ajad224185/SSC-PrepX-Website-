sitive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Denial of relief if the product is not up to the mark .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  2nd  sentence  from the  1st  paragraph:-</li>\r\n\t<li><em><em>&quot;Spreading awareness about the rights of consumers and relief open to them <strong>in case they did not get their money&#39;s worth of goods and services has rightly been identified as the first priority </strong>.&quot;</em></em></li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that  the consumer protection act proposes to give Consumer protection against the denial of relief if the product isn&#39;t up to the mark.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>Government contributed to the consumer Protection Movement by</p>", "option1": "\r\n<p>Enactment of the Consumer Protection Act</p>", "option2": "\r\n<p>Clearing the backlog cases in the consumer court</p>", "option3": "\r\n<p>Toning up a district-level redressal machinery</p>", "option4": "\r\n<p>Setting up infrastructure</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>Setting up infrastructure .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  3rd  sentence  from the  2nd  paragraph:-\r\n\t<ul>\r\n\t\t<li><em>&quot;Government efforts remain confined at best to <strong>set up the infrastructure </strong>after the formal launch of the movement with the enactment of the Consumer Protection Act.&quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that<strong>the </strong><strong>government contributed to the consumer Protection Movement by</strong>setting up infrastructure.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n<p>Role of consumer bodies is</p>", "option1": "\r\n<p>To maintain minimum standards of quality</p>", "option2": "\r\n<p>To function as a government</p>", "option3": "\r\n<p>To make a plea to industry to exercise self - control</p>", "option4": "\r\n<p>To exercise social control over the market</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>To exercise social control over the market .</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  2nd last  sentence  from the  2nd  paragraph:-\r\n\t<ul>\r\n\t\t<li><em>&quot;This is possible only if consumer bodies take over the watchdog role performed by the Government till now and exercise <strong>social control over the market </strong>to see the benefit of liberalization are not reaped by traders alone.&quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that<strong>the role of consumer bodies is to exercise social control over the market.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n<p>Spreading Consumer Protection Movement to the rural areas needs</p>", "option1": "\r\n<p>A multi-media approach</p>", "option2": "\r\n<p>Consumer organization to canvass this</p>", "option3": "\r\n<p>Message to be conveyed by village bodies</p>", "option4": "\r\n<p>Official patronage</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is A multi-media approach.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s have a look at the  1st  sentence  from the  2nd  paragraph - <em><em>&quot;While this may not be a difficult task in urban areas, where the movement is concentrated at present, taking it to the vast rural hinterland calls for a <strong>multi-media approach </strong>in which radio and television have a crucial role to play.&quot;</em></em></li>\r\n\t<li>Upon perusal of the above statement, it can be concluded that   spreading Consumer Protection Movement to the rural areas needsa multi-media approach.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p><strong>Select the option in which the word &lsquo;extravagant&rsquo; can be used in the same context as mentioned in the passage.</strong></p>", "option1": "\r\n<p>The doctor made some __________ assertions about his research on tropical diseases.</p>", "option2": "\r\n<p>The infrastructural changes of the department will cater to __________ and wastage of resources.</p>", "option3": "\r\n<p>My mother yelled at me for me being _________.</p>", "option4": "\r\n<p>In some countries, maintaining a healthy lifestyle is linked to being ________.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Option 1</strong>.</p>\r\n\r\n<ul>\r\n\t<li>To select the option in which the word <strong>extravagant </strong>has been used in the same context as mentioned in the passage, we first need to understand the context in which the word was used.</li>\r\n\t<li>The <strong>second </strong>and <strong>third </strong>line of the <strong>second </strong>paragraph from the given passage states that -\r\n\t<ul>\r\n\t\t<li><em>&#39;The idea came from a study done in 1993, which found that college students who listened to Mozart&rsquo;s Sonata for Two Pianos in D Major (K 448) showed modest improvement in a test of spatial reasoning. This finding was later stretched into something more <strong>extravagant </strong>by the musician and entrepreneur Don Campbell ...&#39;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Extravagant </strong>is an adjective that means <strong>excessive or elaborate. </strong></li>\r\n\t<li>So, in the passage &#39;<strong>extravagant&#39; </strong>has been used to explain how a modest improvement was taken out of proportions. </li>\r\n\t<li>Of the given sentences, this meaning is applicable in <strong>option 1 </strong>where a doctor has made assertions that are out of proportion regarding his research. </li>\r\n\t<li>So, <strong>option 1 </strong>is the correct answer.</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct sentence</u> - </strong><em>The doctor made some <strong><u>extravagant</u></strong>assertions about his research on tropical diseases.</em></p>\r\n\r\n<ul>\r\n\t<li>In <strong>option 2, </strong>the blank needs a noun and not an adjective. The noun form of <strong>extravagant </strong>which is <strong>extravagance </strong>can fit here.\r\n\r\n\t<ul>\r\n\t\t<li><em>The infrastructural changes of the department will cater to <strong>extravagance </strong>and wastage of resources.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Extravagant </strong>can also mean lacking restraint in spending money or using resources.</li>\r\n\t<li>This meaning is applicable for <strong>options 3 and 4.</strong>\r\n\t<ul>\r\n\t\t<li>My mother yelled at me for me being <strong>extravagant</strong>.</li>\r\n\t\t<li> In some countries, maintaining a healthy lifestyle is linked to being <strong>extravagant</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>In what way were the writer of the passage and the elderly uncle similar?</p>", "option1": "\r\n<p>They both loved reading books.</p>", "option2": "\r\n<p>They both attended the car launch.</p>", "option3": "\r\n<p>They knew and liked each other.</p>", "option4": "\r\n<p>They both believed in punctuality.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>They both believed in punctuality</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the second paragraph says &quot;<em>A few days later, I was reminded of the same scene as <strong>I arrived to attend a book launch at the exact time given on the invitation card</strong></em>&#39;&#39;, the fourth sentence of the second paragraph says &#39;&#39;<em><strong>Shortly, as one elderly uncle landed</strong>, he laughingly told the author, &quot;Had you mentioned 3 p.m., instead of 4 p.m., many would have been here already</em>&#39;&#39; and the last sentence of the second paragraph concludes &#39;&#39;<em>However, most guests arrived by 5.30 p.m., followed by the chief guest, a politician, who arrived by 6 p.m., and the event finally commenced, and <strong>early birds like me and the uncle</strong> heaved a sigh of relief</em>.&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that <strong>the writer of the passage and the elderly uncle were similar as they both believed in punctuality</strong>.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 4.</p>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>Who was getting the invitations printed?</p>", "option1": "\r\n<p>An Indian couple living in India, who wanted to get their son married in India.</p>", "option2": "\r\n<p>A non-Indian couple who wanted to get their son married in India.</p>", "option3": "\r\n<p>An Indian couple settled abroad, who wanted to get their son married in India.</p>", "option4": "\r\n<p>An Indian couple who wanted to get their son married abroad.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>An Indian couple settled abroad, who wanted to get their son married in India</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the passage says &quot;<em><strong>If you want guests to arrive from 7 p.m., get 6 p.m. mentioned on the card as this is India</strong> where most people prefer arriving late, certainly an hour or even later than the appointed time</em>&#39;&#39; and the second sentence of the first paragraph says &#39;&#39;<em>I couldn&#39;t agree more as I overheard this suggestion  by a young employee at a printing press to <strong>an NRI couple finalizing the wedding cards of their son</strong></em>. &#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that <strong>an Indian couple who settled abroad, who wanted to get their son married in India was getting the invitations printed</strong>.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>&quot;I couldn&#39;t agree more as I overheard this suggestion...&quot;</p>\r\n\r\n<p>What suggestion is being referred to here?</p>", "option1": "\r\n<p>The time should not be mentioned in an invitation.</p>", "option2": "\r\n<p>The guests should be told to come on time.</p>", "option3": "\r\n<p>If one wants the guests to come at a particular time, then one should mention the time as one hour before.</p>", "option4": "\r\n<p>In India, one should not feel bad if guests do not come at the time mentioned in the invitation.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>If one wants the guests to come at a particular time, then one should mention the time as one hour before</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The given passage is all about <strong>punctuality in life</strong>.</li>\r\n\t<li>The first sentence of the passage says &quot;<em><strong>If you want guests to arrive from 7 p.m., get 6 p.m. mentioned on the card</strong> as this is India where most people prefer arriving late, certainly an hour or even later than the appointed time</em>&#39;&#39; and the second sentence of the first paragraph says &#39;&#39;<em><strong>I couldn&#39;t agree more as I overheard this suggestion</strong> by a young employee at a printing press to an NRI couple finalizing the wedding cards of their son</em>.&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that the suggestion referred here is &#39;&#39;<strong>If one wants the guests to come at a particular time, then one should mention the time as one hour before</strong>.&#39;&#39;</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>\r\n\r\n<ul>\r\n\t<li>Given below are the points, we should keep in mind while solving questions of reading comprehension-\r\n\t<ul>\r\n\t\t<li>Identify the purpose of reading. Try to go through the question first then the passage so that you can just focus on the things you need to look at in the passage.</li>\r\n\t\t<li>Anticipate what may lie ahead. Look out for specific information in the passage.</li>\r\n\t\t<li>Read the passage quickly to get a general idea of meaning or to find specific information, e.g. figures or names.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>What lesson did the writer learn in Singapore?</p>", "option1": "\r\n<p>One could get a free ride to the University hostel.</p>", "option2": "\r\n<p>One should never miss a bus.</p>", "option3": "\r\n<p>Not being punctual has disadvantages.</p>", "option4": "\r\n<p>Being punctual earns you respect.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>Not being punctual has disadvantages</strong>.&#39;</p>\r\n\r\n<ul>\r\n\t<li>The first sentence of the fourth paragraph says &quot;<em><strong>Nearly a decade ago, when my schoolmates and I were busy shopping on our last day in Singapore after a week-long convention at a local university, our bus driver left us as we did not return to the bus at the time given by him</strong>, though we were late hardly by two or three minutes</em>&#39;&#39;, the second sentence of the fourth paragraph says &#39;&#39;<strong><em>We ended up shelling out dollars out of our pocket as we missed the free ride back to the university&#39;s hostel</em></strong>&#39;&#39; and the last sentence of the fourth paragraph says &#39;&#39;<em><strong>It was, of course, a lesson which certainly made me an early bird forever</strong>, and I know being one has many advantages in life!</em>&#39;&#39;</li>\r\n\t<li>From the above sentences, we can say that the lesson that the writer learnt in Singapore was not being punctual has disadvantages.</li>\r\n</ul>\r\n\r\n<p>Hence, the only possible answer is option 3.</p>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n<p>कंप्यूटर सिस्टम या नेटवर्क की सुरक्षा पर खतरे के प्रकार हैं:</p>\r\n\r\n<p>(i) व्यवधान</p>\r\n\r\n<p>(ii) अवरोध</p>\r\n\r\n<p>(iii) संशोधन</p>\r\n\r\n<p>(iv) सृजन</p>\r\n\r\n<p>(v) निर्माण</p>\r\n\r\n<p>निम्नलिखित में से कौन सा विकल्प सही है?</p>", "option1": "\r\n<p>केवल i, ii, iii और iv</p>", "option2": "\r\n<p>केवल ii, iii, iv और v</p>", "option3": "\r\n<p>केवल i, ii, iii और v</p>", "option4": "\r\n<p>सभी i, ii, iii, iv और v</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>केवल i, ii, iii और v</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>विभिन्न प्रकार के सुरक्षा हमले हैं जो नेटवर्क में संचार प्रक्रिया को प्रभावित करते हैं और वे इस प्रकार हैं:\r\n\t<ul>\r\n\t\t<li><strong>व्यवधान</strong>: इस प्रकार का हमला एक या अधिक प्रणालियों के बीच संचार प्रक्रिया के दौरान किसी भी प्रकार की बाधा के कारण होता है। तो जिन प्रणालियों का उपयोग किया जाता है वे अनधिकृत उपयोगकर्ताओं द्वारा इस हमले के बाद अनुपयोगी हो जाते हैं, जिसके परिणामस्वरूप सिस्टम का अपव्यय होता है।</li>\r\n\t\t<li><strong>अवरोधन</strong>: गोपनीयता की घटना इस प्रकार के हमले में महत्वपूर्ण भूमिका निभाती है। प्रेषक द्वारा भेजे गए डेटा या संदेश को एक अनधिकृत व्यक्ति द्वारा बाधित किया जाता है जहां संदेश को अलग-अलग रूप में बदल दिया जाएगा या इसका उपयोग व्यक्ति द्वारा उसकी दुर्भावनापूर्ण प्रक्रिया के लिए किया जाएगा। इसलिए इस प्रकार के हमले में संदेश की गोपनीयता खो जाती है।</li>\r\n\t\t<li><strong>संशोधन</strong>: जैसा कि नाम से संकेत मिलता है कि प्रेषक द्वारा भेजा गया संदेश संशोधित है और अनधिकृत उपयोगकर्ता द्वारा गंतव्य पर भेजा गया है। इस प्रकार के हमले से संदेश की अखंडता खो जाती है। रिसीवर उस सटीक संदेश को प्राप्त नहीं कर सकता है जो स्रोत द्वारा भेजा जाता है जिसके परिणामस्वरूप नेटवर्क का प्रदर्शन खराब होता है।</li>\r\n\t\t<li><strong>छलरचना</strong>: इस प्रकार के हमले में एक अनधिकृत उपयोगकर्ता द्वारा नेटवर्क में एक नकली संदेश डाला जाता है जैसे कि यह एक वैध उपयोगकर्ता है। इससे संदेश की गोपनीयता, प्रामाणिकता और अखंडता की हानि होती है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>इंटरनेट पर कंटेंट को सर्च करने के संदर्भ में निम्नलिखित में से कौन-सा तथ्य सत्य नहीं है?</p>", "option1": "\r\n<p>कोटेशन मार्क का उपयोग करना</p>", "option2": "\r\n<p>जटिल सर्च टर्म का उपयोग करना </p>", "option3": "\r\n<p>विशिष्ट कीवर्ड का उपयोग करना </p>", "option4": "\r\n<p>अपने सर्च इंजन को बदलना </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>जटिल सर्च टर्म का उपयोग करना</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>इंटरनेट </strong>को एक वर्ल्ड नेटवर्क के रूप में संदर्भित किया जाता है जो दुनिया भर के अरबों कंप्यूटरों को एक दूसरे से कनेक्ट करता है। यह दुनिया भर के अरबों कंप्यूटर या डिजिटल डिवाइस यूजर  को जोड़ने के लिए एक सामान्य<strong> वेब प्रोटोकॉल सूट (TCP/IP)</strong> का उपयोग करता है।</li>\r\n\t<li><strong>इंटरनेट</strong> कंप्यूटर का एक कलेक्शन है जो इनफार्मेशन शेयर  करता है।</li>\r\n\t<li>इंटरनेट के लिए कोई सेंट्रलाइज्ड एडमिनिस्ट्रेशन नहीं है, चाहे तकनीकी इम्प्लीमेंटेशन या पॉलिसीस के लिए, एक्सेस और उसे करने के लिए हो।</li>\r\n\t<li>इंटरनेट के लाखों छोटे घर, शैक्षिक, व्यवसाय और सरकारी नेटवर्क हैं।</li>\r\n\t<li><strong>इंटरनेट पर कंटेंट सर्च</strong> के लिए, यूजर को प्रश्न वाक्य के बाद <strong>कोटेशन मार्क</strong> का उपयोग करने की आवश्यकता होती है। इंटरनेट पर सर्च करने के लिए <strong>स्पेसिफिक कीवर्ड </strong>का उपयोग करना चाहिए। यूजर को<strong> जटिल सर्च टर्म</strong>से <strong>बचना</strong> चाहिए।</li>\r\n\t<li><strong>इंटरनेट</strong> का विकास <strong>1970</strong> में <strong>बॉब कहन</strong> और <strong>विंट सर्फ़</strong> द्वारा किया गया था। उन्होंने &#39;इंटरनेट&#39; की वजह से इन दिनों जो हम समझ रहे हैं उसकी योजना बनाना शुरू किया।</li>\r\n\t<li>शुरुआत में, इंटरनेट को <strong>ARPANET </strong>के रूप में जाना जाता था, जिसका अर्थ<strong> एडवांस्ड रिसर्च प्रोजेक्ट्स एजेंसी नेटवर्क</strong> है। यह अमेरिका के अमेरिका के संचय के लिए एक कम्युनिकेशन सिस्टम होने का अनुमान लगाया गया था - एक ऐसा नेटवर्क जो परमाणु हमले से भी बच सकता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>विंडोज (Windows) ऑपरेटिंग सिस्टम के बारे में निम्नलिखित में से कौन सा कथन गलत है?</p>", "option1": "\r\n<p>विंडोज एनटी (Windows NT) को ऑरेकल (Oracle) द्वारा विकसित किया और माइक्रोसॉफ्ट (Microsoft) द्वारा विपणित (marketed) किया गया था।</p>", "option2": "\r\n<p>विंडोज 10 (Windows 10) को 2015 में जारी किया गया था।</p>", "option3": "\r\n<p>विंडोज 1.0 (Windows 1.0) ऑपरेटिंग सिस्टम MS-DOS का एक एक्सटेंशन था।</p>", "option4": "\r\n<p>विंडोज एनटी (Windows NT) सक्रिय मल्टीटास्किंग (preemptive multitasking) को सपोर्ट करता है।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही विकल्प (1) है।</p>\r\n\r\n<p>विंडोज एनटी (Windows NT) को ऑरेकल (Oracle) द्वारा विकसित किया और माइक्रोसॉफ्ट (Microsoft) द्वारा विपणित (marketed) किया गया था।</p>\r\n\r\n<ul>\r\n\t<li>माइक्रोसॉफ्ट द्वारा निर्मित एक प्रोप्राइटरी ग्राफिकल ऑपरेटिंग सिस्टम, <strong>विंडोज NT</strong> का पहला वर्जन 27 जुलाई, 1993 को उपलब्ध कराया गया था।</li>\r\n\t<li>माइक्रोसॉफ्ट ने 29 जुलाई, 2015 को 1 जून को <strong>विंडोज 10 </strong>की रिलीज की तारीख की घोषणा की।</li>\r\n\t<li><strong>विंडोज 1.0 </strong>एक पूर्ण ऑपरेटिंग सिस्टम नहीं था; बल्कि, यह केवल पहले से उपलब्ध माइक्रोसॉफ्ट प्रोडक्ट MS-DOS में जोड़ा गया था।</li>\r\n\t<li><strong>MS-DOS </strong>के लिए एक ग्राफिकल यूजर इंटरफेस माइक्रोसॉफ्ट विंडोज का इनसिअल वर्जन था। फिर भी, यह प्रोडक्ट बाद के 1990 के दशक में पूरी तरह फंक्शनल और कंटेम्पररी ऑपरेटिंग सिस्टम में विकसित हुआ।</li>\r\n\t<li>विंडोज, मैकओएस, लिनक्स (एंड्रॉइड सहित) और iOS के नवीनतम वर्जन सहित आज के लगभग सभी ऑपरेटिंग सिस्टम <strong>प्रीमेप्टिव मल्टीटास्किंग </strong>को सक्षम करते हैं।</li>\r\n\t<li>माइक्रोसॉफ्ट विंडोज माइक्रोसॉफ्ट कारपोरेशन द्वारा बनाया गया एक पर्सनल कंप्यूटर ऑपरेटिंग सिस्टम (OS) है। इसे विंडोज और विंडोज OS (PC) के रूप में भी जाना जाता है।</li>\r\n\t<li>विंडोज OS ने तेजी से PC बाजार पर कन्ट्रोल कर लिया क्योंकि इसने IBM-कम्पेटिबल कंप्यूटरों के लिए पहला ग्राफिकल यूजर इंटरफेस (GUI) पेश किया।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n<p>निम्नलिखित में से किस विकल्प में MS-Office फ़ाइलों का एक्सटेंशन है?</p>", "option1": "\r\n<p>xlsx, docx, pdfx</p>", "option2": "\r\n<p>xlsx, docx, pptx</p>", "option3": "\r\n<p>xls, doc, pdf</p>", "option4": "\r\n<p>ppt, doc, pdf</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर है <u>xlsx, docx, pptx</u></p>\r\n\r\n<ul>\r\n\t<li><strong>.xlsx, .docx, .pptx, MS-Office फ़ाइलों के एक्सटेंशन हैं।</strong></li>\r\n\t<li>XLSX - एक एक्सेल वर्कबुक है।</li>\r\n\t<li>DOCX, Microsoft Office Open XML विनिर्देशन (जिसे OOXML या OpenXML के रूप में भी जाना जाता है) का हिस्सा है और इसे Office 2007 के साथ पेश किया गया था। DOCX एक zipped, XML- आधारित फ़ाइल स्वरूप है।Microsoft Word 2007 और बाद में एक नया दस्तावेज़ बनाते समय DOCX को डिफ़ॉल्ट फ़ाइल स्वरूप के रूप में उपयोग करें। विरासत DOC फ़ाइलों को लोड करने और सहेजने के लिए समर्थन भी शामिल है। (.docx - शब्द दस्तावेज़)</li>\r\n\t<li>PPTX - एक PowerPoint Open XML Presentation फ़ाइल है।</li>\r\n\t<li>Office Open XML (OOXML) प्रारूप Microsoft Office 2007 के साथ पेश किया गया था और तब से Microsoft Excel का डिफ़ॉल्ट प्रारूप बन गया। इस प्रारूप के एक्सेल-संबंधित फ़ाइल एक्सटेंशन में शामिल हैं: .xlsx, .xlsm, .xltx, .xltm।</li>\r\n\t<li>XLS &ndash; लिगेसी एक्सेल वर्कशीट; आधिकारिक तौर पर &quot;माइक्रोसॉफ्ट एक्सेल वर्कशीट&quot; नामित।</li>\r\n\t<li>DOC &ndash;  लिगेसी वर्ड डॉक्यूमेंट।</li>\r\n\t<li>पोर्टेबल दस्तावेज़ स्वरूप (पीडीएफ)  एडोब द्वारा विकसित एक फ़ाइल स्वरूप है।</li>\r\n\t<li>PPT - लीगेसी पॉवरपॉइंट प्रेजेंटेशन।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>प्राप्त ई-मेल पर निम्नलिखित में से कौन सी कार्रवाई नहीं की जा सकती है?</p>", "option1": "\r\n<p>ईमेल का जवाब देना</p>", "option2": "\r\n<p>अटैचमेंट जोड़ना</p>", "option3": "\r\n<p>ईमेल आगे भेजना</p>", "option4": "\r\n<p>ईमेल हटाना</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर विकल्प 2 है, अर्थात, <u><strong>अटैचमेंट जोड़ना</strong></u></p>\r\n\r\n<ul>\r\n\t<li>प्राप्तकर्ता को ईमेल भेजते समय <strong>अटैचमेंट</strong> जोड़ा जा सकता है।</li>\r\n\t<li><strong>इलेक्ट्रॉनिक मेल या ई-मेल</strong> इलेक्ट्रॉनिक उपकरणों का उपयोग करने वाले लोगों के बीच संदेशों का आदान-प्रदान करने की एक विधि है।</li>\r\n\t<li><strong>रे टॉमलिंसन</strong> को सार्वभौमिक रूप से <strong>1971 में ARPANET</strong> के एक कार्यक्रम के हिस्से के रूप में ई-मेल के निर्माता के रूप में श्रेय दिया गया।</li>\r\n\t<li>उन्होंने ARPANET के विभिन्न होस्ट पर उपयोगकर्ताओं के बीच मेल भेजने में सक्षम पहली प्रणाली विकसित की, जिसका उपयोग गंतव्य सर्वर के साथ उपयोगकर्ता नाम को जोड़ने के लिए <strong>@ साइन</strong> का उपयोग किया।</li>\r\n\t<li><strong>1970 के</strong> दशक के मध्य तक, यह ईमेल के रूप में मान्यता प्राप्त रूप था।</li>\r\n\t<li>ईमेल कंप्यूटर नेटवर्क पर मुख्य रूप से <strong>इंटरनेट</strong> संचालित करता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>Ctrl + X&#39; शॉर्टकट कुंजियों (shortcut key) का उपयोग _______ के लिए किया जाता है।</p>", "option1": "\r\n<p>क्लिपबोर्ड के कंटेंट को पेस्ट करने</p>", "option2": "\r\n<p>डॉक्यूमेंट से चयनित टेक्स्ट की फॉर्मेटिंग को कॉपी (copy) करने</p>", "option3": "\r\n<p>डॉक्यूमेंट से चयनित टेक्स्ट को कट (cut) करने और क्लिपबोर्ड पर रखने</p>", "option4": "\r\n<p>डॉक्यूमेंट से चयनित टेक्स्ट को कॉपी (copy) करने और क्लिपबोर्ड पर रखने</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही विकल्प (3) है। </p>\r\n\r\n<p>डॉक्यूमेंट से चयनित टेक्स्ट को कट (cut) करने और क्लिपबोर्ड पर रखने</p>\r\n\r\n<ul>\r\n\t<li>Control + x कंट्रोल की और एक की का कॉम्बिनेशन है जिसे अक्सर कंप्यूटर टर्मिनोलॉजी में &quot;x&quot; (लोअर-केस अक्षर ex) कहा जाता है।</li>\r\n\t<li>यह कॉम्बिनेशन आम तौर पर चुने हुए टेक्स्ट को कट करने और इसे क्लिपबोर्ड पर सेव करने के लिए उपयोग किया जाता है ताकि इसे कहीं और पेस्ट किया जा सके।</li>\r\n\t<li>Ctrl+X, जिसे Control+X और C-x, X के रूप में भी जाना जाता है, एक कीबोर्ड शॉर्टकट है जिसका उपयोग अक्सर टेक्स्ट, इमेज या किसी अन्य ऑब्जेक्ट के सिलेक्टेड एरिया को कट करने के लिए किया जाता है।</li>\r\n\t<li>यदि आप गलती से कुछ कट कर देते हैं, तो आप अपनी लास्ट  एक्शन को अनडू कर सकते हैं और ऑब्जेक्ट को Ctrl + Z दबाकर रिकवर कर सकते हैं।</li>\r\n</ul>\r\n\r\n<p>ये शॉर्टकट टेक्स्ट प्रोसेसिंग और विशेष रूप से फ़ाइल मैनेजमेंट टास्क  के लिए काम आते हैं।</p>\r\n\r\n<ul>\r\n\t<li>Ctrl-S का उपयोग करके सेव करें।</li>\r\n\t<li>Ctrl-O का उपयोग करके ओपन करें।</li>\r\n\t<li>नया (Ctrl-N)।</li>\r\n\t<li>Ctrl-C से कॉपी करें।</li>\r\n\t<li>Ctrl-V का उपयोग करके पेस्ट करें।</li>\r\n\t<li>Ctrl-X के साथ स्निप करें।</li>\r\n\t<li>Ctrl-Z दबाकर अनडू किया जा सकता है।</li>\r\n\t<li>सभी को Ctrl-A से स्ट्राइक करें।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n<p>________ एक अस्थायी मेमोरी है।</p>", "option1": "\r\n<p>रैंडम एक्सेस मेमोरी </p>", "option2": "\r\n<p>रीड एस मेमोरी </p>", "option3": "\r\n<p>रीड एक्सेस मेमोरी</p>", "option4": "\r\n<p>रैंडम एस मेमोरी </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u>रैंडम एक्सेस मेमोरी</u> है।</p>\r\n\r\n<ul>\r\n\t<li><u> रैंडम एक्सेस मेमोरी (रैम)</u>\r\n\r\n\t<ul>\r\n\t\t<li>यह सीधे प्रोसेसर को आवश्यक जानकारी प्रदान करता है।</li>\r\n\t\t<li>RAM एक वोलेटाइल मेमोरी है।</li>\r\n\t\t<li>यह डेटा और निर्देशों के लिए अस्थायी भंडारण प्रदान करता है।</li>\r\n\t\t<li>RAM को दो श्रेणियों में वर्गीकृत किया गया है:</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li>स्टेटिक रैंडम एक्सेस मेमोरी</li>\r\n\t<li>डायनेमिक रैंडम एक्सेस मेमोरी।</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li><u>रीड ओनली मेमोरी (ROM)</u>\r\n\r\n\t<ul>\r\n\t\t<li>इसका उपयोग मानक प्रसंस्करण कार्यक्रमों को संग्रहीत करने के लिए किया जाता है जो स्थायी रूप से कंप्यूटर में रहते हैं।</li>\r\n\t\t<li>आमतौर पर, डिज़ाइनर निर्माण सर्किट के समय ROM चिप्स प्रोग्राम करते हैं।</li>\r\n\t\t<li>यह एक गैर-वोलेटाइल मेमोरी है।</li>\r\n\t\t<li>इसे सिर्फ पढ़ा जा सकता है लिखा नहीं जा सकता।</li>\r\n\t\t<li>ROM को तीन श्रेणियों में वर्गीकृत किया गया है:</li>\r\n\t</ul>\r\n\r\n\t<ol>\r\n\t\t<li>प्रोग्राम करने योग्य ROM</li>\r\n\t\t<li>इरेज़ेबल प्रोग्रामेबल ROM</li>\r\n\t\t<li>इलेक्ट्रिकल इरेजेबल प्रोग्रामेबल ROM</li>\r\n\t</ol>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n<p>मैग्नेटिक स्टोरेज उपकरण का उदाहरण क्या है?</p>", "option1": "\r\n<p>OMR</p>", "option2": "\r\n<p>हार्ड डिस्क</p>", "option3": "\r\n<p>CD-रोम डिस्क</p>", "option4": "\r\n<p>मेमोरी स्ट्रिप</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर<u>2</u> है अर्थात <strong><u>हार्ड डिस्क</u></strong></p>\r\n\r\n<ul>\r\n\t<li>बड़ी मात्रा में डेटा संगृहीत करने के लिए <strong>मैग्नेटिक स्टोरेज</strong> सबसे किफायती तरीकों में से एक है।</li>\r\n\t<li><strong>मैग्नेटिक स्टोरेज</strong> दो प्रकार के चुंबकीय ध्रुवों का उपयोग करता है जो शून्य और एक से मिलकर बाइनरी जानकारी को दर्शाते हैं।</li>\r\n\t<li><strong>मैग्नेटिक स्टोरेज उपकरण</strong> डिस्क या टेप पर कणों को चुम्बकित करके डेटा संग्रहीत करते हैं। आमतौर पर उपयोग किए जाने वाले उपकरण जो मैग्नेटिक स्टोरेज का उपयोग करते हैं उनमें <strong>मैग्नेटिक  टेप, फ्लॉपी डिस्क </strong>और <strong>हार्ड-डिस्क ड्राइव</strong> शामिल हैं।</li>\r\n\t<li><strong>हार्ड डिस्क</strong> मैग्नेटिक <strong>डिस्क </strong>की एक धुरी है, जिसे प्लैटर्स कहा जाता है, जो जानकारी को रिकॉर्ड और संगृहीत करता है। चूंकि डेटा चुंबकीय रूप से संग्रहीत होता है, आपके कंप्यूटर को बंद करने के बाद हार्ड डिस्क में रिकॉर्ड की गई जानकारी बरकरार रहती है।</li>\r\n\t<li><strong>हार्ड ड्राइव</strong> का एक <strong>उदाहरण </strong>डेस्कटॉप कंप्यूटर पर वह स्थान है जहां कोई व्यक्ति अपने शोध पत्र को सहेज सकता है।</li>\r\n\t<li>IBM ने पहला व्यावसायिक <strong>हार्ड डिस्क </strong>ड्राइव-आधारित कंप्यूटर बनाया और इसे <strong>RAMAC </strong>कहा गया जिसका पूर्ण रूप - &quot;रैंडम एक्सेस मेथड ऑफ़ अकाउंटिंग एंड कंट्रोल&quot; है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>समान नेटवर्क पर एक ब्रिज की स्टेशन के _____ एड्रेस तक पहुंच होती है।</p>", "option1": "\r\n<p>भौतिक (मैक)</p>", "option2": "\r\n<p>नेटवर्क</p>", "option3": "\r\n<p>सर्विस एक्सेस पॉइंट</p>", "option4": "\r\n<p>उपरोक्त सभी</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही जवाब है <u><strong>भौतिक (मैक)</strong></u></p>\r\n\r\n<ul>\r\n\t<li>चाहे आप एक <strong>वायर्ड नेटवर्क</strong> कार्यालय / घर में काम करते हैं या <strong>वायरलेस</strong>, दोनों वातावरणों के लिए एक चीज सामान्य है: यह आपके कंप्यूटर से <strong>डेटा</strong> को दूसरे कंप्यूटर पर <strong>स्थानांतरित</strong> करने के लिए <strong>नेटवर्क सॉफ़्टवेयर</strong> और <strong>हार्डवेयर</strong> (केबल, राउटर, आदि) लेता है। कंप्यूटर आपके पास हजारों मील दूर है। और अंत में, जिस डेटा को आप सही चाहते हैं, उसे प्राप्त करने के लिए, यह <strong>पते पर</strong> नीचे आता है।</li>\r\n\t<li>तो आश्चर्य की बात नहीं है, एक <strong>आईपी पते</strong> (जो नेटवर्क सॉफ्टवेयर है) के साथ, एक <strong>हार्डवेयर पता</strong> भी है। आमतौर पर यह आपके कंप्यूटर में एक प्रमुख <strong>कनेक्शन डिवाइस</strong> से जुड़ा होता है जिसे <strong>नेटवर्क इंटरफेस कार्ड</strong> या <strong>एनआईसी</strong> कहा जाता है। एनआईसी अनिवार्य रूप से एक कंप्यूटर सर्किट कार्ड है जो आपके कंप्यूटर को नेटवर्क से कनेक्ट करना संभव बनाता है।</li>\r\n\t<li>एक <strong>एनआईसी एक विद्युत सिग्नल में डेटा को बदल देता है</strong> जिसे नेटवर्क पर प्रेषित किया जा सकता है। प्रत्येक एनआईसी में एक हार्डवेयर पता होता है जिसे <strong>मीडिया एक्सेस कंट्रोल के</strong> लिए <strong>मैक के</strong> रूप में जाना जाता है। जहां IP पते <strong>टीसीपी / आईपी</strong> (नेटवर्किंग सॉफ्टवेयर) से जुड़े हैं, वहीं <strong>मैक पते नेटवर्क एडेप्टर</strong> के <strong>हार्डवेयर से</strong> जुड़े हैं।</li>\r\n\t<li><strong>निर्मित होने पर नेटवर्क एडॉप्टर को मैक एड्रेस दिया जाता है</strong> । यह आपके कंप्यूटर के नेटवर्क इंटरफेस कार्ड (NIC) पर हार्ड-कोड या हार्ड-कोडेड है और इसके लिए <strong>अद्वितीय</strong> है। <strong>एआरपी (एड्रेस रेजोल्यूशन प्रोटोकॉल)</strong> नामक कुछ <strong>आईपी एड्रेस को मैक एड्रेस में ट्रांसलेट करता है</strong> । एआरपी एक पासपोर्ट की तरह है जो कंप्यूटर हार्डवेयर के वास्तविक टुकड़े के माध्यम से आईपी पते से डेटा लेता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>निम्नलिखित में से कौन सी अति उच्च गति अर्द्धचालक मेमोरी है जो CPU की गति को बढ़ा सकती है?</p>", "option1": "\r\n<p>प्राथमिक मेमोरी</p>", "option2": "\r\n<p>मुख्य मेमोरी</p>", "option3": "\r\n<p>द्वितीयक मेमोरी</p>", "option4": "\r\n<p>कैश मेमोरी</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>&bull; कैश मेमोरी, एक उच्च स्पीड अर्द्धचालक मेमोरी है, जो सीपीयू की गति बढ़ा देती है। यह सीपीयू और मुख्य मेमोरी के बीच एक बफर के रूप में कार्य करती है। कैश मेमोरी का उपयोग यूजर द्वारा दिए गए इनपुट को संग्रहीत करने के लिए किया जाता है। यह सबसे तेज मेमोरी है जो कम्प्यूटर माइक्रोप्रोसेसर को हाई-स्पीड डेटा एक्सेस प्रदान करती है।</p>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>कंप्यूटर की इनपुट डिवाइस से संबंधित निम्नलिखित में से कौन सा कथन गलत है?</p>", "option1": "\r\n<p>ये इनपुट डाटा को डिजिटल रूप में रूपांतरित करती हैं।</p>", "option2": "\r\n<p>कीबोर्ड के माध्यम से प्रविष्ट डाटा सीधे मेमोरी डाटा रजिस्टर (MDR) में ट्रांसफर कर दिया जाता है।</p>", "option3": "\r\n<p>माउस एक इनपुट डिवाइस है।</p>", "option4": "\r\n<p>इनका उपयोग कंप्यूटर को डाटा भेजने के लिए किया जाता है।</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही विकल्प (2) है।</p>\r\n\r\n<p>कीबोर्ड के माध्यम से प्रविष्ट डाटा सीधे मेमोरी डाटा रजिस्टर (MDR) में ट्रांसफर कर दिया जाता है।</p>\r\n\r\n<ul>\r\n\t<li>इनपुट डिवाइस में कीबोर्ड, स्कैनर, माइस, जॉयस्टिक और डिजिटल कैमरे शामिल हैं।</li>\r\n\t<li>इनपुट डिवाइस, जो लोगों से डेटा एक्सेप्ट करने के लिए उपयोग किया जाने वाला हार्डवेयर है, को कंप्यूटर की इनपुट यूनिट कहा जाता है। ह्यूमन इनपुट को डेटा में बदल दिया जाता है जिसे कंप्यूटर इनपुट डिवाइस द्वारा समझ सकते हैं।</li>\r\n\t<li>कंप्यूटर में डेटा एंटर करने के लिए सबसे लगातार और अच्छी तरह से पसंद की जाने वाली इनपुट मेथड कीबोर्ड है।</li>\r\n\t<li>टेक्स्ट, फोटो, वीडियो और साउंड सभी को इनपुट डिवाइस का उपयोग करके कंप्यूटर सिस्टम में सबमिट किया जा सकता है। टेक्स्ट एंटर करने का सबसे लोकप्रिय तरीका कीबोर्ड है।</li>\r\n\t<li>एक इनपुट डिवाइस कंप्यूटर हार्डवेयर का एक टुकड़ा है जिसका उपयोग डेटा प्रोसेसिंग सिस्टम, जैसे कंप्यूटर या इनफार्मेशन एप्लायंस को कण्ट्रोल और डेटा सिग्नल प्रदान करने के लिए किया जाता है।</li>\r\n\t<li>मेमोरी डेटा रजिस्टर (MDR): स्टोर डेटा जिसे मैन मेमोरी में ट्रांसफर करने की आवश्यकता होती है या MAR में स्टोर एड्रेस  पर कंटेंट।</li>\r\n\t<li>इंस्ट्रक्शन जो वर्तमान में डिकोड और एक्सेक्यूट किया जा रहा है, करेंट इंस्ट्रक्शन रजिस्टर (CIR) में स्टोर्ड है। प्रोसेसिंग के रिजल्ट  अक्सुमुलेटर (ACC) में स्टोर होते हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n<p>आधा बाइट को कहा जाता है:</p>", "option1": "\r\n<p>बाइट</p>", "option2": "\r\n<p>निबल </p>", "option3": "\r\n<p>बिट </p>", "option4": "\r\n<p>वर्ड साइज </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>निबल</strong> है।</p>\r\n\r\n<ul>\r\n\t<li>आधे बाइट को <strong>निबल</strong> कहा जाता है।</li>\r\n\t<li>बिट स्टोरेज की सबसे छोटी इकाई है।</li>\r\n\t<li>एक बिट सिर्फ 0 या 1 स्टोर करता है।</li>\r\n\t<li>कंप्यूटर डेटा को स्टोर करने और निर्देशों को बिट गुणकों में निष्पादित करने के लिए डिज़ाइन किए गए हैं जिन्हें बाइट्स कहा जाता है।</li>\r\n\t<li><u>एक निबल 4 बिट के बराबर होता है</u> ।</li>\r\n\t<li>कंप्यूटर स्टोरेज और मेमोरी को अक्सर मेगाबाइट्स (एमबी) और गीगाबाइट्स (जीबी) में मापा जाता है।\r\n\t<ul>\r\n\t\t<li>1 किलोबाइट (KB) = 1024 बाइट्स</li>\r\n\t\t<li>1 मेगाबाइट (एमबी) = 1024 किलोबाइट</li>\r\n\t\t<li>1 गीगाबाइट (जीबी) = 1024 मेगाबाइट</li>\r\n\t\t<li>1 टेराबाइट (टीबी) = 1024 गीगाबाइट</li>\r\n\t\t<li>1 पेटाबाइट (PB) = 1024 टेराबाइट्स</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>वेब ब्राउज़िंग के संदर्भ में बुकमार्क का उद्देश्य क्या है?</p>", "option1": "\r\n<p>विशिष्ट वेबसाइटों को सेव करना और व्यवस्थित करना ताकि आप उन पर बार-बार जा सकें।</p>", "option2": "\r\n<p>उन वेबसाइटों के माध्यम से आगे बढ़ना जिन्हें आपने हाल ही में देखा है।</p>", "option3": "\r\n<p>किसी वेबसाइट से अपने कंप्यूटर पर एक छवि सेव करना।</p>", "option4": "\r\n<p>छोटे एप्लिकेशन प्लग-इन करना जो आपको अपने वेब ब्राउज़र में विशेष प्रकार की सामग्री देखने की अनुमति देते हैं।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>विशिष्ट वेबसाइटों को सेव करना और व्यवस्थित करना ताकि आप उन पर बार-बार जा सकें</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>बुकमार्क एक वेब पेज के लिए एक प्लेसहोल्डर है जो आपको उस पेज को ब्राउज़ करने या खोजने के बजाय जल्दी से एक्सेस करने (पहुंचने) की अनुमति देता है।\r\n\t<ul>\r\n\t\t<li>वेब पेज टाइप करने के बजाय, बुकमार्क पर क्लिक करने से आप तुरंत उस पेज पर पहुंच जाएंगे।</li>\r\n\t\t<li>वर्ल्ड वाइड वेब ब्राउज़र का उपयोग करते हुए, <strong>बुकमार्क एक वेब पेज के लिए एक सेव किया गया लिंक है जिसे सेव किए गए लिंक की सूची में जोड़ा गया है।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>समान प्रोटोकॉल के नेटवर्क को जोड़ने के लिए, निम्नलिखित में से किसका उपयोग किया जाता है?</p>", "option1": "\r\n<p>राउटर्स</p>", "option2": "\r\n<p>स्विच</p>", "option3": "\r\n<p>गेटवे</p>", "option4": "\r\n<p>डायल-अप राउटर</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>विकल्प 2 है</strong> , अर्थात, <u><strong>स्विच</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>पुनरावर्तक</strong> - एक पुनरावर्तक भौतिक परत पर संचालित होता है। इसका काम सिग्नल को बहुत कमजोर या दूषित होने से पहले उसी नेटवर्क पर सिग्नल को फिर से प्राप्त करना है ताकि लंबाई को बढ़ाया जा सके जिससे सिग्नल उसी नेटवर्क पर प्रेषित किया जा सके। रिपीटर्स के बारे में ध्यान देने योग्य एक महत्वपूर्ण बात यह है कि वे सिग्नल को नहीं बढ़ाते हैं। जब सिग्नल कमजोर हो जाता है, तो वे सिग्नल को बिट द्वारा कॉपी करते हैं और इसे मूल ताकत पर पुन: उत्पन्न करते हैं। यह एक 2 पोर्ट डिवाइस है।</li>\r\n\t<li><strong>हब</strong> - एक हब मूल रूप से एक मल्टीपॉर्ट रिपीटर है। एक हब विभिन्न शाखाओं से आने वाले कई तारों को जोड़ता है, उदाहरण के लिए, स्टार टोपोलॉजी में कनेक्टर जो विभिन्न स्टेशनों को जोड़ता है। हब डेटा को फ़िल्टर नहीं कर सकते, इसलिए डेटा पैकेट सभी कनेक्टेड डिवाइसों को भेजे जाते हैं। दूसरे शब्दों में, हब के माध्यम से जुड़े सभी मेजबानों की टक्कर डोमेन एक बनी हुई है। इसके अलावा, उनके पास डेटा पैकेट के लिए सबसे अच्छा रास्ता खोजने के लिए बुद्धि नहीं है जो अक्षमता और अपव्यय की ओर जाता है।</li>\r\n\t<li><strong>ब्रिज</strong> - डेटा लिंक लेयर पर एक ब्रिज संचालित होता है। एक पुल एक पुनरावर्तक है, जिसमें स्रोत और गंतव्य के मैक पते को पढ़कर सामग्री को छानने की कार्यक्षमता पर जोड़ है। इसका उपयोग एक ही प्रोटोकॉल पर काम करने वाले दो LAN को आपस में जोड़ने के लिए भी किया जाता है। इसमें एक एकल इनपुट और एकल आउटपुट पोर्ट है, इस प्रकार यह 2 पोर्ट डिवाइस बनाता है।</li>\r\n\t<li><strong>स्विच</strong> - एक स्विच एक बफर और डिजाइन के साथ एक मल्टीपोर्ट पुल है जो इसकी दक्षता (बड़ी संख्या में बंदरगाहों को कम यातायात) और प्रदर्शन को बढ़ावा दे सकता है। एक स्विच एक डेटा लिंक लेयर डिवाइस है। स्विच डेटा को अग्रेषित करने से पहले त्रुटि की जाँच कर सकता है, जो इसे बहुत ही कुशल बनाता है क्योंकि यह पैकेट को अग्रेषित नहीं करता है जिसमें त्रुटियां होती हैं और केवल अच्छे पोर्ट के लिए अच्छे पैकेट को अग्रेषित करता है। दूसरे शब्दों में, स्विच मेजबान के टकराव के डोमेन को विभाजित करता है, लेकिन प्रसारण डोमेन वही रहता है।</li>\r\n\t<li><strong>राउटर</strong> - एक राउटर एक स्विच की तरह का एक उपकरण है जो अपने आईपी पते के आधार पर डेटा पैकेट को रूट करता है। राउटर मुख्य रूप से एक नेटवर्क लेयर डिवाइस है। राउटर सामान्य रूप से LAN और WAN को एक साथ जोड़ते हैं और उनके पास डायनामिक रूप से अपडेट करने वाली राउटिंग टेबल होती है, जिसके आधार पर वे डेटा पैकेट को रुट करने पर निर्णय लेते हैं। राउटर इसके माध्यम से जुड़े मेजबानों के प्रसारण डोमेन को विभाजित करता है।</li>\r\n\t<li><strong>गेटवे</strong> - एक प्रवेश द्वार, जैसा कि नाम से पता चलता है, दो नेटवर्क को एक साथ जोड़ने के लिए एक मार्ग है जो विभिन्न नेटवर्किंग मॉडल पर काम कर सकता है। वे मूल रूप से मैसेंजर एजेंट के रूप में काम करते हैं जो एक सिस्टम से डेटा लेते हैं, इसकी व्याख्या करते हैं, और इसे दूसरे सिस्टम में स्थानांतरित करते हैं। गेटवे को प्रोटोकॉल कन्वर्टर्स भी कहा जाता है और यह किसी भी नेटवर्क लेयर पर काम कर सकता है। गेटवे आमतौर पर स्विच या राउटर की तुलना में अधिक जटिल होते हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>FTP का पूर्ण रूप है?</p>", "option1": "\r\n<p>फाइल ट्रांसफर प्रोग्राम </p>", "option2": "\r\n<p>फाइल ट्रांसफर प्रोटोकॉल</p>", "option3": "\r\n<p>फाइल ट्रांसफर पोर्ट </p>", "option4": "\r\n<p>फाइल ट्रांसफर पिन </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>फाइल ट्रांसफर प्रोटोकॉल</strong></u> है। </p>\r\n\r\n<ul>\r\n\t<li><u><strong>FTP का अर्थ</strong></u><u><strong>फाइल ट्रांसफर प्रोटोकॉल है </strong></u>और, जैसा कि नाम बताता है, यह कम्प्यूटर्स के बीच में फाइल्स के आदान-प्रदान का एक तरीका है। \r\n\r\n\t<ul>\r\n\t\t<li>यह उन अद्भुत कंप्यूटर शब्दों में से एक है जो संज्ञा और क्रिया दोनों हैं।</li>\r\n\t\t<li>संज्ञा के रूप में, FTP फ़ाइलों को भेजने की एक विधि का नाम है, लेकिन उस प्रोग्राम का नाम भी है जो वास्तव में फाइलें भेजता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>मूल रूप से, <strong>FTP</strong> को पुराने टेक्स्ट-आधारित कंप्यूटरों और कंप्यूटरों के प्री-ग्राफिकल युग के नेटवर्क (1980 के दशक के मध्य से पहले) में <strong>फाइल भेजने और प्राप्त करने के लिए विकसित किया गया था।</strong></li>\r\n\t<li>फ़ाइलें प्राप्त करने या फ़ाइलों को रखने या भेजने के लिए <strong>नेटवर्क पर किसी दूरस्थ कंप्यूटर तक पहुँचने के लिए</strong> आप FTP का उपयोग करते हैं।</li>\r\n\t<li>आधुनिक संदर्भ में, विंडोज में FTP का उपयोग करना नेटवर्क कंप्यूटर पर रिमोट फ़ोल्डर के लिए विंडोज एक्सप्लोरर विंडो खोलने के समान है।</li>\r\n\t<li>इंटरनेट पर एक कंप्यूटर जो FTP एक्सेस की पेशकश करता है उसे <strong>FTP होस्ट या FTP सर्वर</strong> कहा जाता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>निम्नलिखित में से कौन सा इनपुट और आउटपुट डिवाइस दोनों है?</p>", "option1": "\r\n<p>टच स्क्रीन</p>", "option2": "\r\n<p>LCD प्रजेक्टर पैनल</p>", "option3": "\r\n<p>ऑडियो कार्ड</p>", "option4": "\r\n<p>प्रिण्टर</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही विकल्प (1) है।</strong></p>\r\n\r\n<p>टच स्क्रीन</p>\r\n\r\n<ul>\r\n\t<li>एक टचस्क्रीन या टच स्क्रीन इनपुट के लिए एक टच पैनल और आउटपुट के लिए एक डिस्प्ले का संयोजन है।</li>\r\n\t<li>माउस, टचपैड, या अन्य समान डिवाइसों का उपयोग करने के बजाय, यूजर टचस्क्रीन के लिए जो प्रदर्शित किया गया है, उसके साथ सीधे इंटरैक्ट कर सकता है।</li>\r\n\t<li>गेमिंग कंसोल, लैपटॉप, इलेक्ट्रॉनिक वोटिंग मशीन और पॉइंट-ऑफ-सेल (POS) सिस्टम जैसे डिवाइसों में अक्सर टचस्क्रीन होते हैं।</li>\r\n</ul>\r\n\r\n<p><strong> LCD प्रोजेक्टर पैनल:-</strong> हालांकि यह अब निर्मित नहीं होता है, एक प्रोजेक्शन पैनल-जिसे ओवरहेड डिस्प्ले या LCD पैनल के रूप में भी जाना जाता है-एक बार डेटा प्रोजेक्टर के स्थान पर उपयोग किया जाता था। ओवरहेड प्रोजेक्टर के साथ, यह फंक्शन करता है। पैनल पर पारभासी LCD को ठंडा रखने के लिए पंखे का उपयोग किया जाता है।</p>\r\n\r\n<p><strong>ऑडियो कार्ड:-</strong> साउंड कार्ड, जिसे अक्सर ऑडियो कार्ड के रूप में जाना जाता है, एक ऐड-ऑन कम्पोनन्ट है जो मदरबोर्ड पर ISA या PCI स्लॉट में प्लग करता है ताकि कंप्यूटर को ध्वनि प्राप्त करने, प्रोसेस करने और आउटपुट करने की अनुमति मिल सके।</p>\r\n\r\n<p>जॉयस्टिक: जॉयस्टिक एक इनपुट डिवाइस है जिसका उपयोग कंप्यूटर डिवाइस में कर्सर या पॉइंटर की गति को नियंत्रित करने के लिए किया जा सकता है । जॉयस्टिक पर लीवर को घुमाकर पॉइंटर/कर्सर की गति को नियंत्रित किया जाता है।</p>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>निम्नलिखित में से कौन डिजिटल भुगतान प्रणाली में शामिल हैं?</p>\r\n\r\n<p>ए) आरटीजीएस</p>\r\n\r\n<p>बी) डिमांड ड्राफ्ट</p>\r\n\r\n<p>सी) एनईएफटी</p>\r\n\r\n<p>डी) जाँच करें</p>\r\n\r\n<p>निम्नलिखित में से सही विकल्प चुनें:</p>", "option1": "\r\n<p>a, c और d</p>", "option2": "\r\n<p>केवल b और d </p>", "option3": "\r\n<p>केवल a और c</p>", "option4": "\r\n<p>b, c और d</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>डिजिटल भुगतान:</strong> एक डिजिटल भुगतान तब होता है जब विभिन्न इलेक्ट्रॉनिक माध्यमों के उपयोग के माध्यम से वस्तुओं या सेवाओं को खरीदा जाता है। इस प्रकार की भुगतान पद्धति में नकद या चेक का उपयोग नहीं होता है।</p>\r\n\r\n<p><strong>भारत में 10 प्रकार के डिजिटल भुगतान के तरीके</strong></p>\r\n\r\n<ol>\r\n\t<li>बैंकिंग कार्ड</li>\r\n\t<li>यू.एस.एस. डी</li>\r\n\t<li>आधार सक्षम भुगतान प्रणाली (AEPS)</li>\r\n\t<li>है मैं</li>\r\n\t<li>मोबाइल वॉलेट</li>\r\n\t<li>बैंक प्री-पेड कार्ड</li>\r\n\t<li>पॉइंट ऑफ़ सेल (PoS)</li>\r\n\t<li>अंतराजाल लेन - देन</li>\r\n\t<li>मोबाइल बैंकिंग</li>\r\n\t<li>भारत इंटरफेस फॉर मनी (BHIM) ऐप</li>\r\n</ol>\r\n\r\n<p><strong>अंतराजाल लेन - देन:</strong></p>\r\n\r\n<ol>\r\n\t<li><strong>इंटरनेट बैंकिंग से तात्पर्य बैंकिंग लेनदेन को ऑनलाइन</strong> करने की प्रक्रिया से है।</li>\r\n\t<li>इनमें कई सेवाएं शामिल हो सकती हैं जैसे कि फंड ट्रांसफर करना, नया फिक्स्ड या आवर्ती जमा करना, खाता बंद करना आदि।इंटरनेट बैंकिंग को ई-बैंकिंग या वर्चुअल बैंकिंग भी कहा जाता है। <strong>इंटरनेट बैंकिंग का इस्तेमाल आमतौर पर एनईएफटी, आरटीजीएस या आईएमपीएस के</strong> जरिए ऑनलाइन फंड ट्रांसफर करने के लिए किया जाता है।</li>\r\n\t<li>बैंक अपनी वेबसाइट के माध्यम से ग्राहकों को सभी प्रकार की बैंकिंग सेवाएं प्रदान करते हैं और एक उपयोगकर्ता नाम और पासवर्ड का उपयोग करके अपने खाते में प्रवेश कर सकता है।</li>\r\n\t<li>एक भौतिक बैंक का दौरा करने के विपरीत, इंटरनेट बैंकिंग सेवाओं के लिए समय प्रतिबंध हैं और उन्हें किसी भी समय और वर्ष में सभी 365 दिनों पर लाभ उठाया जा सकता है।</li>\r\n</ol>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n<p>पर्सनल कंप्यूटर का CPU _______ होता है।</p>", "option1": "\r\n<p>ROM</p>", "option2": "\r\n<p>माइक्रोकन्ट्रोलर</p>", "option3": "\r\n<p>RAM</p>", "option4": "\r\n<p>माइक्रोप्रोसेसर</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सेंट्रल प्रोसेसिंग यूनिट (CPU)</p>\r\n\r\n<ul>\r\n\t<li>यह कंप्यूटर का मुख्य भाग है। <strong>CPU चिप या मुख्य प्रोसेसर</strong> कंप्यूटर का वह भाग है जो सभी निर्देशों या कार्यक्रमों का पालन या निष्पादन करता है।</li>\r\n\t<li><strong>सेंट्रल प्रोसेसिंग यूनिट (सीपीयू)</strong>, किसी भी डिजिटल कंप्यूटर सिस्टम का प्रमुख भाग, सामान्यत: <strong>मुख्य मेमोरी, कंट्रोल यूनिट और अंकगणित-तर्क इकाई से बना होता है।</strong></li>\r\n\t<li>यह पूरे कंप्यूटर सिस्टम के भौतिक केंद्र का गठन करता है, यह इनपुट / आउटपुट डिवाइस और सहायक भंडारण इकाइयों सहित विभिन्न परिधीय उपकरणों से जुड़ा हुआ है।</li>\r\n\t<li>आधुनिक कंप्यूटर में, सीपीयू एक एकीकृत सर्किट चिप पर होता है जिसे माइक्रोप्रोसेसर कहा जाता है।</li>\r\n\t<li><strong>कंट्रोल यूनिट (नियंत्रण इकाई)</strong> पार्ट इनपुट और आउटपुट डिवाइस को नियंत्रित करती है।</li>\r\n\t<li>अंकगणित-तर्कइकाइयाँ जोड़, गुणा और भाग जैसे बुनियादी कार्य करती हैं।</li>\r\n\t<li>प्राइमरी स्टोरेज डिवाइस एक ऐसा माध्यम है जो कंप्यूटर के चलने के दौरान थोड़े समय के लिए मेमोरी को होल्ड करता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n<p>वह स्थान जहाँ सामान को कंप्यूटर में जोड़ा जाता है, ________के रूप में जाना जाता है।</p>", "option1": "\r\n<p>पोर्ट </p>", "option2": "\r\n<p>रिंग </p>", "option3": "\r\n<p>बस </p>", "option4": "\r\n<p>ज़िप </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>पोर्ट</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>पोर्ट</strong>:\r\n\r\n\t<ul>\r\n\t\t<li>कंप्यूटर शब्दावली में एक &#39;पोर्ट&#39;, <strong>संचार समापन</strong> बिंदु है जिसके उपयोग से बाहरी उपकरण को कंप्यूटर से जोड़ा जा सकता है।</li>\r\n\t\t<li><strong>मदरबोर्ड में &#39;पोर्ट&#39; नामक स्लॉट </strong>होते हैं जिसमें बाहरी डिवाइस का केबल प्लग किया जाता है।</li>\r\n\t\t<li>एक विशेष परिवहन प्रोटोकॉल और पते के लिए एक पोर्ट की पहचान <strong>16-बिट अहस्ताक्षरित संख्या</strong> के माध्यम से की जाती है जिसे &#39;पोर्ट नंबर&#39; कहा जाता है।</li>\r\n\t\t<li><strong>पोर्ट के कुछ महत्वपूर्ण प्रकार</strong> - सीरियल पोर्ट, पैरेलल पोर्ट, PS/2 पोर्ट, यूनिवर्सल सीरियल बस (या USB) पोर्ट, वीजीए पोर्ट, मोडेम पोर्ट, पावर कनेक्टर, फायरवायर पोर्ट, ईथरनेट पोर्ट, गेम पोर्ट और डिजिटल वीडियो इंटरफ़ेस (DVI) ) पोर्ट।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>रिंग</strong>:\r\n\t<ul>\r\n\t\t<li>कंप्यूटर नेटवर्किंग की &#39;रिंग&#39; टोपोलॉजी में, <strong>सभी टर्मिनलों को रिंग के रूप में एक-दूसरे से जोड़ा जाता है </strong>और डेटा एक टर्मिनल से दूसरे तक तब तक प्रसारित होता है जब तक कि वह गंतव्य बिंदु तक नहीं पहुंच जाता।</li>\r\n\t\t<li>इस प्रकार की नेटवर्किंग को वर्कस्टेशन के बीच कनेक्टिविटी को नियंत्रित करने के लिए <strong>नेटवर्क सर्वर की आवश्यकता नहीं</strong> होती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>बस</strong>:\r\n\t<ul>\r\n\t\t<li>इस प्रकार के कंप्यूटर नेटवर्किंग में,<strong> टर्मिनलों को एक एकल केंद्रीय केबल से जोड़ा जाता है जिसे &#39;बैकबोन&#39; भी कहा जाता है।</strong></li>\r\n\t\t<li>यहां, &#39;बस&#39; टोपोलॉजी के मामले में, केवल एक टर्मिनल एक समय में एक संकेत प्रेषित कर सकता है और सिग्नल दोनों दिशाओं में सभी टर्मिनलों तक यात्रा करता है जब तक कि वह गंतव्य बिंदु नहीं पाता।</li>\r\n\t\t<li>चूंकि इस प्रकार की नेटवर्किंग में केवल एक ही केबल का उपयोग किया जाता है, इसलिए यह दूसरों की तुलना में<strong> कम खर्चीला</strong> है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>ज़िप</strong>:\r\n\t<ul>\r\n\t\t<li>कंप्यूटर शब्दावली में &#39;जिप&#39; <strong>फाइल छोटे आकार की एकल संपीड़ित फ़ाइल में संकलित विभिन्न फाइलों के संग्रह </strong>को संदर्भित करती है।</li>\r\n\t\t<li>फ़ाइलों की यह ज़िपिंग डिस्क स्थान को बचाती है क्योंकि ज़िपित संग्रह अपने असम्पीडित संस्करण की तुलना में कम जगह लेता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n<p>एक ग्राफिक टैबलेट एक ________ है।</p>", "option1": "\r\n<p>फ़ॉर्मेटर</p>", "option2": "\r\n<p>नेटवर्क एडाप्टर</p>", "option3": "\r\n<p>आउटपुट डिवाइस</p>", "option4": "\r\n<p>इनपुट डिवाइस</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>ग्राफिक टैबलेट</strong> एक <strong><u>इनपुट डिवाइस</u></strong> है।</p>\r\n\r\n<ul>\r\n\t<li>यह एक कंप्यूटर इनपुट डिवाइस है जो उपयोगकर्ता को <strong>एक विशेष पेन जैसी स्टाइलस के साथ छवियों, एनिमेशन और ग्राफिक्स को आकर्षित करने</strong> की अनुमति देता है, जिस तरह से एक व्यक्ति एक पेंसिल और पेपर के साथ चित्र बनाता है।</li>\r\n\t<li>इन <strong>टैबलेटों का उपयोग डेटा या हाथ से लिखे हस्ताक्षर को अधिकृत</strong> के लिए भी किया जा सकता है।</li>\r\n\t<li>इसका उपयोग छवि को कागज की एक शीट से ट्रेस करने के लिए भी किया जा सकता है जो चिपके हुए हैं या अन्यथा टैबलेट बोर्ड पर बद्ध की गई हैं।</li>\r\n\t<li>इस तरह से डेटा को अधिकृत करना, रेखीय पॉलीलाइन या वक्र के कोनों को खींचना या पहुंचने को डिजिटाइज़िंग कहा जाता है।</li>\r\n\t<li><strong>1957 में, स्टाइलेटर पहली ग्राफिक टैबलेट</strong> थी, जो समकालीन लिखावट से बनी थी, जिसे कंप्यूटर की लिखावट के लिए इस्तेमाल किया गया था।</li>\r\n</ul>", "question_heading": ""}];

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
