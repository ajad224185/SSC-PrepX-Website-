<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>45.) SSC CGL Tier II (Paper-I) Mock 13 (Hindi - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": "\r\n<div>\r\n<p>आठ दोस्त - P, Q, R, S, T, U, V और W एक मीटिंग के लिए एक गोलाकार मेज के चारों ओर केंद्र के सम्मुख बैठे हैं। P, V के दाईं ओर दूसरा है, जो Q के दाईं ओर तीसरा है। S, U के बाएं से दूसरा है, जो V और P के बीच बैठा है। R, Q या T का पड़ोसी नहीं है।</p>\r\nV के दायें तीसरा कौन है?</div>", "option1": "\r\n<p>Q</p>", "option2": "\r\n<p>R</p>", "option3": "\r\n<p>W</p>", "option4": "\r\n<p>T</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>8 दोस्त: P, Q, R, S, T, U, V और W</p>\r\n\r\n<p>1) P, V के दाईं ओर दूसरा है, जो Q के दाईं ओर तीसरा है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987431_1742987431466107_thump.png\" style=\"width: 200px; height: 189px;\" /></figure>\r\n\r\n<p>2) S, U के बाएं से दूसरा है, जो V और P के बीच बैठा है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987497_1742987497413824_thump.png\" style=\"width: 200px; height: 199px;\" /></figure>\r\n\r\n<p>3) R, Q या T का पड़ोसी नहीं है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987524_1742987524559427_thump.png\" style=\"width: 200px; height: 184px;\" /></figure>\r\n\r\n<p>इसलिए, &lsquo;R&rsquo;, V के दाईं ओर तीसरा है।</p>", "question_heading": ""}, {"sr_no": 2, "question": "\r\n<p>यदि A @ B का अर्थ है कि A, B का पोता है. A # B का अर्थ है कि A, B की पत्नी है और यदि A* B का अर्थ है कि A, B का पिता है, तो X * Y @ Z # W का क्या अर्थ है यदि Z का केवल 1 पुत्र है?</p>", "option1": "\r\n<p><span>W, X की माता है।</span></p>", "option2": "\r\n<p><span>W, X का पिता है।</span></p>", "option3": "\r\n<p><span>X, W की माता है।</span></p>", "option4": "\r\n<p><span>X, W का पिता है।</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>वंश वृक्ष:</p>\r\n\r\n<figure class=\"image\"><img src=\"https:/ ": "\r\n<p><span>1/2</span></p>", "option2": "\r\n<p>1/3</p>", "option3": "\r\n<p>2</p>", "option4": "\r\n<p>3</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p><span>दिया गया है कि-</span></p>\r\n\r\n<p> </p>\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{x}{y}\\)</span> = <span class=\"math-tex\">\\(\\frac{1}{3}\\)</span>, <span class=\"math-tex\">\\(\\frac{y}{z}\\)</span> = <span class=\"math-tex\">\\(\\frac{5}{k}\\)</span>, <span class=\"math-tex\">\\(\\frac{z}{t}\\)</span> = <span class=\"math-tex\">\\(\\frac{2}{5}\\)</span>, <span class=\"math-tex\">\\(\\frac{t}{x} \\)</span> = <span class=\"math-tex\">\\(\\frac{3}{4} \\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\( \\frac{x}{y}\\ \\times\\ \\frac{y}{z}\\ =\\ \\frac{1}{3}\\ \\times\\ \\frac{5}{k}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{x}{z}\\ =\\ \\frac{5}{3k}\\)</span>  --------(1)</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\( \\frac{x}{t}\\ \\times\\ \\frac{t}{z}\\ =\\ \\frac{4}{3}\\ \\times\\ \\frac{5}{2}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{x}{z}\\ =\\ \\frac{10}{3}\\)</span>  --------(2)</p>\r\n\r\n<p><span>समीकरण (1) और (2) से हमें प्राप्त होता है</span>,</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{5}{3k}\\ =\\ \\frac{10}{3}\\)</span></p>\r\n\r\n<p>&rArr; k = <span class=\"math-tex\">\\(\\frac{1}{2}\\)</span></p>\r\n\r\n<p><strong>&there4; <span>k का मान 1/2 है।</span></strong></p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<p>उस विकल्प का चयन कीजिए जो तीसरे अक्षर संख्या समूह से उसी तरह संबंधित है जैसे दूसरा अक्षर संख्या <span>समूह</span> पहले अक्षर संख्या <span>समूह</span> से संबंधित है।</p>\r\n\r\n<p>PV7 : SY14 :: GT9 : ?</p>", "option1": "\r\n<p>LW16</p>", "option2": "\r\n<p>JX18</p>", "option3": "\r\n<p>NY16</p>", "option4": "\r\n<p>JW18</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरित तर्क है,</p>\r\n\r\n<p><strong>दूसरे अक्षर संख्या समूह के अक्षर अंग्रेजी वर्णमाला के अनुसार अगले तीसरे अक्षर में बदल रहे हैं।</strong></p>\r\n\r\n<p>P(16) + 3 = S (19)</p>\r\n\r\n<p>V (22) + 3 = Y (25)</p>\r\n\r\n<p><strong>और पहले अक्षर संख्या समूह में संख्या 2 से गुणा किया जाता है, (7 &times; 2 = 14).</strong></p>\r\n\r\n<p><strong>PV7 : SY14</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987769_1742987769548868_thump.png\" style=\"width: 100px; height: 97px;\" /></figure>\r\n\r\n<p>इसी तरह, चौथा अक्षर संख्या समूह तीसरे अक्षर संख्या समूह से संबंधित है।</p>\r\n\r\n<p><strong>G (7) + 3 = J (10)</strong></p>\r\n\r\n<p><strong>T (20) +3 = W (23)</strong></p>\r\n\r\n<p>और तीसरे अक्षर संख्या समूह में संख्या को 2 से गुणा किया जाएगा।</p>\r\n\r\n<p><strong>9 &times; 2 = 18</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987808_1742987808574985_thump.png\" style=\"width: 100px; height: 96px;\" /></figure>\r\n\r\n<p><strong>इसलिए, चौथा अक्षर समूह JW18 के रूप में होगा।</strong></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;JW18&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n<p>वह छोटी-से-छोटी संख्या कौन सी है, जिसको 42, 72 और 84 से विभाजित करने पर शेषफल क्रमशः 25, 55 और 67 रहता है?</p>", "option1": "\r\n<p>521</p>", "option2": "\r\n<p>512</p>", "option3": "\r\n<p><span>504</span></p>", "option4": "\r\n<p><span>487</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>&rArr; 42 - 25 = 17</p>\r\n\r\n<p><span>&rArr; 72 - 55 = 17</span></p>\r\n\r\n<p><span>&rArr; 84 - 67 = 17</span></p>\r\n\r\n<p><span>अब, 42, 72, 84 का लघुत्तम समापर्त्य = 504</span></p>\r\n\r\n<p><span>इसलिए, अभीष्ट संख्या</span> = 504 - 17 = 487</p>\r\n\r\n<p><strong>&there4; <span>सही उत्तर</span> 487 <span>है।</span></strong></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>दिए गए विकल्पों में से उस आकृति का चयन कीजिए जो निम्नलिखित श्रृंखला में प्रश्न चिह्न (?) को प्रतिस्थापित कर सकती है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742987995_1742987995760615_thump.png\" style=\"width: 300px; height: 76px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988019_1742988019914766_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988077_1742988077944932_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988110_1742988110835374_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988161_1742988161290179_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>निम्नलिखित आकृति श्रृंखला में प्रश्नवाचक चिन्ह (?) को प्रतिस्थापित करने वाली <span>आकृति</span> नीचे दर्शायी गई है:</p>\r\n\r\n<p>1) श्रृंखला में तीर दक्षिणावर्त दिशा में घूमता है।</p>\r\n\r\n<p>2) श्रृंखला में, वर्ग आकृति के प्रत्येक कोने में अपनी स्थिति बदलता है और साथ ही एक-एक करके छायांकित भाग को गैर-छायांकित भाग में बदलता है।</p>\r\n\r\n<p>3) श्रृंखला में, वृत्त आकृति के प्रत्येक कोने में अपनी स्थिति बदलता है और<span> साथ ही</span> एक-एक करके छायांकित भाग को गैर-छायांकित भाग में बदलता</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988260_1742988260374950_thump.png\" style=\"width: 250px; height: 64px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर &lsquo;<strong>विकल्प 4</strong>&rsquo; है।</p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n<p>दिए गए कथन को सत्य मानिए और तय कीजिए कि कौन-सा निष्कर्ष तार्किक रूप से कथन का अनुसरण करता है।</p>\r\n\r\n<p><strong>कथन :</strong></p>\r\n\r\n<p>&#39;कैल्विन क्लीन&#39; जींस का उपयोग कीजिए। मेरे और मेरे कैल्विन के बीच कुछ भी नहीं आता है। &ndash; एक विज्ञापन।</p>\r\n\r\n<p><strong>निष्कर्ष :</strong></p>\r\n\r\n<p>I. आकर्षक नारे (कैची स्लोगन) लोगों को आकर्षित नहीं करते हैं।</p>\r\n\r\n<p>II. लोगों को डार्क शेड वाला जींस पसंद आता है।</p>", "option1": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है।</p>", "option2": "\r\n<p>केवल निष्कर्ष II अनुसरण करता है।</p>", "option3": "\r\n<p>या तो निष्कर्ष I या II पालन अनुसरण है।</p>", "option4": "\r\n<p>न तो निष्कर्ष I और न ही II पालन अनुसरण है।</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिया गया कथन एक विज्ञापन है जो कहता है &quot;&#39;केल्विन क्लेन&#39; जींस का प्रयोग कीजिए। मेरे और मेरे कैल्विन के बीच कुछ भी नहीं आता है।&quot;</p>\r\n\r\n<p>कथन से <strong>निष्कर्ष (I)</strong> का अनुमान नहीं लगाया जा सकता है क्योंकि कथन अपने आप में एक आकर्षक नारा है जिसका उद्देश्य लोगों को केल्विन क्लेन जींस का उपयोग करने के लिए आकर्षित करना है।</p>\r\n\r\n<p>कथन से <strong>निष्कर्ष (II)</strong> का भी अनुमान नहीं लगाया जा सकता है क्योंकि कथन लोगों की जींस के रंग के प्रति उनकी प्राथमिकताओं के बारे में कोई सूचना प्रदान नहीं करता है। यह केवल केल्विन क्लेन जींस को उनके रंग या शेड्स का उल्लेख किए बिना प्रचारित करता है।</p>\r\n\r\n<p>अतः, सही उत्तर है <strong>&quot;न तो निष्कर्ष I और न ही II अनुसरण करता है&quot;।</strong></p>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n<p>कितने प्रतिशत की वार्षिक चक्रवृद्धि ब्याज की दर से एक मूलधन 14 वर्षों में दोगुना हो जाएगा? [<span class=\"math-tex\">\\(2^{1\\over14}\\)</span> = 1.050 का उपयोग कीजिए]</p>", "option1": "\r\n<p>4%</p>", "option2": "\r\n<p>5%</p>", "option3": "\r\n<p>6%</p>", "option4": "\r\n<p><span>7.14%</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया:</strong></p>\r\n\r\n<p>मान लेते हैं कि मूल राशि &quot;P&quot; है और प्रति वर्ष चक्रवृद्धि ब्याज की दर &quot;r&quot; है। प्रश्न के अनुसार 14 वर्ष में मूल राशि दोगुनी हो जाएगी।</p>\r\n\r\n<p>हम 14 साल बाद की राशि ज्ञात करने के लिए चक्रवृद्धि ब्याज के सूत्र का उपयोग कर सकते हैं:</p>\r\n\r\n<p>A = P(1 + r/100)<sup>14</sup></p>\r\n\r\n<p>प्रश्न के अनुसार, 14 वर्ष बाद की राशि मूलधन की दोगुनी है:</p>\r\n\r\n<p>2P = P(1 + r/100)<sup>14</sup></p>\r\n\r\n<p>उपरोक्त समीकरण को सरल करने पर, हम प्राप्त करते हैं:</p>\r\n\r\n<p>(1 + r/100)<sup>14</sup> = 2</p>\r\n\r\n<p>दोनों पक्षों में 14वाँ मूल निकालने पर, हमें यह प्राप्त होता है:</p>\r\n\r\n<p>&rArr; 1 + r/100 = 2<sup>(1/14)</sup></p>\r\n\r\n<p>&rArr; r/100 = 0.05</p>\r\n\r\n<p>&rArr; r = 5</p>\r\n\r\n<p><strong>इसलिए, प्रति वर्ष चक्रवृद्धि ब्याज की दर जिस पर धनराशि 14 वर्षों में दोगुनी हो जाएगी, वह 5% है।</strong></p>", "question_heading": ""}, {"sr_no": 9, "question": "\r\n<p>तीन कथनों के बाद तीन निष्कर्ष I, II और III दिए गए हैं। कथनों को सत्य मानते हुए, भले ही वे सामान्य रूप से ज्ञात तथ्यों से भिन्न प्रतीत होते हों, निर्णय लें कि कौन सा निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता है।</p>\r\n\r\n<p>कथन:</p>\r\n\r\n<p>1. कोई बेड चेयर नहीं है।</p>\r\n\r\n<p>2. सभी टेबल बेड हैं।</p>\r\n\r\n<p>3. कोई अलमारी बेड नहीं है।</p>\r\n\r\n<p>निष्कर्ष:</p>\r\n\r\n<p>I. कोई टेबल चेयर नहीं है।</p>\r\n\r\n<p>II. कोई अलमारी टेबल नहीं है।</p>\r\n\r\n<p>III. कुछ बेड टेबल हैं।</p>", "option1": "\r\n<p>केवल निष्कर्ष I और III अनुसरण करते हैं</p>", "option2": "\r\n<p>केवल निष्कर्ष II और III अनुसरण करते हैं</p>", "option3": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है</p>", "option4": "\r\n<p>सभी निष्कर्ष अनुसरण करते हैं</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिए गए कथनों के अनुसार, वेन आरेख निम्न होगा:</p>\r\n\r\n<p>इसके बाद, हम सभी निष्कर्षों की जाँच इस प्रकार करेंगे:</p>\r\n\r\n<p>I. कोई टेबल चेयर नहीं है &rarr; <span>अनुसरण करता है </span>&rarr; चूंकि दिए गए सभी टेबल बेड हैं और कोई बेड चेयर नहीं है। इस प्रकार, कोई टेबल, चेयर <span>नहीं है, </span>सत्य है।</p>\r\n\r\n<p><span>II.</span> कोई अलमारी टेबल नहीं है &rarr; अनुसरण करता है &rarr; चूंकि दी गई सभी टेबल बेड हैं और कोई बेड चेयर नहीं है। इस प्रकार, कोई अलमारी, टेबल <span>नहीं है, </span>सत्य है।</p>\r\n\r\n<p>III. कुछ बेड टेबल हैं &rarr; अनुसरण करता है &rarr; चूंकि दिए गए सभी टेबल बेड हैं और कोई बेड चेयर नहीं है। इस प्रकार, कुछ बेड, टेबल है, सत्य है।</p>\r\n\r\n<p>इस प्रकार, <strong>सभी निष्कर्ष </strong>अनुसरण करते हैं।</p>\r\n\r\n<p>अत: सही उत्तर <u><strong>&#39;विकल्प 4&#39;</strong></u> है।</p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n<p>एक व्यापारी अपनी वस्तु का मूल्य इस प्रकार अंकित करता है कि उसमें 25% का लाभ सम्मिलित हो। वह अंकित मूल्य पर 16% की छूट देता है, तो उसका वास्तविक लाभ क्या है?</p>", "option1": "\r\n<p>9%</p>", "option2": "\r\n<p>5%</p>", "option3": "\r\n<p><span>16%</span></p>", "option4": "\r\n<p>20%</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>हल:</strong></p>\r\n\r\n<p>माना वस्तु का क्रय मूल्य 100 रुपये है।</p>\r\n\r\n<p>खुदरा विक्रेता <span>अपनी वस्तुओं का मूल्य इस प्रकार अंकित करता है कि उसमें 25% का लाभ सम्मिलित हो</span>, इसलिए अंकित मूल्य होगा:</p>\r\n\r\n<p>100 रुपये + 100 रुपये का 25% = 125 रुपये</p>\r\n\r\n<p>खुदरा विक्रेता अंकित मूल्य पर 16% की छूट देता है:</p>\r\n\r\n<p>छूट = 125 रुपये का 16% = 20 रुपये</p>\r\n\r\n<p>विक्रय मूल्य = अंकित मूल्य - छूट = 125 रुपये - 20 रुपये = 105 रुपये</p>\r\n\r\n<p>अब, लाभ की गणना करते हैं:</p>\r\n\r\n<p>लाभ = विक्रय मूल्य - क्रय मूल्य = 105 रुपये - 100 रुपये = 5 रुपये</p>\r\n\r\n<p><strong>अतः, खुदरा विक्रेता का उसकी बिक्री पर वास्तविक लाभ, 5 रुपये या <span>क्रय मूल्य का </span>5% है।</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n\r\n<p>एक थैले में 3 लाल कंचे, 4 नीले कंचे और 5 हरे कंचे हैं। यदि प्रतिस्थापन वाले थैले से दो कंचे यादृच्छिक रूप से चुने जाते हैं, तो इसकी क्या प्रायिकता है कि दोनों कंचे एक समान रंग के हैं?</p>", "option1": "\r\n\r\n<p>19/72</p>", "option2": "\r\n\r\n<p>23/72</p>", "option3": "\r\n\r\n<p>25/72</p>", "option4": "\r\n\r\n<p>29/72</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <strong>25</strong><u><strong><strong>/</strong>72</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>इस समस्या की गणना में प्रतिस्थापन एक महत्वपूर्ण कारक है।</li>\r\n\t<li>प्रतिस्थापन के साथ एक ही रंग के दो कंचे चुनने की प्रायिकता 25/72 है। </li>\r\n\t<li>प्रायिकता की गणना एक ही रंग के कंचे को दो बार चुनने की अलग-अलग प्रायिकताओं को गुणा करके की जा सकती है।</li>\r\n\t<li>इसका सूत्र है  P(समान रंग) = (P(रंग1))2  + (P(रंग2))2  + (P(रंग3))2<br />\r\n\tप्रायिकता परिणामों की संख्या की गणना थैले में उपस्थित कंचों की कुल संख्या को चयनों की संख्या से गुणा करके की जाती है।</li>\r\n\t<li>अनुकूल परिणामों की संख्या की गणना उसी रंग के कंचों की संख्या को उसी से गुणा करके की जाती है।</li>\r\n\t<li>प्रतिस्थापन के साथ एक ही रंग के दो कंचे चुनने की प्रायिकता की गणना एक निश्चित रंग के एक कंचे को स्वयं चुनने की प्रायिकता को गुणा करके भी की जा सकती है।</li>\r\n\t<li>इसका सूत्र है  P(समान रंग) = (P(रंग1))2 + (P(रंग2))2 + (P(रंग3))2</li>\r\n\t<li>  इस प्रश्न में, P(समान रंग) = (3/12)2  + (4/12)2  + (5/12)2  = 25/72</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p>एक तूफान के दौरान, एक पेड़ जमीन से 5 मीटर ऊपर एक बिंदु पर से इस प्रकार टूटा कि पेड़ का शीर्ष जहाँ वह मूल रूप से खड़ा था, उससे 12 मीटर दूर जमीन को छूता है। टूटने से पहले पेड़ की ऊँचाई कितनी थी?</p>", "option1": "\r\n<p>18 मीटर</p>", "option2": "\r\n<p>13 <span>मीटर</span></p>", "option3": "\r\n<p>17 <span>मीटर</span></p>", "option4": "\r\n<p>12 <span>मीटर</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त अवधारणा: </strong></p>\r\n\r\n<p><strong>पाइथागोरस प्रमेय :</strong> समकोण त्रिभुज में कर्ण भुजा का वर्ग अन्य दो भुजाओं के वर्गों के योग के बराबर होता है।</p>\r\n\r\n<p>H<sup>2</sup> = B<sup>2</sup> + P<sup>2</sup></p>\r\n\r\n<p>जहाँ, H = कर्ण, B = आधार और P = लंब</p>\r\n\r\n<p>माना, पेड़ की वास्तविक ऊँचाई को &#39;h&#39; द्वारा दर्शाया जाता है।</p>\r\n\r\n<p>पाइथागोरस प्रमेय का उपयोग करने पर,</p>\r\n\r\n<p><span>H</span><sup>2  = B</sup><sup>2  + P</sup><sup>2</sup></p>\r\n\r\n<p>&rArr; h<sup>2</sup> = 12<sup>2</sup> + 5<sup>2</sup></p>\r\n\r\n<p>&rArr; h<sup>2</sup> = 169</p>\r\n\r\n<p>&rArr; h = <span class=\"math-tex\">\\(\\sqrt{169}\\)</span> = 13 मीटर</p>\r\n\r\n<p>टूटने से पहले पेड़ की ऊँचाई = 13 + 5 = 18 मीटर</p>\r\n\r\n<p><strong>&there4; विकल्प (1) सही उत्तर है।</strong></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<p>दिए गए विकल्पों में से उस अक्षर-समूह को <span><span>चुनिये</span></span> जो निम्नलिखित श्रृंखला में प्रश्नवाचक चिन्ह (?) को प्रतिस्थापित कर सकता है।</p>\r\n\r\n<p><span>TSF, RPJ, PMN, NJR, ?</span></p>", "option1": "\r\n<p>LGN</p>", "option2": "\r\n<p>KGU</p>", "option3": "\r\n<p>LGV</p>", "option4": "\r\n<p>JFV</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>तालिका, वर्णमाला स्थितीय मान दर्शाती है-</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988455_1742988455509036_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p>अनुसरित पैटर्न है,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988537_1742988537967336_thump.png\" style=\"width: 100px; height: 422px;\" /></figure>\r\n\r\n<p>अतः <strong>&ldquo;LGV&rdquo; </strong>पूर्ण श्रृंखला है।</p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>उस विकल्प का चयन करें जिसमें दी गई आकृति सन्निहित है। (घूर्णन की अनुमति नहीं है)</p>\r\n\r\n<figure class=\"image\"><img height=\"69\" src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988591_1742988591885905_thump.png\" width=\"69\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988608_1742988608768351_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988666_1742988666991385_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988696_1742988696794318_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988779_1742988779664751_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>घूर्णन की अनुमति नहीं होने पर दी गई आकृति नीचे दी गयी आकृति में सन्निहित है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988816_1742988816815113_thump.png\" style=\"width: 400px; height: 518px;\" /></figure>\r\n\r\n<p>इसलिए, <span>&quot;विकल्प 2&quot;</span> सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p>एक ही पासे के तीन अलग-अलग स्थान दिखाए गए हैं, जिनमें छह फलक 1 से 6 तक संख्यांकित किये गए हैं। उस संख्या का चयन कीजिये जो फलक &#39;1&#39; के सम्मुख फलक पर होगी।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988911_1742988911169526_thump.png\" style=\"width: 200px; height: 74px;\" /></figure>", "option1": "\r\n<p>4</p>", "option2": "\r\n<p>6</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>5</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>पहले और तीसरे पासे में 2, 3 दोनों पासों में उभयनिष्ठ हैं।</p>\r\n\r\n<p>तीसरे पासे को 180<sup>0</sup> दक्षिणावर्त घुमाया जाता है, 2, 3 की अन्य आसन्न भुजा &#39;6&#39; है।</p>\r\n\r\n<p>तर्क :<strong> यदि दी गई छवि में दो पासों के दो अंकित मान समान हैं तो तीसरी संख्या एक दूसरे के सम्मुख होती है।</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742988936_1742988936663473_thump.png\" style=\"width: 180px; height: 67px;\" /></figure>\r\n\r\n<p>&there4; यहाँ, &#39;6&#39;, &#39;1&#39; का सम्मुख फलक है।</p>\r\n\r\n<p>अत:, सही उत्तर <strong>&quot;6&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<p>तीन कथन दिए गए हैं, जिसके बाद तीन निष्कर्ष I, II और III दिए गए हैं। यह मानते हुए कि कथनों में दी गई जानकारी सही है, भले ही वे सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होते हो, तय कीजिये कि कौन सा निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता है।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>1. कोई <span>पत्तियां </span>हरी नहीं हैं।</p>\r\n\r\n<p>2. सभी फल हरे हैं।</p>\r\n\r\n<p>3. कुछ <span>मिठाइयाँ </span>फल हैं।</p>\r\n\r\n<p><strong>निष्कर्ष:</strong></p>\r\n\r\n<p>I. कोई पत्तियां फल नहीं हैं।</p>\r\n\r\n<p>II. सभी मिठाइयाँ हरी हैं।</p>\r\n\r\n<p>III. कुछ <span>पत्तियां </span>हरी हो सकती हैं।</p>", "option1": "\r\n<p>निष्कर्ष I और II दोनों अनुसरण करते हैं।</p>", "option2": "\r\n<p>निष्कर्ष I और III दोनों अनुसरण करते हैं।</p>", "option3": "\r\n<p>केवल निष्कर्ष III अनुसरण करता है।</p>", "option4": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है।</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिए गए कथनों के लिए न्यूनतम संभावित वेन आरेख नीचे दिखाया गया है: -</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989057_1742989057912510_thump.png\" style=\"width: 190px; height: 61px;\" /></figure>\r\n\r\n<p><u><strong>निष्कर्ष:</strong></u></p>\r\n\r\n<p>I. कोई <span>पत्तियां </span>फल नहीं हैं &rarr; सही (चूंकि सभी फल हरे हैं और कोई <span>पत्तियां </span>हरी नहीं हैं, इसलिए कोई भी <span>पत्तियां </span>फल नहीं हैं, अतः, सत्य है)</p>\r\n\r\n<p>II. सभी मिठाइयाँ हरी हैं &rarr; गलत (<span>चूंकि </span>सभी फल हरे हैं और कुछ मिठाइयाँ फल हैं, इसलिए सभी मिठाइयाँ हरी हैं, <span>अतः</span>, गलत<span> है)</span></p>\r\n\r\n<p>III. <span>कुछ  पत्तियां  हरी हो सकती हैं।</span> &rarr; गलत (चूंकि कोई <span>पत्तियां </span>हरी नहीं होती हैं, इसलिए <span>कुछ  पत्तियां  हरी हो सकती हैं</span>, <span>अतः, </span>गलत<span> है)</span></p>\r\n\r\n<p><span>&there4; </span>यहाँ, निष्कर्ष I सही है।</p>\r\n\r\n<p>अतः, सही उत्तर <strong><span>&quot;केवल निष्कर्ष I अनुसरण करता है&quot; </span></strong>है।</p>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>35 विद्यार्थियों का 24 दिनों का भोजनालय (मेस) का शुल्क 6,300 रुपये है। <span>कितने दिनों का </span>25 विद्यार्थियों का भोजनालय शुल्क 3,375 रुपये होगा?</p>", "option1": "\r\n<p>12</p>", "option2": "\r\n<p>15</p>", "option3": "\r\n<p>18</p>", "option4": "\r\n<p>21</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p><span>माना कि X  दिनों के लिए 25 छात्रों का भोजनालय शुल्क 3375 रुपये है।</span></p>\r\n\r\n<p><span>भोजनालय शुल्क </span>के लिए,</p>\r\n\r\n<p>&rArr; 35 <span>छात्र</span> &rarr; 24 दिन &rarr; 6300</p>\r\n\r\n<p>&rArr; 35 <span>छात्र</span> &rarr; 1 <span>दिन</span> &rarr; <span class=\"math-tex\">\\(\\frac{6300}{24}\\)</span></p>\r\n\r\n<p>&rArr; 1 <span>छात्र</span> &rarr; 1 <span>दिन</span> &rarr; <span class=\"math-tex\">\\(\\frac{6300}{24\\ ×\\ 35}\\)</span></p>\r\n\r\n<p><span>इसलिए, प्रति व्यक्ति प्रति दिन के लिए भोजनालय शुल्क है</span>, </p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{6300}{24\\ ×\\ 35}\\)</span> = 7.5</p>\r\n\r\n<p><span>x दिनों के लिए 25 व्यक्तियों का भोजनालय शुल्क</span>,</p>\r\n\r\n<p>&rArr; 7.5 &times; 25 &times; X = 3375</p>\r\n\r\n<p>&rArr; X = 18 <span>दिन</span></p>\r\n\r\n<p><strong>&there4; <span>दिनों की संख्या 18 है।</span></strong></p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>यदि <span>x 140 + 2x 151  + k</span>, x + 1 से विभाज्य है, तो k का मान क्या है?</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>-3</p>", "option3": "\r\n<p>2</p>", "option4": "\r\n<p>-2</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>x 140 + 2x 151  + k , x + 1 से विभाज्य है ।</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>x<sup>140</sup> + 2x<sup>151</sup> + k का एक गुणनखंड <span>x + 1</span> है। </p>\r\n\r\n<p>x + 1 = 0</p>\r\n\r\n<p><span>=&gt; </span>x = - 1</p>\r\n\r\n<p><span>=&gt; </span>(-1)<sup>140</sup> + 2(-1)<sup>151</sup> + k = 0</p>\r\n\r\n<p><span>=&gt; </span>1 - 2 + k = 0</p>\r\n\r\n<p><span>=&gt; </span>k - 1 = 0</p>\r\n\r\n<p><span>=&gt; </span>k = 1</p>\r\n\r\n<p><span>&there4; </span><strong>उत्तर 1 है<span>।</span></strong></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<p>पाँच क्रमागत संख्याओं A, B, C, D और E का औसत 12 है। A और D का गुणनफल क्या होगा?</p>", "option1": "\r\n<p>140</p>", "option2": "\r\n<p>120</p>", "option3": "\r\n<p><span>110</span></p>", "option4": "\r\n<p><span>130</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>औसत = सभी प्रेक्षणों का योग &divide; <span>प्रेक्षणों </span>की संख्या</p>\r\n\r\n<p><strong>हल:</strong></p>\r\n\r\n<p>माना, मध्य संख्या C है और फिर हम सभी संख्याओं को C के संदर्भ में व्यक्त कर सकते हैं।</p>\r\n\r\n<p>इसलिए पाँच क्रमागत संख्याएँ निम्न हैं:</p>\r\n\r\n<p>A = C - 2<br />\r\nB = C - 1<br />\r\nC = C<br />\r\nD = C + 1<br />\r\nE = C + 2</p>\r\n\r\n<p>हम जानते हैं कि इन पाँच संख्याओं का औसत 12 है, इसलिए हम लिख सकते हैं:</p>\r\n\r\n<p>(A + B + C + D + E)/5 = 12</p>\r\n\r\n<p><span>A, B, C, D, और E</span> के मानों को प्रतिस्थापित करने पर, हम प्राप्त करते हैं:</p>\r\n\r\n<p>[(C - 2) + (C - 1) + C + (C + 1) + (C + 2)]/5 = 12</p>\r\n\r\n<p>इस व्यंजक को सरल करने पर, हम प्राप्त करते हैं:</p>\r\n\r\n<p>5C/5 = 12</p>\r\n\r\n<p>&rArr; C = 12</p>\r\n\r\n<p>इसलिए मध्य संख्या 12 है, और अन्य चार संख्याएँ निम्न हैं:</p>\r\n\r\n<p>A = 10<br />\r\nB = 11<br />\r\nD = 13<br />\r\nE = 14</p>\r\n\r\n<p>A और D का गुणनफल है:</p>\r\n\r\n<p>A x D = 10 x 13 = 130</p>\r\n\r\n<p><strong>अतः A और D का गुणनफल 130 है।</strong></p>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>नीचे दिए गए विकल्पों में से लुप्त संख्या ज्ञात कीजिए।</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>64</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>39</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>51</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>53</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>34</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>27</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>79</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>12</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>?</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>", "option1": "\r\n<p>65</p>", "option2": "\r\n<p>78</p>", "option3": "\r\n<p>34</p>", "option4": "\r\n<p>86</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>अनुसरण किया गया स्वरुप,</p>\r\n\r\n<p>पंक्ति 1 &rarr; (6 &times; 4) + (3 &times; 9) = 24 + 27 = 51</p>\r\n\r\n<p>पंक्ति 2 &rarr; (5 &times; 3) + (3 &times; 4) = 15 + 12 = 27</p>\r\n\r\n<p><strong>पंक्ति 3 &rarr; (7 &times; 9) + (1 &times; 2) = 63 + 02 = 65</strong></p>\r\n\r\n<p>इसलिए, 65 सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n<p>अक्षरों के उस संयोजन का चयन करें, जिसे दी गई शृंखला के रिक्त स्थानों में क्रमिक रूप से रखने पर शृंखला पूरी हो जाएगी।</p>\r\n\r\n<p>a_ bca _ _ ca _ b _ _ abc</p>", "option1": "\r\n<p>aaacba</p>", "option2": "\r\n<p>bacaaa</p>", "option3": "\r\n<p>abacaa</p>", "option4": "\r\n<p>aabaca</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दी गई श्रृंखला है: a_ bca _ _ ca _ b _ _ abc</span></p>\r\n\r\n<ol>\r\n\t<li>aaacba &rarr; a<strong>a</strong>bc - a<strong>aa</strong>c - a<strong>c</strong>b<strong>b </strong>-<strong> a</strong>abc</li>\r\n\t<li>bacaaa <span>&rarr; </span>a<strong>b</strong>bc - a<strong>ac</strong>c -a<strong>a</strong>b<strong>a </strong>-<strong> a</strong>abc</li>\r\n\t<li>abacaa <span>&rarr; </span>a<strong>a</strong>bc - a<strong>ba</strong>c - a<strong>c</strong>b<strong>a </strong>-<strong> a</strong>abc</li>\r\n\t<li>aabaca <span>&rarr; </span>a<strong>a</strong>bc - a<strong>ab</strong>c - a<strong>a</strong>b<strong>c </strong>-<strong> a</strong>abc</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li>यहाँ, <span>a a bc दोहराया गया है।</span></li>\r\n</ul>\r\n\r\n<p>अतः, <span>सही उत्तर </span>&lsquo;<strong><span>aabaca</span></strong>&rsquo; है।</p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<p>किसी कार्य को P और Q, 2 दिनों में; Q और R, 4 दिनों में; एवं P और R, 12/5 दिनों में कर सकते हैं। P को अकेले उस कार्य को करने के लिए कितने दिनों की आवश्यकता है?</p>", "option1": "\r\n<p>5/2</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>14/5</p>", "option4": "\r\n<p><span>6</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>दक्षता = <span class=\"math-tex\">\\(\\frac{Work\\ done}{Time\\ taken}\\)</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p><span>दिया गया है कि किसी कार्य को P और Q, 2 दिनों में, Q और R, 4 दिनों में और P और R, 12/5 दिनों में कर सकते हैं।</span></p>\r\n\r\n<p><span>पहले 2, 4, 12/5 का लघुत्तम समापवर्त्य लीजिए जो कि 12 है। अब, माना कुल कार्य 12 है।</span></p>\r\n\r\n<p><span>इसलिए, उपरोक्त सूत्र का उपयोग करने पर,</span></p>\r\n\r\n<p>&rArr; दक्षता (P+ Q) = 12/2 = 6  </p>\r\n\r\n<p>&rArr; <span>दक्षता</span> (Q + R) = 12/ 4 = 3</p>\r\n\r\n<p>&rArr; <span>दक्षता</span> (P + R) = <span class=\"math-tex\">\\(\\frac{12}{\\frac{12}{5}}\\)</span> = 5</p>\r\n\r\n<p><span>&rArr; </span>2 &times; <span>दक्षता</span> (P + Q + R) = 6 + 3 + 5</p>\r\n\r\n<p><span>&rArr; दक्षता (P + Q + R) = 14/2 = 7</span></p>\r\n\r\n<p><span>&rArr; दक्षता (P) = 7 - 3 = 4</span></p>\r\n\r\n<p><span>अकेले P द्वारा लिया गया समय = <span class=\"math-tex\">\\(\\frac{Total\\ Work}{Efficiency\\ of\\ P}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 12/4 = 3</span></p>\r\n\r\n<p><strong><span>&there4; P को अकेले कार्य करने में 3 दिन लगेंगे।</span></strong></p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p>एक पाइप पानी के टैंक को दूसरे पाइप से तीन गुना तेजी से भर सकता है। यदि दोनों पाइपों का उपयोग <span>एक साथ</span> किया जाता है, तो वे टैंक को 36 मिनटों में भर देते हैं। धीमी गति वाला पाइप <span>अकेले</span> टैंक को भरने में कितना समय लेता है? </p>", "option1": "\r\n<p><span>192 मिनट</span></p>", "option2": "\r\n<p><span>108 मिनट</span></p>", "option3": "\r\n<p><span>144 मिनट</span></p>", "option4": "\r\n<p><span>160 मिनट</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>माना धीमी गति वाला पाइप <span>टैंक</span> को x मिनट में भरता है।</p>\r\n\r\n<p>तो, तेज <span>गति वाला  </span>पाइप उसी टैंक को (x/3) मिनट में भर सकता है।</p>\r\n\r\n<p>जब दोनों पाइपों का एक साथ उपयोग किया जाता है, तो वे टैंक को 36 मिनट में भर सकते हैं। इसलिए टैंक को भरने की उनकी संयुक्त दर है = 1/36 टैंक प्रति मिनट</p>\r\n\r\n<p><span>धीमी</span> गति वाला पाइप टैंक को 1/x टैंक प्रति मिनट की दर से भरता है।</p>\r\n\r\n<p>तेज <span>गति वाला</span> पाइप टैंक को 1/(x/3) की दर से भरता है =3/x टैंक प्रति मिन </p>\r\n\r\n<p>&rArr; 1/x + 3/x = 1/36</p>\r\n\r\n<p><span>&rArr; </span>4/x = 1/36</p>\r\n\r\n<p><span>&rArr; </span>36 &times; 4 = x</p>\r\n\r\n<p>इसलिए, x = 144</p>\r\n\r\n<p><strong>अतः <span>धीमी गति वाला</span> पाइप टैंक को अकेले 144 मिनट में भर सकता है।</strong></p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>यदि <span class=\"math-tex\">\\(\\rm x=\\frac{2}{3+\\sqrt7}\\)</span>, तब (x - 3)<sup>2</sup> =</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>6</p>", "option4": "\r\n<p>7</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span class=\"math-tex\">\\(\\dfrac{2}{3+\\sqrt7}\\)</span></p>\r\n\r\n<p><strong>गणनाएँ:</strong></p>\r\n\r\n<p>अंश और हर दोनों को (3 - &radic;7) से गुणा करने पर, हमें प्राप्त होता हैं,</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\dfrac{2}{3+\\sqrt7}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{2 × (3-\\sqrt7)}{(3+\\sqrt7)(3-\\sqrt7)}\\)</span></p>\r\n\r\n<p>= <span class=\"math-tex\">\\(\\dfrac{2 × (3 - \\sqrt7)}{9-7}\\)</span></p>\r\n\r\n<p>= <span class=\"math-tex\">\\(\\dfrac{2 × (3 - \\sqrt7)}{2}\\)</span></p>\r\n\r\n<p>= 3 - &radic;7</p>\r\n\r\n<p>अब, x = 3 - &radic;7 का मान (x - 3)<sup>2</sup> में रखने पर,</p>\r\n\r\n<p>= (3 - &radic;7 - 3)<sup>2</sup></p>\r\n\r\n<p>= (- &radic;7)<sup>2</sup></p>\r\n\r\n<p>= 7</p>\r\n\r\n<p><strong><span>&there4; </span>उत्तर 7 है।</strong></p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>निम्नलिखित में से कौन सा अक्षर-समूह दी गई श्रृंखला में प्रश्नवाचक चिह्न (?) का स्थान लेगा?</p>\r\n\r\n<p>BRAIN, DRAIN, DTAIN, ?, DTCKN, DTCKP</p>", "option1": "\r\n<p>DTACN</p>", "option2": "\r\n<p>DTCIP</p>", "option3": "\r\n<p>DTCIN</p>", "option4": "\r\n<p>DRCIN</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989328_1742989328670236_thump.png\" style=\"width: 400px; height: 84px;\" /></figure>\r\n\r\n<p>यहाँ अनुसरण किया गया तर्क है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989414_1742989414997014_thump.png\" style=\"width: 100px; height: 267px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;DTCIN&quot; </strong>है।</p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n\r\n<p>8<sup>x+1</sup> = 64, 3<sup>2x+1</sup> का मान क्या है?</p>", "option1": "\r\n\r\n<p>1</p>", "option2": "\r\n\r\n<p>3</p>", "option3": "\r\n\r\n<p>9</p>", "option4": "\r\n\r\n<p>27</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>8<sup>x+1</sup> = 64</p>\r\n\r\n<p><strong>गणनाएँ:</strong></p>\r\n\r\n<p>8<sup>X+1</sup> = 64</p>\r\n\r\n<p>8<sup>X+1</sup> = 8<sup>2</sup></p>\r\n\r\n<p>x + 1 = 2 (चूँकि आधार समान हैं)</p>\r\n\r\n<p>x = 2 - 1</p>\r\n\r\n<p>x = 1</p>\r\n\r\n<p>x = 1 का मान रखने पर,</p>\r\n\r\n<p>3<sup>2X+1</sup></p>\r\n\r\n<p>= 3<sup>2*1+1</sup></p>\r\n\r\n<p>= 3<sup>2+1</sup></p>\r\n\r\n<p>= 3<sup>3</sup></p>\r\n\r\n<p>= 27</p>\r\n\r\n<p><strong>उत्तर 27 है।</strong></p>", "question_heading": ""}, {"sr_no": 27, "question": "\r\n<p>दिए गए समीकरण को संतुलित करने के लिए * चिह्न को क्रमिक रूप से प्रतिस्थापित करने के लिए गणितीय चिह्नों के सही संयोजन का चयन कीजिए।</p>\r\n\r\n<p>(<span class=\"math-tex\">\\(\\sqrt {729 * 9}\\)</span>) * 67 * 81 * (4 * 6) * 19</p>", "option1": "\r\n<p>+, -, +, &divide;, =, &times; </p>", "option2": "\r\n<p>&times;, +, -, +, &times;, =</p>", "option3": "\r\n<p>+, -, &divide;, =, -, &times; </p>", "option4": "\r\n<p>&divide;, +, =, -, &times;, +</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>व्याख्या:</strong></p>\r\n\r\n<div>हम दिए गए समीकरण में मानों को प्रतिस्थापित करते हैं और इसे BODMAS नियम का उपयोग करके हल करते हैं<br />\r\nविकल्प 1) <span>+, -, +, &divide;, =, &times; </span><br />\r\n<span><u><strong>(<span class=\"math-tex\">\\(\\sqrt {729 + 9}\\)</span>)</strong></u> - 67 + 81 &divide; (4 = 6) &times; 19<br />\r\n27.1 -  67 +  <u><strong>81 </strong></u></span><u><strong><span>&divide;</span></strong></u><span><u><strong> 4</strong></u> =  6  &times; 19<br />\r\n27.1 -  67 + 20.25 = <u><strong>6 </strong></u></span><u><strong><span>&times;  19</span></strong></u><br />\r\n<span><u><strong>27.1</strong></u> - 67 <u><strong>+ 20.25</strong></u> = 114<br />\r\n<u><strong>47.35 - 67</strong></u> = 114<br />\r\n-19.65 </span>&ne;<span> 114</span></div>\r\n\r\n<p>विकल्प 2) &times;, +, -, +, &times;, =<br />\r\n<u><strong><span>( \\(\\sqrt {729 &times; 9}\\)</span></strong><strong>)</strong></u> + 67 - 81 + <u><strong>(4 &times; 6)</strong></u> = 19<br />\r\n<u><strong>81 + 67</strong></u> - 81 <u><strong>+ </strong></u><strong><u>24</u></strong> = 19<br />\r\n<u><strong>172 - 81</strong></u> = 19<br />\r\n91 <span>&ne;</span> 19</p>\r\n\r\n<p>विकल्प 3) +, -, &divide;, =, -, &times; <br />\r\n<u><strong><span>( \\(\\sqrt {729 + 9}\\)</span></strong><strong>)</strong></u> - 67 &divide; 81 = <u><strong>(4 - 6)</strong></u> &times; 19<br />\r\n27.1 - <u><strong>67 &divide; 81</strong></u> = -2 &times; 19<br />\r\n<span>27.1 - 0.8  = <u><strong>-2</strong></u></span><u><strong><span> &times; 19</span></strong></u><br />\r\n<u><strong><span>27.1 - 0.8</span></strong></u><span> = -38</span><br />\r\n26.3 &ne; -38</p>\r\n\r\n<p>विकल्प<span> 4) &divide;, +, =, -, &times;, +</span><br />\r\n<u><strong><span>( \\(\\sqrt {729 &divide; 9}\\)</span></strong></u><span><u><strong>)</strong></u> + 67 = 81 - <u><strong>(4 &times; 6)</strong></u> + 19<br />\r\n<u><strong>9 + 67</strong></u> = <u><strong>81</strong></u> - 24  <u><strong>+ 19</strong></u></span><br />\r\n76 = <strong><u>100 - 24</u></strong><br />\r\n76 = 76 </p>\r\n\r\n<p><strong>अतः, सही उत्तर विकल्प 4 है।</strong></p>", "question_heading": ""}, {"sr_no": 28, "question": "\r\n<p>आकाश 2 दिन व्यायाम करता है और अपने वजन को 1 <span>किग्रा </span>तक कम करता है। जब उसने व्यायाम करना शुरू किया तब उसका <span>वजन</span> 60 <span>किग्रा </span>था। आज आकाश का <span>वजन</span> 55 <span>किग्रा </span>है। उसने कितने दिन व्यायाम किया है?</p>", "option1": "\r\n<p>10 दिन</p>", "option2": "\r\n<p>9 दिन</p>", "option3": "\r\n<p>7 दिन</p>", "option4": "\r\n<p>8 दिन</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>आकाश 2 दिन व्यायाम करता है और अपना वजन 1 किग्रा कम करता है।</p>\r\n\r\n<p>जब उसने <span>व्यायाम </span>करना शुरू किया, तब उसका वजन था = 60 किग्रा</p>\r\n\r\n<p>आज आकाश का वजन = 55 किग्रा</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>आकाश के वजन में अंतर = (60 - 55) किग्रा = 5 किग्रा</p>\r\n\r\n<p>अब, प्रश्नानुसार</p>\r\n\r\n<p>आकाश2 दिन व्यायाम करता है और अपना वजन 1 किग्रा <span>तक </span>कम करता है।</p>\r\n\r\n<p>&rArr; 2 दिन = 1 किग्रा</p>\r\n\r\n<p>इसलिए, (2 &times; 5) दिन = (1 &times; 5) किग्रा</p>\r\n\r\n<p>&rArr; 10 दिन = 5 किग्रा</p>\r\n\r\n<p>इसलिए, उसने 10 दिनों तक व्यायाम किया है।</p>\r\n\r\n<p><strong>&there4; अभीष्ट उत्तर 10 दिन है।</strong></p>", "question_heading": ""}, {"sr_no": 29, "question": "\r\n<p><span>यदि PEDAGOGUE को DEPNFZEUG के रूप में कूटबद्ध किया जाता है, तो HAMSTRING को किस प्रकार कूटबद्ध किया जाएगा?</span></p>", "option1": "\r\n<p><span>MAHSUTGNI</span></p>", "option2": "\r\n<p><span>ASRNGITMH</span></p>", "option3": "\r\n<p><span>SMAHTGNIR</span></p>", "option4": "\r\n<p><span>MAHQSRGNI </span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989552_1742989552541362_thump.png\" style=\"width: 400px; height: 84px;\" /></figure>\r\n\r\n<p>यहाँ अनुसरण किया गया तर्क है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989607_1742989607667282_thump.png\" style=\"width: 200px; height: 104px;\" /></figure>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989693_1742989693259167_thump.png\" style=\"width: 200px; height: 105px;\" /></figure>\r\n\r\n<p>अत:, सही उत्तर <strong>&quot;MAHQSRGNI&quot; </strong>है। </p>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n<p>निम्न आकृति में त्रिभुजों की संख्या की गिनती कीजिए।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989740_1742989740745509_thump.png\" style=\"width: 150px; height: 147px;\" /></figure>", "option1": "\r\n<p>11</p>", "option2": "\r\n<p>18</p>", "option3": "\r\n<p>14</p>", "option4": "\r\n<p>16</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989800_1742989800477675_thump.png\" style=\"width: 150px; height: 158px;\" /></figure>\r\n\r\n<p><span>यहाँ 16 त्रिभुज हैं जिनके नाम इस प्रकार हैं,</span></p>\r\n\r\n<p><span>BOC, ADO, BCG, BOG, AFD, AOF, BEF, AGE,</span></p>\r\n\r\n<p><span>ABG, BAF, ABD, ABE, BAO, BHO, ACB और AHO</span></p>\r\n\r\n<p><span>अतः &lsquo;16&rsquo; सही उत्तर है। </span></p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p>निम्नलिखित में से कौन सा सबसे बड़ा है?</p>", "option1": "\r\n<p>0.725</p>", "option2": "\r\n<p><span class=\"math-tex\">\\(0.72\\bar5\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(0.7\\overline{25}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(0.\\overline{725}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त संकल्पना:</strong></p>\r\n\r\n<p>a.<span class=\"math-tex\">\\(\\bar b\\)</span> = a.bbbb....</p>\r\n\r\n<p>a.0<span class=\"math-tex\">\\(\\bar b\\)</span> = a.0bbbb....</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>उपरोक्त विकल्प के अनुसार,</p>\r\n\r\n<p>(1) 0.725 = 0.725</p>\r\n\r\n<p>(2) <span class=\"math-tex\">\\(0.72\\bar5\\)</span> = 0.72555....</p>\r\n\r\n<p>(3) <span class=\"math-tex\">\\(0.7\\overline{25}\\)</span> = 0.7252525...</p>\r\n\r\n<p>(4) <span class=\"math-tex\">\\(0.\\overline{725}\\)</span> = 0.725725725....</p>\r\n\r\n<p><span>उपरोक्त विकल्पों में से हम देख सकते हैं कि विकल्प (4) सबसे बड़ा है।</span></p>\r\n\r\n<p><strong>&there4; अभीष्ट उत्तर <span class=\"math-tex\">\\(0.\\overline{725}\\)</span></strong><span>है।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>दो रेलगाड़ियाँ एक ही दिशा में क्रमश: 50 km/hr और 32 km/hr की चाल से गतिमान हैं। धीमी रेलगाड़ी में एक आदमी प्रेक्षण करता है कि तीव्र <span>रेलगाड़ी </span>को उससे पूरी गुजरने में 15 सेकंड व्यतीत होते हैं। <span>तीव्र  रेलगाड़ी </span>की लंबाई क्या है?</p>", "option1": "\r\n<p>75 m</p>", "option2": "\r\n<p>125 m</p>", "option3": "\r\n<p>150 m</p>", "option4": "\r\n<div><span class=\"math-tex\">\\(\\frac{625}{3}\\)</span> m</div>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>रेलगाड़ी </span>(s<sub>1</sub>) <span>की चाल</span> = 50 km/hr</p>\r\n\r\n<p><span>रेलगाड़ी (s 2 )  की चाल</span> = 32 km/hr</p>\r\n\r\n<p>समय = 15 s</p>\r\n\r\n<p><strong>प्रयुक्त संकल्पना:</strong></p>\r\n\r\n<p><span>यदि रेलगाड़ियाँ एक ही दिशा में गतिमान हैं</span>,</p>\r\n\r\n<p><span>रेलगाड़ियों की आपेक्षिक चाल </span>= (s<sub>1</sub> - s<sub>2</sub>)</p>\r\n\r\n<p><span>तीव्र रेलगाड़ी की लंबाई = चाल &times; समय</span></p>\r\n\r\n<p><span>km/h को m/s में बदलने के लिए हम दी गई संख्या को</span><span class=\"math-tex\">\\(\\frac{5}{{18}}\\)</span> से <span>गुणा करते हैं। </span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>उपरोक्त अवधारणा के अनुसार,</p>\r\n\r\n<p><span>चूँकि रेलगाड़ियाँ एक ही दिशा में गतिमान हैं, ट्रेनों की आपेक्षिक चाल (s 1  - s 2 ) है,</span></p>\r\n\r\n<p><span>&rArr; (50 - 32) km/hr = 18 km/hr</span></p>\r\n\r\n<p><span>अब, km/h को m/s में बदलने के लिए हम दी गई संख्या को   \\(\\frac{5}{{18}}\\)  से  गुणा करते हैं। </span></p>\r\n\r\n<p>&rArr; (18 &times; <span class=\"math-tex\">\\(\\frac{5}{{18}}\\)</span>) = 5 m/s</p>\r\n\r\n<p><span>अब, तीव्र रेलगाड़ी की लंबाई</span> = (5 &times; 15) =<strong> 75 m</strong></p>\r\n\r\n<p><strong>&there4;तीव्र रेलगाड़ी <span>की लंबाई 75 मीटर है।</span></strong></p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>निम्नलिखित में से कौन-सा प्रतीक दिए गए व्यंजक में प्रश्नवाचक चिह्न (?) को प्रतिस्थापित करेगा ताकि व्यंजक &#39;M &lt; N&#39; निश्चित रूप से सही हो सके?</p>\r\n\r\n<p>K &ge; I &gt; N &ge; G ? D &ge; M</p>", "option1": "\r\n<p>&lt;</p>", "option2": "\r\n<p>&ge;</p>", "option3": "\r\n<p>&le;</p>", "option4": "\r\n<p>&gt;</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>व्यंजक &#39;M &lt; N&#39; को निश्चित रूप से सत्य बनाने के लिए, हमें दिए गए व्यंजक में प्रश्नवाचक चिह्न (?) के स्थान पर उपयुक्त प्रतीक का चयन करना होगा:</p>\r\n\r\n<p>K &ge; I &gt; N &ge; G ? D &ge; M</p>\r\n\r\n<p>&#39;M &lt; N&#39; को सत्य बनाने के लिए, प्रश्नवाचक चिह्न के स्थान पर जो प्रतीक होना चाहिए, उसे वह संबंध दर्शाना चाहिए, जहाँ M, N से छोटा है। दिए गए विकल्पों में से:</p>\r\n\r\n<p>&lt; (इससे छोटा)<br />\r\n&ge; (इससे बड़ा या इसके बराबर)<br />\r\n&le; (इससे छोटा या इसके बराबर)<br />\r\n&gt; (इससे बड़ा)</p>\r\n\r\n<p>हम विकल्प 2 अर्थात (&ge;) और विकल्प 3 अर्थात (&le;) को निरस्त कर सकते हैं क्योंकि वे ऐसे संबंध को नहीं दर्शाते हैं, जहाँ M, N से छोटा है।</p>\r\n\r\n<p><span>अतः  सही उत्तर  </span><strong>&quot;<span>&gt;</span> &quot;</strong><span> है।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": "\r\n<p>यदि 18 फरवरी, 2005 को शुक्रवार है, तब 18 फरवरी, 2007 को कौन-सा दिन होगा?</p>", "option1": "\r\n<p>रविवार</p>", "option2": "\r\n<p>सोमवार</p>", "option3": "\r\n<p>मंगलवार</p>", "option4": "\r\n<p>बुधवार</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u><strong>दिया गया है:</strong></u></p>\r\n\r\n<p>18 फरवरी 2005 को <strong>शुक्रवार</strong> है।</p>\r\n\r\n<p><u><strong>अवधारणा:</strong></u></p>\r\n\r\n<p>एक <strong>सामान्य वर्ष</strong> में दिनों की संख्या 365 होती है अर्थात <strong>52 सप्ताह 1 दिन</strong> होते हैं।</p>\r\n\r\n<p>इसलिए, हम कह सकते हैं कि प्रत्येक वर्ष हमें <strong>1 विषम दिन</strong> मिलता है।</p>\r\n\r\n<p>एक <strong>अधिवर्ष</strong> में दिनों की संख्या 366 होती है अर्थात <strong>52 सप्ताह 2 दिन</strong> होते हैं। </p>\r\n\r\n<p><span>इसलिए</span>, हम कह सकते हैं कि प्रत्येक अधिवर्ष में हमें <strong>2 विषम दिन</strong> मिलते हैं।</p>\r\n\r\n<p><u><strong><span>गणना:</span></strong></u></p>\r\n\r\n<p>2005 और 2007 के बीच <strong>कोई अधिवर्ष नहीं</strong> है।</p>\r\n\r\n<p><u>18 फरवरी 2005 से 18 फरवरी 2006 तक </u>: <strong>केवल 1 विषम दिन है।</strong></p>\r\n\r\n<p><span>इसलिए</span>,<strong> 18 फरवरी, 2006 = शुक्रवार + 1 = शनिवार।</strong></p>\r\n\r\n<p><u>18 फरवरी 2006 से 18 फरवरी 2007 तक</u> : <strong>केवल 1 विषम दिन है।</strong></p>\r\n\r\n<p><span>इसलिए</span>, <strong>18 फरवरी 2007 = शनिवार + 1 = रविवार</strong></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;रविवार&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>दिए गए संख्या-युग्मों में दूसरी संख्या, पहली संख्या पर कुछ गणितीय संक्रिया(एँ) करके प्राप्त की जाती है। एक को छोड़कर सभी संख्या-युग्मों में एक ही संक्रिया(ओं) का अनुसरण किया जाता है। वह विषम संख्या-युग्म ज्ञात कीजिए।</p>", "option1": "\r\n<p><span>441 : 49</span></p>", "option2": "\r\n<p><span>729 : 81</span></p>", "option3": "\r\n<p><span>369 : 41</span></p>", "option4": "\r\n<p><span>343 : 47</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया स्वरुप है:</p>\r\n\r\n<p><strong>तर्क: पहली संख्या </strong><span>&divide; </span><strong>दूसरी संख्या = 9</strong></p>\r\n\r\n<p><strong>व्याख्या:</strong></p>\r\n\r\n<p>विकल्प 1. 441 49 = 9</p>\r\n\r\n<p>विकल्प 2. 729 81 = 9</p>\r\n\r\n<p>विकल्प 3. 369 41 = 9</p>\r\n\r\n<p><strong>विकल्प 4. </strong><span>343 &divide; 47 = 7. 29 </span><strong>अर्थात् </strong><span>&ne; </span><strong>9</strong></p>\r\n\r\n<p>अत:, <strong>सही उत्तर</strong><span>343 : 47 </span>है।</p>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n\r\n<p>कागज के एक टुकड़े को मोड़ने का क्रम और जिस तरह से मुड़ा हुआ कागज काटा गया है, उसे निम्नलिखित आकृतियों में दिखाया गया है। खोलने पर यह <span>कागज </span>कैसा लगेगा?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742989995_1742989995205287_thump.png\" style=\"width: 200px; height: 64px;\" /></figure>", "option1": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990174_1742990174174692_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "option2": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990234_1742990234676392_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "option3": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990262_1742990262156279_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742990313_1742990313784079_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><u><strong>दिया गया है:</strong></u></p>\r\n\r\n<p>18 फरवरी 2005 को <strong>शुक्रवार</strong> है।</p>\r\n\r\n<p><u><strong>अवधारणा:</strong></u></p>\r\n\r\n<p>एक <strong>सामान्य वर्ष</strong> में दिनों की संख्या 365 होती है अर्थात <strong>52 सप्ताह 1 दिन</strong> होते हैं।</p>\r\n\r\n<p>इसलिए, हम कह सकते हैं कि प्रत्येक वर्ष हमें <strong>1 विषम दिन</strong> मिलता है।</p>\r\n\r\n<p>एक <strong>अधिवर्ष</strong> में दिनों की संख्या 366 होती है अर्थात <strong>52 सप्ताह 2 दिन</strong> होते हैं। </p>\r\n\r\n<p><span>इसलिए</span>, हम कह सकते हैं कि प्रत्येक अधिवर्ष में हमें <strong>2 विषम दिन</strong> मिलते हैं।</p>\r\n\r\n<p><u><strong><span>गणना:</span></strong></u></p>\r\n\r\n<p>2005 और 2007 के बीच <strong>कोई अधिवर्ष नहीं</strong> है।</p>\r\n\r\n<p><u>18 फरवरी 2005 से 18 फरवरी 2006 तक </u>: <strong>केवल 1 विषम दिन है।</strong></p>\r\n\r\n<p><span>इसलिए</span>,<strong> 18 फरवरी, 2006 = शुक्रवार + 1 = शनिवार।</strong></p>\r\n\r\n<p><u>18 फरवरी 2006 से 18 फरवरी 2007 तक</u> : <strong>केवल 1 विषम दिन है।</strong></p>\r\n\r\n<p><span>इसलिए</span>, <strong>18 फरवरी 2007 = शनिवार + 1 = रविवार</strong></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;रविवार&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n\r\n<p>चार अक्षर-समूह दिए गए हैं जिनमें से तीन किसी निश्चित प्रकार से समान हैं और एक भिन्न है। उस अक्षर -समूह का चयन कीजिए, जो अन्य से भिन्न है।</p>", "option1": "\r\n\r\n<p>QSUWY</p>", "option2": "\r\n\r\n<p>GIKMO</p>", "option3": "\r\n\r\n<p>PRTVY</p>", "option4": "\r\n\r\n<p>ACEGI</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p>यहाँ अनुसरित तर्क निम्न है:</p>\r\n\r\n<ol>\r\n\t<li><span>QSUWY &rarr; Q + 2 = S; S + 2 = U; U + 2 = W; W + 2 = Y</span></li>\r\n\t<li><span>GIKMO &rarr; G + 2 = I; I + 2 = K; K + 2 = M; M + 2 = O </span></li>\r\n\t<li><strong><span>PRTVY &rarr; P + 2 = R; R + 2 = T; T + 2 = V; V + 3 = Y</span></strong></li>\r\n\t<li><span>ACEGI &rarr; A + 2 = C; C + 2 = E; E + 2 = G; G + 2 = I</span></li>\r\n</ol>\r\n\r\n<p><span>अतः, &#39;<strong>PRTVY</strong>&#39; बेजोड़ है। </span></p>", "question_heading": ""}, {"sr_no": 38, "question": "\r\n<p>दिए गए प्रश्न को पढ़िए और निर्णय लीजिए कि निम्नलिखित में से कौन-सा तर्क प्रबल है।</p>\r\n\r\n<p><strong>कथन :</strong></p>\r\n\r\n<p>क्या भारत में सभी अप्रत्यक्ष करों को एक सामान और सेवा कर (GST) में जोड़ा जाना चाहिए?</p>\r\n\r\n<p><strong>तर्क :</strong></p>\r\n\r\n<p>I. हाँ। यह कर संग्रह प्रणाली को काफी सरल बना देगा और इससे कर एकत्र करने की लागत भी कम हो जाएगी।</p>\r\n\r\n<p>II. हाँ। निर्माताओं और व्यापारियों को इससे फायदा होगा, जो बदले में कर संग्रह को बढ़ावा देगा।</p>\r\n\r\n<p>III. नहीं। किसी अन्य देश ने ऐसी प्रणाली नहीं अपनाई है।</p>", "option1": "\r\n<p>केवल तर्क I प्रबल है।</p>", "option2": "\r\n<p><span>केवल तर्क II </span>प्रबल <span>है।</span></p>", "option3": "\r\n<p>केवल तर्क I और II प्रबल हैं।</p>", "option4": "\r\n<p><span>केवल तर्क III </span>प्रबल <span>है।</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिया गया कथन इस बारे में एक प्रश्न प्रस्तुत करता है कि क्या भारत में सभी अप्रत्यक्ष करों को एक वस्तु और सेवा कर (GST) में जोड़ा जाना चाहिए। विभिन्न पदों के समर्थन में तीन तर्क दिए गए हैं:</p>\r\n\r\n<p><strong>तर्क I </strong>मजबूत है क्योंकि सभी अप्रत्यक्ष करों को एक <span>GST</span> में जोड़ने से कर संग्रह तंत्र को सरल बनाने और कर एकत्र करने की लागत को कम करने की उम्मीद है। प्रबंधन के लिए कम करों और एक सरल कर संरचना के साथ, सरकार कर संग्रह की लागत को कम करने और प्रक्रिया को और अधिक कुशल बनाने में सक्षम हो सकती है।</p>\r\n\r\n<p><strong>तर्क II</strong> भी मजबूत है क्योंकि निर्माता और व्यापारी एकल GST से लाभान्वित हो सकते हैं क्योंकि यह उनके कर दायित्वों को सरल करेगा और अनुपालन बोझ को कम करेगा। बदले में, इससे अनुपालन में वृद्धि हो सकती है और कर संग्रह में वृद्धि हो सकती है।</p>\r\n\r\n<p><strong>तर्क III </strong>कमजोर है क्योंकि तथ्य यह है कि किसी अन्य देश ने ऐसी प्रणाली को नहीं अपनाया है, इसका मतलब यह नहीं है कि यह भारत के लिए एक अच्छा विचार नहीं है। भारतीय अर्थव्यवस्था की अपनी अनूठी विशेषताएँ और चुनौतियाँ हैं, और इसके लिए अन्य देशों की तुलना में कर संग्रह और प्रबंधन के लिए एक अलग दृष्टिकोण की आवश्यकता हो सकती है।</p>\r\n\r\n<p>इसलिए, तर्क I और तर्क II दोनों प्रबल हैं, जबकि तर्क III दुर्बल है।</p>\r\n\r\n<p>अतः, सही उत्तर है<strong> &quot;केवल तर्क I और II प्रबल हैं&quot;।</strong></p>", "question_heading": ""}, {"sr_no": 39, "question": "\r\n\r\n<p>एक टेलीविजन निर्माता प्रत्येक टीवी सेट को 14,400 रुपये में बेचकर 20% लाभ प्राप्त करता है यदि उत्पादन लागत में 15% की वृद्धि होती है तो 15% का लाभ प्राप्त करने के लिए एक टीवी सेट का नया विक्रय मूल्य क्या होना चाहिए?</p>", "option1": "\r\n\r\n<p>15,870</p>", "option2": "\r\n\r\n<p>13,800</p>", "option3": "\r\n\r\n<p>12,000</p>", "option4": "\r\n\r\n<p>15,000</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>P% = 20%</p>\r\n\r\n<p>विक्रय मूल्य (SP) = 14,400 रुपये</p>\r\n\r\n<p>नया क्रय मूल्य (CP) = 1.15 &times; क्रय मूल्य (CP)</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>CP = <span class=\"math-tex\">\\(\\dfrac{100}{100 + P\\%} × SP\\)</span></p>\r\n\r\n<p>SP = <span class=\"math-tex\">\\(\\dfrac{100 + P\\%}{100} × CP \\)</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>&rArr; CP = <span class=\"math-tex\">\\(\\dfrac{100}{100 + 20} × 14400\\)</span></p>\r\n\r\n<p>&rArr; CP =  2,000 रुपये</p>\r\n\r\n<p>नया CP = 1.15 &times; 12000 = 13,800 रुपये</p>\r\n\r\n<p>15% लाभ प्राप्त करने के लिए, नया SP  होगा,</p>\r\n\r\n<p>&rArr; SP = <span class=\"math-tex\">\\(\\dfrac{100 + 15}{100} × 13800 \\)</span></p>\r\n\r\n<p>&rArr; SP = 1.15 &times; 13800 = रु. 15,870</p>\r\n\r\n<p><strong>&there4; 15% का लाभ प्राप्त करने के लिए एक टीवी सेट का नया विक्रय मूल्य 15,870 रुपये होना चाहिए।</strong></p>\r\n\r\n<p><br />\r\nउन प्रश्नों में जहाँ CP में m% की वृद्धि होती है और लाभ में भी m% की वृद्धि होनी चाहिए, नए SP की गणना इस प्रकार की जा सकती है,</p>\r\n\r\n<p>SP = (1+ <span class=\"math-tex\">\\(\\dfrac{m}{100}\\)</span> ) 2 &times; CP</p>\r\n\r\n<p>जहाँ, SP = नया विक्रय मूल्य</p>\r\n\r\n<p>CP = आरम्भिक क्रय मूल्य</p>\r\n\r\n<p>इस प्रश्न में,</p>\r\n\r\n<p>CP = 12,000 रुपये</p>\r\n\r\n<p>नया SP = (1.15)2 &times; 12000 = 15,870 रुपये</p>", "question_heading": ""}, {"sr_no": 40, "question": "\r\n<p>यदि &#39;&divide;&#39; का अर्थ &#39;&times;&#39;, &#39;&times;&#39; का अर्थ &#39;&divide;&#39;, &#39;+&#39; का अर्थ &#39;-&#39; और &#39;-&#39; का अर्थ &#39;+&#39; है, तब दिए गए विकल्पों में से उस संख्या का चयन कीजिये जो <span>निम्नलिखित समीकरण में </span>प्रश्नवाचक चिन्ह (?) को प्रतिस्थापित कर सकती है।</p>\r\n\r\n<p>12 &divide; 3 + 4 &ndash; 28 &times; 7 = 18 &times; 3 &divide; (? + 9)</p>", "option1": "\r\n<p>20</p>", "option2": "\r\n<p>15</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>16</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p>जानकारी को विकूटित करने पर,       </p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>चिह्न</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>अर्थ</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p><span>दिया गया है</span>:</p>\r\n\r\n<p>12 &divide; 3 + 4 &ndash; 28 &times; 7 = 18 &times; 3 &divide; (? + 9)</p>\r\n\r\n<p>माना &ldquo;?&rdquo;, &lsquo;Z&rsquo; है</p>\r\n\r\n<p><span>चिह्नों को बाएँ से दाएँ परिवर्तित करने के बाद और BODMAS नियम का उपयोग करने पर,</span></p>\r\n\r\n<p>=&gt; 12 &times; 3 - 4 + <strong><em><u>28 &divide; 7</u></em></strong> = <strong><em><u>18 &divide; 3</u></em></strong> &times; (Z - 9)</p>\r\n\r\n<p>=&gt; <strong><em><u>12 &times; 3</u></em></strong> - 4 + 4 = 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; <strong><em><u>36</u></em></strong> - 4 <strong><em><u>+ 4</u></em></strong> = 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; <strong><em><u>40 - 4</u></em></strong> = 6 &times; (Z - 9)</p>\r\n\r\n<p>=&gt; 36 = <strong><em><u>6</u></em></strong> &times; (Z - 9)</p>\r\n\r\n<p>=&gt; Z &ndash; 9 = <strong><em><u>36 &divide; 6</u></em></strong></p>\r\n\r\n<p>=&gt; Z <strong><em><u>- 9</u></em></strong> = 6</p>\r\n\r\n<p>=&gt; Z = <strong><em><u>6 + 9</u></em></strong></p>\r\n\r\n<p>=&gt; Z = 15</p>\r\n\r\n<p><span>अतः, सही उत्तर <strong>&ldquo;15&rdquo;</strong> है।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": "\r\n<p>दो व्यक्ति P और Q एक स्थान से क्रमशः 5 km और 6.5 km प्रति घंटा की चाल से चलना प्रारंभ करते हैं। यदि वे विपरीत दिशा में चलते है, तो वे एक-दूसरे से 92 km दूर होने में कितना समय लेंगे?</p>", "option1": "\r\n<p>2 घंटे</p>", "option2": "\r\n<p>4 घंटे</p>", "option3": "\r\n<p>6 घंटे</p>", "option4": "\r\n<p>8 घंटे</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>P की चाल (s<sub>1</sub>) = 5 km/hr</p>\r\n\r\n<p>Q की चाल(s<sub>2</sub>) = 6.5 m/hr</p>\r\n\r\n<p>दूरी = 92 km</p>\r\n\r\n<p><strong>प्रयुक्त संकल्पना:</strong></p>\r\n\r\n<p><span>यदि दो व्यक्ति विपरीत दिशा में चलते हैं</span>,</p>\r\n\r\n<p>आपेक्षिक चाल = (s<sub>1</sub> + s<sub>2</sub>)</p>\r\n\r\n<p>समय = <span class=\"math-tex\">\\(\\frac{Distance}{{Speed}}\\)</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>उपरोक्त अवधारणा के अनुसार,</p>\r\n\r\n<p><span>दो व्यक्तियों की आपेक्षिक चाल</span> = (5 + 6.5) = 11.5 km/hr</p>\r\n\r\n<p><span>अब प्रश्न के अनुसार,</span></p>\r\n\r\n<p><span>समय =  \\(\\frac{Distance}{{Speed}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{92}{{11.5}}\\)</span> = <strong>8 hr</strong></p>\r\n\r\n<p><strong>&there4; <span>अभीष्ट समय 8 घंटा है।</span></strong></p>", "question_heading": ""}, {"sr_no": 42, "question": "\r\n<p>A, B, C, D, E, F, G और H एक वर्गाकार मेज के चारों ओर बैठे हैं; उनमें से चार इसके चारों कोनों पर बैठे हैं, जबकि चार भुजाओं के मध्य में बैठे हैं। चारों कोनों पर बैठे व्यक्तियों का मुख केंद्र की ओर है, जबकि भुजाओं के मध्य में बैठे व्यक्तियों का मुख बाहर की ओर है। F, D के बाईं ओर चौथे स्थान पर बैठा है। D का मुख बाहर की और है।</p>\r\n\r\n<p>C, F के दाईं ओर ठीक बगल में बैठा है। A, H के दाईं ओर तीसरे स्थान पर बैठा है। G और B के बीच केवल दो व्यक्ति बैठे हैं। E, B के दाईं <span>ओर </span>ठीक बगल में और F के बाईं ओर ठीक बगल में बैठा है। H, E के दाईं ओर दूसरे स्थान पर बैठा है। D के सापेक्ष A का स्थान कौनसा है?</p>", "option1": "\r\n<p><span>दाईं ओर चौथा </span></p>", "option2": "\r\n<p><span>बाईं ओर दूसरा </span></p>", "option3": "\r\n<p><span>बाईं  ओर तीसरा</span></p>", "option4": "\r\n<p><span>दाईं ओर</span> तीसरा </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span><strong>A, B, C, D, E, F, G और H</strong> एक वर्गाकार मेज के चारों ओ
