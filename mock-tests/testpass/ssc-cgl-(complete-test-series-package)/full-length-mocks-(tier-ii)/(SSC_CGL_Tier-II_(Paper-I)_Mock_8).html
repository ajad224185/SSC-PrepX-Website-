ove the Environment\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (d) The state shall endeavor to protect and improve the environment.\n  <br>Directive Principles of State Policy are guidelines or principles laid down in the Constitution of India that are aimed at guiding the state in the governance of the country. While they are not enforceable by any court, they are fundamental in the governance of the country and it is the duty of the state to apply these principles in making laws.\n  <br>Option (d) is one of the Directive Principles of State Policy. It emphasizes that the state has a responsibility to protect and improve the environment.\n  <br>Article 48A of the Directive Principles describes to protect and improve the environment and to safeguard forests and wild life. Hence, Option (d) is correct.\n  <br>Note - Article 48A, which ensures Protection and improvement of environment and safeguarding of forests and wild life, was added by the Forty-second Amendment Act, 1976.\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "Which of the following is / are included in Akbar's NavRatna?\n  <br>1. Abul fazal\n  <br>2. Faizi\n  <br>3. Raja Maan Singh\n  <br>Code:\n  <br>", "option1": "1 only\n  <br>", "option2": "1 and 3 only\n  <br>", "option3": "1 and 2 only\n  <br>", "option4": "1, 2 and 3\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d) 1, 2 and 3. Abul Fazal, Faizi, and Raja Maan Singh were all part of Akbar's Navaratnas. The Navaratnas were a group of nine intellectuals and advisors who served Akbar during his reign. They were chosen for their exceptional talents and knowledge in a variety of fields, including literature, music, mathematics, and politics.\n  <br>Abul Fazal was Akbar's chief advisor and author of the Akbarnama, a chronicle of Akbar's reign. Faizi was a poet laureate and scholar, and Raja Maan Singh was a military commander and administrator.\n  <br>Note - The Navratna of Akbar includes some famous personalities in Indian histories, such as Raja Todar Mal, Birbal, Mulla Do-Piyaza, Raja Maan Singh, Fakir Aziao-Din, Tansen, Faizi, Abul Fazl, and Abdul Rahim Khan-I-Khana.\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "In the Indian parliamentary system, Parliament consists of\n  <br>", "option1": "President\n  <br>", "option2": "Lok Sabha and Rajya Sabha\n  <br>", "option3": "Both (a) & (b)\n  <br>", "option4": "Only (b)\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The parliament of India consists of three parts, 1. the President 2. Lok Sabha or the House of the People 3. Rajya Sabha or Council of States. Hence, both (a) & (b) are correct.\n  <br> The Indian Parliament is a bicameral legislature, which means that it has two houses. The upper house is the Rajya Sabha (Council of States), and the lower house is the Lok Sabha (House of the People). The President of India is the head of the Parliament, but he/she does not have a legislative role.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "Which of the following writs is said to be a guarantor of personal freedom\n  <br>", "option1": "Mandamus\n  <br>", "option2": "Habeas Corpus\n  <br>", "option3": "Quo warranto\n  <br>", "option4": "Certiorari\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (b) Habeas Corpus. The Habeas Corpus writ is said to be a guarantor of personal freedom. Habeas Corpus is a Latin term that literally means ‘to have the body of’.\n  <br>It is an order issued by the court to a person who has detained another person, to produce the body of the latter before it.  The court then examines the cause and legality of detention.  It would set the detained person free if the detention is found to be illegal.  Thus, this writ is a bulwark of individual liberty against arbitrary detention. Hence, Option (b) is correct.\n  <br>Note - Habeas Corpus acts as a check against arbitrary detention or imprisonment and ensures that individuals are not unlawfully deprived of their personal freedom. It is often referred to as the \"great writ of liberty\" as it provides crucial protection for personal freedom.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "The proposed Rowlett Act of 1919 allowed the detention of political prisoners without trial for __________.\n  <br>", "option1": "two years\n  <br>", "option2": "six months\n  <br>", "option3": "two months\n  <br>", "option4": "one year\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The proposed Rowlett Act of 1919 allowed the detention of political prisoners without trial for two years.\n  <br>The Anarchical and Revolutionary Crimes Act of 1919 is popularly known as the Rowlatt Act.\n  <br> \n  <b>Provisions of the Rowlett Act of 1919:</b> \n  <br>The purpose of the Act was to curb the growing nationalist upsurge in the country.\n  <br>The Rowlett Act allowed the government to arrest and imprison anyone suspected of \"revolutionary\" or \"anarchist\" activities without trial for up to two years. It also authorized the government to conduct searches and seizures without a warrant and to detain individuals without charge for up to six months.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Which of the following is correctly matched?\n  <br>", "option1": "Kaal Baisakhi – Autumn winds\n  <br>", "option2": "Trade winds – Winter snow storm\n  <br>", "option3": "Loo – Hot wind\n  <br>", "option4": "Loo – Winter stormy winds\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "From the given options, Loo – Hot wind, is correctly matched.\n  <br>\"Loo\" is a term used to describe a hot, dry, and dusty wind that blows across the Indian subcontinent, particularly during the summer months. The term \"loo\" is derived from the Hindi word \"loo,\" which means \"wind.\"\n  <br>Kal Baishakhi, also known as Nor'westers, is a type of storm that occurs during the months of April and May.\n  <br>Trade winds are the dominant permanent east-to-west winds that flow through the equatorial region of the Planet.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "What is the average circumference of the standard cricket ball in international cricket?\n  <br>", "option1": "7.89 inches – 8.45 inches\n  <br>", "option2": "10.46 inches – 10.90 inches\n  <br>", "option3": "9.45 inches – 10.20 inches\n  <br>", "option4": "8.81 inches – 9 inches\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The average circumference of the standard cricket ball used in international cricket is between 22.4 and 22.9 centimeters (8.81 and 9.00 inches).\n  <br>According to the laws of cricket, the ball must weigh between 155.9 and 163.0 grams (5.5 and 5.75 ounces) and have a diameter between 6.81 and 7.06 centimeters (2.68 and 2.78 inches).\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Which of the following is NOT correct regarding King Harshavardhana?\n  <br>", "option1": "Harshavardhana ruled nearly about 1400 years ago\n  <br>", "option2": "Xuan Zang spent a lot of time at Harsha’s court\n  <br>", "option3": "Harshavardhana’s court poet was Harishena\n  <br>", "option4": "Harshacharita is a biography written on Harshavardhana\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Harshavardhana, also known as Harsha, was an Indian emperor who ruled from 606 to 647 CE. He belonged to the Pushyabhuti dynasty. Harishena was not a court poet of Harshavardhana.\n  <br>Harisena was a 4th-century Sanskrit poet, panegyrist, and government minister. He was an important figure in the court of the Gupta emperor, Samudragupta.\n  <br>The court poet of Harshavardhana was Banabhatta. Banabhatta's most famous work is the Harshacharita, a biography of Emperor Harshavardhana. In addition to the Harshacharita, Banabhatta also wrote Kadambari, a romantic novel.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "How does hydrochloric acid help in facilitating the action of pepsin?\n  <br>", "option1": "Hydrochloric acid creates an acidic medium which facilitates the action of the enzyme pepsin.\n  <br>", "option2": "Hydrochloric acid helps break down pepsin.\n  <br>", "option3": "Hydrochloric acid creates an alkaline medium which facilitates the action of the enzyme pepsin.\n  <br>", "option4": "Hydrochloric acid creates a basic medium that facilitates the action of the enzyme pepsin.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Hydrochloric acid (HCl) helps to activate the inactive precursor of pepsin, known as pepsinogen, into the active form of pepsin. HCl helps to create an acidic environment in the stomach, with a pH between 1.5 to 3.5.\n  <br>The acidic environment created by HCl breaks off a small portion of the pepsinogen molecule, which converts it into active pepsin. Pepsinogen is secreted by the chief cells in the gastric glands of the stomach.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Match List I with List II:\n  <br>  \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697787400603image31.png\"> \n  <br> Select the correct answer from the code given below:\n  <br> A B C D\n  <br>", "option1": "1 2 3 4\n  <br>", "option2": "3 2 4 1\n  <br>", "option3": "2 3 4 1\n  <br>", "option4": "4 3 2 1\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) 1 2 3 4.\n  <br>The match between List I and List II is as follows:\n  <br>A. Tata Institute of Fundamental Research (TIFR) - Mumbai, India\n  <br>B. Indian Institute of Astrophysics (IIA) - Bengaluru, India\n  <br>C. National Institute of Oceanography (NIO) - Goa, India\n  <br>D. Central Drug Research Institute (CDRI) - Lucknow, India\n  <br>So, the correct code is 1 2 3 4.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Which of the following statements is/are correct regarding the Pradhan Mantri Ujjwala Yojana?\n  <br>A. The scheme aims to provide free LPG connections to women from Below Poverty Line (BPL) households.\n  <br>B. The scheme was launched by the Ministry of Petroleum and Natural Gas.\n  <br>C. The scheme also provides financial assistance of Rs. 1600 for each LPG connection to eligible BPL households.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A, B, and C.\n  <br>The Pradhan Mantri Ujjwala Yojana (PMUY) is a government scheme that aims to provide free LPG connections to women from Below Poverty Line (BPL) households. The scheme was launched by the Ministry of Petroleum and Natural Gas in May 2016.\n  <br>Under the PMUY, the government provides financial assistance of Rs. 1600 for each LPG connection to eligible BPL households. The beneficiary woman is required to pay a security deposit of Rs. 1400, which is refunded after three years of regular usage of the LPG connection.\n  <br>So, all of the statements A, B, and C are correct.\n  <br> \n  <b>Note -</b> Pradhan Mantri Ujjwala Yojana was launched by Hon’ble Prime Minister Shri Narendra Modi on May 1st, 2016 in Ballia, Uttar Pradesh.\n  <br> Tagline - “Swachh Indhan, Behtar Jeevan\".\n  <br>Ministry of Petroleum & Natural Gas is implementing the scheme.\n  <br>The scheme was replaced by the Ujjwala Yojana 2.0 in 2021. The Prime Minister launched the Ujjwala Scheme II on 10 August 2021 to provide fuel to 1 crore families who were left out of the first scheme.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Which of the following is correct about uniform acceleration?\n  <br>", "option1": "An object moving on friction-less surface can gain uniform acceleration.\n  <br>", "option2": "An object under free fall is an example of uniform acceleration.\n  <br>", "option3": "An object moving with constant speed is an example of uniform acceleration.\n  <br>", "option4": "Motion of a spring is an example of uniform acceleration.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) An object under free fall is an example of uniform acceleration.\n  <br>Uniform acceleration means that the velocity of an object is increasing at a constant rate. This can only happen if the net force acting on the object is constant.\n  <br>In the case of free fall, the only force acting on the object is gravity, and gravity is a constant force. So, an object under free fall will have uniform acceleration.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "The induced current is the highest when the direction of motion of the coil is:\n  <br>", "option1": "not at right angles to the magnetic field\n  <br>", "option2": "at right angles to the electricity\n  <br>", "option3": "at right angles to the electric source\n  <br>", "option4": "at right angles to the magnetic field\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d) at right angles to the magnetic field.\n  <br>The induced current is produced when a coil is moving in a magnetic field. The amount of induced current is proportional to the rate of change of the magnetic flux through the coil. The rate of change of the magnetic flux is greatest when the direction of motion of the coil is at right angles to the magnetic field.\n  <br>According to Faraday's law of electromagnetic induction, the magnitude of the induced electromotive force (EMF) or the induced current in a coil is maximum when the magnetic field lines are perpendicular (or at right angles) to the motion of the coil.\n  <br>So, the induced current is the highest when the direction of motion of the coil is at right angles to the magnetic field.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Hydrogen resembles the properties of which two groups of the periodic table?\n  <br>", "option1": "Group 2 and group 17\n  <br>", "option2": "Group 1 and group 3\n  <br>", "option3": "Group 1 and group 17\n  <br>", "option4": "Group 2 and group 4\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Hydrogen resembles the properties of (c) Group 1 and Group 17 of the periodic table.\n  <br>Hydrogen shares some similarities with Group 1 elements, also known as alkali metals, because it has a single electron in its outermost shell, similar to the alkali metals. Additionally, hydrogen can form positive ions, similar to alkali metals.\n  <br>Hydrogen also exhibits similarities to Group 17 elements, also known as halogens. Like halogens, hydrogen requires one additional electron to achieve a stable electron configuration. Furthermore, hydrogen can form negative ions, similar to halogens.\n  <br>Therefore, hydrogen shares properties with both Group 1 (alkali metals) and Group 17 (halogens) elements, making option (c) the correct answer.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Which is a specialised excretory cell found in Platyhelminthes that acts like a kidney, removing waste material through filtration?\n  <br>", "option1": "Fat cell\n  <br>", "option2": "Flame cell\n  <br>", "option3": "Stem cell\n  <br>", "option4": "Sponge cell\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) Flame cell. Flame cells are specialized excretory cells found in Platyhelminthes, a type of flatworm. They are called flame cells because they have a cluster of cilia that looks like a flickering flame when viewed under a microscope.\n  <br>The beating of these flagella creates a current that draws fluid into the cell, where waste materials are filtered out. The filtered fluid is then excreted through a pore on the surface of the worm. So, flame cells are the specialized excretory cells found in Platyhelminthes that act like a kidney, removing waste material through filtration.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "Which among the following comes under the secondary sector of the Indian Economy?\n  <br>", "option1": "Sugar Industry\n  <br>", "option2": "Fishing\n  <br>", "option3": "Insurance\n  <br>", "option4": "Transport of goods\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) the Sugar Industry.\n  <br>The secondary sector of the Indian economy includes industries that transform raw materials into finished products. This includes industries such as manufacturing, construction, and mining.\n  <br>The sugar industry is a manufacturing industry that transforms sugarcane into sugar. So, it comes under the secondary sector of the Indian economy.\n  <br> Fishing comes under the primary sector of the Indian economy.\n  <br> Insurance comes under the tertiary sector of the Indian economy.\n  <br> Transport of goods is a service industry, It comes under the tertiary sector of the Indian economy.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "What is seasonal unemployment?\n  <br>", "option1": "Kind of unemployment generally found in urban areas.\n  <br>", "option2": "Kind of unemployment when people are not able to ﬁnd jobs during some months of the year\n  <br>", "option3": "Kind of unemployment when people are able to ﬁnd jobs during the year\n  <br>", "option4": "None of these\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) Kind of unemployment when people are not able to find jobs during some months of the year.\n  <br>Seasonal unemployment is a type of unemployment that occurs when there is a temporary decrease in demand for labor during certain times of the year. This can happen due to a variety of factors, such as changes in weather, the harvest season, or tourism.\n  <br>For example, people who work in the construction industry may be unemployed during the winter months when there is less construction work. Or, people who work in the tourism industry may be unemployed during the off-season when there are fewer tourists.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "What is the theme of the ASEAN Tourism Forum to be hosted by Laos in January 2024?\n  <br>", "option1": "\"ASEAN Tourism Development\"\n  <br>", "option2": "\"Enhancing Cultural Experiences\"\n  <br>", "option3": "\"Quality and Responsible Tourism -- Sustaining ASEAN Future\"\n  <br>", "option4": "\"Promoting Sustainable Travel\"\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The theme of the ASEAN Tourism Forum hosted by Laos in January 2024 is \"Quality and Responsible Tourism -- Sustaining ASEAN Future\".\n  <br> ASEAN stands for the Association of Southeast Asian Nations.\n  <br> It is a regional intergovernmental organization consisting of ten member countries in Southeast Asia.\n  <br> The member countries are Brunei, Cambodia, Indonesia, Laos, Malaysia, Myanmar, the Philippines, Singapore, Thailand, and Vietnam.\n  <br> ASEAN was established on August 8, 1967, with the aim of promoting economic growth, social progress, and regional stability in Southeast Asia.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "What percentage of financial support will the government provide for the promotion of Green Shipping?\n  <br>", "option1": "20%\n  <br>", "option2": "30%\n  <br>", "option3": "40%\n  <br>", "option4": "50%\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The government will provide a financial support of 30% for the promotion of Green Shipping.\n  <br> The development of Green Hydrogen hubs at Deendayal Port (Kandla) and Chidambaranar Port (Tuticorin) signifies the emphasis on utilizing clean energy sources for maritime operations are also associated with it.\n  <br> Additionally, the Green Tug Transition program aims to replace conventional tugboats with more environmentally friendly options.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "Who is the writer of the recently launched book \"Partitioned Freedom\"?\n  <br>", "option1": "Gulab Chand Kataria\n  <br>", "option2": "Ram Madhav\n  <br>", "option3": "Prabhat Prakashan\n  <br>", "option4": "None of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Ram Madhav is the writer of the book \"Partitioned Freedom.\"\n  <br> He is an Indian politician, author, and thinker who has penned this book offering great insights into the events that unfolded during 1905 and the pre-independence era.\n  <br> The book was published by Prabhat Prakashan Pvt. Ltd.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Which district has recently launched the Niramaya Health Insurance scheme for special children?\n  <br>", "option1": "Visakhapatnam\n  <br>", "option2": "Hyderabad\n  <br>", "option3": "Chennai\n  <br>", "option4": "Kolkata\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Niramaya Health Insurance scheme has been launched by the District Collector of Visakhapatnam district, Dr. A Mallikharjuna.\n  <br> This initiative aims to provide health insurance coverage to children suffering from autism, cerebral palsy, mental retardation, multiple disabilities, and other related conditions.\n  <br> The funds for the scheme were arranged from Sanjivani Nidhi, which consists of donations made by government employees on New Year's Day.\n  <br> The insured person would receive coverage of 1 lakh per year for health-related issues.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Under the Clean Note Policy, the RBI has decided to withdraw which denomination banknotes from circulation?\n  <br>", "option1": "Rs 500\n  <br>", "option2": "Rs 2000\n  <br>", "option3": "Rs 100\n  <br>", "option4": "Rs 50\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The RBI has decided to withdraw the Rs 2000 denomination banknotes from circulation under the Clean Note Policy.\n  <br> However, they can still be used for transactions and are valid for exchange or deposit.\n  <br> The exchange of Rs 2000 banknotes for other denominations is limited to a maximum of Rs 20,000 at a time, starting from May 23, 2023.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "What is the name of the operation launched by India to provide humanitarian assistance for people in Myanmar affected by Cyclone Mocha?\n  <br>", "option1": "Operation Karuna\n  <br>", "option2": "Operation Maitri\n  <br>", "option3": "Operation Mocha Aid\n  <br>", "option4": "Operation Myanmar Assistance\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "India has launched 'Operation Karuna' to provide humanitarian assistance for the people in Myanmar affected by Cyclone Mocha.\n  <br> As part of Operation Karuna, three Indian naval ships (INS Shivalik, Kamorta, and Savitri) have reached Yangon, Myanmar, carrying relief materials including emergency food items, tents, essential medicines, water pumps, portable generators, clothes, sanitary and hygiene items.\n  <br> Currency / Capital of Myanmar – Naypyidaw / Kyat\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "According to the UN report 'World Economic Situation and Prospects as of mid-2023', what is the projected growth rate of India's economy in 2023?\n  <br>", "option1": "5.8%\n  <br>", "option2": "6.7%\n  <br>", "option3": "7.5%\n  <br>", "option4": "4.2%\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The UN report forecasts that India's economy is expected to grow by 5.8% in 2023 and 6.7% in 2024.\n  <br> The UN report forecasts that inflation in India is expected to decelerate to 5.5% in 2023.\n  <br> This projection indicates the anticipated growth rate of India's gross domestic product (GDP) for the given year.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "Which among the following is the smallest unit of data in a computer system?\n  <br>", "option1": "Nibble\n  <br>", "option2": "Byte\n  <br>", "option3": "Bit\n  <br>", "option4": "Kilobyte\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A bit short for binary digit is the smallest unit of data in a computer.\n  <br> A bit has a single binary value, either 0 or 1.\n  <br> The bit is a basic unit of information in information theory, computing, and digital communications.\n  <br> Byte is a unit of digital information that most commonly consists of eight bits.\n  <br> Nibble is a set of four bits. Since there are eight bits in a byte, a nibble is half of one byte.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Which is the oldest and most influential merger of computer networks which contributed to the birth of the Internet?\n  <br>", "option1": "DBMS\n  <br>", "option2": "ARPANET\n  <br>", "option3": "USENET\n  <br>", "option4": "TELNET\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> ARPANET is the oldest and most influential merger of computer networks which contributed to the birth of the Internet.\n  <br> The precursor to the Internet, ARPANET was a large wide-area network created by the United States Defense Advanced Research Project Agency (ARPA).\n  <br> ARPANET was a project funded by the U.S. government during the Cold War, in order to build a robust and reliable communications network.\n  <br> This was done by connecting various computers that could simultaneously communicate in a network that would not go down and continue running when a single node was taken out.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Which of the following is the process of transferring software program from a secondary storage media into the hard disc?\n  <br>", "option1": "Download\n  <br>", "option2": "Upload\n  <br>", "option3": "Installation\n  <br>", "option4": "Upgrade\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Installation or setup of a computer program is the act of making the program ready for execution.\n  <br> Installation refers to the particular configuration of a software or hardware with a view to making it usable with the computer.\n  <br> Downloading is the transmission of a file from one computer system to another, usually smaller computer system.\n  <br> Uploading refers to transmitting data from one computer system to another through means of a network.\n  <br> With computer hardware, an upgrade is a term that describes adding new hardware in a computer that improves its performance.\n  <br> An update is new, improved, or fixed software, which replaces older versions of the same software.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "__________is an indicator used to show the current position for user interaction on a computer monitor or other display device.\n  <br>", "option1": "Blinker\n  <br>", "option2": "Pointer\n  <br>", "option3": "Cursor\n  <br>", "option4": "Adapter\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Cursor may refer to an indicator used to show the current position for user interaction on a computer monitor or other display device.\n  <br> It is a special symbol, usually a solid rectangle or a blinking underline character, that signifies where the next character will be displayed on the screen.\n  <br> The mouse cursor is also called a pointer, owing to its resemblance in usage to a pointing stick.\n  <br> An adapter in regard to computing can be either a hardware component or software that allows two or more incompatible devices to be linked together for the purpose of transmitting and receiving data.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "What is the term used for the device that connects to the network without the use of cables?\n  <br>", "option1": "Open source\n  <br>", "option2": "Distributed\n  <br>", "option3": "Centralized\n  <br>", "option4": "Wireless\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A device that allows wireless devices to connect to a wired network using Wi-Fi or related standards is called wireless device.\n  <br> Examples of wireless devices include cell phones, PDAs, wireless mice, wireless keyboards, wireless routers, wireless network cards etc.\n  <br> A wireless network, on the other hand, is a computer network that uses wireless data connections between network nodes.\n  <br> Examples of wireless networks include cell phone networks, wireless local area networks (WLANs), wireless sensor networks, satellite communication networks, and terrestrial microwave networks.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "_________ is a utility designed to maintain both desktop and program settings when a laptop computer suddenly loses power?\n  <br>", "option1": "Hibernate\n  <br>", "option2": "Shut down\n  <br>", "option3": "Switch off\n  <br>", "option4": "Restart\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Hibernate is a utility designed to maintain both desktop and program settings when a laptop computer suddenly loses power.\n  <br> After your computer has rebooted, hibernate restores it to the state it was in when it was turned off.\n  <br> Hibernate mode is very similar to sleep, but instead of saving your open documents and running applications to your RAM, it saves them to your hard disk.\n  <br> This allows your computer to turn off entirely, which means once your computer is in Hibernate mode, it uses zero power.\n  <br> Once the computer is powered back on, it will resume everything where you left off.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "Which is a type of malware whose primary function is to self-replicate and infect other computers?\n  <br>", "option1": "Spyware\n  <br>", "option2": "Adware\n  <br>", "option3": "Trojan\n  <br>", "option4": "Worms\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A computer worm is a standalone malware computer program that replicates itself in order to spread to other computers.\n  <br> It often uses a computer network to spread itself, relying on security failures on the target computer to access it.\n  <br> It will use this machine as a host to scan and infect other computers.\n  <br> When these new worm-invaded computers are controlled, the worm will continue to scan and infect other computers.\n  <br> Worms almost always cause at least some harm to the network whereas viruses almost always corrupt or modify files on a targeted computer.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "Which of the following term is used for the unauthorized copying of the software to be used for personal gain instead of personal backups?\n  <br>", "option1": "Data piracy\n  <br>", "option2": "Software piracy\n  <br>", "option3": "Data Snatching\n  <br>", "option4": "Phishing\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Software piracy is used for the unauthorized copying of the software to be used for personal gain instead of personal backups.\n  <br> It may include use of a software unauthorizedly without obtaining a proper licence from the software company or simultaneous use of single user licence or loading software on more machines, than authorized under the licence terms.\n  <br> The majority of software today is purchased as a single-user license, meaning that only one computer may have that software installed on it at one time.\n  <br> Copying that software to multiple computers or sharing it with your friend without multiple licenses is considered software piracy, which is illegal.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "What is the term used for the image that is displayed on the monitor and includes thousands of small coloured dots?\n  <br>", "option1": "Nibble\n  <br>", "option2": "Bits\n  <br>", "option3": "Pixels\n  <br>", "option4": "Bytes\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A pixel or picture element is a physical point in a raster image, or the smallest addressable element in an all points addressable display device.\n  <br> It is the smallest controllable element of a picture represented on the screen.\n  <br> In other words, it is the smallest unit of a digital image or graphic that can be displayed and represented on a digital display device.\n  <br> Pixels are combined to form a complete image, video, text, or any visible thing on a computer display.\n  <br> The pixel resolution spread also determines the quality of display, more pixels per inch of monitor screen yields better image results.\n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "The web uses which of the following language to request and serve the web pages and programs?\n  <br>", "option1": "Hypertext Makeup Language\n  <br>", "option2": "Hypertext Markup Language\n  <br>", "option3": "Hypertext Machine Language\n  <br>", "option4": "Hypertext Marketing Language\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Hyper Text Markup Language, or HTML is the standard markup language for documents designed to be displayed in a web browser.\n  <br> It is the major markup language used to display Web pages on the Internet.\n  <br> In other words, Web pages are composed of HTML, which is used to display text, images or other resources through a Web browser.\n  <br> It is a text-based approach to describe how content contained within an HTML file is structured.\n  <br> The file extension for an HTML file is .htm or .html.\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "GPRS is a packet-switching technology that enables data transfers through cellular networks. What does ‘R’ in GPRS stands for?\n  <br>", "option1": "Remote\n  <br>", "option2": "Radio\n  <br>", "option3": "Rooting\n  <br>", "option4": "Registry\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The General Packet Radio Service (GPRS) is a packet-based mobile data service available on 3G and 2G cellular communication systems using the worldwide system for mobile communications (GSM).\n  <br> It is a packet-switching method for GSM networks that is non-voice, high-speed, and useful.\n  <br> It allows small data bursts and big data volumes to be sent and received through mobile phone networks.\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "Which of the following is the file-extension of an Excel spreadsheet?\n  <br>", "option1": ".RTF\n  <br>", "option2": ".PSD\n  <br>", "option3": ".XLS\n  <br>", "option4": ".PNG\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> An XLS file is a spreadsheet file that was created using Microsoft Excel or exported from another spreadsheet tool like OpenOffice Calc or Apple Numbers.\n  <br> It consists of one or more worksheets that store and present data in a tabular format.\n  <br> Mathematical functions, charts, styles, and formatting can all be stored in XLS files.\n  <br> With the release of Excel in 1987, the Microsoft Excel Spreadsheet (XLS) binary format was introduced.\n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "Which among the following is NOT a DBMS Software?\n  <br>", "option1": "Oracle\n  <br>", "option2": "Adobe Illustrator\n  <br>", "option3": "dBASE\n  <br>", "option4": "SQLite\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A database management system (DBMS) is software that stores and retrieves data for users while taking proper security measures.\n  <br> It is made up of a collection of applications that manipulate the database.\n  <br> The DBMS accepts an application's request for data and informs the operating system to give the requested data.\n  <br> Oracle, Microsoft Access, MySQL, dBASE, FoxPro and SQLite are the examples of DBMS software.\n  <br> Adobe Illustrator is a vector graphics editor developed and marketed by Adobe.\n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "Which one of the following is a multiport device that improves network efficiency?\n  <br>", "option1": "Hub\n  <br>", "option2": "Router\n  <br>", "option3": "Switch\n  <br>", "option4": "Bridge\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Switches play a more intelligent role than hubs in most cases.\n  <br> A switch is a multiport device that increases the efficiency of a network.\n  <br> The switch keeps limited routing information about internal network nodes and facilitates connections to systems such as hubs and routers.\n  <br> The hardware address of the incoming packets can be read by switches, which can then send them to the correct destination.\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "Java, one of the most popular programming languages was invented by whom?\n  <br>", "option1": "James Gosling\n  <br>", "option2": "Dennis Ritchie\n  <br>", "option3": "Bjarne Stroustrup\n  <br>", "option4": "Guido van Rossum\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Java is an object-oriented programming language that may be used to create software that runs on a variety of platforms.\n  <br> Desktops, servers, mobile devices, smart cards, and Blu-ray Discs all have Java apps (BD).\n  <br> Java creates applets, which allow internet users to interact with a graphical user interface (GUI) and objects.\n  <br> Dr. James Arthur Gosling is the creator of Java and is widely regarded as the father of the java programming language.\n  <br>", "question_heading": ""}, {"sr_no": 146, "question": "Which of the following key is used to move the cursor one space forward?\n  <br>", "option1": "Tab key\n  <br>", "option2": "Backspace key\n  <br>", "option3": "Caps Lock key\n  <br>", "option4": "Spacebar key\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The space bar, also known as 'spacebar' is one of the most commonly used keys on a computer keyboard.\n  <br> It is used to put a space into a text document.\n  <br> This key is used to move the cursor one space forward.\n  <br> It is present at the bottom of most of the standard keyboard layouts, such as the QWERTY keyboard.\n  <br> The space bar is wider than the rest of the keys on the keyboard.\n  <br>", "question_heading": ""}, {"sr_no": 147, "question": "Which of the following networking device is also called as a ‘Protocol converter’?\n  <br>", "option1": "Modem\n  <br>", "option2": "Gateway\n  <br>", "option3": "Bridge\n  <br>", "option4": "Router\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Gateway is a networking device which works at the Transport and Session layers of the OSI model.\n  <br> It is a connection point between two networks that may use various networking models.\n  <br> They essentially serve as messengers, taking data from one system, interpreting it, and transferring it to another.\n  <br> Gateways are also known as protocol converters, as they can function at any layer of the network.\n  <br>", "question_heading": ""}, {"sr_no": 148, "question": "Which of the following is an example of Non-Impact Printer?\n  <br>", "option1": "Laser Printer\n  <br>", "option2": "Inkjet Printer\n  <br>", "option3": "Daisy-Wheel Printer\n  <br>", "option4": "Both a and b\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Non-impact printers are printers that produce output on paper without striking the paper.\n  <br> In comparison to impact printers, non-impact printers are faster and provide higher-quality output.\n  <br> They can print at speeds of up to 24 pages per minute and produce no noise.\n  <br> Laser Printer, Inkjet Printer and Thermal Printer are the examples of Non-Impact Printer.\n  <br>", "question_heading": ""}, {"sr_no": 149, "question": "Which of the following input device has a flat surface and usually comes with a stylus?\n  <br>", "option1": "Microphone\n  <br>", "option2": "Joystick\n  <br>", "option3": "Digitizer\n  <br>", "option4": "Light Gun\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A digitizer is a flat-surfaced computer input device that commonly comes with a stylus.\n  <br> It allows the user to draw images and graphics using the stylus, just as we do with a pencil on paper.\n  <br> The images as well as the graphics drawn on the digitizer appear on the computer monitor.\n  <br> Touch inputs are converted into lines by the software, which can also turn handwritten text into typewritten words.\n  <br>", "question_heading": ""}, {"sr_no": 150, "question": "Which of the following topology is the variation of Star topology?\n  <br>", "option1": "Tree Topology\n  <br>", "option2": "Ring Topology\n  <br>", "option3": "Bus Topology\n  <br>", "option4": "Mesh Topology\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Tree Topology, also known as Hierarchical Topology, is the variation of Star topology.\n  <br> A tree topology is a framework in which all computers are connected to one another in a hierarchical manner.\n  <br> A root node is the top-most node in a tree topology, and all other nodes are descendants of the root node.\n  <br> Tree topology is mainly used to provide broadband transmission.\n  <br>                   Top of Form\n  <br>Bottom of Form\n  <br>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
