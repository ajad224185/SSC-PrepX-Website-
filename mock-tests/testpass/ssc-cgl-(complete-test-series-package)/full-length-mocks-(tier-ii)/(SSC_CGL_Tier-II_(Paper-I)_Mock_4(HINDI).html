<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>14.) SSC CGL Tier-II (Paper-I) Mock 4(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

ादा, बच्चे\n  <br>", "option1": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694221image36.png\"> \n  <br>", "option2": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694223image37.png\"> \n  <br>", "option3": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694224image38.png\"> \n  <br>", "option4": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694225image39.png\"> \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584693858image98.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 59, "question": "चार विकल्पों में से दी गई आकृति (X) की सही दर्पण छवि चुनें, जब दर्पण X के दाईं ओर हो।\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694225image40.png\"> \n  <br>", "option1": "2\n  <br>", "option2": "3\n  <br>", "option3": "4\n  <br>", "option4": "1\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 60, "question": "<b>कौन सी उत्तर आकृति प्रश्न आकृति के पैटर्न को पूरा करेगी</b>?\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694227image41.png\"> \n  <br> \n  <br> \n  <br>", "option1": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694229image42.png\"> \n  <br>", "option2": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694229image43.png\"> \n  <br>", "option3": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694230image44.png\"> \n  <br>", "option4": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694230image45.png\"> \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 61, "question": "<b>Select the most appropriate synonym of the word given in bold.</b> \n  <br>The government has taken steps to \n  <b>mitigate</b> the effects of the pandemic on the economy.\n  <br>", "option1": "Alleviate\n  <br>", "option2": "Exacerbate\n  <br>", "option3": "Pernicious\n  <br>", "option4": "Esoteric\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Mitigate means to make something less severe or intense. It is often used to describe actions taken to reduce the negative effects of something.\n  <br> Alleviate is a synonym of mitigate, meaning to make something less severe or to ease its impact.\n  <br> Synonyms: \n  <b>alleviate</b>, ease, reduce, lessen, diminish. \n  <br> Antonyms: worsen, intensify, aggravate, exacerbate, heighten.\n  <br>Meanings of the other given words:\n  <br> Exacerbate: to make something worse or more intense, antonym of alleviate and synonym of aggravate and intensify.\n  <br> Pernicious: Having a harmful or destructive effect, often in a gradual or subtle way.\n  <br> Esoteric: Intended for or understood by only a small number of people with specialized knowledge or interest.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "<b>Select the most appropriate option to fill in the blank in the given sentence.</b> \n  <br>The _____________ of the company's success is its focus on innovation and customer satisfaction.\n  <br>", "option1": "envelope\n  <br>", "option2": "prominence\n  <br>", "option3": "facade\n  <br>", "option4": "foundation\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is option (d) foundation.\n  <br> The word \"foundation\" refers to the base or underlying principle of something. \n  <br> In the given sentence, it implies that the company's focus on innovation and customer satisfaction is the fundamental reason for its success. \n  <br> Prominence refers to the state or quality of being important, noticeable, or distinguished. \n  <br> “Facade\" and \"envelope\" do not fit the context of the sentence as they refer to the outer surface or appearance of something.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "<b>Select the most appropriate option to fill in the blank in the given sentence.</b> \n  <br>The teacher's ____________ approach to discipline has resulted in a well-behaved and motivated class.\n  <br>", "option1": "Permissive\n  <br>", "option2": "Autocratic\n  <br>", "option3": "Clandestine\n  <br>", "option4": "Authoritative\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is (d) Authoritative.\n  <br> The word \"authoritative\" means commanding or leading with confidence and authority. In the given sentence, it implies that the teacher's approach to discipline is firm and decisive, yet fair and respectful of the students' needs and opinions. \n  <br> This has resulted in a well-behaved and motivated class. \n  <br> On the other hand, \"autocratic\" refers to a dictatorial and oppressive approach, while “clandestine” means kept or done in secret, often to conceal something illicit or improper.\n  <br> \"Permissive\" implies a lenient and indulgent attitude, which is not suitable for maintaining discipline in a classroom setting.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the sentence with no grammatical errors.\n  <br>", "option1": "Each of the students in the class are required to complete the assignment.\n  <br>", "option2": "Despite the rain, the match was continued.\n  <br>", "option3": "The team's performance has been affected by their lack of training.\n  <br>", "option4": "There's no way of knowing weather the meeting will be cancelled.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence with no grammatical errors is option (c) \"The team's performance has been affected by their lack of training.\"\n  <br> Option (a) has a subject-verb agreement error. \"Each\" is singular, so it should be \"Each of the students in the class is required to complete the assignment.\"\n  <br> Option (b) has a tense agreement error. \"was continued\" should be \"continued\" to maintain past tense.\n  <br> Option (d) has spelling error; \"weather\" should be \"whether\".\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.</b> \n  <br>From the options P, Q, R, and S select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) One sunny morning, as Lily strolled along a narrow path lined with wildflowers, she stumbled upon an old, weathered book lying beneath a towering oak tree.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) The garden was said to grant wishes to those who found its entrance and possessed a pure heart.\n  <br> (P) She spent hours poring over maps and listening to the stories passed down by village elders, hoping to uncover clues that would lead her to the garden's gate.\n  <br>(Q) Driven by an overwhelming desire to uncover this hidden wonder, Lily embarked on a quest to locate the secret garden.\n  <br>(R) With excitement shining in her eyes, she picked it up and dusted off its worn cover. The title, \"The Secret Garden,\" was embossed in elegant gold letters.\n  <br>(S) Intrigued, Lily eagerly opened the book and was immediately captivated by its enchanting tale. It spoke of a hidden garden, filled with vibrant blooms and magical creatures, tucked away in a forgotten corner of the village.\n  <br>(T) Days turned into weeks, and Lily's determination remained unyielding.\n  <br>", "option1": "P, Q\n  <br>", "option2": "Q, R\n  <br>", "option3": "P, T\n  <br>", "option4": "R, S\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given paragraph, sentence S1 sets the scene by describing Lily stumbling upon an old book in a beautiful setting. To continue the story, we need to provide an explanation for Lily's interest in the book and her subsequent actions.\n  <br> Sentence S4 states that the garden grants wish to those who find its entrance and possess a pure heart. \n  <br> Sentence R follows the logical progression of the story. It describes Lily's immediate action after discovering the old book. She feels excitement and curiosity as she examines the book and discovers its title.\n  <br> Sentence S provides further details about Lily's experience with the book. It explains that upon opening it, she becomes captivated by the story it contains. The story describes a hidden garden with magical elements, which is intriguing to Lily.\n  <br> Therefore, the correct answer is option (d) R, S.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "<b>Select the most appropriate ANTONYM of the word given in bold.</b> \n  <br>The team's performance was \n  <b>lacklustre</b> and disappointing.\n  <br>", "option1": "Egregious\n  <br>", "option2": "Brilliant\n  <br>", "option3": "Vicissitude\n  <br>", "option4": "Successful\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Lacklustre refers to something that is dull, lacking brilliance, or lacking in vitality or excitement.\n  <br> Brilliant means shining brightly, exceptionally clever or talented.\n  <br> Thus, the most appropriate antonym of the word \"lacklustre\" is (b) Brilliant.\n  <br> Antonyms: \n  <b>brilliant</b>, dazzling, excellent, outstanding. \n  <br> Synonyms: dull, boring, uninspired, unimpressive.\n  <br>Meanings of the other given words:\n  <br> Egregious: Outstandingly bad or shocking. \n  <br> Vicissitude: change or variation occurring in the course of something, often characterized by unpredictability or fluctuation.\n  <br> Successful: accomplishing an aim or purpose; having achieved popularity, profit, or distinction.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>Select the most appropriate meaning of the highlighted idiom or phrase.</b> \n  <br>When faced with adversity, Mark decided \n  <b>to take the bull by the horns</b> and confront the situation head-on.\n  <br>", "option1": "To physically grab a bull by the horns\n  <br>", "option2": "To avoid confronting challenges\n  <br>", "option3": "To deal with a difficult situation boldly and directly\n  <br>", "option4": "To seek assistance from others in handling challenges\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the highlighted idiom \"take the bull by the horns\" in this context is (c) To deal with a difficult situation boldly and directly.\n  <br> To \"take the bull by the horns\" means to confront a challenging or difficult situation directly and assertively, without hesitation or fear. It implies that a person is taking control of the situation and facing it head-on.\n  <br> Example: Instead of avoiding the problem or seeking help from others, he decided to take the bull by the horns and started a new venture with determination and hard work.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the option with the INCORRECTLY spelt word in the given sentences.\n  <br>", "option1": "He was determined to persue his dream of becoming a musician.\n  <br>", "option2": "The company's annual report provides a comprehensive overview of its finances.\n  <br>", "option3": "The senator was accused of committing several crimes while in office.\n  <br>", "option4": "The book is a collection of short stories written by various authors.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option with the incorrectly spelt word is in option (a) He was determined to persue his dream of becoming a musician.\n  <br>The correct spelling of the word should be \"pursue\" instead of \"persue.\"\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Select the option that is the active or passive form of the given sentence.\n  <br>The project was completed ahead of schedule by the construction team.\n  <br>", "option1": "The construction team had completed the project ahead of schedule.\n  <br>", "option2": "The project had been completed ahead of schedule by the construction team.\n  <br>", "option3": "The construction team completed the project ahead of schedule.\n  <br>", "option4": "The project was being completed ahead of schedule by the construction team.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of passive voice having form:\n  <br> Obj. + was / were + V3 + by + sub.\n  <br> When it is converted into active voice, following rule is followed:\n  <br> Sub + V2 + obj.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "In the following question, choose the option that reflects the correct spelling of the word.\n  <br>", "option1": "Hinderrance\n  <br>", "option2": "Hindarance\n  <br>", "option3": "Hindrance\n  <br>", "option4": "Hinderancee\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that reflects the correct spelling of the word is option (c) Hindrance.\n  <br> The word \"hindrance\" means something that impedes or obstructs progress or movement, or an obstacle that makes it difficult to accomplish a task or goal. It can also refer to a person or thing that causes delays or difficulties.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Given below are four jumbled sentences. Select the option that gives the correct order.\n  <br>A. He searched high and low for his missing keys, but they were nowhere to be found.\n  <br>B. Frustrated, he started to retrace his steps from earlier that day.\n  <br>C. Eventually, he found them lying on the kitchen counter where he had absent-mindedly left them.\n  <br>D. He had a sinking feeling in his stomach as he realized he might have lost them for good.\n  <br>", "option1": "DABC\n  <br>", "option2": "BDAC\n  <br>", "option3": "ACBD\n  <br>", "option4": "ADBC\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of the jumbled sentences is (d) ADBC.\n  <br> First, he searches high and low for his missing keys in sentence A. \n  <br> Then, in sentence D, he has a sinking feeling in his stomach as he realizes he might have lost them for good.\n  <br> In sentence B, he starts to retrace his steps from earlier that day.\n  <br> Finally, in sentence C, he finds them lying on the kitchen counter where he had absent-mindedly left them.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "<b>Select the option that is the indirect form of the given sentence.</b> \n  <br>Radhika said to her friend, “I have been waiting here for a long time.”\n  <br>", "option1": "Radhika told her friend that she has been waiting there for a long time.\n  <br>", "option2": "Radhika told her friend that she was being waiting here for a long time.\n  <br>", "option3": "Radhika told her friend that she had been waiting there for a long time.\n  <br>", "option4": "Radhika told her friend that she must be waiting there for a long time.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech -</b> Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Assertive Sentence.’\n  <br> Sentences that make a statement are called assertive sentences. These sentences may be positive, negative, false, or true statements.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> The given sentence is in present perfect continuous tense.\n  <br> ‘Here’ changes to ‘There’.\n  <br> Reported Verb– ‘Said to’ changes to ‘Told.’\n  <br> Conjunction– In the Assertive sentence conjunction ‘That’ is used.\n  <br> Tense- Present Perfect Continuous changes to Past Perfect Continuous tense.\n  <br> The sentence thus formed is - Radhika told her friend that she had been waiting there for a long time.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "<b>Select the option that is the passive form of the given sentence.</b> \n  <br>The manager is reviewing the performance reports of the team members.\n  <br>", "option1": "The manager is reviewing the performance reports of the team members.\n  <br>", "option2": "The performance reports of the team members are reviewed by the manager.\n  <br>", "option3": "The manager reviews the performance reports of the team members.\n  <br>", "option4": "The performance reports of the team members are being reviewed by the manager.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having form:\n  <br> Subject + is/am/are+ v1+ ing + object.\n  <br> When it is converted into passive voice, following rule is followed:\n  <br> Object+ is/am/are+ being+ V3+ by + subject.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "<b>Select the option that is the passive form of the given sentence.</b> \n  <br>Did she finish her homework in time?\n  <br>", "option1": "Was her homework finished by her in time?\n  <br>", "option2": "Did her homework finish in time by her?\n  <br>", "option3": "Was her homework being finished in time by her?\n  <br>", "option4": "Was her homework finishing in time by her?\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having form:\n  <br> Did+ subject+V1+ object+?\n  <br> When it is converted into passive voice, following rule is followed:\n  <br> Was/were + Object+ V3+ by subject +?\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "<b>Select the option that is the indirect form of the given sentence.</b> \n  <br>Rajesh said to Sheetal, ‘When do you intend to pay back the money you borrowed from me?”\n  <br>", "option1": "Rajesh enquired Sheetal when did she intend to pay back the money, she borrowed from him.\n  <br>", "option2": "Rajesh asked Sheetal when she will be intending to pay back the money, she had borrowed from him.\n  <br>", "option3": "Rajesh enquired Sheetal when she intended to pay back the money, she had borrowed from him.\n  <br>", "option4": "Rajesh asked Sheetal if she would be intended to pay back the money, she had borrowed from him.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The given sentence is of ‘direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> \n  <b>Indirect Speech</b> - Reporting the message of the speaker in our own words.\n  <br> The given sentence is an ‘Interrogative sentence.’\n  <br> Sentences that ask questions are called interrogative sentences. Every interrogative sentence ends with a question mark. There are two main kinds of interrogative sentences. Those which start with an auxiliary verb and those which start with a question word such as what, why, when, where, how etc.\n  <br> While changing it into indirect form, we consider following rules.\n  <br> Change the question into a Statement.\n  <br> Reported Verb– ‘Said to’ changes to ‘Enquired’.\n  <br> Conjunction– Wh-word itself will act as a conjunction.\n  <br> Tense- Past Simple Tense changes into Past Perfect Tense.\n  <br> The sentence thus formed is - Rajesh enquired Sheetal when she intended to pay back the money, she had borrowed from him.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Select the most appropriate option for blank no. 1.</b> \n  <br>", "option1": "afterwards\n  <br>", "option2": "before\n  <br>", "option3": "upon\n  <br>", "option4": "with\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'with' to make the sentence grammatically and contextually correct. \n  <br> The use of \"with\" suggests that the invention of the assembly line was closely associated with or accompanied by the positive changes in affordability and accessibility. \n  <br>Meaning of other words:\n  <br> Afterwards: following in time or place; subsequently.\n  <br> Before: at an earlier time; previously.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Select the most appropriate option for blank no. 2.</b> \n  <br>", "option1": "accessible\n  <br>", "option2": "restricted\n  <br>", "option3": "exclusive\n  <br>", "option4": "lavish\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'accessible' to make the sentence grammatically and contextually correct. \n  <br> 'Accessible' means able to be reached or entered. As per the context, it is appropriate to use 'accessible' here to indicate that after the invention of the assembly line, automobiles became more affordable and accessible to the middle class.\n  <br>Meaning of other words:\n  <br> Restrict: limited; subject to restrictions or limitations.\n  <br> Exclusive: restricted or limited to the person, group, or area concerned.\n  <br> Lavish: sumptuously rich, elaborate, or luxurious.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Select the most appropriate option for blank no. 3.</b> \n  <br>", "option1": "easy\n  <br>", "option2": "easily\n  <br>", "option3": "ease\n  <br>", "option4": "easier\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option for blank no. 3 would be (b) easily.\n  <br> The sentence structure requires an adverb to modify the verb \"travel.\" Since \"easily\" is an adverb, it fits grammatically in the sentence to convey that people were able to travel long distances quickly and without difficulty. \n  <br> The other options, (a) easy, (c) ease, and (d) easier, are either an adjective or a comparative form, which do not fit the context and structure of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Select the most appropriate option for blank no. 4.</b> \n  <br>", "option1": "enabled\n  <br>", "option2": "prevented\n  <br>", "option3": "ignored\n  <br>", "option4": "decreased\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'enabled' to make the sentence grammatically and contextually correct. \n  <br> 'Enabled' means to give someone or something the authority, means, or opportunity to do something. \n  <br> As per the context, it is appropriate to use 'enabled' here to indicate that the automobile enabled changes in the manufacturing industry, leading to the development of new technologies and a shift towards mass production.\n  <br>Meaning of other words:\n  <br> Prevented: kept (someone or something) from doing something; made impossible.\n  <br> Ignored: refused to take notice of or acknowledge; disregarded.\n  <br> Decreased: made less in size, amount, or degree.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the most appropriate option for blank no. 5.</b> \n  <br>", "option1": "inducing\n  <br>", "option2": "inciting\n  <br>", "option3": "poses\n  <br>", "option4": "limits\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The blank is filled with \"poses\" because it accurately describes the relationship between the automobile and the challenges mentioned in the sentence. \n  <br> In this context, \"poses\" means that the automobile presents or creates significant challenges.\n  <br>Meaning of other words:\n  <br> Induce - to bring about or give rise to something (positive).\n  <br> Incite - to encourage or stir up (usually negative emotions or actions).\n  <br> Limits - to restrict or restrain something in some way.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Identify the segment in the given sentence which contains the grammatical error.\n  <br>The gang that had stolen the jewellery were caught red-handed by the police.\n  <br>", "option1": "The gang\n  <br>", "option2": "that had stolen the jewellery\n  <br>", "option3": "were caught red-handed\n  <br>", "option4": "no error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The grammatical error in the sentence relates to subject-verb agreement. \n  <br> The verb in a sentence should agree with its subject in terms of number (singular or plural).\n  <br> In this case, the subject is \"gang,\" which is a singular noun. According to the subject-verb agreement rule, a singular subject should be paired with a singular verb. \n  <br> Therefore, the correct form of the verb to use is \"was,\" not \"were.\"\n  <br> The corrected sentence adheres to the rule and maintains subject-verb agreement: \"The gang that had stolen the jewellery was caught red-handed by the police.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Select the option that is the indirect form of the given sentence.\n  <br>His parents said, “Bravo! You have done very well.”\n  <br>", "option1": "His parents applauded him, saying that he had done very well.\n  <br>", "option2": "His parents exclaimed that he has done very well.\n  <br>", "option3": "His parents exclaimed that he has been doing very well.\n  <br>", "option4": "His parents applauded that he had been doing very well.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Exclamatory Sentence.’\n  <br> \n  <b>Exclamatory Sentence</b> - Exclamatory sentences express a sudden outburst of some emotions such as joy, sorrow, contempt, regret, surprise etc.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> Tense- Present perfect (Subject + has/have+V3+Object) changes to Past perfect (Subject+had+V3+Object)\n  <br> Reported Verb – ‘Said changes to ‘Applauded’.\n  <br> Conjunction– In the Exclamatory sentence conjunction ‘That’ is used.\n  <br> The sentence thus formed is - His parents applauded him, saying that he had done very well.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the most appropriate meaning of the given idiom.\n  <br>To let the grass grow under one's feet\n  <br>", "option1": "To actively participate in gardening \n  <br>", "option2": "To engage in leisurely activities\n  <br>", "option3": "To let time pass without taking action\n  <br>", "option4": "To avoid walking on grassy areas\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the idiom \"to let the grass grow under one's feet\" is option (c) To let time pass without taking action.\n  <br> This idiom is used to describe someone who is procrastinating or being inactive, allowing opportunities to slip away or tasks to remain unfinished. It implies a lack of urgency or initiative in taking necessary actions. \n  <br> Example: Aman has been unemployed for months, but he's been letting the grass grow under his feet instead of actively searching for a job.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the most appropriate option to fill in the blank in the given sentence.\n  <br>The author’s writing style was so ______ that it made the book hard to put down.\n  <br>", "option1": "Perspicacious\n  <br>", "option2": "Mellifluous\n  <br>", "option3": "Serendipitous\n  <br>", "option4": "Riveting\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is option (d) riveting.\n  <br> In the context of the sentence, the word \"riveting\" fits best as it indicates that the author's writing style was so captivating, engrossing, or compelling that it made the book hard to put down. It suggests that the book was interesting and held the reader's attention. \n  <br>Other options do not convey the same meaning as \"riveting\" and would not fit well in the given sentence.\n  <br> Perspicacious: Having a keen mental perception and understanding; being able to grasp things quickly and accurately.\n  <br> Mellifluous: Having a smooth, pleasant, and musical sound; often used to describe someone's voice or speech.\n  <br> Serendipitous: refers to the occurrence of finding valuable or pleasant things by chance or accident.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the option that will improve the segment in bold of the given sentence.\n  <br>In case no improvement is needed, select ‘No improvement.’\n  <br>The talented musician \n  <b>is playing the piano</b> since she was five years old.\n  <br>", "option1": "is being playing the piano \n  <br>", "option2": "have played the piano \n  <br>", "option3": "had been playing the piano \n  <br>", "option4": "No improvement\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option to improve the segment in bold is option (c) had been playing the piano.\n  <br> The original sentence is in the present perfect continuous tense, which implies an action that started in the past and is still ongoing. \n  <br> However, since the sentence mentions that the musician started playing the piano when she was five years old, we need to use the past perfect continuous tense to convey the ongoing action in the past.\n  <br> Option (c), \"had been playing the piano,\" is the correct choice as it uses the past perfect continuous tense. This option indicates that the musician started playing the piano in the past and continued playing it up until the present time.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Select the most appropriate synonym of the word given in bold.\n  <br>His \n  <b>insatiable</b> appetite for knowledge was evident in his constant reading.\n  <br>", "option1": "Ephemeral\n  <br>", "option2": "Incurable\n  <br>", "option3": "Unquenchable\n  <br>", "option4": "Unrestrainable\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Insatiable means having an intense or unquenchable appetite or desire that cannot be satisfied.\n  <br> Unquenchable means incapable of being satisfied or quenched, similar to \"insatiable.\"\n  <br> Antonyms: Satisfied, content.\n  <br> Synonyms: \n  <b>Unquenchable</b>, ravenous, voracious, greedy, craving.\n  <br>Meanings of the other given words:\n  <br> Ephemeral- lasting for a very short time, transient, or fleeting.\n  <br> Incurable - not able to be cured.\n  <br> Unrestrainable - unable to be controlled or restrained.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Identify the segment in the given sentence which contains the grammatical error.\n  <br>If I would have realized what a malevolent person he is, I would have discarded his friendship.\n  <br>", "option1": "If I would have realised\n  <br>", "option2": "what a malevolent person he is,\n  <br>", "option3": "I would have discarded\n  <br>", "option4": "No error\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in part (a) of the sentence.\n  <br>  The correct form in the past unreal conditional construction is \"If I had realized,\" not \"If I would have realized.\"\n  <br> In the past unreal conditional, the conditional clause should use \"had\" followed by the past participle form of the verb to indicate a hypothetical or unrealized condition in the past. \n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Select the word which means the same as the group of words given.\n  <br>A group of people who work together towards a common goal, often combining their skills and resources.\n  <br>", "option1": "Resilience\n  <br>", "option2": "Melancholic\n  <br>", "option3": "Enigma\n  <br>", "option4": "Cohort\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the given words:\n  <br> Resilience refers to the ability to bounce back or recover quickly from difficulties or challenges. \n  <br> Melancholic: feeling of deep sadness or sorrow. \n  <br> Enigma refers to something that is mysterious, puzzling, or difficult to understand. \n  <br> A cohort is a group of people who share a common characteristic, purpose, or experience. In the given context, it specifically refers to a group of people who work together towards a common goal, often combining their skills and resources.\n  <br> Among these options, the word that best matches the meaning of a group of people working together towards a common goal is \"cohort.\"\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "Select the word which means the same as the group of words given.\n  <br>A group of people who are expert in a particular field and are often called upon to give their opinion.\n  <br>", "option1": "Consortium\n  <br>", "option2": "Cacophonic\n  <br>", "option3": "Coterie\n  <br>", "option4": "Conglobe\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that means the same as the group of words given is option (c) Coterie.\n  <br> The word \"coterie\" refers to a small group of people who share a common interest or expertise in a particular field and are often called upon to give their opinion or advice. It implies a close-knit group of individuals who are knowledgeable and respected in their field. \n  <br>Other options do not have the same meaning as the given group of words:\n  <br> Consortium: Refers to an association or partnership of organizations or individuals for a specific purpose, often related to business or commerce.\n  <br> Cacophonic: Refers to a harsh, discordant mixture of sounds or voices.\n  <br> Conglobe can be understood as a verb meaning to gather, accumulate, or form into a rounded or globular shape.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "Select the most appropriate ANTONYM of the given word.\n  <br>Monotonous\n  <br>", "option1": "Disastrous\n  <br>", "option2": "Ineffable\n  <br>", "option3": "Pernicious\n  <br>", "option4": "Interesting\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Monotonous means lacking in variety and interest, tedious repetition or routine.\n  <br> Synonyms: boring, dull, repetitive.\n  <br> Antonyms: \n  <b>interesting</b>, exciting, varied.\n  <br> Therefore, the most appropriate antonym of Monotonous would be (d) Interesting, which means engaging and capturing one's attention.\n  <br>Meanings of other given words:\n  <br> Disastrous - causing great damage.\n  <br> Ineffable - Too great or intense to be expressed or described in words.\n  <br> Pernicious - Having a harmful or destructive effect, often in a subtle or gradual manner.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "<b>What did Tom find when he opened the hidden door in the secret room?</b> \n  <br>", "option1": "Clues about his parents' secret\n  <br>", "option2": "A cursed amulet\n  <br>", "option3": "Treasure hidden in a large box\n  <br>", "option4": "Nothing except an old box\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom found a hidden door in the secret room of his house. However, when he opened it, he was dismayed to find that there was nothing inside except an old box.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Why did Tom feel guilty after possessing the cursed amulet?</b> \n  <br>", "option1": "He realized he had hurt innocent people\n  <br>", "option2": "He was afraid of getting caught by his parents\n  <br>", "option3": "He lost his curiosity\n  <br>", "option4": "He found out the amulet was fake\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom initially revelled in his newfound power after possessing the cursed amulet and caused chaos wherever he went. However, soon he realized that his actions were hurting innocent people, which made him feel guilty.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>What was Tom's personality trait that led him to open the box inside the secret room?</b> \n  <br>", "option1": "Fear\n  <br>", "option2": "Laziness\n  <br>", "option3": "Curiosity\n  <br>", "option4": "Avarice\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom was a young and curious boy who was always poking his nose where it didn't belong. His curiosity led him to open the box inside the secret room in his house, hoping to find something exciting.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>How did Tom feel initially after possessing the cursed amulet?</b> \n  <br>", "option1": "Guilty\n  <br>", "option2": "Proud\n  <br>", "option3": "Excited\n  <br>", "option4": "Indifferent\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom initially revelled in his newfound power after possessing the cursed amulet and caused chaos wherever he went. This indicates that he felt excited about the power he obtained from t ting the use of biomass in power generation, including co-firing with coal, as a means to achieve reliable and affordable energy while minimizing environmental impact.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>What are the advantages of co-firing?</b> \n  <br>", "option1": "The reduction of greenhouse gas emissions and the reduction of dependence on fossil fuels.\n  <br>", "option2": "The increase of greenhouse gas emissions and the increase of dependence on fossil fuels.\n  <br>", "option3": "The reduction of greenhouse gas emissions and the increase of dependence on fossil fuels.\n  <br>", "option4": "The increase of greenhouse gas emissions and the reduction of dependence on fossil fuels.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Co-firing has several advantages, including the reduction of greenhouse gas emissions as biomass has lower carbon content compared to coal, and the reduction of dependence on fossil fuels as biomass is a renewable source of energy.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>What are the challenges associated with the implementation of co-firing in India?</b> \n  <br>", "option1": "The availability and quality of wind energy.\n  <br>", "option2": "The availability and quality of coal and the logistical challenges associated with transporting and storing the fuel.\n  <br>", "option3": "The availability and quality of solar energy.\n  <br>", "option4": "The availability and quality of biomass and the logistical challenges associated with transporting and storing the fuel.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The challenges associated with the implementation of co-firing in India include the availability and quality of biomass, as well as the logistical challenges related to transporting and storing the fuel.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>What is the ीटर से सेंटीमीटर और मिलीमीटर) पर स्थित होते हैं, जबकि एक्स-रे और गामा किरणों की तरंग दैर्ध्य (एक मीटर का अरबवां या खरबवां हिस्सा) बहुत कम होती है। इन्फ्रारेड विकिरण दृश्य प्रकाश की तुलना में कुछ हद तक लंबी तरंग दैर्ध्य है। दृश्यमान प्रकाश तरंग दैर्ध्य की एक श्रृंखला में केवल विद्युत चुम्बकीय विकिरण है जिसके प्रति हमारी आंखें संवेदनशील होती हैं।\n  <br>  \n  <b>ध्यान दें - </b>दृश्यमान तरंग दैर्ध्य लाल प्रकाश के लिए 0.0007 मिलीमीटर से लेकर नारंगी, पीले, हरे और नीले रंग तक, बैंगनी प्रकाश के लिए 0.0004 मिलीमीटर तक होती है। पराबैंगनी की तुलना में पराबैंगनी की तरंगदैर्घ्य कम होती है।\n  <br>   \n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "सूची-I को सूची-II से सुमेलित करें और सूचियों के नीचे दिए गए कूट का उपयोग करके सही उत्तर चुनें:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584694242image48.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "जलडमरूमध्य और उनके संबंधित देशों का सही मिलान इस प्रकार है:\n  <br> A. बैस जलडमरूमध्य ऑस्ट्रेलिया और तस्मानिया के बीच है।\n  <br>B. डेविस जलडमरूमध्य कनाडा और ग्रीनलैंड के बीच है।\n  <br>C. डोवर जलडमरूमध्य ब्रिटेन और फ्रांस के बीच है।\n  <br>D. फ्लोरिडा जलसंधि संयुक्त राज्य अमेरिका और क्यूबा के बीच है।\n  <br> इसलिए, सही उत्तर (a) 2 4 1 3 है।\n  <br> \n  <br>इन जलडमरूमध्यों का विवरण इस प्रकार है:\n  <br> \n  <b>बास जलडमरूमध्य </b>एक समुद्री जलडमरूमध्य है जो तस्मानिया को ऑस्ट्रेलियाई मुख्य भूमि, विशेष रूप से विक्टोरिया राज्य से अलग करता है।\n  <br> \n  <b>डेविस जलडमरूमध्य </b>लैब्राडोर सागर की उत्तरी शाखा है। यह मध्य-पश्चिमी ग्रीनलैंड और कनाडा के बाफिन द्वीप नुनावुत के बीच स्थित है। उत्तर में बाफ़िन खाड़ी है।\n  <br>  \n  <b>डोवर जलडमरूमध्य या डोवर जलडमरूमध्य</b>, जिसे ऐतिहासिक रूप से डोवर नैरो के नाम से जाना जाता है, इंग्लिश चैनल के सबसे संकीर्ण हिस्से में स्थित जलडमरूमध्य है, जो चैनल और उत्तरी सागर के बीच की सीमा को चिह्नित करता है, जो ग्रेट ब्रिटेन को महाद्वीपीय यूरोप से अलग करता है।\n  <br>  \n  <b>फ्लोरिडा जलडमरूमध्य</b>, फ्लोरिडा जलडमरूमध्य, या फ्लोरिडा जलडमरूमध्य उत्तरी अमेरिकी मुख्य भूमि के दक्षिण-दक्षिणपूर्व में स्थित एक जलडमरूमध्य है, जिसे आम तौर पर मैक्सिको की खाड़ी और अटलांटिक महासागर के बीच और फ्लोरिडा कीज़ और क्यूबा के बीच माना जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "डंकन मार्ग किसके बीच स्थित है?\n  <br>", "option1": "दक्षिण और लिटल अंडमान\n  <br>", "option2": "लिटल और ग्रेट निकोबार\n  <br>", "option3": "उत्तर और मध्य अंडमान\n  <br>", "option4": "मध्य और दक्षिण अंडमान\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "डंकन मार्ग बंगाल की खाड़ी में एक जलडमरूमध्य है। यह उत्तर में रटलैंड द्वीप (ग्रेट अंडमान और दक्षिण अंडमान प्रशासनिक प्रभाग का हिस्सा) और दक्षिण में लिटिल अंडमान को अलग करता है। मैनर्स जलडमरूमध्य डंकन मार्ग की शाखा है जो उत्तरी सिंक द्वीप और रटलैंड द्वीप के बीच स्थित है।\n  <br> इसलिए, सही उत्तर (a) दक्षिण और छोटा अंडमान है।\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "निम्नलिखित में से कौन-सा एक आग्नेय चट्टान नहीं है?\n  <br>", "option1": "ग्रेनाइट\n  <br>", "option2": "बेसाल्ट\n  <br>", "option3": "गैब्रो\n  <br>", "option4": "गनीस\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d), गनीस है। गनीस एक रूपांतरित चट्टान है, आग्नेय चट्टान नहीं। आग्नेय चट्टानें पिघली हुई चट्टान के ठंडा होने और जमने से बनती हैं, जबकि रूपांतरित चट्टानें ताप, दबाव या रासायनिक परिवर्तनों के कारण मौजूदा चट्टानों के परिवर्तन से बनती हैं।\n  <br> अन्य तीन विकल्प, ग्रेनाइट, बेसाल्ट और गैब्रो, सभी आग्नेय चट्टानें हैं। ग्रेनाइट एक फेल्सिक आग्नेय चट्टान है, बेसाल्ट एक माफिक आग्नेय चट्टान है, और गैब्रो एक अल्ट्रामैफिक आग्नेय चट्टान है।\n  <br> इसलिए, उत्तर (d), गनीस है।\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "भारत के संविधान का कौन-सा अनुच्छेद यह कहता है कि एक भारतीय नागरिक को किसी भी रेस्तरां, सड़क या सार्वजनिक स्थान का उपयोग करने का अधिकार है?\n  <br>", "option1": "अनुच्छेद 17(1)\n  <br>", "option2": "अनुच्छेद 15 (2)\n  <br>", "option3": "अनुच्छेद 14(2)\n  <br>", "option4": "अनुच्छेद 16 (1)\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "भारत के संविधान के अनुच्छेद 15 (2) में कहा गया है कि एक भारतीय नागरिक को किसी भी रेस्तरां, सड़क या सार्वजनिक स्थान का उपयोग करने का अधिकार है।\n  <br> इसमें कहा गया है कि कोई भी नागरिक, केवल धर्म, नस्ल, जाति, लिंग, जन्म स्थान या इनमें से किसी के आधार पर, दुकानों, सार्वजनिक रेस्तरां, होटलों और सार्वजनिक मनोरंजन के स्थानों तक पहुंच, या कुओं, टैंकों, स्नान घाटों, सड़कों और सार्वजनिक रिसॉर्ट के स्थानों के उपयोग के संबंध में किसी भी विकलांगता, दायित्व, प्रतिबंध या शर्त के अधीन नहीं होगा, जो पूरी तरह से या आंशिक रूप से राज्य निधि से बनाए गए हैं या आम जनता के उपयोग के लिए समर्पित हैं। इसलिए, सही उत्तर (b) अनुच्छेद 15(2) है।\n  <br> \n  <b>अनुच्छेद 17(1) </b>अस्पृश्यता को समाप्त करता है और किसी भी रूप में इसके अभ्यास पर रोक लगाता है।\n  <br> \n  <b>अनुच्छेद 14(2) </b>में\n  <b> </b>कहा गया है कि भारत के क्षेत्र के भीतर किसी भी नागरिक को कानून के समक्ष समानता या कानूनों के समान संरक्षण से वंचित नहीं किया जाएगा।\n  <br> \n  <b>अनुच्छेद 16(1) </b>सार्वजनिक रोजगार के मामलों में सभी नागरिकों के लिए अवसर की समानता की गारंटी देता है।\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "निम्नलिखित में से कौन संविधान सभा की प्रारूप समिति का सदस्य नहीं था?\n  <br>", "option1": "एन. जी. अय्यंगार\n  <br>", "option2": "के. एम. मुंशी\n  <br>", "option3": "बी. एन. राऊ\n  <br>", "option4": "मुहम्मद सादुल्लाह\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "संविधान सभा की सभी समितियों में सबसे महत्वपूर्ण समिति 29 अगस्त 1947 को गठित प्रारूप समिति थी।\n  <br> इसी समिति को नये संविधान का मसौदा तैयार करने का कार्य सौंपा गया था। इसमें सात सदस्य शामिल थे। वह थे:\n  <br>1. डॉ बी. आर. अंबेडकर (अध्यक्ष)\n  <br>2. एन गोपालस्वामी अय्यंगर\n  <br>3. अल्लादी कृष्णास्वामी अय्यर\n  <br>4. डॉ के. एम. मुंशी\n  <br>5. सैयद मोहम्मद सादुल्लाह\n  <br>6. एन. माधव राव (उन्होंने बी. एल. मित्तर का स्थान लिया जिन्होंने खराब स्वास्थ्य के कारण इस्तीफा दे दिया था)\n  <br>7. टी. टी. कृष्णमाचारी (उन्होंने डी. पी. खेतान का स्थान लिया जिनकी वर्ष 1948 में मृत्यु हो गई)\n  <br>  सर बी. एन. राऊ को सभा का संवैधानिक सलाहकार नियुक्त किया गया। वह प्रारूप समिति के सदस्य \n  <b>नहीं </b>थे।\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "लोकसभा द्वारा पारित धन विधेयक को राज्यसभा द्वारा कितने सप्ताह तक रोका जा सकता है?\n  <br>", "option1": "दो\n  <br>", "option2": "तीन\n  <br>", "option3": "चार\n  <br>", "option4": "पांच\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (a), दो है। लोकसभा द्वारा पारित धन विधेयक को राज्यसभा द्वारा दो सप्ताह तक रोका जा सकता है। धन विधेयक एक ऐसा विधेयक है जो कराधान, उधार या व्यय से संबंधित है। इसे केवल लोकसभा में ही पेश किया जा सकता है, राज्यसभा इसमें संशोधन नहीं कर सकती। राज्यसभा केवल धन विधेयक में बदलाव की सिफारिश कर सकती है, और लोकसभा इन सिफारिशों को स्वीकार या अस्वीकार कर सकती है। यदि राज्यसभा दो सप्ताह के भीतर धन विधेयक को लोकसभा को नहीं लौटाती है, तो धन विधेयक को दोनों सदनों द्वारा पारित माना जाता है। धन विधेयक को राज्यसभा द्वारा केवल दो सप्ताह तक ही रोका जा सकता है क्योंकि लोकसभा संसद का अधिक शक्तिशाली सदन है। \n  <br>लोकसभा सीधे लोगों द्वारा चुनी जाती है, जबकि राज्यसभा अप्रत्यक्ष रूप से राज्य विधानसभाओं द्वारा चुनी जाती है।\n  <br>इसलिए, यह माना जाता है कि जब कराधान और व्यय के मामलों की बात आती है तो लोगों की इच्छा प्रबल होनी चाहिए।\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "एक मोबाइल फ़ोन चार्जर है\n  <br>", "option1": "एक इन्वर्टर\n  <br>", "option2": "एक यूपीएस\n  <br>", "option3": "एक स्टेप-डाउन ट्रांसफार्मर\n  <br>", "option4": "एक स्टेप-अप ट्रांसफार्मर\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c), एक स्टेप-डाउन ट्रांसफार्मर है।\n  <br>मोबाइल फोन चार्जर एक स्टेप-डाउन ट्रांसफार्मर है। यह
