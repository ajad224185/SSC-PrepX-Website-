on4": "North Korea\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Refer to, \"While NATO’s earlier target was the Soviet Union and now Russia, the focus of NATO Plus is clearly on containing China.\"\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "Why is India considered a missing link in the NATO Plus framework?\n  <br>", "option1": "India has territorial disputes with China.\n  <br>", "option2": "India is not interested in joining any military alliance.\n  <br>", "option3": "India lacks advanced military technologies.\n  <br>", "option4": "India is already a member of NATO.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>Refer to, \"In light of increasing regional security challenges, India joining the NATO Plus framework could provide it with a security umbrella, with protection and deterrence against potential threats.\" This implies that India has territorial disputes with China, making it a missing link in the framework.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "According to the Chinese tale, what is the special characteristic of the Fox with Nine Tails?\n  <br>", "option1": "It possesses magical powers.\n  <br>", "option2": "It can shape-shift into different forms.\n  <br>", "option3": "Iप ुोौ ninध पोiिस पुोप ौदंृियप्रध थiौकयं.", "option4": "It brings good luck and prosperity.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Refer to, \"Legend has it that the fox possesses extraordinary powers, making it a symbol of both wisdom and mischief\" implies that one of the extraordinary powers of the Fox with Nine Tails is its shape-shifting abilities.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "Why did the Fox with Nine Tails initially approach the village?\n  <br>", "option1": "To seek revenge on the villagers.\n  <br>", "option2": "To gain the trust and admiration of the villagers.\n  <br>", "option3": "To find a companion and form a bond.\n  <br>", "option4": "To bring misfortune and chaos to the village.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Refer to, \"The Fox with Nine Tails initially approaches a peaceful village, disguised as a beautiful maiden. It uses its shape-shifting abilities to gain the trust and admiration of the villagers.\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What happens when a Fox with Nine Tails gains its ninth tail?\n  <br>", "option1": "It is offered a difficult choice between immortality and becoming a guardian angel.\n  <br>", "option2": "It loses its magical abilities and becomes an ordinary fox.\n  <br>", "option3": "It must leave the human world and return to the spirit realm.\n  <br>", "option4": "It becomes the guardian spirit of the village.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>Refer to, \" As the fox gains its ninth tail, it reaches the pinnacle of its powers but also faces a crucial decision. It must choose between ascending to immortality and leaving the human world behind or embracing its true purpose as a guardian spirit of the village.\"\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "Hयथ कयधौ पुध Cुinधौध पोिध यी पुध Fयस थiपु Ninध Tोiिस ौदंृियप्रध ुहंोn कधौiनधौ?", "option1": "The fox's multiple tails represent various human ambitions.\n  <br>", "option2": "The fox's transformation abilities reflect human adaptability.\n  <br>", "option3": "The fox's actions mirror the consequences of unchecked desires.\n  <br>", "option4": "The tale emphasizes the importance of fulfilling one's desires.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Refer to, \"However, the tale also teaches a valuable lesson about the consequences of unchecked desires\" suggests that the actions of the fox in the tale reflect the negative outcomes that can arise from unchecked human desires.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "Which city has set a Guinness World Record for the largest gathering on Yoga Day?\n  <br>", "option1": "Mumbai\n  <br>", "option2": "Surat \n  <br>", "option3": "Delhi\n  <br>", "option4": "Kolkata\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A new Guinness world record was set on the occasion of the Yoga Day event organised in Surat city of Gujarat, for the largest gathering for a yoga session at one place with 1.53 lakh people joining the programme.\n  <br>The previous world record was set in 2018 in Kota city of Rajasthan when 1,00,984 people participated in a Yoga Day session in one place.\n  <br>The International Day of Yoga has been celebrated across the world annually on June 21 since 2015.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "Which country recently signed an agreement worth $4.8 billion with cash-strapped Pakistan to establish a 1,200-megawatt nuclear power plant?\n  <br>", "option1": "China \n  <br>", "option2": "United States\n  <br>", "option3": "Russia\n  <br>", "option4": "Japan\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "China on June 20 inked an agreement worth a whopping $4.8 billion with cash-strapped Pakistan to set up a 1,200-megawatt nuclear power plant as a sign of increasing strategic cooperation between the two all-weather allies.\n  <br>Prime Minister Shehbaz Sharif witnessed the signing of the deal under which Beijing would build a 1,200-megawatt Chashma-V nuclear plant at Chashma in the Mianwali district of Punjab.\n  <br>Pakistan's Chashma power plants are considered a key in the production of cheap nuclear power. \n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "In the Global Gender Gap Report 2023 released by the World Economic Forum, what was India's ranking among 146 countries?\n  <br>", "option1": "89\n  <br>", "option2": "105\n  <br>", "option3": "127 \n  <br>", "option4": "140\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "India ranked 127 out of 146 countries in the Global Gender Gap Report 2023 released by the World Economic Forum.\n  <br>India was ranked at 127 out of 146 countries in terms of gender parity — an improvement of eight places from last year.\n  <br>The index ranked India’s neighbours Pakistan at 142, Bangladesh at 59, China at 107, Nepal at 116, Sri Lanka at 115 and Bhutan at 103.\n  <br>Iceland is the most gender-equal country in the world for the 14th consecutive year and the only one to have closed more than 90% of its gender gap, according to the report\n  <br> \n  <b>Global Gender Gap Index:</b> \n  <br>The Global Gender Gap Index annually benchmarks the current state and evolution of gender parity across four key dimensions (Economic Participation and Opportunity, Educational Attainment, Health and Survival, and Political Empowerment). It is the longest-standing index tracking the progress of numerous countries’ efforts towards closing these gaps over time since its inception in 2006.\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "Which organization announced the launch of the second edition of the virtual \"Startup School\" in India?\n  <br>", "option1": "Indian Institute of Technology\n  <br>", "option2": "StartupsIndia\n  <br>", "option3": "Google India \n  <br>", "option4": "Ministry of Commerce and Industry\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "After the success of the first edition, Google India announced the launch of the second edition of the virtual “Startup School” 2023, supported by Startup India, starting from July 11.\n  <br>The program is designed to help early-stage startups in India learn about the fundamentals of entrepreneurship, product development, marketing, and fundraising. The program will be delivered over eight weeks, and it will feature over 30 Google and industry experts.\n  <br>The first edition of Startup School was launched in India in 2022, and it was attended by over 14,000 startups. The program was well-received by the startup community, and it is expected that the second edition will be even more successful.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "_______ sets Guinness World Record by becoming the first-ever male player to make 200 International matches.\n  <br>", "option1": "Kylian Mbappe\n  <br>", "option2": "Neymar\n  <br>", "option3": "Lionel Messi\n  <br>", "option4": "Cristiano Ronaldo \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Cristiano Ronaldo (d) set a Guinness World Record by becoming the first-ever male player to make 200 International matches. He achieved the feat on September 1, 2022, when he played against the Republic of Ireland in a 2022 FIFA World Cup qualifying match.\n  <br>Ronaldo has been capped by Portugal 201 times, scoring 117 goals. He is the all-time leading scorer for Portugal and the all-time leading scorer in men's international football.\n  <br>Ronaldo is a five-time Ballon d'Or winner and has won numerous other individual and team awards. He is considered to be one of the greatest footballers of all time.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "According to the Economic Intelligence Unit's Global Liveability Index report, which city has been recognized as the \"most liveable city\"?\n  <br>", "option1": "Vienna \n  <br>", "option2": "Zurich\n  <br>", "option3": "Melbourne\n  <br>", "option4": "Tokyo\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "According to the Economist Intelligence Unit's Global Liveability Index report, Vienna has been recognized as the \"most liveable city\" for the fourth consecutive year. \n  <br>The index assesses 173 cities worldwide on various factors, including stability, healthcare, infrastructure, education, and culture and environment.\n  <br>Vienna scored 99.1 out of 100 in the index, followed by Copenhagen (98.0) and Zurich (96.1). Other cities in the top 10 include Calgary (95.6), Vancouver (95.5), Frankfurt (95.3), Toronto (95.1), Amsterdam (94.9), and Osaka (94.8).\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Which one of the following is the correct ascending sequence of States with regard to percentage of urban population (2011)? \n  <br>", "option1": "Tamil Nadu – Mizoram – Goa – Maharashtra \n  <br>", "option2": "Goa – Mizoram – Maharashtra – Kerala \n  <br>", "option3": "Maharashtra – Kerala – Mizoram – Goa \n  <br>", "option4": "Mizoram – Goa – Maharashtra – Kerala \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct ascending sequence of States with regard to the percentage of the urban population in 2011 is Maharashtra – Kerala – Mizoram – Goa.\n  <br>According to the 2011 census, Goa is the most urbanized state with 62.17% of the population living in urban areas. It is followed by Mizoram (52.11%), Kerala (47.7%), and Maharashtra (54.78%).\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "The imaginary line on the Earth’s surface that closely follows the 180° meridian is\n  <br>", "option1": "Prime meridian\n  <br>", "option2": "Equator\n  <br>", "option3": "International date line\n  <br>", "option4": "Tropic of cancer\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The International Date Line (IDL) is an imaginary line of demarcation on the\n  <b> surface of Earth </b> that runs from the\n  <b> North Pole </b> to the\n  <b> South Pole </b> and demarcates the change of one \n  <b> calendar day </b> to the next. It passes through the middle of the \n  <b> Pacific Ocean,</b> roughly following the \n  <b> 180° line of longitude </b> but deviating to pass around some territories and island groups.\n  <br>The Prime Meridian is an imaginary line that passes through Greenwich, England. It is used as the zero-degree longitude line on maps of the Earth. The Equator is an imaginary line that divides the Earth into the Northern and Southern Hemispheres. \n  <br>It is also used as a reference line for measuring latitude. The Tropic of Cancer is an imaginary line that is located at 23.5 degrees north of the Equator. It is the northernmost point at which the sun can be directly overhead.\n  <br>So, the answer is (c), International date line.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Which of the following National Parks of India are declared as World Heritage by UNESCO?\n  <br>1. Keoladeo National Park\n  <br>2. Sundarbans National Park\n  <br>3. Kaziranga National Park\n  <br>4. Ranthambore National Park\n  <br>Select the correct answer using the code given below.\n  <br>", "option1": "1 and 2 only\n  <br>", "option2": "1, 2 and 3 only\n  <br>", "option3": "3 and 4 only\n  <br>", "option4": "1, 2, 3 and 4\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b), 1, 2 and 3 only.\n  <br> The following national parks of India are declared as World Heritage by UNESCO:\n  <br> Keoladeo National Park\n  <br>Sundarbans National Park\n  <br>Kaziranga National Park\n  <br> Ranthambore National Park is not a World Heritage Site.\n  <br> So, the answer is (b), 1, 2 and 3 only.\n  <br>  The \n  <b>Keoladeo National Park</b> in\n  <b> </b> \n  <b>Bharatpur</b> is located within the \n  <b> Indus </b>-\n  <b> Ganges </b> Monsoon Forest Biogeographical Province. It was declared a national park in 1982.  It was recorded as a \n  <b>Ramsar Wetland</b> site in 1981. It was inscribed in the UNESCO World Heritage List in 1985. \n  <br>  The \n  <b> Sundarbans National Park,</b> the largest \n  <b> estuarine </b> \n  <b> mangrove </b>  forest in the world is a \n  <b> national </b>   \n  <b> park </b>, \n  <b> tiger </b>   \n  <b> reserve </b>, World Heritage Site, and \n  <b> biosphere reserve </b> located in the \n  <b> Sundarbans Ganges river delta </b> bordering the \n  <b> Bay of Bengal </b>, in \n  <b> West </b>   \n  <b> Bengal </b>. On May 4, 1984, it was declared a National Park. It was inscribed on the UNESCO \n  <b> World Heritage </b> list in 1987.\n  <br> \n  <b> Kaziranga </b>, located in the northeastern state of \n  <b> Assam </b> in the flood plains of the \n  <b> Brahmaputra river's</b> south bank, was declared a World Heritage Site by UNESCO in 1985 for its unique natural environment.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "The Damin-i-Koh was created by the British Government to settle which one of the following communities?\n  <br>", "option1": "Santhals \n  <br>", "option2": "Mundas\n  <br>", "option3": "Oraons\n  <br>", "option4": "Saoras\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a), Santhals.\n  <br> Damin-i-Koh was a large area of land in the Rajmahal Hills in present-day Jharkhand, India, that was demarcated by the British government in 1832 and settled by the Santhal community. The Santhals are a tribal community who are native to the region. \n  <br> The Santhals were given land by British Government and persuaded to settle in the foothills of Rajmahal, which were dominated by Paharia tribes. \n  <br>This was declared to be the land of the Santhals. They were to live within it, practise plough agriculture, and become settled peasants. The land grant to the Santhals stipulated that at least one-tenth of the area was to be cleared and cultivated within the first ten years, the main objective of British government behind this land grant.\n  <br> The Damin-i-Koh is now part of the Santhal Parganas district of Jharkhand. The Santhals continue to be the majority community in the region.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Who among the following was known during the days of the Revolt of 1857 as ‘Danka Shah’?\n  <br>", "option1": "Shah Mal\n  <br>", "option2": "Maulavi Ahmadullah Shah\n  <br>", "option3": "Nana Sahib\n  <br>", "option4": "Tantia Tope\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b), Maulavi Ahmadullah Shah.\n  <br> Maulvi Ahmadullah Shah was a religious leader who played a significant role in the Revolt of 1857. He was known for his fiery speeches and his ability to motivate people to fight against the British. He was also known for his use of a large drum, which he used to rally people to the cause of the rebellion.\n  <br> The British called him \"Danka Shah\" because of his use of the drum. \"Danka\" is a Hindi word that means \"drum.\"\n  <br> Maulvi Ahmadullah Shah was killed in battle in 1858. He is considered to be one of the most important figures in the Revolt of 1857.\n  <br>  \n  <b>Some facts:</b> \n  <br> Ahmadullah Shah, famous as Maulvi of Faizabad, famous freedom fighter and was a leader of the Indian Rebellion of 1857. Maulavi Ahmadullah Shah was known as the lighthouse of rebellion in Awadh region.\n  <br>  \n  <b>According to G. B. Malleson</b>, \"It is beyond doubt that behind the conspiracy of 1857 revolt, Moulavi's brain and efforts were significant. Distribution of bread during the campaigns, Chapati Movement, was actually his brainchild.\"\n  <br> The to-be-constructed mosque in Ayodhya as per the verdict of Supreme Court of India in Babri Masjid demolition case, will be named after Ahmadullah Shah.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Who among the following was not a painter at Akbar’s Court?\n  <br>", "option1": "Daswanth\n  <br>", "option2": "Abdus Samad\n  <br>", "option3": "Kalyan Das\n  <br>", "option4": "Basawan\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c), Kalyan Das.\n  <br>Kalyan Das was a painter at the court of Muhammad Shah, not Akbar's court. \n  <br>Basawan was one of the major painter at Mughal King Akbar's court. He mainly worked during the period of 1580 to 1600. Along with him, Abdus Samad and Daswanth were also the painters of Akbar’s court. \n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Consider the following statements about Alauddin Khalji’s market policy:\n  <br>1. He placed markets under the control of a high officer called ‘Shahna’ for strictly controlling the shopkeepers and prices.\n  <br>2. In order to ensure a regular supply of cheap food grains, he ordered the land revenue from the Doab region to be paid directly to the State.\n  <br>Which of the statements given above is/are correct?\n  <br>", "option1": "1 only\n  <br>", "option2": "2 only\n  <br>", "option3": "Both 1 and 2\n  <br>", "option4": "neither 1 nor 2\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c), Both 1 and 2.\n  <br> Alauddin Khalji was a 14th-century ruler of the Delhi Sultanate. He is known for his military conquests and his administrative reforms. One of his most important reforms was his market policy.\n  <br> Under Alauddin's market policy, markets were placed under the control of a high officer called the Shahna. The Shahna was responsible for strictly controlling the shopkeepers and prices. He could punish shopkeepers who violated the rules, and he could even have them executed.\n  <br> Alauddin also ordered the land revenue from the Doab region to be paid directly to the State. This was done in order to ensure a regular supply of cheap food grains. The Doab region was a fertile region, and it was a major producer of food grains. By paying the land revenue directly to the State, Alauddin was able to control the price of food grains and ensure that it was affordable for the people.\n  <br> So, both statements 1 and 2 are correct.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "The Twelfth Five-Year Plan focused on inclusive growth. Which of the following were considered as challenges for inclusiveness?\n  <br>1. Poverty\n  <br>2. Group inequality\n  <br>3. Regional imbalance\n  <br>4. Unemployment\n  <br>Select the correct answer using the code given below.\n  <br>", "option1": "1, 3 and 4 only\n  <br>", "option2": "1, 2, 3 and 4\n  <br>", "option3": "1, 2 and 4 only\n  <br>", "option4": "2 and 3 only\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The aim of the Twelfth Five Year plan was to achieve “faster, sustainable and more inclusive growth”. It focused on inclusive growth. \n  <br>Inclusive growth is a concept that advances equitable opportunities for economic participants during economic growth with benefits incurred by every section of society.\n  <br>However, poverty, group inequality, regional imbalance and unemployment are some of the challenges for inclusiveness. \n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Which one of the following indices is now used by the Reserve Bank of India to measure the rate of inflation in India?\n  <br>", "option1": "NASDAQ Index\n  <br>", "option2": "BSE Index\n  <br>", "option3": "Consumer Price Index\n  <br>", "option4": "Wholesale Price Index\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Wholesale Price Index (WPI) was main index for measurement of inflation in India till April 2014 when RBI adopted new Consumer Price Index (CPI) (combined) as the key measure of inflation.\n  <br>The Reserve Bank of India (RBI) uses the Consumer Price Index (CPI) to measure the rate of inflation in India. The CPI is a measure of the average change in prices of a basket of goods and services that are consumed by households. The CPI is calculated by the National Statistical Office (NSO) on a monthly basis.\n  <br>The NASDAQ Index and the BSE Index are stock market indices, which measure the performance of the stock markets in the United States and India, respectively. They are not used to measure the rate of inflation.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Which one of the following Schedules of the Constitution of India has fixed the number of Members of the Rajya Sabha to be elected from each State? \n  <br>", "option1": "Fifth Schedule \n  <br>", "option2": "Third Schedule \n  <br>", "option3": "Sixth Schedule \n  <br>", "option4": "Fourth Schedule \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The fourth Schedule contains provisions as to the allocation of seats in the Rajya Sabha.\n  <br>The third Schedule contains the Forms of Oaths or Affirmations.\n  <br>The fifth Schedule contains provisions as to the Administration and Control of Scheduled Areas and Scheduled Tribes.\n  <br>The sixth Schedule contains provisions as to the Administration of Tribal Areas in the States of Assam, Meghalaya, Tripura and Mizoram.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "The Fundamental Rights guaranteed in the Constitution of India can be suspended only by\n  <br>", "option1": "a proclamation of National Emergency \n  <br>", "option2": "an Act passed by the Parliament \n  <br>", "option3": "an amendment to the Constitution of India\n  <br>", "option4": "the judicial decisions of the Supreme Court \n  <br> \n  <b> </b> \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Article 352 states that if the President is satisfied that a grave emergency exists whereby the security of India or of any part of the territory thereof is threatened, whether by war or external aggression or armed rebellion, he may, by Proclamation, make a declaration to that effect in respect of the whole of India or of such part of the territory thereof as may be specified in the Proclamation.\n  <br>  \n  <b>The declaration of National Emergency has far-reaching effects on the fundamental rights of individuals as under:</b> \n  <br>The Fundamental Rights under Article 19 are automatically suspended and this suspension continues till the end of the emergency. But according to the 44th Amendment Article 19 can be suspended only in case of proclamation on the ground of war or external aggression and not on ground of armed rebellion.\n  <br>Other fundamental rights may also get suspended except Article 20 and 21.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Which one of the following statements is not correct?\n  <br>", "option1": "Elements are defined by the number of protons they possess.\n  <br>", "option2": "Isobars are atoms having the same atomic number but different mass number.\n  <br>", "option3": "The mass Number of an atom is equal to the number of nucleons in its nucleus.\n  <br>", "option4": "Valency is the combining capacity of an atom\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is: (b) Isobars are atoms having the same atomic number but different mass number.This statement is not correct. \n  <br>Isobars are atoms or ions that have the same mass number but different atomic numbers. In other words, they have the same total number of nucleons (protons + neutrons) but different numbers of protons. \n  <br>For example; calcium, atomic number 20, and argon, atomic number 18. The number of protons in these atoms is different, but the mass number of both these elements is 40.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "Match List-I with List-II and select the correct answer using the code given below the Lists:\n  <br>     \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1698041996227image45.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a), 4, 1, 2, 3.\n  <br>The match between List-I and List-II is as follows:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1698041995889image87.png\"> \n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1698041995891image88.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Deficiency of fluoride leads to which one of the following health problems?\n  <br>", "option1": "Tooth caries\n  <br>", "option2": "Mottling of tooth\n  <br>", "option3": "Bending of bones\n  <br>", "option4": "Stiffening of joints\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Fluoride is both useful and harmful for our body it depends on the consumption amount of \n  <br>Fluoride. The deficiency of fluoride in body leads to tooth caries while the excess of fluoride leads to mottling of tooth. \n  <br>Adding fluoride to the water supply reduces the incidence of tooth decay. Fluoride protects teeth from decay by demineralization and remineralization. Too much fluoride can lead to dental fluorosis or skeletal fluorosis, which can damage bones and joints.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "Excessive use of which of the following fertilizers may be responsible for the presence of a toxic substance in groundwater?\n  <br>", "option1": "Nitrogen \n  <br>", "option2": "Phosphate only\n  <br>", "option3": "Potassium only\n  <br>", "option4": "Phosphate and potassium\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Excessive use of nitrogen fertilizer may be responsible for the presence of a toxic substance in groundwater. Groundwater is being polluted mainly by nitrates. It is also stable (it does not degrade) under high oxygen conditions. Nitrate levels above 10 mg/L (10 ppm) in groundwater can cause \n  <b>\"blue baby syndrome </b>\" (acquired\n  <b> </b> \n  <b>methemoglobinemia</b>). \n  <br>This problem is particularly associated with extensive and intensive application of organic fertilizers (manure).\n  <br>In all countries groundwater is an important source of drinking water. In several areas the groundwater is polluted to an extent that it is no longer fit to be used as drinking water according to present standards.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "______ is the largest union territory in India in terms of area.\n  <br>", "option1": "Chandigarh\n  <br>", "option2": "Ladakh\n  <br>", "option3": "Jammu and Kashmir\n  <br>", "option4": "Puducherry\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b), Ladakh.\n  <br>Ladakh is the largest union territory in India in terms of area. It has a total area of 59,146 square kilometers.\n  <br>Ladakh was established as a union territory of India on 31 October 2019, following the passage of the Jammu and Kashmir Reorganisation Act. Prior to that, it was part of the Jammu and Kashmir state. Ladakh is both the largest and the second least populous union territory of India.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Parsec is a unit of ______.\n  <br>", "option1": "acceleration\n  <br>", "option2": "speed\n  <br>", "option3": "length\n  <br>", "option4": "time\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "'Parsec' is a unit of measurement of length. One parsec is defined as the distance at which one astronomical unit subtends an angle of one arcsecond.\n  <br>1 parsec is equal to 3.26 light years.\n  <br> Acceleration is a measure of the rate of change of velocity. The unit of acceleration is meters per second squared.\n  <br> Speed is a measure of how fast an object is moving. The unit of speed is meters per second.\n  <br> Time is a measure of how long something takes to happen. The unit of time is seconds.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "With which of the following sports do you associate the term '16-yard hit'?\n  <br>", "option1": "Cricket\n  <br>", "option2": "Lawn tennis\n  <br>", "option3": "Field hockey\n  <br>", "option4": "Golf\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c), Field hockey.\n  <br>A 16-yard hit is a type of free hit in field hockey. It is taken from a distance of 16 yards from the goal line. The ball must be hit directly into the goal to score a goal.\n  <br>The 16-yard hit is a powerful shot that can be used to score goals or to create scoring opportunities. It is a very important skill in field hockey.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "Who is the author of the book, 'Men in White - A Book of Cricket'?\n  <br>", "option1": "Mukul Kesavan\n  <br>", "option2": "Boria Mazumdar\n  <br>", "option3": "Harsha Bhogle\n  <br>", "option4": "Sanjay Manjrekar\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The author of the book, 'Men in White - A Book of Cricket' is Mukul Kesavan.\n  <br>Mukul Kesavan is an Indian historian, novelist, and political and social essayist. He is the author of several books, including Looking Through Glass (1994), The History of India: 1947-2012 (2013), and Men in White: A Book of Cricket (2007).\n  <br>Men in White is a book about the history of cricket in India. It is a well-researched and insightful book that provides a comprehensive overview of the sport in India. The book is divided into three parts: the first part deals with the early history of cricket in India, the second part deals with the period from the 1920s to the 1980s, and the third part deals with the period from the 1990s to the present day.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "A device that connect to a network without the use of cables is said to be ………………...?\n  <br>", "option1": "distributed \n  <br>", "option2": "wireless \n  <br>", "option3": "centralized \n  <br>", "option4": "open source \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Wireless </b>networks are computer networks that are not connected by cables of any kind. The use of a wireless network enables enterprises to avoid the costly process of introducing cables into buildings or as a connection between different equipment locations.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "What type of resource is most likely to be a shared common resource in a computer network?\n  <br>", "option1": "Keyboards \n  <br>", "option2": "Speakers \n  <br>", "option3": "Floppy disk drives \n  <br>", "option4": "Printers \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 133, "question": "………….is a Windows utility program that locates and eliminates unnecessary fragments and rearranges files and unused disk space to optimize operations?\n  <br>", "option1": "Backup \n  <br>", "option2": "Disk Cleanup \n  <br>", "option3": "Disk Defragmenter\n  <br>", "option4": "Restore \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Disk Defragmenter</b> is a utility in Microsoft Windows designed to increase access speed by rearranging files stored on a disk to occupy contiguous storage locations, a technique called defragmentation.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "A computer hacker is?\n  <br>", "option1": "A person who maintains computer security \n  <br>", "option2": "A person who violates computer security with malicious intention for personal gain \n  <br>", "option3": "A person responsible for safe computer operation \n  <br>", "option4": "A person who repairs computer \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Hacking is an attempt to exploit a computer system or a private network inside a computer. It is the unauthorized access to or control over computer network security system for some illicit purpose. Computer hacker is \n  <b>a skilled person who violates computer security with malicious intent for personal gain.</b> \n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "If your computer keeps rebooting itself, then it is likely that?\n  <br>", "option1": "It has a virus \n  <br>", "option2": "It does not have enough memory\n  <br>", "option3": "There is no printer \n  <br>", "option4": "There has been a power surge \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "If a computer rebooting itself, then it is likely that \n  <b>it has a virus. </b> \n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "Which of the following can be used to select the entire document?\n  <br>", "option1": "CTRL + A\n  <br>", "option2": "ALT + F5\n  <br>", "option3": "SHIFT + A\n  <br>", "option4": "CTRL + K\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Ctrl+A </b>is used to select the entire document.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "...... shows all the websites and pages that are visited over a period of time?\n  <br>", "option1": "Home page\n  <br>", "option2": "Toolbar\n  <br>", "option3": "Task bar\n  <br>", "option4": "History\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>History</b> Show all the website and pages that are visited over a period of time.\ let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
