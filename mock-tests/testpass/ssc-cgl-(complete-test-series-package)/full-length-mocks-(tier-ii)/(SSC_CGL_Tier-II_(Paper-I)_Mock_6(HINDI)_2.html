"sr_no": 60, "question": "Find the missing number in the following series:\n  <br>1, 4, 11, 26, ?, 120\n  <br>", "option1": "59\n  <br>", "option2": "75\n  <br>", "option3": "57\n  <br>", "option4": "74\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "1+3=4\n  <br>4+7=11 (7=3×2+1)\n  <br>11+15=26 (15=7×2+1)\n  <br>26+(15×2+1)=57\n  <br>57+(31×2)+1=57+63=120\n  <br>", "question_heading": ""}, {"sr_no": 61, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The proposal received \n  <b>unanimous </b>approval from the board members.\n  <br>", "option1": "Partial\n  <br>", "option2": "Unruly\n  <br>", "option3": "Divided\n  <br>", "option4": "Unequivocal\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The antonym of \"unanimous\" (complete agreement) is \"divided\" (disagreement or lack of consensus among the members).\n  <br>The other options do not convey the opposite meaning: \"partial\" means incomplete, \"unanimous\" is the same as the highlighted word, and \"unequivocal\" means clear and unambiguous.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>The study of the structure and function of cells.\n  <br>", "option1": "Physiology\n  <br>", "option2": "Histology\n  <br>", "option3": "Cytology\n  <br>", "option4": "Oncology\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The study of the structure and function of cells is called \"cytology.\"\n  <br>The other options are incorrect: \"physiology\" is the study of the functions and mechanisms in living organisms, \"histology\" is the study of the microscopic structure of tissues, and \"oncology\" is the study of cancer.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. In addition to being used as a sweetener, honey has a long history of medicinal use and is believed to have antibacterial and anti-inflammatory properties.\n  <br>B. Bees collect nectar from flowers and convert it into honey through a process of regurgitation and evaporation.\n  <br>C. Honey is a natural sweet substance produced by bees and is one of the oldest known sweeteners.\n  <br>D. Honey has been an important part of human diets and cultures for thousands of years and is still widely consumed around the world today.\n  <br>", "option1": "CBAD\n  <br>", "option2": "ACBD\n  <br>", "option3": "DCBA\n  <br>", "option4": "BADC\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct sequence of sentences is: \"Honey is a natural sweet substance produced by bees and is one of the oldest known sweeteners (C). Bees collect nectar from flowers and convert it into honey through a process of regurgitation and evaporation (B). In addition to being used as a sweetener, honey has a long history of medicinal use and is believed to have antibacterial and anti-inflammatory properties (A). Honey has been an important part of human diets and cultures for thousands of years and is still widely consumed around the world today (D).\"\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the most appropriate option to fill in the blank.\n  <br>The ________ of the internet has revolutionized the way we communicate and access information.\n  <br>", "option1": "proliferation\n  <br>", "option2": "decline\n  <br>", "option3": "cessation\n  <br>", "option4": "reduction\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \"proliferation\" (rapid increase or spread) of the internet has revolutionized the way we communicate and access information. The other options do not fit the context: \"decline\" means a decrease, \"cessation\" means a complete stop, and \"reduction\" means a decrease in size or amount.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>The politician's speech was \n  <b>full of hot air</b> and lacked any concrete plans.\n  <br>", "option1": "Lacking substance or truth\n  <br>", "option2": "Filled with enthusiasm\n  <br>", "option3": "Very inspiring and motivational\n  <br>", "option4": "Containing too much detail\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"full of hot air\" means that something is lacking substance or truth, often used to describe empty or insincere talk. The other options do not convey the correct meaning: \"filled with enthusiasm\" means excited, \"very inspiring and motivational\" means uplifting and encouraging, and \"containing too much detail\" means overly detailed or complicated.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The ________ of the company's stock has been steadily increasing.\n  <br>", "option1": "bare\n  <br>", "option2": "bear\n  <br>", "option3": "pear\n  <br>", "option4": "pair\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct homophone to fill in the blank is \"bear,\" as in \"the bear of the company's stock has been steadily increasing\" (meaning the weight or burden). The other options are incorrect: \"bare\" means uncovered or naked, \"pear\" is a type of fruit, and \"pair\" means a set of two.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The book provides a comprehensive ________ of the major events that shaped the 20th century.\n  <br>", "option1": "overview\n  <br>", "option2": "understatement\n  <br>", "option3": "declination\n  <br>", "option4": "rarity\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A comprehensive \"overview\" (general review or summary) of the major events fits best in this context. The other options are not appropriate: \"understatement\" means a statement that is less strong than the facts, \"declination\" means a refusal or decline, and \"rarity\" refers to something uncommon or infrequent.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The government's new policy aims to ________ the gap between the rich and the poor.\n  <br>", "option1": "exacerbate\n  <br>", "option2": "magnify\n  <br>", "option3": "eradicate\n  <br>", "option4": "bridge\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The government's new policy aims to \"bridge\" (connect, link or reduce) the gap between the rich and the poor. The other options do not fit the context: \"exacerbate\" means to make something worse, \"magnify\" means to make something appear larger or more important, and \"eradicate\" means to destroy or eliminate completely.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Select the correct option from the given options to fill in the blank.\n  <br>The ________ of her speech left everyone in the audience feeling motivated and inspired.\n  <br>", "option1": "eloquence\n  <br>", "option2": "pretense\n  <br>", "option3": "blunder\n  <br>", "option4": "monotony\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \"eloquence\" (fluent or persuasive speaking or writing) of her speech left everyone feeling motivated and inspired. The other options do not fit the context: \"pretense\" means a false display or claim, \"blunder\" refers to a mistake or error, and \"monotony\" means a lack of variety or interest.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>Fear or hatred of strangers or foreigners.\n  <br>", "option1": "Xenophobia\n  <br>", "option2": "Claustrophobia\n  <br>", "option3": "Agoraphobia\n  <br>", "option4": "Hydrophobia\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\"Xenophobia\" is the fear or hatred of strangers or foreigners. The other options are incorrect: \"claustrophobia\" is the fear of confined spaces, \"agoraphobia\" is the fear of open or public spaces, and \"hydrophobia\" is the fear of water.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who is skilled in telling stories and anecdotes.\n  <br>", "option1": "Raconteur\n  <br>", "option2": "Connoisseur\n  <br>", "option3": "Dilettante\n  <br>", "option4": "Philanthropist\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A \"raconteur\" is a person who is skilled in telling stories and anecdotes. The other options are incorrect: \"connoisseur\" is an expert judge in matters of taste, \"dilettante\" is a person who cultivates an area of interest without real commitment or knowledge, and \"philanthropist\" is a person who seeks to promote the welfare of others.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The \n  <b>diligent</b> student worked tirelessly to complete the assignment.\n  <br>", "option1": "Lazy\n  <br>", "option2": "Meticulous\n  <br>", "option3": "Persistent\n  <br>", "option4": "Industrious\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate antonym of the highlighted word \"diligent\" (hardworking, industrious) is \"lazy\" (unwilling to work or use energy). The other options are not antonyms: \"meticulous\" means showing great attention to detail, \"persistent\" means continuing firmly in a course of action, and \"industrious\" means diligent and hardworking.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate SYNONYM of the highlighted word.\n  <br>The \n  <b>enigmatic</b> painting left the viewers puzzled.\n  <br>", "option1": "Cryptic\n  <br>", "option2": "Transparent\n  <br>", "option3": "Lucid\n  <br>", "option4": "Obvious\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate synonym for the highlighted word \"enigmatic\" (difficult to interpret or understand) is \"cryptic\" (having a meaning that is mysterious or obscure). The other options are antonyms: \"transparent\" means easily understood or detected, \"lucid\" means expressed clearly, and \"obvious\" means easily perceived or understood.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the most appropriate SYNONYM of the highlighted word.\n  <br>The manager's decision was \n  <b>arbitrary</b> and lacked proper justification.\n  <br>", "option1": "Systematic\n  <br>", "option2": "Random\n  <br>", "option3": "Methodical\n  <br>", "option4": "Planned\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate synonym for the underlined word \"arbitrary\" (based on random choice or personal whim) is \"random\" (made, done, or chosen without method or conscious decision). The other options are antonyms: \"systematic\" means done or acting according to a plan or system, \"methodical\" means orderly or systematic, and \"planned\" means designed or arranged in advance.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.\n  <br>From the options P, Q, R, and S, select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) The family gathered around the table, eagerly waiting for the delicious feast.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) They were all grateful to be in each other's company.\n  <br> (P) The turkey, the centerpiece of the meal, was perfectly roasted and golden brown.\n  <br>(Q) Everyone took a moment to share what they were thankful for.\n  <br>(R) Plates were filled with a variety of dishes, each more appetizing than the last.\n  <br>(S) The house was filled with laughter and conversations from different corners.\n  <br>", "option1": "P, Q\n  <br>", "option2": "R, S\n  <br>", "option3": "Q, R\n  <br>", "option4": "S, P\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of sentences is:\n  <br>(S1) The family gathered around the table, eagerly waiting for the delicious feast.\n  <br>(S2) The turkey, the centerpiece of the meal, was perfectly roasted and golden brown (P).\n  <br>(S3) Everyone took a moment to share what they were thankful for (Q).\n  <br>(S4) They were all grateful to be in each other's company.\n  <br>The paragraph is about a family gathering for a feast. Sentence P follows S1 logically by describing the main dish, and sentence Q follows P by explaining what the family members did during the meal, which also connects well to the concluding sentence, S4.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.\n  <br>From the options P, Q, R, and S, select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) Jane walked into the library, feeling a sense of calm wash over her.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) She couldn't wait to get lost in the world of her favorite author.\n  <br> (P) She walked past the shelves, running her fingers lightly over the spines of the books.\n  <br>(Q) The quiet atmosphere and the smell of old books were comforting to her.\n  <br>(R) The children's section was filled with bright colors and giggling kids.\n  <br>(S) The librarian greeted her with a warm smile as she headed to her usual spot.\n  <br>", "option1": "P, R\n  <br>", "option2": "Q, S\n  <br>", "option3": "R, Q\n  <br>", "option4": "S, P\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of sentences is:\n  <br>(S1) Jane walked into the library, feeling a sense of calm wash over her.\n  <br>(S2) The quiet atmosphere and the smell of old books were comforting to her (Q).\n  <br>(S3) The librarian greeted her with a warm smile as she headed to her usual spot (S).\n  <br>(S4) She couldn't wait to get lost in the world of her favorite author.\n  <br>The paragraph is about Jane's experience in the library. Sentence Q follows S1 logically by explaining the reasons for her sense of calm, and sentence S follows Q by describing her interaction with the librarian as she goes to her usual spot, which connects well with the concluding sentence, S4.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Choose the option that correctly transforms the given sentence into passive voice.\n  <br>The committee has approved the new policy.\n  <br>", "option1": "The new policy was approved by the committee.\n  <br>", "option2": "The new policy has been approved by the committee.\n  <br>", "option3": "The new policy has approved by the committee.\n  <br>", "option4": "The new policy is approved by the committee.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the present perfect tense (has approved). When transforming it into passive voice, we maintain the tense and use the auxiliary verb \"has been\" followed by the past participle of the main verb (approved).\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Choose the option that correctly transforms the given sentence into active voice.\n  <br>The artwork was admired by many visitors.\n  <br>", "option1": "Many visitors had admired the artwork.\n  <br>", "option2": "Many visitors admired the artwork.\n  <br>", "option3": "Many visitors have admired the artwork.\n  <br>", "option4": "Many visitors were admired the artwork.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple past passive voice (was admired). When transforming it into active voice, we maintain the tense and use the simple past tense of the main verb (admired).\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Choose the option that correctly transforms the given sentence into passive voice.\n  <br>The construction company will build a new bridge across the river.\n  <br>", "option1": "A new bridge will be built by the construction company across the river.\n  <br>", "option2": "A new bridge across the river was built by the construction company.\n  <br>", "option3": "A new bridge across the river is built by the construction company.\n  <br>", "option4": "A new bridge will build by the construction company across the river.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple future tense (will build). When transforming it into passive voice, we maintain the tense and use \"will be\" followed by the past participle of the main verb (built).\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Choose the option that correctly transforms the given sentence into active voice.\n  <br>The proposal was unanimously rejected by the board.\n  <br>", "option1": "The board had unanimously rejected the proposal.\n  <br>", "option2": "The board unanimously rejected the proposal.\n  <br>", "option3": "The board has unanimously rejected the proposal.\n  <br>", "option4": "The board was unanimously rejected the proposal.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given sentence is in the simple past passive voice (was unanimously rejected). When transforming it into active voice, we maintain the tense and use the simple past tense of the main verb (rejected).\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Choose the option that correctly changes the given direct speech to indirect speech.\n  <br>Mark said, \"I will meet you tomorrow.\"\n  <br>", "option1": "Mark said that he would meet me the next day.\n  <br>", "option2": "Mark said that he will meet me tomorrow.\n  <br>", "option3": "Mark said that he would meet me tomorrow.\n  <br>", "option4": "Mark said that he will meet me the next day.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given direct speech, the sentence is in the simple future tense (will meet). When converting it into indirect speech, we change \"will\" to \"would\" and \"tomorrow\" to \"the next day.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Choose the option that correctly changes the given indirect speech to direct speech.\n  <br>Ananya said, “My grandfather took tablets.”\n  <br>", "option1": "Ananya said that her grandfather has taken tablets.\n  <br>", "option2": "Ananya said that her grandfather was taking tablets.\n  <br>", "option3": "Ananya said that her grandfather had been taking tablets.\n  <br>", "option4": "Ananya said that her grandfather had taken tablets.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>The given sentence is ‘Indirect Speech’.\n  <br>Indirect Speech - Reporting the message of the speaker in our own words.\n  <br>Direct Speech - Reporting the message of the speaker in the exact words as spoken by\n  <br>him.\n  <br>Tense - Past simple (Subject+V2+Object) changes to Past perfect\n  <br>(Subject+had+V3+Object).\n  <br>The sentence thus formed is - Ananya said that her grandfather had taken tablets.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Choose the option that correctly changes the given direct speech to indirect speech.\n  <br>Varun said, “I visited my grandparents for the weekend.”\n  <br>", "option1": "Varun said that he had visited his grandparents for the weekend.\n  <br>", "option2": "Varun said that he had been visiting his grandparents for the weekend.\n  <br>", "option3": "Varun said that he has visited his grandparents for the weekend.\n  <br>", "option4": "Varun said that he might be visiting his grandparents for the weekend.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>Tense – simple past changes to past perfect tense.\n  <br>The sentence thus formed is - Varun said that he had visited his grandparents for the weekend.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Choose the option that correctly changes the given indirect speech to direct speech.\n  <br> She told me, “We aren't going to school.\"\n  <br>", "option1": "She told me that they aren't going to school.\n  <br>", "option2": "She told me that they may not be going to school.\n  <br>", "option3": "She told me that they weren't going to school.\n  <br>", "option4": "She told me that they will not be going to school.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Tense - Present continuous changes to Past continuous.\n  <br>The sentence thus formed is – She told me that they weren't going to school.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Choose the most appropriate meaning of the highlighted idiom.\n  <br>She decided to \n  <b>bite the bullet</b> and confront her fears.\n  <br>", "option1": "Avoid a difficult situation\n  <br>", "option2": "Face a difficult situation courageously\n  <br>", "option3": "Ignore the problem and hope it goes away\n  <br>", "option4": "Worry excessively about a situation\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"bite the bullet\" means to face a difficult or challenging situation with courage and determination, despite any fear or reluctance.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Choose the most appropriate meaning of the highlighted idiom.\n  <br>The secret plan was leaked to the press, and now \n  <b>the cat is out of the bag.</b> \n  <br>", "option1": "The situation has become more complicated\n  <br>", "option2": "The secret has been revealed\n  <br>", "option3": "The plan has been changed\n  <br>", "option4": "The press has made a mistake\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"the cat is out of the bag\" means that a secret or hidden piece of information has been unintentionally revealed or exposed, and it's now known to others.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Spot the error in the given sentence.\n  <br>Despite of the rain, they went ahead with the picnic.\n  <br>", "option1": "Despite\n  <br>", "option2": "of\n  <br>", "option3": "went ahead\n  <br>", "option4": "No error\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct preposition to use after \"despite\" is \"the\" or \"this,\" but not \"of.\" So, the correct sentence is \"Despite the rain, they went ahead with the picnic.\"\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Spot the error in the given sentence.\n  <br>If she would have studied harder, she could have passed the exam.\n  <br>", "option1": "If\n  <br>", "option2": "would have studied\n  <br>", "option3": "she could\n  <br>", "option4": "have passed\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct conditional structure for past unreal condition is \"if + past perfect, would/could/might + have + past participle.\" So, the correct sentence is \"If she had studied harder, she could have passed the exam.\"\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "Select the option that best improves the highlighted part of the sentence.\n  <br>She is very tired, but \n  <b>she is determine</b> to finish the race.\n  <br>", "option1": "she is determined\n  <br>", "option2": "she is determination\n  <br>", "option3": "she has determined\n  <br>", "option4": "No improvement\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\"Determined\" is the past participle of the verb \"determine,\" which should be used as an adjective to modify \"she.\" So, the correct sentence is \"She is very tired, but she is determined to finish the race.\"\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "Select the option that best improves the highlighted part of the sentence.\n  <br>Neither the students nor the teachers \n  <b>was aware</b> of the change in the schedule.\n  <br>", "option1": "were aware\n  <br>", "option2": "are aware\n  <br>", "option3": "have been aware\n  <br>", "option4": "No improvement\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The subject of the sentence is \"Neither the students nor the teacher,\" which is plural. Therefore, the verb should be plural as well. So, the correct sentence is \"Neither the students nor the teachers were aware of the change in the schedule.\"\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "Select the option to fill in blank no. 1.\n  <br>", "option1": "significant\n  <br>", "option2": "simple\n  <br>", "option3": "essential\n  <br>", "option4": "basic\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"significant\" means important, notable, or having an impact. In the given sentence, the word \"complex\" suggests that the missing word should be something that is important or significant. Therefore, the correct option is (a) significant.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "Select the option to fill in the blank no. 2.\n  <br>", "option1": "neurons\n  <br>", "option2": "muscles\n  <br>", "option3": "bones\n  <br>", "option4": "tissues\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"neurons\" means nerve cells that transmit signals throughout the body. The sentence describes the human brain and its complex nature, and it mentions the number of neurons in the brain. Therefore, the correct option is (a) neurons.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "Select the option to fill in the blank no. 3.\n  <br>", "option1": "senses\n  <br>", "option2": "movements\n  <br>", "option3": "memories\n  <br>", "option4": "reactions\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence describes the brain's functions, and it mentions controlling \"our thoughts, emotions, and\" which suggest that the missing word should also relate to the mind or brain function. \"Memories\" is the appropriate option to fill in the blank as it is an essential function of the brain. Therefore, the correct option is (c) memories.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "Select the option to fill in the blank no. 4.\n  <br>", "option1": "believed\n  <br>", "option2": "considering\n  <br>", "option3": "confirm\n  <br>", "option4": "indicating\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence describes a common misconception that people only use 10% of their brain's full capacity. The word \"believed\" suggests that it is a popular notion, and the missing word should complete this idea. Therefore, the correct option is (a) believed.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "What is one of the main benefits of meditation?\n  <br>", "option1": "Improved cognitive function\n  <br>", "option2": "Lower blood pressure\n  <br>", "option3": "Increased heart rate\n  <br>", "option4": "Reduced tension\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "According to the passage, one of the main benefits of meditation is stress reduction. When we meditate, we learn to let go of negative thoughts and feelings that can cause tension in our bodies and minds. Therefore, the correct option is (d) Reduced tension.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "How can meditation help with stress and anxiety?\n  <br>", "option1": "By making us more aware of our negative thoughts and feelings\n  <br>", "option2": "By suppressing our negative thoughts and feelings\n  <br>", "option3": "By distracting us from our negative thoughts and feelings\n  <br>", "option4": "By encouraging us to dwell on our negative thoughts and feelings\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that when we meditate, we focus on our breath and become more aware of our thoughts and emotions. This can help us to manage stress and anxiety more effectively, as we learn to let go of negative thoughts and feelings. Therefore, the correct option is (a) By making us more aware of our negative thoughts and feelings.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "What physical health benefits can meditation provide?\n  <br>", "option1": "Increased heart rate and blood pressure\n  <br>", "option2": "Reduced chronic pain and improved sleep quality\n  <br>", "option3": "Higher risk of addiction\n  <br>", "option4": "Reduced immune system function\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that meditation has been found to improve physical health by lowering blood pressure, reducing chronic pain, boosting the immune system, and improving sleep quality. Therefore, the correct option is (b) Reduced chronic pain and improved sleep quality.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "What is one type of meditation mentioned in the passage?\n  <br>", "option1": "Hypnotherapy\n  <br>", "option2": "Psychoanalysis\n  <br>", "option3": "Loving-kindness meditation\n  <br>", "option4": "Cognitive-behavioral therapy\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage mentions several types of meditation, including mindfulness, loving-kindness, and transcendental meditation. Therefore, the correct option is (c) Loving-kindness meditation.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "What is the overall effect of regular meditation practice?\n  <br>", "option1": "Increased stress and anxiety\n  <br>", "option2": "Improved cognitive function and concentration\n  <br>", "option3": "Reduced happiness and well-being\n  <br>", "option4": "Worsened mental health\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage explains that with regular practice, meditation can improve cognitive function and concentration, as well as increase feelings of happiness and well-being. Therefore, the correct option is (b) Improved cognitive function and concentration.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "What is one of the most significant challenges facing the global economy?\n  <br>", "option1": "Growing income inequality between developed and developing countries.\n  <br>", "option2": "The decline of emerging economies.\n  <br>", "option3": "The rapid growth of developed countries.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that one of the most significant challenges facing the global economy is the growing income inequality between developed and developing countries. The other options (b) and (c) are incorrect as they are not mentioned in the passage.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What is the impact of globalization on employment and wages?\n  <br>", "option1": "Increased job security for workers in developed countries.\n  <br>", "option2": "Decline in wages and job security for many workers, particularly in the manufacturing sector.\n  <br>", "option3": "A decline in employment opportunities in emerging economies.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that many workers in developed countries have seen their jobs outsourced to emerging economies, where labor is cheaper. This has led to a decline in wages and job security for many workers, particularly in the manufacturing sector. The other options (a), (c), and (d) are incorrect as they are not mentioned in the passage.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "What are some of the solutions to address the challenges facing the global economy?\n  <br>", "option1": "Greater investment in education and training programs.\n  <br>", "option2": "Increasing infrastructure spending.\n  <br>", "option3": "Promoting entrepreneurship.\n  <br>", "option4": "All of the above.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that to address the challenges facing the global economy, many experts are calling for greater investment in education and training programs, increasing infrastructure spending, promoting entrepreneurship, and investing in new technologies that can create new jobs and industries. Therefore, option (d) is correct, and the other options are incorrect.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "What role do interest rates play in the economy?\n  <br>", "option1": "They affect only borrowing and lending.\n  <br>", "option2": "They affect only investment and inflation.\n  <br>", "option3": "They affect borrowing, lending, investment, and inflation.\n  <br>", "option4": "None of the above.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that interest rates affect various aspects of the economy, such as borrowing, lending, investment, and inflation.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What is the impact of low interest rates on the economy?\n  <br>", "option1": "Increased borrowing and investment and decreased inflation.\n  <br>", "option2": "Decreased borrowing and investment and increased inflation.\n  <br>", "option3": "Increased borrowing and investment and increased inflation.\n  <br>", "option4": "Decreased borrowing and investment and decreased inflation.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that low interest rates make borrowing cheaper and encourage consumers and businesses to take out loans to finance purchases and investments, which can boost economic growth. Low interest rates can also lead to higher inflation as people have more money to spend.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "Who sets interest rates in the economy?\n  <br>", "option1": "Banks\n  <br>", "option2": "Consumers\n  <br>", "option3": "Central banks\n  <br>", "option4": "Investors\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states that central banks play a critical role in setting interest rates, and their decisions can have a significant impact on the economy. The Federal Reserve, for example, sets the federal funds rate, which is the interest rate that banks charge each other for overnight loans. By changing this rate, the Federal Reserve can influence the overall interest rates in the economy.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "Which of the following is/are important findings of Mohenjodaro?\n  <br>", "option1": "Steatite statue of a bearded man\n  <br>", "option2": "Bronze dancing girl\n  <br>", "option3": "Great bath\n  <br>", "option4": "All of the Above\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The important findings of Mohenjodaro include the steatite statue of a bearded man, the bronze dancing girl, and the Great Bath. Therefore, the correct answer is (d) All of the Above.\n  <br> \n  <b>Steatite statue of a bearded man:</b> This artifact, often referred to as the \"Priest-King,\" is a small soapstone statue of a bearded man. The figure is adorned with a patterned robe, and the careful detailing suggests the high craftsmanship of the Indus Valley Civilization.\n  <br> \n  <b>Bronze dancing girl:</b> This is a small, approximately 4-inch high, bronze statue of a girl in a dancing position. The statue, despite its size, is intricately detailed with a necklace and bangles covering her left arm, indicating the advanced metalworking capabilities of the civilization.\n  <br> \n  <b>Great Bath:</b> The Great Bath is a large, public water tank that was likely used for ritualistic purposes. It is one of the best-known structures among the ruins of Mohenjodaro. The bath, made from bricks and sealed with a tar-like substance, demonstrates the advanced engineering and urban planning skills of the civilization.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "Shivalik Hills are part of which of the following?\n  <br>", "option1": "Aravali\n  <br>", "option2": "Western Ghats\n  <br>", "option3": "Himalaya\n  <br>", "option4": "None of these\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Himalaya. The Sivalik Hills, also known as the Shiwalik Hills and Churia Hills, is a mountain range of the outer Himalayas that stretches over about 2,400 km (1,500 mi) from the Indus River eastwards close to the Brahmaputra River, spanning the northern parts of the Indian subcontinent.\n  <br>It is 10–50 km (6.2–31.1 mi) wide with an average elevation of 1,500–2,000 m (4,900–6,600 ft).\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "In which of the cases, a domiciliary visit by the Police without the authority of law, was held to be violative of Article 21 of the Indian Constitution assuming that a right of privacy was a fundamental right derived from the freedom of movement guaranteed by Article 19 (1) D of the Indian Constitution as well as personal liberty guaranteed by Article 21\n  <br>", "option1": "Dr. Sudesh Jale v. State of Haryana\n  <br>", "option2": "Kharak Singh v. State of U.P\n  <br>", "option3": "Govind v. State of M.P\n  <br>", "option4": "Neera Mathur v. L.I.C\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In Kharak Singh Vs. State of UP the court declared that domiciliary visit by the Police without the authority of law, was held to be violative of Article 21 of the Indian Constitution assuming that a right of privacy was a fundamental right derived from the freedom of movement guaranteed by Article 19 (1) D of the Indian Constitution as well as personal liberty guaranteed by Article 21. Hence, Option (b) is correct.\n  <br> In this case, the Supreme Court held that domiciliary visits at night by police officials constituted an unauthorized intrusion into a person's home and were a violation of the person's right to privacy, which is an integral part of the right to life and personal liberty enshrined in Article 21 of the Constitution.\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "Which of the following are the main features of the Fundamental Rights\n  <br>", "option1": "Enforceable by the courts\n  <br>", "option2": "Enshrined in the Constitution which guarantees them\n  <br>", "option3": "Both (a) & (b)\n  <br>", "option4": "None of the Above\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Both (a) & (b).\n  <br>Fundamental Rights are a key part of the Constitution of many countries, including India and the United States. They are:\n  <br> \n  <b>Enforceable by the courts:</b> If a person's fundamental rights are violated, they can approach the judiciary for enforcement or protection of these rights.\n  <br> \n  <b>Enshrined in the Constitution which guarantees them:</b> Fundamental rights are written and protected by the Constitution. This means they are guaranteed to the citizens by the highest law of the land, and the government cannot infringe upon these rights.\n  <br>So, both statements (a) and (b) are the main features of the Fundamental Rights.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "<p>The six rights guaranteed by Article 19 can be suspended only when an emergency is declared on the grounds of</p>", "option1": "<p>War or external aggression</p>", "option2": "<p>Armed rebellion</p>", "option3": "<p>Neither (a) nor (b)</p>", "option4": "<p>Both (a) &(b)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p>The six rights guaranteed by Article 19 can be suspended only when an emergency is declared on the grounds of war or external aggression I.e., External Emergency and not on the ground of armed rebellion I.e. Internal Emergency. Hence, Option (a) is correct.<br />\n The suspension of these rights can only be made by the President of India, and must be approved by Parliament. The suspension of these rights can only be for a limited period of time, and must be lifted as soon as the emergency is over.</p>", "question_heading": ""}, {"sr_no": 111, "question": "Which of the following is constituted under Article 280 of the Constitution of India?\n  <br>", "option1": "Advocate General\n  <br>", "option2": "Central Vigilance Commission\n  <br>", "option3": "Finance Commission\n  <br>", "option4": "National Commission for Women\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Under Article 280 of the Constitution of India, the Finance Commission is constituted. The Finance Commission is a quasi-judicial body responsible for making recommendations to the President of India on matters related to the distribution of tax revenue between the central government and the states, as well as among the states themselves.\n  <br>The Finance Commission is reconstituted every five years or at such earlier time as the President considers necessary.\n  <br>The First Commission was established in 1951 under The Finance Commission (Miscellaneous Provisions) Act, 1951. The 15th and most recent Finance Commission was constituted in 2017 and is chaired by N.K. Singh, a former member of the Planning Commission.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "In India, which of the following statements is true about the National Investment Fund?\n  <br>Statements:\n  <br>I. It was created in 2005.\n  <br>II. 75% of its annual income was to be used for schemes promoting health, education and employment.\n  <br>III. It was dissolved in 2018.\n  <br>", "option1": "Only statement I\n  <br>", "option2": "Only statement II\n  <br>", "option3": "Only statements I and III\n  <br>", "option4": "Only statements I and II\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The National Investment Fund (NIF) in India was established in 2005. The primary objective of the fund is to receive disinvestment proceeds from the sale of shares in public sector enterprises and invest the proceeds to generate returns. Thus, statement 1 is correct.\n  <br>Initially, 75% of the annual income from the NIF was to be used for financing schemes promoting health, education, and employment, while the remaining 25% was intended to be used for meeting the capital investment requirements of profitable and revivable public sector enterprises. However, in 2013, the government revised the NIF's policy, and now, the entire annual income of the NIF is utilized for financing selected social sector schemes, primarily those related to health, education, and employment. Thus, statement 2 is also correct.\n  <br>However, the third statement is incorrect. The National Investment Fund was not dissolved in 2018. Instead, the original guidelines for the NIF were revised in 2009 and again in 2013.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Bhimbetka, a noted site of the Palaeolithic period, is located in which state of India?\n  <br>", "option1": "Bihar\n  <br>", "option2": "Uttar Pradesh\n  <br>", "option3": "Rajasthan\n  <br>", "option4": "Madhya Pradesh\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Bhimbetka, a renowned archaeological site of the Palaeolithic period, is located in the Indian state of Madhya Pradesh. The Bhimbetka rock shelters, which house some of the oldest prehistoric cave paintings, were designated as a UNESCO World Heritage Site in 2003.\n  <br>The site contains the world's oldest stone walls and floors. Barkheda has been identified as the source of the raw materials used in some of the monoliths discovered at Bhimbetka.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Match List-I and List-II regarding the National Sports awards 2022.\n  <br>  \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694782442032image39.png\"> \n  <br>", "option1": "A-i, B-ii, C-iv, D-iii\n  <br>", "option2": "A-ii, B-i, C-iii, D-iv\n  <br>", "option3": "A-i, B-ii, C-iii, D-iv\n  <br>", "option4": "A-ii, B-i, C-iv, D-iii\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d), A-ii, B-i, C-iv, D-iii.\n  <br>The following are the recipients of the National Sports Awards 2022:\n  <br> Arjuna Award: Seema Punia (Athletics)\n  <br> Dronacharya Award Regular: Jiwanjot Singh Teja (Archery)\n  <br> Dronacharya Award Lifetime: Dinesh Jawahar Lad (Athletics)\n  <br> Dhyan Chand Award: Ashwini Akkunji (Athletics)\n  <br>  \n  <b>Arjuna Award -</b> This award is given for outstanding achievement in sports and games.\n  <br> \n  <b>Dronacharya Award (Regular Category) </b>- This award is given to coaches for their exceptional work in coaching and training sportspersons.\n  <br> \n  <b>Dronacharya Award (Lifetime Category) -</b> This award is given to coaches for their exceptional work in coaching and training sportspersons over an extended period.\n  <br> \n  <b>Dhyan Chand Award - </b>This award is given for lifetime achievements in sports and games, recognizing athletes who have contributed to the development of sports in India.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "The Act that is also known as ‘Morley-Minto Reforms’ is:\n  <br>", "option1": "Government of India Act, 1935\n  <br>", "option2": "Indian Councils Act, 1909\n  <br>", "option3": "Rowlatt Act, 1919\n  <br>", "option4": "Government of India Act, 1912\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Act known as 'Morley-Minto Reforms' is the Indian Councils Act of 1909. The reforms were named after John Morley, the Secretary of State for India, and Gilbert Elliot-Murray-Kynynmound, 4th Earl of Minto, who was the Viceroy of India at the time.\n  <br>The Morley-Minto Reforms aimed to provide more representation to Indians in the legislative councils and introduced separate electorates for Muslims, which allowed them to elect their own representatives.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Which among the following statements is not true when there is an increase in interest rate in an economy?\n  <br>", "option1": "increase in saving\n  <br>", "option2": "decrease in loan\n  <br>", "option3": "increase in production cost\n  <br>", "option4": "increase in capital return\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d). When interest rates increase, the cost of borrowing money goes up. This makes it more expensive for businesses to borrow money to invest in new projects or expand their operations. It also makes it more expensive for consumers to borrow money to buy homes or cars. As a result, businesses and consumers tend to borrow less money when interest rates are high.\n  <br> This decrease in borrowing can lead to a decrease in economic activity. Businesses may not be able to invest in new projects or expand their operations, and consumers may not be able to buy homes or cars. This can lead to a decrease in economic growth and employment. Therefore, the statement that is not true when there is an increase in interest rate in an economy is an \"increase in capital return\".\n  <br> \n  <b>Increase in saving:</b> When interest rates increase, saving money becomes more attractive because the return on savings is higher. So, this statement is true.\n  <br> \n  <b>Decrease in loans:</b> Higher interest rates make borrowing more expensive, so people and businesses are less likely to take out loans. So, this statement is also true.\n  <br> \n  <b>Increase in production cost:</b> If a business has borrowed money, an increase in interest rates increases the cost of that loan. This can lead to an increase in production costs, especially for businesses that rely heavily on borrowed money. So, this statement is true as well.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Match the following institutions with their headquarters:\n  <br>   \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694782442034image40.png\"> \n  <br> \n  <b>Select the correct answer from the code given below:</b> \n  <br> \n  <b> A B C D</b> \n  <br>", "option1": "1 2 3 4\n  <br>", "option2": "3 1 4 2\n  <br>", "option3": "2 3 4 1\n  <br>", "option4": "4 3 2 1\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) 3 1 4 2.\n  <br> \n  <b>WHO (World Health Organization):</b> Its headquarters are in Geneva, Switzerland.\n  <br> \n  <b>IMF (International Monetary Fund):</b> Its headquarters is in Washington D.C., USA.\n  <br> \n  <b>World Bank:</b> Its headquarters is also in Washington D.C., USA.\n  <br> \n  <b>UNESCO (United Nations Educational, Scientific and Cultural Organization):</b> Its headquarters is in Paris, France.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Which of the following statements is/are correct regarding the National Education Policy 2020?\n  <br>A. The policy aims to increase public investment in the education sector to reach 6% of GDP.\n  <br>B. The policy proposes the extension of the Right to Education Act 2009 to cover children of ages 3 to 18.\n  <br>C. A 5+3+3+4 curricular and pedagogical structure is proposed to replace the existing 10+2 structure.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A, B, and C.\n  <br>The National Education Policy 2020 aims to increase public investment in the education sector to reach 6% of GDP. It also proposes the extension of the Right to Education Act 2009 to cover children of ages 3 to 18. Additionally, the policy proposes a 5+3+3+4 curricular and pedagogical structure to replace the existing 10+2 structure.\n  <br>The National Education Policy 2020 is a comprehensive policy that aims to transform the education system in India.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "Which of the following statements is/are correct regarding the Goods and Services Tax (GST) in India?\n  <br>A. GST is a comprehensive indirect tax levied on the manufacture, sale, and consumption of goods and services at the national level.\n  <br>B. Alcohol for human consumption has been kept out of the purview of GST.\n  <br>C. GST is based on the principle of destination-based consumption taxation.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B, and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "GST is a comprehensive indirect tax levied on the manufacture, sale, and consumption of goods and services at the national level. - This statement is correct.\n  <br>Goods like petroleum products, alcoholic drinks, and electricity are not taxed under GST. This statement is also correct.\n  <br>GST is a destination-based tax, meaning it is charged at the point of consumption rather than the point of origin. So, the correct answer is (c) A, B, and C. All the statements are correct regarding the Goods and Services Tax (GST) in India.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Which of the following statements is/are correct regarding the President of India?\n  <br>A. The President of India is the head of state of the Republic of India.\n  <br>B. The President is also the commander-in-chief of the Indian Armed Forces.\n  <br>C. The President is elected by the members of the Parliament of India and the state legislatures.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A, B, and C. All the statements are correct regarding the President of India.\n  <br>The President of India is the head of state of the Republic of India. The President is also the commander-in-chief of the Indian Armed Forces. The President is elected by the members of the Parliament of India and the state legislatures.\n  <br> The President of India is a constitutional head, which means that the President's powers are limited by the Constitution of India. The President is not the head of the government, which is headed by the Prime Minister of India.\n  <br> The President of India is elected for a term of five years. The President can be re-elected for a second term.\n  <br> The President of India has a number of powers, including the power to appoint the Prime Minister of India, the power to dissolve the Lok Sabha, the power to declare a state of emergency, and the power to grant pardons.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Who proposed the Uncertainty Principle?\n  <br>", "option1": "Albert Einstein\n  <br>", "option2": "Niels Bohr\n  <br>", "option3": "Werner Heisenberg\n  <br>", "option4": "Erwin Schrödinger\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Uncertainty Principle was proposed by Werner Heisenberg.\n  <br>Werner Heisenberg was a German theoretical physicist who made significant contributions to quantum mechanics, nuclear physics, quantum field theory, and particle physics. He is most well-known for his Uncertainty Principle, a fundamental theory in quantum mechanics. This principle is a fundamental concept in quantum mechanics.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "The statement \"Energy can neither be created nor destroyed, but it can be transformed from one form to another\" corresponds to:\n  <br>", "option1": "First law of thermodynamics\n  <br>", "option2": "Second law of thermodynamics\n  <br>", "option3": "Law of conservation of momentum\n  <br>", "option4": "Newton's first law of motion\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The statement \"Energy can neither be created nor destroyed, but it can be transformed from one form to another\" corresponds to the First law of thermodynamics.\n  <br>The First Law of Thermodynamics, also known as the Law of Energy Conservation, states that energy cannot be created or destroyed in an isolated system. The total amount of energy and matter in the Universe remains constant, merely changing from one form to another.\n  <br>Top of Form\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Baghmara Pitcher Plant Sanctuary is located in which of the following states?\n  <br>", "option1": "Karnataka\n  <br>", "option2": "Assam\n  <br>", "option3": "Goa\n  <br>", "option4": "Meghalaya\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Baghmara Pitcher Plant Sanctuary is a sanctuary located in the South Garo Hills district of Meghalaya.\n  <br> It is named after a rare insectivorous Pitcher Plant, Nepenthes khasiana.\n  <br> Nepenthes khasiana is endemic to the Meghalaya region only.\n  <br> The Pitcher plant is locally known as \"Me'mang-Koksi\" (Ghost Basket).\n  <br> \n  <b>Note -</b> Baghmara Pitcher Plant Sanctuary is the only Sanctuary in Meghalaya where in-situ conservation of Pitcher Plant is being carried out.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "What is the budget allocated for National Green Hydrogen Mission to shift the low-carbon economy and reduce reliance on fossil fuels?\n  <br>", "option1": "Rs 15,700 crore\n  <br>", "option2": "Rs 16,700 crore\n  <br>", "option3": "Rs 17,700 crore\n  <br>", "option4": "Rs 19,700 crore\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The budget allocated for the National Green Hydrogen Mission to shift to a low-carbon economy and reduce reliance on fossil fuels is Rs 19,700 crore. So, the correct answer is Rs 19,700 crore.\n  <br>  \n  <b>National Green Hydrogen Mission:</b> \n  <br> The National Green Hydrogen Mission is a government initiative aimed at promoting the use of hydrogen as a clean and renewable energy source in the country.\n  <br>The mission has been allocated a budget of Rs 19,700 crore, which will be used to support research and development, build infrastructure, and provide incentives for the production and use of green hydrogen.\n  <br>It will help to reduce the country's reliance on fossil fuels, improve air quality, and create new jobs in the renewable energy sector.\n  <br>The mission was announced by Prime Minister Narendra Modi on August 15, 2022, on the occasion of India's 75th Independence Day.\n  <br>The mission is expected to be implemented over a period of five years. The government has set a target of producing 5 million metric tonnes (MMT) of green hydrogen by 2030.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Recently 13 people died of heat stroke in an event in Maharastra. Which part of the brain is responsible for controlling hyperthermia, also known as heat stroke/sunstroke?\n  <br>", "option1": "Cerebellum\n  <br>", "option2": "Medulla Oblongata\n  <br>", "option3": "Hypothalamus\n  <br>", "option4": "Occipital Lobe\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The hypothalamus is a small but vital part of the brain that helps regulate many of the body's internal functions, including body temperature.\n  <br> It acts as the body's thermostat, constantly monitoring and adjusting the temperature to maintain a stable core temperature.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "In April 2023, the 'Mircha' rice was awarded a Geographical Indication (GI) Tag. This variety of rice is associated with which district in Bihar?\n  <br>", "option1": "East Champaran\n  <br>", "option2": "West Champaran\n  <br>", "option3": "Bhagalpur\n  <br>", "option4": "Gaya\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Mircha rice variety from the West Champaran district of Bihar has recently been granted the GI tag.\n  <br> The grains of this rice are similar in size and shape to black pepper, which is why it is called Mircha or Marcha rice.\n  <br> The rice is also famous for its ability to produce aromatic chura (rice flakes).\n  <br> Some other items with GI tags from Bihar- Silao Khaja, Madhubani Paintings, Shahi Litchi of Bihar, Applique work of Bihar, Maghai Paan, Sikki Grass Product of Bihar, Katarni Rice, Bhagalpur Silk, Bhagalpur Zardalu, etc.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "In April 2023, which of the following state governments launched the 'CM di Yogshala' program to create a mass movement to carve out a healthy and prosperous state?\n  <br>", "option1": "Rajasthan\n  <br>", "option2": "Punjab\n  <br>", "option3": "Himachal Pradesh\n  <br>", "option4": "Kerala\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Chief Minister Bhagwant Mann along with Delhi CM Arvind Kejriwal launched the “CM di Yogshala” campaign.\n  <br> Residents will be provided with yoga and meditation facilities.\n  <br> Governor of Punjab - Banwarilal Purohit\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Who were the winners of the Pulitzer Prize 2023 in the fiction category?\n  <br>", "option1": "Barbara Kingsolver and Hernan Diaz\n  <br>", "option2": "Hua Hsu\n  <br>", "option3": "Sanaz Toossi\n  <br>", "option4": "Beverly Gage\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The winners of the Pulitzer Prize 2023 in the fiction category were Barbara Kingsolver for her novel 'Demon Copperhead' and Hernan Diaz for his novel 'Trust'.\n  <br> Sanaz Toossi won in the drama category.\n  <br> Beverly Gage won in the biography category.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "Who has been named the Sportsman of the Year at the 2023 Laureus World Sports Awards?\n  <br>", "option1": "Lionel Messi\n  <br>", "option2": "Ronaldo\n  <br>", "option3": "David Beckham\n  <br>", "option4": "Mbappe\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Lionel Messi, the renowned Argentine footballer, has been named the Sportsman of the Year at the 2023 Laureus World Sports Awards. This prestigious award recognizes Messi's exceptional achievements on the football field over the past year.\n  <br>One of Messi's notable accomplishments was leading the Argentina Men's Football Team to victory in the FIFA World Cup.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "What is SAKSHAM, recently launched by Rajesh Bhushan, the Union Health Secretary?\n  <br>", "option1": "A Learning Management Information System (LMIS)\n  <br>", "option2": "A healthcare management platform\n  <br>", "option3": "Medical research project\n  <br>", "option4": "A health awareness campaign\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "SAKSHAM, recently launched by Rajesh Bhushan, the Union Health Secretary, is an acronym for \"Stimulating Advanced Knowledge for Sustainable Health Management.\" It is a Learning Management Information System (LMIS) developed by the National Institute of Health & Family Welfare (NIHFW) in New Delhi.\n  <br> SAKSHAM serves as a dedicated and unified platform designed to provide online training and medical education to all health professionals across the country. It aims to enhance the knowledge, skills, and capabilities of healthcare professionals, ensuring their continuous professional development.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "SMTP, FTP and DNS are applications/protocols of the _____ layer.\n  <br>", "option1": "Data link\n  <br>", "option2": "Network\n  <br>", "option3": "Transport\n  <br>", "option4": "Application\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "SMTP, FTP and DNS are protocols of the Application layer. SMTP-Simple Mail Transfer Protocol, DNS-Domain Name System, FTP-File Transfer Protocol.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Two or more computers connected to each other for sharing information form a ________.\n  <br>", "option1": "Router\n  <br>", "option2": "Server\n  <br>", "option3": "Network\n  <br>", "option4": "Tunnel\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A network is interconnection of two or more computers.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "What is the sequence of events that occurs in the computer when it is interpreting and executing an instruction known as?\n  <br>", "option1": "Execution cycle\n  <br>", "option2": "Instruction cycle\n  <br>", "option3": "Working cycle\n  <br>", "option4": "Machine cycle\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "An instruction cycle is the basic operational process of a computer. It is the process by which a computer retrieves a program instruction from its memory, determines what actions the instruction dictates, and carries out those actions.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "What is the base or radix of the Hexadecimal number system?\n  <br>", "option1": "2\n  <br>", "option2": "8\n  <br>", "option3": "10\n  <br>", "option4": "16\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Base of hexadecimal number system is 16.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "Which of the following is a term for the process of trading goods over the Internet?\n  <br>", "option1": "e-selling-n-buying\n  <br>", "option2": "e-trading\n  <br>", "option3": "e-finance\n  <br>", "option4": "e-commerce\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Electronic commerce, commonly written as e-commerce or e-commerce, is the trading or facilitation of trading in products or services using computer networks, such as the Internet or online social networks.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "What does a Bug mean?\n  <br>", "option1": "Logical error in a program\n  <br>", "option2": "Syntax error in a program\n  <br>", "option3": "Run time error\n  <br>", "option4": "Both (a) and (b)\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In computer programming, a logic error is a bug in a program that causes it to operate incorrectly, but not to terminate abnormally (or crash). A logic error produces unintended or undesired output or other behavior, although it may not immediately be recognized as such.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "Codes consisting of varying widths and spacing of parallel lines, which may be optically read, is known as _____.\n  <br>", "option1": "mnemonic\n  <br>", "option2": "Bar code\n  <br>", "option3": "Decoder\n  <br>", "option4": "All of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A barcode is a machine-readable representation of data relating to the object to which it is attached.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "Which of the following is a server that saves Web pages that users have requested so that successive requests for these pages do not require the use of the Internet?\n  <br>", "option1": "dedicated server\n  <br>", "option2": "virtual server\n  <br>", "option3": "Off-Line Services\n  <br>", "option4": "cache server\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A cache server is a dedicated network server or s
