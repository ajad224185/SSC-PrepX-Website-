RD winner.\n  <br>", "question_heading": ""}, {"sr_no": 56, "question": "Who is sitting to the immediate right of R?\n  <br>", "option1": "Q\n  <br>", "option2": "M\n  <br>", "option3": "K\n  <br>", "option4": "N\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165266image86.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 57, "question": "Who is sitting opposite to M?\n  <br>", "option1": "Q\n  <br>", "option2": "P\n  <br>", "option3": "L\n  <br>", "option4": "K\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165273image87.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 58, "question": "A + B means ‘A is sister of B’\n  <br> A – B means ‘A is son of B’\n  <br> A × B means ‘A is husband of B’\n  <br> A ÷ B means ‘A is mother of B’\n  <br> If P + Q – R × S ÷ T×U then how is S related to U?\n  <br>", "option1": "Son\n  <br>", "option2": "Daughter\n  <br>", "option3": "Mother-in-law\n  <br>", "option4": "Son-in-law\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165288image88.png\"> \n  <br> \n  <br>", "question_heading": ""}, {"sr_no": 59, "question": "In a certain code language, ‘PAPER’ is written as 1805160116. How will ‘COFFEE’ be written as in that language?\n  <br>", "option1": "050506061503 \n  <br>", "option2": "060605051503\n  <br>", "option3": "050605061503 \n  <br>", "option4": "030506050615\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165297image89.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 60, "question": "If “+” denotes “×”, “–” denotes “÷”, “×” denotes “–” and “÷” denotes “+”, then find the value of –\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392164876image43.png\"> \n  <br>", "option1": "3\n  <br>", "option2": "4\n  <br>", "option3": "1\n  <br>", "option4": "2\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165309image90.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 61, "question": "<b>Select the most appropriate ANTONYM of the highlighted word.</b> \n  <br>Her \n  <b>magnanimous</b> gesture won many hearts at the charity event.\n  <br>", "option1": "Charitable\n  <br>", "option2": "Large-hearted\n  <br>", "option3": "Generous\n  <br>", "option4": "Petty\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d. \n  <br> \n  <b>Magnanimous</b>: generous or forgiving, particularly towards a rival or less powerful person.\n  <br> Synonyms: generous, benevolent, big-hearted, altruistic, gracious.\n  <br> Antonyms: \n  <b>petty</b>, selfish, mean, uncharitable, stingy.\n  <br>Meanings of all options:\n  <br> \n  <b>Charitable</b>: willing to help others and give money; generous.\n  <br> \n  <b>Large-hearted</b>: having a kind and generous nature.\n  <br> \n  <b>Generous</b>: showing a readiness to give more of something, especially money, than is strictly necessary or expected.\n  <br> \n  <b>Petty</b>: of little importance; trivial, or showing an excessive concern with unimportant matters, especially in a small-minded or spiteful way.\n  <br>In this case, the most appropriate antonym for 'magnanimous' would be 'petty' (option d), as it reflects a lack of generosity and kindness, the opposite of what 'magnanimous' means.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "<b>Select the option that can be used as a one-word substitute for the given group of words.</b> \n  <br>An unhealthy obsession with oneself\n  <br>", "option1": "Narcissism\n  <br>", "option2": "Egotism\n  <br>", "option3": "Perfectionism\n  <br>", "option4": "Pessimism\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The phrase 'an unhealthy obsession with oneself' is best represented by 'narcissism' (option a), as it denotes an excessive interest in oneself.\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Narcissism</b>: excessive or erotic interest in oneself and one's physical appearance.\n  <br> \n  <b>Egotism</b>: the practice of talking and thinking about oneself excessively because of an undue sense of self-importance.\n  <br> \n  <b>Perfectionism</b>: refusal to accept any standard short of perfection.\n  <br> \n  <b>Pessimism</b>: a tendency to see the worst aspect of things or believe that the worst will happen.\n  <br>The phrase 'an unhealthy obsession with oneself' is best represented by 'narcissism' (option a), as it denotes an excessive interest in oneself.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "<b>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. In its free state, it is the lightest metal and the least dense solid element.\n  <br>B. It floats on water, something no other metal can do.\n  <br>C. Lithium is a chemical element, symbol Li and atomic number 3.\n  <br>D. It is a soft, silvery-white alkali metal.\n  <br>", "option1": "ABCD\n  <br>", "option2": "CADB\n  <br>", "option3": "BCAD\n  <br>", "option4": "DCBA\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct logical order is given in option b.\n  <br> Sentence C introduces the subject of the paragraph, lithium, and provides its basic definition. Hence, it should come first.\n  <br> Sentence A adds further details to the basic definition provided in sentence C. It provides some specific characteristics of lithium, hence it comes next.\n  <br> Sentence D gives further details about the physical characteristics of lithium, which builds upon the prior information and keeps the flow intact.\n  <br> Sentence B concludes the paragraph by providing an exceptional and interesting fact about lithium, which effectively sums up the unique properties of the element.\n  <br> The order CADB provides a clear and coherent paragraph structure, introducing the subject and progressively detailing its characteristics.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "<b>Select the most appropriate option to fill in the blank.</b> \n  <br>She was unable to ________ the truth from the convoluted story.\n  <br>", "option1": "Extract\n  <br>", "option2": "Eject\n  <br>", "option3": "Exempt\n  <br>", "option4": "Extrude\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "the correct answer is option a.\n  <br> \n  <b>Extract</b>: This word means to remove or take out, especially by effort or force. In the context of the sentence, this is the correct answer, as it implies that she was trying to understand or figure out the truth from a complex or complicated story.\n  <br> \n  <b>Eject</b>: This term generally means to force or throw something out, typically in a violent or sudden way. It is less appropriate here because it does not fit well in the context of seeking understanding or information from a story.\n  <br> \n  <b>Exempt</b>: This word means to free from an obligation or liability imposed on others. It does not fit well in this context because it's not about freeing or releasing something, but rather about understanding or determining something.\n  <br> \n  <b>Extrude</b>: This means to shape (a material such as metal or plastic) by forcing it through a die. It's a term that's usually used in a manufacturing or industrial context, not for understanding or figuring out something from a story.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "<b>Select the most appropriate meaning of the highlighted idiom.</b> \n  <br>After months of hard work, John's promotion was just \n  <b>a drop in the bucket.</b> \n  <br>", "option1": "Highly valuable\n  <br>", "option2": "Insufficient or minor accomplishment\n  <br>", "option3": "A great achievement\n  <br>", "option4": "Wasted effort\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> \n  <b>Insufficient or minor accomplishment</b>: This is the correct interpretation of \"a drop in the bucket\". The phrase is used to refer to a very small or insignificant amount in comparison to what is needed or expected.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "<b>Select the correct homonym from the given options to fill in the blank.</b> \n  <br>The archaeologist will ________ new findings from the excavation site tomorrow.\n  <br>", "option1": "site\n  <br>", "option2": "sight\n  <br>", "option3": "cite\n  <br>", "option4": "cyte\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> \n  <b>Site</b>: This noun refers to a location or place where something is, was, or will be. In the sentence, however, a verb is needed, making \"site\" an incorrect choice.\n  <br> \n  <b>Sight</b>: As a noun, \"sight\" refers to the ability to see or something that is seen. As a verb, it can mean to see or to aim at. Neither usage fits the context of the sentence, which needs a verb meaning to mention or refer to.\n  <br> \n  <b>Cite</b>: This is the correct answer. \"Cite\" is a verb meaning to refer to as evidence or as an example, to mention, or to quote as a precedent or authority. The archaeologist is expected to refer to or mention new findings, making \"cite\" the appropriate choice.\n  <br> \n  <b>Cyte</b>: This term is a suffix in biology that means a cell. It does not fit the context of the sentence, which requires a verb.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given. From the options P, Q, R and S select the appropriate sentences for S2 and S3, respectively.</b> \n  <br>(S1) Everyone rushed to the shop to buy the new device as soon as it was launched.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) In a matter of hours, the shop was sold out.\n  <br> (P) The shop owner had anticipated such a rush and had stocked up well.\n  <br>(Q) The device was a major upgrade and was priced competitively.\n  <br>(R) However, the demand was unprecedented and far exceeded the supply.\n  <br>(S) Many were disappointed and had to wait for the next shipment.\n  <br>", "option1": "R, S\n  <br>", "option2": "P, R\n  <br>", "option3": "S, Q\n  <br>", "option4": "Q, P \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br> (S1) tells us that everyone was rushing to buy the new device. \n  <br> This would logically be followed by (Q) which provides a reason for the rush: the device was a major upgrade and was competitively priced.\n  <br> The next sentence should then lead to the situation described in (S4), where the shop sold out in a matter of hours. \n  <br> (P) provides this link, explaining that despite the shop owner anticipating a rush and stocking up, the demand was so high that the shop still sold out quickly.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "<b>The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don’t find any error, mark ‘No error’ as your answer.</b> \n  <br>She was very tired and went straight to slept.\n  <br>", "option1": "She was very\n  <br>", "option2": "straight to slept\n  <br>", "option3": "tired and went\n  <br>", "option4": "No error\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> The correct sentence should be \"She was very tired and went straight to sleep.\" \n  <br> Here, \"sleep\" is used as a noun. \n  <br> The preposition \"to\" is usually followed by a noun. \n  <br> Therefore, the verb \"slept\" is incorrect in this context. \n  <br> It should be replaced with the noun \"sleep\" to make the sentence grammatically correct.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "<b>Select the most appropriate option to fill in the blank.</b> \n  <br>The teacher asked the students to write the essay ________.\n  <br>", "option1": "neatly\n  <br>", "option2": "narrow\n  <br>", "option3": "near\n  <br>", "option4": "new\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> \n  <b>Neatly</b>: in a clean, tidy, or orderly way. For instance, 'to write neatly' means to write in a clean and organized manner.\n  <br> \n  <b>Narrow</b>: having a small width. This term typically refers to something physically narrow, like a street or a river, so it wouldn't fit in this context.\n  <br> \n  <b>Near</b>: at or to a short distance away; close to. It's usually used to indicate physical proximity or closeness in time, so it doesn't fit in this context either.\n  <br> \n  <b>New</b>: not existing before; made, introduced, or discovered recently or now for the first time. It refers to something that is fresh or recently made or introduced, but it's not appropriate in this context.\n  <br> The correct answer is (a) \"neatly\". The teacher asked the students to write the essay neatly, implying that the students should write in a tidy and legible manner.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "<b>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</b> \n  <br>John have been playing the piano since he was five years old.\n  <br>", "option1": "since he was\n  <br>", "option2": "playing the piano\n  <br>", "option3": "John have been \n  <br>", "option4": "five years old\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The error in this sentence lies in the segment (c) \"John have been\". \n  <br> The subject 'John' is a singular third person pronoun and therefore, it should be followed by 'has' instead of 'have'. \n  <br> The correct usage of present perfect continuous tense with 'he, she, it, or a singular noun' is: 'has been'. \n  <br> Therefore, the sentence should be corrected as \"John has been playing the piano since he was five years old.\"\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "<b>Select the INCORRECTLY spelt word.</b> \n  <br>", "option1": "Accommodate\n  <br>", "option2": "Committee\n  <br>", "option3": "Embarass\n  <br>", "option4": "Occurrence\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>The correct spelling is \"\n  <b>Embarrass</b>\". The verb \"embarrass\" is spelled with two 'r's and two 's's. The word \"embarrass\" means to make (someone) feel awkward, self-conscious, or ashamed. For example, \"His poor performance embarrassed the team.\" Other options:\n  <br> \"\n  <b>Accommodate</b>\" is spelled correctly and it means to provide sufficient space for or to make fit.\n  <br> \"\n  <b>Committee</b>\" is spelled correctly and it refers to a group of people appointed for a specific function, typically consisting of members of a larger group.\n  <br> \"\n  <b>Occurrence</b>\" is also spelled correctly and it refers to an incident or event.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "<b>Select the option that expresses the given sentence in reported speech.</b> \n  <br>Tom said to Jerry, “I am tired of running after you.”\n  <br>", "option1": "Tom told Jerry that he is tired of running after him.\n  <br>", "option2": "Tom told Jerry that he was tired of running after him.\n  <br>", "option3": "Tom told Jerry that he was tired of running after you.\n  <br>", "option4": "Tom said to Jerry that he was tired of running after him.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> The correct answer is (b) \"Tom told Jerry that he was tired of running after him.\" This is the correct conversion into reported speech (also known as indirect speech). \n  <br> When changing direct speech into reported speech, we typically backshift the tenses. Thus, \"am\" becomes \"was\". \n  <br> Also, the pronoun \"you\" changes according to the context, in this case, it becomes \"him\" referring to Jerry.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "<b>Select the option that expresses the given sentence in active voice.</b> \n  <br>The book was read by the child.\n  <br>", "option1": "The child reads the book.\n  <br>", "option2": "The child read the book.\n  <br>", "option3": "The child was reading the book.\n  <br>", "option4": "The child will read the book.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> The correct answer is (b) \"The child read the book.\" This is the correct conversion into active voice. In the active voice, the subject of the sentence performs the action. \n  <br> The original sentence is in the passive voice where the subject is the receiver of the action. \n  <br> The action \"read\" remains in the simple past tense, as it was in the original sentence.\n  <br> The rules for converting a sentence of simple past tense are as follows:\n  <br> Active voice- Subject + V2+ object. \n  <br> Passive voice- Object+ was/were + V3+ by + subject.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "<b>Select the option that expresses the given sentence in passive voice.</b> \n  <br>I should finish my work on time.\n  <br>", "option1": "My work should be finished on time.\n  <br>", "option2": "My work should have been finished on time.\n  <br>", "option3": "The work should be finished by me on time.\n  <br>", "option4": "On time, my work should be finished.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> The correct answer is (a) \"My work should be finished on time.\" This is the correct conversion into passive voice. \n  <br> In passive voice, the focus is on the action and not who is performing the action. \n  <br> In this case, the action is \"finishing the work\". \n  <br> In the original sentence \"I\" is the doer of the action and \"my work\" is the receiver of the action. \n  <br> But in the passive voice, \"my work\" becomes the subject of the sentence. \"Should finish\" changes to \"should be finished\" to maintain the modal verb and the tense.\n  <br> Active voice- Subject+modal verb+v1+ object.\n  <br> Passive voice- Object + modal verb + be +v3+ by+ subject. \n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "<b>Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select ‘No substitution required’.</b> \n  <br>She is \n  <b>as prettier as</b> her sister.\n  <br>", "option1": "so prettier than\n  <br>", "option2": "No substitution required\n  <br>", "option3": "as pretty as\n  <br>", "option4": "pretty as\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The phrase \"as ... as\" is used to compare two things that are equal in some way. \n  <br> The comparative form of an adjective (i.e., \"prettier\") is not used in this structure, so \"as prettier as\" is incorrect. \n  <br> Therefore, \"She is as pretty as her sister\" is the correct usage.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. The second comprises economists who argue that financial markets are too complex to be accurately modeled.\n  <br>B. In recent years, the financial world has been divided into two camps.\n  <br>C. The first consists of quantitative analysts who construct complex models to secure profitable trades.\n  <br>D. Both sides agree that the key to successful investing is risk management, but they differ on how to best achieve it.\n  <br>", "option1": "C, D, B, A\n  <br>", "option2": "B, C, A, D \n  <br>", "option3": "B, A, C, D\n  <br>", "option4": "D, B, C, A\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> Sentence B provides an overview of the scenario and sets up the context about the financial world being divided into two camps.\n  <br> Next, sentence C gives details about the first camp, the quantitative analysts who use complex models.\n  <br> Sentence A then provides details about the second camp, the economists who argue against the idea of accurately modeling financial markets.\n  <br> Finally, sentence D summarizes the common agreement between the two groups and highlights their disagreement on risk management approaches. Therefore, the correct order is BCAD.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Select the most appropriate ANTONYM of the highlighted word.</b> \n  <br>She was \n  <b>fervent</b> in her support for the cause.\n  <br>", "option1": "Apathetic\n  <br>", "option2": "Zealous\n  <br>", "option3": "Enthusiastic\n  <br>", "option4": "Passionate\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> The word \"\n  <b>fervent</b>\" means having or displaying a passionate intensity. So, the antonym or opposite would be \"apathetic\", which means showing or feeling no interest, enthusiasm, or concern.\n  <br> Synonyms: passionate, intense, zealous, ardent, and earnest.\n  <br> Antonyms: \n  <b>apathetic</b>, indifferent, dispassionate, cool, and unenthusiastic.\n  <br>Meanings of all four options:\n  <br> \n  <b>Apathetic</b> - showing or feeling no interest, enthusiasm, or concern.\n  <br> \n  <b>Zealous</b> - having or showing zeal, which means great energy or enthusiasm in pursuit of a cause or an objective.\n  <br> \n  <b>Enthusiastic</b> - showing intense and eager enjoyment, interest, or approval.\n  <br> \n  <b>Passionate</b> - showing or caused by strong feelings or a strong belief.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Select the most appropriate option to fill in the blank.</b> \n  <br>His rash decisions often put him in __________ situations.\n  <br>", "option1": "favourable\n  <br>", "option2": "advantageous\n  <br>", "option3": "precarious\n  <br>", "option4": "secure\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>The word \"\n  <b>precarious</b>\" means not securely held or in position; dangerously likely to fall or collapse. It fits best in the context of the sentence which talks about the outcomes of rash decisions.\n  <br>Meanings of all four options:\n  <br> \n  <b>Favourable</b> - advantageous or beneficial; positive.\n  <br> \n  <b>Advantageous</b> - providing a benefit or leading to a favorable outcome; beneficial.\n  <br> \n  <b>Precarious</b> - not securely held or in position; dangerously likely to fall or collapse.\n  <br> \n  <b>Secure</b> - fixed or fastened so as not to give way, become loose, or be lost.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A) This technology allows machines to learn from their experiences and make decisions like humans.\n  <br>B) The development of artificial intelligence (AI) has propelled more programming languages, more than ever, that are being used to develop AI applications.\n  <br>C) An emerging field in AI is Machine Learning.\n  <br>D) Languages such as Python and R have become increasingly popular for developing these applications.\n  <br>", "option1": "B, D, C, A\n  <br>", "option2": "A, B, C, D\n  <br>", "option3": "B, C, A, D\n  <br>", "option4": "D, B, A, C\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c. \n  <br> This paragraph starts with an introduction to the overall topic: the impact of the development of artificial intelligence on programming languages (B). \n  <br> This then logically flows into a discussion of a specific area of AI, Machine Learning (C), and how this technology works (A). \n  <br> Finally, the paragraph concludes by mentioning specific programming languages used in this field (D). \n  <br> Thus, the correct sequence of sentences should be B, C, A, D.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the option that expresses the given sentence in reported speech.</b> \n  <br>Ava said, “It’s really cold outside. I must get a cup of coffee.”\n  <br>", "option1": "Ava said that it was really cold outside and that she must get a cup of coffee.\n  <br>", "option2": "Ava said that it's really cold outside and she had to get a cup of coffee.\n  <br>", "option3": "Ava said that it was really cold outside and she had to get a cup of coffee.\n  <br>", "option4": "Ava exclaimed that it was really cold outside and she must get a cup of coffee.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c. \n  <br> When we convert direct speech into reported (or indirect) speech, the tense of the original speech often shifts back. \n  <br> Here, the original sentence is in the present tense (\"It's really cold outside. I must get a cup of coffee.\"). \n  <br> When we convert it into reported speech, the present tense changes to past tense (\"It was really cold outside\"), and the modal verb \"must\" changes to \"had to\". \n  <br> So, \"I must get a cup of coffee\" becomes \"she had to get a cup of coffee\". \n  <br> Options (a) and (b) are incorrect because they don't make these tense changes. \n  <br> Option (d) is incorrect because \"exclaimed\" would typically be used for sentences expressing surprise or strong emotion, which is not the case here.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "<b>Select the option that can be used as a one-word substitute for the given group of words.</b> \n  <br>A person who dislikes humankind and avoids human society.\n  <br>", "option1": "Anthropologist\n  <br>", "option2": "Misanthrope\n  <br>", "option3": "Nihilist\n  <br>", "option4": "Recluse\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> The word \n  <b>'Misanthrope'</b> refers to a person who dislikes humankind and avoids human society. \n  <br>Let's look at the other options:\n  <br> An \n  <b>Anthropologist</b> (option a) is someone who studies human societies and cultures and their development.\n  <br> A \n  <b>Nihilist</b> (option c) is a person who believes that life is meaningless and rejects all religious and moral principles.\n  <br> A \n  <b>Recluse</b> (option d) is a person who lives in voluntary seclusion from the public and society, but this doesn't necessarily mean they dislike humankind. \n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "<b>Identify the INCORRECTLY spelt word in the given sentence.</b> \n  <br>Her fastidious nature was apperent in the immaculate organization of her workspace.\n  <br>", "option1": "fastidious\n  <br>", "option2": "immaculate\n  <br>", "option3": "organization\n  <br>", "option4": "apperent\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d. \n  <br> The word 'apperent' is misspelled. The correct spelling is \n  <b>'apparent'</b>, which means clearly visible or understood; obvious. \n  <br>The rest of the words are all spelled correctly and their meanings are as follows:\n  <br> \n  <b>Fastidious</b> (very attentive to and concerned about accuracy and detail), \n  <br> \n  <b>Immaculate</b> (perfectly clean, neat, or tidy), \n  <br> \n  <b>Organization</b> (an organized body of people with a particular purpose, such as a business or government department).\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "<b>Replace the highlighted word with its synonym to make the sentence more meaningful.</b> \n  <br>The \n  <b>inexorable</b> march of technology is altering many aspects of our lives.\n  <br>", "option1": "flexible\n  <br>", "option2": "unyielding \n  <br>", "option3": "altering\n  <br>", "option4": "reluctant\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b. \n  <br> In the given sentence, the word \n  <b>'inexorable'</b> is used to describe the relentless and unstoppable nature of the march of technology. \n  <br> The word \n  <b>'inexorable'</b> means impossible to stop or prevent. \n  <br> Hence, the word 'unyielding', which also means not giving way to pressure; hard or solid, can be used as a synonym to replace 'inexorable'.\n  <br> Synonyms: Relentless, \n  <b>Unyielding</b>, Implacable, Unstoppable, Inflexible, Unbending, Intransigent, Steadfast, Obstinate, Uncompromising.\n  <br> Antonyms: Flexible, Yielding, Lenient, Accommodating, Merciful, Permissive, Indulgent, Pliable, Amenable, Forgiving.\n  <br>Now, let's consider the other options:\n  <br> \n  <b>Flexible</b> means capable of bending easily without breaking, which implies adaptability and changeability, contradicting the original meaning.\n  <br> \n  <b>Altering</b> is a verb that means change or cause to change in character or composition, typically in a comparatively small but significant way, and thus does not fit grammatically or contextually in place of 'inexorable'.\n  <br> \n  <b>Reluctant</b> means unwilling and hesitant; disinclined, which again changes the original meaning as it implies a resistance or hesitation that's not present with 'inexorable'.\n  <br>Hence, 'unyielding' is the best synonym for 'inexorable' in this context.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "<b>Select the appropriate idiom that can replace the underlined phrase in the following sentence.</b> \n  <br>Despite all the challenges, he \n  <b>never gave up</b> and finally achieved success.\n  <br>", "option1": "had a whale of a time\n  <br>", "option2": "kept his nose to the grindstone\n  <br>", "option3": "beat around the bush\n  <br>", "option4": "bit off more than he could chew\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b. \n  <br> The idiom \n  <b>'kept his nose to the grindstone'</b> means to work hard and continuously.\n  <br> \n  <b>'Had a whale of a time'</b> means to enjoy oneself very much, which doesn't fit the context of hard work and persistence.\n  <br> \n  <b>'Beat around the bush'</b> means to avoid getting to the point, which is not relevant in this context.\n  <br> \n  <b>'Bit off more than he could chew'</b> means to take on a task that is way too big or beyond one's ability, which contradicts the ultimate success mentioned in the sentence.\n  <br> So, the phrase 'kept his nose to the grindstone' is the most appropriate idiom to replace the highlighted phrase.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Giॅधn ृिधयथ ोनध ीयहन ुहंृिधक ौधnपधncधौ. Sिधधcप पुध यूपiयn पुोप giॅधौ पुधiन cयननधcप ियgicोि ौधतहधncध. A. Mोnद पiंधौ पुधौध cयnीिicपौ ोनध ोककनधौौधक पुनयहgु थोनीोनध, नधौिहपing in धnयनंयहौ ुोनं पय ूधयूिध ोnक पुध धnॅiनयnंधnप. B. Tुनयहgुयहप ुiौपयनद, cयnीिicपौ यॅधन नधौयहनcधौ ुोॅध ृधधn ो cधnपनोि पुधंध यी ुहंोn inपधनोcपiयnौ. C. On पुध यपुधन ुोnक, ौयciधपiधौ ुोॅध ोिसय िधोनnधक पय नधौियॅध नधौयहनcध कiौूहपधौ पुनयहgु nधgयपiोपiयn ोnक पुध कधॅिधयूंधnप यी ौुोनधक inौपiपहपiयnौ. D. Rधौयहनcधौ िiाध थोपधन, ंinधनोिस, ोnक ीधनपiिध िोnक ोनध धौौधnपiोि ीयन ुहंोn ौहनॅiॅोि ोnक ूनयौूधनiपद, ृहप पुधद ोनध nयप कiौपनiृहपधक धॅधnिद ोनयहnक पुध थयिनक.", "option1": "BDAC\n  <br>", "option2": "DBAC\n  <br>", "option3": "BCAD\n  <br>", "option4": "ADCB\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b. \n  <br> \n  <b>D.</b> Resources like water, minerals, and fertile land are essential for human survival and prosperity, but they are not distributed evenly around the world.\n  <br> \n  <b>B.</b> Throughout history, conflicts over resources have been a central theme of human interactions.\n  <br> \n  <b>A.</b> Many times these conflicts are addressed through warfare, resulting in enormous harm to people and the environment.\n  <br> \n  <b>C.</b> On the other hand, societies have also learned to resolve resource disputes through negotiation and the development of shared institutions.\n  <br> The paragraph begins with an introduction to the problem of resource distribution (D), followed by the historical conflicts that have arisen due to this uneven distribution (B). Then, the negative outcome of these conflicts is presented (A), followed by a more positive resolution (C).\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "<b>Select the most appropriate option to fill in the blank.</b> \n  <br>His speech was so ___________ that it captivated the audience and left them spellbound.\n  <br>", "option1": "Soporific\n  <br>", "option2": "Mundane\n  <br>", "option3": "Mesmerizing\n  <br>", "option4": "Pedestrian\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c. \n  <br> \n  <b>Soporific</b> means tending to induce drowsiness or sleep, which is not what we want in an engaging speech.\n  <br> \n  <b>Mundane</b> means lacking interest or excitement; dull, which also doesn't fit the context.\n  <br> \n  <b>Mesmerizing</b> means capturing one's complete attention as if by magic, which perfectly fits the context.\n  <br> \n  <b>Pedestrian</b> means lacking inspiration or excitement; dull, which is not suitable for a captivating speech.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. Some of these microbes are harmful and cause disease, while others are beneficial and necessary for our health.\n  <br>B. When we think of being invaded by organisms, we often think of infections.\n  <br>C. Yet every day each of us is host to billions of different organisms.\n  <br>D. This invisible world of life within us opens up new ways to understand the nature of health and disease.\n  <br>", "option1": "BCAD\n  <br>", "option2": "BACD\n  <br>", "option3": "DABC\n  <br>", "option4": "CDBA\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a. \n  <br> The sequence starts with statement B, introducing the general perception that being invaded by organisms usually makes us think of infections. \n  <br> This is expanded upon in statement C, which clarifies that each of us hosts billions of different organisms daily, thus setting a broader context.\n  <br> Statement A then goes further to distinguish between harmful and beneficial microbes, giving more depth to the topic. \n  <br> The paragraph concludes with statement D, which wraps up the discussion by highlighting the significance of this invisible world within us in understanding health and disease. \n  <br> This structure forms a logical progression from a general perception to a specific insight, making BCAD the best sequence for the paragraph.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "<b>Select the option that expresses the given sentence in active voice.</b> \n  <br>The news was spread by them across the whole town.\n  <br>", "option1": "They spread the news across the whole town.\n  <br>", "option2": "They were spreading the news across the whole town.\n  <br>", "option3": "They have spread the news across the whole town.\n  <br>", "option4": "They had spread the news across the whole town.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) They spread the news across the whole town.\n  <br> The given sentence is in passive voice. \n  <br> To convert it into active voice, we need to switch the positions of the subject and the object, and change the form of the verb accordingly. \n  <br> In this case, \"They\" is the subject, \"spread\" is the verb, and \"the news across the whole town\" is the object.\n  <br> Structure of sentence in simple past tense:\n  <br> Active voice: Subject + V2 + object.\n  <br> Passive voice: Object + auxiliary verb (was, were) + past participle + by + subject.\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "<b>Select the option that expresses the given sentence in indirect speech.</b> \n  <br>Mary said, \"I have never visited the Grand Canyon before.\"\n  <br>", "option1": "Mary said that she had never visited the Grand Canyon before.\n  <br>", "option2": "Mary said she never visited the Grand Canyon before.\n  <br>", "option3": "Mary said that she never visits the Grand Canyon before.\n  <br>", "option4": "Mary said that she hadn't visited the Grand Canyon before.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) Mary said she had never visited the Grand Canyon before.\n  <br> When transforming a sentence from direct to indirect speech, a present perfect tense in direct speech usually changes to past perfect in indirect speech. \n  <br> Hence \"have visited\" changes to \"had visited\". \n  <br> The other options do not correctly follow this rule of changing tenses when moving from direct to indirect speech. \n  <br> Also note that \"that\" is often used to introduce reported speech, but it can be omitted, particularly in informal speech or writing.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Select the option to fill in the blank no.1.</b> \n  <br>", "option1": "Option\n  <br>", "option2": "Right\n  <br>", "option3": "Possibility\n  <br>", "option4": "Permission\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (b) right.\n  <br> \n  <b>Option</b>: a thing that is or may be chosen.\n  <br> \n  <b>Right</b>: a moral or legal entitlement to have or do something.\n  <br> \n  <b>Possibility</b>: a thing that may happen or be the case.\n  <br> \n  <b>Permission</b>: consent; authorization.\n  <br>In this context, we are talking about the entitlements of the employees in essential services, so \"right\" is the correct choice.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "<b>Select the option to fill in the blank no.2.</b> \n  <br>", "option1": "Significance\n  <br>", "option2": "Importance\n  <br>", "option3": "Essentiality\n  <br>", "option4": "Indispensability\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (c) essentiality.\n  <br> \n  <b>Significance</b>: the quality of being worthy of attention; importance.\n  <br> \n  <b>Importance</b>: the state or fact of being of great significance or value.\n  <br> \n  <b>Essentiality</b>: the quality of being absolutely necessary; indispensability.\n  <br> \n  <b>Indispensability</b>: the state of being absolutely necessary.\n  <br>The context here refers to the necessity of certain services, making \"essentiality\" the most fitting choice.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Select the option to fill in the blank no.3.</b> \n  <br>", "option1": "Regulated\n  <br>", "option2": "Controlled\n  <br>", "option3": "Monitored\n  <br>", "option4": "Restrained\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (a) regulated.\n  <br> \n  <b>Regulated</b>: control or supervise (something, especially a company or business activity) by means of rules and regulations\n  <br> \n  <b>Controlled</b>: the power to influence or direct people's behavior or the course of events\n  <br> \n  <b>Monitored</b>: observe and check the progress or quality of (something) over a period of time; keep under systematic review\n  <br> \n  <b>Restrained</b>: kept under control; prevented from freedom of movement or action\n  <br>Here, \"regulated\" fits best as it denotes supervision through rules, which aligns with the context of setting rules for strikes in essential services.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>Select the option to fill in the blank no.4.</b> \n  <br>", "option1": "Argument-solving\n  <br>", "option2": "Conflict-management\n  <br>", "option3": "Dispute-resolution\n  <br>", "option4": "Issue-settling\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (c) dispute-resolution.\n  <br> \n  <b>Argument</b>-solving: process of finding a solution to a disagreement or argument\n  <br> \n  <b>Conflict-management</b>: the practice of being able to handle conflicts effectively\n  <br> \n  <b>Dispute-resolution</b>: the process of resolving disputes between parties\n  <br> \n  <b>Issue-settling</b>: the process of settling issues between parties\n  <br>In the context, we are talking about mechanisms for resolving disputes (or disagreements) where the right to strike is prohibited or strictly regulated. So \"dispute-resolution\" is the appropriate term.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>Consider the following statements based on the passage. Identify which of them are true.</b> \n  <br>1. Public policy education is a popular field of study among civil service officers in India.\n  <br>2. As per the data from the All-India Council for Technical Education, the number of institutions offering business management programmes far exceeds those offering public administration or public policy programmes.\n  <br>3. Most executive jobs in the organized sector require an understanding of business management rather than public management.\n  <br>", "option1": "Only 1 is true\n  <br>", "option2": "Only 2 is true\n  <br>", "option3": "Only 2 and 3 are true\n  <br>", "option4": "All are false\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Only 2 is true.\n  <br> Statement 1 is false. As per the passage, \"However, there is little interest in public policy education in India. Only a small percentage of policymakers — civil service officers — are exposed to the formal study of public policy and public administration.\"\n  <br> Statement 2 is true. According to the passage, \"As per data from the All-India Council for Technical Education, there are 3,182 institutions with an approved intake of 4.22 lakh in business management programmes, but only about 130 public, private and not-for-profit universities that offer public administration programmes and only 29 institutes that offer public policy programmes.\"\n  <br> Statement 3 is false. The passage states, \"Most executive jobs in the organized sector are in government or government-owned agencies and require an understanding of public management.\"\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "Wुicु यी पुध ीियियथing ौपोपधंधnपौ ोनध ोccहनोपध ोccयनकing पय पुध ूोौौोgध? 1. In पुध िोौप पुनधध दधोनौ, पुध Inकiोn gयॅधनnंधnप ुोौ ौूयnौयनधक 194 ciॅiि ौधनॅicध यीीicधनौ ीयन ीिहि-पiंध ूहृिic ूियicद cयहनौधौ in ीiॅध inौपiपहपiयnौ थiपुin पुध cयहnपनद. 2. Tुध ृोपcु ौप्रध यी ूहृिic ूियicद cयहनौधौ पदूicोििद नोngधौ ीनयं 20 पय 60 ौपहकधnपौ. 3. Tुधनध ोनध ोंूिध यूूयनपहniपiधौ in पुध ूनiॅोपध ौधcपयन ीयन inकiॅiकहोिस थiपु ो ूहृिic ंोnोgधंधnप धकहcोपiयn.", "option1": "Only 1 and 2 are true\n  <br>", "option2": "Only 2 is true\n  <br>", "option3": "Only 1 and 3 are true\n  <br>", "option4": "All are true\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) Only 1 and 2 are true.\n  <br> Statement 1 is true. The passage mentions, \"Within the country, there are five institutions in which 194 civil service officers have been sponsored by the government for full-time public policy courses in the last three years.\"\n  <br> Statement 2 is true. As per the passage, \"In general, the batch size of public policy courses is 20-60.\"\n  <br> Statement 3 is false. The passage says, \"The private sector offers limited opportunities in government advisory roles, consulting and Corporate Social Responsibility.\"\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>Based on the passage, consider the following statements. Choose the correct ones.</b> \n  <br>1. Between 2012 and 2021, nearly 200 civil service officers went abroad to study public management at the Master’s level.\n  <br>2. The author believes that a lack of training in public management is the reason for the perceived lag in efficiency and effectiveness of governance.\n  <br>3. The departmental induction training programme for civil servants equips them extensively with the knowledge to formulate effective public policies.\n  <br>", "option1": "Only 1 and 3 are true\n  <br>", "option2": "Only 2 is true\n  <br>", "option3": "All are true\n  <br>", "option4": "Only 1 and 2 are true \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) Only 1 and 2 are true.\n  <br> Statement 1 is true. The passage states, \"As per the data available of the capacity-building commissions in the 10 years between 2012 and 2021, 194 civil service officers (including 86 from the IAS) went abroad to study public management at the Master’s level.\"\n  <br> Statement 2 is true. As per the passage, \"This is largely due to lack of training in public management.\"\n  <br> Statement 3 is false. The passage mentions, \"Most of them undergo the departmental induction training programme which is focused on the role that they play in their department. They do not learn much about how to make good public policies.\"\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>Choose the accurate statements from the below options based on the passage.</b> \n  <br> 1. A formal education in public management is considered superfluous for most executive jobs in government or government-owned agencies.\n  <br>2. The private sector offers extensive opportunities in government advisory roles, consulting, and Corporate Social Responsibility for individuals with an education in public management.\n  <br>3. Universities are discouraged from offering more programmes in public management due to limited job opportunities in the field.\n  <br>", "option1": "Only 1 is true\n  <br>", "option2": "Only 3 is true\n  <br>", "option3": "Only 2 and 3 are true\n  <br>", "option4": "All are false\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Only 3 is true.\n  <br> Statement 1 is false. According to the passage, \"Most executive jobs in the organised sector are in government or government-owned agencies and require an understanding of public management.\"\n  <br> Statement 2 is false. As stated in the passage, \"The private sector offers limited opportunities in government advisory roles, consulting and Corporate Social Responsibility.\"\n  <br> Statement 3 is true. The passage explains, \"The reason why universities don’t have many programmes of public management is because there are few jobs available for people pursuing such courses.\"\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>Based on the passage, which of the following statements regarding GPT-4 is accurate?</b> \n  <br>1. GPT-4 has been proven to be capable of both text and image inputs simultaneously, enhancing its ability to interact with users.\n  <br>2. While GPT-4 performed exceptionally in subjects such as environmental science and statistics, it struggled with advanced English language and literature.\n  <br>3. GPT-4 is largely beneficial for white-collar jobs but has minimal impact on manufacturing and scientific occupations.\n  <br>4. Microsoft Research has noted glimpses of artificial general intelligence in GPT-4.\n  <br>", "option1": "Only 1, 2 and 3 are correct.\n  <br>", "option2": "Only 2, 3 and 4 are correct.\n  <br>", "option3": "Only 1, 3 and 4 are correct.\n  <br>", "option4": "All 1, 2, 3 and 4 are correct.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) All 1, 2, 3 and 4 are correct.\n  <br> Statement 1 is accurate as per the passage, \"Its biggest innovation is that it can accept text and image input simultaneously, and consider both while drafting a reply.\"\n  <br> Statement 2 is accurate as the passage says, \"However, GPT-4 failed to do well in advanced English language and literature, scoring 40% in both.\"\n  <br> Statement 3 is confirmed by the passage, \"OpenAI has released preliminary data to show that GPT-4 can do a lot of white-collar work, especially programming and writing jobs, while leaving manufacturing or scientific jobs relatively untouched.\"\n  <br> Statement 4 is also accurate, as per the passage, \"Microsoft Research (Microsoft has invested in OpenAI) mentioned observing “sparks” of artificial general intelligence — a system that excels at several task types and can comprehend and combine concepts such as writing code to create a painting or expressing a mathematical proof in the form of a Shakespearean play — in GPT-4.\"\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>Given the information in the passage, what could be a potential implication of GPT-4's advanced capabilities?</b> \n  <br>", "option1": "GPT-4 could replace human effort in sectors requiring language comprehension.\n  <br>", "option2": "GPT-4 might hinder learning among students by providing ready-made essays and assignments.\n  <br>", "option3": "GPT-4's impact could lead to changes in economies and public policy.\n  <br>", "option4": "All of the above.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (d)\n  <br> All the statements reflect potential implications of GPT-4's advanced capabilities as stated in the passage. \n  <br> Option (a) is mentioned in \"OpenAI has released preliminary data to show that GPT-4 can do a lot of white-collar work...\". \n  <br> Option (b) is inferred from \"ChatGPT-generated text infiltrated school essays and college assignments almost instantly after its release; its prowess now threatens examination systems as well.\". \n  <br> Option (c) is implied in \"Wider use of language models will have effects on economies and public policy.\"\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>Considering the passage, which of the following is NOT an accurate statement about GPT-4's potential impact on the job market?</b> \n  <br>", "option1": "GPT-4 might increase the demand for professionals in the manufacturing sector.\n  <br>", "option2": "GPT-4 can potentially undertake tasks related to programming and writing.\n  <br>", "option3": "GPT-4 may pose a threat to traditional examination systems.\n  <br>", "option4": "GPT-4's application could lead to a potential reshaping of white-collar job profiles.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (a)\n  <br>The passage does not mention or imply that GPT-4 might increase demand for professionals in the manufacturing sector. In fact, it is stated that GPT-4 has minimal impact on manufacturing jobs: \"while leaving manufacturing or scientific jobs relatively untouched.\"\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>Based on the passage, which aspects of the defined intelligence does GPT-4 still need to master?</b> \n  <br>", "option1": "Reasoning and thinking abstractly\n  <br>", "option2": "Planning and learning\n  <br>", "option3": "Comprehending complex ideas and learning quickly\n  <br>", "option4": "Solving problems and thinking abstractly\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (b)\n  <br>The passage mentions specifically that \"It [GPT-4] is yet to master planning and learning.\"\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>What is the Affordable Care Act (ACA) popularly known as?</b> \n  <br>", "option1": "Trumpcare\n  <br>", "option2": "Obamacare\n  <br>", "option3": "Medicate\n  <br>", "option4": "Healthcare Bill\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (b)\n  <br>The answer can be found in the first paragraph: \"Since then, the ACA, billed as “Obamacare”, has brought nearly 30 million uninsured Americans under the healthcare insurance umbrella.\"\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>What significant provision of the ACA was upheld by the Supreme Court in 2012?</b> \n  <br>", "option1": "The provision allowing the insurance coverage of pre-existing conditions.\n  <br>", "option2": "The provision to increase the coverage of Medicaid.\n  <br>", "option3": "The individual mandate, which levies a fee on those who fail to buy health insurance policies.\n  <br>", "option4": "The provision to increase funding for hospitals and clinics.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (c)\n  <br>The answer is mentioned in the first paragraph: \"It also survived challenges in court and notably its individual mandate, which requires tax authorities to levy a punitive fee on those who fail to buy health insurance policies, was upheld by the Supreme Court in 2012.\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>Which congressman insisted on including an anti-abortion-funding provision within the ACA Bill?</b> \n  <br>", "option1": "President Barack Obama\n  <br>", "option2": "President Donald Trump\n  <br>", "option3": "Republican Congressman Bart Stupak\n  <br>", "option4": "Democrat Congressman John Lewis\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (c)\n  <br>The answer can be found in the second paragraph: \"To me, and perhaps to some readers of the coverage that we provided of the ACA’s tortuous path through Congress, it was astounding that to get to the final lap and across the finish line, the White House had to ultimately yield to the demands of Republican Congressman Bart Stupak, a long-time opponent of abortion, who insisted on including the Hyde Amendment, an anti-abortion-funding provision within Medicaid, in the ACA Bill.\"\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "<b>What is a notable impact of the ACA on the system of insurance companies?</b> \n  <br>", "option1": "It enhanced their system of minimum patient support and maximum user out-of-pocket payments.\n  <br>", "option2": "It broke their system of minimum patient support and maximum user out-of-pocket payments.\n  <br>", "option3": "It allowed the insurance companies to deny coverage to people with pre-existing conditions.\n  <br>", "option4": "It gave more power to the insurance companies to decide on the pricing of health insurance policies.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (b)\n  <br>The answer is stated in the last paragraph: \"Overnight, it broke their system of minimum patient support and maximum user out-of-pocket payments.\"\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "   The warm and dry winds that blow down the steep valleys in Japan are called\n  <br>", "option1": "Zonda\n  <br>", "option2": "Yamo\n  <br>", "option3": "Tramontane\n  <br>", "option4": "Santa Ana\n  <br> \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>The warm and dry winds that blow down the steep valleys in Japan are called Yamo. So, the answer is (b).\n  <br>Zonda is a warm and dry wind that blows down the Andes Mountains in Argentina.\n  <br>Tramontane is a northeasterly or northerly winter wind that blows from the Alps and Apennines (South of the Alps) to the Italian coast. \n  <br>The Santa Ana winds (sometimes devil winds) are strong, extremely dry downslope winds that originate inland and affect coastal Southern California and northern Baja California. They originate from cool, dry high-pressure air masses in the Great Basin.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "    According to the Census 2011, which one among the following Union Territories has the least population?\n  <br>", "option1": "Daman and Diu\n  <br>", "option2": "Dadra and Nagar Haveli\n  <br>", "option3": "Lakshadweep\n  <br>", "option4": "Puducherry\n  <br> \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "According to the Census 2011, Lakshadweep has the least population among all the Union Territories in India. So, the answer is (c).\n  <br>Lakshadweep is the least populates union territory in India. It has population of just 64,473 which accounts the 0.01% of the total Indian population.\n  <br>In regards to Union Territories, Delhi is the most populous Union Territory in the country with a population of 16,753,235.\n  <br>Sikkim is the least populous and second smallest among the Indian states.\n  <br> \n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "On which one among the following islands does the Negrito tribe called the Onge live?\n  <br>", "option1": "North Andaman\n  <br>", "option2": "Little Andaman\n  <br>", "option3": "Little Nicobar\n  <br>", "option4": "Great Nicobar\n  <br> \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Onge tribe lives on the Little Andaman Island. So, the answer is (b).\n  <br>The Onge are an indigenous people of Little Andaman, one of the Andaman Islands in India.\n  <br>The Onge are a Negrito tribe, which means they are one of the oldest tribes in the world. They are hunter-gatherers and have lived on the Little Andaman Island for thousands of years.\n  <br> \n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "Which one of the following is not an objective of the MGNREGA?\n  <br>", "option1": "Providing up to 100 days of skilled labour in a financial year\n  <br>", "option2": "Creation of productive assets\n  <br>", "option3": "Enhancing livelihood security\n  <br>", "option4": "Ensuring empowerment to women\n  <br> \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) is a social security measure in India which aims to enhance livelihood security in rural areas by providing at least 100 days of guaranteed wage employment in a financial year to every household whose adult members volunteer to do unskilled manual work.\n  <br> \n  <b>The other objectives of MGNREGA are:</b> \n  <br> Creation of productive assets\n  <br> Reducing rural poverty\n  <br> Promoting social justice\n  <br> Ensuring empowerment of women\n  <br>So, the answer is (a). Providing up to 100 days of skilled labour in a financial year is not an objective of MGNREGA. The objective is to provide up to 100 days of unskilled labour.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "Consider the following statements with regard to Statutory Liquidity Ratio (SLR):\n  <br>1. To meet SLR, commercial banks can use cash only.\n  <br>2. SLR is maintained by the banks with themselves.\n  <br>3. SLR restricts the banks’ leverage in pumping more money into the economy.\n  <br>Which of the statements given above is/ are correct?\n  <br>", "option1": "1, 2 and 3     \n  <br>", "option2": "1 and 3\n  <br>", "option3": "2 and 3           \n  <br>", "option4": "2 Only\n  <br> \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Statutory liquidity ratio (SLR) is the Government term for the reserve requirement that commercial banks are required to maintain in the form of cash, gold reserves, Govt. bonds and other Reserve Bank of India (RBI)- approved securities before providing credit to the customers. So, \n  <b>Statement 1 is Incorrect.</b> \n  <br> \n  <b>Statement 2 is correct </b>because, SLR is maintained by the banks with themselves. This is correct because the SLR is a requirement that banks must meet, and they are responsible for maintaining the required level of liquid assets.\n  <br> \n  <b>Statement 3 is correct</b> because SLR restricts the banks’ leverage in pumping more money into the economy. This is also correct because the SLR reduces the amount of money that banks have available to lend, which restricts their ability to pump more money into the economy.\n  <br>Therefore, the correct answer is (c). Only statements 2 and 3 are correct.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "Which of the following towns was grown as a temple town during the Chola dynasty?\n  <br>", "option1": "Bhillasvamin\n  <br>", "option2": "Ajmer\n  <br>", "option3": "Ahmedabad\n  <br>", "option4": "Ahmednagar\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a). Bhillasvamin was a temple town during the Chola dynasty.\n  <br> Bhillasvamin towns was grown as a temple town during the chola dynasty.\n  <br> The Chola dynasty was a Tamil thalassocratic empire of Tamilakamof Southern India and one of the longest-ruling dynasties in world history. The earliest datable references to the Chola are from inscriptions dated to the 3rd century BCE during the reign of Ashoka of the Maurya Empire.\n  <br> The founder of the Chola Empire was Vijayalaya, who was the first feudatory of the Pallavas of Kanchi. He captured Tanjore in 850 A.D. He established a temple of the goddess Nishumbhasudini (Durga) there.\n  <br> Rajarajawas the most powerful Chola ruler. He ruled over large parts of South India and was popular beyond his times.\n  <br> Eventually, the Chola Dynasty was defeated by the neighboring Pandya Dynastyand the rule of the Cholas ended in 1279. The Chola rulers, like the other Tamil groups, were mostly practitioners of Hinduism. However, other religious groups such as Jainism, Islam, and Buddhism were also found in Tamil society.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Who founded the value of ‘G’?\n  <br>", "option1": "Henry Cavendish\n  <br>", "option2": "Michael Faraday\n  <br>", "option3": "Isaac Newton\n  <br>", "option4": "Marie Curie\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165485image91.png\">", "question_heading": ""}, {"sr_no": 113, "question": "What do you call the type of drugs that mimic the natural messenger by switching on the receptor?\n  <br>", "option1": "Antidepressants\n  <br>", "option2": "Depressants\n  <br>", "option3": "Agonist\n  <br>", "option4": "Antagonists\n  <br> \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165501image92.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Wुicु यी पुध ीियियथing ौपोपधंधnपौ ोनध cयननधcप नधgोनकing पुध ृधnधीiपौ यी पुध नधपiनधक Pनधौiकधnप यी Inकiो? A. Tुध ीयनंधन Pनधौiकधnप यी Inकiो थiिि ोिसय ृध धnपiिपधक पय ो ंयnपुिद ूधnौiयn यी ₹2.5 िोाु. B. Hध/Sुध iौ धnपiिपधक पय ो ौधcनधपोनiोि ौपोीी cयंूनiौing ो ूनiॅोपध ौधcनधपोनद, ो ूधनौयnोि ोौौiौपोnप, ोn ोककiपiयnोि ूनiॅोपध ौधcनधपोनद, पथय ूधयnौ, ोnक यीीicध धसूधnौधौ हू पय ₹1 िोाु ूधन ोnnहं. C. Hध/Sुध iौ ोिसय धnपiिपधक पय ीनधध ुigुधौप-cिोौौ पनोॅिध ोnदथुधनध in Inकiो, ोccयंूोniधक ृद यnध ूधनौयn, ृद नोiि, ोiन, यन ौपधोंधन.", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A and C only\n  <br>", "option4": "A, B and C\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>All of the given statements are true regarding the benefits given to retired Presidents of India:\n  <br> \n  <b>Pension to retiring Presidents – </b>There shall be paid to every person who ceases to\n  <br>hold office as President either by the expiration of his term of office or by resignation of\n  <br>his office:\n  <br>a pension of (at the rate of fifty per cent of the emoluments of the President per month) for the remainder of his life. They receive a monthly pension of ₹2.5 lakh; (As the Current President is getting a salary of 5 Lakh/month, some sources, Shows, 8 Lakh/month; In that case, he would get 4 Lakh/month.)\n  <br>Former Presidents are also entitled to a fully furnished bungalow in Lutyens’ Delhi for\n  <br>the rest of their life.\n  <br>He is entitled to a secretarial staff comprising a private secretary, a personal assistant,\n  <br>an additional private secretary, two peons, and office expenses up to Rs. 1 lakh per\n  <br>annum.\n  <br>As per The President’s Emoluments and Pension Act, 1951, the retired President of\n  <br>India is entitled to free medical attendance and treatment.\n  <br>He is also entitled to free highest-class travel anywhere in India, accompanied by one\n  <br>person, by rail, air, or steamer. So, all the statements are correct.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "The authority competent to suspend the operation of Fundamental Rights guaranteed under the Constitution of India is \n  <br>", "option1": "Attorney General of India\n  <br>", "option2": "Supreme Court \n  <br>", "option3": "President\n  <br>", "option4": "Parliament\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The authority competent to suspend the operation of Fundamental Rights guaranteed under the Constitution of India is the President. So, option (c) is correct. \n  <br> Article 359 empowers the president to suspend the right to enforce fundamental rights guaranteed by Part-Ill of the constitution during emergency. During national emergency, these rights can be suspended but not those conferred in articles 20 & 21. \n  <br> The Attorney General of India is the chief legal advisor to the Government of India. The Supreme Court is the highest court in India and is responsible for interpreting the Constitution. Parliament is the legislative body of India and is responsible for making laws.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "In which one of the following case the Supreme Court held that ‘the Indian Constitution is founded on the bedrock of the balance between the Fundamental Rights and the Directive Principles\n  <br>", "option1": "Keshavananda Bharti Case, 1973\n  <br>", "option2": "Golaknath Case, 1967\n  <br>", "option3": "Minerva Mills Case, 1980\n  <br>", "option4": "Champakam Dorairajan case, 1951\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b> </b>The Supreme Court held that 'the Indian Constitution is founded on the bedrock of the balance between the Fundamental Rights and the Directive Principles' in the Minerva Mills Case, 1980. So, the correct answer is (c) Minerva Mills Case, 1980.\n  <br>Fundamental Rights and the Directive Principles together constitute the core of commitment to social revolution.\n  <br> \n  <b>Note - </b>The Minerva Mills Case provided a new clause added to the basic structure doctrine concerning judicial review and harmonising Fundamental Rights and State Policy Directive Principles. This Case made two amendments unconstitutional and null, Including the 42nd Constitutional Amendment Act 1976.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Who renounced his knighthood after Jallianwala Bagh massacre?\n  <br>", "option1": "Sarojini Chattopadhyay Naidu \n  <br>", "option2": "Aurobindo Ghosh\n  <br>", "option3": "Rabindranath Tagore\n  <br>", "option4": "Sukryakant Tripathi\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>The correct answer is (c), Rabindranath Tagore.\n  <br>Rabindranath Tagore was an Indian polymath who reshaped Bengali literature and music, as well as Indian art with Contextual Modernism in the late 19th and early 20th centuries. He became Asia's first Nobel laureate in 1913 with his Gitanjali, a collection of poems.\n  <br>Tagore was awarded a knighthood in 1915 by the British government. However, he renounced the knighthood in 1919 in protest against the Jallianwala Bagh massacre, in which British Indian Army soldiers under the command of Brigadier-General Reginald Dyer fired on a crowd of unarmed Indian civilians in Amritsar, Punjab. The massacre killed at least 379 people and injured over 1,200 others.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Who formed the Satya Shodhak Samaj in 1873?\n  <br>", "option1": "Sadashiv Ballal Govande\n  <br>", "option2": "Baji Rao II\n  <br>", "option3": "Jyotiba Phule\n  <br>", "option4": "Fatima Sheikh\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Satya Shodhak Samaj was formed in 1873 by (c) Jyotiba Phule. \n  <br>The Satya Shodhak Samaj was founded in 1873 by Jyotirao Phule, a social reformer and thinker from Maharashtra, India. The society was founded to promote the rights of women, lower castes, and the poor. Phule was a strong advocate for education and social reform, and he worked tirelessly to improve the lives of the marginalized. \n  <br>The correct answer is (c).\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "Match the following units with their corresponding physical quantities:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392164877image44.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br> \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>The correct match between the units and their corresponding physical quantities is:\n  <br>A. Pascal - 4. Pressure\n  <br>B. Joule - 2. Energy\n  <br>C. Watt - 3. Power\n  <br>D. Newton - 1. Force\n  <br>So, the correct answer is (d) A-4, B-2, C-3, D-1.\n  <br> \n  <b>Brief explanation of each of the physical quantities:</b> \n  <br> \n  <b>Pressure</b> is the force per unit area. It is measured in pascals (Pa).\n  <br> \n  <b>Energy</b> is the ability to do work. It is measured in joules (J).\n  <br> \n  <b>Power</b> is the rate at which energy is transferred. It is measured in watts (W).\n  <br> \n  <b>Force</b> is the push or pull exerted on an object. It is measured in newtons (N).\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "What is the outermost layer found in the cell envelope of the bacterial cell called?\n  <br>", "option1": "Glycocalyx\n  <br>", "option2": "Cell membrane\n  <br>", "option3": "Plasma membrane\n  <br>", "option4": "Cytoplasm\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The outermost layer found in the cell envelope of the bacterial cell is called (a) Glycocalyx.\n  <br>The outermost layer found in the cell envelope of the bacterial cell is called the glycocalyx. The glycocalyx, also known as the pericellular matrix, surrounds the cell membranes of bacteria, epithelial cells, and other cells. \n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "In 1955, which synthetic element is provisionally named Mendelevium in honor of Dmitri Mendeleev, who created one of the first periodic tables?\n  <br>", "option1": "Element 90\n  <br>", "option2": "Element 101\n  <br>", "option3": "Element 103\n  <br>", "option4": "Element 106\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The synthetic element that was provisionally named Mendelevium in 1955 in honor of Dmitri Mendeleev, who created one of the first periodic tables, is (b) Element 101. \n  <br>In 1955, the synthetic element with the atomic number 101 was provisionally named Mendelevium in honor of Dmitri Mendeleev, who created one of the first periodic tables. Mendelevium was discovered by a team of American scientists led by Albert Ghiorso and Glenn T. Seaborg at the University of California, Berkeley. \n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "Which of the following statement is correct?\n  <br>I. The nutrition requirements of adolescents are higher than adults.\n  <br>II. Adolescents are generally grouped in the age group of 10 to 19 years.\n  <br>", "option1": "Only II\n  <br>", "option2": "Both I and II\n  <br>", "option3": "Neither I nor II\n  <br>", "option4": "Only I\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "I. The nutrition requirements of adolescents are higher than adults. During adolescence, rapid growth and development occur, which increases the demand for nutrients. Adolescents also have higher energy needs due to increased physical activity and metabolic rate. Therefore, a balanced and adequate diet is important during adolescence to meet the increased nutrient and energy requirements.\n  <br>II. Adolescents are generally grouped in the age group of 10 to 19 years. This period of life is characterized by significant physical, psychological, and social changes. It is a critical time for growth and development and is often associated with the onset of puberty. Thus, both statements are correct.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Which state government has recently begun caste surveys in different parts of the State?\n  <br>", "option1": "Jharkhand\n  <br>", "option2": "Bihar\n  <br>", "option3": "Uttar Pradesh\n  <br>", "option4": "Madhya Pradesh\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Caste surveys have been started by the Bihar government in several regions of the State.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165505image93.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "The Power Grid Corporation of India Limited was incorporated in __________?\n  <br>", "option1": "1973\n  <br>", "option2": "1959\n  <br>", "option3": "1974\n  <br>", "option4": "1989\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Power Grid Corporation of India Limited was incorporated in 1989.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165517image94.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "According to the latest Henley Passport Index, Japan has retained its position as the most favourable passport in the world, allowing visa-free entry to _________ global destinations. \n  <br>", "option1": "189\n  <br>", "option2": "190\n  <br>", "option3": "193\n  <br>", "option4": "192\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>According to the latest Henley Passport Index, Japan has retained its position as the most favorable passport in the world, allowing visa-free entry to 193 global destinations.\n  <br> \n  <b>Details:</b> \n  <br> Japan tops for the fifth consecutive year.\n  <br> Singapore and South Korea came in a joint second on the ranking, followed by Germany and Spain, and then a slew of other European nations.\n  <br> The Indian passport was ranked 85th, giving visa-free entry to 59 destinations worldwide.\n  <br> In 2019, 2020, 2021, and 2022, the country ranked at 82nd spot, 84th, 85th, and 83rd respectively.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "The 53rd edition of the World Economic Forum (WEF) was held in ______________.\n  <br>", "option1": "London, UK\n  <br>", "option2": "Paris, France\n  <br>", "option3": "Davos, Switzerland\n  <br>", "option4": "New Delhi\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The 53rd edition of the World Economic Forum (WEF) was held in Davos, Switzerland.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1690392165523image95.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Which country’s scientists have recently discovered the first instance of solo electromagnetic waves on Mars?\n  <br>", "option1": "America\n  <br>", "option2": "India\n  <br>", "option3": "Japan\n  <br>", "option4": "Russia\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The first instance of solo electromagnetic waves has been discovered by Indian researchers.\n  <br> \n  <b>Details:</b> \n  <br> The results were established using information from the Mars Atmosphere and Volatile Evolution (MAVEN) mission of the National Aeronautics and Space Administration.\n  <br> Scientists have detected the lone waves in the Martian magnetosphere using high-resolution electric field data from MAVEN’s captured by Langmuir Probe and Waves sensors.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "The Union Cabinet approved an initial outlay of Rs. 19,744 crores for the National Green Hydrogen Mission. The National Green Hydrogen Mission was launched in ____________?\n  <br>", "option1": "2018\n  <br>", "option2": "2019\n  <br>", "option3": "2020\n  <br>", "option4": "2021\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The National Green Hydrogen Mission was launched in 2021.\n  <br> \n  <b>Details:</b> \n  <br> The Union Cabinet approved an initial outlay of Rs 19,744 crore for the National Green Hydrogen Mission.\n  <br> Addressing the nation on its 75th Independence Day in 2021, Prime Minister Narendra Modi launched a national mission for green fuels in line with the Centre’s stated target of making India energy-independent before completing 100 years of Independence.\n  <br> The mission will have four components that aim at enhancing domestic production of green hydrogen and promote the manufacturing of electrolysers — a key constituent for making green hydrogen.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "Who is the author of the book \"RINGSIDE – Up, Close and Personal on India and Beyond\"?\n  <br>", "optio
