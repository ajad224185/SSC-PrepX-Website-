p>", "option3": "\r\n<p>Incredulous</p>", "option4": "\r\n<p>Synergizm</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Incredulous &#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the options:\r\n\t<ul>\r\n\t\t<li><strong>Recaptulate</strong>:  There is no such word in the dictionary, the correct spelling is  &#39;<strong>recapitulate</strong>&#39;  which means <strong>summarize and state again the main points.</strong></li>\r\n\t\t<li><strong>Lifelesness</strong>:  There is no such word in the dictionary, the correct spelling is  &#39;lifelessness &#39;  which means<strong>having no life.</strong></li>\r\n\t\t<li><strong>Incredulous</strong>: It is a correctly spelt word which means<strong>(</strong><strong>of a person or their manner) unwilling or unable to believe something.</strong></li>\r\n\t\t<li><strong>Synergizm</strong>:  There is no such word in the dictionary, the correct spelling is <strong>&#39;synergism&#39; </strong>which means the interaction or cooperation of two or more organizations, substances, or other agents to produce a combined effect greater than the sum of their separate effects.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 3,  i.e. it is the correctly spelt word.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Why did coffeehouses become extremely popular in 17th - 18th century England?</p>", "option1": "\r\n<p>Coffee was a newly arrived drink in England.</p>", "option2": "\r\n<p>People could debate on politics, literature, science etc.</p>", "option3": "\r\n<p>Coffee was extremely palatable and tasty.</p>", "option4": "\r\n<p>The caffeine and the atmosphere in the coffeehouse provided a special excitement.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>The caffeine and the atmosphere in the coffeehouse provided a special excitement.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following line of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>Whilst the taste of 17th-century coffee was not very palatable - indeed, it tasted quite disgusting according to accounts of the time <strong>but the caffeine in it and the &lsquo;buzz&rsquo; it provided, proved quite addictive</strong>.</em>&quot;</li>\r\n\t\t<li>&quot;<em>The new coffeehouses <strong>became fashionable places</strong> for the chattering classes to meet, conduct business, gossip, exchange ideas, and debate the news of the day.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that the caffeine present in coffee proved to be addictive for the people who drank it.</li>\r\n\t<li>From the second sentence, it is clear that coffeehouses provided a special excitement to the people.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 4)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>Which of the following statements is NOT true according to the passage?</p>", "option1": "\r\n<p>Coffee arrived in Europe from Turkey.</p>", "option2": "\r\n<p>In 1675, Charles II tried to ban the coffeehouses, but had to withdraw his order.</p>", "option3": "\r\n<p>In the English coffeehouses alcohol was also served.</p>", "option4": "\r\n<p>Women were not allowed in English coffeehouses.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>In the English coffeehouses alcohol was also served.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following line of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>The new coffeehouses became fashionable places for the chattering classes to meet, conduct business, gossip, exchange ideas, and debate the news of the day. <strong>Unlike public houses, no alcohol was served </strong>and women were excluded.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that alcohol was not served in the coffeehouses like the other public places.</li>\r\n\t<li>Hence, the sentence given in <strong>option 3</strong> is incorrect.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 3)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n\r\n<p>The main theme of the passage is:</p>", "option1": "\r\n\r\n<p>advent of equality and republicanism in England</p>", "option2": "\r\n\r\n<p>history of coffeehouses in Europe</p>", "option3": "\r\n\r\n<p>17th and 18th century English coffeehouses</p>", "option4": "\r\n\r\n<p>Penny Universities in England</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>17th  and 18th  century English coffeehouses</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the starting lines of the first paragraph of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em><strong>In 17th  and 18th</strong><strong> century England</strong>, <strong>coffeehouses were popular places for people</strong> from all walks of life to go and meet, chat, gossip and have fun, whilst enjoying the latest fashion, <strong>a drink newly arrived in Europe from Turkey - coffee.</strong></em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, from the first sentence of the passage itself, it is clear that the passage is about the English coffeehouses during the 17th and 18th centuries.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 3)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n\r\n<p>The English coffeehouses became associated with equality and republicanism basically because:</p>", "option1": "\r\n\r\n<p>anybody from any social class could go and sit there.</p>", "option2": "\r\n\r\n<p>reasoned and sober debate on politics took place there.</p>", "option3": "\r\n\r\n<p>Influential patrons like Samuel Pepys, John Dryden, Alexander Pope and Isaac Newton frequented them.</p>", "option4": "पुधद थधनध ोिसय ुोहnपधक ृद cनiंinोिस, ौcयहnकनिधस ोnक ूiंूौ.", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>anybody from any social class could go and sit there.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em><strong>Anyone of any social class</strong> could frequent the coffeehouses, and so they <strong>became associated with equality and republicanism</strong>. So much so that in 1675 an attempt to ban them was made by Charles II, which caused such a public outcry that it was withdrawn.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, it can be inferred that there was no discrimination over the social class of anyone to visit the coffeehouses.</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is option 1)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p>The first coffeehouse in London was started by:</p>", "option1": "\r\n<p>John Dryden</p>", "option2": "\r\n<p>PasquaRose&eacute;</p>", "option3": "\r\n<p>Samuel Pepys</p>", "option4": "\r\n<p>Alexander Pope</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>PasquaRose&eacute;</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>The first coffeehouse in England was opened in Oxford in 1652. <strong>In London</strong>, the first one was opened later that same year in at St Michael&rsquo;s Alley, Cornhill, <strong>by an eccentric Greek named PasquaRose&eacute;</strong>.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, it can be inferred that the first coffeehouse in London was started by <strong>PasquaRose&eacute;</strong><em>.</em></li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is option 2)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>Homi&rsquo;s parents took him to doctors because</p>", "option1": "\r\n<p>he was frequently falling ill</p>", "option2": "\r\n<p>he did not sleep as much as other children of his age</p>", "option3": "\r\n<p>he always remained tensed up</p>", "option4": "\r\n<p>he had a super active brain</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;he did not sleep as much as other children of his age&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: &quot;In his childhood, Homi bubbled with immense energy, <strong>slept much less than children of his age. </strong>His mother Meheran and his father Jehangir Bhabha took him to many doctors. They subjected him to several tests. They found nothing wrong. He was a perfectly healthy child. <strong>Why did he spend lesser time in sleep? </strong>It took them some time to understand the cause. Homi had a super active brain&quot;.</li>\r\n\t<li>From these lines, we can infer that Homi used to sleep much less than children of his and that&#39;s why his parents took him to doctors.</li>\r\n\t<li>Thus, the correct answer is  <strong>&#39;he did not sleep as much as other children of his age&#39;.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (2).</strong></p>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>As a child, Homi was</p>", "option1": "\r\n<p>lazy</p>", "option2": "\r\n<p>unhealthy</p>", "option3": "\r\n<p>overactive for his age</p>", "option4": "\r\n<p>difficult to handle</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;overactive for his age&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: <strong>&quot;In his childhood, Homi bubbled with immense energy, slept much less than children of his age&quot;.</strong></li>\r\n\t<li>From this line, we can infer that as a child, Homi was filled with immense energy and used to sleep much less than children of his age.</li>\r\n\t<li>Thus, according to the passage, <strong>As a child, Homi was overactive for his age.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct aswer is <strong>option (3).</strong></p>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>Homi&rsquo;s parents helped him by</p>", "option1": "\r\n<p>taking him to Einstein</p>", "option2": "\r\n<p>teaching him high moral values</p>", "option3": "\r\n<p>seeking medical help for him</p>", "option4": "\r\n<p>buying him books on a wide range of subjects</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;buying him books on a wide range of subjects&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: &quot; <strong>They could not guess what the future held for Homi. But they could shape his destiny by helping him develop his native talent. They decided to do that. They stacked the bookshelves at home with the best of books on a wide range of subjects </strong>&quot;.</li>\r\n\t<li>From these lines, we can infer that Homi&#39;s parents helped Homi by buying him the best of books on a wide range of subjects.</li>\r\n\t<li>Thus, the correct answer is <strong>&#39;buying him books on a wide range of subjects&#39;.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (4).</strong></p>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>A person with a never - say - die spirit</p>", "option1": "\r\n<p>never talks about death</p>", "option2": "\r\n<p>is not afraid of death</p>", "option3": "\r\n<p>does not accept defeat</p>", "option4": "\r\n<p>believes that the spirit never dies</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;does not accept defeat&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: <strong>&quot;Success, Einstein had linked with hard work, total commitment to the job and a never-say-die spirit. That formula appealed to Homi&quot;.</strong></li>\r\n\t<li>From this line, we can infer that Einstein and Homi had a never-say-die spirit, which means that they never gave up or get discouraged, no matter what.</li>\r\n\t<li>Thus, it can be concluded that <strong>a never-say-die spirit means you don&#39;t accept defeat or get discouraged, no matter what.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (3).</strong></p>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n\r\n<p>______memory is sometimes used to increase the speed of processing by making current programs and data available to the CPU at a rapid rate.</p>", "option1": "\r\n\r\n<p>Backup</p>", "option2": "\r\n\r\n<p>Auxiliary</p>", "option3": "\r\n\r\n<p>Main</p>", "option4": "\r\n\r\n<p>Cache</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><u>Cache Memory</u>:</p>\r\n\r\n<ul>\r\n\t<li>It is an extremely fast memory type that acts as a buffer between RAM and the CPU.</li>\r\n\t<li>It holds frequently requested data and instructions so that they are immediately available to the CPU when needed.</li>\r\n\t<li>It is a memory unit placed between the CPU and main memory M and is used to store instructions, data, or both.</li>\r\n\t<li>It is used to reduce the average time to access data from the Main memory.</li>\r\n\t<li>Cache memory is sometimes used to increase the speed of processing by making current programs and data available to the CPU at a rapid rate. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>Each cell in the worksheet of MS-Excel 365 is identified by a cell _______.</p>", "option1": "\r\n<p>color</p>", "option2": "\r\n<p>size</p>", "option3": "\r\n<p>rounding</p>", "option4": "\r\n<p>reference</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Each cell in the worksheet of MS-Excel 365 is identified by a cell reference.</strong></p>\r\n\r\n<ul>\r\n\t<li>Cell reference is a unique identifier for each cell in a worksheet, consisting of a column letter followed by a row number.</li>\r\n\t<li>For example, the reference for the cell in the first column and the first row is A1.</li>\r\n\t<li>Cell references are used in Excel formulas and functions to calculate and manipulate data in the worksheet.</li>\r\n\t<li>They can also be used to create links between cells in different worksheets or workbooks, allowing users to reference data across multiple sheets or files.</li>\r\n\t<li>Color: Color is a visual property that can be applied to cells in MS-Excel 365. Users can change the background color or font color of a cell to make it stand out or to make it easier to read. This can be done through the &quot;Fill Color&quot; or &quot;Font Color&quot; options in the &quot;Home&quot; tab of the Excel ribbon.</li>\r\n\t<li>Size: Size refers to the dimensions of a cell in MS-Excel 365. Users can adjust the width and height of a cell to make it larger or smaller, depending on their needs. This can be done by dragging the column or row headers to the desired size or by using the &quot;Format Cells&quot; dialog box in the &quot;Home&quot; tab of the Excel ribbon.</li>\r\n\t<li>Rounding: Rounding is a mathematical function that can be applied to numbers in MS-Excel 365. Users can round numbers to a specified number of decimal places or to the nearest whole number, depending on their needs. This can be done through the &quot;Number&quot; format options in the &quot;Home&quot; tab of the Excel ribbon.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>_______ is a type of dedicated file storage device that provides local-area network (LAN) users with centralized, consolidated disk storage through a standard Ethernet connection.</p>", "option1": "\r\n<p>Solid-State Drive (SSD)</p>", "option2": "\r\n<p>USB Hard Drives</p>", "option3": "\r\n<p>USB Sticks</p>", "option4": "\r\n<p>Network Attached Storage (NAS)</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct answer is option 4) Network Attached Storage (NAS). </strong></p>\r\n\r\n<ul>\r\n\t<li>NAS is a type of dedicated file storage device that provides local-area network (LAN) users with centralized, consolidated disk storage through a standard Ethernet connection.</li>\r\n\t<li>It is designed to be easy to use, and it offers a cost-effective way to store and share files across a network.</li>\r\n\t<li>Unlike solid-state drives (SSDs), USB hard drives, and USB sticks, which are typically used for portable storage, NAS is a network-based storage solution that can be accessed by multiple users simultaneously.</li>\r\n\t<li>Solid-State Drive (SSD): SSDs are storage devices that use solid-state flash memory to store data. They are faster, more reliable, and more energy-efficient than traditional hard disk drives (HDDs), and they are often used as the primary storage device in desktop and laptop computers. SSDs come in various form factors, including the standard 2.5-inch drive size for desktop and laptop computers, and the smaller M.2 form factor used in ultrabooks and tablets.</li>\r\n\t<li>USB Hard Drives: USB hard drives are portable storage devices that use a USB interface to connect to a computer or other device. They typically have a larger storage capacity than USB sticks and are often used to store large files, such as videos and photos. USB hard drives come in various sizes and form factors, ranging from small, pocket-sized drives to larger, desktop-sized drives.</li>\r\n\t<li>USB Sticks: USB sticks, also known as USB flash drives or thumb drives, are small, portable storage devices that use a USB interface to connect to a computer or other device. They are typically used to store and transfer small files, such as documents, photos, and music. USB sticks come in various sizes and capacities, ranging from a few megabytes to several gigabytes</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n\r\n<p>Which type of data are called short text in MS Access?</p>", "option1": "\r\n\r\n<p>Up to 255 characters</p>", "option2": "\r\n\r\n<p>Up to 63,999 characters</p>", "option3": "\r\n\r\n<p>Up to 150 characters</p>", "option4": "\r\n\r\n<p>From 255 to 63,999 characters</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong><u>up to 255 characters</u>.</strong></p>\r\n\r\n<ul>\r\n\t<li>Access 2013 by Microsoft is a part of the <strong>Microsoft Office suite</strong>.</li>\r\n\t<li>It is a <strong>powerful DBMS</strong> used for <strong>data handling.</strong></li>\r\n\t<li>It stores the data in the form of<strong> tables</strong> and allows all types of <strong>operations to be performed on the data</strong>.</li>\r\n\t<li>The component of Microsoft Access 2013 is as follows\r\n\t<ul>\r\n\t\t<li>Table</li>\r\n\t\t<li>Queries</li>\r\n\t\t<li>Forms</li>\r\n\t\t<li>Report</li>\r\n\t\t<li>Macros</li>\r\n\t\t<li>Modules</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>MS Access support different type of data, some are as follows:</li>\r\n\t<li><strong>Short type text:</strong>\r\n\t<ul>\r\n\t\t<li>It is a type of text or combination of text and numbers, including a number that does not require calculation.</li>\r\n\t\t<li>The size of the short text is <strong>up to 255 characters</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Long text</strong>\r\n\t<ul>\r\n\t\t<li>It is lengthy text or a combination of text and numbers.</li>\r\n\t\t<li>The size of the long text is <strong>up to 63,999 characters</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Number</strong>\r\n\t<ul>\r\n\t\t<li>It is numeric data used in the<strong> mathematical calculation.</strong></li>\r\n\t\t<li>The size of the number is <strong>1,2, 4 or 8 byte(16 bytes if the set to Replicate ID</strong>).</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Date/ Time</strong>\r\n\t<ul>\r\n\t\t<li>It is data and time value for years <strong>100 through 9999. </strong></li>\r\n\t\t<li>The size of the character is<strong> 8 byte.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>Which one of the following folders is used to store deleted emails?</p>", "option1": "\r\n<p>Trash</p>", "option2": "\r\n<p>Spam</p>", "option3": "\r\n<p>Inbox</p>", "option4": "\r\n<p>Drafts</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is (1)</strong></p>\r\n\r\n<p>Trash</p>\r\n\r\n<ul>\r\n\t<li>A message that you delete remains in your trash for 30 days. It will be permanently erased after that point.</li>\r\n\t<li>On Gmail and Google Apps, an archived message defaults to the Archive folder or All Mail while a deleted message goes into the trash folder.</li>\r\n\t<li>Your deleted emails can be automatically removed from your trash folder permanently depending on your email provider or company&#39;s policies (often after 30 days).</li>\r\n\t<li>Check your Gmail inbox now. There is a list of folders on the left side of the screen (Inbox, Starred, Spam, etc). Your deleted emails will be located in a folder labeled &quot;Trash&quot; or &quot;Bin&quot; (the name of the folder depends on the user&#39;s language preferences).</li>\r\n</ul>\r\n\r\n<p><br />\r\n<strong>Inbox:-</strong> a location on a computer where emails sent to you are stored.</p>\r\n\r\n<p><strong>Outbox:-</strong> Without an internet connection, users can read, reply to, and delete emails. All of your emails from the outbox are immediately sent whenever you&#39;re back online. Your emails might still be sitting in Gmail&#39;s outbox if you&#39;ve been using this feature.</p>\r\n\r\n<p><strong>Spam:- </strong>Email spam, commonly referred to as junk email, is the practice of sending unwanted email messages in mass to a large list of subscribers.</p>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>Some cookies are automatically recreated after a user has deleted them. These are called _______ cookies.</p>", "option1": "\r\n<p>third party</p>", "option2": "\r\n<p>zombie</p>", "option3": "\r\n<p>persistent</p>", "option4": "\r\n<p>session</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option is 2) zombie.</strong></p>\r\n\r\n<p><strong>Explanation:</strong></p>\r\n\r\n<ul>\r\n\t<li>Cookies are small text files that websites store on a user&#39;s computer or device when they visit the site.</li>\r\n\t<li>Cookies can be used for a variety of purposes, such as remembering a user&#39;s preferences or login information.</li>\r\n\t<li>However, some cookies can also be used to track a user&#39;s activity across multiple websites, which can raise privacy concerns.</li>\r\n</ul>\r\n\r\n<p><strong>Zombie</strong></p>\r\n\r\n<ul>\r\n\t<li>Zombie cookies, also known as &quot;evercookies,&quot; are a type of persistent cookie that are difficult to remove.</li>\r\n\t<li>Zombie cookies can be used to track a user&#39;s activity even if they delete their cookies or use private browsing mode.</li>\r\n\t<li>The cookies that are automatically recreated after a user has deleted them are called &quot;zombie cookies&quot; or &quot;evercookies&quot;.</li>\r\n</ul>\r\n\r\n<p><strong>P</strong><strong>ersistent</strong></p>\r\n\r\n<ul>\r\n\t<li>Persistent cookies are cookies that remain on a user&#39;s computer or device even after they close their browser.</li>\r\n\t<li>These cookies can be used to remember a user&#39;s preferences or login information the next time they visit the website.</li>\r\n</ul>\r\n\r\n<p><strong>Session</strong></p>\r\n\r\n<ul>\r\n\t<li>Session cookies are cookies that are deleted when a user closes their browser.</li>\r\n\t<li>These cookies are often used to keep track of a user&#39;s activity during a single browsing session, such as adding items to a shopping cart.</li>\r\n</ul>\r\n\r\n<p><strong>Third-party</strong></p>\r\n\r\n<ul>\r\n\t<li>Third-party cookies are cookies that are set by a domain other than the one the user is visiting.</li>\r\n\t<li>For example, if a user visits a website and that website has embedded content from a third-party domain,</li>\r\n\t<li>such as an advertisement or a social media plugin, the third-party domain may set a cookie on the user&#39;s computer.</li>\r\n\t<li>This can allow the third-party domain to track the user&#39;s activity across multiple websites.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n<p>Which of the following option can be pressed to create a new email message in Gmail?</p>", "option1": "\r\n<p>Settings</p>", "option2": "\r\n<p>Outbound</p>", "option3": "\r\n<p>Compose</p>", "option4": "\r\n<p>Drafts</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct option that can be pressed to create a new email message in Gmail is: Compose</strong></p>\r\n\r\n<ul>\r\n\t<li>In Gmail, Compose is the button that can be clicked or the key that can be pressed to start creating a new email message.</li>\r\n\t<li>It is usually located in the upper left-hand corner of the Gmail window, and it is represented by a red-colored &quot;Compose&quot; icon.</li>\r\n\t<li>Settings, Outbound, and Drafts are also buttons in Gmail, but they are not used to create a new email message.</li>\r\n\t<li>Instead, they are used for other functions in Gmail.</li>\r\n\t<li>Settings: This button is used to access the settings menu in Gmail, where users can customize their Gmail account and adjust various settings such as filters, themes, and forwarding options.</li>\r\n\t<li>Outbound: There is no button called &quot;Outbound&quot; in Gmail. It might refer to the &quot;Sent&quot; folder, where users can view their previously sent emails.</li>\r\n\t<li>Drafts: This button is used to access the Drafts folder in Gmail, where users can find emails that they have started composing but have not yet sent.</li>\r\n\t<li>Users can save a message as a draft and return to it later to finish composing it and send it.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n<p>Which of the following is NOT a type of paragraph formatting in MS-Word 365?</p>", "option1": "\r\n<p>Right</p>", "option2": "\r\n<p>Precise</p>", "option3": "\r\n<p>Justify</p>", "option4": "\r\n<p>Centre</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> Precise</strong></p>\r\n\r\n<p><strong>The formatting options available in the &#39;Paragraph&#39; setting window in MS Word 2016 are:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Spacing.</strong></li>\r\n\t<li><strong>Indentation.</strong></li>\r\n\t<li><strong>Pagination under the option Line and Page breaks.</strong></li>\r\n\t<li><strong>Alignment.</strong></li>\r\n</ul>\r\n\r\n<p><strong>Paragraph formatting options are described as:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Alignment</strong>\r\n\r\n\t<ul>\r\n\t\t<li>Alignment or justification<strong> refers to the way in which the lines of a paragraph are aligned.</strong></li>\r\n\t\t<li>There are<strong> four types</strong> of alignment, namely,<strong> left, center, right, and justified.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Indentation</strong>\r\n\t<ul>\r\n\t\t<li>The<strong> value in the Before text box </strong>specifies the width of the <strong>additional empty space that is inserted between the margin and the text on the left-hand side of a paragraph of left-to-right text.</strong></li>\r\n\t\t<li>The<strong> value in the After text box </strong>specifies the <strong>width of the additional empty space that is inserted between the text and the margin on the right-hand side of a paragraph of left-to-right text.</strong></li>\r\n\t\t<li>A negative value specifies the distance by which the text extends beyond the respective margin.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Spacing</strong>\r\n\t<ul>\r\n\t\t<li>The<strong> spacing</strong> between two paragraphs is<strong> determined by the spacing before one paragraph and the spacing after the preceding paragraph, which are displayed and can be modified in the Before and After boxes.</strong></li>\r\n\t\t<li>Line spacing refers to the<strong> vertical distance between the lines within a paragraph.</strong></li>\r\n\t\t<li>It determines the location of each line relative to the line above it.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Line and Page Breaks tab (Pagination)</strong>\r\n\t<ul>\r\n\t\t<li>The paragraph formatting options on the Line and Page Breaks tab under <strong>pagination of the Paragraph dialog box can help you control where automatic page breaks occur in your document.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>Once_______ has infected a substantial number of computer systems, it generates revenue either by displaying advertisements or using a &quot;pay per click&quot; mechanism to charge its clients against the number of clicks on their displayed ads.</p>", "option1": "\r\n<p>worms</p>", "option2": "\r\n<p>adware</p>", "option3": "\r\n<p>spyware</p>", "option4": "\r\n<p>virus</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Adware:</strong></p>\r\n\r\n<ul>\r\n\t<li>Adware is software that displays unwanted and aggressive advertising to end-users (for example, pop-up adverts).</li>\r\n\t<li>Malvertising is the use of legal advertisements to distribute malware to end-user PCs.</li>\r\n\t<li>Adware earns cash for its creator by showing internet adverts in the software&#39;s user interface or on a screen that appears in the user&#39;s face during the installation process.</li>\r\n\t<li>Hence the correct answer is adware.</li>\r\n\t<li>Trojan virus masquerades as genuine software, making it one of the most difficult forms of malware to identify.</li>\r\n\t<li>This sort of malware comprises harmful code and instructions that, if executed by the victim, can run undetected.</li>\r\n\t<li>The worm has the ability to replicate itself without the input of the end-user and may swiftly infect huge networks by migrating from one system to another.</li>\r\n\t<li>Spyware snoops on unsuspecting end users, gathering credentials and passwords, browser history, and other information.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>What is the full form of URL?</p>", "option1": "\r\n<p>Uniform Resource Language </p>", "option2": "\r\n<p>Union Resource Language</p>", "option3": "\r\n<p>Union Resource Locator</p>", "option4": "\r\n<p>Uniform Resource Locator</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Uniform Resource Locator</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>The full form of the <strong>URL</strong> is <strong>Uniform Resource Locator</strong>.</li>\r\n\t<li>URL serves as a web address that identifies the <strong>location of a specific resource on the internet</strong>, such as a <strong>web page, image, or document.</strong></li>\r\n\t<li>A URL consists of different components, including the <strong>protocol </strong>(such as &quot;http://&quot; or &quot;https://&quot;), the <strong>domain name</strong>, and the <strong>path to the specific resource</strong>.</li>\r\n\t<li>By using a URL, users can <strong>access and retrieve web content </strong>by entering the URL in a web browser, enabling seamless navigation and retrieval of information on the internet.</li>\r\n\t<li> Some other Important full forms are as follows:\r\n\t<ul>\r\n\t\t<li><strong>RAM:</strong> Random Access Memory</li>\r\n\t\t<li><strong>ROM:</strong> Read-Only Memory</li>\r\n\t\t<li><strong>CPU:</strong> Central Processing Unit</li>\r\n\t\t<li><strong>GPU:</strong> Graphics Processing Unit</li>\r\n\t\t<li><strong>BIOS:</strong> Basic Input/Output System</li>\r\n\t\t<li><strong>LAN: </strong>Local Area Network</li>\r\n\t\t<li><strong>WAN: </strong>Wide Area Network</li>\r\n\t\t<li><strong>USB: </strong>Universal Serial Bus</li>\r\n\t\t<li><strong>HDMI: </strong>High-Definition Multimedia Interface</li>\r\n\t\t<li><strong>SSD: </strong>Solid State Drive</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>Which of the following is a web browser created and developed by Microsoft?</p>", "option1": "\r\n<p>Opera</p>", "option2": "\r\n<p>Chrome</p>", "option3": "\r\n<p>Edge</p>", "option4": "\r\n<p>Brave</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Microsoft Edge.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Microsoft&#39;s new Windows 10 web browser will be called <strong>&#39;Microsoft Edge&#39;.</strong></li>\r\n\t<li>Microsoft Edge is a cross-platform web browser developed by Microsoft.</li>\r\n\t<li>It was first released for<strong> Windows 10 and Xbox One in 2015.</strong></li>\r\n\t<li>Then for Android and iOS in 2017, for macOS in 2019, and as a preview for Linux in October 2020.</li>\r\n\t<li>Edge includes integration with Cortana and has extensions hosted on the Microsoft Store.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n<p>Which of the following shortcut key is used to move the cursor one word to the left in MS-Word 365?</p>", "option1": "\r\n<p>Ctrl + Left arrow key</p>", "option2": "\r\n<p>Shift + Left arrow key</p>", "option3": "\r\n<p>Shift + PageUp</p>", "option4": "\r\n<p>Ctrl + PageUp</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Ctrl + Left arrow key.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Ctrl + Left arrow</strong> key is the shortcut key that can be used to <strong>move the cursor one word to the left</strong> in MS Word 365.</li>\r\n\t<li>This shortcut key<strong> enables the cursor to jump from one word to another towards the left side</strong> of the current cursor position, facilitating easy editing and formatting.</li>\r\n\t<li>The Ctrl + Left Arrow shortcut key is a commonly used feature in various word processing applications, including MS Word 365, making it a valuable skill for improving productivity across different software platforms.</li>\r\n\t<li>In the same way, by using <strong>Ctrl + Right Arrow</strong>, you can swiftly <strong>move the cursor to the beginning of the next word on the right side of the current cursor position</strong> in your MS Word 365 document.</li>\r\n\t<li><strong>Shift + Left arrow key</strong>\r\n\t<ul>\r\n\t\t<li>By <strong>holding down the Shift key and pressing the Left Arrow key</strong>, you can <strong>extend the selection of text to the left of the current cursor position</strong> in your MS Word 365 document.</li>\r\n\t\t<li>This shortcut key allows for precise and efficient selection of text by word or character, depending on the number of times the &quot;Left Arrow&quot; key is pressed while holding down &quot;Shift.&quot;</li>\r\n\t\t<li>Instead of manually clicking and dragging to select text, Shift + Left Arrow provides a faster way to highlight text, saving time and effort, especially when working with large amounts of text.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Shift + PageUp</strong>\r\n\t<ul>\r\n\t\t<li><strong>By holding down the Shift key and pressing the PageUp key</strong>, you can<strong> extend the selection of text upward by one page from the current cursor position</strong> in your MS Word 365 document.</li>\r\n\t\t<li>This shortcut key allows for the efficient selection of larger portions of text spanning multiple pages, making it easier to edit, format, or copy and paste content.</li>\r\n\t\t<li>Shift + PageUp helps in navigating and selecting text rapidly, especially when you need to work with significant portions of text that are spread across multiple pages.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Ctrl + PageUp</strong>\r\n\t<ul>\r\n\t\t<li><strong>By pressing Ctrl + PageUp</strong>, you can <strong>quickly switch to the previous tab or document page</strong> in your MS Word 365 application.</li>\r\n\t\t<li>This shortcut key is especially useful when working with multiple tabs or documents simultaneously, allowing you to easily navigate between them without the need for manual clicking or scrolling.</li>\r\n\t\t<li>It enhances productivity by providing a quick way to switch between different sections or content within your MS Word 365 application, improving your overall workflow and task management.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>Which among the following generations of computer used the technology of transistors for the first time?</p>", "option1": "\r\n<p>Third</p>", "option2": "\r\n<p>Second</p>", "option3": "\r\n<p>First</p>", "option4": "\r\n<p>Fourth</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>The correct answer is the Second generation of computers used the technology of transistors for the first time.</strong></p>\r\n\r\n<ul>\r\n\t<li>The Second generation of computers (1956-1963) used transistors instead of vacuum tubes, which were used in the first generation of computers.</li>\r\n\t<li>Transistors were smaller, faster, and more reliable than vacuum tubes, and they consumed less power.</li>\r\n\t<li>The development of transistors was a major breakthrough in computer technology, as it allowed for the creation of smaller, faster, and more reliable computers.</li>\r\n\t<li>The second generation of computers also saw the introduction of magnetic core memory, which was faster and more reliable than the drum memory used in the first generation of computers.</li>\r\n\t<li>Third Generation: The third generation of computers (1964-1971) saw the introduction of integrated circuits, which were smaller and more reliable than transistors. Integrated circuits allowed for the creation of even smaller and faster computers, and they paved the way for the development of microprocessors.</li>\r\n\t<li>First Generation: The first generation of computers (1940s-1950s) used vacuum tubes as the primary electronic component. Vacuum tubes were large, fragile, and consumed a lot of power, and they were prone to failure. The first generation of computers were huge, expensive, and used mainly for scientific and military applications.</li>\r\n\t<li>Fourth Generation: The fourth generation of computers (1971-1989) saw the introduction of microprocessors, which were integrated circuits that contained all the components of a computer&#39;s central processing unit (CPU) on a single chip. Microprocessors were smaller, faster, and more energy-efficient than the previous generation of computers, and they led to the development of personal computers (PCs). The fourth generation of computers also saw the development of the graphical user interface (GUI) and the mouse, which made computers more user-friendly and accessible to non-technical users.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>Which among the following devices is also known as Visual Display Unit (VDU)?</p>", "option1": "\r\n<p>Printer</p>", "option2": "\r\n<p>Scanner</p>", "option3": "\r\n<p>Track Ball</p>", "option4": "\r\n<p>Monitor</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u>Virtual Display Unit (VDU)</u></p>\r\n\r\n<ul>\r\n\t<li>It is also called or synonymously used with &quot;monitor&quot; which is an output device of the computer.</li>\r\n\t<li>It consists of millions of tiny light particles called pixels, which are arranged in vertical and horizontal lines to form the image.</li>\r\n\t<li>VDU or monitor displays entered text or images or graphics whenever the user enters it using any input devices.</li>\r\n\t<li>VDU is the CRT type monitor with the main part being the Cathode Ray Tube, commonly called a picture tube.</li>\r\n\t<li>CRT technology provides a cheap and good color output.</li>\r\n\t<li>Types of Visual Display Units:\r\n\t<ul>\r\n\t\t<li>Liquid Crystal Displays.</li>\r\n\t\t<li>LCD with LED Backlight.</li>\r\n\t\t<li>Cathode Ray Tube. </li>\r\n\t\t<li>Plasma.</li>\r\n\t\t<li>LED</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is option 4.</p>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>Speed of ______ printer is measured in characters per second (CPS).</p>", "option1": "\r\n<p>Dot Matrix</p>", "option2": "\r\n<p>Line</p>", "option3": "\r\n<p>Ink-Jet</p>", "option4": "\r\n<p>Laser</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is Dot Matrix</p>\r\n\r\n<p>Print resolution is measured as the number of Dots Per Inch (dpi).</p>\r\n\r\n<ul>\r\n\t<li>It can be said that Resolution (in terms of print)  is a measure of the number of dots that a device can put in one square inch of page space.</li>\r\n\t<li>The higher the dot density, the higher the resolution of the print or scan.</li>\r\n\t<li>A printer with 600 DPI is a printer that prints 600 x 600 per square inch or 360,000 dots per inch.</li>\r\n\t<li>Increasing the DPI will make the size of the printed image smaller while decreasing the DPI will make the size of the printed image larger.</li>\r\n</ul>\r\n\r\n<p> </p>\r\n\r\n<ul>\r\n\t<li>Characters-per-second (cps) is a unit of measure used to describe the speed of dot-matrix and daisy-wheel printers.</li>\r\n\t<li>Lines-Per-Minute (LPM) is the number of lines of text a printer is capable of producing in one minute. It is affected by factors such as text size, resolution, and colour.</li>\r\n\t<li>Pages per minute (PPM) is a printer speed measurement standard. It is the measurement standard for how fast a printer can print a standardized page.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>Which among the following ports is also called as mouse port?</p>", "option1": "\r\n<p>Video Graphic Array</p>", "option2": "\r\n<p>High Definition Media Interface</p>", "option3": "\r\n<p>Firewire</p>", "option4": "\r\n<p>PS/2</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>PS/2 </strong></u></p>\r\n\r\n<ul>\r\n\t<li>There are various types of computer ports such as USB ports, Ethernet ports, PS/2 ports, VGA ports etc.</li>\r\n\t<li><strong>The DIN is a round connector with pins arranged in a circular pattern used for connecting PC keyboards, MIDI instruments etc.</strong></li>\r\n\t<li>Mini DIN connectors are small in size compared to regular DINs, but the pins are arranged horizontally unlike in normal DIN.</li>\r\n\t<li><strong>PS/2 or PS/02 is a DIN connector available with 6 pins. It is used to connect keyboards and mice and was developed by IBM. Hence option 3 is correct.</strong><strong>These ports are available in different colours like purple for the keyboard and green for the mouse.</strong></li>\r\n\t<li><strong>The Video Graphics Array or VGA port is a 3-row 15-pin connector. It is used in monitors, video cards, projectors etc.</strong> This port carries video signals up to 648X480 resolution.</li>\r\n\t<li><strong>The function of the USB ports is to connect computer peripherals like printers, keyboards, external hard drives etc.</strong></li>\r\n\t<li>The Ethernet port is used as a network cable to the PC. It establishes an internet connection to the computer. <strong>It is a Local Area Network or LAN.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>Which among the following statements is incorrect about secondary memory?</p>", "option1": "\r\n<p>It is known as the backup memory.</p>", "option2": "\r\n<p>Data is permanently stored even if power is switched OFF.</p>", "option3": "\r\n<p>Computer may run without the secondary memory.</p>", "option4": "\r\n<p>It is a volatile memory.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Correct Answer: It is a volatile memory.</strong></p>\r\n\r\n<ul>\r\n\t<li>Secondary memory is also known as auxiliary memory or external memory.</li>\r\n\t<li>It is a type of computer memory that is used for long-term storage of data and programs, and it is not directly accessible to the CPU.</li>\r\n\t<li>Secondary memory is non-volatile, which means that data stored on it is not lost when the power is switched off.</li>\r\n\t<li>It is used for tasks such as storing operating systems, software applications, documents, media files, and other types of data that need to be accessed frequently but do not need to be kept in the primary memory (RAM) of the computer.</li>\r\n\t<li> It is known as the backup memory: This statement is correct. Secondary memory is often used as a backup for data that is stored in primary memory (RAM).</li>\r\n\t<li>This is because the data stored in RAM is volatile and can be lost if the power is turned off or if there is a system crash.</li>\r\n\t<li>By contrast, data stored in secondary memory is non-volatile and can be retrieved even if the computer shuts down unexpectedly.</li>\r\n\t<li>Data is permanently stored even if power is switched OFF: This statement is correct.</li>\r\n\t<li>As mentioned earlier, secondary memory is non-volatile, which means that it retains data even when the power is switched off.</li>\r\n\t<li>This is in contrast to primary memory (RAM), which is volatile and loses its contents when the power is turned off.</li>\r\n\t<li>Computer may run without the secondary memory: This statement is also correct.</li>\r\n\t<li>While secondary memory is an important component of a computer system, a computer can still run without it.</li>\r\n\t<li>However, the absence of secondary memory will limit the amount of data and programs that the computer can store and access.</li>\r\n\t<li>The computer will have to rely solely on its primary memory (RAM), which is usually much smaller in capacity than secondary memory.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n<p>Sir Tim Berners-Lee - a British computer scientist invented the revolutionary World Wide Web in ______.</p>", "option1": "\r\n<p>1982</p>", "option2": "\r\n<p>1995</p>", "option3": "\r\n<p>1990</p>", "option4": "\r\n<p>1985</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>1990</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Tim Berners-Lee</strong>, a British computer scientist, generally credited as the inventor of the World Wide Web.</li>\r\n\t<li>The development of the World Wide Web was begun in 1989 by Tim Berners-Lee and his colleagues at CERN, an international scientific organization based in Geneva, Switzerland.</li>\r\n\t<li>In 2004 he was awarded a knighthood by Queen Elizabeth II of the United Kingdom and the inaugural Millennium Technology Prize by the Finnish Technology Award Foundation.</li>\r\n</ul>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"col\">Invention</th>\r\n\t\t\t<th scope=\"col\">Founder(s)</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Telephone</td>\r\n\t\t\t<td>Alexander Graham Bell</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Electricity</td>\r\n\t\t\t<td>Benjamin Franklin</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Penicillin</td>\r\n\t\t\t<td>Alexander Fleming</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Theory of Relativity</td>\r\n\t\t\t<td>Albert Einstein</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Internet</td>\r\n\t\t\t<td>Vinton Cerf and Bob Kahn</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>DNA Structure</td>\r\n\t\t\t<td>James Watson and Francis Crick</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Microscope</td>\r\n\t\t\t<td>Zacharias Janssen</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Printing Press</td>\r\n\t\t\t<td>Johannes Gutenberg</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>X-rays</td>\r\n\t\t\t<td>Wilhelm Conrad Roentgen</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Steam Engine</td>\r\n\t\t\t<td>James Watt</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p> </p>\r\n\r\n<p><strong>NOTE: -</strong></p>\r\n\r\n<ul>\r\n\t<li>Tim Berners-Lee indeed began working on the idea for the World Wide Web in 1989 while at CERN, the European physics research center. However, the first successful communication between a web browser and a server via the Internet happened on December 25, 1990. Because the options provided do not include 1989, the closest accurate option would be:</li>\r\n</ul>\r\n\r\n<p><strong>1990</strong></p>\r\n\r\n<p>This represents the year when the World Wide Web became a functioning entity. However, if 1989 were an option, it would be the most accurate choice to represent when Berners-Lee first started developing the concept.</p>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n<p>_______ is also known as protocol convertor.</p>", "option1": "\r\n<p>Hub</p>", "option2": "\r\n<p>Bridge</p>", "option3": "\r\n<p>Switch</p>", "option4": "\r\n<p>Gateway</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>4</strong></u></p>\r\n\r\n<ul>\r\n\t<li>The<strong> gateway may be a single component of a networking hardware system applied in the field of telecommunication for the interaction of devices, that enable the info flow from one discrete network to others.</strong></li>\r\n\t<li>They act as routers or switches that are capable of interacting with multiple networks and may work on seven layers of the OSI model.</li>\r\n\t<li>They can be unidirectional (allowing data to flow in only one direction) or bidirectional (allowing data to flow both in and out of a network). Hence statement 2 is not correct.</li>\r\n\t<li>The gateway is also known as the network connector and the protocol converter. </li>\r\n\t<li><strong>Node:</strong>\r\n\t<ul>\r\n\t\t<li>A node could also be a point of intersection/connection within a data communication network.</li>\r\n\t\t<li>In an environment where all devices are accessible through the network, these devices are all considered nodes.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Bridge:</strong>\r\n\t<ul>\r\n\t\t<li>Bridges are used to connect two subnetworks that use interchangeable protocols.</li>\r\n\t\t<li>It combines two LANs to form an extended LAN.</li>\r\n\t\t<li>The foremost difference between the bridge and the repeater is that the bridge has a penetrating efficiency.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Router:</strong>\r\n\t<ul>\r\n\t\t<li>A router receives and sends data on computer networks.</li>\r\n\t\t<li>Routers are sometimes confused with network hubs, modems, or network switches.</li>\r\n\t\t<li>However, routers can combine the functions of these components, and connect with these devices, to reinforce Internet access or help create business networks.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n\r\n<p>Which of the following keyboard shortcut is used to lock the windows screen in windows 10?</p>", "option1": "\r\n\r\n<p>Windows logo key + M</p>", "option2": "\r\n\r\n<p>Windows logo key + K</p>", "option3": "\r\n\r\n<p>Windows logo key + N</p>", "option4": "\r\n\r\n<p>Windows logo key + L</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <u><strong>Windows logo key + L</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>The Start Menu offers an option for locking your PC. Just click the Start button (the Windows icon), select your account name, and then click &ldquo;Lock.&rdquo;</li>\r\n\t<li>In addition to locking it from the Start menu, letting it lock automatically after a period of inactivity, and even using Bluetooth to lock when it senses you&#39;ve left, there are two ways to lock Windows with quick keyboard shortcuts. </li>\r\n\t<li>The Ctrl+Alt+Delete keyboard shortcut is commonly used to kill unresponsive software, but you can also use it to lock your computer. Press Ctrl+Alt+Delete, and then click &ldquo;Lock&rdquo; in the menu that appears.</li>\r\n\t<li>There&#39;s an even faster way to lock the screen &mdash; do it in a single keystroke. Press the Windows and L keys at the same time. It should lock instantly. </li>\r\n\t<li>Windows logo key + l is used to lock the computer.</li>\r\n\t<li>Windows logo key + i is used to open settings.</li>\r\n\t<li>Windows logo key + f is used to open the feedback hub.</li>\r\n\t<li>Windows logo key + r is used to open the run window.</li>\r\n</ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }

    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }

    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

</head>

  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>

</body>

  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
