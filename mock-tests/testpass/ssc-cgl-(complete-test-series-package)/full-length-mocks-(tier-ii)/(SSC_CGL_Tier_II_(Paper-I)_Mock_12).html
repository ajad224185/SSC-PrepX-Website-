<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>42.) SSC CGL Tier II (Paper-I) Mock 12 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": "<div><p>Which number will replace the question mark (?) in the following series?</p>98, 95, 86, 82, 66, ?, 36</div>", "option1": "<p>61</p>", "option2": "<p>58</p>", "option3": "<p>63</p>", "option4": "<p>60</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<div><p>Pattern followed is:</p><p>98 – 3 = 95</p><p>95 - 3 <sup>2  </sup>= 86</p><p>86 – 4 = 82</p><p>82 - 4 <sup>2  </sup>= 66</p><p><strong>66 – 5 = 61</strong></p><p>61 - 5 <sup>2  </sup>= 36</p>Hence 61 is the correct answer.</div>", "question_heading": ""}, {"sr_no": 2, "question": "<p>A closed cylindrical tank with a height of 1 m and a base diameter of 140 cm must be constructed from a metal sheet. For the same, how many m<sup>2</sup> of the sheet are required? [Use π = 22/7]</p>", "option1": "<p>10.56 m<sup>2</sup></p>", "option2": "<p>7.48 m<sup>2</sup></p>", "option3": "<p>9.23 m<sup>2</sup></p>", "option4": "<p>7 m<sup>2</sup></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>Given:</strong></p><p>Height of the cylinder = 1 m </p><p>Diameter = 140 cm = 1.4 m, so radius = 1.4/2 = 0.7 m</p><p><strong>Concept used:</strong></p><p>Total surface area of the cylinder = 2πrh + 2πr<sup>2</sup></p><p><strong>Calculation:</strong></p><p>Total sheet required = <span>2πrh + 2πr<sup>2</sup> = 2πr(h + r) </span></p><p><span>⇒ 2 × 22/7 × 0.7 × (1 + 0.7) </span></p><p><span>⇒ 4.4 × 1.7</span></p><p><span>⇒ 7.48 m<sup>2</sup></span></p><p><span><span>∴ The correct answer is </span></span><strong><span>7.48 m</span><sup>2</sup></strong>.<strong><span></span></strong></p>", "question_heading": ""}, {"sr_no": 3, "question": "\r\n<p>A piece of paper is folded and punched as shown below in the question figures. From the given answer figures, indicate how it will appear when opened.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980852_1742980852917107_thump.png\" style=\"width: 300px; height: 75px;\" /></figure>", "option1": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980896_1742980896720990_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "option2": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980981_1742980981483225_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "option3": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981008_1742981008689184_thump.png\" style=\"width: 100px; height: 99px;\" /></p>", "option4": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981066_1742981066733853_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>Clearly, when paper sheet is unfolded it will appear as shown below:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981126_1742981126268099_thump.png\" style=\"width: 100px; height: 99px;\" /></figure>\r\nThus fig.3 is the correct answer.</div>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<div>In the diagram below, CD = BF = 10 units and &ang;CED = &ang;BAF = 30&deg;. What would be the area of triangle AED? (Note: Diagram below may not be proportional to scale.)\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981246_1742981246251605_thump.png\" style=\"width: 150px; height: 200px;\" /></figure>\r\n</div>", "option1": "\r\n<p>100 &times; (&radic;2 + 3)</p>", "option2": "\r\n<p><span>\\(\\frac{100}{\\sqrt{3}+4}\\)</span></p>", "option3": "\r\n<p><span>\\(\\frac{50}{\\sqrt{3}+4}\\)</span></p>", "option4": "\r\n<p>50 &times; (&radic;3 + 4)</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>CD = BF = 10</p>\r\n\r\n<p>&ang;CED = &ang;BAF = 30&deg;</p>\r\n\r\n<p>In the &Delta;ABF</p>\r\n\r\n<p>&ang;AFB + &ang;ABF + &ang;BAF = 180&deg; </p>\r\n\r\n<p>&ang;AFB = 180&deg; - <span>&ang;ABF - &ang;BAF</span></p>\r\n\r\n<p><span>&ang;AFB = 180&deg; - 90&deg; - 30&deg; </span></p>\r\n\r\n<p><span>&ang;AFB = 60&deg; </span></p>\r\n\r\n<p><span>Similarly, </span></p>\r\n\r\n<p><span>&ang;ECD = 60&deg; = &ang;BCF</span></p>\r\n\r\n<p>In a 30&deg; &minus; 60&deg; &minus; 90&deg; triangle, sides are in the ratio 1 ∶ &radic;3 ∶ 2. So</p>\r\n\r\n<p>In &Delta;EDC, CD = 10 &amp; <span>ED = 10&radic;3 </span></p>\r\n\r\n<p>In &Delta;FBC, BF = 10 &amp; <strong>BC = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 17px; height: 23px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span></strong></p>\r\n\r\n<p>In &Delta;AFB, <strong>AB = 10&radic;3</strong></p>\r\n\r\n<p>Therefore,</p>\r\n\r\n<p>AD = AB + BC + CD</p>\r\n\r\n<p>AD =  10&radic;3 + 10/&radic;3 + 10 </p>\r\n\r\n<p><span>AD =  (10 &times; 3 + 10 + 10&radic;3) / &radic;3 </span></p>\r\n\r\n<p><strong><span>AD =  10 + 40/&radic;3</span></strong></p>\r\n\r\n<p>Area of &Delta;ADE = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 10px; height: 20px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span> &times; 10&radic;3 &times; <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 64px; height: 26px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background: url(&quot;https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png&quot;) rgba(220, 220, 220, 0.5); top: -15px; left: 0px;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span> units</p>\r\n\r\n<p><strong><span>Area of &Delta;ADE </span>= 50(&radic;3 + 4) sq. units</strong></p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n<p>Select the option which is related to the third figure in the same way as the second figure is related to the first figure.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981341_1742981341406092_thump.png\" style=\"width: 300px; height: 63px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981370_1742981370195277_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981416_1742981416697968_thump.png\" style=\"width: 100px; height: 102px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981445_1742981445262782_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981496_1742981496305480_thump.png\" style=\"width: 100px; height: 102px;\" /></div>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Logic - Here, we get figure second when we <strong>flip figure first vertically.</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981523_1742981523741191_thump.png\" style=\"width: 250px; height: 52px;\" /></figure>\r\n\r\n<p>Hence, <strong>the correct answer is option 1.</strong></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>In the following question, four number pairs are given. In each pair the number on left side of (-) is related to the number of the right side of (-) with some Logic/Rule/Relation. Three pairs are similar on basis of same Logic/Rule/Relation. Select the odd one out from the given alternatives. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g.13 - Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)</p>", "option1": "\r\n<div>16 - 30</div>", "option2": "\r\n<div>44 - 84</div>", "option3": "\r\n<div>14 - 26</div>", "option4": "\r\n<div>18 - 34</div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<p><strong>First number &times; 2 - 2 = Second number.</strong></p>\r\n\r\n<p>Option 1) <span>16 - 30 &rarr; 16 &times; 2 &rArr; 32 - 2 = 30 </span></p>\r\n\r\n<p><span>Option </span><strong>2) <span>44 - 84 &rarr; 44  &times; 2  &rArr; 88 - 4 = 84</span></strong></p>\r\n\r\n<p><span>Option 3) 14 - 26  &rarr; 14 &times; 2  &rArr; 28 - 2 = 26</span></p>\r\n\r\n<p><span>Option 4) 18 - 34 &rarr; 18 &times; 2  &rArr; 36 - 2 = 34</span></p>\r\n\r\n<p>So, Option 2 doesn&#39;t follow the pattern.</p>\r\n\r\n<p>Hence, the correct answer is<strong> &quot;Option 2&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n<p>ABC is an equilateral triangle inscribed in a circle of radius 4cm. CD is perpendicular to AB. Then side AC =</p>", "option1": "\r\n<p>3&radic;2 cm</p>", "option2": "\r\n<p><span>&radic;2 cm</span></p>", "option3": "\r\n<p>2&radic;3 cm</p>", "option4": "\r\n<p>4&radic;3 cm</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given</strong>:</p>\r\n\r\n<p><span>ABC is an equilateral triangle inscribed in a circle of radius 4cm. CD is perpendicular to AB.</span></p>\r\n\r\n<p><span><strong>Concept</strong>:</span></p>\r\n\r\n<p><span>If an equilateral triangle is inscribed in a circle, then the point of intersection of its all median/altitude will be the center of the circle.</span></p>\r\n\r\n<p><span>Also, the altitude of an equilateral triangle divides themself in the ratio 2 : 1.</span></p>\r\n\r\n<p><span><strong>Solution</strong>:</span></p>\r\n\r\n<p><span>Since,</span></p>\r\n\r\n<p><span>ABC is an equilateral triangle inscribed in a circle of radius 4cm.</span></p>\r\n\r\n<p><span>CD is perpendicular to AB i.e., CD is the altitude of the triangle.</span></p>\r\n\r\n<p><span>Let the point of intersection of the altitude and the center of the circle is O.</span></p>\r\n\r\n<p><span>Then, OB = OA = OC = 4 cm i.e., the radius of the circle.</span></p>\r\n\r\n<p><span>Also, the altitude are divided in the ratio 2:1</span></p>\r\n\r\n<p><span>CD is the altitude.</span></p>\r\n\r\n<p><span>CD = CO + OD </span></p>\r\n\r\n<p><span>Since, CO = 4 cm &rArr; OD = 2 cm</span></p>\r\n\r\n<p>For right angle triangle ODB,</p>\r\n\r\n<p>OB<sup>2</sup> = OD<sup>2</sup> + DB<sup>2</sup></p>\r\n\r\n<p>4<sup>2</sup> = 2<sup>2</sup> + DB<sup>2</sup></p>\r\n\r\n<p>DB = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span></p>\r\n\r\n<p>Simillarly,</p>\r\n\r\n<p>DA = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span></p>\r\n\r\n<p>The length of the side AB of the equilateral triangle will be,</p>\r\n\r\n<p>AB = DA + DB = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span> + <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span> = <span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span></p>\r\n\r\n<p>Since the triangle is equilateral,</p>\r\n\r\n<p>AB = BC = AC = <strong><span aria-label=\"math widget\" contenteditable=\"false\" role=\"region\" tabindex=\"-1\"><span class=\"math-tex\" data-widget=\"mathjax\" style=\"display:inline-block\"><iframe allowtransparency=\"true\" frameborder=\"0\" scrolling=\"no\" src=\"javascript:void(0)\" style=\"border: 0px; width: 46px; height: 18px; display: inline; vertical-align: middle;\"></iframe></span><img src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" /><span style=\"background:rgba(220,220,220,0.5);background-image:url(https://cmsone.teachx.in/assets/ckeditor/plugins/widget/images/handle.png);display:none;\"><img draggable=\"true\" height=\"15\" role=\"presentation\" src=\"data:image/gif;base64,R0lGODlhAQABAPABAP///wAAACH5BAEKAAAALAAAAAABAAEAAAICRAEAOw==\" title=\"Click and drag to move\" width=\"15\" /></span></span></strong></p>\r\n\r\n<p><strong>Hence, option 4 is correct.</strong></p>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n<p>In an election, 2% persons enrolled in the voter list did not participate and 500 votes were invalid. Two candidates A and B fought the election, and A defeated B by 200 votes. If 43% of the persons enrolled in the voter list casted their votes in favour of A, then what is the number of the total casted votes?</p>", "option1": "\r\n<p>2450</p>", "option2": "\r\n<p>2800</p>", "option3": "\r\n<p>3000</p>", "option4": "\r\n<p>3250</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>2% of voters did not cast their votes</span></p>\r\n\r\n<p>Invalid votes = 500</p>\r\n\r\n<p>The winner got 200 votes more than his opponent and he secured 43%</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let the total number of votes in the voting list be x</p>\r\n\r\n<p>Total votes = (100 - 2)x/100 = 98x/100 = 0.98x</p>\r\n\r\n<p>Total valid votes = 0.98x - 500</p>\r\n\r\n<p>Number of votes loser got = 0.43x - 200</p>\r\n\r\n<p>Total valid votes are:</p>\r\n\r\n<p>&rArr; 0.43x + 0.43x - 200 = 0.98x - 500</p>\r\n\r\n<p>&rArr; 0.86x - 200 = 0.98x - 500</p>\r\n\r\n<p>&rArr; 0.98x - 0.86x = 300</p>\r\n\r\n<p>&rArr; x = 2500</p>\r\n\r\n<p>&there4; The number of total casted votes = 2500 &times; (100 - 2)%</p>\r\n\r\n<p><span>&rArr; 2450</span></p>\r\n\r\n<p><strong><span>The number of total casted votes is 2450.</span></strong></p>", "question_heading": ""}, {"sr_no": 9, "question": "In ो cधनपोin cयकध िोngहोgध, &िसतहयेFASTER&नौतहये iौ थनiपपधn ोौ &िसतहयेCDPQHO&नौतहये. Hयथ थiिि &िसतहयेVIOLIN&नौतहये ृध थनiपपधn ोौ in पुोप िोngहोgध?", "option1": "\r\n\r\n<p>SLRILK</p>", "option2": "\r\n\r\n<p>SLIRKM</p>", "option3": "\r\n\r\n<p>RKTILK</p>", "option4": "\r\n\r\n<p>SKIRKO</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982201_1742982201931939_thump.png\" style=\"width: 400px; height: 72px;\" /></p>\r\n\r\n<p>The pattern followed here is</p>\r\n\r\n<p><strong>For consonants, positional value - 3</strong></p>\r\n\r\n<p><strong>For vowels, positional value + 3</strong></p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982235_1742982235297917_thump.png\" style=\"width: 200px; height: 116px;\" /></p>\r\n\r\n<p>Similarly,</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982341_1742982341592529_thump.png\" style=\"width: 200px; height: 111px;\" /></p>\r\n\r\n<p>Hence, SLRILK is the correct answer.</p>\r\n\r\n<p>The pattern followed here is</p>\r\n\r\n<p>For consonants, positional value - 3</p>\r\n\r\n<p>For vowels, positional value + 3</p>\r\n\r\n<p>It is <strong>not </strong>based position  of lettrs.</p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n<p>All the red face cards are removed from a pack of 52 playing cards. A card is drawn at random from the remaining cards, after reshuffling them. The probability that the card drawn is a face card is :</p>", "option1": "\r\n<p><span class=\"math-tex\">\\(\\frac{3}{22}\\)</span></p>", "option2": "\r\n<p><span class=\"math-tex\">\\(\\frac{2}{11}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(\\frac{3}{23}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(\\frac{2}{23}\\)</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Solution:</strong></p>\r\n\r\n<p>There are 12 face cards in a deck of 52 playing cards, which includes 3 face cards (jack, queen, and king) each for the 4 suits (hearts, diamonds, clubs, and spades). There are 6 red-face cards and 6 black-face cards.</p>\r\n\r\n<p>After removing 6 red face cards, the remaining cards are 46.</p>\r\n\r\n<p>Remaining face cards 6</p>\r\n\r\n<p>The probability of drawing a face card now is 6/46 = 3/23</p>\r\n\r\n<p><strong>Therefore, the probability of drawing a face card from the remaining deck is <span>3/23</span>.</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n<p>A series is given with one term missing. Select the correct alternative from the given ones that will complete the series.</p>\r\n\r\n<p>CBDA, GFHE, KJLI, ?</p>", "option1": "\r\n<p>NOPM</p>", "option2": "\r\n<p>MNOP</p>", "option3": "\r\n<p>PMNO</p>", "option4": "\r\n<p>ONPM</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>The relation among the terms is as follows,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982399_1742982399368354_thump.png\" style=\"width: 150px; height: 263px;\" /></figure>\r\nHence, the missing term in the series is ONPM.</div>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p>How many 25 cm &times; 11.25 cm &times; 6 cm bricks will be required to construct an 8 m &times; 6 m &times; 22.5 cm wall? (Ignoring other material used)</p>", "option1": "\r\n<p>7020</p>", "option2": "\r\n<p>6400</p>", "option3": "\r\n<p>5800</p>", "option4": "\r\n<p>6800</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Dimension of brick= 25 cm &times; 11.25 cm &times; 6 cm</p>\r\n\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p>Volume of cuboid =  Length &times; width &times; height</p>\r\n\r\n<p><span>Number of brick required</span><span>=  \\(\\frac{Volume\\ of\\ wall}{volume\\ of\\ brick}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>The volume of the brick</p>\r\n\r\n<p>Volume of Brick = 25 cm &times; 11.25 cm &times; 6 cm</p>\r\n\r\n<p>&rArr;1687.5 <span class=\"math-tex\">\\(cm^3\\)</span></p>\r\n\r\n<p>The volume of the wall( to be constructed) is,</p>\r\n\r\n<p>Volume of wall = 8 m &times; 6 m &times; 22.5 cm</p>\r\n\r\n<p>(Change the values of dimension in &#39;cm&#39; as it is given in &#39;m&#39;)</p>\r\n\r\n<p>Volume of wall = 800 cm &times; 600 cm &times; 22.5 cm      ----(1 m = 100 cm )</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(108 \\times 10^5 cm^3\\)</span></p>\r\n\r\n<p>Number of brick required= <span class=\"math-tex\">\\(\\frac{Volume\\ of\\ wall}{volume\\ of\\ brick}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\frac{108 \\times 10^5 }{1687.5}\\)</span> = 6400</p>\r\n\r\n<p><strong>&there4; The number of bricks required is 6400.</strong></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<div>\r\n<p>Which of the following statement(s) is/are TRUE?</p>\r\n\r\n<p>A: The difference between the largest and the smallest observation is known as the domain.</p>\r\nB: If geometric mean of 16, 4 and x is 8, then value of &lsquo;x&rsquo; is 8.</div>", "option1": "\r\n<p>Only A</p>", "option2": "\r\n<p>Neither A nor B</p>", "option3": "\r\n<p>Only B</p>", "option4": "\r\n<p>Only A and B</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>GIVEN:</strong></p>\r\n\r\n<p>Two statements</p>\r\n\r\n<p><strong>CONCEPT:</strong></p>\r\n\r\n<p>Domain of a set and geometric mean.</p>\r\n\r\n<p><strong>FORMULA USED:</strong></p>\r\n\r\n<p>Geometric mean of &lsquo;a&rsquo; and &lsquo;b&rsquo; = &radic;ab</p>\r\n\r\n<p>Geometric mean of &lsquo;a&rsquo;, &#39;b&#39; and &lsquo;c&rsquo; = ∛abc</p>\r\n\r\n<p><strong>CALCULATION:</strong></p>\r\n\r\n<p>A: The difference between the largest and the smallest observation is known as the range.</p>\r\n\r\n<p>B: Geometric mean = ∛(16 &times; 4 &times; x) = 8</p>\r\n\r\n<p>&rArr; 64x = 512</p>\r\n\r\n<p>&rArr; x = 8</p>\r\n\r\n<p>Hence, only B is TRUE. </p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>Shatabdi Express train covers 700 km in 5 hours and another 1012 km in 11 hours. What is the average speed of the train (in metres/second)?</p>", "option1": "\r\n<p>107</p>", "option2": "\r\n<p><span class=\"math-tex\">\\(385\\frac{1}{5}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(29\\frac{13}{18}\\)</span></p>", "option4": "\r\n<p>27</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Given:</p>\r\n\r\n<p>Shatabdi Express train covers 700 km in 5 hours and another 1012 km in 11 hours.</p>\r\n\r\n<p>Concept used:</p>\r\n\r\n<p>Distance = speed &times; <span>time</span></p>\r\n\r\n<p><span>Average speed = Total distance / Total time </span></p>\r\n\r\n<p>Calculation:</p>\r\n\r\n<p><span>Total distance is 1012 + 700 = 1712 km</span></p>\r\n\r\n<p><span>Total time is 5 + 11 = 16 hrs</span></p>\r\n\r\n<p><span>Average speed = 1712 / 16</span></p>\r\n\r\n<p><span>&rArr; 107 km /hr</span></p>\r\n\r\n<p><span>&rArr; 107 &times; 5/18 = <span class=\"math-tex\">\\(29\\frac{13}{18}\\)</span>m/s</span></p>\r\n\r\n<p><strong>&there4; The correct option is 3</strong></p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p>A student sitting in a class room looks at a picture on the blackboard at a height of 2 <span>mts</span> from the horizontal level of sight. The angle of elevation of the picture is 30&deg;. He moves straight towards the blackboard and looks at the picture at an angle of elevation of 60<span>&deg;</span>. Find the distance (in metres) moved by the student</p>", "option1": "\r\n<p>3</p>", "option2": "\r\n<p><span class=\"math-tex\">\\(1+\\sqrt{3}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(2 \\sqrt{3}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(\\frac{4}{\\sqrt{3}}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>The height of the image in blackboard from the horizontal sight = 2 m</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let the distance of student when the angle of elevation is 30<span>&deg; be &#39;x&#39; and the distance of student when the angle of elevation be 60&deg; be &#39;y&#39;</span></p>\r\n\r\n<p><span>Now, tan 30&deg; = <span class=\"math-tex\">\\(\\dfrac{2}{x}\\)</span></span></p>\r\n\r\n<p><span>&rArr; x = 2<span class=\"math-tex\">\\(\\sqrt{3}\\)</span></span></p>\r\n\r\n<p><span>tan 60&deg; = <span class=\"math-tex\">\\(\\dfrac{2}{y}\\)</span></span></p>\r\n\r\n<p>&rArr; y = <span class=\"math-tex\">\\(\\dfrac{2}{\\sqrt{3}}\\)</span></p>\r\n\r\n<p>Now, the distance travelled by student = <span>2 \\(\\sqrt{3}\\)</span> - <span class=\"math-tex\">\\(\\dfrac{2}{\\sqrt{3}}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{4}{\\sqrt{3}}\\)</span></p>\r\n\r\n<p><strong>&there4;The answer is <span class=\"math-tex\">\\(\\dfrac{4}{\\sqrt{3}}\\)</span>.</strong></p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<div>\r\n<p>Select the related letters from the given alternatives.</p>\r\nFDH : LJN :: RPT : ?</div>", "option1": "\r\n<p>XYZ</p>", "option2": "\r\n<p>WUY</p>", "option3": "\r\n<p>XVZ</p>", "option4": "\r\n<p>SUV</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>6 (F) + 6 = 12 (L); 4 (D) + 6 = 10 (J); 8 (H) + 6 = 14 (N)</p>\r\n\r\n<p>Similarly,</p>\r\n\r\n<p>18 (R) + 6 = 24 (X); 16 (P) + 6 = 22 (V); 20 (T) + 6 = 26 (Z)</p>\r\nHence, XVZ is the correct answer.</div>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>Four word-pairs have been given, out of which three are alike in some manner and one is different. Select the odd one.</p>", "option1": "\r\n<p>Nut : Almond</p>", "option2": "\r\n<p>Tomato : Fruit</p>", "option3": "\r\n<p>Adidas : Brand</p>", "option4": "\r\n<p>Cricket : Sport</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>Explanation:</span></p>\r\n\r\n<p>The pattern used in the given options:<br />\r\n<strong>Type of group : Group   </strong><br />\r\nOption 1) <span>Nut : Almond -- Nut is not a type of almond.<br />\r\nOption 1) Tomato : Fruit -- Tomato is a type of Fruit.<br />\r\nOption 1) Adidas : Brand -- Adidas is a type of Brand<br />\r\nOption 1) Cricket : Sport -- Cricket is a type of Sport<br />\r\nSo, <strong>Nut : Almond is odd one.</strong></span></p>\r\n\r\n<p><strong><span>Hence the correct answer is option 1.</span></strong></p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>The mean and standard deviation of a set of 16 non-zero positive numbers in an observation are 26 and 3.5 respectively. The mean and standard deviation of another set of 24 non-zero positive numbers without changing the circumstances of both sets of observations, are 29 and 3, respectively. The mean and standard deviation of their combined set of observations will respectively be</p>", "option1": "\r\n<p>27.8 and 3.21</p>", "option2": "\r\n<p>27.8 and 3.52</p>", "option3": "\r\n<p>26.2 and 3.21</p>", "option4": "\r\n<p>26.2 and 3.32</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Data set 1</p>\r\n\r\n<p>Mean of data(x <sub>1</sub>) = 26</p>\r\n\r\n<p>Number of observations(n <sub>1</sub>) = 16</p>\r\n\r\n<p>Standard deviation(a <sub>1</sub>) = 3.5</p>\r\n\r\n<p>Data set 2</p>\r\n\r\n<p>Mean of observations(x <sub>2</sub>) = 29</p>\r\n\r\n<p>Number of observations(n <sub>2</sub>) = 24</p>\r\n\r\n<p>Standard deviation(a <sub>2</sub>) = 3</p>\r\n\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p>Combined mean of data(x <sub>12 </sub>) =  <span class=\"math-tex\">\\(\\dfrac{n_1\\times x_1+n_2\\times x_2}{n_1+n_2}\\)</span></p>\r\n\r\n<p>Combined standard deviation(A <sub>12 </sub>) =  <span class=\"math-tex\">\\(\\sqrt{\\dfrac{n_1(a_1^2+d_1^2)+n_2(a_2^2+d_2^2)}{n_1+n_2}}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Combined mean(X <sub>12 </sub>) =  <span class=\"math-tex\">\\(\\dfrac{n_1\\times x_1+n_2\\times x_2}{n_1+n_2}\\)</span></p>\r\n\r\n<p>&rArr;  <span class=\"math-tex\">\\(\\dfrac{26\\times 16+29\\times 24}{16+24}\\)</span></p>\r\n\r\n<p>&rArr;  <span class=\"math-tex\">\\(\\dfrac{416+696}{40}\\) </span> =  <span>27.8 </span></p>\r\n\r\n<p>d <sub>1</sub> = 27.8 - 26 = 1.8</p>\r\n\r\n<p>d <sub>2</sub> = 27.8 - 29 = -1.2</p>\r\n\r\n<p>Combined Standard deviation(A <sub>12 </sub>) =  <span>\\(\\sqrt{\\dfrac{n_1(a_1^2+d_1^2)+n_2(a_2^2+d_2^2)}{n_1+n_2}}\\)</span></p>\r\n\r\n<p>&rArr;  <span class=\"math-tex\">\\(\\sqrt{\\dfrac{16(3.5^2+1.8^2)+24(3^2+1.2^2)}{16+16}}\\)</span></p>\r\n\r\n<p>&rArr;  <span class=\"math-tex\">\\(\\sqrt{\\dfrac{16(12.25+3.24)+24(9+1.44)}{40}}\\)</span></p>\r\n\r\n<p>&rArr;  <span class=\"math-tex\">\\(\\sqrt{\\dfrac{247.84+250.56}{40}}\\)</span></p>\r\n\r\n<p>&rArr;  <span>\\(\\sqrt{\\dfrac{498.4}{40}}\\) </span> =  <span>3.52 </span></p>\r\n\r\n<p><strong>&there4; The answer is 27.8 and 3.52 .</strong></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<p>Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.</p>\r\n\r\n<p>WUW, TSV, QQU, NOT, ?</p>", "option1": "\r\n<p>JNT</p>", "option2": "\r\n<p>KMS</p>", "option3": "\r\n<p>LNT</p>", "option4": "\r\n<p>MNS</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982750_1742982750411575_thump.png\" style=\"width: 300px; height: 67px;\" /></figure>\r\n\r\n<p>Given: WUW, TSV, QQU, NOT, ?</p>\r\n\r\n<p>The logic followed here is:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982777_1742982777216510_thump.png\" style=\"width: 200px; height: 73px;\" /></figure>\r\n\r\n<p>Hence,  <strong>KMS  </strong>is the correct answer.</p>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>A migrating bird flies 40 km North, then turns East and flies 50 km, then turns North and flies 110 km, and turns to its left and flies 50 km. Where is it now with reference to its starting position?</p>", "option1": "\r\n<p>150 km South</p>", "option2": "\r\n<p>150 km North</p>", "option3": "\r\n<p>70 km North</p>", "option4": "\r\n<p>70 km South</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The following diagram shows the displacement of that Bird.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982832_1742982832946979_thump.png\" style=\"width: 300px; height: 283px;\" /></figure>\r\n\r\n<p>That bird is in 150 km North from is initial position.</p>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n<p>In a certain code language, &#39;+&#39; represents &#39;&times;&#39;, &#39;-&#39; represents &#39;+&#39;, &#39;&times;&#39; represents &#39;&divide;&#39; and &#39;&divide;&#39; represents &#39;-&#39;. What is the answer to the following question?</p>\r\n\r\n<p>50 + 3 &divide; 125 x 5 - 25 = ?</p>", "option1": "\r\n<p>31</p>", "option2": "\r\n<p>7</p>", "option3": "\r\n<p>150</p>", "option4": "\r\n<p>55</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given expression : </strong>50 + 3 &divide; 125 &times; 5 - 25</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Symbol</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Meaning</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&times;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>+</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&divide;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>-</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>On changing symbols,</p>\r\n\r\n<p>50 &times; 3 - 125 &divide; 5 + 25</p>\r\n\r\n<p>&rarr; 150 - 25 + 25</p>\r\n\r\n<p>&rarr; 150</p>\r\n\r\n<p>Clearly, correct answer is 150.</p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<p>Select the option that is related to the third term in the same way as the second term is related to the first term and the sixth term is related to the fifth term.</p>\r\n\r\n<p>17 : 4607 : : 11 : ? : : 23 : 11615</p>", "option1": "\r\n<p>1440</p>", "option2": "\r\n<p>1572</p>", "option3": "\r\n<p>1463</p>", "option4": "\r\n<p>1199</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The pattern followed here is:</p>\r\n\r\n<p><strong>Logic: First number : (First number) <sup>3</sup> - [(First number) <sup>2</sup> + First number]</strong></p>\r\n\r\n<p>1) 17 : 4607</p>\r\n\r\n<p>&rArr; 17 : (17) <sup>3</sup> - [(17) <sup>2</sup> + 17]</p>\r\n\r\n<p>&rArr; 17 : 4913 - [<u><strong>289 + 17</strong></u>]</p>\r\n\r\n<p>&rArr; 17 : [<u><strong>4913 - 306</strong></u>]</p>\r\n\r\n<p>&rArr; 17 : 4607</p>\r\n\r\n<p>And,</p>\r\n\r\n<p>2) 23 : 11615</p>\r\n\r\n<p>&rArr; 23 : (23) <span>3</span> - [(23) <span>2</span> + 23]</p>\r\n\r\n<p>&rArr; 23 : 12167 - [<u><strong>529 + 23</strong></u>]</p>\r\n\r\n<p>&rArr; 23 : [<u><strong>12167 - 552</strong></u>]</p>\r\n\r\n<p>&rArr; 23 : 11615</p>\r\n\r\n<p>Similarly,</p>\r\n\r\n<p>3) 11 : ?</p>\r\n\r\n<p>&rArr; 11 : (11) <span>3</span> - [(11) <span>2</span> + 11]</p>\r\n\r\n<p>&rArr; 11 : 1331 - [<u><strong>121 + 11</strong></u>]</p>\r\n\r\n<p>&rArr; 11 : [<u><strong>1331 - 132</strong></u>]</p>\r\n\r\n<p>&rArr; 11 : 1199</p>\r\n\r\n<p>Hence, the correct answer is  <strong>&quot;1199&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p>Four figures have been given, out of which three are alike in some manner and one is different. Select the one that is different.</p>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982950_1742982950445233_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983081_1742983081352689_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983151_1742983151701452_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983217_1742983217235346_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Check all the options: All three option 1, 2 and 4 are following same logic, except 3rd option.</p>\r\n\r\n<div>Option 1:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983245_1742983245633214_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p>&rArr; Vertically lower half dark,  <span>Horizontally</span> half dark, Diagonal half dark and <span>Vertically upper half dark drops are arraigned in a clockwise direction. </span></p>\r\n\r\n<div>Option 2: \r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983303_1742983303974007_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p><span>&rArr;  Vertically lower half dark,  Horizontally half dark, Diagonal half dark and Vertically upper half dark drops are arraigned in a clockwise direction. </span></p>\r\n\r\n<div><strong>Option 3: </strong>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983339_1742983339610439_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p><span>&rArr;  Vertically lower half dark,  Horizontally half dark, Diagonal half dark and Vertically upper half dark drops are arraigned <strong>in an anti-clockwise</strong> direction. </span></p>\r\n\r\n<div><span>Option 4 : </span><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983449_1742983449737378_thump.png\" style=\"width: 100px; height: 101px;\" /></div>\r\n\r\n<div><span>Vertically lower half dark,  Horizontally half dark, Diagonal half dark and Vertically upper half dark drops are arraigned in a clockwise direction. </span></div>\r\n\r\n<p>Hence, <span>&quot;Option 3&quot;</span> is the correct answer.</p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>Identify the number that does NOT belong to the following series.</p>\r\n\r\n<p>289, 306, 340, 389, 459, 544</p>", "option1": "\r\n<p>289</p>", "option2": "\r\n<p>459</p>", "option3": "\r\n<p>306</p>", "option4": "\r\n<p>389</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic here is:</p>\r\n\r\n<p><span>The difference between the terms is an increasing multiple of 17.</span></p>\r\n\r\n<p>The pattern followed in the given series is:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983504_1742983504803240_thump.png\" style=\"width: 300px; height: 99px;\" /></figure>\r\n\r\n<p>We know that,</p>\r\n\r\n<p>17 &times; 3 = 51 and 17 &times; 4 = 68, so the only number associated with both of them is 389.</p>\r\n\r\n<p>Therefore <strong>389 does not belong to the series and it could have been replaced by 391 to make it a perfect series.</strong></p>\r\n\r\n<p>Hence,  <strong>the correct answer is option 4).</strong></p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>What is the value of sec<sup>2</sup> 54&deg; - cot<sup>2</sup> 36&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; sec<sup>2</sup> 53&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;? </p>", "option1": "\r\n<p><span class=\"math-tex\">\\(\\frac{9}{2}\\)</span></p>", "option2": "\r\n<p><span class=\"math-tex\">\\(\\frac{5}{2}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(\\frac{3}{2}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(\\frac{7}{2}\\)</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used :</strong></p>\r\n\r\n<p>tan(90&deg; - &theta;) = cot &theta; </p>\r\n\r\n<p>cot (90&deg; - &theta;) = tan &theta; </p>\r\n\r\n<p><span>sec (90&deg; - &theta;) = cosec &theta; </span></p>\r\n\r\n<p>cosec<sup>2</sup>&theta; - cot<sup>2</sup>&theta; = 1 </p>\r\n\r\n<p>sec<sup>2</sup>&theta; - tan<sup>2</sup>&theta; = 1 </p>\r\n\r\n<p><strong>Calculations :</strong></p>\r\n\r\n<p> sec<sup>2</sup> 54&deg; - cot<sup>2</sup> 36&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; sec<sup>2</sup> 53&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;</p>\r\n\r\n<p><span>&rArr;  sec</span><sup>2  54&deg; - cot</sup><sup>2  (90&deg; - 54&deg;) +  \\(\\frac{3}{2}\\)  sin</sup><sup>2  37&deg; &times; sec</sup><sup>2  (90&deg; - 37&deg;) +  \\(\\frac{2}{\\sqrt3}\\)  tan 60&deg;</sup></p>\r\n\r\n<p>&rArr;  sec<sup>2</sup> 54&deg; - tan<sup>2</sup> 54&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; cosec<sup>2</sup> 37&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;</p>\r\n\r\n<p>&rArr; 1 + 3/2 + 2 </p>\r\n\r\n<p>&rArr; 9/2</p>\r\n\r\n<p><strong>The value is 9/2.</strong></p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n\r\n\r\n\r\n\r\n<p>Arun is facing North-West. He first turns 90&deg; in the clockwise direction and then another 180&deg; in the anticlockwise direction. Later he turns 90&deg; again in the anticlockwise direction. Which direction is he facing now?</p>", "option1": "\r\n\r\n\r\n\r\n\r\n<p>South</p>", "option2": "\r\n\r\n\r\n\r\n\r\n<p>West</p>", "option3": "\r\n\r\n\r\n\r\n\r\n<p>South-East</p>", "option4": "\r\n\r\n\r\n\r\n\r\n<p>South-West</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n\r\n\r\n<p> </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983666_1742983666646120_thump.png\" style=\"width: 300px; height: 246px;\" /></figure>\r\n\r\n<p>From the diagram lets take P as the initial  position of  Arun, first he goes 90 &deg; clockwise direction and reaches Q, then from Q he goes 180 <span> &deg; anticlockwise and reaches R. From R he goes again anticlockwise direction and reaches S , which is the final position and he is facing southeast.</span></p>\r\n\r\n<p><span>Hence, <strong>&quot;South-East&quot; </strong>is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": "\r\n\r\n<p>Two statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) form the statements.</p>\r\n\r\n<p><strong>Statements:</strong></p>\r\n\r\n<p>Some students are players</p>\r\n\r\n<p>Some players are athletes</p>\r\n\r\n<p>Conclusions:</p>\r\n\r\n<p>I. Some students are athletes.</p>\r\n\r\n<p>II. Some players are students</p>\r\n\r\n<p>III. No students is an athlete.</p>", "option1": "\r\n\r\n<p>Only conclusion II and either conclusion I or III follow</p>", "option2": "\r\n\r\n<p>Only conclusion I follows</p>", "option3": "\r\n\r\n<p>Only conclusions II and III follow</p>", "option4": "\r\n\r\n<p>None of the conclusions follows.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983744_1742983744928285_thump.png\" style=\"width: 159px; height: 89px;\" /></figure>\r\n\r\n<p>Some students are athletes &rarr; False</p>\r\n\r\n<p>Some players are students &rarr; True</p>\r\n\r\n<p>No students is an athlete &rarr; False</p>\r\n\r\n<p>Conclusion I and III are complimentary.</p>\r\n\r\n<p>Hence Only conclusion II and either conclusion I or III follow.</p>", "question_heading": ""}, {"sr_no": 28, "question": "\r\n<p>What is the value of a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> if (a + b + c) = 0?  </p>", "option1": "\r\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> - 3 abc</p>", "option2": "\r\n<p>0</p>", "option3": "\r\n<p>3 abc</p>", "option4": "\r\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2  </sup>- ab - bc - ca</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given Data:</strong></p>\r\n\r\n<p>a + b + c = 0</p>\r\n\r\n<p><strong>Formula Used:</strong></p>\r\n\r\n<p>a<sup>3</sup>+ b<sup>3</sup> + c<sup>3  </sup>&ndash; 3abc = (a+b+c)( a<sup>2</sup>+ b<sup>2</sup>+c<sup>2</sup> &minus;ab&minus;bc&ndash;ca)</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the formula,</p>\r\n\r\n<p>a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> &ndash; 3abc = (a + b + c)( a<sup>2 </sup>+ b<sup>2 </sup>+ c<sup>2</sup> &minus; ab &minus; bc &ndash; ca)</p>\r\n\r\n<p>But (a+b+c) = 0</p>\r\n\r\n<p>&rArr; a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> &ndash; 3abc = 0</p>\r\n\r\n<p>&rArr; a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> = 3abc </p>\r\n\r\n<p><strong>&there4; a<sup>3 </sup>+ b<sup>3</sup> + c<sup>3</sup> is 3abc.</strong></p>", "question_heading": ""}, {"sr_no": 29, "question": "&िसतहयेBधॅधनोgधौ&नौतहये iौ निधोपधक पय &िसतहयेTधो&नौतहये in पुध ौोंध थोद ोौ &िसतहयेMधकicinध&नौतहये iौ निधोपधक पय &िसतहये______&नौतहये", "option1": "\r\n<p>Analgesics</p>", "option2": "\r\n<p>Hospital</p>", "option3": "\r\n<p>Disease</p>", "option4": "\r\n<p>Doctor</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>Tea is a hot beverage made by infusing the dried crushed leaves of the tea plant in boiling water.</p>\r\n\r\n<p>Similarly,</p>\r\n\r\n<p>Analgesic is a medicine to relive pain.</p>\r\nHence, &ldquo;analgesics&rdquo; is the correct answer.</div>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n<p>The area of a triangle whose sides are 13 cm, 14 cm and 15 cm is</p>", "option1": "\r\n<p>21 cm<sup>2</sup></p>", "option2": "\r\n<p>42 cm<sup>2</sup></p>", "option3": "\r\n<p>84 cm<sup>2</sup></p>", "option4": "\r\n<p>168 cm<sup>2</sup></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given data:</strong></p>\r\n\r\n<p>Sides of the triangle, a = 13 cm, b = 14 cm, c = 15 cm</p>\r\n\r\n<p><strong>Concept:</strong></p>\r\n\r\n<p>Heron&#39;s formula to find the area of a triangle with sides a, b, c is,</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\rm\\sqrt{\\left[s(s-a)(s-b)(s-c)\\right]}\\)</span></p>\r\n\r\n<p>where s = (a + b + c)/2 is the semi-perimeter of the triangle.</p>\r\n\r\n<p><strong>Step-by-step solution:</strong></p>\r\n\r\n<p>s = (13 + 14 + 15) / 2 = 21 cm</p>\r\n\r\n<p>Area = <span class=\"math-tex\">\\(\\rm\\sqrt{[s(s-a)(s-b)(s-c)]}\\)</span></p>\r\n\r\n<p>&rArr; Area = <span class=\"math-tex\">\\(\\sqrt{[21(21-13)(21-14)(21-15)]}\\)</span></p>\r\n\r\n<p><strong>Hence, the area of the triangle is 84 cm&sup2;.</strong></p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p>The respective positions of three friends A, B and C are (3, 2), (6, 5) and (9, 8) respectively. What does the three points joined together make?</p>", "option1": "\r\n<p><span>An obtuse angled triangle</span></p>", "option2": "\r\n<p><span>A line segment </span></p>", "option3": "\r\n<p><span>An equilateral triangle</span></p>", "option4": "\r\n<p><span>A right angled triangle</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>A = (x <sub>1</sub>, y <sub>1</sub>) = (3, 2)</p>\r\n\r\n<p><span>B = (x 2 , y 2 ) = (6, 5)</span></p>\r\n\r\n<p><span>C = (x 3 , y 3 ) = (9, 8)</span></p>\r\n\r\n<p><strong><span>Formula used:</span></strong></p>\r\n\r\n<p><span>Distance between two points = <span class=\"math-tex\">\\(\\sqrt{(x_2 - x_1)^2 + (y_2-y_1)^2}\\)</span></span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>AB =  <span class=\"math-tex\">\\(\\sqrt{(6-3)^2 + (5-2)^2} = \\sqrt{9+9} =3\\sqrt2cm\\)</span></p>\r\n\r\n<p>BC =  <span class=\"math-tex\">\\(\\sqrt{(9-6)^2 + (8-5)^2} = \\sqrt{9+9} = 3\\sqrt2cm\\)</span></p>\r\n\r\n<p>CA =  <span class=\"math-tex\">\\(\\sqrt{(9-3)^2 + (8-2)^2} = \\sqrt{36 + 36} =6\\sqrt2cm\\)</span></p>\r\n\r\n<p>the distance between A and C = AB + BC</p>\r\n\r\n<p>Hence, A, B, and C forms a line segment.</p>\r\n\r\n<p><strong>Hence, the correct option is 2.</strong></p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>In a certain code, 692425 means &#39;School education is free in India&#39; and <span>7926 means &#39;College education is costly&#39; </span>. Which of the following is the code for &#39;I want to become graduate&#39;?</p>", "option1": "\r\n<p>54268</p>", "option2": "\r\n<p>15426</p>", "option3": "\r\n<p>14268</p>", "option4": "\r\n<p>23586</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984161_1742984161346616_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p><strong>Logic : Digits represent the number of letter in a single word in the serial order of the sentence.</strong></p>\r\n\r\n<p>So,</p>\r\n\r\n<ul>\r\n\t<li><span>692425 means &#39;School education is free in India&#39;</span></li>\r\n</ul>\r\n\r\n<p><span>&rArr; School &rarr; 6 letters word</span></p>\r\n\r\n<p><span>&rArr; education &rarr; 9 letters word</span></p>\r\n\r\n<p>&rArr; is &rarr; 2 letters word</p>\r\n\r\n<p>&rArr; free &rarr; 4 letters word</p>\r\n\r\n<p>&rArr; in &rarr; 2 letters word</p>\r\n\r\n<p>&rArr; India &rarr; 5 letters word</p>\r\n\r\n<ul>\r\n\t<li><span>7926 means &#39;College education is costly&#39;</span></li>\r\n</ul>\r\n\r\n<p>&rArr; College &rarr; 7 letters word</p>\r\n\r\n<p>&rArr; <span>education  </span>&rarr; 9 letters word</p>\r\n\r\n<p>&rArr; is &rarr; 2 letters word</p>\r\n\r\n<p>&rArr; costly &rarr; 6 letters word</p>\r\n\r\n<p>Similarly, </p>\r\n\r\n<ul>\r\n\t<li><span>&#39;I want to become graduate&#39;</span></li>\r\n</ul>\r\n\r\n<p>&rArr; I &rarr; 1 letter word</p>\r\n\r\n<p>&rArr; want &rarr; 4 letters word</p>\r\n\r\n<p>&rArr; to &rarr; 2 letters word</p>\r\n\r\n<p>&rArr; become &rarr; 6 letters word</p>\r\n\r\n<p>&rArr; graduate &rarr; 8 letters word</p>\r\n\r\n<p>Hence, <strong>&quot;</strong><span><strong>14268&quot; </strong>is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>The radius of a circular park is 23 m. It has a 4 m wide path inside all around it. Find the cost of paving the path at the rate of Rs. 500/m<sup>2</sup>?</p>", "option1": "\r\n<p>Rs. 2,10,000</p>", "option2": "\r\n<p>Rs. 2,64,000</p>", "option3": "\r\n<p>Rs. 2,60,000</p>", "option4": "\r\n<p>Rs. 2,40,000</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given</strong></p>\r\n\r\n<p>Outer radius, R = 23 m</p>\r\n\r\n<p>Inner radius, r = (23 - 4)m</p>\r\n\r\n<p>&rArr; 19 m</p>\r\n\r\n<p><strong>Concept</strong></p>\r\n\r\n<p>Area of circular path = Area of outer circle - area of inner circle</p>\r\n\r\n<p><strong>Formula used</strong></p>\r\n\r\n<p>Area of path = &pi;(R<sup>2</sup> - r<sup>2</sup>)</p>\r\n\r\n<p>(a<sup>2</sup> - b<sup>2</sup>) = (a + b) (a - b)</p>\r\n\r\n<p><strong>Calculation</strong></p>\r\n\r\n<p>Area of circular path = (22/7) &times; (23<sup>2</sup>- 19<sup>2</sup>)</p>\r\n\r\n<p>&rArr; ( 22/7) &times; (23 + 19) &times; (23 - 19)</p>\r\n\r\n<p>&rArr; (22/7) &times; (42) &times; (4)</p>\r\n\r\n<p>&rArr; 22 &times; 6 &times; 4</p>\r\n\r\n<p>&rArr; 132 &times; 4</p>\r\n\r\n<p>&rArr; 528m<sup>2</sup></p>\r\n\r\n<p>cost of paving the path = 528 &times; 500</p>\r\n\r\n<p>&rArr; Rs. 264000</p>\r\n\r\n<p><strong>&there4; The cost of paving the path is Rs.2,64,000</strong></p>", "question_heading": ""}, {"sr_no": 34, "question": "\r\n<p><span>If the tangents PA and PB from a point P to a circle with centre O are inclined to each other at an angle of 80&deg;, then &ang;POA = _________.</span></p>", "option1": "\r\n<p><span>80&deg;</span></p>", "option2": "\r\n<p>50<span>&deg;</span></p>", "option3": "\r\n<p>25<span>&deg;</span></p>", "option4": "\r\n<p>30<span>&deg;</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>If the tangents PA and PB from a point P to a circle with centre O are inclined to each other at an angle of 80&deg;</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<div>Here,\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984258_1742984258484003_thump.png\" style=\"width: 200px; height: 130px;\" /></figure>\r\n</div>\r\n\r\n<p>OA is perpendicular to PA  &amp; OB is perpendicular to PB, then</p>\r\n\r\n<p>In <span>&Delta;</span>OAP &amp; <span>&Delta;</span>OBP,</p>\r\n\r\n<p>OA = OB (radius)</p>\r\n\r\n<p>OP = OP (common)</p>\r\n\r\n<p>PA = PB (length of tangents drawn from vertex )</p>\r\n\r\n<p>&there4; <span>&Delta;</span>OAP &asymp; <span>&Delta;</span>OPB (by CPCT)</p>\r\n\r\n<p>&there4; <span>&ang;OPA = 1/2 &ang;APB = 40&ordm;</span></p>\r\n\r\n<p><span>In &Delta; OAP,</span></p>\r\n\r\n<p><span>&rArr; &ang;POA + &ang;OPA  + &ang;PAO = 180</span></p>\r\n\r\n<p><span>&rArr; &ang;POA + 40 + 90 = 180</span></p>\r\n\r\n<p><span>&rArr; &ang;POA = 180 - 130 = 50&ordm;</span></p>\r\n\r\n<p><strong><span>&there4; &ang;POA = 50&ordm;</span></strong></p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>The whole surface area of a pyramid whose base is a regular polygon is 260 cm<sup>2</sup> and the area of its base is 120 cm<sup>2</sup>. The area of each lateral face is 20 cm<sup>2</sup>. Then the number of lateral faces is:</p>", "option1": "\r\n<p>7</p>", "option2": "\r\n<p>8</p>", "option3": "\r\n<p>6</p>", "option4": "\r\n<p>5</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>Total surface area = Lateral surface area + Area of Base</p>\r\n\r\n<p>260 = Lateral surface area + 120</p>\r\n\r\n<p>Lateral surface area = 260 &ndash; 120 = 140 cm<sup>2</sup></p>\r\n\r\n<p>Area of each lateral face = 20 cm<sup>2</sup></p>\r\nNumber of lateral faces = 140/20 = 7</div>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n<p>The ratio of sides to a quadrilateral is 2 <span>∶</span> 3 <span>∶</span> 4 <span>∶</span> 5 and the perimeter is 560 cm. Find out the smallest side. (In cm) </p>", "option1": "\r\n<p>84</p>", "option2": "\r\n<p>82</p>", "option3": "\r\n<p>80</p>", "option4": "\r\n<p>78</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>The ratio of arms to the quadrilateral = <span>2 ∶  3  ∶  4  ∶  5</span></p>\r\n\r\n<p>Perimeter of the quadrilateral = 560 cm</p>\r\n\r\n<p><strong>Solution:</strong></p>\r\n\r\n<p>Let&#39;s assume that the sides are 2x, 3x, 4x, and 5x, and the area of the quadrilateral is Ax.</p>\r\n\r\n<p>So, the sum of all the sides of the quadrilateral is:</p>\r\n\r\n<p>2x + 3x + 4x + 5x = 14x</p>\r\n\r\n<p>According to the problem statement, the perimeter of the quadrilateral is 560 cm.</p>\r\n\r\n<p>Using the formula for the perimeter of a quadrilateral, we have:</p>\r\n\r\n<p>perimeter = 14x</p>\r\n\r\n<p>560 cm = 14x</p>\r\n\r\n<p>x = 40 cm</p>\r\n\r\n<p>Therefore, the sides of the quadrilateral are 2x = 80 cm, 3x = 120 cm, 4x = 160 cm, and 5x = 200 cm.</p>\r\n\r\n<p><strong>Therefore, the smallest arm of the quadrilateral is 80 cm.</strong></p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n<p>Nine employees, K, L, M, N, O, P, Q, R and S, are sitting in the office in a straight line, all facing the east. O is third to the right of M. K is third to the left of P. Q is between P and S. N is fourth to the right of M. P is to the immediate right of N. R is fourth to the left of O. Which of the following statements is NOT correct?</p>", "option1": "\r\n<p><span>L is sitting third to the left of O.</span></p>", "option2": "\r\n<p><span>Q is sitting fourth to the right of K.</span></p>", "option3": "\r\n<p><span>R and S are sitting at the corners.</span></p>", "option4": "\r\n<p><span>O is sitting between K and N.</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>Nine employees, K, L, M, N, O, P, Q, R and S, are sitting in the office in a straight line, all facing the east.</span></p>\r\n\r\n<p><span>1) O is third to the right of M.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984363_1742984363700158_thump.png\" style=\"width: 100px; height: 137px;\" /></figure>\r\n\r\n<p><span>2) N is fourth to the right of M and R is fourth to the left of O.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984405_1742984405868518_thump.png\" style=\"width: 100px; height: 188px;\" /></figure>\r\n\r\n<p><span>3) P is to the immediate right of N and Q is between P and S.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984458_1742984458495470_thump.png\" style=\"width: 100px; height: 283px;\" /></figure>\r\n\r\n<p><span>4) K is third to the left of P. </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984514_1742984514569819_thump.png\" style=\"width: 100px; height: 265px;\" /></figure>\r\n\r\n<p>Option 1)  <span>L is sitting third to the left of O &rarr; False (As from the given information <
