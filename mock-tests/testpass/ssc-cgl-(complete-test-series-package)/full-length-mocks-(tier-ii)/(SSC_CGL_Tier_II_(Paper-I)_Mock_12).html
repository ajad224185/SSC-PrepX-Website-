t<li><strong>Hence statement 2 is not correct </strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>The cause for Kheda Satyagraha was that the peasants of the Kheda district were in extreme distress due to a failure of crops and that their appeals for the remission of land revenue </strong>were being ignored by the Government. <strong>Discontinuation of the Plague bonus was the immediate cause for Ahmedabad textile mill strike </strong>.\r\n\t<ul>\r\n\t\t<li><strong>Hence statement 3 is not correct </strong>. </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 84, "question": "\r\n<p><strong>Which of the following words is a synonym of the given word?</strong></p>\r\n\r\n<p>Pernicious</p>", "option1": "\r\n<p>Munificent</p>", "option2": "\r\n<p>Baneful</p>", "option3": "\r\n<p>Exemplary</p>", "option4": "\r\n<p>Evaluative</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot;Baneful&quot;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>&quot;<strong>Pernicious</strong>&quot; means having a harmful effect, especially in a gradual or subtle way.(प्रतिषोधी) \r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- The <strong>pernicious </strong>effects of long-term smoking are widely recognized.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&quot;<strong>Baneful</strong>&quot; means destructive, especially subtly or gradually harmful.(हानिकर)\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>-  His <strong>baneful </strong>influence has led to many organizational problems.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the option that is similar in meaning to the given word is &#39;Baneful&rsquo;.</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is <strong>&lsquo;Option 2&rsquo;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&rsquo;s have a look at the meaning of the remaining options.</li>\r\n\t<li>&quot;<strong>Munificent</strong>&quot; means extremely generous or lavish.(उदार)</li>\r\n\t<li>&quot;<strong>Exemplary</strong>&quot; means representing the best of its kind; worthy of imitation.(आदर्श)</li>\r\n\t<li>&quot;<strong>Evaluative</strong>&quot; means expressing or involving judgment or its value.(मूल्यांकन)</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 85, "question": "\r\n<p>Select the most appropriate option to fill in the blank.</p>\r\n\r\n<p>The ______ has created a havoc in the whole world.</p>", "option1": "\r\n<p>pandemic</p>", "option2": "\r\n<p>prefix</p>", "option3": "\r\n<p>pantomime</p>", "option4": "\r\n<p>panorama</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;pandemic&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the word &#39;havoc&#39; which means  <strong>widespread destruction </strong>.</li>\r\n\t<li>Now, let&#39;s take a look atthe meaning  of the  given options :\r\n\t<ul>\r\n\t\t<li><strong>pandemic </strong>: (of a disease) prevalent over a whole country or the world.\r\n\t\t<ul>\r\n\t\t\t<li><em>Example </em>:<em> Experts warned of the impending threat of a global pandemic if the virus was not contained.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>prefix:  a word, letter, or number placed before another.\r\n\t\t<ul>\r\n\t\t\t<li><em>Example:</em><em>To telephone from the U.S. use the prefix 011 33 before the numbers given here.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>pantomime: a dramatic entertainment, originating in Roman mime, in which performers express meaning through gestures accompanied by music.\r\n\t\t<ul>\r\n\t\t\t<li><em>Example </em>:<em> He is currently starring in pantomime in Weston-super-Mare. </em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>panorama:  a dramatic entertainment, originating in Roman mime, in which performers express meaning through gestures accompanied by music.\r\n\t\t<ul>\r\n\t\t\t<li><em>Example:  Horton looked out over a panorama of fertile valleys and gentle hills.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Let&#39;s take the example of covid. It was declared a pandemic and lots of people died because of it. Thus, it caused widespread destruction.</li>\r\n\t<li>Thus, from above, it is clear that the correct answer is  option 1.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence: </u><em>The <strong>pandemic </strong> has created a havoc in the whole world.</em></p>", "question_heading": ""}, {"sr_no": 86, "question": "\r\n<p>The ________ of the Constitution of India states liberty of thought, expression, belief, faith and worship for the Indian citizens.</p>", "option1": "\r\n<p>Directive Principles of State Policy</p>", "option2": "\r\n<p>Preamble</p>", "option3": "\r\n<p>Fundamental Duties</p>", "option4": "\r\n<p>Fundamental Rights </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>Preamble </strong>&quot;.</p>\r\n\r\n<ul>\r\n\t<li>A <strong>Preamble </strong>is a declaration that <strong>introduces </strong>a document and discusses its <strong>goals </strong>and <strong>ideology </strong>.</li>\r\n\t<li>A <strong>Constitution </strong>outlines the goals of its creators, the background of their work, and the <strong>fundamental ideals </strong>and values of the country.</li>\r\n\t<li>The Preamble makes it clear that the Indian people are the Constitution&#39;s ultimate authoritative source.</li>\r\n\t<li><strong>India </strong>is proclaimed to be a sovereign, <strong>socialist </strong>,<strong>secular </strong>, and democratic republic in the preamble.</li>\r\n\t<li>The <strong>Preamble&#39;s goals </strong>are to uphold the nation&#39;s unity and <strong>integrity </strong>by securing justice, liberty, <strong>equality </strong>, and fraternity for all citizens.</li>\r\n\t<li>The preamble states the day it was <strong>passed </strong>, which is <strong>November 26, 1949 </strong>.</li>\r\n\t<li>Therefore, the correct answer is:<em>Preamble</em></li>\r\n\t<li>Directive Principles of State Policy\r\n\t<ul>\r\n\t\t<li>The Directive Principles of State Policy serve as guidance for how the government should  draft laws .</li>\r\n\t\t<li>Although the principles upon which these provisions&mdash;found in  Part IV  of the  Constitution &mdash;are based are not legally enforceable, the State is still obliged to follow them when formulating any policies and enacting legislation.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Fundamental Duties\r\n\t<ul>\r\n\t\t<li>The  moral responsibility  of all people to support the unity of India and advance patriotism is known as the Fundamental Duty.</li>\r\n\t\t<li>These obligations, which are outlined in  Part IV-A  of the  Constitution , affect both people and the country.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Fundamental Rights (Part-III)\r\n\t<ul>\r\n\t\t<li>Right to Equality (Article 14-18)</li>\r\n\t\t<li>Right to Freedom (Article 19-22)</li>\r\n\t\t<li>Right against Exploitation (Article 23-24)</li>\r\n\t\t<li>Right to Freedom of Religion (Article 25-28)</li>\r\n\t\t<li>Cultural and Educational Rights (Article 29-30)</li>\r\n\t\t<li>Right to Constitutional Remedies (Article 32)</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 87, "question": "\r\n<p>Select the INCORRECTLY spelt word.</p>", "option1": "\r\n<p>Conscious</p>", "option2": "\r\n<p>Vicious</p>", "option3": "\r\n<p>Courtious</p>", "option4": "\r\n<p>Glorious</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>Courtious</strong>&#39;, i.e. it is the incorrectly spelt word.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the options:\r\n\t<ul>\r\n\t\t<li><strong>Conscious</strong>: It is a correctly spelt word which means<strong>aware of and responding to one&#39;s surroundings; awake.</strong></li>\r\n\t\t<li><strong>Vicious</strong>:  It is a correctly spelt word which means <strong>deliberately cruel or violent.</strong></li>\r\n\t\t<li><strong>Courtious</strong>:  There is no such word in the dictionary, the correct spelling is  &#39;<strong>Courteous</strong>&#39;  which means  <strong>polite, respectful, or considerate in manner.</strong></li>\r\n\t\t<li><strong>Glorious</strong>:  It is a correctly spelt word which means <strong>having, worthy of, or bringing fame or admiration.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 3,  i.e. it is the incorrectly spelt word.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 88, "question": "\r\n<p>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</p>\r\n\r\n<p>Beside doing the laundry, / Rakesh helped her / in cooking also / when she was ill.</p>", "option1": "\r\n<p>Beside doing the laundry</p>", "option2": "\r\n<p>in cooking also</p>", "option3": "\r\n<p>Rakesh helped her</p>", "option4": "\r\n<p>when she was ill</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>Beside doing the laundry</strong><strong>&#39; </strong>, i.e. the error lies in this part of the sentence.</p>\r\n\r\n<ul>\r\n\t<li>The error lies  incorrect usage of the preposition &#39;beside&#39;.</li>\r\n\t<li><strong>Beside </strong>,<strong>without the s </strong>, tells us the <strong>location of something </strong>.<strong>Besides </strong>, on the other hand, means <strong>&ldquo;in addition,&rdquo; &ldquo;in addition to,&rdquo; &ldquo;moreover,&rdquo; or &ldquo;as well,&rdquo; </strong>depending on context.</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>Kaia and Rhea sit beside each other in the orchestra&rsquo;s first violin section.</li>\r\n\t\t<li>I dislike fishing; besides, I don&rsquo;t even own a boat.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus,  &#39;besides&#39;  will be used in place of &#39;beside &#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em><strong>Besides </strong> doing the laundry, Rakesh helped her in cooking also when she was ill.</em></p>\r\n\r\n<ul>\r\n\t<li>Preposition:  a word governing, and usually preceding, a noun or pronoun and expressing a relation to another word or element in the clause.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 89, "question": "\r\n<p>What is the theme for World Maritime 2023?</p>", "option1": "\r\n<p>&#39;New technologies for greener shipping&#39;</p>", "option2": "\r\n<p>MARPOL at 50 &ndash; Our commitment goes on</p>", "option3": "\r\n<p>In Stride with the Future&rdquo;</p>", "option4": "\r\n<p>Unlocking the Power of Inclusion for Equitable Growth&quot;</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong><u>MARPOL at 50 &ndash; Our commitment goes on.</u></strong></p>\r\n\r\n<ul>\r\n\t<li>World Maritime Day is observed every year on the <strong>last Thursday of September.</strong></li>\r\n\t<li><strong>In 2023</strong>, it will be observed on <strong>28th September.</strong></li>\r\n\t<li>It helps understand the importance of the marine environment, the impact of industries on the<strong> oceans and marine life </strong>and the well-being of seafarers who spend months away from home.</li>\r\n\t<li>World Maritime Day was<strong> first held on March 17, 1978.</strong></li>\r\n\t<li>World Maritime Day is a global observance and not a public holiday.</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Date</td>\r\n\t\t\t<td>Day</td>\r\n\t\t\t<td>Themes</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>10 September</td>\r\n\t\t\t<td>World First Aid Day</td>\r\n\t\t\t<td>First Aid in the Digital World</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>8 September</td>\r\n\t\t\t<td>World literacy day</td>\r\n\t\t\t<td>Promoting literacy for a world in transition: Building the foundation for sustainable and peaceful societies</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>16 September</td>\r\n\t\t\t<td>World Ozone Day</td>\r\n\t\t\t<td>Montreal Protocol: fixing the ozone layer and reducing climate change</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 90, "question": "\r\n<p>Which of the follwing pair is<em><strong>incorrectly</strong></em>matched?</p>", "option1": "\r\n<p>Vishnu Sharma - Panchtantra</p>", "option2": "\r\n<p>Varahmihir - Mrichkatika</p>", "option3": "\r\n<p>Brahmgupta - Develop the theory of gravity</p>", "option4": "\r\n<p>Vishakhadatta - Mudrarakshasa</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Varahmihir - Mrichkatika</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Gupta Empire:\r\n\t<ul>\r\n\t\t<li>The Gupta dynasty was founded by  Srigupta in 240 AD.</li>\r\n\t\t<li>The period of the Gupta Empire is known as the &lsquo;Classical Age&rsquo; or the  Golden Age of Indian history.</li>\r\n\t\t<li>Fa-Hien was a Chinese pilgrim  who visited India during the reign of <strong>Chandragupta II </strong>on a religious mission.</li>\r\n\t\t<li>Many literary works were composed during this period. They were:\r\n\t\t<ul>\r\n\t\t\t<li>Kalidasa  wrote plays such as A bhijnan Shakuntalam and Meghdootam.</li>\r\n\t\t\t<li>Vishakhadatta  wrote  Mudrarakshasa  which described Chandragupta as a great king.</li>\r\n\t\t\t<li>Bhasa  wrote 13 plays with themes drawn from Ramayana and Mahabharat.</li>\r\n\t\t\t<li>Dandin  wrote  Kavyadarsha and Dasakumaracharita .</li>\r\n\t\t\t<li>Bhairavi  composed  Kiratarjuniya  which describes the battle between  Kirat and Arjuna.  </li>\r\n\t\t\t<li>Vishnu Sharma  wrote  Panchtantra . It is a compilation of various stories with themes or messages.</li>\r\n\t\t\t<li>Varahmihir  was one of the Navratna present in the court of  Chandragupta - II</li>\r\n\t\t\t<li>Varahmihir  wrote three important books  Panchasiddhantika, Brihat Samhita,  and  Brihat Jataka .</li>\r\n\t\t\t<li>He was known for the development of the  theory of the economy.</li>\r\n\t\t\t<li>Barhmagupta  was an Indian mathematician and astronomer known for  Brahma-Siddhanta  and  develop the theory of gravity.</li>\r\n\t\t\t<li>Mrichkatika  is regarded as  one of the oldest play <strong>written in Sanskrit</strong>by  Shudrak</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 91, "question": "\r\n<p>Select the option that can be used as a one-word substitute for the given group of words.</p>\r\n\r\n<p>Represent something as larger, better or worse than it really is</p>", "option1": "\r\n<p>Ridicule</p>", "option2": "\r\n<p>Applaud</p>", "option3": "\r\n<p>Boast</p>", "option4": "\r\n<p>Exaggerate</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Exaggerate&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the  meaning  of the  options:\r\n\t<ul>\r\n\t\t<li>Ridicule:  subject (someone or something) to contemptuous and dismissive language or behaviour.</li>\r\n\t\t<li>Applaud:  show strong approval of (a person or action); praise.</li>\r\n\t\t<li>Boast:  talk with excessive pride and self-satisfaction about one&#39;s achievements, possessions, or abilities.</li>\r\n\t\t<li>Exaggerate:  represent (something) as being larger, better, or worse than it really is.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the  above-given  explanation, we can say that the correct answer is  option 4.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 92, "question": "\r\n<p>Select the most appropriate meaning of the given idiom.</p>\r\n\r\n<p>To rub salt in someone&rsquo;s wound</p>", "option1": "\r\n<p>To use salt as a remedy for a painful wound</p>", "option2": "\r\n<p>To make a bad or painful situation worse</p>", "option3": "\r\n<p>To help in bandaging a wound</p>", "option4": "\r\n<p>To make a medicine for wounds</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39; To make a bad or painful situation worse &#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li> Let&#39;s take a look at the meaning of the given idiom.\r\n\t<ul>\r\n\t\t<li><strong>To rub salt in someone&rsquo;s wound </strong>: It is an idiomatic phrase which means  <strong>to make a difficult situation even worse for someone.</strong>\r\n\r\n\t\t<ul>\r\n\t\t\t<li>Example : Losing was bad enough. Watching them receive the trophy just rubbed salt into the wound.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 2.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n<p>Which Buddhist scholar from Pataliputra adorned the court of Kanishka?</p>", "option1": "\r\n<p>Ashvaghosha</p>", "option2": "\r\n<p>Parshvanatha</p>", "option3": "\r\n<p>Nagasena</p>", "option4": "\r\n<p>Kalidasa </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Ashvaghosha</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Ashvaghosha:</strong>\r\n\r\n\t<ul>\r\n\t\t<li>Ashvaghosha was a <strong>philosopher and poet who is considered India&rsquo;s greatest poet before Kalidasa (5th century) and the father of Sanskrit drama.</strong></li>\r\n\t\t<li>He popularized the style of <strong>Sanskrit poetry known as kavya </strong>.</li>\r\n\t\t<li>Legend obscures the man, but it is known that he was an outspoken <strong>opponent of Buddhism </strong>until, after a heated debate with a noted Buddhist scholar on the relative merits of Hinduism and Buddhism, he accepted the <strong>value of Buddhism </strong>and became a disciple of his erstwhile opponent.</li>\r\n\t\t<li>Ashvaghosha adorned the <strong>court of Kanishka.</strong></li>\r\n\t\t<li>Ashvaghosha spoke at <strong>length on Mahayana (Greater Vehicle) Buddhist doctrine at the fourth Buddhist council, which he helped organize.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Vasumitra:</strong>\r\n\t<ul>\r\n\t\t<li>Vasumitra was a Buddhist monk of the <strong>Sarvastivada school who flourished in the 2 nd century CE </strong>.</li>\r\n\t\t<li>A native of Gandhara, he presided over the <strong>4th Buddhist council in Kashmir, administered by Kanishka I.</strong></li>\r\n\t\t<li>He is credited as contributing to the <strong>Mahavibhasa.</strong></li>\r\n\t\t<li>Vasumitra is the <strong>eighth zen ancestor.</strong></li>\r\n\t\t<li>According to Soto Zen tradition, <strong>Vasumitra &quot;always wore clean clothing.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Nagasena:</strong>\r\n\t<ul>\r\n\t\t<li>Nagasena was a Sarvastivadan Buddhist sage born in <strong>Kishtwar and lived around 150 BC.</strong></li>\r\n\t\t<li>His answers to questions about Buddhism posed by <strong>Menander I (Pali: Milinda), the Indo-Greek king of northwestern India </strong>, are recorded in the Milinda Panha and the <strong>Sanskrit Nagasenabhiksusutra.</strong></li>\r\n\t\t<li>There is a tradition that Nagasena brought to Thailand the first representation of the <strong>Buddha, the Emerald Buddha.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Parshvanatha:</strong>\r\n\t<ul>\r\n\t\t<li>Parshvanatha was the <strong>23 rd of 24 Tirthankaras </strong>(ford-makers or propagators of dharma) of Jainism.</li>\r\n\t\t<li>He is the <strong>only Tirthankara who gained the title of Kalikalkalpataru </strong>(Kalpavriksha in this Kali Yuga).</li>\r\n\t\t<li>He is one of the <strong>earliest Tirthankaras </strong>who are acknowledged as historical figures.</li>\r\n\t\t<li>He was the earliest <strong>exponent of Karma philosophy in recorded history.</strong></li>\r\n\t\t<li>The Jain sources place him between the <strong>9th and 8th centuries BC </strong>whereas <strong>historians consider that he lived in the 8th or 7 th century BC.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": "\r\n<p>Select the most appropriate meaning of the given idiom.</p>\r\n\r\n<p>To know what&rsquo;s what</p>", "option1": "\r\n<p>To be very rude</p>", "option2": "\r\n<p>To know the facts of a situation</p>", "option3": "\r\n<p>To be overconfident</p>", "option4": "\r\n<p>To be in a difficult situation</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39; To know the facts of a situation &#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the meaning of the given idiom.\r\n\t<ul>\r\n\t\t<li><strong>To know what&rsquo;s what </strong>: It is an idiomatic phrase which means <strong>to be cognizant of the full situation; to be familiar with all the facts.</strong>\r\n\r\n\t\t<ul>\r\n\t\t\t<li>Example : Kid, I&#39;ve been doing this job for longer than you&#39;ve been alive, so trust me when I say that I know what&#39;s what around here.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 2.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 95, "question": "\r\n<p>Who has been appointed as the Intel India President?</p>", "option1": "\r\n<p>Anant Maheshwari</p>", "option2": "\r\n<p>Ashish Chowdhary</p>", "option3": "\r\n<p>Sanjay Gupta</p>", "option4": "\r\n<p>Gokul Subramaniam</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct Answer is <u><strong>Gokul Subramaniam</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Intel appoints Gokul Subramaniam as India President.</li>\r\n\t<li><strong>Intel Corporation</strong> has announced the appointment of <strong>Gokul Subramaniam as Intel India President</strong>.</li>\r\n\t<li>Subramaniam, who has been with the company for more than 11 years, will be taking care of their overall engineering and design operations in India, as well as driving innovation, cross-group efficiencies and execution of products. </li>\r\n\t<li>Based out of Bangalore, Subramaniam is currently a Vice President in the Client Computing Group (CCG) and serves as general manager of Client Platforms and Systems.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 96, "question": "\r\n<p>As per the Chola inscriptions, various types of land were present in the Chola administration. Consider the following pairs:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><em><strong>Name of Land</strong></em></td>\r\n\t\t\t<td><em><strong>Type of Land</strong></em></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1. Vellanvagai</td>\r\n\t\t\t<td>For Non-Brahaman peasants</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2. Bramdeva</td>\r\n\t\t\t<td>Land for Brahmans</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3. Shalaboga</td>\r\n\t\t\t<td>Land for Jaina Institutions</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>4. Tirunamattukkani</td>\r\n\t\t\t<td>Land for Schools</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>How many pairs given above are correctly matched?</p>", "option1": "\r\n<p>Only one pair</p>", "option2": "\r\n<p>Only two pairs</p>", "option3": "\r\n<p>Only three pairs</p>", "option4": "\r\n<p>All four pairs</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Only two pairs</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>The  Cholas  who ruled from the  ninth century to the thirteenth century CE (850 &ndash; 1279 CE)  played a very important part in the political and cultural history of South India.</li>\r\n\t<li>The core region of their control- Cholamandalam - was the area around Tanjore up to the East Coast, the Coromandal of later times.</li>\r\n\t<li>The Cholas, as rulers, are known to have existed from remote antiquity. They are mentioned, for the first time in II and XIII Rock Edicts of Ashoka along with the Pandyas and Cheras.</li>\r\n\t<li>The Sangam literature also furnishes much on Chola chiefdoms. </li>\r\n\t<li>As per the Chola inscriptions, various types of land were present in the Chola administration. \r\n\t<ul>\r\n\t\t<li>Vellanvagai -  For non-brahaman peasants<em><strong>-- Hence pair 1 is correctly matched.</strong></em></li>\r\n\t\t<li>Bramdeva -  Land for Brahmans <em>-- Hence pair 2 is correctly matched.</em></li>\r\n\t\t<li>Shalaboga -  Land for Schools <em>-- Hence pair 3 is not correctly matched.</em></li>\r\n\t\t<li>Pallichchhandam -  Land for Jaina Institutions</li>\r\n\t\t<li>Devadana or Tirunamattukkani -  Land Gifted to temples  <em>-- Hence pair 4 is not correctly matched.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Each <strong>brahmadeya </strong>was looked after by an assembly or sabha of prominent Brahmana landholders.</li>\r\n\t<li>These assemblies worked very efficiently. Their decisions were recorded in detail in inscriptions, often on the stone walls of temples.</li>\r\n\t<li>Associations of traders known as <strong>nagarams </strong>also occasionally performed administrative functions in towns.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n<p>Which of the following halogens are solid and liquid at room temperature, respectively?</p>", "option1": "\r\n<p>Fluorine and chlorine</p>", "option2": "\r\n<p>Iodine and bromine</p>", "option3": "\r\n<p>Chlorine and bromine </p>", "option4": "\r\n<p>Bromine and fluorine </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Iodine and bromine.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><u><strong>Iodine and bromine </strong></u>are<u><strong>solid and liquid</strong></u>at<u><strong>room temperature</strong></u>, respectively\r\n\r\n\t<ul>\r\n\t\t<li>At room temperature, the elements in the <strong>halogen group </strong>exist in three distinct <strong>states </strong>of matter.</li>\r\n\t\t<li><strong>Iodine </strong>and <strong>astatine </strong>are <strong>solids </strong>, while <strong>bromine </strong>is a <strong>liquid </strong>and <strong>fluorine </strong>and <strong>chlorine </strong>are <strong>gases </strong>.</li>\r\n\t\t<li>The halogens also come in a variety of <strong>colours </strong>, making this category <strong>highly diversified </strong>.</li>\r\n\t\t<li><strong>Bromine </strong>is <strong>red, astatine </strong>and <strong>iodine </strong>are almost <strong>black </strong>, while <strong>fluorine </strong>and <strong>chlorine </strong>are <strong>green </strong>.</li>\r\n\t\t<li><strong>Iodine </strong>is a <strong>solid </strong>at <strong>ambient temperature </strong>because some experiments allow us to acquire it in <strong>crystal form </strong>. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The physical condition of the bottom elements at ambient temperature is solid as <strong>atomic mass decreases down the group.</strong></li>\r\n\t<li>The <strong>elements at the top </strong>are in a <strong>gaseous state </strong>at <strong>normal temperature </strong>because of their <strong>low molecular mass </strong>.</li>\r\n\t<li>Because <strong>bromine </strong>is in the <strong>middle </strong>of the <strong>group </strong>and has an <strong>atomic mass </strong>that is neither too <strong>high </strong>nor too <strong>low </strong>to be a gas, it is a <strong>solid </strong>.</li>\r\n\t<li>The element <strong>bromine </strong>is therefore a <strong>liquid </strong>at ambient temperature. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 98, "question": "\r\n<p><strong>Select the option that expresses the given sentence in active voice.</strong></p>\r\n\r\n<p>A machine had been developed by Dr. John Gibbon in the US after twenty years.</p>", "option1": "\r\n<p>Dr. John Gibbon was developing a machine in the US after twenty years.</p>", "option2": "\r\n<p>Dr. John Gibbon developed a machine in the US after twenty years.  </p>", "option3": "\r\n<p>Dr. John Gibbon has developed a machine in the US after twenty years.</p>", "option4": "\r\n<p>Dr. John Gibbon had developed a machine in the US after twenty years</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: &quot;<strong>Dr. John Gibbon had developed a machine in the US after twenty years.</strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>Active voice sentences have the subject performing the action, while passive voice sentences have the subject receiving the action.</li>\r\n\t<li>To convert a passive voice sentence to active voice, you need to make the subject the doer of the action and put the verb in the appropriate tense.</li>\r\n\t<li>In this sentence, the subject is &quot;<strong>Dr. John Gibbon</strong>,&quot; and the action is &quot;<strong>developed a machine</strong>.&quot;</li>\r\n\t<li>Since the sentence is in the past perfect tense (&quot;<strong>had been developed</strong>&quot;), we need to use the past perfect tense in the active voice as well (&quot;<strong>had developed</strong>&quot;).</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is <strong>option 4</strong>.</p>", "question_heading": ""}, {"sr_no": 99, "question": "\r\n<p>Select the option that can be used as a one-word substitute for the given group of words.</p>\r\n\r\n<p>Sound reflected back as in mountains</p>", "option1": "\r\n<p>Ebony</p>", "option2": "\r\n<p>&Eacute;clair</p>", "option3": "\r\n<p>Eclipse</p>", "option4": "\r\n<p>Echo</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Echo&#39;.</p>\r\n\r\n<ul>\r\n\t<li> Let&#39;s take a look at the  meaning  of the  options:\r\n\t<ul>\r\n\t\t<li>Ebony:  a tree of tropical and warm-temperate regions which produces ebony.</li>\r\n\t\t<li>Eclair:  a small, soft, log-shaped pastry filled with cream and typically topped with chocolate icing.</li>\r\n\t\t<li>Eclipse:  an obscuring of the light from one celestial body by the passage of another between it and the observer or between it and its source of illumination.</li>\r\n\t\t<li>Echo:  a repetition of sound produced by the reflection of sound waves from a wall, mountain, or other obstructing surfaces.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the  above-given  explanation, we can say that the correct answer is  option 4.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 100, "question": "\r\n<p>Out of the four alternatives, choose the one which best expresses the meaning of the given word.</p>\r\n\r\n<p>VAGARY</p>", "option1": "\r\n<p>Unpredictable change</p>", "option2": "\r\n<p>Companionship</p>", "option3": "\r\n<p>Lapse of memory</p>", "option4": "\r\n<p>Gang</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>Unpredictable change</strong>&quot;.</p>\r\n\r\n<ul>\r\n\t<li>The word &quot;<strong>vagary</strong>&quot; is a noun that describes an unexpected or unpredictable change or variation in behavior, action, or thought.</li>\r\n\t<li>It often refers to <strong>whims, caprices, or unpredictable instances</strong> that deviate from the norm or what is usually expected.\r\n\t<ul>\r\n\t\t<li><strong>Synonyms</strong>: <strong>Caprice, Whim</strong></li>\r\n\t\t<li><strong>Example sentence:</strong> &quot;The vagaries of the weather made it difficult to plan the outdoor event.&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the correct answer will be <strong>Option 1.</strong></li>\r\n\t<li><strong>Option 2: &quot;Companionship&quot;</strong> - This is a noun referring to the good feeling that comes from being with someone else, which doesn&#39;t align with the unpredictability or capriciousness implied by &quot;vagary&quot;. Example sentence: &quot;Many people get pets for the companionship they offer.&quot;</li>\r\n\t<li><strong>Option 3: &quot;Lapse of memory&quot;</strong> - This is a phrase referring to a momentary forgetfulness or failing to remember something, which is not the same as an unpredictable change or variation. Example sentence: &quot;During the interview, he had a brief lapse of memory and forgot the question.&quot;</li>\r\n\t<li><strong>Option 4: &quot;Gang&quot;</strong> - This is a noun referring to an organized group of criminals, or a group of people who associate closely, which doesn&#39;t match the meaning of &quot;vagary&quot;. Example sentence: &quot;The police are working to dismantle the local gangs.&quot;</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 101, "question": "\r\n<p>Which one of the following statements is true about the human circulatory system?</p>", "option1": "\r\n<p>Veins have thick walls and no valves present.</p>", "option2": "\r\n<p>Deoxygenated blood is blue in colour.</p>", "option3": "\r\n<p>Dark clot formed over a cut is due to white blood cells.</p>", "option4": "\r\n<p>Veins carry deoxygenated blood.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct answer is Veins carry deoxygenated blood.</p>\r\n\r\n<p><strong>Concept:</strong></p>\r\n\r\n<p><strong>Human circulatory system: </strong></p>\r\n\r\n<ul>\r\n\t<li>It is also called the blood-vascular system. </li>\r\n\t<li>It consists of a muscular chambered heart, a network of closed branching blood vessels, and blood, the fluid which is circulated.</li>\r\n</ul>\r\n\r\n<p><strong>Explanation:</strong></p>\r\n\r\n<ul>\r\n\t<li>The human heart is a four-chambered muscular organ responsible for pumping blood throughout the body. It consists of two upper chambers called atria (singular: atrium) and two lower chambers called ventricles.</li>\r\n\t<li>The heartbeat is the result of rhythmic contraction (systole) and relaxation (diastole) of the heart&#39;s muscles. During systole, the heart contracts, pumping blood into the arteries. During diastole, the heart relaxes, allowing the chambers to fill with </li>\r\n\t<li>The upper two chambers are called the atria, and the lower two chambers are called the ventricles. The atria receive blood from various parts of the body and pump it into the ventricles. The ventricles then contract to pump blood out of the heart to the lungs (right ventricle) and the rest of the body (left ventricle).</li>\r\n\t<li>Veins have thick walls and no valves present.&quot; This is incorrect. Veins have relatively thinner walls in comparison to arteries. This is because the pressure in veins is much lower than in arteries, so they do not need to be as strong. Additionally, veins do possess valves. These one-way valves support the return of blood to the heart by preventing backflow, which is crucial considering the blood in veins is under lower pressure and might not otherwise flow &#39;upward&#39; against gravity (from the lower limbs, for instance).</li>\r\n\t<li>&quot;Deoxygenated blood is blue in color.&quot; This statement is incorrect. Deoxygenated blood is not blue; it is actually a dark red color. The idea that it seems blue is due to the way that skin and tissues absorb and reflect different wavelengths of light.</li>\r\n\t<li>&quot;Dark clot formed over a cut is due to white blood cells.&quot; This is also incorrect. The dark clot or &quot;scab&quot; that forms over a cut is not primarily due to white blood cells but rather the action of platelets and a protein called fibrin. Following an injury, platelets in your blood stick together to form a plug, while fibrin forms a mesh that hardens, creating a clot that prevents further bleeding. While white blood cells are part of the immune system&#39;s response to a wound, their main job is to combat infection, not to form clots.</li>\r\n</ul>\r\n\r\n<p><strong> Blood Vessels:</strong></p>\r\n\r\n<ul>\r\n\t<li>There are different types of blood vessels in our body each carrying out specialized functions.</li>\r\n\t<li>Three types of blood vessels are Arteries, Veins, and Capillaries.</li>\r\n</ul>\r\n\r\n<p><strong>Arteries:</strong></p>\r\n\r\n<ul>\r\n\t<li>These are thick-walled blood vessels that carry oxygenated blood from the heart to different organs.</li>\r\n\t<li>Pulmonary arteries are exceptions because they carry deoxygenated blood from the heart to the lungs, where the oxygenation of blood takes place.</li>\r\n</ul>\r\n\r\n<p><strong>Veins:</strong></p>\r\n\r\n<ul>\r\n\t<li>These are thin-walled blood vessels that carry deoxygenated blood from different organs to the heart.</li>\r\n\t<li>Pulmonary veins are exceptions because they carry oxygenated blood from the lungs to the heart.</li>\r\n\t<li>Valves are present in veins to prevent back-flow of blood.</li>\r\n</ul>\r\n\r\n<p><strong>Capillaries:</strong> These are the blood vessels that have single-celled walls. </p>", "question_heading": ""}, {"sr_no": 102, "question": "\r\n<p>Consider the following pairs:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Channel</strong></td>\r\n\t\t\t<td><strong>Landmass</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1. Ten Degree Channel</td>\r\n\t\t\t<td>separates the Andaman Islands from the Nicobar Islands</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2. Nine Degree Channel</td>\r\n\t\t\t<td>separates the island of Minicoy from the main Lakshadweep archipelago</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3. Eight Degree Channel</td>\r\n\t\t\t<td>separates the islands of Minicoy and Maldives.</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>Which of the above pairs is/are correctly matched?</p>", "option1": "\r\n<p>1 only</p>", "option2": "\r\n<p> 2 and 3 only</p>", "option3": "\r\n<p>1 and 3 only</p>", "option4": "\r\n<p>1, 2 and 3</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>1, 2, and 3.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Ten Degree Channel</strong>\r\n\r\n\t<ul>\r\n\t\t<li>It is a channel that <strong>separates the Andaman Islands or Little Andaman from the Nicobar Islands </strong>in the Bay of Bengal, India. and forms the Indian Union Territory of Andaman and Nicobar Islands.<em>Hence pair 1 is correct.</em></li>\r\n\t\t<li>It is <strong>150km wide from north to south and 10km long from east to west </strong>with a minimum depth of 7.3m.</li>\r\n\t\t<li>It is so named as it lies on the <strong>10-degree line of latitude, </strong>north of the equator. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Nine Degree Channel</strong>\r\n\t<ul>\r\n\t\t<li>It separates the <strong>island of Minicoy from the main Lakshadweep archipelago. </strong><em>Hence pair 2 is correct.</em></li>\r\n\t\t<li>The <strong>Kalpeni and Suheli Par, and Maliku Atoll and Amindivi Subgroup </strong>together form the Union Territory of Lakshadweep. </li>\r\n\t\t<li>It is <strong>200 km wide </strong>with a <strong>depth of 2597 meters. </strong></li>\r\n\t\t<li>It is strategically important as it is the <strong>passage of nearly all merchant shipping between Europe, the Middle East, and Western Asia with South-East Asia and the Far East.</strong></li>\r\n\t\t<li>It is so named as it lies on the <strong>9-degree line of Latitude, </strong>north of the equator.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Eight Degree Channel</strong>\r\n\t<ul>\r\n\t\t<li>The maritime boundary between the <strong>Maldives and India runs through the Eight Degree Channel. <em>Hence pair 3 is correct.</em></strong></li>\r\n\t\t<li>It separates the <strong>islands of Minicoy and Maldives.</strong></li>\r\n\t\t<li><strong>Maliku Kandu and Māmalē Kandu Divehi </strong>are the traditional names of the Eight Degree Channel. </li>\r\n\t\t<li>It is so named as it lies on the <strong>8-degree line of Latitude, </strong>north of the equator.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 103, "question": "\r\n<p><strong>Direction: Select the most appropriate antonym of the given word.</strong></p>\r\n\r\n<p>Irreverent  </p>", "option1": "\r\n<p>Restoration</p>", "option2": "\r\n<p>Respectful</p>", "option3": "\r\n<p>Dormant</p>", "option4": "\r\n<p>Relevant</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot;Respectful.&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>&quot;Irreverent&quot;</strong> means lacking respect or showing disrespect. (किसी के प्रति आदर का अनुभव न करने वाला या न दिखने वाला; अनादरपूर्ण)\r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>: <em>This comedy takes an <u><strong>irreverent</strong></u> look at the world of politics.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>&quot;Respectful&quot;</strong> is the antonym of<strong> &quot;Irreverent.&quot;</strong></li>\r\n\t<li><strong>&quot;Respectful&quot; </strong>means showing or feeling respect. (आदरपूर्ण, श्रद्घायुक्त)\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>: <em>The <u><strong>respectful</strong></u> speaker approached the subject with sensitivity.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The correct answer is Option 2.</li>\r\n\t<li><strong>Restoration</strong> means the act of bringing something back to its original condition. (किसी वस्&zwj;तु की मूल दशा में वापसी, मरम्&zwj;मत, जीर्णोद्धार, मूल रूप निरूपण; इसके लिए उठाए गए क़दम)</li>\r\n\t<li><strong>Dormant</strong> means inactive or not currently active. (कुछ समय के लिए निष्क्रिय)</li>\r\n\t<li><strong>Relevant</strong> means closely connected or appropriate to the matter at hand. (प्रासंगिक, संबद्घ (विचार किए जा रहे विषय या जो हो रहा है उससे संबद्घ))</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 104, "question": "In थुicु यnध यी पुध ीियियथing ौयiिस, पुध Sयiिस ोनध नicु in iनयn यसiकधौ ृहप ूययन in niपनयgधn ोnक िiंध ोnक ोनध हnौहiपोृिध ीयन ोgनicिहपहनध कहध पय ुigु cयnपधnप यी ोciकiपद?", "option1": "\r\n<p>Arid Soils</p>", "option2": "\r\n<p>Laterite soils</p>", "option3": "\r\n<p>Alluvial Soils</p>", "option4": "\r\n<p>Regur Soils</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong><u>Laterite Soils.</u></strong></p>\r\n\r\n<p><strong>Laterite Soils</strong></p>\r\n\r\n<ul>\r\n\t<li>The word Laterite is <strong>derived from the Latin word &lsquo;later&rsquo; which means &lsquo;brick&rsquo;.</strong></li>\r\n\t<li>Laterite is a <strong>soil and rock type rich in iron and aluminium </strong>and is commonly considered to have <strong>formed in hot and wet tropical areas.</strong></li>\r\n\t<li>Nearly all laterites are of <strong>rusty-red colouration </strong>, because of their <strong>high iron oxide content.</strong></li>\r\n\t<li>They <strong>develop by intensive and long-lasting weathering </strong>of the underlying parent rock.</li>\r\n\t<li>Laterite soil is reddish to yellow in colour with a <strong>lower content of potassium, phosphorus, nitrogen, lime, and magnesia </strong>with 90 to 100% of aluminium, iron, titanium, &amp; manganese oxides. <em><strong>Hence option 2 is correct.</strong></em></li>\r\n\t<li>It is formed under conditions of <strong>heavy rainfall with alternate wet and dry periods, and high temperature </strong>which leads to leaching of soil, leaving only oxides of aluminium and iron.</li>\r\n\t<li>The <strong>lacks fertility </strong>because of the <strong>lower base-exchanging capacity </strong>and a <strong>lower content of phosphorus, nitrogen, and potassium </strong>.</li>\r\n\t<li>They are <strong>found along the edge of the plateau </strong>in the east covering <strong>small parts of Tamil Nadu, Odisha and a small part of Chhotanagpur in the north and Meghalaya in the northeast.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 105, "question": "\r\n<p><strong>Given below are the four sentences in jumbled order. Pick the option that gives their correct order.</strong></p>\r\n\r\n<p>A. The Mughal empire began to decline rapidly since the reign of its last great ruler Aurangzeb</p>\r\n\r\n<p>B. Even in the first half of the seventeenth century its capital Delhi was considered to be the major power center in the entire eastern hemisphere;</p>\r\n\r\n<p>C. Founded by Babur in 1526 and expanded to its full glory by Emperor Akbar in the second half of the sixteenth century,</p>\r\n\r\n<p>D. but within fifty years the signs of the decline of this mighty empire were unmistakably visible.</p>", "option1": "\r\n<p>CABD</p>", "option2": "\r\n<p>DACB</p>", "option3": "\r\n<p>CBDA</p>", "option4": "\r\n<p>CBAD</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> &#39;CABD&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Sentence C </strong>will be the first sentence because it tells about the foundation of the empire. The beginning of the empire in 1526 by Babur.</li>\r\n\t<li><strong>Sentence A</strong> will be the next sentence because it tells about the beginning of the Mughal empire after the death of its last great ruler Aurangzeb.</li>\r\n\t<li><strong>Sentence B </strong>will be the next sentence because it talks about the condition of the declining empire in the first half of the seventeenth century.</li>\r\n\t<li><strong>Sentence D</strong> will be the last sentence because it connects the previous sentence it talks about finally the decline of the Mughal empire within fifty years.</li>\r\n</ul>\r\n\r\n<p>Thus, the correct sequence is,</p>\r\n\r\n<ul>\r\n\t<li>C . Founded by Babur in 1526 and expanded to its full glory by Emperor Akbar in the second half of the sixteenth century,</li>\r\n\t<li>A. The Mughal empire began to decline rapidly since the reign of its last great ruler Aurangzeb</li>\r\n\t<li>B. Even in the first half of the seventeenth century its capital Delhi was considered to be the major power center in the entire eastern hemisphere;</li>\r\n\t<li>D. but within fifty years the signs of the decline of this mighty empire were unmistakably visible.</li>\r\n</ul>\r\n\r\n<p><u><em><strong>Correct answer: </strong></em></u> CABD</p>", "question_heading": ""}, {"sr_no": 106, "question": "\r\n<p><strong>Which of the following words is an antonym for the given word?</strong></p>\r\n\r\n<p>Placid</p>", "option1": "\r\n<p>Lively</p>", "option2": "\r\n<p>Turbulent</p>", "option3": "\r\n<p>Harmonious</p>", "option4": "\r\n<p>Tranquil</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> &quot;Turbulent&quot;.</strong></p>\r\n\r\n<ul>\r\n\t<li>&quot;<strong>Placid</strong>&quot; means not easily upset or excited; calm.(शांत) \r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- Despite the chaos around him, he remained <strong>placid</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&quot;<strong>Turbulent</strong>&quot; means characterized by conflict, disorder, or confusion; uncontrolled.(अशांत)\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- The political situation in the country is <strong>turbulent</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the option that is opposite in meaning to the given word is &#39;Turbulent&rsquo;.</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is <strong>&lsquo;Option 2&rsquo;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>Let&rsquo;s have a look at the meaning of the remaining options.</li>\r\n\t<li>&quot;<strong>Lively</strong>&quot; means full of life and energy; active.(जीवंत)</li>\r\n\t<li>&quot;<strong>Harmonious</strong>&quot; means forming a pleasing or consistent whole; free from dissent.(समंजस्यपूर्ण)</li>\r\n\t<li>&quot;<strong>Tranquil</strong>&quot; means free from disturbance; calm.(शांत)</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 107, "question": "\r\n<p><strong>Direction: Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p>\r\n\r\n<p>A. A man of that character is free from fear, free from hatred.<br />\r\nB. And it is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. <br />\r\nC. Unless that kind of transformation occurs, you are not an authentically religious man.<br />\r\nD. Religion is not a matter of mere dogmatic conformity.<br />\r\nE. It is the remarking of your own self, the transformation of your nature.</p>", "option1": "\r\n<p>ADEBC</p>", "option2": "\r\n<p>DEBCA</p>", "option3": "\r\n<p>ACBDE</p>", "option4": "\r\n<p>DBECA</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>DBECA </strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the sequence of the sentence.\r\n\t<ul>\r\n\t\t<li><strong>Statement D </strong>is the opening of the sentence as it introduces the subject and theme of the passage which is &#39;Religion is not a matter of mere dogmatic conformity&#39;.</li>\r\n\t\t<li><strong>Statement B </strong>is the second statement of the sentence as it adds more complication by telling us that religion is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. </li>\r\n\t\t<li><strong>Statement E </strong>is the third statement of the sentence as it continues further information that religion is not a question of ceremonial piety, but it is the remarking of your own self, the transformation of our nature.</li>\r\n\t\t<li><strong>Statement C </strong>is the fourth statement of the sentence as it tells us that unless that kind of transformation of our nature occurs, we are not authentically religious man.</li>\r\n\t\t<li><strong>Statement A </strong>is the fifth statement of the sentence as it concludes the passage by saying that with this kind of transformation a man can become fearless and hatred free. </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (4).</strong></p>\r\n\r\n<p><strong><u>Correct sequence:</u></strong></p>\r\n\r\n<ul>\r\n\t<li>D. Religion is not a matter of mere dogmatic conformity.</li>\r\n\t<li>B. And it is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. </li>\r\n\t<li>E. It is the remarking of your own self, the transformation of your nature.</li>\r\n\t<li>C. Unless that kind of transformation occurs, you are not an authentically religious man.</li>\r\n\t<li>A. A man of that character is free from fear, free from hatred.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 108, "question": "\r\n<p>The formal proclamation of Swadeshi movement was made for the first time through which among the following?</p>", "option1": "\r\n<p>Congress Calcutta session, 1906</p>", "option2": "\r\n<p>Boycott Resolution, 1905</p>", "option3": "\r\n<p>Congress Banaras session, 1905</p>", "option4": "\r\n<p>Nehru Report, 1928</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong> <u>Boycott Resolution, 1905.</u></strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Lord Curzon </strong>, the then Viceroy of India, announced the <strong>partition of Bengal in July 1905 </strong>.</li>\r\n\t<li>Ignoring a loud public opinion against the partition proposal, the government announced the partition of Bengal in July 1905.</li>\r\n\t<li>Within days, protest meetings were held in small towns all over Bengal. It was in these meetings that the pledge to boycott foreign goods was first taken.</li>\r\n\t<li>On <strong>7 August 1905 </strong>, with the passage of the <strong>Boycott Resolution </strong>in a massive meeting held in the <strong>Calcutta Townhall </strong>,<strong>the formal proclamation of the Swadeshi Movement </strong>was made.<em><strong>Hence, option 2 is the correct answer.</strong></em></li>\r\n\t<li>Vande Mataram became the boycott and Swadeshi movement theme song.</li>\r\n\t<li>After this, the leaders dispersed to other parts of Bengal to propagate the message of a  <strong>boycott of Manchester cloth and Liverpool salt.</strong></li>\r\n\t<li>Swadeshi movement was launched as a protest movement which also gave a led to the Boycott movement in the country.</li>\r\n\t<li>16 October 1905, the day the partition formally came into force, was observed as a day of mourning throughout Bengal.\r\n\t<ul>\r\n\t\t<li> The Indian National Congress under the  Presidentship of G.K.Gokhale  formally  approved the Swadeshi Movement at Banaras session  in December  1905 .</li>\r\n\t\t<li>Objectives:\r\n\t\t<ul>\r\n\t\t\t<li>Condemn the partition of Bengal,</li>\r\n\t\t\t<li>Condemn the reactionary policies of Curzon, and</li>\r\n\t\t\t<li>Support the anti-partition and Swadeshi Movement of Bengal.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>A big step forward was taken at the <strong>Congress session held at Calcutta (1906) </strong>under the presidentship of <strong>Dadabhai Naoroji.</strong>\r\n\t<ul>\r\n\t\t<li>In this session,it was declared that the goal of the Indian National Congress was &quot; <strong>self-government or swaraj </strong>like the United Kingdom or the colonies&quot; of Australia or Canada.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The <strong>Nehru Report of 15 August 1928 </strong>(approved on 28 August) was a memorandum to appeal for  <strong>new dominion status and a federal set-up of government for the constitution of India.</strong>\r\n\t<ul>\r\n\t\t<li>It also proposed for the <strong>Joint Electorates with reservation of seats for minorities </strong>in the legislatures.</li>\r\n\t\t<li>It was prepared by a committee of the <strong>All Parties Conference </strong>chaired by Motilal Nehru with his son Jawaharlal Nehru acting as a secretary.</li>\r\n\t\t<li>There were nine other members of this committee.</li>\r\n\t\t<li>The final report was signed by Motilal Nehru and Jawaharlal Nehru, Ali Imam, Tej Bahadur Sapru, Madhav Shrihari Aney, Mangal Singh, Shuaib Qureshi, Subhas Chandra Bose, and G. R. Pradhan</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 109, "question": "\r\n<p>Arrange the establishment of the following political associations chronologically:</p>\r\n\r\n<p>(a) Bombay Association</p>\r\n\r\n<p>(b) Bombay Presidency Association</p>\r\n\r\n<p>(c) Madras Mahajan Sabha</p>\r\n\r\n<p>(d) Poona Sarvajanik Sabha</p>\r\n\r\n<p>Choose the correct option:</p>", "option1": "\r\n<p>(a), (b), (c), (d)</p>", "option2": "\r\n<p>(a), (c), (b), (d)</p>", "option3": "\r\n<p>(a), (d), (c), (b)</p>", "option4": "\r\n<p>(d), (c), (a), (b)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u>(a), (d), (c), (b).</u></p>\r\n\r\n<ul>\r\n\t<li>The Indian National Congress (1885) was not the first political organisation in India, neither an accidental event, but it was the peak of political awakening.</li>\r\n\t<li>However, most of the political associations in the early half of the nineteenth century were dominated by wealthy and aristocratic elements. They were local or regional in character.</li>\r\n\t<li>The political associations of the second half of the nineteenth century came to be increasingly dominated by the educated middle class&mdash;the lawyers, journalists, doctors, teachers, etc., and they had a wider perspective and a larger agenda.</li>\r\n\t<li><strong>Bombay Association  (1852) -  </strong>On the lines of the British India Association of Calcutta, on 26 August 1852, Bombay Association was founded with the object of &#39;reminding from time to time the government authorities in India or in England for the removal of existing evils, and for the prevention of proposed measures which may be deemed injurious or for the introduction of enactment which may tend to promote the general interest of all connected with this country&#39;.</li>\r\n\t<li>The Bombay Association sent a petition to the British Parliament urging the formation of a new legislative council to which Indians should also be represented.</li>\r\n\t<li>It also condemned the policy of exclusion of Indians from all higher services, lavish expenditure on posts given to the Europeans. </li>\r\n\t<li>The Poona Sarvajanik Sabha  was founded in <strong>1870 </strong> by Mahadeo Govind Ranade and others, with the object of serving as a bridge between the government and the people.</li>\r\n\t<li>The Poona Sarvajanik Sabha was established by M. G. Ranade and G. V. Joshi on 2 nd  April 1870.</li>\r\n\t<li>The Madras Mahajan Sabha  was founded in <strong>1884 </strong>by M. Viraraghavachari, B. Subramaniya Aiyer and P. Anandacharlu.</li>\r\n\t<li>The Bombay Presidency Association  was started by Badruddin Tyabji, Pherozshah Mehta and K.T. Telang in <strong>1885 </strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 110, "question": "\r\n<p>Consider the following rivers:</p>\r\n\r\n<p>1. Godavari</p>\r\n\r\n<p>2. Krishna</p>\r\n\r\n<p>3. Cauvery</p>\r\n\r\n<p>4. Tungabhadra</p>\r\n\r\n<p>Which of the above rise from the Western Ghats?</p>", "option1": "\r\n<p>1, 2 and 3</p>", "option2": "\r\n<p>2, 3 and 4</p>", "option3": "\r\n<p>1 and 4</p>", "option4": "\r\n<p>1, 2, 3 and 4</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>option 4.</strong></u></p>\r\n\r\n<p><strong>Godavari river</strong></p>\r\n\r\n<ul>\r\n\t<li>The Godavari is the <strong>largest Peninsular river system </strong>. It is also called the <strong>Dakshin Ganga </strong>.</li>\r\n\t<li>Source: Godavari river rises from <strong>Trimbakeshwar (part of Western Ghats) </strong>near Nasik in Maharashtra and flows for a length of about 1465 km before outfalling into the Bay of Bengal.</li>\r\n\t<li>Drainage Basin: The Godavari basin extends over the states of <strong>Maharashtra, Telangana, Andhra Pradesh, Chhattisgarh and Odisha </strong>in addition to smaller parts in <strong>Madhya Pradesh, Karnataka and the Union territory of Puducherry </strong>.</li>\r\n</ul>\r\n\r\n<p><strong>Krishna river</strong></p>\r\n\r\n<ul>\r\n\t<li>It is <strong>Peninsular India&#39;s second largest </strong>river</li>\r\n\t<li>It rises at an altitude of 1337 metres near Mahabaleshwar in Maharashtra State in the <strong>Western Ghats </strong>.</li>\r\n\t<li>It runs for about 1400 km across the peninsula, from west to east, passing through <strong>Maharashtra, Karnataka, and Andhra Pradesh </strong>.</li>\r\n\t<li>Ghataprabha, Malaprabha, Bhima, and Tungabhadra are the major Krishna tributaries in Karnataka.</li>\r\n</ul>\r\n\r\n<p><strong>Cauvery river</strong></p>\r\n\r\n<ul>\r\n\t<li>The Cauvery River rises at an elevation of 1,341 m at Talakaveri on the <strong>Brahmagiri range (part of western ghats) </strong>near Cherangala village of Kodagu (Coorg) district of Karnataka.</li>\r\n\t<li>The <strong>Cauvery basin extends over </strong> the states of <strong>Tamil Nadu, Karnataka, Kerala </strong>and the Union Territory of <strong>Puducherry </strong>draining an area of 81 thousand Sq.km.</li>\r\n\t<li> It is  <strong>almost a perennial river </strong>with comparatively fewer fluctuations in inflow and is very useful for irrigation and hydroelectric power generation.</li>\r\n</ul>\r\n\r\n<p><strong>Tungabhadra</strong></p>\r\n\r\n<ul>\r\n\t<li>The Tungabhadra is formed by the unification of the Tunga and the Bhadra originating from Gangamula in the <strong>Central Sahyadri.</strong></li>\r\n\t<li>Tungabhadra is the  <strong>largest tributary </strong>of the river Krishna. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 111, "question": "\r\n<p>Kumari Kamala was awarded with Padma Bhushan in 1970. She was recognized for which classical dance form?</p>", "option1": "\r\n<p>Mohiniyattam  </p>", "option2": "\r\n<p>Manipuri </p>", "option3": "\r\n<p>Kathak </p>", "option4": "\r\n<p>Bharatanatyam  </p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Bharatanatyam.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Kumari Kamala</strong> was a renowned<strong> Bharatanatyam dancer, choreographer</strong> and<strong> teacher</strong> from India.</li>\r\n\t<li>Bharatanatyam is one of the <strong>oldest classical dance forms</strong> of India, with its origins in the temples of <strong>Tamil Nadu.</strong></li>\r\n\t<li>It is characterized by<strong> intricate footwork, hand gestures, facial expressions </strong>and body movements that convey emotions and tell stories from Indian mythology and folklore.</li>\r\n\t<li><strong>Manipuri </strong>is a classical dance form from<strong> Manipur,</strong> known for its <strong>graceful movements</strong> and use of <strong>colorful costumes and props.</strong></li>\r\n\t<li><strong>Mohiniyattam </strong>is a classical dance form from <strong>Kerala</strong>, known for its<strong> fluid, graceful movements and subtle expressions.</strong></li>\r\n\t<li><strong>Kathak </strong>is a classical dance form from <strong>North India, </strong>known for its<strong> fast footwork, spins </strong>and storytelling through dance.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 112, "question": "\r\n<p>The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don&rsquo;t find any error, select &lsquo;No error&rsquo; as your answer.</p>\r\n\r\n<p>He worked so hardly / that he won / the dance competition.</p>", "option1": "\r\n<p>that he won</p>", "option2": "\r\n<p>He worked so hardly</p>", "option3": "\r\n<p>the dance competition</p>", "option4": "\r\n<p>No error </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>He worked so hardly</strong><strong>&#39; </strong>, i.e. the error lies in this part of the sentence.</p>\r\n\r\n<ul>\r\n\t<li>The error lies  incorrect usage of the adverb &#39;hardly&#39;.</li>\r\n\t<li>In the given sentence &#39;so....that&#39; is used as a conjunction to express the cause and result of the situation in the sentence.</li>\r\n\t<li><strong>Structure:</strong>\r\n\t<ul>\r\n\t\t<li>So+ adjective+ that+ result.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>You are so beautiful that I can&rsquo;t get my eyes off you.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus,  &#39;hard&#39;  will be used in place of &#39; hardly&#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em>He worked so <strong>hard </strong> that he won the dance competition.</em></p>\r\n\r\n<ul>\r\n\t<li><strong>Conjunction:  </strong>a word used to connect clauses or sentences or to coordinate words in the same clause.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 113, "question": "\r\n<p>Along with West Indies, which other country will host ICC men&#39;s T20 World Cup 2024?</p>", "option1": "\r\n<p>USA</p>", "option2": "\r\n<p>Canada</p>", "option3": "\r\n<p>Spain</p>", "option4": "\r\n<p>France</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct Answer is <u><strong>USA</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Dallas, Florida and New York to host matches in men&#39;s T20 World Cup next year.</li>\r\n\t<li><strong>Dallas, Florida and New York</strong> will host matches at <strong>next year&#39;s men&#39;s T20 World Cup</strong>.</li>\r\n\t<li>The United States will be staging a <strong>global cricket event for the first time</strong> as the sport looks to expand into new territory and get <strong>Olympic status for the 2028 Los Angeles Games.</strong></li>\r\n\t<li>The country will <em>co-host</em> the June 4-30 tournament <strong>with the West Indies</strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 114, "question": "\r\n<p>Bhoota Kola, a spirit worship ritual dance is of which state?</p>", "option1": "\r\n<p>Andhra Pradesh</p>", "option2": "\r\n<p>Tamil Nadu</p>", "option3": "\r\n<p>Kerala</p>", "option4": "\r\n<p>Karnataka</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Karnataka</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Karnataka: </strong></li>\r\n\t<li>This state is located in the <strong>southwestern region of India.</strong></li>\r\n\t<li><strong>Karnataka</strong> is known for various forms of <strong>music, dance, drama, and visual arts.</strong></li>\r\n\t<li><strong>Yakshagana,</strong> a theater form that combines<strong> dance, music, dialogue, costume, make-up, and stage techniques with a unique style and form, is particularly popular.</strong></li>\r\n\t<li><strong>The Bhoota Kola</strong> ritual dance is a spirit worship dance performed mainly in the <strong>coastal districts of the state.</strong></li>\r\n\t<li>In this<strong> traditional ritual, performers dress up as spirits and gods, enacting scenes and stories from local folklore and mythology</strong>.</li>\r\n\t<li><strong>Andhra Pradesh:</strong>\r\n\t<ul>\r\n\t\t<li>It is Located in the southeastern part of the country,<strong> Andhra Pradesh</strong> has a rich cultural history and is known for various forms of dance and music.</li>\r\n\t\t<li>The classical dance form of Kuchipudi originated in this state.</li>\r\n\t\t<li>There are also various folk and tribal dances such as <strong>Butta Bommalu, Tappeta Gullu, and Dhimsa.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Tamil Nadu:</strong>\r\n\t<ul>\r\n\t\t<li>It is Situated in the <strong>southernmost part of India, Tamil Nadu</strong> is known for its distinct <strong>culture and heritage.</strong></li>\r\n\t\t<li><strong>Bharatanatyam</strong>, one of the most popular and respected dance forms of India, originated here.</li>\r\n\t\t<li>The state is also known for its music, literature, and various forms of traditional and folk dances like <strong>Karakattam, Kummi, and Mayil Attam.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Kerala: </strong>\r\n\t<ul>\r\n\t\t<li>This <strong>southwestern state</strong> is known for its <strong>unique dance forms and cultural rituals</strong>.</li>\r\n\t\t<li><strong>Kathakali, </strong>a highly stylized<strong> classical Indian dance-drama, and Mohiniyattam,</strong> a classical dance form that represents a dance of an enchantress, are two major classical dance forms from Kerala.</li>\r\n\t\t<li><strong>Theyyam</strong> and <strong>Thirayattam</strong> are popular ritualistic folk arts performed in the <strong>northern part of the state.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 115, "question": "\r\n<p>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</p>\r\n\r\n<p>If he were / to climb the tree / and bring the kitty down, / the child was happy.</p>", "option1": "\r\n<p>and bring the kitty down</p>", "option2": "\r\n<p>the child was happy</p>", "option3": "\r\n<p>to climb the tree</p>", "option4": "\r\n<p>If he were</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;the child was happy &#39;, i.e. the error lies in this part of the sentence.</p>\r\n\r\n<ul>\r\n\t<li>The error lies incorrect usage of past tense in a conditional sentence.</li>\r\n\t<li>The given sentence is an example of a second conditional sentence.</li>\r\n\t<li><strong>Second conditional sentence: </strong>It talks about the <strong>unreal possibility </strong>of something happening in the future. It means that we are thinking about the future. We are thinking about a particular condition in the future and the result of this condition. But there is <strong>not a real possibility </strong>that this condition will happen.</li>\r\n\t<li><strong>Structure </strong>:\r\n\t<ul>\r\n\t\t<li>If+ past simple, would + base verb.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>If I won the lottery, I would buy a scooter.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus,  &#39;would be&#39;  will be used in place of &#39;was &#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:  </u>If he were to climb the tree and bring the kitty down, the child would be happy.</p>\r\n\r\n<ul>\r\n\t<li><strong>Conditional sentence: </strong> The word &quot;condition&quot; means &quot;situation or circumstance&quot;. If a particular condition is true, then a particular result happens.</li>\r\n\t<li>Types of the conditional sentences:</li>\r\n</ul>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Conditional <br />\r\n\t\t\tType</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Usage     </strong></th>\r\n\t\t\t<th scope=\"col\"><strong>If clause</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Main Clause</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Example</strong></th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Zero<br />\r\n\t\t\tConditional</strong></th>\r\n\t\t\t<td>real condition + inevitable result</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>If you heat ice, it melts.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>First Conditional</strong></th>\r\n\t\t\t<td>possible condition + probable result</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>will + base verb</td>\r\n\t\t\t<td>If I win the lottery, I will buy a car.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Second Conditional</strong></th>\r\n\t\t\t<td>hypothetical condition + possible result</td>\r\n\t\t\t<td>past simple</td>\r\n\t\t\t<td>would + base verb</td>\r\n\t\t\t<td>If I won the lottery, I would buy a car.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Third Conditional</strong></th>\r\n\t\t\t<td>expired past condition + possible past result</td>\r\n\t\t\t<td>past perfect</td>\r\n\t\t\t<td>would have + past participle</td>\r\n\t\t\t<td>If I had won the lottery, I would have bought a car.</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 116, "question": "\r\n<p>What is the law in which under the same above conditions of temperature and pressure, equal volumes of all gases contain equal number of molecules?</p>", "option1": "\r\n<p>Graham&#39;s law</p>", "option2": "\r\n<p>Pascal&#39;s law</p>", "option3": "\r\n<p>Avogadro&#39;s law</p>", "option4": "\r\n<p>Coriolis effect</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Avogadro&#39;s law.</strong></u></p>\r\n\r\n<ul>\r\n\t<li> Avogadro&#39;s law is an <strong>experimental gas law relating the volume of a gas to the amount of substance of gas present.</strong></li>\r\n\t<li>The law is a specific case of the ideal gas law. Avogadro&#39;s law states that &quot;<strong>equal volumes of all gases, at the same temperature and pressure, have the same number of molecules.</strong></li>\r\n\t<li>The law is named after <strong>Amedeo Avogadro who, in 1812</strong>, hypothesized that <strong>two given samples of an ideal gas, </strong>of the same volume and at the same <strong>temperature and pressure,</strong> contain the same number of molecules.</li>\r\n</ul>\r\n\r\n<p><strong>Coriolis Effect:</strong></p>\r\n\r\n<ul>\r\n\t<li>The Coriolis effect is the<strong> pattern of deflection</strong> which objects take while travelling through long distances on Earth.</li>\r\n\t<li>The key to the Coriolis effect is the <strong>result of Earth&rsquo;s rotation.</strong></li>\r\n</ul>\r\n\r\n<p><strong>Graham&#39;s Law</strong>: </p>\r\n\r\n<ul>\r\n\t<li>Graham&#39;s law states that <strong>the rate of diffusion or effusion of a gas</strong> is inversely proportional to the square root of its molar mass. </li>\r\n</ul>\r\n\r\n<p><strong>Pascal&#39;s Principle:</strong></p>\r\n\r\n<ul>\r\n\t<li>Pascal&rsquo;s principle: Pascal&rsquo;s Law is the <strong>principle of transmission of fluid pressure.</strong></li>\r\n\t<li>It says that &quot;a <strong>pressure exerted anywhere in a point of the confined fluid is transmitted equally in all directions throughout the fluid</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 117, "question": "\r\n<p>Which of the following statements regarding the Satavahanas is correct?</p>", "option1": "\r\n<p>Satavahanas were the follower of Shaivism</p>", "option2": "\r\n<p>They ruled over central India and many parts of northern India.</p>", "option3": "\r\n<p>The official language of the Satavahanas was Prakrit.</p>", "option4": "\r\n<p>Gautamiputra Satakarni was the founder of Satavahana Dynasty.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>The official language of the Satavahanas was Prakrit</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>The founder of the <strong>Satavahana dynasty </strong>was  Simuka .  <em>Hence, statement 4 is incorrect.</em></li>\r\n\t<li>The Satavahanas established their independent rule after the decline of the Mauryas.</li>\r\n\t<li>Satavahanas ruled over parts of  western and central India.  <em>Hence, statement 2 is incorrect.</em></li>\r\n\t<li>Their rule lasted for about  450 years .</li>\r\n\t<li>They were also known as  the Andhras .</li>\r\n\t<li>The  Puranas and inscriptions  remain important sources for the history of Satavahanas.</li>\r\n\t<li>Among the inscriptions, the Nasik and Nanaghad inscriptions throw much light on the reign of Gautamiputra Satakarni.</li>\r\n\t<li>The coins issued by the Satavahanas are also helpful in knowing the economic conditions of that period.</li>\r\n\t<li>Satvahana rulers  worshipped a large number of  Vaishnava gods  such as  Krishna, Vasudeva , and others. <em>Hence, statement 1 is incorrect.</em></li>\r\n\t<li>They paid liberal sacrificial fees to the Brahmanas.</li>\r\n\t<li>The  official language  of the Satavahanas was  Prakrit .  <em>Hence, statement 3 is correct.</em></li>\r\n\t<li>All inscriptions were composed in this language and written in the Brahmi script, as was the case in Ashokan times.</li>\r\n\t<li>Some Satavahana kings may have composed Prakrit books.</li>\r\n\t<li>In the Satavahana phase, many temples and monasteries were  cut out of the solid roc k in the north-western Deccan or Maharashtra with great skill and patience.</li>\r\n\t<li>The two common structures were the temple which was called  chaitya  and the monastery which was called the  vihara .</li>\r\n\t<li><strong>Gautamiputra Satakarni </strong>was the greatest ruler of the Satavahana dynasty.\r\n\t<ul>\r\n\t\t<li>He ruled for a period of 24 years from  106 to 130 A.D.</li>\r\n\t\t<li>His achievements were recorded in the  Nasik inscription by his mother Gautami Balasri.</li>\r\n\t\t<li>Gautamiputra Satakarni captured the whole of Deccan and expanded his empire.</li>\r\n\t\t<li>His victory over  Nahapana , the ruler of Malwa was remarkable.</li>\r\n\t\t<li>He  patronized Brahmanism . Yet, he also gave donations to Buddhists.</li>\r\n\t\t<li>Gautamiputra Satakarni was succeeded by his son  Vashishtaputra Pulamayi.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 118, "question": "\r\n<p>Who hosted the &quot;Green Hydrogen Pilots in India&quot; conference in New Delhi?</p>", "option1": "\r\n<p>NTPC Ltd</p>", "option2": "\r\n<p>SAIL </p>", "option3": "\r\n<p>Union Minister for Power and New and Renewable Energy</p>", "option4": "\r\n<p>National Green Tribunal</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>NTPC Ltd</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>NTPC hosts conference on &#39;Green Hydrogen Pilots in India&#39;</li>\r\n\t<li> A day-long conference on &quot;<em><strong>Green Hydrogen Pilots in India</strong></em>&quot; was held in <strong>New Delhi in the run-up to the G20 Summit.</strong></li>\r\n\t<li>The conference showcased various Green Hydrogen Pilots being implemented by both public and private sector companies in India.</li>\r\n\t<li>The conference which was<strong> hosted by NTPC Ltd</strong>, also presented pioneering innovative pilots and progress in green hydrogen technology.</li>\r\n\t<li>Delivering the inaugural address, <strong>Union Minister for Power and New and Renewable Energy, RK Singh</strong> said that effective measures have to be taken to reduce India&#39;s huge energy import bills. He asserted that this is the moment that India has to seize.</li>\r\n\t<li>The Minister said that India has the potential to be one of the biggest manufacturers of green hydrogen in the world. He added that the Government has set up a huge ecosystem for renewable energy. He said India&#39;s pace of capacity addition in renewable energy is one of the fastest in the world.\r\n\t<ul>\r\n\t\t<li>He said India&#39;s cost of making renewable energy and the cost of producing green hydrogen will be one of the lowest in the world.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 119, "question": "\r\n<p>Which of the following is <strong>not</strong> a vector quantity?</p>", "option1": "\r\n<p>Velocity</p>", "option2": "\r\n<p>Torque</p>", "option3": "\r\n<p>Displacement</p>", "option4": "\r\n<p>Speed</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<u><strong> Speed.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>The distance <strong>covered by an object in a unit time</strong> as the speed of the object.</li>\r\n\t<li>Speed is a <strong>scaler quantity.</strong></li>\r\n\t<li>A scalar quantity is a <strong>quantity with magnitude only</strong>. It is specified completely by a single number, along with the proper unit.<strong> Examples</strong> are : the distance between two points, mass of an object, the temperature of a body and the time at which a certain event happened. </li>\r\n\t<li>A <strong>vector quantity is a quantity</strong> that has both a <strong>magnitude and a direction</strong> and obeys the t<strong>riangle law of addition or equivalently the parallelogram law of addition. </strong></li>\r\n\t<li>So, a vector is specified by <strong>giving its magnitude by a number</strong> and its direction.</li>\r\n\t<li>Some physical quantities that are represented by vectors are <strong>displacement, velocity, acceleration and force.</strong></li>\r\n\t<li><strong>Torque is </strong>a type of force.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 120, "question": "\r\n<p>Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.</p>\r\n\r\n<p>The plant will die unless you <u>will water </u>it every day.</p>", "option1": "\r\n<p>are watering</p>", "option2": "\r\n<p>water</p>", "option3": "\r\n<p>would water</p>", "option4": "\r\n<p>No substitution required</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; water&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The error lies  incorrect usage of future tense i.e. &#39;will&#39;.</li>\r\n\t<li>Let&#39;s take a look at the word &#39;unless&#39; it means the same as <strong>if...not. </strong>Like <strong>if </strong>, unless is followed by <strong>a present tense, a past tense, or a past perfect tense (never by a conditional) </strong>. Unless is used instead of <strong>if...not </strong>in conditional sentences of all types. The order of the clauses doesn&#39;t matter with sentences using unless.</li>\r\n\t<li>Unless is never followed by future tense.</li>\r\n\t<li>Example: \r\n\t<ul>\r\n\t\t<li> You&#39;ll be sick unless you stop eating.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, &#39;water&#39; will be used in place of &#39;will water&#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em>The plant will die unless you <strong>water </strong>it every day.</em></p>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>Select the correctly spelt word.</p>", "option1": "\r\n<p>Recaptulate</p>", "option2": "\r\n<p>Lifelesness</
