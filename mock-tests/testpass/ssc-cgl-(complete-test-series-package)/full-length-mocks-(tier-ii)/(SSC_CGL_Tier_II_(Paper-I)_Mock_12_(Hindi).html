 से कौन सा युग्म <u><strong>गलत</strong></u> सुमेलित है?</p>", "option1": "\r\n<p>विष्णु शर्मा - पंचतंत्र</p>", "option2": "\r\n<p>वराहमिहिर - मृच्छकटिका</p>", "option3": "\r\n<p>ब्रह्मगुप्त - गुरुत्वाकर्षण के सिद्धांत का विकास</p>", "option4": "\r\n<p>विशाखदत्त - मुद्राराक्षस</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>वराहमिहिर - मृच्छकटिका</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>गुप्त साम्राज्य:</strong>\r\n\r\n\t<ul>\r\n\t\t<li>गुप्त वंश की स्थापना <strong>श्रीगुप्त ने 240 ई</strong>. में की थी।</li>\r\n\t\t<li>गुप्त साम्राज्य की अवधि को &#39;शास्त्रीय युग&#39; या <strong>भारतीय इतिहास का स्वर्ण युग </strong>कहा जाता है।</li>\r\n\t\t<li><strong>फाह्यान एक चीनी तीर्थयात्री </strong>था जो<strong> चंद्रगुप्त द्वितीय</strong> के शासनकाल के दौरान एक धार्मिक मिशन पर भारत आया था।</li>\r\n\t\t<li>इस काल में अनेक साहित्यिक कृतियों की रचना हुई। वो थे:\r\n\t\t<ul>\r\n\t\t\t<li><strong>कालिदास</strong> ने <strong>अभिज्ञान शाकुंतलम और मेघदूतम </strong>जैसे नाटक लिखे।</li>\r\n\t\t\t<li><strong>विशाखदत्त</strong> ने <strong>मुद्राराक्षस </strong>लिखा जिसमें चंद्रगुप्त को एक महान राजा बताया गया।</li>\r\n\t\t\t<li><strong>भास</strong> ने रामायण और महाभारत से लिए गए विषयों के साथ 13 नाटक लिखे।</li>\r\n\t\t\t<li><strong>दंडिन ने काव्यादर्श और दशकुमारचरित</strong> की रचना की।</li>\r\n\t\t\t<li><strong>भारवि ने किरातर्जुनीय</strong> की रचना की जिसमें किरात और अर्जुन के बीच युद्ध का वर्णन है।</li>\r\n\t\t\t<li><strong>पंचतंत्र की रचना विष्णु शर्मा</strong> ने की। यह विषयों या संदेशों के साथ विभिन्न कहानियों का संकलन है।</li>\r\n\t\t\t<li><strong>वराहमिहिर चंद्रगुप्त- II </strong>के दरबार में मौजूद नवरत्नों में से एक थे </li>\r\n\t\t\t<li><strong>वराहमिहिर </strong>ने तीन महत्वपूर्ण पुस्तकें <strong>पंचसिद्धांतिका, बृहत संहिता और बृहत जातक</strong> लिखीं।</li>\r\n\t\t\t<li>उन्हें<strong> अर्थव्यवस्था के सिद्धांत</strong> के विकास के लिए जाना जाता था।</li>\r\n\t\t\t<li><strong>बरहमगुप्त </strong>एक भारतीय गणितज्ञ और खगोलशास्त्री थे जो <strong>ब्रह्म-सिद्धांत </strong>के लिए जाने जाते थे और <strong>गुरुत्वाकर्षण के सिद्धांत को विकसित </strong>करते थे।</li>\r\n\t\t\t<li><strong>मृचकटिका को शूद्रकी द्वारा संस्कृत में लिखे गए सबसे पुराने नाटकों में से एक </strong>माना जाता है।</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 91, "question": "\r\n<p>Select the option that can be used as a one-word substitute for the given group of words.</p>\r\n\r\n<p>Represent something as larger, better or worse than it really is</p>", "option1": "\r\n<p>Ridicule</p>", "option2": "\r\n<p>Applaud</p>", "option3": "\r\n<p>Boast</p>", "option4": "\r\n<p>Exaggerate</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Exaggerate&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the  meaning  of the  options:\r\n\t<ul>\r\n\t\t<li>Ridicule:  subject (someone or something) to contemptuous and dismissive language or behaviour.</li>\r\n\t\t<li>Applaud:  show strong approval of (a person or action); praise.</li>\r\n\t\t<li>Boast:  talk with excessive pride and self-satisfaction about one&#39;s achievements, possessions, or abilities.</li>\r\n\t\t<li>Exaggerate:  represent (something) as being larger, better, or worse than it really is.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the  above-given  explanation, we can say that the correct answer is  option 4.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 92, "question": "\r\n<p>Select the most appropriate meaning of the given idiom.</p>\r\n\r\n<p>To rub salt in someone&rsquo;s wound</p>", "option1": "\r\n<p>To use salt as a remedy for a painful wound</p>", "option2": "\r\n<p>To make a bad or painful situation worse</p>", "option3": "\r\n<p>To help in bandaging a wound</p>", "option4": "\r\n<p>To make a medicine for wounds</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39; To make a bad or painful situation worse &#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li> Let&#39;s take a look at the meaning of the given idiom.\r\n\t<ul>\r\n\t\t<li><strong>To rub salt in someone&rsquo;s wound </strong>: It is an idiomatic phrase which means  <strong>to make a difficult situation even worse for someone.</strong>\r\n\r\n\t\t<ul>\r\n\t\t\t<li>Example : Losing was bad enough. Watching them receive the trophy just rubbed salt into the wound.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 2.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n<p>पाटलिपुत्र के किस बौद्ध विद्वान ने कनिष्क के दरबार की शोभा बढ़ाई?</p>", "option1": "\r\n<p>अश्वघोष</p>", "option2": "\r\n<p>पार्श्वनाथ:</p>", "option3": "\r\n<p>नागसेन</p>", "option4": "\r\n<p>कालिदास</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>अश्वघोष</u></strong>है।</p>\r\n\r\n<ul>\r\n\t<li><strong>अश्वघोष:</strong>\r\n\r\n\t<ul>\r\n\t\t<li>अश्वघोष एक <strong>दार्शनिक और कवि</strong> थे <strong>जिन्हें कालिदास (5वीं शताब्दी) से पहले भारत का सबसे महान कवि और संस्कृत नाटक का जनक माना जाता है।</strong></li>\r\n\t\t<li>उन्होंने<strong> काव्य के नाम से जानी जाने वाली संस्कृत</strong> कविता की शैली को लोकप्रिय बनाया।</li>\r\n\t\t<li>दंतकथा से यह स्पष्ट नहीं है, लेकिन यह ज्ञात है कि वह <strong>बौद्ध धर्म के मुखर विरोधी </strong>थे। हालांंकि, हिंदू धर्म और बौद्ध धर्म के सापेक्ष गुणों पर एक प्रसिद्ध बौद्ध विद्वान के साथ गंभीर वाद-विवाद के बाद उन्होंने <strong>बौद्ध धर्म के मूल्य</strong> को स्वीकार कर लिया और अपने पूर्व प्रतिद्वंद्वी के शिष्य बन गए। </li>\r\n\t\t<li>अश्वघोष ने <strong>कनिष्क के दरबार</strong> को सुशोभित किया।</li>\r\n\t\t<li>अश्वघोष ने<strong> चौथी बौद्ध परिषद</strong> (जिसका उन्होंने ही आयोजन किया था ) <strong>में महायान बौद्ध सिद्धांत पर विस्तार से बात की।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>वसुमित्र:</strong>\r\n\t<ul>\r\n\t\t<li>वसुमित्र, <strong>सर्वास्तिवादी  धारा </strong>के बौद्ध भिक्षु थे जो <strong>दूसरी शताब्दी ईस्वी </strong>में फला-फूला।</li>\r\n\t\t<li>वह गांधार के मूल निवासी थे और उन्होंने <strong>कनिष्क प्रथम द्वारा प्रशासित कश्मीर में चौथी बौद्ध परिषद</strong> की अध्यक्षता की।</li>\r\n\t\t<li>उन्हें <strong>महाविभास </strong>में योगदान देने का श्रेय दिया जाता है।</li>\r\n\t\t<li>वसुमित्र <strong>आठवें झेन पूर्वज</strong> हैं।</li>\r\n\t\t<li>सोतो ज़ेन परंपरा के अनुसार, <strong>वसुमित्र &quot;हमेशा साफ कपड़े पहनते थे।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>नागासेन:</strong>\r\n\t<ul>\r\n\t\t<li>नागासेन, लगभग 150 ईसा पूर्व <strong>किश्तवाड़ </strong>में पैदा हुए एक सर्वास्तिवादी बौद्ध ऋषि थे।</li>\r\n\t\t<li><strong>उत्तर पश्चिमी भारत के इंडो-यूनानी राजा मेनेंडर प्रथम (पाली: मिलिंडा)</strong> द्वारा बौद्ध धर्म के बारे में उनके सवालों के जवाब मिलिंद पन्ह और संस्कृत नागसेनभिक्षसूत्र में अभिलिखित हैं।</li>\r\n\t\t<li>एक मान्यता है कि नागसेन <strong>बुद्ध, एमराल्ड बुद्ध</strong> का पहला प्रतिनिधित्व थाईलैंड लाए।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>पार्श्वनाथ :</strong>\r\n\t<ul>\r\n\t\t<li>पार्श्वनाथ जैन धर्म के <strong>24  तीर्थंकरों</strong> (फोर्ड-निर्माता या धर्म के प्रचारक) में से <strong>23वें </strong>तीर्थंकर <strong>थे।</strong></li>\r\n\t\t<li>वह <strong>एकमात्र तीर्थंकर हैं जिन्होंने कालिककल्पतरु</strong> (इस कलियुग में कल्पवृक्ष) की उपाधि प्राप्त की।</li>\r\n\t\t<li>वह उन <strong>शुरुआती तीर्थंकरों</strong> में से एक हैं जिन्हें ऐतिहासिक शख्सियतों के रूप में स्वीकार किया जाता है।</li>\r\n\t\t<li>वह <strong>अभिलिखित इतिहास में कर्म दर्शन</strong> के सबसे शुरुआती <strong>प्रतिपादक </strong>थे।</li>\r\n\t\t<li>जैन सूत्रों ने उन्हें<strong> 8वीं </strong>और 9वीं <strong>शताब्दी ईसा पूर्व</strong> के बीच रखा है जबकि <strong>इतिहासकारों का मानना है कि वह </strong>7वीं<strong> या </strong>8वीं<strong> शताब्दी ईसा पूर्व के थे।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": "\r\n<p>Select the most appropriate meaning of the given idiom.</p>\r\n\r\n<p>To know what&rsquo;s what</p>", "option1": "\r\n<p>To be very rude</p>", "option2": "\r\n<p>To know the facts of a situation</p>", "option3": "\r\n<p>To be overconfident</p>", "option4": "\r\n<p>To be in a difficult situation</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39; To know the facts of a situation &#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the meaning of the given idiom.\r\n\t<ul>\r\n\t\t<li><strong>To know what&rsquo;s what </strong>: It is an idiomatic phrase which means <strong>to be cognizant of the full situation; to be familiar with all the facts.</strong>\r\n\r\n\t\t<ul>\r\n\t\t\t<li>Example : Kid, I&#39;ve been doing this job for longer than you&#39;ve been alive, so trust me when I say that I know what&#39;s what around here.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 2.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 95, "question": "\r\n<p>इंटेल इंडिया के अध्यक्ष के रूप में किसे नियुक्त किया गया है?</p>", "option1": "\r\n<p>अनंत माहेश्वरी</p>", "option2": "\r\n<p>आशीष चौधरी</p>", "option3": "\r\n<p>संजय गुप्ता</p>", "option4": "\r\n<p>गोकुल सुब्रमण्यम</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>गोकुल सुब्रमण्यम</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>इंटेल ने गोकुल सुब्रमण्यम को भारत का अध्यक्ष नियुक्त किया।</li>\r\n\t<li><strong>इंटेल कॉरपोरेशन ने गोकुल सुब्रमण्यम को इंटेल इंडिया का अध्यक्ष नियुक्त करने की</strong> घोषणा की है।</li>\r\n\t<li>सुब्रमण्यम, जो 11 वर्षों से अधिक समय से कंपनी के साथ हैं, भारत में उनके समग्र इंजीनियरिंग और डिज़ाइन संचालन की देखभाल करेंगे, साथ ही नवाचार, क्रॉस-ग्रुप दक्षता और उत्पादों के निष्पादन को बढ़ावा देंगे।</li>\r\n\t<li>बेंगलुरु स्थित, सुब्रमण्यम वर्तमान में क्लाइंट कंप्यूटिंग ग्रुप (CCG) में उपाध्यक्ष हैं और क्लाइंट प्लेटफॉर्म और सिस्टम के महाप्रबंधक के रूप में कार्यरत हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 96, "question": "\r\n<p>चोल अभिलेखों के अनुसार, चोल प्रशासन में विभिन्न प्रकार की भूमि विद्यमान थी। निम्नलिखित युग्मों पर विचार कीजिए:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>भूमि का नाम</strong></td>\r\n\t\t\t<td><strong>भूमि का प्रकार</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1. वेल्लनवगई</td>\r\n\t\t\t<td>गैर-ब्राह्मण किसानों के लिए</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2. ब्रह्मदेय</td>\r\n\t\t\t<td>ब्राह्मणों के लिए भूमि</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3. शालाभोग</td>\r\n\t\t\t<td>जैन संस्थाओं के लिए भूमि</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>4. तिरुनामट्टुक्कनी</td>\r\n\t\t\t<td>विद्यालयों के लिए भूमि</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>उपर्युक्त युग्मों में कितने सही सुमेलित हैं?</p>", "option1": "\r\n<p>केवल एक युग्म</p>", "option2": "\r\n<p>केवल दो युग्म</p>", "option3": "\r\n<p>केवल तीन युग्म</p>", "option4": "\r\n<p>सभी चार युग्म</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>केवल दो  युग्म</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>नौवीं शताब्दी से तेरहवीं शताब्दी ई (850-1279 ई) तक शासन करने वाले चोलों ने दक्षिण भारत के राजनीतिक और सांस्कृतिक इतिहास में बहुत महत्वपूर्ण भूमिका निभाई।</li>\r\n\t<li>उनके नियंत्रण का मुख्य क्षेत्र- चोलामंडलम - तंजौर के आसपास पूर्वी तट तक का क्षेत्र ,बाद के समय का कोरोमंडल था।</li>\r\n\t<li>शासकों के रूप में चोलों का अस्तित्व सुदूर पुरातन काल से माना जाता है। उनका उल्लेख पहली बार अशोक के द्वितीय और तेरहवें शिलालेखों में पांड्यों और चेरों के साथ मिलता है।</li>\r\n\t<li>संगम साहित्य भी चोल सरदारों पर बहुत कुछ प्रस्तुत करता थे।</li>\r\n\t<li>चोल शिलालेखों के अनुसार, चोल प्रशासन में विभिन्न प्रकार की भूमि विद्यमान थी।\r\n\t<ul>\r\n\t\t<li>वेल्लनवगई -  गैर-ब्राह्मण किसानों के लिए <em><strong>-- अत: युग्म 1 सही सुमेलित है।</strong></em></li>\r\n\t\t<li><strong>ब्रह्मदेय</strong> -  ब्राह्मणों के लिए भूमि <em>-- अत: युग्म 2 सही सुमेलित है।</em></li>\r\n\t\t<li>शालाभोग -  विद्यालयों के लिए भूमि <em>-- अत: युग्म 3 सुमेलित नहीं है।</em></li>\r\n\t\t<li><strong>पल्लिच्छंदम</strong> -  जैन संस्थाओं के लिए भूमि</li>\r\n\t\t<li>देवदान या तिरुनामट्टुक्कनी - मंदिरों को भेंट की गई भूमि <em><strong>-- अत: युग्म 4 सुमेलित नहीं है।</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>प्रत्येक ब्रह्मदेय की देखरेख किसी सभा या प्रमुख ब्राह्मण जमींदारों की सभा द्वारा की <strong>जाती</strong> थी।</li>\r\n\t<li>इन सभाओं ने बहुत कुशलता से कार्य किया। उनके निर्णय प्रायः मंदिरों की पत्थर की दीवारों पर अभिलेखों में विस्तार से दर्ज किए गए।</li>\r\n\t<li><strong>नगरम </strong>के रूप में जाने जाने वाले व्यापारियों के संघों ने भी कभी-कभी शहरों में प्रशासनिक कार्य किए।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n<p>निम्नलिखित हेलन में से कौन से हैं जो क्रमशः कमरे के तापमान पर ठोस और तरल हैं?</p>", "option1": "\r\n<p>फ्लोरीन और क्लोरीन</p>", "option2": "\r\n<p>आयोडीन और ब्रोमिन</p>", "option3": "\r\n<p>क्लोरीन और ब्रोमिन</p>", "option4": "\r\n<p>ब्रोमिन और फ्लोरीन</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>इसका सही उत्तर है <u><strong>आयोडीन और ब्रोमिन</strong></u>।</p>\r\n\r\n<ul>\r\n\t<li><u><strong>आयोडीन और ब्रोमीन </strong></u>क्रमशः <u><strong>कमरे के तापमान</strong></u> पर <u><strong>ठोस और तरल </strong></u>होते हैं।\r\n\r\n\t<ul>\r\n\t\t<li>कमरे के तापमान पर, <strong>हलोजन समूह</strong> के तत्व पदार्थ के तीन अलग-अलग <strong>अवस्थाओं</strong> में मौजूद हैं।</li>\r\n\t\t<li><strong>आयोडीन</strong> और <strong>एस्टैटिन ठोस</strong> होते हैं, जबकि <strong>ब्रोमीन</strong> एक <strong>तरल</strong> और <strong>फ्लोरीन</strong> और <strong>क्लोरीन गैस</strong> होते हैं।</li>\r\n\t\t<li>हैलोजन भी विभिन्न <strong>रंगों</strong> में आते हैं, जिससे यह श्रेणी <strong>अत्यधिक विविध</strong> है।</li>\r\n\t\t<li><strong>ब्रोमीन लाल</strong> होता है, <strong>एस्टैटिन</strong> और <strong>आयोडीन</strong> लगभग <strong>काले</strong> होते हैं, जबकि <strong>फ्लोरीन</strong> और <strong>क्लोरीन हरे</strong> होते हैं।</li>\r\n\t\t<li><strong>आयोडीन</strong> परिवेशी तापमान पर एक <strong>ठोस </strong>है क्योंकि कुछ प्रयोग हमें इसे<strong> क्रिस्टल रूप</strong> में प्राप्त करने की अनुमति देते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>वातावरण के तापमान पर निचले तत्वों की भौतिक स्थिति ठोस है क्योंकि <strong>परमाणु द्रव्यमान समूह को कम कर देता </strong>है।</li>\r\n\t<li><strong>शीर्ष पर तत्व </strong>सामान्य तापमान पर गैसीय अवस्था में हैं क्योंकि उनके <strong>कम आणविक द्रव्यमान </strong>है।</li>\r\n\t<li>क्योंकि <strong>ब्रोमीन समूह</strong> के <strong>बीच</strong> में है और एक <strong>परमाणु द्रव्यमान </strong>है जो न तो बहुत <strong>अधिक </strong>है और न ही गैस होने के लिए बहुत <strong>कम</strong> है, यह एक <strong>ठोस </strong>है।</li>\r\n\t<li>इसलिए <strong>ब्रोमिन</strong> तत्व परिवेशी तापमान पर एक <strong>तरल</strong> है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 98, "question": "\r\n<p><strong>Select the option that expresses the given sentence in active voice.</strong></p>\r\n\r\n<p>A machine had been developed by Dr. John Gibbon in the US after twenty years.</p>", "option1": "\r\n<p>Dr. John Gibbon was developing a machine in the US after twenty years.</p>", "option2": "\r\n<p>Dr. John Gibbon developed a machine in the US after twenty years.  </p>", "option3": "\r\n<p>Dr. John Gibbon has developed a machine in the US after twenty years.</p>", "option4": "\r\n<p>Dr. John Gibbon had developed a machine in the US after twenty years</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: &quot;<strong>Dr. John Gibbon had developed a machine in the US after twenty years.</strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>Active voice sentences have the subject performing the action, while passive voice sentences have the subject receiving the action.</li>\r\n\t<li>To convert a passive voice sentence to active voice, you need to make the subject the doer of the action and put the verb in the appropriate tense.</li>\r\n\t<li>In this sentence, the subject is &quot;<strong>Dr. John Gibbon</strong>,&quot; and the action is &quot;<strong>developed a machine</strong>.&quot;</li>\r\n\t<li>Since the sentence is in the past perfect tense (&quot;<strong>had been developed</strong>&quot;), we need to use the past perfect tense in the active voice as well (&quot;<strong>had developed</strong>&quot;).</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is <strong>option 4</strong>.</p>", "question_heading": ""}, {"sr_no": 99, "question": "\r\n<p>Select the option that can be used as a one-word substitute for the given group of words.</p>\r\n\r\n<p>Sound reflected back as in mountains</p>", "option1": "\r\n<p>Ebony</p>", "option2": "\r\n<p>&Eacute;clair</p>", "option3": "\r\n<p>Eclipse</p>", "option4": "\r\n<p>Echo</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Echo&#39;.</p>\r\n\r\n<ul>\r\n\t<li> Let&#39;s take a look at the  meaning  of the  options:\r\n\t<ul>\r\n\t\t<li>Ebony:  a tree of tropical and warm-temperate regions which produces ebony.</li>\r\n\t\t<li>Eclair:  a small, soft, log-shaped pastry filled with cream and typically topped with chocolate icing.</li>\r\n\t\t<li>Eclipse:  an obscuring of the light from one celestial body by the passage of another between it and the observer or between it and its source of illumination.</li>\r\n\t\t<li>Echo:  a repetition of sound produced by the reflection of sound waves from a wall, mountain, or other obstructing surfaces.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the  above-given  explanation, we can say that the correct answer is  option 4.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 100, "question": "\r\n<p>Out of the four alternatives, choose the one which best expresses the meaning of the given word.</p>\r\n\r\n<p>VAGARY</p>", "option1": "\r\n<p>Unpredictable change</p>", "option2": "\r\n<p>Companionship</p>", "option3": "\r\n<p>Lapse of memory</p>", "option4": "\r\n<p>Gang</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>Unpredictable change</strong>&quot;.</p>\r\n\r\n<p>The word &quot;<strong>vagary</strong>&quot; is a noun that describes an unexpected or unpredictable change or variation in behavior, action, or thought.</p>\r\n\r\n<ul>\r\n\t<li>It often refers to <strong>whims, caprices, or unpredictable instances</strong> that deviate from the norm or what is usually expected.\r\n\r\n\t<ul>\r\n\t\t<li><strong>Synonyms</strong>: <strong>Caprice, Whim</strong></li>\r\n\t\t<li><strong>Example sentence:</strong> &quot;The vagaries of the weather made it difficult to plan the outdoor event.&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the correct answer will be <strong>Option 1.</strong></li>\r\n\t<li><strong>Option 2: &quot;Companionship&quot;</strong> - This is a noun referring to the good feeling that comes from being with someone else, which doesn&#39;t align with the unpredictability or capriciousness implied by &quot;vagary&quot;. Example sentence: &quot;Many people get pets for the companionship they offer.&quot;</li>\r\n\t<li><strong>Option 3: &quot;Lapse of memory&quot;</strong> - This is a phrase referring to a momentary forgetfulness or failing to remember something, which is not the same as an unpredictable change or variation. Example sentence: &quot;During the interview, he had a brief lapse of memory and forgot the question.&quot;</li>\r\n\t<li><strong>Option 4: &quot;Gang&quot;</strong> - This is a noun referring to an organized group of criminals, or a group of people who associate closely, which doesn&#39;t match the meaning of &quot;vagary&quot;. Example sentence: &quot;The police are working to dismantle the local gangs.&quot;</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 101, "question": "\r\n\r\n<p>मानव के परिसंचरण तंत्र के संदर्भ में निम्नलिखित में से कौन सा कथन सत्य है?</p>", "option1": "\r\n\r\n<p>शिराओं की भित्ति मोटी होती है और कोई कपाटिका (वाल्व) नहीं होते।</p>", "option2": "\r\n\r\n<p>विऑक्सीजनित रक्त नीले रंग का होता है।</p>", "option3": "\r\n\r\n<p>किसी चोट के ऊपर बना गहरा थक्का श्वेत रक्त कोशिकाओं के कारण है। </p>", "option4": "\r\n\r\n<p>शिराएँ विऑक्सीजनित रक्त वहन करती हैं।</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर शिराएँ विऑक्सीजनित रक्त का वहन करती हैं।</p>\r\n\r\n<p><strong>अवधारणा:</strong></p>\r\n\r\n<p><strong>मानव परिसंचरण तंत्र: </strong></p>\r\n\r\n<ul>\r\n\t<li>इसे रक्तवाहिनी तंत्र भी कहते हैं।</li>\r\n\t<li>इसमें एक पेशीय कक्ष वाला हृदय, बंद शाखाओं वाली रक्त वाहिकाओं और रक्त का एक जाल होता है, जिसमें द्रव पदार्थ परिसंचरित होती है।</li>\r\n</ul>\r\n\r\n<p><strong>स्पष्टीकरण:</strong></p>\r\n\r\n<ul>\r\n\t<li>मानव हृदय एक चार-कक्षीय पेशीय अंग है जो पूरे शरीर में रक्त पंप करता है। इसमें दो ऊपरी कक्ष होते हैं जिन्हें अलिंद कहा जाता है और दो निचले कक्ष होते हैं जिन्हें निलय कहा जाता है।</li>\r\n\t<li>हृदय स्पंदन हृदय की पेशियों के लयात्मक संकुचन (प्रकुंचन) और शिथिलीकरण (अनुशिथिलन) के परिणामस्वरूप होता है। प्रकुंचन के दौरान, हृदय सिकुड़ता है और धमनियों में रक्त पंप करता है। अनुशिथिलन के दौरान, हृदय शिथिल होता है, जिससे कक्ष भरने लगते हैं।</li>\r\n\t<li>ऊपरी दो कक्षों को अलिंद तथा निचले दो कक्षों को निलय कहा जाता है। अलिंद शरीर के विभिन्न भागों से रक्त प्राप्त करता है और उसे निलय में पंप करता है। फिर निलय हृदय से रक्त को फेफड़ों (दाएं निलय) और शरीर के अतरिक्त भागों (बाएं निलय) तक पंप करने के लिए सिकुड़ते हैं।</li>\r\n\t<li>शिराओं की भित्ति मोटी होती हैं और कोई कपाटिका (वाल्व) उपस्थित नहीं होती हैं।&quot; यह गलत है। शिराओं की तुलना में धमनियों की भित्ति अपेक्षाकृत पतली होती हैं। ऐसा इसलिए होता है क्योंकि शिराओं में दाब धमनियों की तुलना में बहुत कम होता है, इसलिए उन्हें उतनी मजबूत होने की आवश्यकता नहीं होती है। इसके अतिरिक्त, धमनियाँ कपाटिका (वाल्व) होती हैं। ये एक तरफ कपाटिका रक्त के प्रवाह को रोककर हृदय में रक्त के वापस आने का समर्थन करते हैं जो महत्वपूर्ण होता है क्योंकि धमनियों में रक्त का दाब कम होता है और अन्यथा गुरुत्वाकर्षण के विरुद्ध &#39;ऊपर की ओर&#39; प्रवाहित नहीं हो सकता है (उदाहरण के लिए, निचले अंगों से)।</li>\r\n\t<li>&quot;विऑक्सीजनित रक्त का रंग नीला होता है।&quot; यह कथन गलत है। विऑक्सीजनित रक्त नीला नहीं होता है; यह वास्तव में गहरा लाल रंग है। यह विचार कि यह नीला दिखाई देता है, इस कारण से है कि त्वचा और ऊतक प्रकाश की विभिन्न तरंगदैर्ध्य को अवशोषित और प्रतिबिंबित करते हैं।</li>\r\n\t<li>&quot;किसी चोट के ऊपर बना गहरा थक्का श्वेत रक्त कोशिकाओं के कारण है।&quot; यह भी गलत है। कटे हुए स्थान पर बनने वाला काला थक्का या &quot;पपड़ी&quot; मुख्य रूप से श्वेत रक्त कोशिकाओं के कारण नहीं होता है, बल्कि प्लेटलेट्स और फाइब्रिन नामक प्रोटीन की क्रिया के कारण होता है। चोट लगने के बाद, आपके रक्त में प्लेटलेट्स एक साथ चिपककर एक अवरोधक (प्लग) बनाते हैं, जबकि फाइब्रिन एक जाल बनाता है जो कठोर हो जाता है, जिससे एक थक्का बनता है जो आगे रक्तस्राव को रोकता है। जबकि श्वेत रक्त कोशिकाएं घाव के प्रति प्रतिरक्षा तंत्र की प्रतिक्रिया का भाग होती हैं, इनका मुख्य कार्य संक्रमण से लड़ना है, न कि थक्के बनाना हैं।</li>\r\n</ul>\r\n\r\n<p><strong> रक्त वाहिकाएँ:</strong></p>\r\n\r\n<ul>\r\n\t<li>हमारे शरीर में विभिन्न प्रकार की रक्त वाहिकाएँ होती हैं, जिनमें से प्रत्येक विशेष कार्य करती हैं।</li>\r\n\t<li>रक्त वाहिकाएँ तीन प्रकार की होती हैं - धमनियाँ, शिराएँ और केशिकाएँ।</li>\r\n</ul>\r\n\r\n<p><strong>धमनियाँ:</strong></p>\r\n\r\n<ul>\r\n\t<li>ये मोटी भित्ति वाली रक्त वाहिकाएँ हैं जो ऑक्सीजन युक्त रक्त को हृदय से विभिन्न अंगों तक ले जाती हैं।</li>\r\n\t<li>फुफ्फुसीय धमनियाँ अपवाद हैं क्योंकि वे हृदय से फेफड़ों तक विऑक्सीजनित रक्त ले जाती हैं, जहां रक्त का ऑक्सीजनीकरण होता है।</li>\r\n</ul>\r\n\r\n<p><strong>शिराएँ:</strong></p>\r\n\r\n<ul>\r\n\t<li>ये पतली भित्तिों वाली रक्त वाहिकाएँ होती हैं जो विभिन्न अंगों से ऑक्सीजन रहित रक्त को हृदय तक ले जाती हैं।</li>\r\n\t<li>फुफ्फुसीय धमनियाँ अपवाद हैं क्योंकि वे फेफड़ों से हृदय तक ऑक्सीजन युक्त रक्त ले जाती हैं।</li>\r\n\t<li>रक्त के प्रवाह को रोकने के लिए शिराओं में कपाटिका उपस्थित होती हैं।</li>\r\n</ul>\r\n\r\n<p><strong>केशिकाएँ: </strong>ये वे रक्त वाहिकाएँ हैं जिनमें एकल-कोशिकीय भित्ति होती हैं।</p>", "question_heading": ""}, {"sr_no": 102, "question": "\r\n<p>निम्नलिखित युग्मों पर विचार कीजिए।</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>चैनल</strong></td>\r\n\t\t\t<td><strong>भूभाग</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>1. दस डिग्री चैनल</td>\r\n\t\t\t<td>अंडमान द्वीप समूह को निकोबार द्वीप समूह से अलग करता है</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2. नौ डिग्री चैनल</td>\r\n\t\t\t<td>मिनिकॉय द्वीप को मुख्य लक्षद्वीप द्वीपसमूह से अलग करता है</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>3.आठ डिग्री चैनल</td>\r\n\t\t\t<td>मिनिकॉय और मालदीव के द्वीपों को अलग करता है।</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p>उपरोक्त में से कौन-सा/से युग्म सही सुमेलित है/हैं?</p>", "option1": "\r\n<p>केवल 1 </p>", "option2": "\r\n<p>केवल 2 और 3 </p>", "option3": "\r\n<p>केवल 1 और 3 </p>", "option4": "\r\n<p>1, 2 और 3</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>1, 2 और 3 </strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li><strong>दस डिग्री चैनल</strong>\r\n\r\n\t<ul>\r\n\t\t<li>यह एक चैनल है <strong>जो अंडमान द्वीप समूह या लिटिल अंडमान </strong>को भारत के बंगाल की खाड़ी में<strong> निकोबार द्वीप समूह से अलग करता है </strong>और भारतीय केंद्र शासित प्रदेश अंडमान और निकोबार द्वीप समूह बनाता है। <em><strong>अत: युग्म 1 सही है।</strong></em></li>\r\n\t\t<li>यह <strong>उत्तर से दक्षिण तक 150 किमी चौड़ा और पूर्व से पश्चिम तक 10 किमी लंबा है, </strong>जिसकी न्यूनतम गहराई 7.3 मीटर है।</li>\r\n\t\t<li>इसका नाम इसलिए रखा गया क्योंकि यह <strong>भूमध्य रेखा के उत्तर में अक्षांश की 10-डिग्री रेखा</strong> पर स्थित है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>नौ डिग्री चैनल</strong>\r\n\t<ul>\r\n\t\t<li>यह <strong>मिनिकॉय द्वीप को मुख्य लक्षद्वीप द्वीपसमूह से अलग करता है। <em>अत: युग्म 2 सही है।</em></strong></li>\r\n\t\t<li><strong>कल्पेनी, सुहेली पार</strong>, <strong>मलिकू एटोल और अमिनदीवि उपसमूह </strong>मिलकर लक्षद्वीप का केंद्र शासित प्रदेश बनाते हैं।</li>\r\n\t\t<li>यह <strong>2597 मीटर की गहराई</strong> के साथ <strong>200 किमी चौड़ा </strong>है।</li>\r\n\t\t<li>यह रणनीतिक रूप से महत्वपूर्ण है क्योंकि <strong>यह यूरोप, मध्य पूर्व और पश्चिमी एशिया के बीच दक्षिण-पूर्व एशिया और सुदूर पूर्व के बीच लगभग सभी व्यापारिक नौपरिवहन का मार्ग है।</strong></li>\r\n\t\t<li>इसका नाम इसलिए रखा गया क्योंकि यह भूमध्य रेखा के उत्तर में <strong>अक्षांश की 9-डिग्री रेखा</strong> पर स्थित है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>आठ डिग्री चैनल</strong>\r\n\t<ul>\r\n\t\t<li><strong>मालदीव और भारत </strong>के बीच समुद्री सीमा<strong> आठ डिग्री चैनल से होकर गुजरती है। <em>अत: युग्म 3 सही है।</em></strong></li>\r\n\t\t<li>यह <strong>मिनिकॉय और मालदीव के द्वीपों को </strong>अलग करता है।</li>\r\n\t\t<li><strong>मलिकू कंडू और मामाली कंडू दिवेही</strong> आठ डिग्री चैनल के पारंपरिक नाम हैं।</li>\r\n\t\t<li>इसका नाम इसलिए रखा गया क्योंकि यह भूमध्य रेखा के उत्तर में <strong>अक्षांश की 8-डिग्री रेखा</strong> पर स्थित है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 103, "question": "\r\n<p><strong>Direction: Select the most appropriate antonym of the given word.</strong></p>\r\n\r\n<p>Irreverent  </p>", "option1": "\r\n<p>Restoration</p>", "option2": "\r\n<p>Respectful</p>", "option3": "\r\n<p>Dormant</p>", "option4": "\r\n<p>Relevant</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot;Respectful.&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>&quot;Irreverent&quot;</strong> means lacking respect or showing disrespect. (किसी के प्रति आदर का अनुभव न करने वाला या न दिखने वाला; अनादरपूर्ण)\r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>: <em>This comedy takes an <u><strong>irreverent</strong></u> look at the world of politics.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>&quot;Respectful&quot;</strong> is the antonym of<strong> &quot;Irreverent.&quot;</strong></li>\r\n\t<li><strong>&quot;Respectful&quot; </strong>means showing or feeling respect. (आदरपूर्ण, श्रद्घायुक्त)\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>: <em>The <u><strong>respectful</strong></u> speaker approached the subject with sensitivity.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The correct answer is Option 2.</li>\r\n\t<li><strong>Restoration</strong> means the act of bringing something back to its original condition. (किसी वस्&zwj;तु की मूल दशा में वापसी, मरम्&zwj;मत, जीर्णोद्धार, मूल रूप निरूपण; इसके लिए उठाए गए क़दम)</li>\r\n\t<li><strong>Dormant</strong> means inactive or not currently active. (कुछ समय के लिए निष्क्रिय)</li>\r\n\t<li><strong>Relevant</strong> means closely connected or appropriate to the matter at hand. (प्रासंगिक, संबद्घ (विचार किए जा रहे विषय या जो हो रहा है उससे संबद्घ))</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 104, "question": "\r\n<p>निम्नलिखित में से किस एक मिट्टी में लौह ऑक्साइड की मात्रा अधिक होती है लेकिन नाइट्रोजन और चूने की कमी होती है और अम्लता की उच्च मात्रा के कारण कृषि के लिए अनुपयुक्त होती है?</p>", "option1": "\r\n<p>शुष्क मिट्टी</p>", "option2": "\r\n<p>लैटेराइट मिट्टी</p>", "option3": "\r\n<p>जलोढ़ मिट्टी</p>", "option4": "\r\n<p>रेगुर मिट्टी</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>लैटेराइट मिट्टी</strong></u> है।</p>\r\n\r\n<p><strong>लैटेराइट मिट्टी</strong></p>\r\n\r\n<ul>\r\n\t<li>लैटेराइट शब्द <strong>लैटिन शब्द &#39;लेटर&#39; से लिया गया है जिसका अर्थ है &#39;ईंट&#39;।</strong></li>\r\n\t<li>लैटेराइट एक <strong>मिट्टी और चट्टान का प्रकार है जो लोहे और एल्यूमीनियम में समृद्ध है </strong>और इसे आमतौर पर <strong>गर्म और गीले उष्णकटिबंधीय क्षेत्रों</strong> में बनाया गया माना जाता है।</li>\r\n\t<li><strong>लोहे </strong>के <strong>आक्साइड की मात्रा अधिक</strong> होने के कारण लगभग सभी <strong>लेटराइट जंग खाए-लाल रंग</strong> के होते हैं।</li>\r\n\t<li>वे <strong>अंतर्निहित मूल चट्टान के गहन और लंबे समय तक</strong> चलने वाले अपक्षय द्वारा विकसित होते हैं।</li>\r\n\t<li>लेटराइट मिट्टी में <strong>पोटेशियम, फास्फोरस, नाइट्रोजन, चूना और मैग्नेशिया की कम सामग्री</strong> के साथ 90 से 100% एल्यूमीनियम, लोहा, टाइटेनियम और मैंगनीज ऑक्साइड के साथ लाल से पीले रंग का होता है। <em><strong>अतः विकल्प 2 सही है।</strong></em></li>\r\n\t<li>यह बारी-बारी से <strong>गीली और सूखी अवधि</strong> के साथ <strong>भारी वर्षा और उच्च तापमान की स्थितियों में बनता है</strong>, जिससे मिट्टी का रिसाव होता है, जिससे केवल एल्यूमीनियम और लोहे के ऑक्साइड निकलते हैं।</li>\r\n\t<li><strong>निम्न आधार-विनिमय क्षमता</strong> और <strong>फॉस्फोरस, नाइट्रोजन और पोटेशियम की कम सामग्री </strong>के कारण<strong> उर्वरता की कमी</strong> है।</li>\r\n\t<li>वे पूर्व में <strong>पठार के किनारे पर तमिलनाडु, ओडिशा के छोटे हिस्से और उत्तर में छोटानागपुर के एक छोटे हिस्से और उत्तर पूर्व में मेघालय </strong>को कवर करते हुए पाए जाते हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 105, "question": "\r\n<p><strong>Given below are the four sentences in jumbled order. Pick the option that gives their correct order.</strong></p>\r\n\r\n<p>A. The Mughal empire began to decline rapidly since the reign of its last great ruler Aurangzeb</p>\r\n\r\n<p>B. Even in the first half of the seventeenth century its capital Delhi was considered to be the major power center in the entire eastern hemisphere;</p>\r\n\r\n<p>C. Founded by Babur in 1526 and expanded to its full glory by Emperor Akbar in the second half of the sixteenth century,</p>\r\n\r\n<p>D. but within fifty years the signs of the decline of this mighty empire were unmistakably visible.</p>", "option1": "\r\n<p>CABD</p>", "option2": "\r\n<p>DACB</p>", "option3": "\r\n<p>CBDA</p>", "option4": "\r\n<p>CBAD</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> &#39;CABD&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Sentence C </strong>will be the first sentence because it tells about the foundation of the empire. The beginning of the empire in 1526 by Babur.</li>\r\n\t<li><strong>Sentence A</strong> will be the next sentence because it tells about the beginning of the Mughal empire after the death of its last great ruler Aurangzeb.</li>\r\n\t<li><strong>Sentence B </strong>will be the next sentence because it talks about the condition of the declining empire in the first half of the seventeenth century.</li>\r\n\t<li><strong>Sentence D</strong> will be the last sentence because it connects the previous sentence it talks about finally the decline of the Mughal empire within fifty years.</li>\r\n</ul>\r\n\r\n<p>Thus, the correct sequence is,</p>\r\n\r\n<ul>\r\n\t<li>C . Founded by Babur in 1526 and expanded to its full glory by Emperor Akbar in the second half of the sixteenth century,</li>\r\n\t<li>A. The Mughal empire began to decline rapidly since the reign of its last great ruler Aurangzeb</li>\r\n\t<li>B. Even in the first half of the seventeenth century its capital Delhi was considered to be the major power center in the entire eastern hemisphere;</li>\r\n\t<li>D. but within fifty years the signs of the decline of this mighty empire were unmistakably visible.</li>\r\n</ul>\r\n\r\n<p><u><em><strong>Correct answer: </strong></em></u> CABD</p>", "question_heading": ""}, {"sr_no": 106, "question": "\r\n<p><strong>Which of the following words is an antonym for the given word?</strong></p>\r\n\r\n<p>Placid</p>", "option1": "\r\n<p>Lively</p>", "option2": "\r\n<p>Turbulent</p>", "option3": "\r\n<p>Harmonious</p>", "option4": "\r\n<p>Tranquil</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong> &quot;Turbulent&quot;.</strong></p>\r\n\r\n<ul>\r\n\t<li>&quot;<strong>Placid</strong>&quot; means not easily upset or excited; calm.(शांत) \r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- Despite the chaos around him, he remained <strong>placid</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&quot;<strong>Turbulent</strong>&quot; means characterized by conflict, disorder, or confusion; uncontrolled.(अशांत)\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- The political situation in the country is <strong>turbulent</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the option that is opposite in meaning to the given word is &#39;Turbulent&rsquo;.</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is <strong>&lsquo;Option 2&rsquo;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>Let&rsquo;s have a look at the meaning of the remaining options.</li>\r\n\t<li>&quot;<strong>Lively</strong>&quot; means full of life and energy; active.(जीवंत)</li>\r\n\t<li>&quot;<strong>Harmonious</strong>&quot; means forming a pleasing or consistent whole; free from dissent.(समंजस्यपूर्ण)</li>\r\n\t<li>&quot;<strong>Tranquil</strong>&quot; means free from disturbance; calm.(शांत)</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 107, "question": "\r\n<p><strong>Direction: Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p>\r\n\r\n<p>A. A man of that character is free from fear, free from hatred.<br />\r\nB. And it is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. <br />\r\nC. Unless that kind of transformation occurs, you are not an authentically religious man.<br />\r\nD. Religion is not a matter of mere dogmatic conformity.<br />\r\nE. It is the remarking of your own self, the transformation of your nature.</p>", "option1": "\r\n<p>ADEBC</p>", "option2": "\r\n<p>DEBCA</p>", "option3": "\r\n<p>ACBDE</p>", "option4": "\r\n<p>DBECA</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>DBECA </strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the sequence of the sentence.\r\n\t<ul>\r\n\t\t<li><strong>Statement D </strong>is the opening of the sentence as it introduces the subject and theme of the passage which is &#39;Religion is not a matter of mere dogmatic conformity&#39;.</li>\r\n\t\t<li><strong>Statement B </strong>is the second statement of the sentence as it adds more complication by telling us that religion is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. </li>\r\n\t\t<li><strong>Statement E </strong>is the third statement of the sentence as it continues further information that religion is not a question of ceremonial piety, but it is the remarking of your own self, the transformation of our nature.</li>\r\n\t\t<li><strong>Statement C </strong>is the fourth statement of the sentence as it tells us that unless that kind of transformation of our nature occurs, we are not authentically religious man.</li>\r\n\t\t<li><strong>Statement A </strong>is the fifth statement of the sentence as it concludes the passage by saying that with this kind of transformation a man can become fearless and hatred free. </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (4).</strong></p>\r\n\r\n<p><strong><u>Correct sequence:</u></strong></p>\r\n\r\n<ul>\r\n\t<li>D. Religion is not a matter of mere dogmatic conformity.</li>\r\n\t<li>B. And it is neither a question of ceremonial piety nor of merely going through the ritual prescribed to us. </li>\r\n\t<li>E. It is the remarking of your own self, the transformation of your nature.</li>\r\n\t<li>C. Unless that kind of transformation occurs, you are not an authentically religious man.</li>\r\n\t<li>A. A man of that character is free from fear, free from hatred.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 108, "question": "\r\n<p>स्वदेशी आंदोलन की औपचारिक घोषणा पहली बार निम्नलिखित में से किसके माध्यम से की गई थी?</p>", "option1": "\r\n<p>कांग्रेस कलकत्ता अधिवेशन, 1906</p>", "option2": "\r\n<p>बहिष्कार प्रस्ताव, 1905</p>", "option3": "\r\n<p>कांग्रेस बनारस अधिवेशन, 1905</p>", "option4": "\r\n<p>नेहरू रिपोर्ट, 1928</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>बहिष्कार प्रस्ताव</strong></u><u><strong>, 1905</strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li>भारत के तत्कालीन वायसराय <strong>लॉर्ड कर्जन</strong> ने <strong>जुलाई 1905 में बंगाल के विभाजन</strong> की घोषणा की। </li>\r\n\t<li>विभाजन के प्रस्ताव के खिलाफ जोरदार जनमत की अनदेखी करते हुए, सरकार ने जुलाई 1905 में बंगाल के विभाजन की घोषणा की।</li>\r\n\t<li>कुछ ही दिनों में, पूरे बंगाल के छोटे शहरों में विरोध सभाएँ आयोजित की गईं। इन्हीं बैठकों में सबसे पहले विदेशी वस्तुओं के बहिष्कार का संकल्प लिया गया।</li>\r\n\t<li><strong>7 अगस्त 1905</strong> को <strong>कलकत्ता टाउनहॉल</strong> में आयोजित एक विशाल बैठक में <strong>बहिष्कार प्रस्ताव</strong> के पारित होने के साथ,<strong> स्वदेशी आंदोलन की औपचारिक घोषणा की गई। अत: विकल्प 2 सही उत्तर है।</strong></li>\r\n\t<li>वंदे मातरम बहिष्कार और स्वदेशी आंदोलन का गीत बन गया।</li>\r\n\t<li>इसके बाद, नेता <strong>मैनचेस्टर के कपड़े और लिवरपूल नमक के बहिष्कार</strong> के संदेश का प्रचार करने के लिए बंगाल के अन्य हिस्सों में फैल गए।</li>\r\n\t<li>स्वदेशी आंदोलन एक विरोध आंदोलन के रूप में शुरू किया गया था जिसने देश में बहिष्कार आंदोलन को भी जन्म दिया।</li>\r\n\t<li>16 अक्टूबर 1905, जिस दिन विभाजन औपचारिक रूप से लागू हुआ, पूरे बंगाल में शोक के दिन के रूप में मनाया गया।\r\n\t<ul>\r\n\t\t<li><strong>जी.के.गोखले की अध्यक्षता में </strong>भारतीय राष्ट्रीय कांग्रेस ने दिसंबर <strong>1905 में बनारस अधिवेशन में स्वदेशी आंदोलन </strong>को औपचारिक रूप से <strong>मंजूरी दी</strong>।</li>\r\n\t\t<li>उद्देश्य:\r\n\t\t<ul>\r\n\t\t\t<li>बंगाल विभाजन की निंदा करना,</li>\r\n\t\t\t<li>कर्जन की प्रतिक्रियावादी नीतियों की निंदा करना, और</li>\r\n\t\t\t<li>बंगाल के विभाजन विरोधी और स्वदेशी आंदोलन का समर्थन करना।</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>दादाभाई नौरोजी </strong>की अध्यक्षता में <strong>कलकत्ता (1906) में आयोजित कांग्रेस अधिवेशन </strong>में एक बड़ा कदम आगे बढ़ाया गया।\r\n\t<ul>\r\n\t\t<li>इस सत्र में, यह घोषित किया गया कि भारतीय राष्ट्रीय कांग्रेस का लक्ष्य ऑस्ट्रेलिया या कनाडा की &quot;यूनाइटेड किंगडम या उपनिवेशों की तरह <strong>स्वशासन या स्वराज</strong>&quot; था।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>15 अगस्त 1928 की नेहरू रिपोर्ट </strong>(28 अगस्त को स्वीकृत) भारत के <strong>संविधान के लिए नई प्रभुत्व की स्थिति और सरकार के संघीय ढांचे के लिए अपील</strong> करने के लिए एक ज्ञापन था।\r\n\t<ul>\r\n\t\t<li>इसने विधानमंडलों में <strong>अल्पसंख्यकों के लिए सीटों के आरक्षण</strong> के साथ <strong>संयुक्त निर्वाचक मंडल </strong>के लिए भी प्रस्ताव रखा।</li>\r\n\t\t<li>इसे मोतीलाल नेहरू की अध्यक्षता में <strong>सर्वदलीय सम्मेलन </strong>की एक समिति द्वारा तैयार किया गया था, जिसमें उनके बेटे जवाहरलाल नेहरू सचिव के रूप में कार्यरत थे।</li>\r\n\t\t<li>इस समिति के नौ अन्य सदस्य थे।</li>\r\n\t\t<li>अंतिम रिपोर्ट पर मोतीलाल नेहरू और जवाहरलाल नेहरू, अली इमाम, तेज बहादुर सप्रू, माधव श्रीहरि अने, मंगल सिंह, शुएब कुरैशी, सुभाष चंद्र बोस और जी.आर. प्रधान द्वारा हस्ताक्षर किए गए थे।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 109, "question": "\r\n<p>निम्नलिखित राजनीति संगठनों को उनके स्थापना के कालक्रमानुसार व्यवस्थित कीजिए:</p>\r\n\r\n<p>(a) बाम्बे एसोसिएशन</p>\r\n\r\n<p>(b) बाम्बे प्रेसीडेन्सी एसोसिएशन</p>\r\n\r\n<p>(c) मद्रास महाजन सभा</p>\r\n\r\n<p>(d) पूना सार्वजनिक सभा</p>\r\n\r\n<p>सही विकल्प चुनिए:</p>", "option1": "\r\n<p>(a), (b), (c), (d)</p>", "option2": "\r\n<p>(a), (c), (b), (d)</p>", "option3": "\r\n<p>(a), (d), (c), (b)</p>", "option4": "\r\n<p>(d), (c), (a), (b)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>(a), (d), (c), (b)</u></strong> है।</p>\r\n\r\n<ul>\r\n\t<li>भारतीय राष्ट्रीय कांग्रेस (1885) भारत का पहला राजनीतिक संगठन नहीं था, न ही कोई आकस्मिक घटना, बल्कि यह राजनीतिक जागरण का चरम था।</li>\r\n\t<li>हालाँकि, उन्नीसवीं सदी के पूर्वार्द्ध में अधिकांश राजनीतिक संघों में धनी और कुलीन तत्वों का वर्चस्व था। वे स्थानीय या क्षेत्रीय चरित्र में थे।</li>\r\n\t<li>उन्नीसवीं शताब्दी के उत्तरार्ध के राजनीतिक संघों में शिक्षित मध्यम वर्ग-वकीलों, पत्रकारों, डॉक्टरों, शिक्षकों आदि का वर्चस्व बढ़ता जा रहा था और उनका व्यापक दृष्टिकोण और एक बड़ा एजेंडा था।</li>\r\n\t<li>बॉम्बे एसोसिएशन (1852) - ब्रिटिश इंडिया एसोसिएशन ऑफ कलकत्ता की तर्ज पर, 26 अगस्त 1852 को, बॉम्बे एसोसिएशन की स्थापना &#39;समय-समय पर भारत में या इंग्लैंड में सरकारी अधिकारियों को मौजूदा बुराइयों को दूर करने और प्रस्तावित की रोकथाम के लिए याद दिलाने के उद्देश्य से की गई थी। ये ऐसे उपाय है जिन्हें हानिकारक समझा जा सकता है या अधिनियम की शुरूआत के लिए जो इस देश से जुड़े सभी लोगों के सामान्य हित को बढ़ावा दे सकता है&#39;।</li>\r\n\t<li>बॉम्बे एसोसिएशन ने एक नई विधान परिषद के गठन का आग्रह करते हुए ब्रिटिश संसद को एक याचिका भेजी जिसमें भारतीयों का भी प्रतिनिधित्व किया जाना चाहिए।</li>\r\n\t<li>इसने भारतीयों को सभी उच्च सेवाओं से बाहर करने की नीति, यूरोपीय लोगों को दिए गए पदों पर किए गए भारी खर्च की भी निंदा की।</li>\r\n\t<li>पूना सर्वजन सभा की स्थापना <strong>1870</strong> में महादेव गोविंद रानाडे और अन्य ने सरकार और लोगों के बीच सेतु के रूप में की थी।</li>\r\n\t<li>पूना सार्वजनिक  सभा की स्थापना एम. जी. रानाडे और जी. वी. जोशी ने 2 अप्रैल 1870 को की थी।</li>\r\n\t<li>मद्रास महाजन सभा की स्थापना <strong>1884</strong> में एम। वीराराघवचारी, बी. सुब्रमण्य अय्यर और पी. आनंदचेरलु ने की थी।</li>\r\n\t<li>बॉम्बे प्रेसीडेंसी एसोसिएशन की शुरुआत बदरुद्दीन तैयबजी, फ़िरोज़शाह मेहता और के.टी. तेलंग ने <strong>1885</strong> में की थी।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 110, "question": "\r\n<p>निम्नलिखित नदियों पर विचार कीजिये:</p>\r\n\r\n<p>1. गोदावरी</p>\r\n\r\n<p>2. कृष्णा</p>\r\n\r\n<p>3. कावेरी</p>\r\n\r\n<p>4. तुंगभद्रा </p>\r\n\r\n<p>उपरोक्त में से कौन पश्चिमी घाट से उद्गमित होती है?</p>", "option1": "\r\n<p>1, 2 और 3</p>", "option2": "\r\n<p>2, 3 और 4</p>", "option3": "\r\n<p>1 और 4</p>", "option4": "\r\n<p>1, 2, 3 और 4</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u>विकल्प 4</u> है।</p>\r\n\r\n<p>गोदावरी नदी</p>\r\n\r\n<ul>\r\n\t<li>गोदावरी सबसे बड़ी प्रायद्वीपीय नदी प्रणाली है। इसे दक्षिण गंगा भी कहते हैं।</li>\r\n\t<li>स्रोत: गोदावरी नदी महाराष्ट्र में नासिक के पास त्र्यंबकेश्वर (पश्चिमी घाट का हिस्सा) से निकलती है और बंगाल की खाड़ी में गिरने से पहले लगभग 1465 किमी की लंबाई तक बहती है।</li>\r\n\t<li>जलनिकास बेसिन: गोदावरी बेसिन मध्य प्रदेश, कर्नाटक और केंद्र शासित प्रदेश पुडुचेरी के छोटे हिस्सों के अलावा महाराष्ट्र, तेलंगाना, आंध्र प्रदेश, छत्तीसगढ़ और ओडिशा राज्यों में फैली हुई है।</li>\r\n</ul>\r\n\r\n<p>कृष्णा नदी</p>\r\n\r\n<ul>\r\n\t<li>यह प्रायद्वीपीय भारत की दूसरी सबसे बड़ी नदी है। </li>\r\n\t<li>यह पश्चिमी घाट में महाराष्ट्र राज्य में महाबलेश्वर के पास 1337 मीटर की ऊंचाई पर उद्गमित है।</li>\r\n\t<li>यह प्रायद्वीप में पश्चिम से पूर्व की ओर, महाराष्ट्र, कर्नाटक और आंध्र प्रदेश से होकर गुजरते हुए लगभग 1400 किमी तक चलती है।</li>\r\n\t<li>कर्नाटक में घटप्रभा, मालाप्रभा, भीम और तुंगभद्रा कृष्णा की प्रमुख सहायक नदियाँ हैं।</li>\r\n</ul>\r\n\r\n<p>कावेरी नदी</p>\r\n\r\n<ul>\r\n\t<li>कावेरी नदी कर्नाटक के कोडागु (कूर्ग) जिले के चेरंगला गांव के पास ब्रह्मगिरी श्रृंखला (पश्चिमी घाट का हिस्सा) पर तालाकावेरी में 1,341 मीटर की ऊंचाई पर उद्गमित है।</li>\r\n\t<li>कावेरी बेसिन  तमिलनाडु, कर्नाटक, केरल और केंद्र शासित प्रदेश पुडुचेरी में 81 हजार वर्ग किमी के क्षेत्र में फैली हुई है।</li>\r\n\t<li>यह प्रवाह में तुलनात्मक रूप से कम उतार-चढ़ाव वाली लगभग एक बारहमासी नदी है और सिंचाई और जल विद्युत उत्पादन के लिए बहुत उपयोगी है।</li>\r\n</ul>\r\n\r\n<p>तुंगभद्रा </p>\r\n\r\n<ul>\r\n\t<li>तुंगभद्रा का निर्माण केंद्रीय सह्याद्री में गंगामूला से निकलने वाले तुंगा और भद्रा के एकीकरण से हुआ है। </li>\r\n\t<li>तुंगभद्रा, कृष्णा नदी की सबसे बड़ी सहायक नदी है। </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 111, "question": "\r\n<p>कुमारी कमला को 1970 में पद्म भूषण से सम्मानित किया गया था। उन्हें किस शास्त्रीय नृत्य शैली के लिए मान्यता मिली थी?</p>", "option1": "\r\n<p>मोहिनीअट्टम</p>", "option2": "\r\n<p>मणिपुरी</p>", "option3": "\r\n<p>कथक</p>", "option4": "\r\n<p>भरतनाट्यम</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>भरतनाट्यम</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>कुमारी कमला</strong> भारत की एक प्रसिद्ध <strong>भरतनाट्यम नृत्यांगना, कोरियोग्राफर</strong> और <strong>शिक्षिका</strong> थीं।</li>\r\n\t<li>भरतनाट्यम भारत के <strong>सबसे पुराने शास्त्रीय नृत्य रूपों</strong> में से एक है, जिसकी उत्पत्ति <strong>तमिलनाडु के मंदिरों में हुई है।</strong></li>\r\n\t<li>इसकी विशेषता <strong>जटिल फुटवर्क, हाथ के इशारे, चेहरे के भाव</strong> और शारीरिक गतिविधियां हैं जो भावनाओं को व्यक्त करती हैं और भारतीय पौराणिक कथाओं और लोककथाओं की कहानियां बताती हैं।</li>\r\n\t<li><strong>मणिपुरी मणिपुर </strong> का एक शास्त्रीय नृत्य है<strong>,</strong> जो अपनी <strong>सुंदर गतिविधियों</strong> और <strong>रंगीन वेशभूषा और अवलम्ब</strong><strong>(प्रॉप्स) के उपयोग के लिए जाना जाता है।</strong></li>\r\n\t<li><strong>मोहिनीअट्टम केरल</strong> का एक शास्त्रीय नृत्य है, जो अपनी <strong>प्रवाह , सुंदर गतिविधियों और सूक्ष्म अभिव्यक्तियों के लिए जाना जाता है।</strong></li>\r\n\t<li><strong>कथक उत्तर भारत का एक शास्त्रीय नृत्य है,</strong> जो अपने <strong>तेज़ फ़ुटवर्क, <strong>स्पिन</strong>(चक्रण)</strong> और नृत्य के माध्यम से कहानी कहने के लिए जाना जाता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 112, "question": "\r\n<p>The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don&rsquo;t find any error, select &lsquo;No error&rsquo; as your answer.</p>\r\n\r\n<p>He worked so hardly / that he won / the dance competition.</p>", "option1": "\r\n<p>that he won</p>", "option2": "\r\n<p>He worked so hardly</p>", "option3": "\r\n<p>the dance competition</p>", "option4": "\r\n<p>No error </p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>He worked so hardly</strong><strong>&#39; </strong>, i.e. the error lies in this part of the sentence.</p>\r\n\r\n<ul>\r\n\t<li>The error lies  incorrect usage of the adverb &#39;hardly&#39;.</li>\r\n\t<li>In the given sentence &#39;so....that&#39; is used as a conjunction to express the cause and result of the situation in the sentence.</li>\r\n\t<li><strong>Structure:</strong>\r\n\t<ul>\r\n\t\t<li>So+ adjective+ that+ result.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>You are so beautiful that I can&rsquo;t get my eyes off you.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus,  &#39;hard&#39;  will be used in place of &#39; hardly&#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em>He worked so <strong>hard </strong> that he won the dance competition.</em></p>\r\n\r\n<ul>\r\n\t<li><strong>Conjunction:  </strong>a word used to connect clauses or sentences or to coordinate words in the same clause.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 113, "question": "\r\n<p>Along with West Indies, which other country will host ICC men&#39;s T20 World Cup 2024?</p>", "option1": "\r\n<p>USA</p>", "option2": "\r\n<p>Canada</p>", "option3": "\r\n<p>Spain</p>", "option4": "\r\n<p>France</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct Answer is <u><strong>USA</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Dallas, Florida and New York to host matches in men&#39;s T20 World Cup next year.</li>\r\n\t<li><strong>Dallas, Florida and New York</strong> will host matches at <strong>next year&#39;s men&#39;s T20 World Cup</strong>.</li>\r\n\t<li>The United States will be staging a <strong>global cricket event for the first time</strong> as the sport looks to expand into new territory and get <strong>Olympic status for the 2028 Los Angeles Games.</strong></li>\r\n\t<li>The country will <em>co-host</em> the June 4-30 tournament <strong>with the West Indies</strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 114, "question": "\r\n<p>भूत कोला, एक आत्मा पूजा अनुष्ठान नृत्य किस राज्य का है?</p>", "option1": "\r\n<p>आंध्र प्रदेश</p>", "option2": "\r\n<p>तमिलनाडु</p>", "option3": "\r\n<p>केरल</p>", "option4": "\r\n<p>कर्नाटक</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>कर्नाटक</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>कर्नाटक:</strong></li>\r\n\t<li>यह राज्य <strong>भारत के दक्षिण-पश्चिमी क्षेत्र </strong>में स्थित है।</li>\r\n\t<li><strong>कर्नाटक संगीत, नृत्य, नाटक और दृश्य कला </strong>के विभिन्न रूपों के लिए जाना जाता है।</li>\r\n\t<li><strong>यक्षगान,</strong> एक रंगमंच शैली <strong>जो एक अनूठी शैली और रूप के साथ नृत्य, संगीत, संवाद, पोशाक, शृंगार</strong><strong>और मंच तकनीकों </strong>को जोड़ती है,<strong> विशेष रूप से लोकप्रिय है।</strong></li>\r\n\t<li><strong>भूत कोला</strong> अनुष्ठान नृत्य एक आत्मा पूजा नृत्य है जो मुख्य रूप से <strong>राज्य के तटीय जिलों</strong> में किया जाता है।</li>\r\n\t<li>इस <strong>पारंपरिक अनुष्ठान </strong>में, <strong>कलाकार आत्माओं और देवताओं के रूप में तैयार होते हैं, स्थानीय लोककथाओं और पौराणिक कथाओं के दृश्यों और कहानियों का अभिनय करते हैं।</strong></li>\r\n\t<li><strong>आंध्र प्रदेश:</strong>\r\n\t<ul>\r\n\t\t<li>यह देश के दक्षिणपूर्वी भाग में स्थित है, <strong>आंध्र प्रदेश </strong>का एक समृद्ध सांस्कृतिक इतिहास है और यह नृत्य और संगीत के विभिन्न रूपों के लिए जाना जाता है।</li>\r\n\t\t<li>कुचिपुड़ी के शास्त्रीय नृत्य रूप की उत्पत्ति इसी राज्य में हुई थी।</li>\r\n\t\t<li>विभिन्न लोक और आदिवासी नृत्य भी हैं जैसे- <strong>बुट्टा बोम्मलु, तप्पेटा गुल्लू और ढिमसा।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>तमिलनाडु:</strong>\r\n\t<ul>\r\n\t\t<li><strong>भारत के सबसे दक्षिणी भाग</strong> में स्थित <strong>तमिलनाडु </strong>अपनी विशिष्ट <strong>संस्कृति और विरासत </strong>के लिए जाना जाता है।</li>\r\n\t\t<li>भारत के सबसे लोकप्रिय और सम्मानित नृत्य रूपों में से एक, <strong>भरतनाट्यम </strong>की उत्पत्ति यहीं हुई थी।</li>\r\n\t\t<li>यह राज्य अपने संगीत, साहित्य और <strong>करकट्टम, कुम्मी एवं मयिल अट्टम</strong> जैसे पारंपरिक और लोक नृत्यों के विभिन्न रूपों के लिए भी जाना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>केरल:</strong>\r\n\t<ul>\r\n\t\t<li>यह <strong>दक्षिण-पश्चिमी राज्य </strong>अपने <strong>अनोखे नृत्य रूपों और सांस्कृतिक अनुष्ठानों</strong> के लिए जाना जाता है।</li>\r\n\t\t<li><strong>कथकली,</strong> एक उच्च शैली वाला <strong>शास्त्रीय भारतीय नृत्य-नाटक और मोहिनीअट्टम,</strong> एक शास्त्रीय नृत्य रूप जो एक जादूगरनी के नृत्य का प्रतिनिधित्व करता है, केरल के दो प्रमुख शास्त्रीय नृत्य रूप हैं।</li>\r\n\t\t<li><strong>थेय्यम </strong>और <strong>थिरयट्टम राज्य के उत्तरी भाग</strong> में प्रदर्शित लोकप्रिय अनुष्ठानिक लोक कलाएँ हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 115, "question": "\r\n<p>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</p>\r\n\r\n<p>If he were / to climb the tree / and bring the kitty down, / the child was happy.</p>", "option1": "\r\n<p>and bring the kitty down</p>", "option2": "\r\n<p>the child was happy</p>", "option3": "\r\n<p>to climb the tree</p>", "option4": "\r\n<p>If he were</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;the child was happy &#39;, i.e. the error lies in this part of the sentence.</p>\r\n\r\n<ul>\r\n\t<li>The error lies incorrect usage of past tense in a conditional sentence.</li>\r\n\t<li>The given sentence is an example of a second conditional sentence.</li>\r\n\t<li><strong>Second conditional sentence: </strong>It talks about the <strong>unreal possibility </strong>of something happening in the future. It means that we are thinking about the future. We are thinking about a particular condition in the future and the result of this condition. But there is <strong>not a real possibility </strong>that this condition will happen.</li>\r\n\t<li><strong>Structure </strong>:\r\n\t<ul>\r\n\t\t<li>If+ past simple, would + base verb.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>If I won the lottery, I would buy a scooter.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus,  &#39;would be&#39;  will be used in place of &#39;was &#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:  </u>If he were to climb the tree and bring the kitty down, the child would be happy.</p>\r\n\r\n<ul>\r\n\t<li><strong>Conditional sentence: </strong> The word &quot;condition&quot; means &quot;situation or circumstance&quot;. If a particular condition is true, then a particular result happens.</li>\r\n\t<li>Types of the conditional sentences:</li>\r\n</ul>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Conditional <br />\r\n\t\t\tType</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Usage     </strong></th>\r\n\t\t\t<th scope=\"col\"><strong>If clause</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Main Clause</strong></th>\r\n\t\t\t<th scope=\"col\"><strong>Example</strong></th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Zero<br />\r\n\t\t\tConditional</strong></th>\r\n\t\t\t<td>real condition + inevitable result</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>If you heat ice, it melts.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>First Conditional</strong></th>\r\n\t\t\t<td>possible condition + probable result</td>\r\n\t\t\t<td>present simple</td>\r\n\t\t\t<td>will + base verb</td>\r\n\t\t\t<td>If I win the lottery, I will buy a car.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Second Conditional</strong></th>\r\n\t\t\t<td>hypothetical condition + possible result</td>\r\n\t\t\t<td>past simple</td>\r\n\t\t\t<td>would + base verb</td>\r\n\t\t\t<td>If I won the lottery, I would buy a car.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\"><strong>Third Conditional</strong></th>\r\n\t\t\t<td>expired past condition + possible past result</td>\r\n\t\t\t<td>past perfect</td>\r\n\t\t\t<td>would have + past participle</td>\r\n\t\t\t<td>If I had won the lottery, I would have bought a car.</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 116, "question": "\r\n<p>किस नियम के अनुसार, समान ताप और दाब पर सभी गैसों के निश्चित आयतन में अणुओं की संख्या समान होती है?</p>", "option1": "\r\n<p>ग्राहम का नियम</p>", "option2": "\r\n<p>पास्कल का नियम</p>", "option3": "\r\n<p>आवोगाद्रो का नियम</p>", "option4": "\r\n<p>कॉरिऑलिस प्रभाव</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर<u><strong>अवोगाद्रो का नियम </strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li>अवोगाद्रो का नियम <strong>गैस के आयतन से संबंधित गैस के पदार्थ की मात्रा से संबंधित एक प्रायोगिक गैस नियम है।</strong></li>\r\n\t<li>नियम आदर्श गैस नियम का एक विशिष्ट मामला है। अवोगाद्रो का नियम कहता है कि <strong>&quot;सभी गैसों के समान आयतन, समान तापमान और दबाव पर, अणुओं की संख्या समान होती है।</strong></li>\r\n\t<li>नियम का नाम <strong>एमेडियो अवोगाद्रो के नाम पर रखा गया है, जिन्होंने 1812 में </strong>परिकल्पना की थी कि एक ही आयतन और एक ही <strong>तापमान और दबाव </strong>में एक <strong>आदर्श गैस के दो दिए गए नमूनों</strong> में समान संख्या में अणु होते हैं।</li>\r\n</ul>\r\n\r\n<p><strong>कॉरिओलिस प्रभाव:</strong></p>\r\n\r\n<ul>\r\n\t<li>कोरिओलिस प्रभाव <strong>विक्षेपण का प्रतिरूप </strong>है जो वस्तुएं पृथ्वी पर लंबी दूरी की यात्रा करते समय लेती हैं।</li>\r\n\t<li>कोरिओलिस प्रभाव की <strong>कुंजी पृथ्वी के घूर्णन का परिणाम</strong> है।</li>\r\n</ul>\r\n\r\n<p><strong>ग्राहम का नियम:</strong></p>\r\n\r\n<ul>\r\n\t<li>ग्राहम का नियम कहता है कि गैस के प्रसार या प्रवाह की दर उसके अणु द्रव्यमान के वर्गमूल के व्युत्क्रमानुपाती होती है।</li>\r\n</ul>\r\n\r\n<p><strong>पास्कल का सिद्धांत:</strong></p>\r\n\r\n<ul>\r\n\t<li>पास्कल का सिद्धांत: पास्कल का नियम <strong>द्रव दबाव के संचरण का सिद्धांत है।</strong></li>\r\n\t<li>यह कहता है कि <strong>&quot;सीमित द्रव के एक बिंदु में कहीं भी लगाया गया दबाव पूरे द्रव में सभी दिशाओं में समान रूप से प्रसारित होता है।&quot;</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 117, "question": "\r\n<p>सातवाहनों के संबंध में निम्नलिखित में से कौन सा कथन सही है?</p>", "option1": "\r\n<p>सातवाहन शैव धर्म के अनुयायी थे</p>", "option2": "\r\n<p>उन्होंने मध्य भारत और उत्तरी भारत के कई भाग पर शासन किया।</p>", "option3": "\r\n<p>सातवाहनों की राजभाषा प्राकृत थी।</p>", "option4": "\r\n<p>सातवाहन वंश का संस्थापक गौतमीपुत्र शातकर्णी था।</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>सातवाहनों की राजभाषा प्राकृत थी</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>सातवाहन वंश</strong> का संस्थापक <strong>सिमुक</strong> था। <strong>अत: कथन 4 गलत है।</strong></li>\r\n\t<li>मौर्यों के पतन के बाद सातवाहनों ने अपना स्वतंत्र शासन स्थापित किया।</li>\r\n\t<li>सातवाहनों ने <strong>पश्चिमी और मध्य भारत</strong> के कुछ हिस्सों पर शासन किया। <strong>अत: कथन 2 गलत है।</strong></li>\r\n\t<li>उनका शासन लगभग <strong>450 वर्षों</strong> तक चला।</li>\r\n\t<li>उन्हें <strong>आंध्र </strong>के नाम से भी जाना जाता था।</li>\r\n\t<li>सातवाहन के इतिहास के लिए <strong>पुराण और शिलालेख</strong> महत्वपूर्ण स्रोत हैं।</li>\r\n\t<li>शिलालेखों में, नासिक और नानागढ़ शिलालेख गौतमीपुत्र शातकर्णी के शासनकाल पर बहुत प्रकाश डालते हैं।</li>\r\n\t<li>सातवाहनों द्वारा जारी किए गए सिक्के भी उस काल की आर्थिक स्थिति को जानने में सहायक होते हैं।</li>\r\n\t<li><strong>सातवाहन शासकों</strong> ने बड़ी संख्या में <strong>वैष्णव देवताओं</strong> जैसे<strong> कृष्ण, वासुदेव</strong> और अन्य की पूजा की। <strong>इसलिए, कथन 1 गलत है।</strong></li>\r\n\t<li>उन्होंने ब्राह्मणों को उदार बलिदान शुल्क का भुगतान किया।</li>\r\n\t<li>सातवाहनों की <strong>राजभाषा प्राकृत</strong> थी। <strong>अत: कथन 3 सही है।</strong></li>\r\n\t<li>सभी शिलालेख इसी भाषा में लिखे गए थे और ब्राह्मी लिपि में लिखे गए थे, जैसा कि अशोक के समय में हुआ था।</li>\r\n\t<li>कुछ सातवाहन राजाओं ने प्राकृत पुस्तकों की रचना की होगी।</li>\r\n\t<li>सातवाहन चरण में, उत्तर-पश्चिमी दक्कन या महाराष्ट्र में कई मंदिरों और मठों को बड़ी कुशलता और धैर्य के साथ <strong>ठोस चट्टान से काट</strong> दिया जाता था।</li>\r\n\t<li>दो सामान्य संरचनाएं थीं मंदिर जिसे <strong>चैत्य</strong> कहा जाता था और मठ जिसे<strong> विहार</strong> कहा जाता था।</li>\r\n\t<li>गौतमीपुत्र शातकर्णी सातवाहन वंश का सबसे महान शासक था।</li>\r\n\t<li>उसने <strong>106 से 130 ई.</strong> तक 24 वर्षों तक शासन किया।</li>\r\n\t<li>उनकी उपलब्धियों को <strong>उनकी मां गौतमी बालासरी ने नासिक शिलालेख</strong> में दर्ज किया था।</li>\r\n\t<li><strong>गौतमीपुत्र शातकर्णी</strong> ने पूरे दक्कन पर कब्जा कर लिया और अपने साम्राज्य का विस्तार किया।\r\n\t<ul>\r\n\t\t<li>मालवा के शासक नहपान पर उनकी विजय उल्लेखनीय थी।</li>\r\n\t\t<li>उन्होंने <strong>ब्राह्मणवाद को संरक्षण</strong> दिया। फिर भी, उन्होंने बौद्धों को दान भी दिया।</li>\r\n\t\t<li>गौतमीपुत्र शातकर्णी का उत्तराधिकारी उसका पुत्र <strong>वशिष्ठपुत्र पुलमायी</strong> हुआ।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p> </p>", "question_heading": ""}, {"sr_no": 118, "question": "\r\n<p>नई दिल्ली में &quot;भारत में ग्रीन हाइड्रोजन पायलट&quot; सम्मेलन की मेजबानी किसने की?</p>", "option1": "\r\n<p>NTPC लिमिटेड</p>", "option2": "\r\n<p>SAIL</p>", "option3": "\r\n<p>केंद्रीय ऊर्जा और नवीन एवं नवीकरणीय ऊर्जा मंत्री</p>", "option4": "\r\n<p>राष्ट्रीय हरित न्यायाधिकरण</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>NTPC लिमिटेड</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>NTPC ने &#39;भारत में हरित हाइड्रोजन पायलट&#39; विषय पर सम्मेलन की मेजबानी की।</li>\r\n\t<li><strong>G20 शिखर सम्मेलन से पहले नई दिल्ली </strong>में<em><strong> &quot;भारत में हरित हाइड्रोजन पायलट&quot; </strong></em>पर एक दिवसीय सम्मेलन आयोजित किया गया था।</li>\r\n\t<li>सम्मेलन में भारत में सार्वजनिक और निजी दोनों क्षेत्रों की कंपनियों द्वारा लागू किए जा रहे विभिन्न ग्रीन हाइड्रोजन पायलटों का प्रदर्शन किया गया।</li>\r\n\t<li><strong>NTPC लिमिटेड द्वारा आयोजित </strong>सम्मेलन में हरित हाइड्रोजन प्रौद्योगिकी में अग्रणी नवीन पायलटों और प्रगति को भी प्रस्तुत किया गया।</li>\r\n\t<li>उद्घाटन भाषण देते हुए<strong> केंद्रीय ऊर्जा और नवीन एवं नवीकरणीय ऊर्जा मंत्री आर.के. सिंह ने</strong> कहा कि भारत के विशाल ऊर्जा आयात बिल को कम करने के लिए प्रभावी उपाय करने होंगे। उन्होंने जोर देकर कहा कि यही वह क्षण है जिसे भारत को जब्त करना है।</li>\r\n\t<li>मंत्री ने कहा कि भारत में दुनिया में हरित हाइड्रोजन के सबसे बड़े निर्माताओं में से एक बनने की क्षमता है। उन्होंने कहा कि सरकार ने नवीकरणीय ऊर्जा के लिए एक विशाल पारिस्थितिकी तंत्र स्थापित किया है। उन्होंने कहा कि नवीकरणीय ऊर्जा के क्षेत्र में क्षमता बढ़ाने की भारत की गति दुनिया में सबसे तेज है।\r\n\t<ul>\r\n\t\t<li>उन्होंने कहा कि भारत की नवीकरणीय ऊर्जा बनाने की लागत और हरित हाइड्रोजन उत्पादन की लागत दुनिया में सबसे कम होगी।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 119, "question": "\r\n<p>निम्न में से कौन-सी &#39;सदिश राशि&#39; नहीं है?</p>", "option1": "\r\n<p>वेग</p>", "option2": "\r\n<p>बल आघूर्ण </p>", "option3": "\r\n<p>विस्थापन</p>", "option4": "\r\n<p>गति</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>गति </strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li>एक <strong>इकाई समय में वस्तु द्वारा तय की गई दूरी वस्तु की गति</strong> के रूप में होती है।</li>\r\n\t<li>गति एक <strong>अदिश  राशि </strong>है।</li>\r\n\t<li>एक अदिश राशि <strong>केवल परिमाण वाली मात्रा होती</strong> है। यह पूरी तरह से एक ही संख्या द्वारा, उचित इकाई के साथ निर्दिष्ट किया जाता है। <strong>उदाहरण </strong>हैं: दो बिंदुओं के बीच की दूरी, किसी वस्तु का द्रव्यमान, किसी पिंड का तापमान और वह समय जिस पर एक निश्चित घटना हुई।</li>\r\n\t<li><strong>एक सदिश राशि एक ऐसी मात्रा है जिसमें परिमाण और दिशा </strong>दोनों होते हैं<strong> और योग के त्रिभुज के नियम का पालन करते हैं </strong>या<strong> समान रूप से समांतर चतुर्भुज योग के नियम का पालन करते हैं।</strong></li>\r\n\t<li>तो, एक <strong>सदिश एक संख्या</strong> और उसकी दिशा से उसका परिमाण <strong>देकर निर्दिष्ट किया जाता</strong> है।</li>\r\n\t<li>कुछ भौतिक राशियाँ जो सदिशों द्वारा निरूपित की जाती हैं वे हैं <strong>विस्थापन, वेग, त्वरण और बल।</strong></li>\r\n\t<li><strong>बल आघूर्ण</strong>एक प्रकार का बल है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 120, "question": "\r\n<p>Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.</p>\r\n\r\n<p>The plant will die unless you <u>will water </u>it every day.</p>", "option1": "\r\n<p>are watering</p>", "option2": "\r\n<p>water</p>", "option3": "\r\n<p>would water</p>", "option4": "\r\n<p>No substitution required</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; water&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The error lies  incorrect usage of future tense i.e. &#39;will&#39;.</li>\r\n\t<li>Let&#39;s take a look at the word &#39;unless&#39; it means the same as <strong>if...not. </strong>Like <strong>if </strong>, unless is followed by <strong>a present tense, a past tense, or a past perfect tense (never by a conditional) </strong>. Unless is used instead of <strong>if...not </strong>in conditional sentences of all types. The order of the clauses doesn&#39;t matter with sentences using unless.</li>\r\n\t<li>Unless is never followed by future tense.</li>\r\n\t<li>Example: \r\n\t<ul>\r\n\t\t<li> You&#39;ll be sick unless you stop eating.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, &#39;water&#39; will be used in place of &#39;will water&#39;.</li>\r\n</ul>\r\n\r\n<p><u>Correct sentence:</u><em>The plant will die unless you <strong>water </strong>it every day.</em></p>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>Select the correctly spelt word.</p>", "option1": "\r\n<p>Recaptulate</p>", "option2": "\r\n<p>Lifelesness</p>", "option3": "\r\n<p>Incredulous</p>", "option4": "\r\n<p>Synergizm</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;Incredulous &#39;.</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s take a look at the options:\r\n\t<ul>\r\n\t\t<li><strong>Recaptulate</strong>:  There is no such word in the dictionary, the correct spelling is  &#39;<strong>recapitulate</strong>&#39;  which means <strong>summarize and state again the main points.</strong></li>\r\n\t\t<li><strong>Lifelesness</strong>:  There is no such word in the dictionary, the correct spelling is  &#39;lifelessness &#39;  which means<strong>having no life.</strong></li>\r\n\t\t<li><strong>Incredulous</strong>: It is a correctly spelt word which means<strong>(</strong><strong>of a person or their manner) unwilling or unable to believe something.</strong></li>\r\n\t\t<li><strong>Synergizm</strong>:  There is no such word in the dictionary, the correct spelling is <strong>&#39;synergism&#39; </strong>which means the interaction or cooperation of two or more organizations, substances, or other agents to produce a combined effect greater than the sum of their separate effects.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, the correct answer is  option 3,  i.e. it is the correctly spelt word.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Why did coffeehouses become extremely popular in 17th - 18th century England?</p>", "option1": "\r\n<p>Coffee was a newly arrived drink in England.</p>", "option2": "\r\n<p>People could debate on politics, literature, science etc.</p>", "option3": "\r\n<p>Coffee was extremely palatable and tasty.</p>", "option4": "\r\n<p>The caffeine and the atmosphere in the coffeehouse provided a special excitement.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>The caffeine and the atmosphere in the coffeehouse provided a special excitement.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following line of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>Whilst the taste of 17th-century coffee was not very palatable - indeed, it tasted quite disgusting according to accounts of the time <strong>but the caffeine in it and the &lsquo;buzz&rsquo; it provided, proved quite addictive</strong>.</em>&quot;</li>\r\n\t\t<li>&quot;<em>The new coffeehouses <strong>became fashionable places</strong> for the chattering classes to meet, conduct business, gossip, exchange ideas, and debate the news of the day.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that the caffeine present in coffee proved to be addictive for the people who drank it.</li>\r\n\t<li>From the second sentence, it is clear that coffeehouses provided a special excitement to the people.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 4)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>Which of the following statements is NOT true according to the passage?</p>", "option1": "\r\n<p>Coffee arrived in Europe from Turkey.</p>", "option2": "\r\n<p>In 1675, Charles II tried to ban the coffeehouses, but had to withdraw his order.</p>", "option3": "\r\n<p>In the English coffeehouses alcohol was also served.</p>", "option4": "\r\n<p>Women were not allowed in English coffeehouses.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>In the English coffeehouses alcohol was also served.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following line of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>The new coffeehouses became fashionable places for the chattering classes to meet, conduct business, gossip, exchange ideas, and debate the news of the day. <strong>Unlike public houses, no alcohol was served </strong>and women were excluded.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that alcohol was not served in the coffeehouses like the other public places.</li>\r\n\t<li>Hence, the sentence given in <strong>option 3</strong> is incorrect.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 3)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n<p>The main theme of the passage is:</p>", "option1": "\r\n<p>advent of equality and republicanism in England</p>", "option2": "\r\n<p>history of coffeehouses in Europe</p>", "option3": "\r\n<p>17th and 18th century English coffeehouses</p>", "option4": "\r\n<p>Penny Universities in England</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>17th  and 18th  century English coffeehouses</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the starting lines of the first paragraph of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em><strong>In 17th  and 18th</strong><strong> century England</strong>, <strong>coffeehouses were popular places for people</strong> from all walks of life to go and meet, chat, gossip and have fun, whilst enjoying the latest fashion, <strong>a drink newly arrived in Europe from Turkey - coffee.</strong></em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, from the first sentence of the passage itself, it is clear that the passage is about the English coffeehouses during the 17th and 18th centuries.</li>\r\n</ul>\r\n\r\n<p>Therefore, it can be inferred that the correct answer is option 3)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n<p>The English coffeehouses became associated with equality and republicanism basically because:</p>", "option1": "\r\n<p>anybody from any social class could go and sit there.</p>", "option2": "\r\n<p>reasoned and sober debate on politics took place there.</p>", "option3": "\r\n<p>Influential patrons like Samuel Pepys, John Dryden, Alexander Pope and Isaac Newton frequented them.</p>", "option4": "पुधद थधनध ोिसय ुोहnपधक ृद cनiंinोिस, ौcयहnकनिधस ोnक ूiंूौ.", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>anybody from any social class could go and sit there.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em><strong>Anyone of any social class</strong> could frequent the coffeehouses, and so they <strong>became associated with equality and republicanism</strong>. So much so that in 1675 an attempt to ban them was made by Charles II, which caused such a public outcry that it was withdrawn.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, it can be inferred that there was no discrimination over the social class of anyone to visit the coffeehouses.</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is option 1)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p>The first coffeehouse in London was started by:</p>", "option1": "\r\n<p>John Dryden</p>", "option2": "\r\n<p>PasquaRose&eacute;</p>", "option3": "\r\n<p>Samuel Pepys</p>", "option4": "\r\n<p>Alexander Pope</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>PasquaRose&eacute;</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>&quot;<em>The first coffeehouse in England was opened in Oxford in 1652. <strong>In London</strong>, the first one was opened later that same year in at St Michael&rsquo;s Alley, Cornhill, <strong>by an eccentric Greek named PasquaRose&eacute;</strong>.</em>&quot;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, it can be inferred that the first coffeehouse in London was started by <strong>PasquaRose&eacute;</strong><em>.</em></li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is option 2)<em>.</em></p>\r\n\r\n<ul>\r\n\t<li><em>Comprehension questions can be answered easily by:</em>\r\n\r\n\t<ul>\r\n\t\t<li>Reading the passage carefully.</li>\r\n\t\t<li>Identifying the purpose of the passage.</li>\r\n\t\t<li>Going through the questions correctly with correct implied meaning.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>Homi&rsquo;s parents took him to doctors because</p>", "option1": "\r\n<p>he was frequently falling ill</p>", "option2": "\r\n<p>he did not sleep as much as other children of his age</p>", "option3": "\r\n<p>he always remained tensed up</p>", "option4": "\r\n<p>he had a super active brain</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;he did not sleep as much as other children of his age&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: &quot;In his childhood, Homi bubbled with immense energy, <strong>slept much less than children of his age. </strong>His mother Meheran and his father Jehangir Bhabha took him to many doctors. They subjected him to several tests. They found nothing wrong. He was a perfectly healthy child. <strong>Why did he spend lesser time in sleep? </strong>It took them some time to understand the cause. Homi had a super active brain&quot;.</li>\r\n\t<li>From these lines, we can infer that Homi used to sleep much less than children of his and that&#39;s why his parents took him to doctors.</li>\r\n\t<li>Thus, the correct answer is  <strong>&#39;he did not sleep as much as other children of his age&#39;.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (2).</strong></p>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>As a child, Homi was</p>", "option1": "\r\n<p>lazy</p>", "option2": "\r\n<p>unhealthy</p>", "option3": "\r\n<p>overactive for his age</p>", "option4": "\r\n<p>difficult to handle</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;overactive for his age&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: <strong>&quot;In his childhood, Homi bubbled with immense energy, slept much less than children of his age&quot;.</strong></li>\r\n\t<li>From this line, we can infer that as a child, Homi was filled with immense energy and used to sleep much less than children of his age.</li>\r\n\t<li>Thus, according to the passage, <strong>As a child, Homi was overactive for his age.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (3).</strong></p>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>Homi&rsquo;s parents helped him by</p>", "option1": "\r\n<p>taking him to Einstein</p>", "option2": "\r\n<p>teaching him high moral values</p>", "option3": "\r\n<p>seeking medical help for him</p>", "option4": "\r\n<p>buying him books on a wide range of subjects</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;buying him books on a wide range of subjects&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: &quot; <strong>They could not guess what the future held for Homi. But they could shape his destiny by helping him develop his native talent. They decided to do that. They stacked the bookshelves at home with the best of books on a wide range of subjects </strong>&quot;.</li>\r\n\t<li>From these lines, we can infer that Homi&#39;s parents helped Homi by buying him the best of books on a wide range of subjects.</li>\r\n\t<li>Thus, the correct answer is <strong>&#39;buying him books on a wide range of subjects&#39;.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (4).</strong></p>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>A person with a never - say - die spirit</p>", "option1": "\r\n<p>never talks about death</p>", "option2": "\r\n<p>is not afraid of death</p>", "option3": "\r\n<p>does not accept defeat</p>", "option4": "\r\n<p>believes that the spirit never dies</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;does not accept defeat&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s refers to the line from the passage: <strong>&quot;Success, Einstein had linked with hard work, total commitment to the job and a never-say-die spirit. That formula appealed to Homi&quot;.</strong></li>\r\n\t<li>From this line, we can infer that Einstein and Homi had a never-say-die spirit, which means that they never gave up or ge
