t discouraged, no matter what.</li>\r\n\t<li>Thus, it can be concluded that <strong>a never-say-die spirit means you don&#39;t accept defeat or get discouraged, no matter what.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <strong>option (3).</strong></p>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n\r\n<p>______मेमोरी का उपयोग कभी-कभी CPU को तीव्र गति से वर्तमान प्रोग्राम और डेटा उपलब्ध कराकर प्रोसेसिंग की गति बढ़ाने के लिए किया जाता है।</p>", "option1": "\r\n\r\n<p>बैकअप</p>", "option2": "\r\n\r\n<p>सहायक</p>", "option3": "\r\n\r\n<p>मुख्य</p>", "option4": "\r\n\r\n<p>कैश</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><u>कैश मेमोरी</u>:</p>\r\n\r\n<ul>\r\n\t<li>यह एक अत्यंत तेज़ मेमोरी प्रकार है जो RAM और CPU के बीच बफर के रूप में कार्य करता है।</li>\r\n\t<li>यह अक्सर अनुरोधित डेटा और निर्देशों को रखता है ताकि जरूरत पड़ने पर वे तुरंत CPU को उपलब्ध हो सकें।</li>\r\n\t<li>यह CPU और मुख्य मेमोरी M के बीच स्थित एक मेमोरी यूनिट है और इसका उपयोग निर्देश, डेटा या दोनों को स्टोर करने के लिए किया जाता है।</li>\r\n\t<li>इसका उपयोग मुख्य मेमोरी से डेटा एक्सेस करने के औसत समय को कम करने के लिए किया जाता है।</li>\r\n\t<li>कैश मेमोरी का उपयोग कभी-कभी CPU को तीव्र गति से वर्तमान प्रोग्राम और डेटा उपलब्ध कराकर प्रसंस्करण की गति को बढ़ाने के लिए किया जाता है।</li>\r\n</ul>\r\n\r\n<p> </p>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>एम.एस.-एक्सेल 365 की वर्कशीट में प्रत्येक सेल को एक सेल _______ द्वारा पहचाना जाता है।</p>", "option1": "\r\n<p>कलर</p>", "option2": "\r\n<p>साइज</p>", "option3": "\r\n<p>राउंडिंग</p>", "option4": "\r\n<p>रेफेरेंस</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>एम.एस.-एक्सेल 365 की वर्कशीट में प्रत्येक सेल की पहचान एक सेल रेफरेंस द्वारा की जाती है।</strong></p>\r\n\r\n<ul>\r\n\t<li>सेल रेफरेंस वर्कशीट में प्रत्येक सेल के लिए एक यूनिक आइडेंटिफायर है, जिसमें एक रो नंबर के बाद एक कॉलम लेटर होता है।</li>\r\n\t<li>उदाहरण के लिए, पहले कॉलम और पहली रो में सेल का रेफरेंस A1 है।</li>\r\n\t<li>वर्कशीट में डेटा को कैलकुलेट और मैनिपुलेट करने के लिए एक्सेल फ़ार्मुलों और फ़ंक्शंस में सेल रेफरेंस का उपयोग किया जाता है।</li>\r\n\t<li>उनका उपयोग विभिन्न वर्कशीट या वर्कबुक में सेल के बीच लिंक बनाने के लिए भी किया जा सकता है, जिससे यूजर कई शीट या फ़ाइलों में डेटा को रेफरेंस कर सकते हैं।</li>\r\n\t<li>कलर : कलर एक विज़ुअल प्रॉपर्टी है जिसे एम.एस.-एक्सेल 365 में सेल पर लागू किया जा सकता है। यूजर किसी सेल की बैकग्राउंड का कलर या फ़ॉन्ट कलर बदल सकते हैं ताकि इसे सबसे अलग बनाया जा सके या इसे पढ़ने में आसान बनाया जा सके। यह एक्सेल रिबन के &quot;होम&quot; टैब में &quot;फिल कलर&quot; या &quot;फॉन्ट कलर&quot; विकल्पों के माध्यम से किया जा सकता है।</li>\r\n\t<li>साइज: साइज एम.एस.-एक्सेल 365 में एक सेल के आयामों को रेफेर करता है। यूजर अपनी जरूरतों के आधार पर सेल की चौड़ाई और ऊंचाई को बड़ा या छोटा करने के लिए समायोजित कर सकते हैं। यह कॉलम या रो हेडर को डिजायर साइज में खींचकर या एक्सेल रिबन के &quot;होम&quot; टैब में &quot;फॉर्मेट सेल&quot; डायलॉग बॉक्स का उपयोग करके किया जा सकता है।</li>\r\n\t<li>राउंडिंग: राउंडिंग एक मैथमेटिकल फंक्शन है जिसे एम.एस.-एक्सेल 365 में संख्याओं पर लागू किया जा सकता है। यूजर अपनी आवश्यकताओं के आधार पर संख्याओं को डेसीमल प्लेस की एक निर्दिष्ट संख्या या निकटतम पूर्ण संख्या तक राउंड कर सकते हैं। यह एक्सेल रिबन के &quot;होम&quot; टैब में &quot;नंबर&quot; फॉर्मेट ऑप्शन के माध्यम से किया जा सकता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>_______ एक प्रकार का डेडिकेटेड फाइल स्टोरेज डिवाइस है जो एक मानक ईथरनेट कनेक्शन के माध्यम से लोकल-एरिया नेटवर्क (LAN) यूजर को सेंट्रलाइज्ड, कंसोलिडेटेड डिस्क स्टोरेज प्रदान करता है।</p>", "option1": "\r\n<p>सॉलिड-स्टेट ड्राइव (SSD)</p>", "option2": "\r\n<p>USB हार्ड ड्राइव</p>", "option3": "\r\n<p>USB स्टिक</p>", "option4": "\r\n<p>नेटवर्क अटैच्ड स्टोरेज (NAS)</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही उत्तर विकल्प 4 ) नेटवर्क अटैच्ड स्टोरेज (NAS) है।</strong></p>\r\n\r\n<ul>\r\n\t<li>NAS एक प्रकार का डेडिकेटेड फ़ाइल स्टोरेज डिवाइस है जो लोकल-एरिया नेटवर्क (LAN) यूजर को एक मानक ईथरनेट कनेक्शन के माध्यम से सेंट्रलाइज्ड, कंसोलिडेटेड डिस्क स्टोरेज प्रदान करता है।</li>\r\n\t<li>इसे उपयोग में आसान बनाने के लिए डिज़ाइन किया गया है और यह एक नेटवर्क पर फाइलों को स्टोर और शेयर करने का एक लागत प्रभावी तरीका प्रदान करता है।</li>\r\n\t<li>सॉलिड-स्टेट ड्राइव (SSDs), USB हार्ड ड्राइव और USB स्टिक के विपरीत, जो आमतौर पर पोर्टेबल स्टोरेज के लिए उपयोग किए जाते हैं, NAS एक नेटवर्क-बेस्ड स्टोरेज सॉलूशन है जिसे एक साथ कई यूजर द्वारा एक्सेस किया जा सकता है।</li>\r\n\t<li>सॉलिड-स्टेट ड्राइव (SSD): SSD स्टोरेज डिवाइस हैं जो डेटा स्टोर करने के लिए सॉलिड-स्टेट फ्लैश मेमोरी का उपयोग करते हैं। वे पारंपरिक हार्ड डिस्क ड्राइव (HDDs) की तुलना में तेज़, अधिक विश्वसनीय और अधिक ऊर्जा कुशल हैं और उन्हें अक्सर डेस्कटॉप और लैपटॉप कंप्यूटरों में प्राइमरी स्टोरेज डिवाइस के रूप में उपयोग किया जाता है। SSD विभिन्न रूपों में आते हैं, जिसमें डेस्कटॉप और लैपटॉप कंप्यूटरों के लिए मानक 2.5-इंच ड्राइव साइज और अल्ट्राबुक और टैबलेट में उपयोग किए जाने वाले छोटे एम.2 फॉर्म फैक्टर शामिल हैं।</li>\r\n\t<li>USB हार्ड ड्राइव: USB हार्ड ड्राइव पोर्टेबल स्टोरेज डिवाइस हैं जो कंप्यूटर या अन्य डिवाइस से कनेक्ट करने के लिए USB इंटरफ़ेस का उपयोग करते हैं। उनके पास आमतौर पर USB स्टिक की तुलना में बड़ी स्टोरेज क्षमता होती है और अक्सर बड़ी फ़ाइलों, जैसे वीडियो और फ़ोटो को स्टोर करने के लिए उपयोग किया जाता है। USB हार्ड ड्राइव विभिन्न साइज और फार्म फैक्टर में आते हैं, छोटे, पॉकेट-साइज के ड्राइव से लेकर बड़े, डेस्कटॉप-साइज के ड्राइव तक।</li>\r\n\t<li>USB स्टिक: USB स्टिक, जिसे USB फ्लैश ड्राइव या थंब ड्राइव के रूप में भी जाना जाता है, छोटे, पोर्टेबल स्टोरेज डिवाइस हैं जो कंप्यूटर या अन्य डिवाइस से कनेक्ट करने के लिए USB इंटरफ़ेस का उपयोग करते हैं। वे आमतौर पर छोटी फ़ाइलों, जैसे डॉक्यूमेंट, फ़ोटो और म्यूजिक को स्टोर और ट्रांसफर करने के लिए उपयोग किए जाते हैं। USB स्टिक विभिन्न साइज और कपैसिटी में आती हैं, कुछ मेगाबाइट से लेकर कई गीगाबाइट तक।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n\r\n<p>एमएस एक्सेस में किस प्रकार के आंकड़े को लघु पाठ्यांश या शॉर्ट टेक्स्ट कहा जाता है?</p>", "option1": "\r\n\r\n<p>255 वर्णों तक</p>", "option2": "\r\n\r\n<p>63,999 वर्णों तक</p>", "option3": "\r\n\r\n<p>150 वर्णों तक</p>", "option4": "\r\n\r\n<p>255 से 63,999 वर्णों तक</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <u><strong>255 वर्णों तक</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>माइक्रोसॉफ्ट द्वारा एक्सेस 2013 <strong>माइक्रोसॉफ्ट ऑफिस सुइट</strong> का एक हिस्सा है।</li>\r\n\t<li>यह एक <strong>शक्तिशाली डीबीएमएस</strong> है जो <strong>आँकड़ा संचालन</strong> के लिए उपयोग किया जाता है।</li>\r\n\t<li>यह आंकड़ों को <strong>तालिकाओं</strong> के रूप में संग्रहीत करता है और <strong>आंकड़ों पर</strong> सभी प्रकार के<strong> प्रचालन की अनुमति देता है।</strong></li>\r\n\t<li>माइक्रोसॉफ्ट एक्सेस 2013 के घटक निम्नानुसार है\r\n\t<ul>\r\n\t\t<li>तालिका</li>\r\n\t\t<li>पृच्छाएं</li>\r\n\t\t<li>फार्म</li>\r\n\t\t<li>प्रतिवेदन</li>\r\n\t\t<li>स्&zwj;थूलादेश</li>\r\n\t\t<li>प्रतिरूपक</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>एमएस एक्सेस विभिन्न प्रकार के आंकड़ों का समर्थन करता है, कुछ इस प्रकार हैं:</li>\r\n\t<li><strong>लघु प्रकार पाठ्यांश:</strong>\r\n\t<ul>\r\n\t\t<li>यह एक प्रकार का पाठ्यांश या पाठ्यांश और संख्याओं का संयोजन है, जिसमें एक संख्या भी शामिल होती है जिसमें गणना की आवश्यकता नहीं होती है।</li>\r\n\t\t<li>लघु पाठ्यांश का आकार <strong>255 वर्णों तक</strong> होता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>दीर्घ पाठ्यांश</strong>\r\n\t<ul>\r\n\t\t<li>यह दीर्घ पाठ्यांश या पाठ्यांश और संख्याओं का एक संयोजन है।</li>\r\n\t\t<li>दीर्घ पाठ्यांश का आकार <strong>63,999 वर्णों तक</strong> होता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>संख्या</strong>\r\n\t<ul>\r\n\t\t<li>यह <strong>गणितीय गणना</strong> में प्रयुक्त संख्यात्मक आंकड़ा है।</li>\r\n\t\t<li>संख्या का आकार <strong>1,2, 4 या 8 बाइट (16 बाइट यदि समूह आईडी को दोहराता है) है।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>दिनांक/ समय</strong>\r\n\t<ul>\r\n\t\t<li>यह<strong> 100 से 9999 </strong>वर्षों के लिए आंकड़ों और समय का मान है।</li>\r\n\t\t<li>वर्ण का आकार<strong> 8 बाइट </strong>है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>निम्नलिखित में से किस फोल्डर का उपयोग डिलीट किये गए ईमेल को स्टोर करने के लिए किया जाता है?</p>", "option1": "\r\n<p>ट्रैश</p>", "option2": "\r\n<p>स्पैम</p>", "option3": "\r\n<p>इनबॉक्स</p>", "option4": "\r\n<p>ड्राफ्ट</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही विकल्प (1) है। </strong></p>\r\n\r\n<p>ट्रैश </p>\r\n\r\n<ul>\r\n\t<li>आपके द्वारा डिलीट किया गया मेसेज 30 दिनों तक आपके ट्रैश में रहता है। उस बिंदु के बाद यह परमानेंटली इरेज हो जाता है।</li>\r\n\t<li>जीमेल और गूगल ऐप्स पर, स्टोर किया गया मेसेज डिफ़ॉल्ट रूप से आर्काइव फ़ोल्डर या ऑल मेल में जाता है जबकि एक डिलीट किया गया मेसेज ट्रैश फ़ोल्डर में चला जाता है।</li>\r\n\t<li>आपके ईमेल प्रोवाइडर या कंपनी की पॉलिसी (अक्सर 30 दिनों के बाद) के आधार पर आपके द्वारा डिलीट किये गए ईमेल को आपके ट्रैश फ़ोल्डर से परमानेंटली डिलीट किया जा सकता है।</li>\r\n\t<li>अभी अपना जीमेल इनबॉक्स चेक करें। उसमे स्क्रीन के बाईं ओर फ़ोल्डर्स की एक लिस्ट (इनबॉक्स,स्टार्ड, स्पैम, आदि) होती है। आपके द्वारा डिलीट किये गए ईमेल &quot;ट्रैश&quot; या &quot;बिन&quot; (फ़ोल्डर का नाम यूजर की लेंग्वेज प्रेफरेंस पर निर्भर करता है) लेबल वाले फ़ोल्डर में लोकेट होते हैं।</li>\r\n</ul>\r\n\r\n<p><strong>इनबॉक्स:-</strong> यह कंप्यूटर पर एक ऐसी लोकेशन है जिसमे आपके द्वारा भेजे गए ईमेल को स्टोर किया जाता हैं।</p>\r\n\r\n<p><strong>आउटबॉक्स:-</strong> इंटरनेट कनेक्शन के बिना, यूजर ईमेल पढ़ सकते हैं, उनका जवाब दे सकते हैं और उन्हें डिलीट कर सकते हैं। जब भी आप दोबारा ऑनलाइन होते हैं, तो आउटबॉक्स से आपके सभी ईमेल तुरंत भेज दिए जाते हैं। यदि आप इस सुविधा का उपयोग कर रहे हैं तो आपके ईमेल अभी भी जीमेल के आउटबॉक्स में हो सकते हैं।</p>\r\n\r\n<p><strong>स्पैम:- </strong>ईमेल स्पैम, जिसे आमतौर पर जंक ईमेल के रूप में संदर्भित किया जाता है, ग्राहकों की एक बड़ी सूची में बड़े पैमाने पर अवांछित ईमेल संदेश भेजने का अभ्यास है।</p>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>उपयोगकर्ता द्वारा किसी कुकी को हटाने के बाद, यह स्वचालित रूप से पुन: उत्पन्न हो जाती है। इन्हें _______ कुकीज़ कहा जाता है।</p>", "option1": "\r\n<p>तृतीय पक्ष</p>", "option2": "\r\n<p>ज़ोंबी</p>", "option3": "\r\n<p>दृढ़ (परसिस्टेंट)</p>", "option4": "\r\n<p>सत्र (सेशन)</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही विकल्प </strong>2) ज़ोंबी<strong> है।</strong></p>\r\n\r\n<p><strong>व्याख्या:</strong></p>\r\n\r\n<ul>\r\n\t<li>कुकीज़ छोटी टेक्स्ट फ़ाइलें होती हैं जिन्हें वेबसाइटें उपयोगकर्ता के कंप्यूटर या डिवाइस पर स्टोर करती हैं जब वे साइट पर जाते हैं।</li>\r\n\t<li>कुकीज़ का उपयोग विभिन्न उद्देश्यों के लिए किया जा सकता है, जैसे उपयोगकर्ता की प्राथमिकताओं को याद रखना या लॉगिन जानकारी।</li>\r\n\t<li>हालाँकि, कुछ कुकीज़ का उपयोग कई वेबसाइटों पर उपयोगकर्ता की गतिविधि को ट्रैक करने के लिए भी किया जा सकता है, जो गोपनीयता संबंधी चिंताओं को बढ़ा सकता है।</li>\r\n</ul>\r\n\r\n<p><strong>ज़ोंबी</strong></p>\r\n\r\n<ul>\r\n\t<li>ज़ोंबी कुकीज़, जिन्हें &quot;एवरकुकीज़&quot; के रूप में भी जाना जाता है, एक प्रकार की परसिस्टेंट कुकी होती हैं जिन्हें निकालना मुश्किल होता है।</li>\r\n\t<li>ज़ोंबी कुकीज़ का उपयोग किसी उपयोगकर्ता की गतिविधि को ट्रैक करने के लिए किया जा सकता है, भले ही वे अपनी कुकीज़ हटा दें या निजी ब्राउज़िंग मोड का उपयोग करें।</li>\r\n\t<li>एक उपयोगकर्ता द्वारा हटाए जाने के बाद जो कुकीज़ स्वचालित रूप से फिर से बनाई जाती हैं, उन्हें &quot;ज़ोंबी कुकीज़&quot; या &quot;एवरकुकीज़&quot; कहा जाता है।</li>\r\n</ul>\r\n\r\n<p><strong>दृढ़ ( परसिस्टेंट)</strong></p>\r\n\r\n<ul>\r\n\t<li>दृढ़ (परसिस्टेंट) कुकीज ऐसी कुकीज होती हैं जो यूजर के ब्राउजर बंद करने के बाद भी उसके कंप्यूटर या डिवाइस पर बनी रहती हैं।</li>\r\n\t<li>अगली बार वेबसाइट पर जाने पर उपयोगकर्ता की प्राथमिकताओं या लॉगिन जानकारी को याद रखने के लिए इन कुकीज़ का उपयोग किया जा सकता है।</li>\r\n</ul>\r\n\r\n<p><strong>सत्र(सेशन)</strong></p>\r\n\r\n<ul>\r\n\t<li>सेशन कुकीज वे कुकीज होती हैं जो यूजर द्वारा अपना ब्राउजर बंद करने पर डिलीट हो जाती हैं।</li>\r\n\t<li>इन कुकीज़ का उपयोग अक्सर एक ब्राउज़िंग सत्र के दौरान किसी उपयोगकर्ता की गतिविधि पर नज़र रखने के लिए किया जाता है, जैसे शॉपिंग कार्ट में आइटम जोड़ना।</li>\r\n</ul>\r\n\r\n<p><strong>तृतीय पक्ष</strong></p>\r\n\r\n<ul>\r\n\t<li>तृतीय-पक्ष कुकीज़ वे कुकीज़ हैं जो उपयोगकर्ता द्वारा देखे जाने वाले डोमेन के अलावा किसी अन्य डोमेन द्वारा सेट की जाती हैं।</li>\r\n\t<li>उदाहरण के लिए, यदि कोई उपयोगकर्ता किसी वेबसाइट पर जाता है और उस वेबसाइट में किसी तृतीय-पक्ष डोमेन से सामग्री एम्बेड की गई है।</li>\r\n\t<li>जैसे विज्ञापन या सोशल मीडिया प्लगइन, तृतीय-पक्ष डोमेन उपयोगकर्ता के कंप्यूटर पर कुकी सेट कर सकता है।</li>\r\n\t<li>यह तृतीय-पक्ष डोमेन को एकाधिक वेबसाइटों पर उपयोगकर्ता की गतिविधि को ट्रैक करने की अनुमति दे सकता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n<p>जीमेल में एक नया ईमेल मैसेज बनाने के लिए निम्न में से किस विकल्प को प्रेस किया जा सकता है?</p>", "option1": "\r\n<p>सेटिंग</p>", "option2": "\r\n<p>आउटबाउंड</p>", "option3": "\r\n<p>कंपोज़</p>", "option4": "\r\n<p>ड्राफ्ट</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>जीमेल में एक नया ईमेल मैसेज बनाने के लिए जिस सही विकल्प को दबाया जा सकता है वह कंपोज़ है</strong>।</p>\r\n\r\n<ul>\r\n\t<li>जीमेल में, कंपोज़ वह बटन है जिसे क्लिक किया जा सकता है या की जिसे दबाया जा सकता है एक नया ईमेल मैसेज बनाना शुरू करने के लिए।</li>\r\n\t<li>यह आमतौर पर जीमेल विंडो के ऊपरी बाएँ कोने में स्थित होता है, और इसे लाल रंग के &quot;कंपोज़&quot; आइकन द्वारा दर्शाया जाता है।</li>\r\n\t<li>जीमेल में सेटिंग्स, आउटबाउंड और ड्राफ्ट भी बटन हैं, लेकिन उनका उपयोग एक नया ईमेल मैसेज बनाने के लिए नहीं किया जाता है।</li>\r\n\t<li>इसके बजाय, उनका उपयोग जीमेल में अन्य फंक्शन के लिए किया जाता है।</li>\r\n\t<li>सेटिंग्स: इस बटन का उपयोग जीमेल में सेटिंग्स मेनू तक एक्सेस करने के लिए किया जाता है, जहाँ यूजर अपने जीमेल अकाउंट को अनुकूलित कर सकते हैं और विभिन्न सेटिंग्स जैसे फ़िल्टर, थीम और फॉरवार्डिंग ऑप्शन को समायोजित कर सकते हैं।</li>\r\n\t<li>आउटबाउंड: जीमेल में &quot;आउटबाउंड&quot; नाम का कोई बटन नहीं है। यह &quot;सेंट&quot; फ़ोल्डर को संदर्भित कर सकता है, जहां यूजर अपने पहले भेजे गए ईमेल देख सकते हैं।</li>\r\n\t<li>ड्राफ्ट: इस बटन का उपयोग जीमेल में ड्राफ्ट फ़ोल्डर तक एक्सेस करने के लिए किया जाता है, जहाँ यूजर ईमेल ढूंढ सकते हैं कि उन्होंने कोपोज़िंग शुरू कर दिया है लेकिन अभी तक सेंट नहीं किया है।</li>\r\n\t<li>यूजर किसी मैसेज को ड्राफ़्ट के रूप में सेव कर सकते हैं और बाद में उसकी कोपोज़िंग पूरी करने और उसे भेजने के लिए उसे रिटर्न कर सकते हैं। </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n<p>निम्नलिखित में से कौन-सा MS-वर्ड 365 में पैराग्राफ फॉर्मेटिंग का प्रकार नहीं है?</p>", "option1": "\r\n<p>राईट</p>", "option2": "\r\n<p>प्रीसाइज़</p>", "option3": "\r\n<p>जस्टिफाई</p>", "option4": "\r\n<p>सेंटर</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>प्रीसाइज़</u></strong> है।</p>\r\n\r\n<p><strong>MS वर्ड 2016 में &#39;पैराग्राफ&#39; सेटिंग विंडो में उपलब्ध फॉर्मेटिंग विकल्प हैं:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>स्पेसिंग</strong></li>\r\n\t<li><strong>इंडेंटेशन</strong></li>\r\n\t<li><strong>विकल्प लाइन और पेज ब्रेक के तहत पेजिनेशन</strong></li>\r\n\t<li><strong>एलाइनमेंट</strong></li>\r\n</ul>\r\n\r\n<p><strong>पैराग्राफ फॉर्मेटिंग विकल्प इस प्रकार वर्णित हैं:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>एलाइनमेंट</strong>\r\n\r\n\t<ul>\r\n\t\t<li>एलाइनमेंट या जस्टिफिकेशन <strong>उस तरीके को संदर्भित करता है, जिसमें पैराग्राफ  की रेखाएँ  एलाइन  होती हैं।</strong></li>\r\n\t\t<li>संरेखण <strong>चार प्रकार</strong> के होते हैं, अर्थात्, <strong>लेफ्ट, राईट, सेंटर एंड जस्टीफ़ाइड</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>इंडेंटेशन</strong>\r\n\t<ul>\r\n\t\t<li><strong>टेक्स्ट बॉक्स से पहले का मान अतिरिक्त रिक्त स्थान </strong>की चौड़ाई निर्दिष्ट करता है <strong>जो बाएँ-से-दाएँ टेक्स्ट के अनुच्छेद के बाईं ओर मार्जिन और टेक्स्ट के मध्य डाला जाता है।</strong></li>\r\n\t\t<li><strong>आफ्टर टेक्स्ट बॉक्स में मान अतिरिक्त रिक्त स्थान की चौड़ाई </strong>निर्दिष्ट करता है <strong>जो टेक्स्ट और मार्जिन के बीच बाएं से दाएं टेक्स्ट के पैराग्राफ के दाईं ओर डाला जाता है।</strong></li>\r\n\t\t<li>एक ऋणात्मक मान उस दूरी को निर्दिष्ट करता है जिसके द्वारा टेक्स्ट संबंधित मार्जिन से आगे बढ़ता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>स्पेसिंग</strong>\r\n\t<ul>\r\n\t\t<li><strong>दो पैराग्राफ के बीच की रिक्ति एक अनुच्छेद से पहले की रिक्ति और पूर्ववर्ती अनुच्छेद के बाद की रिक्ति द्वारा निर्धारित की जाती</strong> है<strong>, जो पहले और बाद के बक्सों में प्रदर्शित और संशोधित की जा सकती हैं।</strong></li>\r\n\t\t<li>लाइन स्पेसिंग<strong> एक पैराग्राफ के भीतर लाइनों के मध्य लंबवत दूरी </strong>को संदर्भित करता है।</li>\r\n\t\t<li>यह इसके ऊपर की रेखा के सापेक्ष प्रत्येक पंक्ति का स्थान निर्धारित करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>लाइन और पेज ब्रेक्स टैब (पेजिनेशन)</strong>\r\n\t<ul>\r\n\t\t<li><strong>पैराग्राफ डायलॉग बॉक्स के पेजिनेशन के </strong>तहत लाइन और पेज ब्रेक्स टैब पर पैराग्राफ फॉर्मेटिंग विकल्प<strong> आपको यह नियंत्रित करने में मदद कर सकते हैं कि आपके दस्तावेज़ में स्वचालित पेज ब्रेक कहाँ होते हैं।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>एक बार _______ ने कंप्यूटर सिस्टम की एक बड़ी संख्या को इन्फेक्ट कर दिया, तो यह या तो विज्ञापन प्रदर्शित करके या &quot;पे पर क्लिक&quot; तंत्र का उपयोग करके अपने ग्राहकों को उनके डिस्प्ले विज्ञापनों पर क्लिक की संख्या के खिलाफ चार्ज करने के लिए राजस्व उत्पन्न करता है।</p>", "option1": "\r\n<p>वर्म</p>", "option2": "\r\n<p>एडवेयर</p>", "option3": "\r\n<p>स्पाइवेयर</p>", "option4": "\r\n<p>वाइरस</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>एडवेयर:</strong></p>\r\n\r\n<p>एडवेयर एक ऐसा सॉफ्टवेयर है जो अंतिम-उपयोगकर्ताओं को अवांछित और आक्रामक विज्ञापन प्रदर्शित करता है (उदाहरण के लिए, पॉप-अप विज्ञापन)। मालवेयर अंतिम उपयोगकर्ता PC को मैलवेयर वितरित करने के लिए कानूनी विज्ञापनों का उपयोग है।</p>\r\n\r\n<p>एडवेयर सॉफ्टवेयर के यूजर इंटरफेस में या इंस्टॉलेशन प्रक्रिया के दौरान यूजर को दिखाई देने वाली स्क्रीन पर इंटरनेट विज्ञापन दिखाकर अपने निर्माता के लिए नकद कमाता है।</p>\r\n\r\n<p>इसलिए सही उत्तर एडवेयर है।</p>\r\n\r\n<ul>\r\n\t<li>ट्रोजन वायरस वास्तविक सॉफ़्टवेयर के रूप में सामने आता है, जिससे यह मैलवेयर के सबसे कठिन रूपों में से एक की पहचान कर लेता है। इस प्रकार के मैलवेयर में हानिकारक कोड और निर्देश शामिल होते हैं, जिन्हें यदि पीड़ित द्वारा निष्पादित किया जाता है, तो वह बिना पता लगे चल सकते हैं। </li>\r\n\t<li>वर्म में अंतिम उपयोगकर्ता के इनपुट के बिना खुद को दोहराने की क्षमता होती है और यह एक सिस्टम से दूसरे सिस्टम में माइग्रेट करके बड़े नेटवर्क को तेजी से संक्रमित कर सकता है।</li>\r\n\t<li>स्पाइवेयर असंदेही अंतिम उपयोगकर्ताओं, क्रेडेंशियल्स और पासवर्ड, ब्राउज़र हिस्ट्री, और अन्य जानकारी एकत्र करने के लिए जासूसी करता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>URL का पूर्ण रूप क्या होता है?</p>", "option1": "\r\n<p>यूनिफ़ॉर्म रिसोर्स लैंग्वेज</p>", "option2": "\r\n<p>यूनियन रिसोर्स लैंग्वेज</p>", "option3": "\r\n<p>यूनियन  रिसोर्स लोकेटर</p>", "option4": "\r\n<p>यूनिफ़ॉर्म रिसोर्स लोकेटर</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>यूनिफ़ॉर्म रिसोर्स </strong></u><u><strong>लोकेटर</strong></u> है। </p>\r\n\r\n<ul>\r\n\t<li><strong>URL</strong> का पूर्ण रूप <strong>यूनिफ़ॉर्म रिसोर्स लोकेटर</strong> है।</li>\r\n\t<li>URL एक वेब एड्रेस के रूप में कार्य करता है जो <strong>इंटरनेट पर एक विशिष्ट रिसोर्स की लोकेशन की पहचान करता है,</strong> जैसे <strong>वेब पेज, इमेज या डॉक्यूमेंट।</strong></li>\r\n\t<li>URL में <strong>प्रोटोकॉल</strong> (जैसे &quot;http://&quot; या &quot;https://&quot;), <strong>डोमेन नेम और विशिष्ट रिसोर्स के पाथ</strong> सहित विभिन्न घटक होते हैं।</li>\r\n\t<li>URL का उपयोग करके, यूज़र वेब ब्राउजर में URL दर्ज करके <strong>वेब कंटेंट को एक्सेस और रिट्राइव कर सकते हैं</strong>, जिससे इंटरनेट पर सहज नेविगेशन और सूचना की पुनर्प्राप्ति को सक्षम किया जा सकता है।</li>\r\n\t<li>कुछ अन्य महत्वपूर्ण पूर्ण रूप इस प्रकार हैं:\r\n\t<ul>\r\n\t\t<li><strong>RAM:</strong> रैंडम एक्सेस मेमोरी</li>\r\n\t\t<li><strong>ROM:</strong> रीड-ओनली मेमोरी</li>\r\n\t\t<li><strong>CPU:</strong> सेंट्रल प्रोसेसिंग यूनिट</li>\r\n\t\t<li><strong>GPU:</strong> ग्राफिक्स प्रोसेसिंग यूनिट</li>\r\n\t\t<li><strong>BIOS:</strong> बेसिक इनपुट/आउटपुट सिस्टम</li>\r\n\t\t<li><strong>LAN:</strong> लोकल एरिया नेटवर्क</li>\r\n\t\t<li><strong>WAN:</strong> वाइड एरिया नेटवर्क</li>\r\n\t\t<li><strong>USB:</strong> यूनिवर्सल सीरियल बस</li>\r\n\t\t<li><strong>HDMI:</strong> हाई-डेफिनिशन मल्टीमीडिया इंटरफ़ेस</li>\r\n\t\t<li><strong>SSD:</strong> सॉलिड स्टेट ड्राइव</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>निम्न में से कौन सा वेब ब्राउज़र माइक्रोसॉफ्ट द्वारा बनाया और विकसित किया गया है?</p>", "option1": "\r\n<p>ओपेरा</p>", "option2": "\r\n<p>क्रोम</p>", "option3": "\r\n<p>एज </p>", "option4": "\r\n<p>ब्रेव</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तरमा<strong><u>इक्रोसॉफ्ट </u></strong><u><strong> एज</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>माइक्रोसॉफ्ट  के नए विंडोज 10 वेब ब्राउजर का नाम &#39;<strong>माइक्रोसॉफ्ट एज</strong>&#39; होगा।</li>\r\n\t<li>माइक्रोसॉफ्ट एज, <strong>माइक्रोसॉफ्ट द्वारा विकसित एक क्रॉस-प्लेटफ़ॉर्म वेब ब्राउज़र</strong> है।</li>\r\n\t<li>इसे पहली बार <strong>विंडोज 10 और एक्सबॉक्स</strong><strong>वन </strong>के लिए <strong>2015 </strong>में जारी किया गया था।</li>\r\n\t<li>फिर 2017 में एंड्रॉइड और iOS के लिए, मेकोस के लिए 2019 में और अक्टूबर 2020 में लिनक्स के पूर्वावलोकन के रूप में।</li>\r\n\t<li>एज का कोर्टना के साथ एकीकरण है और इसके एक्सटेंशन माइक्रोसॉफ्ट स्टोर पर होस्ट किए गए हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n<p>माइक्रोसॉफ्ट-वर्ड 365 में कर्सर को एक शब्द के बाईं ओर ले जाने के लिए निम्न में से किस शॉर्टकट की का उपयोग किया जाता है?</p>", "option1": "\r\n<p>Ctrl + लेफ्ट एरो की </p>", "option2": "\r\n<p>Shift + लेफ्ट एरो की </p>", "option3": "\r\n<p>Shift + PageUp की </p>", "option4": "\r\n<p>Ctrl + PageUp की </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>Ctrl + लेफ्ट एरो की</strong></u> है। </p>\r\n\r\n<ul>\r\n\t<li><strong>Ctrl + लेफ्ट एरो </strong>की वह शॉर्टकट की है, जिसका उपयोग माइक्रोसॉफ्ट-वर्ड 365 में कर्सर को एक वर्ड के बाईं ओर ले जाने के लिए किया जा सकता है।</li>\r\n\t<li>यह शॉर्टकट की <strong>कर्सर को </strong>वर्तमान कर्सर स्थिति के<strong> बाईं ओर एक वर्ड से दूसरे वर्ड पर जाने में सक्षम बनाती है,</strong> जिससे आसान एडिटिंग और फॉर्मेटिंग की सुविधा मिलती है।</li>\r\n\t<li>माइक्रोसॉफ्ट-वर्ड 365 सहित विभिन्न वर्ड प्रोसेसिंग एप्लिकेशन्स में Ctrl + लेफ्ट एरो शॉर्टकट की आमतौर पर उपयोग की जाने वाली विशेषता है, जो इसे विभिन्न सॉफ़्टवेयर प्लेटफ़ॉर्म में उत्पादकता में सुधार के लिए एक मूल्यवान कौशल बनाती है।</li>\r\n\t<li>उसी तरह, <strong>Ctrl + राइट एरो </strong>का उपयोग करके, आप अपने माइक्रोसॉफ्ट-वर्ड 365 डॉक्यूमेंट में <strong>कर्सर को वर्तमान कर्सर स्थिति के दाईं ओर अगले शब्द की शुरुआत में </strong>तेजी से <strong>ले जा सकते हैं।</strong></li>\r\n\t<li><strong>shift + लेफ्ट एरो की </strong>\r\n\t<ul>\r\n\t\t<li><strong>शिफ्ट की को दबाए रखते हुए और लेफ्ट एरो की दबाकर, </strong>आप अपने माइक्रोसॉफ्ट-वर्ड 365 डॉक्यूमेंट में<strong> टेक्स्ट के सिलेक्शन को वर्तमान कर्सर स्थिति के बाईं ओर बढ़ा </strong>सकते हैं।</li>\r\n\t\t<li>यह शॉर्टकट की वर्ड या कैरेक्टर द्वारा टेक्स्ट के सटीक और कुशल सिलेक्शन की अनुमति देती है, यह इस बात पर निर्भर करता है कि &#39;शिफ्ट&#39; दबाए रखते हुए &#39;लेफ्ट एरो&#39; की कितनी बार दबाई जाती है।</li>\r\n\t\t<li>टेक्स्ट को सेलेक्ट करने के लिए मैन्युअल रूप से क्लिक करने और ड्रैग करने के बजाय, shift + लेफ्ट एरो टेक्स्ट को हाइलाइट करने का एक तेज़ तरीका प्रदान करता है, समय और प्रयास की बचत करता है, विशेष रूप से बड़ी मात्रा में टेक्स्ट के साथ काम करते समय।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Shift + PageUp</strong>\r\n\t<ul>\r\n\t\t<li><strong>शिफ्ट की को दबाए रखकर और पेज-अप की को दबाकर, </strong>आप अपने माइक्रोसॉफ्ट-वर्ड 365 डॉक्यूमेंट में<strong> टेक्स्ट के सिलेक्शन को वर्तमान कर्सर स्थिति से एक पेज ऊपर की ओर बढ़ा </strong>सकते हैं।</li>\r\n\t\t<li>यह शॉर्टकट की कई पेजेज में फैले टेक्स्ट के बड़े हिस्से के कुशल सिलेक्शन की अनुमति देती है, जिससे सामग्री को एडिट करना, फॉर्मेट करना या कॉपी और पेस्ट करना आसान हो जाता है।</li>\r\n\t\t<li>शिफ्ट + पेजअप तेजी से टेक्स्ट को नेविगेट करने और सिलेक्ट करने में मदद करता है, खासकर जब आपको कई पेजों में फैले टेक्स्ट के महत्वपूर्ण हिस्सों के साथ काम करने की आवश्यकता होती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Ctrl + PageUp</strong>\r\n\t<ul>\r\n\t\t<li><strong>Ctrl + पेजअप दबाकर, </strong>आप अपने माइक्रोसॉफ्ट-वर्ड 365 एप्लिकेशन<strong> में पिछले टैब या डॉक्यूमेंट पेज पर तेज़ी से स्विच </strong>कर सकते हैं।</li>\r\n\t\t<li>यह शॉर्टकट की एक साथ कई टैब या डॉक्यूमेंट्स के साथ काम करते समय विशेष रूप से उपयोगी होती है, जिससे आप मैन्युअल क्लिक या स्क्रॉलिंग की आवश्यकता के बिना आसानी से उनके बीच नेविगेट कर सकते हैं।</li>\r\n\t\t<li>यह आपके माइक्रोसॉफ्ट-वर्ड 365 एप्लिकेशन के भीतर विभिन्न सेक्शंस या सामग्री के बीच स्विच करने का एक त्वरित तरीका प्रदान करके उत्पादकता को बढ़ाता है, जिससे आपके समग्र वर्कफ़्लो और टास्क मैनेजमेंट में सुधार होता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>निम्नलिखित में से किस पीढ़ी के कंप्यूटर ने पहली बार ट्रांजिस्टर की तकनीक का उपयोग किया था?</p>", "option1": "\r\n<p>तीसरी </p>", "option2": "\r\n<p>दूसरी </p>", "option3": "\r\n<p>पहली </p>", "option4": "\r\n<p>चौथी</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही उत्तर है अर्थात कंप्यूटर की दूसरी पीढ़ी ने पहली बार ट्रांजिस्टर की तकनीक का इस्तेमाल किया।</strong></p>\r\n\r\n<ul>\r\n\t<li>कंप्यूटर की दूसरी पीढ़ी (1956-1963) ने वैक्यूम ट्यूबों के बजाय ट्रांजिस्टर का इस्तेमाल किया, जो कि कंप्यूटर की पहली पीढ़ी में इस्तेमाल किया गया था।</li>\r\n\t<li>ट्रांजिस्टर वैक्यूम ट्यूब की तुलना में छोटे, तेज और अधिक विश्वसनीय थे और वे कम बिजली की खपत करते थे।</li>\r\n\t<li>कंप्यूटर प्रौद्योगिकी में ट्रांजिस्टर का विकास एक बड़ी सफलता थी, क्योंकि इसने छोटे, तेज और अधिक विश्वसनीय कंप्यूटरों के निर्माण की अनुमति दी थी।</li>\r\n\t<li>कंप्यूटर की दूसरी पीढ़ी ने भी मैग्नेटिक कोर मेमोरी की शुरूआत देखी, जो कंप्यूटर की पहली पीढ़ी में उपयोग की जाने वाली ड्रम मेमोरी की तुलना में तेज और अधिक विश्वसनीय थी।</li>\r\n\t<li>तीसरी पीढ़ी: कंप्यूटर की तीसरी पीढ़ी (1964-1971) ने इंटीग्रेटेड  सर्किट की शुरुआत देखी, जो ट्रांजिस्टर की तुलना में छोटे और अधिक विश्वसनीय थे। इंटीग्रेटेड  सर्किट ने और भी छोटे और तेज़ कंप्यूटरों के निर्माण की अनुमति दी और उन्होंने माइक्रोप्रोसेसरों के विकास का मार्ग प्रशस्त किया।</li>\r\n\t<li>पहली पीढ़ी: कंप्यूटर की पहली पीढ़ी (1940-1950 के दशक) में प्राइमरी इलेक्ट्रॉनिक कॉम्पोनेन्ट के रूप में वैक्यूम ट्यूब का उपयोग किया गया था। वैक्यूम ट्यूब बड़े, नाजुक और बहुत अधिक बिजली की खपत करते थे और वे विफल होने का खतरा था। पहली पीढ़ी के कंप्यूटर विशाल, महंगे थे और मुख्य रूप से वैज्ञानिक और सैन्य एप्लीकेशन के लिए उपयोग किए जाते थे।</li>\r\n\t<li>चौथी पीढ़ी: कंप्यूटर की चौथी पीढ़ी (1971-1989) में माइक्रोप्रोसेसरों की शुरुआत देखी गई, जो इंटीग्रेटेड सर्किट थे जिसमें कंप्यूटर की सेंट्रल प्रोसेसिंग यूनिट (सी.पी.यू.) के सभी कॉम्पोनेन्ट एक चिप पर समाहित थे। माइक्रोप्रोसेसर पिछली पीढ़ी के कंप्यूटरों की तुलना में छोटे, तेज और अधिक ऊर्जा-कुशल थे, और उन्होंने पर्सनल कंप्यूटर (पी.सी.) के विकास का नेतृत्व किया। कंप्यूटर की चौथी पीढ़ी ने ग्राफिकल यूजर इंटरफेस (जी.यू.आई.) और माउस के विकास को भी देखा, जिसने कंप्यूटर को अधिक यूजर के अनुकूल और नॉन-टेक्निकल यूजर के लिए सुलभ बना दिया।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>निम्नलिखित में से किस डिवाइस को विजुअल डिस्प्ले यूनिट (VDU) के रूप में भी जाना जाता है?</p>", "option1": "\r\n<p>प्रिंटर</p>", "option2": "\r\n<p>स्कैनर</p>", "option3": "\r\n<p>ट्रैक बॉल</p>", "option4": "\r\n<p>मॉनिटर</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u>वर्चुअल डिस्प्ले यूनिट (VDU)</u></p>\r\n\r\n<ul>\r\n\t<li>इसे &quot;मॉनिटर&quot; भी कहा जाता है या समानार्थक रूप से प्रयोग किया जाता है जो कंप्यूटर का एक आउटपुट डिवाइस है।</li>\r\n\t<li>इसमें लाखों छोटे प्रकाश कण होते हैं जिन्हें पिक्सेल कहा जाता है, जो छवि बनाने के लिए ऊर्ध्वाधर और क्षैतिज रेखाओं में व्यवस्थित होते हैं।</li>\r\n\t<li>जब भी उपयोगकर्ता किसी इनपुट डिवाइस का उपयोग करके प्रवेश करता है तो VDU या मॉनिटर दर्ज किए गए <strong>टेक्स्ट</strong> या छवियों या ग्राफ़िक्स को प्रदर्शित करता है।</li>\r\n\t<li>VDU CRT प्रकार का मॉनिटर है जिसका मुख्य भाग कैथोड रे ट्यूब है, जिसे आमतौर पर पिक्चर ट्यूब कहा जाता है।</li>\r\n\t<li>CRT तकनीक एक सस्ता और अच्छा कलर आउटपुट प्रदान करती है।</li>\r\n\t<li>दृश्य प्रदर्शन इकाइयों के प्रकार:\r\n\t<ul>\r\n\t\t<li>लिक्विड क्रिस्टल डिस्प्ले</li>\r\n\t\t<li>एलईडी बैकलाइट के साथ एलसीडी</li>\r\n\t\t<li>कैथोड रे ट्यूब</li>\r\n\t\t<li>प्लाज्मा</li>\r\n\t\t<li>LED</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>इसलिए, सही उत्तर विकल्प 4 है।</p>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>______ प्रिंटर की गति करैक्टर प्रति सेकंड (CPS) में मापी जाती है।</p>", "option1": "\r\n<p>डॉट मैट्रिक्स</p>", "option2": "\r\n<p>लाइन</p>", "option3": "\r\n<p>इंक-जेट</p>", "option4": "\r\n<p>लेजर</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>डॉट मैट्रिक्स</strong> है।</p>\r\n\r\n<ul>\r\n\t<li>प्रिंट रिज़ॉल्यूशन को <u><strong>डॉट्स प्रति इंच (</strong><u><strong>dpi</strong></u><strong>)</strong></u> की संख्या के रूप में मापा जाता है।\r\n\r\n\t<ul>\r\n\t\t<li>यह कहा जा सकता है कि रिज़ॉल्यूशन (प्रिंट के संदर्भ में) डॉट्स की संख्या का एक माप है जो एक डिवाइस पेज स्पेस के एक वर्ग इंच में डाल सकता है।</li>\r\n\t\t<li><strong>डॉट घनत्व जितना अधिक होगा, प्रिंट या स्कैन का रिज़ॉल्यूशन उतना ही अधिक होगा।</strong></li>\r\n\t\t<li>600 DPI वाला एक प्रिंटर एक प्रिंटर है जो 600 x 600 प्रति वर्ग इंच या 360,000 डॉट प्रति इंच प्रिंट करता है।</li>\r\n\t\t<li>DPI बढ़ाने से प्रिंटेड इमेज का आकार छोटा हो जाएगा जबकि DPI कम करने से प्रिंटेड इमेज का आकार बड़ा हो जाएगा।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>करैक्टर प्रति सेकंड (cps) </strong>माप की एक इकाई है जिसका उपयोग डॉट-मैट्रिक्स और डेजी-व्हील प्रिंटर की गति का वर्णन करने के लिए किया जाता है।</li>\r\n\t<li><strong>लाइन-प्रति-मिनट (LPM) टेक्स्ट</strong> की लाइनों की संख्या है जो एक प्रिंटर एक मिनट में उत्पादन करने में सक्षम है। यह टेक्स्ट के आकार, रिज़ॉल्यूशन और कलर जैसे कारकों से प्रभावित होता है।</li>\r\n\t<li><strong>पेज प्रति मिनट (PPM)</strong> एक प्रिंटर गति मापन मानक है। यह माप मानक है कि एक प्रिंटर कितनी तेजी से एक मानकीकृत पृष्ठ को प्रिंट कर सकता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>निम्नलिखित में से किस पोर्ट को माउस पोर्ट भी कहा जाता है?</p>", "option1": "\r\n<p>वीडियो ग्राफिक ऐरे</p>", "option2": "\r\n<p>हाई डेफिनिशन मीडिया इंटरफेस</p>", "option3": "\r\n<p>फायरवायर</p>", "option4": "\r\n<p>PS/2</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>PS/2 </strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li>विभिन्न प्रकार के कंप्यूटर पोर्ट हैं जैसे USB पोर्ट, ईथरनेट पोर्ट, PS/2 पोर्ट, VGA पोर्ट आदि।</li>\r\n\t<li><strong>DIN एक गोल कनेक्टर है जिसमें PC कीबोर्ड, मिडी उपकरणों आदि को जोड़ने के लिए उपयोग किए जाने वाले एक परिपत्र पैटर्न में व्यवस्थित पिन होते हैं।</strong></li>\r\n\t<li>नियमित DIN की तुलना में मिनी DIN कनेक्टर आकार में छोटे होते हैं, लेकिन पिन सामान्य DIN के विपरीत क्षैतिज रूप से व्यवस्थित होते हैं।</li>\r\n\t<li><strong>PS/2 या PS/02 एक DIN कनेक्टर है, जो 6 पिन के साथ उपलब्ध है। इसका उपयोग कीबोर्ड और माउस को जोड़ने के लिए किया जाता है और इसे IBM द्वारा विकसित किया गया था। अतः विकल्प 3 सही है।</strong></li>\r\n\t<li><strong>ये पोर्ट अलग-अलग रंगों में उपलब्ध होते हैं जैसे कीबोर्ड के लिए पर्पल और माउस के लिए हरा।</strong></li>\r\n\t<li><strong>वीडियो ग्राफ़िक्स ऐरे या </strong>VGA <strong>पोर्ट एक 3-पंक्ति 15-पिन कनेक्टर है। इसका उपयोग मॉनिटर, वीडियो कार्ड, प्रोजेक्टर आदि</strong> में किया जाता है। यह पोर्ट 648X480 रिज़ॉल्यूशन तक के वीडियो सिग्नल को वहन करता है।</li>\r\n\t<li><strong>USB पोर्ट का कार्य कंप्यूटर के बाह्य उपकरणों जैसे प्रिंटर, कीबोर्ड, बाहरी हार्ड ड्राइव आदि को जोड़ना है।</strong></li>\r\n\t<li>ईथरनेट पोर्ट का उपयोग PC के नेटवर्क केबल के रूप में किया जाता है। यह कंप्यूटर से इंटरनेट कनेक्शन स्थापित करता है। <strong>यह एक लोकल एरिया नेटवर्क या LAN है।</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>सेकेंडरी मेमोरी के बारे में निम्नलिखित में से कौन-सा कथन गलत है?</p>", "option1": "\r\n<p>इसे बैकअप मेमोरी के रूप में जाना जाता है।</p>", "option2": "\r\n<p>बिजली बंद होने पर भी डेटा स्थायी रूप से स्टोर होता है।</p>", "option3": "\r\n<p>कंप्यूटर सेकेंडरी मेमोरी के बिना रन हो सकता है।</p>", "option4": "\r\n<p>यह एक अस्थिर (वोलेटाइल) मेमोरी है।</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>सही उत्तर है: यह एक अस्थिर (वोलेटाइल) मेमोरी है।</strong></p>\r\n\r\n<ul>\r\n\t<li>सेकेंडरी मेमोरी को सहायक मेमोरी या एक्सटर्नल मेमोरी के रूप में भी जाना जाता है।</li>\r\n\t<li>यह एक प्रकार की कंप्यूटर मेमोरी है जिसका उपयोग डेटा और प्रोग्राम के लॉन्ग-टर्म स्टोरेज के लिए किया जाता है और यह सीधे सी.पी.यू. के लिए एक्सेसिबल नहीं होती है।</li>\r\n\t<li>सेकेंडरी मेमोरी नॉन-वोलेटाइल होती है, जिसका अर्थ है कि बिजली बंद होने पर इसमें स्टोर डेटा नष्ट नहीं होता है।</li>\r\n\t<li>इसका उपयोग ऑपरेटिंग सिस्टम, सॉफ़्टवेयर एप्लिकेशन, डॉक्यूमेंट, मीडिया फ़ाइलें और अन्य प्रकार के डेटा को स्टोर करने जैसे कार्यों के लिए किया जाता है, जिन्हें बार-बार एक्सेस करने की आवश्यकता होती है, लेकिन कंप्यूटर की प्राइमरी मेमोरी (RAM) में रखने की आवश्यकता नहीं होती है।</li>\r\n\t<li>इसे बैकअप मेमोरी के रूप में जाना जाता है: यह कथन सही है। सेकेंडरी मेमोरी का उपयोग अक्सर प्राइमरी मेमोरी (RAM) में स्टोर डेटा के बैकअप के रूप में किया जाता है।</li>\r\n\t<li>ऐसा इसलिए है क्योंकि RAM में स्टोर डेटा अस्थिर होता है और अगर बिजली बंद हो जाती है या सिस्टम क्रैश हो जाता है तो वह खो सकता है।</li>\r\n\t<li>इसके विपरीत, सेकेंडरी मेमोरी में स्टोर डेटा नॉन-वोलेटाइल होता है और कंप्यूटर के अप्रत्याशित रूप से बंद हो जाने पर भी इसे रिट्रीव किया जा सकता है।</li>\r\n\t<li>बिजली बंद होने पर भी डेटा स्थायी रूप से स्टोर होता है: यह कथन सही है।</li>\r\n\t<li>जैसा कि पहले उल्लेख किया गया है, सेकेंडरी मेमोरी नॉन-वोलेटाइल होती है, जिसका अर्थ है कि यह बिजली बंद होने पर भी डेटा को बरकरार रखती है।</li>\r\n\t<li>यह प्राइमरी मेमोरी (RAM) के विपरीत है, जो अस्थिर है और बिजली बंद होने पर इसका कंटेंट खो देती है।</li>\r\n\t<li>कंप्यूटर सेकेंडरी मेमोरी के बिना रन हो सकता है: यह कथन भी सही है।</li>\r\n\t<li>जबकि सेकेंडरी मेमोरी कंप्यूटर सिस्टम का एक महत्वपूर्ण कॉम्पोनेन्ट है, फिर भी कंप्यूटर इसके बिना रन हो सकता है।</li>\r\n\t<li>हालाँकि, सेकेंडरी मेमोरी की अनुपस्थिति डेटा और प्रोग्राम की मात्रा को सीमित कर देगी जिसे कंप्यूटर स्टोर और एक्सेस कर सकता है।</li>\r\n\t<li>कंप्यूटर को पूरी तरह से अपनी प्राइमरी मेमोरी (RAM) पर निर्भर रहना होगा, जो आमतौर पर सेकेंडरी मेमोरी की तुलना में क्षमता में बहुत कम होती है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n<p>सर टिम बर्नर्स-ली - एक ब्रिटिश कंप्यूटर वैज्ञानिक ने ______ में क्रांतिकारी वर्ल्ड वाइड वेब का आविष्कार किया।</p>", "option1": "\r\n<p>1982</p>", "option2": "\r\n<p>1995</p>", "option3": "\r\n<p>1990</p>", "option4": "\r\n<p>1985</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>1990</u></strong> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>टिम बर्नर्स-ली,</strong> एक ब्रिटिश कंप्यूटर वैज्ञानिक, को आमतौर पर<strong> वर्ल्ड वाइड वेब के आविष्कारक</strong> के रूप में श्रेय दिया जाता है।</li>\r\n\t<li>वर्ल्ड वाइड वेब का विकास <strong>1989 में</strong> जिनेवा, स्विट्जरलैंड में स्थित एक अंतरराष्ट्रीय वैज्ञानिक संगठ<strong>न CERN में टिम बर्नर्स-ली और उनके सहयोगियों द्वारा शुरू किया गया था।</strong></li>\r\n\t<li>2004 में उन्हें<strong> यूनाइटेड किंगडम की महारानी एलिजाबेथ द्वितीय</strong> द्वारा नाइटहुड और फ़िनिश टेक्नोलॉजी अवार्ड फाउंडेशन द्वारा उद्घाटन <strong>मिलेनियम प्रौद्योगिकी पुरस्कार</strong> से सम्मानित किया गया।</li>\r\n</ul>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"col\">आविष्कार</th>\r\n\t\t\t<th scope=\"col\">खोजकर्ता </th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>टेलीफोन</td>\r\n\t\t\t<td>एलेक्ज़ेंडर ग्राहम बेल</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>विद्युत</td>\r\n\t\t\t<td>बेंजामिन फ्रैंकलिन</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>पेनिसिलिन</td>\r\n\t\t\t<td>अलेक्जेंडर फ्लेमिंग</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>सापेक्षतावाद</td>\r\n\t\t\t<td>अल्बर्ट आइंस्टीन</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>इंटरनेट</td>\r\n\t\t\t<td>विंटन सर्फ और बॉब कान</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>DNA संरचना</td>\r\n\t\t\t<td>जेम्स वाटसन और फ्रांसिस क्रिक</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>सूक्ष्मदर्शी</td>\r\n\t\t\t<td>जकारिया जानसेन</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>मुद्रणालय</td>\r\n\t\t\t<td>जोहान्स गुटेनबर्ग</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>एक्स-रे</td>\r\n\t\t\t<td>विलियम कॉनराड रॉन्टगन</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>भाप-इंजन</td>\r\n\t\t\t<td>जेम्स वॉट</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<p><strong>नोट:</strong></p>\r\n\r\n<p>टिम बर्नर्स-ली ने वास्तव में वर्ल्ड वाइड वेब के विचार पर 1989 में यूरोपीय भौतिकी अनुसंधान केंद्र CERN में काम करना शुरू किया था। हालाँकि, इंटरनेट के माध्यम से एक वेब ब्राउज़र और एक सर्वर के बीच पहला सफल संचार 25 दिसंबर, 1990 को हुआ था। क्योंकि दिए गए विकल्पों में 1989 शामिल नहीं है, निकटतम सटीक विकल्प होगा:</p>\r\n\r\n<p><strong>1990</strong></p>\r\n\r\n<p>यह उस वर्ष का प्रतिनिधित्व करता है जब वर्ल्ड वाइड वेब एक फंक्शनल एंटिटी बन गया था। हालाँकि, यदि 1989 एक विकल्प होता, तो यह व्यू  के लिए सबसे सटीक विकल्प होता कि बर्नर्स-ली ने पहली बार इस अवधारणा को कब विकसित करना शुरू किया था।</p>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n<p>_______ को प्रोटोकॉल कन्वर्टर के रूप में भी जाना जाता है।</p>", "option1": "\r\n<p>हब</p>", "option2": "\r\n<p>ब्रिज</p>", "option3": "\r\n<p>स्विच</p>", "option4": "\r\n<p>गेटवे</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>4</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>गेटवे उपकरणों के संपर्क के लिए दूरसंचार के क्षेत्र में लागू नेटवर्किंग हार्डवेयर सिस्टम का एक घटक हो सकता है, जो एक असतत नेटवर्क से दूसरे तक सूचना प्रवाह को सक्षम करता है।</strong></li>\r\n\t<li>वे राउटर या स्विच के रूप में कार्य करते हैं जो कई नेटवर्क के साथ इंटरैक्ट करने में सक्षम हैं और OSI मॉडल की सात परतों पर काम कर सकते हैं।</li>\r\n\t<li>वे यूनिडायरेक्शनल हो सकते हैं (डेटा को केवल एक दिशा में प्रवाहित करने की अनुमति देते हैं) या द्विदिश (डेटा को नेटवर्क के अंदर और बाहर दोनों में प्रवाहित करने की अनुमति देते हैं)। अतः कथन 2 सही नहीं है।</li>\r\n\t<li>गेटवे को नेटवर्क कनेक्टर और प्रोटोकॉल कन्वर्टर के रूप में भी जाना जाता है।</li>\r\n\t<li><strong>नोड:</strong>\r\n\t<ul>\r\n\t\t<li>एक नोड डेटा संचार नेटवर्क के भीतर प्रतिच्छेदन/कनेक्शन का बिंदु भी हो सकता है।</li>\r\n\t\t<li>ऐसे वातावरण में जहां सभी उपकरण नेटवर्क के माध्यम से पहुंच योग्य हैं, इन सभी उपकरणों को नोड माना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>ब्रिज :</strong>\r\n\t<ul>\r\n\t\t<li>ब्रिज का उपयोग दो उप-नेटवर्कों को जोड़ने के लिए किया जाता है जो विनिमेय प्रोटोकॉल का उपयोग करते हैं।</li>\r\n\t\t<li>यह एक विस्तारित LAN बनाने के लिए दो LAN को जोड़ता है।</li>\r\n\t\t<li>ब्रिज और पुनरावर्तक के बीच सबसे महत्वपूर्ण अंतर यह है कि ब्रिज की मर्मज्ञ दक्षता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>रूटर:</strong>\r\n\t<ul>\r\n\t\t<li>राउटर कंप्यूटर नेटवर्क पर डेटा प्राप्त करता है और भेजता है।</li>\r\n\t\t<li>राउटर कभी-कभी नेटवर्क हब, मोडेम या नेटवर्क स्विच के साथ भ्रमित हो जाते हैं।</li>\r\n\t\t<li>हालाँकि, राउटर इन घटकों के कार्यों को जोड़ सकते हैं, और इंटरनेट एक्सेस को सुदृढ़ करने या व्यावसायिक नेटवर्क बनाने में मदद करने के लिए इन उपकरणों से जुड़ सकते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n\r\n<p>विंडोज़ 10 में विंडोज़ स्क्रीन को लॉक करने के लिए निम्न में से किस की-बोर्ड शॉर्टकट का प्रयोग किया जाता है?</p>", "option1": "\r\n\r\n<p>विंडोज लोगो कुंजी + M</p>", "option2": "\r\n\r\n<p>विंडोज लोगो कुंजी + K</p>", "option3": "\r\n\r\n<p>विंडोज लोगो कुंजी + N</p>", "option4": "\r\n\r\n<p>विंडोज लोगो कुंजी + L</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <strong><u>विंडोज लोगो कुंजी + L</u></strong> है।</p>\r\n\r\n<ul>\r\n\t<li>मेनू आपके पीसी को लॉक करने के लिए एक विकल्प प्रदान करता है। <strong>स्टार्ट बटन</strong> (विंडोज आइकन) पर क्लिक करें, अपना खाता नाम चुनें और फिर &quot;लॉक करें&quot; पर क्लिक करें।</li>\r\n\t<li><strong>स्टार्ट मेनू</strong> से इसे लॉक करने के अलावा, निष्क्रियता की अवधि के बाद इसे अपने आप लॉक होने देना, और जब यह महसूस होता है कि आपने इसे छोड़ दिया है, तो ब्लूटूथ का उपयोग करके लॉक करने के अलावा, त्वरित कीबोर्ड शॉर्टकट के साथ विंडोज़ को लॉक करने के दो तरीके हैं।</li>\r\n\t<li>Ctrl Alt Delete कीबोर्ड शॉर्टकट आमतौर पर अनुत्तरदायी सॉफ़्टवेयर को खत्म करने के लिए उपयोग किया जाता है, लेकिन आप इसका उपयोग अपने कंप्यूटर को लॉक करने के लिए भी कर सकते हैं। Ctrl Alt Delete दबाएं, और फिर दिखाई देने वाले मेनू में &quot;लॉक&quot; पर क्लिक करें।</li>\r\n\t<li>स्क्रीन को लॉक करने का एक और तीव्रतर विधि &mdash; इसे एक कीस्ट्रोक में प्रयोग कर किया जा सकता है। विंडोज और L कुंजी को एक साथ दबाने से जो इसे तुरंत लॉक कर देता है।</li>\r\n\t<li>विंडोज लोगो कुंजी + l  का प्रयोग <strong>कंप्यूटर को लॉक करने के लिए किया जाता है</strong></li>\r\n\t<li>विंडोज लोगो कुंजी + i  का प्रयोग <strong>सेटिंग पेज खोलने के लिए किया जाता है। </strong></li>\r\n\t<li>विंडोज लोगो कुंजी + f  का प्रयोग <strong>फीडबैक हब पेज को खोलने के लिए किया जाता है।</strong></li>\r\n\t<li>विंडोज लोगो कुंजी + r  का प्रयोग <strong>चालू विंडो पेज खोलने के लिए किया जाता है।</strong></li>\r\n</ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
