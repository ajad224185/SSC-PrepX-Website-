<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>43.) SSC CGL Tier II (Paper-I) Mock 12 (Hindi - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

<script>

const questions = [{"sr_no": 1, "question": "<div><p>निम्नलिखित श्रृंखला में कौन सी संख्या प्रश्न चिह्न (?) का स्थान लेगी?</p> 98, 95, 86, 82, 66, ?, 36</div>", "option1": "<p>61</p>", "option2": "<p>58</p>", "option3": "<p>63</p>", "option4": "<p>60</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<div><p>अनुसरित स्वरूप निम्न प्रकार है:</p><p>98 – 3 = 95</p><p>95 - 3<sup>2 </sup>= 86</p><p>86 – 4 = 82</p><p>82 - 4<sup>2 </sup>= 66</p><p><strong>66 – 5 = 61 </strong></p><p>61 - 5<sup>2 </sup>= 36</p> इसलिए 61 सही उत्तर है।</div>", "question_heading": ""}, {"sr_no": 2, "question": "<p>1 मीटर की ऊंचाई और 140 सेमी के आधार व्यास वाला एक बंद बेलनाकार टैंक धातु की चादर से बनाया जाना चाहिए। इसके लिए कितने मीटर<sup>2</sup> चादर की आवश्यकता होगी? [π = 22/7 का प्रयोग करें]</p>", "option1": "<p>10.56 मीटर<sup>2</sup></p>", "option2": "<p>7.48 मीटर<sup>2</sup></p>", "option3": "<p>9.23 मीटर<sup>2</sup></p>", "option4": "<p>7 <span>मीटर</span><sup>2</sup></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>दिया गया है:</strong></p><p>बेलन की ऊँचाई = 1 मीटर</p><p>व्यास = 140 सेमी = 1.4 मीटर, इसलिए त्रिज्या = 1.4/2 = 0.7 मीटर</p><p><strong>प्रयुक्त अवधारणा:</strong></p><p>बेलन का कुल पृष्ठीय क्षेत्रफल = 2πrh + 2πr<sup>2</sup></p><p><strong>गणना:</strong></p><p>कुल आवश्यक शीट = <span>2πrh + 2πr<sup>2</sup> = 2πr(h + r)</span></p><p><span>⇒ 2 × 22/7 × 0.7 × (1 + 0.7)</span></p><p><span>⇒ 4.4 × 1.7</span></p><p><span>⇒ 7.48 मीटर<sup>2</sup></span></p><p><span><span>∴ सही उत्तर</span></span><strong><span>7.48 मीटर</span><sup>2</sup></strong> है। <strong><span></span></strong></p>", "question_heading": ""}, {"sr_no": 3, "question": "\r\n<p>एक कागज़ के टुकड़े को निम्न प्रश्न आकृतियों में दर्शाए गये अनुसार मोड़ा और काटा जाता है। खोलने के बाद वह किस उत्तर आकृति के समान दिखाई देगा?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980832_1742980832633912_thump.png\" style=\"width: 300px; height: 75px;\" /></figure>", "option1": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980910_1742980910198573_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "option2": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742980939_1742980939544250_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "option3": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981019_1742981019559066_thump.png\" style=\"width: 100px; height: 99px;\" /></p>", "option4": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981051_1742981051172395_thump.png\" style=\"width: 100px; height: 102px;\" /></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>स्पष्ट रूप से, कागज़ के टुकड़े को खोलने पर वह नीचे दी गयी आकृति के समान दिखाई देगा:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981126_1742981126268099_thump.png\" style=\"width: 100px; height: 99px;\" /></figure>\r\nइस प्रकार आकृति 3 सही उत्तर है।</div>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<p>नीचे दिए गए आरेख में, CD = BF = 10 इकाई और &ang;CED = &ang;BAF = 30&deg; है। त्रिभुज AED का क्षेत्रफल कितना होगा? (नोट: नीचे दिया गया आरेख पैमाने के समानुपाती नहीं हो सकता है।)</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981221_1742981221557177_thump.png\" style=\"width: 150px; height: 200px;\" /></figure>", "option1": "\r\n<p>100 &times; (&radic;2 + 3)</p>", "option2": "\r\n<p><span>\\(\\frac{100}{\\sqrt{3}+4}\\)</span></p>", "option3": "\r\n<p><span>\\(\\frac{50}{\\sqrt{3}+4}\\)</span></p>", "option4": "\r\n<p>50 &times; (&radic;3 + 4)</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>CD = BF = 10</p>\r\n\r\n<p>&ang;CED = &ang;BAF = 30&deg;</p>\r\n\r\n<p>&Delta;ABF में,</p>\r\n\r\n<p>&ang;AFB + &ang;ABF + &ang;BAF = 180&deg; </p>\r\n\r\n<p>&ang;AFB = 180&deg; - <span>&ang;ABF - &ang;BAF</span></p>\r\n\r\n<p><span>&ang;AFB = 180&deg; - 90&deg; - 30&deg; </span></p>\r\n\r\n<p><span>&ang;AFB = 60&deg; </span></p>\r\n\r\n<p><span>इसी प्रकार, </span></p>\r\n\r\n<p><span>&ang;ECD = 60&deg; = &ang;BCF</span></p>\r\n\r\n<p>एक 30&deg; &minus; 60&deg; &minus; 90&deg; कोण वाले त्रिभुज में, भुजाएँ 1 ∶ &radic;3 ∶ 2 के अनुपात में होती हैं। इसलिए,</p>\r\n\r\n<p>&Delta;EDC<span> में</span>, CD = 10 और <span>ED = 10&radic;3 </span></p>\r\n\r\n<p>&Delta;FBC<span> में</span>, BF = 10 और <strong>BC = <span class=\"math-tex\">\\(\\frac{10}{√{3}}\\)</span></strong></p>\r\n\r\n<p>&Delta;AFB<span> में</span>, <strong>AB = 10&radic;3</strong></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<p>AD = AB + BC + CD</p>\r\n\r\n<p>AD =  10&radic;3 + 10/&radic;3 + 10 </p>\r\n\r\n<p><span>AD =  (10 &times; 3 + 10 + 10&radic;3) / &radic;3 </span></p>\r\n\r\n<p><strong><span>AD =  10 + 40/&radic;3</span></strong></p>\r\n\r\n<p>&Delta;ADE का क्षेत्रफल = <span class=\"math-tex\">\\(\\frac{1}{2}\\)</span> &times; 10&radic;3 &times; <span class=\"math-tex\">\\(\\left(10 + \\frac{40}{√{3}}\\right)\\)</span> वर्ग इकाई</p>\r\n\r\n<p><strong><span>&Delta;ADE का क्षेत्रफल</span> = 50(&radic;3 + 4) वर्ग इकाई</strong></p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n<p>उस विकल्प का चयन कीजिए, जिसका तीसरी आकृति से वही संबंध है, जो दूसरी आकृति का पहली आकृति से है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981319_1742981319207973_thump.png\" style=\"width: 300px; height: 63px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981381_1742981381196777_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981403_1742981403443228_thump.png\" style=\"width: 100px; height: 102px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981460_1742981460650867_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981485_1742981485312393_thump.png\" style=\"width: 100px; height: 102px;\" /></div>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>तर्क - यहाँ, जब हम <strong>पहली आकृति को लंबवत घुमाते हैं,</strong> तो हमें दूसरी आकृति मिलती है।</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981543_1742981543652568_thump.png\" style=\"width: 250px; height: 52px;\" /></figure>\r\n\r\n<p><span>अतः, <strong>सही उत्तर विकल्प 1 है।</strong></span></p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>निम्नलिखित प्रश्न में, चार संख्या युग्म दिए गए हैं। प्रत्येक युग्म में (-) के बाईं ओर की संख्या, किसी तर्क/नियम/संबंध द्वारा (-) के दाईं ओर की संख्या से संबंधित है। समान तर्क/नियम/संबंध के आधार पर तीन युग्म समान हैं। दिए गए विकल्पों में से विषम का चयन कीजिए। (नोट: संख्याओं को उनके घटक अंकों में तोड़े बिना, पूर्ण संख्याओं पर संक्रियाएँ की जानी चाहिए। उदाहरण 13 - 13 पर संक्रियाएँ जैसे कि 13 में जोड़ना/घटाना/गुणा करना आदि की जा सकती हैं। 13 को 1 और 3 में तोड़ना और फिर 1 और 3 पर गणितीय संक्रियाएँ करने की अनुमति नहीं है।)</p>", "option1": "\r\n<div>16 - 30</div>", "option2": "\r\n<div>44 - 84</div>", "option3": "\r\n<div>14 - 26</div>", "option4": "\r\n<p>18 - 34</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया तर्क है:</p>\r\n\r\n<p><strong>पहली संख्या &times; 2 - 2 = दूसरी संख्या।</strong></p>\r\n\r\n<p>विकल्प 1) <span>16 - 30 &rarr; 16 &times; 2 &rArr; 32 - 2 = 30 </span></p>\r\n\r\n<p><span>विकल्प  </span><strong>2)  <span>44 - 84 &rarr; 44  &times; 2  &rArr; 88 - 4 = 84</span></strong></p>\r\n\r\n<p><span>विकल्प 3) 14 - 26 &rarr; 14 &times; 2  &rArr; 28 - 2 = 26</span></p>\r\n\r\n<p><span>विकल्प 4) 18 - 34 &rarr; 18 &times; 2  &rArr; 36 - 2 = 34</span></p>\r\n\r\n<p>इसलिए, विकल्प 2 पैटर्न का अनुसरण नहीं करता है।</p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;विकल्प 2&quot; है।</strong></p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n<p>ABC, 4 <span>cm</span> त्रिज्या के वृत्त में बना हुआ एक समबाहु त्रिकोण है। CD, AB पर लंबवत है। तब भुजा AC = ?</p>", "option1": "\r\n<p>3&radic;2 <span>cm</span></p>", "option2": "\r\n<p><span>&radic;2 cm</span></p>", "option3": "\r\n<p>2&radic;3 <span>cm</span></p>", "option4": "\r\n<p>4&radic;3 <span>cm</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>ABC एक समबाहु त्रिभुज है, जो 4 cm त्रिज्या वाले एक वृत्त के अंतर्गत बना हुआ है और CD, AB के लंबवत है।</p>\r\n\r\n<p><strong>संकल्पना:</strong></p>\r\n\r\n<p>यदि किसी समबाहु त्रिभुज को एक वृत्त में परिबद्ध किया जाता है, तब इसकी सभी माध्यिका/शीर्षलंब का प्रतिच्छेदन बिंदु वृत्त का केंद्र होगा।</p>\r\n\r\n<p>साथ ही, एक समबाहु त्रिभुज का शीर्षलंब उन्हें 2 : 1 के अनुपात में विभाजित करता है।</p>\r\n\r\n<p><strong>हल:</strong></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<p>ABC एक समबाहु त्रिभुज है, जो 4 cm त्रिज्या वाले एक वृत्त के अंतर्गत बना हुआ है।</p>\r\n\r\n<p>CD, AB पर लंब है अर्थात CD त्रिभुज का शीर्षलंब है।</p>\r\n\r\n<p>माना वृत्त के केंद्र और शीर्षलंब का प्रतिच्छेदन बिंदु O है।</p>\r\n\r\n<p>तब, OB = OA = OC = 4 cm अर्थात् वृत्त की त्रिज्या है।</p>\r\n\r\n<p>साथ ही, शीर्षलंब को 2:1 के अनुपात में विभाजित किया गया है,</p>\r\n\r\n<p>CD शीर्षलंब है।</p>\r\n\r\n<p>CD = CO + OD</p>\r\n\r\n<p>चूँकि, CO = 4 cm &rArr; OD = 2 <span>cm </span></p>\r\n\r\n<p>एक समकोण त्रिभुज ODB के लिए,</p>\r\n\r\n<p>OB<sup>2</sup> = OD<sup>2</sup> + DB<sup>2</sup></p>\r\n\r\n<p>4<sup>2</sup> = 2<sup>2</sup> + DB<sup>2</sup></p>\r\n\r\n<p>DB = <span class=\"math-tex\">\\(2\\sqrt3 \\ cm\\)</span></p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>DA = <span class=\"math-tex\">\\(2\\sqrt3 \\ cm\\)</span></p>\r\n\r\n<p>समबाहु त्रिभुज की भुजा AB की लंबाई होगी,</p>\r\n\r\n<p>AB = DA + DB = <span class=\"math-tex\">\\(2\\sqrt3 \\ cm\\)</span> + <span class=\"math-tex\">\\(2\\sqrt3 \\ cm\\)</span> = <span class=\"math-tex\">\\(4\\sqrt3 \\ cm\\)</span></p>\r\n\r\n<p>चूँकि त्रिभुज समबाहु है,</p>\r\n\r\n<p>AB = BC = AC = <strong><span class=\"math-tex\">\\(4\\sqrt3 \\ cm\\)</span></strong></p>\r\n\r\n<p><strong>अतः विकल्प 4 सही है।</strong></p>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n<p>एक चुनाव में, मतदाता सूची में नामांकित 2% व्यक्तियों ने भाग नहीं लिया है और 500 मत अवैध थे। दो उम्मीदवार A और B चुनाव लड़ते हैं और A, B को 200 मतों से हरा देता है। यदि मतदाता सूची में नामांकित 43% व्यक्तियों ने A के पक्ष में अपना मत डाला है, तो कुल डाले गए मतों की कुल संख्या कितनी है?</p>", "option1": "\r\n<p>2450</p>", "option2": "\r\n<p>2800</p>", "option3": "\r\n<p>3000</p>", "option4": "\r\n<p>3250</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>2% मतदाताओं ने मतदान नहीं किया है। </span></p>\r\n\r\n<p>अवैध मत = 500</p>\r\n\r\n<p>विजेता को अपने प्रतिद्वंद्वी से 200 मत अधिक मिले हैं और दूसरे उम्मीदवार को 43% मत मिले हैं। </p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>माना कि, मतदान सूची में मतों की कुल संख्या x है। </p>\r\n\r\n<p>कुल मत <span>= (100 - 2)x/100 = 98x/100 = 0.98x</span></p>\r\n\r\n<p>कुल वैध <span>मत</span> = 0.98x - 500</p>\r\n\r\n<p>हारने वाले उम्मीदवार को मिले मतों की संख्या = 0.43x - 200</p>\r\n\r\n<p>कुल वैध मत निम्नानुसार हैं:</p>\r\n\r\n<p>&rArr; 0.43x + 0.43x - 200 = 0.98x - 500</p>\r\n\r\n<p>&rArr; 0.86x - 200 = 0.98x - 500</p>\r\n\r\n<p>&rArr; 0.98x - 0.86x = 300</p>\r\n\r\n<p>&rArr; x = 2500</p>\r\n\r\n<p>&there4; कुल डाले गए मतों की कुल संख्या <span>= 2500 &times; (100 - 2)%</span></p>\r\n\r\n<p><span>&rArr; 2450</span></p>\r\n\r\n<p><strong><span>कुल डाले गए मतों की कुल संख्या 2450 है।</span></strong></p>", "question_heading": ""}, {"sr_no": 9, "question": "\r\n\r\n<p>एक विशिष्ट कूट भाषा में &lsquo;FASTER&rsquo; को &lsquo;CDPQHO&rsquo; के रूप में लिखा गया है। तो उस कूट भाषा में &lsquo;VIOLIN&rsquo; के लिए कूट क्या होगा?</p>", "option1": "\r\n\r\n<p>SLRILK</p>", "option2": "\r\n\r\n<p>SLIRKM</p>", "option3": "\r\n\r\n<p>RKTILK</p>", "option4": "\r\n\r\n<p>SKIRKO</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>यहाँ अनुसरण किया गया स्वरुप निम्न है:</p>\r\n\r\n<p>व्यंजक के लिए स्थानीय मान - 3</p>\r\n\r\n<p>स्वर के लिए स्थानीय मान + 3</p>\r\n\r\n<p>उसीप्रकार,</p>\r\n\r\n<p>अतः SLRILK सही उत्तर है।</p>\r\n\r\n<p>यहाँ अनुसरण किया गया पैटर्न है</p>\r\n\r\n<p>व्यंजन के लिए, स्थितिगत मूल्य - 3</p>\r\n\r\n<p>स्वरों के लिए, स्थितीय मान + 3</p>\r\n\r\n<p>यह लेटर्स की स्थिति पर आधारित <strong>नहीं है।</strong></p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n\r\n<p>52 पत्तों की ताश की गड्डी में से सभी लाल चेहरे वाले पत्तों को निकाल दिया जाता है। बाकी पत्तों को फेंटने के बाद उनमें से एक पत्ते को यादृच्छिक रूप से निकाला जाता है। इसके चेहरे वाले पत्ते के होने की प्रायिकता क्या है?</p>", "option1": "\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{3}{22}\\)</span></p>", "option2": "\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{2}{11}\\)</span></p>", "option3": "\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{3}{23}\\)</span></p>", "option4": "\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{2}{23}\\)</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>हल:</strong></p>\r\n\r\n<p>52 ताश के पत्तों की एक गड्डी में 12 चेहरे वाले पत्ते होते हैं, जिसमें 4 सेट (पान, ईंट, चिड़ी और हुकुम) के प्रत्येक में 3 चेहरे वाले पत्ते (जैक, रानी और राजा) शामिल होते हैं। 6 लाल-चेहरे वाले पत्ते और 6 काले-चेहरे वाले पत्ते होते हैं।</p>\r\n\r\n<p>6 लाल चेहरे वाले पत्ते निकालने के बाद, शेष पत्ते 46 बचते हैं।</p>\r\n\r\n<p>शेष चेहरे वाले पत्ते 6 बचते हैं। </p>\r\n\r\n<p>अब एक चेहरे वाला पत्ता निकालने की प्रायिकता 6/46 = 3/23 है। </p>\r\n\r\n<p><strong>इसलिए, शेष गड्डी से एक चेहरे वाला पत्ता निकालने की प्रायिकता 3/23 है।</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n\r\n<p>एक शृंखला दी गई है, जिसमें से एक पद लुप्त है। दिए गये विकल्पों में से वह सही विकल्प चुनिए, जो शृंखला को पूरा करेगा।</p>\r\n\r\n<p>CBDA, GFHE, KJLI, ?</p>", "option1": "\r\n\r\n<p>NOPM</p>", "option2": "\r\n\r\n<p>MNOP</p>", "option3": "\r\n\r\n<p>PMNO</p>", "option4": "\r\n\r\n<p>ONPM</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>पदों के बीच संबंध इस प्रकार है,</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742981763_1742981763948593_thump.png\" style=\"width: 100px; height: 175px;\" /></p>\r\n\r\n<p>अतः श्रृंखला में लुप्त पद ONPM है।</p>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p>एक 8 m &times; 6 m &times; 22.5 cm की दीवार बनाने के लिए कितनी 25 cm &times; 11.25 cm &times; 6 cm की ईंटों की आवश्यकता होगी? (प्रयुक्त अन्य सामग्री को नगण्य मानिए)</p>", "option1": "\r\n<p>7020</p>", "option2": "\r\n<p>6400</p>", "option3": "\r\n<p>5800</p>", "option4": "\r\n<p>6800</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>ईंट का आयाम = 25 सेमी &times; 11.25 सेमी &times; 6 सेमी</p>\r\n\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>घनाभ का आयतन = लंबाई &times; चौड़ाई &times; ऊँचाई</p>\r\n\r\n<p>आवश्यक ईंटों की संख्या <span>= \\(\\frac{Volume\\ of\\ wall}{volume\\ of\\ brick}\\)</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>ईंट का आयतन</p>\r\n\r\n<p>ईंट का आयतन = 25 सेमी &times; 11.25 सेमी &times; 6 सेमी</p>\r\n\r\n<p><span>&rArr;1687.5  \\(cm^3\\)</span></p>\r\n\r\n<p>दीवार (बनाई जाने वाली) का आयतन है,</p>\r\n\r\n<p>दीवार का आयतन = 8 मीटर &times; 6 मीटर &times; 22.5 सेमी</p>\r\n\r\n<p>(आयाम के मानों को &#39;सेमी&#39; में बदलें जैसा कि &#39;मी&#39; में दिया गया है)</p>\r\n\r\n<p>दीवार का आयतन = 800 सेमी &times; 600 सेमी &times; 22.5 सेमी ----(1 m = 100 cm )</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(108 \\times 10^5 cm^3\\)</span></p>\r\n\r\n<p>आवश्यक ईंटों की संख्या <span>=  \\(\\frac{Volume\\ of\\ wall}{volume\\ of\\ brick}\\)</span></p>\r\n\r\n<p><span>&rArr;  \\(\\frac{108 \\times 10^5 }{1687.5}\\)  = 6400</span></p>\r\n\r\n<p><strong>&there4; आवश्यक ईंटों की संख्या 6400 है।</strong></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<p>निम्नलिखित में से कौन सा/से कथन सत्य है/हैं?</p>\r\n\r\n<p>A: सबसे बड़े और सबसे छोटे प्रेक्षणों के बीच अंतर को डोमेन के रूप में जाना जाता है।</p>\r\n\r\n<p>B: यदि 16, 4 और x का ज्यामितीय माध्य 8 है, तो &#39;x&#39; का मान 8 है।</p>", "option1": "\r\n<p>केवल A</p>", "option2": "\r\n<p>न तो A न ही B</p>", "option3": "\r\n<p>केवल B</p>", "option4": "\r\n<p>केवल A और B</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>दो कथन</p>\r\n\r\n<p><strong>अवधारणा:</strong></p>\r\n\r\n<p>डोमेन का सम्मुच्य और ज्यामितीय माध्य </p>\r\n\r\n<p><strong>प्रयोग किया गया सूत्र:</strong></p>\r\n\r\n<p>&lsquo;a&rsquo; और &lsquo;b&rsquo; का ज्यामितीय माध्य= &radic;ab</p>\r\n\r\n<p>&lsquo;a&rsquo;, &lsquo;b&rsquo; और &lsquo;c&rsquo; का ज्यामितीय माध्य=  ∛ab</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>A: सबसे बड़े और सबसे छोटे प्रेक्षणों के बीच अंतर को परिसर के रूप में जाना जाता है।</p>\r\n\r\n<p>B: ज्यामितीय माध्य = ∛(16 &times; 4 &times; x) = 8</p>\r\n\r\n<p>&rArr; 64x = 512</p>\r\n\r\n<p>&rArr; x = 8</p>\r\n\r\n<p>अतः, केवल B सत्य है। </p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>शताब्दी एक्सप्रेस ट्रेन 5 घंटे में 700 किमी और 11 घंटे में 1012 किमी की दूरी तय करती है। ट्रेन की औसत गति (मीटर/सेकंड में) कितनी है?</p>", "option1": "\r\n<p>107</p>", "option2": "\r\n<p><span class=\"math-tex\">\\(385\\frac{1}{5}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(29\\frac{13}{18}\\)</span></p>", "option4": "\r\n<p>27</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिया गया है:</p>\r\n\r\n<p>शताब्दी एक्सप्रेस ट्रेन 5 घंटे में 700 किमी और 11 घंटे में 1012 किमी की दूरी तय करती है।</p>\r\n\r\n<p>प्रयुक्त अवधारणा:</p>\r\n\r\n<p>दूरी = गति <span>&times; समय</span></p>\r\n\r\n<p><span>औसत गति = कुल दूरी / कुल समय</span></p>\r\n\r\n<p>गणना:</p>\r\n\r\n<p><span>कुल दूरी 1012 + 700 = 1712 किमी है</span>।</p>\r\n\r\n<p><span>कुल समय 5 + 11 = 16 घंटे है</span>।</p>\r\n\r\n<p><span>औसत गति = 1712/16</span></p>\r\n\r\n<p><span>&rArr; 107 किमी/घंटा</span></p>\r\n\r\n<p><span>&rArr; 107 &times; 5/18 = <span class=\"math-tex\">\\(29\\frac{13}{18}\\)</span></span>मीटर/सेकंड</p>\r\n\r\n<p><strong>&there4; सही विकल्प 3 है।</strong></p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p><span>एक विद्यार्थी, कक्षा में बैठकर, दृष्टि के क्षैतिज स्तर से 2 मीटर की ऊँचाई पर ब्लैक बोर्ड पर एक आकृति को देखता है। आकृति का उन्नयन कोण 30&deg;  है। वह ब्लैक बोर्ड  की ओर सीधे जाता है एवं 60 &deg;  के उ न्न यन कोण पर आकृति को देखता है। विद्यार्थी द्वारा तय की गयी दूरी (मीटर में) ज्ञात करें।</span></p>", "option1": "\r\n<p><span>3</span></p>", "option2": "\r\n<p><span class=\"math-tex\">\\(1+\\sqrt{3}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(2 \\sqrt{3}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(\\frac{4}{\\sqrt{3}}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया है:</span></p>\r\n\r\n<p>क्षैतिज दृष्टि से ब्लैकबोर्ड में <span>आकृति </span>की ऊँचाई = 2 मीटर</p>\r\n\r\n<p><span>गणना:</span></p>\r\n\r\n<p>मान लें कि उन्नयन कोण 30&deg; होने पर छात्र की दूरी &#39;x&#39; और उन्नयन कोण 60&deg; होने पर छात्र की दूरी &#39;y&#39; है।</p>\r\n\r\n<p>अब, tan 30&deg; = <span class=\"math-tex\">\\(\\dfrac{2}{x}\\)</span></p>\r\n\r\n<p>&rArr; x = 2<span class=\"math-tex\">\\(\\sqrt{3}\\)</span></p>\r\n\r\n<p>tan 60&deg; = <span class=\"math-tex\">\\(\\dfrac{2}{y}\\)</span></p>\r\n\r\n<p>&rArr; y = <span class=\"math-tex\">\\(\\dfrac{2}{\\sqrt{3}}\\)</span></p>\r\n\r\n<p>अब, छात्र द्वारा तय की गई दूरी = 2<span class=\"math-tex\">\\(\\sqrt{3}\\)</span> - <span class=\"math-tex\">\\(\\dfrac{2}{\\sqrt{3}}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{4}{\\sqrt{3}}\\)</span></p>\r\n\r\n<p><span>&there4; उत्तर <span class=\"math-tex\">\\(\\dfrac{4}{\\sqrt{3}}\\)</span> है</span><strong>।</strong></p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<div>\r\n<p>दिए गए विकल्पों में से सम्बंधित अक्षरों को चुनिए।</p>\r\nFDH : LJN :: RPT : ?</div>", "option1": "\r\n<p>XYZ</p>", "option2": "\r\n<p>WUY</p>", "option3": "\r\n<p>XVZ</p>", "option4": "\r\n<p>SUV</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>6 (F) + 6 = 12 (L); 4 (D) + 6 = 10 (J); 8 (H) + 6 = 14 (N)</p>\r\n\r\n<p>समान रूप से,</p>\r\n\r\n<p>18 (R) + 6 = 24 (X); 16 (P) + 6 = 22 (V); 20 (T) + 6 = 26 (Z)</p>\r\nअतः XVZ उचित उत्तर है।</div>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>चार शब्द-युग्म दिए गए हैं, जिनमें से तीन किसी प्रकार से एक समान हैं और एक भिन्न है। विषम शब्द का चयन करें।</p>", "option1": "\r\n<p>अखरोट : बादाम</p>", "option2": "\r\n<p>टमाटर : फल</p>", "option3": "\r\n<p>एडिडास : ब्रांड</p>", "option4": "\r\n<p>क्रिकेट : खेल</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>व्याख्या:</strong></p>\r\n\r\n<p>दिए गए विकल्पों में प्रयुक्त स्वरूप है:</p>\r\n\r\n<p><strong>समूह का प्रकार: समूह</strong></p>\r\n\r\n<p>विकल्प 1) अखरोट : बादाम -- अखरोट एक प्रकार का बादाम नहीं है।<br />\r\nविकल्प 1) टमाटर : फल -- टमाटर एक प्रकार का फल है।<br />\r\nविकल्प 1) एडिडास : ब्रांड -- एडिडास एक प्रकार का ब्रांड है<br />\r\nविकल्प 1) क्रिकेट : खेल -- क्रिकेट एक प्रकार का खेल है<br />\r\nतो, <strong>अखरोट : बादाम विषम है।</strong></p>\r\n\r\n<p><strong>अतः, विकल्प 1 सही उत्तर है।</strong></p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>किसी प्रेक्षण में 16 शून्येतर धनात्मक संख्याओं के एक समुच्चय के माध्य और मानक विचलन क्रमशः 26 और 3.5 हैं। 24 शून्येतर धनात्मक संख्याओं के एक अन्य समुच्चय के माध्य और मानक विचलन, दोनों ही प्रेक्षणों की परिस्थितियों को बदले बिना, क्रमशः 29 और 3 हैं। उनके संयुक्त प्रेक्षणों के समुच्चय का माध्य और मानक विचलन क्रमशः होगा</p>", "option1": "\r\n<p><span>27.8 और 3.21</span></p>", "option2": "\r\n<p><span>27.8 और 3.52</span></p>", "option3": "\r\n<p><span>26.2 और 3.21</span></p>", "option4": "\r\n<p><span>26.2 और 3.32</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया है:</span></p>\r\n\r\n<p>आँकड़ों का समुच्चय 1</p>\r\n\r\n<p><span>आँकड़ों </span>का माध्य(x<span>1</span>) = 26</p>\r\n\r\n<p><span>प्रेक्षणों </span>की संख्या(n<span>1</span>) = 16</p>\r\n\r\n<p>मानक विचलन(a<span>1</span>) = 3.5</p>\r\n\r\n<p><span>आँकड़ों का </span>समुच्चय 2</p>\r\n\r\n<p><span>प्रेक्षणों </span>का माध्य(x<span>2</span>) = 29</p>\r\n\r\n<p><span>प्रेक्षणों </span>की संख्या(n<span>2</span>) = 24</p>\r\n\r\n<p>मानक विचलन(a<span>2</span>) = 3</p>\r\n\r\n<p><span>प्रयुक्त सूत्र:</span></p>\r\n\r\n<p><span>आँकड़ों </span>का संयुक्त माध्य(x<span>12</span>) = <span class=\"math-tex\">\\(\\dfrac{n_1\\times x_1+n_2\\times x_2}{n_1+n_2}\\)</span></p>\r\n\r\n<p>संयुक्त मानक विचलन(A<span>12</span>) = <span class=\"math-tex\">\\(\\sqrt{\\dfrac{n_1(a_1^2+d_1^2)+n_2(a_2^2+d_2^2)}{n_1+n_2}}\\)</span></p>\r\n\r\n<p><span>गणना:</span></p>\r\n\r\n<p>संयुक्त माध्य(X<span>12</span>) = <span class=\"math-tex\">\\(\\dfrac{n_1\\times x_1+n_2\\times x_2}{n_1+n_2}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{26\\times 16+29\\times 24}{16+24}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{416+696}{40}\\)</span> = 27.8 </p>\r\n\r\n<p>d<span>1</span> = 27.8 - 26 = 1.8</p>\r\n\r\n<p>d<span>2</span> = 27.8 - 29 = -1.2</p>\r\n\r\n<p>संयुक्त मानक विचलन(A<span>12</span>) = <span class=\"math-tex\">\\(\\sqrt{\\dfrac{n_1(a_1^2+d_1^2)+n_2(a_2^2+d_2^2)}{n_1+n_2}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\sqrt{\\dfrac{16(3.5^2+1.8^2)+24(3^2+1.2^2)}{16+16}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\sqrt{\\dfrac{16(12.25+3.24)+24(9+1.44)}{40}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\sqrt{\\dfrac{247.84+250.56}{40}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\sqrt{\\dfrac{498.4}{40}}\\)</span> = 3.52 </p>\r\n\r\n<p><span>&there4; </span><strong>उत्तर 27.8 और 3.52 है।</strong></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<p>दिए गए विकल्पों में से उस अक्षर-समूह को चुनिए जो निम्नलिखित श्रेणी में प्रश्नवाचक चिन्ह (?) को प्रतिस्थापित कर सकता है।</p>\r\n\r\n<p>WUW, TSV, QQU, NOT,?</p>", "option1": "\r\n<p>JNT</p>", "option2": "\r\n<p>KMS</p>", "option3": "\r\n<p>LNT</p>", "option4": "\r\n<p>MNS</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982032_1742982032911349_thump.png\" style=\"width: 300px; height: 67px;\" /></figure>\r\n\r\n<p>दिया गया है: WUW, TSV, QQU, NOT, ?</p>\r\n\r\n<p>यहाँ अनुसरित किया गया तर्क है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982064_1742982064166291_thump.png\" style=\"width: 200px; height: 73px;\" /></figure>\r\n\r\n<p>अत:, <span>KMS </span>सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>एक प्रवासी पक्षी उत्तर की ओर 40 किमी उड़ता है, फिर वह पूर्व की ओर मुड़ जाता है और 50 किलोमीटर उड़ता है, फिर वह उत्तर की ओर मुड़ जाता है और 110 किमी उड़ता है, और अपने बायी ओर मुड़ जाता है और 50 किमी उड़ता है। यह अब अपनी प्रारंभिक स्थिति के अनुसार कहाँ है?</p>", "option1": "\r\n<p>150 किमी दक्षिण की ओर</p>", "option2": "\r\n<p>150 किमी उत  25 + 25</p>\r\n\r\n<p>&rarr; 150</p>\r\n\r\n<p>स्पष्ट रूप से, सही उत्तर 150 है।</p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<p>उस विकल्प का चयन कीजिए जो तीसरे पद से उसी तरह संबंधित है जैसे दूसरा पद, पहले पद से संबंधित है और छठा पद, पाँचवें पद से संबंधित है।</p>\r\n\r\n<p>17 : 4607 : : 11 : ? : : 23 : 11615</p>", "option1": "\r\n<p>1440</p>", "option2": "\r\n<p>1572</p>", "option3": "\r\n<p>1463</p>", "option4": "\r\n<p>1199</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया पैटर्न निम्न है:</p>\r\n\r\n<p><strong>तर्क: पहली संख्या : (पहली संख्या)<sup>3</sup> - [(पहली संख्या)<sup>2</sup> + पहली संख्या]</strong></p>\r\n\r\n<p>1) 17 : 4607</p>\r\n\r\n<p>&rArr; 17 : (17)<sup>3</sup> - [(17)<sup>2</sup> + 17]</p>\r\n\r\n<p>&rArr; 17 : 4913 - [<u><strong>289 + 17</strong></u>]</p>\r\n\r\n<p>&rArr; 17 : [<u><strong>4913 - 306</strong></u>]</p>\r\n\r\n<p>&rArr; 17 : 4607</p>\r\n\r\n<p>और,</p>\r\n\r\n<p>2) 23 : 11615</p>\r\n\r\n<p>&rArr; 23 : (23)<span>3</span> - [(23)<span>2</span> + 23]</p>\r\n\r\n<p>&rArr; 23 : 12167 - [<u><strong>529 + 23</strong></u>]</p>\r\n\r\n<p>&rArr; 23 : [<u><strong>12167 - 552</strong></u>]</p>\r\n\r\n<p>&rArr; 23 : 11615</p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>3) 11 : ?</p>\r\n\r\n<p>&rArr; 11 : (11)<span>3</span> - [(11)<span>2</span> + 11]</p>\r\n\r\n<p>&rArr; 11 : 1331 - [<u><strong>121 + 11</strong></u>]</p>\r\n\r\n<p>&rArr; 11 : [<u><strong>1331 - 132</strong></u>]</p>\r\n\r\n<p>&rArr; 11 : 1199</p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;1199&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p>चार आकृतियाँ दी गई हैं, जिनमें से तीन किसी न किसी रूप में एक जैसी हैं और एक भिन्न है। भिन्न आकृति का चयन कीजिए।</p>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742982950_1742982950445233_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983021_1742983021425712_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983177_1742983177799445_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983206_1742983206186495_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>सभी विकल्पों की जाँच करने पर: तीसरे विकल्प को छोड़कर, सभी तीन विकल्प 1, 2 और 4 समान तर्क का अनुसरण करते हैं।</span></p>\r\n\r\n<div>विकल्प 1:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983267_1742983267656856_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p>&rArr; <span>लंबवत निचली आधी छायांकित बूंद, क्षैतिज आधी छायांकित बूंद, विकर्णतः आधी छायांकित बूंद और लंबवत ऊपरी आधी छायांकित बूंद दक्षिणावर्त दिशा में व्यवस्थित होती हैं।</span></p>\r\n\r\n<div><span>विकल्प </span>2: \r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983290_1742983290577325_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p><span>&rArr;  लंबवत निचली आधी छायांकित बूंद, क्षैतिज आधी छायांकित बूंद, विकर्णतः आधी छायांकित बूंद और लंबवत ऊपरी आधी छायांकित बूंद दक्षिणावर्त दिशा में व्यवस्थित होती हैं।</span></p>\r\n\r\n<div><strong><span>विकल्प </span> 3: </strong>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983357_1742983357619214_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n</div>\r\n\r\n<p><span>&rArr;  लंबवत निचली आधी छायांकित बूंद, क्षैतिज आधी छायांकित बूंद, विकर्णतः आधी छायांकित बूंद और लंबवत ऊपरी आधी छायांकित बूंद <strong>वामावर्त दिशा में</strong> व्यवस्थित होती हैं।</span></p>\r\n\r\n<div><span>विकल्प  4:  </span>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983388_1742983388179458_thump.png\" style=\"width: 100px; height: 101px;\" /></figure>\r\n<span>लंबवत निचली आधी छायांकित बूंद, क्षैतिज आधी छायांकित बूंद, विकर्णतः आधी छायांकित बूंद और लंबवत ऊपरी आधी छायांकित बूंद दक्षिणावर्त दिशा में व्यवस्थित होती हैं।</span></div>\r\n\r\n<p>अतः<span> सही उत्तर</span><strong>&quot;विकल्प 3&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>उस संख्या की पहचान करें जो निम्नलिखित श्रृंखला से संबंधित नहीं है।</p>\r\n\r\n<p>289, 306, 340, 389, 459, 544</p>", "option1": "\r\n<p>289</p>", "option2": "\r\n<p>459</p>", "option3": "\r\n<p>306</p>", "option4": "\r\n<p>389</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ तर्क है:</p>\r\n\r\n<p><strong>शब्दों के बीच का अंतर 17 का बढ़ता गुणक है।</strong></p>\r\n\r\n<p>दी गई श्रृंखला में अनुसरण किया गया पैटर्न है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983489_1742983489167588_thump.png\" style=\"width: 300px; height: 99px;\" /></figure>\r\n\r\n<p>हम जानते हैं कि,</p>\r\n\r\n<p>17 &times; 3 = 51 और 17 &times; 4 = 68, इसलिए इन दोनों से जुड़ी एकमात्र संख्या 389 है।</p>\r\n\r\n<p>इसलिए<strong> 389 श्रृंखला से संबंधित नहीं है और इसे एक पूर्ण श्रृंखला बनाने के लिए 391 से प्रतिस्थापित किया जा सकता था।</strong></p>\r\n\r\n<p>अत: <strong>सही उत्तर विकल्प 4 है)।</strong></p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>sec<sup>2</sup> 54&deg; - cot<sup>2</sup> 36&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; sec<sup>2</sup> 53&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg; का मान कितना है?</p>", "option1": "\r\n<p><span class=\"math-tex\">\\(\\frac{9}{2}\\)</span></p>", "option2": "\r\n<p><span class=\"math-tex\">\\(\\frac{5}{2}\\)</span></p>", "option3": "\r\n<p><span class=\"math-tex\">\\(\\frac{3}{2}\\)</span></p>", "option4": "\r\n<p><span class=\"math-tex\">\\(\\frac{7}{2}\\)</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>tan(90&deg; - &theta;) = cot &theta; </p>\r\n\r\n<p>cot (90&deg; - &theta;) = tan &theta; </p>\r\n\r\n<p>sec (90&deg; - &theta;) = cosec &theta; </p>\r\n\r\n<p>cosec<sup>2</sup>&theta; - cot<sup>2</sup>&theta; = 1 </p>\r\n\r\n<p>sec<sup>2</sup>&theta; - tan<sup>2</sup>&theta; = 1 </p>\r\n\r\n<p><strong>गणना :</strong></p>\r\n\r\n<p>sec<sup>2</sup> 54&deg; - cot<sup>2</sup> 36&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; sec<sup>2</sup> 53&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;</p>\r\n\r\n<p>&rArr; sec<sup>2</sup> 54&deg; - cot<sup>2</sup> (90&deg; - 54&deg;) + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; sec<sup>2</sup> (90&deg; - 37&deg;) + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;</p>\r\n\r\n<p>&rArr; sec<sup>2</sup> 54&deg; - tan<sup>2</sup> 54&deg; + <span class=\"math-tex\">\\(\\frac{3}{2}\\)</span> sin<sup>2</sup> 37&deg; &times; cosec<sup>2</sup> 37&deg; + <span class=\"math-tex\">\\(\\frac{2}{\\sqrt3}\\)</span> tan 60&deg;</p>\r\n\r\n<p>&rArr; 1 + 3/2 + 2 </p>\r\n\r\n<p>&rArr; 9/2</p>\r\n\r\n<p><strong>व्यंजक का मान 9/2 है।</strong></p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n\r\n\r\n<p>अरुण उत्तर-पश्चिम की ओर <span>सम्मुख</span> है। वह पहले 90&deg; को दक्षिणावर्त दिशा में और फिर अन्य 180&deg; को वामावर्त दिशा में मुड़ता है। बाद में वह 90&deg; फिर से वामावर्त दिशा में मुड़ जाता है। अब वह किस दिशा के सम्मुख है?</p>", "option1": "\r\n\r\n\r\n<p>दक्षिण</p>", "option2": "\r\n\r\n\r\n<p>पश्चिम</p>", "option3": "\r\n\r\n\r\n<p>दक्षिण-पूर्व</p>", "option4": "\r\n\r\n\r\n<p>दक्षिण-पश्चिम</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p> </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983680_1742983680171505_thump.png\" style=\"width: 300px; height: 246px;\" /></figure>\r\n\r\n<p>आरेख से माना P, अरुण की प्रारंभिक स्थिति के रूप में हैं, पहले वह 90&deg; दक्षिणावर्त दिशा में जाता है और Q पर पहुँचता है, तब Q से, वह 180&deg; वामावर्त हो जाता है और<span> R </span>तक पहुँचता है। R से वह फिर से वामावर्त दिशा में जाता है और S तक पहुंचता है, जो अंतिम स्थिति है और वह दक्षिण-पूर्व के सम्मुख है।</p>\r\n\r\n<p>इसलिए, <strong>&quot;दक्षिण-पूर्व&quot;</strong> सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 27, "question": "\r\n\r\n\r\n<p>दो कथन और उसके बाद I, II और III से अंकित तीन कथन दिए गए हैं। कथनों को सत्य मानना है, भले ही वे ज्ञात तथ्यों से अलग प्रतीत होते हों। निर्णय कीजिए कि निष्कर्षों में से कौन सा निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता/करते है/हैं।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>कुछ छात्र खिलाड़ी हैं</p>\r\n\r\n<p>कुछ खिलाड़ी एथलीट हैं</p>\r\n\r\n<p>निष्कर्ष:</p>\r\n\r\n<p>I. कुछ छात्र एथलीट हैं।</p>\r\n\r\n<p>II. कुछ खिलाड़ी छात्र हैं।</p>\r\n\r\n<p>III. कोई छात्र एथलीट नहीं है।</p>", "option1": "\r\n\r\n\r\n<p>केवल निष्कर्ष II और या तो निष्कर्ष I या III अनुसरण करते हैं</p>", "option2": "\r\n\r\n\r\n<p>केवल निष्कर्ष I अनुसरण करता है</p>", "option3": "\r\n\r\n\r\n<p>केवल निष्कर्ष II और III अनुसरण करते हैं</p>", "option4": "\r\n\r\n\r\n<p>कोई भी निष्कर्ष अनुसरण नहीं करता है।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742983744_1742983744928285_thump.png\" style=\"width: 170px; height: 95px;\" /></p>\r\n\r\n<p>कुछ छात्र एथलीट हैं &rarr; असत्य</p>\r\n\r\n<p>कुछ खिलाड़ी छात्र हैं &rarr; सत्य</p>\r\n\r\n<p>कोई भी छात्र एथलीट नहीं है &rarr; असत्य</p>\r\n\r\n<p>निष्कर्ष I और III पूरक हैं।</p>\r\n\r\n<p>अतः केवल निष्कर्ष II और या तो निष्कर्ष I या III अनुसरण करते हैं।</p>", "question_heading": ""}, {"sr_no": 28, "question": "\r\n<p>यदि (a + b + c) = 0 है, तो a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup> का मान कितना है?</p>", "option1": "\r\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2</sup> - 3 abc</p>", "option2": "\r\n<p>0</p>", "option3": "\r\n<p>3 abc</p>", "option4": "\r\n<p>a<sup>2</sup> + b<sup>2</sup> + c<sup>2  </sup>- ab - bc - ca</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दी गई जानकारी:</strong></p>\r\n\r\n<p><span>a + b + c = 0</span></p>\r\n\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p><span>a</span><sup>3 + b</sup><sup>3 + c</sup><sup>3   &ndash; 3abc = (a + b + c)( a</sup><sup>2 + b</sup><sup>2 +c</sup><sup>2  &minus;ab&minus;bc&ndash;ca)</sup></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>सूत्र के अनुसार,</p>\r\n\r\n<p>a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> &ndash; 3abc = (a + b + c)( a<sup>2 </sup>+ b<sup>2 </sup>+ c<sup>2</sup> &minus; ab &minus; bc &ndash; ca)</p>\r\n\r\n<p>लेकिन, (a + b + c) = 0</p>\r\n\r\n<p>&rArr; a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> &ndash; 3abc = 0</p>\r\n\r\n<p>&rArr; a<sup>3</sup>+ b<sup>3</sup> + c<sup>3</sup> = 3abc </p>\r\n\r\n<p><strong>&there4; a<sup>3</sup> + b<sup>3</sup> + c<sup>3</sup>  का मान3abc है।</strong></p>", "question_heading": ""}, {"sr_no": 29, "question": "\r\n<p>&lsquo;पेय पदार्थ&rsquo;, &rsquo;चाय&rsquo; से उसी तरह संबंधित है जिस तरह दवा ______ से संबंधित है।</p>", "option1": "\r\n<p>दर्दनाशक</p>", "option2": "\r\n<p>अस्पताल</p>", "option3": "\r\n<p>रोग</p>", "option4": "\r\n<p>चिकित्सक</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>चाय एक गर्म पेय है जिसे उबलते पानी में चाय के पौधे की सूखी, पिसी हुई पत्तियाँ डालकर बनाया जाता है।</p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>दर्दनाशक दर्द से राहत पाने की दवा है।</p>\r\n\r\n<p>अत:, सही उत्तर &ldquo;दर्दनाशक&rdquo; है।</p>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n<p>एक त्रिभुज का क्षेत्रफल क्या होगा जिसकी भुजाएँ 13 सेमी, 14 सेमी तथा 15 सेमी है?</p>", "option1": "\r\n<p>21 सेमी<sup>2</sup></p>", "option2": "\r\n<p>42 सेमी<sup>2</sup></p>", "option3": "\r\n<p>84 सेमी<sup>2</sup></p>", "option4": "\r\n<p>168 सेमी<sup>2</sup></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दी गई जानकारी:</strong></p>\r\n\r\n<p>त्रिभुज की भुजाएँ, a = 13 सेमी, b = 14 सेमी, c = 15 सेमी</p>\r\n\r\n<p><strong>अवधारणा:</strong></p>\r\n\r\n<p>a, b, और c भुजाओं वाले त्रिभुज का क्षेत्रफल ज्ञात करने के लिए हीरोन का सूत्र है,</p>\r\n\r\n<p> &rArr; <span class=\"math-tex\">\\(\\rm\\sqrt{\\left[s(s-a)(s-b)(s-c)\\right]}\\)</span></p>\r\n\r\n<p>जहाँ, s = (a + b + c)/2 त्रिभुज का अर्ध-परिमाप है।</p>\r\n\r\n<p><strong>चरण-दर-चरण हल:</strong></p>\r\n\r\n<p>s = (13 + 14 + 15) / 2 = 21 सेमी</p>\r\n\r\n<p>क्षेत्रफल= <span class=\"math-tex\">\\(\\rm\\sqrt{[s(s-a)(s-b)(s-c)]}\\)</span></p>\r\n\r\n<p>&rArr; क्षेत्रफल = <span class=\"math-tex\">\\(\\sqrt{[21(21-13)(21-14)(21-15)]}\\)</span></p>\r\n\r\n<p><strong>अत:, त्रिभुज का क्षेत्रफल 84 सेमी&sup2; है।</strong></p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p><span>तीन दोस्तों A, B  एवं C के संबंधित स्थान क्रमशः (3, 2), (6, 5) और (9, 8) हैं। तीनों बिन्दु एक साथ मिलकर क्या बनाते हैं?</span></p>", "option1": "\r\n<p><span>एक अधिकोण त्रिभुज</span></p>", "option2": "\r\n<p><span>एक रेखाखंड</span></p>", "option3": "\r\n<p><span>एक समबाहु त्रिभुज</span></p>", "option4": "\r\n<p><span>एक समकोण त्रिभुज</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>A = (x<sub>1</sub>, y<sub>1</sub>) = (3, 2)</p>\r\n\r\n<p><span>B = (x 2 , y 2 ) = (6, 5)</span></p>\r\n\r\n<p><span>C = (x 3 , y 3 ) = (9, 8)</span></p>\r\n\r\n<p><strong><span>प्रयुक्त सूत्र:</span></strong></p>\r\n\r\n<p>दो बिंदुओं के बीच की दूरी<span> = <span class=\"math-tex\">\\(\\sqrt{(x_2 - x_1)^2 + (y_2-y_1)^2}\\)</span></span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>AB = <span class=\"math-tex\">\\(\\sqrt{(6-3)^2 + (5-2)^2} = \\sqrt{9+9} =3\\sqrt2cm\\)</span></p>\r\n\r\n<p>BC = <span class=\"math-tex\">\\(\\sqrt{(9-6)^2 + (8-5)^2} = \\sqrt{9+9} = 3\\sqrt2cm\\)</span></p>\r\n\r\n<p>CA = <span class=\"math-tex\">\\(\\sqrt{(9-3)^2 + (8-2)^2} = \\sqrt{36 + 36} =6\\sqrt2cm\\)</span></p>\r\n\r\n<p>A और C के बीच की दूरी <span>= AB + BC</span></p>\r\n\r\n<p>अतः A, B और C एक रेखाखंड बनाते हैं।</p>\r\n\r\n<p><strong>अत: सही विकल्प 2 है।</strong></p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>एक निश्चित कूट में, 692425 का अर्थ &#39;<span>School education is free in India</span>&#39; <span>है</span> और 7926 का अर्थ &#39;<span>College education is costly</span>&#39; <span>है</span>। <span>निम्नलिखित में से कौन सा कूट </span>&#39;<span>&#39;I want to become graduate</span>&#39; के लिए है?</p>", "option1": "\r\n<p>54268</p>", "option2": "\r\n<p>15426</p>", "option3": "\r\n<p>14268</p>", "option4": "\r\n<p>23586</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984098_1742984098278814_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p><strong>तर्क : अंक वाक्य के क्रमानुसार एक शब्द में अक्षरों की संख्या का प्रतिनिधित्व करते हैं।</strong></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<ul>\r\n\t<li>692425 का अर्थ &#39;<span>School education is free in India</span>&#39; <span>है।</span></li>\r\n</ul>\r\n\r\n<p>&rArr; <span>School </span>&rarr; 6 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p><span>&rArr; education </span>&rarr; 9 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p>&rArr; <span>is</span> &rarr; 2 अक्षर का शब्द</p>\r\n\r\n<p>&rArr; <span>free </span>&rarr; 4 अक्षर का शब्द</p>\r\n\r\n<p>&rArr; <span>in</span> &rarr; 2 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p><span>&rArr; India </span>&rarr; 5 अक्षर <span>का </span>शब्द</p>\r\n\r\n<ul>\r\n\t<li><span>7926 का अर्थ &#39; College education is costly &#39;  है ।</span></li>\r\n</ul>\r\n\r\n<p>&rArr; <span>College </span>&rarr; 7 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p><span>&rArr; education </span>&rarr; 9 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p>&rArr; <span>is</span> &rarr; 2 अक्षर का शब्द</p>\r\n\r\n<p>&rArr; <span>costly </span>&rarr; 6 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<ul>\r\n\t<li><span>&#39;I want to become graduate&#39;</span></li>\r\n</ul>\r\n\r\n<p>&rArr; <span>I</span> &rarr; 1 अक्षर का शब्द</p>\r\n\r\n<p><span>&rArr; want</span> &rarr; 4 अक्षर <span>का </span>शब्द</p>\r\n\r\n<p>&rArr; <span>to</span> &rarr; 2 अक्षर का शब्द</p>\r\n\r\n<p>&rArr; <span>become</span> &rarr; 6 अक्षर का शब्द</p>\r\n\r\n<p><span>&rArr; graduate </span>&rarr; 8 अक्षर का शब्द</p>\r\n\r\n<p>अत:, सही उत्तर <span>&quot;14268&quot; </span>है।</p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>एक वृत्ताकार पार्क की त्रिज्या 23 मीटर है। इसके भीतर चारों ओर 4 मीटर चौड़ा रास्ता है। 500 रुपये प्रति वर्ग मीटर की दर से रास्ते को पक्का करने की लागत ज्ञात कीजिए?</p>", "option1": "\r\n<p>Rs. 2,10,000</p>", "option2": "\r\n<p>Rs. 2,64,000</p>", "option3": "\r\n<p>Rs. 2,60,000</p>", "option4": "\r\n<p>Rs. 2,40,000</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है</strong></p>\r\n\r\n<p>बाहरी त्रिज्या, R = 23 मीटर </p>\r\n\r\n<p>आंतरिक त्रिज्या, r = (23 - 4) मीटर </p>\r\n\r\n<p>&rArr; 19 मीटर </p>\r\n\r\n<p><strong>अवधारणा  </strong></p>\r\n\r\n<p>वृत्ताकार पथ का क्षेत्रफल = बाहरी वृत्त का क्षेत्रफल - आंतरिक वृत्त का क्षेत्रफल</p>\r\n\r\n<p><strong>प्रयुक्त सूत्र</strong></p>\r\n\r\n<p>पथ का क्षेत्रफल = &pi;(R<sup>2</sup> - r<sup>2</sup>)</p>\r\n\r\n<p>(a<sup>2</sup> - b<sup>2</sup>) = (a + b) (a - b)</p>\r\n\r\n<p><strong>गणना</strong></p>\r\n\r\n<p>वृत्ताकार पथ का क्षेत्रफल = (22/7) &times; (23<sup>2</sup>- 19<sup>2</sup>)</p>\r\n\r\n<p>&rArr; ( 22/7) &times; (23 + 19) &times; (23 - 19)</p>\r\n\r\n<p>&rArr; (22/7) &times; (42) &times; (4)</p>\r\n\r\n<p>&rArr; 22 &times; 6 &times; 4</p>\r\n\r\n<p>&rArr; 132 &times; 4</p>\r\n\r\n<p>&rArr; 528 मीटर<sup>2</sup></p>\r\n\r\n<p>पथ को पक्का करने का खर्च = 528 &times; 500</p>\r\n\r\n<p>&rArr; 264000 रुपये </p>\r\n\r\n<p><strong>&there4; पथ को पक्का करने का खर्च 2,64,000 रुपये है।</strong></p>", "question_heading": ""}, {"sr_no": 34, "question": "\r\n<p>यदि एक बिंदु P से एक &ldquo;O&rdquo; केंद्र वाले एक वृत्त की दो स्पर्श रेखाएँ PA तथा PB एक - दूसरे से 80&deg; के कोण पर मिलती हैं, तो <span>&ang;</span>POA = ______;</p>", "option1": "\r\n<p><span>80&deg;</span></p>", "option2": "\r\n<p>50<span>&deg;</span></p>", "option3": "\r\n<p>25<span>&deg;</span></p>", "option4": "\r\n<p>30<span>&deg;</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>यदि एक बिंदु P से एक &ldquo;O&rdquo; केंद्र वाले एक वृत्त की दो स्पर्श रेखाएँ PA तथा PB एक - दूसरे से 80&deg; के कोण पर मिलती हैं।</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<div>यहाँ,\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984238_1742984238902995_thump.png\" style=\"width: 200px; height: 130px;\" /></figure>\r\n</div>\r\n\r\n<p>OA, PA पर लंब है और OB, PB पर लंब है, तो</p>\r\n\r\n<p><span>&Delta;</span>OAP और <span>&Delta;</span>OBP में,</p>\r\n\r\n<p>OA = OB (त्रिज्या)</p>\r\n\r\n<p>OP = OP (उभयनिष्ठ)</p>\r\n\r\n<p>PA = PB (शीर्ष से खींची गई स्पर्श रेखाओं की लंबाई)</p>\r\n\r\n<p>&there4; <span>&Delta;</span>OAP &asymp; <span>&Delta;</span>OPB (CPCT से)</p>\r\n\r\n<p>&there4; <span>&ang;OPA = 1/2 &ang;APB = 40&ordm;</span></p>\r\n\r\n<p><span>&Delta; OAP में,</span></p>\r\n\r\n<p><span>&rArr; &ang;POA + &ang;OPA  + &ang;PAO = 180</span></p>\r\n\r\n<p><span>&rArr; &ang;POA + 40 + 90 = 180</span></p>\r\n\r\n<p><span>&rArr; &ang;POA = 180 - 130 = 50&ordm;</span></p>\r\n\r\n<p><strong><span>&there4; &ang;POA = 50&ordm;</span></strong></p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>एक पिरामिड जिसका आधार एक नियमित बहुभुज है, का सम्पूर्ण-पृष्ठीय क्षेत्रफल 260 वर्ग सेमी है और उसके आधार का क्षेत्रफल 120 वर्ग सेमी है। प्रत्येक पार्श्व-पृष्ठ का क्षेत्रफल 20 वर्ग सेमी है, तो पार्श्व-पृष्ठों की संख्या कितनी है?</p>", "option1": "\r\n<p>7</p>", "option2": "\r\n<p>8</p>", "option3": "\r\n<p>6</p>", "option4": "\r\n<p>5</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>सम्पूर्ण-पृष्ठीय क्षेत्रफल = पार्श्व-पृष्ठीय क्षेत्रफल + आधार का क्षेत्रफल</p>\r\n\r\n<p>260 = पार्श्व-पृष्ठीय क्षेत्रफल + 120</p>\r\n\r\n<p>पार्श्व-पृष्ठीय क्षेत्रफल = 260 &ndash; 120 = 140 वर्ग सेमी</p>\r\n\r\n<p>प्रत्येक पार्श्व-पृष्ठ का क्षेत्रफल = 20 वर्ग सेमी</p>\r\nपार्श्व-पृष्ठों की संख्या = 140/20 = 7</div>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n<p>एक चतुर्भुज में भुजाओं का अनुपात 2 ∶ 3 ∶ 4 ∶ 5 है और परिमाप 560 सेमी है। सबसे छोटी भुजा (सेमी में) ज्ञात कीजिए। </p>", "option1": "\r\n<p>84</p>", "option2": "\r\n<p>82</p>", "option3": "\r\n<p>80</p>", "option4": "\r\n<p>78</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>चतुर्भुज में भुजाओं का अनुपात = <span>2 ∶  3  ∶  4  ∶  5</span></p>\r\n\r\n<p>चतुर्भुज का परिमाप = 560 सेमी</p>\r\n\r\n<p><strong>हल:</strong></p>\r\n\r\n<p>माना भुजाएँ 2x, 3x, 4x और 5x हैं, और चतुर्भुज का परिमाप Ax है।</p>\r\n\r\n<p>इसलिए, चतुर्भुज की सभी भुजाओं का योग है:</p>\r\n\r\n<p>2x + 3x + 4x + 5x = 14x</p>\r\n\r\n<p>प्रश्न के कथन के अनुसार, चतुर्भुज का परिमाप 560 सेमी है।</p>\r\n\r\n<p>चतुर्भुज के परिमाप के सूत्र का उपयोग करने पर, हमें प्राप्त होता है:</p>\r\n\r\n<p>परिमाप = 14x</p>\r\n\r\n<p>560 सेमी = 14x</p>\r\n\r\n<p>x = 40 सेमी</p>\r\n\r\n<p>इसलिए, चतुर्भुज की भुजाएँ 2x = 80 सेमी, 3x = 120 सेमी, 4x = 160 सेमी, और 5x = 200 सेमी हैं।</p>\r\n\r\n<p><strong>अत: चतुर्भुज की सबसे छोटी भुजा 80 सेमी है।</strong></p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n<p>नौ कर्मचारी, K, L, M, N, O, P, Q, R और S, दफ्तर में एक सीधी रेखा में बैठे हैं, सभी पूर्व की ओर सम्मुख है। O, M के दायें से तीसरा है। K, P के बायें से तीसरा है। Q, P और S के <span>निकटतम</span> बीच में है। N, M के दायें से चौथा है। P, N के निकटतम दायें है। R, O के बायें से चौथा है। निम्नलिखित में से कौन सा कथन असत्य है?</p>", "option1": "\r\n<p>L, O के बायें से तीसरे स्थान पर बैठा है।</p>", "option2": "\r\n<p>Q, K के दायें <span>से </span>चौथे स्थान पर बैठा है।</p>", "option3": "\r\n<p>R और S कोनों पर बैठे हैं।</p>", "option4": "\r\n<p>O, K और N के बीच बैठा है।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>नौ कर्मचारी, K, L, M, N, O, P, Q, R और S, दफ्तर में एक सीधी रेखा में बैठे हैं, सभी पूर्व की ओर सम्मुख है।</span></p>\r\n\r\n<p><span>1) </span>O, M के दायें से तीसरे स्थान पर है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984374_1742984374913617_thump.png\" style=\"width: 100px; height: 137px;\" /></figure>\r\n\r\n<p><span>2) </span>N, M के दायें से चौथा है और R, O के बायें से चौथा है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984405_1742984405868518_thump.png\" style=\"width: 100px; height: 188px;\" /></figure>\r\n\r\n<p><span>3) </span>P, N के निकटतम दायें है और Q, P और S के <span>निकटतम</span> बीच में है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984471_1742984471356058_thump.png\" style=\"width: 100px; height: 283px;\" /></figure>\r\n\r\n<p><span>4) </span>K, P के बायें से तीसरे स्थान पर है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742984495_1742984495508052_thump.png\" style=\"width: 100px; height: 265px;\" /></figure>\r\n\r\n<p>विकल्प 1) L, O के बायें से तीसरे स्थान पर बैठा है &rarr; असत्य है (चूंकि दी गई जानकारी से <strong>L, O के बायें से दूसरे स्थान पर है</strong>)</p>\r\n\r\n<p>विकल्प 2) Q, K के दायें से चौथे स्थान पर बैठा है &rarr; सत्य है (चूंकि दी गई जानकारी के चौथे चरण से Q, K के दायें से चौथे स्थान पर बैठा है, सत्य है)</p>\r\n\r\n<p>विकल्प 3) R और S कोनों पर बैठे हैं &rarr; सत्य है (चूंकि दी गई जानकारी के चौथे चरण से R और S कोनों पर बैठे हैं, सत्य है)</p>\r\n\r\n<p>विकल्प 4) O, K और N के बीच में बैठा है &rarr; सत्य है (चूंकि दी गई जानकारी के चौथे चरण से O, K और N के बीच बैठा है, सत्य है)</p>\r\n\r\n<p>अतः सही उत्तर <strong>&quot;L, O के बायें से तीसरे स्थान पर बैठा है&quot; </strong>है।</p>", "question_heading": ""}, {"sr_no": 38, "question": "\r\n<p>एक इलेक्ट्रॉनिक स्टोर का मालिक प्रत्येक वस्तु पर 20% और 25% की दो क्रमिक छूट देता है। स्टोर में एक रिवॉर्ड पॉइंट योजना है, जो ग्राहक को स्टोर से पिछली खरीदारी पर ग्राहक के खाते में जमा किए गए, प्रत्येक 1 रिवॉर्ड पॉइंट पर ₹0.10 की निःशुल्क खरीदारी करने में सक्षम बनाती है। एक ग्राहक एक लैपटॉप खरीदने का फैसला करता है, जिसका अंकित मूल्य ₹72,000 है। यदि उसके खाते में 2850 रिवॉर्ड पॉइंट हैं, तो इसका कुल विक्रय मूल्य कितना होगा?</p>", "option1": "\r\n<p>₹43,200</p>", "option2": "\r\n<p>₹42,915</p>", "option3": "\r\n<p>₹42,215</p>", "option4": "\r\n<p>₹42,942</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>दुकानदार द्वारा दी गई छूट = 20% और 25%</p>\r\n\r\n<p>रिवॉर्ड पॉइंट = <span>2850</span></p>\r\n\r\n<p>अंकित मूल्य = 72000</p>\r\n\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>अंकित मूल्य = विक्रय मूल्य [100 / (100 - छूट %)] x [100 / (100 - छूट %)]</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>विक्रय मूल्य = 72000 &times; [100 / (100 &ndash; 20%)] &times; [100 / (100 - 25%)]</p>\r\n\r\n<p>&rArr; 72000 &times; 80/100 &times; 75/100</p>\r\n\r\n<p>&rArr; 72 &times; 8 &times; 75</p>\r\n\r\n<p>&rArr; 43200</p>\r\n\r\n<p><span>1 रिवॉर्ड पॉइंट</span> &rarr; <span>₹0.10</span></p>\r\n\r\n<p><span>2850 </span>रिवॉर्ड पॉइंट<span> &rarr; 285</span></p>\r\n\r\n<p><span>अंतिम विक्रय मूल्य = 43200 - 285 होगा। </span></p>\r\n\r\n<p><span>&rArr; 42915</span></p>\r\n\r\n<p><strong>कुल विक्रय मूल्य 42915 है।</strong></p>", "question_heading": ""}, {"sr_no": 39, "question": "\r\n<p>दिए गए कथन पर विचार करें और तय करें कि दी गई मान्यताओं में से कौन सी कथन में निहित है/हैं।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>एक विज्ञापन में कहा गया है कि घरों को सजाने के लिए XYZ पेंट का इस्तेमाल किया जाना चाहिए।</p>\r\n\r\n<p><strong>अनुमान:</strong></p>\r\n\r\n<p>1. लोग अपने घर को सजाना चाहते हैं।</p>\r\n\r\n<p>2. केवल XYZ पेंट ही घरों को सजावटी बना सकते हैं।</p>", "option1": "\r\n<p>केवल पूर्वधारणा 1 निहित है।</p>", "option2": "\r\n<p>या तो पूर्वधारणा 1 या 2 निहित है।</p>", "option3": "\r\n<p>न तो पूर्वधारणा 1 और न ही 2 निहित है।</p>", "option4": "\r\n<p>केवल धारणा 2 निहित है।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>व्याख्या:</strong></p>\r\n\r\n<p>दिए गए कथन से:<br />\r\nएक विज्ञापन में कहा गया है कि घरों को सजाने के लिए XYZ पेंट का इस्तेमाल किया जाना चाहिए।<br />\r\nअब हम दी गई मान्यताओं पर विचार करते हैं:</p>\r\n\r\n<p>1. <strong>लोग अपने घर को सजाना चाहते हैं: </strong>विज्ञापन किसी ट्रेंडिंग उत्पाद या किसी ऐसी चीज को बढ़ावा देने के लिए जारी किया जाता है जो जल्द ही मांग में होगी तो इसका अर्थ यह लगाया जा सकता है कि लोग अपने घर को सजाना चाहते हैं। और इस प्रकार धारणा निहित है।<br />\r\n2. <strong>केवल XYZ पेंट ही घरों को सजावटी बना सकते हैं:</strong> हम इतनी कम जानकारी के आधार पर इतनी मजबूत धारणा नहीं बना सकते हैं और जाहिर सी बात है कि XYZ से ज्यादा पेंट ऐसे हैं कि कुछ लोग अपने घरों को सजाना पसंद करेंगे. तो धारणा निहित नहीं है।<br />\r\nचूँकि केवल पूर्वधारणा 1 निहित है।</p>\r\n\r\n<p><strong>अतः सही उत्तर विकल्प 1 है।</strong></p>", "question_heading": ""}, {"sr_no": 40, "question": "\r\n<p>P, Q से दो गुना दक्ष है। P, Q से 40 दिन कम में किसी कार्य को पूरा करने में सक्षम है। एक साथ कार्य करने पर, कार्य को पूरा करने में उनके द्वारा लिए गए दिनों की कुल संख्या कितनी है?</p>\r\n\r\n<p>(निकटतम पूर्णांक तक सन्निकटित कीजिए।)</p>", "option1": "\r\n<p>25</p>", "option2": "\r\n<p>26</p>", "option3": "\r\n<p>28</p>", "option4": "\r\n<p>27</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>P, Q से दो गुना दक्ष है। </p>\r\n\r\n<p>P, Q से 40 दिन कम में एक कार्य को पूरा करने में सक्षम है।</p>\r\n\r\n<p><strong>अवधारणा</strong></p>\r\n\r\n<p>दक्षता, समय के व्युत्क्रमानुपाती होती है।</p>\r\n\r\n<p>किया गया कार्य = दक्षता <span>&times;</span> समय</p>\r\n\r\n<p><strong>गणना</strong></p>\r\n\r\n<p>P = 2Q</p>\r\n\r\n<p>P : Q = 2 : 1</p>\r\n\r\n<p>समय का अनुपात = 1 : 2</p>\r\n\r\n<p>1 &rarr; 40</p>\r\n\r\n<p>P का समय = 40</p>\r\n\r\n<p><span>Q का समय = 80</span></p>\r\n\r\n<p>एक साथ कार्य करते हुए, कार्य को पूरा करने में उनके द्वारा लिए गए कुल दिनों की संख्या है:</p>\r\n\r\n<p>&rArr; (80 &times; 40)/120</p>\r\n\r\n<p>&rArr; 26.66 = 27<span> दिन</span></p>\r\n\r\n<p><strong><span>एक साथ कार्य करते हुए, कार्य को पूरा करने में उनके द्वारा लिए गए दिनों की कुल संख्या 27 दिन है।</span></strong></p>", "question_heading": ""}, {"sr_no": 41, "question": "\r\n<p>10 सेमी ऊँचाई और 14 सेमी व्यास वाले एक ठोस धातु बेलन को पिघलाया जाता है और ऊँचाई 10 सेमी रखते हुए 3 ∶ 4 (आयतन) के अनुपात में दो शंकु में बदल दिया जाता है। पहले और बाद में समतल पृष्ठीय क्षेत्रफल में कितने प्रतिशत परिवर्तन होगा?</p>", "option1": "\r\n<p>9%</p>", "option2": "\r\n<p>16%</p>", "option3": "\r\n<p>25%</p>", "option4": "\r\n<p>50%</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>बेलन का आयतन =<span> &pi;r</span><sup>2 h</sup></p>\r\n\r\n<p>बेलन का समतल पृष्ठीय क्षेत्रफल (अर्थात दो वृत्ताकार पृष्ठों का क्षेत्रफल) = <span>2&pi;r</span><sup>2</sup></p>\r\n\r\n<p><strong>गणना</strong></p>\r\n\r\n<p>बेलन का आयतन = <span>&pi;r</span><sup>2 h = &pi; &times; 7</sup><sup>2  &times; 10 = 1540 </sup>सेमी<sup>2</sup></p>\r\n\r\n<p>बेलन का समतल पृष्ठीय क्षेत्रफल = 2&pi; &times; 7<sup>2</sup> = 308 <span>सेमी</span><sup>2</sup></p>\r\n\r\n<p><strong>शंकु 1:</strong></p>\r\n\r\n<p>आयतन = (3/7) &times; 1540 = 660 सेमी<sup>3</sup></p>\r\n\r\n<p>शंकु का आयतन = <span>(1/3)&pi;</span><sup>2 h = 660</sup></p>\r\n\r\n<p>&rArr; (1/3)&pi;r<sup>2</sup> 10 = 660</p>\r\n\r\n<p>&rArr; &pi;r<sup>2</sup> = 66 &times; 3 = 198 <span>सेमी<sup>2</sup></span></p>\r\n\r\n<p>समतल पृष्ठीय क्षेत्रफल = &pi;<sup>2</sup> = 198 सेमी<sup>2</sup></p>\r\n\r\n<p><strong>शंकु 2:</strong></p>\r\n\r\n<p>आयतन = (4/7) &times; 1540 = 880 <span>सेमी</span><sup>2</sup></p>\r\n\r\n<p>शंकु का आयतन =<span> (1/3)&pi;</span><sup>2 h = 880</sup></p>\r\n\r\n<p><span>&rArr; (1/3)&pi;r</span><sup>2  10 = 880</sup></p>\r\n\r\n<p>&rArr; &pi;r<sup>2</sup> = 88 &times; 3 = 264 <span>सेमी</span><sup>2</sup></p>\r\n\r\n<p>अंतिम समतल <span>पृष्ठीय </span>क्षेत्रफल = 198 + 264 <span>सेमी</span><sup>2</sup> = 462 <span>सेमी</span><sup>2</sup></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<p>समतल <span>पृष्ठीय </span>क्षेत्रफल में वृद्धि = 462 &minus; 308 = 154 <span>सेमी</span><sup>2</sup></p>\r\n\r\n<p><strong>प्रतिशत वृद्धि = (154/308) &times; 100 = 50%</strong></p>", "question_heading": ""}, {"sr_no": 42, "question": "\r\n<p>गुणोत्तर श्रेढ़ी (जी.पी.) का योगफल ज्ञात करें:</p>\r\n\r\n<p>1/3, 1/9, 1/27, 1/81, ... n पदों तक।</p>", "option1": "\r\n<p><span>5/3(1 - (1/3)</span><sup>n ) </sup></p>", "option2": "\r\n<p><span>1/2(1 - (1/3)</span><sup>n )</sup></p>", "option3": "\r\n<p><span>3/2(1 - (1/3)</span><sup>n )  </sup></p>", "option4": "\r\n<p><span>4/3(1 - (1/3)</span><sup>n ) </sup></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया:</span></p>\r\n\r\n<p>1/3, 1/9, 1/27, 1/81, ...n पद</p>\r\n\r\n<p><span>प्रयुक्त अवधारणा:</span></p>\r\n\r\n<p>S<span>n</span> = <span class=\"math-tex\">\\(\\frac{a(r^n-1)}{r-1}\\)</span></p>\r\n\r\n<p><span>गणना:</span></p>\r\n\r\n<p>&rArr; a = 1/3, r = 1/3</p>\r\n\r\n<p>&rArr; सूत्र में मान रखने पर,</p>\r\n\r\n<p>&rArr; गुणोत्तर श्रेढ़ी के n पदों का योग = <span class=\"math-tex\">\\(\\frac{\\frac{1}{3}(\\frac{1}{3}^n-1)}{\\frac{1}{3}-1}\\)</span> = <span class=\"math-tex\">\\(\\frac{\\frac{1}{3}(\\frac{1}{3}^n-1)}{\\frac{-2}{3}}\\)</span></p>\r\n\r\n<p>&rArr; गुणोत्तर श्रेढ़ी के n पदों का योग = <span class=\"math-tex\">\\(\\frac{1}{2}(1-\\frac{1}{3}^n)\\)</span></p>\r\n\r\n<p><span>इसलिए, दी गयी गुणोत्तर </span><strong><span>श्रेढ़ी  </span></strong><span>का योग <span class=\"math-tex\">\\(\\frac{1}{2}(1-\\frac{1}{3}^n)\\)</span> है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": "\r\n<div>\r\n<p>निम्न समीकरण को सही बनाने के लिए कौन से दो चिह्नों की अदला-बदली की जानी चाहिए?</p>\r\n40 + 10 &divide; 2 &times; 8 &ndash; 17 = 17</div>", "option1": "\r\n<p>+ और -</p>", "option2": "\r\n<p>&divide; और &times;</p>", "option3": "\r\n<p>&times; और + </p>", "option4": "\r\n<p>&divide; और -</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p>+ और &ndash; की अदला-बदली करने पर</p>\r\n\r\n<p>40 - 10 &divide; 2 + 8 + 17 = 40 - 5 &times; 8 + 17</p>\r\n\r\n<p><strong>40 - 40 + 17 = 17</strong></p>\r\n\r\n<p>&divide; और &times; की अदला-बदली करने पर</p>\r\n\r\n<p><span class=\"math-tex\">\\(40 + 10 \\times 2 \\div 8 + 17 = 40 + \\frac{5}{2}\\ + 17 \\ne 17\\)</span></p>\r\n\r\n<p>&times; और + की अदला-बदली करने पर</p>\r\n\r\n<p>40 &times; 10 &divide; 2 + 8 - 17 = 40 &times; 5 + 8 - 17</p>\r\n\r\n<p>200 + 8 - 17 &ne; 17</p>\r\n\r\n<p>&divide; और &ndash; की अदला-बदली करने पर</p>\r\n\r\n<p><span class=\"math-tex\">\\(40 + 10 - 2 \\times 8 \\div 17 = 40 + 10 - \\frac{{2 \\times 8}}{{17}}\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(50 - \\frac{{16}}{{17}} \\ne 17\\)</span></p>\r\nअतः, + और &ndash; की अदला-बदली करके हमें सही समीकरण प्राप्त होगा।</div>", "question_headin
