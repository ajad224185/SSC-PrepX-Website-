 Sector Enterprises (CPSEs) in India. So, Statement 1 is correct.\n  <br> Coal India Limited is indeed the largest government-owned coal-producing company in the world. It accounts for a significant portion of India's coal production and plays a crucial role in meeting the country's energy needs. So, statement 2 is also correct.\n  <br> The Headquarters of Coal India Limited is located in Kolkata, West Bengal, and not in Ranchi, Jharkhand. So, Statement 3 is Incorrect.\n  <br> Therefore, the correct answer is (b) 1 and 2 only.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Which one of the following islands is of volcanic origin?\n  <br>", "option1": "Reunion island\n  <br>", "option2": "Andaman & Nicobar Islands\n  <br>", "option3": "Lakshadweep islands\n  <br>", "option4": "Maldives\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Barren Island is an island located in the Andaman Sea, dominated by Barren Volcano, the only confirmed active volcano in South Asia and the only active volcano along a chain of volcanoes from Sumatra to Myanmar.\n  <br>It is a part of the Indian Union territory of Andaman and Nicobar Islands and lies about 138 km (86 mi) northeast of the territory's capital, Port Blair.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Which one of the following is the cause of long-term sea-level change?\n  <br>", "option1": "Atmospheric disturbance\n  <br>", "option2": "Change in marine water density\n  <br>", "option3": "Melting of icebergs\n  <br>", "option4": "Melting of ice sheets\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The long-term change in sea levels is linked to three primary factors:\n  <br>1. Thermal expansion\n  <br>2. Melting glaciers\n  <br>3. Loss of Greenland and Antarctica’s ice sheets\n  <br>Ice sheets, such as those found in Greenland and Antarctica, contain vast amounts of ice. When these ice sheets melt, the resulting water flows into the oceans, causing a rise in sea levels. This process occurs over a long period of time and can lead to significant changes in global sea levels.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "The ruins of the Vijayanagara at Hampi were brought to light in 1800 by\n  <br>", "option1": "Colonel Colin Mackenzie\n  <br>", "option2": "Sir John Shore\n  <br>", "option3": "Andrew Fraser\n  <br>", "option4": "John Marshall\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The ruins at Hampi were brought to light in 1800 by an engineer and antiquarian named Colonel Colin Mackenzie. An employee of the English East India Company, he prepared the first survey map of the site. Much of the initial information he received was based on the memories of priests of the Virupaksha temple and the shrine of Pampadevi. Subsequently, from 1856, photographers began to record the monuments which enabled scholars to study them.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "Match List-I with List-II and select the correct answer using the code given below the Lists:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089196image36.png\"> \n  <br>  \n  <b> A B C D </b> \n  <br>", "option1": "4 3 1 2\n  <br>", "option2": "3 1 4 2\n  <br>", "option3": "4 3 2 1\n  <br>", "option4": "3 4 2 1\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Rowlatt Act- 1919; The Anarchical and Revolutionary Crimes Act of 1919, popularly known as the Rowlatt Act or Black Act, was a legislative council act passed by the Imperial Legislative Council in Delhi on 21 March 1919. The acts allowed certain political cases to be tried without juries and permitted the internment of suspects without trial.\n  <br>Chauri Chaura Incident- 1922; The Chauri Chaura incident took place at Chauri Chaura in the Gorakhpur district of the United Province, in British India on 5 February 1922, when a large group of protesters, participating in the Non-cooperation movement, clashed with police, who opened fire.\n  <br>Salt March- 1930; The 24-day march lasted from 12 March 1930 to 6 April 1930 as a direct-action campaign of tax resistance and nonviolent protest against the British salt.\n  <br>Second Round Table Conference- 1931; The Second Round Table Conference was held in London from 7 September 1931 to 1 December 1931 with the participation of Gandhi and the Indian National Congress. So, the correct match is – A – 4, B – 3, C – 1, D – 2.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Which of the following is known as alkaline earth metal?\n  <br>", "option1": "Magnesium\n  <br>", "option2": "Cobalt\n  <br>", "option3": "Copper\n  <br>", "option4": "Platinum\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Among the following Magnesium is alkaline earth metal.\n  <br>The alkaline earth metals are six chemical elements in group 2 of the periodic table. They are beryllium (Be), magnesium (Mg), calcium (Ca), strontium (Sr), barium (Ba), and radium (Ra).\n  <br>Magnesium is the third most abundant element in the Earth's crust, and it is used in a variety of applications, including making alloys, fertilizers, and batteries.\n  <br>The other options, cobalt, copper, and platinum are not alkaline earth metals. Cobalt is a transition metal, copper is a transition metal, and platinum is a platinum group metal.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "______ is a sessile animal, that relies upon its relationship with plants like algae to build the largest structures of biological origin on Earth.\n  <br>", "option1": "Mammal\n  <br>", "option2": "Bird\n  <br>", "option3": "Reptile\n  <br>", "option4": "Coral\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Coral is a sessile animal, that relies upon its relationship with plants like algae to build the largest structures of biological origin on earth.\n  <br>Corals are marine invertebrates within the class Anthozoa of the phylum Cnidaria.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "The force of attraction between molecules of the same substance is called ______.\n  <br>", "option1": "viscosity\n  <br>", "option2": "cohesive force\n  <br>", "option3": "surface tension\n  <br>", "option4": "adhesive force\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Force of attraction between molecules of the same substance is called cohesive force.\n  <br>The force of attraction between molecules of different substances is called adhesive force.\n  <br>Surface tension, the property of a liquid surface displayed by its acting as if it were a stretched elastic membrane.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "Who among the following was the first player from the Indian sub-continent to play for a European Football club (Celtic FC)?\n  <br>", "option1": "Pradeep Kumar Banerjee\n  <br>", "option2": "Mohammed Salim\n  <br>", "option3": "Sailen Manna\n  <br>", "option4": "Neville D'Souza\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Mohammed Salim was the first player from the Indian sub-continent to play for a European Football club (Celtic FC).\n  <br>Mohammed Salim was best known for his role in the fabled 1930s Mohammedan SC team which claimed five successive Calcutta Football League titles.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Which Sultan established a separate department (Diwan-i-Amir Kohi) to take care of agriculture?\n  <br>", "option1": "Khizr Khan\n  <br>", "option2": "Tughril Beg\n  <br>", "option3": "Jalal-ud-din Khalji\n  <br>", "option4": "Muhammad Bin Tughlaq\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Muhammad Bin Tughlaq established a separate department (Diwan-i-Amir Kohi) to take care of agriculture.\n  <br> Muhammad Bin Tughlaq is known for Five Disastrous Projects:\n  <br>o Taxation in the Doab.\n  <br>o Transfer of Capital.\n  <br>o Khurasan Expedition.\n  <br>o Karachi Expedition.\n  <br>o Introduction of Token Currency.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Which of the following statements is/are correct regarding the Indian Ocean?\n  <br> A. The Indian Ocean is the third-largest of the world's oceanic divisions.\n  <br> B. It is bounded by Asia on the north, on the west by Africa, on the east by Australia, and on the south by the Southern Ocean.\n  <br> C. The Indian Ocean is known as Ratnākara in Sanskrit literature, and as Hind Mahāsāgar in Hindi.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A and C only\n  <br>", "option4": "A, B, and C\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) A, B, and C. All the statements are correct regarding the Indian Ocean.\n  <br>The Indian Ocean is the third-largest of the world's oceanic divisions. It is smaller than the Pacific Ocean and the Atlantic Ocean, but larger than the Arctic Ocean and the Southern Ocean. So, Statement A is correct.\n  <br>The Indian Ocean is bounded by Asia on the north, on the west by Africa, on the east by Australia, and on the south by the Southern Ocean. So, Statement B is also correct.\n  <br>The Indian Ocean is known as Ratnākara in Sanskrit literature and as Hind Mahāsāgar in Hindi. So, statement C is also correct.\n  <br>Therefore, the correct answer is (d), A, B, and C.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "Which one of the following body parts/organs of the human body does not have smooth muscles?\n  <br>", "option1": "Ureters\n  <br>", "option2": "Iris of eye\n  <br>", "option3": "Bronchi of lungs\n  <br>", "option4": "Biceps\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d), biceps. Biceps are skeletal muscles, which means that they are striated and under voluntary control.\n  <br>Smooth muscle is present in the walls of hollow organs like the urinary bladder, uterus, stomach, intestines, and in the walls of passageways, such as the arteries and veins of the circulatory system, and the tracts of the respiratory, urinary, and reproductive system.\n  <br>Smooth muscle is also present in the eyes, where it functions to change the size of the iris and alter the shape of the lens; and in the skin where it causes hair to stand erect in response to cold temperature or fear.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "What is Inter-cropping?\n  <br>", "option1": "the time period between two cropping seasons.\n  <br>", "option2": "growing of two or more crops in a random mixture.\n  <br>", "option3": "growing of two or more crops indefinite row patterns.\n  <br>", "option4": "the growing of different crops on a piece of land in a pre-planned succession.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Intercropping is a farming method that involves planting or growing more than one crop at the same time and on the same piece of land. It means having more than one type of crop growing in the same space at the same time.\n  <br>The rationale behind this farming practice is that different crops planted are not likely to share insects and disease-causing agents while the goal is to produce even greater yield than would be if space was utilized by one crop. However, the careless congregation of plants is not considered as intercropping.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "Which of the following are the benefits of the Pradhan Mantri Jan Arogya Yojana (PMJAY)?\n  <br>1. Free treatment available at all public and empaneled private hospitals in times of need\n  <br>2. Cashless and paperless access to quality health-care services\n  <br>3. Government provides health insurance cover of up to Rs. 5,00,000 per family per year\n  <br>4. Pre-existing diseases are not covered\n  <br>Select the correct answer using the code given below.\n  <br>", "option1": "1 and 3 only\n  <br>", "option2": "1, 2 and 3\n  <br>", "option3": "2 and 4 only\n  <br>", "option4": "2, 3 and 4\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Ayushman Bharat PM-JAY is the largest health assurance scheme in the world which aims at providing a health cover of Rs. 5 lakhs per family per year for secondary and tertiary care hospitalization to over 10.74 crores poor and vulnerable families (approximately 50 crore beneficiaries) that form the bottom 40% of the Indian population.\n  <br>Benefits of the scheme are portable across the country i.e.; a beneficiary can visit any empanelled public or private hospital in India to avail of cashless treatment. All pre–existing conditions are covered from day one.\n  <br>No restriction on family size, age, or gender; all previous medical conditions are covered under the scheme; it covers 3 days of pre-hospitalization and 15 days of post-hospitalization, including diagnostic care and expenses on medicines; the scheme is portable and a beneficiary can avail medical treatment at any PM-JAY empanelled hospital outside their state and anywhere in the country.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Which institution has become the first among all AIIMS to receive National Accreditation Board for Hospitals (NABH) accreditation?\n  <br>", "option1": "AIIMS Delhi\n  <br>", "option2": "AIIMS Nagpur\n  <br>", "option3": "AIIMS Bhopal\n  <br>", "option4": "AIIMS Jodhpur\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "AIIMS Nagpur has become the first among all AIIMS to receive National Accreditation Board for Hospitals (NABH) accreditation.\n  <br> NABH accreditation is a globally recognized standard for healthcare quality.\n  <br> AIIMS Nagpur achieved this accreditation by demonstrating its commitment to excellence in all areas, including patient care, safety, and organizational efficiency.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "Which agencies recently released the Hunger Hotspots report highlighting areas of acute food insecurity?\n  <br>", "option1": "Food and Agriculture Organization (FAO) and World Food Program (WFP)\n  <br>", "option2": "World Bank\n  <br>", "option3": "United Nations Children's Fund (UNICEF)\n  <br>", "option4": "International Monetary Fund (IMF)\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The recently published Hunger Hotspots report was released by two agencies: Food and Agriculture Organization (FAO) and World Food Program (WFP).\n  <br> The report identifies 18 areas in 22 countries where acute food insecurity may increase in magnitude and severity.\n  <br> It highlights hotspots with very high concern, including countries like Pakistan, the Central African Republic, Ethiopia, Kenya, the Democratic Republic of the Congo, and the Syrian Arab Republic.\n  <br> The report also mentions countries at the highest concern level, such as Afghanistan, Nigeria, Somalia, South Sudan, and Yemen.\n  <br> International Monetary Fund (IMF) reports - World Economic Outlook, Global Financial Stability Report.\n  <br> UNICEF (United Nations Children’s Emergency Fund) Reports - Report on Regular Resources, The State of the World’s Children reports.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Which country did India defeat in the final of the Men's Junior Asia Cup 2023 to clinch the title?\n  <br>", "option1": "Japan\n  <br>", "option2": "Malaysia\n  <br>", "option3": "South Korea\n  <br>", "option4": "Pakistan\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the final of the Men's Junior Asia Cup 2023 held in Salalah, Oman, the Indian hockey team emerged victorious by defeating Pakistan.\n  <br> This victory marked India's fourth title at the Men's Junior Asia Cup, having previously won in 2004, 2008, and 2015.\n  <br> With this win, India has become the most successful country in the history of the Men's Junior Asia Cup.\n  <br> Pakistan is the second-most successful team in the tournament, having won the title three times.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Who recently won the 2023 International Booker Prize for their book 'Time Shelter'?\n  <br>", "option1": "Georgi Gospodinov\n  <br>", "option2": "Angela Rodel\n  <br>", "option3": "Both Georgi Gospodinov and Angela Rodel\n  <br>", "option4": "Geetanjali Shree and Daisy Rockwell\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Georgi Gospodinov and Angela Rodel won the 2023 International Booker Prize for their book 'Time Shelter'.\n  <br> It is also the first book in Bulgarian to win the prize.\n  <br> The International Booker Prize (formerly known as the Man Booker International Prize) is an international literary award hosted in the United Kingdom.\n  <br> Geetanjali Shree and Daisy Rockwell are the winners of the previous year for their novel Tomb of Sand.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "What is the seating capacity of the Lok Sabha chamber in the Parliament House inaugurated by PM Modi?\n  <br>", "option1": "300\n  <br>", "option2": "888\n  <br>", "option3": "500\n  <br>", "option4": "600\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The seating capacity of the Lok Sabha chamber in the new Parliament House is 888 members.\n  <br> The seating capacity of the Rajya Sabha chamber is 300 members.\n  <br> PM Modi inaugurated the new New Delhi Parliament House on May 28, 2023 which was constructed by Tata Projects Ltd.\n  <br> There are three main gates - Gyan Dwar, Shakti Dwar, and Karma Dwar.\n  <br> The new Lok Sabha chamber has a peacock theme, and the Rajya Sabha's theme is based on the National Flower, Lotus.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "Which film won the Best Film award at the International Indian Film Academy Awards (IIFA) 2023?\n  <br>", "option1": "Drishyam 2\n  <br>", "option2": "Vikram Vedha\n  <br>", "option3": "Gangubai Kathiawadi\n  <br>", "option4": "Rocketry: The Nambi Effect\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Best Film award at the International Indian Film Academy Awards (IIFA) 2023 was won by Drishyam 2.\n  <br> Hrithik Roshan won the Best Actor award for his performance in Vikram Vedha.\n  <br> Alia Bhatt won the Best Actor (Female) award for Gangubai Kathiawadi.\n  <br> R Madhavan won the Best Director award for Rocketry: The Nambi Effect.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "Which of the following type of mouse uses batteries for its power supply?\n  <br>", "option1": "Optical Mouse\n  <br>", "option2": "Mechanical Mouse\n  <br>", "option3": "Trackball Mouse\n  <br>", "option4": "Cordless Mouse\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A \n  <b>cordless mouse</b>, often known as a wireless mouse, is one that connects to a computer wirelessly.\n  <br> Instead, the mouse communicates with the computer using Bluetooth, RF, or infrared radio waves.\n  <br> The Logitech Metaphor was the first wireless device, invented in 1984.\n  <br> This mouse is used to improve the experience of using a mouse and uses batteries for its power supply.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Name the type of scanner which has a photomultiplier tube (PMT) to scan images.\n  <br>", "option1": "Sheetfed Scanner\n  <br>", "option2": "Handheld Scanner\n  <br>", "option3": "Flatbed Scanner\n  <br>", "option4": "Drum Scanner\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The scanner scans the image or document using photos and pages of text as input.\n  <br> The scanned image or document is then converted to a digital format or file and presented as an output on the computer screen.\n  <br> It converts photos into digital ones using optical character recognition algorithms.\n  <br> A photomultiplier tube (PMT) is used to scan images in a \n  <b>drum scanner.</b> \n  <br> The photomultiplier tube is a light-sensitive device.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Inkjet Printer can produce print objects with a resolution of at least__________.\n  <br>", "option1": "200 dpi\n  <br>", "option2": "150 dpi\n  <br>", "option3": "300 dpi\n  <br>", "option4": "350 dpi\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The inkjet printer is a non-impact printer that uses small, ionised ink drops to print images and characters.\n  <br> The printer head rotates back and forth, spraying ionised dots of ink onto the paper.\n  <br> These droplets pass through an electric field, which directs the ink onto the paper, resulting in the accurate printing of images and letters.\n  <br> It has the ability to produce high-quality photos in a variety of colours.\n  <br> It can print with a minimum resolution of \n  <b>300 dots per inch (dpi).</b> \n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "With reference to the components of motherboard, AGP is a type of_________.\n  <br>", "option1": "RAM Slot\n  <br>", "option2": "CPU Slot\n  <br>", "option3": "Capacitor\n  <br>", "option4": "Expansion Slot\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The motherboard is a narrow circuit board that connects practically all of the components of a computer, except input and output devices.\n  <br> \n  <b>Expansion Slot,</b> also known as the bus slot or expansion port, is a connection or port on the motherboard that allows a hardware expansion card to be installed.\n  <br> AGP, AMR, CNR, PCI are some of the common expansion slots in a computer.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "In Microsoft Word, Thesaurus and Spell Check options are available under which tab?\n  <br>", "option1": "References\n  <br>", "option2": "Home\n  <br>", "option3": "Insert\n  <br>", "option4": "Review\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Thesaurus is a software program that finds synonyms and antonyms for the specified term in a Microsoft Word document.\n  <br> Microsoft Word has a good Spelling and Grammar Checker that allows you to find and correct all spelling and grammar errors in your text.\n  <br> Under the \n  <b>Review tab</b> in Microsoft word, options like Thesaurus, Spelling and Grammar Checker, Word count, Translation etc. are included.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "Customer Relationship Management (CRM) is an example of_________.\n  <br>", "option1": "Spreadsheet Software\n  <br>", "option2": "Enterprise Software\n  <br>", "option3": "Multimedia Software\n  <br>", "option4": "Word Processing Software\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Application software is defined as a set of programs designed to perform a specific task.\n  <br> Because it is developed for end-users, it does not control the operation of a computer.\n  <br> \n  <b>Enterprise software</b> is a type of application software designed to support company operations.\n  <br> It is utilised in large enterprises with a huge volume of business.\n  <br> CRM (Customer Relationship Management), BI (Business Intelligence), ERP (Enterprise Resource Planning) are the examples of Enterprise software.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "Which keyboard shortcut can be used to stretch desktop window to the top and bottom of the screen?\n  <br>", "option1": "Windows key + Shift + Down arrow key\n  <br>", "option2": "Windows key + Shift + Up arrow key\n  <br>", "option3": "Windows key + Shift + M\n  <br>", "option4": "Windows key + Home\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Windows key + Shift + Down arrow key : Used to maximize or minimize active windows vertically while maintaining width.\n  <br> \n  <b>Windows key + Shift + Up arrow key :</b> Used to stretch desktop window to the top and bottom of the screen.\n  <br>Windows key + Shift + M : Used to restore minimized windows on the desktop.\n  <br>Windows key + Home : Used to minimize or maximize all but the active desktop window.\n  <br>Windows key + Shift + Right arrow key : Used to move the active window to monitor on the right.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "In computer terminology, what does ‘S’ in BSoD stands for?\n  <br>", "option1": "Service\n  <br>", "option2": "Server\n  <br>", "option3": "Screen\n  <br>", "option4": "Safe\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The blue \n  <b>screen</b> of death (BSoD) is a Microsoft Windows error screen that appears to signal system problems and the possibility of a crash.\n  <br> System hardware, temperature, timing, resources, faulty registries, and viruses all play a role in BSoD issues.\n  <br> The BSoD error screen serves as a warning to prevent additional damage to the computer and system.\n  <br> A blue screen of death (BSoD) causes Windows to freeze and requires a reboot to continue operating.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "Incognito Mode is a privacy feature available in which of the following web-browser?\n  <br>", "option1": "Google Chrome\n  <br>", "option2": "Microsoft Edge\n  <br>", "option3": "Mozilla Firefox\n  <br>", "option4": "All of the above\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Incognito Mode is a privacy feature that allows you to browse the web without saving your browsing history.\n  <br> It is also known as private window, private browsing, or InPrivate Browsing.\n  <br> Your browsing history will not be saved if you enable this setting in your browser, such as Google Chrome.\n  <br> When you use Incognito mode, your browsing history is automatically cleared when you close your private window.\n  <br> \n  <b>Some browsers, such as Google Chrome, Microsoft Edge, Mozilla Firefox, Internet Explorer, and Apple Safari, provide a private browsing function.</b> \n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "iPad, a tablet computer developed by Apple was launched in which year?\n  <br>", "option1": "2016\n  <br>", "option2": "2013\n  <br>", "option3": "2010\n  <br>", "option4": "2008\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The iPad is a tablet computer developed by Apple in the year \n  <b>2010.</b> \n  <br> It is a little smaller than a laptop, but larger than a smartphone.\n  <br> The iPad does not include a keyboard or a trackpad, instead relying on a touchscreen interface to operate the device.\n  <br> This portable gadget may be used for a variety of tasks, including accessing the Internet, listening to music, viewing movies, reading e-books, and playing games.\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "Charles Baggage designed two engines. They are which of the following?\n  <br>", "option1": "Addition and subtraction engine\n  <br>", "option2": "Analytic and difference engine\n  <br>", "option3": "Addition and multiplication engine\n  <br>", "option4": "Analytic and digital engine\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>Analytic Engine</b> was invented by Charles Babbage, a mathematics professor.\n  <br> A new machine was developed that was capable of performing differential equations.\n  <br> It was known as \n  <b>Difference Engine.</b> This machine was powered by steam, which was quite large in size and capable of storing programs and performing calculations as well as printing the results.\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089199image37.png\"> \n  <br>", "option1": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089201image38.png\"> \n  <br>", "option2": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089201image39.png\"> \n  <br>", "option3": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089203image40.png\"> \n  <br>", "option4": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089205image41.png\"> \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>  \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694435089574image81.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "What is the full form of BMP?\n  <br>", "option1": "Byte map image file\n  <br>", "option2": "Bitmap image file\n  <br>", "option3": "Byte map process\n  <br>", "option4": "Bit map process\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The BMP or \n  <b>bitmap image file</b> is a device-independent bitmap file format that is a graphics image file format that is used for storing bitmap digital images independent of the display device.\n  <br> As BMP images are device-independent they require no graphics adapter for their display.\n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "RAM is always located on the motherboard. If you manually want to install the RAM, then the first step is?\n  <br>", "option1": "Do not install it yourself\n  <br>", "option2": "Unplug the cables\n  <br>", "option3": "Shutdown the computer\n  <br>", "option4": "Both b and c\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> RAM is \n  <b>fitted on the motherboard.</b> \n  <br> To install the new RAM, the following steps are to be followed for safe installation.\n  <br> \n  <b>Shut down the computer</b> properly and remove the power plug from the supply source.\n  <br> Insert the required RAM at the specified location and restart the computer.\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "When you change the colour and background of a chart in a spreadsheet you are performing which of the following?\n  <br>", "option1": "Merging\n  <br>", "option2": "Formatting\n  <br>", "option3": "Painting\n  <br>", "option4": "Calculating\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Editing means making changes in the value of data while \n  <b>formatting </b>means changing the look and feel of the data.\n  <br> In the case of formatting, one does not change its value.\n  <br> Generally changing the colour of the font, changing the size of the font, putting the background colour, changing the colour of the text, etc. comes under formatting.\n  <br>", "question_heading": ""}, {"sr_no": 146, "question": "From which of the following the term ‘Wi-Max’ has been derived?\n  <br>", "option1": "Worldwide Interoperability for Microwave Access\n  <br>", "option2": "World Interconnection for Microwave Access\n  <br>", "option3": "Worldwide Interchangeability for Microwave Access\n  <br>", "option4": "Worldwide Interconnection for Multiple Access\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Wi-Max stands for \n  <b>Worldwide Interoperability for Microwave Access.</b> WiMAX is a telecommunications technology.\n  <br> Through this technology, one computer will be able to establish contact with another computer without the help of wires.\n  <br> Its speed is 2 Mbps and it remains the same for 10 km. Its range is higher than that of Wi-Fi.\n  <br> While its range will be 5 to 15 km for laptops, it will be 50 km in fixed computer stations.\n  <br>", "question_heading": ""}, {"sr_no": 147, "question": "Which of the following is the most common internet protocol for transferring files on the Internet?\n  <br>", "option1": "File Transfer Protocol (FTP)\n  <br>", "option2": "Transmission Control Protocol (TCP)\n  <br>", "option3": "Hypertext Transfer Protocol (HTTP)\n  <br>", "option4": "User Datagram Protocol (UDP)\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>File Transfer Protocol</b> is one of the first and widely used internet services that allow users to easily move files from one computer to another.\n  <br> Using the FTP a user can log on to a remote computer and browse through its files and can also download or upload files if he has access to do so.\n  <br>", "question_heading": ""}, {"sr_no": 148, "question": "Who is the father of the C language?\n  <br>", "option1": "Dennis Ritchie\n  <br>", "option2": "Bjarne Stroustrup\n  <br>", "option3": "Dr. James Arthur Gosling\n  <br>", "option4": "John Kemeny\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>Dennis Ritchie </b>is an American scientist who developed C language in AT and T Bell laboratory between 1967 and 1973.\n  <br> He is also the inventor of the Unix operating system.\n  <br> Dr. James Arthur Gosling developed Java, Bjarne Stroustrup invented C++, John Kemeny invented Visual Basic and Larry Wall invented Perl.\n  <br>", "question_heading": ""}, {"sr_no": 149, "question": "Superscript, subscript, outline, emboss, engrave all these are collectively known as?\n  <br>", "option1": "Font styles\n  <br>", "option2": "Text effect\n  <br>", "option3": "Word art\n  <br>", "option4": "Font effects\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Superscript, subscript, outline, emboss, engrave are the part of \n  <b>font effects.</b> \n  <br>The following steps are to be used to get the font effects.\n  <br>1. Select the text where the effect is required.\n  <br>2. From the Home tab, click on the Font group as a requirement and apply by clicking to get the effect\n  <br>3. Select the required effect and click for other effects such as, point to Outline, Shadow, Reflection, or Glow, and then click the effect.\n  <br>", "question_heading": ""}, {"sr_no": 150, "question": "The term HTTP stands for HyperText transfer protocol. Who has developed this protocol to transfer information over the internet?\n  <br>", "option1": "Tim Berners Lee\n  <br>", "option2": "Alan Turing\n  <br>", "option3": "George Boole\n  <br>", "option4": "Charles Bachman\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Hyper File Transfer Protocol is one of the first and widely used internet services developed that allows users to easily move files from one computer to another.\n  <br> Using HTTP a user can log on to a remote computer and browse through its files and can also download or upload files if he has access to do so.\n  <br> It was developed by \n  <b>Tim Berners Lee.</b> \n  <br>       \n  <br>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
