derlined part in the given sentence is grammatically incorrect.</li>\r\n\t<li>Here, <strong>&#39;aren&#39;t they&#39; </strong>should be used instead of <strong>&#39;isn&#39;t it&#39;.</strong></li>\r\n\t<li>A positive statement  is followed by  a negative question tag.\r\n\t<ul>\r\n\t\t<li><em>Example: Mary can speak English, can&#39;t she?</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>A negative statement  is followed by  a positive question tag.\r\n\t<ul>\r\n\t\t<li><em>Example: They aren&#39;t funny, are they?</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>In the given sentence &#39; <strong>flights </strong>&#39; is a plural subject. And &#39; <strong>are </strong>&#39; is the <strong>helping verb.</strong></li>\r\n\t<li>Hence, its question tag will be <strong>&#39;aren&#39;t they&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 2.</strong></li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sentence:</u></strong><em>During foggy weather, flights are often cancelled, <strong>aren&#39;t they?</strong></em></p>", "question_heading": ""}, {"sr_no": 82, "question": "\r\n<p><strong>Select the most appropriate ANTONYM of the given word.</strong></p>\r\n\r\n<p>Dispatch</p>", "option1": "\r\n<p>Acquire</p>", "option2": "\r\n<p>Transmit</p>", "option3": "\r\n<p>Deliver</p>", "option4": "\r\n<p>Bulletin</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 1), i.e., &#39;Acquire .&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meanings of the given word and marked option:\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Dispatch</th>\r\n\t\t\t\t<td>the act of sending someone or something somewhere. (किसी को या कुछ कहीं भेजने की क्रिया)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Acquire</th>\r\n\t\t\t\t<td>to obtain or begin to have something. (कुछ प्राप्त करना या शुरू करना)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n</ul>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meanings of the other given options:\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Transmit</th>\r\n\t\t\t\t<td>to broadcast something, or to send out or carry signals or messages using radio, television, etc. (कुछ प्रसारित करने के लिए, या रेडियो, टेलीविजन, आदि का उपयोग करके संकेत या संदेश भेजने या ले जाने के लिए)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Deliver</th>\r\n\t\t\t\t<td>to give, direct, or aim something. (कुछ देना, प्रत्यक्ष करना या लक्ष्य करना)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Bulletin</th>\r\n\t\t\t\t<td>a short piece of news on television or radio, or a short report or news item released by an organization. (टेलीविजन या रेडियो पर समाचार का एक छोटा टुकड़ा, या एक संगठन द्वारा जारी एक छोटी रिपोर्ट या समाचार आइटम)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n\t<li>Hence from the given meanings,we find that &#39; Dispatch &#39; and &#39; Acquire &#39;are antonyms.</li>\r\n\t<li>So,the correct answer is option 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 83, "question": "\r\n<p><strong>Choose the CORRECT option to complete the given sentence</strong>:</p>\r\n\r\n<p>He is a very narrow-minded person;______.</p>", "option1": "\r\n<p>so do his father</p>", "option2": "\r\n<p>so weren&rsquo;t her children</p>", "option3": "\r\n<p>so is his wife</p>", "option4": "\r\n<p>does not he</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: <strong>&quot;</strong><strong>so is his wife&quot;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in present tense, and it states that &quot;he is a very narrow-minded person.&quot;</li>\r\n\t<li>Therefore, we need an option that matches the present tense and conveys a similar idea.</li>\r\n\t<li><u>Let&#39;s have a look at each option:</u></li>\r\n\t<li>&quot;<strong>So do his father</strong>&quot; - This option is in the present tense, but the use of &quot;<strong>do</strong>&quot; is incorrect.</li>\r\n\t<li>&quot;<strong>So weren&#39;t her children</strong>&quot; - This option is in past tense and doesn&#39;t match the tense of the sentence. The use of pronoun &quot;her&quot; is also incorrect. Additionally, it doesn&#39;t make sense in the context of the sentence.</li>\r\n\t<li>&quot;<strong>So is his wife</strong>&quot; - This option is in the present tense and conveys the same idea as the original sentence. It means that his wife is also narrow-minded.</li>\r\n\t<li>&quot;<strong>Does not he</strong>&quot; - This option is grammatically incorrect. It should be &quot;does he not,&quot; but even then, it doesn&#39;t fit in the context of the sentence.</li>\r\n\t<li>Hence option 3 is correct.</li>\r\n</ul>\r\n\r\n<p><u>Complete sentence</u>: &quot;He is a very narrow-minded person, <u>so is his wife</u>.&quot; </p>", "question_heading": ""}, {"sr_no": 84, "question": "\r\n<p>The outer covering of human brain is _________?</p>", "option1": "\r\n<p>Coracoid </p>", "option2": "\r\n<p>Piamater </p>", "option3": "\r\n<p>Duramater </p>", "option4": "\r\n<p>Arachnoid </p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<ul>\r\n\t<li>The <strong>Duramater </strong>is the tough and outermost layer of the meninges that covers the brain and spinal cord.\r\n\r\n\t<ul>\r\n\t\t<li>It is a thick and fibrous layer that protects the brain and spinal cord from external shocks or trauma.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Piamater</strong> plays a crucial role in protecting and nourishing the brain.\r\n\t<ul>\r\n\t\t<li>The Piamater is the thin, delicate, and innermost layer that covers the surface of the brain and spinal cord.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The <strong>Arachnoid</strong> is the middle layer of the meninges that covers the brain and spinal cord.\r\n\t<ul>\r\n\t\t<li>It is a delicate and web-like layer that is located between the Duramater and the Piamater.</li>\r\n\t\t<li>The Arachnoid is filled with cerebrospinal fluid (CSF), which helps to cushion the brain and spinal cord.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The <strong>Coracoid </strong>is a bone in the shoulder that connects the scapula and the clavicle. It has no relation to the brain or its coverings.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 85, "question": "\r\n<p>Match list-I with list-II and identify the correct answer from the code given below -</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>List-I<br />\r\n\t\t\tConstituent Assembly Committee</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>List-II<br />\r\n\t\t\tChairman</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(A) Fundamental Rights</td>\r\n\t\t\t<td>(i) B.R. Ambedkar</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(B) Steering</td>\r\n\t\t\t<td>(ii) Jawahar Lal Nehru</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(C) Union powers</td>\r\n\t\t\t<td>(iii) Dr Rajendra Prasad</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(D) Drafting </td>\r\n\t\t\t<td>(iv) Sardar Patel</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "option1": "\r\n<p>A-(iv), B-(iii), C-(ii), D-(i)</p>", "option2": "\r\n<p>A-(ii), B-(iv), C-(iii), D-(i)</p>", "option3": "\r\n<p>A-(iii), B-(iv), C-(ii), D-(i)</p>", "option4": "\r\n<p>A-(ii), B-(iii), C-(iv), D-(i)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u>A-(iv), B-(iii), C-(ii), D-(i)</u>.</p>\r\n\r\n<ul>\r\n\t<li>The Constitution of India was framed by a Constitution Assembly set up under the Cabinet Mission Plan of 1946.</li>\r\n\t<li>The<strong> constituent assembly was set up on 6th December 1946.</strong></li>\r\n\t<li>The Union Constituent Assembly appointed a number of committees to deal with different tasks of constitution-making.</li>\r\n\t<li>Out of these, eight were major committees and the others were minor committees. </li>\r\n\t<li>The names of the major committees and their chairmen are:\r\n\t<ul>\r\n\t\t<li><strong>Union Powers </strong>Committee<strong> &ndash; Jawaharlal Nehru</strong></li>\r\n\t\t<li>Union Constitution Committee &ndash; Jawaharlal Nehru</li>\r\n\t\t<li>Provincial Constitution Committee &ndash; Sardar Patel</li>\r\n\t\t<li><strong>Drafting</strong> Committee &ndash; <strong>Dr B.R. Ambedkar</strong></li>\r\n\t\t<li>Advisory Committee on <strong>Fundamental Rights</strong>, Minorities and Tribal and Excluded Areas &ndash; <strong>Sardar Patel</strong></li>\r\n\t\t<li>Rules of Procedure Committee &ndash; Dr Rajendra Prasad</li>\r\n\t\t<li>States Committee (Committee for Negotiating with States) &ndash; Jawaharlal Nehru</li>\r\n\t\t<li><strong>Steering</strong> Committee &ndash; <strong>Dr Rajendra Prasad </strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Note - This question was asked in RPSC RAS Prelims 27 Oct 2021</strong>.</p>\r\n\r\n<p><u>The answer is deleted as per the official key</u>.</p>\r\n\r\n<p>We have corrected the Question.</p>\r\n\r\n<ul>\r\n\t<li>Steering Committee &ndash; Dr Rajendra Prasad</li>\r\n\t<li>Order of Business Committee &ndash; Dr K.M. Munshi</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 86, "question": "\r\n<p>Between whom did the Palk Water Treaty take place?</p>", "option1": "\r\n<p>Sri Lanka and Maldives</p>", "option2": "\r\n<p>India and Pakistan</p>", "option3": "\r\n<p>India and China</p>", "option4": "\r\n<p>India and Sri Lanka</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>India and Sri Lanka.</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>The first agreement was regarding the maritime boundary in waters between Adam&#39;s Bridge and the Palk Strait</strong> which came into force on July 8, 1974. The second agreement, which was signed on March 23 and entered into force on May 10, 1976, defined the maritime boundaries in the Gulf of Mannar and the Bay of Bengal.</li>\r\n\t<li><strong>Palk Strait is</strong> a narrow passageway of water between <strong>India (Tamil Nadu) and the island nation of Sri Lanka</strong> (Mannar district).</li>\r\n\t<li><strong>The Government of the Republic of India and the Republic of Sri Lanka </strong>signed <strong>an agreement on March 23, 1976</strong>, establishing maritime boundaries in the Gulf of Manaar and the Bay of Bengal.</li>\r\n\t<li><strong>Sri Lanka</strong>, formerly known as Ceylon and officially the Democratic Socialist Republic of Sri Lanka, is an island country in South Asia. <strong>It lies in the Indian Ocean, southwest of the Bay of Bengal, and southeast of the Arabian Sea; it is separated from the Ind</strong>ian subcontinent by the Gulf of Mannar and the Palk Strait.</li>\r\n\t<li><strong>China, officially the People&#39;s Republic of China, is a country in East Asia.</strong> It is the second world&#39;s most populous country, with a population exceeding 1.4 billion.</li>\r\n\t<li><strong>Maldives, officially the Republic of Maldives, is an archipelagic state located in South Asia</strong>, situated in the Indian Ocean. It lies southwest of Sri Lanka and India, about 750 kilometers from the Asian continent&#39;s mainland.</li>\r\n</ul>\r\n\r\n<p>Thus, Pak Water Treaty takes place between<strong> India and Sri Lanka.</strong></p>", "question_heading": ""}, {"sr_no": 87, "question": "\r\n<p>Select the most appropriate antonym of the underlined word.</p>\r\n\r\n<p>The political situation was now relatively <u>quiescent </u>.</p>", "option1": "\r\n<p>Restless</p>", "option2": "\r\n<p>Exempt</p>", "option3": "\r\n<p>Malignant</p>", "option4": "\r\n<p>Mendicant</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct is answer - <strong>&quot;Restless&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Quiescent </strong>means in a state or period of inactivity or dormancy (मौन, स्थिर, निष्क्रिय, सुप्त)\r\n\r\n\t<ul>\r\n\t\t<li>Eg.  It has been quiescent since 1566, and is now completely extinct.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><em><u><strong>Restless </strong></u></em>means unable to rest or relax as a result of anxiety or boredom (चिंता या बोरियत के परिणामस्वरूप आराम या आराम करने में असमर्थ)\r\n\t<ul>\r\n\t\t<li>Eg. The children always get restless on long journeys</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the given options, <strong>Restless is the appropriate ANTONYM of &quot;Quiescent&quot;</strong></li>\r\n\t<li>Thus, <strong>Option 1 </strong>is the correct answer.</li>\r\n\t<li>Mendicant means a beggar.</li>\r\n\t<li>Malignant means likely to cause death if not controlled</li>\r\n\t<li>Exempt means free from an obligation or liability imposed on others.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 88, "question": "\r\n<p>Which of the following sentences is/are grammatically correct among the three given below?</p>\r\n\r\n<p>A. Sooner had Amrita come from work than her friends organized a get-together.</p>\r\n\r\n<p>B. Each day, the journey from college to his home takes him an hour.</p>\r\n\r\n<p>C. After disposing of the stolen items, the thief was found.</p>", "option1": "\r\n<p>Only A and B</p>", "option2": "\r\n<p>Only A and C</p>", "option3": "\r\n<p>None of these</p>", "option4": "\r\n<p>Only B and C</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: Only B and C</p>\r\n\r\n<ul>\r\n\t<li>Statement A:\r\n\t<ul>\r\n\t\t<li>This sentence is structurally wrong.</li>\r\n\t\t<li>If the second event occurs immediately after the first, we can express that idea using the structure &quot;no sooner &hellip; than.&quot;</li>\r\n\t\t<li>It is often used with the past perfect and usually followed by &#39;than&#39;.</li>\r\n\t\t<li>&ldquo;No sooner&hellip; than&rdquo; is correlative conjunction. These types of conjunctions work in pairs and relate one sentence to another.</li>\r\n\t\t<li>Therefore, statement A is grammatically incorrect.</li>\r\n\t\t<li>The correct sentence should be: <em>No sooner had Amrita come from work than her friends organized a get-together.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Statement B:\r\n\t<ul>\r\n\t\t<li>We use &quot;verb+s&quot; to refer to a third-person singular subject.</li>\r\n\t\t<li>&quot;His&quot; refers to the third-person singular subject and for that reason the singular verb &quot;takes&quot; is used.</li>\r\n\t\t<li>We know that subjects and verbs must agree with one another in number (singular or plural).</li>\r\n\t\t<li>The preposition &#39;from&#39; is used to describe the transport route.</li>\r\n\t\t<li>Therefore, statement B is grammatically correct.</li>\r\n\t</ul>\r\n\tStatement C:\r\n\r\n\t<ul>\r\n\t\t<li>The preposition &#39;of&#39; is always used after &#39;dispose&#39;.</li>\r\n\t\t<li>&quot;Dispose of&quot; means to get rid of something or deal with something so that the matter is finished.</li>\r\n\t\t<li>The sentence tells that the burglar was caught after getting rid of the stolen goods.</li>\r\n\t\t<li>Therefore, statement C is grammatically correct.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is: <em>Option 1, Only B and C</em></p>", "question_heading": ""}, {"sr_no": 89, "question": "\r\n<p>Directions: Read each part of the sentence to find out whether there is any error in any part. Indicate your response in the Answer Sheet against the corresponding letter, i.e., (a) or (b) or (c). If you find &#39;no error&#39;, your response should be indicated as (d).</p>\r\n\r\n<p>The opportunity to participation in fair and free elections(A)/ and hold public office(B)/ should be viewed as a fundamental right of every citizen.(C)/ No error(D)</p>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>D</p>", "option3": "\r\n<p>B</p>", "option4": "\r\n<p>C</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>A</strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>The error lies in <strong>part &#39;A</strong>&#39; of the <strong>sentence</strong> because &#39;<strong>participation</strong>&#39; is used instead of &#39;<strong>participate</strong>&#39;.</li>\r\n\t<li>The <strong>sentence</strong> is talking about the opportunity to participate in fair and free elections, which is an action and not a state of being.</li>\r\n\t<li>Therefore the <strong>verb &#39;participate</strong>&#39; should be used instead of <strong>noun</strong> &#39;<strong>participation</strong>&#39;, which means &quot;<strong>take part in an action or endeavour</strong>&quot;</li>\r\n</ul>\r\n\r\n<p>Thus, <em><strong>option 1</strong></em> is the correct answer.</p>\r\n\r\n<p><u><strong>Correct Sentence</strong></u>: <em><strong>The opportunity to participate in fair and free elections </strong>and hold public office should be viewed as a fundamental right of every citizen.</em></p>", "question_heading": ""}, {"sr_no": 90, "question": "\r\n<p><strong>Select the correct indirect form of the given sentence.</strong></p>\r\n\r\n<p>The surgeon says, &ldquo;You should get anaesthesia for the surgery.&rdquo;</p>", "option1": "\r\n<p>The surgeon says you should get anaesthesia for the surgery.</p>", "option2": "\r\n<p>The surgeon said that I shall get anaesthesia for the surgery.</p>", "option3": "\r\n<p>The surgeon says that I should have got anaesthesia for the surgery.</p>", "option4": "\r\n<p>The surgeon says that I should get anaesthesia for the surgery.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct indirect form of the given sentence is: <strong>The surgeon says that I should get anaesthesia for the surgery.</strong></p>\r\n\r\n<ul>\r\n\t<li>In indirect speech, the reporting verb<strong> (says) </strong>is followed by the conjunction <strong>&#39;that&#39; </strong>and the sentence is changed from direct to indirect form.</li>\r\n\t<li>The pronoun <strong>&#39;you&#39;</strong> is changed to <strong>&#39;I&#39;</strong> as the sentence is being reported by someone else.</li>\r\n\t<li>The modal verb &#39;<strong>should</strong>&#39; remains the same as it indicates a suggestion.</li>\r\n\t<li><strong>There will no change in tense as the reported verb is in present tense &#39;says&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 4.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Indirect form</strong></u>:<em> The surgeon says that I should get anaesthesia for the surgery.</em></p>", "question_heading": ""}, {"sr_no": 91, "question": "\r\n<p>Select the option that expresses the given sentence in reported speech.</p>\r\n\r\n<p>&ldquo;Vidushi, the doctor has advised me to avoid sugar,&rdquo; said Prabha.</p>", "option1": "\r\n<p>Prabha told Vidushi that the doctor had advised her to avoid sugar.</p>", "option2": "\r\n<p>Prabha said to Vidushi that the doctor was advising her to avoid sugar.</p>", "option3": "\r\n<p>Prabha told Vidushi that the doctor advised her to avoid sugar.</p>", "option4": "\r\n<p>Prabha told Vidushi that the doctor will be advising her to avoid sugar.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 1) i.e. &lsquo;</strong><strong>Prabha told Vidushi that the doctor had advised her to avoid sugar. &rsquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in <strong>Direct Speech </strong>.</li>\r\n\t<li>As per the given question we have to change it into <strong>Indirect Speech.</strong></li>\r\n\t<li>The process of this transformation is as follows:\r\n\t<ul>\r\n\t\t<li>The conjunction <strong>&#39;that&#39; will be added </strong>and <strong>comma and inverted commas will be removed.</strong></li>\r\n\t\t<li>In the Indirect speech <strong>&#39;said&#39; will be changed into &lsquo;told&rsquo; </strong>because reporting verb has an object, &lsquo;Vidushi&rsquo;.</li>\r\n\t\t<li><strong>&#39;me&#39; </strong>will be changed into <strong>&#39;her&#39;.</strong></li>\r\n\t\t<li>Here, <strong>&lsquo;has advised&rsquo; is in the present perfect tense </strong>and <strong>will be changed into past perfect i.e., &lsquo;</strong><strong>had advised &rsquo;.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>So, according to the above steps, thecorrect answer is<strong>option 1.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Sentence:</strong></u><em>Prabha told Vidushi that the doctor had advised her to avoid sugar.</em></p>", "question_heading": ""}, {"sr_no": 92, "question": "\r\n<p>Pandit Jasraj is famous in the field of?</p>", "option1": "\r\n<p>Classical Music</p>", "option2": "\r\n<p>Folk Songs</p>", "option3": "\r\n<p>Folk Dance</p>", "option4": "\r\n<p>Poetry</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Classical Music.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Pandit Jasraj is famous in the field of Classical Music.</strong></li>\r\n\t<li><strong>Pandit Jasraj:</strong>\r\n\t<ul>\r\n\t\t<li><strong>He was an Indian classical singer related to Mewati Gharana.</strong></li>\r\n\t\t<li><strong>His musical career extended 75 years resulting in national and international prominence, respect, and numerous awards and accolades.</strong></li>\r\n\t\t<li><strong>Pandit Jasraj (28 January 1930 - 17 August 2020)</strong> was an Indian classical vocalist, belonging to the Mewati Gharana (musical apprenticeship lineage).</li>\r\n\t\t<li>His musical career spanned 75 years resulting in national and international fame, respect, and numerous major awards and accolades.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Awards and honors:</strong>\r\n\t<ul>\r\n\t\t<li><strong>Padma Shri (1975).</strong></li>\r\n\t\t<li><strong>Sangeet Natak Akademi Award (1987).</strong></li>\r\n\t\t<li><strong>Padma Bhushan (1990).</strong></li>\r\n\t\t<li><strong>Padma Vibhushan (2000).</strong></li>\r\n\t\t<li><strong>Swathi Sangeetha Puraskaram (2008).</strong></li>\r\n\t\t<li><strong>Sangeet Natak Akademi Fellowship (2010)</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong> Important personalities from Haryana:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Dayachand Mayna </strong>was a songwriter, poet, singer who wrote many raagni, songs, Saang, Kissas, he was from Mayna (Rohtak)</li>\r\n\t<li><strong>Baje Bhagat</strong> was a songwriter, poet, singer who wrote many ragni, songs, he was from sisana village, sonipat.</li>\r\n\t<li><strong>Gajendra Verma</strong> is a Sirsa-born composer and playback singer</li>\r\n\t<li><strong>Ghulam Farid Sabri Qawwal,</strong> a leading member of the Sabri Brothers/Qawwali Group. He was born in 1930 Kalyana, Rohtak, Haryana/East Punjab. </li>\r\n\t<li><strong>Pandit Jasraj </strong>is a Hisar born classical singer of Mewati gharana style</li>\r\n\t<li><strong>Pandit Lakhmi Chand,</strong> Surya Kavi Of Haryana</li>\r\n\t<li><strong>Sonu Nigam</strong>, born in Faridabad. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n<p>Direction:Change the Voice -</p>\r\n\r\n<p>The crown was being laughed at by them.</p>", "option1": "\r\n<p>They are laughing at the crown.</p>", "option2": "\r\n<p>Them were laughing at the crown.</p>", "option3": "\r\n<p>They were laughing at the crown.</p>", "option4": "\r\n<p>They were being laughing at the crown.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>They were laughing at the crown .&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in  Past  Continuous Tense  and in  Passive Voice.</li>\r\n\t<li>The rule for changing a  Past  Continuous Tense  from Active voice to Passive voice or Passive to Active Voice:\r\n\t<ul>\r\n\t\t<li>Interchange the object and subject with each other, i.e. object of the active sentence become the subject of the passive sentence.</li>\r\n\t\t<li>Structure: Subject + was/were + V1 + ing + Object  <u>(Active Voice)</u></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>                                       Object + was/were + being + V3 + by Subject   <u>(Passive Voice)</u></p>\r\n\r\n<ul>\r\n\t<li>Example: <em>Esha was singing a song.  </em>(Active Voice)</li>\r\n</ul>\r\n\r\n<p><em>A song was being sung by Esha. </em>(Passive Voice)</p>\r\n\r\n<ul>\r\n\t<li>Therefore, the correct answer is  &#39; They were laughing at the crown.&#39;</li>\r\n\t<li>In  Active Voice , a sentence emphasizes the subject performing an action.</li>\r\n\t<li>In  Passive Voice,  the sentence emphasizes the action or the object of the sentence.\r\n\t<ul>\r\n\t\t<li>Example: <em>He reads a novel. </em>(Active Voice)<br />\r\n\t\t<em> A novel is read by him. </em>(Passive Voice)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>दिया गया वाक्य  Past  Continuous Tense  और <strong>Passive Voice </strong> में है।</li>\r\n\t<li>Past  Continuous Tense  को Active voice से Passive voice या Passive voice से Active voice में बदलने का नियम:\r\n\t<ul>\r\n\t\t<li>Object और Subject को एक दूसरे के साथ बदलें, यानी Active Voice का object, Passive Voice का subject बन जाती है।</li>\r\n\t\t<li><u>संरचना</u>:Subject + was/were + V1+ ing + Object  <u>(Active Voice)</u><br />\r\n\t\t             Object + was/were + being + V3 + by Subject  <u>(Passive Voice)</u></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": "\r\n<p>Who among the following was the commander of Muhammad Ghori, and also founded the slave dynasty in India?</p>", "option1": "\r\n<p>Iltutmish</p>", "option2": "\r\n<p>Ghiyasud din Balban</p>", "option3": "\r\n<p>Aram Shah II</p>", "option4": "\r\n<p>Qutub-Din Aibak</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Qutub-Din Aibak</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Qutb ud-din is another name for Qutb-ud-din Aibak.</li>\r\n\t<li>He was the founder of the <strong>Slave dynasty </strong>.</li>\r\n\t<li>He was also known as <strong>Lakh Baksh </strong>because of his generosity.</li>\r\n\t<li>He served as a <strong>commander in Muhammad Ghori&#39;s army </strong>.</li>\r\n\t<li>He died in the year 1210 AD while <strong>playing Chaugan or Polo </strong>.</li>\r\n\t<li>He served as the Slave dynasty&#39;s first emperor.</li>\r\n\t<li>Another name for the Slave dynasty is the <strong>Mamluk dynasty </strong>.</li>\r\n\t<li>Dynasty was succeeded by the Khilji (or Khalji) dynasty.</li>\r\n\t<li>Iltutmish (Reign: 1211 &ndash; 1236):\r\n\t<ul>\r\n\t\t<li>Aram Shah was a weak ruler. He was conspired against by a group of nobles who invited Shamsuddin Iltutmish to be the ruler.</li>\r\n\t\t<li>Iltutmish was a  <strong>son-in-law of Aibak.</strong></li>\r\n\t\t<li>He ruled the Ghurid regions of northern India.</li>\r\n\t\t<li>He was a <strong>Turkic slave born in Central Asia </strong>.</li>\r\n\t\t<li>Iltutmish was the <strong>greatest of the slave rulers  </strong>of Delhi.</li>\r\n\t\t<li>He shifted his capital from  <strong>Lahore to Delhi </strong>.</li>\r\n\t\t<li>He died in <strong>1236 </strong> and was succeeded by his daughter <strong>Razia Sultana </strong> as he did not consider his sons equal to the task.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Balban:\r\n\t<ul>\r\n\t\t<li>He ruled from  1266 AD-1287 AD.</li>\r\n\t\t<li>He was a member of  Chahalgani Chalisa.</li>\r\n\t\t<li>He  broke the power of Chahalgani  and restored the prestige of the crown.</li>\r\n\t\t<li>He created a strong centralized army and established the military department <em>Diwan-i-Arz.</em></li>\r\n\t\t<li>He took up the title of <em>Zil-i-Ilahi</em> (a shadow of God) and impressed upon the people that the king was the deputy of God (<em>Niyabat-i-Khudai</em>).</li>\r\n\t\t<li>He insisted on the Iranian ceremonies of <em>sijda and paibos.</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 95, "question": "\r\n<p><strong>Directions: In the following question, out of the four alternatives, select the alternative which best expresses the meaning of the idiom/phrase.</strong></p>\r\n\r\n<p>Arjun <u>bid defiance</u> when the teacher told him to memorize the poem.</p>", "option1": "\r\n<p>to follow the instructions</p>", "option2": "\r\n<p>to get encouraged</p>", "option3": "\r\n<p>to ignore something</p>", "option4": "\r\n<p>to get discouraged</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 3) i.e. &ldquo;to ignore something.&rdquo;</strong></p>\r\n\r\n<ul>\r\n</ul>\r\n\r\n<p><strong>Let&rsquo;s look at the meaning of the given idiom/ phrase:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>The phrase<strong> &lsquo;</strong><strong>bid defiance&rsquo; means to ignore or to resist.</strong></strong></li>\r\n\t<li><strong>Example: <em>Neha <strong>bade defiance</strong> when her father told her to pursue engineering.</em></strong></li>\r\n</ul>\r\n\r\n<ul>\r\n\t<li>Hence, the only possible answer is option 3 <strong>&lsquo;</strong><strong>to ignore something</strong><strong>&rsquo;</strong>, which exactly matches the meaning of the given idiom/ phrase.</li>\r\n</ul>\r\n\r\n<p><u><strong>Correct meaning:</strong></u><em>to ignore something.</em></p>", "question_heading": ""}, {"sr_no": 96, "question": "\r\n<p>Match list-I with list-II and select the correct answer using the code given below:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>List-I (Diseases)</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>List &ndash;II (Factors)</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(A)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Peptic ulcers</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>1.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Virus</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(B)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Dengue</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>2.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Protozoa</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(C)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Elephant Foot</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>3.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Worm</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(D)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Malaria</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>4.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>Bacteria</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "option1": "\r\n<p>A - 4, B - 2, C - 3, D - 1</p>", "option2": "\r\n<p>A - 3, B - 4, C - 2, D - 1</p>", "option3": "\r\n<p>A - 4, B - 1, C - 3, D - 2</p>", "option4": "\r\n<p>A - 2, B - 3, C - 4, D - 1</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>A - 4, B - 1, C - 3, D - 2</strong></u>.</p>\r\n\r\n<p><strong>Peptic ulcer</strong></p>\r\n\r\n<ul>\r\n\t<li>A peptic ulcer is a<strong> lesion formed</strong> on the lining of the<strong> stomach,  oesophagus, or small intestine</strong>.</li>\r\n\t<li>The most common causes include the <strong>bacteria Helicobacter pylori </strong>and the use of<strong> nonsteroidal anti-inflammatory drugs</strong>. </li>\r\n\t<li><strong>Helicobacter pylori is a bacteria </strong>that can enter the body and <strong>can live in the digestive tract for many years.</strong></li>\r\n\t<li>Soon or after many years they can <strong>cause sores known as ulcers</strong>.</li>\r\n\t<li>Most <strong>commonly it happens due</strong> to the damage of this lining by the <strong>stomach acids</strong>.</li>\r\n\t<li>Its helical shape is thought to have evolved in order to penetrate the mucoid lining of the stomach and thereby establish infection.</li>\r\n\t<li>It is also called a <strong>gastric ulcer</strong>. The most common symptom of this <strong>ulcer is pain in the abdomen and this pain worsens</strong> while eating.</li>\r\n\t<li>It is accompanied by <strong>vomiting, weight loss, or poor appetite</strong>.</li>\r\n</ul>\r\n\r\n<p><strong>Dengue</strong></p>\r\n\r\n<ul>\r\n\t<li>Dengue is a <strong>viral disease</strong> and is carried by <strong>mosquito</strong> vectors</li>\r\n\t<li>It is a highly infectious disease and spreads very fast</li>\r\n\t<li>The mosquito responsible for carrying these disease is <strong><em>Aedes aegypti(</em>female)</strong></li>\r\n\t<li><strong><em>Anopheles(</em>female)</strong> is the carrier of <strong>malaria</strong>, which is a bacterial disease</li>\r\n\t<li><strong><em>Culex </em></strong>is the common <strong>house mosquito</strong> and is known to carry diseases like<strong> Encephalitis.</strong></li>\r\n</ul>\r\n\r\n<p><strong>Elephant foot (Elephantiasis)</strong>:-</p>\r\n\r\n<ul>\r\n\t<li>It is a<strong> parasitic worm infection</strong> that can spread from person to person through mosquitoes.</li>\r\n\t<li>It is characterized by swelling legs. Elephantiasis is also known as lymphatic filariasis.</li>\r\n</ul>\r\n\r\n<p><strong>Malaria</strong></p>\r\n\r\n<ul>\r\n\t<li>It is a disease caused by Plasmodium, a tiny Protozoan responsible for this disease.</li>\r\n\t<li>Malaria is an infectious disease spread by mosquitos that affect humans.</li>\r\n\t<li>It is characterized by symptoms such as fever, exhaustion, vomiting, and headaches.</li>\r\n\t<li>Different species of Plasmodium (<em>P. vivax, P. malaria, and P. falciparum</em>) are responsible for different types of malaria.</li>\r\n\t<li>Of these, malignant malaria caused by <em>Plasmodium falciparum</em> is the most serious one and can even be fatal.</li>\r\n\t<li>The <strong>most serious and fatal form of malaria</strong> is caused by <em><strong>Plasmodium falciparum</strong></em>.</li>\r\n\t<li>The <strong>vector of Plasmodium</strong> is the<strong> female <em>Anopheles </em>mosquito</strong> which transfers the sporozoites (infectious form).</li>\r\n\t<li><strong>Plasmodium</strong><strong>requires two hosts </strong>to complete its life cycle- <strong>human </strong>and <strong>mosquito</strong>.</li>\r\n\t<li>The infected female <em>Anopheles </em>mosquito transfers the infectious form of Plasmodium, i.e., sporozites to the human body by biting.</li>\r\n\t<li>Antimalarial drugs such as quinine and chloroquine are used to treat the disease.</li>\r\n\t<li>Malaria can be prevented by killing mosquitoes by spraying DDT (Dichlorodiphenyltrichloroethane), BHC (benzene hexachloride), etc, and using insect repellents, mosquito nets, etc.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n<p>On which river, the first night navigation mobile application in rivers in India was launched for ferries?</p>", "option1": "\r\n<p>Son</p>", "option2": "\r\n<p>Brahmaputra</p>", "option3": "\r\n<p>Ganga</p>", "option4": "\r\n<p>Kaveri</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Brahmaputra.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Brahmaputra</strong>\r\n\r\n\t<ul>\r\n\t\t<li>The <strong>Brahmaputra </strong>is a<strong> trans-boundary</strong> river that passes through <strong>Tibet</strong>, <strong>Bangladesh</strong>, and <strong>Northeastern India</strong>.</li>\r\n\t\t<li>Other names for it include <strong>Luit </strong>in <strong>Assamese</strong>, the <strong>Yarlung Tsangpo</strong> in <strong>Tibetan</strong>, the <strong>Siang/Dihang River</strong> in <strong>Arunachali</strong>, and the<strong> Jamuna Rive</strong>r in <strong>Bangla</strong>.</li>\r\n\t\t<li>It is the <strong>15th </strong>longest river in the world and the <strong>9th </strong>largest by discharge.</li>\r\n\t\t<li>The<strong> Yarlung Tsangpo River</strong> has its source in the<strong> Manasarovar Lak</strong>e region, close to <strong>Mount Kailash</strong>, in <strong>Burang County</strong>, <strong>Tibet</strong>, on the <strong>northern </strong>face of the <strong>Himalayas</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The <strong>river </strong>travels through southern Tibet before <strong>plunging </strong>into the <strong>Mountains </strong>in the <strong>Yarlung Tsangpo</strong> Great <strong>Canyon </strong>and entering <strong>Arunachal Pradesh</strong>.</li>\r\n\t<li>It enters <strong>India</strong> close to the<strong> Arunachal Pradesh</strong> settlement of Gelling and travels through <strong>Bangladesh </strong>as the <strong>Jamuna</strong> before flowing southwest through the<strong> Assam Valley</strong> (not to be confused with the <strong>Yamuna </strong>of India).</li>\r\n\t<li>It combines with the <strong>Ganges</strong>, also known as the <strong>Padma</strong> in <strong>Bangladesh</strong>, in the enormous <strong>Ganges Delta</strong>, where it then becomes the <strong>Meghna</strong> and eventually empties into the <strong>Bay of Bengal</strong>.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 98, "question": "\r\n<p>In Bhimbetka rock paintings which of the subject matter is <strong>not </strong>depicted</p>", "option1": "\r\n<p>Hunting of birds</p>", "option2": "\r\n<p>Hunting of animals</p>", "option3": "\r\n<p>Perching birds that live on grain</p>", "option4": "\r\n<p>Hunting of birds and animal both</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p>The correct answer is <u><strong>Perching birds that live on grain.</strong></u><strong><u>Bhimbetka rock paintings</u></strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Archaeological site </strong>: Bhimbetka rock shelters are an archaeological site located in central India, in the Raisen District of Madhya Pradesh.</li>\r\n\t<li>\r\n\t<p><strong>Historical significance: </strong>The site spans the Paleolithic, Mesolithic, and historic periods, and is considered to be one of the oldest examples of human life in India.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Evidence of Stone Age: </strong>The site provides evidence of the Stone Age, starting from the Acheulian period.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>UNESCO World Heritage Site </strong>: Bhimbetka was declared a UNESCO World Heritage Site in 2003.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Large complex </strong>: The site consists of seven hills and over 750 rock shelters spread over 10 km, and is one of the largest prehistoric complexes.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Inhabited for over 100,000 years </strong>: At least some of the shelters were inhabited more than 100,000 years ago.</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Cave paintings </strong>: Some of the rock shelters feature prehistoric cave paintings, with the earliest estimated to be about 10,000 years old (c. 8,000 BCE).</p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>Depiction of prehistoric life </strong>: The cave paintings depict <strong>themes such as animals, dance, hunting of birds and animals, and warriors on horseback, providing a rare glimpse into human settlement and cultural evolution </strong>from hunter-gatherers to agriculture and prehistoric spirituality.</p>\r\n\t</li>\r\n\t<li><strong>Oldest-known rock art in India </strong>: Bhimbetka is also home to the oldest-known rock art in India.</li>\r\n</ul>\r\n\r\n<p><strong>Hence the correct answer is Perching birds that live on grain.</strong></p>", "question_heading": ""}, {"sr_no": 99, "question": "\r\n<p>Name the first female Olympic medal winner from India.</p>", "option1": "\r\n<p>PV Sindhu </p>", "option2": "\r\n<p>Saina Nehwal</p>", "option3": "\r\n<p>Mary Kom</p>", "option4": "\r\n<p>Karnam Malleswari</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Karnam Malleswari</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><u><strong>Karnam Malleswari was the first Indian woman to win an Olympic medal</strong></u>.\r\n\r\n\t<ul>\r\n\t\t<li>Karnam Malleswari is a former female weightlifter from India.</li>\r\n\t\t<li>She was born on 1st June 1975 and belongs to <strong>Andhra Pradesh </strong>.</li>\r\n\t\t<li>Her first achievement was in the Weightlifting Nationals (Senior) held at Ambala in 1991, where she won a silver medal.</li>\r\n\t\t<li>In the <strong>Sydney Olympics, 2000, she won a bronze medal in weightlifting in the 69 kg category.</strong></li>\r\n\t\t<li>She won the gold medal in the 1994 Asian Games held in Hiroshima.</li>\r\n\t\t<li>She also won gold medals in the 1994 and 1995 World Championships.</li>\r\n\t\t<li>She has been awarded the <strong>Arjuna Award (1994), the Rajiv Khel Ratna Award (1999) and the Padma Shri (1999) </strong>.</li>\r\n\t\t<li>She is also known as the &#39;Iron Lady of Andhra Pradesh&#39;.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Saina Nehwal</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>Indian professional badminton player.</li>\r\n\t\t\t\t<li>First Indian female and the youngest Asian to win a 4-star tournament.</li>\r\n\t\t\t\t<li>Honoured with the Rajiv Gandhi Khel Ratna in 2009-2010.</li>\r\n\t\t\t\t<li>Autobiography:  <strong>Playing to Win: My Life On and Off Court </strong>.</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Mary Kom</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>Indian amateur boxer.</li>\r\n\t\t\t\t<li>Only female to become World Amateur Boxing champion for a record six times.</li>\r\n\t\t\t\t<li>Incumbent Member of Parliament, Rajya Sabha.</li>\r\n\t\t\t\t<li>Autobiography:  <strong>Unbreakable </strong>.</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>P.V. Sindhu</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>Indian professional badminton player.</li>\r\n\t\t\t\t<li>First Indian to become the Badminton World Champion.</li>\r\n\t\t\t\t<li>First Indian woman to earn an Olympic Silver medal.</li>\r\n\t\t\t\t<li>Honoured with the Rajiv Gandhi Khel Ratna in 2016.</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 100, "question": "\r\n<p><strong>Direction: In the following question a sentence or a phrase is given which can be substituted by one word. Choose the most appropriate word explaining the sentence or the phrase from the given option.</strong></p>\r\n\r\n<p>The process of compulsory enlistment for military service is called ____________</p>", "option1": "\r\n<p>Recruitment</p>", "option2": "\r\n<p>Conscription</p>", "option3": "\r\n<p>Pantheism</p>", "option4": "\r\n<p>Sinecure</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is- &#39;Conscription&#39; </p>\r\n\r\n<ul>\r\n\t<li>Let us see the meanings of the given options:\r\n\t<ul>\r\n\t\t<li><strong>Recruitment:  </strong>the process of actively seeking out, finding and hiring candidates for a specific position or job. (भरती)</li>\r\n\t\t<li><strong>Conscription:  </strong>the system of making somebody join the army, etc. (अनिवार्य सैन्&zwj;य भरती)</li>\r\n\t\t<li><strong>Pantheism:  </strong>the belief that God exists in all natural things. (समस्त प्रकृति में ईश्वर के अस्तित्व का विश्वास; सर्वेश्वरवाद)</li>\r\n\t\t<li><strong>Sinecure:  </strong>a position requiring little or no work but giving the holder status or financial benefit. (ऐसी स्थिति जिसमें बहुत कम या कोई काम नहीं होता है लेकिन धारक का दर्जा या वित्तीय लाभ देता है)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, The process of compulsory enlistment for military service is called<strong>Conscription</strong>.</li>\r\n\t<li>Let us see the meanings of other words:\r\n\t<ul>\r\n\t\t<li>Cardiology: Cardio  - root means heart and - logy  - suffix means the study of. It means the study of the heart and its functions in health and disease. (कार्डी - जड़ का अर्थ है हृदय, - ology  - suffix  का अर्थ है अध्ययन करना। इसका मतलब हैं हृदयरोग विज्ञान)</li>\r\n\t\t<li>Osteology:  The word  &#39;Osteology&#39;  is derived from the from Greek ὀ&sigma;&tau;έ&omicron;&nu; (ost&eacute;on)  &#39;bones &#39;and  -ology - suffix  means the study of. It means the study of the structure and function of the skeleton and bony structures. ( &#39;Osteology&#39;  शब्द ग्रीक ὀ&sigma;&tau;έ&omicron;&nu; (ओस्टियन) &#39;हड्डियों&#39; से लिया गया है और  - ology  - suffix  का अर्थ है अध्ययन। इसका मतलब है कंकाल और हड्डी संरचनाओं की संरचना और कार्य का अध्ययन)</li>\r\n\t\t<li>Gastroenterology:  The word  &#39;Gastroenterology&#39;  is derived from the Greek  gastḗr , meaning  &ldquo;stomach&rdquo; or &ldquo;belly&rdquo;  and  -ology - suffix  means the study of. It means the branch of medicine that deals with disorders of the stomach and intestines. (शब्द   &#39;Gastroenterology&#39;  ग्रीक गैस्टर से लिया गया है, जिसका अर्थ है &quot;पेट&quot; या &quot;पेट&quot; और  -ology - suffix  का अर्थ है अध्ययन। इसका मतलब है औषधि की वह शाखा जो पेट और आंतों के विकारों से संबंधित है)</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 101, "question": "\r\n\r\n<p>Direction: Find the correct sequence for the given fill-up</p>\r\n\r\n<p>There were once a _________________________ to grant her desire.<br />\r\nP. had long in vain wished for a child.<br />\r\nQ. At length, the woman hoped<br />\r\nR. man and a woman who<br />\r\nS. that God was about</p>", "option1": "\r\n\r\n<p>PQRS</p>", "option2": "\r\n\r\n<p>RPQS</p>", "option3": "\r\n\r\n<p>SRQP</p>", "option4": "\r\n\r\n<p>RPSQ</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- <strong>&#39;RPQS&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>While arranging the parts of the passage given in options, we have to  <u>find some grammatical or contextual connections between them </u>, so let&rsquo;s find out.  \r\n\r\n\t<ul>\r\n\t\t<li>The opener will be <strong>R  </strong>as it is completing the first part of the previous sentence.</li>\r\n\t\t<li>After this, P will come because  RP  is connected with the help of  &#39;who.&#39;</li>\r\n\t\t<li>After this, Qwill come as it is introducing the first part of the last sentence.</li>\r\n\t\t<li>S follows Q  as it is completing the last sentence.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The c <u>orrect sequence </u>:</li>\r\n</ul>\r\n\r\n<p>R. man and a woman who</p>\r\n\r\n<p>P. had long in vain wished for a child.</p>\r\n\r\n<p>Q. At length, the woman hoped</p>\r\n\r\n<p>S. that God was about</p>\r\n\r\n<ul>\r\n\t<li>Steps for solving Para Jumbles:\r\n\t<ul>\r\n\t\t<li>Clues include pronouns, like he, she, it, this, that, these, those; adverbs like formally, really; article a, an and the; definers like actually, finally, another; connectors like but, yet, both, also and neither nor, or, however, nevertheless.</li>\r\n\t\t<li>Now, with the help of clues, try to find out qualifier and qualified sentences, so that we can make pairs of qualified and qualifier sentences to eliminate the wrong choices given in the question.</li>\r\n\t\t<li>After making pairs, start eliminating the wrong choices or options given in the question.</li>\r\n\t\t<li>In case there is more than one choice, try to follow the sequence of sentences according to the occurrence of the events.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>विकल्पों में दिए गए गद्यांश के भागों को व्यवस्थित करते समय, हमें उनके बीच कुछ व्याकरणिक या प्रासंगिक संबंध खोजने होंगे, तो आइए जानें।\r\n\t<ul>\r\n\t\t<li>Opener R होगा क्योंकि यह पिछले वाक्य के पहले भाग को पूरा कर रहा है।</li>\r\n\t\t<li>इसके बाद P आएगा क्योंकि RP &#39;कौन&#39; की मदद से जुड़ा है।</li>\r\n\t\t<li>इसके बाद, <strong>Q</strong>आएगा क्योंकि यह अंतिम वाक्य के पहले भाग का परिचय दे रहा है ।</li>\r\n\t\t<li>S, Q का अनुसरण करता है क्योंकि यह अंतिम वाक्य को पूरा कर रहा है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 102, "question": "\r\n<p><strong>Choose the best replacement for the underlined part of the sentence.</strong></p>\r\n\r\n<p>&#39;Waiter, there&#39;s a fly in my soup. Please <u>take</u> it <u>up</u>.&#39;</p>", "option1": "\r\n<p>take... away</p>", "option2": "\r\n<p>get... away</p>", "option3": "\r\n<p>take... down</p>", "option4": "\r\n<p>put... off</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<u><strong>take... away</strong></u>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>In the above sentence, a request is made by the speaker <em>to remove </em> the soup.</li>\r\n\t<li>&#39;<em><strong>take up</strong></em>&#39; has two meanings</li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li><u><em>become interested or engaged in a pursuit/work</em></u>.\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>Maria Sharapova <strong>took up</strong> tennis at the age of 6</em>.&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><em>occupy something like space, time, or attention.</em></u>\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>I won&#39;t <strong>take up</strong> any more of your time or that product your table.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li>&#39;<em><strong>take away</strong></em>&#39; means<em><u>to remove</u></em>. For example, &#39;<em><strong>Take </strong>these chairs <strong>away </strong>&ndash; we don&#39;t need them.</em>&#39;</li>\r\n</ul>\r\n\r\n<p>So, Option 1 is the correct answer.</p>\r\n\r\n<p>Let us see the usage of other words in the options:</p>\r\n\r\n<ul>\r\n\t<li>&#39;get away&#39; &rArr; <u><em>escape</em></u>.\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The thief had <strong>got away</strong> before the police arrived.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&#39;take down&#39; has two meanings\r\n\t<ol>\r\n\t\t<li><u><em>write down spoken words</em></u>;</li>\r\n\t</ol>\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>I <strong>took down</strong> the address of Mr. Chakraborty and went out immediately.</em>&#39;</li>\r\n\t</ul>\r\n\r\n\t<ol>\r\n\t\t<li><em><u>dismantle and remove a structure</u></em>.</li>\r\n\t</ol>\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The government has decided to <strong>take down</strong> the old building to avert any accidents.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&#39;put off&#39; &rArr;  <u><em>postpone</em></u>\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The meeting has been <strong>put off</strong> till nine o&#39;clock.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 103, "question": "\r\n\r\n<p><strong>A sentence has been given with a blank to be filled with an appropriate word. Choose the correct alternative.</strong></p>\r\n\r\n<p>Many people ________ the sweeper for not keeping the roads clear.</p>", "option1": "\r\n\r\n<p>praised</p>", "option2": "\r\n\r\n<p>claimed</p>", "option3": "\r\n\r\n<p>calmed</p>", "option4": "\r\n\r\n<p>blamed</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>&#39;blamed&#39; </strong>.</p>\r\n\r\n<ul>\r\n\t<li>Let us look into the <strong>meaning </strong>of the given options - \r\n\r\n\t<ul>\r\n\t\t<li><strong>praised -  </strong>express warm approval or admiration of.</li>\r\n\t\t<li><strong>claimed -  </strong>state or assert that something is the case, typically without providing evidence or proof.</li>\r\n\t\t<li><strong>calmed -  </strong>make (someone) tranquil and quiet; soothe.</li>\r\n\t\t<li><strong>blamed -  </strong>feel or declare that (someone or something) is responsible for a fault or wrong.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The given sentence implies that in the people&#39;s opinion, the sweeper was not clearing the roads. </li>\r\n\t<li>Thus we can infer that the sweeper was at fault as per the people. </li>\r\n\t<li>Hence, &#39; <strong>blamed&#39;  </strong>is the appropriate word for the given blank. </li>\r\n\t<li>So,  <strong>option 4  </strong>is the correct answer. </li>\r\n</ul>\r\n\r\n<p><strong><u>Correct sentence </u> - </strong><em>Many people<u><strong>blamed</strong></u>the sweeper for not keeping the roads clear.</em></p>", "question_heading": ""}, {"sr_no": 104, "question": "\r\n\r\n<p>Who has been elected as the third Vice-President of the World Meteorological Organization (WMO)?</p>", "option1": "\r\n\r\n<p>Sunil Kumar </p>", "option2": "\r\n\r\n<p>Rajat Sharma</p>", "option3": "\r\n\r\n<p>Mrutyunjay Mohapatra</p>", "option4": "\r\n\r\n<p>Sumit Singh</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <u><strong>Mrutyunjay Mohapatra</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>IMD director Mrutyunjay  Mohapatra elected third Vice-President of World Meteorological Organization in June 2023.</li>\r\n\t<li>World Meteorological Organization (WMO) elected Mrutyunjay Mohapatra, director of the India Meteorological Department (IMD), as the third Vice-President of the WMO.</li>\r\n\t<li>The WMO is the UN&#39;s authoritative voice on weather, climate and water.</li>\r\n\t<li>World Meteorological Organization (WMO)\r\n\t<ul>\r\n\t\t<li>It is a United Nations specialised agency that promotes international cooperation in the fields of atmospheric science, climatology, hydrology, and geophysics.</li>\r\n\t\t<li>The World Meteorological Organization (WMO) arose from the International Meteorological Organization (IMO), a non-governmental organisation established in 1873 to facilitate the exchange of weather data and research.</li>\r\n\t\t<li>The World Meteorological Convention of 1947, which formally established the World Meteorological Organization, resulted in proposals to change the IMO&#39;s status and structure.</li>\r\n\t\t<li>Headquarters: Geneva, Switzerland</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 105, "question": "\r\n<p>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</p>\r\n\r\n<p>A. It accounts for the adaptation and evolution of organisms, those innumerable features that so wonderfully equip them for survival and reproduction.</p>\r\n\r\n<p>B. It is by way of this passive choosing, this natural selection, that the physical features of an entire population come to change over time.</p>\r\n\r\n<p>C. Furthermore, it accounts for the divergence of species from common ancestors and thus for the endless diversity of life.</p>\r\n\r\n<p>D. The theory of natural selection is the centerpiece of On the Origin of Species and of evolutionary theory.</p>", "option1": "\r\n<p>ABDC</p>", "option2": "\r\n<p>DCAB</p>", "option3": "\r\n<p>DACB</p>", "option4": "\r\n<p>BACD</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<ul>\r\n\t<li>The correct answer is DACB.</li>\r\n\t<li>The correct order to form a meaningful and coherent paragraph is  DACB.</li>\r\n\t<li>The sentence in the correct order is written as - &quot; The theory of nature selection is the centerpiece of On the Origin of Species and of evolutionary theory.  It accounts for the adaptation and evolution of organisms, those innumerable features that so wonderfully equip them for survival and reproduction.  Furthermore, it accounts for the divergence of species from common ancestors and thus for the endless diversity of life. It is by way of this passive choosing, this natural selection, that the physical features of an entire population come to change over time. &quot;</li>\r\n\t<li>Therefore  option 3  is the correct option from the given option.</li>\r\n\t<li>Coherent Paragraph  - A coherent paragraph is a paragraph with sequential sentences and logically related to the main idea. The sentence in the paragraph must be parallel in harmony and connected to one another.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 106, "question": "\r\n<p>Find the word which is correctly spelt from the given options.</p>", "option1": "\r\n<p>Unfortunately</p>", "option2": "\r\n<p>Sceince</p>", "option3": "\r\n<p>Uncomfortabel</p>", "option4": "\r\n<p>Negligant</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Unfortunately&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The correctly spelt word is<strong> unfortunately</strong> is an adverb which means happening through bad luck or used to express disappointment, sorrow.\r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- We couldn&#39;t take him to the hospital. Unfortunately, he died.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Therefore,<strong> option1</strong> is the correct answer.</p>\r\n\r\n<p>The correct spelling of other words in the options are :</p>\r\n\r\n<ul>\r\n\t<li>Science which is a particular discipline or branch of learning.</li>\r\n\t<li>Uncomfortable means experiencing uneasiness or anxious, discomfort.</li>\r\n\t<li>Negligent means careless, inattentive.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 107, "question": "\r\n<p><strong>Direction: Choose the option which replaces the underlined word to form a grammatically correct sentence:</strong></p>\r\n\r\n<p><u>He grabbed</u> some cash and ran to buy the turkey and returned before I scolded him about how forgetful he was.</p>", "option1": "\r\n<p>He was being grabbed</p>", "option2": "\r\n<p>He may be grabbed</p>", "option3": "\r\n<p>He had grabbed</p>", "option4": "\r\n<p>No improvement</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: <strong>He had grabbed</strong>.</p>\r\n\r\n<ul>\r\n\t<li>&#39;Had grabbed&#39; denotes the<strong> past perfect tense</strong>.</li>\r\n\t<li>The Past Perfect tense is used when out of two actions it is necessary to emphasize that the preceding action was completely finished before the succeeding action started.</li>\r\n\t<li>Preceding actions are generally implied by the following as given below:\r\n\t<ul>\r\n\t\t<li><strong>Before</strong></li>\r\n\t\t<li>After</li>\r\n\t\t<li>Recently</li>\r\n\t\t<li>Yet</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>For example: </strong>They had left <strong>before</strong> I spoke to them.</li>\r\n\t<li>Similarly, in this question, there are two actions in the past. The past perfect tense should be used in the preceding action (He had grabbed some cash) and the simple past tense should be used in the action that is done later (I scolded him).</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is: <em><strong><u>He had grabbed</u></strong> some cash and ran to buy the turkey and returned before I scolded him about how forgetful he was.</em></p>", "question_heading": ""}, {"sr_no": 108, "question": "\r\n<p>The organisms with cells having nuclear material without nuclear membrane are called as which of the following?</p>", "option1": "\r\n<p>Eukaryotes </p>", "option2": "\r\n<p>Vacuoles </p>", "option3": "\r\n<p>Prokaryotes </p>", "option4": "\r\n<p>Organelles </p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<u><strong>Prokaryotes .</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Prokaryotes </strong>are creatures without a <strong>nucleus or other organelles </strong>in their cells.</li>\r\n\t<li>Prokaryotes differ from <strong>eukaryotes </strong>by not having <strong>internal membranes.</strong></li>\r\n\t<li><strong>Bacteria and archaea, </strong>which are considered to have <strong>separate evolutionary lineages </strong>, are the two main categories of prokaryotes.</li>\r\n\t<li>Prokaryotic cells include organisms like <strong>cyanobacteria, E. coli, mycoplasma, etc. </strong></li>\r\n\t<li><strong>Eukaryotes:</strong>\r\n\t<ul>\r\n\t\t<li><strong>Any cell or creature </strong>with a <strong>distinct nucleus </strong>is said to be eukaryote.</li>\r\n\t\t<li>The nucleus, which houses the clearly delineated chromosomes, is <strong>encased in a nuclear membrane </strong>in eukaryotic cells.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Vacuoles:</strong>\r\n\t<ul>\r\n\t\t<li><strong>A membrane-bound cell organelle </strong>known as a vacuole.</li>\r\n\t\t<li><strong>Animal cells </strong>typically have tiny vacuoles that aid in the <strong>sequestration of waste.</strong></li>\r\n\t\t<li><strong>Vacuoles in plant cells aid </strong>in preserving the equilibrium of water.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Organelles:</strong>\r\n\t<ul>\r\n\t\t<li>It is a <strong>tiny, membrane-enclosed structure </strong>in a cell that serves a specific purpose.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 109, "question": "\r\n<p>Which of the following aircraft made a maiden sea landing on onboard Indian Navy Warship in May 2023?</p>", "option1": "\r\n<p>Tejas Mk-II</p>", "option2": "\r\n<p>MH60R</p>", "option3": "\r\n<p>Sukhoi Su-30MKI</p>", "option4": "\r\n<p>Mig-21</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>MH60R</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>MH-60R helicopter undertakes maiden landing at sea</li>\r\n\t<li>The Indian Navy&#39;s MH60R helicopter has achieved a significant milestone by landing on the INS Kolkata. </li>\r\n\t<li>It is known for its exceptional surveillance, anti-shipping, and Search and Rescue capabilities.</li>\r\n\t<li>The integration of the MH60R helicopter with Indian Navy warships will further strengthen the Navy&#39;s capability to counter underwater threats and conduct surveillance operations.</li>\r\n\t<li>According to Indian Navy, the MH60R helicopter is a versatile platform known for its exceptional ASW, surveillance, anti-shipping and Search and Rescue capabilities.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 110, "question": "\r\n<p>By which of the following Constitutional Amendment the Right to Property has been deleted from the Fundamental Rights?</p>", "option1": "\r\n<p>42nd Amendment</p>", "option2": "\r\n<p>44th Amendment</p>", "option3": "\r\n<p>46th Amendment</p>", "option4": "\r\n<p>48th Amendment</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>44th  Amendment.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>It was the 44th amendment of the Constitution of India which declared that the Right to Property will no longer be a Fundamental Right.</li>\r\n\t<li>Article 31 and Article 19(1)(f) was completely removed from Part III &ndash; Fundamental Rights of Constitution with the help of the 44th Amendment.</li>\r\n\t<li>The Supreme Court reminded the State Government that the State had to follow the authority of law and due procedure of law before taking the private property of a person.</li>\r\n\t<li>This needs to be done as per provisions mentioned in Article 300A.</li>\r\n\t<li>Fundamental Rights are a set of basic rights and freedoms guaranteed to all individuals under the Constitution of India.</li>\r\n\t<li>These rights are considered fundamental because they are essential for the development, dignity, and well-being of individuals.</li>\r\n\t<li>The Fundamental Rights are enshrined in Part III (Articles 12 to 35) of the Indian Constitution.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 111, "question": "\r\n<p>Which of the following Articles of the Constitution of India talks about &#39;Review of judgments or orders by the Supreme Court&#39;?</p>", "option1": "\r\n<p>Article 137</p>", "option2": "\r\n<p>Article 130</p>", "option3": "\r\n<p>Article 127</p>", "option4": "\r\n<p>Article 131</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>137.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Article 137 of the Indian Constitution deals with the review of judgments or orders by the Supreme Court.</strong></li>\r\n\t<li>As per article 137; subject to the provisions of any law made by Parliament or any rules made under article 145, the Supreme Court shall have power to review any judgment pronounced or order made by it.</li>\r\n\t<li><strong>Article 136: Special leave to appeal by the Supreme Court</strong></li>\r\n\t<li>(1) Notwithstanding anything in this Chapter, the Supreme Court may, in its discretion, grant special leave to appeal from any judgment, decree, determination, sentence or order in any cause or matter passed or made by any court or tribunal in the territory of India.</li>\r\n\t<li>(2) Nothing in clause (1) shall apply to any judgment, determination, sentence or order passed or made by any court or tribunal constituted by or under any law relating to the Armed Forces.</li>\r\n\t<li><strong>Article 138: Enlargement of the jurisdiction of the Supreme Court</strong></li>\r\n\t<li>(1) The Supreme Court shall have such further jurisdiction and powers with respect to any of the matters in the Union List as Parliament may by law confer.</li>\r\n\t<li>(2) The Supreme Court shall have such further jurisdiction and powers with respect to any matter as the Government of India and the Government of any State may by special agreement confer, if Parliament by law provides for the exercise of such jurisdiction and powers by the Supreme Court.</li>\r\n\t<li><strong>Article 139: Conferment on the Supreme Court of powers to issue certain writs</strong></li>\r\n\t<li>Parliament may by law confer on the Supreme Court power to issue directions, orders or writs, including writs in the nature of habeas corpus, mandamus, prohibition, quo warranto and certiorari, or any of them, for any purposes other than those mentioned in clause (2) of article 32.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 112, "question": "\r\n<p>Directions: Select the option that is nearest in meaning to the underlined word and mark the correct answer accordingly.</p>\r\n\r\n<p>Week-long rain leaves crops damaged in Divar making farmers <u>morose.</u></p>", "option1": "\r\n<p>Communicative</p>", "option2": "\r\n<p>Sullen</p>", "option3": "\r\n<p>Cheerful</p>", "option4": "\r\n<p>Happy</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>Sullen</strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Morose  means&#39; bad-tempered, and not saying much to other people ( <strong>बुरे स्वभाव वाला, और दूसरे लोगों से ज्यादा कुछ नहीं कहना; चिड़चिड़ा, असौम्&zwj;य और बात को</strong><strong>अपने तक सीमित रखने वाला </strong>)<strong>&#39;.</strong></li>\r\n\t<li>Marked option  &#39;Sullen&#39;  means  &#39; looking bad-tempered and not wanting to speak to people ( <strong>चिड़चिड़ा और उदासी भरा लोगों से बोलने का अनिच्&zwj;छुक; खिन्&zwj;न </strong>)<strong>&#39;.</strong>\r\n\t<ul>\r\n\t\t<li><strong>Example: </strong><em>Kashmir to have a silent and <strong>sullen </strong>Eid after weeks of strife and violence.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that  Morose  and  &#39;Sullen&#39;  are nearly the  same  in meaning. </li>\r\n</ul>\r\n\r\n<p>Therefore, the  correct answer  is  option 2.</p>\r\n\r\n<ul>\r\n\t<li><strong>Communicative  </strong>means  willing and able to talk and share ideas, etc. ( <strong>बातचीत या विचारों के आदान-प्रदान का इच्&zwj;छुक व इसमें सक्षम </strong>).</li>\r\n\t<li><strong>Cheerful  </strong>means  feeling or showing happiness ( <strong>खुशी महसूस करना या दिखाना </strong>).</li>\r\n\t<li><strong>Happy  </strong>means  feeling or showing pleasure; pleased ( <strong>आनंद का अनुभव करने या उसे व्&zwj;यक्त करने वाला; प्रसन्&zwj;न, प्रफुल्&zwj;ल </strong>).</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 113, "question": "\r\n<p>Choose the option that is the correct direct form of the sentence.</p>\r\n\r\n<p>Shubham said that his father was playing cricket with him.</p>", "option1": "\r\n<p>Shubham said, &ldquo;My father was playing cricket with me.&rdquo;</p>", "option2": "\r\n<p>Shubham said, &ldquo;My father is playing cricket with me.&rdquo;</p>", "option3": "\r\n<p>Shubham said, &ldquo;My father played cricket with me.&rdquo;</p>", "option4": "\r\n<p>Shubham said, &ldquo;My father had played cricket with me.&rdquo;</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Option 2&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>The original sentence</strong> states that Shubham said that his father<strong> &quot;was&quot;</strong> playing cricket with him.</li>\r\n\t<li><strong>When we convert</strong> direct speech to indirect speech, we generally need to shift the verb tense back one step.</li>\r\n\t<li>However, in this case, option 2<strong> maintains the present tense of the verb</strong> &quot;is&quot; because it accurately reflects the original sentence&#39;s meaning.</li>\r\n</ul>\r\n\r\n<p>Therefore, the<strong> correct sentence </strong>is: <em>&#39;Shubham said, &ldquo;My father is playing cricket with me.&rdquo;</em></p>\r\n\r\n<ul>\r\n\t<li><strong>Option 1)</strong> &quot;Shubham said, &#39;My father was playing cricket with me.&#39;&quot; changes the verb tense to <strong>past tense (&quot;was playing&quot;), </strong>which does not align with the reported speech. The original sentence indicates that the father is currently playing cricket, so the present tense should be maintained.</li>\r\n\t<li><strong>Option 3)</strong> &quot;Shubham said, &#39;My father played cricket with me.&#39;&quot; changes the verb tense to <strong>past tense (&quot;played&quot;),</strong> which again does not accurately convey the present ongoing action of the father playing cricket.</li>\r\n\t<li><strong>Option 4)</strong> &quot;Shubham said, &#39;My father had played cricket with me.&#39;&quot; uses the <strong>past perfect tense (&quot;had played&quot;),</strong> which suggests an action completed before a past point of reference. However, there is no specific past point of reference mentioned in the original sentence, so the past perfect tense is not necessary.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 114, "question": "\r\n<p>Under which type of temple architecture does the plan of temples look like a star and is known as a stellate plan?</p>", "option1": "\r\n<p>Vesara style</p>", "option2": "\r\n<p>Nagara style</p>", "option3": "\r\n<p>Dravidian style</p>", "option4": "\r\n<p>Kakatiyan style</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<u><strong> Vesara style</strong></u>.</p>\r\n\r\n<p>Vesara Style of Architecture :</p>\r\n\r\n<ul>\r\n\t<li>Vesara style of temple architecture evolved in Deccan India. </li>\r\n\t<li>It is a hybridized style of Nagara and Dravida style of temple architecture.</li>\r\n\t<li>It became popular after the mid-seventh century in the region of Karnataka, under the patronage of Chalukyas rulers.</li>\r\n</ul>\r\n\r\n<p>Features of Vesara style:</p>\r\n\r\n<ul>\r\n\t<li>Compound walls may or may not be present.</li>\r\n\t<li>Gopurams may or may not be present.</li>\r\n\t<li>The plan of these temples looks like a star and is thus known as a stellate plan. <em>Hence Option 1 is correct.</em></li>\r\n\t<li>Examples: Durga Temple (Aihole), Virupaksh Temple (Pattadkal), Keshava Temple (Somnathpur).</li>\r\n\t<li>The Chalukyas were great patrons of art. They developed the Vesara style of temple architecture in India. </li>\r\n\t<li>Cave temple architecture was also famous under the Chalukyas. Their cave temples are found in Ajanta, Ellora, and Nasik.</li>\r\n\t<li>The best specimens of Chalukya paintings can be seen in the Badami.</li>\r\n</ul>\r\n\r\n<p>Dravida Style:</p>\r\n\r\n<ul>\r\n\t<li>Generally enclosed within a compounded wall.</li>\r\n\t<li>The entrance gateway is known as Gopuram.</li>\r\n\t<li>The shape of the Temple tower is known as Vimana (similar to Shikhara in Nagara style).</li>\r\n\t<li>Large water tanks are common in the temple complex.</li>\r\n\t<li>Examples: Brahadeeshwara temple, Rajarajeswara temple.</li>\r\n</ul>\r\n\r\n<p>Nagara Style:</p>\r\n\r\n<ul>\r\n\t<li>Built on a stone platform with steps leading up to it.</li>\r\n\t<li>Have a tower or Shikhara.</li>\r\n\t<li>Have Grabhagriha ( A place for the idols of god and goddess).</li>\r\n\t<li>Examples: Kandariya Mahadeo temple at Khajuraho, Lakshamana temple</li>\r\n</ul>\r\n\r\n<p>Central India Temples</p>\r\n\r\n<ul>\r\n\t<li>Ancient temples of Uttar Pradesh, Madhya Pradesh and Rajasthan share many traits.</li>\r\n\t<li>They are made of sandstone.</li>\r\n\t<li>Some of the oldest surviving structural temples from the Gupta Period are in Madhya Pradesh.</li>\r\n\t<li>These are relatively modest-looking shrines each having four pillars that support a small mandapa which looks like a simple square porch-like extension before an equally small room that served as the Garbhagriha.</li>\r\n\t<li>Deogarh (in Lalitpur District, Uttar Pradesh) was built in the early sixth century CE. is a classic example of a late Gupta Period type of temple.</li>\r\n\t<li>The presence of this curving latina or rekha-prasada type of shikhara also makes it clear that this is an early example of a classic nagara style of temple.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 115, "question": "\r\n<p>Select the INCORRECTLY spelt word.</p>", "option1": "\r\n<p>Ilegal</p>", "option2": "\r\n<p>Appeal</p>", "option3": "\r\n<p>Appropriate</p>", "option4": "\r\n<p>Irresponsible</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The erroneous spelling is &#39;Ilegal&#39; .</p>\r\n\r\n<ul>\r\n\t<li>Let us explore the meaning of the given options \r\n\t<ul>\r\n\t\t<li>Ilegal -There is no such word in English or we can say that there is a spelling mistake in the word. But if an extra  <strong>letter l  </strong>is added   the word becomes  illegal,  which is a proper English word. It means  contrary to or forbidden by law, especially criminal law.</li>\r\n\t\t<li>Appeal -   make a serious, urgent, or heartfelt request.</li>\r\n\t\t<li>Appropriate -  suitable or proper in the circumstances.</li>\r\n\t\t<li>Irresponsible -  (of a person, attitude, or action) not showing a proper sense of responsibility.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the correct answer is  option 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 116, "question": "\r\n<p>With the increase in the temperature of a liquid:-</p>", "option1": "\r\n<p>Surface tension increases and viscosity decreases</p>", "option2": "\r\n<p>Surface tension and viscosity both decreases</p>", "option3": "\r\n<p>Surface tension and viscosity both increases</p>", "option4": "\r\n<p>Surface tension decreases and viscosity increases</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u><strong>Effect of temperature on surface tension and viscosity:</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>As the temperature increases, viscosity decreases.</strong></li>\r\n\t<li><strong>Surface tension decreases with an increase in temperature.</strong></li>\r\n\t<li>In general, surface tension decreases when the temperature increases because cohesive forces decrease with increased molecular thermal activity.</li>\r\n\t<li>The influence of the surrounding environment is due to the adhesive action liquid molecules have at the interface.</li>\r\n\t<li>Increasing temperature results in a decrease in viscosity because a larger temperature means particles have greater thermal energy and are more easily overcome the attractive forces binding them together.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 117, "question": "\r\n<p>Direction: The sentence is divided into four parts. Find out which part has an error and mark it as your answer. If there is no error, mark &#39;No error&#39; as your answer.</p>\r\n\r\n<p>One of them (a) / forgot to take their bag (b) / from the school. (c) / No error (d)</p>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>B</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;(B)&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The <strong>error lies </strong>in <strong>Part B </strong>of the sentence.</li>\r\n\t<li><strong>&#39;One of them&#39; </strong>noun phrase is <strong>singular </strong>here so <strong>relative pronoun </strong>should also be in <strong>singular form.</strong></li>\r\n\t<li><strong>&#39;His&#39; </strong>will be used <strong>instead </strong>of <strong>&#39;Their&#39;.</strong></li>\r\n\t<li>So, the <strong>correct answer </strong>is- <strong>&#39;Option 2&#39; </strong>.</li>\r\n</ul>\r\n\r\n<p>Therefore, the <strong>correct sentence </strong>is- <em>One of them forgot to take <strong>his </strong>bag from the school.</em></p>", "question_heading": ""}, {"sr_no": 118, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (1)?</p>", "option1": "\r\n<p>Farmer</p>", "option2": "\r\n<p>Farmers</p>", "option3": "\r\n<p>Farmers&#39;</p>", "option4": "\r\n<p>Farmer&#39;s</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>Farmers&#39;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the first line of the paragraph, <strong>Farmers&#39;</strong> will be used before unions.</li>\r\n\t<li>It is so because<strong> &#39;If a plural pronoun ends in &#39;s/es&#39;, &#39;s&#39; is not added while apostrophe with the plural form&#39;.</strong>\r\n\t<ul>\r\n\t\t<li><strong>For Examples</strong> - <strong>Boys&#39; </strong>college, <strong>Girls&#39;</strong> college.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore,<strong> farmers&#39; </strong>will be the most appropriate of all the options.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 119, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (3)?</p>", "option1": "\r\n<p>He</p>", "option2": "\r\n<p>Them</p>", "option3": "\r\n<p>They</p>", "option4": "\r\n<p>It</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>They</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the third blank of the passage, <strong>&#39;they&#39; </strong>will be used.</li>\r\n\t<li>Here in the given sentence, <strong>&#39;they&#39;</strong> is qualifying <strong>farmers</strong> which is a <strong>plural noun</strong>.</li>\r\n\t<li><strong>&#39;It&#39; </strong>and <strong>&#39;He&#39;</strong> cannot be used because they are <strong>singular pronouns </strong>and cannot qualify a plural noun.</li>\r\n\t<li><strong>&#39;Them&#39;</strong> is pronoun used in<strong> objective case</strong>.</li>\r\n\t<li>Therefore, it cannot be used.</li>\r\n</ul>\r\n\r\n<p><strong>Thus, the correct answer for the blank is</strong> &#39;They&#39;.</p>", "question_heading": ""}, {"sr_no": 120, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (4)?</p>", "option1": "\r\n<p>At</p>", "option2": "\r\n<p>In</p>", "option3": "\r\n<p>Of</p>", "option4": "\r\n<p>On</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>On.</strong></p>\r\n\r\n<ul>\r\n\t<li>In the fourth blank of the passage, <strong>&#39;on&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;On the
