<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>40.) SSC CGL Tier II (Paper-I) Mock 11 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": "A ृोg cयnपोinौ 2 नधक. 3 gनधधn ोnक 2 ृिहध ृोििस, Tथय ृोििस ोनध कनोथn ोप नोnकयं. Wुोप iौ पुध ूनयृोृiिiपद पुोप nयnध यी पुध ृोििस कनोथn iौ ृिहध?", "option1": "<p>2/7</p>", "option2": "<p>11/21</p>", "option3": "<p>10/21</p>", "option4": "<p>5/7</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>Given </strong>:</p><p>A bag contains 2 red 3 green and 2 blue balls, Two balls are drawn at random. </p><p><strong>Formula Used </strong>:</p><p>Probability = favorable outcome/total outcome</p><p><strong>Calculation </strong>:</p><p>None of the balls drawn is blue, this can only happen when the two balls drawn at random are either red and green or both.</p><p><span>Total number of balls = 2 + 3 + 2 = 7</span></p><p><span>⇒ Number of ways of drawing 2 balls out of 7 =  <sup>7</sup>C <sub>2</sub> = (7 × 6) / (2 × 1) = 42/2 = 21</span></p><p><span>Number of balls other than blue = 5</span></p><p><span>⇒ Number of ways of drawing 2 balls out of 5 =  <sup>5</sup>C <sub>2</sub> = (5 × 4) / (2 × 1) = 20/2 = 10</span></p><p><strong><span>∴ Required Probability = 10/21</span></strong></p>", "question_heading": ""}, {"sr_no": 2, "question": "\r\n<p>Swetha and Rinky are twins. Swetha&#39;s brother is Raghav. Ananya is the wife of Raghav. Rinky&#39;s mother is Mrudula. Swetha&#39;s husband is Arnav. Arnav&#39;s daughter is Riya. How is Mrudula related to Riya?</p>", "option1": "\r\n<p>Mother&#39;s mother </p>", "option2": "\r\n<p>Daughter&#39;s daughter</p>", "option3": "\r\n<p>Son&#39;s daughter </p>", "option4": "\r\n<p>Father&#39;s mother </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>According to the given information,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882573_1742882573188489_thump.png\" style=\"width: 200px; height: 270px;\" /></figure>\r\n\r\n<ul>\r\n\t<li><span>Swetha and Rinky are twins.</span></li>\r\n\t<li><span>Swetha&#39;s brother is Raghav.</span></li>\r\n\t<li><span>Ananya is the wife of Raghav.</span></li>\r\n\t<li><span>Rinky&#39;s mother is Mrudula.</span></li>\r\n\t<li><span>Swetha&#39;s husband is Arnav.</span></li>\r\n\t<li><span>Arnav&#39;s daughter is Riya.</span></li>\r\n</ul>\r\n\r\n<p><span>The following diagram can be deduced,</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882602_1742882602783965_thump.png\" style=\"width: 300px; height: 120px;\" /></figure>\r\n\r\n<p><span>As the diagram suggests <strong>Riya is the daughter of Swetha and Mridula is the mother of Swetha.</strong></span></p>\r\n\r\n<p>Thus<span><strong>Mridula is mother&#39;s mother of Riya.</strong></span></p>\r\n\r\n<p><span>Hence, the correct answer is </span><strong><span>&quot; Mother&#39;s mother &quot;.</span></strong></p>", "question_heading": ""}, {"sr_no": 3, "question": "\r\n<p>In the following question, the statements are followed by conclusions. Study the conclusions based on the given statements and select the appropriate option as your answer.</p>\r\n\r\n<p><strong>Statement:</strong></p>\r\n\r\n<p>H &gt; J = K,</p>\r\n\r\n<p><strong>Conclusions:</strong></p>\r\n\r\n<p>I. K &gt; H</p>\r\n\r\n<p>II. J = H</p>", "option1": "\r\n<p>Only conclusion II follows</p>", "option2": "\r\n<p>Either conclusion I or II follows</p>", "option3": "\r\n<p>Only conclusion I follows</p>", "option4": "\r\n<p>Neither conclusion I nor II follows</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<p>Given statement is <span>H &gt; J = K,</span></p>\r\n\r\n<p><span>I. K &gt; H </span> &rarr;  <span>False  </span>( as  <span>H &gt; J = K or H &gt; K </span>)</p>\r\n\r\n<p><span>II. J = H </span> &rarr;  <span>False  </span>(as  <span>H &gt; J = K or J &lt; H </span>)</p>\r\n\r\n<p>Therefore, non-conclusion is followed as per the given statement.</p>\r\n\r\n<p>Hence, the correct answer is &#39;<strong><span>Neither conclusion I nor II follows</span></strong>&#39;.</p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<p><span>The distance between the centres of two circles touching externally is 12 cm. If the sum of their areas is 104&pi; cm 2 , then the radius of the larger circle is </span></p>", "option1": "\r\n<p>7</p>", "option2": "\r\n<p>10</p>", "option3": "\r\n<p>8</p>", "option4": "\r\n<p>9</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>The distance between the centres of two circles touching externally is 12 cm.</span></p>\r\n\r\n<p><span>The sum of their areas is 104&pi; cm 2</span></p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>Area of a circle is &pi;r <sup>2</sup></p>\r\n\r\n<p>Here,</p>\r\n\r\n<p>r is radius</p>\r\n\r\n<p>Let the radius of larger circle be x</p>\r\n\r\n<p>So, radius of smaller circle = 12 - x</p>\r\n\r\n<p>Now,</p>\r\n\r\n<p>&pi;x <sup>2</sup>+ (12 - x) <sup>2</sup>&pi; = 104&pi;</p>\r\n\r\n<p>&rArr; &pi;(x <sup>2</sup>+ 144 + x <sup>2</sup>- 24x) = 104&pi;</p>\r\n\r\n<p><span>&rArr; 2x 2  + 144  - 24x = 104</span></p>\r\n\r\n<p><span>&rArr; 2x 2  + 40  - 24x = 0</span></p>\r\n\r\n<p><span>&rArr; 2x 2  - 20x - 4x + 40 = 0</span></p>\r\n\r\n<p><span>&rArr; 2x(x  - 10)x - 4(x - 10) = 0</span></p>\r\n\r\n<p><span>&rArr; (x  - 10)(2x - 4) = 0</span></p>\r\n\r\n<p>&rArr; x = 2, 10</p>\r\n\r\n<p>So, radius of larger circle is 10 cm</p>\r\n\r\n<p><strong>&there4; <span> The  radius of the larger circle is 10 cm.</span></strong></p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n\r\n<p>Select the figure that will replace the question mark(?) in the following figure series</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882810_1742882810591316_thump.png\" style=\"width: 300px; height: 62px;\" /></figure>", "option1": "\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882834_1742882834226737_thump.png\" style=\"width: 100px; height: 98px;\" /></figure>", "option2": "\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742973680_1742973680798198_thump.png\" style=\"width: 100px; height: 98px;\" /></figure>", "option3": "\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882905_1742882905742507_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>", "option4": "\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882927_1742882927411321_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The logic followed here is:</p>\r\n\r\n<ul>\r\n\t<li>O moves in clockwise direction.</li>\r\n\t<li>In every figure, star is in the position of mirror image of the previous image.</li>\r\n\t<li>C is also following a pattern .</li>\r\n</ul>\r\n\r\n<div>.\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882985_1742882985780064_thump.png\" style=\"width: 300px; height: 76px;\" /></figure>\r\n</div>\r\n\r\n<p>Lets check each option:</p>\r\n\r\n<p>1) It is following the logic.</p>\r\n\r\n<p>2) C is not following the pattern.</p>\r\n\r\n<p>3) The figure is not following the pattern.</p>\r\n\r\n<p>4) The figure is not following the pattern.</p>\r\n\r\n<p>Thus, <strong>option 1 </strong>will replace the <strong>?</strong>. All other options are eliminated.</p>\r\n\r\n<p>Hence, <strong>&#39;option 1&#39; </strong>is the correct answer.</p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>The difference between the ages of Rahim and his uncle is 10 years. After 2 years if the sum of their ages is 66 years, then what is the present age of the uncle?</p>", "option1": "\r\n<p>51</p>", "option2": "\r\n<p>49</p>", "option3": "\r\n<p>36</p>", "option4": "\r\n<p>41</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>The difference between the ages of Rahim and his uncle = 10 years</span></p>\r\n\r\n<p><span>After 2 years, the sum of their ages = 66 years</span></p>\r\n\r\n<p><strong><span>Calculation:</span></strong></p>\r\n\r\n<p>Let the age of his Uncle be U years and Rahim be R years.</p>\r\n\r\n<p>Now, according to the question</p>\r\n\r\n<p>&rArr; U - R = 10      -----(1)</p>\r\n\r\n<p><span>After 2 years, the sum of their ages = 66 years</span></p>\r\n\r\n<p>Age of Uncle after 2 years = (U + 2) years</p>\r\n\r\n<p>Age of Rahim after 2 years = (R + 2) years</p>\r\n\r\n<p>Their sum = (U + 2 + R + 2) = 66</p>\r\n\r\n<p>&rArr; U + R + 4 = 66</p>\r\n\r\n<p>&rArr; U + R = 62        ------(2)</p>\r\n\r\n<p>Now, adding equations (1) and (2), we get</p>\r\n\r\n<p>&rArr; 2U = 72</p>\r\n\r\n<p>&rArr; U = 36 years</p>\r\n\r\n<p><strong>&there4; The required age of his uncle is 36 years.</strong></p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n\r\n<p>A paper is folded and cut as shown below. How will it appear when unfolded?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883059_1742883059279603_thump.png\" style=\"width: 300px; height: 98px;\" /></figure>", "option1": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883088_1742883088669467_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742973756_1742973756461314_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883146_1742883146633244_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883184_1742883184447995_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>Here we can see that the given paper is folded three times.</p>\r\n\r\n<div>\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883224_1742883224504205_thump.png\" style=\"width: 300px; height: 82px;\" /></figure>\r\n=\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883272_1742883272517573_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>\r\n</div>\r\n\r\n<p> </p>\r\n\r\n<p>Hence, the correct answer is  <strong>&quot;Option2&quot;</strong></p>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n\r\n<p>In each of the questions below is given a statement followed by two assumptions <span>। and ॥ </span>have been given. You have to consider the statement and the following assumptions and decide which of the assumptions are implicit in the statement.</p>\r\n\r\n<p>Statements:</p>\r\n\r\n<p>Everyone loves to read fairy tales.</p>\r\n\r\n<p>Assumptions:</p>\r\n\r\n<p>I. Fairy tales are only reading material.</p>\r\n\r\n<p>II. Nobody likes other stuff.</p>", "option1": "\r\n\r\n<p>Only assumption I is implicit.</p>", "option2": "\r\n\r\n<p>Both I and II are implicit.</p>", "option3": "\r\n\r\n<p>Neither I nor II is implicit.</p>", "option4": "\r\n\r\n<p>Only Assumption II is implicit.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The statement declares that fairy tales are loved by everyone.</p>\r\n\r\n<ul>\r\n\t<li>The statement only talks about fairy tales being loved by all people, but it does not suggest that fairy tales have no other use or purpose. So, assumption I is not implicit.</li>\r\n\t<li>Nothing about people liking or disliking other stuff is suggested in the given statement, so assumption II is also not implicit.</li>\r\n</ul>\r\n\r\n<p>Hence the correct answer is <strong>option 3 </strong>.</p>", "question_heading": ""}, {"sr_no": 9, "question": "\r\n<p>When the latitude of the sun changes from 45&deg; to 30&deg; then the shadow of the tower increases by 60m, then the length of the tower is.</p>", "option1": "\r\n<p>30(&radic;3 + 1)</p>", "option2": "\r\n<p>20(&radic;3 + 1)</p>", "option3": "\r\n<p>24(&radic;3 + 1)</p>", "option4": "\r\n<p>30(&radic;3 - 1)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883383_1742883383373741_thump.png\" style=\"width: 200px; height: 185px;\" /></figure>\r\n\r\n<p>AB = h</p>\r\n\r\n<p>CD = 60</p>\r\n\r\n<p>IN &Delta; ABC</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\tan 45^\\circ = \\frac{{AB}}{{BC}} = \\frac{h}{{BC}}\\)</span></p>\r\n\r\n<p>&rArr; BC = h</p>\r\n\r\n<p>IN &Delta;ABD</p>\r\n\r\n<p><span class=\"math-tex\">\\(tan30^\\circ = \\frac{h}{{BC + 60}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(h = \\frac{{60}}{{\\sqrt 3 - 1}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(h = \\frac{{60}}{{\\sqrt 3 - 1}} \\times \\frac{{\\sqrt 3 + 1}}{{\\sqrt 3 + 1}}\\)</span></p>\r\n\r\n<p>&there4; <span class=\"math-tex\">\\(h = 30\\left( {\\sqrt 3 + 1} \\right)\\)</span></p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n\r\n<p>The following pie chart shows the spending of a country on tourism in various districts during a particular year. Total spending of the country ₹15,62,000</p>\r\n\r\n<p>How much less money (in ₹) is spent on district C than on district E ?</p>", "option1": "\r\n\r\n<p>65790</p>", "option2": "\r\n\r\n<p>60890</p>", "option3": "\r\n\r\n<p>66780</p>", "option4": "\r\n\r\n<p>62480</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Total spending of the country = ₹15,62,000</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883738_1742883738616406_thump.png\" style=\"width: 400px; height: 245px;\" /></p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>Percentage = (Given value/Total value) &times; 100</p>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>According to the question,</p>\r\n\r\n<p>Money spent on District C = 14% of total money</p>\r\n\r\n<p>&rArr;  District C = 14% of 1562000</p>\r\n\r\n<p>&rArr;  District C = 14/100 &times; 1562000</p>\r\n\r\n<p>&rArr;  District C = 14 &times; 15620 = Rs. 218680</p>\r\n\r\n<p>Money spent on District C = 18% of total money</p>\r\n\r\n<p>&rArr;  District E = 18% of 1562000</p>\r\n\r\n<p>&rArr;  District E = 18/100 &times; 1562000</p>\r\n\r\n<p>&rArr;  District E = 18 &times; 15620 = Rs. 281160</p>\r\n\r\n<p>Now difference between money spent of district C and district E</p>\r\n\r\n<p>&rArr;  (Money spent on District E ) - ( Money spent on District C )</p>\r\n\r\n<p>&rArr; ( 281160 ) - ( 218680 ) = Rs. 62480</p>\r\n\r\n<p><strong>&there4; Rs. 62480 is spent on District C than on District E.</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n<p>What is the median of the heights given below?</p>\r\n\r\n<p>160 cm, 167 cm, 158 cm, 159 cm, 161 cm, 158 cm, 160 cm, 162 cm, 170 cm</p>", "option1": "\r\n<p><span>161 cm</span></p>", "option2": "\r\n<p><span>160 cm</span></p>", "option3": "\r\n<p><span>160.6 cm</span></p>", "option4": "\r\n<p><span>159 cm</span></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p><span>The median is the middle value </span>when the Number of observation is an  odd number.</p>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>To find the median of the heights given, we need to arrange them in order from lowest to highest:</p>\r\n\r\n<p>158 cm, 158 cm, 159 cm, 160 cm, 160 cm, 161 cm, 162 cm, 167 cm, 170 cm</p>\r\n\r\n<p>There are 9 heights in total, which is an odd number. The median is the middle value when the heights are arranged in order. In this case, the middle value is the fifth value, which is 160 cm.</p>\r\n\r\n<p><strong>Hence, the median height of the group is 160 cm.</strong></p>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p>What should come next term in the following number series?<br />\r\n<span class=\"math-tex\">\\(\\frac{1}{\\sqrt{2}}, \\frac{1}{2}, \\frac{1}{2 \\sqrt{3}}, \\frac{1}{2 \\sqrt{6}}, \\frac{1}{6 \\sqrt{2}}\\)</span>, ?</p>", "option1": "\r\n<p><span>\\(\\frac{1}{12 \\sqrt{3}}\\)</span></p>", "option2": "\r\n<p><span>\\(\\frac{1}{12 \\sqrt{2}}\\)</span></p>", "option3": "\r\n<p><span>\\(\\frac{1}{6 \\sqrt{6}}\\)</span></p>", "option4": "\r\n<p><span>\\(\\frac{1}{12}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>It follows the multiplicity of <span class=\"math-tex\">\\(\\frac{1}{\\sqrt2}\\)</span> and then by  <span class=\"math-tex\">\\(\\frac{1}{\\sqrt3}\\)</span> and then by <span class=\"math-tex\">\\(\\frac{1}{\\sqrt2}\\)</span> and by <span class=\"math-tex\">\\(\\frac{1}{\\sqrt3}\\)</span>respectively.</p>\r\n\r\n<p><u><strong>Calculation:</strong></u></p>\r\n\r\n<p>For<span class=\"math-tex\">\\(\\frac{1}{\\sqrt{2}}, \\frac{1}{2}, \\frac{1}{2 \\sqrt{3}}, \\frac{1}{2 \\sqrt{6}}, \\frac{1}{6 \\sqrt{2}}\\)</span> if take a look on the pattern, the next term would be multiplied by <span class=\"math-tex\">\\(\\frac{1}{\\sqrt2}\\)</span> .</p>\r\n\r\n<p>So, the next term would be <span class=\"math-tex\">\\(\\frac{1}{6 \\sqrt{2}}\\times\\frac{1}{\\sqrt2} =\\frac{1}{12}\\)</span></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<p>Three statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.</p>\r\n\r\n<p><strong>Statements:</strong></p>\r\n\r\n<p>All nodes are joints.</p>\r\n\r\n<p>Some joints are bones.</p>\r\n\r\n<p>All bones are cartilages.</p>\r\n\r\n<p><strong>Conclusions:</strong></p>\r\n\r\n<p>I. No node is a bone.</p>\r\n\r\n<p>II. All joints are cartilages.</p>\r\n\r\n<p>III. Some cartilages are nodes.</p>", "option1": "\r\n<p>Only conclusions II and III follow</p>", "option2": "\r\n<p>Only conclusion I follows</p>", "option3": "\r\n<p>Only conclusions I and II follow</p>", "option4": "\r\n<p>None of the conclusions follow</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>From the given statements, the Venn diagram is:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883864_1742883864784781_thump.png\" style=\"width: 100px; height: 128px;\" /></figure>\r\n<br />\r\nNow we consider the given conclusions:</div>\r\n\r\n<p><strong>I. No node is a bone </strong>&rarr; Does not follow &rarr; As some joints are bones and all nodes are joints so there is a possibility that some nodes are bones and thus the conclusion does not follow.<br />\r\n<strong>II. All joints are cartilages </strong><span>&rarr; Does not follow  &rarr; As</span> some joints are bones and all bones are cartilages so it can be said that some joints are cartilages but not all and therefore the conclusion does not follow.<br />\r\n<strong>III. Some cartilages are nodes</strong><span>&rarr; Does not follow  &rarr; As</span> some cartilages with nodes and we cannot assume any relationship and from the figure we can see that no cartilages are nodes so the conclusion does not follow.<br />\r\nSince no conclusions follow.</p>\r\n\r\n<p>Hence <strong>the correct answer is option 4)</strong></p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>In a certain code language, &#39;Camera captures moments&#39; is coded as &#39;391&#39;, &#39;Moments are beautiful&#39; is coded as &#39;987&#39; and &#39;Moments capture beautiful feelings&#39; is coded as &#39;5739&#39; How will &#39;Camera&#39; be coded in that language?</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>9</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>8</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>According to the given information:</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883939_1742883939902555_thump.png\" style=\"width: 350px; height: 94px;\" /></figure>\r\n\r\n<p><span>From the above image, we can conclude that,</span></p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Word</strong></td>\r\n\t\t\t<td><strong>Code</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Moments</td>\r\n\t\t\t<td>9</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Capture</td>\r\n\t\t\t<td>3</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Camera </strong></td>\r\n\t\t\t<td><strong>1</strong></td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>So, the code for <span> &quot;Camera&quot;  </span>is <span> 1.</span></p>\r\n\r\n<p>Hence, the correct answer is  <strong>&quot;1&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p>There are 12 men on a Basketball team and in a game 5 of them play at any one time. If the game is 1 hour long and if each man plays exactly the same amount of time, how many minutes does each man play?</p>", "option1": "\r\n<p>20</p>", "option2": "\r\n<p>25</p>", "option3": "\r\n<p>15</p>", "option4": "\r\n<p>30</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>There are 12 men on a Basketball team and in a game 5 of them play at any one time.</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p><span>If there are 12 men on a basketball team and 5 of them play at any one time during the game,</span></p>\r\n\r\n<p><span>Then the total playing time for the team would be = 5 players x 1 hour = 5 hours</span></p>\r\n\r\n<p>The total playing time in minutes = 5 &times; 60 min = 300 min</p>\r\n\r\n<p>Total playing time by the number of players = <span class=\"math-tex\">\\(\\dfrac{300}{12}\\)</span> = 25 min</p>\r\n\r\n<p><strong><span>&there4; Each man on the basketball team would play for 25 minutes during the game.</span></strong></p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<p><span>If the mean and median of a set of numbers are 8 and 11 respectively, then the mode will be: </span></p>", "option1": "\r\n<p>12</p>", "option2": "\r\n<p>19</p>", "option3": "\r\n<p>17</p>", "option4": "\r\n<p>15</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Mean = 8</p>\r\n\r\n<p>Median = 11</p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>Mode = 3 Median - 2 Mean</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Mode = 3 &times; 11 - 2 &times; 8</p>\r\n\r\n<p>&rArr; Mode = 33 - 16</p>\r\n\r\n<p>&rArr; Mode = 17</p>\r\n\r\n<p><strong>&there4; The mode is 17.</strong></p>\r\n\r\n<p><strong>&there4; Option 3 is the correct answer.</strong></p>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>Five friends Priyanka, Mrinalini, Gitanjali, Arnav and Shivalika participated in a race. Priyanka finished before Mrinalini but behind Gitanjali. Arnav finished before Shivalika but behind Mrinalini.</p>\r\n\r\n<p>Who won the race?</p>", "option1": "\r\n<p>Gitanjali</p>", "option2": "\r\n<p><span>Arnav</span></p>", "option3": "\r\n<p><span>Shivalika</span></p>", "option4": "\r\n<p><span>Mrinalini</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>From the given information,</p>\r\n\r\n<p>There are 5 friends participating in a race. So, the one who will finish the race first, will sit on the top of the table and so on.</p>\r\n\r\n<p>1. Priyanka finished race before Mrinalini but after Gitanjali. </p>\r\n\r\n<p>So, Gitanjali will sit above Priyanka and Mrinalini will sit below Priyanka.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884035_1742884035571611_thump.png\" style=\"width: 50px; height: 119px;\" /></figure>\r\n\r\n<p>2. Arnav finished before Shivalika But behind Mrinalini.</p>\r\n\r\n<p>That means, Arnav will sit after Mrinalini and Shivalika will after Arnav.</p>\r\n\r\n<p>So, This is the final diagram</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884103_1742884103366891_thump.png\" style=\"width: 50px; height: 198px;\" /></figure>\r\n\r\n<p>According to this diagram, it is clear that Gitanjali will sit on of the table and Shivalika will sit at the lower most position.</p>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;Gitanjali&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>&#39;A % B&#39; means &#39;A is the father of B&#39;.</p>\r\n\r\n<p>&#39;A &amp; B&#39; means &#39;A is the sister of B&#39;.</p>\r\n\r\n<p>&#39;A @ B&#39; means &#39;A is the brother of B&#39;.</p>\r\n\r\n<p>If V % Y &amp; T @ Z &amp; U % X &amp; W, then how is Y related to U?</p>", "option1": "\r\n<p>Sister-in-law</p>", "option2": "\r\n<p>Sister</p>", "option3": "\r\n<p>Brother-in-law</p>", "option4": "\r\n<p>Brother</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Preparing the family tree using the following symbols:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884179_1742884179241998_thump.png\" style=\"width: 200px; height: 263px;\" /></figure>\r\n\r\n<p>According to the given information,</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p> </p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"3\">\r\n\t\t\t<p><span>A is</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Symbol</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>%</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&amp;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>@</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Meaning</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>father</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>sister</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>brother</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p> </p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"3\">\r\n\t\t\t<p><span>Of B</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>The given expression is :</p>\r\n\r\n<p><strong>&#39;</strong><span><strong>V % Y &amp; T @ Z &amp; U % X &amp; W&#39; </strong> &rarr; V is father of Y, Y is sister of T, T is the brother of Z, Z is sister of U, U is father of X, X is sister of W.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884208_1742884208160797_thump.png\" style=\"width: 250px; height: 179px;\" /></figure>\r\n\r\n<p><span>&there4; Here, Y is sister of U.</span></p>\r\n\r\n<p><span>Hence, the correct answer is <strong>&quot;Sister&quot;.</strong></span></p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<div>\r\n<p><strong>Directions: </strong>Question below consists of a question and two statements numbered I and II given below it. You have to decide whether the data provided in the statements are sufficient to answer the question.</p>\r\n\r\n<p>Eight persons M, N, O, P, Q, R, S and T are sitting in a row facing north. Who sits third to the left of O?</p>\r\n\r\n<p><strong>Statement I: </strong>P sits immediate right of Q. One person sits between M and T. R sits to the left of S, who is adjacent to M.</p>\r\n<strong>Statement II: </strong>N sits second to the left of M, who sits immediate left of O. P sits to the right of T.</div>", "option1": "\r\n<p>Data in statement I alone sufficient to answer the question, while the data in statement II alone are not sufficient to answer the question.</p>", "option2": "\r\n<p>Data in statement II alone are sufficient to answer the question, while the data in statement I alone are not sufficient to answer the question.</p>", "option3": "\r\n<p>Data either in statement I alone or in statement II alone are sufficient to answer the question.</p>", "option4": "\r\n<p>Data in both the statements I and II together are not sufficient to answer the question.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p><strong>Statement I: </strong>P sits immediate right of Q. One person sits between M and T. R sits to the left of S, who is adjacent to M.</p>\r\n\r\n<p>Therefore, we cannot determine the person sitting third to the left of O.</p>\r\n\r\n<p><strong>Statement II: </strong>N sits second to the left of M, who sits immediate left of O. P sits to the right of T.</p>\r\n\r\n<p>In this Statement, M is immediate left of O and N is second to the left of M.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884946_1742884946822028_thump.png\" style=\"width: 300px; height: 41px;\" /></figure>\r\n\r\n<p>Therefore, N sits third to the left of O.</p>\r\nHence, Data in statement II alone are sufficient to answer the question, while the data in statement I alone are not sufficient to answer the question.</div>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>Select the set in which the numbers are related in the same way as are the numbers of the following set.<br />\r\n(NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 &ndash; Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</p>\r\n\r\n<p>(182, 170, 97)</p>\r\n\r\n<p>(156, 128, 92)</p>", "option1": "\r\n<p>(156, 194, 79)</p>", "option2": "\r\n<p>(121, 102, 61)</p>", "option3": "\r\n<p>(98, 74, 54)</p>", "option4": "\r\n<p>(138, 130, 73)</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is :</p>\r\n\r\n<p><strong>Logic: (First number - Third number) x 2 = Second number.</strong></p>\r\n\r\n<p>For, (182, 170, 97)</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742885259_1742885259400808_thump.png\" style=\"width: 100px; height: 111px;\" /></figure>\r\n\r\n<p>For, (156, 128, 92)</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742885287_1742885287635165_thump.png\" style=\"width: 100px; height: 114px;\" /></figure>\r\n\r\n<p><span>Apply the logic on each options,</span></p>\r\n\r\n<p><strong><span>Option 1 : </span></strong><span>(156, 194, 79)</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742885600_1742885600454358_thump.png\" style=\"width: 100px; height: 111px;\" /></figure>\r\n\r\n<p><span>The logic does not apply here.</span></p>\r\n\r\n<p><strong><span>Option 2 : </span></strong><span>(121, 102, 61)</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742889959_1742889959944858_thump.png\" style=\"width: 100px; height: 112px;\" /></figure>\r\n\r\n<p><span>The logic does not apply here.</span></p>\r\n\r\n<p><strong><span>Option 3 : </span></strong><span>(98, 74, 54)</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893376_1742893376549111_thump.png\" style=\"width: 100px; height: 119px;\" /></figure>\r\n\r\n<p><span>The logic does not apply here.</span></p>\r\n\r\n<p><strong><span>Option 4 : </span></strong><span>(138, 130, 73)</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893573_1742893573877625_thump.png\" style=\"width: 100px; height: 113px;\" /></figure>\r\n\r\n<p><span>The logic apply here.</span></p>\r\n\r\n<p><span>Hence , the correct answer is <strong>&#39;Option 4&#39;</strong>.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n<p>In parallelogram ABCD, if two points P and Q are taken on diagonal BD such that DP = BQ, which of the following statement (s) is/are correct?</p>\r\n\r\n<p>(a) &Delta;APD &cong; &Delta;CQB</p>\r\n\r\n<p>(b) AP = CQ</p>\r\n\r\n<p>(c) AQ = CP</p>", "option1": "\r\n<p>only (a) &amp; (c) </p>", "option2": "\r\n<p><span>only (b) and (c)</span></p>", "option3": "\r\n<p>(a), (b) and (c)</p>", "option4": "\r\n<p>only (c) </p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>ABCD is a parallelogram</p>\r\n\r\n<p>DP = BQ</p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>We have to draw the diagram according to the question and justify all the five statements that are given to find the correct answer.</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let&#39;s draw the diagram according to the question.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893949_1742893949317374_thump.png\" style=\"width: 200px; height: 159px;\" /></figure>\r\n\r\n<p>Let,s justify statement (a),</p>\r\n\r\n<p>In &Delta;APD and &Delta;CQB,</p>\r\n\r\n<p>DP = BQ (Given)</p>\r\n\r\n<p>&ang;ADP = &ang;CBQ  [∵ AD || BC]</p>\r\n\r\n<p>AD = BC  [Opposite side of the ABCD <span>parallelogram</span>]</p>\r\n\r\n<p>&there4; <span>&Delta;APD &cong; &Delta;CQB</span></p>\r\n\r\n<p><strong><span>The statement (a) is correct.</span></strong></p>\r\n\r\n<p><span>Let,s justify statement (b),</span></p>\r\n\r\n<p><span>We got that &Delta;APD &cong; &Delta;CQB</span></p>\r\n\r\n<p><span>Therefore, AP = CQ</span></p>\r\n\r\n<p><strong><span>The statement (b) is correct.</span></strong></p>\r\n\r\n<p><span>Let,s justify statement (c),</span></p>\r\n\r\n<p>We got that, &Delta;AQB &cong; &Delta;CPD</p>\r\n\r\n<p>&there4; AQ = CP</p>\r\n\r\n<p><strong><span>The statement (c ) is correct.</span></strong></p>\r\n\r\n<p><strong><span>Hence, (a), (b), and (c) are correct statements.</span></strong></p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<div>\r\n<p>Select the option that will make the second pair analogous to the first pair.</p>\r\nBastar : Chhattisgarh :: ltarsi : ?</div>", "option1": "\r\n<p>Arunachal Pradesh</p>", "option2": "\r\n<p>Uttar Pradesh</p>", "option3": "\r\n<p>Uttarakhand</p>", "option4": "\r\n<p>Madhya Pradesh</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed in the given pair:</p>\r\n\r\n<p><span>Bastar : Chhattisgarh &rarr; Bastar is a city in Chhattisgarh.</span></p>\r\n\r\n<p><span>Similarly,</span></p>\r\n\r\n<p><span>ltarsi : ? &rarr; Itarsi is a city in <strong>Madhya Pradesh.</strong></span></p>\r\n\r\n<p><span>Here, <strong>&#39;Itarsi : Madhya Pradesh&#39; </strong>is the correct pair.</span></p>\r\n\r\n<p><span>Hence, the correct answer is <strong>&quot;Option (4)&quot;.</strong></span></p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p><span>Rohan started from his home towards the east, and after walking for 5 m, turned left. From there, after walking for 15 m, he turned right and walked for 5 m to reach a flower shop. In which direction is his home with respect to the flower shop? (All turns are 90&deg; turns only)</span></p>", "option1": "\r\n<p><span>North</span></p>", "option2": "\r\n<p><span>West</span></p>", "option3": "\r\n<p><span>South-west</span></p>", "option4": "\r\n<p><span>South-east</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>According to given conditions,</p>\r\n\r\n<ul>\r\n\t<li>Rohan started form his home toward the east, walking 5 m.</li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894032_1742894032909641_thump.png\" style=\"width: 140px; height: 61px;\" /></figure>\r\n\r\n<ul>\r\n\t<li>Turned left from there after waling for 15 m.</li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894089_1742894089505959_thump.png\" style=\"width: 140px; height: 173px;\" /></figure>\r\n\r\n<ul>\r\n\t<li>He turned right and walked for 5 m to reach flower shop.</li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894170_1742894170162343_thump.png\" style=\"width: 200px; height: 186px;\" /></figure>\r\n\r\n<p>Clearly, At last Rohan&#39;s home is to the South-west of the flower shop.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894954_1742894954709138_thump.png\" style=\"width: 400px; height: 315px;\" /></figure>\r\n\r\n<p>Hence, &lsquo;South-west&rsquo; is the correct answer.</p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>Select the set in which the numbers are related in the same way as are the numbers of the following set.</p>\r\n\r\n<p>(NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 &ndash; Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</p>\r\n\r\n<p>(27, 64, 19)</p>\r\n\r\n<p>(32, 441, 11)</p>", "option1": "\r\n<p>(49, 900, 57)</p>", "option2": "\r\n<p>(24, 169, 17)</p>", "option3": "\r\n<p>(64, 729, 37)</p>", "option4": "\r\n<p>(27, 484, 19)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<p><strong>(First number - Third number) = (X) <sup>2</sup> = Second number.</strong></p>\r\n\r\n<p>(27, 64, 19) &rarr; (27 - 19) = (8) <sup>2</sup> = 64 <strong>(Second number).</strong></p>\r\n\r\n<p>And,</p>\r\n\r\n<p>(32, 441, 11) &rarr; (32 - 11) = (21) <sup>2</sup> = 441 <strong>(Second number).</strong></p>\r\n\r\n<p>Similarly,</p>\r\n\r\n<p>(64, 729, 37) &rarr; (64 -37) = (27) <sup>2</sup> = 729  <strong>(Second number).</strong></p>\r\n\r\n<p>Hence, the correct answer is  <strong>&quot;(64, 729, 37)&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.</p>\r\n\r\n<p>GROW, FSNX, ETMY, ?, CVKA</p>", "option1": "\r\n<p>DULX</p>", "option2": "\r\n<p>DVLA</p>", "option3": "\r\n<p>DVLZ</p>", "option4": "\r\n<p>DULZ</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742895163_1742895163645247_thump.png\" style=\"width: 100px; height: 222px;\" /></figure>\r\n\r\n<p>So, &#39;<span>DULZ</span>&#39; will replace the question mark in the given series.</p>\r\n\r\n<p>Hence, the correct answer is <span>&quot;DULZ&quot;</span>.</p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n<p>If 3a + 4b : 2a - b = 11 : 5, then <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span> is equal to</p>", "option1": "\r\n<p><span>\\(\\dfrac{38}{7}\\)</span>a</p>", "option2": "\r\n<p><span>\\(\\dfrac{38}{7}\\)</span>b</p>", "option3": "\r\n<p><span>\\(\\dfrac{31}{7}\\)</span>b</p>", "option4": "\r\n<p><span>\\(\\dfrac{29}{7}\\)</span>b</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>3a + 4b : 2a - b = 11 : 5</p>\r\n\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> - ab + b<sup>2</sup>)</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>&rArr; <span><span class=\"math-tex\">\\(\\dfrac{3a + 4b}{2a - b} = \\dfrac{11}{5}\\)</span></span></p>\r\n\r\n<p>&rArr; 5 &times; (3a + 4b) = 11 &times; (2a - b)</p>\r\n\r\n<p>&rArr; 15a + 20b = 22a - 11b</p>\r\n\r\n<p>&rArr; 7a = 31b</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{a}{b}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span></p>\r\n\r\n<p>&rArr; a = <strong><span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span></strong>b</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span></p>\r\n\r\n<p><span>&rArr;  \\(\\dfrac{(a + b)(a^2-ab+b^2)}{a^2-ab+b^2}\\)</span></p>\r\n\r\n<p>&rArr; (a + b) = <span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span>b + b= <span class=\"math-tex\">\\(\\dfrac{38}{7}\\)</span>b</p>\r\n\r\n<p>&there4; <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span><strong> = <span class=\"math-tex\">\\(\\dfrac{38}{7}\\)</span>b</strong></p>", "question_heading": ""}, {"sr_no": 27, "question": "<p>If 40% of 40% of x is 40 then ‘x’ is</p>", "option1": "<p>100</p>", "option2": "<p>250</p>", "option3": "<p>400</p>", "option4": "<p>None of these</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>Given:</strong></p><p><span>40% of 40% of x is 40</span></p><p><strong><span>Calculation:</span></strong></p><p><span>40% of 40% of x is 40</span></p><p><span>⇒ <span class=\"math-tex\">\\(\\frac{40}{{100}}\\)</span> × <span class=\"math-tex\">\\(\\frac{40}{{100}}\\)</span> × (x) = 40</span></p><p><span>⇒ <span class=\"math-tex\">\\(\\frac{2}{{5}}\\)</span> × <span class=\"math-tex\">\\(\\frac{2}{{5}}\\)</span> × (x) = 40</span></p><p><span>⇒ <span class=\"math-tex\">\\(\\frac{4x}{{25}}\\)</span> = 40</span></p><p><span>⇒ <span class=\"math-tex\">\\(\\frac{x}{{25}}\\)</span> = 10</span></p><p><span>⇒ x = (25 × 10) = <strong>250</strong></span></p><p><strong><span>∴ The required value of x is 250.</span></strong></p>", "question_heading": ""}, {"sr_no": 28, "question": "<p>In what ratio does the point P(7, 3) divide the line segment joining A(4, -3) and B(9, 7)? </p>", "option1": "<span>2  &ratio;  3</span>", "option2": "<span>3  &ratio;  4 </span>", "option3": "<span>3  &ratio;  3</span>", "option4": "<span>3  &ratio;  2 </span>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><span>Given:</span></p><p>Points A(4, -3), B(9, 7) and P(7, 3)</p><p><span>Formula Used:</span></p><p>If a point (x, y) divides a line segment in ratio m : n whose endpoints are (x<span>1</span>, y<span>1</span>) and (x<span>2</span>, y<span>2</span>),</p><p>Then the y-coordinates of that point are <span class=\"math-tex\">\\(\\dfrac{my_2 + ny_1}{m+n}\\)</span>.</p><p><span>Calculation:</span></p><p>Using the above formulae,</p><p>We have x<span>1</span> = 4, y<span>1</span> = - 3, x<span>2</span> = 9, y<span>2</span> = 7</p><p>The coordinates of the point of division are (7, 3).</p><p>On comparing the y-coordinate we have,</p><p><span class=\"math-tex\">\\(\\dfrac{7m + (-3)n}{m+n}\\)</span> = 3</p><p>⇒ 7m - 3n = 3m + 3n</p><p>⇒ 7m - 3m = 3n + 3n</p><p>⇒ 4m = 6n</p><p>⇒ <span class=\"math-tex\">\\(\\dfrac{m}{n}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{6}{4}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{3}{2}\\)</span></p><strong><span>∴ Required ratio = 3 : 2.</span></strong>", "question_heading": ""}, {"sr_no": 29, "question": "\r\n<p><strong>Direction: </strong>Which Answer-Figure will complete the pattern in the Question-Figure?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742973883_1742973883306007_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742973953_1742973953515321_thump.png\" style=\"width: 200px; height: 61px;\" /></figure>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>B</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Given:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974163_1742974163121135_thump.png\" style=\"width: 200px; height: 67px;\" /></figure>\r\n\r\n<p>Hence, <strong>D  </strong>is the correct answer.</p>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n\r\n\r\n<p>Study the given graph and answer the question that follows.</p>\r\n\r\n<p>Also, the question should be &quot;What is the average number (in hundreds) of candidates to have passed per institution?</p>", "option1": "\r\n\r\n\r\n<p>1460</p>", "option2": "\r\n\r\n\r\n<p>1280</p>", "option3": "\r\n\r\n\r\n<p>1500</p>", "option4": "\r\n\r\n\r\n<p>1680</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p>Concept used:</p>\r\n\r\n<p>Average = Sum of all the values/Total no. of values</p>\r\n\r\n<p>Calculation:</p>\r\n\r\n<p>According to the question,</p>\r\n\r\n<p>Candidate passed = A + B + C + D + E</p>\r\n\r\n<p>Candidate passed = 1200 + 2000 + 800 + 2600 + 1800 = 8400</p>\r\n\r\n<p>Average = 8400/5 = 1680</p>\r\n\r\n<p><strong>&there4; The average number (in hundreds) of candidates to have passed per institution is 1680.</strong></p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p>What should come in the place of the question mark &lsquo;?&rsquo; in the following question?</p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3 </sup>&times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>", "option1": "\r\n<p>2.5</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>3.5</p>", "option4": "\r\n<p>4</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3</sup> &times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p><strong>Concept Used:</strong></p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3</sup> &times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; 11 &times; 11 &times; (11)<sup>2</sup> &times; (11)<sup>1/2</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; (11)<sup>1 + 1 + 2 + 0.5</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; (11)<sup>4.5</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>On comparing power</p>\r\n\r\n<p>4.5 = ? + 0.5</p>\r\n\r\n<p>&rArr; ? = 4.5 &ndash; 0.5</p>\r\n\r\n<p>&rArr; 4</p>\r\n\r\n<p><strong>&there4;</strong><strong>The value of &lsquo;?&rsquo;</strong><strong>is 4.</strong></p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>Mita&#39; s income is 25% more than that of Sita. What percent is Sita&#39; s income less than that of Mita?</p>", "option1": "\r\n<p>25</p>", "option2": "\r\n<p>24</p>", "option3": "\r\n<p><span>\\(22\\frac{1}{2}\\)</span></p>", "option4": "\r\n<p>20</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>Mita&#39;s income is 25% more than that of Sita.</span></p>\r\n\r\n<p><strong><span>Calculation:</span></strong></p>\r\n\r\n<p><span>Let the income of Sita be 100.</span></p>\r\n\r\n<p><span>Income of Mita = 100 &times; <span class=\"math-tex\">\\(\\dfrac{100+25}{100}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 100 &times;  <span class=\"math-tex\">\\(\\dfrac{5}{4}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 125</span></p>\r\n\r\n<p><span>Percentage less the income of Sita w.r.t Mita =  <span class=\"math-tex\">\\(\\dfrac{125-100}{125}\\times 100\\)</span></span></p>\r\n\r\n<p><span>&rArr;  <span>\\(\\dfrac{25}{125}\\times 100\\) </span> = 20%</span></p>\r\n\r\n<p><strong><span>&there4;The answer is 20%.</span></strong></p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>Select the number from the given alternatives which can replace the question mark (?) in the following series.</p>\r\n\r\n<p>4127, 4248, 4329, 4378, ?</p>", "option1": "\r\n<p>4430</p>", "option2": "\r\n<p>4403</p>", "option3": "\r\n<p>4304</p>", "option4": "\r\n<p>4344</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<p>Given series is <span>4127, 4248, 4329, 4378, ?</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974466_1742974466270011_thump.png\" style=\"width: 200px; height: 105px;\" /></figure>\r\n\r\n<p>Therefore, &#39;<span>4403</span>&#39; is the next number.</p>\r\n\r\n<p>Hence, &quot;<span>Option (2)</span>&quot; is the correct answer.</p>", "question_heading": ""}, {"sr_no": 34, "question": "In पुiौ तहधौपiयn, पुनधध ौपोपधंधnपौ ोनध giॅधn, ीियियथधक ृद पथय cयncिहौiयnौ nहंृधनधक I ोnक II. Aौौहंing पुध ौपोपधंधnपौ पय ृध पनहध, धॅधn iी पुधद ौधधं पय ृध ोप ॅोनiोncध थiपु cयंंयnिद ाnयथn ीोcपौ, कधciकध थुicु यी पुध cयncिहौiयn(ौ) ियgicोििद ीियियथ(ौ) ीनयं पुध ौपोपधंधnपौ. Sपोपधंधnपौ: Aिि nयपधृययो ोनध ौपोपiयnधनiधौ. Sयंध ौपोपiयnधनiधौ ोनध ूधnciिस. Aिि ूधnciिस ोनध cयौिपद. Cयncिहौiयnौ: I. Aिि nयपधृययो ोनध ूधnciिस. II. Aिि ौपोपiयnधनiधौ ोनध cयौिपद.", "option1": "\r\n<p>Only conclusion Il follows.</p>", "option2": "\r\n<p><span>Only conclusion I follows.</span></p>", "option3": "\r\n<p><span>Neither conclusion I nor Il follows.</span></p>", "option4": "\r\n<p><span>Both conclusions I and II follow.</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The least possible Venn Diagram is as follows:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974524_1742974524590782_thump.png\" style=\"width: 300px; height: 45px;\" /></figure>\r\n\r\n<p><span>Conclusions:</span></p>\r\n\r\n<p>I. All notebooks are pencils. &rarr; Does not follow (because all notebooks are stationaries and only some stationaries are pencils, so all notebooks can&#39;t be pencils.)</p>\r\n\r\n<p><span>II. All stationeries are costly.</span> &rarr; Does not follow (because <span>all pencils are costly and only some stationaries are costly, so all stationaries can&#39;t be costly .</span>)</p>\r\n\r\n<p>Hence, <span>&ldquo;<strong>Neither conclusion I nor Il follows</strong>. &rdquo;.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>There are some hens and goats in a field. The sum of all the heads is 77 and the sum of the legs is 248. The number of hens in the farm is?</p>", "option1": "\r\n<p>25</p>", "option2": "\r\n<p>30</p>", "option3": "\r\n<p>40</p>", "option4": "\r\n<p>47</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>The sum of all the heads of hens and goats = 77</span></p>\r\n\r\n<p><span>The sum of the legs of hens and goats = 248</span></p>\r\n\r\n<p><strong><span>Calculation:</span></strong></p>\r\n\r\n<p><span>Let the number of heads of hens and goats be x and y respectively.</span></p>\r\n\r\n<p><span>Now, according to the question</span></p>\r\n\r\n<p><span>The sum of all the heads of hens and goats = 77</span></p>\r\n\r\n<p><span>&rArr; <strong>x + y = 77 </strong>        -----(1)</span></p>\r\n\r\n<p>And, sum of their legs = 248</p>\r\n\r\n<p>As hens have two legs each and goats have four legs each.</p>\r\n\r\n<p>So, 2x + 4y = 248       -----(2)</p>\r\n\r\n<p>Multiplying equation (1) with 2, we get</p>\r\n\r\n<p>&rArr; <strong>2x + 2y = 154</strong>      -----(3)</p>\r\n\r\n<p>Now, subtracting equation (3) from (2), we get</p>\r\n\r\n<p>&rArr; 2x + 4y - 2x - 2y = (248 - 154)</p>\r\n\r\n<p>&rArr; 2y = 94</p>\r\n\r\n<p>&rArr; <strong>y = 47</strong></p>\r\n\r\n<p>Putting the value of y in equation (1), we get</p>\r\n\r\n<p>&rArr; x + 47 = 77</p>\r\n\r\n<p>&rArr; x = (77 - 47) = <strong>30</strong></p>\r\n\r\n<p><strong>&there4; The required number of hens on the farm is 30.</strong></p>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n<p>Select the option in which the given figure is embedded. (Rotation is not allowed)</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974710_1742974710303571_thump.png\" style=\"width: 80px; height: 53px;\" /></figure>", "option1": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974757_1742974757972000_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option2": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974828_1742974828655305_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option3": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974863_1742974863888319_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option4": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974918_1742974918117875_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The image embedded in given figure is as shown below:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974946_1742974946625129_thump.png\" style=\"width: 300px; height: 390px;\" /></figure>\r\n\r\n<p>Hence, <span>&quot;O ption 1&quot; </span> is the correct answer.</p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n<p>ABC is a triangle, PQ is line segment intersecting AB in P and AC in Q and PQ II BC. The ratio of AP : BP = 3 : 5 and length of BC is 48 cm. The length of PQ is:</p>", "option1": "\r\n<p><span>18 cm</span></p>", "option2": "\r\n<p><span>28 cm</span></p>", "option3": "\r\n<p><span>48 cm</span></p>", "option4": "\r\n<p><span>38 cm</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>PQ II BC. </span></p>\r\n\r\n<p><span>The ratio of AP : BP = 3 : 5</span></p>\r\n\r\n<p><span>Length of BC is 48 cm</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976288_1742976288555495_thump.png\" style=\"width: 200px; height: 206px;\" /></figure>\r\n\r\n<p>AP ∶ BP = 3 ∶ 5 </p>\r\n\r\n<p>AB = 3 + 5</p>\r\n\r\n<p>&rArr; 8 units</p>\r\n\r\n<p>Here,</p>\r\n\r\n<p>&ang;A is common in <span>&Delta;APQ and &Delta;ABC</span></p>\r\n\r\n<p><span>PQ II BC</span></p>\r\n\r\n<p><span>So,</span></p>\r\n\r\n<p>&Delta;APQ &sim; &Delta;ABC</p>\r\n\r\n<p>AP/AB = PQ/BC</p>\r\n\r\n<p>&rArr; 3/8 = PQ/48</p>\r\n\r\n<p>&rArr; PQ = 48 &times; 3/8 </p>\r\n\r\n<p>&rArr; <span>PQ</span> = 18 cm</p>\r\n\r\n<p><strong>&there4; The <span>length of PQ is 18 cm.</span></strong></p>", "question_heading": ""}, {"sr_no": 38, "question": "\r\n<p>Due to a storm, pole of a telegraph is bent over at a point on the ground. The top of the pole which is on the ground is 8&radic;3 on away from its bottom and makes an angle of 30&deg;. Then the height of the pole was?</p>", "option1": "\r\n<p>23</p>", "option2": "\r\n<p>24</p>", "option3": "\r\n<p>10</p>", "option4": "\r\n<p>16</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976354_1742976354234511_thump.png\" style=\"width: 150px; height: 149px;\" /></figure>\r\n\r\n<p>Length of telegraph = AC</p>\r\n\r\n<p>AC = AB + BC</p>\r\n\r\n<p>AB = BD</p>\r\n\r\n<p><span class=\"math-tex\">\\(tan30^\\circ = \\frac{{BC}}{{8\\sqrt 3 }}\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(BC = 8\\sqrt 3 \\times \\frac{1}{{\\sqrt 3 }} = 8\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(Sin30^\\circ = \\frac{{BC}}{{BD}}\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{1}{2} = \\frac{8}{{{\\rm{BD}}}}\\)</span></p>\r\n\r\n<p>BD = 16</p>\r\n\r\n<p>Length of telegraph AC = AB + BC</p>\r\n\r\n<p>AC = BD + BC</p>\r\n\r\n<p>AC = 16 + 8</p>\r\n\r\n<p>AC = 24</p>", "question_heading": ""}, {"sr_no": 39, "question": "\r\n<p>Study the given table and answer the question that follows.</p>\r\n\r\n<p>The table shows the number of runs scored by a cricket player in different countries in different years.</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Year/</strong></p>\r\n\r\n\t\t\t<p><strong>Country</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Country</strong></p>\r\n\r\n\t\t\t<p><strong>A</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Country</strong></p>\r\n\r\n\t\t\t<p><strong>B</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Country </strong></p>\r\n\r\n\t\t\t<p><strong>C</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>Country </strong></p>\r\n\r\n\t\t\t<p><strong>D</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2018</td>\r\n\t\t\t<td>30</td>\r\n\t\t\t<td>45</td>\r\n\t\t\t<td>50</td>\r\n\t\t\t<td>38</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2019</td>\r\n\t\t\t<td>25</td>\r\n\t\t\t<td>32</td>\r\n\t\t\t<td>40</td>\r\n\t\t\t<td>50</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2020</td>\r\n\t\t\t<td>25</td>\r\n\t\t\t<td>35</td>\r\n\t\t\t<td>38</td>\r\n\t\t\t<td>50</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2021</td>\r\n\t\t\t<td>52</td>\r\n\t\t\t<td>29</td>\r\n\t\t\t<td>45</td>\r\n\t\t\t<td>62</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>In which country did the player score the maximum number of runs in aggregate during these four years, taken together?</p>", "option1": "\r\n<p>D</p>", "option2": "\r\n<p>A</p>", "option3": "\r\n<p>B</p>", "option4": "\r\n<p>C</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>The table shows the number of runs scored by a cricket player in different countries in different years.</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Year/</span></p>\r\n\r\n\t\t\t<p><span>Country</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Country</span></p>\r\n\r\n\t\t\t<p><span>A</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Country</span></p>\r\n\r\n\t\t\t<p><span>B</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Country </span></p>\r\n\r\n\t\t\t<p><span>C</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>Country </span></p>\r\n\r\n\t\t\t<p><span>D</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2018</td>\r\n\t\t\t<td>30</td>\r\n\t\t\t<td>45</td>\r\n\t\t\t<td>50</td>\r\n\t\t\t<td>38</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2019</td>\r\n\t\t\t<td>25</td>\r\n\t\t\t<td>32</td>\r\n\t\t\t<td>40</td>\r\n\t\t\t<td>50</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2020</td>\r\n\t\t\t<td>25</td>\r\n\t\t\t<td>35</td>\r\n\t\t\t<td>38</td>\r\n\t\t\t<td>50</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2021</td>\r\n\t\t\t<td>52</td>\r\n\t\t\t<td>29</td>\r\n\t\t\t<td>45</td>\r\n\t\t\t<td>62 </td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p><strong>Calculations:</strong></p>\r\n\r\n<p>For country A = 30 + 25 + 25 + 52 = 132</p>\r\n\r\n<p><span>For country B = 45 + 32 + 35 + 29 = 141</span></p>\r\n\r\n<p><span>For country C = 50 + 40 + 38 + 45 = 173</span></p>\r\n\r\n<p><span>For country D = 38 + 50 + 50 + 62 = 200</span></p>\r\n\r\n<p><strong><span>&there4; The maximum n
