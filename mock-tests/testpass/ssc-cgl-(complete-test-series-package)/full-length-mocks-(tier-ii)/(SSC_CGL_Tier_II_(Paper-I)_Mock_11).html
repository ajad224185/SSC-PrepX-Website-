umber of runs in aggregate during these four years are of Country D.</span></strong></p>", "question_heading": ""}, {"sr_no": 40, "question": "\r\n<p>During a discussion, a group of 8 classmates, namely Sunita, Faheem, Anupam, Dickson, Bano, Dilan, Juhi and Punit, are sitting in a circle, facing the centre. Bano is sitting between Punit and Dilan. Dickson is sitting between Anupam and Punit. Bano and Juhi are not sitting opposite each other. Sunita is third to the left of Bano and second to the right of Anupam.</p>\r\n\r\n<p>Who is third to the left of Sunita?</p>", "option1": "\r\n<p>Bano</p>", "option2": "\r\n<p>Anupam</p>", "option3": "\r\n<p>Faheem</p>", "option4": "\r\n<p>Dickson</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>8 Classmates: </strong><span>Sunita, Faheem, Anupam, Dickson, Bano, Dilan, Juhi and Punit</span></p>\r\n\r\n<p>1) <span>Sunita is third to the left of Bano</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976489_1742976489803342_thump.png\" style=\"width: 200px; height: 174px;\" /></figure>\r\n\r\n<p>Bano is between Punit and Dilan.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976517_1742976517370983_thump.png\" style=\"width: 200px; height: 196px;\" /></figure>\r\n\r\n<p>3) Dickson between Anupma and Punit</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976575_1742976574923663_thump.png\" style=\"width: 200px; height: 172px;\" /></figure>\r\n\r\n<p>4) Bano and Juhi are not opposite.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976611_1742976611366867_thump.png\" style=\"width: 200px; height: 178px;\" /></figure>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;Dickson&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 41, "question": "\r\n<p>The diagonal of square is 20 <span>cm </span>, then perimeter of the square must be:</p>", "option1": "\r\n<p><span>10 &radic;2  cm</span></p>", "option2": "\r\n<p><span>40  cm</span></p>", "option3": "\r\n<p><span>200  cm</span></p>", "option4": "\r\n<p><span>40 &radic;2  cm</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>The diagonal of the square is 20 cm.</p>\r\n\r\n<p><strong>Concept used: </strong></p>\r\n\r\n<p>Perimter = 2&radic;2 x diagonal</p>\r\n\r\n<p><strong>Calculation: </strong></p>\r\n\r\n<p>&rArr; Perimeter = 2&radic;2 x 20 = 40&radic;2 cm</p>\r\n\r\n<p><strong>&there4; The diagonal of square is 20 cm, then perimeter of the square must be 40 &radic;2 cm.</strong></p>", "question_heading": ""}, {"sr_no": 42, "question": "\r\n<p><span>In a certain code language, &#39;CATHOLIC&#39; is coded as &#39;61231141536&#39;, and &#39;ENTIRELY&#39; is coded as &#39;2172332121528&#39;. How will &#39;INFORMAL&#39; be coded in that language?</span></p>", "option1": "\r\n<p>617972116415</p>", "option2": "\r\n<p>31134151018</p>", "option3": "\r\n<p>317942116115</p>", "option4": "\r\n<p>314641813112</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977184_1742977184922162_thump.png\" style=\"width: 400px; height: 96px;\" /></figure>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977250_1742977250598356_thump.png\" style=\"width: 200px; height: 126px;\" /></figure>\r\n\r\n<p>The logic followed here is :-</p>\r\n\r\n<p><span>Consonants represents alphabet positional values +3.</span></p>\r\n\r\n<p><span>Vowels represents vowel positional order values.</span></p>\r\n\r\n<p><span>&#39;CATHOLIC&#39; is coded as &#39;61231141536&#39;.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977343_1742977343243139_thump.png\" style=\"width: 200px; height: 110px;\" /></figure>\r\n\r\n<p><span>And</span></p>\r\n\r\n<p><span>&#39;ENTIRELY&#39; is coded as &#39;2172332121528&#39;.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977375_1742977375456186_thump.png\" style=\"width: 200px; height: 111px;\" /></figure>\r\n\r\n<p><span>Similarly,</span></p>\r\n\r\n<p><span>&#39;INFORMAL&#39; will be coded as :</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977450_1742977450799491_thump.png\" style=\"width: 200px; height: 110px;\" /></figure>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;<span>317942116115&quot;.</span></strong></p>", "question_heading": ""}, {"sr_no": 43, "question": "\r\n<p>A group of 84 men can complete a work in 17 days. In how many days that work can be completed by 119 men?</p>", "option1": "\r\n<p>12 days</p>", "option2": "\r\n<p>18 days</p>", "option3": "\r\n<p>14 days</p>", "option4": "\r\n<p>15 days</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>84 men complete a work in 17 days.</p>\r\n\r\n<p><strong>Formula Used:</strong></p>\r\n\r\n<p>M <sub>1</sub>D <sub>1</sub> = M <sub>2</sub>D <sub>2</sub></p>\r\n\r\n<p>Where M <sub>1</sub> and M <sub>2</sub> are numbers of men</p>\r\n\r\n<p>D <sub>1</sub> and D <sub>2</sub> are the numbers of days.</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>We have,</p>\r\n\r\n<p>&rArr; M <sub>1</sub> = 84, M <sub>2</sub> = 119, D <sub>1</sub> = 17, D <sub>2</sub> = ?</p>\r\n\r\n<p>&rArr; 84 &times; 17 = 119 &times; D <sub>2</sub></p>\r\n\r\n<p>&rArr; D <sub>2</sub> =  <span class=\"math-tex\">\\(\\frac{1428}{119}\\)</span></p>\r\n\r\n<p>&rArr; D <sub>2</sub> = 12</p>\r\n\r\n<p><strong>&there4; <span> In 12 days that work can be completed by 119 men.</span></strong></p>", "question_heading": ""}, {"sr_no": 44, "question": "\r\n<p>If the following sheet is folded to form a cube, which of the given figure are possible ?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977534_1742977534163345_thump.png\" style=\"width: 100px; height: 133px;\" /></figure>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977585_1742977585986449_thump.png\" style=\"width: 300px; height: 91px;\" /></figure>", "option1": "\r\n<p>Only C and B</p>", "option2": "\r\n<p>Only A and C</p>", "option3": "\r\n<p>Only A and D</p>", "option4": "\r\n<p>Only C and D</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>For the given open dice:</p>\r\n\r\n<p>All the four letters except P and R are out of the line. So, they are opposite of each other as shown below:</p>\r\n\r\n<p> </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977629_1742977629430227_thump.png\" style=\"width: 100px; height: 116px;\" /></figure>\r\n\r\n<p>Next, we take all the letters which are in line. Here, Q is opposite of U and T is opposite of S.</p>\r\n\r\n<p> </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977691_1742977691585976_thump.png\" style=\"width: 100px; height: 116px;\" /></figure>\r\n\r\n<p>Thus, we can say opposite of</p>\r\n\r\n<p>Q &hArr; U, T <span>&hArr; S, P &hArr; R</span></p>\r\n\r\n<p><span>So, when the cube is folded we will have the cube as : </span></p>\r\n\r\n<p> </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977720_1742977720561559_thump.png\" style=\"width: 150px; height: 90px;\" /></figure>\r\n\r\n<p><span>Hence, the correct answer is &#39;<u><strong>option 2</strong></u>&#39;.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": "\r\n<p>Select the figure from among the given options that can replace the question mark (?) in the following series.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977828_1742977828614912_thump.png\" style=\"width: 300px; height: 41px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977878_1742977878529883_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977949_1742977949264416_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977974_1742977974972552_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978046_1742978046261719_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The logic followed here is:</p>\r\n\r\n<p>Step I: E is moving at corners with its mirror image in the next box.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978076_1742978076265408_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>Step II: P <span> is moving at corners with its mirror image in the next box.</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978132_1742978132346824_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>Step III: Lines are increasing by +1 to its next boxes.</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978161_1742978161374811_thump.png\" style=\"width: 300px; height: 65px;\" /></figure>\r\n\r\n<p>So, the series will be:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978415_1742978415153155_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>Hence, the correct answer is  <span>&quot;Option 2&quot; </span>.</p>", "question_heading": ""}, {"sr_no": 46, "question": "\r\n<p>Which of the given letter-clusters will replace the question mark (?) in the following series?</p>\r\n\r\n<p>EGAU, GKCX, IOEA, ?, MWIG</p>", "option1": "\r\n<p>KSHD</p>", "option2": "\r\n<p>KTGD</p>", "option3": "\r\n<p>KSGD</p>", "option4": "\r\n<p>KTHD</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978468_1742978467123375_thump.png\" style=\"width: 400px; height: 90px;\" /></figure>\r\n\r\n<div>The pattern followed here is:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978509_1742978509224015_thump.png\" style=\"width: 100px; height: 323px;\" /></figure>\r\n</div>\r\n\r\n<p>Hence, the correct answer is <strong>option (3).</strong></p>", "question_heading": ""}, {"sr_no": 47, "question": "A ृोg cयnपोinौ 5 ृिोcा ोnक 6 थुiपध ृोििसे यnध ृोििस ोनध कनोथn ोप नोnकयं. Wुोप iौ पुध ूनयृोृiिiपद पुोप पुध ृोििस कनोथn ोनध ृिोcा?", "option1": "\r\n<p>6/11</p>", "option2": "\r\n<p>5/6</p>", "option3": "\r\n<p>5/11</p>", "option4": "\r\n<p>2/5</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>Given</span></p>\r\n\r\n<p>Number of black balls = 5</p>\r\n\r\n<p>Number of white balls = 6</p>\r\n\r\n<p><span>Formula</span></p>\r\n\r\n<p>Probability = Favorable events/Total possible events</p>\r\n\r\n<p><span>Calculation</span></p>\r\n\r\n<p>Favorable event = Number of black balls = 5</p>\r\n\r\n<p>Total possible events = Total number of all balls = 6 + 5 = 11</p>\r\n\r\n<p>&there4; Probability = 5/11</p>", "question_heading": ""}, {"sr_no": 48, "question": "\r\n<p>If the surface area of a sphere is 20 cm<sup>2</sup>, then what will be the total surface area of a hemisphere of same radius?</p>", "option1": "\r\n<p>20 cm<sup>2</sup></p>", "option2": "\r\n<p>15 cm<sup>2</sup></p>", "option3": "\r\n<p>40 cm<sup>2</sup></p>", "option4": "\r\n<p>10 cm<sup>2</sup></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>the surface area of a sphere is 20 cm<sup>2</sup>.</p>\r\n\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p>The surface area of a sphere = 4&pi;r<sup>2</sup></p>\r\n\r\n<p>The total surface area of a hemisphere = 3<span>&pi;r</span><sup>2</sup></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the question,</p>\r\n\r\n<p>Radius of sphere = Radius of hemisphere = r</p>\r\n\r\n<p><span>The surface area of a sphere = 4&pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; 20 = <span>4&pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; <span>&pi;r<sup>2</sup> = <span class=\"math-tex\">\\(\\dfrac{20}{4}\\)</span> = 5</span></p>\r\n\r\n<p><span>The total surface area of a hemisphere = 3 &pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; 3 &times; 5 = 15 cm<sup>2</sup>   (<span>&pi;r</span><sup>2  = 5</sup>)</p>\r\n\r\n<p><strong>&there4; <span>The total surface area of a hemisphere is 15 cm<sup>2</sup>.</span></strong></p>", "question_heading": ""}, {"sr_no": 49, "question": "\r\n<p><span>A train runs for 30 minutes at the speed of 80 km/hr and the next 30 minutes at the speed of 90 km/hr. Then the average speed is</span></p>", "option1": "\r\n<p><span>40 km/hr</span></p>", "option2": "\r\n<p><span>45 km/hr</span></p>", "option3": "\r\n<p><span>85 km/hr</span></p>", "option4": "\r\n<p><span>95 km/hr</span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Speed for 30 minutes = 80 km/h</p>\r\n\r\n<p>Speed for 30 minutes = 90 km/h</p>\r\n\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p><span class=\"math-tex\">\\(Average \\;speed = \\dfrac{total\\; distance}{total\\;time}\\)</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Total time = (30+30) minutes = <span class=\"math-tex\">\\(\\dfrac{60}{60}= 1hour\\)</span></p>\r\n\r\n<p>Distance travelled in 30 minutes = <span class=\"math-tex\">\\(80\\times \\dfrac{30}{60}= 40 \\;km\\)</span></p>\r\n\r\n<p>Distance travelled in 30 minutes = <span class=\"math-tex\">\\(90\\times \\dfrac{30}{60}=45\\;km\\)</span></p>\r\n\r\n<p>Total distance = 40 + 45 = 85 km.</p>\r\n\r\n<p><span class=\"math-tex\">\\(Average \\;speed = \\dfrac{85}{1}=85\\;km/h\\)</span></p>\r\n\r\n<p>&there4; The <strong>average speed is 85 km/h.</strong></p>", "question_heading": ""}, {"sr_no": 50, "question": "Tुध ोॅधनोgध थधigुप यी पुध cिोौौ iौ 60 ाg ोnक पुध ोॅधनोgध थधigुप यी ृयदौ in पुध cिोौौ iौ 80 ाg. Tुध नोपiय यी ृयदौ पय giिनस in पुध cिोौौ iौ 5 : 4 Iी पुधनध ोनध 72 ौपहकधnपौ in पुध cिोौौ. Finक पुध ोॅधनोgध थधigुप यी giिनस", "option1": "\r\n\r\n<p>45</p>", "option2": "\r\n\r\n<p>35</p>", "option3": "\r\n\r\n<p>40</p>", "option4": "\r\n\r\n<p>30</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The average weight of the class = 60 kg</p>\r\n\r\n<p>The average weight of boys in the class = 80 kg </p>\r\n\r\n<p>The ratio of boys to girls in the class is 5 : 4</p>\r\n\r\n<p>The number of students in the class = 72</p>\r\n\r\n<p>The number of girls = 4/9 &times; 72</p>\r\n\r\n<p>&rArr; 32</p>\r\n\r\n<p>The number of boys = 5/9 &times; 72</p>\r\n\r\n<p>&rArr; 40</p>\r\n\r\n<p>Total weight of students in the class = 72 &times; 60</p>\r\n\r\n<p>&rArr; 4320</p>\r\n\r\n<p>The total weight of boy in class = 40 &times;  80</p>\r\n\r\n<p>&rArr; 3200</p>\r\n\r\n<p>The total weight of girls = total weight - total weight of boys </p>\r\n\r\n<p>&rArr; 4320 - 3200 = 1120</p>\r\n\r\n<p>The average weight of girls = 1120 /32</p>\r\n\r\n<p>&rArr; 35</p>\r\n\r\n<p>&there4; The required answer is 35.</p>\r\n\r\n<p> Using alligation method </p>\r\n\r\n<p>B         :           G</p>\r\n\r\n<p>80                     x </p>\r\n\r\n<p>          60</p>\r\n\r\n<p>5                      4</p>\r\n\r\n<p>= 80 - 60 = 20</p>\r\n\r\n<p>4 unit = 20 </p>\r\n\r\n<p>1 unit = 5</p>\r\n\r\n<p>5 unit = 25</p>\r\n\r\n<p>It means 60 - x = 25</p>\r\n\r\n<p>x = 60 - 25 = 35</p>\r\n\r\n<p>&there4; The required answer is 35.</p>", "question_heading": ""}, {"sr_no": 51, "question": "\r\n<p>A research study measured the heights of a group of 15 students. The resulting data had a standard deviation of 6.8 cm. What is the variance in the heights of these students?</p>", "option1": "\r\n<p>46.24 cm<sup>2</sup></p>", "option2": "\r\n<p>42 cm<sup>2</sup></p>", "option3": "\r\n<p>22.22<span>cm</span><sup>2</sup></p>", "option4": "\r\n<p>29 <span>cm</span><sup>2</sup></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>Standard deviation (&sigma;) = 6.8 cm. </p>\r\n\r\n<p><strong>Concept Used:</strong></p>\r\n\r\n<p>Variance is simply the square of the standard deviation.</p>\r\n\r\n<p>&rArr; Variance = (Standard Deviation)<sup>2 </sup>= &sigma;&sup2; </p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>As the variance is simply the square of the standard deviation. </p>\r\n\r\n<p>&rArr; (6.8 cm)&sup2; = 46.24 cm&sup2; </p>\r\n\r\n<p><strong>&there4; The variance of the heights of the students is 46.24 cm&sup2;.</strong></p>", "question_heading": ""}, {"sr_no": 52, "question": "\r\n<p>A statement is given below followed by two conclusions. Choose the appropriate option and state which of the conclusions follow from the statement.</p>\r\n\r\n<p><strong>Statement:</strong></p>\r\n\r\n<p>It is not appropriate for you to mix your personal life with your professional life.</p>\r\n\r\n<p><strong>Conclusion:</strong></p>\r\n\r\n<p>I. Mixing of professional and personal life can be harmful for a person.</p>\r\n\r\n<p>II. It is inappropriate to share confidential business information with friends and family.</p>", "option1": "\r\n<p>Only conclusion I follows</p>", "option2": "\r\n<p>Only conclusion II follows</p>", "option3": "\r\n<p>Conclusions I and II both follow</p>", "option4": "\r\n<p>Neither conclusion I nor conclusion II follows</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>I. Mixing of professional and personal life can be harmful for a person. <span>&rarr; Does not follow.</span></p>\r\n\r\n<p>The statement does not mention whether mixing professional and personal is harmful or not.</p>\r\n\r\n<p>II. It is inappropriate to share confidential business information with friends and family. &rarr;  <span>Does not follow.</span></p>\r\n\r\n<p><span>The statement does not mention anything about confidential business information.</span></p>\r\n\r\n<p>Hence, &#39;<strong><span>Neither conclusion I nor conclusion II follows</span></strong>&#39; is the correct answer.</p>", "question_heading": ""}, {"sr_no": 53, "question": "\r\n<p>In a certain code language, &#39;GLAND&rsquo; is written as &#39;GQDOJ&#39; and &#39;MEANS&#39; is written as &#39;VQDHP&#39;. How will &#39;CYSTS&#39; be written in that language?</p>", "option1": "\r\n<p>VWVCF</p>", "option2": "\r\n<p>FBVWV</p>", "option3": "\r\n<p>UVUAE</p>", "option4": "\r\n<p>VWVBF</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978781_1742978781420900_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p><span>The logic followed here is :-  (3) is added to the position value according to English alphabetic series diagonally.</span></p>\r\n\r\n<p>So,</p>\r\n\r\n<ul>\r\n\t<li><span>&#39;GLAND&rsquo; is written as &#39;GQDOJ&#39;</span></li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978884_1742978884668390_thump.png\" style=\"width: 100px; height: 107px;\" /></figure>\r\n\r\n<p>And,</p>\r\n\r\n<ul>\r\n\t<li><span>&#39;MEANS&#39; is written as &#39;VQDHP&#39;</span></li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978924_1742978924239527_thump.png\" style=\"width: 100px; height: 105px;\" /></figure>\r\n\r\n<p><span>Similarly,</span></p>\r\n\r\n<ul>\r\n\t<li><span>&#39;CYSTS&#39; is written as </span></li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979056_1742979056954519_thump.png\" style=\"width: 100px; height: 106px;\" /></figure>\r\n\r\n<p>Hence, <span>&quot;</span><strong><span>VWVBF</span></strong><span>&quot;</span> is the correct answer.</p>", "question_heading": ""}, {"sr_no": 54, "question": "\r\n<p>Study the given pattern carefully and select the number from among the given options that can replace the question mark (?) in it.</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>33</td>\r\n\t\t\t<td>6</td>\r\n\t\t\t<td>54</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>26</td>\r\n\t\t\t<td>8</td>\r\n\t\t\t<td>36</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>30</td>\r\n\t\t\t<td>12</td>\r\n\t\t\t<td>?</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>", "option1": "\r\n<p>26</p>", "option2": "\r\n<p>63</p>", "option3": "\r\n<p>36</p>", "option4": "\r\n<p>62</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>LOGIC: In a Row;</strong></p>\r\n\r\n<p><strong>First Number - Second Number &times; 2 = Third Number</strong></p>\r\n\r\n<p><strong>ROW 1:</strong></p>\r\n\r\n<p>33 - 6 = 27</p>\r\n\r\n<p>27 &times; 2 = 54</p>\r\n\r\n<p><strong>ROW 2:</strong></p>\r\n\r\n<p>26 -8 = 18</p>\r\n\r\n<p>18 &times; 2 = 36</p>\r\n\r\n<p><strong>ROW 3:</strong></p>\r\n\r\n<p>30 - 12 = 18</p>\r\n\r\n<p>18 &times; 2 = <strong>36</strong></p>\r\n\r\n<p>Hence, the correct answer is <strong>&quot;36&quot;.</strong></p>", "question_heading": ""}, {"sr_no": 55, "question": "\r\n<p><span>If the length of a rectangle is increased by 5%, and the breadth is decreased by 5% then its area will increase/decrease by :</span></p>", "option1": "\r\n<p>0.25% decrease</p>", "option2": "\r\n<p><span>0.25% increase</span></p>", "option3": "\r\n<p><span>0.5% decrease</span></p>", "option4": "\r\n<p><span>0.5% increase</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p><span>The length of a rectangle is increased by 5%, and the breadth is decreased by 5%</span></p>\r\n\r\n<p><strong><span>Concept used:</span></strong></p>\r\n\r\n<p><span>Area of a rectangle = L &times; B</span></p>\r\n\r\n<p>Here,</p>\r\n\r\n<p>L = length</p>\r\n\r\n<p>B = breadth</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let the length and breadth of the rectangle be 100L and 100B</p>\r\n\r\n<p>So,</p>\r\n\r\n<p>Area = 100L &times; 100B</p>\r\n\r\n<p>&rArr; 10000LB</p>\r\n\r\n<p>Now,</p>\r\n\r\n<p>New length = 100L + 100L &times; 5%</p>\r\n\r\n<p>&rArr; 105L</p>\r\n\r\n<p>New breadth = 100B - 100B &times; 5%</p>\r\n\r\n<p>&rArr; 95B</p>\r\n\r\n<p>New</p>\r\n\r\n<p>Area = 105L &times; 95B</p>\r\n\r\n<p>&rArr; 9975LB</p>\r\n\r\n<p>Area decreased = 10000LB - 9975LB</p>\r\n\r\n<p>&rArr; 25LB</p>\r\n\r\n<p>% in change in area = (25LB/10000LB) &times; 100</p>\r\n\r\n<p>&rArr; 0.25%</p>\r\n\r\n<p><strong>&there4; I <span>ts area will decrease by 0.25%.</span></strong></p>", "question_heading": ""}, {"sr_no": 56, "question": "\r\n<p>A, B, C, D and E have different ages. A is younger than D but older than E. Only three persons are older than C. B is the youngest. Who amongst them is the eldest?</p>", "option1": "\r\n<p>B</p>", "option2": "\r\n<p>A</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>According to the given information,</p>\r\n\r\n<p>Only three person older than C, that means <strong>C would be the 4th oldest person </strong>.</p>\r\n\r\n<p>B is the youngest that <strong>means B would sit at the last position </strong>.</p>\r\n\r\n<ul>\r\n\t<li><strong>B &lt; C &lt; &mdash; &lt; &mdash;  <span>&lt; &mdash;</span></strong></li>\r\n</ul>\r\n\r\n<p>A is younger than D but older than E.</p>\r\n\r\n<ul>\r\n\t<li><strong>E  <span>&lt; A &lt; D</span></strong></li>\r\n</ul>\r\n\r\n<p>Now, the final arrangement will be like:-</p>\r\n\r\n<ul>\r\n\t<li><strong>B  <span>&lt; C &lt; E &lt; A &lt; D</span></strong></li>\r\n</ul>\r\n\r\n<p><span>so, from the above arrangement, it is clear that <strong>D will be the eldest among all.</strong></span></p>\r\n\r\n<p><span>Hence, the correct answer is <strong>&quot;D&quot;. </strong></span></p>", "question_heading": ""}, {"sr_no": 57, "question": "\r\n\r\n<p>Below is a statement followed by two arguments. You have to decide which logic is implicit in the statement?</p>\r\n\r\n<p><strong>Statement:</strong></p>\r\n\r\n<p>An advertisement shows, &quot;The company will provide travelling allowance to the candidates coming from outside for the interview.&quot;</p>\r\n\r\n<p><strong>Argument:</strong></p>\r\n\r\n<p>I. The company will select only external candidates.</p>\r\n\r\n<p>II. The company will pay the fare of only that train, which is given in the advertisement.</p>", "option1": "\r\n\r\n<p>Both I and II are implicit.</p>", "option2": "\r\n\r\n<p>Neither I nor II is implicit.</p>", "option3": "\r\n\r\n<p>Only a rgument I is implicit.</p>", "option4": "\r\n\r\n<p>Only argument I Iis implicit.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The advertisement only states that the company will provide travelling allowance to outsiders.</p>\r\n\r\n<ul>\r\n\t<li>Nothing is stated about the selection of the candidates. and use of the word &quot;Only&quot;.  So argument I does not follow.</li>\r\n\t<li>The advertisement does not specify any train, thus argument II does not follow.</li>\r\n\t<li>Thus, neither of the arguments follow.</li>\r\n</ul>\r\n\r\n<p>Hence the correct answer is <strong>option 2 </strong>.</p>\r\n\r\n<ol>\r\n\t<li>The agreement which is the reconstruing part of the statement is a strong agreement.</li>\r\n\t<li>The argument should not be imagined.</li>\r\n\t<li>The relationship of the agreement should be direct from the statement.</li>\r\n\t<li>The argument should be simple and clear.</li>\r\n\t<li>The agreement should be based on scientific facts.</li>\r\n\t<li>The statement in the argument should receive a logical answer. </li>\r\n</ol>", "question_heading": ""}, {"sr_no": 58, "question": "\r\n<p>If the sum of a positive number and its square is 156, then the number is:</p>", "option1": "\r\n<p>17</p>", "option2": "\r\n<p>12</p>", "option3": "\r\n<p>-13</p>", "option4": "\r\n<p>15</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Given:</strong></p>\r\n\r\n<p>The sum of a positive number and its square is 156.</p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>According to the question,</p>\r\n\r\n<p>x + x<sup>2</sup> = 156</p>\r\n\r\n<p>&rArr; x<sup>2</sup> + x - 156 = 0</p>\r\n\r\n<p>&rArr; x<sup>2</sup> + 13x - 12x - 156 = 0</p>\r\n\r\n<p>&rArr; x(x + 13) - 12(x + 13) = 0</p>\r\n\r\n<p>&rArr; (x + 13)(x - 12) = 0</p>\r\n\r\n<p>&there4; x = -13, 12 </p>\r\n\r\n<p><strong>&there4; T<span>he positive number is 12.</span></strong></p>", "question_heading": ""}, {"sr_no": 59, "question": "\r\n<p>When the price of the product was decreased by 12%, the number sold increased by 24%. What was the effect on the total revenue in percentage ?</p>", "option1": "\r\n<p>Decrease 10.2 </p>", "option2": "\r\n<p>Decrease 9.12 </p>", "option3": "\r\n<p>Increase 10.2</p>", "option4": "\r\n<p>Increase 9.12</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Formula used:</strong></p>\r\n\r\n<p><span>% change in revenue = (New revenue - Initial revenue) / Initial revenue] &times; 100</span></p>\r\n\r\n<p><strong>Calculation:</strong></p>\r\n\r\n<p>Let&#39;s assume the initial price of the product is 100 Rs &amp; initial items sold out be 100 units.</p>\r\n\r\n<p>New price = 100 - (12% of 100) = 100 - 12 = 88 Rs.</p>\r\n\r\n<p>Initial number sold increase = 100</p>\r\n\r\n<p>New number sold = 100 + (24% of 100) = 100 + 24 = 124 units</p>\r\n\r\n<p>Initial total revenue = Initial price &times; Initial number sold</p>\r\n\r\n<p>&rArr; 100 &times; 100 = 10,000 Rs</p>\r\n\r\n<p>New total revenue = 88 &times; 124 = 10,912 Rs.</p>\r\n\r\n<p>% change in revenue = (New revenue - Initial revenue) / Initial revenue] &times; 100</p>\r\n\r\n<p>&rArr; [(10,912 - 10,000) / 10,000] &times; 100</p>\r\n\r\n<p><span>&rArr; </span> [912 / 10,000] &times; 100 = 9.12%</p>\r\n\r\n<p><strong>Therefore, the effect on total revenue is an increase of approximately 9.12%.</strong></p>", "question_heading": ""}, {"sr_no": 60, "question": "\r\n<p>In a certain code language, GAINED is written as &#39;DGNKCG&#39; and &#39;GALAXY&#39; is written as &#39;YXCLCG&#39;. How will &#39;GEARED&#39; be written in that language?</p>", "option1": "\r\n<p>DGRCGF</p>", "option2": "\r\n<p>RGDGFC</p>", "option3": "\r\n<p>DGRCGG</p>", "option4": "\r\n<p>DGCRGG</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The positional value of the English alphabet is given below:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979312_1742979312692125_thump.png\" style=\"width: 400px; height: 109px;\" /></figure>\r\n\r\n<p><span>Logic:</span></p>\r\n\r\n<p><strong>Step 1: Consonants are placed as it is.</strong></p>\r\n\r\n<p><strong>Step 2: Vowels are increased by + 2.</strong></p>\r\n\r\n<p><strong>Step 3: Then code is written in reverse order.</strong></p>\r\n\r\n<p><span>GAINED is written as &#39;DGNKCG&#39;</span></p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979342_1742979342984988_thump.png\" style=\"width: 150px; height: 165px;\" /></p>\r\n\r\n<p> \r\n<p><span>And,</span></p>\r\n</p>\r\n\r\n<p><span>&#39;GALAXY&#39; is written as &#39;YXDLDG&#39;</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979450_1742979450428549_thump.png\" style=\"width: 150px; height: 165px;\" /></figure>\r\n\r\n<p><span>Similarly,</span></p>\r\n\r\n<p><span>&#39;GEARED&#39; be written &#39;?&#39;</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979497_1742979497559798_thump.png\" style=\"width: 150px; height: 165px;\" /></figure>\r\n\r\n<p><span>Hence, the correct answer is  <strong>&quot;DGRCGG&quot;.</strong></span></p>", "question_heading": ""}, {"sr_no": 61, "question": "\r\n\r\n<p>Liberal education enables a person to</p>", "option1": "\r\n\r\n<p>read with more discernment than others</p>", "option2": "\r\n\r\n<p>apply general principles to resolve issues</p>", "option3": "\r\n\r\n<p>gain prestige</p>", "option4": "\r\n\r\n<p>develop a clearer understanding of history than others</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo; <strong>apply general principles to resolve issues&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author talks about liberal education can equip man with <strong>fundamental powers of judgment </strong>and <strong>action </strong>which can be applied to various concerns of human life and also gives examples of how a liberal education helps people to make <em>wise choices </em>in choosing a hobby or dentistry.\r\n\r\n\t<ul>\r\n\t\t<li>From the <strong>fourth line </strong>of the passage &lsquo;&hellip; <em>the claim of liberal education that it can equip a man with <strong>fundamental powers of decision and action, </strong>applicable.&rsquo; </em>&hellip;.. In this context, option &lsquo;2&rsquo; is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Options 1, 3, and 4 are incorrect because there isn&#39;t sufficient supportive information in the passage to consider them to be the right answers.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;Liberal education enables a person to apply general principles to resolve issues. <em>&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 62, "question": "\r\n\r\n<p>According to the author, &#39;the great and varied concerns of human life&#39; are about</p>", "option1": "\r\n\r\n<p>fundamental rights</p>", "option2": "\r\n\r\n<p>challenges facing mankind</p>", "option3": "\r\n\r\n<p>tinkering hobbies</p>", "option4": "\r\n\r\n<p>liberal education</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo; <strong>challenges facing mankind&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author wants to say that liberal education can help us not only deal with our daily <strong>challenges but also with greater challenges that face the whole of mankind.</strong>\r\n\r\n\t<ul>\r\n\t\t<li>In the <strong>last sentence </strong>of the passage, the author says that liberal education may solve the various problems that arise in daily life. &lsquo;&hellip; <em>but to all the great and varied <strong>concerns </strong>of human life.&rsquo;&hellip;..</em></li>\r\n\t\t<li>&quot;Concern&quot; means &#39; <strong>worries&#39; </strong>and refers to being concerned about a situation.</li>\r\n\t\t<li>&quot;Worries of human life&quot; will convey the same meaning as &quot; <strong>the challenges faced by mankind </strong>.&quot; So, option &lsquo;2&rsquo; is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Other options &ldquo; <em>Fundamental rights, tinkering hobbies, and liberal education </em>&rdquo; represent phrases used in the passage. They do not state the meaning of the phrase in the given question. So, options 1,3 and 4 are incorrect.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;According to the author, &#39;the great and varied concerns of human life&#39; are about challenges facing mankind <em>.&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 63, "question": "\r\n\r\n<p>In this passage, the author stresses the importance of</p>", "option1": "\r\n\r\n<p>education for living</p>", "option2": "\r\n\r\n<p>technological advances</p>", "option3": "\r\n\r\n<p>increased interest in the study of history</p>", "option4": "\r\n\r\n<p>satisfying the desire for security</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo;<strong>increased interest in the study of history</strong><strong>&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;3&rsquo; is correct <em>,</em>In the passage, the author focus on how a liberal education makes us better able to face challenges and the real proof of the value of a liberal education may be seen in the histories and biographies of those who have achieved greatness according to accepted norms. From history, we can understand what their existence has meant.\r\n\r\n\t<ul>\r\n\t\t<li>From the <strong>first line </strong>of the passage &lsquo;&hellip;. <em>From <strong>history, </strong>we can learn what their existence has meant.&rsquo;&hellip;.</em></li>\r\n\t\t<li>From the <strong>third line </strong>of the passage &lsquo;&hellip;. <em>The real evidence for the value of liberal education lies in <strong>history </strong>and the biographies of men </em>.&rsquo;&hellip;.</li>\r\n\t\t<li>Thus, based on the above references we can say that the correct answer is option &quot;3&quot;.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Options 1, 2, and 4 are incorrect because there isn&#39;t enough evidence in the passage to justify them as the correct answers.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;In this passage, the author stresses the importance of increased interest in the study of history. <em>&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 64, "question": "\r\n\r\n<p>In this passage, the expression &#39;specifically trained&#39; refers to</p>", "option1": "\r\n\r\n<p>characteristically trained</p>", "option2": "\r\n\r\n<p>particularly trained</p>", "option3": "\r\n\r\n<p>peculiarly trained</p>", "option4": "\r\n\r\n<p>ostensibly trained</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo;<strong>particularly trained</strong><strong>&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author wants to say that even without education in a particular branch, people who had a liberal education were able to make better choices.\r\n\t<ul>\r\n\t\t<li>From the <strong>second line </strong>of the passage &lsquo;&hellip; <em>The ability of the man of disciplined mind to direct this power effectively upon problems for which he has not specifically trained.&rsquo;&hellip;..</em></li>\r\n\t\t<li>&quot; <em>Specifically </em>&quot; means &quot;<strong><em>particularly</em></strong>.&quot; (Particularly means more than usual)</li>\r\n\t\t<li>&quot;Specifically trained&quot; and &quot;<strong><em>particularly trained</em></strong>&quot; have the same meaning. So, 2 is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;In this passage, the expression &#39;specifically trained&#39; refers to particularly trained. <em>&quot;</em></em></p>\r\n\r\n<p>Let&rsquo;s discuss the other options:</p>\r\n\r\n<ol>\r\n\t<li><strong>Characteristically trained: </strong>in accordance with someone&#39;s specific or typical behaviour.</li>\r\n\t<li><strong>Peculiarly trained: </strong>strange or unusual behaviour.</li>\r\n\t<li><strong>Ostensibly trained: </strong>Ostensible is used to describe something that appears to be true but about which you or other people have doubts.</li>\r\n</ol>", "question_heading": ""}, {"sr_no": 65, "question": "\r\n<p>Which of the following are included in the assets of the Reserve Bank of India?</p>\r\n\r\n<p>1. Treasury bills</p>\r\n\r\n<p>2. Paid-up Capital and Reserve Fund</p>\r\n\r\n<p>3. Ways and means advances</p>\r\n\r\n<p>4. Currency Notes in circulation</p>", "option1": "\r\n<p>Both 1 and 2</p>", "option2": "\r\n<p>Both 2 and 3</p>", "option3": "\r\n<p>Both 1 and 3</p>", "option4": "\r\n<p>Both 2 and 4</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<u><strong> Both 1 and 3.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>A <strong>central bank balance sheet </strong>is a reflection of its various functions, particularly its role as a monetary authority and <strong>as a banker to the Government and banks</strong>.</li>\r\n\t<li>The structure of <strong>assets and liabilities </strong>of the Reserve Bank of India (RBI) is, more or less, in line with the balance sheet followed by most central banks. </li>\r\n</ul>\r\n\r\n<p>Assets of the Reserve Bank of India:</p>\r\n\r\n<ul>\r\n\t<li>Rupee securities (including treasury bills)\r\n\t<ul>\r\n\t\t<li>It includes the government securities held by the Issue and Banking departments. </li>\r\n\t\t<li>In Issue Department, rupee securities along with rupee securities<strong> include government securities of that &#39;foreign country maturing within ten years</strong> of the Issue Department plus investment in government securities of the Banking Department. <em>Hence, statement 1 is correct.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Loans and Advances</strong>\r\n\t<ul>\r\n\t\t<li>The Reserve Bank gives loans and advances to the Central &amp; State Governments, commercial and cooperative banks and others in terms of Sections 17 and 18 of the Reserve Bank of India Act, 1934. <em>Hence, statement 3 is correct.</em></li>\r\n\t\t<li>Reserve Bank provides loans and advances to the Central Government to meet the temporary gap between receipts and payments.</li>\r\n\t\t<li>These advances are termed as ways and means advances that are fixed from time to time in consultation with the Government. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>India&#39;s Foreign Exchange Reserves</strong>\r\n\t<ul>\r\n\t\t<li>Comprise Foreign Currency Assets, <strong>Gold, SDR</strong> and Reserve Bank position with International Monetary Fund (IMF).</li>\r\n\t\t<li><strong>Foreign currency assets</strong> include investments in US Treasury bonds, Bonds/Treasury Bills of other selected governments, deposits with foreign central banks, foreign commercial banks etc.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Gold coin bullion</strong>\r\n\t<ul>\r\n\t\t<li><strong>It represents the gold coin bullion of the Issue Department and Banking Department. </strong></li>\r\n\t\t<li>The gold reserves of the Issue Department and Banking Department are valued at a value close to international market prices on a monthly basis. </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Liabilities of RBI:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Currency notes</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>Issued by the Reserve Bank</strong> are the <strong>Reserve Bank&rsquo;s liability</strong> and this constitutes the liabilities of the Issue Department.</li>\r\n\t\t<li>Total notes issued <strong>are the sum of Notes in circulation and Notes held in the Banking Department</strong> of the Bank. <em><strong>Hence, statement 4 is not correct.</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong> Paid-up Capital and Reserve Fund</strong>\r\n\t<ul>\r\n\t\t<li>The Capital of the Bank, of 0.05 billion dollars, is held by the Government of India and reserve funds i.e.<strong> Credit (Long-term Operations) Fund, National Agricultural Credit (Stabilisation) Fund, and National Industrial Credit (Long-term Operations) Fund</strong> of the Bank are part of other liability. <em><strong>Hence, statement 2 is not correct.</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Loans and advances to the State Governments</strong> comprise ways and means of advances granted under Section 17(5) of the Reserve Bank of India Act, 1934.</li>\r\n\t<li>The<strong> minimum balances</strong> to be maintained by the State Governments with the Bank and this is revised from time to time.</li>\r\n\t<li>This item mainly represents the investment of RBI in Non-Government securities.</li>\r\n\t<li>The major items under this head are an investment in <strong>DICGC share capital,</strong> Bharatiya Reserve Bank Note Mudran share capital, NABARD share capital, National Housing Bank share capital etc.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 66, "question": "\r\n<p><strong>Direction: Choose the appropriate option that fills in the given sentence correctly:</strong></p>\r\n\r\n<p>Fire fighters were trying to lift the wreckage ______ an express bus that had overturned ______ the main highway. </p>", "option1": "\r\n<p>of, on</p>", "option2": "\r\n<p>at, in</p>", "option3": "\r\n<p>in, across</p>", "option4": "\r\n<p>under, in</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;of, on.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us look at the  usage  of the given options:\r\n\t<ul>\r\n\t\t<li>Of: We use&quot;of&quot;when we want to show that people or things relate to other things or people.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>Tiffany stared at the floor <u>of</u> her room.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>On: &quot;On&quot;  is used to show that something is in a position above something else and touching it, or that something is moving into such a position.\r\n\t\t<ul>\r\n\t\t\t<li>Example :<em>Look at all the books <u>on</u> your desk!</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>At: We use&quot;at&quot;when we refer to an address.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>Education starts <u>at</u> home.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>In:  We use  &quot;in&quot;  when something is located inside of a defined space. \r\n\t\t<ul>\r\n\t\t\t<li>Example :  <em>I&rsquo;m <u>in</u> the building now.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>Across: <strong>&quot;Across&quot; </strong>means on the other side of something, or from one side to the other of something which has sides or limits such as a city, road or river.\r\n\t\t<ul>\r\n\t\t\t<li><strong>Example:</strong><em>We took a boat<u><strong>across</strong></u>the river.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>Under:  We use  &quot;under&quot;  to talk about something that is below or lower than something else.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>His shoes were <u>under</u> his bed.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The sentence says that the relation of <strong>&quot;wreckage&quot; </strong>with the <strong>&quot;express bus&quot; </strong>, so we must use <strong>&quot;of&quot; </strong>in the first blank.</li>\r\n\t<li>The second blank must have <strong>&quot;on&quot; </strong>as it is referring to overturning above the main highway.</li>\r\n\t<li>So, the correct answer is  Option 1 .</li>\r\n</ul>\r\n\r\n<p>Correct sentence :<em> Fire fighters were trying to lift the wreckage<u><strong>of</strong></u>an express bus that had overturned<u><strong>on</strong></u>the main highway. </em></p>", "question_heading": ""}, {"sr_no": 67, "question": "In ुयcाधद, थुोप iौ पुध ंधोning iी पुध हंूiनध ौignोिस ृद ूयinपing ृयपु ोनंौ ुयनप्रयnपोििद पयथोनक पुध cधnपनध यी पुध ीiिधक?", "option1": "\r\n<p>Timing</p>", "option2": "\r\n<p>Goal scored</p>", "option3": "\r\n<p>Bully</p>", "option4": "\r\n<p>Ball out of play</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Goal scored</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>If the umpire signals by pointing both arms horizontally toward the centre of the field it means <strong>goal scored</strong>.</li>\r\n\t<li>If the <strong>umpire raises both arms horizontally in the direction of the goal,</strong> it is a <strong>penalty corner </strong>of the signal.</li>\r\n\t<li>A <strong>defensive violation</strong> within the <strong>penalty circle</strong> or a willful violation within the <strong>defensive 23-meter zone</strong> results in a <strong>penalty corner</strong> being issued.</li>\r\n\t<li>A <strong>penalty corner</strong>, sometimes referred to as a short corner in field <strong>hockey</strong>, is a sanction imposed on the opposing side.</li>\r\n\t<li><strong>Attacking players</strong> seek them out eagerly because they offer a great chance to score. <strong>Players</strong> learn specialised abilities for this phase of the game, such as the<strong> drag flick,</strong> and there are specific rules that only apply in <strong>penalty corners.</strong></li>\r\n\t<li><strong>Hockey </strong>\r\n\t<ul>\r\n\t\t<li>The term &quot;<strong>hockey</strong>&quot; refers to a <strong>group of different summer and winter team games</strong> that were first played on an <strong>outdoor field,</strong><strong>a sheet of ice, or a dry floor,</strong> like in a <strong>gymnasium</strong>. While the specific regulations, player counts, attire, and most notably the playing field differ amongst these games, they all include two opposing teams utilising sticks to direct a ball or disc towards a goal.</li>\r\n\t\t<li><strong>Hockey comes in a variety of forms</strong>.</li>\r\n\t\t<li>Skates, whether wheeled or bladed, are used in some games yet not in others.</li>\r\n\t\t<li>The word &quot;<strong>hockey</strong>&quot; is frequently followed by another word, such as &quot;f<strong>ield hockey,&quot; &quot;ice hockey,&quot; &quot;roller hockey,&quot; &quot;rink hockey,&quot; or &quot;floor hockey,&quot;</strong> to assist distinguish between these different games.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 68, "question": "\r\n<p>Which statement is true for Finance Sector (Fiscal Management) in the Union Budget-2023?</p>", "option1": "\r\n<p>Fiscal Deficit of 3.5% of GSDP allowed for states. </p>", "option2": "\r\n<p>Budget estimates 2023-24 for total expenditure is Rs. 55 lakh Cr.</p>", "option3": "\r\n<p>Fiscal Deficit 2025-26, the target is to be below 5.5%.</p>", "option4": "\r\n<p>Twenty years interest free loans to states.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Option 1.</strong></u></p>\r\n\r\n<p><strong>The Union Budget 2023-24 </strong></p>\r\n\r\n<ul>\r\n\t<li>The Union Budget 2023-24 was presented on February 1, 2023, by the Finance Minister Ms. Nirmala Sitharaman. </li>\r\n\t<li>It proposes to spend Rs 45,03,097 crore in the financial year. </li>\r\n\t<li>Out of the <strong>total expenditure</strong>, revenue expenditure is estimated to be Rs <strong>35,02,136 crore </strong>(1.2% increase from revised estimates of 2022-23). <em><strong>Hence statement 2 is incorrect.</strong></em></li>\r\n\t<li><strong>Interest expenditure </strong>is<strong> 41% of revenue receipts. </strong></li>\r\n\t<li><strong>Capital expenditure</strong> is estimated to be Rs 10,00,961 crore, a 37.4% increase from revised estimates for 2022-23. </li>\r\n\t<li>The <strong>revenue deficit in 2023-24 is targeted at 2.9% of GDP,</strong> which is lower than the revised revenue deficit of 4.1% in 2022-23. </li>\r\n\t<li><strong>The fiscal deficit in 2023-24 is targeted at 5.9% of GDP, lower than the revised fiscal deficit of 6.4% in 2022-23.</strong></li>\r\n\t<li>Continuing the path of fiscal consolidation, the Government intends to bring the <strong>fiscal deficit below 4.5 percent of GDP by 2025-26</strong>. <em><strong>Hence statement 3 is incorrect.</strong></em></li>\r\n\t<li>Under the Finance Bill, 2023, a number of changes have been made to the new tax regime. </li>\r\n\t<li>The income limit to avail of a rebate and not pay any taxes has increased from Rs 5 lakh to Rs 7 lakh.  Further, the number of tax slabs has been reduced from six to five. </li>\r\n\t<li>The surcharge for the highest slab (income over Rs 5 crore) has been cut from 37% to 25%.</li>\r\n\t<li>The <strong>Finance Minister stated that the States will be allowed a fiscal deficit of 3.5 percent of GSDP</strong> of which 0.5 percent will be tied to power sector reforms. <em><strong>Hence statement 1 is correct.</strong></em></li>\r\n\t<li>States will also be provided a fifty-year interest-free loan.</li>\r\n\t<li>The entire fifty-year loan to states has to be spent on capital expenditure within 2023-24.</li>\r\n</ul>\r\n\r\n<p><strong>Policy Highlights</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Infrastructure:</strong> The scheme providing<strong> 50-year interest-free loans to state governments </strong>will be made available in 2023-24 also with an outlay of Rs 1.3 lakh crore.<em><strong> Hence statement 4 is incorrect.</strong></em></li>\r\n\t<li>100 critical transport infrastructure projects for last and first-mile</li>\r\n\t<li>connectivity for various sectors such as ports, coal, and steel will be taken up.</li>\r\n\t<li>This will have an investment of Rs 75,000 crore including Rs 15,000 crore from private sources. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 69, "question": "\r\n<p>Which of the following statements are true regarding arteries in a human circulatory system?</p>\r\n\r\n<p>A. All arteries carry pure blood</p>\r\n\r\n<p>B. Arteries have valves</p>\r\n\r\n<p>C. Arteries have thick walls</p>\r\n\r\n<p>D. Arteries carry blood from heart to other organs</p>", "option1": "\r\n<p>A and B only</p>", "option2": "\r\n<p>B and C only</p>", "option3": "\r\n<p>C and D only</p>", "option4": "\r\n<p>A and C only</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct answer is<strong><u>C and D only</u>.</strong></p>\r\n\r\n<p><strong><u>Concept:</u></strong></p>\r\n\r\n<ul>\r\n\t<li>Blood circulate throughout your body through the blood vessels.</li>\r\n\t<li>The three major kinds of blood vessels are -\r\n\t<ul>\r\n\t\t<li><strong>arteries</strong></li>\r\n\t\t<li><strong>veins</strong></li>\r\n\t\t<li><strong>capillaries</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>They majorly help in delivering oxygen to vital organs and tissues, and also help in removal of waste products.</li>\r\n\t<li>Arteries and veins are tubes of muscle that our blood flows through.</li>\r\n\t<li>Arteries are the ones which carry blood away from the heart.</li>\r\n\t<li>Veins are the ones which carry blood towards the heart</li>\r\n\t<li>Except the pulmonary blood vessels, arteries carry oxygenated blood and veins carry deoxygenated blood. </li>\r\n\t<li>Capillaries are the smallest blood vessels that connect arteries and veins.</li>\r\n</ul>\r\n\r\n<p><strong>Arteries</strong></p>\r\n\r\n<ul>\r\n\t<li>Arteries are blood vessels that <strong>distribute oxygen-rich blood</strong> to the whole body.</li>\r\n\t<li>It carries blood f<strong>rom the heart to all other parts</strong> of the body.</li>\r\n\t<li>Except the pulmonary artery which carries deoxygenated blood from the heart to the lungs.</li>\r\n\t<li>Arteries have <strong>thicker walls </strong>with muscle tissue when compared to veins.</li>\r\n\t<li>They <strong>don&rsquo;t have valves.</strong></li>\r\n\t<li>The force of the blood coming from the heart helps the blood to flow in one direction.</li>\r\n</ul>\r\n\r\n<p><strong>Veins</strong></p>\r\n\r\n<ul>\r\n\t<li>Veins bring back the <strong>oxygen-poor blood</strong> or deoxygenated blood from body&rsquo;s cells and tissues to the heart.</li>\r\n\t<li>Veins have <strong>thinner walls.</strong></li>\r\n\t<li>They<strong> have valves </strong>to keep the blood flowing and prevent the blood to move in wrong direction.</li>\r\n\t<li><strong>Types of Veins</strong> - \r\n\t<ul>\r\n\t\t<li><strong>Pulmonary</strong> veins carry oxygenated blood from the lungs to the left atrium of the heart.</li>\r\n\t\t<li><strong>Systemic</strong> veins return oxygen-depleted blood from the rest of the body to the right atrium of the heart.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Therefore, the <strong>statements C and D are only true</strong> regarding arteries in a human circulatory system.</p>", "question_heading": ""}, {"sr_no": 70, "question": "\r\n<p><strong>Select the most appropriate synonym of the given word.</strong></p>\r\n\r\n<p>Moral</p>", "option1": "\r\n<p>Ethical</p>", "option2": "\r\n<p>Honourable</p>", "option3": "\r\n<p>Godliness</p>", "option4": "\r\n<p>Symphony</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 1), i.e., &#39;Ethical .&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meaning of the given word :\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Moral</th>\r\n\t\t\t\t<td>relating to the standards of good or bad behaviour, fairness, honesty, etc. that each person believes in, rather than to laws. (अच्छे या बुरे व्यवहार, निष्पक्षता, ईमानदारी आदि के मानकों से संबंधित है, जिसमें प्रत्येक व्यक्ति कानूनों के बजाय विश्वास करता है)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n\t<li>Let&#39;s look at the meanings of the other given options:\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Ethical</th>\r\n\t\t\t\t<td>relating to moral principles or the branch of knowledge dealing with these. (नैतिक सिद्धांतों या इनसे निपटने वाले ज्ञान की शाखा से संबंधित)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Honourable</th>\r\n\t\t\t\t<td>honest and fair, or deserving praise and respect. (ईमानदार और निष्पक्ष, या प्रशंसा और सम्मान के योग्य)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Godliness</th>\r\n\t\t\t\t<td>the quality of being godly (= obeying and respecting God). (ईश्वरीय होने का गुण (= ईश्वर का पालन और सम्मान करना))</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Symphony</th>\r\n\t\t\t\t<td>a long piece of music for an orchestra, usually with four movements. (ऑर्केस्ट्रा के लिए संगीत का एक लंबा टुकड़ा, आमतौर पर चार आंदोलनों के साथ)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n</ul>\r\n\r\n<ul>\r\n\t<li>Clearly,the word&#39; Ethical &#39;isclosest in meaningto the given word&#39; Moral .&#39;</li>\r\n\t<li>Therefore,the correct synonym of the given word isoption 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 71, "question": "\r\n<p><strong>Select the most appropriate meaning of the given idiom.</strong><br />\r\ncost an arm and a leg</p>", "option1": "\r\n<p>very expensive</p>", "option2": "\r\n<p>Prepared for battle</p>", "option3": "\r\n<p>In a deep, insensible sleep</p>", "option4": "\r\n<p>Ready for scrutiny</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot; very expensive &quot;</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meaning of the given idiom:\r\n\t<ul>\r\n\t\t<li><strong>cost an arm and a leg -</strong> very expensive.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Look at the example:\r\n\t<ul>\r\n\t\t<li>She would love to buy a Porsche but they cost an arm and a leg.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <em>very expensive</em></p>\r\n\r\n<ul>\r\n\t<li>cost an arm and a leg- बहुत महंगा </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 72, "question": "\r\n<p>Which of the following is related to green revolution in India?</p>", "option1": "\r\n<p>Calculation of Green GNP</p>", "option2": "\r\n<p>Environment Protection</p>", "option3": "\r\n<p>Green House Effect</p>", "option4": "\r\n<p>High Yielding Variety of Seeds</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>High Yielding Variety of Seeds.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Green Revolution\r\n\t<ul>\r\n\t\t<li>It is referred to as a period when Indian agriculture was converted into an industrial system due to the adoption of modern methods and technologies.</li>\r\n\t\t<li>It included the use of products like High-Yielding Variety (HYV) seeds, tractors, irrigation facilities, pesticides, and fertilizers which were either not used earlier or used on a very limited scale. </li>\r\n\t\t<li>The Indian Green Revolution was the brainchild of M.S. Swaminathan.</li>\r\n\t\t<li>M.S. Swaminathan is known as the Father of the Green Revolution in India.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>List of all the important Revolutions in India</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Black Revolution</td>\r\n\t\t\t<td>Related with Petroleum Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Blue Revolution</td>\r\n\t\t\t<td>Related with Fish Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Brown Revolution</td>\r\n\t\t\t<td>Related with Leather, Cocoa</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Golden Fibre Revolution</td>\r\n\t\t\t<td>Related with Jute Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Golden Revolution</td>\r\n\t\t\t<td>Related with Overall Horticulture, Honey, Fruit Production, Flowers, medicinal, spices.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Green Revolution</td>\r\n\t\t\t<td>Related with Agriculture Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Grey Revolution</td>\r\n\t\t\t<td>Related with Fertilizers</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Pink Revolution</td>\r\n\t\t\t<td>Related with Onions, Prawn</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Red Revolution</td>\r\n\t\t\t<td>Related with Meat, Tomato Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Evergreen Revolution</td>\r\n\t\t\t<td>Intended for overall agriculture production growth</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Round Revolution</td>\r\n\t\t\t<td>Related with Potato Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Silver Fibre Revolution</td>\r\n\t\t\t<td>Related with Cotton Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Silver Revolution</td>\r\n\t\t\t<td>Related with Egg Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>White Revolution</td>\r\n\t\t\t<td>Related with Dairy, Milk Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Yellow Revolution</td>\r\n\t\t\t<td>Related with Oil Seed Production</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Round Revolution</td>\r\n\t\t\t<td>Related with Potato</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 73, "question": "\r\n<p>Which of the following <strong>does not </strong>constitute a pillar of Make in India?</p>\r\n\r\n<p>1. New Processes</p>\r\n\r\n<p>2. New Infrastructure</p>\r\n\r\n<p>3. New Sectors</p>\r\n\r\n<p>4. New Mindset</p>\r\n\r\n<p>Choose the correct code.</p>", "option1": "\r\n<p>1 only</p>", "option2": "\r\n<p>2 and 4 only</p>", "option3": "\r\n<p>3 only</p>", "option4": "\r\n<p>None of the above</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>None of the above.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Make in India  was launched in September 2014 by the GoI to encourage multinational as well as domestic companies to manufacture their products in India. The initiative is set to boost entrepreneurship, not only in manufacturing but in relevant infrastructure and service sectors as well. </li>\r\n\t<li>Objective -\r\n\t<ul>\r\n\t\t<li>To focus on job creation and skill enhancement in 25 key sectors of the economy, including automobiles, aviation, biotechnology, defence manufacturing, electrical machinery, food processing, oil &amp; gas, and pharmaceuticals, among others.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Logo\r\n\t<ul>\r\n\t\t<li>It is inspired by Ashoka Chakra &ndash; is a striding lion made of cogs, symbolizing manufacturing, strength, and national pride.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The initiative is based on four pillars &ndash;\r\n\t<ul>\r\n\t\t<li>New Processes;</li>\r\n\t\t<li>New Infrastructure;</li>\r\n\t\t<li>New Sectors; and</li>\r\n\t\t<li>New Mindset. <strong>Hence, statements 1, 2, 3 and 4 are correct.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The major steps taken by the government in this regard are as summed up below:\r\n\t<ul>\r\n\t\t<li>An interactive portal for the dissemination of information and interaction with investors has been created with the objective of generating awareness about the investment opportunities and prospects of the country, promoting India as a preferred investment destination in markets overseas, and increasing the Indian share of global FDI.</li>\r\n\t\t<li>Invest India was set up as the national investment promotion and facilitation agency.</li>\r\n\t\t<li>In order to tap the creative potential and boost entrepreneurship in India, the Start-up India and Stand-up India campaign has been announced.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 74, "question": "\r\n<p><strong>Rewrite the following changing the active sentence to passive.</strong></p>\r\n\r\n<p>They will have completed the project before the deadline.</p>", "option1": "\r\n<p>The project will be completed before the deadline.</p>", "option2": "\r\n<p>The project will have been completed before the deadline.</p>", "option3": "\r\n<p>The project will have completed before the deadline.</p>", "option4": "\r\n<p>The project will complete before the deadline.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>The project will have been completed before the deadline</strong>&quot;.</p>\r\n\r\n<ul>\r\n\t<li>As we can see the given sentence is in the<strong> future perfect tense (have + V3</strong>), so we have to <strong>change</strong> the <strong>passive</strong> voice as per the <strong>same tense</strong> rules.</li>\r\n\t<li>Active voice: Subject + <strong>will+ have +v3</strong>+ object.</li>\r\n\t<li>Passive voice: Object+ <strong>will+ have+ been +V3+ by</strong> + subject</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>Active voice: <em>Maya <strong>will have cleaned</strong> the dishes.</em></li>\r\n\t\t<li>Passive voice: <em>The dishes<strong> will</strong><strong>have been</strong> cleaned<strong> by </strong>Maya.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Following the rules mentioned above, we have to change the <strong>active to passive</strong> and apply<strong> &quot;will have been completed&quot;</strong> in the sentence<strong>.</strong></li>\r\n\t<li>Therefore, the correct answer is: <em>The project will have been completed before the deadline.</em></li>\r\n</ul>\r\n\r\n<p>Let us take a look at the rules of the future perfect active passive voice:</p>\r\n\r\n<ul>\r\n\t<li><strong>Active</strong> voice: Subject +<strong> will+ have +v3</strong>+ object.</li>\r\n\t<li><strong>Passive</strong> voice: Object+<strong> will+ have+ been +V3+ by</strong> + subject</li>\r\n\t<li><strong>Active</strong> voice: Subject +<strong> will+ have +not+v3+</strong> object.</li>\r\n\t<li><strong>Passive</strong> voice: Object + <strong>will+ have +not+been+v3</strong>+ subject</li>\r\n\t<li><strong>Active</strong> voice:<strong> Will+ Subject+have+v3+</strong> object+?</li>\r\n\t<li><strong>Passive</strong> voice: <strong>Will + object+have+been+v3+by</strong> +subject+?</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 75, "question": "\r\n<p>Ocean Currents occur in Oceans and Seas due to which of the following?</p>\r\n\r\n<p>a. Atmospheric circulation on the earth</p>\r\n\r\n<p>b. Influence of insolation</p>\r\n\r\n<p>c. Temperature difference and salinity difference</p>\r\n\r\n<p>Select the correct answer using the code given below.</p>", "option1": "\r\n<p>a and b only</p>", "option2": "\r\n<p>c only</p>", "option3": "\r\n<p>b and c only</p>", "option4": "\r\n<p>a, b and c</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>a, b and c</strong></u>.</p>\r\n\r\n<p><strong>Ocean Currents:</strong></p>\r\n\r\n<ul>\r\n\t<li>Ocean currents are the<strong> most important ocean movements because of their influence on the climatology of various regions</strong>. </li>\r\n\t<li>Ocean currents are like river flow in oceans.</li>\r\n\t<li>They represent a regular volume of water in a definite path and direction.</li>\r\n</ul>\r\n\r\n<p><strong>Forces Responsible for Ocean Currents:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Influence of insolation:</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>Heating by solar energy causes the water to expand.</strong></li>\r\n\t\t<li>That is why, <strong>near the equator, the ocean water is about 8 cm higher</strong> in level than in the middle latitudes.</li>\r\n\t\t<li>This causes a <strong>very slight gradient</strong> and water tends to flow down the slope.</li>\r\n\t\t<li>The <strong>flow is normally from east to west.</strong><em><strong> Hence, statement b is correct.</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of wind (atmospheric circulation):</strong>\r\n\t<ul>\r\n\t\t<li>Wind blowing on the surface of the ocean pushes the water to move.</li>\r\n\t\t<li><strong>Friction between the wind and the water&#39;s surface</strong> affects the movement of the water body in its course.</li>\r\n\t\t<li>The <strong>oceanic circulation pattern roughly corresponds to the earth&rsquo;s atmospheric circulation pattern.</strong></li>\r\n\t\t<li>The air circulation over the oceans in the <strong>middle latitudes is mainly anticyclonic</strong> [Sub-tropical High-Pressure Belt] (more pronounced in the southern hemisphere than in the northern hemisphere due to differences in the extent of landmass). <em>Hence, statement a is correct.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Temperature difference and Salinity difference:\r\n\t<ul>\r\n\t\t<li>The temperature difference and salinity difference are the secondary forces.</li>\r\n\t\t<li>Differences in water density affect the vertical mobility of ocean currents (vertical currents).</li>\r\n\t\t<li>Water with high salinity is denser than water with low salinity and in the same way cold water is denser than warm water.</li>\r\n\t\t<li>Denser water tends to sink, while relatively lighter water tends to rise.</li>\r\n\t\t<li><strong>Cold-water ocean currents</strong> occur when the cold water at the poles sinks and slowly moves towards the equator.</li>\r\n\t\t<li><strong>Warm-water currents</strong> travel out from the equator along the surface, <strong>flowing towards the poles to replace the sinking cold water</strong>. <em> Hence, statement c is correct.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of gravity:</strong>\r\n\t<ul>\r\n\t\t<li><strong>Gravity tends to pull the water down</strong> to pile and create gradient variation.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of Coriolis force:</strong>\r\n\t<ul>\r\n\t\t<li>The <strong>Coriolis force intervenes and causes the water to move to the right in the northern hemisphere</strong> and to the left in the southern hemisphere.</li>\r\n\t\t<li>These<strong> large accumulations of water</strong> and the flow around them are called <strong>Gyres</strong>.</li>\r\n\t\t<li>These produce large circular currents in all the ocean basins. One such circular current is the <strong>Sargasso Sea.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 76, "question": "\r\n<p><strong>DIRECTIONS: Find the word which can be replaced for the given sentence.</strong></p>\r\n\r\n<p>A place for luggage at railway station.</p>", "option1": "\r\n<p>Boutique</p>", "option2": "\r\n<p>Cloak room</p>", "option3": "\r\n<p>Dormitory</p>", "option4": "\r\n<p>Creche</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>Cloakroom </strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The most appropriate word for the given group of words is &#39; <strong>Cloakroom </strong>&#39;.</li>\r\n\t<li>It means <strong>&#39;a room near the entrance to a building where you can leave your coat, bags, etc.&#39; </strong>(किसी इमारत के प्रवेश द्वार पर स्थित एक कमरा जहाँ कोट, थैले आदि समान रखे जाते हैं; अमानती सामानघर)\r\n\t<ul>\r\n\t\t<li><em>Example: Above the <strong>cloakroom </strong>is the bathroom, while the second floor at this end is the attic.</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Answer:</u></strong><em>Cloakroom.</em></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the <strong>meaning </strong>of other words:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Boutique </strong>: a small shop that sells fashionable clothes or expensive presents. (छोटी दुकान जहाँ लोकप्रिय कपड़े या महँगे उपहार बिकते हैं; बुटीक)</li>\r\n\t\t<li><strong>Dormitory </strong>: a large bedroom with a number of beds in it, especially in a school, etc. [अनेक पलंगों वाला बड़ा शयनकक्ष (विशेषतः स्&zwj;कूल आदि में)]</li>\r\n\t\t<li><strong>Creche </strong>: a place where small children are looked after while their parents are working, shopping, etc. (माता-पिता की अनुपस्थिति में शिशुओं की देखभाल का स्&zwj;थान; शिशुसदन, शिशुगृह) </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 77, "question": "\r\n<p>Rearrange the parts of the sentence in correct order.</p>\r\n\r\n<p>P: As we know that some hobbies demand a little guidance from an experienced person.</p>\r\n\r\n<p>Q: Our sudden attachment to them without any knowledge may lead to wastage of money.</p>\r\n\r\n<p>R: The choice of hobbies is not an easy task.</p>\r\n\r\n<p>S: Due to this we may abandon them easily.</p>", "option1": "\r\n<p>RPQS</p>", "option2": "\r\n<p>RSPQ</p>", "option3": "\r\n<p>PQSR</p>", "option4": "\r\n<p>PQRS</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option (1) &ldquo; <strong>RPQS </strong>&rdquo;</p>\r\n\r\n<ul>\r\n\t<li>The opening sentence is  <strong>&quot;The choice of hobbies is not an easy task&quot; </strong> which initially start a speech about hobbies.</li>\r\n\t<li>The next part needs to be telling us more about hobbies and relate with the opening sentence, which is <strong>&ldquo;As we know that some hobbies demand a little guidance from an experienced person.&rdquo;</strong></li>\r\n\t<li>The next sentence i.e. <strong>&ldquo;Our sudden attachment to them without any knowledge may lead to wastage of money&rdquo;  </strong>guidance requirement for keeping hobbies is justified with referring as <strong>&#39;them </strong>.&#39;</li>\r\n\t<li> Rest of the sentence is the <strong>conclusion derived </strong>from wastage of money in the previous sentence which is  <strong>&quot;Due to this we abandon them easily.&quot;</strong></li>\r\n</ul>\r\n\r\n<p>Therefore, the correct sequence of the jumble para would be: -</p>\r\n\r\n<p><em>&ldquo; The choice of hobbies is not an easy task. As we know that some hobbies demand a little guidance from an experienced person. Our sudden attachment to them without any knowledge may lead to wastage of money. Due to this we abandon them easily.&quot;</em></p>", "question_heading": ""}, {"sr_no": 78, "question": "\r\n<p><strong>Direction: In the following question, a sentence has been given in Active (or Passive) voice. Out of the four alternatives suggested, select the one which best expresses the same sentence in Passive (or Active) voice. </strong></p>\r\n\r\n<p>I saw him leaving the house. </p>", "option1": "\r\n<p>He had been seen leaving the house.  </p>", "option2": "\r\n<p>He was seen to be leaving the house.  </p>", "option3": "\r\n<p>Leaving the house he was seen by me.</p>", "option4": "\r\n<p>He was seen leaving the house by me.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>He was seen leaving the house by me. </strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in <strong>active voice</strong>. We need to change it into <strong>passive voice</strong>.</li>\r\n\t<li>The subject<strong> &#39;I&#39;</strong> of the active voice becomes the object <strong>&#39;me&#39;</strong> of the passive voice.</li>\r\n\t<li>The object <strong>&#39;him&#39;</strong> of the active voice becomes the subject <strong>&#39;he&#39;</strong> of the passive voice.</li>\r\n\t<li>The given sentence is in <strong>simple past tense.</strong></li>\r\n\t<li><strong>&#39;Saw&#39; </strong>changes to <strong>&#39;was seen&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 4.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Sentence</strong></u>: <em>He was seen leaving the house by me.</em></p>", "question_heading": ""}, {"sr_no": 79, "question": "\r\n<p>One of the longest qanats in the Deccan is that which supplied water to the _______.fort.</p>", "option1": "\r\n<p>Bidar</p>", "option2": "\r\n<p>Golconda</p>", "option3": "\r\n<p>Bijapur</p>", "option4": "\r\n<p>Gulbarga</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>One of the longest qanats in the Deccan is that which supplied water to the <strong><u>Bidar</u></strong> fort.</p>\r\n\r\n<ul>\r\n\t<li>In India, there are <strong>karez (qanat)</strong> systems are located at <strong>Bidar, Bijapur, Burhanpur (Kundi Bhandara) and Aurgangabad.</strong></li>\r\n\t<li>The <strong>Bidar karez systems</strong> were probably <strong>the first one</strong> to have ever been dug in India.</li>\r\n\t<li>It dates to the <strong>Bahmani period</strong>.</li>\r\n\t<li>Bidar has three karez systems as per Gulam Yazdani&#39;s documentation.</li>\r\n\t<li>The qanat which supplied water to Deccan is the longest qanats in the Deccan. </li>\r\n\t<li>Other than <strong>Naubad</strong> there are two more karez systems in Bidar, <strong>&quot;Shukla Theerth&quot; and &quot;Jamna Mori&quot;. </strong></li>\r\n\t<li><strong>The Shukla theerth is the longest karez system in Bidar and also in the Deccan. </strong></li>\r\n\t<li><strong>Through it, water were supplied to the Bidar fort.</strong></li>\r\n</ul>\r\n\r\n<p>Hence, we can conclude that one of the longest qanats in the Deccan is that which supplied water to the <u>Bidar</u>  fort.</p>", "question_heading": ""}, {"sr_no": 80, "question": "\r\n<p>Which of the following is natural auxin?</p>", "option1": "\r\n<p>Dry ice</p>", "option2": "\r\n<p>Mendole and citric acid</p>", "option3": "\r\n<p>Ammonium nitrate</p>", "option4": "\r\n<p>Indole 3- acetic acid</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Indole 3- acetic acid.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>IAA (Indole-3-Acetic Acid) is the abundant and well-known plant hormone of the auxin class.</li>\r\n\t<li>Its formula is C10H9NO2.</li>\r\n\t<li>IAA is predominantly produced in the apical bud of young leaves of plants and is known to be an inducer of cell division and elongation.</li>\r\n\t<li>IAA, as well as most other auxins, are also known to act in concert with, or in opposition to, other plant hormones.</li>\r\n\t<li>For example, the ratio of auxin to cytokinin in certain plant tissues determines the initiation of root versus shoot buds.</li>\r\n\t<li>NAA (1-Naphthaleneacetic acid) is a synthetic plant hormone in the auxin family.\r\n\t<ul>\r\n\t\t<li>Its formula is C₁₀H₇CH₂CO₂H.</li>\r\n\t\t<li>Synthetic auxin (NAA) suppresses secondary wall cellulose synthesis and enhances elongation in cultured cotton fiber.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>4-D is a synthetic auxin, which is a class of plant growth regulators.\r\n\t<ul>\r\n\t\t<li>It is absorbed through the leaves and is translocated to the meristems of the plant. Uncontrolled, unsustainable growth ensues causing stem curl-over, leaf withering, and eventual plant death.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>IBA (Indole-3-butyric acid) is a plant hormone belonging to the auxin family and assists in initiating root formation, the in vitro process is called micropropagation.\r\n\t<ul>\r\n\t\t<li>Aside from accelerating root formation, it is used on various crops to stimulate flower development and the growth of fruits. This ultimately increases crop yields.</li>\r\n\t\t<li>Its formula is C12H13NO2.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 81, "question": "\r\n<p><strong>Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.</strong></p>\r\n\r\n<p>During foggy weather, flights are often cancelled, <u>isn&rsquo;t it </u>?</p>", "option1": "\r\n<p>do they</p>", "option2": "\r\n<p>aren&rsquo;t they</p>", "option3": "\r\n<p>No substitution required</p>", "option4": "\r\n<p>haven&rsquo;t they</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;aren&#39;t they&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The un
