other hand&#39; </strong>is an idiom <strong>used to introduce a statement that contrasts with a previous statement or presents a different point of view</strong>.\r\n\t<ul>\r\n\t\t<li><strong>For Example</strong> - He&#39;s a good guy. His brother, <strong>on the other hand</strong>, is a very selfish man.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Therefore, the correct answer for the blank is</strong> &#39;On&#39;.</p>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (2)?</p>", "option1": "\r\n<p>off</p>", "option2": "\r\n<p>of</p>", "option3": "\r\n<p>in</p>", "option4": "\r\n<p>to</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>Of</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the second blank, <strong>&#39;of&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;Of&#39; </strong>is a preposition that indicates relationships between other words, such as belonging, things made of other things, things that contain other things, or a point of reckoning.</li>\r\n\t<li><strong>Usage of &#39;Of&#39;</strong> - We use of when we want to show that people or things relate to other things or people. For example, when we want to say that something or someone belongs to or is a part of something or someone else, we can do it like this:</li>\r\n\t<li><strong>For Examples:-</strong>\r\n\t<ul>\r\n\t\t<li>Tiffany stared at the floor <strong>of </strong>her room.</li>\r\n\t\t<li>He resigned his position as a member <strong>of </strong>the school board.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Here &#39;of&#39; is showing the <strong>relationship between withdrawal and Farm acts</strong>.</li>\r\n\t<li>Therefore,<strong> &#39;of&#39;</strong> will be the appropriate answer for the blank.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (5)?</p>", "option1": "\r\n<p>At</p>", "option2": "\r\n<p>On</p>", "option3": "\r\n<p>In</p>", "option4": "\r\n<p>with</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is<strong> In</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the<strong> fifth</strong> blank of the passage,<strong> &#39;in&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;In&#39;</strong> is used to<strong> show the position of something within a limited space, but in a more general sense. </strong></li>\r\n\t<li>It&rsquo;s best suited when you want to say something is contained within something else or inside something else.</li>\r\n\t<li>Here, the selling of crops is being done in the output market <strong>which is showing the position of crops to be sold</strong>.</li>\r\n</ul>\r\n\r\n<p><strong>Therefore, the correct answer for the blank is</strong> &#39;In&#39;.</p>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>What does the phrase, &lsquo;Rather than yield to the pleas of the victim,&rsquo; mean?</p>", "option1": "\r\n<p>Tried to listen to the appeal of the learner</p>", "option2": "\r\n<p>Attempted to oppose the victim</p>", "option3": "\r\n<p>Instead of giving in to the requests of the victim</p>", "option4": "\r\n<p>Tried to yield to the pleas of the victim</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>Instead of giving in to the requests of the victim. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>In the given passage, the writer explains the effects of punishments given by the teacher on the learner.</li>\r\n\t<li>In line 1 of paragraph 2;\r\n\t<ul>\r\n\t\t<li>The typical <strong>Teacher was willing to deliver as much pain as was available </strong>to give.</li>\r\n\t\t<li><strong>Rather than yield to the pleas of the victim </strong>, about two thirds of the subjects in Milgram&rsquo;s experiment pulled every one of the thirty shock switches in front of them and continued to engage the last switch (450 volts) until the researcher ended the experiment.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>&quot;Yield to&quot; in the given sentence means to stop refusing to do something,  </strong>somebody is asking to do.</li>\r\n\t<li>According to the given passage, <strong>the &#39;teacher&#39; doesn&#39;t stop giving shocks to the victim i.e. &quot;the learner&quot;.</strong></li>\r\n\t<li>Thus, it can be inferred from the above explanation that &quot;rather than yield to the pleas of the victim&quot; means that &quot;instead of giving in to the requests of the victim&quot; the teacher continues the punishment.</li>\r\n</ul>\r\n\r\n<p>Hence, the <strong>correct answer is option 3 </strong>.</p>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n<p>What can be the most suitable title for this passage?</p>", "option1": "\r\n<p>Obedience to Authority</p>", "option2": "\r\n<p>Study on Memory</p>", "option3": "\r\n<p>An Experiment on Punishment</p>", "option4": "\r\n<p>Tolerance Level of Human</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot;Obedience to Authority.&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given passage describes the series of psychological experiments which were conducted to study the effects of punishment on learning.</li>\r\n\t<li>Now, let us understand the given options and see which one of them is the suitable title for the passage.\r\n\t<ul>\r\n\t\t<li>&quot;Obedience to Authority&quot; fits the best to the given passage, refer to the following lines:\r\n\t\t<ul>\r\n\t\t\t<li>Line 4 of paragraph 2:  This <strong>blind obedience to authority made them do such inhuman acts.</strong></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>While <strong>the options 2, 3 and 4 describe a part of the passage, option 1 indicate the whole idea of the given passage.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, option 1 is the most suitable title for the given passage.</li>\r\n</ul>\r\n\r\n<p>Hence, <strong>the correct answer is option 1 </strong>.</p>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n<p>Why did the teacher continue to give punishment to the learner?</p>", "option1": "\r\n<p>Teacher wanted to correct the learner</p>", "option2": "\r\n<p>Teacher was only following the given instructions</p>", "option3": "\r\n<p>Teacher believed in punishing learner who answered wrongly</p>", "option4": "\r\n<p>Teacher believed in proving the aims of the study</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>Teacher was only following the given instructions. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>We are asked to answer why the teacher continued to give punishment to the learner.</li>\r\n\t<li>Refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>Line 3 and 4 of paragraph 2: The <strong>reason for such inhuman behavior of a &lsquo;teacher&rsquo; </strong>, according to Milgram, is that his subject&rsquo;s <strong>inability to defy the wishes of the boss of the study&mdash;the lab-coated researcher </strong>who urged and, if need be, directed the subjects to perform their duties, despite the emotional and physical mayhem they were causing.</li>\r\n\t\t<li>Line 4 of paragraph 2: <strong>This blind obedience to authority </strong>made them do such inhuman acts.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, from the above given lines it is clear that the teacher continued the punishment because he/she was following the instructions given by the researcher.</li>\r\n</ul>\r\n\r\n<p>Hence, the <strong>correct answer is option 2 </strong>.</p>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p>What purpose was given to the volunteers about Milgram&rsquo;s experiment?</p>", "option1": "\r\n<p>To study the effect of following the orders of authority</p>", "option2": "\r\n<p>They were not told about the purpose</p>", "option3": "\r\n<p>To study the effect of punishment on learning</p>", "option4": "\r\n<p>To study the effect of memory based learning</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>To study the effect of the following the orders of authority. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>Refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>Line 1 of paragraph 1:  A series of psychological experiments were conducted by Professor Milgram <strong>to study the effect of punishment on learning.</strong></li>\r\n\t\t<li>Line 1 of paragraph 1:   In these experiments <strong>two participants had to take part as teacher and learner.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the above given lines, it is clear that the participants were asked to take part in the experiment to study the effect of punishment on learning.</li>\r\n</ul>\r\n\r\n<p>Hence, it can be concluded that <strong>the correct answer is option 3 </strong>.</p>\r\n\r\n<ul>\r\n\t<li> Experiment:  a scientific test that is done in order to get proof of something or new knowledge.</li>\r\n\t<li>Punishment: the imposition of an undesirable or unpleasant outcome upon a group or individual, meted out by an authority.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>What can be devised about General Lee from this passage?</p>", "option1": "\r\n<p>He could have made better plans for fighting the war.</p>", "option2": "\r\n<p>He should have retreated instead of fighting.</p>", "option3": "\r\n<p>He was a scatter brained person who knew how to fight.</p>", "option4": "\r\n<p>He was a practical and principled man who knew the tactics of war.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>He was a practical and principled man who knew the tactics of war.</strong></p>\r\n\r\n<ul>\r\n\t<li>In this passage General Lee was a practical and principled man who knew the tactics of war.</li>\r\n\t<li>Therefore <strong>option 4 </strong>is the correct option.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>After reading this passage, you can conclude that Hooker was ______.</p>", "option1": "\r\n<p>hopeful</p>", "option2": "\r\n<p>vain</p>", "option3": "\r\n<p>disliked</p>", "option4": "\r\n<p>ignorant</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>vain</strong>.</p>\r\n\r\n<ul>\r\n\t<li>After reading the passage, you can conclude that hooker was <strong><u>vain</u></strong>.</li>\r\n\t<li>Hooker boasted, &quot;My plans are perfect&quot; even though the Union soldiers were in a dire situation, having lost the last four major battles and being famished, exhausted, and demoralized. He had amassed a great deal of intelligence about Lee&rsquo;s army and was aware of his own numeric advantage. Hooker was so sure of his advantage that he believed Lee&#39;s only option was to retreat to Richmond.</li>\r\n\t<li><strong>Vain - </strong>Having or showing an excessively high opinion of one&#39;s appearance, abilities, or worth.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; His flattery made her vain. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n\t<li>Let&#39;s discuss information about other options:</li>\r\n\t<li><strong>Hopeful</strong> - Felling or inspiring optimism about a future event.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; A hopeful sign. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Disliked</strong> - Feel distaste for or hostility towards.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; She dislikes noise. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Ignorant</strong> - Lacking knowledge or awareness in general.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Shreya is very ignorant. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>What would be the synonym for propensity?</p>", "option1": "\r\n<p>Conviction</p>", "option2": "\r\n<p>Proclivity</p>", "option3": "\r\n<p>Repugnance</p>", "option4": "\r\n<p>Abhorrence</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Proclivity</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The synonym for propensity is Proclivity.</li>\r\n\t<li><strong>Propensity</strong> = <strong>Proclivity</strong> = An inclination or natural tendency to behave in a particular way. \r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Her propensity for violence. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n\t<li>Let&#39;s discuss information about other options:</li>\r\n\t<li><strong>Conviction</strong> - A firmly held belief or opinion.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Sam takes pride in stating his political conviction. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Repugnance</strong> - Intense disgust.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Our repugnance at the bleeding carcasses. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Abhorrence</strong> - Feeling of revulsion or disgusted loathing.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; The thought of marrying him filled her with abhorrence. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>How many men did Hooker position behind Lee&#39;s army?</p>", "option1": "\r\n<p>64,000</p>", "option2": "\r\n<p>70,000</p>", "option3": "\r\n<p>1,34,000</p>", "option4": "\r\n<p>61,000</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>70</strong><strong>,000</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The Hooker positioned 70,000 men behind Lee&#39;s army.</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n<p>Which one of the following options is<strong><em>not</em></strong>associated with computer system?</p>", "option1": "\r\n<p>PPP</p>", "option2": "\r\n<p>FTP</p>", "option3": "\r\n<p>URL</p>", "option4": "\r\n<p>EPF</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The Correct Answer is <strong><u>EPF</u></strong>.</p>\r\n\r\n<ul>\r\n\t<li><strong>EPF(Employee Provident Fund) </strong>is <strong>not associated with the computer system </strong>.</li>\r\n\t<li>The Employees&#39; Provident Fund was <strong>created on November 15, 1951 </strong>, when the Employees&#39; Provident Funds Ordinance was passed.</li>\r\n\t<li>The Workers&#39; Provident Funds Act of 1952 repealed it. The <strong>Workers&#39; Provident Funds Bill (Bill No. 15 of 1952) </strong>was introduced in Parliament as a bill to provide for the creation of provident funds for employees in factories and other establishments.</li>\r\n\t<li>The Employees&#39; Provident Funds &amp; Miscellaneous Provisions Act, 1952, which encompasses the entire country, is now known as the Employees&#39; Provident Funds &amp; Miscellaneous Provisions Act, 1952.</li>\r\n\t<li><strong>Point-to-Point Protocol (PPP)</strong>\r\n\t<ul>\r\n\t\t<li>It is a data link layer (layer 2) communication protocol that connects two routers directly without the use of a host or any other networking.</li>\r\n\t\t<li>It has the ability to authenticate connections, encrypt transmissions, and compress data.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>The File Transfer Protocol (FTP)</strong>\r\n\t<ul>\r\n\t\t<li>It is a common communication protocol for transferring data files over a computer network from a server to a device.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Uniform Resource Locator (URL) </strong>,\r\n\t<ul>\r\n\t\t<li>It is a reference to a web resource that specifies its location on a computer network as well as a mechanism for retrieving it.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>The convenient place to store contact information for quick retrieval in an e-mail is</p>", "option1": "\r\n<p>address box</p>", "option2": "\r\n<p>message box</p>", "option3": "\r\n<p>address book</p>", "option4": "\r\n<p>message book</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<ul>\r\n\t<li>An <strong>address book </strong>or a name and address book (NAB) is a book or a <strong>database utilized </strong>for putting away sections called contacts. Each contact section, for the most part, comprises a couple of standard fields (for instance: first name, last name, organization name, address, phone number, email address, fax number, cell phone number).</li>\r\n\t<li><strong>Address box: </strong>The address box is a pane in the browser window of Internet Explorer that holds the current document&#39;s URL. You can type a URL in this <strong>box</strong> and press Enter to access a Web page. See also the location field. </li>\r\n\t<li><strong>Message box: </strong>A message box is a special type of Visual Basic window in which you can display a message to the user. You can display a message, an optional icon, a title bar caption, and command buttons in a message box.</li>\r\n\t<li><strong>Message book:  </strong>A message book is a book that contains messages. It doesn&#39;t provide a scope to modify or change the messages.</li>\r\n\t<li><strong>Hence, an address book is a convenient place to store contact information for quick retrieval in an e-mail.</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>A service which provides user interface to access the available multimedia resources over a network is called ______.</p>", "option1": "\r\n<p>UseNet</p>", "option2": "\r\n<p>RUL</p>", "option3": "\r\n<p>Web</p>", "option4": "\r\n<p>Internet Relay Chat (IRC)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Web</strong></u></p>\r\n\r\n<ul>\r\n\t<li>The <strong>Web </strong>is the common name for the <strong>World Wide Web </strong>, a <strong>subset of the Internet </strong>consisting of the <strong>pages </strong>that can be accessed by a <strong>Web browser </strong>. Many people assume that the Web is the same as the Internet, and use these terms interchangeably. However, the term Internet actually refers to the <strong>global network of servers </strong>that makes the information sharing that happens over the Web possible. So, although the Web does make up a <strong>large portion of the Internet </strong>, they are not one and the same.</li>\r\n\t<li>Web pages are formatted in a language called <strong>Hypertext Markup Language (HTML) </strong>. It this language that allows users to click through pages on the Web via <strong>links </strong>. The Web uses <strong>HTTP protocol </strong>to transmit data and share information. <strong>Browsers </strong>such as Internet Explorer, Google Chrome, or Mozilla Firefox are used to access Web documents, or Web pages, which are connected via links.</li>\r\n\t<li>The Web is just one of the ways that information is shared over the <strong>Internet </strong>; others include email, instant messaging, and <strong>File Transfer Protocol (FTP) </strong>. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n<p>Why would you want to freeze rows in your spreadsheet?</p>", "option1": "\r\n<p>To modify only the frozen rows</p>", "option2": "\r\n<p>To limit the data that can be entered in the frozen row</p>", "option3": "\r\n<p>To prevent the rows from being edited by collaborates</p>", "option4": "\r\n<p>To scroll through the spreadsheet While continuing to see the frozen rows</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>To scroll through the spreadsheet While continuing to see the frozen rows</strong></u>.</p>\r\n\r\n<p> You can freeze a row in Excel so<strong> it&#39;s easier to compare data as you scroll through the spreadsheet</strong>. You can choose to only freeze the first visible row in your Excel sheet, or freeze multiple rows.</p>\r\n\r\n<p><strong>Freezing of rows and columns:</strong></p>\r\n\r\n<p>Freezing of the panes helps the user to only see the rows and the columns which have been frozen while scrolling down the worksheet. The cell below the row and to the right of the column has to be selected which has to be kept visible.</p>\r\n\r\n<p><strong>Freeze panes</strong> are a feature in spreadsheet applications, such as Microsoft Excel, LibreOffice Calc, and Google Sheets. It &quot;freezes&quot; a row or column, so that it is always displayed, even as you navigate the spreadsheet.</p>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>Once an e-mail has been sent, it is moved from the ______ folder to the ______ folder.</p>", "option1": "\r\n<p>outbox, sent</p>", "option2": "\r\n<p>inbox, outbox</p>", "option3": "\r\n<p>inbox, sent</p>", "option4": "\r\n<p>outbox, inbox</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p>When you compose an email and hit send, it first goes to the &ldquo; <strong>Outbox </strong>&rdquo; folder before it connects to the mail server and is successfully sent to the recipient. After the messages have been successfully delivered to the recipient, they are being moved to the &ldquo; <strong>Sent </strong>&rdquo; or &ldquo;Sent Messages folder&rdquo;. </p>\r\n\r\n<p>If the messages fail to send, they are stuck in the Outbox folder as the communications in and out of the mail server are blocked. Emails stuck in the Outbox are a common issue in email programs, mostly because it fails to connect to the SMTP server. </p>\r\n\r\n<p><strong>Hence the correct answer is</strong><em>outbox, sent.</em></p>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>____________ is a visual representation of your information and ideas which is used to create a layout that fits your message in MS PowerPoint.</p>", "option1": "\r\n<p>Chart</p>", "option2": "\r\n<p>Back ground pictures</p>", "option3": "\r\n<p>Shapes</p>", "option4": "\r\n<p>Smart Art graphic</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is a <u><strong>Smart Art graphic</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>Smart art graphics are a visual representation of your information and ideas. which is used to create a layout that fits your message in MS PowerPoint.</li>\r\n\t<li>Some layouts (such as organization charts and Venn diagrams) portray specific kinds of information, while others simply enhance the appearance of a bulleted list.</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Chart</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>It is a graphical representation for data visualization, in which &quot;the data is represented by symbols, such as bars in a bar chart, lines in a line chart, or slices in a pie chart&quot;.</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Shapes</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>A shape or figure is the form of an object or its external boundary, outline, or external &middot; Some simple shapes can be put into broad categories.</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Background pictures</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>It is also known as a desktop wallpaper, desktop background, desktop picture, or desktop image on computers) is a digital image (photo, drawing, etc.)</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n\r\n<p>Which of the following is an input device?</p>", "option1": "\r\n\r\n<p>Speaker</p>", "option2": "\r\n\r\n<p>Projector</p>", "option3": "\r\n\r\n<p>Light pen</p>", "option4": "\r\n\r\n<p>Plotter</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is a <u><strong>Light pen</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>An input device </strong>in computing is a piece of computer hardware equipment used to supply a data processing system including a computer or information appliance with control and data signals.\r\n\r\n\t<ul>\r\n\t\t<li><strong>Keyboards, scanners, mouses, joysticks,</strong><strong>light pens, scanners, </strong><strong>and digital cameras are examples of input devices.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>A  light pen is a computer input device in the form of a light-sensitive wand used in conjunction with a computer&#39;s cathode-ray tube (CRT) display.\r\n\t<ul>\r\n\t\t<li>It allows the user to point to displayed objects or draw on the screen in a similar way to a touchscreen but with greater positional accuracy. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Output device</strong>\r\n\t<ul>\r\n\t\t<li>The output device is the device that is used to display or communicate the output or result of the data processing done by the computer.</li>\r\n\t\t<li><strong>Examples of output devices </strong>are <strong>Plotter, inject printer, speaker, laser printer, and multimedia projector </strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Speaker </strong>-\r\n\t<ul>\r\n\t\t<li>Speaker is an electronic transducer that converts electromagnetic waves into sound waves</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Projector-\r\n\t<ul>\r\n\t\t<li>The projector is an optical device that projects the electronic image on a surface also known as a projection screen.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Plotter-\r\n\t<ul>\r\n\t\t<li>The plotter is a printing device that is used to print vector graphic images.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n\r\n<p>Which one of the following statements is not true with respect to the Central Processing Unit (CPU)?</p>", "option1": "\r\n\r\n<p>CPU processes data and instructions.</p>", "option2": "\r\n\r\n<p>The CPU is a part of the ALU.</p>", "option3": "\r\n\r\n<p>CPU also has a set of registers.</p>", "option4": "\r\n\r\n<p>It performs arithmetic operations.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is <strong>Option (2) </strong>.</p>\r\n\r\n<ul>\r\n\t<li>A <strong>central processing unit (CPU) </strong>, also called a <strong>central processor, main processor </strong>, or just <strong>processor </strong>is the <strong>electronic circuitry </strong>within a computer that executes instructions that make up a computer program.</li>\r\n\t<li>The <strong>CPU </strong>performs <strong>basic arithmetic, logic, controlling, and input/output (I/O) operations </strong>specified by the instructions in the program.</li>\r\n\t<li>The computer industry used the term <strong>&quot;central processing unit&quot; </strong>as early as <strong>1955 </strong>.</li>\r\n\t<li>Principal components of a CPU include the <strong>arithmetic logic unit (ALU) </strong>that performs arithmetic and logic <strong>operations, processor registers </strong>that <strong>supply operands </strong>to the ALU and store the results of ALU operations, and a control unit that orchestrates the fetching ( <strong>from memory </strong>) and execution of instructions by directing the coordinated operations of the ALU, registers and other components.</li>\r\n\t<li>The fundamental operation of most <strong>CPUs </strong>, regardless of the physical form they take, is to execute a sequence of stored instructions that is called a program. The instructions to be executed are kept in some kind of computer memory. Nearly all <strong>CPUs </strong>follow the <strong>fetch, decode and execute steps in their operation </strong>, which are collectively known as the instruction cycle.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>The file Attached with an e-mail which is sent to a receiver is called as:</p>", "option1": "\r\n<p>Annexure</p>", "option2": "\r\n<p>Attachment</p>", "option3": "\r\n<p>PDF</p>", "option4": "\r\n<p>None of the above</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Attachment</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>An email attachment</strong> is a computer file sent along with an email message.</li>\r\n\t<li>One or more files can be attached to any email message, and be sent along with it to the recipient.</li>\r\n\t<li>This is typically used as a simple method to share documents and images.</li>\r\n</ul>\r\n\r\n<p><strong>Annexure</strong></p>\r\n\r\n<ul>\r\n\t<li>An annexure is an addition to something, often to a document.</li>\r\n\t<li>When used generally to simply mean something added, annexure is interchangeable with annex.</li>\r\n\t<li>Annexure is more commonly used in the U.K. and India, where it often specifically refers to an addition to an official document.</li>\r\n</ul>\r\n\r\n<p><strong>PDF</strong></p>\r\n\r\n<ul>\r\n\t<li>The full form of <u>PDF is Portable Document Format.</u></li>\r\n\t<li>They are typically used to distribute read-only documents that preserve the layout of a page.</li>\r\n\t<li>It was developed in the early 1990s by Adobe Systems.</li>\r\n\t<li>PDF provides an easy and secure approach for data transmission and sharing through emails and other sources.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>How to save your computer from viruses?  </p>", "option1": "\r\n<p>Rebooting</p>", "option2": "\r\n<p>Restart</p>", "option3": "\r\n<p>Scan</p>", "option4": "\r\n<p>Anti-Virus</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Anti-Virus</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Anti-virus </strong>helps in saving  computers from viruses.\r\n\r\n\t<ul>\r\n\t\t<li>It is a <strong>software program that identifies and eliminates any threats that can damage a computer system.</strong></li>\r\n\t\t<li>It is a set of programs that are designed to prevent, search for, detect, and remove software viruses.</li>\r\n\t\t<li>Antivirus software begins operating by checking computer programs and files against a database of known types of malware.</li>\r\n\t\t<li>Most antivirus programs incorporate both automated and manual filtering abilities. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Rebooting</strong>\r\n\t<ul>\r\n\t\t<li>It  is the process of closing and starting a computer or its operating system from the initial boot-loading sequence.</li>\r\n\t\t<li>In simpler terms, it means restarting <strong> a computer via the power button.</strong></li>\r\n\t\t<li>The computer unloads all device drivers, closes all programs, and restarts the operating system.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>Which of the following is the default port of POP3 protocol?</p>", "option1": "\r\n<p>160</p>", "option2": "\r\n<p>110</p>", "option3": "\r\n<p>95</p>", "option4": "\r\n<p>995</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>110 </strong>.</p>\r\n\r\n<ul>\r\n\t<li>The full form of the <strong>POP3 </strong>is <strong>Post Office Protocol version 3 </strong>.</li>\r\n\t<li>It is referred to as a <strong>simple mail protocol </strong>. The main job of the POP3 is to <strong>retrieve </strong>or <strong>copy </strong>mail from a <strong>remote server </strong>and then send that email to the specific local client. </li>\r\n\t<li><strong>POP3 </strong>is <strong>not programmed </strong>for <strong>handling </strong>and  <strong>synchronising </strong>the mail in the user&#39;s mailbox throughout <strong>multiple devices </strong>. </li>\r\n\t<li>There are two ports used for POP3. These are given below:\r\n\t<ul>\r\n\t\t<li><strong>Port 110- By default POP3 </strong>uses <strong>Port 110 </strong>for retrieving mail.</li>\r\n\t\t<li><strong>Port 995- POP3 port 995 </strong>is used in SSL/TLS.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong> Thus the correct answer is</strong><em>110 </em>.</p>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n\r\n<p>Which one of the following is a recent E-Banking initiative in Commercial Banks in India ?</p>", "option1": "\r\n\r\n<p>NECS</p>", "option2": "\r\n\r\n<p>NEFT</p>", "option3": "\r\n\r\n<p>NET Banking</p>", "option4": "\r\n\r\n<p>RTGS</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>There has been considerable innovation and diversification in the business of major commercial banks. Some of them have engaged in the areas of consumer credit, credit cards, merchant banking, leasing, mutual funds, etc. A few banks have already set up subsidiaries for merchant banking, leasing and mutual funds and many more are in the process of doing so.</p>\r\n\r\n<p><strong>RECENT TRENDS IN BANKING:</strong></p>\r\n\r\n<p><strong>Real-Time Gross Settlement (RTGS): </strong></p>\r\n\r\n<ol>\r\n\t<li> Real-Time Gross Settlement system, introduced in India in <strong>March 2004</strong>, is a system through which <strong>electronics instructions</strong> can be given by banks to <strong>transfer funds</strong> from their account to the account of another bank.</li>\r\n\t<li>The RTGS system is maintained and <strong>operated by the RBI</strong> and provides a means of <strong>efficient and faster funds transfer</strong> among banks facilitating their financial operations.</li>\r\n\t<li>As the name suggests, funds transfer between banks takes place on a &lsquo;<strong>Real-Time</strong>&#39; basis.</li>\r\n\t<li>Therefore, money can reach the beneficiary instantaneously and the beneficiary&#39;s bank has the responsibility to credit the beneficiary&#39;s account <strong>within two hours. </strong></li>\r\n</ol>\r\n\r\n<p><strong>1. NEFT: </strong></p>\r\n\r\n<ul>\r\n\t<li>National Electronic Fund Transfer (NEFT) is a nation-wide payments system that allows the<strong> transfer of funds </strong>from one bank&#39;s account to another.</li>\r\n\t<li>With an increased focus on online banking, NEFT has become one of the most popular ways of transferring funds.</li>\r\n\t<li><strong>Fund transfer under NEFT is settled in batches as opposed to the real-time settlement process in RTGS. The batches are settled in hourly time slots.</strong></li>\r\n</ul>\r\n\r\n<p><strong>2. NECS: </strong>Customer. National Electronic Clearing Service system introduced by Reserve Bank of India (RBI) for electronic fund transfer within India. The objective of the system is to facilitate centralized processing for repetitive and bulk payment instructions.  In October 2008, a centralised version of ECS Credit known as National- ECS (NECS) has been launched. NECS has no restriction of centres or of any geographical area inside the country. The system takes advantage of the centralised accounting system in banks.</p>\r\n\r\n<p><strong>3. NET Banking : </strong></p>\r\n\r\n<ul>\r\n\t<li> Internet banking, also known as <strong>online banking or e-banking, or Net Banking</strong> is a facility offered by banks and financial institutions that allow customers to use banking services over the internet.</li>\r\n\t<li>Customers <strong>need not visit their bank&#39;s branch</strong> office to avail each and every small service.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>Which of the following is not classified as computer hardware?</p>", "option1": "\r\n<p>mouse</p>", "option2": "\r\n<p>Monitor</p>", "option3": "\r\n<p>Hard Disk</p>", "option4": "\r\n<p>DBMS</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>DBMS.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>Computer Hardware means the <strong>physical units of the system </strong>.\r\n\r\n\t<ul>\r\n\t\t<li><strong>For example  </strong>-\r\n\r\n\t\t<ul>\r\n\t\t\t<li>Central processing unit,</li>\r\n\t\t\t<li>Monitor,</li>\r\n\t\t\t<li>Keyboard,</li>\r\n\t\t\t<li>Mouse,</li>\r\n\t\t\t<li>Hard disk, etc.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>The set of instructions given by software can be stored and run by hardware. </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Software </strong>is a set of instructions, data or programs used to operate computers and execute specific tasks.\r\n\t<ul>\r\n\t\t<li>It is the opposite of hardware, which describes the physical aspects of a computer.</li>\r\n\t\t<li><strong>For example </strong>-\r\n\t\t<ul>\r\n\t\t\t<li>Word processors,</li>\r\n\t\t\t<li>Spreadsheets,</li>\r\n\t\t\t<li>Database systems,</li>\r\n\t\t\t<li>Presentation software,</li>\r\n\t\t\t<li>E-mail tools.</li>\r\n\t\t\t<li>DBMS- Data Base management system.</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence DBMS is correct answer.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>Which of the following is NOT a computer hardware?</p>", "option1": "\r\n<p>Mouse</p>", "option2": "\r\n<p>Monitor</p>", "option3": "\r\n<p>Keyboard</p>", "option4": "\r\n<p>Antivirus</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Antivirus</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>Antivirus software </strong> (abbreviated to AV software), also known as anti-malware, is a computer program used to prevent, detect, and remove malware.</li>\r\n\t<li><strong>Antivirus software </strong>was originally developed to detect and remove computer viruses, hence the name.</li>\r\n\t<li>However, with the proliferation of other kinds of malware, antivirus software started to provide protection from other computer threats. </li>\r\n\t<li>So <strong>Antivirus is basically a type of Software as the correct answer is Antivirus </strong>.</li>\r\n\t<li><strong>Computer hardware </strong>includes the physical parts of a computer, such as a case, <strong>central processing unit (CPU), monitor, mouse, keyboard, computer data storage, graphics card, sound card, speakers and motherboard </strong>. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>Which of the following is not browser?</p>", "option1": "\r\n<p>Mozilla Firefox</p>", "option2": "\r\n<p>Apple Safari</p>", "option3": "\r\n<p>Opera</p>", "option4": "\r\n<p>Microsoft Bing</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 4</strong> i.e.<u><strong>Microsoft Bing</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>A web <strong>browser</strong>, or simply &quot;<strong>browser</strong>,&quot; is an application used to access and view websites.</li>\r\n\t<li>Common web <strong>browsers</strong> include Microsoft Internet Explorer, Google Chrome, Mozilla Firefox, and Apple Safari.</li>\r\n\t<li>The web <strong>browser</strong> retrieves the necessary content from a web server and then displays the page on the user&#39;s device.</li>\r\n\t<li>The <strong>first</strong> web <strong>browser</strong>, WorldWideWeb, was developed in 1990 by Tim Berners-Lee for the NeXT Computer and introduced to his colleagues at CERN in March 1991.</li>\r\n\t<li>Vinton G. &quot;Vint&quot; Cerf (born 1943) is an American computer scientist. He is recognized as one of &quot;<strong>the fathers of the Internet</strong> &quot;, sharing this title with Bob Kahn.</li>\r\n\t<li>Bing is a web search engine owned and operated by Microsoft.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>In the field of computers and Internet, what does W3C stand for?</p>", "option1": "\r\n<p>World Wide Web Content</p>", "option2": "\r\n<p>World Wide Web Centre</p>", "option3": "\r\n<p>World Wide Web Consortium</p>", "option4": "\r\n<p>World Wide Web Commission</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>World Wide Web Consortium</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li>In the field of computers and the Internet, W3C stands for  <strong>World Wide Web Consortium </strong>.</li>\r\n\t<li>The <strong>World Wide Web Consortium (W3C) </strong>is an international community where Member organizations, a full-time staff, and the public work together to <strong>develop Web standards </strong>.</li>\r\n\t<li>Founded in 1994 and currently led by Web inventor and <strong>Director Tim Berners-Lee and CEO Jeffrey Jaffe </strong>, W3C&#39;s mission is to lead the Web to its full potential.</li>\r\n\t<li>The W3C is an industry consortium that seeks to <strong>promote standards for the evolution of the Web and interoperability between WWW products by producing specifications and reference software </strong>. Although W3C is funded by industrial members, it is vendor-neutral, and its products are freely available to all.</li>\r\n\t<li>The organization is guided by its open standards principles. It calls them OpenStand, which it refers to as <strong>&ldquo;The Modern Paradigm for Standards&quot; </strong>.</li>\r\n\t<li>The World Wide Web Consortium (W3C) was founded in 1994 by Tim Berners-Lee after he left the European Organization for Nuclear Research (CERN) in <strong>October 1994 </strong>.</li>\r\n\t<li>It was founded at the <strong>Massachusetts Institute of Technology Laboratory for Computer Science (MIT/LCS) </strong>with support from the European Commission, the Defense Advanced Research Projects Agency (DARPA), which had pioneered the ARPANET, one of the predecessors to the Internet.</li>\r\n\t<li>W3C also engages in education and outreach, develops software, and serves as an open forum for discussion about the Web.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>In MS word 2010, shortcut key to save the file is:</p>", "option1": "\r\n<p>Ctrl+S</p>", "option2": "\r\n<p>Ctrl+D</p>", "option3": "\r\n<p>Alt+D</p>", "option4": "\r\n<p>Alt+S</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>Key</td>\r\n\t\t\t<td>Function</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + S</td>\r\n\t\t\t<td>Saves the currently open document.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + O</td>\r\n\t\t\t<td>Open an existing document.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Ctrl+D</td>\r\n\t\t\t<td> opens the font preferences window.</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Alt+S</td>\r\n\t\t\t<td> opens the References tab in the Ribbon. Once in the References tab, you&#39;ll also have the option to press an additional key to select an option in the References tab. For example, after pressing Alt+S if you press &quot;P,&quot; it would open the CAPTION option</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + F</td>\r\n\t\t\t<td>Opens a find option to find text in the current document or file</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n\r\n<p>Which of the following is <strong>NOT </strong>a memory?</p>", "option1": "\r\n\r\n<p>Cache</p>", "option2": "\r\n\r\n<p>Ram</p>", "option3": "\r\n\r\n<p>A.L.U.</p>", "option4": "\r\n\r\n<p>Rom</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is<u><strong> A.L.U</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><strong>An arithmetic logic unit(ALU) is a major component of the central processing unit of the computer system.</strong></li>\r\n\t<li><strong>It does all processes related to arithmetic and logic operations that need to be done on instruction words. Hence option 3 is correct.</strong></li>\r\n\t<li><strong>ALU is also known as an Integer Unit (IU)</strong>. The arithmetic logic unit is that part of the CPU that handles all the calculations the CPU may need.</li>\r\n\t<li>In some microprocessor architectures, the ALU is divided into the arithmetic unit (AU) and the logic unit (LU).</li>\r\n\t<li><u><strong>The function of ALU.</strong></u>\r\n\t<ul>\r\n\t\t<li>logical operations.</li>\r\n\t\t<li>Bit-Shifting Operations.</li>\r\n\t\t<li>Arithmetic operations.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><strong>Cache memory</strong></u>\r\n\t<ul>\r\n\t\t<li>It is also called <strong>Cache</strong>, a supplementary <strong>memory</strong> system that temporarily stores frequently used instructions and data for quicker processing by the central processor of a computer. The <strong>cache</strong> augments and is an extension of, a computer&#39;s main <strong>memory</strong>.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><strong>Random Access Memory (RAM)</strong></u>\r\n\t<ul>\r\n\t\t<li>It is used to store the programs and data being used by the CPU in real-time. The data on the random access memory can be read, written, and erased any number of times. RAM is a hardware element where the data being currently used is stored. It is a volatile memory.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><strong>Read-Only Memory (ROM)</strong></u>\r\n\t<ul>\r\n\t\t<li>It is a type of memory where the data has been prerecorded. Data stored in ROM is retained even after the computer is turned off ie, non-volatile.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n\r\n<p>An electronic device that converts a computer&#39;s digital signals into analogue format for transmission over a phone line is called:</p>", "option1": "\r\n\r\n<p>Modem</p>", "option2": "\r\n\r\n<p>Hub</p>", "option3": "\r\n\r\n<p>Switch</p>", "option4": "\r\n\r\n<p>Network interface card</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is a <u><strong>modem.</strong></u></p>\r\n\r\n<ul>\r\n\t<li>An electronic device that converts a computer&#39;s digital signals into an analogue format for transmission over a phone line is called a modem.</li>\r\n\t<li><strong>Modem </strong>:\r\n\t<ul>\r\n\t\t<li>It is an electronic device that converts a computer&#39;s digital signals into analogue format for transmission over a phone line.</li>\r\n\t\t<li>A modem transmits data by modulating one or more transmitter wave signals to encode digital information, while the receiver decrypts the signal to recreate the original digital information.</li>\r\n\t\t<li>The ultimate aim is to produce a signal that can be transmitted easily and decoded reliably.</li>\r\n\t\t<li>Modems can be used with any means of transmitting analog signals.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>A <strong>network interface card </strong>is a device that connects computer to computer.\r\n\t<ul>\r\n\t\t<li>It is also known as a network adapter, LAN adapter or physical network interface.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n<p>Web Pages are saved in which of the following format?</p>", "option1": "\r\n<p>http://</p>", "option2": "\r\n<p>HTML</p>", "option3": "\r\n<p>DOC</p>", "option4": "\r\n<p>URL</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option<u><strong>2</strong></u>i.e<u><strong>HTML</strong></u>.</p>\r\n\r\n<ul>\r\n\t<li><u><strong>Web pages use a language called the HyperText Markup Language (HTML).</strong></u>\r\n\r\n\t<ul>\r\n\t\t<li>HTML  is  used  to create electronic documents (called pages) that are displayed on the World Wide Web.</li>\r\n\t\t<li>The browser applications (Microsoft&iacute;s Internet Explorer, Mozilla&iacute;s Firefox, etc.) are designed to interpret HTML to display text, images and using hyperlinks, navigate the web.</li>\r\n\t\t<li>First developed by <strong>Tim Berners-Lee in 1990.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>HTTP </strong>is the Hypertext Transfer Protocol.\r\n\t<ul>\r\n\t\t<li>HTTP is an application protocol that usually contains a list of guidelines for transferring distributed data file systems and multimedia communication on the World Wide Web ( WWW).</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>DOC or doc </strong>(an abbreviation of &quot;document&quot;) is a filename extension for word processing documents, most commonly in the proprietary Microsoft Word Binary File Format.</li>\r\n\t<li><strong>URL </strong>stands for <strong>Uniform Resource Locator </strong>.\r\n\t<ul>\r\n\t\t<li>Every web page that is displayed on the Internet has a specific address associated with it. This address is known as the URL.</li>\r\n\t\t<li>It tells us the location of the web page being displayed and other related information.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
