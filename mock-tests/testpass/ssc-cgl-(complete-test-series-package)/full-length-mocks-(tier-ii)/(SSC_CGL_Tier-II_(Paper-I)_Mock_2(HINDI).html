<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) SSC CGL Tier-II (Paper-I) Mock 2(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

ै। \n  <br>", "option3": "यदि I और II दोनों अनुसरण करते हैं। \n  <br>", "option4": "यदि न तो I और न ही II अनुसरण करता है। \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "दिए गए कथन में, यह उल्लेख किया गया है कि ऑनलाइन स्ट्रीमिंग प्लेटफ़ॉर्म की उपलब्धता के कारण कई लोग सिनेमा जाने के बजाय घर पर फिल्में और टीवी शो देखना पसंद करते हैं। आइए प्रत्येक अनुमान का मूल्यांकन करें:\n  <br>I. ऑनलाइन स्ट्रीमिंग प्लेटफॉर्म के उदय के बाद से सिनेमा की उपस्थिति में गिरावट आई है। यह अनुमान तार्किक रूप से दिए गए कथन का अनुसरण करता है। यदि लोग सिनेमा जाने के बजाय ऑनलाइन स्ट्रीमिंग प्लेटफॉर्म के माध्यम से घर पर फिल्में और टीवी शो देखना पसंद कर रहे हैं, तो इससे पता चलता है कि सिनेमा में उपस्थिति कम होने की संभावना है। ऑनलाइन स्ट्रीमिंग प्लेटफ़ॉर्म की उपलब्धता और सुविधा मनोरंजन के लिए एक वैकल्पिक विकल्प प्रदान करती है, जो सिनेमा उपस्थिति को प्रभावित कर सकती है।\n  <br>II. ऑनलाइन स्ट्रीमिंग प्लेटफॉर्म पर उपलब्ध फिल्मों और टीवी शो की गुणवत्ता सिनेमा रिलीज की तुलना में बेहतर है। यह अनुमान तर्कसंगत रूप से दिए गए कथन का पालन नहीं करता है। बयान ऑनलाइन स्ट्रीमिंग प्लेटफॉर्म और सिनेमा रिलीज के बीच फिल्मों और टीवी शो की तुलनात्मक गुणवत्ता के बारे में कोई जानकारी नहीं देता है। घर पर देखने की प्राथमिकता सामग्री की अनुमानित गुणवत्ता के बजाय सुविधा, लागत या व्यक्तिगत प्राथमिकताओं जैसे कारकों से प्रभावित हो सकती है।\n  <br>उपरोक्त विश्लेषण के आधार पर, दिए गए कथन से केवल निष्कर्ष I तार्किक रूप से अनुसरण करता है। इसलिए, सही उत्तर है (a) यदि केवल I अनुसरण करता है।\n  <br>", "question_heading": ""}, {"sr_no": 59, "question": "इस पर्श्न में, कथन के बाद दो निष्कर्ष हैं। दोनों में से कौन सा/से निष्कर्ष सत्य है/हैं?\n  <br> \n  <b>कथन:</b> P ≥ Q = R > S > T < U = V > W \n  <br> \n  <b>निष्कर्ष:</b> \n  <br>I. P > T \n  <br>II. R > U \n  <br>", "option1": "न तो निष्कर्ष I और न ही II सत्य है।\n  <br>", "option2": "केवल निष्कर्ष II सत्य है।\n  <br>", "option3": "निष्कर्ष I और II दोनों सत्य हैं।\n  <br>", "option4": "केवल निष्कर्ष I सत्य है।\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "दिए गए कथन से केवल I निष्कर्ष निर्धारित किया जा सकता है। अतः, (d) सही उत्तर है।\n  <br>", "question_heading": ""}, {"sr_no": 60, "question": "निम्नलिखित में से उस विकल्प का चयन करें जो यहाँ दिए गए शब्द से नहीं बनाया जा सकता है। \n  <br>ELECTROMAGNETIC\n  <br>", "option1": "ELECTRIC\n  <br>", "option2": "MAGNET\n  <br>", "option3": "MAGNETIC\n  <br>", "option4": "TELEDRUM \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "दिए गए शब्द \" ELECTROMAGNETIC \" के अक्षरों का उपयोग करके TELEDRUM नहीं बनाया जा सकता है।\n  <br>", "question_heading": ""}, {"sr_no": 61, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>Two of his schooners were upset in a \n  <b>squall</b>, with the loss of all hands, and he allowed two to be cut off by Yeo. \n  <br>", "option1": "Storm\n  <br>", "option2": "Tranquility\n  <br>", "option3": "Gust\n  <br>", "option4": "Tempest\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b. \n  <br>As a noun, a \"\n  <b>squall</b>\" refers to a sudden, brief, and violent gust of wind, often accompanied by rain or snow. It can also describe a sudden storm with strong winds.\n  <br>As a verb, \"\n  <b>to squall</b>\" means to cry or scream loudly and harshly, usually referring to the cry of a baby or a high-pitched noise resembling crying or screaming.\n  <br>In general, \"squall\" is associated with sudden, intense bursts of wind or noise, whether it's related to weather or vocal expressions.\n  <br>Synonyms: Storm, gust, tempest, blast.\n  <br>Antonyms: Calm, stillness, \n  <b>tranquility</b>, serenity.\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Storm</b>: A violent disturbance of the atmosphere, characterized by strong winds, rain, thunder, and often lightning.\n  <br> \n  <b>Tranquility</b>: The state of calmness, peacefulness, and quietness.\n  <br> \n  <b>Gust</b>: A sudden, strong burst of wind.\n  <br> \n  <b>Tempest</b>: A violent and tumultuous storm with strong winds and often accompanied by rain, thunder, and lightning.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>The scientific study of elections\n  <br>", "option1": "Philology\n  <br>", "option2": "Ophiology\n  <br>", "option3": "Phenology\n  <br>", "option4": "Psephology\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d. \n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Philology</b>: The study of language, including the historical development, structure, and relationships of languages, as well as the analysis of texts and their interpretation.\n  <br> \n  <b>Ophiology</b>: The branch of zoology that deals with snakes.\n  <br> \n  <b>Phenology</b>: The study of cyclic and seasonal natural phenomena, especially in relation to climate and plant and animal life.\n  <br> \n  <b>Psephology</b>: The study and analysis of elections and voting patterns.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. The Ordinance promulgated by the President on May 19 amending the Government of \n  <br>B. the jurisdiction of the Delhi government. The services had been earlier restored to \n  <br>C. National Capital Territory of Delhi Act 1991 took away the services from \n  <br>D. the Delhi government by the Supreme Court in a landmark judgment delivered on May 11, 2023.\n  <br>", "option1": "ABCD\n  <br>", "option2": "CDBA\n  <br>", "option3": "ACBD\n  <br>", "option4": "ADBC\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order is ACBD.\n  <br> Sentence A introduces the topic by stating that an Ordinance was promulgated by the President, which amended the Government of National Capital Territory of Delhi Act 1991 and resulted in the services being taken away from the Delhi government.\n  <br> Sentence C provides background information by mentioning that the services had previously been restored to the jurisdiction of the Delhi government.\n  <br> Sentence B explains that the services had been restored to the Delhi government through a landmark judgment delivered by the Supreme Court on May 11, 2023.\n  <br> Finally, sentence D concludes the paragraph by referring back to the Supreme Court judgment and its impact on the Delhi government.\n  <br> Overall, the correct order of sentences ACBD creates a coherent paragraph that explains the sequence of events related to the amendment of the act and the change in jurisdiction of the Delhi government.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the most appropriate option to fill in the blanks.\n  <br>The _______________ debate on quantum physics left the audience _______________, as the renowned physicist delved into intricate concepts and abstruse theories.\"\n  <br>", "option1": "esoteric, confounded\n  <br>", "option2": "banal, astounded\n  <br>", "option3": "pedantic, engrossed\n  <br>", "option4": "colloquial, perplexed\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"\n  <b>esoteric</b>\" (meaning known or understood by only a few) fits the context of a debate on quantum physics that involves intricate and abstract concepts. \n  <br>The word \"\n  <b>confounded</b>\" (meaning confused or bewildered) appropriately describes the state of the audience after being exposed to such a complex discussion. \n  <br>Therefore, option (a) \"esoteric, confounded\" is the correct answer.\n  <br> Option (b) \"banal, astounded\" is incorrect because \"\n  <b>banal</b>\" means \n  <b>lacking originality or freshness</b>, which doesn't fit the context of an in-depth debate on quantum physics. Additionally, \"\n  <b>astounded</b>\" implies \n  <b>being greatly surprised or amazed</b>, which doesn't convey confusion or bewilderment.\n  <br> Option (c) \"pedantic, engrossed\" is incorrect because \"\n  <b>pedantic</b>\" refers to \n  <b>being excessively concerned with minor details or rules</b>, which is not the intended meaning in this context. \"\n  <b>Engrossed</b>\" suggests \n  <b>being fully absorbed or focused</b>, but it does not capture the sense of confusion or perplexity.\n  <br> Option (d) \"colloquial, perplexed\" is incorrect because \"\n  <b>colloquial</b>\" refers to \n  <b>informal or conversational language</b>, which is not suitable for a debate on quantum physics. \"\n  <b>Perplexed</b>\" conveys \n  <b>confusion</b>, but \"colloquial\" does not fit the sentence's overall tone and topic.\n  <br> Therefore, the correct answer is (a) esoteric, confounded.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>The team won the championship by the \n  <b>skin of their teeth</b>.\n  <br>", "option1": "Dominated the competition\n  <br>", "option2": "Won convincingly\n  <br>", "option3": "Narrowly won or achieved something\n  <br>", "option4": "Displayed exceptional sportsmanship\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) ‘Narrowly won or achieved something’.\n  <br> In the given sentence, \"\n  <b>by the skin of their teeth</b>\" indicates that the team won the championship by a very narrow margin or with great difficulty. It suggests that their victory was extremely close and they barely managed to secure it.\n  <br> Options (a) \"Dominated the competition\" and (b) \"Won convincingly\" are incorrect because they imply a more decisive or dominant victory, which contradicts the context of winning by a narrow margin.\n  <br> Option (d) \"Display exceptional sportsmanship\" is unrelated to the meaning of the idiom and does not reflect the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "Select the correct homonym from the given options to fill in the blank.\n  <br>The doctor advised the patient to follow a healthy ________ to improve their overall well-being.\n  <br>", "option1": "Diet\n  <br>", "option2": "Dye\n  <br>", "option3": "Dyes\n  <br>", "option4": "Dight\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) ‘diet’.\n  <br> In the given sentence, \"diet\" refers to a specific selection of food and drinks consumed by an individual. \n  <br> It is commonly used in the context of maintaining a healthy eating plan or making dietary choices for health purposes.\n  <br> Options (b) \"dye,\" (c) \"dyes,\" and (d) \"dight\" are incorrect because they are either unrelated words or have different meanings that do not fit the context of the sentence.\n  <br> \n  <b>Dye</b>: A substance or colorant used to impart color to materials like fabric or hair.\n  <br> \n  <b>Dight</b>: To dress or adorn someone or something, or to prepare or equip for a specific purpose.\n  <br> Therefore, the correct answer is (a) diet.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given. From the options P, Q, R and S select the appropriate sentences for S2 and S3, respectively.</b> \n  <br>(S1) The observance of International Biodiversity Day (May 22) was yet another reminder of the pivotal role our natural world plays in resolving the climate change crisis, which, along with the decline of biodiversity, poses an existential threat to our future. \n  <br>(S2)\n  <br>(S3)\n  <br>(S4) Mitigation of climate change is but one of the several benefits we derive from biodiversity.\n  <br> (P) Biodiversity, the rich variety of life forms and their interconnections with each other and the environment, is everywhere: inside our bodies as ubiquitous microbiomes, in our backyards, villages, towns, and cities, and in remote wild places as well-organized ecological communities and ecosystems.\n  <br>(Q) Maintaining and enhancing biodiversity on land and in oceans is perhaps the least expensive mechanism to sequester carbon dioxide from the atmosphere so as to cool our land and oceans.\n  <br>(R) Biodiversity or biological diversity is the variety and variability of life on Earth. Biodiversity is a measure of variation at the genetic, species, and ecosystem level.\n  <br>(S) More than 99.9% of all species that ever lived on Earth, amounting to over five billion species, are estimated to be extinct.\n  <br>", "option1": "Q, S\n  <br>", "option2": "P, R\n  <br>", "option3": "P, Q \n  <br>", "option4": "S, P\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given paragraph, sentence S2 should provide information that expands on the concept of biodiversity, while sentence S3 should discuss the relationship between biodiversity and climate change.\n  <br> Sentence P, \"Biodiversity, the rich variety of life forms and their interconnections with each other and the environment, is everywhere: inside our bodies as ubiquitous microbiomes, in our backyards, villages, towns, and cities, and in remote wild places as well-organized ecological communities and ecosystems,\" fits as S2. This sentence provides a comprehensive description of biodiversity, emphasizing its presence and interconnections across various environments and ecosystems.\n  <br> Sentence Q, \"Maintaining and enhancing biodiversity on land and in oceans is perhaps the least expensive mechanism to sequester carbon dioxide from the atmosphere so as to cool our land and oceans,\" fits as S3. It discusses how biodiversity plays a role in mitigating climate change by sequestering carbon dioxide, leading to cooling effects on land and oceans.\n  <br> Therefore, the correct answer is option (c) P, Q, as it provides the appropriate sentences to complete the paragraph logically and coherently.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don’t find any error, mark ‘No error’ as your answer.\n  <br>She managed to brush off the setbacks and carried on with determination.\n  <br>", "option1": "She managed to brush off the\n  <br>", "option2": "setbacks and carried\n  <br>", "option3": "on with determination.\n  <br>", "option4": "No error\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "There is no error in this sentence. Therefore, the answer is (d) ‘No error’.\n  <br> The sentence uses the phrasal verb \"brush off\" correctly, which means to dismiss or ignore something, usually in a casual or nonchalant manner. \n  <br> Additionally, the use of \"carried on\" as a phrasal verb is appropriate and means to continue or persevere. \n  <br> The sentence conveys the intended meaning of overcoming setbacks and moving forward with determination.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Select the most appropriate option to fill in the blank.\n  <br>He had twelve disciples, who after his _______ into heaven went forth into the provinces of the world and taught His greatness; whence they who at this day believe their preaching are called Christians.\"\n  <br>", "option1": "Assent\n  <br>", "option2": "Ascent\n  <br>", "option3": "Dissent \n  <br>", "option4": "Accent \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (b) ‘ascent’.\n  <br>The sentence is referring to the disciples of someone who ascended into heaven, indicating the disciples' journey or movement after this event.\n  <br>\"\n  <b>Ascent</b>\" refers to the act of rising or moving upward, which fits the context of the sentence. \n  <br>The phrase \"after His ascent into heaven\" suggests that the disciples continued their work after their leader's upward movement into heaven.\n  <br>Meanings of other options are as follows:\n  <br> \n  <b>Assent</b>: Agreement or approval.\n  <br> \n  <b>Dissent</b>: Disagreement or difference of opinion.\n  <br> \n  <b>Accent</b>: Emphasis or distinctive manner of pronunciation.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.\n  <br>The researchers set out to delve onto the complex workings of the human brain, aiming to unravel its intricacies and unlock new discoveries.\n  <br>", "option1": "The researchers set out\n  <br>", "option2": "to delve onto\n  <br>", "option3": "the complex workings\n  <br>", "option4": "of the human brain\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The segment that contains a grammatical error is (b) \"to delve onto.\"\n  <br>The correct phrasal verb is \"to delve into,\" meaning to explore or investigate deeply. The word \"onto\" is incorrect in this context. Therefore, the corrected segment should be \"to delve into.\"\n  <br>Hence, the corrected sentence would be: \"The researchers set out to delve into the complex workings of the human brain, aiming to unravel its intricacies and unlock new discoveries.\"\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the INCORRECTLY spelt word.\n  <br>", "option1": "Aggresive\n  <br>", "option2": "Conscientious\n  <br>", "option3": "Supersede\n  <br>", "option4": "Accommodation\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a. \n  <br> Aggresive: This option is spelled incorrectly. The correct spelling is \"\n  <b>Aggressive</b>,\" which means displaying a forceful or assertive behavior.\n  <br> \n  <b>Conscientious</b>: This option is spelled correctly. It refers to a person who is diligent, thorough, and takes great care in performing tasks or duties.\n  <br> \n  <b>Supersede</b>: This option is spelled correctly. It means to replace or take the place of something or someone, especially by being superior or more advanced.\n  <br> \n  <b>Accommodation</b>: This option is spelled correctly. It refers to providing lodging or a place to stay. It can also mean adjusting or adapting to meet someone's needs or requirements.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the option that expresses the given sentence in reported speech.\n  <br>“I will help you with your homework”, said Sarah.\n  <br>", "option1": "Sarah said that she would help you with your homework.\n  <br>", "option2": "Sarah said that she will help you with your homework.\n  <br>", "option3": "Sarah said that she will help me with my homework.\n  <br>", "option4": "Sarah said that she would help me with my homework.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option that changes the given direct speech sentence to indirect speech is (d) Sarah said that she would help me with my homework.\n  <br>In indirect speech, the reporting verb is changed to the past tense (\"said\" becomes \"said\"), and the pronouns are usually shifted to reflect the perspective of the speaker. \n  <br>In this case, \"I\" is changed to \"she\" to match the reported speaker (Sarah), and the future tense \"will\" is changed to the past tense \"would\" to maintain the sequence of tenses.\n  <br>Therefore, the correct answer is (d) Sarah said that she would help me with my homework.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the option that expresses the given sentence in active voice.\n  <br>The cake was baked by Martha.\n  <br>", "option1": "The cake is baked by Martha.\n  <br>", "option2": "Martha baked the cake.\n  <br>", "option3": "Martha has been baking the cake.\n  <br>", "option4": "The cake will be baked by Martha.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option that expresses the given sentence \"The cake was baked by Martha\" in active voice is (b) Martha baked the cake.\n  <br>To convert a sentence from passive voice to active voice, we typically make the subject of the passive sentence the doer or performer of the action in the active sentence. \n  <br>In this case, \"Martha\" is the doer or performer of the action of baking the cake. Therefore, when we switch to active voice, we state \"Martha baked the cake.\"\n  <br>Rule to change a Simple Present Tense sentence from active to passive voice and vice versa is:\n  <br> \n  <b>Subject + V2 + object. -> <- Object + auxiliary verb (was, were) + past participle + by + subject.</b> \n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the option that expresses the given sentence in passive voice.\n  <br>John will paint the walls tomorrow.\n  <br>", "option1": "The walls will be painted by John yesterday.\n  <br>", "option2": "The walls will be painting by John tomorrow.\n  <br>", "option3": "The walls will be painted by John tomorrow.\n  <br>", "option4": "The walls will be painted by John today.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option that expresses the given sentence \"John will paint the walls tomorrow\" in passive voice is (c) ‘The walls will be painted by John tomorrow’.\n  <br>To convert a sentence from active voice to passive voice, we typically make the object of the active sentence the subject of the passive sentence. \n  <br>In this case, \"the walls\" are the object of the action \"paint.\" Therefore, when we switch to passive voice, we state \"The walls will be painted.\" Additionally, we mention \"by John\" to indicate the doer or performer of the action.\n  <br>Rule to change a Simple Future Tense sentence from active to passive voice and vice versa is:\n  <br> \n  <b>Subject + will, shall + verb + object -> <- Object + auxiliary verb (will, shall) + be + past participle + by + subject.</b> \n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select ‘No substitution required’.\n  <br>The concert was \n  <b>enjoyable than any</b> other musical event I have attended.\n  <br>", "option1": "most enjoyable than\n  <br>", "option2": "No substitution required\n  <br>", "option3": "more enjoyable than any\n  <br>", "option4": "enjoyable as any\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option that can substitute the underlined segment in the given sentence \"The concert was enjoyable than any other musical event I have attended\" is (c) more enjoyable than any.\n  <br> The original sentence is comparing the enjoyment level of the concert to other musical events. To express this comparison correctly, we need to use the word \"more\" before \"enjoyable\" to indicate a higher degree of enjoyment compared to other events.\n  <br> We use ‘than’ in comparative degree of comparison.\n  <br> \n  <b>Comparative Degree</b>: An adjective is said to be in the comparative degree when it is used to compare two nouns/pronouns.\n  <br> Therefore, the corrected sentence would be \"The concert was more enjoyable than any other musical event I have attended.\"\n  <br> Hence, the correct answer is (c) more enjoyable than any.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. It is 200 times stronger than steel but six times lighter. It is almost perfectly transparent as it absorbs only 2% of light.\n  <br>B. It conducts electricity better than copper.\n  <br>C. It is impermeable to gases, even those as light as hydrogen and helium.\n  <br>D. Graphene is the world’s thinnest, strongest, and most conductive material of both electricity and heat.\n  <br>", "option1": "D, B, A, C\n  <br>", "option2": "A, B, C, D\n  <br>", "option3": "B, C, A, D\n  <br>", "option4": "A, D, B, C\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In order to form a coherent and meaningful paragraph, the sentences need to flow logically and provide a clear description of graphene.\n  <br> Sentence D states that \"Graphene is the world's thinnest, strongest, and most conductive material of both electricity and heat.\" This sentence introduces the topic of graphene and highlights its exceptional properties.\n  <br> Sentence B follows by stating that \"It conducts electricity better than copper.\" This sentence provides a specific comparison between graphene and copper, emphasizing graphene's superior conductivity.\n  <br> Sentence A adds further details about graphene, stating that \"It is 200 times stronger than steel but six times lighter\" and \"It is almost perfectly transparent as it absorbs only 2% of light.\" These details highlight the strength, lightness, and transparency of graphene.\n  <br> Finally, sentence C concludes the paragraph by mentioning another remarkable property of graphene, stating that \"It is impermeable to gases, even those as light as hydrogen and helium.\" This emphasizes the impermeability of graphene to gases, including the lightest ones.\n  <br> Therefore, the correct order to form a coherent and meaningful paragraph is D, B, A, C.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>Classicism in the shape of solid, respectable Hummel on the one hand, and Carl Czerny, a trifle \n  <b>flippant</b>, perhaps, and inclined to appeal to the gallery, on the other, these gave the musical parentage of young Liszt.\n  <br>", "option1": "Reverent\n  <br>", "option2": "Lenient \n  <br>", "option3": "Desolate\n  <br>", "option4": "Noxious\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"\n  <b>flippant</b>\" is an adjective that refers to a disrespectful or light-hearted attitude, often in a way that is seen as lacking seriousness or proper respect for a serious topic or situation.\n  <br>Synonyms: Disrespectful, irreverent, frivolous, impertinent.\n  <br>Antonyms: Respectful, serious, thoughtful, \n  <b>reverent</b>.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Reverent</b>: Showing deep respect or admiration, often in a religious or spiritual context.\n  <br> \n  <b>Lenient</b>: Not strict or harsh in enforcing rules or standards, showing tolerance or forgiveness.\n  <br> \n  <b>Desolate</b>: Empty, barren, or lacking in life, feeling, or activity; deserted or bleak.\n  <br> \n  <b>Noxious</b>: Harmful, poisonous, or unpleasant, often referring to gases, fumes, or substances that can cause harm or illness.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Fill in the blanks with the most appropriate option.\n  <br>The curator, unwilling to _____________ the rare artefacts to potential harm during the transportation, resolved to personally oversee their _____________ to ensure their integrity is uncompromised.\n  <br>", "option1": "expose, conveyance\n  <br>", "option2": "unveil, journey\n  <br>", "option3": "disclose, movement\n  <br>", "option4": "reveal, transition\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct choice is (a) \"expose, conveyance\".\n  <br>So, the sentence reads: \"The curator, unwilling to expose the rare artefacts to potential harm during the transportation, resolved to personally oversee their conveyance to ensure their integrity is uncompromised.\"\n  <br>The word \"\n  <b>expose</b>\" in this context means to subject something to some influence or action, often a harmful one. \"\n  <b>Conveyance</b>\" refers to the action or process of transporting or carrying someone or something from one place to another.\n  <br>Here are the meanings of the other options:\n  <br> \n  <b>Unveil</b>: means to show or announce publicly for the first time, and \"journey\" means an act of traveling from one place to another.\n  <br> \n  <b>Disclose</b>: means to make secret or new information known, and \"movement\" means an act of changing physical location or position or of having this changed.\n  <br> \n  <b>Reveal</b>: means make (previously unknown or secret information) known to others, and \"transition\" refers to the process or a period of changing from one state or condition to another.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br> P: In a statement issued on July 6, the Institutional Finance Wing of the State’s Finance Department said a decision on rescheduling of existing loans and sanctioning of fresh loans was taken at a special meeting of the State-Level Bankers’ Committee recently.\n  <br>Q: “Banks have been instructed to extend the moratorium period up to 12 months from the date of implementation of the rehabilitation, restructuring measures and for retail loans under P-segment (personal/pension/vehicle/housing loans, etc).\n  <br>R: The Manipur government has asked the banks to provide relief measures to all categories of borrowers by extending the moratorium by up to a year in view of the ethnic violence that has swept the State.\n  <br>S: The relief measures would be taken up under the Reserve Bank of India’s Relief Measures by Banks in Areas Affected by Natural Calamities Directions, 2018, the statement said.\n  <br>", "option1": "SPRQ\n  <br>", "option2": "RPSQ\n  <br>", "option3": "SPQR\n  <br>", "option4": "PRSQ\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of sentences is (b) RPSQ.\n  <br> \n  <b>R: </b>This sentence introduces the main topic of the paragraph: the Manipur government's directive to banks to provide relief measures in response to ethnic violence. It serves as a suitable opening sentence.\n  <br> \n  <b>P:</b> This sentence builds upon the first by offering more specifics about the relief measures, making it a natural second sentence.\n  <br> \n  <b>S:</b> This sentence gives additional details about the source of these relief measures, continuing the narrative smoothly from sentence P.\n  <br> \n  <b>Q:</b> The final sentence presents specific instructions given to banks, providing a strong conclusion by offering concrete details that reflect the actions outlined in the previous sentences.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Select the option that expresses the given sentence in direct speech.\n  <br>He bade his friends goodbye.\n  <br>", "option1": "“I will see you later” he told his friends.\n  <br>", "option2": "“I am bidding you Goodbye”\n  <br>", "option3": "He said “Goodbye my friends.”\n  <br>", "option4": "“Goodbye my friends” he was saying to them.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Option (c) is the correct direct form of the given sentence.\n  <br> \n  <b>Direct speech</b>- Direct speech, also known as quoted speech or direct quotation, is a way of reporting someone's exact words. \n  <br> \n  <b>Indirect speech</b>- Indirect speech, also known as reported speech or indirect quotation, is a way of reporting someone's words or thoughts indirectly, without using their exact words.\n  <br>In this case, \"bade his friends goodbye\" can be most accurately translated to direct speech as \"He said, 'Goodbye, my friends.'\"\n  <br>Here are some rules to remember when converting indirect (or reported) speech to direct speech:\n  <br> Use quotation marks (\" \") to enclose the exact words of the speaker.\n  <br> The tenses, pronouns, and words expressing nearness of time or place in reported speech may need to be changed to match the original speech. For example, if the reported speech uses past tense, the direct speech may need to use present tense, if the original speech happened in the present.\n  <br> The reporting verb (e.g., \"he said\") usually comes before the actual spoken words in direct speech. However, it can also come in the middle or at the end.\n  <br> When the reporting verb comes before the actual words, it's typically followed by a comma.\n  <br> If the direct speech contains a question, it should end with a question mark within the quotation marks. Similarly, if it's an exclamation, it should end with an exclamation mark within the quotation marks.\n  <br>Given these rules, option (c) \"He said 'Goodbye my friends.'\" is the most accurate direct speech translation of the sentence \"He bade his friends goodbye.\"\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A process of making something (like pain or problems) less severe or unpleasant without removing the cause.\n  <br>", "option1": "Enhancement\n  <br>", "option2": "Escalation\n  <br>", "option3": "Amplification\n  <br>", "option4": "Alleviation\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct one-word substitute for the phrase \"A process of making something (like pain or problems) less severe or unpleasant without removing the cause\" is (d) \"Alleviation\".\n  <br> \n  <b>Alleviation</b> means the action or process of making suffering, deficiency, or a problem less severe.\n  <br>Now let's define the other options:\n  <br> \n  <b>Enhancement</b> refers to an increase or improvement in quality, value, or extent.\n  <br> \n  <b>Escalation</b> implies an increase or intensification, typically in the context of conflict, danger, or a problem.\n  <br> \n  <b>Amplification</b> means the action or process of enlarging upon or adding detail to a story or statement, which could also refer to increasing the volume or strength of something.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Identify the INCORRECTLY spelled word in the given sentence.\n  <br>A comprehensive understanding of the interconnectedness of various ecosystems can elucidate the profound impact human activities exert on the environment, neccessitating the implementation of sustainable practices.\n  <br>", "option1": "Interconnectedness\n  <br>", "option2": "Elucidate\n  <br>", "option3": "Neccessitating\n  <br>", "option4": "Implementation\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Option c is incorrectly spelt.\n  <br>Correct spelling is “Necessitating”.\n  <br>Meanings of all options-\n  <br> \n  <b>Interconnectedness</b>: The state of being connected or linked together.\n  <br> \n  <b>Elucidate</b>: To clarify or explain something in a clear and detailed manner.\n  <br> \n  <b>Necessitating</b>: Requiring or making something necessary.\n  <br> \n  <b>Implementation</b>: The act of putting a plan or decision into effect or action.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Replace the highlighted word with its synonym to make the sentence more meaningful.\n  <br>Carmen said he had learned the gift of \n  <b>gab</b> from his Dad, but Jonathan had always been perceptive about people. \n  <br>", "option1": "Chatter\n  <br>", "option2": "Silence\n  <br>", "option3": "Taciturnity\n  <br>", "option4": "Reticence\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "As a noun, \"\n  <b>Gab</b>\" refers to idle or trivial talk, often characterized by excessive or meaningless chatter. It can also refer to informal conversation or gossip.\n  <br>As a verb, \"Gab\" means to talk excessively or chatter, often about unimportant or trivial matters. It implies a tendency to speak at length or to engage in conversation without much substance.\n  <br>Overall, \"Gab\" is commonly used to describe informal, chatty, or idle talk that may lack depth or significance.\n  <br>Synonyms: Talk, \n  <b>chatter</b>, babble, prattle, jabber.\n  <br>Antonyms: Silence, quiet, hush, stillness, reserve.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Chatter</b>: To talk rapidly or incessantly, often in a casual or trivial manner.\n  <br> \n  <b>Silence</b>: The absence of sound or noise; the state of being quiet or not speaking.\n  <br> \n  <b>Taciturnity</b>: The state of being reserved or reluctant to speak; the quality of being silent or uncommunicative.\n  <br> \n  <b>Reticence</b>: The quality of being reserved or hesitant in speaking or expressing thoughts or feelings; the act of holding back or refraining from speaking openly.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the appropriate idiom that can replace the highlighted phrase in the following sentence.\n  <br>People \n  <b>expressed their rage</b> about the Governor’s decision to raise property taxes.\n  <br>", "option1": "From hand to mouth\n  <br>", "option2": "Gave up the ghost\n  <br>", "option3": "Gnashed their teeth\n  <br>", "option4": "At sixes and sevens\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> \n  <b>Gnash one’s teeth-</b>to express one’s rage, to show anger.\n  <br>The idiom \"gnashed their teeth\" means to show anger, frustration, or displeasure. It implies a strong emotional reaction, which fits the context of people expressing their rage about the Governor's decision to raise property taxes.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Given below are four jumbled sentences. Select the option that gives their correct logical sequence.\n  <br>A. The merger will lead to simplification of the corporate structure of IDFC FHCL, IDFC Ltd. and IDFC First Bank by consolidating them into \n  <br>B. The Board of Directors of IDFC First Bank Ltd. on Monday approved the merger of IDFC Ltd. with IDFC First Bank with \n  <br>C. a single entity and will help streamline regulatory compliances, the bank said on the rationale for the merger.\n  <br>D. a share exchange ratio of 155 shares of face value of ₹10 each of IDFC First Bank for every 100 shares of face value of ₹10 each of IDFC Ltd.\n  <br>", "option1": "DACB\n  <br>", "option2": "BDAC\n  <br>", "option3": "ACBD\n  <br>", "option4": "BACD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence B introduces the merger and provides specific details about the share exchange ratio approved by the Board of Directors.\n  <br> Next, sentence D follows logically after sentence B, as it further explains the share exchange ratio mentioned in sentence B. This sentence clarifies the exact ratio between the shares of IDFC First Bank and IDFC Ltd.\n  <br> Sentence A comes after sentences B and D because it explains the impact of the merger. It highlights the benefits of the merger, such as simplifying the corporate structure and streamlining regulatory compliances.\n  <br> Finally, sentence C concludes the logical sequence. This sentence follows the explanation of the merger's benefits in sentence A and provides context for the statement made by the bank regarding the rationale behind the merger.\n  <br> Therefore, the correct logical sequence is BDAC.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Select the most appropriate option to fill in the blank.\n  <br>The bright sun __________ the landscape with its radiant light.\n  <br>", "option1": "Incandesce\n  <br>", "option2": "Incandesces\n  <br>", "option3": "Incandescenting\n  <br>", "option4": "Incandescented\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> To determine the correct answer, we need to consider the verb form that is appropriate for the sentence. The verb \"incandesce\" means to emit light or glow brightly.\n  <br> In the given sentence, we are referring to the sun, which emits radiant light and makes the landscape bright. The sentence is a general truth and therefore we need to use simple present form of verb. \n  <br> Since we need to use the present tense singular verb form, we look for the option that matches this form.\n  <br> Option (b) \"incandesces\" is the present tense singular form of the verb \"incandesce\" and correctly fits the sentence. It indicates that the sun currently emits light and brightens the landscape.\n  <br> The other options, (a) incandesce, (c) incandescenting, and (d) incandescented, do not match the present tense form of the verb \"incandesce\" and are therefore incorrect.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. The Court had found that if a government does not have control over its officers, it would paralyze governance which cannot be the intention of the Constitution makers while incorporating Article 239AA, which gives a special constitutional status to Delhi. \n  <br>B. The Ordinance promulgated by the President on May 19, 2023 amending the Government of National Capital Territory of Delhi Act 1991(GNCTD Act) took away the services from the jurisdiction of the Delhi government. \n  <br>C. The Ordinance nullifies that judgment of the Supreme Court. \n  <br>D. The services had been earlier restored to the Delhi government by the Supreme Court in a landmark judgment delivered on May 11, 2023. \n  <br>", "option1": "BDCA\n  <br>", "option2": "ACDB\n  <br>", "option3": "BCAD\n  <br>", "option4": "DABC \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> Based on the context, sentence B sets the stage by introducing the Ordinance that took away services from the Delhi government. \n  <br> Then, sentence D provides information about the Supreme Court's earlier judgment that restored the services to the Delhi government. \n  <br> Sentence C connects the dots by stating that the Ordinance nullifies the Supreme Court's judgment. \n  <br> Finally, sentence A brings in the perspective of the Court's finding about the importance of government control over officers and its relation to the special constitutional status given to Delhi.\n  <br> Hence, the correct order to form a meaningful and coherent paragraph is BDCA.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Select the option that expresses the given sentence in active voice.\n  <br>The decision was made by the committee.\n  <br>", "option1": "The committee made the decision.\n  <br>", "option2": "The decision was made by the committee.\n  <br>", "option3": "The decision made by the committee.\n  <br>", "option4": "The committee was making the decision.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>In active voice, the subject performs the action, while in passive voice, the subject receives the action.\n  <br> Active voice sentences are often more direct and concise, while passive voice sentences focus more on the recipient of the action.\n  <br> To convert a sentence from passive voice to active voice, the subject becomes the doer of the action, and the object of the passive sentence becomes the subject of the active sentence. \n  <br> In this case, \"the committee\" is the doer of the action, so it becomes the subject in the active voice sentence, and \"made the decision\" remains the action part of the sentence.\n  <br>Rules for conversion are as follows:\n  <br> \n  <b>Subject + V2 + object. -> <- Object + auxiliary verb (was, were) + past participle + by + subject.</b> \n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "Select the option that expresses the given sentence in indirect speech.\n  <br>She said, \"I will complete the project on time.\"\n  <br>", "option1": "She pleaded to complete the project on time.\n  <br>", "option2": "She asked to complete the project on time.\n  <br>", "option3": "She stated that she would complete the project on time.\n  <br>", "option4": "She insisted on the completion of the project on time.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Indirect speech is used to report what someone said without using their exact words, typically with a reporting verb (e.g., said, stated, asked) and a reporting clause. \n  <br> The tense and pronouns may change in indirect speech.\n  <br> In indirect speech, we report what someone said without using their exact words. The reporting verb (said) is followed by a reporting clause that usually starts with \"that.\" \n  <br> The tense of the reported speech may also change according to the context. \n  <br> In this case, \"stated\" is an appropriate reporting verb, and the reported clause indicates that she will complete the project on time.\n  <br> When converting the direct speech to indirect speech, the pronouns may also change depending on the context.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "Select the option to fill in the blank no. 1.\n  <br>", "option1": "National\n  <br>", "option2": "Regional\n  <br>", "option3": "Global\n  <br>", "option4": "Confidential\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>National</b> - Pertaining to a nation or country.\n  <br> \n  <b>Regional</b> - Relating to a particular area or part of the world.\n  <br> \n  <b>Global</b> - Worldwide or universal in influence or application.\n  <br> \n  <b>Confidential</b> - Meant to be kept a secret.\n  <br>The context of the sentence suggests the countries belong to a specific geographical region. So, the correct answer is option b \n  <b>‘regional’</b>.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "Select the option to fill in the blank no. 2.\n  <br>", "option1": "Surpassing\n  <br>", "option2": "Rivaling\n  <br>", "option3": "Along with\n  <br>", "option4": "Opposing\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Surpassing</b> - Exceed; be greater than.\n  <br> \n  <b>Rivaling</b> - Compete with someone or something.\n  <br> \n  <b>Along with</b> - Together with or in addition to.\n  <br> \n  <b>Opposing</b> - To act against or provide resistance to.\n  <br>The context indicates that India became a full SCO member in 2017 at the same time as Pakistan. So, the correct answer is option c \n  <b>‘along with’</b>.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "Select the option to fill in the blank no. 3.\n  <br>", "option1": "Or\n  <br>", "option2": "But\n  <br>", "option3": "Despite\n  <br>", "option4": "And\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Or</b> - Used to link alternatives.\n  <br> \n  <b>But</b> - Except; apart from; other than.\n  <br> \n  <b>Despite</b> - Without being affected by; in spite of.\n  <br> \n  <b>And</b> - A conjunction used to connect words of the same part of speech, clauses, or sentences that are to be taken jointly\n  <br>The context implies that the regional security and connectivity are both significant to India's growth. So, the correct answer is option d \n  <b>‘and’</b>.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "Select the option to fill in the blank no. 4.\n  <br>", "option1": "Avoiding\n  <br>", "option2": "Conducting\n  <br>", "option3": "Observing\n  <br>", "option4": "Criticizing\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Avoiding</b> - Keep away from or stop oneself from doing (something).\n  <br> \n  <b>Conducting</b> - Direct the performance of (an orchestra or choir).\n  <br> \n  <b>Observing</b> - Notice or perceive (something) and register it as being significant.\n  <br> \n  <b>Criticizing</b> - Indicate the faults of (someone or something) in a disapproving way.\n  <br>The context indicates that being inside the tent is important, even if that means participating in joint exercises under the SCO Regional Anti-Terrorist Structure. So, the correct answer is option b \n  <b>‘conducting’</b>.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "Despite not joining the official creditors' platform, how does China intend to support Sri Lanka in its economic recovery according to Foreign Minister Ali Sabry?\n  <br>", "option1": "By providing direct aid\n  <br>", "option2": "Through bilateral support\n  <br>", "option3": "By forgiving all debts\n  <br>", "option4": "By investing in Sri Lankan businesses\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Refer to the line, \"They have said they will not come on board the common platform... but will support us bilaterally.\"\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "In the context of this article, what does \"creditor equitability\" mean and how does China's decision to remain an observer impact this?\n  <br>", "option1": "It means that all creditors should be repaid at the same time. China's decision complicates this because they are a significant creditor, yet they're not part of the official committee.\n  <br>", "option2": "It refers to all creditors having equal voting rights. China's observer status doesn't affect this.\n  <br>", "option3": "It refers to the equal distribution of assets in case of default. China's observer status means it may not get its fair share.\n  <br>", "option4": "It means that all creditors are treated equally in negotiations. China's observer status means it may negotiate separate terms, undermining this principle.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>The concept of \"creditor equitability\" is implied in the statement, \"Reiterating Mr. Wickremesinghe’s promise, Minister Sabry said on Monday: “All bilateral debt treatment will be comparable... everybody must agree to the same kind of treatment,” and the potential issue with China's observer status is described in, \"China has attended the committee’s meetings as an observer, but its decision to stay out of the official creditors’ committee complicates the exercise for Sri Lanka.\"\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "What is the Paris Club's stance on debt treatment arrangements with Sri Lanka?\n  <br>", "option1": "They want to make side arrangements with each creditor.\n  <br>", "option2": "They advocate for the same treatment for all external creditors.\n  <br>", "option3": "They believe China should have preferential treatment due to its size.\n  <br>", "option4": "They have not made their stance clear.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>The line, \"highlighted President Ranil Wickremesinghe’s assurance of transparency and comparability of treatment for all external creditors, and that “no side arrangements inconsistent with comparability of treatment” will be made with any creditor,\" indicates the Paris Club's stance.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "According to the passage, how has the Sri Lankan Parliament recently responded to the country's debt crisis?\n  <br>", "option1": "They have agreed to default on the debt.\n  <br>", "option2": "They have approved a plan to restructure domestic debt by recasting pension funds.\n  <br>", "option3": "They have decided to ask the IMF for more aid.\n  <br>", "option4": "They have passed legislation to increase taxes to repay the debt.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>This answer is directly stated in the line, \"Meanwhile, the Sri Lankan Parliament on Saturday approved the government’s plan to restructure its domestic debt, by recasting pension funds.\"\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "What was the initial concern regarding NATO's relevance after the Cold War?\n  <br>", "option1": "NATO's expansion into new member countries\n  <br>", "option2": "The dissolution of the Soviet Union\n  <br>", "option3": "NATO's loss of military capabilities\n  <br>", "option4": "The invasion of Ukraine by Russia\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\
