This implies that India has territorial disputes with China, making it a missing link in the framework.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "According to the Chinese tale, what is the special characteristic of the Fox with Nine Tails?\n  <br>", "option1": "It possesses magical powers.\n  <br>", "option2": "It can shape-shift into different forms.\n  <br>", "option3": "Iप ुोौ ninध पोiिस पुोप ौदंृियप्रध थiौकयं.", "option4": "It brings good luck and prosperity.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Refer to, \"Legend has it that the fox possesses extraordinary powers, making it a symbol of both wisdom and mischief\" implies that one of the extraordinary powers of the Fox with Nine Tails is its shape-shifting abilities.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "Why did the Fox with Nine Tails initially approach the village?\n  <br>", "option1": "To seek revenge on the villagers.\n  <br>", "option2": "To gain the trust and admiration of the villagers..\n  <br>", "option3": "To find a companion and form a bond.\n  <br>", "option4": "To bring misfortune and chaos to the village.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>Refer to, \"The Fox with Nine Tails initially approaches a peaceful village, disguised as a beautiful maiden. It uses its shape-shifting abilities to gain the trust and admiration of the villagers.\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What happens when a Fox with Nine Tails gains its ninth tail?\n  <br>", "option1": "It is offered a difficult choice between immortality and becoming a guardian angel. \n  <br>", "option2": "It loses its magical abilities and becomes an ordinary fox.\n  <br>", "option3": "It must leave the human world and return to the spirit realm.\n  <br>", "option4": "It becomes the guardian spirit of the village.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>Refer to, \" As the fox gains its ninth tail, it reaches the pinnacle of its powers but also faces a crucial decision. It must choose between ascending to immortality and leaving the human world behind or embracing its true purpose as a guardian spirit of the village.\"\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "Hयथ कयधौ पुध Cुinधौध पोिध यी पुध Fयस थiपु Ninध Tोiिस ौदंृियप्रध ुहंोn कधौiनधौ?", "option1": "The fox's multiple tails represent various human ambitions.\n  <br>", "option2": "The fox's transformation abilities reflect human adaptability.\n  <br>", "option3": "The fox's actions mirror the consequences of unchecked desires.\n  <br>", "option4": "The tale emphasizes the importance of fulfilling one's desires.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br>Refer to, \"However, the tale also teaches a valuable lesson about the consequences of unchecked desires\" suggests that the actions of the fox in the tale reflect the negative outcomes that can arise from unchecked human desires.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "किस शहर ने योग दिवस पर सबसे बड़ी सभा का गिनीज वर्ल्ड रिकॉर्ड बनाया है?\n  <br>", "option1": "मुंबई\n  <br>", "option2": "सूरत\n  <br>", "option3": "दिल्ली\n  <br>", "option4": "कोलकाता\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "योग दिवस के अवसर पर गुजरात के सूरत शहर में आयोजित कार्यक्रम में एक ही स्थान पर योग सत्र के लिए सबसे बड़ी भीड़ इकट्ठी होने और 1.53 लाख लोगों के कार्यक्रम में शामिल होने का नया गिनीज वर्ल्ड रिकॉर्ड बनाया गया।\n  <br>पिछला विश्व रिकॉर्ड 2018 में राजस्थान के कोटा शहर में बनाया गया था जब 1,00,984 लोगों ने एक ही स्थान पर योग दिवस सत्र में भाग लिया था।\n  <br>दुनिया भर में अंतर्राष्ट्रीय योग दिवस 2015 से प्रतिवर्ष 21 जून को मनाया जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "हाल ही में किस देश ने नकदी संकट से जूझ रहे पाकिस्तान के साथ 1,200 मेगावाट का परमाणु ऊर्जा संयंत्र स्थापित करने के लिए 4.8 बिलियन डॉलर के समझौते पर हस्ताक्षर किए?\n  <br>", "option1": "चीन\n  <br>", "option2": "संयुक्त राज्य अमेरिका\n  <br>", "option3": "रूस\n  <br>", "option4": "जापान\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "चीन ने 20 जून को दो सहयोगियों के बीच बढ़ते रणनीतिक सहयोग के संकेत के रूप में नकदी संकट से जूझ रहे पाकिस्तान के साथ 1,200 मेगावाट का परमाणु ऊर्जा संयंत्र स्थापित करने के लिए 4.8 बिलियन डॉलर के भारी समझौते पर हस्ताक्षर किए।\n  <br>प्रधानमंत्री शहबाज शरीफ ने जिस समझौते पर हस्ताक्षर किए उसके तहत बीजिंग पंजाब के मियांवाली जिले के चश्मा में 1,200 मेगावाट का चश्मा -वी परमाणु संयंत्र का निर्माण करेगा।\n  <br>पाकिस्तान के चश्मा बिजली संयंत्रों को सस्ती परमाणु ऊर्जा के उत्पादन में महत्वपूर्ण माना जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "विश्व आर्थिक मंच द्वारा जारी ग्लोबल जेंडर गैप रिपोर्ट 2023 में 146 देशों में भारत की रैंकिंग क्या रही?\n  <br>", "option1": "89\n  <br>", "option2": "105\n  <br>", "option3": "127\n  <br>", "option4": "140\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "विश्व आर्थिक मंच द्वारा जारी ग्लोबल जेंडर गैप रिपोर्ट 2023 में भारत 146 देशों में से 127वें स्थान पर है।\n  <br>लिंग समानता के मामले में भारत 146 देशों में से 127वें स्थान पर है - पिछले साल से आठ स्थानों का सुधार हुआ है।\n  <br>सूचकांक में भारत के पड़ोसी देशों पाकिस्तान को 142वां, बांग्लादेश को 59वां, चीन को 107वां, नेपाल को 116वां, श्रीलंका को 115वां और भूटान को 103वां स्थान दिया गया है।\n  <br>रिपोर्ट के अनुसार, आइसलैंड लगातार 14वें साल दुनिया में सबसे अधिक लिंग-समान देश है और 90% से अधिक लिंग अंतर को कम करने वाला एकमात्र देश है।\n  <br> \n  <b>वैश्विक लिंग अंतर सूचकांक:</b> \n  <br>ग्लोबल जेंडर गैप इंडेक्स सालाना चार प्रमुख आयामों (आर्थिक भागीदारी और अवसर, शैक्षिक प्राप्ति, स्वास्थ्य और अस्तित्व, और राजनीतिक सशक्तिकरण) में लैंगिक समानता की वर्तमान स्थिति और विकास को मापता है। यह 2006 में अपनी स्थापना के बाद से समय के साथ इन अंतरालों को पाटने की दिशा में कई देशों के प्रयासों की प्रगति पर नज़र रखने वाला सबसे लंबे समय तक चलने वाला सूचकांक है।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "किस संगठन ने भारत में वर्चुअल \"स्टार्टअप स्कूल\" के दूसरे संस्करण के शुभारंभ की घोषणा की?\n  <br>", "option1": "भारतीय प्रौद्योगिकी संस्थान\n  <br>", "option2": "स्टार्टअप्सइंडिया\n  <br>", "option3": "गूगल इंडिया\n  <br>", "option4": "वाणिज्य और उद्योग मंत्रालय\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "पहले संस्करण की सफलता के बाद, गूगल इंडिया ने 11 जुलाई से स्टार्टअप इंडिया द्वारा समर्थित वर्चुअल \"स्टार्टअप स्कूल\" 2023 के दूसरे संस्करण के लॉन्च की घोषणा की।\n  <br>यह कार्यक्रम भारत में शुरुआती चरण के स्टार्टअप को उद्यमिता, उत्पाद विकास, विपणन और धन उगाहने के बुनियादी सिद्धांतों के बारे में सीखने में मदद करने के लिए डिज़ाइन किया गया है। कार्यक्रम आठ सप्ताह में वितरित किया जाएगा, और इसमें गूगल और 30 से अधिक उद्योग विशेषज्ञ शामिल होंगे।\n  <br>स्टार्टअप स्कूल का पहला संस्करण 2022 में भारत में लॉन्च किया गया था, और इसमें 14,000 से अधिक स्टार्टअप ने भाग लिया था। कार्यक्रम को स्टार्टअप समुदाय द्वारा खूब सराहा गया और उम्मीद है कि दूसरा संस्करण और भी अधिक सफल होगा।\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "_______ ने 200 अंतर्राष्ट्रीय मैच खेलने वाले पहले पुरुष खिलाड़ी बनकर गिनीज वर्ल्ड रिकॉर्ड बनाया।\n  <br>", "option1": "किलियन एमबीप्पे\n  <br>", "option2": "नेमार\n  <br>", "option3": "लियोनेल मेसी\n  <br>", "option4": "क्रिस्टियानो रोनाल्डो\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "क्रिस्टियानो रोनाल्डो (d) ने 200 अंतर्राष्ट्रीय मैच खेलने वाले पहले पुरुष खिलाड़ी बनकर गिनीज वर्ल्ड रिकॉर्ड बनाया। उन्होंने यह उपलब्धि 1 सितंबर, 2022 को हासिल की, जब उन्होंने 2022 फीफा विश्व कप क्वालीफाइंग मैच में आयरलैंड गणराज्य के खिलाफ खेला।\n  <br>रोनाल्डो पुर्तगाल द्वारा 201 बार कैप किए गए हैं, उन्होंने 117 गोल किए हैं। वह पुर्तगाल के लिए सर्वकालिक अग्रणी स्कोरर और पुरुषों के अंतरराष्ट्रीय फुटबॉल में सर्वकालिक अग्रणी स्कोरर हैं।\n  <br>रोनाल्डो पांच बार बैलन डी'ओर विजेता हैं और उन्होंने कई अन्य व्यक्तिगत और टीम पुरस्कार जीते हैं। उन्हें सर्वकालिक महान फुटबॉलरों में से एक माना जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "इकोनॉमिक इंटेलिजेंस यूनिट की ग्लोबल लिवेबिलिटी इंडेक्स रिपोर्ट के अनुसार, किस शहर को \"सबसे अधिक रहने योग्य शहर\" के रूप में मान्यता दी गई है?\n  <br>", "option1": "वियना\n  <br>", "option2": "ज्यूरिख\n  <br>", "option3": "मेलबर्न\n  <br>", "option4": "टोक्यो\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "इकोनॉमिस्ट इंटेलिजेंस यूनिट की ग्लोबल लिवेबिलिटी इंडेक्स रिपोर्ट के अनुसार , वियना को लगातार चौथे वर्ष \"सबसे रहने योग्य शहर\" के रूप में मान्यता दी गई है।\n  <br>सूचकांक स्थिरता, स्वास्थ्य देखभाल, बुनियादी ढांचे, शिक्षा और संस्कृति और पर्यावरण सहित विभिन्न कारकों पर दुनिया भर के 173 शहरों का आकलन करता है।\n  <br>वियना ने सूचकांक में 100 में से 99.1 अंक प्राप्त किए, इसके बाद कोपेनहेगन (98.0) और ज्यूरिख (96.1) का स्थान रहा। शीर्ष 10 में अन्य शहरों में कैलगरी (95.6), वैंकूवर (95.5), फ्रैंकफर्ट (95.3), टोरंटो (95.1), एम्स्टर्डम (94.9), और ओसाका (94.8) शामिल हैं।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "शहरी जनसंख्या के प्रतिशत (2011) के संबंध में निम्नलिखित में से कौन सा राज्यों का सही आरोही क्रम है?\n  <br>", "option1": "तमिलनाडु - मिजोरम - गोवा - महाराष्ट्र\n  <br>", "option2": "गोवा - मिजोरम - महाराष्ट्र - केरल\n  <br>", "option3": "महाराष्ट्र - केरल - मिजोरम - गोवा\n  <br>", "option4": "मिजोरम - गोवा - महाराष्ट्र - केरल\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "2011 में शहरी जनसंख्या के प्रतिशत के संबंध में राज्यों का सही आरोही क्रम महाराष्ट्र - केरल - मिजोरम - गोवा है।\n  <br>2011 की जनगणना के अनुसार, गोवा सबसे अधिक शहरीकृत राज्य है जहाँ 62.17% आबादी शहरी क्षेत्रों में रहती है। इसके बाद मिजोरम (52.11%), केरल (47.7%) और महाराष्ट्र (54.78%) का स्थान है।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "पृथ्वी की सतह पर वह काल्पनिक रेखा जो 180° मध्याह्न रेखा का निकट से अनुसरण करती है, वह है\n  <br>", "option1": "प्रधान मध्याह्न रेखा\n  <br>", "option2": "भूमध्य रेखा\n  <br>", "option3": "अंतर्राष्ट्रीय तिथि रेखा\n  <br>", "option4": "कर्क रेखा\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अंतर्राष्ट्रीय तिथि रेखा (IDL) \n  <b> पृथ्वी   की   सतह   </b>पर सीमांकन की एक काल्पनिक रेखा है जो\n  <b> उत्तरी   ध्रुव   से   दक्षिणी   ध्रुव </b>  तक चलती है और एक कैलेंडर दिन से दूसरे \n  <b> कैलेंडर   दिन </b>  के परिवर्तन का सीमांकन करती है। यह लगभग \n  <b> 180 °  का   अनुसरण   करते   हुए ,   प्रशांत   महासागर   </b>के मध्य से होकर गुजरता है \n  <b> देशांतर   रेखा </b>  कुछ क्षेत्रों और द्वीप समूहों के चारों ओर से गुजरने के लिए विचलित हो रही है।\n  <br>प्राइम मेरिडियन एक काल्पनिक रेखा है जो इंग्लैंड के ग्रीनविच से होकर गुजरती है। इसका उपयोग पृथ्वी के मानचित्रों पर शून्य-डिग्री देशांतर रेखा के रूप में किया जाता है। भूमध्य रेखा एक काल्पनिक रेखा है जो पृथ्वी को उत्तरी और दक्षिणी गोलार्ध में विभाजित करती है।\n  <br>इसका उपयोग अक्षांश मापने के लिए संदर्भ रेखा के रूप में भी किया जाता है। कर्क रेखा एक काल्पनिक रेखा है जो भूमध्य रेखा से 23.5 डिग्री उत्तर में स्थित है। यह सबसे उत्तरी बिंदु है जिस पर सूर्य सीधे सिर के ऊपर हो सकता है।\n  <br>अतः, सही उत्तर है (c), अंतर्राष्ट्रीय तिथि रेखा।\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "भारत के निम्नलिखित में से किस राष्ट्रीय उद्यान को यूनेस्को द्वारा विश्व धरोहर घोषित किया गया है?\n  <br>1. केवलादेव राष्ट्रीय उद्यान\n  <br>2. सुंदरवन राष्ट्रीय उद्यान\n  <br>3. काजीरंगा राष्ट्रीय उद्यान\n  <br>4. रणथंभौर राष्ट्रीय उद्यान\n  <br>नीचे दिए गए कोड का उपयोग करके सही उत्तर चुनें।\n  <br>", "option1": "केवल 1 और 2\n  <br>", "option2": "केवल 1, 2 और 3\n  <br>", "option3": "केवल 3 और 4\n  <br>", "option4": "1, 2, 3 और 4\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर केवल (b), 1, 2 और 3 है।\n  <br> भारत के निम्नलिखित राष्ट्रीय उद्यानों को यूनेस्को द्वारा विश्व धरोहर घोषित किया गया है:\n  <br> केवलादेव राष्ट्रीय उद्यान\n  <br>सुंदरवन राष्ट्रीय उद्यान\n  <br>काजीरंगा राष्ट्रीय उद्यान\n  <br> रणथंभौर राष्ट्रीय उद्यान विश्व धरोहर स्थल नहीं है।\n  <br> अतः, सही उत्तर केवल (b), 1, 2 और 3 है।\n  <br>  भरतपुर में केवलादेव राष्ट्रीय उद्यान सिंधु-गंगा मानसून वन जैव-भौगोलिक प्रांत के भीतर स्थित है। इसे 1982 में राष्ट्रीय उद्यान घोषित किया गया था। इसे 1981 में रामसर वेटलैंड साइट के रूप में दर्ज किया गया था। इसे 1985 में यूनेस्को की विश्व विरासत सूची में शामिल किया गया था।\n  <br>  सुंदरवन राष्ट्रीय उद्यान, दुनिया का सबसे बड़ा मुहाना मैंग्रोव वन, एक राष्ट्रीय उद्यान, बाघ अभयारण्य, विश्व धरोहर स्थल और पश्चिम बंगाल में बंगाल की खाड़ी की सीमा से लगे सुंदरवन गंगा नदी डेल्टा में स्थित बायोस्फीयर रिजर्व है। 4 मई 1984 को इसे राष्ट्रीय उद्यान घोषित किया गया। इसे 1987 में यूनेस्को की विश्व धरोहर सूची में शामिल किया गया था।\n  <br> असम के पूर्वोत्तर राज्य में ब्रह्मपुत्र नदी के दक्षिणी तट के बाढ़ के मैदानों में स्थित काजीरंगा को इसके अद्वितीय प्राकृतिक वातावरण के लिए 1985 में यूनेस्को द्वारा विश्व धरोहर स्थल घोषित किया गया था। \n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "दामिन - ए -कोह का निर्माण ब्रिटिश सरकार द्वारा निम्नलिखित में से किस समुदाय को बसाने के लिए किया गया था?\n  <br>", "option1": "संथाल\n  <br>", "option2": "मुंडा\n  <br>", "option3": "उराँव\n  <br>", "option4": "साओरस\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर है (a), संथाल।\n  <br> दामिन - ए -कोह भारत के वर्तमान झारखंड में राजमहल पहाड़ियों में भूमि का एक बड़ा क्षेत्र था , जिसे 1832 में ब्रिटिश सरकार द्वारा सीमांकित किया गया था और संथाल समुदाय द्वारा बसाया गया था। संथाल एक आदिवासी समुदाय है जो इस क्षेत्र का मूल निवासी है।\n  <br> राजमहल की तलहटी में बसने के लिए राजी किया गया , जहां पहाड़िया जनजातियों का वर्चस्व था।\n  <br>इसे संथालों की भूमि घोषित किया गया। उन्हें इसके भीतर रहना था, हल से खेती करनी थी और स्थायी किसान बनना था। संथालों को भूमि अनुदान में यह निर्धारित किया गया था कि पहले दस वर्षों के भीतर क्षेत्र का कम से कम दसवां हिस्सा साफ किया जाना था और खेती की जानी थी, इस भूमि अनुदान के पीछे ब्रिटिश सरकार का मुख्य उद्देश्य था।\n  <br> दामिन - ए - कोह अब झारखंड के संथाल परगना जिले का हिस्सा है। संथाल इस क्षेत्र में बहुसंख्यक समुदाय बना हुआ है।\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "1857 के विद्रोह के दिनों में निम्नलिखित में से किसे 'डंका शाह' के नाम से जाना जाता था?\n  <br>", "option1": "शाह मल\n  <br>", "option2": "मौलवी अहमदुल्ला शाह\n  <br>", "option3": "नाना साहब\n  <br>", "option4": "तांत्या टोपे \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर है (b), मौलवी अहमदुल्ला शाह। \n  <br> मौलवी अहमदुल्ला शाह एक धार्मिक नेता थे जिन्होंने 1857 के विद्रोह में महत्वपूर्ण भूमिका निभाई थी। वह अपने उग्र भाषणों और लोगों को अंग्रेजों के खिलाफ लड़ने के लिए प्रेरित करने की क्षमता के लिए जाने जाते थे। उन्हें एक बड़े ड्रम के उपयोग के लिए भी जाना जाता था, जिसका उपयोग उन्होंने लोगों को विद्रोह के लिए एकजुट करने के लिए किया था।\n  <br> उनके ढोल बजाने के कारण अंग्रेज उन्हें \"डंका शाह\" कहते थे। \"डंका\" एक हिंदी शब्द है जिसका अर्थ है \"ढोल।\"\n  <br> मौलवी अहमदुल्ला शाह 1858 में युद्ध में मारे गए थे। उन्हें 1857 के विद्रोह में सबसे महत्वपूर्ण व्यक्तियों में से एक माना जाता है।\n  <br>  \n  <b>कुछ जरूरी तथ्य:</b> \n  <br> अहमदुल्ला शाह, फैजाबाद के मौलवी के नाम से प्रसिद्ध, प्रसिद्ध स्वतंत्रता सेनानी और 1857 के भारतीय विद्रोह के नेता थे। मौलवी अहमदुल्ला शाह को अवध क्षेत्र में विद्रोह के प्रकाश स्तंभ के रूप में जाना जाता था।\n  <br>  \n  <b>मैलेसन के अनुसार </b>, \"इसमें कोई संदेह नहीं है कि 1857 के विद्रोह की साजिश के पीछे मौलवी का दिमाग और प्रयास महत्वपूर्ण थे। अभियानों के दौरान रोटी का वितरण, चपाती आंदोलन, वास्तव में उनके दिमाग की उपज थी।\"\n  <br> बाबरी मस्जिद विध्वंस मामले में भारत के सर्वोच्च न्यायालय के फैसले के अनुसार अयोध्या में बनने वाली मस्जिद का नाम अहमदुल्ला शाह के नाम पर रखा जाएगा।\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "निम्नलिखित में से कौन अकबर के दरबार में चित्रकार नहीं था?\n  <br>", "option1": "दसवंत\n  <br>", "option2": "अब्दुस समद\n  <br>", "option3": "कल्याण दास\n  <br>", "option4": "बसावन\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c), कल्याण दास है।\n  <br>कल्याण दास अकबर के दरबार में नहीं बल्कि मुहम्मद शाह के दरबार में चित्रकार थे।\n  <br>बसावन मुगल राजा अकबर के दरबार के प्रमुख चित्रकारों में से एक थे। उन्होंने मुख्य रूप से 1580 से 1600 की अवधि के दौरान काम किया। उनके साथ, अब्दुस समद और दसवंत भी अकबर के दरबार के चित्रकार थे।\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "अलाउद्दीन खिलजी की बाज़ार नीति के बारे में निम्नलिखित कथनों पर विचार करें:\n  <br>1. दुकानदारों और कीमतों को सख्ती से नियंत्रित करने के लिए बाजारों को ' शाहना ' नामक एक उच्च अधिकारी के नियंत्रण में रखा।\n  <br>2. सस्ते खाद्यान्न की नियमित आपूर्ति सुनिश्चित करने के लिए, उन्होंने दोआब क्षेत्र से भू-राजस्व सीधे राज्य को भुगतान करने का आदेश दिया।\n  <br>ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?\n  <br>", "option1": "केवल 1\n  <br>", "option2": "केवल 2\n  <br>", "option3": "1 और 2 दोनों\n  <br>", "option4": "न तो 1 और न ही 2\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर है (c), 1 और 2 दोनों।\n  <br> अलाउद्दीन खिलजी दिल्ली सल्तनत का 14वीं सदी का शासक था। वह अपनी सैन्य विजयों और प्रशासनिक सुधारों के लिए जाने जाते हैं। उनके सबसे महत्वपूर्ण सुधारों में से एक उनकी बाज़ार नीति थी।\n  <br> अलाउद्दीन की बाज़ार नीति के तहत बाज़ारों को शाहना नामक एक उच्च अधिकारी के नियंत्रण में रखा गया था। शाहना दुकानदारों और कीमतों पर सख्ती से नियंत्रण रखने के लिए जिम्मेदार था। वह नियमों का उल्लंघन करने वाले दुकानदारों को दंडित कर सकता था, और वह द्रोह से हो, तो वह उद्घोषणा द्वारा एक घोषणा कर सकते हैं। संपूर्ण भारत या उसके क्षेत्र के ऐसे हिस्से के संबंध में वह प्रभाव जैसा कि उद्घोषणा में निर्दिष्ट किया जा सकता है।\n  <br> राष्ट्रीय आपातकाल की घोषणा का व्यक्तियों के मौलिक अधिकारों पर निम्नानुसार दूरगामी प्रभाव पड़ता है:\n  <br>अनुच्छेद 19 के तहत मौलिक अधिकार स्वतः ही निलंबित हो जाते हैं और यह निलंबन आपातकाल के अंत तक जारी रहता है। लेकिन 44वें संशोधन के अनुसार अनुच्छेद 19 को केवल युद्ध या बाहरी आक्रमण के आधार पर उद्घोषणा के मामले में निलंबित किया जा सकता है, सशस्त्र विद्रोह के आधार पर नहीं।\n  <br>अनुच्छेद 20 और 21 को छोड़कर अन्य मौलिक अधिकार भी निलंबित हो सकते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "निम्नलिखित में से कौन सा कथन सही नहीं है?\n  <br>", "option1": "तत्वों को उनके पास मौजूद प्रोटॉनों की संख्या से परिभाषित किया जाता है।\n  <br>", "option2": "समभारिक ऐसे परमाणु होते हैं जिनकी परमाणु संख्या समान होती है लेकिन द्रव्यमान संख्या भिन्न होती है।\n  <br>", "option3": "किसी परमाणु की द्रव्यमान संख्या उसके केंद्रक में नाभिकों की संख्या के बराबर होती है।\n  <br>", "option4": "संयोजकता एक परमाणु की संयोजन क्षमता है। \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर है: (b) समभारिक ऐसे परमाणु होते हैं जिनकी परमाणु संख्या समान होती है लेकिन द्रव्यमान संख्या भिन्न होती है। यह कथन सही नहीं है।\n  <br>समभारिक ऐसे परमाणु या आयन होते हैं जिनकी द्रव्यमान संख्या समान होती है लेकिन परमाणु क्रमांक भिन्न होते हैं। दूसरे शब्दों में, उनके पास न्यूक्लियॉन (प्रोटॉन + न्यूट्रॉन) की कुल संख्या समान है लेकिन प्रोटॉन की संख्या अलग-अलग है।\n  <br>उदाहरण के लिए; कैल्शियम, परमाणु संख्या 20, और आर्गन, परमाणु संख्या 18 है। इन परमाणुओं में प्रोटॉन की संख्या अलग-अलग है, लेकिन इन दोनों तत्वों की द्रव्यमान संख्या 40 है।\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "सूची-I को सूची-II से सुमेलित करें और सूचियों के नीचे दिए गए कोड का उपयोग करके सही उत्तर चुनें:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1698042025340image43.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (a), 4, 1, 2, 3 है।\n  <br>सूची-I और सूची-II के बीच मिलान इस प्रकार है:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1698042025704image83.png\"> \n  <br> कैल्शियम हाइपोक्लोराइट CaOCl₂ ब्लीचिंग पाउडर का मुख्य घटक है। सोडियम बाइकार्बोनेट को आमतौर पर बेकिंग सोडा के रूप में जाना जाता है और इसका रासायनिक सूत्र NaHCO₃ है। बुझे हुए चूने ( CaO ) में पानी मिलाकर बुझा हुआ चूना प्राप्त किया जाता है, इसका उपयोग दीवारों को सफेद करने के लिए किया जाता है और बुझे हुए चूने का रासायनिक सूत्र Ca(OH)₂ है। वाशिंग सोडा सोडियम कार्बोनेट का सामान्य नाम है और इसका रासायनिक सूत्र Na₂CO₃ 10H₂O है।\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "फ्लोराइड की कमी से निम्नलिखित में से कौन सी स्वास्थ्य समस्या उत्पन्न होती है?\n  <br>", "option1": "दाँत क्षय\n  <br>", "option2": "दांत का धब्बेदार होना\n  <br>", "option3": "हड्डियों का मुड़ना \n  <br>", "option4": "जोड़ों का सख्त होना\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "फ्लोराइड हमारे शरीर के लिए उपयोगी और हानिकारक दोनों है, यह फ्लोराइड की खपत की मात्रा पर निर्भर करता है। शरीर में फ्लोराइड की कमी से दांत खराब हो जाते हैं जबकि फ्लोराइड की अधिकता से दांत खराब हो जाते हैं। पानी की आपूर्ति में फ्लोराइड मिलाने से दांतों में सड़न की घटना कम हो जाती है। फ्लोराइड विखनिजीकरण और पुनर्खनिजीकरण द्वारा दांतों को सड़न से बचाता है। बहुत अधिक फ्लोराइड से डेंटल फ्लोरोसिस या स्केलेटल फ्लोरोसिस हो सकता है, जो हड्डियों और जोड़ों को नुकसान पहुंचा सकता है। \n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "निम्नलिखित में से किस उर्वरक का अत्यधिक उपयोग भूजल में विषाक्त पदार्थ की उपस्थिति के लिए जिम्मेदार हो सकता है?\n  <br>", "option1": "नाइट्रोजन\n  <br>", "option2": "केवल फॉस्फेट\n  <br>", "option3": "केवल पोटेशियम\n  <br>", "option4": "फॉस्फेट और पोटेशियम\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "नाइट्रोजन उर्वरक का अत्यधिक उपयोग भूजल में विषाक्त पदार्थ की उपस्थिति के लिए जिम्मेदार हो सकता है। भूजल मुख्य रूप से नाइट्रेट द्वारा प्रदूषित हो रहा है। यह उच्च ऑक्सीजन स्थितियों में भी स्थिर है (यह खराब नहीं होता है)। भूजल में 10 मिलीग्राम/लीटर (10 ppm) से ऊपर नाइट्रेट का स्तर \" \n  <b> ब्लू   बेबी   सिंड्रोम\"</b> (एक्वायर्ड \n  <b> मेथेमोग्लोबिनेमिया  )</b> का कारण बन सकता है। \n  <br>यह समस्या विशेष रूप से जैविक उर्वरकों (खाद) के व्यापक और गहन अनुप्रयोग से जुड़ी है।\n  <br>सभी देशों में भूजल पेयजल का एक महत्वपूर्ण स्रोत है। कई क्षेत्रों में भूजल इस हद तक प्रदूषित हो गया है कि वर्तमान मानकों के अनुसार यह पीने के पानी के रूप में उपयोग करने लायक नहीं रह गया है।\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "क्षेत्रफल की दृष्टि से ______ भारत का सबसे बड़ा केंद्र शासित प्रदेश है।\n  <br>", "option1": "चंडीगढ़\n  <br>", "option2": "लद्दाख\n  <br>", "option3": "जम्मू और कश्मीर\n  <br>", "option4": "पुडुचेरी\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Ans (b), लद्दाख है।\n  <br>क्षेत्रफल की दृष्टि से लद्दाख भारत का सबसे बड़ा केंद्र शासित प्रदेश है। इसका कुल क्षेत्रफल 59,146 वर्ग किलोमीटर है।\n  <br>जम्मू और कश्मीर पुनर्गठन अधिनियम के पारित होने के बाद, 31 अक्टूबर 2019 को लद्दाख को भारत के केंद्र शासित प्रदेश के रूप में स्थापित किया गया था। इससे पहले, यह जम्मू और कश्मीर राज्य का हिस्सा था। लद्दाख भारत का सबसे बड़ा और दूसरा सबसे कम आबादी वाला केंद्र शासित प्रदेश है।\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "पारसेक ______ की एक इकाई है।\n  <br>", "option1": "त्वरण\n  <br>", "option2": "गति\n  <br>", "option3": "लंबाई\n  <br>", "option4": "समय\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "'पारसेक' लंबाई मापने की एक इकाई है। एक पारसेक को उस दूरी के रूप में परिभाषित किया जाता है जिस पर एक खगोलीय इकाई एक आर्कसेकंड का कोण अंतरित करत let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
