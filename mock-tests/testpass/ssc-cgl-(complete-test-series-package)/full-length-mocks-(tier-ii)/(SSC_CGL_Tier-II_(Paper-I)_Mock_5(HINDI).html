<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>18.) SSC CGL Tier-II (Paper-I) Mock 5(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

" is singular (even though it refers to multiple continents, the act of travelling is considered one action, hence it's singular). \n  <br> So, the verb should be in singular form too, to maintain subject-verb agreement. \n  <br> The correct form should be \"enriches\", not \"enrich\". \n  <br> The corrected sentence is: \"Travelling across different continents enriches our knowledge about various cultures.\"\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "<b>Choose the most suitable word to fill in the blank.</b> \n  <br>______ your dreams is the first step towards achieving them.\n  <br>", "option1": "Debating\n  <br>", "option2": "Identifying \n  <br>", "option3": "Discouraging\n  <br>", "option4": "Ignoring\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> \n  <b>Identify</b> means to establish or indicate who or what (someone or something) is.\n  <br>Meanings of other options are as follows:\n  <br> \n  <b>Debate-</b>a formal discussion on a particular matter in a public meeting or legislative assembly, in which opposing arguments are put forward and which usually ends with a vote.\n  <br> \n  <b>Discourage-</b>cause (someone) to lose confidence or enthusiasm.\n  <br> \n  <b>Ignore-</b>refuse to take notice of or acknowledge; disregard intentionally.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. P. Anक दधप, iप iौ पुध cयnपनोौप ृधपथधधn पुध पथय पुोप ृनingौ पुध gनधोपधौप ुयद. Q. Tुiौ iौ थुधनध पुध ुiििस धnक ोnक पुध ूिोinौ ृधgin. R. Tुध ॅधनकोnप gनधधn ुiििस ोnक पुध ौपोना थुiपध ूिोinौ ोनध तहiपध कiीीधनधnप. S. I ुोॅध ोिथोदौ ियॅधक पुध ूिोcध थुधनध I gनधथ हू.", "option1": "QRSP\n  <br>", "option2": "SPQR\n  <br>", "option3": "SRQP \n  <br>", "option4": "PSQR\n  <br>", "answer": "3", "negative_marking": "1.00", "option2": "every weekend\n  <br>", "option3": "He enjoy\n  <br>", "option4": "No error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The subject of the sentence is \"He,\" which is a third-person singular pronoun referring to a single person. \n  <br> In English, when the subject is a third-person singular pronoun (such as he, she, it), the corresponding verb form should also be in the third-person singular form.\n  <br> The verb \"enjoy\" in the sentence is not in the correct form to match the subject \"He.\" \n  <br> The base form of the verb \"enjoy\" is \"enjoy,\" which is used with plural subjects (e.g., \"They enjoy,\" \"We enjoy\"). \n  <br> However, when the subject is \"He,\" the correct form of the verb should be \"enjoys.\"\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "<b>Select the most appropriate ANTONYM for the highlighted word.</b> \n  <br>He was so \n  <b>arrogant</b> that he refused to listen to anyone's advice.\n  <br>", "option1": "Dominant\n  <br>", "option2": "Selfish\n  <br>", "option3": "Modest\n  <br>", "option4": "Rude\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> \n  <b>Arrogant</b>-having an exaggerated sense of one's importance or abilities; showing a lack of respect for others.\n  <br> Synonyms: Proud, Haughty, Conceited.\n  <br> Antonyms: \n  <b>Modest</b>, humble, meek, respectful.\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Modest</b>: Showing a humble and unassuming nature, not being excessively proud or confident.\n  <br> \n  <b>Selfish</b>: Concerned primarily with one's own interests, needs, or welfare, often without regard for others.\n  <br> \n  <b>Dominant</b>: Exercising control or authority over others, being in a position of power or influence.\n  <br> \n  <b>Rude</b>: Displaying a lack of politeness, showing disrespect or bad manners.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>Choose the most appropriate ANTONYM for the word 'abundant' in the following sentence.</b> \n  <br>Water is abundant in this region, but the quality is not good.\n  <br>", "option1": "Vast\n  <br>", "option2": "Plentiful\n  <br>", "option3": "Excessive\n  <br>", "option4": "Scarce\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br> \n  <b>Abundant</b>- Existing or available in large quantities; plentiful.\n  <br> Synonyms: Plentiful, Ample, Copious.\n  <br> Antonym: \n  <b>Scarce</b>, limited, sparse, scant.\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Scarce</b>: Insufficient in quantity or amount; not readily available.\n  <br> \n  <b>Plentiful</b>: Existing in large quantities; abundant.\n  <br> \n  <b>Excessive</b>: More than what is considered reasonable or appropriate; too much.\n  <br> \n  <b>Vast</b>: Extremely large in size or extent; immense.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "<b>Change the given sentence to active voice.</b> \n  <br>A solution to the problem has been suggested by the experts.\n  <br>", "option1": "The experts suggested a solution to the problem.\n  <br>", "option2": "The experts have suggested a solution to the problem.\n  <br>", "option3": "The experts suggest a solution to the problem.\n  <br>", "option4": "The experts are suggesting a solution to the problem.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>In passive voice constructions, the subject of the sentence receives the action of the verb. The active voice, on the other hand, emphasizes the doer of the action. To change the sentence to active voice, we need to rephrase it so that the subject becomes the doer of the action.\n  <br>Step-by-step transformation to active voice:\n  <br> Identify the subject and the verb in the passive sentence:\n  <br> \n  <b>Subject</b>: A solution to the problem\n  <br> \n  <b>Verb</b>: has been suggested\n  <br> Determine who performed the action (the doer) in the passive sentence:\n  <br> The doer of the action (the experts) is mentioned using the preposition \"by\" followed by \"the experts.\"\n  <br> Construct the active voice sentence by making the doer of the action (the experts) the subject of the sentence and using the active form of the verb (suggest).\n  <br> Rule for changing active to passive voice in present perfect tense is\n  <br> \n  <b>Subject + has, have + V3 + object -> <- Object + auxiliary verb (has, have) + been + past participle + by + subject.</b> \n  <br> \n  <b>Final active voice sentence:</b> \"The experts have suggested a solution to the problem.\"\n  <br> In this transformed sentence, the experts become the subject of the sentence, and they perform the action of suggesting the solution to the problem. The sentence is now in active voice, and it conveys the same meaning as the original passive voice sentence.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "<b>Choose the most suitable option to fill in the blank.</b> \n  <br>She passed the exam _________ everybody's expectation.\n  <br>", "option1": "Contrary to\n  <br>", "option2": "Different than\n  <br>", "option3": "Alongside\n  <br>", "option4": "Same as\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most suitable option to fill in the blank is option (a).\n  <br>The sentence structure indicates that the person in question (she) performed exceptionally well on the exam. The word \"contrary\" means opposite or different from what is expected or usual. When we say, \"She passed the exam contrary to everybody's expectation,\" it means that she performed better than what everyone expected or against the expectations of others.\n  <br> Let's briefly analyze the other options and why they are not suitable for this context:\n  <br> \n  <b>Different than</b>: This option does not fit the sentence context because it suggests a comparison between the exam and \"everybody's expectation,\" which does not convey the intended meaning.\n  <br> \n  <b>Alongside</b>: This option doesn't work here since \"alongside\" means alongside or next to, which doesn't make sense in the given context.\n  <br> \n  <b>Same as</b>: This option is not appropriate because \"same as\" implies similarity or equality between two things, which is not what the sentence is trying to convey. It needs to express that the result was better than expected.\n  <br>In conclusion, option (a) \"contrary to\" is the most suitable choice, as it conveys the idea that she passed the exam better than what everyone expected or contrary to what was anticipated.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "<b>Choose the correct collocation to complete the sentence.</b> \n  <br>She is ______ this new project.\n  <br>", "option1": "tasked with\n  <br>", "option2": "charged of\n  <br>", "option3": "involved \n  <br>", "option4": "undertaken by\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct collocation to complete the sentence is option (a). \n  <br>Collocations are word combinations that frequently appear together and sound natural to native speakers. In this sentence, we are looking for the most appropriate collocation to describe \"She\" in relation to \"this new project.\"\n  <br>Let's analyze each option:\n  <br> \n  <b>Tasked with</b>: This collocation is the correct one. \"Tasked with\" means being assigned or given a specific responsibility or duty, which fits well in the context of someone taking on a project.\n  <br> \n  <b>Charged of</b>: This collocation is incorrect. The correct preposition to use with \"charged\" is \"charged with,\" not \"charged of.\" So, \"charged with\" means being entrusted with a particular task or duty.\n  <br> \n  <b>Involved</b>: This option lacks the preposition \"in\" after \"involved.\" While \"involved\" can be used in sentences like \"She is involved in this new project,\" as it stands, it is not a complete collocation.\n  <br> \n  <b>Undertaken by</b>: This collocation is not the right fit for this sentence. \"Undertaken by\" suggests that the project is being performed or carried out by someone else, not by \"She.\"\n  <br> So, the correct collocation to complete the sentence is \"She is tasked with this new project.\" This means she has been given the responsibility or duty of handling the new project.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "<b>Select the option that can be used as a one-word substitute for the given group of words.</b> \n  <br>The act of killing one's own brother.\n  <br>", "option1": "Matricide\n  <br>", "option2": "Fratricide\n  <br>", "option3": "Patricide\n  <br>", "option4": "Genocide\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option that can be used as a one-word substitute for the given group of words \"The act of killing one's own brother\" is: (b) Fratricide.\n  <br>Meanings of all four options:\n  <br> \n  <b>Matricide</b>: The act of killing one's own mother.\n  <br> \n  <b>Fratricide</b>: The act of killing one's own brother.\n  <br> \n  <b>Patricide</b>: The act of killing one's own father.\n  <br> \n  <b>Genocide</b>: The deliberate killing of a large number of people from a particular nation or ethnic group with the aim of destroying that nation or group.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "<b>Select the option that can be used as a one-word substitute for the given group of words.</b> \n  <br>A person who moves from place to place without a permanent home.\n  <br>", "option1": "Philanthropist\n  <br>", "option2": "Nomad\n  <br>", "option3": "Aristocrat\n  <br>", "option4": "Hermit\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option that can be used as a one-word substitute for the given group of words is: (b) Nomad.\n  <br>Meanings of all four options:\n  <br> \n  <b>Philanthropist</b>: A philanthropist is a person who seeks to promote the welfare of others, often through generous donations or charitable acts.\n  <br> \n  <b>Nomad</b>: A nomad is a person who moves from place to place, typically without having a permanent home, often in search of resources or as part of a traditional way of life.\n  <br> \n  <b>Aristocrat</b>: An aristocrat is a person who belongs to a social class considered to be superior or privileged, often due to their family lineage or wealth.\n  <br> \n  <b>Hermit</b>: A hermit is a person who lives in solitude, often in a secluded or remote place, away from society and social interactions.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "<b>Change the given sentence to indirect speech.</b> \n  <br>She said to me, \"I am going to the park.\"\n  <br>", "option1": "She told me that she was going to the park.\n  <br>", "option2": "She told me that she is going to the park.\n  <br>", "option3": "She told me that she goes to the park.\n  <br>", "option4": "She told me that she had gone to the park.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option after changing the given sentence to indirect speech is:\n  <br>(a) She told me that she was going to the park.\n  <br> In indirect speech, we report what someone else said without using their exact words. The reporting verb is usually changed to a suitable reporting verb like \"said,\" and the pronouns and verb tenses are adjusted according to the context.\n  <br> Given sentence in direct speech: \"She said to me, 'I am going to the park.'\"\n  <br>Step-by-step transformation to indirect speech:\n  <br> Identify the reporting verb and the direct speech:\n  <br> \n  <b>Reporting verb</b>: said\n  <br> Direct speech: \"I am going to the park.\"\n  <br> Change the direct speech to reported speech:\n  <br> The first-person pronoun \"I\" changes to \"she,\" and the present tense \"am\" changes to \"was\" to reflect the shift from direct to indirect speech.\n  <br> Construct the sentence in indirect speech:\n  <br> Indirect speech: She told me that she was going to the park.\n  <br> In this transformed sentence, the direct speech is reported indirectly using the past tense \"was going\" to match the past tense reporting verb \"told.\" The pronoun \"I\" changes to \"she\" to refer to the person who spoke the original sentence. The sentence now correctly presents the reported statement in indirect speech.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "<b>Select the most appropriate homonym to fill in the blank.</b> \n  <br>I will wait here until the rain ________.\n  <br>", "option1": "Seize\n  <br>", "option2": "Size\n  <br>", "option3": "Ceases\n  <br>", "option4": "Sees\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate homonym to fill in the blank is: (c) ceases.\n  <br> \n  <b>Homonyms</b> are words that have the same spelling or pronunciation but different meanings. In this sentence, we need a word that means \"to stop\" or \"to come to an end\" in the context of the rain stopping. \n  <br>Let's examine each option:\n  <br> \n  <b>Seize</b>: This word means to take hold of something forcibly or to capture. It does not fit the context of the sentence, as we are referring to the rain stopping, not taking hold of something.\n  <br> \n  <b>Size</b>: This word refers to the dimensions or measurement of something, and it doesn't fit the context of the sentence. We are looking for a word related to the rain stopping, not its dimensions.\n  <br> \n  <b>Ceases</b>: This is the correct homonym for the blank. \"Ceases\" means to stop or come to an end, which is precisely what we need in the sentence.\n  <br> \n  <b>Sees</b>: This word means to perceive with the eyes or to be aware of something visually. It doesn't fit the context of the sentence, which is about waiting for the rain to stop.\n  <br>Therefore, the correct homonym to fill in the blank is \"ceases.\" The sentence would be: \"I will wait here until the rain ceases.\" This means that the person will wait until the rain stops or comes to an end.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "<b>Identify the INCORRECTLY spelt word.</b> \n  <br>", "option1": "Ephemeral\n  <br>", "option2": "Exhuberant\n  <br>", "option3": "Exasperate\n  <br>", "option4": "Eloquent\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> \n  <b>Ephemeral</b>: This word is spelled correctly. \"Ephemeral\" means lasting for a very short period, transient, or momentary.\n  <br> Exhuberant: This option is the one that is misspelled. The correct spelling is \"Exuberant.\" \"\n  <b>Exuberant</b>\" means full of energy, excitement, or enthusiasm.\n  <br> \n  <b>Exasperate</b>: This word is spelled correctly. \"Exasperate\" means to irritate or annoy intensely.\n  <br> \n  <b>Eloquent</b>: This word is spelled correctly. \"Eloquent\" means fluent, expressive, and persuasive in speaking or writing.\n  <br>So, the incorrectly spelled word is (b) Exhuberant, and the correct spelling is \n  <b>Exuberant</b>.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. As the years went by, the aging lion became weaker.\n  <br>B. Once upon a time, there was a mighty lion who ruled the jungle.\n  <br>C. The lion's rule was undisputed, as he was strong and ferocious.\n  <br>D. The other animals began to challenge him for control of the jungle.\n  <br>", "option1": "BADC\n  <br>", "option2": "BDAC\n  <br>", "option3": "ABCD\n  <br>", "option4": "BCAD\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct logical order of sentences is BCAD.\n  <br> The paragraph begins with the introduction of the main character and sets the context. So, sentence B is the starting point.\n  <br> Sentence C provides additional information about the lion's characteristics and his dominance over the jungle. It follows sentence B to elaborate on the lion's rule.\n  <br> Sentence A comes next, indicating the passage of time and the change in the lion's condition. It shows how the lion's strength has diminished over the years.\n  <br> Finally, sentence D concludes the paragraph by introducing the conflict. Other animals begin to challenge the weakening lion's authority, leading to a conflict for control of the jungle.\n  <br> Arranging the sentences in this order creates a coherent paragraph that presents a story about a once-mighty lion's rule, his aging, and the ensuing challenge from other animals for control of the jungle. Therefore, the correct order is BCAD.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Improve the highlighted part of the given sentence.</b> \n  <br>She dresses so \n  <b>good</b> that everyone admires her.\n  <br>", "option1": "well\n  <br>", "option2": "goodly\n  <br>", "option3": "better\n  <br>", "option4": "best\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct improvement for the highlighted part of the given sentence is option (a) well.\n  <br> In this sentence, we need to use an adverb to modify the verb \"dresses.\" Adverbs are used to describe verbs and provide more information about how an action is performed. The correct adverb to describe the way she dresses is \"well.\"\n  <br> Here's the improved sentence: \"She dresses so well that everyone admires her.\"\n  <br> In this improved version, the adverb \"well\" is used to indicate that she dresses in a skillful, fashionable, or attractive manner. The sentence now conveys the intended meaning more accurately and effectively.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. She quickly realized the error and corrected it.\n  <br>B. Sarah was diligently working on the math problem.\n  <br>C. She felt a sense of accomplishment when she finally solved it.\n  <br>D. However, she made a small mistake in her calculations.\n  <br>", "option1": "BCDA\n  <br>", "option2": "BDAC\n  <br>", "option3": "BADC\n  <br>", "option4": "ABCD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) BDAC.\n  <br>B. Sarah was diligently working on the math problem.\n  <br>· This sentence serves as an introductory statement that sets the stage. It informs the reader that Sarah is actively engaged in solving a math problem, which is the central theme of the paragraph.\n  <br>D. However, she made a small mistake in her calculations.\n  <br>· This sentence introduces a conflict or problem into the narrative. After setting up that Sarah is working diligently, it shows that a hurdle arises with her making a small mistake.\n  <br>A. She quickly realized the error and corrected it.\n  <br>· This sentence serves as the resolution to the conflict introduced in sentence D. Sarah recognizes her mistake and amends it, moving towards solving the problem.\n  <br>C. She felt a sense of accomplishment when she finally solved it.\n  <br>· This sentence provides closure to the paragraph, concluding the sequence of events by sharing Sarah's feeling of accomplishment after solving the math problem, which has been her goal since the beginning.\n  <br>The sequence BDAC provides a coherent flow from introducing a situation, presenting a conflict, resolving it, and then concluding with a final outcome.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</b> \n  <br>A. He was always eager to help others.\n  <br>B. This earned him the respect of everyone in his community.\n  <br>C. John was a kind and generous man.\n  <br>D. As a result, he was loved by all.\n  <br>", "option1": "CABD\n  <br>", "option2": "BCDA\n  <br>", "option3": "ACBD\n  <br>", "option4": "DCAB\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (a) CABD.\n  <br> The paragraph begins by introducing John and his character. So, sentence C is the starting point.\n  <br> Sentence A comes next to further describe John's helpful nature. He was always eager to help others.\n  <br> Sentence B follows to explain the consequence of John's kindness and generosity. His actions earned him the respect of everyone in his community.\n  <br> Finally, sentence D concludes the paragraph. It explains the overall result of John's kind and generous nature. As a result of his actions, he was loved by all.\n  <br> Arranging the sentences in this order creates a coherent paragraph that tells the story of John, his good qualities, and the admiration he received from his community. Therefore, the correct order is CABD.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the most appropriate meaning of the given idiom.</b> \n  <br>To turn a blind eye\n  <br>", "option1": "To have poor vision\n  <br>", "option2": "To ignore something intentionally\n  <br>", "option3": "To look in the wrong direction\n  <br>", "option4": "To be unaware of the surroundings\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the given idiom \"To turn a blind eye\" is: (b) To ignore something intentionally.\n  <br>\"\n  <b>To turn a blind eye</b>\" is an idiomatic expression that means to deliberately ignore or overlook something, especially when it is inappropriate or illegal. It implies a conscious decision not to acknowledge or address a particular situation or wrongdoing.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "<b>Select the most appropriate synonym of the highlighted word.</b> \n  <br>He was completely \n  <b>disconsolate</b> after his dog passed away.\n  <br>", "option1": "Delighted\n  <br>", "option2": "Joyful\n  <br>", "option3": "Heartbroken \n  <br>", "option4": "Excited\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The word \"disconsolate\" means extremely sad, dejected, or deeply unhappy, often due to a great loss or disappointment.\n  <br> Synonyms: \n  <b>Heartbroken</b>, Grief-stricken, Miserable, Despondent, Depressed.\n  <br> Antonyms: Content, Happy, Elated, Joyful, Cheerful.\n  <br>Meanings of all four options:\n  <br> \n  <b>Heartbroken</b>: Overwhelmed with sadness or sorrow due to a profound loss or disappointment.\n  <br> \n  <b>Joyful</b>: Feeling or expressing great happiness, delight, or pleasure.\n  <br> \n  <b>Delighted</b>: Feeling or showing great pleasure, satisfaction, or happiness.\n  <br> \n  <b>Excited</b>: Feeling enthusiasm, eagerness, or elation about something expected or anticipated.\n  <br>In the given sentence, \"disconsolate\" is used to describe the state of being deeply sad or unhappy after the loss of the person's dog. Among the given options, the most appropriate synonym for \"disconsolate\" is (c) Heartbroken, as it carries a similar meaning of profound sadness and grief due to a loss.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Aननोngध पुध giॅधn ूोनपौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ूोनोgनोूु. A. In पुiौ धनो यी gियृोिप्रोपiयn, Engिiौु ुोौ ृधcयंध पुध िingहो ीनोncो यी पुध थयिनक. B. Hधncध, ृधing ूनयीiciधnप in Engिiौु iौ ो nधcधौौiपद ोnक nयप ो cुयicध ोnदंयनध. C. Tुiौ ुोौ incनधोौधक पुध iंूयनपोncध यी िधोनning Engिiौु ीयन inकiॅiकहोिस ोcनयौौ पुध थयिनक. D. Iप iौ हौधक in inपधनnोपiयnोि ृहौinधौौ, ोcोकधंic cयnीधनधncधौ, ोnक in gियृोि ंधकiो.", "option1": "ABCD\n  <br>", "option2": "ADCB\n  <br>", "option3": "CADB\n  <br>", "option4": "BADC\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) ADCB.\n  <br> A. In this era of globalization, English has become the lingua franca of the world.\n  <br>· This sentence serves as the introductory statement, establishing the significance of English in today's globalized world. It provides the foundational premise upon which the rest of the paragraph will build.\n  <br>D. It is used in international business, academic conferences, and in global media.\n  <br>· This sentence expands on the introductory statement by providing specific examples of where English is used as the lingua franca, thereby supporting the opening claim.\n  <br>C. This has increased the importance of learning English for individuals across the world.\n  <br>· This sentence builds on the previous ones by stating the consequence of English being the lingua franca—its increased importance for individuals worldwide in learning the language.\n  <br>B. Hence, being proficient in English is a necessity and not a choice anymore.\n  <br>· This sentence serves as the conclusion, tying together all the prior statements. It sums up the entire argument by stating that proficiency in English has now become a necessity rather than an optional skill.\n  <br>The sequence ADCB provides a logically coherent flow, starting with an introductory statement, providing supporting details, and concluding with the resultant need for English proficiency.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "<b>Select the most appropriate word to fill in the blank.</b> \n  <br>The child found a _____________ by the lake.\n  <br>", "option1": "Peace\n  <br>", "option2": "Piece\n  <br>", "option3": "Peas\n  <br>", "option4": "Praise\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>In this sentence, we are looking for a word that means a portion, part, or fragment, as the child found something near the lake. The correct word is \"piece.\"\n  <br>Meanings of all four options are as follows:\n  <br> \n  <b>Peace</b>: Peace refers to a state of tranquility, harmony, or absence of conflict or disturbance.\n  <br> \n  <b>Piece</b>: Piece refers to a portion, part, or fragment of something, often a whole that has been divided or broken.\n  <br> \n  <b>Peas</b>: Peas are small, round, green seeds that grow in pods and are commonly used as a vegetable in cooking.\n  <br> \n  <b>Praise</b> refers to the expression of approval, admiration, or commendation.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "<b>Convert the given sentence into reported speech.</b> \n  <br>She said, \"I have finished my work.\"\n  <br>", "option1": "She told that she had finished her work.\n  <br>", "option2": "She said that she has finished her work.\n  <br>", "option3": "She said that she had finished her work.\n  <br>", "option4": "She told me she finished her work.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> In reported speech, we report what someone else said without using their exact words. The reporting verb is usually changed to a suitable reporting verb like \"said,\" and the pronouns and verb tenses are adjusted according to the context.\n  <br> Given sentence in direct speech: \"She said, 'I have finished my work.'\"\n  <br> \n  <b>Identify the reporting verb and the direct speech:</b> \n  <br> Reporting verb: said\n  <br> Direct speech: \"I have finished my work.\"\n  <br> \n  <b>Change the direct speech to reported speech:</b> \n  <br> The first-person pronoun \"I\" changes to \"she,\" and the present perfect tense \"have finished\" changes to \"had finished\" to reflect the shift from direct to reported speech.\n  <br> \n  <b>Construct the sentence in reported speech:</b> \n  <br> Reported speech: She said that she had finished her work.\n  <br> In this converted version, the direct speech is reported indirectly using the past perfect tense \"had finished\" to match the past tense reporting verb \"said.\" The pronoun \"I\" changes to \"she\" to refer to the person who spoke the original sentence. The sentence now correctly presents the reported statement in reported speech.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "<b>Convert the given sentence into direct speech.</b> \n  <br>He said that he was not feeling well.\n  <br>", "option1": "He said, \"I am not feeling well.\"\n  <br>", "option2": "He said, \"I was not feeling well.\"\n  <br>", "option3": "He said, \"I'm feeling well.\"\n  <br>", "option4": "He said, \"I might not be feeling well.\"\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> In direct speech, we report someone's exact words. To convert the given sentence into direct speech, we need to present the statement as it was originally spoken.\n  <br> Given sentence in reported speech: \"He said that he was not feeling well.\"\n  <br> Step-by-step conversion to direct speech:\n  <br> Identify the reported speech and the reported speaker:\n  <br> Reported speech: He was not feeling well.\n  <br> Reported speaker: He (referring to the same person)\n  <br> Enclose the reported speech in quotation marks and include the original subject pronoun \"I\" as spoken by the reported speaker.\n  <br> ‘Was’ changes to ‘am’.\n  <br> Construct the sentence in direct speech:\n  <br> Direct speech: He said, \"I am not feeling well.\"\n  <br> In this converted version, the reported speech is presented exactly as spoken by the reported speaker, including the original subject pronoun \"I.\" The sentence now correctly represents the statement in direct speech.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "<b>Select the most appropriate meaning of the given idiom.</b> \n  <br>To add fuel to the fire.\n  <br>", "option1": "To start a bonfire\n  <br>", "option2": "To ignite kindling\n  <br>", "option3": "To contribute to a project\n  <br>", "option4": "To make a situation worse\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the given idiom \"To add fuel to the fire\" is option (d) To make a situation worse.\n  <br>The idiom \"To add fuel to the fire\" means to worsen a situation or to make it more intense by saying or doing something that creates more conflict, hostility, or controversy. It implies that the action taken or words spoken only serve to exacerbate an already tense or difficult situation.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>Convert the given sentence into passive voice.</b> \n  <br>I will finish the report by tomorrow.\n  <br>", "option1": "The report will be finished by today by me.\n  <br>", "option2": "The report will be finished by me by tomorrow.\n  <br>", "option3": "The report by tomorrow will be finished by me.\n  <br>", "option4": "The report will be finished tomorrow by me.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> In passive voice constructions, the subject of the sentence receives the action of the verb. The active voice sentence \"I will finish the report by tomorrow\" is already in the future tense, and to convert it into passive voice, we need to use the auxiliary verb \"will be\" followed by the past participle of the main verb \"finish.\" \n  <br> Additionally, the agent performing the action in the active voice sentence (\"me\") is placed at the end of the passive voice sentence, introduced by the preposition \"by.\"\n  <br> The structure for changing active voice to passive voice for Simple future tense is:\n  <br> \n  <b>Subject + will, shall + verb + object -> <- Object + auxiliary verb (will, shall) + be + past participle + by + subject.</b> \n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "<b>Convert the given sentence into active voice.</b> \n  <br>The dinner was prepared by my mother.\n  <br>", "option1": "My mother has prepared the dinner.\n  <br>", "option2": "My mother had prepared the dinner.\n  <br>", "option3": "My mother prepares the dinner.\n  <br>", "option4": "My mother prepared the dinner.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br> In active voice constructions, the subject of the sentence performs the action of the verb. \n  <br> The given passive voice sentence \"The dinner was prepared by my mother\" needs to be changed to active voice by making \"my mother\" the subject of the sentence and using the appropriate verb tense.\n  <br> In simple past tense sentences the structure for changing active to passive voice and vice versa is as follows:\n  <br> \n  <b>Subject + V2 + object. -> <- Object + auxiliary verb (was, were) + past participle + by + subject.</b> \n  <br> So, the correct conversion to active voice will be: My mother prepared the dinner.\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "<b>Arrange the given parts in the correct order to form a meaningful paragraph.</b> \n  <br>A. Only a small percentage of these refugees make it to countries in the developed world and it is exaggerated beyond control.\n  <br>B. Every day, we see images of people fleeing war, persecution, poverty, and natural disasters.\n  <br>C. These images are powerful, but they also have a downside.\n  <br>D. They can make the refugee crisis seem like an overwhelming and unsolvable problem.\n  <br>", "option1": "BACD\n  <br>", "option2": "BCAD\n  <br>", "option3": "BDAC\n  <br>", "option4": "BCDA\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct logical order of the sentences is given in option (d) BCDA. \n  <br> The paragraph begins with an introduction to the topic, providing context and mentioning the images of people fleeing difficult circumstances. So, sentence B is the starting point.\n  <br> Sentence C follows to explain the power of these images but also introduces the idea that they have a downside, which sets the tone for the rest of the paragraph.\n  <br> Sentence D comes next to elaborate on the downside of the images. It highlights how these powerful images can create a perception of the refugee crisis as an overwhelming and unsolvable problem.\n  <br> Finally, sentence A concludes the paragraph by presenting a specific aspect related to the refugee crisis. It points out that only a small percentage of these refugees make it to developed countries, and it is often exaggerated beyond control, possibly alluding to media sensationalism.\n  <br> Arranging the given parts in this order creates a coherent paragraph that discusses the portrayal of the refugee crisis in the media and its impact on the public perception. Therefore, the correct order is BCDA.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Which word best fits the blank no. 1?</b> \n  <br>", "option1": "appeared\n  <br>", "option2": "figured\n  <br>", "option3": "ranked\n  <br>", "option4": "showed\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In this context, \"figured\" is the most suitable choice as it means 'to appear or be considered in a particular way, or to have influence or importance.' Thus, \"trade naturally figured high on the agenda\" indicates that trade was a significant item on the agenda.\n  <br>Meanings of all options:\n  <br> \n  <b>Appeared</b>: Came into sight; became visible or noticeable. This choice does not fit well in the context as trade is not something that can physically come into sight.\n  <br> \n  <b>Figured</b>: To appear or be considered in a particular way, or to have influence or importance. In this context, it conveys the importance of trade on the agenda.\n  <br> \n  <b>Ranked</b>: Have (a certain rank or position) in a hierarchy. This option could be a potential fit, but \"figured\" is more appropriate because it is more common to say that an item \"figures\" (appears) on an agenda.\n  <br> \n  <b>Showed</b>: Be, allow, or cause to be visible. This option does not fit as well because it suggests a physical visibility, which is not the context here\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "<b>Which word best fits the blank no. 2?</b> \n  <br>", "option1": "that\n  <br>", "option2": "where\n  <br>", "option3": "when\n  <br>", "option4": "if\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence discusses the context of the India-EU free-trade agreement negotiations, indicating a specific situation or circumstance where the Chancellor and his delegation are involved. Therefore, \"where\" fits best as it refers to the situation in which something is happening.\n  <br> Meanings of all four options:\n  <br> \n  <b>That</b>: Used to introduce a clause giving further information about the content of a previous sentence. In this context, it would suggest a definitive statement about the Chancellor's involvement, but the following part of the sentence is more about the situation of the negotiations than a specific detail about them.\n  <br> \n  <b>Where</b>: In or to the place or situation in which. In this context, it indicates the situation in which the Chancellor gets personally involved, i.e., the negotiations.\n  <br> \n  <b>When</b>: At or on which (referring to a time or circumstance). This would suggest a time aspect to the Chancellor's involvement which the sentence doesn't support.\n  <br> \n  <b>If</b>: Introducing a conditional clause. This option would suggest a condition for the Chancellor's involvement, but the sentence doesn't suggest any condition for his involvement; he simply states that he would get involved.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Which word best fits the blank no. 3?</b> \n  <br>", "option1": "emerged\n  <br>", "option2": "resulted\n  <br>", "option3": "grow\n  <br>", "option4": "develops\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In this context, \"emerged\" is the most suitable choice as it means 'to become apparent or prominent.' Therefore, \"Collaboration in clean energy and green technologies has emerged as the central pillar in the partnership\" suggests that such collaboration has become an important feature in the partnership.\n  <br>Meanings of all options:\n  <br> \n  <b>Emerged</b>: Become apparent, important, or prominent.\n  <br> \n  <b>Resulted</b>: Occur or follow as the result of something. This option does not fit well in the context because it implies a cause-effect relationship that is not apparent in the sentence.\n  <br> \n  <b>Grow</b>: Become larger or greater over a period of time; increase. This choice could potentially fit in the context, but it is not the right form of verb to use with “has”. Correct form should be “grown”.\n  <br> \n  <b>Develops</b>: Grow or cause to grow and become more mature, advanced, or elaborate. While this option could be a potential fit but it is not the right form of verb to use with “has”. Correct form is “developed”.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>Which word best fits the blank no. 4?</b> \n  <br>", "option1": "cooperation\n  <br>", "option2": "competition\n  <br>", "option3": "connection\n  <br>", "option4": "communication\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In this context, \"cooperation\" is the most suitable choice as it means 'the process of working together to the same end.' Thus, \"cooperation in the area of green hydrogen\" would mean working together in that specific area.\n  <br>Meanings of all options:\n  <br> \n  <b>Cooperation</b>: The process of working together to the same end.\n  <br> \n  <b>Competition</b>: The activity or condition of competing. This choice does not fit well in the context because the passage is discussing collaborative efforts, not competitive ones.\n  <br> \n  <b>Connection</b>: A relationship in which a person or thing is linked or associated with something else. This option does not fit as well because it suggests a link or association, not active collaboration or work together.\n  <br> \n  <b>Communication</b>: The imparting or exchanging of information by speaking, writing, or using some other medium. This option does not fit as well because it emphasizes the exchange of information, not working together.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>What is the implication of India becoming a green hydrogen superpower as per the passage?</b> \n  <br>", "option1": "It will increase India's dependence on fossil fuels\n  <br>", "option2": "It will lead to an increase in greenhouse gas emissions in India\n  <br>", "option3": "It could facilitate industrial growth while reducing industrial emissions\n  <br>", "option4": "It will make India the largest consumer of green hydrogen globally\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned, \"Green hydrogen holds the promise of fuelling industrial growth while simultaneously reducing industrial emissions.\"\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "<b>According to the passage, what role does green hydrogen play in the context of energy?</b> \n  <br>", "option1": "It only serves as an energy source for heavy industries\n  <br>", "option2": "It can be used both as an energy source and an energy carrier\n  <br>", "option3": "It primarily acts as an energy carrier when blended with natural gas\n  <br>", "option4": "It has no significant role in the field of energy\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "As per the passage, \"It can serve as an energy source (heavy industry, long-distance mobility, aviation, and power storage) and an energy carrier (as green ammonia or blended with natural gas).\"\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>How does the passage describe the potential impact of India's focus on green hydrogen production by 2030?</b> \n  <br>", "option1": "It would reduce the potential for renewable energy\n  <br>", "option2": "It would limit the geographical advantages India possesses\n  <br>", "option3": "It would lead to an investment opportunity of ₹8 lakh crore and reduce annual emissions\n  <br>", "option4": "It would undermine India's commitment to non-fossil sources of electricity\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage states, \"India is targeting at least five million tonnes of production by 2030... This would create demand for 100-125 gigawatts (GW) of renewable energy, 60-100 GW of electrolysers, investment opportunity of ₹8 lakh crore, and cut 50 MMT of annual emissions.\"\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>According to the passage, why is India well-positioned to become a leading producer of green hydrogen?</b> \n  <br>", "option1": "Because of India's large industrial sector\n  <br>", "option2": "Due to India's geographical advantages like abundant sunshine and wind energy resources\n  <br>", "option3": "Because of the large population in India\n  <br>", "option4": "Due to the significant number of green hydrogen plants already operating in India\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The passage points out that \"With abundant sunshine and significant wind energy resources, India is geographically blessed to become one of the lowest-cost producers of green hydrogen.\"\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>Based on the passage, which of the following is true about the formation of a salt flat?</b> \n  <br>", "option1": "Salt flats form from natural water bodies where the evaporation rate is higher than the recharge rate.\n  <br>", "option2": "Salt flats form when there is a uniform distribution of salt in the soil.\n  <br>", "option3": "Salt flats form from natural water bodies where the recharge rate is higher than the evaporation rate.\n  <br>", "option4": "Salt flats form only in regions with shallow groundwater.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "As explained in the second paragraph of the passage, \"A salt flat forms from a natural water body whose recharge rate is lower than the evaporation rate. Over time, all the water evaporates, leaving behind the dissolved minerals, usually salts.\"\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>What discovery did the researchers make about the penetration of salt in the soil of a salt flat?</b> \n  <br>", "option1": "The salt penetrates deeper into the soil below the flat areas.\n  <br>", "option2": "The salt penetrates equally deep throughout the soil.\n  <br>", "option3": "The salt penetrates deeper into the soil exactly below the ridges.\n  <br>", "option4": "The salt remains shallow throughout the soil, irrespective of the landscape.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the second last paragraph, it is stated that \"The researchers found that the salt penetrated deeper into the soil exactly below the ridges, and remained shallow under the flat areas.\"\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>What is a convection cell in the context of salt flats, as explained in the passage?</b> \n  <br>", "option1": "It refers to the areas where saline groundwater sinks and less-saline groundwater rises.\n  <br>", "option2": "It refers to the parts of the soil with uniform salt distribution.\n  <br>", "option3": "It refers to the topmost layer of the soil in a salt flat.\n  <br>", "option4": "It refers to the areas where less-saline groundwater sinks and saline groundwater rises.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that \"If any water reaches and rises above the surface, it evaporates to leave more salt behind. The researchers found that if the rate of evaporation is sufficiently high, that is if the rate of salt deposition on the surface is sufficiently high, the denser groundwater will sink down and the less-saline, less-dense groundwater will rise to the top. This body of descending and ascending water is called a convection cell.\"\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>How is the formation of narrow ridges on the surface of salt flats explained in the passage?</b> \n  <br>", "option1": "They are formed due to subsurface convection being sensitive to salt chemistry.\n  <br>", "option2": "They are formed due to the displacement of the denser water within the column upwards.\n  <br>", "option3": "They are formed due to the saline water carried by the ascending less-dense groundwater.\n  <br>", "option4": "They are formed due to the uniform distribution of salt in the soil.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "According to the passage, \"Over time, there will be more saline groundwater rising up towards the surface through the convection cells than through other parts of the soil – simply because the less-dense water within the column is being displaced upwards. As a result, the salt this water carries will accumulate on the surface, forming the narrow ridges that make up the polygons.\"\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>What is the main purpose of the proposed referendum in Australia?</b> \n  <br>", "option1": "To elect a new Prime Minister.\n  <br>", "option2": "To constitutionally recognize Aboriginal and Torres Strait Islander people.\n  <br>", "option3": "To decide on the location of the Australian Parliament.\n  <br>", "option4": "To change the Australian flag.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "This is stated in the first line of the passage, \"Australia is on track to reckon with a dark chapter in its history after its Prime Minister, Anthony Albanese, made a promise to bring to its voters a referendum to constitutionally recognize Aboriginal and Torres Strait Islander people...\"\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>What is the main concern of Senator Jacinta Price about the Voice proposal?</b> \n  <br>", "option1": "It does not provide enough power to the Aboriginal and Torres Strait Islander people.\n  <br>", "option2": "It would make the Aboriginal and Torres Strait Islander people surpass the position of a Cabinet Minister.\n  <br>", "option3": "It excludes non-Indigenous people from decision-making processes.\n  <br>", "option4": "It might lead to an increase in community and family violence.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "This is outlined in the lines, \"Ms. Price has expressed concern over wording which says that Aboriginal and Torres Strait Islander Voice “may make representations to the Parliament and the Executive Government of the Commonwealth”, which she says elevates the Voice to a level surpassing a Cabinet Minister...\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>Which of the following is NOT mentioned as an issue faced by the Indigenous people of Australia?</b> \n  <br>", "option1": "Shorter life expectancy.\n  <br>", "option2": "Lower levels of education and employment.\n  <br>", "option3": "Overrepresentation in government positions.\n  <br>", "option4": "Higher rates of child removals.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The issues faced by Indigenous people, as mentioned in the passage are \"shorter life expectancy, higher rates of infant mortality, poorer physical and mental health, lower levels of education and employment, and higher rates of child removals, suicides, and community and family violence\". Overrepresentation in government positions is not stated as an issue.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "<b>According to the passage, what is an alternative approach favored by some Indigenous leaders before constitutionally recognizing Aboriginal and Torres Strait Islander people?</b> \n  <br>", "option1": "Increasing the number of Cabinet Ministers.\n  <br>", "option2": "Agreeing on a treaty between Indigenous and non-Indigenous people.\n  <br>", "option3": "Implementing policies to reduce child removal rates.\n  <br>", "option4": "Improving the physical and mental health facilities.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "This is suggested in the final lines of the passage, \"Other Indigenous leaders favour a different prioritization of approaches, for example, first agreeing on a treaty between Indigenous and non-Indigenous people, which would recognize that the former’s lands were never ceded to the “invaders”.\"\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "निम्नलिखित में से किस भारतीय प्रधान मंत्री ने लोकसभा में अविश्वास मत का सामना करने से पहले इस्तीफा दे दिया?\n  <br>", "option1": "चन्द्रशेखर\n  <br>", "option2": "मोरारजी देसाई\n  <br>", "option3": "इंदिरा गांधी\n  <br>", "option4": "चौधरी चरण सिंह\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d), चौधरी चरण सिंह है।\n  <br>उन्होंने लोकसभा में अविश्वास प्रस्ताव का सामना करने से पहले इस्तीफा दे दिया। वह भारत के 5वें प्रधान मंत्री थे, जिन्होंने 28 जुलाई 1979 से 14 जनवरी 1980 तक सेवा की।\n  <br>इंदिरा गांधी की कांग्रेस पार्टी द्वारा उनकी सरकार से समर्थन वापस लेने के बाद, उन्होंने कार्यालय में केवल 24 सप्ताह के बाद इस्तीफा दे दिया।\n  <br> उन्होंने उत्तर प्रदेश के 5वें मुख्यमंत्री-मंत्री के रूप में भी कार्य किया। उन्होंने 2 बार - 3 अप्रैल 1967 - 25 फरवरी 1968 और 18 फरवरी 1970 - 1 अक्टूबर 1970 तक उत्तर प्रदेश के मुख्यमंत्री के रूप में कार्य किया। \n  <br>भारत में कृषक समुदायों से संबंधित कार्यों के साथ उनके जुड़ाव के कारण नई दिल्ली में उनके स्मारक का नाम किसान घाट रखा गया। 23 दिसंबर को उनके जन्मदिन को भारत में किसान दिवस के रूप में मनाया जाता है।\n  <br>इतिहासकार और लोग समान रूप से अक्सर उन्हें 'भारत के किसानों के चैंपियन' के रूप में संदर्भित करते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "भारत का मुख्य चुनाव आयुक्त कितने समय के लिए पद पर रहता है?\n  <br>", "option1": "छह वर्ष \n  <br>", "option2": "राष्ट्रपति की इच्छानुसार\n  <br>", "option3": "छह वर्ष के लिए या 65 वर्ष की आयु तक, जो भी पहले हो\n  <br>", "option4": "पांच वर्ष के लिए या 60 वर्ष की आयु तक, जो भी पहले हो\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c) है। भारत का मुख्य चुनाव आयुक्त छह वर्ष की अवधि या 65 वर्ष की आयु तक, जो भी पहले हो, पद पर रहता है।\n  <br>मुख्य चुनाव आयुक्त की नियुक्ति भारत के राष्ट्रपति द्वारा की जाती है, लेकिन उसे केवल सिद्ध कदाचार या अक्षमता के आधार पर या 65 वर्ष की आयु प्राप्त करने पर ही पद से हटाया जा सकता है। मुख्य चुनाव आयुक्त को वही दर्जा प्राप्त है और उन्हें वही वेतन और भत्ते मिलते हैं जो सर्वोच्च न्यायालय के न्यायाधीशों को मिलते हैं।\n  <br> संविधान के अनुच्छेद 324 में चुनाव आयोग की स्वतंत्र और निष्पक्ष कार्यप्रणाली की सुरक्षा और सुनिश्चित करने का प्रावधान किया गया है।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "सूची 1 को सूची 2 से सुमेलित करें और सूचियों के नीचे दिए गए कूट का उपयोग करके सही उत्तर चुनें:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697694402789image47.png\"> \n  <br> \n  <b>कूट</b> :\n  <br>", "option1": "A - 2; B - 1; C - 4; D - 3\n  <br>", "option2": "A - 2; B - 4; C - 1; D - 3\n  <br>", "option3": "A - 3; B - 4; C - 1; D - 2\n  <br>", "option4": "A - 3; B - 1; C - 4; D – 2\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "राजेंद्र प्रसाद - अध्यक्ष, संविधान सभा\n  <br>एच. सी. मुखर्जी - उपाध्यक्ष, संविधान सभा\n  <br>बी. आर. अंबेडकर - अध्यक्ष, मसौदा समिति\n  <br>टी.टी. कृष्णामाचारी - सदस्य, मसौदा समिति\n  <br>  \n  <br>  \n  <b>हरेंद्र कुमार मुखर्जी, जिन्हें एच.सी. मुखर्जी </b>के नाम से भी जाना जाता है, भारत के विभाजन से पहले भारत के संविधान का मसौदा तैयार करने के लिए भारत की संविधान सभा के उपाध्यक्ष थे, और भारत और पाकिस्तान में विभाजन के बाद भारत के गणतंत्र बनने के बाद पश्चिम बंगाल के तीसरे राज्यपाल थे।\n  <br>  \n  <b>तिरुवेल्लोर थट्टई कृष्णमाचारी (टी. टी. कृष्णमाचारी) </b>केंद्र में संविधान सभा के सदस्य थे और उन्हें मसौदा समिति का सदस्य बनाया गया था। उन्होंने वर्ष 1956 से 1958 और वर्ष 1964 से 1966 तक वित्त मंत्री के रूप में भी कार्य किया।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "अमर्त्य सेन को ____ में उनके योगदान के लिए नोबेल पुरस्कार से सम्मानित किया गया था। \n  <br>", "option1": "मौद्रिक अर्थशास्त्र\n  <br>", "option2": "कल्याण अर्थशास्त्र\n  <br>", "option3": "पर्यावरण अर्थशास्त्र\n  <br>", "option4": "विकास अर्थशास्त्र\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (b) है। कल्याणकारी अर्थशास्त्र में उनके है।\n  <br>  \n  <b>PM-JAY की मुख्य विशेषताएं -</b> \n  <br> 1. 10 करोड़ परिवारों या लगभग 50 करोड़ भारतीयों को स्वास्थ्य कवरेज प्रदान करता है।\n  <br>2. सार्वजनिक और निजी दोनों तरह के सूचीबद्ध अस्पतालों में चिकित्सा उपचार के लिए प्रति परिवार प्रति वर्ष ₹5 लाख का कवर प्रदान करता है।\n  <br>3. अस्पताल या चिकित्सक के कार्यालय के माध्यम से नक़दीहीन भुगतान और कागज रहित रिकॉर्डकीपिंग की पेशकश करता है।\n  <br>4. लाभ के लिए पात्रता निर्धारित करने के लिए सामाजिक आर्थिक और जाति जनगणना 2011 के मानदंडों का उपयोग करता है।\n  <br>5. परिवार के आकार, उम्र या लिंग पर कोई प्रतिबंध नहीं है।\n  <br>6. पिछली सभी चिकित्सीय स्थितियाँ इस योजना के अंतर्गत आवरण की गई हैं।\n  <br>7. इसमें अस्पताल में भर्ती होने से पहले के 3 दिन और अस्पताल में भर्ती होने के 15 दिन बाद शामिल हैं, जिसमें नैदानिक देखभाल और दवाओं पर होने वाला खर्च भी शामिल है।\n  <br>8. यह योजना पोर्टेबल है और लाभार्थी अपने राज्य के बाहर और देश में कहीं भी किसी भी PM-JAY सूचीबद्ध अस्पताल में चिकित्सा उपचार का लाभ उठा सकता है।\n  <br>9. निःशुल्क कोविड-19 परीक्षण तक पहुंच प्रदान करता है।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "जफर खान दिल्ली सल्तनत के निम्नलिखित में से किस शासक का प्रसिद्ध सेनापति था?\n  <br>", "option1": "अलाउद्दीन खिलजी\n  <br>", "option2": "इल्तुतमिश\n  <br>", "option3": "मुहम्मद बिन तुगलक\n  <br>", "option4": "बलबन\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (a) अलाउद्दीन खिलजी है।\n  <br>1296 से 1316 तक दिल्ली के सुल्तान अलाउद्दीन खिलजी का एक प्रसिद्ध सेनापति था। उसने अलाउद्दीन के शासनकाल के दौरान कई बार मुल्तान, समाना और सिविस्तान, सिंध का प्रभार संभाला था। कुतलुग ख्वाजा के नेतृत्व में मंगोल आक्रमणकारियों के खिलाफ किली की लड़ाई में वह मारा गया।\n  <br>अलाउद्दीन के साथ बाद के दिनों से जुड़े हुए थे, और 1296 में अलाउद्दीन द्वारा अपने पूर्ववर्ती जलालुद्दीन की हत्या के बाद कारा से दिल्ली तक अलाउद्दीन की सेना के एक बड़े विभाग का नेतृत्व किया था। इसलिए, सही उत्तर (a), अलाउद्दीन खिलजी है।\n  <br>", "question_heading": ""}, {"sr_no": 1
