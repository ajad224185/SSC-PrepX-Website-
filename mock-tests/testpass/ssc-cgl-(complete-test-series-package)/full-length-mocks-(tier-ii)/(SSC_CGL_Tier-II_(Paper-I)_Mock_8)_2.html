  <br>The passage mentions that the humans were in awe of Raja's beauty and wanted to capture him and take him away to a zoo. This implies that their intention was to take Raja to a zoo.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "<b>What was Raja's legacy?</b> \n  <br>", "option1": "He became king of the jungle\n  <br>", "option2": "He was a fierce hunter\n  <br>", "option3": "He protected the jungle and its inhabitants\n  <br>", "option4": "He had many cubs who also became hunters.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Raja's legacy was that he protected the jungle and its inhabitants, making it a safer place.\n  <br>The passage mentions that Raja was a fierce hunter, but also a gentle soul who loved to laze in the sun and play with his cubs. When the humans threatened his peaceful life in the jungle, he moved deeper into the forest to protect himself and his domain. Raja's fierce protection made the jungle a safer place, and his cubs grew up to become strong and powerful hunters like him. Therefore, Raja's legacy was that he protected the jungle and its inhabitants.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>What was the reason behind Raja's decision to move deeper into the forest?</b> \n  <br>", "option1": "He was looking for a mate\n  <br>", "option2": "He was tired of his old hunting grounds\n  <br>", "option3": "He was trying to avoid humans\n  <br>", "option4": "He was following the migration of his prey\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Raja moved deeper into the forest to avoid humans.\n  <br>The passage mentions that Raja had a chance encounter with a group of humans who wanted to capture him and take him away to a zoo. Raja knew that his peaceful life in the jungle was in danger, so he decided to move deeper into the forest, away from human civilization. Therefore, the reason behind Raja's decision to move deeper into the forest was to avoid humans.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>What impact did Raja have on the jungle?</b> \n  <br>", "option1": "He caused chaos and destruction\n  <br>", "option2": "It is not mentioned in the story\n  <br>", "option3": "He had no impact on the jungle\n  <br>", "option4": "He helped to maintain the balance of the ecosystem\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Raja helped to maintain the balance of the ecosystem by protecting the jungle and its inhabitants.\n  <br>The passage mentions that Raja was the king of the jungle who ruled over his domain with an iron paw. He was a fierce hunter who hunted for his prey in the darkness of the night. However, he was also a gentle soul who loved to laze in the sun and play with his cubs. Raja's fierce protection made the jungle a safer place, and his cubs grew up to become strong and powerful hunters like him. Therefore, Raja helped to maintain the balance of the ecosystem in the jungle.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>What is the main goal of the 'Digital India' program launched by the government?</b> \n  <br>", "option1": "To provide broadband connectivity to all citizens\n  <br>", "option2": "To promote the growth of traditional industries\n  <br>", "option3": "To limit the influence of multinational tech giants\n  <br>", "option4": "To strengthen the country's military power\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (a) To provide broadband connectivity to all citizens.\n  <br>The passage states that the 'Digital India' program launched by the government aims to provide broadband connectivity to all citizens, digitize government services, and promote the growth of digital infrastructure across the country.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>What impact have Indian startups had on traditional industries?</b> \n  <br>", "option1": "They have disrupted traditional industries\n  <br>", "option2": "They have had no impact on traditional industries\n  <br>", "option3": "They have helped traditional industries grow\n  <br>", "option4": "It is not mentioned in the passage\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option(a) They have disrupted traditional industries.\n  <br>The passage states that Indian startups, including Paytm, Ola, Zomato, and Flipkart, have disrupted traditional industries and redefined the way Indians consume goods and services.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>What role have multinational tech companies played in India's digital power structure?</b> \n  <br>", "option1": "They have limited the growth of Indian startups\n  <br>", "option2": "They have invested in India's digital economy\n  <br>", "option3": "They have opposed the government's policies\n  <br>", "option4": "They have restricted internet access for Indian citizens\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) They have invested in India's digital economy.\n  <br>The passage states that large multinational tech companies such as Google, Amazon, and Facebook have made significant investments in India, both in terms of financial resources and talent. They have also worked with the Indian government to drive digital adoption and promote the growth of the digital economy.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>What opportunity does India's digital power structure present for the country?</b> \n  <br>", "option1": "To emerge as a leader in the global digital economy\n  <br>", "option2": "To return to traditional industries and abandon digital growth\n  <br>", "option3": "To rely on foreign investment to drive growth\n  <br>", "option4": "To limit internet access for citizens to preserve traditional values\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (a) To emerge as a leader in the global digital economy. The passage states that India's large and rapidly growing internet user base, combined with the presence of homegrown startups and multinational tech giants, has created a unique opportunity for India to emerge as a leader in the global digital economy.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>What is social responsibility?</b> \n  <br>", "option1": "Tुध iकधो पुोप यनgोnप्रोपiयnौ ौुयिहक ूनiयनiपप्रध ूनयीiपौ यॅधन ोिि िधसध.", "option2": "The idea that individuals should only focus on their own needs and wants.\n  <br>", "option3": "Tुध iकधो पुोप inकiॅiकहोिस ोnक यनgोnप्रोपiयnौ ुोॅध ो कहपद पय ोcप in ो थोद पुोप ृधnधीiपौ ौयciधपद ोौ ो थुियध.", "option4": "The idea that individuals should not be responsible for the impact of their actions on others.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) The idea that individuals and organizations have a duty to act in a way that benefits society as a whole. This is because the passage defines social responsibility as the concept that individuals and organizations have a responsibility to act in a way that benefits society as a whole. It also explains that this can take many forms, including volunteering, donating to charity, and adopting sustainable practices.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>What are some examples of social responsibility?</b> \n  <br>", "option1": "Ignoring the impact of our actions on others.\n  <br>", "option2": "Donating to charity.\n  <br>", "option3": "Maximizing profits at any cost.\n  <br>", "option4": "Avoiding all contact with others.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Donating to charity.\n  <br>This is because the passage provides the example of donating to charity as one way of demonstrating social responsibility. The other options provided, such as ignoring the impact of our actions on others and maximizing profits at any cost, are the opposite of social responsibility.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>Why is social responsibility important?</b> \n  <br>", "option1": "Iप ोिियथौ inकiॅiकहोिस ोnक यनgोnप्रोपiयnौ पय ृधnधीiप ोप पुध धसूधnौध यी यपुधनौ.", "option2": "It helps to address some of the biggest challenges facing society.\n  <br>", "option3": "It is only important for large corporations, not individuals.\n  <br>", "option4": "It is a waste of time and resources.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) It helps to address some of the biggest challenges facing society. This is because the passage explains that social responsibility can help address issues such as poverty, inequality, and climate change, which are some of the biggest challenges facing society today. The other options, such as allowing individuals and organizations to benefit at the expense of others and being a waste of time and resources, are the opposite of social responsibility.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "Hयथ cोn inकiॅiकहोिस ोnक यनgोnप्रोपiयnौ कधंयnौपनोपध ौयciोि नधौूयnौiृiिiपद?", "option1": "By only focusing on their own needs and wants.\n  <br>", "option2": "By ignoring the impact of their actions on others.\n  <br>", "option3": "By adopting sustainable practices and taking steps to mitigate negative consequences.\n  <br>", "option4": "Bद ूनiयनiपप्रing ूनयीiपौ यॅधन ोिि िधसध.", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) By adopting sustainable practices and taking steps to mitigate negative consequences. This is because the passage provides the example of adopting sustainable practices and taking steps to mitigate negative consequences as a way for individuals and organizations to demonstrate social responsibility. The other options provided, such as only focusing on their own needs and wants and prioritizing profits over all else, are the opposite of social responsibility.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "निम्नलिखित में से कौन-सा/\n  <b>से युग्म </b>सही सुमेलित नहीं है/हैं?\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697787370173image31.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अकबर: 1556 - 1605 ई. (1536-1605 नहीं)। अकबर तीसरा और सबसे प्रसिद्ध मुगल सम्राटों में से एक था, जिसने 1556 से 1605 तक शासन किया। अकबर अपने पिता हुमायूँ के उत्तराधिकारी बैरम खान के अधीन हुआ। इस प्रकार, जोड़ी 1 सही रूप से सुमेलित नहीं है।\n  <br>जहाँगीर: 1605 - 1627 ई.। जहाँगीर अकबर का पुत्र था, जिसने उसके बाद मुग़ल साम्राज्य पर शासन किया। वह चौथे मुगल सम्राट थे, जिन्होंने 1605 से 1627 में अपनी मृत्यु तक शासन किया। इस प्रकार, जोड़ी 2 सही रूप से सुमेलित है।\n  <br>शाहजहाँ: 1628 - 1658 ई. (1637-1658 नहीं)। शाहजहाँ जहाँगीर का पुत्र था और उसे ताज महल का निर्माण कराने के लिए जाना जाता है।\n  <br>शाहजहाँ प्रथम, मुग़ल साम्राज्य का पाँचवाँ मुस्लिम सम्राट था, जिसने जनवरी 1628 से जुलाई 1658 तक शासन किया। उनके शासनकाल में मुगल अपनी स्थापत्य उपलब्धियों और सांस्कृतिक गौरव के शिखर पर पहुंच गए। इस प्रकार, जोड़ी 3 सही रूप से सुमेलित नहीं है। इसलिए, केवल विकल्प (b) 1 और 3 सही है।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "निम्नलिखित में से कौन-सा राज्य के नीति निर्देशक सिद्धांत है?\n  <br>", "option1": "राज्य किसी भी व्यक्ति को कानून के समक्ष समानता से वंचित नहीं करेगा\n  <br>", "option2": "राज्य किसी भी व्यक्ति के खिलाफ धर्म, मूलवंश, जाति, लिंग या जन्म स्थान के आधार पर भेदभाव नहीं करेगा\n  <br>", "option3": "अस्पृश्यता समाप्त कर दी गई है और किसी भी रूप में इसका अभ्यास कानून द्वारा दंडनीय होगा\n  <br>", "option4": "राज्य पर्यावरण की रक्षा और सुधार के लिए प्रयास करेगा\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही विकल्प (d) है: राज्य पर्यावरण की रक्षा और सुधार के लिए प्रयास करेगा।\n  <br>राज्य के नीति निदेशक सिद्धांत भारत के संविधान में निर्धारित दिशानिर्देश या सिद्धांत हैं जिनका उद्देश्य देश के शासन में राज्य का मार्गदर्शन करना है। हालांकि वे किसी भी अदालत द्वारा लागू करने योग्य नहीं हैं, वे देश के शासन में मौलिक हैं और कानून बनाने में इन सिद्धांतों को लागू करना राज्य का कर्तव्य है।\n  <br>विकल्प (d) राज्य के नीति निर्देशक सिद्धांतों में से एक है। यह इस बात पर जोर देता है कि पर्यावरण की रक्षा और सुधार करना राज्य की जिम्मेदारी है।\n  <br>निदेशक सिद्धांतों के अनुच्छेद 48A में पर्यावरण की रक्षा और सुधार तथा वनों और वन्य जीवन की सुरक्षा का वर्णन है। इसलिए, विकल्प (d) सही है।\n  <br> नोट - अनुच्छेद 48A, जो पर्यावरण की सुरक्षा और सुधार तथा वनों और वन्य जीवन की सुरक्षा सुनिश्चित करता है, 42वें संशोधन अधिनियम, 1976 द्वारा जोड़ा गया था।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "निम्नलिखित में से कौन अकबर के नवरत्न में शामिल है/हैं ?\n  <br>1. अबुल फज़ल\n  <br>2. फैजी\n  <br>3. राजा मान सिंह\n  <br>कूट:\n  <br>", "option1": "केवल 1\n  <br>", "option2": "केवल 1 और 3\n  <br>", "option3": "केवल 1 और 2\n  <br>", "option4": "1, 2 और 3\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d) 1, 2 और 3 है। अबुल फजल, फैजी और राजा मान सिंह सभी अकबर के नवरत्नों का हिस्सा थे। नवरत्न नौ बुद्धिजीवियों और सलाहकारों का एक समूह था जिन्होंने अकबर के शासनकाल के दौरान उसकी सेवा की थी। उन्हें साहित्य, संगीत, गणित और राजनीति सहित विभिन्न क्षेत्रों में उनकी असाधारण प्रतिभा और ज्ञान के लिए चुना गया था।\n  <br>अबुल फज़ल अकबर के मुख्य सलाहकार और अकबरनामा के लेखक थे, जो अकबर के शासनकाल का इतिहास है। फ़ैज़ी एक कवि और विद्वान थे, और राजा मान सिंह एक सैन्य कमांडर और प्रशासक थे।\n  <br>नोट - अकबर के नवरत्नों में भारतीय इतिहास की कुछ प्रसिद्ध हस्तियाँ शामिल हैं, जैसे राजा टोडर मल, बीरबल, मुल्ला दो- पियाजा, राजा मान सिंह, फकीर अज़ियाओ-दीन, तानसेन, फैज़ी, अबुल फज़ल, और अब्दुल रहीम खान-आई- खाना।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "भारतीय संसदीय प्रणाली में संसद में होती है:\n  <br>", "option1": "राष्ट्रपति\n  <br>", "option2": "लोकसभा और राज्यसभा\n  <br>", "option3": "दोनों (a) और (b)\n  <br>", "option4": "केवल (b)\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b> </b>भारत की संसद तीन भागों से बनी है, 1. राष्ट्रपति 2. लोकसभा या लोक सभा 3. राज्यसभा या राज्यों की परिषद। इसलिए, (a) और (b) दोनों सही हैं।\n  <br> भारतीय संसद एक द्विसदनीय विधायिका है, जिसका अर्थ है कि इसमें दो सदन हैं। ऊपरी सदन राज्यसभा (राज्यों की परिषद) है, और निचला सदन लोकसभा (लोगों का सदन) है। भारत का राष्ट्रपति संसद का प्रमुख है, लेकिन उसकी कोई विधायी भूमिका नहीं है।\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "निम्नलिखित में से किस प्रादेश को व्यक्तिगत स्वतंत्रता की गारंटी कहा जाता है?\n  <br>", "option1": "परमादेश\n  <br>", "option2": "बंदी प्रत्यक्षीकरण\n  <br>", "option3": "अधिकार पुच्छा\n  <br>", "option4": "उत्प्रेषण लेख\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही विकल्प (b) बंदी प्रत्यक्षीकरण है। बंदी प्रत्यक्षीकरण प्रादेश को व्यक्तिगत स्वतंत्रता की गारंटी कहा जाता है।\n  <br>बंदी प्रत्यक्षीकरण एक लैटिन शब्द है जिसका शाब्दिक अर्थ है 'शरीर को अपने पास रखना'। यह अदालत द्वारा उस व्यक्ति को जारी किया गया एक आदेश है जिसने किसी अन्य व्यक्ति को हिरासत में लिया है, ताकि उसके सामने उसको पेश किया जा सके। इसके बाद अदालत हिरासत के कारण और वैधता की जांच करती है। यदि हिरासत अवैध पाई जाती है तो यह हिरासत में लिए गए व्यक्ति को मुक्त कर दिया जाएगा।\n  <br>इस प्रकार, यह प्रादेश मनमानी हिरासत के विरुद्ध व्यक्तिगत स्वतंत्रता का एक कवच है। इसलिए, विकल्प (b) सही है।\n  <br>नोट - बंदी प्रत्यक्षीकरण मनमानी हिरासत या कारावास के खिलाफ एक जाँच के रूप में कार्य करता है और यह सुनिश्चित करता है कि व्यक्तियों को उनकी व्यक्तिगत स्वतंत्रता से गैरकानूनी रूप से वंचित नहीं किया जाए। इसे अक्सर \"स्वतंत्रता की महान प्रादेश\" के रूप में जाना जाता है क्योंकि यह व्यक्तिगत स्वतंत्रता के लिए महत्वपूर्ण सुरक्षा प्रदान करता है।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "वर्ष 1919 के प्रस्तावित रोलेट अधिनियम ने राजनीतिक कैदियों को _____ तक बिना मुकदमे के हिरासत में रखने की अनुमति दी।\n  <br>", "option1": "दो वर्ष\n  <br>", "option2": "छह महीने\n  <br>", "option3": "दो महीने\n  <br>", "option4": "एक वर्ष\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "वर्ष 1919 के प्रस्तावित रोलेट अधिनियम ने राजनीतिक कैदियों को बिना मुकदमे के दो वर्ष तक हिरासत में रखने की अनुमति दी। वर्ष 1919 का अराजक और क्रांतिकारी अपराध अधिनियम रोलेट एक्ट के नाम से प्रसिद्ध है।\n  <br> \n  <b>1919 के रोलेट अधिनियम के प्रावधान:</b> \n  <br>इस अधिनियम का उद्देश्य देश में बढ़ते राष्ट्रवादी विद्रोह को रोकना था। रोलेट एक्ट ने सरकार को \"क्रांतिकारी\" या \"अराजकतावादी\" गतिविधियों के संदेह वाले किसी भी व्यक्ति को बिना किसी मुकदमे के दो वर्ष तक गिरफ्तार करने और जेल में डालने की अनुमति दी। इसने सरकार को बिना वारंट के तलाशी और जब्ती करने और व्यक्तियों को बिना किसी आरोप के छह महीने तक हिरासत में रखने का भी अधिकार दिया।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "निम्नलिखित में से कौन-सा सही सुमेलित है?\n  <br>", "option1": "काल बैसाखी - शरद ऋतु की हवाएँ\n  <br>", "option2": "व्यापारिक हवाएँ - शीतकालीन बर्फ़ीला तूफ़ान\n  <br>", "option3": "लू - गर्म हवा\n  <br>", "option4": "लू - शीतकालीन तूफानी हवाएँ\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>दिए गए विकल्पों में से, लू - गर्म हवा, सही रूप से मेल खाती है।\n  <br>\"लू\" एक शब्द है जिसका उपयोग गर्म, शुष्क और धूल भरी हवा का वर्णन करने के लिए किया जाता है जो भारतीय उपमहाद्वीप में चलती है, खासकर गर्मियों के महीनों के दौरान। \"लू\" शब्द हिंदी शब्द \"लू\" से लिया गया है, जिसका अर्थ है \"हवा।\"\n  <br>काल बैशाखी, जिसे नॉरवेस्टर्स के नाम से भी जाना जाता है, एक प्रकार का तूफान है जो अप्रैल और मई के महीनों के दौरान आता है।\n  <br>व्यापारिक हवाएँ प्रमुख स्थायी पूर्व-से-पश्चिम हवाएँ हैं जो ग्रह के भूमध्यरेखीय क्षेत्र से बहती हैं।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "अंतर्राष्ट्रीय क्रिकेट में मानक क्रिकेट गेंद की औसत परिधि कितनी होती है?\n  <br>", "option1": "7.89 इंच - 8.45 इंच\n  <br>", "option2": "10.46 इंच - 10.90 इंच\n  <br>", "option3": "9.45 इंच - 10.20 इंच\n  <br>", "option4": "8.81 इंच - 9 इंच\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अंतर्राष्ट्रीय क्रिकेट में उपयोग की जाने वाली मानक क्रिकेट गेंद की औसत परिधि 22.4 और 22.9 सेंटीमीटर (8.81 और 9.00 इंच) के बीच होती है।\n  <br>क्रिकेट के नियमों के अनुसार, गेंद का वजन 155.9 और 163.0 ग्राम (5.5 और 5.75 औंस) के बीच होना चाहिए और व्यास 6.81 और 7.06 सेंटीमीटर (2.68 और 2.78 इंच) के बीच होना चाहिए।\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "राजा हर्षवर्द्धन के संबंध में निम्नलिखित में से कौन-सा सही नहीं है?\n  <br>", "option1": "हर्षवर्धन ने लगभग 1400 वर्ष पहले शासन किया था\n  <br>", "option2": "जुआन ज़ैंग ने हर्ष के दरबार में बहुत समय बिताया\n  <br>", "option3": "हर्षवर्द्धन का दरबारी कवि हरिषेण था\n  <br>", "option4": "हर्षचरित, हर्षवर्द्धन पर लिखी गई एक जीवनी है\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "हर्षवर्द्धन, जिन्हें हर्ष के नाम से भी जाना जाता है, एक भारतीय सम्राट थे जिन्होंने 606 से 647 ई. तक शासन किया था। वह पुष्यभूति वंश के थे। हरिसेना, हर्षवर्द्धन का दरबारी कवि नहीं था।\n  <br>हरिसेना चौथी शताब्दी के संस्कृत कवि, प्रशस्तिकार और सरकारी मंत्री थे। वह गुप्त सम्राट समुद्रगुप्त के दरबार में एक महत्वपूर्ण व्यक्ति थे।\n  <br>हर्षवर्द्धन का दरबारी कवि बाणभट्ट था। बाणभट्ट की सबसे प्रसिद्ध कृति हर्षचरित है, जो सम्राट हर्षवर्द्धन की जीवनी है। हर्षचरित के अलावा, बाणभट्ट ने एक प्रेम प्रसंगयुक्त उपन्यास कादंबरी भी लिखा।\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "हाइड्रोक्लोरिक अम्ल पेप्सिन की क्रिया को सुविधाजनक बनाने में किस प्रकार मदद करता है?\n  <br>", "option1": "हाइड्रोक्लोरिक अम्ल एक अम्लीय माध्यम बनाता है जो एंजाइम पेप्सिन की क्रिया को सुविधाजनक बनाता है।\n  <br>", "option2": "हाइड्रोक्लोरिक अम्ल पेप्सिन को तोड़ने में मदद करता है।\n  <br>", "option3": "हाइड्रोक्लोरिक अम्ल एक क्षारीय माध्यम बनाता है जो एंजाइम पेप्सिन की क्रिया को सुविधाजनक बनाता है।\n  <br>", "option4": "हाइड्रोक्लोरिक अम्ल एक मूल माध्यम बनाता है जो एंजाइम पेप्सिन की क्रिया को सुविधाजनक बनाता है।\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "हाइड्रोक्लोरिक अम्ल (HCl) पेप्सिन के निष्क्रिय अग्रदूत, जिसे पेप्सिनोजेन के रूप में जाना जाता है, जिसको पेप्सिन के सक्रिय रूप में सक्रिय करने में मदद करता है। HCl 1.5 से 3.5 के बीच pH के साथ आमाशय में एक अम्लीय वातावरण बनाने में मदद करता है।\n  <br>HCl द्वारा निर्मित अम्लीय वातावरण पेप्सिनोजेन अणु के एक छोटे हिस्से को तोड़ देता है, जो इसे सक्रिय पेप्सिन में परिवर्तित कर देता है। पेप्सिनोजन आमाशय की गैस्ट्रिक ग्रंथियों में मुख्य कोशिकाओं द्वारा स्रावित होता है।\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "सूची I को सूची II से सुमेलित करें:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697787370173image32.png\"> \n  <br>नीचे दिए गए कूट से सही उत्तर का चयन कीजिए:\n  <br>A B C D\n  <br>", "option1": "1 2 3 4\n  <br>", "option2": "3 2 4 1\n  <br>", "option3": "2 3 4 1\n  <br>", "option4": "4 3 2 1\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (a) 1 2 3 4 है।\n  <br>सूची I और सूची II के बीच मिलान इस प्रकार है:\n  <br>A. टाटा इंस्टीट्यूट ऑफ फंडामेंटल रिसर्च (TIFR) - मुंबई, भारत\n  <br>B. भारतीय खगोल भौतिकी संस्थान (IIA) - बेंगलुरु, भारत\n  <br>C. राष्ट्रीय समुद्र विज्ञान संस्थान (NIO) - गोवा, भारत\n  <br>D. केंद्रीय औषधि अनुसंधान संस्थान (CDRI) - लखनऊ, भारत\n  <br>इसलिए, सही कूट 1 2 3 4 है।\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "प्रधानमंत्री उज्ज्वला योजना के संबंध में निम्नलिखित में से कौन-सा/से कथन सही है/हैं?\n  <br>A. इस योजना का उद्देश्य गरीबी रेखा से नीचे (BPL) परिवारों की महिलाओं को मुफ्त एलपीजी कनेक्शन प्रदान करना है।\n  <br>B. यह योजना पेट्रोलियम और प्राकृतिक गैस मंत्रालय द्वारा शुरू की गई थी।\n  <br>C. यह योजना पात्र BPL परिवारों को प्रत्येक एलपीजी कनेक्शन के लिए 1600 रुपये की वित्तीय सहायता भी प्रदान करती है।\n  <br>", "option1": "केवल A और B\n  <br>", "option2": "केवल B और C\n  <br>", "option3": "A, B और C\n  <br>", "option4": "केवल A और C\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c) A, B, और C है।\n  <br>प्रधानमंत्री उज्ज्वला योजना (PMUY) एक सरकारी योजना है जिसका उद्देश्य गरीबी रेखा से नीचे (BPL) वाले परिवारों की महिलाओं को मुफ्त एलपीजी कनेक्शन प्रदान करना है। यह योजना पेट्रोलियम और प्राकृतिक गैस मंत्रालय द्वारा मई 2016 में शुरू की गई थी।\n  <br>PMUY के तहत, सरकार पात्र BPL परिवारों को प्रत्येक एलपीजी कनेक्शन के लिए 1600 रुपये की वित्तीय सहायता प्रदान करती है। लाभार्थी महिला को 1400 रुपये की सुरक्षा जमा राशि का भुगतान करना आवश्यक है, जो एलपीजी कनेक्शन के तीन वर्ष के नियमित उपयोग के बाद वापस कर दिया जाता है।\n  <br>इसलिए, सभी कथन A, B और C सही हैं।\n  <br> \n  <b>नोट - </b>प्रधानमंत्री उज्ज्वला योजना का शुभारंभ माननीय प्रधान मंत्री श्री नरेंद्र मोदी द्वारा 1 मई 2016 को बलिया, उत्तर प्रदेश में किया गया था।\n  <br>टैगलाइन - \"स्वच्छ इंधन, बेहतर जीवन\"।\n  <br>पेट्रोलियम एवं प्राकृतिक गैस मंत्रालय इस योजना को क्रियान्वित कर रहा है।\n  <br>इस योजना को वर्ष 2021 में उज्ज्वला योजना 2.0 द्वारा प्रतिस्थापित किया गया था। प्रधान मंत्री ने पहली योजना से बाहर रह गए 1 करोड़ परिवारों को ईंधन प्रदान करने के लिए 10 अगस्त 2021 को उज्ज्वला योजना II शुरू की।\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "एकसमान त्वरण के बारे में निम्नलिखित में से कौन-सा सही है?\n  <br>", "option1": "घर्षण रहित सतह पर चलने वाली वस्तु एकसमान त्वरण प्राप्त कर सकती है।\n  <br>", "option2": "मुक्त रूप से गिरती हुई कोई वस्तु एकसमान त्वरण का उदाहरण है।\n  <br>", "option3": "स्थिर गति से गतिमान कोई वस्तु एकसमान त्वरण का उदाहरण है।\n  <br>", "option4": "स्प्रिंग की गति एकसमान त्वरण का एक उदाहरण है।\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (b) है: मुक्त रूप से गिरती हुई कोई वस्तु एकसमान त्वरण का उदाहरण है।\n  <br>एकसमान त्वरण का अर्थ है कि किसी वस्तु का वेग स्थिर दर से बढ़ रहा है। यह तभी हो सकता है जब वस्तु पर लगने वाला शुद्ध बल स्थिर हो।\n  <br>मुक्त गिरावट की स्थिति में, वस्तु पर कार्य करने वाला एकमात्र बल गुरुत्वाकर्षण है, और गुरुत्वाकर्षण एक स्थिर बल है। इसलिए, मुक्त रूप से गिरने वाली वस्तु में एकसमान त्वरण होगा।\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "प्रेरित धारा तब उच्चतम होती है जब कुंडली की गति की दिशा ___होती है।\n  <br>", "option1": "चुंबकीय क्षेत्र के समकोण पर नहीं\n  <br>", "option2": "विद्युत के समकोण पर\n  <br>", "option3": "विद्युत स्रोत के समकोण पर\n  <br>", "option4": "चुंबकीय क्षेत्र के समकोण पर\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d) है: चुंबकीय क्षेत्र के समकोण पर।\n  <br>जब कोई कुंडली चुंबकीय क्षेत्र में घूम रही होती है तो प्रेरित धारा उत्पन्न होती है। प्रेरित धारा की मात्रा कुंडली के माध्यम से चुंबकीय प्रवाह के परिवर्तन की दर के समानुपाती होती है। चुंबकीय प्रवाह के परिवर्तन की दर तब सबसे अधिक होती है जब कुंडल की गति की दिशा चुंबकीय क्षेत्र के समकोण पर होती है।\n  <br>फैराडे के विद्युत चुम्बकीय प्रेरण के नियम के अनुसार, किसी कुंडली में प्रेरित वैद्युतवाहक बल (EMF) या प्रेरित धारा का परिमाण अधिकतम होता है जब चुंबकीय क्षेत्र रेखाएं कुंडली की गति के लंबवत (या समकोण पर) होती हैं।\n  <br>इसलिए, जब कुंडल की गति की दिशा चुंबकीय क्षेत्र के समकोण पर होती है तो प्रेरित धारा सबसे अधिक होती है।\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "हाइड्रोजन आवर्त सारणी के किन दो समूहों के गुणों से मिलता जुलता है?\n  <br>", "option1": "समूह 2 और समूह 17\n  <br>", "option2": "समूह 1 और समूह 3\n  <br>", "option3": "समूह 1 और समूह 17\n  <br>", "option4": "समूह 2 और समूह 4\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "हाइड्रोजन आवर्त सारणी के (c) समूह 1 और समूह 17 के गुणों से मिलता जुलता है।\n  <br>हाइड्रोजन समूह 1 तत्वों के साथ कुछ समानताएं साझा करता है, जिन्हें क्षार धातु भी कहा जाता है, क्योंकि इसके बाहरी आवरण में क्षार धातुओं के समान एक इलेक्ट्रॉन होता है। इसके अतिरिक्त, हाइड्रोजन क्षार धातुओं के समान धनात्मक आयन बना सकता है।\n  <br>हाइड्रोजन भी समूह 17 तत्वों के साथ समानता प्रदर्शित करता है, जिन्हें हैलोजन भी कहा जाता है। हैलोजन की तरह, हाइड्रोजन को स्थिर इलेक्ट्रॉन विन्यास प्राप्त करने के लिए एक अतिरिक्त इलेक्ट्रॉन की आवश्यकता होती है। इसके अलावा, हाइड्रोजन हैलोजन के समान ऋणात्मक आयन बना सकता है।\n  <br>इसलिए, हाइड्रोजन समूह 1 (क्षार धातु) और समूह 17 (हैलोजन) दोनों तत्वों के साथ गुण साझा करता है, जिससे विकल्प (c) सही उत्तर है।\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "पृथुकृमि में पाई जाने वाली एक विशेष उत्सर्जी कोशिका कौन-सी है जो वृक्क की तरह कार्य करती है, निस्पंदन के माध्यम से अपशिष्ट पदार्थ को हटा देती है?\n  <br>", "option1": "वसा कोशिका\n  <br>", "option2": "ज्वाला कोशिका\n  <br>", "option3": "मूल कोशिका\n  <br>", "option4": "स्पंज कोशिका\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (b) ज्वाला कोशिका है। ज्वाला कोशिकाएँ विशेष उत्सर्जी कोशिकाएँ हैं जो प्लैटिहेल्मिन्थेस, एक प्रकार के चपटे कृमि में पाई जाती हैं। उन्हें ज्वाला कोशिकाएं कहा जाता है क्योंकि उनमें सिलिया का एक समूह होता है जो माइक्रोस्कोप के नीचे देखने पर टिमटिमाती लौ जैसा दिखता है।\n  <br>इन फ्लैगेला की धड़कन से एक विद्युत पैदा होता है जो तरल पदार्थ को कोशिका में खींचता है, जहां अपशिष्ट पदार्थों को निस्पंदन किया जाता है। फिर निस्पंदन किया गया द्रव कृमि की सतह पर एक छिद्र के माध्यम से उत्सर्जित होता है। तो, फ्लेम कोशिकाएं प्लैटिहेल्मिन्थेस में पाई जाने वाली विशेष उत्सर्जन कोशिकाएं हैं जो वृक्क की तरह काम करती हैं, निस्पंदन के माध्यम से अपशिष्ट पदार्थ को हटाती हैं।\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "निम्नलिखित में से कौन भारतीय अर्थव्यवस्था के द्वितीयक क्षेत्र के अंतर्गत आता है?\n  <br>", "option1": "चीनी उद्योग\n  <br>", "option2": "मत्स्यन\n  <br>", "option3": "बीमा\n  <br>", "option4": "माल का परिवहन\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (a) चीनी उद्योग है।\n  <br>भारतीय अर्थव्यवस्था के द्वितीयक क्षेत्र में ऐसे उद्योग शामिल हैं जो कच्चे माल को तैयार उत्पादों में बदलते हैं। इसमें विनिर्माण, निर्माण और खनन जैसे उद्योग शामिल हैं।\n  <br>चीनी उद्योग एक विनिर्माण उद्योग है जो गन्ने को चीनी में परिवर्तित करता है। इसलिए, यह भारतीय अर्थव्यवस्था के द्वितीयक क्षेत्र के अंतर्गत आता है।\n  <br> मत्स्यन भारतीय अर्थव्यवस्था के प्राथमिक क्षेत्र के अंतर्गत आता है।\n  <br> बीमा भारतीय अर्थव्यवस्था के तृतीयक क्षेत्र के अंतर्गत आता है।\n  <br> माल का परिवहन एक सेवा उद्योग है, यह भारतीय अर्थव्यवस्था के तृतीयक क्षेत्र के अंतर्गत आता है।\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "मौसमी बेरोजगारी क्या है?\n  <br>", "option1": "आमतौर पर शहरी क्षेत्रों में पाई जाने वाली बेरोजगारी का प्रकार।\n  <br>", "option2": "एक प्रकार की बेरोजगारी जब लोगों को वर्ष के कुछ महीनों के दौरान नौकरियां नहीं मिल पाती हैं\n  <br>", "option3": "बेरोजगारी का प्रकार जब लोग वर्ष के दौरान नौकरियां ढूंढने में सक्षम होते हैं\n  <br>", "option4": "इनमें से कोई नहीं\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "इसका उत्तर (b) है: एक प्रकार की बेरोजगारी जब लोगों को वर्ष के कुछ महीनों के दौरान नौकरी नहीं मिल पाती है।\n  <br>मौसमी बेरोजगारी एक प्रकार की बेरोजगारी है जो तब होती है जब वर्ष के कुछ निश्चित समय के दौरान श्रम की मांग में अस्थायी कमी हो जाती है। ऐसा कई कारकों के कारण हो सकता है, जैसे मौसम में बदलाव, फसल का मौसम या पर्यटन।\n  <br>उदाहरण के लिए, निर्माण उद्योग में काम करने वाले लोग सर्दियों के महीनों के दौरान बेरोजगार हो सकते हैं जब निर्माण कार्य कम होता है। या, जो लोग पर्यटन उद्योग में काम करते हैं इल के लिए फ़ाइल एक्सटेंशन .htm या .html है।\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "GPRS एक पैकेट-स्विचिंग तकनीक है जो सेलुलर नेटवर्क के माध्यम से डेटा ट्रांसफर को सक्षम बनाती है। GPRS में 'R' का क्या अर्थ है?\n  <br>", "option1": "Remote\n  <br>", "option2": "Radio\n  <br>", "option3": "Rooting\n  <br>", "option4": "Registry\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> जनरल पैकेट रेडियो सेवा (GPRS) एक पैकेट-आधारित मोबाइल डेटा सेवा है जो मोबाइल संचार (GSM) के लिए विश्वव्यापी प्रणाली का उपयोग करके 3जी और 2जी सेलुलर संचार प्रणालियों पर उपलब्ध है।\n  <br> यह जीएसएम नेटवर्क के लिए एक पैकेट-स्विचिंग विधि है जो गैर-आवाज, उच्च गति और उपयोगी है।\n  <br> यह मोबाइल फोन नेटवर्क के माध्यम से छोटे डेटा बर्स्ट और बड़े डेटा वॉल्यूम को भेजने और प्राप्त करने की अनुमति देता है।\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "निम्नलिखित में से कौन-सा एक्सेल स्प्रेडशीट का फाइल-एक्सटेंशन है?\n  <br>", "option1": ".RTF\n  <br>", "option2": ".PSD\n  <br>", "option3": ".XLS\n  <br>", "option4": ".PNG\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> XLS फ़ाइल एक स्प्रेडशीट फ़ाइल है जिसे माइक्रोसॉफ्ट एक्सेल का उपयोग करके बनाया गया था या किसी अन्य स्प्रेडशीट टूल जैसे ओपनऑफिस Calc या एप्पल नंबर से निर्यात किया गया था।\n  <br> इसमें एक या अधिक वर्कशीट होती हैं जो डेटा को सारणीबद्ध प्रारूप में संग्रहीत और प्रस्तुत करती हैं।\n  <br> गणितीय फ़ंक्शन, चार्ट, शैलियाँ और फ़ॉर्मेटिंग सभी को XLS फ़ाइलों में संग्रहीत किया जा सकता है।\n  <br> 1987 में एक्सेल की रिलीज़ के साथ, माइक्रोसॉफ्ट एक्सेल स्प्रेडशीट (XLS) बाइनरी प्रारूप पेश किया गया था।\n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "निम्नलिखित में से कौन-सा DBMS सॉफ्टवेयर नहीं है?\n  <br>", "option1": "ओरेकल\n  <br>", "option2": "एडोब इलस्ट्रेटर\n  <br>", "option3": "dBASE\n  <br>", "option4": "SQLite\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> एक डेटाबेस प्रबंधन प्रणाली (DBMS) एक सॉफ्टवेयर है जो उचित सुरक्षा उपाय करते हुए उपयोगकर्ताओं के लिए डेटा संग्रहीत और पुनर्प्राप्त करता है।\n  <br> यह उन अनुप्रयोगों के संग्रह से बना है जो डेटाबेस में हेरफेर करते हैं।\n  <br> DBMS डेटा के लिए एप्लिकेशन के अनुरोध को स्वीकार करता है और ऑपरेटिंग सिस्टम को अनुरोधित डेटा देने के लिए सूचित करता है।\n  <br> ओरेकल, माइक्रोसॉफ्ट एक्सेस, MySQL, dBASE, फॉक्सप्रो और SQLite, DBMS सॉफ्टवेयर के उदाहरण हैं।\n  <br> एडोब इलस्ट्रेटर एक वेक्टर ग्राफिक्स संपादक है जिसे एडोब द्वारा विकसित और विपणन किया गया है।\n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "निम्नलिखित में से कौन-सा एक मल्टीपोर्ट डिवाइस है जो नेटवर्क दक्षता में सुधार करता है?\n  <br>", "option1": "हब\n  <br>", "option2": "राउटर\n  <br>", "option3": "स्विच\n  <br>", "option4": "ब्रिज\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> अधिकांश मामलों में स्विच हब की तुलना में अधिक बुद्धिमान भूमिका निभाते हैं।\n  <br> स्विच एक मल्टीपोर्ट डिवाइस है जो नेटवर्क की दक्षता को बढ़ाता है।\n  <br> स्विच आंतरिक नेटवर्क नोड्स के बारे में सीमित रूटिंग जानकारी रखता है और हब और राउटर जैसे सिस्टम से कनेक्शन की सुविधा प्रदान करता है।\n  <br> आने वाले पैकेट के हार्डवेयर पते को स्विच द्वारा पढ़ा जा सकता है, जो फिर उन्हें सही गंतव्य पर भेज सकता है।\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "Java, सबसे लोकप्रिय प्रोग्रामिंग भाषाओं में से एक का आविष्कार किसके द्वारा किया गया था?\n  <br>", "option1": "जेम्स गोस्लिंग\n  <br>", "option2": "डेनिस रिची\n  <br>", "option3": "बजेर्ने स्ट्रॉस्ट्रुप\n  <br>", "option4": "गुइडो वैन रॉसम\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> जावा एक ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग भाषा है जिसका उपयोग विभिन्न प्लेटफार्मों पर चलने वाले सॉफ़्टवेयर बनाने के लिए किया जा सकता है।\n  <br> डेस्कटॉप, सर्वर, मोबाइल डिवाइस, स्मार्ट कार्ड और ब्लू-रे डिस्क सभी में जावा ऐप्स (BD) हैं।\n  <br> जावा एप्लेट बनाता ह रमित तरीके से जुड़े होते हैं।\n  <br> एक रूट नोड एक ट्री टोपोलॉजी में सबसे शीर्ष नोड है, और अन्य सभी नोड रूट नोड के डिसेन्डन्ट हैं।\n  <br> ट्री टोपोलॉजी का उपयोग मुख्य रूप से ब्रॉडबैंड ट्रांसमिशन प्रदान करने के लिए किया जाता है।\n  <br>                    Top of Form\n  <br>Bottom of Form\n  <br>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultHTML = resultSection.innerHTML;
  const fullHTML = `

<html lang="en">
<head>

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
