<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>29.) SSC CGL Tier-II (Paper-I) Mock 8 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

t.\n  <br>", "option1": "DBAC\n  <br>", "option2": "BADC\n  <br>", "option3": "CDBA\n  <br>", "option4": "ABCD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of the sentences to form a coherent paragraph is option (b) BADC.\n  <br> Sentence B introduces the concept of proofreading and defines it as the final stage of the editing process.\n  <br> Sentence A provides additional information about how proofreading can help avoid errors and ensure accuracy.\n  <br> Sentence D advises to revise the larger aspects of the text before proofreading.\n  <br> Finally, sentence C gives guidance on when to proofread, which is after finishing all other editing revisions.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. But now, I can proudly say that I have the control over my mind, and my mind does not control me.\n  <br>B. I started practicing mindfulness and meditation daily, and I noticed a significant difference in the way I think and act.\n  <br>C. I used to suffer from anxiety and depression, and my mind used to wander all the time, making me feel overwhelmed and stressed.\n  <br>D. It was not an easy journey, but I knew that I had to do something to improve my mental health and well-being.\n  <br>", "option1": "CBDA\n  <br>", "option2": "ACBD\n  <br>", "option3": "DACB\n  <br>", "option4": "BCAD\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of the sentences to form a coherent paragraph is option (a) CBDA.\n  <br> Sentence C sets the stage by describing the author's past experience of struggling with anxiety and depression, which led to their mind wandering and causing stress.\n  <br> Sentence B follows logically as it describes the action taken by the author to address their mental health issues.\n  <br> Sentence D fits here as it reflects the author's acknowledgment of the challenges, they faced during their journey to improve their mental health.\n  <br> Sentence A concludes the paragraph by highlighting the positive outcome achieved by the author.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the option that expresses the given sentence in active voice.\n  <br>The mysterious package was found by the detective hidden under the floorboards.\n  <br>", "option1": "The detective was finding the mysterious package hidden under the floorboards.\n  <br>", "option2": "The detective had found the mysterious package hidden under the floorboards.\n  <br>", "option3": "The detective has been finding the mysterious package hidden under the floorboards.\n  <br>", "option4": "The detective found the mysterious package hidden under the floorboards.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of passive voice having the form:\n  <br> Object + was+ V3+ Sub.\n  <br> When it is converted into active voice, following rule must be followed:\n  <br> Sub +V2 + object.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Given below are four jumbled sentences. Select the option that gives their correct logical sequence.\n  <br>A. Social media is a tool that has changed the way we communicate and interact with one another.\n  <br>B. It is important to remember that social media is a means of communication and not a replacement for personal interactions.\n  <br>C. While social media has its benefits, it can also lead to isolation and loneliness if not used in moderation.\n  <br>D. As we navigate through the ever-changing digital landscape, it is important to strike a balance between the virtual and the real world.\n  <br>", "option1": "DCBA\n  <br>", "option2": "BDCA\n  <br>", "option3": "CADB\n  <br>", "option4": "ADBC\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence A introduces the topic of social media and its impact on communication.\n  <br> Sentence D presents the idea of balancing virtual and real-life interactions, which follows logically from sentence A.\n  <br> Sentence B provides a cautionary note, suggesting that social media should not replace personal interactions.\n  <br> Sentence C builds on this idea, warning that overuse of social media can lead to negative consequences.\n  <br> The correct logical sequence, therefore, is ADBC.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>Rohit is really \n  <b>pulling the strings</b> in the company's decision-making process.\n  <br>", "option1": "to physically pull strings as a part of job\n  <br>", "option2": "to exert strong control and influence\n  <br>", "option3": "to experience physical strain\n  <br>", "option4": "to show exceptional skill in playing a musical instrument\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the highlighted idiom \"pulling the strings\" in this context is option (b) to exert strong control and influence.\n  <br> In the given sentence, \"Rohit is really pulling the strings in the company's decision-making process,\" it indicates that Rohit is actively and effectively controlling and influencing the decision-making process of the company.\n  <br> Example- Lisa's father is a powerful politician, and he is known for pulling the strings behind the scenes to ensure favourable outcomes in government decisions.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "Select the option that expresses the given sentence in active voice.\n  <br>The complex algorithm was developed by a team of highly skilled engineers.\n  <br>", "option1": "A team of highly skilled engineers had developed the complex algorithm.\n  <br>", "option2": "The complex algorithm has been developed by a team of highly skilled engineers.\n  <br>", "option3": "A team of highly skilled engineers developed the complex algorithm.\n  <br>", "option4": "A team of highly skilled engineers is developing the complex algorithm.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of passive voice having the form:\n  <br> Object + was+ V3+ Sub.\n  <br> When it is converted into active voice, following rule must be followed:\n  <br> Sub +V2 + object.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the most appropriate option to fill in the blank.\n  <br>The teacher asked the students to ___________ the questions before attempting the test.\n  <br>", "option1": "Consider\n  <br>", "option2": "Avoid\n  <br>", "option3": "Ignore\n  <br>", "option4": "Hesitate\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (a) consider.\n  <br> The sentence talks about what the teacher asked the students to do before attempting the test.\n  <br> The verb 'consider' means to think carefully about something, and in this context, it means to carefully think about the questions before attempting the test.\n  <br> The options (b) avoid, (c) ignore, and (d) hesitate do not fit in the context of the sentence.\n  <br> Meaning of other given words:\n  <br> \n  <b>Avoid</b>: to keep away from or prevent from happening, which doesn't fit the context of the sentence.\n  <br> \n  <b>Ignore</b>: to pay no attention to something, which is opposite to what the teacher is asking the students to do.\n  <br> \n  <b>Hesitate</b>: to pause or delay in taking action or making a decision, which is also not appropriate in this context.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Identify the option that arranges the given parts in the correct order to form a meaningful sentence.\n  <br>A. who had spent most of his childhood travelling with his parents across the globe\n  <br>B. because he felt his experiences could inspire and bring joy to others\n  <br>C. Peter, a man known for his love for culture and history\n  <br>D. decided to pen down his experiences in the form of an autobiography\n  <br>", "option1": "CBDA\n  <br>", "option2": "CADB\n  <br>", "option3": "DCBA\n  <br>", "option4": "CABD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order to form a meaningful sentence is option (b) CADB.\n  <br> Sentence C introduces the subject of the sentence, Peter. It tells us that Peter is a man known for his love for culture and history.\n  <br> Sentence A provides additional information about Peter. It tells us that he had a childhood spent traveling with his parents around the world.\n  <br> Sentence D reveals Peter's decision to write an autobiography. It shows that he has chosen to document his experiences, likely including the ones from his childhood travels, and share them with others.\n  <br> Sentence B explains Peter's motivation for writing the autobiography. It states that he believes his experiences are valuable and can inspire and bring joy to others.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the option that expresses the given sentence in passive voice.\n  <br>The students are solving the math problems in the classroom.\n  <br>", "option1": "The math problems have been solved by the students in the classroom.\n  <br>", "option2": "The students will solve the math problems in the classroom.\n  <br>", "option3": "The math problems are being solved by the students in the classroom.\n  <br>", "option4": "The students have been solving the math problems in the classroom.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having the form:\n  <br> Subject + is/am/are+ v1+ ing + object.\n  <br> When it is converted into passive voice, following rule must be followed:\n  <br> Object+ is/am/are+ being+ V3+ by + subject.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the most appropriate option to fill in the blank.\n  <br>The innovative technology has __________ the way we communicate and connect with others.\n  <br>", "option1": "Revolutionized\n  <br>", "option2": "Inhibited\n  <br>", "option3": "Maintained\n  <br>", "option4": "Constrained\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option to fill in the blank is (a) revolutionized.\n  <br> The word \"revolutionized\" means to bring about a significant and fundamental change.\n  <br> In the given sentence, it implies that the innovative technology has brought about a major transformation in the way we communicate and connect with others.\n  <br>The other options do not convey the same meaning of a significant change or transformation.\n  <br> \n  <b>Inhibit</b>: means to hinder, restrain, or prevent something from happening.\n  <br> \n  <b>Maintain</b>: means to keep something in a certain state or condition, or to preserve or uphold it.\n  <br> \n  <b>Constrain</b>: means to limit or restrict something.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The police were \n  <b>commended</b> for their prompt action in capturing the thief.\n  <br>", "option1": "Lauded\n  <br>", "option2": "Criticized\n  <br>", "option3": "Praised\n  <br>", "option4": "Flaunted\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Commend</b> means to praise or express approval for someone's actions or behaviour.\n  <br> \n  <b>Criticize</b> means to express disapproval or find fault with someone's actions or behaviour.\n  <br> The most appropriate antonym of the highlighted word \"commended\" would be (b) Criticized.\n  <br> Antonyms: \n  <b>criticized</b>, disapproved.\n  <br> Synonyms: praised, applauded, lauded.\n  <br>Meaning of the words given in the options:\n  <br> \n  <b>Laud</b>: To praise or express approval for someone's actions or behaviour.\n  <br> \n  <b>Praise</b>: To express approval or admiration for someone's actions or behaviour.\n  <br> \n  <b>Flaunt</b>: To display something in a way that is meant to impress others.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>The new manager needs \n  <b>to hit the ground running</b> if he wants to meet his targets.\n  <br>", "option1": "To start a new venture\n  <br>", "option2": "To have a smooth start to something new\n  <br>", "option3": "To quickly become effective in a new role\n  <br>", "option4": "To make a slow start in the beginning\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"hit the ground running\" means to start something with great energy and determination, and to quickly become effective at it. In the given sentence, the speaker is saying that the new manager needs to be able to quickly adapt to the new role and be effective in order to meet the targets.\n  <br> Example- \"After getting hired for the new job, Jane knew that she had to hit the ground running if she wanted to succeed in her new role.”\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Identify the option that contains the correctly spelled word in the given sentence.\n  <br>", "option1": "Definately\n  <br>", "option2": "Definitely\n  <br>", "option3": "Definetly\n  <br>", "option4": "Definatly\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that contains the correctly spelled word in the given sentence is (b) Definitely.\n  <br>The correct spelling of the word is \"Definitely,\" which means without a doubt, certainly, or clearly.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "Select the most appropriate synonym of the word given in brackets to fill in the blank.\n  <br>The storm caused __________ (widespread) damage to the city.\n  <br>", "option1": "negligible\n  <br>", "option2": "trivial\n  <br>", "option3": "insignificant\n  <br>", "option4": "considerable\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Widespread</b> means something that is widely or extensively spread or distributed.\n  <br> \n  <b>Considerable</b> means something significant or substantial.\n  <br> Therefore, option (d) is the most appropriate synonym for the given word, and it correctly conveys the idea of substantial damage caused by the storm.\n  <br> Synonyms: extensive, widespread, broad, far-reaching, \n  <b>considerable</b>.\n  <br> Antonyms: limited, narrow, confined, restricted.\n  <br>Meanings of the given words:\n  <br> \n  <b>Negligible</b>: so small or unimportant as to be not worth considering; insignificant.\n  <br> \n  <b>Considerable</b>: significant, substantial, noteworthy.\n  <br> \n  <b>Insignificant</b>: too small or unimportant to be worth consideration.\n  <br> \n  <b>Trivial</b>: of little value or importance.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Cिiंोपध cुोngध iौ ो ूनधौौing gियृोि iौौहध पुोप नधतहiनधौ cियिधcपiॅध ोcपiयn ोnक ौियहपiयnौ. B. Iप iौ iंूयनपोnप पय नोiौध ोथोनधnधौौ ोृयहप पुध iंूोcप यी inकiॅiकहोि ोcपiयnौ यn पुध धnॅiनयnंधnप. C. Sहौपोinोृिध ूनोcपicधौ, ौहcु ोौ नधकहcing gनधधnुयहौध gोौ धंiौौiयnौ ोnक cयnौधनॅing नधौयहनcधौ, ूिोद ो ॅiपोि नियध in ंiपigोपing cिiंोपध cुोngध. D. Gयॅधनnंधnपौ, यनgोnप्रोपiयnौ, ोnक inकiॅiकहोिस ंहौप थयना पयgधपुधन पय iंूिधंधnप ूियiciधौ ोnक iniपiोपiॅधौ पुोप ूनयंयपध धnॅiनयnंधnपोि ौहौपोinोृiिiपद.", "option1": "DCAB\n  <br>", "option2": "ABCD\n  <br>", "option3": "CBAD\n  <br>", "option4": "BDAC\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order to form a meaningful and coherent paragraph is option (b) ABCD.\n  <br> In this order, the paragraph begins by introducing climate change as a pressing global issue that demands collective action (sentence A).\n  <br> It then emphasizes the significance of raising awareness about the impact of individual actions on the environment (sentence B).\n  <br> The paragraph continues by highlighting the role of sustainable practices in addressing climate change (sentence C).\n  <br> Finally, it concludes by stressing the need for collaboration among governments, organizations, and individuals to implement policies and initiatives for environmental sustainability (sentence D).\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Select the most appropriate SYNONYM of the highlighted word.\n  <br>The teacher was very pleased with the student's \n  <b>alacrity</b> in completing the assignment.\n  <br>", "option1": "Sluggishness\n  <br>", "option2": "Enthusiasm\n  <br>", "option3": "Disinclination\n  <br>", "option4": "Laziness\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Alacrity</b> is willingness, promptness, or eagerness to do something.\n  <br> \n  <b>Enthusiasm</b>- intense and eager enjoyment, interest, or approval.\n  <br> Antonyms: sluggishness, reluctance, hesitation, procrastination.\n  <br> Synonyms: eagerness, promptness, willingness, \n  <b>enthusiasm</b>.\n  <br>Meanings of other given words:\n  <br> \n  <b>Disinclination</b>: a reluctance or lack of enthusiasm to do something.\n  <br> \n  <b>Sluggishness</b>: a lack of energy, enthusiasm, or activity.\n  <br> \n  <b>Laziness</b>: the quality of being unwilling to work or use energy; idleness.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. Renewable energy is energy that is derived from natural resources that can be replenished.\n  <br>B. Renewable energy sources include solar, wind, hydro, geothermal, and biomass.\n  <br>C. It is an alternative to fossil fuels that are finite and contribute to climate change.\n  <br>D. Thus, renewable energy is becoming more affordable and widely available due to advancements in technology.\n  <br>", "option1": "ACBD\n  <br>", "option2": "BCAD\n  <br>", "option3": "DCBA\n  <br>", "option4": "ADCB\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence A provides a definition of renewable energy, which is derived from natural resources that can be replenished.\n  <br> Sentence C explains the importance of renewable energy as an alternative to finite fossil fuels that contribute to climate change.\n  <br> Sentence B lists various renewable energy sources that include solar, wind, hydro, geothermal, and biomass.\n  <br> Sentence D emphasizes the growing accessibility of renewable energy due to technological advancements, which is making it more affordable and widely available.\n  <br> Therefore, the correct order of the sentences is ACBD.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Select the INCORRECTLY spelt word.\n  <br>", "option1": "Mischievous\n  <br>", "option2": "Embarrassment\n  <br>", "option3": "Occurrance\n  <br>", "option4": "Accommodate\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct spelling of the word in option (c) is \"Occurrence\".\n  <br> Meanings of the words given:\n  <br> \n  <b>Mischievous</b>: causing or showing a fondness for causing trouble in a playful way.\n  <br> \n  <b>Embarrassment</b>: a feeling of self-consciousness, shame, or awkwardness.\n  <br> \n  <b>Occurrence</b>: an event or incident that happens; the fact or frequency of something happening.\n  <br> \n  <b>Accommodate</b>: to provide lodging or sufficient space for someone or something; to adapt to the needs of someone or something.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Select the option that expresses the given sentence in indirect speech.\n  <br>Kajal said, \"I will be in Mumbai tomorrow.\"\n  <br>", "option1": "Kajal said that she would have been in Mumbai the next day.\n  <br>", "option2": "Kajal said that she would be in Mumbai the next day.\n  <br>", "option3": "Kajal said that she could be in Mumbai the next day.\n  <br>", "option4": "Kajal said that she should be in Mumbai the next day.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Direct Speech-</b> it means reporting the message of the speaker in the exact words as spoken by him.\n  <br> \n  <b>Indirect Speech- </b>It\n  <b> </b>is speech which tells you what someone said, but does not use the person's actual word.\n  <br> Given sentence is an example of direct speech.\n  <br> Indirect Speech - Reporting the message of the speaker in our own words.\n  <br> Direct Speech - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> ‘Tomorrow’ changes to ‘the next day’.\n  <br> ‘Future simple (Subject+ will/shall+V1+object)’ changes to ‘Present Conditional (Subject+ would+V1+object).’\n  <br> The sentence thus formed is - Kajal said that she would be in Mumbai the next day.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Select the most appropriate option to fill in the blank.\n  <br>The _____ of the machine should be checked before turning it on.\n  <br>", "option1": "Functioning\n  <br>", "option2": "Functionary\n  <br>", "option3": "Functional\n  <br>", "option4": "Functionless\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence is asking to check the status of the machine before turning it on. The appropriate word to fill in the blank would be \"functioning\" as it refers to the working or operating of a machine as intended.\n  <br> Meaning of the other given words:\n  <br> \n  <b>Functionary</b>: a person who works in an official capacity for a government or other organization; an official in a political party or labour union.\n  <br> \n  <b>Functional</b>: designed to be practical and useful, rather than attractive; in good working order.\n  <br> \n  <b>Functionless</b>: having no use or purpose; serving no function.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Identify the pair of antonyms from the highlighted words in the given sentence.\n  <br>The teacher \n  <b>praised</b> the \n  <b>diligent</b> \n  <b>students</b> but \n  <b>scolded</b> the \n  <b>lazy</b> ones for not doing their \n  <b>homework</b>.\n  <br>", "option1": "praised, lazy\n  <br>", "option2": "students, homework\n  <br>", "option3": "scolded, diligent\n  <br>", "option4": "diligent, lazy\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The pair of antonyms from the highlighted words in the given sentence is (d) diligent, lazy.\n  <br> The sentence states that the teacher praised the diligent students, who are characterized by their hardworking nature, and scolded the lazy ones, who are characterized by their lack of effort or motivation.\n  <br> Diligent and lazy are antonyms as they are opposite in meaning, with diligent meaning hardworking and industrious, while lazy means lacking in effort or motivation.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don’t find any error, mark ‘No error’ as your answer.\n  <br>The car had to be taken to the mechanic because it wouldn't start along the cold weather.\n  <br>", "option1": "The car had to be taken to the mechanic\n  <br>", "option2": "because it wouldn't start\n  <br>", "option3": "along the cold weather\n  <br>", "option4": "No error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The part of the sentence that contains an error is option (c) along the cold weather.\n  <br> The correct phrase to use in this context is \"in the cold weather\" instead of \"along the cold weather.\"\n  <br> \"In\" is the preposition commonly used to indicate being within a specific weather condition, while \"along\" suggests movement or direction alongside something.\n  <br> Therefore, the correct sentence would be: The car had to be taken to the mechanic because it wouldn't start in the cold weather.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the most appropriate option to replace the highlighted word in the given sentence.\n  <br>The young girl was feeling extremely \n  <b>anxious</b> about the upcoming examination.\n  <br>", "option1": "nervous\n  <br>", "option2": "relaxed\n  <br>", "option3": "confident\n  <br>", "option4": "exhausted\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to replace the highlighted word \"anxious\" in the given sentence is (a) nervous.\n  <br> The word \"\n  <b>anxious</b>\" means feeling worried or nervous about something that might happen.\n  <br> In the given sentence, the young girl is worried or nervous about the upcoming examination.\n  <br> Therefore, the most appropriate option to replace \"anxious\" is \"nervous\".\n  <br>The other options are not suitable in the given context.\n  <br> \n  <b>Relaxed</b> means feeling calm and not worried, which is opposite to what is being conveyed in the sentence.\n  <br> \n  <b>Confident</b> means feeling sure or certain about something, which is not in line with the young girl's feelings of anxiety.\n  <br> \n  <b>Exhausted</b> means extremely tired, which does not fit the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the option that expresses the given sentence in indirect speech.\n  <br>Madhuri said to me, “You are my best friend.”\n  <br>", "option1": "Madhuri told me that I was being her best friend.\n  <br>", "option2": "Madhuri told me that I should be her best friend.\n  <br>", "option3": "Madhuri told me that I was her best friend.\n  <br>", "option4": "Madhuri told me that I can be her best friend.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Direct Speech-</b> it means reporting the message of the speaker in the exact words as spoken by him.\n  <br> \n  <b>Indirect Speech- </b>It\n  <b> </b>is speech which tells you what someone said, but does not use the person's actual word.\n  <br> Given sentence is an example of direct speech.\n  <br> While changing direct speech into indirect speech following rules are to be followed:\n  <br> ‘Present simple (Subject +V1st + Object)’ changes to ‘Past simple (Subject +V2 + Object).’\n  <br> The sentence thus formed is - Madhuri told me that I was her best friend.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Identify the correct homophone from the given options to complete the sentence.\n  <br>The _______ of the church bell signalled the end of the wedding ceremony.\n  <br>", "option1": "chime\n  <br>", "option2": "climb\n  <br>", "option3": "crime\n  <br>", "option4": "rhyme\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct homophone that completes the sentence is (a) chime.\n  <br> A homophone is a word that sounds the same as another word but has a different meaning.\n  <br> In the given sentence, the word that fits the blank is a noun and refers to the sound made by a bell.\n  <br> The word that fits this definition is \"chime\" (option a).\n  <br>The other options are not suitable because they have different meanings.\n  <br> \n  <b>Climb</b> means to go up or ascend.\n  <br> \n  <b>Crime</b> means an illegal act.\n  <br> \n  <b>Rhyme</b> refers to words that have similar sounds.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who travels to a foreign country to settle there.\n  <br>", "option1": "Tourist\n  <br>", "option2": "Immigrant\n  <br>", "option3": "Emigrant\n  <br>", "option4": "Explorer\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The one-word substitute for the given group of words \"A person who travels to a foreign country to settle there\" is (b) Immigrant.\n  <br> An \n  <b>immigrant</b> is a person who comes to live permanently in a foreign country.\n  <br> In the given group of words, the person is traveling to a foreign country with the intention of settling there, which fits the definition of an immigrant.\n  <br>The other options are not suitable because they have different meanings.\n  <br> A \n  <b>tourist</b> is a person who visits a place for pleasure or sightseeing.\n  <br> An \n  <b>emigrant</b> is a person who leaves their own country to settle in another country.\n  <br> An \n  <b>explorer</b> is a person who travels to unknown or remote places to discover or investigate.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who believes that people are motivated purely by self-interest rather than acting for honourable or unselfish reasons.\n  <br>", "option1": "Altruist\n  <br>", "option2": "Egoist\n  <br>", "option3": "Idealist\n  <br>", "option4": "Realist\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The one-word substitute for the given group of words \"A person who believes that people are motivated purely by self-interest rather than acting for honourable or unselfish reasons\" is (b) Egoist.\n  <br> An \n  <b>egoist</b> is a person who is excessively concerned with oneself and believes that self-interest should be the motivating force in all of one's actions.\n  <br> In the given group of words, the person believes that people are motivated purely by self-interest, which fits the definition of an egoist.\n  <br>The other options are not suitable because they have different meanings.\n  <br> An \n  <b>altruist</b> is a person who has a selfless concern for the welfare of others.\n  <br> An \n  <b>idealist</b> is a person who is guided more by ideals than by practical considerations.\n  <br> A \n  <b>realist</b> is a person who sees things as they really are and is practical rather than idealistic.\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "Select the option that expresses the given sentence in reported speech.\n  <br>Anand said, “My parents arrived on Wednesday.\"\n  <br>", "option1": "Anand said that his parents were arrived on Wednesday.\n  <br>", "option2": "Anand said that his parents had arrived on Wednesday.\n  <br>", "option3": "Anand said that his parents had been arriving on Wednesday.\n  <br>", "option4": "Anand said that his parents have arrived on Wednesday.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Direct Speech-</b> it means reporting the message of the speaker in the exact words as spoken by him.\n  <br> \n  <b>Indirect Speech- </b>It\n  <b> </b>is speech which tells you what someone said, but does not use the person's actual word.\n  <br> Given sentence is an example of direct speech.\n  <br> While changing direct speech into indirect speech following rules are to be followed:\n  <br> ‘Past simple (Subject+V2+Object)’ changes to ‘Past perfect (Subject + had + V3 + Object).’\n  <br> The sentence thus formed is - Anand said that his parents had arrived on Wednesday.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Select the most appropriate option to fill in blank number 1.</b> \n  <br>", "option1": "sinking\n  <br>", "option2": "floating\n  <br>", "option3": "emerging\n  <br>", "option4": "evaporating\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the options given:\n  <br> \n  <b>Sink</b>: to go down below the surface of water or any
