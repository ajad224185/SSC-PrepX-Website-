<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>34.) SSC CGL Tier-II (Paper-I) Mock 9(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

mance.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. The sound of the music, the colourful outfits and the enthusiasm of the performers made the show an unforgettable experience.\n  <br>B. I attended a cultural event last weekend that showcased a range of traditional dances from different parts of the country.\n  <br>C. Each dance form was accompanied by a live band playing instruments unique to that region.\n  <br>D. The performers, who were all trained in their respective dance forms, put on a spectacular show.\n  <br>", "option1": "BDAC\n  <br>", "option2": "ACBD\n  <br>", "option3": "ACDB\n  <br>", "option4": "BCDA\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence (B) introduces the topic and the event that the author attended.\n  <br> Sentence (D) describes the performers, emphasizing their training and the quality of their performance.\n  <br> Sentence (A) provides sensory details to illustrate the immersive experience of watching the performances.\n  <br> Sentence (C) adds another layer of cultural specificity, explaining that each dance form was accompanied by a live band playing instruments unique to that region.\n  <br> Therefore, the correct order is BDAC.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Sय पुध cयंूोnदैौ nधथ CEO ुोौ ोnnयहncधक ो ौधनiधौ यी iniपiोपiॅधौ ोiंधक ोप नधकहcing थोौपध ोnक incनधोौing धीीiciधncद. B. Tुध cयंूोnद ुोौ ृधधn ीोcing cनiपiciौं ीयन iपौ िोcा यी धnॅiनयnंधnपोि नधौूयnौiृiिiपद ोnक पुध nधgोपiॅध iंूोcप यी iपौ यूधनोपiयnौ यn ियcोि cयंंहniपiधौ. C. Tुधौध iniपiोपiॅधौ incिहकध inॅधौपing in नधnधथोृिध धnधनgद ौयहनcधौ ोnक iंूिधंधnपing ौहौपोinोृिध ूनोcपicधौ e it with a grain of salt\" implies a degree of scepticism or not fully accepting something as completely true or valid. It suggests a cautious and sceptical approach to information or criticism.\n  <br> Therefore, option (a) is the correct answer.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "Select the option that expresses the given sentence in active voice.\n  <br>The elusive criminal was apprehended by the astute detective after months of investigation.\n  <br>", "option1": "The astute detective apprehended the elusive criminal after months of investigation.\n  <br>", "option2": "After months of investigation, the elusive criminal was apprehended by the astute detective.\n  <br>", "option3": "The elusive criminal had been apprehended by the astute detective after months of investigation.\n  <br>", "option4": "The astute detective was apprehending the elusive criminal after months of investigation.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of passive voice having form:\n  <br> Obj. + was/were + V3 + by + sub.\n  <br> When it is converted into active voice, following rule is followed:\n  <br> Sub + V2+ obj.\n  <br> The sentence thus formed is- The astute detective apprehended the elusive criminal after months of investigation.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the most appropriate option to fill in the blank.\n  <br>I always _____________ before starting a new project.\n  <br>", "option1": "procrastinate\n  <br>", "option2": "celebrate\n  <br>", "option3": "collaborate\n  <br>", "option4": "contemplate\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (d) contemplate.\n  <br> The sentence suggests that the speaker always engages in a certain activity before starting a new project. The word \"contemplate\" means to think deeply or carefully about something.\n  <br> Therefore, the sentence means that the speaker always thinks carefully before starting a new project, which is a good practice as it helps to plan and organize the work.\n  <br> All the other given options are not appropriate in the context of the sentence.\n  <br>Meanings of the other given words:\n  <br> \n  <b>Procrastinate</b>: To delay or postpone doing something, often to the point of causing problems or missing a deadline.\n  <br> \n  <b>Celebrate</b>: To commemorate or acknowledge an event or achievement by engaging in joyful activities, such as parties, feasting, or public ceremonies.\n  <br> \n  <b>Collaborate</b>: To work together with one or more people in order to achieve a common goal or complete a task.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Identify the option that arranges the given parts in the correct order to form a meaningful paragraph.\n  <br>A. The chef carefully selected the freshest ingredients from the local market.\n  <br>B. With precision and skill, he prepared a delectable five-course meal.\n  <br>C. The diners savoured each bite, impressed by the harmonious flavours and exquisite presentation.\n  <br>D. As the evening drew to a close, the chef received well-deserved accolades for his culinary mastery.\n  <br>", "option1": "ABCD\n  <br>", "option2": "BCDA\n  <br>", "option3": "DACB\n  <br>", "option4": "CBAD\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence A states that the chef carefully selected the freshest ingredients from the local market. This sets the stage for the culinary journey.\n  <br> Sentence B follows logically after A, describing how the chef utilized the selected ingredients with precision and skill to prepare a delectable five-course meal.\n  <br> Sentence C fits naturally after B, as it describes the diners savouring each bite of the meal.\n  <br> Finally, sentence D provides a fitting conclusion to the paragraph. It states that as the evening came to an end, the chef received well-deserved accolades for his culinary mastery.\n  <br> Therefore, option (a) ABCD is the correct answer.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the option that expresses the given sentence in passive voice.\n  <br>The company will award bonuses to its top-performing employees.\n  <br>", "option1": "Bonuses will be awarded to the company's top-performing employees.\n  <br>", "option2": "Bonuses will be awarded by the company's top-performing employees.\n  <br>", "option3": "Top-performing employees will be awarded bonuses by the company.\n  <br>", "option4": "The company's top-performing employees will award bonuses.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having form:\n  <br> Subject + will+ v1+ object.\n  <br> When it is converted into passive voice, following rule is followed: \n  <br> Object+ will+ be +V3+ by + subject.\n  <br> The sentence thus formed is- Top-performing employees will be awarded bonuses by the company.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the most appropriate option to fill in the blank.\n  <br>With a graceful motion, she delicately __________ the intricately embroidered silk shawl around her shoulders, completing her elegant ensemble.\n  <br>", "option1": "placid\n  <br>", "option2": "was placing\n  <br>", "option3": "had placed\n  <br>", "option4": "placed\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence sets the context of a past event by using the phrase \"With a graceful motion\" and indicates that the action being described has already been completed by using the past tense verb \"completed.\" Therefore, we need to select a verb form that aligns with this past tense context.\n  <br> Option (a) \"placid\" is an adjective that means calm or tranquil. It doesn't fit the context of the sentence since we need a verb to describe an action, not an adjective.\n  <br> Option (b) \"was placing\" uses the past continuous tense, indicating an ongoing action in the past. However, the sentence suggests that the action of placing the shawl was already completed, so the continuous tense is not appropriate here.\n  <br> Option (c) \"had placed\" uses the past perfect tense, indicating an action that occurred before another past action. Although this tense is grammatically correct, it suggests that placing the shawl happened before another past event, which is not specified in the sentence. Since there is no need for a specific sequence of events, this option is not the best choice.\n  <br> Option (d) \"placed\" is the simple past tense form of the verb \"place.\" It accurately describes the action of delicately putting the intricately embroidered silk shawl around her shoulders, aligning with the past tense context established in the sentence.\n  <br> Therefore, the most appropriate option is (d) \"placed.\"\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>The movie's plot was \n  <b>convoluted</b> and hard to follow.\n  <br>", "option1": "Intricate\n  <br>", "option2": "Pellucid\n  <br>", "option3": "Ambiguous\n  <br>", "option4": "Cohesive\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word \"convoluted\" means complex and hard to follow. The antonym of \"convoluted\" is a word that means clear and easy to understand. Among the given options, \"pellucid\" best fits this description. Therefore, option (b) is the correct answer.\n  <br> Synonyms: complicated, intricate, tangled, knotty.\n  <br> Antonyms: \n  <b>pellucid</b>, clear, transparent, lucid.\n  <br>Meanings of other given words:\n  <br> \n  <b>Intricate</b> means complex and having many interrelated parts.\n  <br> \n  <b>Ambiguous</b> means having multiple possible meanings or interpretations.\n  <br> \n  <b>Cohesive</b> means forming a united and logical whole, connected and consistent.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate meaning of the highlighted idiom.\n  <br>The new employee was \n  <b>thrown in at the deep end</b> on his first day.\n  <br>", "option1": "Being put into a difficult situation\n  <br>", "option2": "Lacking in confidence\n  <br>", "option3": "Being in a comfortable position\n  <br>", "option4": "Receiving special treatment\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The idiom \"thrown in at the deep end\" means to be put into a difficult situation without any preparation or training.\n  <br> In this context, the new employee is being given a significant amount of responsibility on his first day, which is a difficult situation. So, option (a) is the correct answer.\n  <br> Example: John had never swum before, but his friends threw him in at the deep end of the pool to teach him. He had to quickly learn to stay afloat and swim to safety.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the option that will improve the segment in bold of the given sentence.\n  <br>In case no improvement is needed, select ‘No improvement.’\n  <br>The teacher requested the students \n  <b>to had their homework completed</b> by Monday.\n  <br>", "option1": "to has completed their homework\n  <br>", "option2": "have completed their homework\n  <br>", "option3": "to have their homework completed\n  <br>", "option4": "No improvement\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) to have their homework completed.\n  <br> The original sentence is in the past tense and the use of the word 'had' in the sentence is incorrect as it creates a redundant past tense.\n  <br> In option (c), the infinitive form of the verb 'to have' is used with the main verb 'completed', making it grammatically correct.\n  <br> Option (b) is incorrect because it omits the word 'to' before the verb 'have'.\n  <br> Option (a) is also incorrect because it changes the tense of the sentence and does not follow the original context.\n  <br> Therefore, option (c) is the correct answer as it improves the grammatical accuracy of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "Select the most appropriate synonym of the word given in brackets to fill in the blank.\n  <br>The author's writing style is very __________ (elegant).\n  <br>", "option1": "Simple\n  <br>", "option2": "Graceful\n  <br>", "option3": "Awkward\n  <br>", "option4": "Plain\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Elegant - graceful and stylish in appearance or manner.\n  <br> Graceful - characterized by elegance or beauty of form, manner, movement, or speech; elegant.\n  <br> Therefore, the correct answer is (b) Graceful, as it is a synonym of \"elegant.\"\n  <br> Antonyms: clumsy, inelegant, awkward.\n  <br> Synonyms: refined, \n  <b>graceful</b>, sophisticated, stylish.\n  <br>Meanings of the given words:\n  <br> \n  <b>Simple</b> - easily understood or done; presenting no difficulty.\n  <br> \n  <b>Awkward</b> - causing or feeling embarrassment or inconvenience; not graceful.\n  <br> \n  <b>Plain</b> - not decorated or elaborate; simple or basic in character.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. He decided to study abroad to pursue higher education.\n  <br>B. After graduating from high school, he was unsure about his future plans.\n  <br>C. He researched different universities and countries before making a decision.\n  <br>D. He applied for scholarships and completed all the necessary paperwork.\n  <br>", "option1": "ACBD\n  <br>", "option2": "ABCD\n  <br>", "option3": "DCBA\n  <br>", "option4": "BACD\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence B provides the introductory statement that the person is unsure about his future plans after graduating from high school.\n  <br> Sentence A explains that he decided to study abroad to pursue higher education.\n  <br> Sentence C explains how he researched different universities and countries before making a decision.\n  <br> Finally, sentence D explains that he applied for scholarships and completed all the necessary paperwork.\n  <br> Therefore, the correct order of sentences to form a coherent paragraph is BACD.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Select the most appropriate SYNONYM of the highlighted word in the given sentence:\n  <br>The speaker delivered a \n  <b>passionate</b> speech that ignited the audience's enthusiasm.\n  <br>", "option1": "Apathetic\n  <br>", "option2": "Fervent\n  <br>", "option3": "Indifferent\n  <br>", "option4": "Lacklustre\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Passionate</b> - showing or characterized by intense emotions, enthusiasm, or strong feelings.\n  <br> Antonyms: apathetic, indifferent, lacklustre.\n  <br> Synonyms: \n  <b>fervent</b>, enthusiastic, zealous.\n  <br>Meaning of the words given in options:\n  <br> \n  <b>Fervent</b>: having or displaying intense passion, enthusiasm, or conviction.\n  <br> \n  <b>Apathetic</b>: showing or feeling no interest, enthusiasm, or concern.\n  <br> \n  <b>Indifferent</b>: having no particular interest or sympathy; unconcerned.\n  <br> \n  <b>Lacklustre</b>: lacking in vitality, force, or conviction; uninspired or dull.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Arrange the following sentences in the correct order to form a meaningful and coherent paragraph:\n  <br>A. The company's profits have been declining steadily for the past year.\n  <br>B. The CEO blamed the decline in profits on the global pandemic and economic downturn.\n  <br>C. The shareholders demanded an explanation for the company's poor performance.\n  <br>D. The CEO promised to implement new strategies to improve the company's financial performance.\n  <br>", "option1": "ACBD\n  <br>", "option2": "BDAC\n  <br>", "option3": "DCAB\n  <br>", "option4": "CABD\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence A provides the introductory statement that the company's profits have been declining steadily for the past year.\n  <br> Sentence C explains that the shareholders demanded an explanation for the company's poor performance.\n  <br> Sentence B explains that the CEO blamed the decline in profits on the global pandemic and economic downturn.\n  <br> Finally, sentence D provides the concluding statement that the CEO promised to implement new strategies to improve the company's financial performance.\n  <br> Therefore, the correct order of sentences to form a coherent paragraph is ACBD.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Select the INCORRECTLY spelt word from the options given below:\n  <br>", "option1": "Pneumonia\n  <br>", "option2": "Privelige\n  <br>", "option3": "Inoculate\n  <br>", "option4": "Correspondence\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that is INCORRECTLY spelt is option (b) Privelige. The correct spelling is \"Privilege\".\n  <br> Meanings of the words given:\n  <br> \n  <b>Pneumonia</b> - an acute or chronic illness characterized by inflammation of the lungs and difficulty breathing.\n  <br> \n  <b>Privilege</b> - a special right or advantage that is granted to a particular person or group.\n  <br> \n  <b>Inoculate</b> - to protect against a disease by introducing a small dose of the virus or bacteria into the body.\n  <br> \n  <b>Correspondence</b> - communication between two or more people or organizations by exchanging letters, emails, or messages.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Select the option that expresses the given sentence in indirect speech:\n  <br>The Police said to the criminal, “Don’t move!”\n  <br>", "option1": "The Police ordered the criminal that he can not to move.\n  <br>", "option2": "The Police warned the criminal not to move.\n  <br>", "option3": "The Police warned the criminal if he could move.\n  <br>", "option4": "The Police told the criminal that he could not move.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Imperative Sentence.’\n  <br> \n  <b>Imperative Sentence</b> - Imperative sentences give an order or direct command. These sentences may come in the form of advice, appeal, request, or order.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> Conjunction – In the Imperative sentence conjunction ‘To’ is used.\n  <br> Negative commands, requests etc. are expressed by ‘Not + To+ Infinitive.\n  <br> The sentence thus formed is - The Police warned the criminal not to move.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Identify the pair of synonyms from the highlighted words in the given sentence:\n  <br>The \n  <b>judge's</b> \n  <b>verdict</b> was \n  <b>final</b> and \n  <b>irrevocable</b>.\n  <br>", "option1": "judge, verdict\n  <br>", "option2": "final, irrevocable\n  <br>", "option3": "judge, irrevocable\n  <br>", "option4": "verdict, final\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The pair of synonyms from the highlighted words in the given sentence is: (b) final, irrevocable.\n  <br> The word \"final\" means conclusive or ultimate, while \"irrevocable\" means irreversible or permanent. Both of these words have similar meanings and can be used interchangeably in certain contexts.\n  <br> On the other hand, \"judge\" refers to a person who presides over a court of law, while \"verdict\" refers to a decision or judgement made by a judge or jury. These words are not synonyms, as they have different meanings.\n  <br> Therefore, the pair of synonyms from the highlighted words in the given sentence is final and irrevocable, and the correct answer is (b) final, irrevocable.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don't find any error, mark 'No error' as your answer:\n  <br>She is always first one to arrive at the office and the last one to leave in the evening as she is very dedicated to her work.\n  <br>", "option1": "She is always first one to arrive\n  <br>", "option2": "at the office and the last one to leave\n  <br>", "option3": "in the evening\n  <br>", "option4": "No error.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In this sentence, the error lies in the missing definite article \"the\" before the adjective \"first.\"\n  <br> When comparing someone or something to others, we use the definite article \"the\" before \"first,\" \"second,\" \"third,\" etc. to specify their position.\n  <br> Therefore, the correct sentence should include \"the\" before \"first\" to indicate her position as the first one to arrive.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the most appropriate option to fill in the blank.\n  <br>The teacher will ______________ a surprise quiz tomorrow.\n  <br>", "option1": "give up\n  <br>", "option2": "give in\n  <br>", "option3": "give away\n  <br>", "option4": "give out\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (d) give out.\n  <br> The phrasal verb \"give out\" means to distribute something, such as papers, assignments, or tests. In this sentence, the teacher is planning to distribute a surprise quiz tomorrow, so the correct option to fill in the blank is \"give out\".\n  <br> \n  <b>Give up</b> means to stop trying or surrender, which is not suitable in the context of the sentence.\n  <br> \n  <b>Give in</b> means to yield or concede, which is also not appropriate in this context.\n  <br> \n  <b>Give away</b> means to give something as a gift or for free, which is not the intended meaning in this sentence.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the most appropriate option to replace the highlighted segment in the given sentence.\n  <br>He did not expect that the exam would be so difficult, \n  <b>and </b>he studied hard for it.\n  <br>", "option1": "however\n  <br>", "option2": "but\n  <br>", "option3": "therefore\n  <br>", "option4": "unless\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to replace the highlighted segment in the given sentence is (a) however.\n  <br> \n  <b>However</b>- it is a conjunction that is used to introduce a contrasting or conflicting statement.\n  <br> In this sentence, the first part of the sentence conveys that the person did not expect the exam to be difficult, while the second part of the sentence conveys that the person studied hard for it. Therefore, there is a contrast between the person's expectations and actions, and the conjunction \"however\" is used to convey this contrast effectively.\n  <br> But is also a conjunction that is used to introduce a contrasting or conflicting statement. However, it does not fit as well in this sentence as \"however\" because \"however\" is generally used to introduce a contrasting statement that is more significant or unexpected than the preceding statement.\n  <br> Therefore- is used to indicate a consequence or result of an action, which is not the intended meaning in this sentence.\n  <br> Unless- except if (used to introduce the case in which a statement being made is not true or valid).\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the option that expresses the given sentence in direct speech.\n  <br>Rohit said to his friend, “You should take care of yourself.”\n  <br>", "option1": "Rohit told his friend that he should have taken care of himself.\n  <br>", "option2": "Rohit told his friend that he could take care of himself.\n  <br>", "option3": "Rohit told his friend that he must take care of himself.\n  <br>", "option4": "Rohit told his friend that he should take care of himself.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br>  The given sentence is an ‘Assertive Sentence.’\n  <br> Sentences that make a statement are called assertive sentences. These sentences may be positive, negative, false, or true statements.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> Reported Verb – ‘Said’ remains unchanged.\n  <br> Conjunction – In the Assertive sentence conjunction ‘That’ is used.\n  <br> Tense – “Should” remains unchanged.\n  <br> The sentence thus formed is - Rohit told his friend that he should take care of himself.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>Deep-seated prejudice or dislike of women\n  <br>", "option1": "Philanthropist\n  <br>", "option2": "Misanthrope\n  <br>", "option3": "Benefactor\n  <br>", "option4": "Misogynist\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the given options:\n  <br> Philanthropist - A person who loves humanity and is actively engaged in promoting human welfare through charitable donations, volunteering, or other philanthropic activities.\n  <br> Misanthrope - A person who dislikes, distrusts, or hates humankind, and may avoid social situations or have difficulty forming meaningful relationships with others.\n  <br> Benefactor - A person who provides financial or other forms of support to a person, group, or organization, often in the form of a donation or gift.\n  <br> Misogynist - A person who has a deep-seated prejudice or dislike of women, often characterized by a belief in the inferiority of women and a tendency to discriminate against them.\n  <br> Option (d) portrays the same meaning as that of the given group of words & hence it is the correct choice.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>The act of killing a king.\n  <br>", "option1": "Patricide\n  <br>", "option2": "Regicide\n  <br>", "option3": "Fratricide\n  <br>", "option4": "Homicide\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the options given:\n  <br> \n  <b>Patricide </b>- The act of killing one's own father.\n  <br> \n  <b>Regicide -</b> The act of killing a monarch or king.\n  <br> \n  <b>Fratricide</b> - The act of killing one's own brother.\n  <br> \n  <b>Homicide</b> - The act of killing another person, regardless of the relationship between the killer and the victim.\n  <br> Option (b) portrays the same meaning as that of the given group of words & hence it is the correct choice.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Select the option that expresses the given sentence in reported speech.\n  <br>The boss said, “He had been working in my company for 12 years.”\n  <br>", "option1": "The boss said that he has been working in his company for 12 years.\n  <br>", "option2": "The boss asked if he had been working in his company for 12 years.\n  <br>", "option3": "The boss said that he might be working in his company for 12 years.\n  <br>", "option4": "The boss said that he had been working in his company for 12 years.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br> The given sentence is of ‘Direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Assertive Sentence.’\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> Reported Verb – ‘Said’ remains unchanged.\n  <br> Conjunction – In the Assertive r> Meaning of other words:\n  <br> \n  <b>Diminishing</b> - make or become less.\n  <br> \n  <b>Stabilizing</b> - make or become unlikely to change, fail, or decline.\n  <br> \n  <b>Unchanging</b> - not changing or able to be changed.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "Select the most appropriate option to fill in blank number 5.\n  <br>", "option1": "consequences\n  <br>", "option2": "benefits\n  <br>", "option3": "obligations\n  <br>", "option4": "opportunities\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'consequences' to make the sentence contextually correct.\n  <br> 'Consequences' means a result or effect, typically one that is unwelcome or unpleasant.\n  <br> As per the context, it is projected that by 2025, half of the world's population will live in areas where water is scarce and hence, it will have serious consequences for the future.\n  <br> Meaning of other words:\n  <br> \n  <b>Benefits</b> - an advantage or profit gained from something.\n  <br> \n  <b>Obligations</b> - an act or course of action to which a person is morally or legally bound; a duty or commitment.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "What is microfinance?\n  <br>", "option1": "A financial service that caters to the needs of large businesses.\n  <br>", "option2": "A financial service that caters to the needs of small and medium-sized businesses.\n  <br>", "option3": "A financial service that caters to the needs of only the poor.\n  <br>", "option4": "A financial service that caters to the needs of only the rich.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A financial service that caters to the needs of only the poor. This is because the passage explicitly states that microfinance involves providing financial services, such as loans, savings, and insurance, to low-income individuals who lack access to traditional banking services. Its main goal is to alleviate poverty, promote entrepreneurship, and foster business development.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "How can microfinance promote economic growth?\n  <br>", "option1": "By providing financial services to small and medium-sized businesses that cannot access traditional banking services.\n  <br>", "option2": "By providing financial services to only the poor.\n  <br>", "option3": "By providing financial services to only the rich.\n  <br>", "option4": "By providing financial services to large businesses.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) By providing financial services to small and medium-sized businesses that cannot access traditional banking services. The passage outlines that one of the main benefits of microfinance is providing a means for low-income individuals to access credit, which helps them start or expand their businesses. This, in turn, positively impacts the local economy, leading to increased employment opportunities and higher incomes for individuals and their families, ultimately promoting economic growth.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "How does microfinance benefit women?\n  <br>", "option1": "It provides women with the opportunity to access financial services that they would not have otherwise.\n  <br>", "option2": "It provides women with the opportunity to access traditional banking services.\n  <br>", "option3": "It only provides financial services to men.\n  <br>", "option4": "It does not benefit women.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) It provides women with the opportunity to access financial services that they would not have otherwise. Although the passage does not explicitly mention women, we can infer that they are included in the category of low-income individuals who benefit from microfinance. Microfinance allows these individuals to access credit, even if they lack collateral or credit history. By offering financial services that they would not have otherwise, microfinance empowers women to start or expand their businesses, which can positively impact their lives and communities.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "What is the role of governments in promoting microfinance?\n  <br>", "option1": "The government should not be involved in promoting microfinance.\n  <br>", "option2": "The government should provide subsidies to microfinance institutions.\n  <br>", "option3": "The government should provide loans to microfinance institutions.\n  <br>", "option4": "The government should regulate microfinance institutions to ensure that they operate ethically and transparently.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) The government should regulate microfinance institutions to ensure that they operate ethically and transparently. While the passage does not directly discuss the role of governments in promoting microfinance, it can be inferred that proper regulation of MFIs is essential for the effectiveness of microfinance as a tool for poverty alleviation and economic development. By ensuring that MFIs operate ethically and transparently, governments can foster the sustainable growth of microfinance and promote its positive impact on low-income individuals and communities.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "What was the fox's plan to catch the rabbits?\n  <br>", "option1": "He planned to chase them in the forest\n  <br>", "option2": "He pretended to be their friend and tricked them\n  <br>", "option3": "He promised to give them a treasure in return for their help\n  <br>", "option4": "He did not have a plan to catch the rabbits\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) He pretended to be their friend and tricked them. The fox saw a group of rabbits playing and devised an evil plan to catch them for his meal. Instead of directly attacking or chasing them, he pretended to be their friend, engaged them in conversation, and asked for their help in finding a beautiful garden. His plan revolved around tricking the rabbits into trusting him, so he could eventually catch them.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "What did the fox promise to give the rabbits in return for their help?\n  <br>", "option1": "A ride on his back\n  <br>", "option2": "A delicious dinner\n  <br>", "option3": "A chance to explore the forest\n  <br>", "option4": "A new home in his den\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) A delicious dinner. The fox promised the rabbits that if they showed him the way to the beautiful garden, he would share his delicious dinner with them. The rabbits were excited about the prospect of a tasty meal, so they agreed to help the fox.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "What did the fox actually bring for the rabbits?\n  <br>", "option1": "A basket of carrots\n  <br>", "option2": "A basket of fruits\n  <br>", "option3": "A basket of fish\n  <br>", "option4": "A basket of flowers\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) A basket of carrots. After the rabbits led the fox to the garden, he went away to supposedly fetch his dinner. Instead, he returned with a basket of carrots from his own garden, claiming that he had picked them as a token of his gratitude. The rabbits, unaware of the fox's deception, happily ate the carrots.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What did the rabbits do when they found out that they had been tricked by the fox?\n  <br>", "option1": "They forgave the fox and became friends again\n  <br>", "option2": "They warned all the other animals in the forest about the fox's trickery\n  <br>", "option3": "They decided to take revenge on the fox\n  <br>", "option4": "They forgot about the incident and continued to play as usual.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) They warned all the other animals in the forest about the fox's trickery. When the rabbits realized that the cunning fox had tricked them, they decided to warn all the other animals in the forest about his deceptive ways. This not only protected the other animals from falling into the fox's traps but also forced the fox to find new ways to get his meals. The fox learned his lesson and never tried to trick the rabbits again.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "According to the passage, what is remote work?\n  <br>", "option1": "Work done at a physical office location\n  <br>", "option2": "Work done through a remote server\n  <br>", "option3": "Work done from home or any location outside of a traditional office\n  <br>", "option4": "Work done in a shared office space\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Work done from home or any location outside of a traditional office. According to the passage, remote work enables individuals to work from any location, provided they have a computer and a stable internet connection. This has contributed to the rise of digital nomads who travel the world while working remotely.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "Why has remote work become more popular in recent years?\n  <br>", "option1": "To save companies money on office space\n  <br>", "option2": "To give employees more flexibility and work-life balance\n  <br>", "option3": "To increase collaboration and team building\n  <br>", "option4": "To increase productivity by reducing distractions\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) To give employees more flexibility and work-life balance. The passage highlights that remote work has become more popular in recent years due to advancements in technology and the internet, allowing for better work-life balance and flexibility. Individuals can manage their own schedules and eliminate the need for a daily commute.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What are some of the benefits of remote work mentioned in the passage?\n  <br>", "option1": "Increased work-life balance and reduced commuting time\n  <br>", "option2": "Increased collaboration and team building opportunities\n  <br>", "option3": "Reduced productivity and increased distractions\n  <br>", "option4": "Increased costs for companies due to the need for technology and equipment\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) Increased work-life balance and reduced commuting time. The passage mentions several benefits of remote work, including better work-life balance, as individuals can manage their schedules and avoid daily commutes. Additionally, remote work opens up job opportunities for those who may not have access to traditional office-based jobs due to location constraints. Employers also benefit from remote work, as it enables a more diverse and global workforce and saves costs associated with traditional office-based jobs.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "What is one potential downside of remote work mentioned in the passage?\n  <br>", "option1": "Increased productivity and efficiency\n  <br>", "option2": "Isolation and lack of face-to-face interaction with colleagues\n  <br>", "option3": "Increased costs for employees due to the need for technology and equipment\n  <br>", "option4": "Reduced flexibility and work-life balance.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Isolation and lack of face-to-face interaction with colleagues. One potential downside of remote work mentioned in the passage is that communication and collaboration can be more difficult in a remote environment. Building and maintaining relationships with co-workers can be challenging, and remote work requires a higher level of self-discipline and time-management skills since individuals must manage their own work schedule\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "संविधान (74वें) संशोधन अधिनियम में ________ का उल्लेख है।\n  <br>", "option1": "राष्ट्रीय विकास परिषद की संरचना\n  <br>", "option2": "भारत के योजना आयोग की संरचना\n  <br>", "option3": "राज्य वित्त आयोग की स्थापना\n  <br>", "option4": "कावेरी जल प्राधिकरण के कार्य\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "चौहत्तरवें संशोधन अधिनियम, 1992 ने शहरी स्थानीय निकायों को संवैधानिक दर्जा और सुरक्षा प्रदान की। इस प्रयोजन के लिए, संशोधन में एक नया भाग IX-A जोड़ा गया है जिसका शीर्षक है 'नगर पालिकाएँ' और एक नई बारहवीं अनुसूची जिसमें नगर पालिकाओं की 18 कार्यात्मक वस्तुएँ शामिल हैं।\n  <br> यह अधिनियम संस्थागत परिवर्तनों को भी निर्धारित करता है, जिसमें क्षेत्राधिकारों में योजना के समन्वय के लिए वार्ड समितियों, जिला योजना समितियों और महानगरीय योजना समितियों की स्थापना के साथ-साथ राज्य चुनाव आयोगों और राज्य वित्तीय आयोगों की स्थापना भी शामिल है। तो, विकल्प (c) सही है।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "निम्नलिखित में से किस स्थिति में भारत में नागरिकता प्रदान की जा सकती है?\n  <br>1. व्यक्ति का जन्म भारत में होना चाहिए।\n  <br>2. जिनके माता-पिता में से कोई एक भारत में जन्मा हुआ हो।\n  <br>3. जो कम से कम पांच वर्ष तक भारत का सामान्य निवासी रहा हो।\n  <br>नीचे दिए गए कूट का उपयोग करके सही उत्तर चुनें:\n  <br>", "option1": "1, 2 और 3\n  <br>", "option2": "1 और 2\n  <br>", "option3": "2 और 3\n  <br>", "option4": "या तो 1 या 2 या 3\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "1955 का नागरिकता अधिनियम नागरिकता प्राप्त करने के पांच तरीके निर्धारित करता है, जैसे, जन्म, वंश, पंजीकरण, देशीयकरण और क्षेत्र का समावेश।\n  <br> 26 जनवरी 1950 को या उसके बाद भारत में जन्मा प्रत्येक व्यक्ति भारत का नागरिक है, बशर्ते उसके पिता विदेशी शत्रु या राजनयिक मिशन के प्रतिनिधि न हों।\n  <br> 26 जनवरी 1950 को या उसके बाद लेकिन 10 दिसंबर 1992 से पहले भारत के बाहर पैदा हुआ व्यक्ति वंश के आधार पर भारत का नागरिक है यदि उसके जन्म के समय उसके पिता भारत के नागरिक थे। 10 दिसंबर 1992 को या उसके बाद भारत के बाहर पैदा हुए व्यक्ति को भारत का नागरिक माना जाता है यदि उसके जन्म के समय उसके माता-पिता में से कोई एक भारत का नागरिक हो।\n  <br> कथन 3 गलत है क्योंकि भारतीय मूल का व्यक्ति जो पंजीकरण के लिए आवेदन करने से पहले 7 वर्षों (5 वर्ष से कम नहीं) तक भारत का निवासी रहा है, पंजीकरण द्वारा नागरिकता प्राप्त कर सकता है। तो, विकल्प (b) 1 और 2 सही है।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "निम्नलिखित में से कौन सा भारत के संविधान के तहत एक मानवाधिकार के साथ-साथ एक मौलिक अधिकार भी है?\n  <br>", "option1": "सूचना का अधिकार\n  <br>", "option2": "शिक्षा का अधिकार\n  <br>", "option3": "काम करने का अधिकार\n  <br>", "option4": "आवास का अधिकार\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (b), शिक्षा का अधिकार है। शिक्षा का अधिकार भारत के संविधान के तहत एक मानव अधिकार होने के साथ-साथ एक मौलिक अधिकार भी है। यह संविधान के अनुच्छेद 21A में निहित है, जिसे 2002 में 86वें संशोधन अधिनियम द्वारा जोड़ा गया था। शिक्षा का अधिकार 6 से 14 वर्ष की आयु के सभी बच्चों को मुफ्त और अनिवार्य शिक्षा की गारंटी देता है।\n  <br>अन्य विकल्प, सूचना का अधिकार, काम का अधिकार और आवास का अधिकार भी मानवाधिकार हैं, लेकिन ये भारत के संविधान के तहत मौलिक अधिकार नहीं हैं। सूचना के अधिकार की गारंटी सूचना का अधिकार अधिनियम, 2005 द्वारा दी गई है। काम करने के अधिकार की गारंटी राज्य के नीति निर्देशक सिद्धांतों द्वारा दी गई है, लेकिन यह मौलिक अधिकार नहीं है। आवास के अधिकार का संविधान में स्पष्ट रूप से उल्लेख नहीं किया गया है, लेकिन इसे अनुच्छेद 21 के तहत जीवन और व्यक्तिगत स्वतंत्रता के अधिकार का एक हिस्सा माना जाता है। इसलिए, सही उत्तर है (बी), शिक्षा का अधिकार।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "जी-20 के संबंध में निम्नलिखित में से कौन सा सही नहीं है?\n  <br>", "option1": "विकसित देशों का एक समूह\n  <br>", "option2": "विश्व बैंक और IMF के बाहर\n  <br>", "option3": "जी-7 की एक शाखा\n  <br>", "option4": "सभी सही हैं।\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "जी-20 19 देशों और यूरोपीय संघ का एक अनौपचारिक समूह है, जिसमें अंतर्राष्ट्रीय मुद्रा कोष और विश्व बैंक के प्रतिनिधि शामिल हैं।\n  <br>जी-20 दुनिया की अधिकांश सबसे बड़ी अर्थव्यवस्थाओं के वित्त मंत्रालयों से बना है, जिसमें औद्योगिक और विकासशील दोनों देश शामिल हैं। तो, विकल्प (a) गलत है।\n  <br>जी-20 सदस्यता में दुनिया की सबसे बड़ी उन्नत और उभरती अर्थव्यवस्थाओं का मिश्रण शामिल है, जो दुनिया की लगभग दो-तिहाई आबादी, वैश्विक सकल घरेलू उत्पाद का 85%, वैश्विक निवेश का 80% और वैश्विक व्यापार का 75% से अधिक का प्रतिनिधित्व करता है।\n  <br>यह जी-7 देशों की एक शाखा है जो विश्व बैंक, आईएमएफ और संयुक्त राष्ट्र के दायरे से बाहर है।\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "निगम कर किसके द्वारा लगाया जाता है?\n  <br>", "option1": "राज्य सरकार\n  <br>", "option2": "केंद्र सरकार\n  <br>", "option3": "स्थानीय सरकार\n  <br>", "option4": "राज्य और केंद्र सरकार\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (b), केंद्र सरकार।है। निगम कर कंपनियों की शुद्ध आय पर लगाया जाने वाला कर है। यह भारत में केंद्र सरकार द्वारा लगाया जाता है। राज्य सरकार को निगम कर लगाने का अधिकार नहीं है। तो उत्तर (b) है।\n  <br>निगम कर एक प्रत्यक्ष कर है, जिसका अर्थ है कि यह करदाता द्वारा सीधे सरकार को भुगतान किया जाता है। यह एक प्रगतिशील कर है, जिसका अर्थ है कि करदाता की आय बढ़ने पर कर की दर बढ़ जाती है। भारत में निगम कर की दर वर्तमान में 30% है।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "कोल इंडिया लिमिटेड से संबंधित निम्नलिखित कथनों पर विचार करें:\n  <br>1. इसे कोयला मंत्रालय के तहत 'महारत्न' कंपनी के रूप में नामित किया गया है।\n  <br>2. यह दुनिया की सबसे बड़ी कोयला उत्पादक कंपनी है।\n  <br>3. कोल इंडिया लिमिटेड का मुख्यालय रांची, झारखंड में स्थित है।\n  <br>ऊपर दिए गए कथनों में से कौन सा/से सही है/हैं?\n  <br>", "option1": "केवल 1\n  <br>", "option2": "केवल 1 और 2\n  <br>", "option3": "केवल 2 और 3\n  <br>", "option4": "1, 2 और 3\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "कोल इंडिया लिमिटेड एक भारतीय राज्य के स्वामित्व वाली कोयला खनन और रिफाइनरी कंपनी है जिसका मुख्यालय कोलकाता, पश्चिम बंगाल में है। यह दुनिया की सबसे बड़ी कोयला उत्पादक कंपनी और एक महारत्न PSU है। कोल इंडिया भारत के आठ राज्यों में 81 खनन क्षेत्रों के माध्यम से परिचालन करती है।\n  <br> कोल इंडिया लिमिटेड को 'महारत्न' कंपनी के रूप में नामित किया गया है, जो भारत में केंद्रीय सार्वजनिक क्षेत्र उद्यमों (CPSEs) की सर्वोच्च श्रेणी है। अतः, कथन 1 सही है।\n  <br> कोल इंडिया लिमिटेड वास्तव में दुनिया की सबसे बड़ी सरकारी स्वामित्व वाली कोयला उत्पादक कंपनी है। यह भारत के कोयला उत्पादन का एक महत्वपूर्ण हिस्सा है और देश की ऊर्जा जरूरतों को पूरा करने में महत्वपूर्ण भूमिका निभाता है। तो, कथन 2 भी सही है।\n  <br> कोल इंडिया लिमिटेड का मुख्यालय कोलकाता, पश्चिम बंगाल में स्थित है, न कि रांची, झारखंड में। तो, कथन 3 गलत है।\n  <br> इसलिए, सही उत्तर केवल (b) 1 और 2 है।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "निम्नलिखित में से कौन सा द्वीप ज्वालामुखी मूल का है?\n  <br>", "option1": "रीयूनियन द्वीप\n  <br>", "option2": "अंडमान और निकोबार द्वीप समूह\n  <br>", "option3": "लक्षद्वीप द्वीप समूह\n  <br>", "option4": "मालदीव\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "बैरेन द्वीप अंडमान सागर में स्थित एक द्वीप है, जिस पर बैरेन ज्वालामुखी का प्रभुत्व है, जो दक्षिण एशिया में एकमात्र पुष्टिकृत सक्रिय ज्वालामुखी है और सुमात्रा से म्यांमार तक ज्वालामुखियों की श्रृंखला में एकमात्र सक्रिय ज्वालामुखी है।\n  <br>यह अंडमान और निकोबार द्वीप समूह के भारतीय केंद्र शासित प्रदेश का एक हिस्सा है और क्षेत्र की राजधानी पोर्ट ब्लेयर से लगभग 138 किमी (86 मील) उत्तर पूर्व में स्थित है।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "निम्नलिखित में से कौन सा दीर्घकालिक समुद्र-स्तर परिवर्तन का कारण है?\n  <br>", "option1": "वायुमंडलीय अशांति\n  <br>", "option2": "समुद्री जल घनत्व में परिवर्तन\n  <br>", "option3": "हिमखंडों का पिघलना\n  <br>", "option4": "बर्फ की चादरों का पिघलना\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "समुद्र के स्तर में दीर्घकालिक परिवर्तन तीन प्राथमिक कारकों से जुड़ा हुआ है:\n  <br>1. थर्मल विस्तार\n  <br>2. पिघलते ग्लेशियर\n  <br>3. ग्रीनलैंड और अंटार्कटिका की बर्फ की चादरों का नुकसान\n  <br>ग्रीनलैंड और अंटार्कटिका में पाई जाने वाली बर्फ की चादरों में भारी मात्रा में बर्फ होती है। जब ये बर्फ की चादरें पिघलती हैं, तो परिणामस्वरूप पानी महासागरों में बह जाता है, जिससे समुद्र के स्तर में वृद्धि होती है। यह प्रक्रिया लंबी अवधि में होती है और इससे वैश्विक समुद्र स्तर में महत्वपूर्ण परिवर्तन हो सकते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "हम्पी में विजयनगर के खंडहरों को 1800 में प्रकाश में लाया गया था?\n  <br>", "option1": "कर्नल कॉलिन मैकेंज़ी\n  <br>", "option2": "सर जॉन शोर\n  <br>", "option3": "एंड्रयू फ्रेजर\n  <br>", "option4": "जॉन मार्शल\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "हम्पी के खंडहरों को 1800 में कर्नल कॉलिन मैकेंज़ी नामक एक इंजीनियर और पुरातत्ववेत्ता द्वारा प्रकाश में लाया गया था। इंग् 00", "positive_marking": "1", "solution_text": "इंटरक्रॉपिंग एक कृषि पद्धति है जिसमें एक ही समय में और एक ही भूमि के टुकड़े पर एक से अधिक फसलें लगाना या उगाना शामिल है। इसका मतलब है एक ही समय में एक ही स्थान पर एक से अधिक प्रकार की फसल उगाना।\n  <br>इस कृषि पद्धति के पीछे तर्क यह है कि लगाई गई अलग-अलग फसलों में कीड़े और रोग पैदा करने वाले एजेंट साझा होने की संभावना नहीं है, जबकि लक्ष्य एक फसल द्वारा स्थान का उपयोग करने से भी अधिक उपज पैदा करना है। हालाँकि, पौधों की लापरवाही से एकत्रीकरण को अंतरफसल नहीं माना जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "प्रधानमंत्री जन आरोग्य योजना (PMJAY) के निम्नलिखित में से कौन से लाभ हैं?\n  <br>1. जरूरत के समय सभी सार्वजनिक और सूचीबद्ध निजी अस्पतालों में मुफ्त इलाज उपलब्ध है।\n  <br>2. गुणवत्तापूर्ण स्वास्थ्य देखभाल सेवाओं तक कैशलेस और पेपरलेस पहुंच\n  <br>3. सरकार प्रति परिवार प्रति वर्ष 5,00,000 रुपये तक का स्वास्थ्य बीमा कवर प्रदान करती है।\n  <br>4. पहले से मौजूद बीमारियों को कवर नहीं किया जाता है।\n  <br>नीचे दिए गए कूट का उपयोग करके सही उत्तर चुनें।\n  <br>", "option1": "केवल 1 और 3\n  <br>", "option2": "1, 2 और 3\n  <br>", "option3": "केवल 2 और 4\n  <br>", "option4": "2, 3 और 4\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "आयुष्मान भारत PM-JAY विश्व की सबसे बड़ी स्वास्थ्य आश्वासन योजना है, जिसका लक्ष्य 10.74 करोड़ से अधिक गरीब और कमजोर परिवारों (लगभग 50 करोड़ लाभार्थियों) को माध्यमिक और तृतीयक देखभाल अस्पताल में भर्ती के लिए प्रति परिवार 5 लाख रुपये का स्वास्थ्य कवर प्रदान करना है। भारतीय आबादी का निचला 40% हिस्सा है।\n  <br>योजना के लाभ पूरे देश में पोर्टेबल हैं अर्थात; लाभार्थी कैशलेस उपचार का लाभ उठाने के लिए भारत में किसी भी सूचीबद्ध सार्वजनिक या निजी अस्पताल में जा सकता है। पहले से मौजूद सभी स्थितियाँ पहले दिन से ही कवर की जाती हैं।\n  <br>परिवार के आकार, आयु या लिंग पर कोई प्रतिबंध नहीं; पिछली सभी चिकित्सीय स्थितियाँ योजना के अंतर्गत कवर की गई हैं; इसमें अस्पताल में भर्ती होने से पहले के 3 दिन और अस्पताल में भर्ती होने के 15 दिन बाद के 15 दिन शामिल हैं, जिसमें नैदानिक देखभाल और दवाओं पर होने वाला खर्च भी शामिल है; यह योजना पोर्टेबल है और लाभार्थी अपने राज्य के बाहर और देश में कहीं भी किसी भी PM-JAY सूचीबद्ध अस्पताल में चिकित्सा उपचार का लाभ उठा सकता है।\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "राष्ट्रीय अस्पताल प्रत्यायन बोर्ड (NABH) मान्यता प्राप्त करने वाला सभी एम्स में से कौन सा संस्थान पहला बन गया है?\n  <br>", "option1": "एम्स दिल्ली\n  <br>", "option2": "एम्स नागपुर\n  <br>", "option3": "एम्स भोपाल\n  <br>", "option4": "एम्स जोधपुर\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "एम्स नागपुर सभी एम्स में से नेशनल एक्रिडेशन बोर्ड फॉर हॉस्पिटल्स (NABH) मान्यता प्राप्त करने वाला पहला एम्स बन गया है।\n  <br> NABH मान्यता स्वास्थ्य देखभाल गुणवत्ता के लिए विश्व स्तर पर मान्यता प्राप्त मानक है।\n  <br> एम्स नागपुर ने रोगी देखभाल, सुरक्षा और संगठनात्मक दक्षता सहित सभी क्षेत्रों में उत्कृष्टता के प्रति अपनी प्रतिबद्धता प्रदर्शित करके यह मान्यता हासिल की।\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "हाल ही में किस एजेंसी ने तीव्र खाद्य असुरक्षा के क्षेत्रों पर प्रकाश डालते हुए हंगर हॉटस्पॉट रिपोर्ट जारी की?\n  <br>", "option1": "खाद्य और कृषि संगठन (FAO) और विश्व खाद्य कार्यक्रम (WFP)\n  <br>", "option2": "विश्व बैंक\n  <br>", "option3": "संयुक्त राष्ट्र बाल कोष (UNICEF)\n  <br>", "option4": "अंतर्राष्ट्रीय मुद्रा कोष (IMF)\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "हाल ही में प्रकाशित हंगर हॉटस्पॉट रिपोर्ट दो एजेंसियों: खाद्य और कृषि संगठन (FAO) और विश्व खाद्य कार्यक्रम (WFP) द्वारा जारी की गई थी।\n  <br> रिपोर्ट 22 देशों में 18 क्षेत्रों की पहचान करती है जहां तीव्र खाद्य असुरक्षा की तीव्रता और गंभीरता बढ़ सकती है।\n  <br> यह बहुत अधिक चिंता वाले हॉटस्पॉट पर प्रकाश डालता है, जिसमें पाकिस्तान, मध्य अफ़्रीकी गणराज्य, इथियोपिया, केन्या, कांगो लोकतांत्रिक गणराज्य और सीरियाई अरब गणराज्य जैसे देश शामिल हैं।\n  <br> रिपोर्ट में अफगानिस्तान, नाइजीरिया, सोमालिया, दक्षिण स -series-assets/1694435101826image81.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "BMP का फुल फॉर्म क्या होता है?\n  <br>", "option1": "Byte map image file\n  <br>", "option2": "Bitmap image file\n  <br>", "option3": "Byte map process\n  <br>", "option4": "Bit map process\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> BMP या Bitmap image file एक डिवाइस-स्वतंत्र बिटमैप फ़ाइल प्रारूप है जो एक ग्राफिक्स छवि फ़ाइल प्रारूप है जिसका उपयोग डिस्प्ले डिवाइस से स्वतंत्र बिटमैप डिजिटल छवियों को संग्रहीत करने के लिए किया जाता है।\n  <br> चूंकि BMP छवियां डिवाइस-स्वतंत्र हैं, इसलिए उन्हें अपने डिस्प्ले के लिए किसी ग्राफ़िक्स एडाप्टर की आवश्यकता नहीं होती है।\n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "RAM हमेशा मदरबोर्ड पर स्थित होती है। यदि आप मैन्युअल रूप से रैम को इनस्टॉल करना चाहते हैं, तो इसके लिए आपका पहला स्टेप क्या होगा?\n  <br>", "option1": "इसे स्वयं इनस्टॉल न करें\n  <br>", "option2": "केबलों को अनप्लग करें\n  <br>", "option3": "कंप्यूटर शटडाउन करें\n  <br>", "option4": "b और c दोनों\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> रैम को मदरबोर्ड पर फिट किया जाता है।\n  <br> नई रैम स्थापित करने के लिए, सुरक्षित स्थापना के लिए निम्नलिखित चरणों का पालन करना होगा।\n  <br> कंप्यूटर को ठीक से बंद करें और आपूर्ति स्रोत से पावर प्लग हटा दें।\n  <br> निर्दिष्ट स्थान पर आवश्यक रैम डालें और कंप्यूटर को पुनरारंभ करें।\n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "जब आप एक स्प्रेडशीट में चार्ट का रंग और पृष्ठभूमि बदलते हैं तो आप निम्न में से क्या कर रहे हैं?\n  <br>", "option1": "मर्जिंग\n  <br>", "option2": "फॉर्मेटिंग\n  <br>", "option3": "पेंटिंग\n  <br>", "option4": "कैलकुलेटिंग\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> एडिटिंग का अर्थ है डेटा के मूल्य में बदलाव करना जबकि फ़ॉर्मेटिंग का अर्थ है डेटा का रूप और अनुभव बदलना।\n  <br> फ़ॉर्मेटिंग के म
