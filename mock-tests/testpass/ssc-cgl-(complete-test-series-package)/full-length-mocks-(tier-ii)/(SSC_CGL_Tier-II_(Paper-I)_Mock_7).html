<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>24.) SSC CGL Tier-II (Paper-I) Mock 7 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

propose or assume the existence of something as a basis for reasoning or argument.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Fill in the blank with the most appropriate option.</b> \n  <br>I shall try to moderate my reply, despite the ________ terms of the question. \n  <br>", "option1": "Sentiment\n  <br>", "option2": "Accidental\n  <br>", "option3": "Sententious\n  <br>", "option4": "Plagiarized\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence implies that the question was phrased in a pompous or moralizing manner, and the speaker is trying to respond in a measured or reasonable way.\n  <br> \"Sententious\" means using moralizing or pompous language, which fits the context of the sentence.\n  <br>Meanings of the options:\n  <br> (a) Sentiment - an emotion or feeling.\n  <br> (b) Accidental - happening by chance or unintentionally.\n  <br> (c) Sententious - using moralizing or pompous language.\n  <br> (d) Plagiarised - copied or stolen from someone else's work.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Parts of the given sentence have been given as options. One of them contains a grammatical error. Select the option that has the error. </b> \n  <br>You have to come in with an idea before the deadline.\n  <br>", "option1": "You have to \n  <br>", "option2": "before the deadline.\n  <br>", "option3": "come in with an idea\n  <br>", "option4": "No Error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use phrasal verb ‘come up’ instead of ‘come in’ to correct the sentence.\n  <br> \n  <b>Come up</b>- (of an issue, situation, or problem) occur or present itself, especially unexpectedly.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Select the most appropriate option that can substitute the highlighted segment in the given sentence.</b> \n  <br>He seldom watches films, \n  <b>does he?</b> \n  <br>", "option1": "Doesn’t he?\n  <br>", "option2": "Shall he?\n  <br>", "option3": "Isn’t he?\n  <br>", "option4": "No improvement\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option d.\n  <br>The given sentence is grammatically and contextually correct.\n  <br> Question tags are the small questions that often come at the ends of sentences in speech.\n  <br> If the main clause is positive, the question tag is usually negative, and if the main clause is negative, the question tag is positive. Some words are negative in meaning. \n  <br> For example - hardly, seldom, scarcely, rarely, barely, etc. Hence, they will take positive question tags after them.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Select the most appropriate option that can substitute the highlighted segment in the given sentence.</b> \n  <br>The council endeavoured \n  <b>to set up on</b> a system of appeals in the case of bishops, in which the see of Rome was made to play a great part.\n  <br>", "option1": "to set off\n  <br>", "option2": "to set forward\n  <br>", "option3": "to set over\n  <br>", "option4": "to set up\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Substitute ‘to set up on’ with ‘to set up’ to correct the sentence.\n  <br> \n  <b>Set up</b>- establish a business, institution, or other organization.\n  <br> Use of ‘on’ is redundant in the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the correct active or passive form of the given sentence.</b> \n  <br>Surya drove the truck to the depot.\n  <br>", "option1": "The truck was drove by Surya to the depot.\n  <br>", "option2": "The truck was driving by Surya to the depot.\n  <br>", "option3": "The truck is being driven by Surya to the depot.\n  <br>", "option4": "The truck was driven by Surya to the depot.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice: </b> In Active voice the subject is the one doing the action.\n  <br> \n  <b>Passive Voice:</b> In Passive voice the subject is the recipient of the action.\n  <br> To convert active voice into passive voice the object becomes the subject and the subject becomes the object. Subject + verb + object Object+3rd form of verb + by +Subject.\n  <br>  In Simple Past Tense as presented in the question the structure for changing tense into active to passive is\n  <br> Subject + V2+ object Object+ was/were V3+ by + subject.\n  <br> For Example- Active- I did yoga.\n  <br> Passive- Yoga was done by me.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Tुध ीियियथing ौधnपधncध ुोौ ृधधn ौूिiप inपय ीयहन ौधgंधnपौ ोnक giॅधn ोौ यूपiयnौ. Iकधnपiीद पुध ौधgंधnप पुोप cयnपोinौ ो gनोंंोपicोि धननयन. Tुधn cोंध पुध थयना in cियिधgध, यनiginोि पुधंध थनiपध थiपु nधथ iकधोिस यी cयंूयौiपiयn यन ोप िधोौप nधथ ंधपुयकौ यी ौहggधौपing पुयौध iकधोिस.", "option1": "Then came the work in college,\n  <br>", "option2": "ideals of composition or at least\n  <br>", "option3": "new methods of suggesting those ideals.\n  <br>", "option4": "original theme write with new\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in part (d) of the sentence. \n  <br> The verb \"write\" should be changed to its past participle form, \"written,\" to maintain grammatical agreement with the subject \"original theme.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "<b>Select the option that will improve the highlighted part of the given sentence.</b> \n  <br>Sandeep and Gaurav are both great singers, \n  <b>but Sandeep is the best.</b> \n  <br>", "option1": "but Sandeep is one of the best\n  <br>", "option2": "but Sandeep is better \n  <br>", "option3": "and yet both of are equally good at it\n  <br>", "option4": "but Sandeep is good \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘but Sandeep is better’ instead of ‘but Sandeep is the best’ to improve the sentence.\n  <br> When there is a comparison between any two things or people comparative degree of comparison has to be used.\n  <br> Comparative degree of ‘good’ is ‘better’, superlative degree of ‘good’ is ‘best’.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "<b>Select the option that expresses the given sentence in active voice. </b> \n  <br>By whom was the decision to cancel the meeting made?\n  <br>", "option1": "Who made the decision to cancel the meeting?\n  <br>", "option2": "The decision to cancel the meeting was made by whom?\n  <br>", "option3": "The decision was made to cancel the meeting by whom?\n  <br>", "option4": "Whose decision was it to cancel the meeting?\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the sentence \"By whom was the decision to cancel the meeting made?\", the subject is \"the decision,\" and it is being acted upon by the object, \"by whom.\" \n  <br> This sentence is in passive voice.\n  <br> To convert this sentence into active voice, we need to change the sentence so that the subject performs the action. \n  <br>The active voice version of the sentence is \"Who made the decision to cancel the meeting?\". In this sentence, the subject is \"who,\" and it performs the action of canceling the meeting.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "<b>Select the option that expresses the given sentence in passive voice. </b> \n  <br>\"The artist is painting the mural.\"\n  <br>", "option1": "The murals are being painted by the artist.\n  <br>", "option2": "The mural was being painted by the artist.\n  <br>", "option3": "The mural is painted by the artist.\n  <br>", "option4": "The mural is being painted by the artist.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "To convert t  tense (\"I am going\"), we need to change it to the past continuous tense in the indirect speech.\n  <br> The correct conversion to the past continuous tense is \"he was going,\" which is found in option (a). The other options don't follow the correct tense conversion.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.</b> \n  <br>From the options P, Q, R, and S select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) The sun was setting, and the colors painted the sky in a breathtaking display.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) The view had an almost magical quality to it.\n  <br> (P) The sunrise painted the sky in hues of pleasant colors casting a warm glow over the awakening world.\n  <br>(Q) The clouds parted, revealing a brilliant tapestry of pink, orange, and purple hues.\n  <br>(R) It was a cold evening, and the air carried a crispness that hinted at the coming winter.\n  <br>(S) The vibrant night life of the city beckoned with lively crowds offer endless opportunities for excitement and adventure.\n  <br>", "option1": "P, Q\n  <br>", "option2": "Q, R\n  <br>", "option3": "P, S\n  <br>", "option4": "R, P\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Since (S2) should describe the scene in the sky to connect with the breathtaking display mentioned in (S1). \n  <br> Option (Q) fits best, as it talks about the colors of the sky. \n  <br> (S3) should provide more context about the atmosphere or the overall experience of the scene. \n  <br> Option (R) is the most suitable, describing the cold evening and crisp air. \n  <br> So, the correct order of paragraph becomes (S1) Q R (S4).\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Fयन पुध ीयहन-ौधnपधncध (S1 पय S4) ूोनोgनोूु ृिधयथ, ौधnपधncधौ S1 ोnक S4 ोनध giॅधn. Fनयं पुध यूपiयnौ P, Q, R, ोnक S ौिधधcप पुध ोूूनयूनiोपध ौधnपधncधौ ीयन S2 ोnक S .\n  <br>(S) Ants play vital roles in ecosystems. They aerate soil, disperse seeds, and help control populations of other insects.\n  <br>", "option1": "P, Q\n  <br>", "option2": "Q, R\n  <br>", "option3": "R, S\n  <br>", "option4": "S, P\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Since (S2) should describe the ants' behavior to connect with the scientist's observation mentioned in (S1). \n  <br> Option (Q) fits best, as it talks about the roles of individual ants. \n  <br> (S3) should provide more information about the research process or the scientist's actions. \n  <br> Option (R) is the most suitable, describing the scientist's documentation of the ants’ activities. \n  <br> While (P) and (R) only state facts about ants not their behavioral study as per the paragraph.\n  <br> So, the correct order becomes (S1) Q R (S4).\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Choose the correct indirect speech conversion of the following direct speech.</b> \n  <br>Cathy said, \"I have been living in London for five years.\"\n  <br>", "option1": "Cathy said that she had been living in London for five years.\n  <br>", "option2": "Cathy said that she might have been living in London for five years.\n  <br>", "option3": "Cathy said that she was living in London for five years.\n  <br>", "option4": "Cathy said that she would be living in London for five years.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "To convert this direct speech into indirect speech, we need to follow the appropriate rules. \n  <br> Since the direct speech is in the present perfect continuous tense (\"I have been living\"), we need to change it to the past perfect continuous tense in the indirect speech.\n  <br> The correct conversion to the past perfect continuous tense is \"she had been living,\" which is found in option (a).\n  <br> The other options don't follow the correct tense conversion.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "<b>What was the primary reason Sarah wished for her garden to grow twice as fast?</b> \n  <br>", "option1": "To become wealthy from selling vegetables\n  <br>", "option2": "To make her garden more beautiful\n  <br>", "option3": "To provide more food for her neighbors\n  <br>", "option4": "To impress the other villagers\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) To provide more food for her neighbors, as the passage states, \"For her first wish, she asked the fairy to make her garden grow twice as fast so she could share even more food with her neighbors.\"\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Which of the following best describes Sarah's motivation for her second wish?</b> \n  <br>", "option1": "Her desire to become famous\n  <br>", "option2": "Her experience witnessing illness in her village\n  <br>", "option3": "Her eagerness to show off her healing powers\n  <br>", "option4": "Her wish to gain control over the village\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Her experience witnessing illness in her village, as the passage states, \"For her second wish, she asked for the ability to heal the sick, as she had seen many people in the village suffer from illness.\"\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>How did Sarah's final wish differ from her first two wishes?</b> \n  <br>", "option1": "It was less selfless and more focused on her own desires\n  <br>", "option2": "It was focused on helping others instead of herself\n  <br>", "option3": "It was more focused on material wealth\n  <br>", "option4": "It was unrelated to the village\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) It was less selfless and more focused on her own desires, as the passage states, \"Finally, Sarah wished for something purely for herself. She wished for the ability to fly, so she could explore the world and see all its beauty.\"\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>Considering the entire passage, which of the following best describes Sarah's character?</b> \n  <br>", "option1": "Ambitious and cunning\n  <br>", "option2": "Kind-hearted and generous\n  <br>", "option3": "Adventurous and reckless\n  <br>", "option4": "Prideful and envious\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Kind-hearted and generous, as the passage consistently describes Sarah as a person who is eager to help others, shares her harvest with her neighbors, and uses her wishes to benefit both her community and herself in a balanced way. The passage states, \"Sarah was beloved by everyone in the village, for she always had a smile on her face and was eager to help anyone in need,\" which further supports the idea that she is kind-hearted and generous.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "<b>Select the most appropriate option for blank no. 1.</b> \n  <br>", "option1": "hoarded\n  <br>", "option2": "tucked\n  <br>", "option3": "expended\n  <br>", "option4": "submerged\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) tucked, as it means hidden or placed out of the way. \n  <br>The other options are:\n  <br> (a) hoarded: accumulated and hidden away, often secretly.\n  <br> (c) expended: used up or consumed.\n  <br> (d) submerged: covered or hidden under water.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>Select the most appropriate option for blank no. 2.</b> \n  <br>", "option1": "winding\n  <br>", "option2": "arid\n  <br>", "option3": "parallel\n  <br>", "option4": "cluttered\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) winding, as it means following a twisting or curving course. \n  <br>The other options are:\n  <br> (b) arid: lacking in interest or excitement; dry.\n  <br> (c) parallel: extending in the same direction and always the same distance apart.\n  <br> (d) cluttered: filled with a messy or disorganized collection of things.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>Select the most appropriate option for blank no. 3.</b> \n  <br>", "option1": "suffused\n  <br>", "option2": "bereft\n  <br>", "option3": "repelled\n  <br>", "option4": "fumigated\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) suffused, as it means gradually spread through or over. The other options are:\n  <br> (b) bereft: deprived of or lacking something.\n  <br> (c) repelled: driven or forced back or away.\n  <br> (d) fumigated: exposed to fumes, typically in order to disinfect or eradicate pests.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>Select the most appropriate option for blank no. 4.</b> \n  <br>", "option1": "whimsical\n  <br>", "option2": "negligible\n  <br>", "option3": "austere\n  <br>", "option4": "cumbersome\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) whimsical, as it means playfully quaint or fanciful. The other options are:\n  <br> (b) negligible: so small or unimportant as to be not worth considering.\n  <br> (c) austere: severe or strict in manner, attitude, or appearance.\n  <br> (d) cumbersome: large or heavy and therefore difficult to carry or use.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>Why is M0 considered significant in a country's financial system?</b> \n  <br>", "option1": "It includes near-money assets such as savings accounts.\n  <br>", "option2": "It encompasses demand deposits held by the public at commercial banks.\n  <br>", "option3": "It represents the foundation of a country's money supply and is directly controlled by the central bank.\n  <br>", "option4": "It provides a more comprehensive understanding of the economy's liquidity.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) It represents the foundation of a country's money supply and is directly controlled by the central bank. M0 is significant because it forms the basis of the money supply and can be directly influenced by the central bank's actions.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>Which of the following components is NOT included in the M2 monetary aggregate?</b> \n  <br>", "option1": "Physical currency, such as coins and banknotes\n  <br>", "option2": "Commercial banks' deposits held with the central bank\n  <br>", "option3": "Demand deposits held by the public at commercial banks\n  <br>", "option4": "Long-term, interest-bearing instruments\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) Long-term, interest-bearing instruments. M2 includes near-money assets such as savings accounts, money market accounts, and other short-term, interest-bearing instruments, but not long-term ones.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>How do central banks use the relationship between M0, M1, and M2 in managing the economy?</b> \n  <br>", "option1": "By focusing solely on M0 as it is the most comprehensive measure of money supply\n  <br>", "option2": "By monitoring the fluctuations in these aggregates to better manage the money supply and maintain a stable economy\n  <br>", "option3": "By ignoring the relationship between these aggregates and relying only on fiscal policy\n  <br>", "option4": "By prioritizing M2 as it is the least liquid and therefore least relevant for economic stability\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) By monitoring the fluctuations in these aggregates to better manage the money supply and maintain a stable economy. Central banks use the relationship between M0, M1, and M2 to make informed decisions about interest rates, inflation, and economic growth. Understanding these monetary aggregates and their fluctuations enables central banks to maintain a stable and healthy economy by adjusting monetary policy as needed.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>According to the passage, what are the three economic challenges that the Indian government is grappling with?</b> \n  <br>", "option1": "Inflation, bilateral trade agreements, and secure employment\n  <br>", "option2": "Interest rates, multilateral trade agreements, and income inequality\n  <br>", "option3": "Inflation, interest rates, exchange rates, trade agreements, and secure employment\n  <br>", "option4": "Exchange rates, industrial growth, and human development\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Inflation, interest rates, exchange rates, trade agreements, and secure employment. These are the three economic challenges mentioned in the passage that the Indian government is facing.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>Which of the following statements best describes the economists' views on solving the \"poly-crisis\" in India?</b> \n  <br>", "option1": "Economists have a systemic solution and agree on the prioritization of economic challenges.\n  <br>", "option2": "There is a consensus among economists on how to address the separate parts of the crisis.\n  <br>", "option3": "Economists are divided on various aspects of solving the crisis, including central bank independence and inflation.\n  <br>", "option4": "Economists unanimously support prioritizing employment over inflation.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Economists are divided on various aspects of solving the crisis, including central bank independence and inflation. The passage states that there is no consensus among economists on how to address the separate parts of the crisis.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>What is one key factor that has contributed to China's remarkable economic growth and Vietnam's recent spurt, as suggested in the passage?</b> \n  <br>", "option1": "Adoption of free trade policies\n  <br>", "option2": "High levels of human development, including universal education and good public health systems\n  <br>", "option3": "A focus on industrial technology development\n  <br>", "option4": "Rapid growth in per capita income\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) High levels of human development, including universal education and good public health systems. The passage suggests that these factors contributed to China's and Vietnam's economic growth when they opened up to foreign investors.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "<b>According to the passage, what was the disagreement between trade-and-growth economists like Jagdish Bhagwati and economists like Amartya Sen who advocated the human development theory of growth?</b> \n  <br>", "option1": "Jोgकiौु Bुोgथोपi ृिधiधॅधक in ूनiयनiपप्रing नधकiौपनiृहपiयn यी थधोिपु, थुiिध Aंोनपदो Sधn ीयcहौधक यn incनधोौing पुध ौप्रध यी पुध धcयnयंic ूiध.", "option2": "Jagdish Bhagwati argued that basic human development must precede growth, while Amartya Sen believed that increasing the size of the economic pie must come first.\n  <br>", "option3": "Jagdish Bhagwati believed that the size of the economic pie must be increased before it can be redistributed, while Amartya Sen argued that basic human development must precede growth.\n  <br>", "option4": "Amartya Sen focused on the importance of trade agreements, while Jagdish Bhagwati emphasized the role of human development in economic growth.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) Jagdish Bhagwati believed that the size of the economic pie must be increased before it can be redistributed, while Amartya Sen argued that basic human development must precede growth. The passage highlights this disagreement between the two economists.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "Where does the river Brahmaputra originate?\n  <br>", "option1": "Chemayungdung glacier of the Kailash range\n  <br>", "option2": "Glaciers of Mapchachungo\n  <br>", "option3": "Garhwal Hills near Gairsain\n  <br>", "option4": "Milam glacier in the Nepal Himalayas\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Brahmaputra River originates from the Chemayungdung glacier of the Kailash range. It flows through China, India, and Bangladesh before emptying into the Bay of Bengal.\n  <br> The Brahmaputra also known as the Yarlung Tsangpo in Tibet, the Siang/Dihang River in Arunachal Pradesh, and Jamuna in Bangladesh.\n  <br> The Brahmaputra River is volume-wise largest river in India.\n  <br> Major tributaries of the Brahmaputra River are the Lohit, the Dibang, the Subansiri, the Jiabharali, the Dhansiri, the Manas, the Torsa, the Sankosh, and the Teesta.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "Who among the following wrote ‘The Light of Asia: The Poem that Defined the Buddha’ that will narrate the phenomenal poem ‘The Light of Asia’?\n  <br>", "option1": "Jairam Ramesh\n  <br>", "option2": "Salman Rushdie\n  <br>", "option3": "Chetan Bhagat\n  <br>", "option4": "Shashi Tharoor\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Jairam Ramesh is a former Indian minister who wrote the book ‘The Light of Asia: The Poem that Defined the Buddha’ in 2021. \n  <br>The book is a commentary on the poem ‘The Light of Asia’ by Sir Edwin Arnold, which was first published in 1879. Ramesh’s book provides a modern interpretation of Arnold’s poem and explores the relevance of the Buddha’s teachings to the contemporary world.\n  <br>Jairam Ramesh is an Indian politician belonging to Indian National Congress. He is a Member of Parliament representing Karnataka state in the Rajya Sabha.\n  <br> \n  <b>Note -</b> Ramesh was declared winner of the 2020 Kamaladevi Chattopadhyay NIF Book Prize for his book \"A Chequered Brilliance: The Many Lives of VK Krishna Menon\".\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "Which of the following popular kitchen ingredients is called the 'sugar-eating fungus'?\n  <br>", "option1": "Baking powder\n  <br>", "option2": "Yeast\n  <br>", "option3": "Vinegar\n  <br>", "option4": "Ketchup\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) yeast. Yeast is a single-celled fungus that is used in baking to leaven bread and other baked goods. It is also used in brewing beer and wine. \n  <br>Yeast is a sugar-eating fungus, and it converts sugar into carbon dioxide and alcohol. The carbon dioxide bubbles cause baked goods to rise, and the alcohol evaporates during baking.\n  <br> The scientific name of yeast is Saccharomyces cerevisiae.\n  <br>Baking powder is a leavening agent that contains baking soda and an acid, such as a cream of tartar. \n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "Who among the following was the first General Secretary of All India Kisan Congress?\n  <br>", "option1": "NG Ranga\n  <br>", "option2": "Acharya Narendra Dev\n  <br>", "option3": "Sardar Vallabhbhai Patel\n  <br>", "option4": "Swami Sahajanand Saraswati\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "NG Ranga was the first General Secretary of All India Kisan Congress.\n  <br> N. G. Ranga, was an Indian freedom fighter, classical liberal, parliamentarian, and farmer leader.\n  <br> He was the founding president of the Swatantra Party.\n  <br> \n  <b>Acharya Narendra Dev</b> was a socialist leader and a member of the Indian National Congress. He was also a founder of the Praja Socialist Party, a socialist political party.\n  <br> \n  <b>Sardar Vallabhbhai Patel</b> was a nationalist leader and a member of the Indian National Congress. He was also the Home Minister of India and the first Deputy Prime Minister of India.\n  <br> \n  <b>Swami Sahajanand Saraswati</b> was a Hindu monk and a social reformer. He was also the founder of the Bihar Provincial Kisan Sabha, a peasant organization that fought for the rights of farmers.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "<b>Which of the following statements is/are correct regarding the Indian National Congress?</b> \n  <br>A. The Indian National Congress was founded in 1885.\n  <br>B. The first session of the Indian National Congress was held in Bombay.\n  <br>C. A.O. Hume played a pivotal role in the formation of the Indian National Congress.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B, and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Indian National Congress was founded in 1885. This is true. The Indian National Congress was founded on December 28, 1885, in Bombay (now Mumbai).\n  <br>The first session of the Indian National Congress was held in Bombay. This is also true. The first session of the Indian National Congress was held from December 28 to 31, 1885, in Bombay.\n  <br>A.O. Hume played a pivotal role in the formation of the Indian National Congress. This is also true. \n  <br>A.O. Hume was a retired British civil servant who was concerned about the growing unrest in India. He also served as the first General Secretary of the Indian National Congress.\n  <br>Therefore, all three statements are correct.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "<b> Which of the following statements is/are correct regarding the Himalayan Mountain Range?</b> \n  <br>A. The Himalayas are the highest mountain range in the world.\n  <br>B. The Himalayas stretch across five countries: India, Nepal, Bhutan, China, and Pakistan.\n  <br>C. Mount Everest, the highest peak in the world, is located in the Himalayas.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c). The Himalayas are the highest mountain range in the world, stretching across five countries: India, Nepal, Bhutan, China, and Pakistan. Mount Everest, the highest peak in the world, is located in the Himalayas. Therefore, all three statements are correct.\n  <br>Statement A is correct because the Himalayas are the highest mountain range in the world, with Mount Everest being the highest peak at 29,032 feet (8,848 meters) above sea level.\n  <br>Statement B is correct because the Himalayas stretch across five countries: India, Nepal, Bhutan, China, and Pakistan.\n  <br>Statement C is correct because Mount Everest is located in the Himalayas.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Which of the following Articles of the Indian Constitution guarantees equality of opportunity to all citizens of India in matters relating to public employment\n  <br>", "option1": "Article 15\n  <br>", "option2": "Article 16 (1) and 16 (2)\n  <br>", "option3": "Article 16(3) \n  <br>", "option4": "Article 16 (3), (4), and (5)\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b). Article 16(1) and 16(2) of the Indian Constitution guarantees equality of opportunity to all citizens of India in matters relating to public employment.\n  <br>Article 16(1) states that there shall be equality of opportunity for all citizens in matters relating to employment or appointment to any office under the State. This means that no citizen can be discriminated against in public employment on the basis of religion, race, caste, sex, descent, place of birth, residence, or any of them.\n  <br>Article 16(2) states that no citizen shall, on grounds only of religion, race, caste, sex, descent, place of birth, residence or any of them, be ineligible for, or discriminated against in respect of, any employment or office under the State. This means that the State cannot discriminate against any citizen in public employment, even if they are not qualified for the job.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Who prepared the draft of the Indian Penal Code\n  <br>", "option1": "Lord Canning\n  <br>", "option2": "Lord Macaulay\n  <br>", "option3": "Lord Chelmsford\n  <br>", "option4": "None of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The first draft of the Indian Penal Code was prepared by the First Law Commission, chaired by Thomas Babington Macaulay also known as Lord Macaulay.\n  <br>He was a British historian, jurist, and politician who served as the first Law Member of the Governor-General's Council in India from 1834 to 1838. He is best known for his work on the Indian Penal Code, which is still in use today.\n  <br>  \n  <b>Lord Channing -</b> was a British statesman and Governor-General of India during the Indian Rebellion of 1857 and the first Viceroy of India after the transfer of power from the East India Company to the Crown of Queen Victoria in 1858 after the rebellion was crushed.\n  <br>  \n  <b>Lord Chelmsford - </b>served as Viceroy of India from 1916 to 1921, where he was responsible for the creation of the Montagu–Chelmsford Reforms. \n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "In which of the given cases the six rights guaranteed by Article 19 can be suspended \n  <br>1. External Aggression. \n  <br>2. Internal Emergency. \n  <br>3. When Martial Law is in force. \n  <br>", "option1": "2 & 3 only \n  <br>", "option2": "1 only \n  <br>", "option3": "1 & 3 only \n  <br>", "option4": "1, 2 & 3\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Fundamental rights can be suspended during a national emergency (External Aggression) But, the rights guaranteed under Articles 20 and 21 cannot be suspended. \n  <br>Also, the six rights guaranteed by Article 19 can be suspended only when an emergency is declared on the grounds of war or external aggression (i.e., external emergency) and not on the ground of armed rebellion (i.e., internal emergency). \n  <br>The application of fundamental rights can also be restricted in an area that has been placed under martial law or military rule. Thus, Option (1) & (3) is correct. Hence, Option (c) is correct.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "Who among the following translated Panchatantra into the Persian language?\n  <br>", "option1": "Faizi\n  <br>", "option2": "Abraham Sirhind\n  <br>", "option3": "Maulana Shah Mohammad Shahabadi\n  <br>", "option4": "Abul Fazal\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Faizi was a Persian poet and scholar who served as a courtier under the Mughal emperor Akbar. He is credited with translating the Panchatantra into Persian, under the title Anwar-i-Suhaili. \n  <br>The translation was commissioned by Akbar, who wanted to make the Panchatantra more accessible to his Persian-speaking subjects. Faizi's translation was a major success, and it helped to popularize the Panchatantra throughout the Persian-speaking world.\n  <br>Abraham Sirhind and Maulana Shah Mohammad Shahabadi were also involved in the translation of the Panchatantra into Persian, but their contributions were not as significant as Faizi's. Abul Fazal was a historian and courtier who served under Akbar.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Which of the following foreign travelers came to India during the reign of Shah Jahan?\n  <br>1. Francis Vernier\n  <br>2. Peter mundi\n  <br>3. Nikolaon Manucci\n  <br>Code:\n  <br>", "option1": "1 only\n  <br>", "option2": "2 and 3 only\n  <br>", "option3": "1 and 2 only\n  <br>", "option4": "1, 2 and 3\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Francis Vernier:</b> Francis Vernier was a French traveler who came to India during the reign of Shah Jahan. He served as a military adventurer and later became a general in the service of the Mughal emperor.\n  <br> \n  <b>Peter Mundi:</b> Peter Mundi, also known as Pietro Della Valle, was an Italian traveler who visited India during the reign of Shah Jahan. He traveled extensively in the Middle East and Asia, including India, and recorded his observations and experiences in his travel writings.\n  <br> \n  <b>Niccolao Manucci:</b> Niccolao Manucci, an Italian adventurer and traveler, arrived in India during the reign of Shah Jahan. He spent several decades in India, serving in various capacities and witnessing the events of the Mughal court. Manucci's memoirs provide valuable insights into the political and cultural life of the Mughal Empire.\n  <br>Therefore, all three foreign travelers—Francis Vernier, Peter Mundi, and Nikolaon Manucci—came to India during the reign of Shah Jahan. Hence, the correct answer is (d) 1, 2 and 3.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Match Column-A with Column-B\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647072image56.png\"> \n  <br>", "option1": "i-b, ii-a, iii-c, iv-d\n  <br>", "option2": "i-c, ii-a, iii-b, iv-d\n  <br>", "option3": "i-a, ii-b, iii-c, iv-d\n  <br>", "option4": "i-b, ii-a, iii-d, iv-c\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The cell cycle is a four-stage process that all cells go through as they grow and divide. The four stages are G1, S, G2, and M.\n  <br> The \n  <b>first gap stage (G1)</b> is the first step in the interphase, hence the number 1 in the name. This phase is all about growing bigger. The cell synthesizes new enzymes and molecules, physically increases in size, and stores nutrients for use during the later stages.\n  <br> The \n  <b>S phase</b> of a cell cycle occurs during interphase, before mitosis or meiosis, and is responsible for the synthesis or replication of DNA. \n  <br> The last part of interphase is called \n  <b>the G2 phase</b>. The cell has grown, DNA has been replicated, and now the cell is almost ready to divide. This last stage is all about prepping the cell for mitosis or meiosis. \n  <br> Cell division occurs during the \n  <b>M phase</b>, which consists of nuclear division (mitosis) followed by cytoplasmic division (cytokinesis). This is the final stage of the cell cycle.\n  <br>Thus, the Correct match is – \n  <br>G1 – First gap phase, the cell grows physically larger.\n  <br>S – Cell synthesizes a complete copy of DNA.\n  <br>G2 – The cell begins to reorganize its contents in preparation for mitosis.\n  <br>M – Cell divides its copied DNA and cytoplasm to make two new cells.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "If Q = net charge, t = time, then which of the following equations is correct?\n  <br>", "option1": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647075image57.png\"> \n  <br>", "option2": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647077image58.png\"> \n  <br>", "option3": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647081image59.png\"> \n  <br>", "option4": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647086image60.png\"> \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "An electric current is a flow of charged particles. It is measured in amperes (A), and is defined as the charge per unit time. In other words, the current is the amount of charge that flows through a conductor in a given amount of time. The equation for current is I=Q/t, where I is the current, Q is the charge, and t is the time.\n  <br>In this case, we are given that Q is the net charge and t is the time. Therefore, the correct equation is I=Q/t.\n  <br>Here, Q = quantity of charge (electricity) in coulombs (C) I = current in amperes (amps, A) t = time (seconds).\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "In which Five-Year Plan, was the Mahalanobis Model started?\n  <br>", "option1": "Second\n  <br>", "option2": "Fourth\n  <br>", "option3": "Third\n  <br>", "option4": "First\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Mahalanobis Model was an economic development model developed by the Indian statistician Prasanta Chandra Mahalanobis in 1953. It was based on the idea that India should focus on developing its heavy industries in order to achieve rapid economic growth. The model was adopted by the Indian government in the Second Five-Year Plan (1956-1961) and had a significant impact on the Indian economy.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615646420image111.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "The Basketball center line is part of the:\n  <br>", "option1": "front court\n  <br>", "option2": "back court\n  <br>", "option3": "restricted area\n  <br>", "option4": "middle court\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The basketball center line is part of the back court. The back court is the area of the basketball court that is located between the center line and the baseline.\n  <br> The front court is the area of the basketball court that is located between the center line and the free throw line. \n  <br> The restricted area is the area of the basketball court that is located between the free throw line and the baseline. \n  <br> The middle court is not a real term in basketball.\n  <br> \n  <b>Basketball -</b> a team sport in which two teams, most commonly of five players each, opposing one another on a rectangular court.\n  <br> \n  <b>Size of Basket Ball -</b> approximately 9.4 inches (24 cm) in diameter.\n  <br> \n  <b>Hoop -</b> a basket of 18 inches (46 cm) in diameter mounted 10 feet (3.048 m) high to a backboard at each end of the court.\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "From the point of view of commerce, the busiest ocean in the world is ______.\n  <br>", "option1": "Pacific Ocean\n  <br>", "option2": "Indian Ocean\n  <br>", "option3": "Arctic Ocean\n  <br>", "option4": "Atlantic Ocean\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Atlantic Ocean is the busiest ocean in terms of commerce as it has many ports on its coastline actively involved in trade and business.\n  <br> The Atlantic Ocean lies between North and South America on the west and Europe and Africa on the east. Up north, the Atlantic connects to the Arctic Ocean and to the Southern Ocean to the south. Scientists often divide the Atlantic into two basins: the North Atlantic and the South Atlantic.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "On which river, the first-night navigation mobile application in rivers in India was launched for ferries?\n  <br>", "option1": "Brahmaputra\n  <br>", "option2": "Ganga\n  <br>", "option3": "Kaveri\n  <br>", "option4": "Son\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The first night navigation mobile application in rivers in the country was launched for ferries plying on Brahmaputra River in Guwahati, Assam in Feb 2022. It was developed by the State Transport Department in association with K Raju, the principal scientist of IIT Madras. \n  <br> The Brahmaputra is a trans-boundary river that flows through Tibet, Northeastern India, and Bangladesh. It is also known as the Yarlung Tsangpo in Tibetan, the Siang/Dihang River in Arunachali, Luit and Brahmaputra in Assamese, Brahmaputro in Bengali in India and Jamuna River in Bangla in Bangladesh.\n  <br> The principal tributaries of the river joining from right are the Lohit, the Dibang, the Subansiri, the Jiabharali, the Dhansiri, the Manas, the Torsa, the Sankosh, and the Teesta whereas the Burhidihing, the Desang, the Dikhow, the Dhansiri, and the Kopili joins it from left.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Which of the following options is correct regarding sexually transmitted disease (STD)?\n  <br>Statement A: Sexually transmitted diseases (STDs) are infections transmitted from an infected person to an uninfected person through sexual contact.\n  <br>Statement B: HIV, HPV, and Hepatitis B virus is responsible for STDs.\n  <br>", "option1": "Both Statements A and B incorrect\n  <br>", "option2": "Only Statement B is correct\n  <br>", "option3": "Both Statements A and B correct\n  <br>", "option4": "Only Statement A is correct\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sexually transmitted diseases (STDs) are infections transmitted from an infected person to an uninfected person through sexual contact. Thus, statement A is correct.\n  <br>HIV (Human Immunodeficiency Virus), HPV (Human Papillomavirus), and Hepatitis B virus are indeed responsible for sexually transmitted diseases. HIV causes AIDS, HPV is associated with genital warts and cervical cancer, and the Hepatitis B virus can lead to liver disease and liver cancer. Thus, statement B is also correct.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "Match List I with List II:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647091image61.png\"> \n  <br>Select the correct answer from the code given below:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615647092image62.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1692615646420image112.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Who won the men's doubles title at the Badminton Asia Championship 2023 held in Dubai, UAE?\n  <br>", "option1": "Teo Ee Yi and Ong Yew Sin \n  <br>", "option2": "Chirag Shetty and Satwiksairaj Rankireddy \n  <br>", "option3": "Dinesh Khanna \n  <br>", "option4": "None of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Chirag Shetty and Satwiksairaj Rankireddy, the Indian pair, won the men's doubles title at the Badminton Asia Championship 2023 held in Dubai, UAE. \n  <br> They defeated eighth-seeded Malaysian pair Teo Ee Yi and Ong Yew Sin in the final.\n  <br> With this win, they became the first Indian men's doubles pair to win the Badminton Asia Championships title. \n  <br> Dinesh Khanna won India's first-ever Badminton Asia Championships title in 1965, but he won the men's singles title, not the men's doubles title.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "What is India's ranking in the 2023 World Press Freedom Index, as per the latest report released by global media watchdog Reporters Without Borders?\n  <br>", "option1": "150 \n  <br>", "option2": "161 \n  <br>", "option3": "180 \n  <br>", "option4": "190\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "India's ranking in the 2023 World Press Freedom Index, as per the latest report released by Reporters Without Borders, is 161 out of 180 countries. \n  <br> This is a drop from India's 2022 ranking of 150. \n  <br> Norway topped the index for the seventh consecutive year, followed by Ireland, Denmark, Sweden, and Finland. \n  <br> The last three countries in the index are North Korea (180th), China, and Vietnam.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Who has been confirmed as the new president of the World Bank by the 25-member executive board of the World Bank?\n  <br>", "option1": "Ajay Banga \n  <br>", "option2": "Jim Yong Kim \n  <br>", "option3": "Paul Wolfowitz \n  <br>", "option4": "Robert Zoellick\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Ajay Banga has been confirmed as the new president of the World Bank by the 25-member executive board of the World Bank. \n  <br> Presently, he is serving as the vice chairman at US investment firm General Atlantic LP.\n  <br> Before that, he worked as president and CEO of Mastercard. \n  <br> In 2016, he was awarded the fourth-highest civilian award, Padma Shri. \n  <br> Previous presidents of the World Bank include Jim Yong Kim, Paul Wolfowitz, and Robert Zoellick.\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Which Indian weightlifter recently won the silver medal in the women's 55kg category at the Asian Weightlifting Championships 2023?\n  <br>", "option1": "Mirabai Chanu \n  <br>", "option2": "Saikhom Kriti \n  <br>", "option3": "Bindyarani Devi \n  <br>", "option4": "Rakhi Halder\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Bindyarani Devi won the silver medal in the women's 55kg category at the Asian Weightlifting Championships 2023, held in South Korea. \n  <br> She lifted a total weight of 194kg (snatch 83kg and 111kg in clean & jerk) in the non-Olympic 55kg category. Chen Guan Ling (China) won the gold medal with a combined lift of 204kg (snatch 90kg + clean & jerk 114kg) and Vo Thi Quynh Nhu (Vietnam) won the bronze with a lift of 192kg.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "Where is the Sittwe Port, whose inaugural shipment was recently done from Kolkata Port?\n  <br>", "option1": "Myanmar \n  <br>", "option2": "India \n  <br>", "option3": "Bangladesh \n  <br>", "option4": "Nepal\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The inaugural shipment from Kolkata, the MV-ITT LION (V-273), carrying 20,000 bags of cement is expected to reach the Sittwe Port in Myanmar on 9 May. \n  <br> India has operationalized the Sittwe Port in Myanmar under the Kaladan Multimodal Transit Transport project.\n  <br> The port was built under a grant of assistance from the Indian government and aims to boost trade and commerce between India and Myanmar. \n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "In which state was the Centre for Innovation Incubation Research and Entrepreneurship inaugurated?\n  <br>", "option1": "Karnataka\n  <br>", "option2": "Andhra Pradesh \n  <br>", "option3": "Telangana\n  <br>", "option4": "Maharashtra\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Centre for Innovation Incubation Research and Entrepreneurship was inaugurated at the KITS Warangal campus in the state of Telangana in India. \n  <br> The Telangana IT Minister K Taraka Ramarao inaugurated the center. \n  <br> The aim of this center is to promote innovation and entrepreneurship in the student community and inculcate research and innovative skills among the students, faculty, and young researchers.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "Which among the following is one of the fundamentals of OOP (object-oriented programming)?\n  <br>", "option1": "Encapsulation\n  <br>", "option2": "Multiplexing\n  <br>", "option3": "Switching\n  <br>", "option4": "Polymorphism\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The technique of merging the elements to create a new entity for the purpose of hiding or protecting information is known as encapsulation in programming.\n  <br> Encapsulation is a characteristic of object design in object-oriented programming.\n  <br> It indicates that all of the object's data is contained and hidden within the object, and only members of that class have access to it.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Which of the following protocol is used for point-to-point serial connections using TCP/IP?\n  <br>", "option1": "ARP\n  <br>", "option2": "SLIP\n  <br>", "option3": "ICMP\n  <br>", "option4": "UDP\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Serial Line Internet Protocol (SLIP) is a basic protocol for communication over serial ports and routers that works with TCP/IP.\n  <br> They allow machines that were previously configured for direct communication to communicate with one another.\n  <br> This protocol was developed by Rick Adams in the year 1984.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Which among the following is a tool that intercepts the data flowing in a network?\n  <br>", "option1": "Packet sniffer\n  <br>", "option2": "Multimeter\n  <br>", "option3": "Spudger\n  <br>", "option4": "Tweezers\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A packet sniffer or packet analyser is a program that intercepts data as it travels through a network.\n  <br> If computers are connected to a non-filtered or switched local area network, traffic can be broadcast to all computers in the same segment.\n  <br> Packet sniffing is the act of capturing data packets via a computer network.\n  <br> It is mostly used by crackers and hackers to illegally obtain network information.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "Which of the following shortcut key is used to create a pivot chart on the same sheet in MS-Excel?\n  <br>", "option1": "F11\n  <br>", "option2": "Alt + F1\n  <br>", "option3": "Ctrl + -\n  <br>", "option4": "Alt + Shift + Left arrow\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>F11: It is used to create a pivot chart on a new worksheet.\n  <br>Alt + F1 : It is used to create a pivot chart on the same sheet.\n  <br>Ctrl + - : It is used to hide the items of the pivot table .\n  <br>Alt + Shift + Left arrow: Used to ungroup the items of the pivot table.\n  <br>Alt + Shift + Right arrow: Used to group the items of the pivot table.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "Which topology features a root node that is connected to all other nodes, forming a hierarchy?\n  <br>", "option1": "Mesh Topology\n  <br>", "option2": "Star Topology\n  <br>", "option3": "Ring Topology\n  <br>", "option4": "Tree Topology\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> Tree topology is a topology with a tree structure in which all of the computers are linked together like branches of a tree.\n  <br> A tree topology is a combination of a Bus and a Start network topology in a computer network. \n  <br> The significant advantages of this architecture are that it is extremely flexible and scalable.\n  <br> The tree network topology is the simplest topology because it only has one path between any two nodes on the network.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "Which one of the following is the top-most layer of TCP/IP model?\n  <br>", "option1": "Transport Layer\n  <br>", "option2": "Application Layer\n  <br>", "option3": "Internet Layer\n  <br>", "option4": "Network Access Layer\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The application layer is the fourth and final layer in the four-layer TCP/IP model.\n  <br> The Transport layer is put on top of the Application layer.\n  <br> This layer defines the TCP/IP application protocols and how host programs interface with the services of Transport layer to use the network.\n  <br> It is in charge of node-to-node communication as well as user interface requirements.\n  <br> HTTP, HTTPS, FTP, Telnet, SSH, SMTP are some of the protocols of this layer.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "Which of the following type of hub are also called as concentrators?\n  <br>", "option1": "Active Hub\n  <br>", "option2": "Passive Hub\n  <br>", "option3": "Data Hub\n  <br>", "option4": "Intelligent Hub\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A hub is a unique device that improves a network by allowing more workstations to connect to it.\n  <br> Active hubs are hubs that have repeated ability to amplify the signals in a network.\n  <br> Because they enhance the signals before transmitting them across nodes to the node, they are a little brighter than passive hubs.\n  <br> They are also known as concentrators, and they can handle many sets of network connections.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "Which of the following component in motherboard stores the BIOS settings such as time, date, and hardware settings?\n  <br>", "option1": "PCI Slot\n  <br>", "option2": "Northbridge\n  <br>", "option3": "Inductor\n  <br>", "option4": "CMOS battery\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The term CMOS which stands for complementary metal-oxide-semiconductor refers to the small amount of memory on a computer motherboard that holds the BIOS settings.\n  <br> The system time and date, as well as hardware settings, are among the BIOS settings.\n  <br> CMOS is a computer chip on the motherboard, specifically a RAM chip, which means it generally loses the settings it stores when the machine is turned off.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "In Microsoft Power-Point, which of the following component provides quick access to the most common features in PowerPoint?\n  <br>", "option1": "Formatting Toolbar\n  <br>", "option2": "Task Pane\n  <br>", "option3": "Standard Toolbar\n  <br>", "option4": "Menu Bar\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> The Task Pane is a rectangular pane on the right side of your PowerPoint window that appears docked.\n  <br> It operates as an open menu where you may choose from a variety of instructions and actions.\n  <br> It shows you a list of links and commands that you may use to complete various things depending on what you're doing.\n  <br> The task pane is designed to assist the user in completing tasks quickly, and it adapts according to the task in hand.\n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "In Computer, ‘VIRUS’ is programmed to spread from one host to another and can replicate. What does ‘R’ stand for in VIRUS?\n  <br>", "option1": "Resources\n  <br>", "option2": "Replication\n  <br>", "option3": "Registry\n  <br>", "option4": "Remote\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> A computer virus is a piece of software or code that is installed on your computer without your knowledge and runs without your permission. \n  <br> It stands for ‘Vital Information Resources Under Siege’.\n  <br> Viruses have the ability to multiply themselves and spread from one computer to another.\n  <br> When it succ
