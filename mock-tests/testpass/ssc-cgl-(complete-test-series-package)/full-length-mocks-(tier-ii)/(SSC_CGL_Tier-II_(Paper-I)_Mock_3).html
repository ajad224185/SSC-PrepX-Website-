remuneration in return. \n  <br>· This labor was used for a variety of purposes, including agricultural and construction work, as well as military service. The Vetti tax was one of the major sources of revenue for the Chola dynasty. \n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "  Most of the Chlorophyceae have one or more storage bodies called ______ located in the chloroplasts.\n  <br>", "option1": "Stomata\n  <br>", "option2": "Carotenoids\n  <br>", "option3": "Pyrenoids\n  <br>", "option4": "Chlorophyll\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Most of the Chlorophyceae have one or more storage bodies called Pyrenoids located in the chloroplasts.\n  <br>· Chlorophyceae are also called 'green algae'\n  <br>· Pyrenoids are specialized structures found within chloroplasts that play a role in the synthesis and storage of starch. They are composed of protein and starch and are involved in the concentration of carbon dioxide (CO2) and the fixation of carbon during photosynthesis.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "  Iron, iodine and zinc can be considered as which of the following?\n  <br>", "option1": "Macronutrients\n  <br>", "option2": "Micronutrients\n  <br>", "option3": "Steroid hormone inducer\n  <br>", "option4": "Non-essential nutrients\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Nutrients are necessary for the growth, energy, repair, and maintenance of the body.\n  <br>· Nutrients are classified as \n  <b>Macronutrients and Micronutrients.</b> \n  <br>· Carbohydrates, Calories, and Proteins are an example of Macronutrients.\n  <br> \n  <b>Micronutrients:</b> \n  <br>· Micronutrients are the elements required by us in \n  <b>small quantities.</b> \n  <br>· Iron, cobalt, chromium, iodine, copper, zinc, and molybdenum are some of the micronutrients.\n  <br>· Deficiency of any of the nutrients affects \n  <b>growth and development.</b> \n  <br>· They play a major role in the metabolic activities of the body.\n  <br>· ​These include \n  <b>vitamins and minerals.</b> \n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "  Which measuring instrument consists of a metal triangular frame supported on three legs, used to measure the radius of curvature of an object such as lenses and curved mirrors which are spherical in shape?\n  <br>", "option1": "Viscometer\n  <br>", "option2": "Spherometer\n  <br>", "option3": "Verniercaliper\n  <br>", "option4": "Screw gauge\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A spherometer is a measuring device that has a metallic triangular frame supported on three legs. The tips of the three legs form an equilateral triangle and lie on the radius. There is a central leg which can be moved in a perpendicular direction. Below is the experiment on how to determine the radius of curvature of a given spherical surface by a spherometer.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Who recently achieved the milestone of becoming the second-fastest player in the history of Test cricket to reach 9000 runs?\n  <br>", "option1": "Steven Smith \n  <br>", "option2": "Joe Root\n  <br>", "option3": "Virat Kohli\n  <br>", "option4": "Kane Williamson\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) Steven Smith.\n  <br>Steven Smith achieved the milestone of becoming the second-fastest player in the history of Test cricket to reach 9000 runs. He achieved this feat in his 174th innings, just two innings behind Kumar Sangakkara, who reached the milestone in 172 innings. Smith scored 110 runs off 184 balls, including 15 boundaries, in the first innings of the second Ashes Test against England at Lord's.\n  <br> \n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "How many Handicrafts products from Uttar Pradesh were recognized with a Geographical Indication (GI) Tag?\n  <br>", "option1": "7 \n  <br>", "option2": "3\n  <br>", "option3": "10\n  <br>", "option4": "5\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Geographical Indication Registry (Chennai, Tamil Nadu-TN) under the Department of Industry Promotion and Internal Trade (DIPIT), Ministry of Commerce and Industry (MoCI), has recognized 7 Handicrafts products from Uttar Pradesh with Geographical Indication (GI) Tag.\n  <br> \n  <b>These products are:</b> \n  <br>1. Amroha Dholak\n  <br>2. Kalpi Handmade Paper\n  <br>3. Baghpat Home Furnishings\n  <br>4. Barabanki Handloom Product\n  <br>5. Mahoba Gaura Patthar Hastashlip\n  <br>6. Mainpuri Tarkashi\n  <br>7. Sambhal Horn Craft\n  <br> \n  <b>About Geographical Indication (GI):</b> \n  <br>· A Geographical Indication (GI) is a sign used on products that have a specific geographical origin and possess qualities or a reputation that are due to that origin.\n  <br>· The GI Tag helps to protect these products from imitation and ensure that consumers receive genuine products.\n  <br>· The GI Tag is granted by the Intellectual Property Appellate Board (IPAB) in India.\n  <br>· The application for a GI Tag must be made by a group of producers or traders who are located in the geographical area in which the product is produced.\n  <br>· The application must include a description of the product, the geographical area in which it is produced, and the qualities or reputation that are due to that origin.\n  <br>· The IPAB will then assess the application and decide whether to grant the GI Tag.\n  <br> \n  <b>Here are some of the benefits of a GI Tag:</b> \n  <br>· It helps to protect the product from imitation.\n  <br>· It helps to ensure that consumers receive genuine products.\n  <br>· It can help to increase the price of the product.\n  <br>· It can help to promote the product and attract tourists.\n  <br> \n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "What is the name of the exercise that is set to be the largest air exercise in India?\n  <br>", "option1": "Garuda Shakti\n  <br>", "option2": "Vayu Shakti\n  <br>", "option3": "Tarang Shakti\n  <br>", "option4": "Akash Shakti\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) Tarang Shakti.\n  <br>· Tarang Shakti is a biannual multinational air exercise conducted by the Indian Air Force (IAF). The exercise is designed to improve interoperability between the IAF and other air forces, and to foster strategic alliances.\n  <br>· The first Tarang Shakti exercise was held in 2007, and it has been held every two years since then. The 2023 edition of Tarang Shakti is set to be the largest air exercise ever conducted in India, with participation from over 12 air forces.\n  <br>· The participating air forces will be from India, the United States, the United Kingdom, France, Australia, Russia, South Korea, Japan, and Singapore. The exercise will be held in the western sector of India, and it will involve a wide range of air operations, including fighter aircraft combat exercises, transport aircraft airdrops, and helicopter operations.\n  <br>· Tarang Shakti is a major event in the Indian Air Force's calendar, and it is a testament to the IAF's commitment to global engagement. The exercise will help to improve interoperability between the IAF and other air forces, and it will foster strategic alliances that will be beneficial to India's security.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "Who are the authors of the book \"Maya, Modi, Azad: Dalit Politics in the Time of Hindutva\"?\n  <br>", "option1": "Sudha Kumar and Sajjan Azad\n  <br>", "option2": "Sudha Kumar and Sajjan Pai\n  <br>", "option3": "Sudha Pai and Sajjan Kumar\n  <br>", "option4": "Sudha Azad and Sajjan Pai\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sudha Pai and Sajjan Kumar have authored a book called “Maya, Modi, Azad: Dalit Politics in the Time of Hindutva.”\n  <br>In this book, they provide a perceptive and thought-provoking examination of the interplay between Maya, Modi, and Azad in the realm of Dalit politics. Their analysis holds great importance in comprehending not only the dynamics of Dalit politics but also the broader democratic landscape of India, especially as we approach the highly contentious general election of 2024.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "Which of the following is any malicious computer program which is used to hack into a computer by misleading users of its true intent?\n  <br>", "option1": "Worm\n  <br>", "option2": "Spyware\n  <br>", "option3": "Trojan horse\n  <br>", "option4": "Keylogger\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In computing, \n  <b>Trojan horse</b>, or Trojan, is any malicious computer program which is used to hack into a computer by misleading users of its true intent. \n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "What is periodically adding, changing and deleting file records called?\n  <br>", "option1": "renewing\n  <br>", "option2": "upgrading\n  <br>", "option3": "restructuring \n  <br>", "option4": "updating\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Periodically adding, changing and deleting file records are called\n  <b> Updating.</b> \n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Which of the following is the fastest type of computer? \n  <br>", "option1": "Laptop \n  <br>", "option2": "Notebook\n  <br>", "option3": "Personal computer \n  <br>", "option4": "Supercomputer\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Supercomputers</b> are fastest in their generations.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "Which of the following file format can be added to a PowerPoint show? \n  <br>", "option1": ".jpg\n  <br>", "option2": ".gif\n  <br>", "option3": ".wav\n  <br>", "option4": "All of these \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>All these formats</b> can be added to a PPT.\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "______ is a collection of circuitry functions that together makes an important part of a computer system?\n  <br>", "option1": "The platform \n  <br>", "option2": "Application software \n  <br>", "option3": "Operating system \n  <br>", "option4": "The motherboard \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A \n  <b>motherboard</b> (sometimes alternatively known as the mainboard, system board, baseboard, planar board or logic board, or colloquially, a mobo) is the main printed circuit board (PCB) found in general purpose microcomputers and other expandable systems.\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "Computer mouse is also known as __________?\n  <br>", "option1": "Pointing Device \n  <br>", "option2": "Scanning Device\n  <br>", "option3": "Sensing Device\n  <br>", "option4": "Moving Device\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A computer mouse is a \n  <b>pointing device</b> (hand control) that detects two-dimensional motion relative to a surface. This motion is typically translated into the motion of a pointer on a display, which allows a smooth control of the graphical user interface\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "When a logic bomb is activated by a time-related event, it is known as a ______?\n  <br>", "option1": "Time-related bomb sequence.\n  <br>", "option2": "Virus.\n  <br>", "option3": "Time bomb.\n  <br>", "option4": "Trojan horse\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Time bomb</b> is a type of computer virus that lies dormant for an amount of time until it finally comes out and causes a computer program to be deleted or freeze.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "What type of virus uses computer hosts to reproduce itself?\n  <br>", "option1": "Time bomb\n  <br>", "option2": "Worm\n  <br>", "option3": "Melissa virus\n  <br>", "option4": "Macro virus\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A computer \n  <b>worm</b> is a standalone malware computer program that replicates itself in order to spread to other computers.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "When a computer is switched on, the booting process performs ______?\n  <br>", "option1": "Integrity Test\n  <br>", "option2": "Power-On Self-Test\n  <br>", "option3": "Correct Functioning Test\n  <br>", "option4": "Reliability Test\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "When power is turned on, \n  <b>POST (Power-On Self-Test)</b> is the diagnostic testing sequence that a computer's basic input/output system (or \"starting program\") runs to determine if the computer keyboard, random access memory, disk drives, and other hardware are working correctly.\n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "A compact disc is a data storage system of type_____?\n  <br>", "option1": "magnetic\n  <br>", "option2": "optical\n  <br>", "option3": "electrical\n  <br>", "option4": "electromechanical\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A compact disc (CD) is an \n  <b>optical data storage</b> system. It uses laser technology to read and write data on the disc's reflective surface, allowing for high-capacity storage and retrieval of digital information.\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "Which of th __terminals (formerly known as cash registers) are often connected to complex inventory and sales computer systems?\n  <br>", "option1": "Point-of-sale (POS)\n  <br>", "option2": "Data \n  <br>", "option3": "Sales\n  <br>", "option4": "Query\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \n  <b>point of sale or point of purchase</b> is the time and place where a retail transaction is completed.\n  <br>", "question_heading": ""}, {"sr_no": 150, "question": "Which generation of computer developed using integrated circuits?\n  <br>", "option1": "Second generation\n  <br>", "option2": "Fifth generation \n  <br>", "option3": "Third generation\n  <br>", "option4": "All of the above\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Third generation</b> of computer developed using integrated circuits.\n  <br>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
