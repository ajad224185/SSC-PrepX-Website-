tions to welfare economics. He is known for his work on famines, poverty, and social choice theory.\n  <br> He was also awarded the India's highest civilian honour the Bharat Ratna in the year 1999 for his contribution to welfare economics. The German Publishers and Booksellers Association awarded him the 2020 Peace Prize of the German Book Trade for his pioneering scholarship addressing issues of global justice and combating social inequality in education and healthcare.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "Which one of the following is not a feature of the Ayushman Bharat Scheme? \n  <br>", "option1": "There is no cap on family size and age.\n  <br>", "option2": "The scheme includes pre- and post-hospitalization expenses.\n  <br>", "option3": "A कधीinधक पनोnौूयनप ोिियथोncध ूधन ुयौूiपोिप्रोपiयn थiिि ोिसय ृध ूोiक पय पुध ृधnधीiciोनद.", "option4": "The scheme provides a benefit cover of Rs. 10 lakh per family.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (d) \"The scheme provides a benefit cover of Rs. 10 lakh per family.\" is not a feature of the Ayushman Bharat Scheme.\n  <br>Under the PM-JAY component of Ayushman Bharat Scheme, it provides cover of Rs. 5 lakhs per family per year, for secondary and tertiary care hospitalization across public and private empaneled hospitals in India. Hence, option (d) is incorrect.\n  <br>   \n  <b>About Ayushman Bharat Yojana - </b> \n  <br> Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (PM-JAY) also referred to as Ayushman Bharat National Health Protection Scheme or NHPS) is a national public health insurance scheme of the Government of India that aims to provide free access to health insurance coverage for low-income earners in the country. \n  <br> The programme is part of the Indian government's National Health Policy. It is the world's largest government sponsored healthcare program.\n  <br>  \n  <b>Key Features of PM-JAY —</b> \n  <br> 1. Provides health coverage for 10 crore households or approximately 50 crore Indians.\n  <br>2. Provides a cover of ₹5 lakh per family per year for medical treatment in empaneled hospitals, both public and private.\n  <br>3. Offers cashless payment and paperless recordkeeping through the hospital or doctor's office.\n  <br>4. Uses criteria from the Socio Economic and Caste Census 2011 to determine eligibility for benefits.\n  <br>5. There is no restriction on family size, age, or gender.\n  <br>6. All previous medical conditions are covered under the scheme.\n  <br>7. Covers 3 days of pre-hospitalization and 15 days of post-hospitalization, including diagnostic care and expenses on medicines.\n  <br>8. The scheme is portable and a beneficiary can avail medical treatment at any PM-JAY empaneled hospital outside their state and anywhere in the country.\n  <br>9. Provides access to free COVID-19 testing.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "Zafar Khan was a famous General of which of the following rulers of the Delhi Sultanate?\n  <br>", "option1": "Alauddin Khilji\n  <br>", "option2": "Iltutmish\n  <br>", "option3": "Muhammad bin Tughluq\n  <br>", "option4": "Balban\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) Alauddin Khilji.\n  <br>Zafar Khan was a famous general of Alauddin Khilji, the Sultan of Delhi from 1296 to 1316. He held charge of Multan, Samana, and Sivistan, Sindh at various times during Alauddin's reign.  In 1299, he was killed in the Battle of Kili against the Mongol invaders led by Qutlugh Khwaja.\n  <br>He was associated with Alauddin since the latter's days as a governor of Kara, and led a major division of Alauddin's army from Kara to Delhi after Alauddin assassinated his predecessor Jalaluddin in 1296. Therefore, the correct answer is (a) Alauddin Khilji.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "Which of the following statements is/are correct regarding the Swachh Bharat Abhiyan?\n  <br> A. The campaign aims to clean up the streets, roads and infrastructure of India's cities, towns, and rural areas.\n  <br> B. The campaign was officially launched on 2 October 2014 at Rajghat, New Delhi by Prime Minister Narendra Modi.\n  <br> C. The mission aims to achieve an \"open-defecation free\" (ODF) India by 2 October 2019.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A and C only\n  <br>", "option4": "A, B and C \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) A, B and C. All the statements are correct regarding the Swachh Bharat Abhiyan.\n  <br>The Swachh Bharat Abhiyan, or Clean India Mission, is a national cleanliness campaign launched by the Government of India in 2014. The campaign aims to clean up the streets, roads and infrastructure of India's cities, towns, and rural areas. It also aims to achieve an \"open-defecation free\" (ODF) India by 2 October 2019, the 150th birth anniversary of Mahatma Gandhi.\n  <br>The campaign was officially launched on 2 October 2014 at Rajghat, New Delhi by Prime Minister Narendra Modi.\n  <br> \n  <b>Note -</b> Phase 2 of Swachh Bharat Abhiyan is being implemented between 2020–21 and 2024–25 to help cement the work of Phase 1.\n  <br>The second phase of the mission aims to sustain the open defecation free status and improve the management of solid and liquid waste, while also working to improve the lives of sanitation workers. The mission is aimed at progressing towards target 6.2 of the Sustainable Development Goals Number 6 established by the United Nations in 2015.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Which of the following statements is/are correct regarding the Paris Agreement?\n  <br>A. The Paris Agreement is an agreement within the United Nations Framework Convention on Climate Change (UNFCCC), dealing with greenhouse-gas-emissions mitigation, adaptation, and finance.\n  <br>B. The agreement's language was negotiated by representatives of 196 state parties at the 21st Conference of the Parties of the UNFCCC in Le Bourget, near Paris, France, and adopted by consensus on 12 December 2015.\n  <br>C. The Paris Agreement's long-term temperature goal is to keep the increase in global average temperature to well below 2 °C above pre-industrial levels.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A, B and C\n  <br>", "option4": "A and C only\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A, B and C. All the statements are correct regarding the Paris Agreement.\n  <br>The Paris Agreement is an agreement within the United Nations Framework Convention on Climate Change (UNFCCC), dealing with greenhouse-gas-emissions mitigation, adaptation, and finance. \n  <br>The agreement's language was negotiated by representatives of 196 state parties at the 21st Conference of the Parties of the UNFCCC in Le Bourget, near Paris, France, and adopted by consensus on 12 December 2015.\n  <br>The Paris Agreement's long-term temperature goal is to keep the increase in global average temperature to well below 2 °C above pre-industrial levels, and preferably limit the increase to 1.5 °C (2.7 °F), recognizing that this would substantially reduce the effects of climate change. To stay below 1.5 °C of global warming, emissions need to be cut by roughly 50% by 2030.\n  <br> \n  <b>Note - </b>As of February 2023, 195 members of the United Nations Framework Convention on Climate Change (UNFCCC) are parties to the agreement. Of the three UNFCCC member states which have not ratified the agreement, the only major emitter is Iran. The United States withdrew from the agreement in 2020, but rejoined in 2021.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "The Yajurveda is broadly grouped into two – _________________ Yajurveda and ______________ Yajurveda.\n  <br>", "option1": "Krishna and Shukla\n  <br>", "option2": "Shyam and Shukla\n  <br>", "option3": "Vrishna and Shant\n  <br>", "option4": "None of these\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Yajurveda is broadly grouped into two – the \"black\" or \"dark\" (Krishna) Yajurveda and the \"white\" or \"bright\" (Shukla) Yajurveda.\n  <br>The term \"black\" implies \"the un-arranged, unclear, motley collection\" of verses in Yajurveda, in contrast to the \"white\" which implies the \"well arranged, clear\" Yajurveda.\n  <br>The Yajurveda is one of the four Vedas, the oldest scriptures of Hinduism. It is a collection of hymns, mantras, and prayers that are used in Vedic rituals. \n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "How many types of taxes were in the reign of the ruler Alauddin Khalji?\n  <br>", "option1": "3\n  <br>", "option2": "5\n  <br>", "option3": "6\n  <br>", "option4": "2\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "During the reign of Alauddin Khilji, there were \n  <b>3</b> types of taxes: (1) on cultivation called kharaj and amounting to about 50 per cent of the peasant’s produce, (2) on cattle and (3) on houses.\n  <br>1. \n  <b>Kharaj</b> - Land tax on agricultural land\n  <br>2. \n  <b>Ghari</b> - House tax\n  <br>3. \n  <b>Charai</b> - Pasture tax.\n  <br>In addition, Alauddin's government imposed the jizya tax on its non-Muslim subjects. Women and children, as well as those with mental disorders and intellectual disability, were exempt from jizya. The Muslims were obligated to contribute zakat instead.\n  <br>Alauddin demanded four-fifths share of the spoils of war from his soldiers, instead of the traditional one-fifth share (khums).\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "The bare ground between plants is covered with a layer of organic matter in order to retain soil moisture. This method is called__________.\n  <br>", "option1": "Mulching\n  <br>", "option2": "Rock dam\n  <br>", "option3": "Shelter belts\n  <br>", "option4": "Contour barriers\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The method of covering the bare ground between plants with a layer of organic matter in order to retain soil moisture, suppress weed growth, and regulate soil temperature is called \"\n  <b>Mulching</b>\".\n  <br> Rock dam is a barrier constructed using rocks to slow down and prevent soil erosion caused by water.\n  <br> Shelter belts are rows of trees or shrubs planted to protect crops from wind damage. \n  <br> Contour barriers are constructed across slopes to slow down or prevent soil erosion.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Which Five- Year Plan in India was mainly focused on Garibi Hatao, creation of employment opportunities and agricultural production amongst other objectives? \n  <br>", "option1": "Fifth\n  <br>", "option2": "Fourth\n  <br>", "option3": "Third\n  <br>", "option4": "Second\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Fifth Five-Year Plan in India (1974-1979) was mainly focused on \"Garibi Hatao\", which means eradication of poverty, and it aimed to improve the living standards of the poor and underprivileged sections of society.\n  <br> The Fifth Five-Year Plan was also notable for its emphasis on self-reliance and domestic production, as India faced significant economic challenges at the time, including high inflation and a balance of payment crisis. \n  <br> The plan also aimed to strengthen the public sector, encourage the growth of small and medium enterprises, and improve infrastructure in the country.\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "Which one of the following Indian States has the highest percentage of Scheduled Tribe population to its total population?\n  <br>", "option1": "Mizoram\n  <br>", "option2": "Nagaland\n  <br>", "option3": "Meghalaya\n  <br>", "option4": "Arunachal Pradesh\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), Mizoram.\n  <br>According to the 2011 Census, Mizoram has the highest percentage of Scheduled Tribe population to its total population, at 94.4%. This is followed by Nagaland (86.5%), Meghalaya (86.1%), and Arunachal Pradesh (68.7%).\n  <br>The high percentage of Scheduled Tribe population in Mizoram is due to the fact that the state is home to many tribal groups, such as the Mizos, the Lushai, and the Pawi.\n  <br>According to 2011 Census Data, State of Madhya Pradesh has highest tribal population in India.\n  <br>Uttar Pradesh (0.6%) has a minimum ratio of Scheduled tribes, as per Census-2011.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "Which one of the following is not a geographical requirement for cultivation of cotton?\n  <br>", "option1": "Temperature reaching 25°C or more in summer\n  <br>", "option2": "Moderate to light rainfall\n  <br>", "option3": "Medium loam soil with good drainage\n  <br>", "option4": "A growing period of at least 100 frost free days\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The following physical are required for the cotton cultivation:\n  <br>(i) \n  <b>Temperature:</b> Cotton grows in tropical and sub-tropical warm humid climate. Annual temperature requirement is 20°-28°C. Equitable temperature distribution and bright sunshine is desirable. \n  <br>(ii) \n  <b>Rainfall:</b> Annual rainfall of 55-100 cm is ideal for cotton Cultivation. Rainfall during harvesting is harmful. \n  <br>(iii) \n  <b>Frost-free Days:</b> About 180 frost-free days are the bottom-line for cotton cultivation. At least 200 frost free days are desirable for cotton cultivation. \n  <br>(iv) \n  <b>Soil:</b> Fertile, saline soil with high water-retention capacity is ideal for cotton cultivation. Loamy soil with high calcium carbonate is best for cotton cultivation. \n  <br>(v) \n  <b>Relief:</b> Slight slope of the land drains the soil and is good for cotton cultivation.\n  <br> Therefore, the statement (d) \"A growing period of at least 100 frost free days\" is not a geographical requirement for the cultivation of cotton. Cotton requires a longer growing period of at least 180-200 frost-free days.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "Match List I with List II and select the correct answer using the code given below the lists:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697694380889image49.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>   \n  <b> </b> \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct match between the peaks and the hills is as follows:\n  <br> A. Anaimudi is in the Annamalai Hills.\n  <br>B. Doddabetta is in the Nilgiris.\n  <br>C. Dhupgarh is in the Satpura range.\n  <br>D. Guru Shikhar is in the Aravalli range.\n  <br>Therefore, the correct code is: A – 4; B – 1; C – 2; D – 3.\n  <br>So, the answer is (c) 4, 1, 2, 3.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697694380464image102.png\"> \n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Limestone, chalk and marble are different forms of __________.\n  <br>", "option1": "Calcium phosphate\n  <br>", "option2": "Calcium hydroxide\n  <br>", "option3": "Calcium oxide\n  <br>", "option4": "Calcium carbonate\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Limestone, chalk and marble are different forms of Calcium Carbonate (CaCO3). \n  <br>Limestone is a sedimentary rock composed primarily of calcium carbonate.\n  <br>Chalk is a soft, porous, white or gray rock that is also composed of calcium carbonate, commonly found in parts of Europe, including England and France.\n  <br>Marble is a metamorphic rock that is formed from limestone under high pressure and temperature conditions.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "In 1979, who shared the Nobel Prize with Georg Wittig for their ‘development of the use of boron- and phosphorus-containing compounds, respectively, into important reagents in organic synthesis’? \n  <br>", "option1": "Herbert C Brown\n  <br>", "option2": "Arne Tiselius\n  <br>", "option3": "Henry Taube\n  <br>", "option4": "Emil Fischer\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), Herbert C Brown.\n  <br>In 1979, the Nobel Prize in Chemistry was awarded jointly to Georg Wittig and Herbert C. Brown for their development of the use of boron- and phosphorus-containing compounds, respectively, into important reagents in organic synthesis.\n  <br>  Brown developed the use of boron compounds, such as diborane, in organic synthesis. These compounds are known as boron hydrides, and they are used in a variety of reactions, including the hydroboration reaction.\n  <br> Wittig developed the use of phosphorus compounds, such as triphenylphosphine, in organic synthesis. These compounds are known as Wittig reagents, and they are used in the Wittig reaction.\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Established in 1867 in Bombay, the __________ sought to remove caste restrictions, abolish child marriage, and encourage the education of women, etc.\n  <br>", "option1": "Veda Samaj\n  <br>", "option2": "Arya Samaj\n  <br>", "option3": "Prarthana Samaj\n  <br>", "option4": "Satyashodhak Samaj\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Prarthana Samaj</b> was founded in 1867 in Bombay (now Mumbai) by Dr. Atmaram Pandurang\n  <br> Aim - promoting monotheism and social reforms in Hindu society\n  <br> Prarthana Samaj was influenced by the \n  <b>Brahmo Samaj</b> and the teachings of \n  <b>Raja Ram Mohan</b> Roy\n  <br> The \n  <b>Arya Samaj</b>, founded by \n  <b>Swami Dayanand Saraswati</b> in 1875, also sought to reform Hindu society but focused more on Vedic teachings and the promotion of Vedic education.\n  <br> The \n  <b>Satyashodhak Samaj</b>, founded by \n  <b>Jyotirao Phule</b> in 1873, was a social reform movement in Maharashtra that aimed to abolish the caste system and promote education and women's rights.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "In football, when the ball strikes the frame of the goal or the referee and remains within the goal and touch lines, it is: \n  <br>", "option1": "foul\n  <br>", "option2": "still in play\n  <br>", "option3": "a misconduct\n  <br>", "option4": "out of play\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "When the ball strikes the frame of the goal or the referee and remains within the goal and touch lines, it is considered \n  <b>still in play</b> in football.\n  <br> The ball is considered to be out of play when it has crossed the goal line or touchline, either on the ground or in the air. However, if the ball strikes the frame of the goal, the crossbar, or the referee, and remains within the field of play, it is considered to be still in play.\n  <br> The play continues until the ball goes out of play or a foul/misconduct is committed by a player, leading to a stoppage of play.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Match column A with column B.\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1697694380891image50.png\"> \n  <br>", "option1": "i-c, ii-b, iii-d, iv-a\n  <br>", "option2": "i-b, ii-a, iii-c, iv-d\n  <br>", "option3": "i-d, ii-c, iii-b, iv-a\n  <br>", "option4": "i-b, ii-c, iii-a, iv-d\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct match between column A and column B is:\n  <br>i. Kwashiorkor - d. Protein deficiency\n  <br>ii. Weak bones and muscles - c. Calcium deficiency\n  <br>iii. Anaemia - b. Iron deficiency\n  <br>iv. Goitre - a. Iodine deficiency\n  <br>So, the correct option is (c) i-d, ii-c, iii-b, iv-a.\n  <br> \n  <b>Kwashiorkor</b> is a condition caused by protein deficiency, which can result in severe malnutrition, skin lesions, and swelling of the limbs and belly.\n  <br> \n  <b>Weak bones</b> and muscles are caused by calcium deficiency, which can result in osteoporosis, a condition where the bones become brittle and fragile.\n  <br> \n  <b>Anemia</b> is caused by iron deficiency, which results in a decreased number of red blood cells in the body, leading to fatigue, weakness, and shortness of breath.\n  <br> \n  <b>Goiter </b>is caused by iodine deficiency, which results in the enlargement of the thyroid gland in the neck, leading to swelling and difficulty in breathing and swallowing.\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "What is the title of Ashwinder R Singh's new book on residential real estate?\n  <br>", "option1": "Master Residential Real Estate\n  <br>", "option2": "The Complete Handbook for Real Estate Investors\n  <br>", "option3": "The Ultimate Guide to Residential Property\n  <br>", "option4": "Mastering the Real Estate Market\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), Master Residential Real Estate.\n  <br>Ashwinder R Singh's new book on residential real estate is titled \"Master Residential Real Estate\". The book was released in 2022 and is available on Amazon. \n  <br>It covers a wide range of topics related to residential real estate, including finding the right property, financing a home purchase, and managing your investment.\n  <br> \n  <b>Some more Details:</b> \n  <br> \n  <b>Ashwinder R Singh</b>, CEO - Residential at Bhartiya Urban and a bestselling author.\n  <br>He is a bestselling author and thought leader in the Indian real estate industry. Singh's influence in the real estate industry has been recognized through prestigious titles such as Real Estate Person of the Year, South - Construction Week 2022, Most Enterprising CEO of the Year 2016, Top 15 Real Estate Influencers by Realty+, and Thought Leader of the Year by International Brand Equity in 2023.\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Which state has been recognized as the top performer in the Best State category of the National Water Awards?\n  <br>", "option1": "Madhya Pradesh\n  <br>", "option2": "Rajasthan\n  <br>", "option3": "Maharashtra\n  <br>", "option4": "Uttar Pradesh\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), Madhya Pradesh.\n  <br>Madhya Pradesh has been recognized as the top performer in the Best State category of the National Water Awards. The awards were presented by the Ministry of Jal Shakti on 22nd March 2023.\n  <br>Madhya Pradesh was awarded for its achievements in water conservation, water harvesting, and water management. The state has implemented several water conservation and water harvesting schemes, such as the Jal Samridhi Yojana and the Mukhyamantri Jal Sanchay Yojana. \n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Who is the new Managing Director of Indraprastha Gas Ltd. (IGL)?\n  <br>", "option1": "Sakshi Singh\n  <br>", "option2": "Soniya Verma\n  <br>", "option3": "Ravi Sharma\n  <br>", "option4": "Kamal Kishore Chatiwal\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d), Kamal Kishore Chatiwal.\n  <br>Kamal Kishore Chatiwal has taken over as Managing Director of Indraprastha Gas Ltd. (IGL), the largest CNG distribution company in the country, operating City Gas Distribution (CGD) networks across 30 districts in four states including NCT of Delhi.\n  <br>Kamal Kishore Chatiwal has taken over as its Managing Director with effect from June 15.\n  <br>Chatiwal has taken over the charge from Sanjay Kumar, who took over as Director (Marketing) at GAIL on the same day.\n  <br> \n  <b>Indraprastha Gas Limited</b> is an Indian natural gas distribution company that supplies natural gas as cooking and vehicular fuel, primarily in Delhi NCR. Established in 1998, the company is a joint venture between GAIL, Bharat Petroleum, and the Government of Delhi.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "The National Reading Day commemorates the death anniversary of_________, widely recognized as the 'Father of the Library Movement' in the state of Kerala.\n  <br>", "option1": "Mahatma Gandhi\n  <br>", "option2": "Bhagat Singh\n  <br>", "option3": "Jawaharlal Nehru\n  <br>", "option4": "PN Panicker\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d), PN Panicker.\n  <br>National Reading Day commemorates the death anniversary of PN Panicker, widely recognized as the 'Father of the Library Movement' in Kerala.\n  <br>He was a teacher and a social reformer who was instrumental in the establishment of libraries in Kerala. He founded the Kerala Granthasala Sangham, the first library association in Kerala, in 1910. He also served as the President of the Indian Library Association from 1936 to 1938.\n  <br>Panicker died on 19 June 1955. His death anniversary is celebrated as National Reading Day to highlight the importance of reading and to encourage people to read more.\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "Which multinational peacekeeping joint exercise did the Indian Army contingent participate in?\n  <br>", "option1": "Ex Khaan Quest 2023\n  <br>", "option2": "Ex Operation Peacekeeper\n  <br>", "option3": "Ex Global Harmony\n  <br>", "option4": "Ex Unified Resolve\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), Ex Khaan Quest 2023.\n  <br>The Indian Army contingent participated in the multinational peacekeeping joint exercise Ex Khaan Quest 2023, which was held in Mongolia from June 6 to 20, 2023. The exercise was hosted by the Mongolian Armed Forces and was attended by 27 countries from Asia, Europe, and North America.\n  <br>The aim of the exercise was to enhance interoperability and cooperation among the participating countries in the conduct of peacekeeping operations. The exercise included a wide range of activities, such as field training exercises, urban operations, and humanitarian assistance and disaster relief operations.\n  <br>The Indian Army contingent was represented by a battalion-sized element, which included infantry, artillery, and engineering units. The contingent was commanded by Brigadier Alok Chandra.\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "The keyboard shortcut to restart your computer is?\n  <br>", "option1": "Alt + F4 \n  <br>", "option2": "Ctrl + F4\n  <br>", "option3": "Ctrl + Alt + Del \n  <br>", "option4": "Alt + Del\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Ctrl + Alt + Del</b> is used to restart computer.\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "Inkjet printer and laser printers are examples of ……… printers?\n  <br>", "option1": "non impact\n  <br>", "option2": "impact \n  <br>", "option3": "dot matrix \n  <br>", "option4": "thermal \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Non impact</b> printer is a printer that prints without banging a ribbon onto paper. Laser, LED, inkjet, solid ink, thermal wax transfer and dye sublimation printers are examples of non-impact printers.\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "Which of the following is single user computer with many features and good processing power? \n  <br>", "option1": "Workstation \n  <br>", "option2": "Minicomputer \n  <br>", "option3": "Microcomputer \n  <br>", "option4": "All of the above \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A \n  <b>workstation</b> is a special computer designed for technical or scientific applications. Intended primarily to be used by one person at a time, they are commonly connected to a local area network and run multi-user operating systems.\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "Saving is the process________?\n  <br>", "option1": "To copy document from memory to storage\n  <br>", "option2": "To change the content of any document\n  <br>", "option3": "To change the display or entire document\n  <br>", "option4": "To develop document by entering text using keyboard \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Saving is the process \n  <b>to copy document from memory to storage.</b> \n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "The shortcut key to search for a file or folder is __________?\n  <br>", "option1": "F4 \n  <br>", "option2": "F1 \n  <br>", "option3": "F2\n  <br>", "option4": "F3\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The shortcut key to search for a file or folder is \n  <b>F3.</b> \n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "The computer’s capability of distinguishing spoken words is called?\n  <br>", "option1": "voice analysis \n  <br>", "option2": "speech acknowledgment \n  <br>", "option3": "voice recognition \n  <br>", "option4": "speech interpretation \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Voice recognition</b> is the ability of a machine or program to receive and interpret dictation, or to understand and carry out spoken commands.\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "A character is represented in EBCDIC by?\n  <br>", "option1": "1 bit\n  <br>", "option2": "4 bits\n  <br>", "option3": "8 bits \n  <br>", "option4": "16 bits\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Extended Binary Coded Decimal Interchange Code (EBCDIC) is an \n  <b>eight-bit character</b> encoding used mainly on IBM mainframe and IBM midrange computer operating systems. EBCDIC descended from the code used with punched cards and the corresponding six bit binary-coded decimal code used with most of IBM's computer peripherals of the late 1950s and early 1960s.\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "One megabyte equals approximately?\n  <br>", "option1": "1,000 bits \n  <br>", "option2": "1,000 bytes \n  <br>", "option3": "1 million bytes \n  <br>", "option4": "1 million bits \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "1 MB= \n  <b>1 million bytes</b>.\n  <br>", "question_heading": ""}, {"sr_no": 139, "question": "Which process checks to ensure the components of the computer are operating and connected properly?\n  <br>", "option1": "Booting \n  <br>", "option2": "Processing \n  <br>", "option3": "Saving \n  <br>", "option4": "Editing \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Booting</b> is the process which loads the operating system and check to ensure the components of the computer are operating and connected properly.\n  <br>", "question_heading": ""}, {"sr_no": 140, "question": "Which of the following is required to create a HTML document?\n  <br>", "option1": "Telnet\n  <br>", "option2": "Browser\n  <br>", "option3": "Internet\n  <br>", "option4": "Text Editor \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "HTML document is created by using a basic \n  <b>text editor</b> such as Notepad on Windows, TextEdit on MacOS, gedit on Ubuntu Linux. However, you should choose an editor that allows you to save a page in the UTF-8 encoding.\n  <br>", "question_heading": ""}, {"sr_no": 141, "question": "Select the odd one out?\n  <br>", "option1": "Bing\n  <br>", "option2": "Firefox\n  <br>", "option3": "Chrome\n  <br>", "option4": "Google\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "All other except \n  <b>Google </b>are Browsers.\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "To allows someone else to schedule your meetings and appointments, ______ feature of Outlook is used?\n  <br>", "option1": "Monthly calendar \n  <br>", "option2": "Event manager\n  <br>", "option3": "Messenger\n  <br>", "option4": "Delegate Access\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Delegate Access</b> is a more advanced feature than just sharing your Outlook folders. If you want to grant additional permissions, such as allowing a delegate the ability to create e-mail messages or respond to meeting requests on your behalf, you must use Delegate Access.\n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "Which among the following is closely related to the processor? \n  <br>", "option1": "Main Memory \n  <br>", "option2": "Secondary Memory \n  <br>", "option3": "Disk Memory \n  <br>", "option4": "Internal Memory \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Main memory</b> is closely related to processor. Therefore, the data, which is available in the main memory, is processed much faster than that in the secondary memory. \n  <br>", "question_heading": ""}, {"sr_no": 144, "question": "What does DRAM stands for?\n  <br>", "option1": "Digital Random Access Memory\n  <br>", "option2": "Dynamic Random Access Memory\n  <br>", "option3": "Dividing Random Access Memory\n  <br>", "option4": "Dynamic Recording Access Memory\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "DRAM stands for \n  <b>Dynamic Random Access Memory.</b> \n  <br>", "question_heading": ""}, {"sr_no": 145, "question": "Walkie-talkie is an example of which of the following?\n  <br>", "option1": "simplex communication \n  <br>", "option2": "half-duplex communication \n  <br>", "option3": "full-duplex communication \n  <br>", "option4": "semi-duplex communication \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Walkie-talkie is an example of \n  <b>half-duplex communication</b>. In the case of walkie-talkie, the person at one end sends signals, while the other on the receiving end receives these signals. The person at the receiving end cannot communicate until the person at the first end stops. \n  <br>", "question_heading": ""}, {"sr_no": 146, "question": "How many bits are equivalent to one nibble? \n  <br>", "option1": "4 bits \n  <br>", "option2": "6 bits \n  <br>", "option3": "8 bits \n  <br>", "option4": "10 bits \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "One nibble is equivalent to \n  <b>4 bits.</b> It is also known as half byte. \n  <br>", "question_heading": ""}, {"sr_no": 147, "question": "______ are special effects used to define a way in which the slides appear during a slide show?\n  <br>", "option1": "Transitions \n  <br>", "option2": "Animation \n  <br>", "option3": "Themes \n  <br>", "option4": "Slide Master \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Transitions</b> are special effects used to define a way in which the slides appear during a slide show. The transition effects allow you to specify how you want to navigate from one slide to the other. \n  <br>", "question_heading": ""}, {"sr_no": 148, "question": "Which Term referring to a person who uses his or her expertise to gain access to other people’s computers to get information illegally or do damage?\n  <br>", "option1": "hacker\n  <br>", "option2": "analyst\n  <br>", "option3": "instant messenger \n  <br>", "option4": "programmer\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Hacker</b> is someone who seeks and exploits weaknesses in a computer system.\n  <br>", "question_heading": ""}, {"sr_no": 149, "question": "What does the computer Motherboard contains that house setting configurations and is powered by the onboard battery?\n  <br>", "option1": "CMOS\n  <br>", "option2": "RAM\n  <br>", "option3": "DRAM\n  <br>", "option4": "CPU\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The \n  <b>CMOS</b> is a physical part of the motherboard: it is a memory chip that houses setting configurations and is powered by the onboard battery. The CMOS is reset and loses all custom settings in case the battery runs out of energy, additionally, the system clock resets when the CMOS loses power.\n  <br>", "question_heading": ""}, {"sr_no": 150, "question": "Which of the following generations of computers used transistors for the first time? \n  <br>", "option1": "First generation \n  <br>", "option2": "Second generation \n  <br>", "option3": "Third generation \n  <br>", "option4": "Fourth generation \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Bardeen and Shockley invented transistors, which replaced vacuum tubes in the \n  <b>second generation</b> of computers.\n  <br>", "question_heading": ""}];

function isImageURL(str) {

    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';

        img.alt = 'Option image';

    } else {

}

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

  }

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
