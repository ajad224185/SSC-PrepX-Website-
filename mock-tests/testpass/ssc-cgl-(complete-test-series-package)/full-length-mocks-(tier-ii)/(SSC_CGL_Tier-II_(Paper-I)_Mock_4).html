6.png\"> \n  <br>", "option3": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584682578image47.png\"> \n  <br>", "option4": "<img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584682581image48.png\"> \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "", "question_heading": ""}, {"sr_no": 61, "question": "<b>Select the most appropriate synonym of the word given in bold.</b> \n  <br>The government has taken steps to \n  <b>mitigate</b> the effects of the pandemic on the economy.\n  <br>", "option1": "Alleviate\n  <br>", "option2": "Exacerbate\n  <br>", "option3": "Pernicious\n  <br>", "option4": "Esoteric\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Mitigate means to make something less severe or intense. It is often used to describe actions taken to reduce the negative effects of something.\n  <br> Alleviate is a synonym of mitigate, meaning to make something less severe or to ease its impact.\n  <br> Synonyms: \n  <b>alleviate</b>, ease, reduce, lessen, diminish. \n  <br> Antonyms: worsen, intensify, aggravate, exacerbate, heighten.\n  <br>Meanings of the other given words:\n  <br> Exacerbate: to make something worse or more intense, antonym of alleviate and synonym of aggravate and intensify.\n  <br> Pernicious: Having a harmful or destructive effect, often in a gradual or subtle way.\n  <br> Esoteric: Intended for or understood by only a small number of people with specialized knowledge or interest.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "<b>Select the most appropriate option to fill in the blank in the given sentence.</b> \n  <br>The _____________ of the company's success is its focus on innovation and customer satisfaction.\n  <br>", "option1": "envelope\n  <br>", "option2": "prominence\n  <br>", "option3": "facade\n  <br>", "option4": "foundation\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is option (d) foundation.\n  <br> The word \"foundation\" refers to the base or underlying principle of something. \n  <br> In the given sentence, it implies that the company's focus on innovation and customer satisfaction is the fundamental reason for its success. \n  <br> Prominence refers to the state or quality of being important, noticeable, or distinguished. \n  <br> “Facade\" and \"envelope\" do not fit the context of the sentence as they refer to the outer surface or appearance of something.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "<b>Select the most appropriate option to fill in the blank in the given sentence.</b> \n  <br>The teacher's ____________ approach to discipline has resulted in a well-behaved and motivated class.\n  <br>", "option1": "Permissive\n  <br>", "option2": "Autocratic\n  <br>", "option3": "Clandestine\n  <br>", "option4": "Authoritative\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is (d) Authoritative.\n  <br> The word \"authoritative\" means commanding or leading with confidence and authority. In the given sentence, it implies that the teacher's approach to discipline is firm and decisive, yet fair and respectful of the students' needs and opinions. \n  <br> This has resulted in a well-behaved and motivated class. \n  <br> On the other hand, \"autocratic\" refers to a dictatorial and oppressive approach, while “clandestine” means kept or done in secret, often to conceal something illicit or improper.\n  <br> \"Permissive\" implies a lenient and indulgent attitude, which is not suitable for maintaining discipline in a classroom setting.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "Select the sentence with no grammatical errors.\n  <br>", "option1": "Each of the students in the class are required to complete the assignment.\n  <br>", "option2": "Despite the rain, the match was continued.\n  <br>", "option3": "The team's performance has been affected by their lack of training.\n  <br>", "option4": "There's no way of knowing weather the meeting will be cancelled.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The sentence with no grammatical errors is option (c) \"The team's performance has been affected by their lack of training.\"\n  <br> Option (a) has a subject-verb agreement error. \"Each\" is singular, so it should be \"Each of the students in the class is required to complete the assignment.\"\n  <br> Option (b) has a tense agreement error. \"was continued\" should be \"continued\" to maintain past tense.\n  <br> Option (d) has spelling error; \"weather\" should be \"whether\".\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "<b>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given.</b> \n  <br>From the options P, Q, R, and S select the appropriate sentences for S2 and S3, respectively.\n  <br>(S1) One sunny morning, as Lily strolled along a narrow path lined with wildflowers, she stumbled upon an old, weathered book lying beneath a towering oak tree.\n  <br>(S2)\n  <br>(S3)\n  <br>(S4) The garden was said to grant wishes to those who found its entrance and possessed a pure heart.\n  <br> (P) She spent hours poring over maps and listening to the stories passed down by village elders, hoping to uncover clues that would lead her to the garden's gate.\n  <br>(Q) Driven by an overwhelming desire to uncover this hidden wonder, Lily embarked on a quest to locate the secret garden.\n  <br>(R) With excitement shining in her eyes, she picked it up and dusted off its worn cover. The title, \"The Secret Garden,\" was embossed in elegant gold letters.\n  <br>(S) Intrigued, Lily eagerly opened the book and was immediately captivated by its enchanting tale. It spoke of a hidden garden, filled with vibrant blooms and magical creatures, tucked away in a forgotten corner of the village.\n  <br>(T) Days turned into weeks, and Lily's determination remained unyielding.\n  <br>", "option1": "P, Q\n  <br>", "option2": "Q, R\n  <br>", "option3": "P, T\n  <br>", "option4": "R, S\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given paragraph, sentence S1 sets the scene by describing Lily stumbling upon an old book in a beautiful setting. To continue the story, we need to provide an explanation for Lily's interest in the book and her subsequent actions.\n  <br> Sentence S4 states that the garden grants wish to those who find its entrance and possess a pure heart. \n  <br> Sentence R follows the logical progression of the story. It describes Lily's immediate action after discovering the old book. She feels excitement and curiosity as she examines the book and discovers its title.\n  <br> Sentence S provides further details about Lily's experience with the book. It explains that upon opening it, she becomes captivated by the story it contains. The story describes a hidden garden with magical elements, which is intriguing to Lily.\n  <br> Therefore, the correct answer is option (d) R, S.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "<b>Select the most appropriate ANTONYM of the word given in bold.</b> \n  <br>The team's performance was \n  <b>lacklustre</b> and disappointing.\n  <br>", "option1": "Egregious\n  <br>", "option2": "Brilliant\n  <br>", "option3": "Vicissitude\n  <br>", "option4": "Successful\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Lacklustre refers to something that is dull, lacking brilliance, or lacking in vitality or excitement.\n  <br> Brilliant means shining brightly, exceptionally clever or talented.\n  <br> Thus, the most appropriate antonym of the word \"lacklustre\" is (b) Brilliant.\n  <br> Antonyms: \n  <b>brilliant</b>, dazzling, excellent, outstanding. \n  <br> Synonyms: dull, boring, uninspired, unimpressive.\n  <br>Meanings of the other given words:\n  <br> Egregious: Outstandingly bad or shocking. \n  <br> Vicissitude: change or variation occurring in the course of something, often characterized by unpredictability or fluctuation.\n  <br> Successful: accomplishing an aim or purpose; having achieved popularity, profit, or distinction.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "<b>Select the most appropriate meaning of the highlighted idiom or phrase.</b> \n  <br>When faced with adversity, Mark decided \n  <b>to take the bull by the horns</b> and confront the situation head-on.\n  <br>", "option1": "To physically grab a bull by the horns\n  <br>", "option2": "To avoid confronting challenges\n  <br>", "option3": "To deal with a difficult situation boldly and directly\n  <br>", "option4": "To seek assistance from others in handling challenges\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the highlighted idiom \"take the bull by the horns\" in this context is (c) To deal with a difficult situation boldly and directly.\n  <br> To \"take the bull by the horns\" means to confront a challenging or difficult situation directly and assertively, without hesitation or fear. It implies that a person is taking control of the situation and facing it head-on.\n  <br> Example: Instead of avoiding the problem or seeking help from others, he decided to take the bull by the horns and started a new venture with determination and hard work.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the option with the INCORRECTLY spelt word in the given sentences.\n  <br>", "option1": "He was determined to persue his dream of becoming a musician.\n  <br>", "option2": "The company's annual report provides a comprehensive overview of its finances.\n  <br>", "option3": "The senator was accused of committing several crimes while in office.\n  <br>", "option4": "The book is a collection of short stories written by various authors.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option with the incorrectly spelt word is in option (a) He was determined to persue his dream of becoming a musician.\n  <br>The correct spelling of the word should be \"pursue\" instead of \"persue.\"\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Select the option that is the active or passive form of the given sentence.\n  <br>The project was completed ahead of schedule by the construction team.\n  <br>", "option1": "The construction team had completed the project ahead of schedule.\n  <br>", "option2": "The project had been completed ahead of schedule by the construction team.\n  <br>", "option3": "The construction team completed the project ahead of schedule.\n  <br>", "option4": "The project was being completed ahead of schedule by the construction team.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of passive voice having form:\n  <br> Obj. + was / were + V3 + by + sub.\n  <br> When it is converted into active voice, following rule is followed:\n  <br> Sub + V2 + obj.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "In the following question, choose the option that reflects the correct spelling of the word.\n  <br>", "option1": "Hinderrance\n  <br>", "option2": "Hindarance\n  <br>", "option3": "Hindrance\n  <br>", "option4": "Hinderancee\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that reflects the correct spelling of the word is option (c) Hindrance.\n  <br> The word \"hindrance\" means something that impedes or obstructs progress or movement, or an obstacle that makes it difficult to accomplish a task or goal. \n  <br>It can also refer to a person or thing that causes delays or difficulties.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Given below are four jumbled sentences. Select the option that gives the correct order.\n  <br>A. He searched high and low for his missing keys, but they were nowhere to be found.\n  <br>B. Frustrated, he started to retrace his steps from earlier that day.\n  <br>C. Eventually, he found them lying on the kitchen counter where he had absent-mindedly left them.\n  <br>D. He had a sinking feeling in his stomach as he realized he might have lost them for good.\n  <br>", "option1": "DABC\n  <br>", "option2": "BDAC\n  <br>", "option3": "ACBD\n  <br>", "option4": "ADBC\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of the jumbled sentences is (d) ADBC.\n  <br> First, he searches high and low for his missing keys in sentence A. \n  <br> Then, in sentence D, he has a sinking feeling in his stomach as he realizes he might have lost them for good.\n  <br> In sentence B, he starts to retrace his steps from earlier that day.\n  <br> Finally, in sentence C, he finds them lying on the kitchen counter where he had absent-mindedly left them.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "<b>Select the option that is the indirect form of the given sentence.</b> \n  <br>Radhika said to her friend, “I have been waiting here for a long time.”\n  <br>", "option1": "Radhika told her friend that she has been waiting there for a long time.\n  <br>", "option2": "Radhika told her friend that she was being waiting here for a long time.\n  <br>", "option3": "Radhika told her friend that she had been waiting there for a long time.\n  <br>", "option4": "Radhika told her friend that she must be waiting there for a long time.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech -</b> Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Assertive Sentence.’\n  <br> Sentences that make a statement are called assertive sentences. These sentences may be positive, negative, false, or true statements.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> The given sentence is in present perfect continuous tense.\n  <br> ‘Here’ changes to ‘There’.\n  <br> Reported Verb– ‘Said to’ changes to ‘Told.’\n  <br> Conjunction– In the Assertive sentence conjunction ‘That’ is used.\n  <br> Tense- Present Perfect Continuous changes to Past Perfect Continuous tense.\n  <br> The sentence thus formed is - Radhika told her friend that she had been waiting there for a long time.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "<b>Select the option that is the passive form of the given sentence.</b> \n  <br>The manager is reviewing the performance reports of the team members.\n  <br>", "option1": "The manager is reviewing the performance reports of the team members.\n  <br>", "option2": "The performance reports of the team members are reviewed by the manager.\n  <br>", "option3": "The manager reviews the performance reports of the team members.\n  <br>", "option4": "The performance reports of the team members are being reviewed by the manager.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having form:\n  <br> Subject + is/am/are+ v1+ ing + object.\n  <br> When it is converted into passive voice, following rule is followed:\n  <br> Object+ is/am/are+ being+ V3+ by + subject.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "<b>Select the option that is the passive form of the given sentence.</b> \n  <br>Did she finish her homework in time?\n  <br>", "option1": "Was her homework finished by her in time?\n  <br>", "option2": "Did her homework finish in time by her?\n  <br>", "option3": "Was her homework being finished in time by her?\n  <br>", "option4": "Was her homework finishing in time by her?\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br> \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br> The sentence is an example of active voice having form:\n  <br> Did+ subject+V1+ object+?\n  <br> When it is converted into passive voice, following rule is followed:\n  <br> Was/were + Object+ V3+ by subject +?\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "<b>Select the option that is the indirect form of the given sentence.</b> \n  <br>Rajesh said to Sheetal, ‘When do you intend to pay back the money you borrowed from me?”\n  <br>", "option1": "Rajesh enquired Sheetal when did she intend to pay back the money, she borrowed from him.\n  <br>", "option2": "Rajesh asked Sheetal when she will be intending to pay back the money, she had borrowed from him.\n  <br>", "option3": "Rajesh enquired Sheetal when she intended to pay back the money, she had borrowed from him.\n  <br>", "option4": "Rajesh asked Sheetal if she would be intended to pay back the money, she had borrowed from him.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option c.\n  <br> The given sentence is of ‘direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> \n  <b>Indirect Speech</b> - Reporting the message of the speaker in our own words.\n  <br> The given sentence is an ‘Interrogative sentence.’\n  <br> Sentences that ask questions are called interrogative sentences. Every interrogative sentence ends with a question mark. There are two main kinds of interrogative sentences. Those which start with an auxiliary verb and those which start with a question word such as what, why, when, where, how etc.\n  <br> While changing it into indirect form, we consider following rules.\n  <br> Change the question into a Statement.\n  <br> Reported Verb– ‘Said to’ changes to ‘Enquired’.\n  <br> Conjunction– Wh-word itself will act as a conjunction.\n  <br> Tense- Past Simple Tense changes into Past Perfect Tense.\n  <br> The sentence thus formed is - Rajesh enquired Sheetal when she intended to pay back the money, she had borrowed from him.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "<b>Select the most appropriate option for blank no. 1.</b> \n  <br>", "option1": "afterwards\n  <br>", "option2": "before\n  <br>", "option3": "upon\n  <br>", "option4": "with\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'with' to make the sentence grammatically and contextually correct. \n  <br> The use of \"with\" suggests that the invention of the assembly line was closely associated with or accompanied by the positive changes in affordability and accessibility. \n  <br>Meaning of other words:\n  <br> Afterwards: following in time or place; subsequently.\n  <br> Before: at an earlier time; previously.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "<b>Select the most appropriate option for blank no. 2.</b> \n  <br>", "option1": "accessible\n  <br>", "option2": "restricted\n  <br>", "option3": "exclusive\n  <br>", "option4": "lavish\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'accessible' to make the sentence grammatically and contextually correct. \n  <br> 'Accessible' means able to be reached or entered. As per the context, it is appropriate to use 'accessible' here to indicate that after the invention of the assembly line, automobiles became more affordable and accessible to the middle class.\n  <br>Meaning of other words:\n  <br> Restrict: limited; subject to restrictions or limitations.\n  <br> Exclusive: restricted or limited to the person, group, or area concerned.\n  <br> Lavish: sumptuously rich, elaborate, or luxurious.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "<b>Select the most appropriate option for blank no. 3.</b> \n  <br>", "option1": "easy\n  <br>", "option2": "easily\n  <br>", "option3": "ease\n  <br>", "option4": "easier\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option for blank no. 3 would be (b) easily.\n  <br> The sentence structure requires an adverb to modify the verb \"travel.\" Since \"easily\" is an adverb, it fits grammatically in the sentence to convey that people were able to travel long distances quickly and without difficulty. \n  <br> The other options, (a) easy, (c) ease, and (d) easier, are either an adjective or a comparative form, which do not fit the context and structure of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "<b>Select the most appropriate option for blank no. 4.</b> \n  <br>", "option1": "enabled\n  <br>", "option2": "prevented\n  <br>", "option3": "ignored\n  <br>", "option4": "decreased\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is 'enabled' to make the sentence grammatically and contextually correct. \n  <br> 'Enabled' means to give someone or something the authority, means, or opportunity to do something. \n  <br> As per the context, it is appropriate to use 'enabled' here to indicate that the automobile enabled changes in the manufacturing industry, leading to the development of new technologies and a shift towards mass production.\n  <br>Meaning of other words:\n  <br> Prevented: kept (someone or something) from doing something; made impossible.\n  <br> Ignored: refused to take notice of or acknowledge; disregarded.\n  <br> Decreased: made less in size, amount, or degree.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "<b>Select the most appropriate option for blank no. 5.</b> \n  <br>", "option1": "inducing\n  <br>", "option2": "inciting\n  <br>", "option3": "poses\n  <br>", "option4": "limits\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The blank is filled with \"poses\" because it accurately describes the relationship between the automobile and the challenges mentioned in the sentence. \n  <br> In this context, \"poses\" means that the automobile presents or creates significant challenges.\n  <br>Meaning of other words:\n  <br> Induce - to bring about or give rise to something (positive).\n  <br> Incite - to encourage or stir up (usually negative emotions or actions).\n  <br> Limits - to restrict or restrain something in some way.\n  <br> Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Identify the segment in the given sentence which contains the grammatical error.\n  <br>The gang that had stolen the jewellery were caught red-handed by the police.\n  <br>", "option1": "The gang\n  <br>", "option2": "that had stolen the jewellery\n  <br>", "option3": "were caught red-handed\n  <br>", "option4": "no error\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The grammatical error in the sentence relates to subject-verb agreement. \n  <br> The verb in a sentence should agree with its subject in terms of number (singular or plural).\n  <br> In this case, the subject is \"gang,\" which is a singular noun. According to the subject-verb agreement rule, a singular subject should be paired with a singular verb. \n  <br> Therefore, the correct form of the verb to use is \"was,\" not \"were.\"\n  <br> The corrected sentence adheres to the rule and maintains subject-verb agreement: \"The gang that had stolen the jewellery was caught red-handed by the police.\"\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Select the option that is the indirect form of the given sentence.\n  <br>His parents said, “Bravo! You have done very well.”\n  <br>", "option1": "His parents applauded him, saying that he had done very well.\n  <br>", "option2": "His parents exclaimed that he has done very well.\n  <br>", "option3": "His parents exclaimed that he has been doing very well.\n  <br>", "option4": "His parents applauded that he had been doing very well.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br> The given sentence is ‘Direct Speech’.\n  <br> \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br> The given sentence is an ‘Exclamatory Sentence.’\n  <br> \n  <b>Exclamatory Sentence</b> - Exclamatory sentences express a sudden outburst of some emotions such as joy, sorrow, contempt, regret, surprise etc.\n  <br> While changing it into an indirect form, we consider following rules.\n  <br> Tense- Present perfect (Subject + has/have+V3+Object) changes to Past perfect (Subject+had+V3+Object)\n  <br> Reported Verb – ‘Said changes to ‘Applauded’.\n  <br> Conjunction– In the Exclamatory sentence conjunction ‘That’ is used.\n  <br> The sentence thus formed is - His parents applauded him, saying that he had done very well.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the most appropriate meaning of the given idiom.\n  <br>To let the grass grow under one's feet\n  <br>", "option1": "To actively participate in gardening \n  <br>", "option2": "To engage in leisurely activities\n  <br>", "option3": "To let time pass without taking action\n  <br>", "option4": "To avoid walking on grassy areas\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate meaning of the idiom \"to let the grass grow under one's feet\" is option (c) To let time pass without taking action.\n  <br> This idiom is used to describe someone who is procrastinating or being inactive, allowing opportunities to slip away or tasks to remain unfinished. It implies a lack of urgency or initiative in taking necessary actions. \n  <br> Example: Aman has been unemployed for months, but he's been letting the grass grow under his feet instead of actively searching for a job.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the most appropriate option to fill in the blank in the given sentence.\n  <br>The author’s writing style was so ______ that it made the book hard to put down.\n  <br>", "option1": "Perspicacious\n  <br>", "option2": "Mellifluous\n  <br>", "option3": "Serendipitous\n  <br>", "option4": "Riveting\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank in the given sentence is option (d) riveting.\n  <br> In the context of the sentence, the word \"riveting\" fits best as it indicates that the author's writing style was so captivating, engrossing, or compelling that it made the book hard to put down. It suggests that the book was interesting and held the reader's attention. \n  <br>Other options do not convey the same meaning as \"riveting\" and would not fit well in the given sentence.\n  <br> Perspicacious: Having a keen mental perception and understanding; being able to grasp things quickly and accurately.\n  <br> Mellifluous: Having a smooth, pleasant, and musical sound; often used to describe someone's voice or speech.\n  <br> Serendipitous: refers to the occurrence of finding valuable or pleasant things by chance or accident.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the option that will improve the segment in bold of the given sentence.\n  <br>In case no improvement is needed, select ‘No improvement.’\n  <br>The talented musician \n  <b>is playing the piano</b> since she was five years old.\n  <br>", "option1": "is being playing the piano \n  <br>", "option2": "have played the piano \n  <br>", "option3": "had been playing the piano \n  <br>", "option4": "No improvement\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option to improve the segment in bold is option (c) had been playing the piano.\n  <br> The original sentence is in the present perfect continuous tense, which implies an action that started in the past and is still ongoing. \n  <br> However, since the sentence mentions that the musician started playing the piano when she was five years old, we need to use the past perfect continuous tense to convey the ongoing action in the past.\n  <br> Option (c), \"had been playing the piano,\" is the correct choice as it uses the past perfect continuous tense. This option indicates that the musician started playing the piano in the past and continued playing it up until the present time.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Select the most appropriate synonym of the word given in bold.\n  <br>His \n  <b>insatiable</b> appetite for knowledge was evident in his constant reading.\n  <br>", "option1": "Ephemeral\n  <br>", "option2": "Incurable\n  <br>", "option3": "Unquenchable\n  <br>", "option4": "Unrestrainable\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Insatiable means having an intense or unquenchable appetite or desire that cannot be satisfied.\n  <br> Unquenchable means incapable of being satisfied or quenched, similar to \"insatiable.\"\n  <br> Antonyms: Satisfied, content.\n  <br> Synonyms: \n  <b>Unquenchable</b>, ravenous, voracious, greedy, craving.\n  <br>Meanings of the other given words:\n  <br> Ephemeral- lasting for a very short time, transient, or fleeting.\n  <br> Incurable - not able to be cured.\n  <br> Unrestrainable - unable to be controlled or restrained.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Identify the segment in the given sentence which contains the grammatical error.\n  <br>If I would have realized what a malevolent person he is, I would have discarded his friendship.\n  <br>", "option1": "If I would have realised\n  <br>", "option2": "what a malevolent person he is,\n  <br>", "option3": "I would have discarded\n  <br>", "option4": "No error\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in part (a) of the sentence.\n  <br>  The correct form in the past unreal conditional construction is \"If I had realized,\" not \"If I would have realized.\"\n  <br> In the past unreal conditional, the conditional clause should use \"had\" followed by the past participle form of the verb to indicate a hypothetical or unrealized condition in the past. \n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "Select the word which means the same as the group of words given.\n  <br>A group of people who work together towards a common goal, often combining their skills and resources.\n  <br>", "option1": "Resilience\n  <br>", "option2": "Melancholic\n  <br>", "option3": "Enigma\n  <br>", "option4": "Cohort\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the given words:\n  <br> Resilience refers to the ability to bounce back or recover quickly from difficulties or challenges. \n  <br> Melancholic: feeling of deep sadness or sorrow. \n  <br> Enigma refers to something that is mysterious, puzzling, or difficult to understand. \n  <br> A cohort is a group of people who share a common characteristic, purpose, or experience. In the given context, it specifically refers to a group of people who work together towards a common goal, often combining their skills and resources.\n  <br> Among these options, the word that best matches the meaning of a group of people working together towards a common goal is \"cohort.\"\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "Select the word which means the same as the group of words given.\n  <br>A group of people who are expert in a particular field and are often called upon to give their opinion.\n  <br>", "option1": "Consortium\n  <br>", "option2": "Cacophonic\n  <br>", "option3": "Coterie\n  <br>", "option4": "Conglobe\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that means the same as the group of words given is option (c) Coterie.\n  <br> The word \"coterie\" refers to a small group of people who share a common interest or expertise in a particular field and are often called upon to give their opinion or advice. It implies a close-knit group of individuals who are knowledgeable and respected in their field. \n  <br>Other options do not have the same meaning as the given group of words:\n  <br> Consortium: Refers to an association or partnership of organizations or individuals for a specific purpose, often related to business or commerce.\n  <br> Cacophonic: Refers to a harsh, discordant mixture of sounds or voices.\n  <br> Conglobe can be understood as a verb meaning to gather, accumulate, or form into a rounded or globular shape.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "Select the most appropriate ANTONYM of the given word.\n  <br>Monotonous\n  <br>", "option1": "Disastrous\n  <br>", "option2": "Ineffable\n  <br>", "option3": "Pernicious\n  <br>", "option4": "Interesting\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Monotonous means lacking in variety and interest, tedious repetition or routine.\n  <br> Synonyms: boring, dull, repetitive.\n  <br> Antonyms: \n  <b>interesting</b>, exciting, varied.\n  <br> Therefore, the most appropriate antonym of Monotonous would be (d) Interesting, which means engaging and capturing one's attention.\n  <br>Meanings of other given words:\n  <br> Disastrous - causing great damage.\n  <br> Ineffable - Too great or intense to be expressed or described in words.\n  <br> Pernicious - Having a harmful or destructive effect, often in a subtle or gradual manner.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "<b>What did Tom find when he opened the hidden door in the secret room?</b> \n  <br>", "option1": "Clues about his parents' secret\n  <br>", "option2": "A cursed amulet\n  <br>", "option3": "Treasure hidden in a large box\n  <br>", "option4": "Nothing except an old box\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom found a hidden door in the secret room of his house. However, when he opened it, he was dismayed to find that there was nothing inside except an old box.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "<b>Why did Tom feel guilty after possessing the cursed amulet?</b> \n  <br>", "option1": "He realized he had hurt innocent people\n  <br>", "option2": "He was afraid of getting caught by his parents\n  <br>", "option3": "He lost his curiosity\n  <br>", "option4": "He found out the amulet was fake\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom initially revelled in his newfound power after possessing the cursed amulet and caused chaos wherever he went. However, soon he realized that his actions were hurting innocent people, which made him feel guilty.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "<b>What was Tom's personality trait that led him to open the box inside the secret room?</b> \n  <br>", "option1": "Fear\n  <br>", "option2": "Laziness\n  <br>", "option3": "Curiosity\n  <br>", "option4": "Avarice\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom was a young and curious boy who was always poking his nose where it didn't belong. His curiosity led him to open the box inside the secret room in his house, hoping to find something exciting.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "<b>How did Tom feel initially after possessing the cursed amulet?</b> \n  <br>", "option1": "Guilty\n  <br>", "option2": "Proud\n  <br>", "option3": "Excited\n  <br>", "option4": "Indifferent\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom initially revelled in his newfound power after possessing the cursed amulet and caused chaos wherever he went. This indicates that he felt excited about the power he obtained from the amulet.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "<b>What did Tom learn from his experience with the cursed amulet?</b> \n  <br>", "option1": "It's better to know everything\n  <br>", "option2": "Curiosity can be satisfied\n  <br>", "option3": "Sometimes it's better not to know\n  <br>", "option4": "Curiosity is always harmless\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the passage, it is mentioned that Tom realized that his curiosity had led him down a dangerous path and that he needed to let go of his desire to know everything. This suggests that he learned that sometimes, it's better not to know and curiosity can never truly be satisfied.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "<b>What is co-firing?</b> \n  <br>", "option1": "The process of extracting energy from coal alone.\n  <br>", "option2": "The process of mixing two types of fuel together in a combustion chamber to create energy.\n  <br>", "option3": "The process of using biomass in power generation alone.\n  <br>", "option4": "The process of converting biomass into coal.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Co-firing refers to the process of mixing two types of fuel, usually biomass and coal, together in a combustion chamber to generate energy.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "<b>What is the National Bio-Energy Mission?</b> \n  <br>", "option1": "A mission to promote the use of biomass in power generation, including co-firing with coal.\n  <br>", "option2": "A mission to promote the use of coal in power generation.\n  <br>", "option3": "A mission to promote the use of solar power.\n  <br>", "option4": "A mission to promote the use of wind power.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The National Bio-Energy Mission is a government initiative in India aimed at promoting the use of biomass in power generation, including co-firing with coal, as a means to achieve reliable and affordable energy while minimizing environmental impact.\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "<b>What are the advantages of co-firing?</b> \n  <br>", "option1": "The reduction of greenhouse gas emissions and the reduction of dependence on fossil fuels.\n  <br>", "option2": "The increase of greenhouse gas emissions and the increase of dependence on fossil fuels.\n  <br>", "option3": "The reduction of greenhouse gas emissions and the increase of dependence on fossil fuels.\n  <br>", "option4": "The increase of greenhouse gas emissions and the reduction of dependence on fossil fuels.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Co-firing has several advantages, including the reduction of greenhouse gas emissions as biomass has lower carbon content compared to coal, and the reduction of dependence on fossil fuels as biomass is a renewable source of energy.\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "<b>What are the challenges associated with the implementation of co-firing in India?</b> \n  <br>", "option1": "The availability and quality of wind energy.\n  <br>", "option2": "The availability and quality of coal and the logistical challenges associated with transporting and storing the fuel.\n  <br>", "option3": "The availability and quality of solar energy.\n  <br>", "option4": "The availability and quality of biomass and the logistical challenges associated with transporting and storing the fuel.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The challenges associated with the implementation of co-firing in India include the availability and quality of biomass, as well as the logistical challenges related to transporting and storing the fuel.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "<b>What is the main objective of India's policy on co-firing bio-mass?</b> \n  <br>", "option1": "To encourage the use of natural gas for power generation\n  <br>", "option2": "To promote the use of bio-mass as the sole fuel source\n  <br>", "option3": "To reduce the dependence on imported fossil fuels\n  <br>", "option4": "To increase the carbon emissions from power plants\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The main objective of India's policy on co-firing biomass is to reduce the dependence on imported fossil fuels by promoting the use of biomass in power generation, including co-firing with coal, as a sustainable and renewable energy source.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "<b>What is India's policy regarding the use of renewable energy in data centres?</b> \n  <br>", "option1": "The government is not promoting the use of renewable energy sources in data centres.\n  <br>", "option2": "The government is encouraging global tech companies to invest in setting up data centres in India that run on renewable energy sources.\n  <br>", "option3": "The government is promoting the use of diesel generators to power data centres.\n  <br>", "option4": "The government has not introduced any policies regarding the use of renewable energy in data centres.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "India's policy regarding the use of renewable energy in data centres is that the government is encouraging global tech companies to invest in setting up data centres in India that run on renewable energy sources. This means that the government is promoting the use of green data centres powered by renewable energy like solar or wind power.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "<b>What are the benefits of using renewable energy in data centres according to India's new policy?</b> \n  <br>", "option1": "Tax exemptions and access to cheaper labor.\n  <br>", "option2": "Faster clearances and access to cheaper land.\n  <br>", "option3": "Tax exemptions and access to cheaper land.\n  <br>", "option4": "Faster clearances and access to cheaper labor.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The benefits of using renewable energy in data centres according to India's new policy are faster clearances and access to cheaper land. This means that data centres that use renewable energy sources are eligible for these benefits, which can incentivize companies to invest in green data centres in India.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "<b>What is the Indian government's target for renewable energy capacity by 2022?</b> \n  <br>", "option1": "175 GW, with 50 GW coming from solar power.\n  <br>", "option2": "175 GW, with 100 GW coming from solar power.\n  <br>", "option3": "100 GW, with 50 GW coming from solar power.\n  <br>", "option4": "100 GW, with 100 GW coming from solar power.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "India's target for renewable energy capacity by 2022 is 175 GW, with 100 GW coming from solar power. This means that India aims to achieve a total of 175 GW of renewable energy capacity by 2022, with solar power contributing 100 GW to this target.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "<b>Which global tech companies have invested in green data centres in India?</b> \n  <br>", "option1": "Microsoft, Google, and Amazon.\n  <br>", "option2": "IBM, HP, and Dell.\n  <br>", "option3": "Facebook, Twitter, and Instagram.\n  <br>", "option4": "Apple, Samsung, and LG.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The global tech companies that have invested in green data centres in India, according to the passage, are Microsoft, Google, and Amazon. This means that these companies are recognized for their investments in data centres that use renewable energy sources in India.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "<b>What is driving the demand for green data-centres in India, according to the passage?</b> \n  <br>", "option1": "The growth of the Indian economy\n  <br>", "option2": "The desire to reduce India's carbon footprint\n  <br>", "option3": "The increasing use of data and digital technologies in India\n  <br>", "option4": "The availability of renewable energy sources in India\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The demand for green data centres in India is being driven by the increasing use of data and digital technologies in the country. This means that as the demand for digital services grows in India, the need for data centres that are powered by renewable energy sources is also increasing, potentially to reduce the country's carbon footprint and promote sustainability.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "Which ruler's wife was sad about his alcohol habits and committed suicide?\n  <br>", "option1": "Shah Jahan\n  <br>", "option2": "Babur\n  <br>", "option3": "Jahangir\n  <br>", "option4": "Akbar\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c), Jahangir. Jahangir's wife, Manbhawati (also known as Shah Begum), was sad about his alcohol habits and committed suicide in 1605. \n  <br>Shah Begum was the first wife and chief consort of Prince Salim (later Emperor Jahangir). She was known as Zan-i-Kalan being the first wife of Salim. \n  <br>She was a Rajput princess by birth and committed suicide shortly before the succession of her husband to the royal throne.\n  <br>Manbhawati Bai, known popularly as Maan Bai, was the daughter of Raja Bhagwant Das, the ruler of Amer.\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "Which road plan in India was the first attempt for the Road Development Programme between 1943-1963?\n  <br>", "option1": "Poona Road Plan\n  <br>", "option2": "Nagpur Road Plan\n  <br>", "option3": "Bombay Road Plan\n  <br>", "option4": "Lucknow Road Plan\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Nagpur Road Plan was the first comprehensive attempt to develop a national road network in India. It was formulated by the Central Road Research Institute in 1943 and was in operation until 1963. The plan was based on the principle of linking major ports, state capitals, and large industrial centers with a network of national highways.\n  <br>Under the Nagpur Road Plan, a total of 7,000 miles of highways were constructed, including the Grand Trunk Road that connects Kolkata to Delhi. The plan also involved the construction of bridges, flyovers, and other infrastructure to support the road network.\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "Identify an example of decomposers that are found in the bottom of a pond.\n  <br>", "option1": "Zooplankton\n  <br>", "option2": "Jellyfishes\n  <br>", "option3": "Flagellates\n  <br>", "option4": "Phytoplankton\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "An example of decomposers that are found in the bottom of a pond are Flagellates. Flagellates are single-celled organisms that are found in aquatic environments and are known for their ability to decompose organic matter. \n  <br> They play an important role in the nutrient cycling process by breaking down dead plant and animal matter into simpler compounds that can be reused by other organisms. \n  <br> Flagellates are often found in the sediment at the bottom of ponds, where they feed on decaying organic matter.\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "Sultan Mahmud of Ghazni was a contemporary of which Chola king?\n  <br>", "option1": "Rajaraja I\n  <br>", "option2": "Rajendra II\n  <br>", "option3": "Rajadhiraja\n  <br>", "option4": "Rajendra I\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sultan Mahmud of Ghazni was a contemporary of the Chola king, Rajendra I. \n  <br> Rajendra Chola I, often referred to as Rajendra the Great, and also known as Gangaikonda Cholan, and Kadaram Kondan was a Chola Emperor who reigned between 1014 and 1044 CE. \n  <br> Sultan Mahmud of Ghazni was a powerful ruler of the Ghaznavid dynasty in present-day Afghanistan and Pakistan. He launched several raids into India, including 17 raids into the Indian subcontinent between 1000 and 1027 CE, during the reigns of Rajaraja Chola I and his son Rajendra Chola I.\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "Match the following Indian research institutions with their locations:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584682581image49.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct match for the research institutions and their locations is as follows:\n  <br> A. Tata Institute of Fundamental Research (TIFR) is located in Mumbai, India.\n  <br>B. Indian Institute of Astrophysics (IIA) is located in Bengaluru, India.\n  <br>C. National Institute of Oceanography (NIO) is located in Goa, India.\n  <br>D. Central Drug Research Institute (CDRI) is located in Lucknow, India.\n  <br> So, the correct answer is (a) 1 2 3 4.\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "Which of the following statements is/are correct regarding the Atal Pension Yojana?\n  <br>A. The scheme is a government-backed pension scheme in India targeted at the unorganized sector.\n  <br>B. It was originally mentioned in the 2015 Budget speech by the then Finance Minister Arun Jaitley.\n  <br>C. It promises a fixed minimum pension to the subscribers, ranging between Rs. 1000 to Rs. 5000 per month.\n  <br>", "option1": "A and B only\n  <br>", "option2": "B and C only\n  <br>", "option3": "A and C only\n  <br>", "option4": "A, B, and C\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) A, B, and C. All the statements are correct regarding the Atal Pension Yojana.\n  <br>The Atal Pension Yojana (APY) is a government-backed pension scheme in India, primarily targeted at the unorganized sector. It was mentioned in the 2015 Budget speech by the then Finance Minister Arun Jaitley. It was launched by Prime Minister Narendra Modi on 9 May 2015 in Kolkata. The scheme promises a fixed minimum pension to the subscribers, ranging between Rs. 1000 to Rs. 5000 per month.\n  <br>This scheme was named after Atal Bihari Vajpayee, former prime minister of India\n  <br> So, all statements A, B, and C regarding the Atal Pension Yojana are correct. Therefore, the answer is (d) A, B, and C.\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "What is the correct order of radiations in descending order of frequencies?\n  <br>", "option1": "Infrared > Microwaves > Radio waves > X-rays\n  <br>", "option2": "Radio waves > X-rays > Microwaves > Infrared\n  <br>", "option3": "X-rays > Infrared > Microwaves > Radio waves\n  <br>", "option4": "Infrared > Microwaves > X-rays > Radio waves\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of radiations in descending order of frequencies is: X-rays > Infrared > Microwaves > Radio waves\n  <br>So, the correct answer is (c) X-rays > Infrared > Microwaves > Radio waves.\n  <br>Light is part of a spectrum of electromagnetic energy that includes radio waves, microwaves, infrared radiation, visible light, ultraviolet \"light\", x rays, and gamma rays. \n  <br>Electromagnetic energy travels as waves that vary in wavelength. Radio waves and microwaves lie at the longer end of the spectrum of electromagnetic energy (kilometers and meters to centimeters and millimeters), while x-rays and gamma rays have very short wavelengths (billionths or trillionths of a meter). \n  <br>Infrared radiation is somewhat longer wavelengths than visible light. Visible light is simply electromagnetic radiation in a range of wavelengths that our eyes are sensitive to. \n  <br> \n  <b>Note -</b> Visible wavelengths range from 0.0007 millimeters for red light, through orange, yellow, green, and blue, to 0.0004 millimeters for violet light. Ultraviolet is shorter wavelengths than violet.\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "Match List-I with List-II and select the correct answer using the code given below the Lists: \n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694584682586image50.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct match for the straits and their corresponding countries is as follows:\n  <br> A. Bass Strait is between Australia and Tasmania.\n  <br>B. Davis Strait is between Canada and Greenland.\n  <br>C. Dover Strait is between UK and France.\n  <br>D. Florida Strait is between USA and Cuba.\n  <br> So, the correct answer is (a) 2 4 1 3.\n  <br> \n  <br>The details of these straits are as follows:\n  <br> \n  <b>The Bass Strait</b> is a sea strait separating Tasmania from the Australian mainland, specifically the state of Victoria.\n  <br> \n  <b>Davis Strait</b> is a northern arm of the Labrador Sea. It lies between mid-western Greenland and Nunavut, Canada's Baffin Island. To the north is Baffin Bay.\n  <br> \n  <b>The Strait of Dover or Dover Strait</b>, historically known as the Dover Narrows, is the strait at the narrowest part of the English Channel, marking the boundary between the Channel and the North Sea, separating Great Britain from continental Europe.\n  <br> \n  <b>The Straits of Florida</b>, Florida Straits, or Florida Strait is a strait located south-southeast of the North American mainland, generally accepted to be between the Gulf of Mexico and the Atlantic Ocean, and between the Florida Keys and Cuba.\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "Duncan Passage is located between\n  <br>", "option1": "South and Little Andaman\n  <br>", "option2": "Little and Great Nicobar\n  <br>", "option3": "North and Middle Andaman\n  <br>", "option4": "Middle and South Andaman\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Duncan Passage is a strait in the Bay of Bengal. It separates Rutland Island (part of Great Andaman and South Andaman administrative division) to the north, and Little Andaman to the south.\n  <br>Manners Strait is the branch of Duncan Passage that lies between North Cinque Island and Rutland Island.\n  <br>Therefore, the correct answer is (a) South and Little Andaman.\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "Which one among the following is not an igneous rock?\n  <br>", "option1": "Granite\n  <br>", "option2": "Basalt\n  <br>", "option3": "Gabbro\n  <br>", "option4": "Gneiss\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (d), Gneiss. Gneiss is a metamorphic rock, not an igneous rock. Igneous rocks are formed from the cooling and solidification of molten rock, while metamorphic rocks are formed from the transformation of existing rocks due to heat, pressure, or chemical changes.\n  <br> The other three options, granite, basalt, and gabbro, are all igneous rocks. Granite is a felsic igneous rock, basalt is a mafic igneous rock, and gabbro is an ultramafic igneous rock.\n  <br> Therefore, the answer is (d), Gneiss.\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "Which Article of the Constitution of India lays down that an Indian citizen has the right to use any restaurant, road or public place?\n  <br>", "option1": "Article 17 (1)\n  <br>", "option2": "Article 15 (2)\n  <br>", "option3": "Article 14 (2)\n  <br>", "option4": "Article 16 (1)\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Article 15 (2) of the Constitution of India lays down that an Indian citizen has the right to use any restaurant, road, or public place. \n  <br>It states that no citizen shall, on grounds only of religion, race, caste, sex, place of birth, or any of them, be subject to any disability, liability, restriction, or condition with regard to access to shops, public restaurants, hotels and places of public entertainment, or the use of wells, tanks, bathing ghats, roads and places of public resort maintained wholly or partly out of State funds or dedicated to the use of the general public. So, the correct answer is (b) Article 15 (2).\n  <br> \n  <b>Article 17(1)</b> abolishes untouchability and forbids its practice in any form.\n  <br> \n  <b>Article 14(2)</b> states that no citizen shall be denied equality before the law or equal protection of the laws within the territory of India.\n  <br> \n  <b>Article 16(1)</b> guarantees equality of opportunity for all citizens in matters of public employment.\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "Who among the following was \n  <b>not</b> a member of the Drafting Committee of the Constituent Assembly?\n  <br>", "option1": "N. G. Ayyangar\n  <br>", "option2": "K. M. Munshi\n  <br>", "option3": "B. N. Rau\n  <br>", "option4": "Muhammad Saadulah\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Among all the committees of the Constituent Assembly, the most important committee was the Drafting Committee set up on August 29, 1947. It was this committee that was entrusted with the task of preparing a draft of the new Constitution. It consisted of seven members. They were:\n  <br>1. Dr B R Ambedkar (Chairman)\n  <br>2. N Gopalaswamy Ayyangar\n  <br>3. Alladi Krishnaswamy Ayyar\n  <br>4. Dr K M Munshi\n  <br>5. Syed Mohammad Saadullah\n  <br>6. N Madhava Rau (He replaced B L Mitter who resigned due to ill health)\n  <br>7. T T Krishnamachari (He replaced D P Khaitan who died in 1948)\n  <br> Sir B N Rau was appointed as the Constitutional advisor to the Assembly. He was \n  <b>not</b> a member of the Drafting Committee\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "A Money Bill passed by the Lok Sabha can be held up by the Rajya Sabha for how many weeks?\n  <br>", "option1": "Two \n  <br>", "option2": "Three\n  <br>", "option3": "Four\n  <br>", "option4": "Five \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a), two. A Money Bill passed by the Lok Sabha can be held up by the Rajya Sabha for two weeks.\n  <br>A Money Bill is a bill that deals with taxation, borrowing, or expenditure. It can only be introduced in the Lok Sabha, and the Rajya Sabha cannot amend it. The Rajya Sabha can only recommend changes to a Money Bill, and the Lok Sabha can either accept or reject these recommendations. If the Rajya Sabha does not return the Money Bill to the Lok Sabha within two weeks, the Money Bill is deemed to have been passed by both Houses.\n  <br>The reason why a Money Bill can only be held up by the Rajya Sabha for two weeks is because the Lok Sabha is the more powerful House of Parliament. The Lok Sabha is directly elected by the people, while the Rajya Sabha is indirectly elected by the state legislatures. Therefore, it is considered that the will of the people should prevail when it comes to matters of taxation and expenditure.\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "A mobile phone charger is\n  <br>", "option1": "an inverter\n  <br>", "option2": "a UPS\n  <br>", "option3": "a step-down transformer\n  <br>", "option4": "a step-up transformer\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c), a step-down transformer.\n  <br>A mobile phone charger is a step-down transformer. It converts the high-voltage AC current from the mains into the low-voltage DC current that is required to charge the phone's battery.\n  <br>An inverter is a device that converts DC current into AC current. A UPS is a device that provides backup power in case of a power outage.\n  <br>Therefore, a mobile phone charger is a step-down transformer.\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "In a cricket match, while catching a fast-moving ball, a fielder in the ground gradually pulls his hands backwards with the moving ball to reduce the velocity to zero. The act represents\n  <br>", "option1": "Newton's first law of motion\n  <br>", "option2": "Newton's second law of motion\n  <br>", "option3": "Newton's third law of motion\n  <br>", "option4": "law of conservation of energy\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b). The act of gradually pulling his hands backwards with the moving ball to reduce the velocity to zero represents Newton's second law of motion.\n  <br> While catching the ball a fielder gradually pulls his hands backward with the moving ball, in doing so, the fielder increases the time during which the high velocity of the moving ball decreases to zero. Thus, the acceleration of the ball is decreased and therefore the impact of catching the fast-moving ball is also reduced. If the ball is stopped suddenly then its high velocity decreases to zero in a very short interval of time. Thus, the rate of change of momentum of the ball will be large. Therefore, a large force would have to be applied for holding the catch that may hurt the palm of the fielder. This is the application of Newton's second law of motion. \n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "Identify the correct statement with respect to unsaturated hydrocarbons.\n  <br>", "option1": "Compounds of carbon having a single bond between their carbon atoms are called unsaturated compounds.\n  <br>", "option2": "Compounds of carbon having double bonds or triple bonds between their carbon atoms are called unsaturated compounds.\n  <br>", "option3": "Compounds of carbon having single bonds between their oxygen atoms ate called unsaturated compounds.\n  <br>", "option4": "Compounds of carbon having double or triple bonds between their hydrogen atoms are called unsaturated compounds.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Compounds of carbon having double bonds or triple bonds between their carbon atoms are called \n  <b>unsaturated compounds.</b> \n  <br> Unsaturated hydrocarbons are compounds of carbon and hydrogen that contain double or triple bonds between their carbon atoms, resulting in fewer hydrogen atoms attached to the carbon skeleton than in saturated hydrocarbons, which have only single bonds. \n  <br> Examples of unsaturated hydrocarbons include alkenes, alkynes, and aromatics.\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "Some important administrative posts were hereditary during the Rashtrakuta and chola dynasties. The post ‘nagara-shereshthi’ meant? \n  <br>", "option1": "Leader of the merchant caravans\n  <br>", "option2": "Merchant of the city\n  <br>", "option3": "Important minister\n  <br>", "option4": "Chief judicial officer\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The post of \n  <b>'nagara-shreshthi'</b> was a merchant of the city during the \n  <b>Rashtrakuta</b> and \n  <b>Chola</b> dynasties in ancient India. \n  <br> The term 'nagara' refers to a city, and 'shreshthi' means merchant. \n  <br> He was responsible for managing the trade and commerce of the city. \n  <br> They were also responsible for maintaining law and order in the city and were often appointed as revenue collectors by the king. \n  <br> The position was hereditary. \n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "Which of the following is added to the national income to obtain the personal income of the households?\n  <br>", "option1": "Net interest payments\n  <br>", "option2": "Transfer payments from government and firms \n  <br>", "option3": "Undistributed profits\n  <br>", "option4": "Corporate tax\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "A \n  <b>transfer payment</b> is added to personal income while computing it from national income. \n  <br> National income refers to the total value of goods and services produced by a country during a financial year, which is calculated as the sum of household consumption (C), government expenditure (G), investment expense (I), and net exports (NX).\n  <br> Personal income, on the other hand, is the income actually received by households or individuals.\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "Who conducted an X-ray spectroscopic study of a large number of elements and showed that the frequency of X-rays emitted by an element is related to the atomic number, Z, rather than the atomic mass?\n  <br>", "option1": "Lothar Meyer\n  <br>", "option2": "Dmitri Mendeleev\n  <br>", "option3": "Henry Moseley\n  <br>", "option4": "Johann Dobereiner\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Henry Moseley</b> conducted X-ray spectroscopic studies of a large number of elements in the early 20th century and showed that the frequency of X-rays emitted by an element is related to its atomic number, Z, rather than its atomic mass.\n  <br> This led to the discovery of the concept of atomic number, which is now used to define the modern periodic table of elements.\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "Which country will host the 2025 World Conservation Congress (WCC) of the International Union for Conservation of Nature (IUCN)?\n  <br>", "option1": "United Arab Emirates (UAE) \n  <br>", "option2": "United States of America (USA) \n  <br>", "option3": "United Kingdom (UK) \n  <br>", "option4": "India\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The 2025 World Conservation Congress (WCC) of the International Union for Conservation of Nature (IUCN) will be hosted by the United Arab Emirates (UAE). \n  <br> The congress is scheduled to take place in Abu Dhabi from October 2025. \n  <br> The WCC is considered the world's largest and most important gathering of conservationists, attracting delegates from over 160 countries. \n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "According to 'The Times Higher Education Impact Rankings 2023', which university has emerged as India's highest-placed university globally?\n  <br>", "option1": "Indian Institute of Technology (IIT), Delhi\n  <br>", "option2": "Indian Institute of Technology (IIT), Bombay \n  <br>", "option3": "IISc Bangalore\n  <br>", "option4": "Amrita Vishwa Vidyapeetham, Coimbatore \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "According to 'The Times Higher Education Impact Rankings 2023', Amrita Vishwa Vidyapeetham, located in Coimbatore, has emerged as India's highest-placed university globally. \n  <br> The university is ranked at the 52nd position out of 1,591 universities worldwide. \n  <br> It stood out for its efforts in meeting the United Nations Sustainable Development Goals (UNSDGs).\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "Which state government has launched the Chief Minister's Learn and Earn scheme, aimed at teaching employable skills to the youth?\n  <br>", "option1": "Maharashtra \n  <br>", "option2": "Madhya Pradesh \n  <br>", "option3": "Manipur \n  <br>", "option4": "Mizoram\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The Chief Minister's Learn and Earn scheme has been launched by the Madhya Pradesh government. \n  <br> The scheme aims to provide employable skills to the youth and offers them an allowance of Rs 8,000 to 10,000. \n  <br> As part of the scheme, 703 work areas have been identified for training, and at least one lakh youth would be trained. \n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "Which country has retained the World Squash Championship title?\n  <br>", "option1": "Egypt\n  <br>", "option2": "Malaysia\n  <br>", "option3": "India\n  <br>", "option4": "China\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Egypt has retained the World Squash Championship. Egypt beat Malaysia 2-1 in the final in Chennai. Malaysia won the silver. The third place was shared jointly by hosts India and Japan.\n  <br>The event took place in Chicago, United States from 3 to 11 May 2023. It was the third time that Chicago hosted the PSA World Championships after the 2018–19 & 2020–21 editions.\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "Wुय iौ पुध ोहपुयन ाnयथn ीयन Pिहiपशधन Pनप्रध-थinning nयॅिधस ौहcु ोौ \"Tुध Rयोक\" ोnक \"Nय Cयहnपनद ीयन Oिक Mधn\"?", "option1": "Ernest Hemingway\n  <br>", "option2": "Cormac McCarthy\n  <br>", "optio
