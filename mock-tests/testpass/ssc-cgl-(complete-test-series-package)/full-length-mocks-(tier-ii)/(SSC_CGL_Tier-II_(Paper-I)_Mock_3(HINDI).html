न किया गया कि मुआवजा उस व्यक्ति को दिया जाएगा जिसकी संपत्ति सार्वजनिक उद्देश्यों के लिए ली गई है।\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "निम्नलिखित में से कौन-सा सही सुमेलित है?\n  <br>", "option1": "संविधान का भाग II - मौलिक अधिकार\n  <br>", "option2": "संविधान का भाग III - नागरिकता\n  <br>", "option3": "संविधान का भाग IV (A) - मौलिक कर्तव्य\n  <br>", "option4": "संविधान का भाग V - राज्य के नीति निदेशक सिद्धांत\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c), संविधान का भाग IV (A) - मौलिक कर्तव्य है।\n  <br>भारतीय संविधान का भाग IV(A) मौलिक कर्तव्यों से संबंधित है। जबकि, संविधान का भाग II नागरिकता से संबंधित है, भाग III मौलिक अधिकारों के लिए है और भाग V संघ से संबंधित है। अतः, विकल्प (C) सही ढंग से सुमेलित है।\n  <br> मौलिक कर्तव्य 11 कर्तव्यों का एक समूह है जो भारत के सभी नागरिकों से अपेक्षित है। कर्तव्यों में राष्ट्रीय ध्वज और राष्ट्रगान का सम्मान करना, संविधान को कायम रखना और सभी लोगों के बीच सद्भाव और भाईचारे को बढ़ावा देना जैसे कर्तव्य शामिल हैं।\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "निम्नलिखित में से कौन-सा जल-प्रपात मध्य प्रदेश में स्थित है?\n  <br>", "option1": "खंडाधार\n  <br>", "option2": "शिवसमुद्रम\n  <br>", "option3": "दूधसागर\n  <br>", "option4": "धुआंधार\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर विकल्प (d), धुआंधार जलप्रपात है। धुआंधार जलप्रपात मध्य प्रदेश में स्थित हैं। यह झरना रीवा शहर से लगभग 30 किलोमीटर दूर नर्मदा नदी पर स्थित है। यह झरना लगभग 142 मीटर (466 फीट) ऊंचा है और भारत के सबसे ऊंचे झरनों में से एक है।\n  <br>नर्मदा नदी, जिसे रेवा भी कहा जाता है, भारत की 5वीं सबसे लंबी नदी और कुल मिलाकर पश्चिम की ओर बहने वाली सबसे लंबी नदी है। यह मध्य प्रदेश राज्य में सबसे अधिक बहने वाली नदी भी है।\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "भारतीय विद्रोह 10 मई 1857 को मेरठ से शुरू हुआ और कब और कहाँ समाप्त हुआ?\n  <br>", "option1": "18 सितंबर 1859 को दिल्ली\n  <br>", "option2": "15 अगस्त 1860 को झाँसी\n  <br>", "option3": "20 जून 1858 को ग्वालियर\n  <br>", "option4": "13 मई 1858 को कोलकाता\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "भारतीय विद्रोह 10 मई 1857 को मेरठ में शुरू हुआ और आमतौर पर इसे 20 जून 1858 को ग्वालियर में समाप्त माना जाता है। हालाँकि, प्रतिरोध के कुछ अलग-अलग हिस्से थे जो कुछ और महीनों तक जारी रहे।\n  <br>इसे सिपाही विद्रोह, भारतीय विद्रोह, महान विद्रोह, 1857 का विद्रोह, भारतीय विद्रोह और प्रथम स्वतंत्रता संग्राम के रूप में वर्णित किया गया है।\n  <br>अत, उत्तर (c) 20 जून 1858 को ग्वालियर है।\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "निम्नलिखित में से कौन सा एक कार्बनिक यौगिक है जिसका सूत्र \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694415055637image50.png\">है जिसका उपयोग इत्र, सुगंध और विलायक के रूप में किया जाता है?\n  <br>", "option1": "अनिसोल\n  <br>", "option2": "टोल्यूनि\n  <br>", "option3": "एसिटोफेनोन\n  <br>", "option4": "एनिलिन\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "CH3OC6H5 सूत्र वाले कार्बनिक यौगिक को अनिसोल के नाम से जाना जाता है। यह एक सुगंधित ईथर है जिसका उपयोग आमतौर पर इत्र, सुगंध और विलायक के रूप में किया जाता है।\n  <br>एनीसोल एक मीठी, सुखद गंध वाला एक स्पष्ट तरल है और इसका उपयोग इत्र, सौंदर्य प्रसाधन और फार्मास्यूटिकल्स सहित विभिन्न उद्योगों में किया जाता है।\n  <br>इसका उपयोग खाद्य उत्पादों में स्वाद बढ़ाने वाले एजेंट के रूप में और विभिन्न रसायनों के उत्पादन में मध्यवर्ती के रूप में भी किया जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "एक विशेष दिशा में ______ वेग है।\n  <br>", "option1": "त्वरण\n  <br>", "option2": "विस्थापन\n  <br>", "option3": "गति\n  <br>", "option4": "दूरी\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "किसी विशेष दिशा में गति को वेग कहा जाता है। वेग एक सदिश राशि है जो उस दर को मापती है जिस पर कोई वस्तु अपनी स्थिति बदलती है।\n  <br>गति एक अदिश राशि है जो उस दर को मापती है जिस गति से कोई वस्तु अपनी दिशा की परवाह किए बिना आगे बढ़ रही है। इसलिए, सही उत्तर (c) गति है।\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "चोल वंश के शिलालेखों में उल्लिखित वेट्टी कर _____ रूप में लिया गया था।\n  <br>", "option1": "फसलें\n  <br>", "option2": "भूमि राजस्व\n  <br>", "option3": "नकद\n  <br>", "option4": "जबरन श्रम\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "वेट्टी कर, जिसका उल्लेख चोल वंश के शिलालेखों में मिलता है, बेगार के रूप में लिया जाता था।\n  <br> वेट्टी प्रणाली कोरवी श्रम (अवैतनिक श्रम) का एक रूप था, जिसमें कुछ व्यक्तियों को बदले में बिना किसी पारिश्रमिक के राज्य के लिए श्रम सेवाएं प्रदान करने की आवश्यकता होती थी।\n  <br> इस श्रम का उपयोग विभिन्न उद्देश्यों के लिए किया जाता था, जिसमें कृषि और निर्माण कार्य के साथ-साथ सैन्य सेवा भी शामिल थी। वेट्टी कर चोल राजवंश के राजस्व के प्रमुख स्रोतों में से एक था।\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "अधिकांश क्लोरोफाइसी में एक या अधिक भंडारण निकाय होते हैं जिन्हें क्लोरोप्लास्ट में ______ कहा जाता है।\n  <br>", "option1": "रंध्र\n  <br>", "option2": "कैरोटीनॉयड\n  <br>", "option3": "पाइरेनोइड्स\n  <br>", "option4": "क्लोरोफिल\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अधिकांश क्लोरोफाइसी में एक या अधिक भंडारण निकाय होते हैं जिन्हें पाइरेनॉइड्स कहा जाता है जो क्लोरोप्लास्ट में स्थित होते हैं।\n  <br> क्लोरोफाइसी को 'हरित शैवाल' भी कहा जाता है\n  <br> पाइरेनॉइड्स क्लोरोप्लास्ट के भीतर पाई जाने वाली विशेष संरचनाएं हैं जो स्टार्च के संश्लेषण और भंडारण में भूमिका निभाती हैं। वे प्रोटीन और स्टार्च से बने होते हैं और प्रकाश संश्लेषण के दौरान कार्बन डाइऑक्साइड (CO2) की सांद्रता और कार्बन के निर्धारण में शामिल होते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "आयरन, आयोडीन और जिंक को निम्नलिखित में से क्या माना जा सकता है?\n  <br>", "option1": "मैक्रोन्यूट्रिएंट्स\n  <br>", "option2": "सूक्ष्म पोषक तत्व\n  <br>", "option3": "स्टेरॉयड हार्मोन प्रेरक\n  <br>", "option4": "गैर-आवश्यक पोषक तत्व\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "पोषक तत्व शरीर की वृद्धि, ऊर्जा, मरम्मत और रखरखाव के लिए आवश्यक हैं।\n  <br> पोषक तत्वों को मैक्रोन्यूट्रिएंट्स और माइक्रोन्यूट्रिएंट्स के रूप में वर्गीकृत किया गया है।\n  <br> कार्बोहाइड्रेट, कैलोरी और प्रोटीन मैक्रोन्यूट्रिएंट्स के उदाहरण हैं।\n  <br> \n  <b>सूक्ष्म पोषक तत्व:</b> \n  <br> सूक्ष्म पोषक तत्व वे तत्व हैं जिनकी हमें कम मात्रा में आवश्यकता होती है।\n  <br> लोहा, कोबाल्ट, क्रोमियम, आयोडीन, तांबा, जस्ता और मोलिब्डेनम कुछ सूक्ष्म पोषक तत्व हैं।\n  <br> किसी भी पोषक तत्व की कमी वृद्धि और विकास को प्रभावित करती है।\n  <br> वे शरीर की चयापचय गतिविधियों में प्रमुख भूमिका निभाते हैं।\n  <br> इनमें विटामिन और खनिज शामिल हैं।\n  <br>", "question_heading": ""}, {"sr_no": 126, "question": "किस माप उपकरण में तीन पैरों पर समर्थित एक धातु त्रिकोणीय फ्रेम होता है, जिसका उपयोग किसी वस्तु जैसे लेंस और घुमावदार दर्पण जो गोलाकार होते हैं, उसकी वक्रता त्रिज्या को मापने के लिए किया जाता है?\n  <br>", "option1": "विस्कोमीटर\n  <br>", "option2": "स्फेरोमीटर\n  <br>", "option3": "वर्नियरकैलिपर\n  <br>", "option4": "स्क्रू गेज\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "स्फेरोमीटर एक मापने वाला उपकरण है जिसमें तीन पैरों पर समर्थित एक धातु त्रिकोणीय फ्रेम होता है। तीनों पैरों की नोकें एक समबाहु त्रिभुज बनाती हैं और त्रिज्या पर स्थित होती हैं। एक केंद्रीय पैर है जिसे लंबवत दिशा में ले जाया जा सकता है। गोलाकारमापी द्वारा किसी दी गई गोलाकार सतह की वक्रता त्रिज्या कैसे निर्धारित की जाए, इसका प्रयोग नीचे दिया गया है।\n  <br>", "question_heading": ""}, {"sr_no": 127, "question": "हाल ही में किसने टेस्ट क्रिकेट के इतिहास में 9000 रन तक पहुंचने वाले दूसरे सबसे तेज खिलाड़ी बनने की उपलब्धि हासिल की है?\n  <br>", "option1": "स्टीवन स्मिथ\n  <br>", "option2": "जो रूट\n  <br>", "option3": "विराट कोहली\n  <br>", "option4": "केन विलियमसन\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (a) स्टीवन स्मिथ है।\n  <br>स्टीवन स्मिथ ने टेस्ट क्रिकेट के इतिहास में 9000 रन तक पहुंचने वाले दूसरे सबसे तेज खिलाड़ी बनने की उपलब्धि हासिल की। उन्होंने अपनी 174वीं पारी में यह उपलब्धि हासिल की, वह कुमार संगकारा से सिर्फ दो पारी पीछे हैं, जो 172 पारियों में इस मुकाम तक पहुंचे थे। स्मिथ ने लॉर्ड्स में इंग्लैंड के खिलाफ दूसरे एशेज टेस्ट की पहली पारी में 184 गेंदों पर 15 चौकों सहित 110 रन बनाए।\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "उत्तर प्रदेश के कितने हस्तशिल्प उत्पादों को भौगोलिक संकेत (GI) टैग से मान्यता दी गई?\n  <br>", "option1": "7\n  <br>", "option2": "3\n  <br>", "option3": "10\n  <br>", "option4": "5\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "वाणिज्य और उद्योग मंत्रालय (MoCI) के उद्योग संवर्धन और आंतरिक व्यापार विभाग (DIPIT) के तहत भौगोलिक संकेत रजिस्ट्री (चेन्नई, तमिलनाडु-टीएन) ने उत्तर प्रदेश के 7 हस्तशिल्प उत्पादों को भौगोलिक संकेत (GI) टैग के साथ मान्यता दी है।\n  <br> \n  <b>ये उत्पाद हैं:</b> \n  <br>1. अमरोहा ढोलक\n  <br>2. कालपी हस्तनिर्मित कागज\n  <br>3. बागपत घरेलू सामान\n  <br>4. बाराबंकी हथकरघा उत्पाद\n  <br>5. महोबा गौरा पत्थर हस्तशलिप\n  <br>6. मैनपुरी तारकशी\n  <br>7. संभल हार्न क्राफ्ट\n  <br> \n  <b>भौगोलिक संकेत (GI) के बारे में:</b> \n  <br> भौगोलिक संकेत (GI) उन उत्पादों पर इस्तेमाल किया जाने वाला एक चिन्ह है जिनकी एक विशिष्ट भौगोलिक उत्पत्ति होती है और उनमें उस उत्पत्ति के कारण गुण या प्रतिष्ठा होती है।\n  <br> जीआई टैग इन उत्पादों को नकल से बचाने में मदद करता है और यह सुनिश्चित करता है कि उपभोक्ताओं को वास्तविक उत्पाद प्राप्त हों।\n  <br> जीआई टैग भारत में बौद्धिक संपदा अपीलीय बोर्ड (IPAB) द्वारा प्रदान किया जाता है।\n  <br> जीआई टैग के लिए आवेदन उन उत्पादकों या व्यापारियों के समूह द्वारा किया जाना चाहिए जो उस भौगोलिक क्षेत्र में स्थित हैं जहां उत्पाद का उत्पादन किया जाता है।\n  <br> एप्लिकेशन में उत्पाद का विवरण, वह भौगोलिक क्षेत्र जिसमें इसका उत्पादन किया जाता है, और उस मूल के कारण होने वाले गुण या प्रतिष्ठा शामिल होनी चाहिए।\n  <br> इसके बाद आईपीएबी आवेदन का आकलन करेगा और तय करेगा कि जीआई टैग देना है या नहीं।\n  <br> \n  <b>जीआई टैग के कुछ लाभ इस प्रकार हैं:</b> \n  <br> यह उत्पाद को नकल से बचाने में मदद करता है।\n  <br> यह सुनिश्चित करने में मदद करता है कि उपभोक्ताओं को वास्तविक उत्पाद प्राप्त हों।\n  <br> यह उत्पाद की कीमत बढ़ाने में मदद कर सकता है।\n  <br> यह उत्पाद को बढ़ावा देने और पर्यटकों को आकर्षित करने में मदद कर सकता है।\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "उस अभ्यास का नाम क्या है जो भारत में सबसे बड़ा हवाई अभ्यास होगा?\n  <br>", "option1": "गरुड़ शक्ति\n  <br>", "option2": "वायु शक्ति\n  <br>", "option3": "तरंग शक्ति\n  <br>", "option4": "आकाश शक्ति\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (c) तरंग शक्ति है।\n  <br> तरंग शक्ति भारतीय वायु सेना (IAF) द्वारा आयोजित एक द्विवार्षिक बहुराष्ट्रीय हवाई अभ्यास है। यह अभ्यास भारतीय वायुसेना और अन्य वायु सेनाओं के बीच अंतरसंचालनीयता में सुधार करने और रणनीतिक गठबंधन को बढ़ावा देने के लिए डिज़ाइन किया गया है।\n  <br> पहला तरंग शक्ति अभ्यास 2007 में आयोजित किया गया था, और तब से यह हर दो वर्ष में आयोजित किया जाता है। तरंग शक्ति का 2023 संस्करण भारत में अब तक आयोजित सबसे बड़ा हवाई अभ्यास होगा, जिसमें 12 से अधिक वायु सेनाओं की भागीदारी होगी।\n  <br> भाग लेने वाली वायु सेनाएं भारत, संयुक्त राज्य अमेरिका, यूनाइटेड किंगडम, फ्रांस, ऑस्ट्रेलिया, रूस, दक्षिण कोरिया, जापान और सिंगापुर से होंगी। यह अभ्यास भारत के पश्चिमी क्षेत्र में आयोजित किया जाएगा, और इसमें लड़ाकू विमान युद्ध अभ्यास, परिवहन विमान एयरड्रॉप और हेलीकॉप्टर संचालन सहित कई प्रकार के हवाई संचालन शामिल होंगे।\n  <br> तरंग शक्ति भारतीय वायु सेना के कैलेंडर में एक प्रमुख घटना है, और यह वैश्विक जुड़ाव के लिए भारतीय वायुसेना की प्रतिबद्धता का एक प्रमाण है। यह अभ्यास भारतीय वायुसेना और अन्य वायु सेनाओं के बीच अंतरसंचालनीयता को बेहतर बनाने में मदद करेगा, और यह रणनीतिक गठबंधन को बढ़ावा देगा जो भारत की सुरक्षा के लिए फायदेमंद होगा।\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "\"माया, मोदी, आज़ाद: दलित पॉलिटिक्स इन द टाइम ऑफ हिंदुत्व\" पुस्तक के लेखक कौन हैं?\n  <br>", "option1": "सुधा कुमार और सज्जन आज़ाद\n  <br>", "option2": "सुधा कुमार और सज्जन पई\n  <br>", "option3": "सुधा पाई और सज्जन कुमार\n  <br>", "option4": "सुधा आज़ाद और सज्जन पई\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सुधा पई और सज्जन कुमार ने \"माया, मोदी, आज़ाद: दलित पॉलिटिक्स इन द टाइम ऑफ़ हिंदुत्व\" नामक पुस्तक लिखी है।\n  <br>इस पुस्तक में, वे दलित राजनीति के क्षेत्र में माया, मोदी और आज़ाद के बीच अंतरसंबंध की एक बोधगम्य और विचारोत्तेजक परीक्षा प्रदान करते हैं। उनका विश्लेषण न केवल दलित राजनीति की गतिशीलता बल्कि भारत के व्यापक लोकतांत्रिक परिदृश्य को समझने में बहुत महत्व रखता है, खासकर जब हम 2024 के अत्यधिक विवादास्पद आम चुनाव के करीब पहुंच रहे हैं।\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "निम्नलिखित में से कौन सा दुर्भावनापूर्ण कंप्यूटर प्रोग्राम है, जिसका उपयोग उपयोगकर्ताओं को इसके सही इरादे से भ्रमित करके कंप्यूटर को हैक करने के लिए किया जाता है?\n  <br>", "option1": "वर्म\n  <br>", "option2": "स्पाइवेयर\n  <br>", "option3": "ट्रोजन हॉर्स\n  <br>", "option4": "कीलॉगर\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "कंप्यूटिंग में, \n  <b>ट्रोजन हॉर्स</b>, या ट्रोजन, एक दुर्भावनापूर्ण कंप्यूटर प्रोग्राम है जिसका उपयोग उपयोगकर्ताओं को उसके वास्तविक इरादे से गुमराह करके कंप्यूटर को हैक करने के लिए किया जाता है।\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "फ़ाइल रिकॉर्ड को समय-समय पर जोड़ना, बदलना और हटाना क्या कहलाता है?\n  <br>", "option1": "रिन्यूइंग\n  <br>", "option2": "अपग्रेडिंग\n  <br>", "option3": "रिस्ट्रक्चरिंग\n  <br>", "option4": "अपडेटिंग\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "समय-समय पर फ़ाइल रिकॉर्ड को जोड़ना, बदलना और हटाना \n  <b>अपडेटिंग</b> करना कहलाता है।\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "नि let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
