<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) SSC CGL Tier-II (Paper-I) Mock 3(HINDI - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

 are steeply that it's hard to afford.\n  <br>", "option1": "The new restaurant in town is said to have the best food,\n  <br>", "option2": "but the prices are steeply\n  <br>", "option3": "that it's hard to afford.\n  <br>", "option4": "no error\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error is in segment (b): \"but the prices are steeply.\"\n  <br>· The issue with this segment is the incorrect use of the adverb \"steeply\" when the adjective \"steep\" is needed. Adverbs modify verbs, adjectives, or other adverbs, whereas adjectives modify nouns. In this case, we need an adjective to modify the noun \"prices.\"\n  <br>· The correct sentence should read: \"The new restaurant in town is said to have the best food, but the prices are steep that it's hard to afford.\"\n  <br>· By replacing the adverb \"steeply\" with the adjective \"steep,\" the sentence now conveys the intended meaning: the new restaurant in town has great food, but the high prices make it difficult to afford.\n  <br>", "question_heading": ""}, {"sr_no": 62, "question": "Select the option that is the indirect form of the given sentence.\n  <br>The shopkeeper said to me, “I will not give you this medicine without prescription.”\n  <br>", "option1": "The shopkeeper told me that he would not give me that medicine without prescription.\n  <br>", "option2": "The shopkeeper informed me that he will not give me this medicine without prescription.\n  <br>", "option3": "The shopkeeper enquired if he could not give me that medicine without prescription.\n  <br>", "option4": "The shopkeeper demanded that he would not give me this medicine without prescription.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>· The given sentence is ‘Direct Speech’.\n  <br>· \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br>· \n  <b>Indirect Speech</b> - Reporting the message of the speaker in our own words.\n  <br>· To change the given sentence to indirect speech following rule is followed:\n  <br>· Tense - Future simple (Subject+ will/shall+V1+object) changes to Present Conditional (Subject+ would+V1+object).\n  <br>· The sentence thus formed is - The shopkeeper told me that he would not give me that medicine without prescription.\n  <br>", "question_heading": ""}, {"sr_no": 63, "question": "Select the most appropriate meaning of the highlighted idiom in the given sentence.\n  <br>Despite being a successful CEO, he never \n  <b>forgot his roots</b> and remained humble.\n  <br>", "option1": "His financial status\n  <br>", "option2": "His educational qualifications\n  <br>", "option3": "His early beginnings\n  <br>", "option4": "His professional experience\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) His early beginnings.\n  <br>· The highlighted idiom \"his roots\" in the sentence refers to the person's origins or early beginnings, indicating that even after becoming a successful CEO, he did not forget where he came from and maintained humility.\n  <br>· Example: Although John became a world-famous actor, he never forgot his roots and frequently returned to his small hometown to visit friends and family.\n  <br>", "question_heading": ""}, {"sr_no": 64, "question": "In the question given below, two statements are given with one blank in each, which must be filled in with the same word. Following the statements are four words. Choose the most appropriate word which could fill in both the blanks to make both the statements grammatically and contextually correct.\n  <br>(A) She always __________ her promises, so everyone trusts her.\n  <br>(B) The company strives to create products that not only meet customer expectations but also __________ their desires for innovation and quality.\n  <br>", "option1": "delivers\n  <br>", "option2": "processes\n  <br>", "option3": "converts\n  <br>", "option4": "fulfils\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In both sentences, the word \"fulfils\" fits grammatically and contextually.\n  <br>· In sentence (A), \"fulfils\" means that she always keeps her promises, which makes her trustworthy.\n  <br>· In sentence (B), \"fulfils\" is used to express that the company aims to satisfy and meet the desires of customers by providing innovative and high-quality products.\n  <br>Meanings of the other given words:\n  <br>· Deliver: to bring or transport something to a specific destination or recipient.\n  <br>· Process: to perform a series of actions or operations on something in order to achieve a particular result or transform it.\n  <br>· Convert: to change or transform something into a different form or use.\n  <br>", "question_heading": ""}, {"sr_no": 65, "question": "Select the option that will improve the segment in bold of the given sentence.\n  <br>In case no improvement is needed, select ‘No improvement.’\n  <br>Despite facing numerous challenges and obstacles, she persevered and \n  <b>had managed to pass</b> the exam with flying colours.\n  <br>", "option1": "has managed to pass\n  <br>", "option2": "did manage to pass\n  <br>", "option3": "had been managed to pass\n  <br>", "option4": "No improvement\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the original sentence, the phrase \"had managed to pass\" is in the past perfect tense. However, the use of past perfect tense in this context is not necessary because there is no need to establish a time relationship with another past event.\n  <br>· The correct option is (b) \"did manage to pass.\" This option uses the past tense \"did\" to emphasize the accomplishment of passing the exam. The inclusion of \"did\" adds emphasis and clarity to the sentence.\n  <br>· So, the improved sentence would be: Despite facing numerous challenges and obstacles, she persevered and did manage to pass the exam with flying colors.\n  <br>", "question_heading": ""}, {"sr_no": 66, "question": "What is the primary cause of India's energy crisis?\n  <br>", "option1": "Growing population\n  <br>", "option2": "Increasing demand for energy\n  <br>", "option3": "Overreliance on renewable sources\n  <br>", "option4": "None of the above\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) Increasing demand for energy.\n  <br>· The passage states that India's energy needs are being met primarily by fossil fuels, which are finite resources, and that the country's rapidly growing economy and population have led to an increasing demand for energy. The passage also mentions that many regions of India are experiencing power outages and a shortage of electricity, indicating a crisis in energy supply.\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "Which renewable energy source has the largest potential in India?\n  <br>", "option1": "Solar power\n  <br>", "option2": "Wind power\n  <br>", "option3": "Hydroelectric power\n  <br>", "option4": "Geothermal power\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) Solar power.\n  <br>· The passage states that India has set an ambitious target of achieving 175 GW of renewable energy capacity by 2022 and that one approach to addressing the energy crisis is to expand the use of renewable energy sources such as solar, wind, hydro, and biomass. However, the passage also notes that solar power has the largest potential for growth in India, as the country has abundant solar radiation and the cost of solar energy has been decreasing.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "What are the challenges associated with the integration of renewable sources into the power grid?\n  <br>", "option1": "Reliability and stability of the power supply\n  <br>", "option2": "Intermittency of renewable sources\n  <br>", "option3": "Lack of effective storage systems\n  <br>", "option4": "All of the above\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) All of the above.\n  <br>· The passage mentions several challenges associated with the integration of renewable sources into the power grid, including the reliability and stability of the power supply, the intermittency of renewable sources, and the lack of effective storage systems. The passage also notes that smart grid technology is needed to balance supply and demand.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "Which of the following is not the potential impact of India's commitment to achieving a sustainable energy future?\n  <br>", "option1": "Leading the global transition to a low-carbon economy\n  <br>", "option2": "Reduced greenhouse gas emissions\n  <br>", "option3": "Improved air quality\n  <br>", "option4": "Reduced air quality\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) Reduced air quality.\n  <br>· The passage states that India has the potential to become a leader in the global transition to a low-carbon economy and that the government is committed to achieving a sustainable energy future. The passage also notes that this commitment could lead to reduced greenhouse gas emissions and improved air quality, in addition to other potential benefits.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "What is the role of the private sector in addressing India's energy crisis?\n  <br>", "option1": "Developing new technologies and innovations\n  <br>", "option2": "Investing in renewable energy projects\n  <br>", "option3": "Reducing their own carbon footprint\n  <br>", "option4": "All of the above\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) All of the above.\n  <br>· The passage does not provide a direct answer to this question, but it does mention that the government has launched several initiatives and policies to promote the growth of the renewable energy sector, including subsidies, tax incentives, and the establishment of renewable energy parks. The private sector can play a role in developing new technologies and innovations, investing in renewable energy projects, and reducing their own carbon footprint to contribute to India's energy transition.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "What is the primary purpose of elections in India?\n  <br>", "option1": "To provide citizens with entertainment.\n  <br>", "option2": "To showcase the country's multi-party system.\n  <br>", "option3": "To choose representatives who will govern and make decisions on behalf of citizens.\n  <br>", "option4": "To distribute government resources equally among all citizens.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) To choose representatives who will govern and make decisions on behalf of citizens.\n  <br>· The passage clearly states that elections provide citizens with the opportunity to choose their representatives who will govern and make decisions on their behalf.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "What is the Model Code of Conduct?\n  <br>", "option1": "The official slogan of the Indian National Congress.\n  <br>", "option2": "The guidelines that political parties and candidates must follow during the election process.\n  <br>", "option3": "The list of candidates contesting in the election.\n  <br>", "option4": "The number of votes required to win an election.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) The guidelines that political parties and candidates must follow during the election process.\n  <br>· The passage mentions that the Model Code of Conduct outlines the guidelines that political parties and candidates must follow during the election process.\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "What are the different types of elections held in India?\n  <br>", "option1": "National, state, and local body elections.\n  <br>", "option2": "Presidential, parliamentary, and gubernatorial elections.\n  <br>", "option3": "Regional, federal, and provincial elections.\n  <br>", "option4": "Upper house, lower house, and executive elections.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) National, state, and local body elections.\n  <br>· The passage clearly states that elections are held at the national, state, and local levels in India.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "What major change was introduced in India's electoral system in 1982?\n  <br>", "option1": "The introduction of social media campaigning.\n  <br>", "option2": "The use of paper ballots.\n  <br>", "option3": "The introduction of electronic voting machines (EVMs).\n  <br>", "option4": "The removal of the Model Code of Conduct.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) The introduction of electronic voting machines (EVMs).\n  <br>· The passage mentions that the major change introduced in India's electoral system in 1982 was the introduction of electronic voting machines (EVMs).\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "What challenges does India's electoral system face?\n  <br>", "option1": "The limited access to information about candidates and political parties, the lack of interest among citizens in participating in the electoral process, and the difficulty in verifying the accuracy of voting results.\n  <br>", "option2": "The lack of transparency in the voting process, the dominance of one political party, and lack of access to polling stations.\n  <br>", "option3": "The limited representation of minority groups in government, the use of violence and intimidation during elections, and the lack of resources allocated for conducting elections.\n  <br>", "option4": "The increasing use of social media in campaigning, political polarization, and concerns over the security of electronic voting machines.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (d) The increasing use of social media in campaigning, political polarization, and concerns over the security of electronic voting machines.\n  <br>· The passage highlights several challenges faced by India's electoral system, including the increasing use of social media in campaigning, political polarization, and concerns over the security of electronic voting machines.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Select the most appropriate option to fill in the blank in the given sentence.\n  <br>I'm not sure if I'm ready for this job yet, I think I need some more ________.\n  <br>", "option1": "Training\n  <br>", "option2": "Popularity\n  <br>", "option3": "Guide\n  <br>", "option4": "Equipment\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In the given sentence, the speaker expresses uncertainty about their readiness for the job. They feel they require something additional to become better prepared. Among the options provided, \"training\" is the most appropriate choice to fill in the blank.\n  <br>· Training: This option implies that the person believes they need further instruction, education, or skill development to enhance their abilities for the job. It suggests a specific type of preparation that can provide them with the necessary knowledge and expertise.\n  <br>· Popularity: This option does not fit in the sentence contextually. \"Popularity\" refers to being liked, admired, or well-known among others, which is unrelated to being ready for a job.\n  <br>· \"Guide\" generally refers to receiving advice, support, or direction from someone.\n  <br>· Equipment: \"Equipment\" does not fit the context either. It refers to the tools, machinery, or supplies necessary for performing specific tasks, which may not be the primary concern of the speaker in this situation.\n  <br>· Therefore, among the given options, \"training\" is the most suitable word to complete the sentence, indicating the speaker's desire for further instruction or skill development.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Select the option that will improve the segment in bold of the given sentence.\n  <br>In case no improvement is needed, select ‘No improvement.’\n  <br>The committee members failed to come to a consensus on the proposed plan, \n  <b>and hence it was decided to postpone the meeting upto next week.</b> \n  <br>", "option1": "and hence it was decided to postpone the meeting until next week.\n  <br>", "option2": "and hence it was deciding to postpone the meeting till last week.\n  <br>", "option3": "and hence it is decided to postpone the meeting till the next day.\n  <br>", "option4": "No improvement.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The original sentence states that the committee members failed to come to a consensus on the proposed plan, and as a result, it was decided to postpone the meeting. However, the phrase \"upto next week\" is not grammatically correct.\n  <br>· Option (a), \"and hence it was decided to postpone the meeting until next week,\" is the correct choice because it replaces the incorrect phrase with a more appropriate expression.\n  <br>· \"Until next week\" indicates that the meeting will be postponed and rescheduled for a specific time in the future, providing a clear and accurate understanding of when the meeting will take place.\n  <br>· Therefore, option (a) provides the best improvement by replacing the incorrect phrase with a clear and accurate expression.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Select the word which means the same as the group of words given.\n  <br>Able to adapt or be adapted to many different functions or activities\n  <br>", "option1": "Pliable\n  <br>", "option2": "Inflexible\n  <br>", "option3": "Immovable\n  <br>", "option4": "Versatile\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that means the same as the group of words given is option (d) Versatile.\n  <br>· Versatile means capable of adapting or being adapted to many different functions or activities, which matches the description provided.\n  <br>The other options have different meanings:\n  <br>· Inflexible - not willing or unable to change or adapt.\n  <br>· Immovable - not able to be moved or changed.\n  <br>· Pliable - easily bent or flexible (generally refers to materials).\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Select the most appropriate ANTONYM of the word given in bold.\n  <br>The witness's testimony was deemed to be \n  <b>credible</b> by the jury.\n  <br>", "option1": "Inconceivable\n  <br>", "option2": "Believable\n  <br>", "option3": "Reliable\n  <br>", "option4": "Dubious\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Credible means able to be believed or convincing.\n  <br>· Dubious which means hesitating or doubting, or not to be relied upon.\n  <br>· The most appropriate antonym of the word \"credible\" is option (d) Dubious.\n  <br>· Synonyms: believable, trustworthy, reliable, convincing, plausible.\n  <br>· Antonyms: \n  <b>dubious</b>, unreliable, unbelievable, unconvincing, implausible.\n  <br>Meaning of the other words:\n  <br>· Believable: able to be believed; likely to be true.\n  <br>· Reliable: consistently good in quality or performance; able to be trusted.\n  <br>· Inconceivable: not capable of being imagined or grasped mentally; unbelievable.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Select the most appropriate synonym of the word given in bold.\n  <br>The atmosphere was \n  <b>lively</b>, with people laughing and chatting.\n  <br>", "option1": "Rigid\n  <br>", "option2": "Placid\n  <br>", "option3": "Boisterous\n  <br>", "option4": "Timid\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Lively means full of life and energy.\n  <br>· Boisterous means noisy, energetic, and cheerful; similar to lively.\n  <br>· Antonyms: Dull, lifeless, boring.\n  <br>· Synonyms: Energetic, \n  <b>Boisterous</b>, vivacious, animated.\n  <br>Meanings of other given words:\n  <br>· Placid means calm and peaceful.\n  <br>· Rigid means stiff and inflexible.\n  <br>· Timid means shy and nervous.\n  <br>", "question_heading": ""}, {"sr_no": 81, "question": "Select the word which means the same as the group of words given.\n  <br>A government in which a single person or party has unlimited power\n  <br>", "option1": "Oligarchy\n  <br>", "option2": "Democracy\n  <br>", "option3": "Monarchy\n  <br>", "option4": "Autocracy\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the given words:\n  <br>· Oligarchy - a form of government in which a small group of people hold power.\n  <br>· Democracy - a system of government by the whole population or all the eligible members of a state, typically through elected representatives.\n  <br>· Monarchy - a form of government with a monarch as the head.\n  <br>· Autocracy - a system of government by one person with absolute power.\n  <br>· Therefore, the correct answer is (d) Autocracy.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Given below are four jumbled sentences. Select the option that gives the correct order.\n  <br>A. She tried to teach her daughter that no one is too small to make a difference.\n  <br>B. But now she is the one learning the lesson.\n  <br>C. She always thought she was the one who would teach life's important lessons to her children.\n  <br>D. Because of her daughter's compassion, they are helping those who are less fortunate.\n  <br>", "option1": "CBDA\n  <br>", "option2": "CABD\n  <br>", "option3": "DCBA\n  <br>", "option4": "BCAD\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order of the jumbled sentences is CABD.\n  <br>· Sentence C provides more background information about the mother's beliefs about teaching life's important lessons to her children.\n  <br>· Sentence A is the next sentence, where a mother tries to teach her daughter an important lesson about making a difference.\n  <br>· Sentence B follows sentence C and indicates a shift in perspective where the mother is now learning a lesson from her daughter.\n  <br>· Sentence D concludes the story by providing the result of the daughter's compassion and how they are helping those who are less fortunate.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the most appropriate ANTONYM of the word given in bold.\n  <br>The government's action in this matter is \n  <b>unequivocal</b>.\n  <br>", "option1": "Ambiguous\n  <br>", "option2": "Dubious\n  <br>", "option3": "Indecisive\n  <br>", "option4": "Unclear\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Unequivocal means leaving no doubt or uncertainty; clear and unambiguous.\n  <br>· Ambiguous means open to more than one interpretation; not having one obvious meaning.\n  <br>· Antonyms: \n  <b>ambiguous</b>, vague, uncertain.\n  <br>· Synonyms: clear, unambiguous, explicit.\n  <br>Meanings of the other given words:\n  <br>· Dubious - hesitating or doubting; not to be relied upon; suspect.\n  <br>· Indecisive - not settling an issue; not having or showing the ability to make decisions quickly and effectively.\n  <br>· Unclear - not expressed or understood clearly.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the most appropriate synonym of the word given in bold.\n  <br>The protagonist's \n  <b>perspicacity</b> was evident throughout the convoluted narrative, leaving the readers captivated.\n  <br>", "option1": "Imbecility\n  <br>", "option2": "Astuteness\n  <br>", "option3": "Ineptitude\n  <br>", "option4": "Wisdom\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Perspicacity means keenness of perception or understanding.\n  <br>· Astuteness refers to the quality of being shrewd, perceptive, and insightful in practical matters.\n  <br>· In the given sentence, the protagonist's perspicacity refers to their ability to understand and perceive things clearly, which is evident throughout the convoluted narrative and captivates the readers.\n  <br>· Synonyms of perspicacity include \n  <b>astuteness</b>, intelligence, and acumen.\n  <br>Meanings of the other given options:\n  <br>· Imbecility - a state of weakness in mental capacity or intellect.\n  <br>· Ineptitude - lack of skill or competence.\n  <br>· Wisdom - the quality of having experience, knowledge, and good judgment.\n  <br>· Therefore, the most appropriate synonym for \"perspicacity\" in this context is (b) Astuteness.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the most appropriate option to fill in the blank in the given sentence.\n  <br>She can't wait to _______ a new challenge at work.\n  <br>", "option1": "Take down\n  <br>", "option2": "Take over\n  <br>", "option3": "Take up\n  <br>", "option4": "Take out\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct option is (c) Take up. In this sentence, the speaker is expressing excitement to start a new challenge at work.\n  <br>· The phrasal verb \"take up\" means to start or begin a new hobby, activity, or challenge.\n  <br>· Therefore, the most appropriate option to fill in the blank is \"take up.\"\n  <br>· The other options, \"take down,\" \"take over,\" and \"take out,\" do not fit the context of the sentence.\n  <br>· \"Take down\" means to write or record something, \"take over\" means to take control of something, and \"take out\" means to remove or eliminate something.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "Select the word which means the same as the group of words given.\n  <br>A specialist who focuses on the correction of irregularities in the alignment of teeth and jaws.\n  <br>", "option1": "Orthodontist\n  <br>", "option2": "Cardiologist\n  <br>", "option3": "Dermatologist\n  <br>", "option4": "Dentist\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Meanings of the given words:\n  <br>· Orthodontist - a dental specialist who focuses on the correction of irregularities in the alignment of teeth and jaws.\n  <br>· Cardiologist - a medical specialist who specializes in diagnosing and treating diseases and conditions of the heart.\n  <br>· Dermatologist - a medical specialist who specializes in diagnosing and treating diseases and conditions of the skin.\n  <br>· Dentist- A person who is skilled in diagnosing and treating diseases of the teeth and gums.\n  <br>· Option (a) portrays the same meaning as that of the given group of words & hence it is the correct choice.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "Select the most appropriate antonym of the word given in bold.\n  <br>The judge declared the defendant \n  <b>guilty</b> of all charges.\n  <br>", "option1": "Acquitted\n  <br>", "option2": "Confirmed\n  <br>", "option3": "Convicted\n  <br>", "option4": "Sentenced\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": , "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Sentence (S1) states that the teacher engaged students in interactive discussions, encouraging critical thinking and participation.\n  <br>· Sentence (R) states that collaborative projects were assigned, promoting teamwork and developing interpersonal skills. This choice is fitting because collaborative projects require active engagement, critical thinking, and encourage students to work together.\n  <br>· For (S3), the sentence needs to describe a teacher's action that complements the interactive discussions and collaborative projects mentioned in S1 and S2. Sentence (Q) fits this requirement as it states that the teacher provided personalized feedback and guidance, addressing individual learning needs\n  <br>· Finally, (S4) states that the students demonstrated significant academic growth, achieving exceptional results in their exams.\n  <br>· Therefore, the correct answer is option (b) R, Q.\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "Select the option that is the indirect form of the given sentence.\n  <br>The patient said, “I ought to avoid fried food.”\n  <br>", "option1": "The patient said that he would avoid fried food.\n  <br>", "option2": "The patient said that he ought to avoid fried food.\n  <br>", "option3": "The patient asked if he can avoid fried food.\n  <br>", "option4": "The patient said that he might have to avoid fried food.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option b.\n  <br>· The given sentence is ‘Direct Speech’.\n  <br>· \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br>· \n  <b>Indirect Speech</b> - Reporting the message of the speaker in our own words.\n  <br>· The given sentence is an ‘Assertive Sentence.’\n  <br>· While changing it into an indirect form, we consider following rules.\n  <br>· Reported Verb – ‘Said’ remains unchanged.\n  <br>· Conjunction – In the Assertive sentence conjunction ‘That’ is used.\n  <br>· Tense - \n  <b>Ought to</b> remains unchanged.\n  <br>· The sentence thus formed is - The patient said that he ought to avoid fried food.\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "Select the option that is the passive form of the given sentence.\n  <br>Scientists have discovered a new species of marine life in the deep ocean.\n  <br>", "option1": "A new species of marine life has been discovered by scientists in the deep ocean.\n  <br>", "option2": "The deep ocean has been discovered to contain a new species of marine life by scientists.\n  <br>", "option3": "Scientists had discovered a new species of marine life in the deep ocean.\n  <br>", "option4": "A new species of marine life was discovered by scientists in the deep ocean.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br>· \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br>· The sentence is an example of active voice having form:\n  <br>· Subject + has/have+ V3+ object.\n  <br>· When it is converted into passive voice, following rule is followed:\n  <br>· Object+ has/have+ been+ V3+ by + subject.\n  <br>· The sentence thus formed is- A new species of marine life has been discovered by scientists in the deep ocean.\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "Select the option that is the active form of the given sentence.\n  <br>The decision to implement the new policy was made by the board of directors.\n  <br>", "option1": "Implementing the new policy was the decision made by the board of directors.\n  <br>", "option2": "The new policy was implemented by the decision made by the board of directors.\n  <br>", "option3": "The decision made by the board of directors was to implement the new policy.\n  <br>", "option4": "The board of directors made the decision to implement the new policy.\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Active Voice</b>- It denotes that the noun or pronoun that acts as the subject in the sentence is the doer of the action. In other words, the subject performs the action or acts upon the verb.\n  <br>· \n  <b>Passive Voice- </b>represents that the subject is one acted upon by the action or verb in the sentence. It can also be said that the passive voice indicates that the subject in the sentence is no longer active but passive.\n  <br>· The sentence is an example of passive voice having form:\n  <br>· Obj. + was/were + V3 + by + sub.\n  <br>· When it is converted into active voice, following rule is followed:\n  <br>· Sub + V2+ obj.\n  <br>· The sentence thus formed is- The board of directors made the decision to implement the new policy.\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "Select the option that is the indirect form of the given sentence.\n  <br>The manager said to his employee, “Why didn’t you send a leave application to me?\n  <br>", "option1": "The manager asked his employee why he had not sent a leave application to him.\n  <br>", "option2": "The manager asked his employee why he has not sent a leave application to him.\n  <br>", "option3": "The manager told his employee that he had not sent a leave application to him.\n  <br>", "option4": "The manager ordered his employee to send a leave application to him.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option a.\n  <br>· The given sentence is ‘Direct Speech’.\n  <br>· \n  <b>Direct Speech</b> - Reporting the message of the speaker in the exact words as spoken by him.\n  <br>· The given sentence is an ‘Interrogative sentence.’\n  <br>· Sentences that ask questions are called interrogative sentences. Every interrogative sentence ends with a question mark. There are two main kinds of interrogative sentences. Those which start with an auxiliary verb and those which start with a question word such as what, why, when, where, how etc.\n  <br>· While changing it into indirect form, we consider following the rules.\n  <br>· Reported Verb – ‘Said to’ changes to ‘Asked’.\n  <br>· Conjunction – Wh-word itself will act as a conjunction.\n  <br>· Tense - Past simple (Subject+V2+Object) changes to Past perfect (Subject + had + V3 + Object).\n  <br>· The sentence thus formed is - The manager asked his employee why he had not sent a leave application to him.\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "Select the most appropriate option for the blank no. 96.\n  <br>", "option1": "disliked\n  <br>", "option2": "liked\n  <br>", "option3": "hated\n  <br>", "option4": "adored\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is ‘liked’ to make the sentence grammatically and contextually correct.\n  <br>· ‘Like’ means to have a fondness or preference for something.\n  <br>· As per the context, the word ‘liked’ fits in very well & hence, it is the correct option.\n  <br>Meaning of other words:\n  <br>· Dislike - means to feel distaste for or hostility towards something.\n  <br>· Hate - means to feel intense or passionate dislike for someone or something.\n  <br>· Adore - means to love and respect someone deeply.\n  <br>· Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "Select the most appropriate option for the blank no. he most appropriate option for the blank no. 99.\n  <br>", "option1": "element\n  <br>", "option2": "piece\n  <br>", "option3": "component\n  <br>", "option4": "part\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is ‘component’ to make the sentence grammatically and contextually correct.\n  <br>· Component refers to a fundamental or essential part of something. It indicates that grains play a crucial role as a necessary element or constituent of many diets worldwide.\n  <br>· As per the context, the word ‘component’ fits in very well & hence, it is the correct option.\n  <br>Meaning of other words:\n  <br>· Piece - means a portion of an object or of material, produced by cutting, tearing, or breaking the whole.\n  <br>· Element - means a part or aspect of something abstract, especially one that is essential or characteristic.\n  <br>· Part - means a piece or segment of something such as an object, activity, or period of time, which combined with other pieces makes up the whole.\n  <br>· Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "Select the most appropriate option for the blank no. 100.\n  <br>", "option1": "consumed\n  <br>", "option2": "ignored\n  <br>", "option3": "prohibited\n  <br>", "option4": "destroyed\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The word that can be filled in the blank is ‘consumed’ to make the sentence grammatically and contextually correct.\n  <br>· ‘Consumed’ means to eat, drink, or ingest (food or drink).\n  <br>· As per the context, the word ‘consumed’ fits in very well & hence, it is the correct option.\n  <br>Meaning of other words:\n  <br>· Ignored - means to pay no attention to; disregard.\n  <br>· Prohibited - means to formally forbid (something) by law, rule, or other authority.\n  <br>· Destroyed - means to damage something so badly that it cannot be repaired. It is not appropriate in the given context.\n  <br>· Thus, all the other given words have different meanings and do not fit in the context of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What made the golden fish in the pool special?\n  <br>", "option1": "It had a long, flowing tail\n  <br>", "option2": "It was larger than any other fish Jack had seen\n  <br>", "option3": "It was able to speak\n  <br>", "option4": "It could grant wishes\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) It was able to speak.\n  <br>The passage mentions that the golden fish spoke to Jack, indicating that it had the ability to communicate in a human language.\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "How did Jack become the protector of his village?\n  <br>", "option1": "He was elected by the village council\n  <br>", "option2": "He was chosen by the golden fish\n  <br>", "option3": "He defeated the bandits and wild animals that threatened the village\n  <br>", "option4": "He inherited the title from his father\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (b) He was chosen by the golden fish.\n  <br>The passage states that the golden fish granted Jack's wish for the power to protect his village, which suggests that Jack was chosen by the fish to become the village's protector.\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "What did Jack do to remember the magic of the glade and the golden fish?\n  <br>", "option1": "He visited the shimmering pool\n  <br>", "option2": "He told stories to the children of the village\n  <br>", "option3": "He created a painting of the golden fish\n  <br>", "option4": "He wrote a book about his adventure\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) He visited the shimmering pool.\n  <br>The passage states that Jack would visit the pool to remember the day that changed his life forever.\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "How did Jack treat the golden fish when he met it?\n  <br>", "option1": "He caught it and took it home with him\n  <br>", "option2": "He ignored it and continued on his hike\n  <br>", "option3": "He showed kindness and did not harm it or its home\n  <br>", "option4": "He tried to eat it\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (c) He showed kindness and did not harm it or its home.\n  <br>The passage mentions that Jack did not harm the fish or its home, and instead showed kindness by not harming the fish.\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "What lesson can be learned from Jack's encounter with the golden fish?\n  <br>", "option1": "Kindness and courage are rewarded\n  <br>", "option2": "Wishes always come true\n  <br>", "option3": "It is important to explore new places\n  <br>", "option4": "Gold is the key to happiness\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is (a) Kindness and courage are rewarded.\n  <br>The passage suggests that Jack's kindness and courage in not harming the golden fish and its home led to the fish granting him a wish and ultimately becoming the protector of his village.\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "2011 की जनगणना के अनुसार भारत में निम्नलिखित में से किस राज्य की जन्म दर सबसे अधिक है?\n  <br>", "option1": "केरल\n  <br>", "option2": "पंजाब\n  <br>", "option3": "महाराष्ट्र\n  <br>", "option4": "बिहार\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d), बिहार है।\n  <br>2011 की जनगणना के अनुसार, बिहार में प्रति महिला 3.2 बच्चों की कुल प्रजनन दर (टीएफआर) के साथ, भारत में सबसे अधिक प्रजनन दर है। इसके बाद उत्तर प्रदेश (3.0), मध्य प्रदेश (2.7), राजस्थान (2.6), असम (2.3), छत्तीसगढ़ (2.4), और झारखंड (2.5) हैं। प्रति महिला 1.6 बच्चों की टीएफआर के साथ केरल में प्रजनन दर भारत में सबसे कम है।\n  <br>पंजाब और महाराष्ट्र में टीएफआर क्रमशः 2.1 और 2.2 है।\n  <br>भारत के रजिस्ट्रार जनरल (आरजीआई) के तहत नमूना पंजीकरण प्रणाली (एसआरएस) के नवीनतम अनुमान (2017 के लिए) ने देश की टीएफआर 2.2 आंकी है।\n  <br>टीएफआर प्रसव उम्र के अंत में एक महिला से पैदा हुए बच्चों की संख्या को मापता है।\n  <br>नोट - राष्ट्रीय परिवार स्वास्थ्य सर्वेक्षण-5 (2019-21) के नवीनतम आंकड़ों के अनुसार, विकल्पों में उल्लिखित राज्यों की कुल प्रजनन दर (टीएफआर) इस प्रकार है:\n  <br>(a) केरल: 1.8\n  <br>(b) पंजाब: 1.6\n  <br>(c) महाराष्ट्र: 1.7\n  <br>(d) बिहार: 3.0\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "वर्ष 1962 में, किसने 'द हिस्ट्री ऑफ ओशन बेसिन्स' प्रकाशित किया, जिसने इस सिद्धांत को रेखांकित किया कि टेक्टोनिक प्लेटें कैसे घूम सकती हैं, जिसे बाद में 'समुद्र तल का प्रसार' कहा गया?\n  <br>", "option1": "जॉर्ज एडवर्ड बैकस\n  <br>", "option2": "अल्फ्रेड वेगेनर\n  <br>", "option3": "लुई बाउर\n  <br>", "option4": "हैरी हैमंड हेस\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (d) हैरी हैमंड हेस है।\n  <br>हैरी हैमंड हेस एक अमेरिकी समुद्री भूविज्ञानी और भूभौतिकीविद् थे, जिन्होंने 1962 में \"द हिस्ट्री ऑफ ओशन बेसिन्स\" पेपर प्रकाशित किया था। इस पेपर में, उन्होंने इस सिद्धांत को रेखांकित किया कि टेक्टोनिक प्लेटें कैसे घूम सकती हैं, जिसे बाद में \"समुद्र तल का प्रसार\" कहा गया। इस सिद्धांत ने पृथ्वी की पपड़ी और उसके विकास के बारे में हमारी समझ में क्रांति ला दी।\n  <br>अल्फ्रेड वेगेनर एक जर्मन मौसम विज्ञानी थे जिन्होंने 1912 में महाद्वीपीय बहाव के सिद्धांत का प्रस्ताव रखा था, लेकिन उन्होंने समुद्र तल के फैलाव के सिद्धांत का प्रस्ताव नहीं दिया था।\n  <br>तो, उत्तर (d) हैरी हैमंड हेस है।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "कॉलम को सुमेलित कीजिए।\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694415055635image48.png\"> \n  <br>", "option1": "A-IV, B-III, C-I, D-II\n  <br>", "option2": "A-I, B-II, C-IV, D-III\n  <br>", "option3": "A-II, B-III, C-IV, D-I\n  <br>", "option4": "A-II, B-I, C-III, D-IV\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही मिलान है - (b) A-I, B-II, C-IV, D-III.\n  <br> (a) बॉक्साइट - (I) लोहरदगा\n  <br>(b) अभ्रक - (II) भीलवाड़ा\n  <br>(c) कोयला - (IV) झरिया\n  <br>(d) तांबा - (III) झुंझुनू\n  <br>नोट - बॉक्साइट वह अयस्क है जिसका उपयोग एल्युमीनियम के निर्माण में किया जाता है। ओडिशा बॉक्साइट का सबसे बड़ा उत्पादक राज्य है। कालाहांडी और संबलपुर प्रमुख उत्पादक हैं।\n  <br>लोहरदगा में झारखंड की पठारी भूमि में बॉक्साइट के प्रचुर भंडार हैं।\n  <br>अभ्रक का उपयोग मुख्यतः विद्युत एवं इलेक्ट्रॉनिक उद्योगों में किया जाता है। राजस्थान में अभ्रक बेल्ट जयपुर से भीलवाड़ा और उदयपुर के आसपास लगभग 320 किलोमीटर तक फैली हुई है।\n  <br>रानीगंज के बाद झरिया सबसे बड़ा कोयला क्षेत्र है।\n  <br>तांबे का भंडार मुख्य रूप से झारखंड में सिंहभूम जिले, मध्य प्रदेश में बालाघाट जिले और राजस्थान में झुंझुनू और अलवर जिलों में होता है।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "वेंकटरमन रामकृष्णन को उनके निम्न में से किसमे योगदान के लिए संयुक्त रूप से रसायन विज्ञान में वर्ष 2009 के नोबेल पुरस्कार से सम्मानित किया गया है?\n  <br>", "option1": "राइबोसोमल असेंबली में आणविक शासक की पहचान करना जो कोशिकाओं में प्रोटीन के त्रुटि मुक्त संश्लेषण को सुनिश्चित करता है\n  <br>", "option2": "जीवन रक्षक एंटीबायोटिक दवाओं के एक समूह का संश्लेषण करने के लिए\n  <br>", "option3": "जेलीफ़िश के हरे फ्लोरोसेंट प्रोटीन पर काम के लिए\n  <br>", "option4": "कोशिकाओं में राइबोसोम की बड़ी उपइकाइयों को सफलतापूर्वक क्रिस्टलीकृत करने के लिए\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "विकल्प (a) सही उत्तर है। वेंकटरमन रामकृष्णन को राइबोसोमल असेंबली में आणविक शासक की पहचान करने में उनके योगदान के लिए थॉमस ए स्टिट्ज़ और एडा योनाथ के साथ रसायन विज्ञान में 2009 के नोबेल पुरस्कार से सम्मानित किया गया था, जो कोशिकाओं में प्रोटीन के त्रुटि मुक्त संश्लेषण को सुनिश्चित करता है।\n  <br>राइबोसोम कोशिका की प्रोटीन फ़ैक्टरियाँ हैं। वे डीएनए में आनुवंशिक जानकारी को प्रोटीन में अनुवाद करने के लिए जिम्मेदार हैं। राइबोसोम प्रोटीन और आरएनए से बना एक जटिल अणु है। राइबोसोम की बड़ी उप-इकाई डीएनए में आनुवंशिक जानकारी को डिकोड करने के लिए जिम्मेदार है।\n  <br>", "question_heading": ""}, {"sr_no": 110, "question": "सूची I को सूची II से सुमेलित करें और सूचियों के नीचे दिए गए कूट का उपयोग करके सही उत्तर चुनें:\n  <br> \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694415055636image49.png\"> \n  <br>", "option1": "a\n  <br>", "option2": "b\n  <br>", "option3": "c\n  <br>", "option4": "d\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (c) है।\n  <br>    मिलान इस प्रकार है:\n  <br>  \n  <img src=\"https://appxcontent.kaxa.in/test-series-assets/1694415055303image99.png\"> \n  <br>अतः, सही कूट 4321 है।\n  <br> राष्ट्रीय आयुर्वेद संस्थान भारत में आयुर्वेद में प्रशिक्षण और अनुसंधान के लिए शीर्ष संस्थान है, जिसे भारत सरकार के स्वास्थ्य और परिवार कल्याण मंत्रालय द्वारा 1976 में जयपुर में स्थापित किया गया था।\n  <br>  राष्ट्रीय होम्योपैथी संस्थान (NIH) भारत सरकार के आयुर्वेद, योग और प्राकृतिक चिकित्सा, यूनानी, सिद्ध और होम्योपैथी (AYUSH) मंत्रालय के तहत एक स्वायत्त संगठन है। भारत की। यह कोलकाता में स्थित है.\n  <br>  राष्ट्रीय यूनानी चिकित्सा संस्थान (NIUM) भारत सरकार के आयुष मंत्रालय के तहत एक स्वायत्त संगठन है जो 2004 से काम कर रहा है। यह बैंगलोर में स्थित है।\n  <br>  राष्ट्रीय सिद्ध संस्थान सिद्ध चिकित्सा के अध्ययन और अनुसंधान के लिए एक संस्थान है। इसकी स्थापना 2005 में तांबरम, चेन्नई, भारत में हुई थी।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "'ट्रिपल्स' किसका एक नया प्रारूप है\n  <br>", "option1": "मुक्केबाज़ी\n  <br>", "option2": "जूडो\n  <br>", "option3": "शतरंज\n  <br>", "option4": "बैडमिंटन\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (d), बैडमिंटन है।\n  <br> ट्रिपल्स बैडमिंटन का एक नया प्रारूप है जिसे बैडमिंटन वर्ल्ड फेडरेशन (बीडब्ल्यूएफ) द्वारा पेश किया गया था। यह एक टीम खेल है जो प्रत्येक टीम के तीन खिलाड़ियों के बीच खेला जाता है। यह खेल एक मानक बैडमिंटन कोर्ट पर खेला जाता है, और नियम युगल बैडमिंटन के समान हैं। हालाँकि, कुछ प्रमुख अंतर हैं। ट्रिपल्स बैडमिंटन में, प्रत्येक टीम में कम से कम एक महिला खिलाड़ी होनी चाहिए। इसके अतिरिक्त, खिलाड़ियों को क्रमिक रूप से रिटर्न हिट करने की अनुमति नहीं है।\n  <br> ट्रिपल्स बैडमिंटन अपेक्षाकृत नया खेल है, लेकिन इसकी लोकप्रियता बढ़ रही है। यह खिलाड़ियों के लिए अपने कौशल में सुधार करने और मनोरंजन करने का एक शानदार तरीका है।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "जी. सुब्रमण्यम अय्यर के बारे में निम्नलिखित में से कौन-सा सत्य है?\n  <br>", "option1": "'द हिंदू' समाचार पत्र की स्थापना की\n  <br>", "option2": "तमिल समाचार पत्र 'स्वदेशमित्रन' की स्थापना की\n  <br>", "option3": "मद्रास महाजन सभा की सह-स्थापना की\n  <br>", "option4": "ये सभी\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (d) है। गणपति दीक्षित सुब्रमण्यम अय्यर (1855-1916) एक प्रमुख भारतीय पत्रकार, समाज सुधारक और स्वतंत्रता सेनानी थे, जिन्होंने 20 सितंबर 1878 को अंग्रेजी अखबार 'द हिंदू' की स्थापना की। वह संगठन जिसका गठन मद्रास प्रेसीडेंसी में सामाजिक और राजनीतिक सुधार को बढ़ावा देने के लिए किया गया था।\n  <br> जी सुब्रमण्यम अय्यर भारतीय स्वतंत्रता आंदोलन में एक प्रमुख व्यक्ति थे और वह अपने प्रगतिशील विचारों के लिए जाने जाते थे। वह महिला शिक्षा के प्रबल समर्थक थे और उन्होंने गरीबों की स्थिति में सुधार के लिए भी काम किया। जनता के प्रति उनकी सेवाओं के लिए उन्हें 1900 में ब्रिटिश सरकार द्वारा कैसर-ए-हिंद गोल्ड मेडल से सम्मानित किया गया था।\n  <br>इसलिए, विकल्प (d) ये सभी सही है।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "क्योटो प्रोटोकॉल के संबंध में निम्नलिखित में से कौन-सा/से कथन सही है/हैं?\n  <br>A. क्
