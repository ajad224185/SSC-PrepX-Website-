b-v2.akamai.net.in/paperimages/1742977250_1742977250598356_thump.png\" style=\"width: 200px; height: 126px;\" /></p>\r\n\r\n<p><strong>वर्णमाला में </strong><span>व्यंजन के </span><strong>स्थितीय मान में +3 जोड़ा जाता हैं।</strong></p>\r\n\r\n<p><span>वर्णमाला में </span><strong>स्वर के स्थितीय मान का उपयोग किया जाता हैं।</strong></p>\r\n\r\n<p>&#39;CATHOLIC&#39; को &#39;61231141536&#39; के रूप में कूटित किया गया है</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977329_1742977329502746_thump.png\" style=\"width: 200px; height: 110px;\" /></figure>\r\n\r\n<p><span>और</span></p>\r\n\r\n<p>&#39;ENTIRELY&#39; को &#39;2172332121528&#39; के रूप में कूटित किया गया है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977395_1742977395626378_thump.png\" style=\"width: 200px; height: 111px;\" /></figure>\r\n\r\n<p><span>इसी प्रकार,</span></p>\r\n\r\n<p><span>&#39;INFORMAL&#39; को कूटित किया जायेगा :</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977425_1742977425811160_thump.png\" style=\"width: 200px; height: 110px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;317942116115&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 43, "question": "\r\n<p>84 व्यक्तियों का एक समूह मिलकर किसी कार्य को 17 दिनों में पूरा करते है तो उसी कार्य को 119 व्यक्तियों द्वारा मिलकर कितने दिनों में पूरा किया जा सकता है?</p>", "option1": "\r\n<p>12 <span>दिनों </span></p>", "option2": "\r\n<p>18 <span>दिनों </span></p>", "option3": "\r\n<p>14 <span>दिनों </span></p>", "option4": "\r\n<p>15 <span>दिनों </span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong><span>दिया गया है</span>:</strong></p>\r\n\r\n<p><span>84 व्यक्ति किसी कार्य को 17 दिन में पूरा करते हैं।</span></p>\r\n\r\n<p><strong><span>प्रयुक्त सूत्र:</span></strong></p>\r\n\r\n<p>M<sub>1</sub>D<sub>1</sub> = M<sub>2</sub>D<sub>2</sub></p>\r\n\r\n<p>जहाँ, M<sub>1</sub><span>और </span>M<sub>2</sub><span> पुरुषों की संख्या है।</span></p>\r\n\r\n<p>D<sub>1</sub> और D<sub>2</sub><span>दिनों की संख्या है।</span></p>\r\n\r\n<p><strong><span>गणना</span>:</strong></p>\r\n\r\n<p><span>हमारे पास है,</span></p>\r\n\r\n<p>&rArr; M<sub>1</sub> = 84, M<sub>2</sub> = 119, D<sub>1</sub> = 17, D<sub>2</sub> = ?</p>\r\n\r\n<p>&rArr; 84 &times; 17 = 119 &times; D<sub>2</sub></p>\r\n\r\n<p>&rArr; D<sub>2</sub> = <span class=\"math-tex\">\\(\\frac{1428}{119}\\)</span></p>\r\n\r\n<p>&rArr; D<sub>2</sub> = 12</p>\r\n\r\n<p><strong><span>&there4; उस कार्य को 119 व्यक्ति 12 दिनों में कर सकते हैं।</span></strong></p>", "question_heading": ""}, {"sr_no": 44, "question": "\r\n<p>यदि निम्नलिखित शीट को मोड़कर एक घन बनाया जाए, तो दी गई आकृति में से कौन-सी आकृति संभव है?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977548_1742977548219812_thump.png\" style=\"width: 100px; height: 133px;\" /></figure>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977573_1742977573838287_thump.png\" style=\"width: 300px; height: 91px;\" /></figure>", "option1": "\r\n<p>केवल C तथा B</p>", "option2": "\r\n<p>केवल A तथा C</p>", "option3": "\r\n<p>केवल <span>A तथा D</span></p>", "option4": "\r\n<p>केवल C तथा D</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिए गए खुले पासे के लिए:</p>\r\n\r\n<p>P और R को छोड़कर सभी चार अक्षर पंक्ति से बाहर हैं। इसलिए, वे एक दूसरे के विपरीत हैं जैसा कि नीचे दिखाया गया है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977646_1742977646356118_thump.png\" style=\"width: 100px; height: 116px;\" /></figure>\r\n\r\n<p>अगला, हम उन सभी अक्षरों को लेते हैं जो पंक्ति में हैं। यहाँ, Q, U के विपरीत है और T, S के विपरीत है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977677_1742977677149161_thump.png\" style=\"width: 100px; height: 116px;\" /></figure>\r\n\r\n<p>इस प्रकार, हम के विपरीत कह सकते हैं</p>\r\n\r\n<p><span>Q &hArr; U, T  &hArr; S, P &hArr; R</span></p>\r\n\r\n<p>इसलिए, जब घन को मोड़ा जाता है तो हमारे पास निम्नानुसार घन होगा: </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977720_1742977720561559_thump.png\" style=\"width: 200px; height: 121px;\" /></figure>\r\n\r\n<p>अत: सही उत्तर <strong>&#39;विकल्प 2&#39;</strong> है।</p>", "question_heading": ""}, {"sr_no": 45, "question": "\r\n<p>दिए गए विकल्पों में से उस आकृति का चयन कीजिए जो निम्नलिखित शृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर आ सकती है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977828_1742977828614912_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977894_1742977894721934_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977937_1742977937773803_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978000_1742978000886089_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978032_1742978032185486_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया तर्क इस प्रकार है:</p>\r\n\r\n<p>चरण I: E अगले बॉक्स में अपने दर्पण प्रतिबिम्ब के साथ कोनों पर घूम रहा है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978092_1742978092361604_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>चरण II: P अगले बॉक्स में <span>अपने  दर्पण प्रतिबिम्ब</span> के साथ कोनों पर घूम रहा है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978116_1742978116306926_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>चरण III: अगले बॉक्स में पंक्तियों में 1 की वृद्धि हो रही है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978174_1742978174660776_thump.png\" style=\"width: 300px; height: 65px;\" /></figure>\r\n\r\n<p>इसलिए, शृंखला इस प्रकार होगी:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978402_1742978402918767_thump.png\" style=\"width: 300px; height: 61px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;विकल्प 2&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 46, "question": "\r\n<p>दिए गए अक्षर-समूहों में से कौन-सा, <span>निम्नलिखित श्रृंखला में </span>प्रश्नवाचक चिह्न (?) के स्थान पर आएगा?</p>\r\n\r\n<p>EGAU, GKCX, IOEA, ?, MWIG </p>", "option1": "\r\n<p>KSHD</p>", "option2": "\r\n<p>KTGD</p>", "option3": "\r\n<p>KSGD</p>", "option4": "\r\n<p>KTHD</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978606_1742978606212429_thump.png\" style=\"width: 300px; height: 68px;\" /></figure>\r\n\r\n<div>यहाँ अनुसरण किया गया पैटर्न निम्नलिखित है:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978580_1742978580736716_thump.png\" style=\"width: 100px; height: 323px;\" /></figure>\r\n</div>\r\n\r\n<p>अतः सही उत्तर <strong>विकल्प (3)</strong> है।</p>", "question_heading": ""}, {"sr_no": 47, "question": "\r\n<p>एक बैग में 5 काली और 6 सफेद गेंदें हैं; 1 गेंद को बैग से निकाला जाता है। क्या संभावना है कि निकली गई गेंदें काली हैं?</p>", "option1": "\r\n<p>6/11</p>", "option2": "\r\n<p>5/6</p>", "option3": "\r\n<p>5/11</p>", "option4": "\r\n<p>2/5</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया हुआ है</span></p>\r\n\r\n<p>काली गेंदों की संख्या = 5</p>\r\n\r\n<p>सफेद गेंदों की संख्या = 6</p>\r\n\r\n<p><span>सूत्र</span></p>\r\n\r\n<p>संभाव्यता = अनुकूल संख्या/कुल संभावित संख्या</p>\r\n\r\n<p><span>गणना</span></p>\r\n\r\n<p>अनुकूल संख्या = काली गेंदों की संख्या = 5 </p>\r\n\r\n<p>कुल संभावित संख्या = सभी गेंदों की कुल संख्या = 6 + 5 = 11</p>\r\n\r\n<p>&there4; संभावना = 5/11</p>", "question_heading": ""}, {"sr_no": 48, "question": "\r\n<p>यदि एक गोले का पृष्ठीय क्षेत्रफल 20 cm<sup>2</sup> है तब समान त्रिज्या वाले एक <span>अर्धगोले </span>का कुल पृष्ठीय क्षेत्रफल क्या होगा?</p>", "option1": "\r\n<p>20 <span>cm</span><sup>2</sup></p>", "option2": "\r\n<p>15 <span>cm</span><sup>2</sup></p>", "option3": "\r\n<p>40 <span>cm</span><sup>2</sup></p>", "option4": "\r\n<p>10 <span>cm</span><sup>2</sup></p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>एक गोले का पृष्ठीय क्षेत्रफल 20 cm<sup>2</sup> है।</p>\r\n\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p>एक गोले का पृष्ठीय क्षेत्रफल = 4&pi;r<sup>2</sup></p>\r\n\r\n<p>एक <span>अर्धगोले </span>का कुल <span>पृष्ठीय क्षेत्रफल</span> = 3<span>&pi;r</span><sup>2</sup></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>प्रश्न के अनुसार,</p>\r\n\r\n<p>गोले की त्रिज्या = अर्धगोले की त्रिज्या = r</p>\r\n\r\n<p>एक गोले का पृष्ठीय क्षेत्रफल<span> = 4&pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; 20 = <span>4&pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; <span>&pi;r<sup>2</sup> = <span class=\"math-tex\">\\(\\dfrac{20}{4}\\)</span> = 5</span></p>\r\n\r\n<p><span>एक अर्धगोले का कुल पृष्ठीय क्षेत्रफल = 3&pi;r</span><sup>2</sup></p>\r\n\r\n<p>&rArr; 3 &times; 5 = 15 cm<sup>2</sup>   (<span>&pi;r</span><sup>2  = 5</sup>)</p>\r\n\r\n<p><strong>&there4; एक अर्धगोले का कुल पृष्ठीय क्षेत्रफल 15 cm<sup>2</sup> है।</strong></p>", "question_heading": ""}, {"sr_no": 49, "question": "\r\n<p>एक ट्रेन 30 मिनट 80 किमी/घंटा की गति से और अगले 30 मिनट 90 किमी/घंटा की गति से चलती है। तो औसत गति ज्ञात कीजिए।</p>", "option1": "\r\n<p><span>40 </span>किमी/घंटा</p>", "option2": "\r\n<p><span>45 </span>किमी/घंटा</p>", "option3": "\r\n<p><span>85 </span>किमी/घंटा</p>", "option4": "\r\n<p><span>95 </span>किमी/घंटा</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>30 मिनट की गति = 80 किमी/घंटा</p>\r\n\r\n<p>30 मिनट की गति = 90 किमी/घंटा</p>\r\n\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p><span class=\"math-tex\">\\(Average \\;speed = \\dfrac{total\\; distance}{total\\;time}\\)</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>कुल समय = (30+30) मिनट = <span class=\"math-tex\">\\(\\dfrac{60}{60}= 1hour\\)</span></p>\r\n\r\n<p>30 मिनट में तय की गई दूरी = <span class=\"math-tex\">\\(80\\times \\dfrac{30}{60}= 40 \\;km\\)</span></p>\r\n\r\n<p>30 मिनट में तय की गई दूरी = <span class=\"math-tex\">\\(90\\times \\dfrac{30}{60}=45\\;km\\)</span></p>\r\n\r\n<p>कुल दूरी = 40 + 45 = 85 किमी.</p>\r\n\r\n<p><span class=\"math-tex\">\\(Average \\;speed = \\dfrac{85}{1}=85\\;km/h\\)</span></p>\r\n\r\n<p>&there4; <strong>औसत गति 85 किमी/घंटा है।</strong></p>", "question_heading": ""}, {"sr_no": 50, "question": "\r\n<p><span>कक्षा का औसत भार 60 किग्रा है और कक्षा में लड़कों का औसत भार 80 किग्रा है। कक्षा में लड़कों का लड़कियों से अनुपात 5 : 4 है यदि कक्षा में 72 छात्र हैं। लड़कियों का औसत वजन ज्ञात कीजिए</span></p>", "option1": "\r\n<p>45</p>", "option2": "\r\n<p>35</p>", "option3": "\r\n<p>40</p>", "option4": "\r\n<p>30</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>वर्ग का औसत भार = 60 किग्रा</p>\r\n\r\n<p>कक्षा में लड़कों का औसत भार = 80 किग्रा</p>\r\n\r\n<p>कक्षा में लड़कों का लड़कियों से अनुपात 5 : 4 है</p>\r\n\r\n<p>कक्षा में विद्यार्थियों की संख्या = 72</p>\r\n\r\n<p>लड़कियों की संख्या = 4/9 &times; 72</p>\r\n\r\n<p>&rArr; 32</p>\r\n\r\n<p>लड़कों की संख्या = 5/9 &times; 72</p>\r\n\r\n<p>&rArr; 40</p>\r\n\r\n<p>कक्षा में विद्यार्थियों का कुल भार = 72 &times; 60</p>\r\n\r\n<p>&rArr; 4320</p>\r\n\r\n<p>कक्षा में लड़के का कुल वजन = 40 &times; 80</p>\r\n\r\n<p>&rArr; 3200</p>\r\n\r\n<p>लड़कियों का कुल वजन = कुल वजन - लड़कों का कुल वजन</p>\r\n\r\n<p>&rArr; 4320 - 3200 = 1120</p>\r\n\r\n<p>लड़कियों का औसत वजन = 1120/32</p>\r\n\r\n<p>&rArr; 35</p>\r\n\r\n<p><span>&there4; अभीष्ट उत्तर 35 है।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": "\r\n<p>एक शोध अध्ययन ने 15 छात्रों के एक समूह की ऊँचाई मापी। परिणामी ऑंकड़ों में 6.8 सेमी का मानक विचलन था। इन छात्रों की ऊँचाई में कितना प्रसरण है?</p>", "option1": "\r\n<p>46.24 वर्ग सेमी</p>", "option2": "\r\n<p>42 <span>वर्ग सेमी</span></p>", "option3": "\r\n<p>22.22 <span>वर्ग सेमी</span></p>", "option4": "\r\n<p>29 <span>वर्ग सेमी</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>मानक विचलन (&sigma;) = 6.8 सेमी</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>प्रसरण केवल मानक विचलन का वर्ग है।</p>\r\n\r\n<p>&rArr; प्रसरण = (मानक विचलन)<sup>2</sup> = &sigma;&sup2;</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>जैसा कि प्रसारण केवल मानक विचलन का वर्ग है।</p>\r\n\r\n<p>&rArr; (6.8 सेमी)&sup2; = 46.24 वर्ग सेमी</p>\r\n\r\n<p><strong>&there4; छात्रों की ऊँचाइयों का प्रसरण 46.24 वर्ग सेमी है।</strong></p>", "question_heading": ""}, {"sr_no": 52, "question": "\r\n<p>नीचे एक कथन और उसके बाद दो निष्कर्ष दिए गए हैं। उपयुक्त विकल्प चुनकर बताएं कि कौन से निष्कर्ष कथन का अनुसरण करते हैं।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>आपको अपने व्यक्तिगत जीवन को अपने व्यावसायिक जीवन के साथ मिलाना उपयुक्त नहीं है।</p>\r\n\r\n<p><strong>निष्कर्ष:</strong></p>\r\n\r\n<p>I. व्यावसायिक और व्यक्तिगत जीवन को मिलाना किसी व्यक्ति के लिए अहितकर हो सकता है।</p>\r\n\r\n<p>II. गोपनीय व्यवसायिक जानकारी मित्रों और परिवार के साथ साझा करना अनुचित है।</p>", "option1": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है</p>", "option2": "\r\n<p><span>केवल निष्कर्ष II अनुसरण करता है</span></p>", "option3": "\r\n<p><span>निष्कर्ष I और II दोनों अनुसरण करते हैं</span></p>", "option4": "\r\n<p><span>न तो निष्कर्ष I और न ही निष्कर्ष II अनुसरण करता है</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>I. <span>व्यावसायिक और व्यक्तिगत जीवन को मिलाना किसी व्यक्ति के लिए अहितकर हो सकता है</span>। &rarr; अनुसरण नहीं करता है।</p>\r\n\r\n<p>कथन में इस बात का उल्लेख नहीं है कि <span>व्यावसायिक और व्यक्तिगत जीवन</span> को मिलाना <span>अहितकर</span> है या नहीं।</p>\r\n\r\n<p><span>II.</span> मित्रों और परिवार के साथ गोपनीय व्यावसायिक जानकारी साझा करना अनुचित है। &rarr; अनुसरण नहीं करता है।</p>\r\n\r\n<p>कथन में गोपनीय व्यावसायिक जानकारी के बारे में कुछ भी उल्लेख नहीं किया गया है।</p>\r\n\r\n<p>अतः,<strong> &#39;न तो निष्कर्ष I और न ही निष्कर्ष II अनुसरण करता है&#39;</strong> सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 53, "question": "\r\n<p>एक निश्चित कूट भाषा में, &#39;GLAND&#39; को &#39;GQDOJ&#39; लिखा जाता है और &#39;MEANS&#39; को &#39;<span>VQDHP</span>&#39; लिखा जाता है। उसी भाषा में &#39;CYSTS&#39; को किस प्रकार लिखा जाएगा?</p>", "option1": "\r\n<p>VWVCF</p>", "option2": "\r\n<p>FBVWV</p>", "option3": "\r\n<p>UVUAE</p>", "option4": "\r\n<p>VWVBF</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978813_1742978813181523_thump.png\" style=\"width: 300px; height: 72px;\" /></figure>\r\n\r\n<p><span>यहाँ दिया गया तर्क यह है:- (3) अंग्रेजी वर्णक्रम </span><strong><span>शृंखला </span></strong><span>के अनुसार, <strong>विकर्ण रूप से</strong> स्थितीय मान में जोड़ा जाता है।</span></p>\r\n\r\n<p><strong>इसलिए</strong>,</p>\r\n\r\n<ul>\r\n\t<li><span>&#39;GLAND&#39; को &#39;GQDOJ&#39; लिखा जाता है।</span></li>\r\n</ul>\r\n\r\n<div>\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978842_1742978842758788_thump.png\" style=\"width: 100px; height: 107px;\" /></figure>\r\n।</div>\r\n\r\n<p>और,</p>\r\n\r\n<ul>\r\n\t<li><span>&#39;MEANS&#39; को &#39;VQDHP&#39; लिखा जाता है।</span></li>\r\n</ul>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978964_1742978964914043_thump.png\" style=\"width: 100px; height: 105px;\" /></p>\r\n\r\n<p> \r\n<p><span>इसी प्रकार,</span></p>\r\n</p>\r\n\r\n<ul>\r\n\t<li><span>CYSTS&#39; को निम्न रूप में लिखा जाता है: </span></li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742978998_1742978998744994_thump.png\" style=\"width: 100px; height: 106px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <span>&quot;VWVBF&quot;</span> है।</p>", "question_heading": ""}, {"sr_no": 54, "question": "\r\n<p>स्वरूप का ध्यानपूर्वक अध्ययन कीजिए और दिए गए विकल्पों में से उस विकल्प का चयन कीजिए जो उसमे प्रश्नवाचक चिन्ह को प्रतिस्थापित कर सके।</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>33</td>\r\n\t\t\t<td>6</td>\r\n\t\t\t<td>54</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>26</td>\r\n\t\t\t<td>8</td>\r\n\t\t\t<td>36</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>30</td>\r\n\t\t\t<td>12</td>\r\n\t\t\t<td>?</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>", "option1": "\r\n<p>26</p>", "option2": "\r\n<p>63</p>", "option3": "\r\n<p>36</p>", "option4": "\r\n<p>62</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>तर्क: एक पंक्ति में;</strong></p>\r\n\r\n<p><strong>प्रथम अंक - द्वितीय अंक &times; 2 = तृतीय अंक</strong></p>\r\n\r\n<p><strong>पंक्ति 1:</strong></p>\r\n\r\n<p>33 - 6 = 27</p>\r\n\r\n<p>27 &times; 2 = 54</p>\r\n\r\n<p><strong>पंक्ति 2:</strong></p>\r\n\r\n<p>26 -8 = 18</p>\r\n\r\n<p>18 &times; 2 = 36</p>\r\n\r\n<p><strong>पंक्ति 3:</strong></p>\r\n\r\n<p>30 - 12 = 18</p>\r\n\r\n<p>18 &times; 2 =<strong> 36</strong></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;36&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 55, "question": "\r\n<p>यदि एक आयत की लंबाई में 5% की वृद्धि और चौड़ाई में 5% की कमी कर दी जाए, तो उसके क्षेत्रफल में कितनी <span>वृद्धि</span>/<span>कमी हो </span>जाएगी?</p>", "option1": "\r\n<p>0.25% की कमी</p>", "option2": "\r\n<p>0.25% की वृद्धि</p>", "option3": "\r\n<p><span>0.5% की कमी</span></p>", "option4": "\r\n<p><span>0.5% की वृद्धि</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>एक आयत की लंबाई में 5% की वृद्धि की जाती है और चौड़ाई में 5% की कमी की जाती है।</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>आयत का क्षेत्रफल = L &times; B</p>\r\n\r\n<p>यहाँ,</p>\r\n\r\n<p><span>L</span> = लंबाई</p>\r\n\r\n<p><span>B</span> = चौड़ाई</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>मान लीजिये, आयत की लंबाई और चौड़ाई 100L और 100B है<span>।</span></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<p><span>क्षेत्रफल </span>= 100L &times; 100B</p>\r\n\r\n<p>&rArr; 10000<span>LB</span></p>\r\n\r\n<p>अब,</p>\r\n\r\n<p>नई लंबाई = 100L + 100L &times; 5%</p>\r\n\r\n<p><span>&rArr; 105L</span></p>\r\n\r\n<p>नई चौड़ाई = 100B - 100B &times; 5%</p>\r\n\r\n<p><span>&rArr; 95B</span></p>\r\n\r\n<p>नया <span>क्षेत्रफल </span>= 105L &times; 95B</p>\r\n\r\n<p><span>&rArr; 9975LB</span></p>\r\n\r\n<p>क्षेत्रफल में कमी = 10000LB - 9975LB</p>\r\n\r\n<p><span>&rArr; 25LB</span></p>\r\n\r\n<p>क्षेत्रफल में परिवर्तन का प्रतिशत = (25LB/10000LB) &times; 100</p>\r\n\r\n<p>&rArr; 0.25%</p>\r\n\r\n<p><strong>&there4; इसके क्षेत्रफल में 0.25% <span>की कमी</span> हो जाएगी।</strong></p>", "question_heading": ""}, {"sr_no": 56, "question": "\r\n<p>A, B, C, D और E की उम्र <span>अलग-अलग </span>है। A, D से छोटा है लेकिन E से बड़ा है। केवल तीन व्यक्ति C से बड़े हैं। B सबसे छोटा है। उनमें से सबसे बड़ा कौन है?</p>", "option1": "\r\n<p>B</p>", "option2": "\r\n<p>A</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दी गई जानकारी के अनुसार,</p>\r\n\r\n<p>C से केवल तीन व्यक्ति बड़े हैं, जिसका अर्थ है कि <strong>C चौथा सबसे बड़ा व्यक्ति होगा।</strong></p>\r\n\r\n<p>B सबसे छोटा है, जिसका <strong>अर्थ है कि B अंतिम स्थान पर बैठा होगा।</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>B &lt; C &lt; &mdash; &lt; &mdash; <span>&lt; &mdash;</span></strong></li>\r\n</ul>\r\n\r\n<p>A, D से छोटा है लेकिन E से बड़ा है।</p>\r\n\r\n<ul>\r\n\t<li><strong>E <span>&lt; A &lt; D</span></strong></li>\r\n</ul>\r\n\r\n<p>अब, अंतिम व्यवस्था इस प्रकार होगी:-</p>\r\n\r\n<ul>\r\n\t<li><strong>B <span>&lt; C &lt; E &lt; A &lt; D</span></strong></li>\r\n</ul>\r\n\r\n<p>इसलिए, उपरोक्त व्यवस्था से, यह स्पष्ट है कि <strong>D सभी में सबसे बड़ा होगा।</strong></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;D&quot;</strong> है। </p>", "question_heading": ""}, {"sr_no": 57, "question": "\r\n\r\n<p>नीचे एक कथन और उसके बाद दो तर्क दिए गए हैं। आपको निर्णय लेना है कि कौन सा तर्क कथन में निहित है?</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>एक विज्ञापन दर्शाता है, &quot;कंपनी साक्षात्कार के लिए बाहर से आने वाले उम्मीदवारों को यात्रा भत्ता प्रदान करेगी।&quot;</p>\r\n\r\n<p><strong>तर्क:</strong></p>\r\n\r\n<p>I. कंपनी केवल बाहरी उम्मीदवारों का चयन करेगी।</p>\r\n\r\n<p>II. कंपनी द्वारा केवल उस ट्रेन का किराया दिया जाएगा, जो विज्ञापन में दिया गया है।</p>", "option1": "\r\n\r\n<p>I और II दोनों ही तर्क निहित हैं।</p>", "option2": "\r\n\r\n<p>ना तो I और न ही II निहित है।</p>", "option3": "\r\n\r\n<p>केवल तर्क I निहित है।</p>", "option4": "\r\n\r\n<p>केवल तर्क II निहित है।</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>विज्ञापन में सिर्फ इतना कहा गया है कि कंपनी बाहरी लोगों को यात्रा भत्ता देगी।</p>\r\n\r\n<ul>\r\n\t<li>उम्मीदवारों के चयन के बारे में और &quot;केवल&quot;   शब्द के उपयोग के बारे में कुछ भी नहीं कहा गया है। तो तर्क I अनुसरण नहीं करता है।</li>\r\n\t<li>विज्ञापन किसी ट्रेन को निर्दिष्ट नहीं करता है, इस प्रकार तर्क II अनुसरण नहीं करता है।</li>\r\n\t<li>इस प्रकार, कोई भी तर्क अनुसरण नहीं करता है।</li>\r\n</ul>\r\n\r\n<p>अतः सही उत्तर <strong>विकल्प 2 </strong>है।</p>\r\n\r\n<ol>\r\n\t<li>वह तर्क जो कथन का पुनर्निर्माण करने वाला हिस्सा है, एक मजबूत तर्क है।</li>\r\n\t<li>तर्क की कल्पना नहीं की जानी चाहिए।</li>\r\n\t<li>तर्क का संबंध कथन से प्रत्यक्ष होना चाहिए।</li>\r\n\t<li>तर्क सरल और स्पष्ट होना चाहिए।</li>\r\n\t<li>तर्क वैज्ञानिक तथ्यों पर आधारित होना चाहिए।</li>\r\n\t<li>तर्क में दिए गए कथन को तार्किक उत्तर मिलना चाहिए।</li>\r\n</ol>", "question_heading": ""}, {"sr_no": 58, "question": "\r\n<p>यदि एक धनात्मक संख्या और उसके वर्ग का योग 156 है, तब वह संख्या ज्ञात कीजिए।</p>", "option1": "\r\n<p>17</p>", "option2": "\r\n<p>12</p>", "option3": "\r\n<p>-13</p>", "option4": "\r\n<p>15</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>एक धनात्मक संख्या और उसके वर्ग का योग 156 है।</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>प्रश्न के अनुसार,</p>\r\n\r\n<p>x + x<sup>2</sup> = 156</p>\r\n\r\n<p>&rArr; x<sup>2</sup> + x - 156 = 0</p>\r\n\r\n<p>&rArr; x<sup>2</sup> + 13x - 12x - 156 = 0</p>\r\n\r\n<p>&rArr; x(x + 13) - 12(x + 13) = 0</p>\r\n\r\n<p>&rArr; (x + 13)(x - 12) = 0</p>\r\n\r\n<p>&there4; x = -13, 12 </p>\r\n\r\n<p><strong>&there4; धनात्मक संख्या 12 है।</strong></p>", "question_heading": ""}, {"sr_no": 59, "question": "\r\n<div>जब उत्पाद के मूल्य में 12% की कमी की गई, तो बिक्री की संख्या में 24% की वृद्धि हुई। प्रतिशत में कुल राजस्व पर क्या प्रभाव पड़ा?</div>", "option1": "\r\n<p>10.2 कमी </p>", "option2": "\r\n<p>9.12 <span>कमी </span></p>", "option3": "\r\n<p>10.2 वृद्धि </p>", "option4": "\r\n<p>9.12 <span>वृद्धि </span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>प्रयुक्त सूत्र:</strong></p>\r\n\r\n<p><span>राजस्व में % परिवर्तन = (नया राजस्व - प्रारंभिक राजस्व) / प्रारंभिक राजस्व] &times; 100</span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>मान लेते हैं कि उत्पाद का <span>प्रारंभिक मूल्य </span>100 रुपये है और <span>प्रारंभिक वस्तु </span>100 इकाई बिक चुके हैं।</p>\r\n\r\n<p>नया मूल्य = 100 - (100 का 12%) = 100 - 12 = 88 <span>रुपये</span></p>\r\n\r\n<p>प्रारंभिक बेची गई <span>संख्या में </span>वृद्धि = 100</p>\r\n\r\n<p>बेची गई नई संख्या = 100 + (100 का 24%) = 100 + 24 = 124 <span>इकाई </span></p>\r\n\r\n<p><span>प्रारंभिक </span>कुल आय = <span>प्रारंभिक मूल्य </span>&times; बेची गई <span>प्रारंभिक </span>संख्या</p>\r\n\r\n<p>&rArr; 100 &times; 100 = 10,000 <span>रुपये</span></p>\r\n\r\n<p>नया कुल राजस्व = 88 &times; 124 = 10,912 रुपये</p>\r\n\r\n<p>राजस्व में% परिवर्तन = [(नया राजस्व - प्रारंभिक राजस्व) / प्रारंभिक राजस्व] &times; 100</p>\r\n\r\n<p>&rArr; [(10,912 - 10,000) / 10,000] &times; 100</p>\r\n\r\n<p>&rArr;  [912 / 10,000] &times; 100 = 9.12%</p>\r\n\r\n<p><strong>अतः कुल राजस्व पर प्रभाव लगभग 9.12% की वृद्धि है।</strong></p>", "question_heading": ""}, {"sr_no": 60, "question": "\r\n\r\n<p>एक निश्चित कूट भाषा में GAINED को &#39;DGNKCG&#39; और &#39;GALAXY&#39; को &#39;YXCLCG&#39; लिखा जाता है। उस भाषा में &#39;GEARED&#39; को कैसे लिखा जाएगा?</p>", "option1": "\r\n\r\n<p>DGRCGF</p>", "option2": "\r\n\r\n<p>RGDGFC</p>", "option3": "\r\n\r\n<p>DGRCGG</p>", "option4": "\r\n\r\n<p>DGCRGG</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>अंग्रेजी वर्णमाला का स्थानीय मान नीचे दिया गया है:</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979264_1742979264315752_thump.png\" style=\"width: 400px; height: 100px;\" /></p>\r\n\r\n<p><strong>तर्क:</strong></p>\r\n\r\n<p><strong>चरण 1: व्यंजन जैसे हैं वैसे ही रखे गए हैं।</strong></p>\r\n\r\n<p><strong>चरण 2: स्वरों को + 2 से बढ़ाया जाता है।</strong></p>\r\n\r\n<p><strong>चरण 3: फिर कूट को उल्टे क्रम में लिखा जाता है।</strong></p>\r\n\r\n<p>GAINED को &#39;DGNKCG&#39; लिखा जाता है। </p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979368_1742979368497340_thump.png\" style=\"width: 150px; height: 165px;\" /></p>\r\n\r\n<p>और,</p>\r\n\r\n<p>&#39;GALAXY&#39; को &#39;YXDLDG&#39; लिखा जाता है। </p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979424_1742979424802975_thump.png\" style=\"width: 150px; height: 165px;\" /></p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>&#39;GEARED&#39; को &#39;?&#39; लिखा जायेगा: </p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742979512_1742979512143883_thump.png\" style=\"width: 150px; height: 165px;\" /></p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;DGRCGG&quot; </strong>है।</p>", "question_heading": ""}, {"sr_no": 61, "question": "\r\n\r\n<p>Liberal education enables a person to</p>", "option1": "\r\n\r\n<p>read with more discernment than others</p>", "option2": "\r\n\r\n<p>apply general principles to resolve issues</p>", "option3": "\r\n\r\n<p>gain prestige</p>", "option4": "\r\n\r\n<p>develop a clearer understanding of history than others</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo; <strong>apply general principles to resolve issues&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author talks about liberal education can equip man with <strong>fundamental powers of judgment </strong>and <strong>action </strong>which can be applied to various concerns of human life and also gives examples of how a liberal education helps people to make <em>wise choices </em>in choosing a hobby or dentistry.\r\n\r\n\t<ul>\r\n\t\t<li>From the <strong>fourth line </strong>of the passage &lsquo;&hellip; <em>the claim of liberal education that it can equip a man with <strong>fundamental powers of decision and action, </strong>applicable.&rsquo; </em>&hellip;.. In this context, option &lsquo;2&rsquo; is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Options 1, 3, and 4 are incorrect because there isn&#39;t sufficient supportive information in the passage to consider them to be the right answers.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;Liberal education enables a person to apply general principles to resolve issues. <em>&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 62, "question": "\r\n\r\n<p>According to the author, &#39;the great and varied concerns of human life&#39; are about</p>", "option1": "\r\n\r\n<p>fundamental rights</p>", "option2": "\r\n\r\n<p>challenges facing mankind</p>", "option3": "\r\n\r\n<p>tinkering hobbies</p>", "option4": "\r\n\r\n<p>liberal education</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo; <strong>challenges facing mankind&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author wants to say that liberal education can help us not only deal with our daily <strong>challenges but also with greater challenges that face the whole of mankind.</strong>\r\n\r\n\t<ul>\r\n\t\t<li>In the <strong>last sentence </strong>of the passage, the author says that liberal education may solve the various problems that arise in daily life. &lsquo;&hellip; <em>but to all the great and varied <strong>concerns </strong>of human life.&rsquo;&hellip;..</em></li>\r\n\t\t<li>&quot;Concern&quot; means &#39; <strong>worries&#39; </strong>and refers to being concerned about a situation.</li>\r\n\t\t<li>&quot;Worries of human life&quot; will convey the same meaning as &quot; <strong>the challenges faced by mankind </strong>.&quot; So, option &lsquo;2&rsquo; is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Other options &ldquo; <em>Fundamental rights, tinkering hobbies, and liberal education </em>&rdquo; represent phrases used in the passage. They do not state the meaning of the phrase in the given question. So, options 1,3 and 4 are incorrect.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;According to the author, &#39;the great and varied concerns of human life&#39; are about challenges facing mankind <em>.&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 63, "question": "\r\n\r\n<p>In this passage, the author stresses the importance of</p>", "option1": "\r\n\r\n<p>education for living</p>", "option2": "\r\n\r\n<p>technological advances</p>", "option3": "\r\n\r\n<p>increased interest in the study of history</p>", "option4": "\r\n\r\n<p>satisfying the desire for security</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo;<strong>increased interest in the study of history</strong><strong>&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;3&rsquo; is correct <em>,</em>In the passage, the author focus on how a liberal education makes us better able to face challenges and the real proof of the value of a liberal education may be seen in the histories and biographies of those who have achieved greatness according to accepted norms. From history, we can understand what their existence has meant.\r\n\r\n\t<ul>\r\n\t\t<li>From the <strong>first line </strong>of the passage &lsquo;&hellip;. <em>From <strong>history, </strong>we can learn what their existence has meant.&rsquo;&hellip;.</em></li>\r\n\t\t<li>From the <strong>third line </strong>of the passage &lsquo;&hellip;. <em>The real evidence for the value of liberal education lies in <strong>history </strong>and the biographies of men </em>.&rsquo;&hellip;.</li>\r\n\t\t<li>Thus, based on the above references we can say that the correct answer is option &quot;3&quot;.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Options 1, 2, and 4 are incorrect because there isn&#39;t enough evidence in the passage to justify them as the correct answers.</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;In this passage, the author stresses the importance of increased interest in the study of history. <em>&quot;</em></em></p>", "question_heading": ""}, {"sr_no": 64, "question": "\r\n\r\n<p>In this passage, the expression &#39;specifically trained&#39; refers to</p>", "option1": "\r\n\r\n<p>characteristically trained</p>", "option2": "\r\n\r\n<p>particularly trained</p>", "option3": "\r\n\r\n<p>peculiarly trained</p>", "option4": "\r\n\r\n<p>ostensibly trained</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is &ldquo;<strong>particularly trained</strong><strong>&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Option &lsquo;2&rsquo; is correct, In the passage, the author wants to say that even without education in a particular branch, people who had a liberal education were able to make better choices.\r\n\t<ul>\r\n\t\t<li>From the <strong>second line </strong>of the passage &lsquo;&hellip; <em>The ability of the man of disciplined mind to direct this power effectively upon problems for which he has not specifically trained.&rsquo;&hellip;..</em></li>\r\n\t\t<li>&quot; <em>Specifically </em>&quot; means &quot;<strong><em>particularly</em></strong>.&quot; (Particularly means more than usual)</li>\r\n\t\t<li>&quot;Specifically trained&quot; and &quot;<strong><em>particularly trained</em></strong>&quot; have the same meaning. So, 2 is the correct answer.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Hence, the correct answer is</strong><em>&ldquo;In this passage, the expression &#39;specifically trained&#39; refers to particularly trained. <em>&quot;</em></em></p>\r\n\r\n<p>Let&rsquo;s discuss the other options:</p>\r\n\r\n<ol>\r\n\t<li><strong>Characteristically trained: </strong>in accordance with someone&#39;s specific or typical behaviour.</li>\r\n\t<li><strong>Peculiarly trained: </strong>strange or unusual behaviour.</li>\r\n\t<li><strong>Ostensibly trained: </strong>Ostensible is used to describe something that appears to be true but about which you or other people have doubts.</li>\r\n</ol>", "question_heading": ""}, {"sr_no": 65, "question": "\r\n<p>निम्नलिखित में से कौन भारतीय रिजर्व बैंक की परिसंपत्ति में शामिल हैं?</p>\r\n\r\n<p>1. ट्रेजरी बिल (राजकोष चालान)</p>\r\n\r\n<p>2. भुगतान पूंजी और आरक्षित निधि</p>\r\n\r\n<p>3. अर्थोपाय अग्रिम (वेज़ एंड मीन्स अडवान्सेस)</p>\r\n\r\n<p>4. चलन में मुद्रा नोट</p>", "option1": "\r\n<p>1 और 2 दोनों</p>", "option2": "\r\n<p>2 और 3 दोनों</p>", "option3": "\r\n<p>1 और 3 दोनों</p>", "option4": "\r\n<p>2 और 4 दोनों</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>1 और 3</strong><strong>दोनों</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>एक <strong>केंद्रीय बैंक वित्तीय स्थिति विवरण (बैलेंस शीट)</strong>, विशेष रूप से एक मौद्रिक प्राधिकरण के रूप में और <strong>सरकार और बैंकों के बैंकर के रूप में</strong> इसकी भूमिका के विभिन्न कार्यों का प्रतिबिंब है।</li>\r\n\t<li>भारतीय रिजर्व बैंक (RBI) की <strong>संपत्ति और देनदारियों</strong> की संरचना, लगभग, अधिकांश केंद्रीय बैंकों द्वारा अपनाई गई बैलेंस शीट के अनुरूप है।</li>\r\n</ul>\r\n\r\n<p><strong>भारतीय रिजर्व बैंक की परिसंपत्ति:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>रुपया प्रतिभूतियां (राजकोष चालान)</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>इसमें </strong>निर्गम और बैंकिंग विभागों द्वारा धारित <strong>सरकारी प्रतिभूतियां शामिल हैं।</strong></li>\r\n\t\t<li>निर्गम विभाग में, रुपया प्रतिभूतियों के साथ-साथ रुपया प्रतिभूतियों में उस <strong>&#39;विदेशी देश की सरकारी प्रतिभूतियाँ </strong>जो निर्गम विभाग के <strong>दस वर्षों के भीतर परिपक्व होती हैं </strong>और साथ ही बैंकिंग विभाग की सरकारी प्रतिभूतियों में निवेश शामिल हैं। <em><strong>अत: कथन 1 सही है।</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>ऋण और अग्रिम</strong>\r\n\t<ul>\r\n\t\t<li>रिज़र्व बैंक भारतीय रिज़र्व बैंक अधिनियम, 1934 की धारा 17 और 18 के अनुसार <strong>केंद्र और राज्य सरकारों</strong>, वाणिज्यिक और सहकारी बैंकों और अन्य को <strong>ऋण और अग्रिम </strong>देता है।<em><strong> इसलिए, कथन 3 सही है।</strong></em></li>\r\n\t\t<li><strong>प्राप्तियों और भुगतानों के बीच अस्थायी अंतर को पूरा करने के लिए</strong> रिज़र्व बैंक <strong>केंद्र सरकार को ऋण और अग्रिम</strong> प्रदान करता है।</li>\r\n\t\t<li>इन अग्रिमों को सरकार के परामर्श से समय-समय पर तय किए गए अर्थोपाय अग्रिम कहा जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>भारत का विदेशी मुद्रा भंडार</strong>\r\n\t<ul>\r\n\t\t<li>अंतरराष्ट्रीय मुद्रा कोष (IMF) के साथ विदेशी मुद्रा संपत्ति,<strong> सोना, SDR </strong>और रिजर्व बैंक की स्थिति को समन्वय में रखना।</li>\r\n\t\t<li><strong>विदेशी मुद्रा परिसंपत्तियों </strong>में अमेरिकी ट्रेजरी बांड में निवेश, अन्य चयनित सरकारों के बांड/ट्रेजरी बिल, विदेशी केंद्रीय बैंकों के पास जमा, विदेशी वाणिज्यिक बैंक आदि शामिल हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>सोने का सिक्का बुलियन</strong>\r\n\t<ul>\r\n\t\t<li><strong>यह निर्गम विभाग और बैंकिंग विभाग के सोने के सिक्के के बुलियन का प्रतिनिधित्व करता है।</strong></li>\r\n\t\t<li>निर्गम विभाग और बैंकिंग विभाग के स्वर्ण भंडार का मूल्य मासिक आधार पर अंतरराष्ट्रीय बाजार मूल्यों के करीब मूल्य पर किया जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>RBI की देनदारियां:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>मुद्रा नोट</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>रिजर्व बैंक द्वारा जारी रिजर्व बैंक की देनदारी</strong> है और यह निर्गम विभाग की देनदारियों का गठन करता है।</li>\r\n\t\t<li>जारी किए गए कुल नोट बैंक के बैंकिंग विभाग में प्रचलन में नोटों और धारित नोटों का योग हैं। <strong><em>अत: कथन 4 सही नहीं है।</em></strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>भुगतान पूंजी और आरक्षित निधि</strong>\r\n\t<ul>\r\n\t\t<li>बैंक की पूंजी, 0.05 बिलियन डॉलर, भारत सरकार और आरक्षित निधि अर्थात ऋण<strong> (दीर्घकालिक संचालन) निधि, राष्ट्रीय कृषि ऋण (स्थिरीकरण) निधि, और राष्ट्रीय औद्योगिक ऋण (दीर्घकालिक संचालन) </strong>बैंक-<strong>निधि,</strong>  बैंक के अन्य दायित्व का हिस्सा हैं<strong>। <em><strong>अत:</strong> कथन 2 सही नहीं है।</em></strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>राज्य सरकारों को दिए गए ऋण और अग्रिम </strong>में<strong> भारतीय रिज़र्व बैंक अधिनियम, 1934 की धारा 17(5) </strong>के तहत दिए गए अग्रिमों के तरीके और साधन शामिल हैं।</li>\r\n\t<li>राज्य सरकारों द्वारा बैंक के पास<strong> न्यूनतम शेष राशि</strong> को बनाए रखा जाना है और इसे समय-समय पर संशोधित किया जाता है।</li>\r\n\t<li>यह मद मुख्य रूप से गैर-सरकारी प्रतिभूतियों में RBI के निवेश का प्रतिनिधित्व करता है।</li>\r\n\t<li>इस शीर्ष के तहत प्रमुख मदों में<strong> DICGC शेयर पूंजी</strong>, भारतीय रिजर्व बैंक नोट मुद्रा शेयर पूंजी, NABARD शेयर पूंजी, राष्ट्रीय आवास बैंक शेयर पूंजी आदि में निवेश है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 66, "question": "\r\n<p><strong>Direction: Choose the appropriate option that fills in the given sentence correctly:</strong></p>\r\n\r\n<p>Fire fighters were trying to lift the wreckage ______ an express bus that had overturned ______ the main highway. </p>", "option1": "\r\n<p>of, on</p>", "option2": "\r\n<p>at, in</p>", "option3": "\r\n<p>in, across</p>", "option4": "\r\n<p>under, in</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;of, on.&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let us look at the  usage  of the given options:\r\n\t<ul>\r\n\t\t<li>Of: We use&quot;of&quot;when we want to show that people or things relate to other things or people.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>Tiffany stared at the floor <u>of</u> her room.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>On: &quot;On&quot;  is used to show that something is in a position above something else and touching it, or that something is moving into such a position.\r\n\t\t<ul>\r\n\t\t\t<li>Example :<em>Look at all the books <u>on</u> your desk!</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>At: We use&quot;at&quot;when we refer to an address.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>Education starts <u>at</u> home.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>In:  We use  &quot;in&quot;  when something is located inside of a defined space. \r\n\t\t<ul>\r\n\t\t\t<li>Example :  <em>I&rsquo;m <u>in</u> the building now.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>Across: <strong>&quot;Across&quot; </strong>means on the other side of something, or from one side to the other of something which has sides or limits such as a city, road or river.\r\n\t\t<ul>\r\n\t\t\t<li><strong>Example:</strong><em>We took a boat<u><strong>across</strong></u>the river.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>Under:  We use  &quot;under&quot;  to talk about something that is below or lower than something else.\r\n\t\t<ul>\r\n\t\t\t<li>Example:<em>His shoes were <u>under</u> his bed.</em></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The sentence says that the relation of <strong>&quot;wreckage&quot; </strong>with the <strong>&quot;express bus&quot; </strong>, so we must use <strong>&quot;of&quot; </strong>in the first blank.</li>\r\n\t<li>The second blank must have <strong>&quot;on&quot; </strong>as it is referring to overturning above the main highway.</li>\r\n\t<li>So, the correct answer is  Option 1 .</li>\r\n</ul>\r\n\r\n<p>Correct sentence :<em> Fire fighters were trying to lift the wreckage<u><strong>of</strong></u>an express bus that had overturned<u><strong>on</strong></u>the main highway. </em></p>", "question_heading": ""}, {"sr_no": 67, "question": "\r\n<p>हॉकी में, यदि अंपायर दोनों भुजाओं को क्षैतिज रूप से मैदान के केंद्र की ओर इंगित करके संकेत करता है, तो इसका क्या अर्थ है?</p>", "option1": "\r\n<p>गोल हो गया है</p>", "option2": "\r\n<p>समय</p>", "option3": "\r\n<p>गेंद खेल से बाहर</p>", "option4": "\r\n<p>बुली</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>गोल हो गया है</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>यदि अंपायर दोनों भुजाओं को क्षैतिज रूप से क्षेत्र के केंद्र की ओर इंगित करके संकेत करता है तो इसका अर्थ है कि <strong>गोल हो गया </strong>है।</li>\r\n\t<li>यदि <strong>अंपायर लक्ष्य की दिशा में दोनों भुजाओं को क्षैतिज रूप से ऊपर उठाता है,</strong> तो यह <strong>पेनल्टी कार्नर </strong>कासंकेत करता है।</li>\r\n\t<li><strong>पेनल्टी सर्कल</strong> के भीतर एक <strong>रक्षात्मक उल्लंघन </strong>या <strong>रक्षात्मक 23-मीटर क्षेत्र</strong> के भीतर जानबूझकर उल्लंघन के परिणामस्वरूप <strong>पेनल्टी कार्नर</strong> जारी किया जाता है।</li>\r\n\t<li><strong>पेनल्टी कॉर्नर</strong>, जिसे फील्ड <strong>हॉकी</strong> में कभी-कभी शॉर्ट कॉर्नर के रूप में संदर्भित किया जाता है, विरोधी पक्ष पर लगाया गया प्रतिबंध है।</li>\r\n\t<li><strong>अटैकिंग खिलाड़ी </strong>उत्सुकता से उनकी तलाश करते हैं क्योंकि वे स्कोर करने का एक बड़ा अवसर देते हैं। <strong>खिलाड़ी</strong> खेल के इस चरण के लिए विशेष क्षमताएं सीखते हैं, जैसे कि<strong> ड्रैग फ्लिक,</strong> और कुछ विशिष्ट नियम हैं जो केवल <strong>पेनल्टी कार्नर</strong> में लागू होते हैं।</li>\r\n\t<li><strong>हॉकी </strong>\r\n\t<ul>\r\n\t\t<li>शब्द &quot;हॉकी&quot; टीम खेलों को संदर्भित करता है जो पहले किसी बाहरी मैदान, बर्फ की चादर या सूखे फर्श पर खेले जाते थे जैसे व्यायामशाला में। जबकि विशिष्ट नियम, खिलाड़ी की गिनती, पोशाक, और विशेष रूप से खेल का मैदान इन खेलों में भिन्न होता है, इन सभी में दो विरोधी टीमें शामिल होती हैं जो एक गेंद या डिस्क को लक्ष्य की ओर निर्देशित करने के लिए स्टिक का उपयोग करती हैं।</li>\r\n\t\t<li><strong>हॉकी कई प्रकार के रूपों में आती है।</strong></li>\r\n\t\t<li>स्केट्स, चाहे व्हील वाले हों या ब्लेड वाले, कुछ खेलों में उपयोग किए जाते हैं लेकिन सभी खेलों में नहीं उपयोग किया जाता है।</li>\r\n\t\t<li>इन विभिन्न खेलों के बीच अंतर करने में मदद करने के लिए<strong> &quot;हॉकी&quot; </strong>शब्द के बाद अक्सर &quot;<strong>फील्ड हॉकी</strong>,&quot; &quot;<strong>आइस हॉकी</strong>,&quot; &quot;<strong>रोलर हॉकी</strong>,&quot; &quot;<strong>रिंक हॉकी</strong>,&quot; या &quot;<strong>फ्लोर हॉकी</strong>&quot; जैसे अन्य शब्द आते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 68, "question": "\r\n<p>केन्द्रीय बजट-2023 में वित्तीय क्षेत्र (राजकोषीय प्रबन्धन) के लिए कौन सा वाक्य सही है?</p>", "option1": "\r\n<p>GSDP का 3.5% राजकोषीय घाटे की राज्यों को अनुमति।</p>", "option2": "\r\n<p>2023-24 के बजट अनुमानों में कुल व्यय 55 लाख करोड़ रुपये है।</p>", "option3": "\r\n<p>2025-26 के लिए राजकोषीय घाटे को 5.5% से नीचे रखने का लक्ष्य।</p>", "option4": "\r\n<p>राज्यों को बीस वर्ष के लिए ब्याज मुक्त ऋण।</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>विकल्प 1</u></strong> है।</p>\r\n\r\n<p><strong>केंद्रीय बजट 2023-24</strong></p>\r\n\r\n<ul>\r\n\t<li>वित्त मंत्री सुश्री निर्मला सीतारमण द्वारा 1 फरवरी, 2023 को केंद्रीय बजट 2023-24 पेश किया गया था।</li>\r\n\t<li>इस वित्तीय वर्ष में 45,03,097 करोड़ रुपयो खर्च करने का प्रस्ताव है।</li>\r\n\t<li><strong>कुल व्यय</strong> में से, राजस्व व्यय <strong>35,02,136 करोड़ रुपये</strong> होने का अनुमान है (2022-23 के संशोधित अनुमानों से 1.2% वृद्धि)। <strong>अतः कथन 2 गलत है।</strong></li>\r\n\t<li><strong>ब्याज व्यय राजस्व प्राप्तियों का 41% है।</strong></li>\r\n\t<li><strong>पूंजीगत व्यय </strong>10,00,961 करोड़ रुपये होने का अनुमान है, जो 2022-23 के संशोधित अनुमानों से 37.4% अधिक है।</li>\r\n\t<li><strong>2023-24 में राजस्व घाटे को सकल घरेलू उत्पाद के 2.9% पर लक्षित</strong> किया गया है, जो 2022-23 में 4.1% के संशोधित राजस्व घाटे से कम है।</li>\r\n\t<li><strong>2023-24 में राजकोषीय घाटे को सकल घरेलू उत्पाद के 5.9% पर लक्षित किया गया है, जो 2022-23 में 6.4% के संशोधित राजकोषीय घाटे से कम है। </strong></li>\r\n\t<li>राजकोषीय समेकन के पथ पर अग्रसर रहते हुए, सरकार का उद्देश्य 2025-26 तक <strong>राजकोषीय घाटे को जीडीपी के 4.5 प्रतिशत तक नीचे ले आने का है</strong>। <strong>अतः कथन 3 गलत है।</strong></li>\r\n\t<li>वित्त विधेयक, 2023 के तहत नई कर व्यवस्था में कई बदलाव किए गए हैं।</li>\r\n\t<li>छूट का लाभ उठाने और किसी भी कर का भुगतान नहीं करने की आय सीमा 5 लाख रुपये से बढ़ाकर 7 लाख रुपये कर दी गई है। इसके अलावा, टैक्स स्लैब की संख्या छह से घटाकर पांच कर दी गई है।</li>\r\n\t<li>उच्चतम स्लैब (5 करोड़ रुपये से अधिक आय) के लिए अधिभार 37% से घटाकर 25% कर दिया गया है।</li>\r\n\t<li><strong>वित्त मंत्री ने कहा कि राज्यों को GSDP के 3.5 प्रतिशत के राजकोषीय घाटे की अनुमति दी जाएगी, </strong>जिसमें से 0.5 प्रतिशत बिजली क्षेत्र के सुधारों से जुड़ा होगा। <strong>अतः कथन 1 सही है।</strong></li>\r\n\t<li>राज्यों को 50 वर्ष का ब्याज मुक्त ऋण भी प्रदान किया जाएगा।</li>\r\n\t<li>राज्यों को 50 वर्ष का पूरा कर्ज 2023-24 के भीतर पूंजीगत व्यय पर खर्च करना है।</li>\r\n</ul>\r\n\r\n<p><strong>नीति की मुख्य विशेषताएं</strong></p>\r\n\r\n<ul>\r\n\t<li>आधारभूत संरचना: राज्य सरकारों को <strong>50 वर्ष के लिए ब्याज मुक्त ऋण प्रदान करने वाली योजना</strong> को 2023-24 में भी 1.3 लाख करोड़ रुपये के परिव्यय के साथ उपलब्ध कराया जाएगा। <strong>अतः कथन 4 गलत है।</strong></li>\r\n\t<li>अंतिम और प्रथम-मील बिंदु के लिए 100 महत्वपूर्ण परिवहन अवसंरचना परियोजनाएं I</li>\r\n\t<li>बंदरगाहों, कोयला और इस्पात जैसे विभिन्न क्षेत्रों के लिए संपर्क स्थापित किया जाएगा।</li>\r\n\t<li>इसमें निजी स्रोतों से 15,000 करोड़ रुपये सहित 75,000 करोड़ रुपये का निवेश होगा।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 69, "question": "\r\n<p>निम्&zwj;नलिखित में से कौन-से कथन मानव परिसंचरण तंत्र में धमनियों के संबंध में सत्य हैं?</p>\r\n\r\n<p>A. सभी ध&zwj;मनियों में शुद्ध रक्&zwj;त होता है।</p>\r\n\r\n<p>B. धमनियों में वाल्व (कपाट) होते हैं।</p>\r\n\r\n<p>C. धमनियों में मोटी भित्तियाँ होती हैं।</p>\r\n\r\n<p>D. धमनियों के द्वारा रक्&zwj;त का प्रवाह हृदय से अन्&zwj;य अंगों तक होता है।</p>", "option1": "\r\n<p>केवल A और B</p>", "option2": "\r\n<p>केवल B और C</p>", "option3": "\r\n<p>केवल C और D</p>", "option4": "\r\n<p>केवल A और C</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>केवल C और D</strong></u> है।</p>\r\n\r\n<p><strong><u>अवधारणा:</u></strong></p>\r\n\r\n<ul>\r\n\t<li>रक्त व्यक्ति के पूरे शरीर में रक्त वाहिकाओं के माध्यम से संचारित होता है।</li>\r\n\t<li>तीन प्रमुख प्रकार की रक्त वाहिकाएं निम्नलिखित हैं -\r\n\t<ul>\r\n\t\t<li><strong>धमनियां</strong></li>\r\n\t\t<li><strong>शिराएँ</strong></li>\r\n\t\t<li><strong>केशिकाएँ</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>ये मुख्य रूप से महत्वपूर्ण अंगों और ऊतकों को ऑक्सीजन पहुंचाने में सहायता करते हैं और अपशिष्ट उत्पादों के निष्कासन में भी सहायता करते हैं।</li>\r\n\t<li>धमनियां और शिराएँ पेशियों की नलिकाएँ हैं जिनके माध्यम से हमारा रक्त प्रवाहित होता है।</li>\r\n\t<li>धमनियां वे होती हैं जो रक्त को हृदय से बाहर ले जाती हैं।</li>\r\n\t<li>शिराएँ वे होती हैं जो रक्त को हृदय में ले जाती हैं।</li>\r\n\t<li>फुफ्फुसीय रक्त वाहिकाओं को छोड़कर, धमनियां ऑक्सीजनित रक्त ले जाती हैं और शिराएँ विऑक्सीजनित रक्त ले जाती हैं।</li>\r\n\t<li>केशिकाएं सबसे छोटी रक्त वाहिकाएं होती हैं जो धमनियों और शिराओं को जोड़ती हैं।</li>\r\n</ul>\r\n\r\n<p><strong>धमनियां</strong></p>\r\n\r\n<ul>\r\n\t<li>धमनियां वे रक्त वाहिकाएं होती हैं जो <strong>ऑक्सीजन युक्त रक्त </strong>को पूरे शरीर में <strong>वितरित करती हैं।</strong></li>\r\n\t<li>यह रक्त को <strong>हृदय से शरीर के अन्य सभी भागों</strong> में ले जाती है।</li>\r\n\t<li>फुफ्फुसीय धमनी को छोड़कर जो विऑक्सीजनित रक्त को हृदय से फेफड़ों तक ले जाती है।</li>\r\n\t<li>शिराओं की तुलना में धमनियों में पेशियों के ऊतकों वाली <strong>मोटी भित्तियाँ</strong> होती हैं।</li>\r\n\t<li>इनमें <strong>वाल्व (कपाट) नहीं होते हैं।</strong></li>\r\n\t<li>हृदय से आने वाले रक्त का बल रक्त को एक दिशा में प्रवाहित करने में मदद करता है।</li>\r\n</ul>\r\n\r\n<p><strong>शिराएँ</strong></p>\r\n\r\n<ul>\r\n\t<li>शिराएँ शरीर की कोशिकाओं और ऊतकों से <strong>ऑक्सीजन रहित रक्त</strong> या विऑक्सीजनित रक्त को हृदय में वापस लाती हैं।</li>\r\n\t<li>शिराओं की <strong>भित्तियाँ पतली</strong> होती हैं।</li>\r\n\t<li>इनमें रक्त प्रवाह को बनाए रखने और रक्त को गलत दिशा में जाने से रोकने के लिए <strong>वाल्व होते हैं।</strong></li>\r\n\t<li><strong>शिराओं के प्रकार - </strong>\r\n\t<ul>\r\n\t\t<li><strong>फुप्फुसीय</strong>शिराएँ ऑक्सीजनित रक्त को फेफड़ों से हृदय के बाएं आलिंद में ले जाती हैं।</li>\r\n\t\t<li><strong>क्रमबद्ध</strong>शिराएँ ऑक्सीजन-रहित रक्त को शरीर के शेष भागों से हृदय के दाहिने आलिंद में लौटाती हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>अतः, मानव परिसंचरण तंत्र में धमनियों के संबंध में <strong>केवल  कथन</strong>C<strong>और </strong>D सत्य हैं।</p>", "question_heading": ""}, {"sr_no": 70, "question": "\r\n<p><strong>Select the most appropriate synonym of the given word.</strong></p>\r\n\r\n<p>Moral</p>", "option1": "\r\n<p>Ethical</p>", "option2": "\r\n<p>Honourable</p>", "option3": "\r\n<p>Godliness</p>", "option4": "\r\n<p>Symphony</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 1), i.e., &#39;Ethical .&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meaning of the given word :\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Moral</th>\r\n\t\t\t\t<td>relating to the standards of good or bad behaviour, fairness, honesty, etc. that each person believes in, rather than to laws. (अच्छे या बुरे व्यवहार, निष्पक्षता, ईमानदारी आदि के मानकों से संबंधित है, जिसमें प्रत्येक व्यक्ति कानूनों के बजाय विश्वास करता है)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n\t<li>Let&#39;s look at the meanings of the other given options:\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Ethical</th>\r\n\t\t\t\t<td>relating to moral principles or the branch of knowledge dealing with these. (नैतिक सिद्धांतों या इनसे निपटने वाले ज्ञान की शाखा से संबंधित)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Honourable</th>\r\n\t\t\t\t<td>honest and fair, or deserving praise and respect. (ईमानदार और निष्पक्ष, या प्रशंसा और सम्मान के योग्य)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Godliness</th>\r\n\t\t\t\t<td>the quality of being godly (= obeying and respecting God). (ईश्वरीय होने का गुण (= ईश्वर का पालन और सम्मान करना))</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Symphony</th>\r\n\t\t\t\t<td>a long piece of music for an orchestra, usually with four movements. (ऑर्केस्ट्रा के लिए संगीत का एक लंबा टुकड़ा, आमतौर पर चार आंदोलनों के साथ)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n</ul>\r\n\r\n<ul>\r\n\t<li>Clearly,the word&#39; Ethical &#39;isclosest in meaningto the given word&#39; Moral .&#39;</li>\r\n\t<li>Therefore,the correct synonym of the given word isoption 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 71, "question": "\r\n<p><strong>Select the most appropriate meaning of the given idiom.</strong><br />\r\ncost an arm and a leg</p>", "option1": "\r\n<p>very expensive</p>", "option2": "\r\n<p>Prepared for battle</p>", "option3": "\r\n<p>In a deep, insensible sleep</p>", "option4": "\r\n<p>Ready for scrutiny</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot; very expensive &quot;</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meaning of the given idiom:\r\n\t<ul>\r\n\t\t<li><strong>cost an arm and a leg -</strong> very expensive.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Look at the example:\r\n\t<ul>\r\n\t\t<li>She would love to buy a Porsche but they cost an arm and a leg.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Hence, the correct answer is <em>very expensive</em></p>\r\n\r\n<ul>\r\n\t<li>cost an arm and a leg- बहुत महंगा </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 72, "question": "\r\n<p>निम्नलिखित में से किसका सम्बन्ध भारत में हरित क्रांति से है?</p>", "option1": "\r\n<p>हरित जी.एन.पी. की गणना</p>", "option2": "\r\n<p>पर्यावरण संरक्षण</p>", "option3": "\r\n<p>हरितगृह प्रभाव</p>", "option4": "\r\n<p>उच्च उत्पादकता किस्मों के बीज</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>उच्च उत्पादकता किस्मों के बीज</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li> हरित क्रांति\r\n\t<ul>\r\n\t\t<li>इसे उस अवधि के रूप में जाना जाता है जब भारतीय कृषि आधुनिक तरीकों और प्रौद्योगिकियों को अपनाने के कारण एक औद्योगिक प्रणाली में परिवर्तित हो गई थी।</li>\r\n\t\t<li>इसमें उच्च उपज देने वाली किस्म (HYV) के बीजों, ट्रैक्टरों, सिंचाई सुविधाएं, कीटनाशकों और उर्वरकों जैसे उत्पादों का उपयोग शामिल है जिनका या तो पहले उपयोग नहीं किया गया था या बहुत सीमित पैमाने पर उपयोग किया गया था।</li>\r\n\t\t<li>भारतीय हरित क्रांति एम.एस. स्वामीनाथन के दिमाग की उपज थी। </li>\r\n\t\t<li>एम. एस. स्वामीनाथन को भारत में हरित क्रांति के जनक के रूप में जाना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>भारत में सभी महत्वपूर्ण क्रांतियों की सूची</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>काली क्रांति </td>\r\n\t\t\t<td>पेट्रोलियम उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>नीली क्रांति </td>\r\n\t\t\t<td>मछली उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>भूरी क्रांति </td>\r\n\t\t\t<td>चमड़ा, कोको से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>गोल्डन फाइबर क्रांति</td>\r\n\t\t\t<td>जूट उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>स्वर्ण क्रांति</td>\r\n\t\t\t<td>समग्र बागवानी, शहद, फल उत्पादन, फूल, औषधीय, मसालों से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>हरित क्रांति </td>\r\n\t\t\t<td>कृषि उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>धूसर क्रांति</td>\r\n\t\t\t<td>उर्वरकों से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>गुलाबी क्रांति</td>\r\n\t\t\t<td>प्याज़, झींगे से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>लाल क्रांति </td>\r\n\t\t\t<td>मांस, टमाटर उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>सदाबहार क्रांति</td>\r\n\t\t\t<td>समग्र कृषि उत्पादन वृद्धि के लिए </td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>गोल क्रांति </td>\r\n\t\t\t<td>आलू उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>सिल्वर फाइबर क्रांति</td>\r\n\t\t\t<td>कपास उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>रजत क्रांति </td>\r\n\t\t\t<td>अंडा उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>श्वेत क्रांति </td>\r\n\t\t\t<td>डेयरी, दूध उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>पीत क्रांति </td>\r\n\t\t\t<td>तिलहन उत्पादन से संबंधित</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>गोल क्रांति </td>\r\n\t\t\t<td>आलू से संबंधित</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 73, "question": "\r\n<p>निम्नलिखित में से कौन सा मेक इन इंडिया का स्तंभ<strong> नहीं </strong>है/हैं?</p>\r\n\r\n<p>1. नई प्रक्रियाएँ</p>\r\n\r\n<p>2. नई आधारिक संरचना</p>\r\n\r\n<p>3. नए क्षेत्र</p>\r\n\r\n<p>4. नई मानसिकता</p>\r\n\r\n<p>सही कूट का चयन कीजिये।</p>", "option1": "\r\n<p>केवल 1</p>", "option2": "\r\n<p>केवल 2 और 4 </p>", "option3": "\r\n<p>केवल 3</p>", "option4": "\r\n<p>इनमे से कोई भी नहीं</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>इनमे से कोई भी नहीं</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>भारत में अपने उत्पादों के निर्माण के लिए बहुराष्ट्रीय कंपनियों के साथ-साथ घरेलू कंपनियों को प्रोत्साहित करने के लिए भारत सरकार द्वारा सितंबर 2014 में <strong>मेक इन इंडिया </strong>की शुरुआत की गई थी। पहल न केवल विनिर्माण में बल्कि प्रासंगिक बुनियादी ढांचे और सेवा क्षेत्रों में भी उद्यमशीलता को बढ़ावा देने के लिए निर्धारित है। </li>\r\n\t<li><strong>उद्देश्य-</strong>\r\n\t<ul>\r\n\t\t<li>अर्थव्यवस्था के 25 प्रमुख क्षेत्रों में रोजगार सृजन और कौशल वृद्धि पर ध्यान केंद्रित करने के लिए, जिसमें ऑटोमोबाइल, विमानन, जैव प्रौद्योगिकी, रक्षा विनिर्माण, विद्युत मशीनरी, खाद्य प्रसंस्करण, तेल और गैस और फार्मास्यूटिकल्स शामिल हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>प्रतीक चिन्ह</strong>\r\n\t<ul>\r\n\t\t<li>यह अशोक चक्र से प्रेरित है - निर्माण, शक्ति, और राष्ट्रीय गौरव का प्रतीक है, जो एक विशालकाय शेर है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>पहल चार स्तंभों पर आधारित है -</strong>\r\n\t<ul>\r\n\t\t<li>नई प्रक्रियाएँ;</li>\r\n\t\t<li>नई अवसंरचना;</li>\r\n\t\t<li>नए क्षेत्र; तथा</li>\r\n\t\t<li>नई मानसिकता। <strong>इसलिए, कथन 1, 2, 3 और 4 सही हैं।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>इस संबंध में सरकार द्वारा उठाए गए प्रमुख कदम नीचे दिए गए हैं:</strong>\r\n\t<ul>\r\n\t\t<li>देश में निवेश के अवसरों और संभावनाओं के बारे में जागरूकता पैदा करने, विदेशों में बाजारों में पसंदीदा निवेश गंतव्य के रूप में भारत को बढ़ावा देने और वैश्विक एफडीआई में भारतीय हिस्सेदारी बढ़ाने के उद्देश्य से निवेशकों के साथ सूचना के प्रसार और बातचीत के लिए एक इंटरैक्टिव पोर्टल बनाया गया है।</li>\r\n\t\t<li>निवेश भारत को राष्ट्रीय निवेश प्रोत्साहन और सुविधा एजेंसी के रूप में स्थापित किया।</li>\r\n\t\t<li>भारत में रचनात्मक क्षमता को बढ़ाने और उद्यमशीलता को बढ़ावा देने के लिए, स्टार्ट-अप इंडिया और स्टैंड-अप इंडिया अभियान की घोषणा की गई है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 74, "question": "\r\n<p><strong>Rewrite the following changing the active sentence to passive.</strong></p>\r\n\r\n<p>They will have completed the project before the deadline.</p>", "option1": "\r\n<p>The project will be completed before the deadline.</p>", "option2": "\r\n<p>The project will have been completed before the deadline.</p>", "option3": "\r\n<p>The project will have completed before the deadline.</p>", "option4": "\r\n<p>The project will complete before the deadline.</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>The project will have been completed before the deadline</strong>&quot;.</p>\r\n\r\n<ul>\r\n\t<li>As we can see the given sentence is in the<strong> future perfect tense (have + V3</strong>), so we have to <strong>change</strong> the <strong>passive</strong> voice as per the <strong>same tense</strong> rules.</li>\r\n\t<li>Active voice: Subject + <strong>will+ have +v3</strong>+ object.</li>\r\n\t<li>Passive voice: Object+ <strong>will+ have+ been +V3+ by</strong> + subject</li>\r\n\t<li>Example:\r\n\t<ul>\r\n\t\t<li>Active voice: <em>Maya <strong>will have cleaned</strong> the dishes.</em></li>\r\n\t\t<li>Passive voice: <em>The dishes<strong> will</strong><strong>have been</strong> cleaned<strong> by </strong>Maya.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Following the rules mentioned above, we have to change the <strong>active to passive</strong> and apply<strong> &quot;will have been completed&quot;</strong> in the sentence<strong>.</strong></li>\r\n\t<li>Therefore, the correct answer is: <em>The project will have been completed before the deadline.</em></li>\r\n</ul>\r\n\r\n<p>Let us take a look at the rules of the future perfect active passive voice:</p>\r\n\r\n<ul>\r\n\t<li><strong>Active</strong> voice: Subject +<strong> will+ have +v3</strong>+ object.</li>\r\n\t<li><strong>Passive</strong> voice: Object+<strong> will+ have+ been +V3+ by</strong> + subject</li>\r\n\t<li><strong>Active</strong> voice: Subject +<strong> will+ have +not+v3+</strong> object.</li>\r\n\t<li><strong>Passive</strong> voice: Object + <strong>will+ have +not+been+v3</strong>+ subject</li>\r\n\t<li><strong>Active</strong> voice:<strong> Will+ Subject+have+v3+</strong> object+?</li>\r\n\t<li><strong>Passive</strong> voice: <strong>Will + object+have+been+v3+by</strong> +subject+?</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 75, "question": "\r\n<p>Ocean Currents occur in Oceans and Seas due to which of the following?</p>\r\n\r\n<p>a. Atmospheric circulation on the earth</p>\r\n\r\n<p>b. Influence of insolation</p>\r\n\r\n<p>c. Temperature difference and salinity difference</p>\r\n\r\n<p>Select the correct answer using the code given below.</p>", "option1": "\r\n<p>a and b only</p>", "option2": "\r\n<p>c only</p>", "option3": "\r\n<p>b and c only</p>", "option4": "\r\n<p>a, b and c</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>a, b and c</strong></u>.</p>\r\n\r\n<p><strong>Ocean Currents:</strong></p>\r\n\r\n<ul>\r\n\t<li>Ocean currents are the<strong> most important ocean movements because of their influence on the climatology of various regions</strong>. </li>\r\n\t<li>Ocean currents are like river flow in oceans.</li>\r\n\t<li>They represent a regular volume of water in a definite path and direction.</li>\r\n</ul>\r\n\r\n<p><strong>Forces Responsible for Ocean Currents:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Influence of insolation:</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>Heating by solar energy causes the water to expand.</strong></li>\r\n\t\t<li>That is why, <strong>near the equator, the ocean water is about 8 cm higher</strong> in level than in the middle latitudes.</li>\r\n\t\t<li>This causes a <strong>very slight gradient</strong> and water tends to flow down the slope.</li>\r\n\t\t<li>The <strong>flow is normally from east to west.</strong><em><strong> Hence, statement b is correct.</strong></em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of wind (atmospheric circulation):</strong>\r\n\t<ul>\r\n\t\t<li>Wind blowing on the surface of the ocean pushes the water to move.</li>\r\n\t\t<li><strong>Friction between the wind and the water&#39;s surface</strong> affects the movement of the water body in its course.</li>\r\n\t\t<li>The <strong>oceanic circulation pattern roughly corresponds to the earth&rsquo;s atmospheric circulation pattern.</strong></li>\r\n\t\t<li>The air circulation over the oceans in the <strong>middle latitudes is mainly anticyclonic</strong> [Sub-tropical High-Pressure Belt] (more pronounced in the southern hemisphere than in the northern hemisphere due to differences in the extent of landmass). <em>Hence, statement a is correct.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Temperature difference and Salinity difference:\r\n\t<ul>\r\n\t\t<li>The temperature difference and salinity difference are the secondary forces.</li>\r\n\t\t<li>Differences in water density affect the vertical mobility of ocean currents (vertical currents).</li>\r\n\t\t<li>Water with high salinity is denser than water with low salinity and in the same way cold water is denser than warm water.</li>\r\n\t\t<li>Denser water tends to sink, while relatively lighter water tends to rise.</li>\r\n\t\t<li><strong>Cold-water ocean currents</strong> occur when the cold water at the poles sinks and slowly moves towards the equator.</li>\r\n\t\t<li><strong>Warm-water currents</strong> travel out from the equator along the surface, <strong>flowing towards the poles to replace the sinking cold water</strong>. <em> Hence, statement c is correct.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of gravity:</strong>\r\n\t<ul>\r\n\t\t<li><strong>Gravity tends to pull the water down</strong> to pile and create gradient variation.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Influence of Coriolis force:</strong>\r\n\t<ul>\r\n\t\t<li>The <strong>Coriolis force intervenes and causes the water to move to the right in the northern hemisphere</strong> and to the left in the southern hemisphere.</li>\r\n\t\t<li>These<strong> large accumulations of water</strong> and the flow around them are called <strong>Gyres</strong>.</li>\r\n\t\t<li>These produce large circular currents in all the ocean basins. One such circular current is the <strong>Sargasso Sea.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 76, "question": "\r\n<p><strong>DIRECTIONS: Find the word which can be replaced for the given sentence.</strong></p>\r\n\r\n<p>A place for luggage at railway station.</p>", "option1": "\r\n<p>Boutique</p>", "option2": "\r\n<p>Cloak room</p>", "option3": "\r\n<p>Dormitory</p>", "option4": "\r\n<p>Creche</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39; <strong>Cloakroom </strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>The most appropriate word for the given group of words is &#39; <strong>Cloakroom </strong>&#39;.</li>\r\n\t<li>It means <strong>&#39;a room near the entrance to a building where you can leave your coat, bags, etc.&#39; </strong>(किसी इमारत के प्रवेश द्वार पर स्थित एक कमरा जहाँ कोट, थैले आदि समान रखे जाते हैं; अमानती सामानघर)\r\n\t<ul>\r\n\t\t<li><em>Example: Above the <strong>cloakroom </strong>is the bathroom, while the second floor at this end is the attic.</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Answer :</u></strong><em>Cloakroom.</em></p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the <strong>meaning </strong>of other words:\r\n\r\n\t<ul>\r\n\t\t<li><strong>Boutique </strong>: a small shop that sells fashionable clothes or expensive presents. (छोटी दुकान जहाँ लोकप्रिय कपड़े या महँगे उपहार बिकते हैं; बुटीक)</li>\r\n\t\t<li><strong>Dormitory </strong>: a large bedroom with a number of beds in it, especially in a school, etc. [अनेक पलंगों वाला बड़ा शयनकक्ष (विशेषतः स्&zwj;कूल आदि में)]</li>\r\n\t\t<li><strong>Creche </strong>: a place where small children are looked after while their parents are working, shopping, etc. (माता-पिता की अनुपस्थिति में शिशुओं की देखभाल का स्&zwj;थान; शिशुसदन, शिशुगृह) </li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 77, "question": "\r\n<p>Rearrange the parts of the sentence in correct order.</p>\r\n\r\n<p>P: As we know that some hobbies demand a little guidance from an experienced person.</p>\r\n\r\n<p>Q: Our sudden attachment to them without any knowledge may lead to wastage of money.</p>\r\n\r\n<p>R: The choice of hobbies is not an easy task.</p>\r\n\r\n<p>S: Due to this we may abandon them easily.</p>", "option1": "\r\n<p>RPQS</p>", "option2": "\r\n<p>RSPQ</p>", "option3": "\r\n<p>PQSR</p>", "option4": "\r\n<p>PQRS</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option (1) &ldquo; <strong>RPQS </strong>&rdquo;</p>\r\n\r\n<ul>\r\n\t<li>The opening sentence is  <strong>&quot;The choice of hobbies is not an easy task&quot; </strong> which initially start a speech about hobbies.</li>\r\n\t<li>The next part needs to be telling us more about hobbies and relate with the opening sentence, which is <strong>&ldquo;As we know that some hobbies demand a little guidance from an experienced person.&rdquo;</strong></li>\r\n\t<li>The next sentence i.e. <strong>&ldquo;Our sudden attachment to them without any knowledge may lead to wastage of money&rdquo;  </strong>guidance requirement for keeping hobbies is justified with referring as <strong>&#39;them </strong>.&#39;</li>\r\n\t<li> Rest of the sentence is the <strong>conclusion derived </strong>from wastage of money in the previous sentence which is  <strong>&quot;Due to this we abandon them easily.&quot;</strong></li>\r\n</ul>\r\n\r\n<p>Therefore, the correct sequence of the jumble para would be: -</p>\r\n\r\n<p><em>&ldquo; The choice of hobbies is not an easy task. As we know that some hobbies demand a little guidance from an experienced person. Our sudden attachment to them without any knowledge may lead to wastage of money. Due to this we abandon them easily.&quot;</em></p>", "question_heading": ""}, {"sr_no": 78, "question": "\r\n<p><strong>Direction: In the following question, a sentence has been given in Active (or Passive) voice. Out of the four alternatives suggested, select the one which best expresses the same sentence in Passive (or Active) voice. </strong></p>\r\n\r\n<p>I saw him leaving the house. </p>", "option1": "\r\n<p>He had been seen leaving the house.  </p>", "option2": "\r\n<p>He was seen to be leaving the house.  </p>", "option3": "\r\n<p>Leaving the house he was seen by me.</p>", "option4": "\r\n<p>He was seen leaving the house by me.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>He was seen leaving the house by me. </strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in <strong>active voice</strong>. We need to change it into <strong>passive voice</strong>.</li>\r\n\t<li>The subject<strong> &#39;I&#39;</strong> of the active voice becomes the object <strong>&#39;me&#39;</strong> of the passive voice.</li>\r\n\t<li>The object <strong>&#39;him&#39;</strong> of the active voice becomes the subject <strong>&#39;he&#39;</strong> of the passive voice.</li>\r\n\t<li>The given sentence is in <strong>simple past tense.</strong></li>\r\n\t<li><strong>&#39;Saw&#39; </strong>changes to <strong>&#39;was seen&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 4.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Sentence</strong></u>: <em>He was seen leaving the house by me.</em></p>", "question_heading": ""}, {"sr_no": 79, "question": "\r\n<p>दक्कन की सबसे लंबी का नातों में से एक वह है जो _______ किले को जल की आपूर्ति करती थी।</p>", "option1": "\r\n<p>बीदर</p>", "option2": "\r\n<p>गोलकुंडा</p>", "option3": "\r\n<p>बीजापुर</p>", "option4": "\r\n<p>गुलबर्ग</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दक्कन की सबसे लंबी कानातों में से एक वह है जो <u><strong>बीदर</strong></u> किले को जल की आपूर्ति करती थी।</p>\r\n\r\n<ul>\r\n\t<li>भारत में, <strong>बीदर, बीजापुर, बुरहानपुर (कुंडी भंडारा) और औरंगाबाद </strong>में <strong>कारेज (कनत)</strong> प्रणालियाँ स्थित हैं।</li>\r\n\t<li><strong>बीदर कारेज प्रणालियाँ</strong>शायद भारत में खोदी गई <strong>पहली </strong>प्रणाली थी।</li>\r\n\t<li>यह <strong>बहमनी काल </strong>का है।</li>\r\n\t<li>गुलाम यजदानी के दस्तावेजीकरण के अनुसार बीदर में तीन कारेज प्रणालियाँ हैं।</li>\r\n\t<li>दक्कन को जल की आपूर्ति करने वाली कानात दक्कन की सबसे लंबी कानात है।</li>\r\n\t<li><strong>नौबद </strong>के अलावा बीदर में दो और कारेज प्रणालियाँ हैं,<strong> &quot;शुक्ल तीर्थ&quot; और &quot;जमना मोरी&quot;।</strong></li>\r\n\t<li><strong>शुक्ल तीर्थ बीदर और दक्कन में भी सबसे लंबी </strong>का<strong>रेज प्रणाली है।</strong></li>\r\n\t<li><strong>इसके माध्यम से बीदर किले में जल की आपूर्ति की जाती थी।</strong></li>\r\n</ul>\r\n\r\n<p>अतः, हम यह निष्कर्ष निकाल सकते हैं कि दक्कन की सबसे लंबी कानातों में से एक वह है जो <strong><u>बीदर</u></strong> किले को जल की आपूर्ति करती थी।</p>", "question_heading": ""}, {"sr_no": 80, "question": "\r\n<p>निम्नलिखित में से कौन-सा प्राकृतिक ऑक्सिन है?</p>", "option1": "\r\n<p>मेंडोल तथा साइट्रिक अम्ल</p>", "option2": "\r\n<p>इंडोल 3-एसिटिक अम्ल</p>", "option3": "\r\n<p>अमोनियम नाइट्रेट</p>", "option4": "\r\n<p>शुष्क बर्फ</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>इंडोल 3-एसिटिक अम्ल</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>IAA (इंडोल-3-एसिटिक अम्ल) ऑक्सिन वर्ग का प्रचुर और प्रसिद्ध पादप हार्मोन है।</li>\r\n\t<li>इसका सूत्र C10H9NO2 है।</li>\r\n\t<li>IAA मुख्य रूप से पौधों की शीर्ष कली और युवा पत्तियों में उत्पन्न होता है और इसे कोशिका विभाजन और <strong>दीर्घकरण</strong>का एक संकेतक माना जाता है।</li>\r\n\t<li>IAA, साथ ही साथ अधिकांश अन्य ऑक्सिन, अन्य पौधों के हार्मोन के साथ या विरोध में कार्य करने के लिए जाने जाते हैं।</li>\r\n\t<li>उदाहरण, कुछ पौधों के ऊतकों में ऑक्सिन से साइटोकाइनिन का अनुपात जड़ बनाम अंकुर कलिकाओं  की शुरुआत को निर्धारित करता है।</li>\r\n\t<li>NAA (1-नेफ़थलीनएसेटिक एसिड) ऑक्सिन परिवार में एक सिंथेटिक प्लांट हार्मोन है।\r\n\t<ul>\r\n\t\t<li>इसका सूत्र C₁₀H₇CH₂CO₂H है।</li>\r\n\t\t<li>एक सिंथेटिक ऑक्सिन (NAA) द्वितीयक भित्ति सेलुलोज संश्लेषण को रोक देता है और सुसंस्कृत कपास तंतु में दीर्घकरण को बढ़ाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>4-D एक सिंथेटिक ऑक्सिन है, जो पौधों के विकास नियामकों का एक वर्ग है।\r\n\t<ul>\r\n\t\t<li>यह पत्तियों के माध्यम से अवशोषित होता है और पौधे के विभाज्योतकों में चला जाता है। अनियंत्रित, अस्थिर विकास के कारण तना मुड़ जाता है, पत्ती मुरझा जाती है और अंततः पौधे की मृत्यु हो जाती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>IBA (इंडोल-3-ब्यूटिरिक अम्ल) ऑक्सिन परिवार से संबंधित एक पादप हार्मोन है और जड़ बनाने में सहायता करता है, इन विट्रो प्रक्रिया को सूक्ष्मप्रवर्धन कहा जाता है।\r\n\t<ul>\r\n\t\t<li>जड़ निर्माण में तेजी लाने के अलावा, इसका उपयोग विभिन्न फसलों पर फूलों के विकास और फलों के विकास को प्रोत्साहित करने के लिए किया जाता है। इससे अंततः फसल की पैदावार में वृद्धि होती है।</li>\r\n\t\t<li>इसका सूत्र C12H13NO2 है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 81, "question": "\r\n<p><strong>Select the most appropriate option that can substitute the underlined segment in the given sentence. If there is no need to substitute it, select &lsquo;No substitution required&rsquo;.</strong></p>\r\n\r\n<p>During foggy weather, flights are often cancelled, <u>isn&rsquo;t it </u>?</p>", "option1": "\r\n<p>do they</p>", "option2": "\r\n<p>aren&rsquo;t they</p>", "option3": "\r\n<p>No substitution required</p>", "option4": "\r\n<p>haven&rsquo;t they</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;aren&#39;t they&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The underlined part in the given sentence is grammatically incorrect.</li>\r\n\t<li>Here, <strong>&#39;aren&#39;t they&#39; </strong>should be used instead of <strong>&#39;isn&#39;t it&#39;.</strong></li>\r\n\t<li>A positive statement  is followed by  a negative question tag.\r\n\t<ul>\r\n\t\t<li><em>Example: Mary can speak English, can&#39;t she?</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>A negative statement  is followed by  a positive question tag.\r\n\t<ul>\r\n\t\t<li><em>Example: They aren&#39;t funny, are they?</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>In the given sentence &#39; <strong>flights </strong>&#39; is a plural subject. And &#39; <strong>are </strong>&#39; is the <strong>helping verb.</strong></li>\r\n\t<li>Hence, its question tag will be <strong>&#39;aren&#39;t they&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 2.</strong></li>\r\n</ul>\r\n\r\n<p><strong><u>Correct Sentence:</u></strong><em>During foggy weather, flights are often cancelled, <strong>aren&#39;t they?</strong></em></p>", "question_heading": ""}, {"sr_no": 82, "question": "\r\n<p><strong>Select the most appropriate ANTONYM of the given word.</strong></p>\r\n\r\n<p>Dispatch</p>", "option1": "\r\n<p>Acquire</p>", "option2": "\r\n<p>Transmit</p>", "option3": "\r\n<p>Deliver</p>", "option4": "\r\n<p>Bulletin</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is option 1), i.e., &#39;Acquire .&#39;</p>\r\n\r\n<ul>\r\n\t<li>Let&#39;s look at the meanings of the given word and marked option:\r\n\t<table>\r\n\t\t<thead>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t\t</tr>\r\n\t\t</thead>\r\n\t\t<tbody>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Dispatch</th>\r\n\t\t\t\t<td>the act of sending someone or something somewhere. (किसी को या कुछ कहीं भेजने की क्रिया)</td>\r\n\t\t\t</tr>\r\n\t\t\t<tr>\r\n\t\t\t\t<th scope=\"row\">Acquire</th>\r\n\t\t\t\t<td>to obtain or begin to have something. (कुछ प्राप्त करना या शुरू करना)</td>\r\n\t\t\t</tr>\r\n\t\t</tbody>\r\n\t</table>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Let&#39;s look at the meanings of the other given options:</p>\r\n\r\n<table>\r\n\t<thead>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\">Word</th>\r\n\t\t\t<th scope=\"col\">Meaning</th>\r\n\t\t</tr>\r\n\t</thead>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\">Transmit</th>\r\n\t\t\t<td>to broadcast something, or to send out or carry signals or messages using radio, television, etc. (कुछ प्रसारित करने के लिए, या रेडियो, टेलीविजन, आदि का उपयोग करके संकेत या संदेश भेजने या ले जाने के लिए)</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\">Deliver</th>\r\n\t\t\t<td>to give, direct, or aim something. (कुछ देना, प्रत्यक्ष करना या लक्ष्य करना)</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<th scope=\"row\">Bulletin</th>\r\n\t\t\t<td>a short piece of news on television or radio, or a short report or news item released by an organization. (टेलीविजन या रेडियो पर समाचार का एक छोटा टुकड़ा, या एक संगठन द्वारा जारी एक छोटी रिपोर्ट या समाचार आइटम)</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n\r\n<ul>\r\n\t<li>Hence from the given meanings,we find that &#39; Dispatch &#39; and &#39; Acquire &#39;are antonyms.</li>\r\n\t<li>So,the correct answer is option 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 83, "question": "\r\n<p><strong>Choose the CORRECT option to complete the given sentence</strong>:</p>\r\n\r\n<p>He is a very narrow-minded person;______.</p>", "option1": "\r\n<p>so do his father</p>", "option2": "\r\n<p>so weren&rsquo;t her children</p>", "option3": "\r\n<p>so is his wife</p>", "option4": "\r\n<p>does not he</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: <strong>&quot;</strong><strong>so is his wife&quot;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in present tense, and it states that &quot;he is a very narrow-minded person.&quot;</li>\r\n\t<li>Therefore, we need an option that matches the present tense and conveys a similar idea.</li>\r\n\t<li><u>Let&#39;s have a look at each option:</u></li>\r\n\t<li>&quot;<strong>So do his father</strong>&quot; - This option is in the present tense, but the use of &quot;<strong>do</strong>&quot; is incorrect.</li>\r\n\t<li>&quot;<strong>So weren&#39;t her children</strong>&quot; - This option is in past tense and doesn&#39;t match the tense of the sentence. The use of pronoun &quot;her&quot; is also incorrect. Additionally, it doesn&#39;t make sense in the context of the sentence.</li>\r\n\t<li>&quot;<strong>So is his wife</strong>&quot; - This option is in the present tense and conveys the same idea as the original senten
