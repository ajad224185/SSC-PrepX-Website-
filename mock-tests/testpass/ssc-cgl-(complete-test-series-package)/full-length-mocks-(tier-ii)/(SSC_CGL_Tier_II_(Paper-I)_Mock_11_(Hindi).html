ce. It means that his wife is also narrow-minded.</li>\r\n\t<li>&quot;<strong>Does not he</strong>&quot; - This option is grammatically incorrect. It should be &quot;does he not,&quot; but even then, it doesn&#39;t fit in the context of the sentence.</li>\r\n\t<li>Hence option 3 is correct.</li>\r\n</ul>\r\n\r\n<p><u>Complete sentence</u>: &quot;He is a very narrow-minded person, <u>so is his wife</u>.&quot; </p>", "question_heading": ""}, {"sr_no": 84, "question": "\r\n<p>मानव मस्तिष्क का बाहरी आवरण _____ है।</p>", "option1": "\r\n<p>कोराकॉइड</p>", "option2": "\r\n<p>मृदुतानिका (पाया मैटर)</p>", "option3": "\r\n<p>दृढतानिका (ड्यूरामैटर)</p>", "option4": "\r\n<p>लूताजालाभ ( एरेक्नॉइड )</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<ul>\r\n\t<li><strong>ड्यूरामैटर मेनिन्जेस </strong>की सबसे कठोर और सबसे बाहरी परत है जो मस्तिष्क और रीढ़ की हड्डी को ढकती है।\r\n\r\n\t<ul>\r\n\t\t<li>यह एक मोटी और रेशेदार परत होती है जो मस्तिष्क और रीढ़ की हड्डी को बाहरी झटके या आघात से बचाती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>मृदुतानिका (पाया मैटर) </strong>मस्तिष्क की सुरक्षा और पोषण में महत्वपूर्ण भूमिका निभाती है।\r\n\t<ul>\r\n\t\t<li>मृदुतानिका पतली, नाजुक और अंतरतम परत है जो मस्तिष्क और रीढ़ की हड्डी की सतह को ढकती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>एरेक्नॉइड मेनिन्जेस </strong>की मध्य परत है जो मस्तिष्क और रीढ़ की हड्डी को ढकती है।\r\n\t<ul>\r\n\t\t<li>यह एक नाजुक और जाले जैसी परत है जो ड्यूरामैटर और पायामैटर के बीच स्थित है।</li>\r\n\t\t<li>एरेक्नॉइड प्रमस्तिष्कद्रव (CSF) से भरा होता है, जो मस्तिष्क और रीढ़ की हड्डी को कुशन करने में मदद करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>कोराकॉइड (अंसतुंड)</strong> कंधे की एक हड्डी है जो स्कैपुला और क्लेविकल को जोड़ती है। इसका मस्तिष्क या उसके आवरण से कोई संबंध नहीं है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 85, "question": "\r\n<p>सूची-I को सूची-II से सुमेलित कीजिए और नीचे दिए गए कूट से सही उत्तर की पहचान कीजिए-</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>सूची-</strong>I<br />\r\n\t\t\t<strong>संविधान सभा समिति</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><strong>सूची-</strong>II<br />\r\n\t\t\t<strong>अध्यक्ष</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(A) मौलिक अधिकार समिति</td>\r\n\t\t\t<td>(i) बी.आर. अम्बेडकर</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(B) संचालन समिति </td>\r\n\t\t\t<td>(ii) जवाहर लाल नेहरू</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(C) संघ शक्ति समिति </td>\r\n\t\t\t<td>(iii) डॉ. राजेंद्र प्रसाद</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>(D) प्रारूप समिति </td>\r\n\t\t\t<td>(iv) सरदार पटेल</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "option1": "\r\n<p>A-(iv), B-(iii), C-(ii), D-(i)</p>", "option2": "\r\n<p>A-(ii), B-(iv), C-(iii), D-(i)</p>", "option3": "\r\n<p>A-(iii), B-(iv), C-(ii), D-(i)</p>", "option4": "\r\n<p>A-(ii), B-(iii), C-(iv), D-(i)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर<u>A-(iv), B-(iii), C-(ii), D-(i)</u> है।</p>\r\n\r\n<ul>\r\n\t<li>भारत का संविधान 1946 की कैबिनेट मिशन योजना के तहत गठित एक संविधान सभा द्वारा तैयार किया गया था।</li>\r\n\t<li><strong>6 दिसंबर 1946 को संविधान सभा का गठन किया गया था।</strong></li>\r\n\t<li>संघ की संविधान सभा ने संविधान निर्माण के विभिन्न कार्यों से निपटने के लिए कई समितियों की नियुक्ति की।</li>\r\n\t<li>इनमें से आठ प्रमुख समितियां थीं और अन्य छोटी समितियां थीं।</li>\r\n\t<li>प्रमुख समितियों और उनके अध्यक्षों के नाम हैं:\r\n\t<ul>\r\n\t\t<li><strong>संघ शक्ति </strong>समिति <strong>- जवाहरलाल नेहरू</strong></li>\r\n\t\t<li>केंद्रीय संविधान समिति - जवाहरलाल नेहरू</li>\r\n\t\t<li>प्रांतीय संविधान समिति &ndash; सरदार पटेल</li>\r\n\t\t<li><strong>प्रारूप</strong> समिति - <strong>डॉ. बी.आर. अम्बेडकर</strong></li>\r\n\t\t<li><strong>मौलिक अधिकारों</strong>, अल्पसंख्यकों और जनजातीय और बहिष्कृत क्षेत्रों पर सलाहकार समिति - <strong>सरदार पटेल</strong></li>\r\n\t\t<li>प्रक्रिया समिति के नियम - डॉ. राजेंद्र प्रसाद</li>\r\n\t\t<li>राज्य समिति (राज्यों के साथ बातचीत के लिए समिति) - जवाहरलाल नेहरू</li>\r\n\t\t<li><strong>संचालन</strong> समिति &ndash; <strong>डॉ. राजेंद्र प्रसाद</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>नोट - यह प्रश्न RPSC RAS Prelims 27 Oct 2021 में पूछा गया था</strong>।</p>\r\n\r\n<p><u>आधिकारिक कुंजी के अनुसार उत्तर हटा दिया गया है</u>।</p>\r\n\r\n<p>हमने प्रश्न को ठीक कर दिया है।</p>\r\n\r\n<ul>\r\n\t<li>संचालन समिति &ndash; डॉ. राजेंद्र प्रसाद</li>\r\n\t<li>कार्य समिति - डॉ. के.एम. मुंशी</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 86, "question": "\r\n<p>पाक जलसंधि किसके बीच हुई?</p>", "option1": "\r\n<p>श्रीलंका और मालदीव</p>", "option2": "\r\n<p>भारत और पाकिस्तान</p>", "option3": "\r\n<p>भारत और चीन</p>", "option4": "\r\n<p>भारत और श्रीलंका</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>भारत और श्रीलंका</strong>है।</p>\r\n\r\n<ul>\r\n\t<li><strong>पहला समझौता एडम ब्रिज और पाक जलसंधि  के बीच समुद्री सीमा के संबंध में था, </strong>जो 8 जुलाई, 1974 को लागू हुआ। दूसरा समझौता, जिस पर 23 मार्च को हस्ताक्षर किए गए थे और 10 मई, 1976 को लागू हुआ, ने मन्नार की खाड़ी और बंगाल की खाड़ी में समुद्री सीमाओं को परिभाषित किया।</li>\r\n\t<li><strong>पाक जलसंधि  भारत (तमिलनाडु) और श्रीलंका के द्वीप राष्ट्र</strong> (मन्नार जिले) के बीच जल का एक संकीर्ण मार्ग <strong>है।</strong></li>\r\n\t<li><strong>भारत गणराज्य की सरकार और श्रीलंका गणराज्य ने 23 मार्च, 1976 को एक समझौते पर</strong> हस्ताक्षर<strong> किए,</strong> जिसमें मनार की खाड़ी और बंगाल की खाड़ी में समुद्री सीमाएँ स्थापित की गईं।</li>\r\n\t<li><strong>श्रीलंका</strong>, जिसे पहले सीलोन के नाम से जाना जाता था और आधिकारिक तौर पर श्रीलंका का लोकतांत्रिक समाजवादी गणराज्य, दक्षिण एशिया में एक द्वीप देश है।<strong> यह हिंद महासागर में, बंगाल की खाड़ी के दक्षिण-पश्चिम में और अरब सागर के दक्षिण-पूर्व में स्थित है; यह </strong>मन्नार की खाड़ी और पाक जलसंधि द्वारा भारतीय उपमहाद्वीप<strong> से अलग है।</strong></li>\r\n\t<li><strong>चीन, आधिकारिक तौर पर पीपुल्स रिपब्लिक ऑफ चाइना, पूर्वी एशिया का एक देश है।</strong>यह विश्व का सबसे अधिक आबादी वाला देश है, जिसकी आबादी 1.4 बिलियन से अधिक है, जो भारत से थोड़ी ज्यादा है।</li>\r\n\t<li><strong>मालदीव, आधिकारिक तौर पर मालदीव गणराज्य,</strong> हिंद महासागर में स्थित<strong> दक्षिण एशिया में स्थित एक द्वीपसमूह राज्य है।</strong> यह एशियाई महाद्वीप की मुख्य भूमि से लगभग 750 किलोमीटर दूर श्रीलंका और भारत के दक्षिण-पश्चिम में स्थित है।</li>\r\n</ul>\r\n\r\n<p>इस प्रकार, पाक जलसंधि <strong>भारत और श्रीलंका</strong> के बीच हुई।</p>", "question_heading": ""}, {"sr_no": 87, "question": "\r\n<p>Select the most appropriate antonym of the underlined word.</p>\r\n\r\n<p>The political situation was now relatively <u>quiescent </u>.</p>", "option1": "\r\n<p>Restless</p>", "option2": "\r\n<p>Exempt</p>", "option3": "\r\n<p>Malignant</p>", "option4": "\r\n<p>Mendicant</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct is answer - <strong>&quot;Restless&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Quiescent </strong>means in a state or period of inactivity or dormancy (मौन, स्थिर, निष्क्रिय, सुप्त)\r\n\r\n\t<ul>\r\n\t\t<li>Eg.  It has been quiescent since 1566, and is now completely extinct.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><em><u><strong>Restless</strong></u></em>means unable to rest or relax as a result of anxiety or boredom (चिंता या बोरियत के परिणामस्वरूप आराम या आराम करने में असमर्थ)\r\n\t<ul>\r\n\t\t<li>Eg. The children always get restless on long journeys</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the given options, <strong>Restless is the appropriate ANTONYM of &quot;Quiescent&quot;</strong></li>\r\n\t<li>Thus, <strong>Option 1 </strong>is the correct answer.</li>\r\n\t<li>Mendicant means a beggar.</li>\r\n\t<li>Malignant means likely to cause death if not controlled</li>\r\n\t<li>Exempt means free from an obligation or liability imposed on others.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 88, "question": "\r\n<p>Which of the following sentences is/are grammatically correct among the three given below?</p>\r\n\r\n<p>A. Sooner had Amrita come from work than her friends organized a get-together.</p>\r\n\r\n<p>B. Each day, the journey from college to his home takes him an hour.</p>\r\n\r\n<p>C. After disposing of the stolen items, the thief was found.</p>", "option1": "\r\n<p>Only A and B</p>", "option2": "\r\n<p>Only A and C</p>", "option3": "\r\n<p>None of these</p>", "option4": "\r\n<p>Only B and C</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: Only B and C</p>\r\n\r\n<ul>\r\n\t<li>Statement A:\r\n\t<ul>\r\n\t\t<li>This sentence is structurally wrong.</li>\r\n\t\t<li>If the second event occurs immediately after the first, we can express that idea using the structure &quot;no sooner &hellip; than.&quot;</li>\r\n\t\t<li>It is often used with the past perfect and usually followed by &#39;than&#39;.</li>\r\n\t\t<li>&ldquo;No sooner&hellip; than&rdquo; is correlative conjunction. These types of conjunctions work in pairs and relate one sentence to another.</li>\r\n\t\t<li>Therefore, statement A is grammatically incorrect.</li>\r\n\t\t<li>The correct sentence should be: <em>No sooner had Amrita come from work than her friends organized a get-together.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Statement B:\r\n\t<ul>\r\n\t\t<li>We use &quot;verb+s&quot; to refer to a third-person singular subject.</li>\r\n\t\t<li>&quot;His&quot; refers to the third-person singular subject and for that reason the singular verb &quot;takes&quot; is used.</li>\r\n\t\t<li>We know that subjects and verbs must agree with one another in number (singular or plural).</li>\r\n\t\t<li>The preposition &#39;from&#39; is used to describe the transport route.</li>\r\n\t\t<li>Therefore, statement B is grammatically correct.</li>\r\n\t</ul>\r\n\tStatement C:\r\n\r\n\t<ul>\r\n\t\t<li>The preposition &#39;of&#39; is always used after &#39;dispose&#39;.</li>\r\n\t\t<li>&quot;Dispose of&quot; means to get rid of something or deal with something so that the matter is finished.</li>\r\n\t\t<li>The sentence tells that the burglar was caught after getting rid of the stolen goods.</li>\r\n\t\t<li>Therefore, statement C is grammatically correct.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is: <em>Option 1, Only B and C</em></p>", "question_heading": ""}, {"sr_no": 89, "question": "\r\n<p>Directions: Read each part of the sentence to find out whether there is any error in any part. Indicate your response in the Answer Sheet against the corresponding letter, i.e., (a) or (b) or (c). If you find &#39;no error&#39;, your response should be indicated as (d).</p>\r\n\r\n<p>The opportunity to participation in fair and free elections(A)/ and hold public office(B)/ should be viewed as a fundamental right of every citizen.(C)/ No error(D)</p>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>D</p>", "option3": "\r\n<p>B</p>", "option4": "\r\n<p>C</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot;<strong>A</strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>The error lies in <strong>part &#39;A</strong>&#39; of the <strong>sentence</strong> because &#39;<strong>participation</strong>&#39; is used instead of &#39;<strong>participate</strong>&#39;.</li>\r\n\t<li>The <strong>sentence</strong> is talking about the opportunity to participate in fair and free elections, which is an action and not a state of being.</li>\r\n\t<li>Therefore the <strong>verb &#39;participate</strong>&#39; should be used instead of <strong>noun</strong> &#39;<strong>participation</strong>&#39;, which means &quot;<strong>take part in an action or endeavour</strong>&quot;</li>\r\n</ul>\r\n\r\n<p>Thus, <em><strong>option 1</strong></em> is the correct answer.</p>\r\n\r\n<p><u><strong>Correct Sentence</strong></u>: <em><strong>The opportunity to participate in fair and free elections </strong>and hold public office should be viewed as a fundamental right of every citizen.</em></p>", "question_heading": ""}, {"sr_no": 90, "question": "\r\n<p><strong>Select the correct indirect form of the given sentence.</strong></p>\r\n\r\n<p>The surgeon says, &ldquo;You should get anaesthesia for the surgery.&rdquo;</p>", "option1": "\r\n<p>The surgeon says you should get anaesthesia for the surgery.</p>", "option2": "\r\n<p>The surgeon said that I shall get anaesthesia for the surgery.</p>", "option3": "\r\n<p>The surgeon says that I should have got anaesthesia for the surgery.</p>", "option4": "\r\n<p>The surgeon says that I should get anaesthesia for the surgery.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct indirect form of the given sentence is: <strong>The surgeon says that I should get anaesthesia for the surgery.</strong></p>\r\n\r\n<ul>\r\n\t<li>In indirect speech, the reporting verb<strong> (says) </strong>is followed by the conjunction <strong>&#39;that&#39; </strong>and the sentence is changed from direct to indirect form.</li>\r\n\t<li>The pronoun <strong>&#39;you&#39;</strong> is changed to <strong>&#39;I&#39;</strong> as the sentence is being reported by someone else.</li>\r\n\t<li>The modal verb &#39;<strong>should</strong>&#39; remains the same as it indicates a suggestion.</li>\r\n\t<li><strong>There will no change in tense as the reported verb is in present tense &#39;says&#39;.</strong></li>\r\n\t<li>Thus, the correct answer is <strong>Option 4.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Indirect form</strong></u>:<em> The surgeon says that I should get anaesthesia for the surgery.</em></p>", "question_heading": ""}, {"sr_no": 91, "question": "\r\n<p>Select the option that expresses the given sentence in reported speech.</p>\r\n\r\n<p>&ldquo;Vidushi, the doctor has advised me to avoid sugar,&rdquo; said Prabha.</p>", "option1": "\r\n<p>Prabha told Vidushi that the doctor had advised her to avoid sugar.</p>", "option2": "\r\n<p>Prabha said to Vidushi that the doctor was advising her to avoid sugar.</p>", "option3": "\r\n<p>Prabha told Vidushi that the doctor advised her to avoid sugar.</p>", "option4": "\r\n<p>Prabha told Vidushi that the doctor will be advising her to avoid sugar.</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 1) i.e. &lsquo;</strong><strong>Prabha told Vidushi that the doctor had advised her to avoid sugar. &rsquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in <strong>Direct Speech </strong>.</li>\r\n\t<li>As per the given question we have to change it into <strong>Indirect Speech.</strong></li>\r\n\t<li>The process of this transformation is as follows:\r\n\t<ul>\r\n\t\t<li>The conjunction <strong>&#39;that&#39; will be added </strong>and <strong>comma and inverted commas will be removed.</strong></li>\r\n\t\t<li>In the Indirect speech <strong>&#39;said&#39; will be changed into &lsquo;told&rsquo; </strong>because reporting verb has an object, &lsquo;Vidushi&rsquo;.</li>\r\n\t\t<li><strong>&#39;me&#39; </strong>will be changed into <strong>&#39;her&#39;.</strong></li>\r\n\t\t<li>Here, <strong>&lsquo;has advised&rsquo; is in the present perfect tense </strong>and <strong>will be changed into past perfect i.e., &lsquo;</strong><strong>had advised &rsquo;.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>So, according to the above steps, thecorrect answer is<strong>option 1.</strong></li>\r\n</ul>\r\n\r\n<p><u><strong>Correct Sentence:</strong></u><em>Prabha told Vidushi that the doctor had advised her to avoid sugar.</em></p>", "question_heading": ""}, {"sr_no": 92, "question": "\r\n<p>Pandit Jasraj is famous in the field of?</p>", "option1": "\r\n<p>Classical Music</p>", "option2": "\r\n<p>Folk Songs</p>", "option3": "\r\n<p>Folk Dance</p>", "option4": "\r\n<p>Poetry</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <u><strong>Classical Music.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>Pandit Jasraj is famous in the field of Classical Music.</strong></li>\r\n\t<li><strong>Pandit Jasraj:</strong>\r\n\t<ul>\r\n\t\t<li><strong>He was an Indian classical singer related to Mewati Gharana.</strong></li>\r\n\t\t<li><strong>His musical career extended 75 years resulting in national and international prominence, respect, and numerous awards and accolades.</strong></li>\r\n\t\t<li><strong>Pandit Jasraj (28 January 1930 - 17 August 2020)</strong> was an Indian classical vocalist, belonging to the Mewati Gharana (musical apprenticeship lineage).</li>\r\n\t\t<li>His musical career spanned 75 years resulting in national and international fame, respect, and numerous major awards and accolades.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Awards and honors:</strong>\r\n\t<ul>\r\n\t\t<li><strong>Padma Shri (1975).</strong></li>\r\n\t\t<li><strong>Sangeet Natak Akademi Award (1987).</strong></li>\r\n\t\t<li><strong>Padma Bhushan (1990).</strong></li>\r\n\t\t<li><strong>Padma Vibhushan (2000).</strong></li>\r\n\t\t<li><strong>Swathi Sangeetha Puraskaram (2008).</strong></li>\r\n\t\t<li><strong>Sangeet Natak Akademi Fellowship (2010)</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong> Important personalities from Haryana:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>Dayachand Mayna </strong>was a songwriter, poet, singer who wrote many raagni, songs, Saang, Kissas, he was from Mayna (Rohtak)</li>\r\n\t<li><strong>Baje Bhagat</strong> was a songwriter, poet, singer who wrote many ragni, songs, he was from sisana village, sonipat.</li>\r\n\t<li><strong>Gajendra Verma</strong> is a Sirsa-born composer and playback singer</li>\r\n\t<li><strong>Ghulam Farid Sabri Qawwal,</strong> a leading member of the Sabri Brothers/Qawwali Group. He was born in 1930 Kalyana, Rohtak, Haryana/East Punjab. </li>\r\n\t<li><strong>Pandit Jasraj </strong>is a Hisar born classical singer of Mewati gharana style</li>\r\n\t<li><strong>Pandit Lakhmi Chand,</strong> Surya Kavi Of Haryana</li>\r\n\t<li><strong>Sonu Nigam</strong>, born in Faridabad. </li>\r\n</ul>", "question_heading": ""}, {"sr_no": 93, "question": "\r\n<p>Direction:Change the Voice -</p>\r\n\r\n<p>The crown was being laughed at by them.</p>", "option1": "\r\n<p>They are laughing at the crown.</p>", "option2": "\r\n<p>Them were laughing at the crown.</p>", "option3": "\r\n<p>They were laughing at the crown.</p>", "option4": "\r\n<p>They were being laughing at the crown.</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is<strong>&#39;</strong><strong>They were laughing at the crown .&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given sentence is in  Past  Continuous Tense  and in  Passive Voice.</li>\r\n\t<li>The rule for changing a  Past  Continuous Tense  from Active voice to Passive voice or Passive to Active Voice:\r\n\t<ul>\r\n\t\t<li>Interchange the object and subject with each other, i.e. object of the active sentence become the subject of the passive sentence.</li>\r\n\t\t<li>Structure: Subject + was/were + V1 + ing + Object  <u>(Active Voice)</u></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>                                       Object + was/were + being + V3 + by Subject   <u>(Passive Voice)</u></p>\r\n\r\n<ul>\r\n\t<li>Example: <em>Esha was singing a song.  </em>(Active Voice)</li>\r\n</ul>\r\n\r\n<p><em>A song was being sung by Esha. </em>(Passive Voice)</p>\r\n\r\n<ul>\r\n\t<li>Therefore, the correct answer is  &#39; They were laughing at the crown.&#39;</li>\r\n\t<li>In  Active Voice , a sentence emphasizes the subject performing an action.</li>\r\n\t<li>In  Passive Voice,  the sentence emphasizes the action or the object of the sentence.\r\n\t<ul>\r\n\t\t<li>Example: <em>He reads a novel. </em>(Active Voice)<br />\r\n\t\t<em> A novel is read by him. </em>(Passive Voice)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>दिया गया वाक्य  Past  Continuous Tense  और <strong>Passive Voice </strong> में है।</li>\r\n\t<li>Past  Continuous Tense  को Active voice से Passive voice या Passive voice से Active voice में बदलने का नियम:\r\n\t<ul>\r\n\t\t<li>Object और Subject को एक दूसरे के साथ बदलें, यानी Active Voice का object, Passive Voice का subject बन जाती है।</li>\r\n\t\t<li><u>संरचना</u>:Subject + was/were + V1+ ing + Object  <u>(Active Voice)</u><br />\r\n\t\t             Object + was/were + being + V3 + by Subject  <u>(Passive Voice)</u></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 94, "question": "\r\n<p>निम्नलिखित में से कौन मुहम्मद गोरी का सेनापति था, और उसने भारत में गुलाम वंश की स्थापना भी की थी?</p>", "option1": "\r\n<p>इल्तुतमिश</p>", "option2": "\r\n<p>गयासुद्दीन बलबन</p>", "option3": "\r\n<p>आरामशाह द्वितीय</p>", "option4": "\r\n<p>कुतुब-दीन ऐबक</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>कुतुब-दीन ऐबक</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>कुतुब-उद-दीन, कुतुब-दीन ऐबक का दूसरा नाम है।</li>\r\n\t<li>वह <strong>गुलाम वंश</strong> का संस्थापक था।</li>\r\n\t<li>उसकी उदारता के कारण उसे <strong>लाख बख्श</strong> के नाम से भी जाना जाता था।</li>\r\n\t<li>उसने <strong>मुहम्मद गोरी की सेना में एक सेनापति</strong> के रूप में सेवा की</li>\r\n\t<li>उसकी मृत्यु सन् 1210 ई. में <strong>चौगान या पोलो खेलते समय</strong> हुई थी।</li>\r\n\t<li>उसने गुलाम वंश के पहले सम्राट के रूप में सेवा की।</li>\r\n\t<li>गुलाम वंश का दूसरा नाम <strong>मामलुक वंश</strong> है।</li>\r\n\t<li>इस वंश के बाद खिलजी (या खलजी) वंश आया।</li>\r\n\t<li><strong>इल्तुतमिश (शासनकाल: 1211 &ndash; 1236):</strong>\r\n\t<ul>\r\n\t\t<li>अरम शाह एक कमजोर शासक था। रईसों के एक समूह द्वारा उसके खिलाफ एक साजिश रची गई थी जिसने शम्सुद्दीन इल्तुतमिश को शासक बनने के लिए आमंत्रित किया था।</li>\r\n\t\t<li>इल्तुतमिश <strong>ऐबक का दामाद</strong> था।</li>\r\n\t\t<li>उसने उत्तरी भारत के घुरिद क्षेत्रों पर शासन किया।</li>\r\n\t\t<li>वह <strong>मध्य एशिया में पैदा हुआ एक तुर्की गुलाम</strong> था।</li>\r\n\t\t<li>इल्तुतमिश दिल्ली के <strong>गुलाम शासकों में सबसे महान</strong> था।</li>\r\n\t\t<li>उसने अपनी राजधानी <strong>लाहौर से दिल्ली</strong> स्थानांतरित की।</li>\r\n\t\t<li><strong>1236</strong> में उसकी मृत्यु हो गई और उसकी बेटी <strong>रजिया सुल्ताना</strong> उसकी उत्तराधिकारी बनी क्योंकि वह अपने पुत्रों को इसके योग्य नहीं समझता था।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>बलबन:</strong>\r\n\t<ul>\r\n\t\t<li>उसने <strong>1266 ई. से 1287 ई.</strong> तक शासन किया।</li>\r\n\t\t<li>वह <strong>चहलगनी चालीसा</strong> का सदस्य था।</li>\r\n\t\t<li>उसने <strong>चहलगनी की शक्ति को तोड़ दिया</strong> और ताज की प्रतिष्ठा को पुनर्स्थापित कर दिया।</li>\r\n\t\t<li>उसने एक मजबूत केंद्रीकृत सेना बनाई और सैन्य विभाग <em><strong>दीवान-ए-अर्ज</strong></em> की स्थापना की।</li>\r\n\t\t<li>उसने <em><strong>ज़िल-ए-इलाही</strong></em> (ईश्वर की छाया) की उपाधि धारण की और लोगों को प्रभावित किया कि राजा ईश्वर का प्रतिनिधि (<em><strong>नियाबत-ए-खुदाई</strong></em>) था।</li>\r\n\t\t<li>उसने <em><strong>सिजदा और पैबोस</strong></em> के ईरानी रीति-रिवाजों पर जोर दिया।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 95, "question": "\r\n<p><strong>Directions: In the following question, out of the four alternatives, select the alternative which best expresses the meaning of the idiom/phrase.</strong></p>\r\n\r\n<p>Arjun <u>bid defiance</u> when the teacher told him to memorize the poem.</p>", "option1": "\r\n<p>to follow the instructions</p>", "option2": "\r\n<p>to get encouraged</p>", "option3": "\r\n<p>to ignore something</p>", "option4": "\r\n<p>to get discouraged</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>option 3) i.e. &ldquo;</strong><strong>to ignore something.&rdquo;</strong></p>\r\n\r\n<ul>\r\n\t<li>Let&rsquo;s look at the meaning of the given idiom/ phrase:\r\n\t<ul>\r\n\t\t<li>The phrase<strong> &lsquo;</strong><strong>bid defiance&rsquo; means to ignore or to resist.</strong></li>\r\n\t\t<li>Example: <em>Neha <strong>bade defiance</strong> when her father told her to pursue engineering.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the only possible answer is option 3 <strong>&lsquo;</strong><strong>to ignore something</strong><strong>&rsquo;</strong>, which exactly matches the meaning of the given idiom/ phrase.</li>\r\n</ul>\r\n\r\n<p><u><strong>Correct meaning:</strong></u><em>to ignore something.</em></p>", "question_heading": ""}, {"sr_no": 96, "question": "\r\n<p>सूची-I को सूची-II से सुमेलित करें और नीचे दिए गए कोड का उपयोग करके सही उत्तर चुनें:</p>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>सूची-I (रोग)</strong></p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<p><strong>सूची-II (कारक)</strong></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(ए)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>पेप्टिक अल्सर</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>1.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>वायरस</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(बी)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>डेंगी</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>2.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>प्रोटोज़ोआ</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(सी)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>हाथी का पैर</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>3.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>कीड़ा</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p>(डी)</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>मलेरिया</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>4.</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>जीवाणु</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "option1": "\r\n<p>A - 4, B - 2, C - 3, D - 1</p>", "option2": "\r\n<p>A - 3, B - 4, C - 2, D - 1</p>", "option3": "\r\n<p>A - 4, B - 1, C - 3, D - 2</p>", "option4": "\r\n<p>A - 2, B - 3, C - 4, D - 1</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>A - 4, B - 1, C - 3, D - 2</strong></u> है।</p>\r\n\r\n<p><strong>पेप्टिक छाला</strong></p>\r\n\r\n<ul>\r\n\t<li>पेप्टिक अल्सर <strong>पेट, अन्नप्रणाली या छोटी आंत</strong> की परत पर <strong>बना एक घाव</strong> है।</li>\r\n\t<li>सबसे आम कारणों में <strong>बैक्टीरिया हेलिकोबैक्टर पाइलोरी</strong> और <strong>नॉनस्टेरॉइडल एंटी-इंफ्लेमेटरी दवाओं</strong> का उपयोग शामिल है।</li>\r\n\t<li><strong>हेलिकोबैक्टर पाइलोरी एक बैक्टीरिया है</strong> जो शरीर में प्रवेश कर सकता है और <strong>पाचन तंत्र में कई वर्षों तक जीवित रह सकता है।</strong></li>\r\n\t<li>जल्द ही या कई वर्षों के बाद वे <strong>घाव पैदा कर सकते हैं जिन्हें अल्सर कहा जाता है</strong> ।</li>\r\n\t<li><strong>आमतौर पर यह पेट के एसिड</strong> द्वारा इस परत को नुकसान पहुंचने के कारण होता है।</li>\r\n\t<li>ऐसा माना जाता है कि इसका पेचदार आकार पेट की म्यूकोइड परत में प्रवेश करने और इस तरह संक्रमण स्थापित करने के लिए विकसित हुआ है।</li>\r\n\t<li>इसे <strong>गैस्ट्रिक अल्सर</strong> भी कहा जाता है। इस <strong>अल्सर का सबसे आम लक्षण पेट में दर्द है और खाना खाते समय यह दर्द बढ़ जाता है</strong> ।</li>\r\n\t<li>इसके साथ है<strong>उल्टी, वजन कम होना, या भूख कम लगना।</strong></li>\r\n</ul>\r\n\r\n<p><strong>डेंगू</strong></p>\r\n\r\n<ul>\r\n\t<li>डेंगू एक <strong>वायरल बीमारी</strong> है और यह <strong>मच्छरों</strong> द्वारा फैलता है</li>\r\n\t<li>यह एक अत्यधिक संक्रामक रोग है और बहुत तेजी से फैलता है</li>\r\n\t<li>इस बीमारी को फैलाने के लिए जिम्मेदार मच्छर <strong><em>एडीज एजिप्टी (</em> मादा)</strong> है</li>\r\n\t<li><strong><em>एनोफ़ेलीज़ (</em> मादा) मलेरिया</strong> का वाहक है, जो एक जीवाणु रोग है</li>\r\n\t<li><strong><em>क्यूलेक्स</em></strong> आम <strong>घरेलू मच्छर</strong> है और <strong>एन्सेफलाइटिस जैसी बीमारियों को फैलाने के लिए जाना जाता है।</strong></li>\r\n</ul>\r\n\r\n<p><strong>हाथीपांव (एलिफेंटियासिस)</strong> :-</p>\r\n\r\n<ul>\r\n\t<li>यह एक <strong>परजीवी कृमि संक्रमण</strong> है जो मच्छरों के माध्यम से एक व्यक्ति से दूसरे व्यक्ति में फैल सकता है।</li>\r\n\t<li>इसकी विशेषता पैरों में सूजन है। एलीफैंटियासिस को लिम्फैटिक फाइलेरियासिस के नाम से भी जाना जाता है।</li>\r\n</ul>\r\n\r\n<p><strong>मलेरिया</strong></p>\r\n\r\n<ul>\r\n\t<li>यह एक छोटा प्रोटोजोआ प्लास्मोडियम के कारण होने वाली बीमारी है जो इस बीमारी के लिए जिम्मेदार है।</li>\r\n\t<li>मलेरिया मच्छरों से फैलने वाला एक संक्रामक रोग है जो मनुष्यों को प्रभावित करता है।</li>\r\n\t<li>इसकी विशेषता बुखार, थकावट, उल्टी और सिरदर्द जैसे लक्षण हैं।</li>\r\n\t<li>प्लाज्मोडियम की विभिन्न प्रजातियाँ ( <em>पी. विवैक्स, पी. मलेरिया, और पी. फाल्सीपेरम</em> ) विभिन्न प्रकार के मलेरिया के लिए जिम्मेदार हैं।</li>\r\n\t<li>इनमें से <em>प्लास्मोडियम फाल्सीपेरम</em> के कारण होने वाला घातक मलेरिया सबसे गंभीर है और घातक भी हो सकता है।</li>\r\n\t<li><strong>मलेरिया का सबसे गंभीर और घातक रूप</strong><em><strong>प्लाज्मोडियम फाल्सीपेरम</strong></em> के कारण होता है।</li>\r\n\t<li><strong>प्लाज़मोडियम का वाहक मादा <em>एनोफ़ेलीज़</em> मच्छर</strong> है जो स्पोरोज़ोइट्स (संक्रामक रूप) को स्थानांतरित करता है।</li>\r\n\t<li><strong>प्लाज्मोडियम को</strong> अपना जीवन चक्र पूरा करने के लिए <strong>दो मेजबानों की आवश्यकता होती है - मानव</strong> और <strong>मच्छर</strong> ।</li>\r\n\t<li>संक्रमित मादा <em>एनोफिलीज</em> मच्छर काटने से प्लास्मोडियम के संक्रामक रूप यानी स्पोरोज़ाइट्स को मानव शरीर में स्थानांतरित करता है।</li>\r\n\t<li>इस बीमारी के इलाज के लिए कुनैन और क्लोरोक्वीन जैसी मलेरिया-रोधी दवाओं का उपयोग किया जाता है।</li>\r\n\t<li>डीडीटी (डाइक्लोरोडिफेनिलट्राइक्लोरोइथेन), बीएचसी (बेंजीन हेक्साक्लोराइड) आदि का छिड़काव करके और कीट विकर्षक, मच्छरदानी आदि का उपयोग करके मच्छरों को मारकर मलेरिया को रोका जा सकता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 97, "question": "\r\n<p>किस नदी पर, भारत में नदियों में फेरी के लिए पहली रात नेविगेशन मोबाइल एप्लिकेशन को लॉन्च किया गया था?</p>", "option1": "\r\n<p>सोन</p>", "option2": "\r\n<p>ब्रह्मपुत्र</p>", "option3": "\r\n<p>गंगा</p>", "option4": "\r\n<p>कावेरी</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>ब्रह्मपुत्र</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>ब्रह्मपुत्र</strong>\r\n\r\n\t<ul>\r\n\t\t<li><strong>ब्रह्मपुत्र</strong> एक <strong>ट्रांस-बाउंड्री</strong> नदी है जो <strong>तिब्बत, बांग्लादेश</strong> और <strong>पूर्वोत्तर भारत</strong> से होकर गुजरती है।</li>\r\n\t\t<li>इसके अन्य नामों में <strong>असमिया</strong> में <strong>लुइट</strong>, <strong>तिब्बती</strong> में <strong>यारलुंग सांगपो</strong>, <strong>अरुणाचली</strong> में <strong>सियांग/दिहांग नदी</strong> और <strong>बांग्ला</strong> में <strong>जमुना नदी</strong> शामिल हैं।</li>\r\n\t\t<li>यह दुनिया की <strong>15वीं</strong> सबसे लंबी और जल मात्रा के हिसाब से <strong>9वीं</strong> सबसे बड़ी नदी है।</li>\r\n\t\t<li><strong>यारलुंग सांगपो  नदी</strong> का स्रोत <strong>हिमालय</strong> के <strong>उत्तरी</strong> पक्ष पर <strong>तिब्बत</strong> के <strong>बुरांग काउंटी</strong> में <strong>कैलाश पर्वत</strong> के करीब <strong>मानसरोवर झील</strong> क्षेत्र में है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>यारलुंग सांगपो </strong>ग्रेट <strong>कैन्यन</strong> में <strong>पहाड़ों</strong> में <strong>गिरने</strong> और <strong>अरुणाचल प्रदेश</strong> में प्रवेश करने से पहले नदी दक्षिणी तिब्बत से होकर गुजरती है।</li>\r\n\t<li>यह गेलिंग की <strong>अरुणाचल प्रदेश</strong> बस्ती के करीब <strong>भारत</strong> में प्रवेश करती है और <strong>असम घाटी</strong> के माध्यम से दक्षिण-पश्चिम में बहने से पहले <strong>बांग्लादेश</strong> के माध्यम से <strong>जमुना</strong> के रूप में बहती है (भारत की <strong>यमुना</strong> के साथ भ्रमित नहीं होना)।</li>\r\n\t<li>यह <strong>गंगा</strong> से मिलती है, जिसे <strong>बांग्लादेश</strong> में <strong>पद्मा</strong> के रूप में भी जाना जाता है, विशाल <strong>गंगा डेल्टा</strong> में, जहाँ यह <strong>मेघना</strong> बन जाती है और अंततः <strong>बंगाल की खाड़ी</strong> में मिल जाती है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 98, "question": "\r\n<p>भीमबेटका शैल चित्रों में निम्नलिखित में से कौन सी विषय वस्तु चित्रित <strong>नहीं </strong>की गई है?</p>", "option1": "\r\n<p>पक्षियों का आखेट</p>", "option2": "\r\n<p>पशुओं का आखेट</p>", "option3": "\r\n<p>खाद्यान्न पर निर्भर पक्षियों का बसेरा</p>", "option4": "\r\n<p>पक्षियों और पशुओं दोनों का आखेट</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p>सही उत्तर <u><strong>खाद्यान्न पर निर्भर पक्षियों का बसेरा</strong></u> है।<strong><u>भीमबेटका शैल चित्र</u></strong></p>\r\n\r\n<ul>\r\n\t<li><strong>पुरातात्विक स्थल:</strong> भीमबेटका पाषाण आश्रय मध्य भारत में मध्य प्रदेश के रायसेन जिले में स्थित एक पुरातात्विक स्थल है। </li>\r\n\t<li>\r\n\t<p><strong>ऐतिहासिक महत्व:</strong> यह साइट पाषाणकाल, मध्य पाषाण और ऐतिहासिक काल तक फैली हुई है, और इसे भारत में मानव जीवन के सबसे पुराने उदाहरणों में से एक माना जाता है। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>पाषाण युग का साक्ष्य:</strong> यह स्थल पाषाण युग का प्रमाण प्रदान करता है, जिसकी शुरुआत एश्यूलियन काल से होती है। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>यूनेस्को विश्व धरोहर स्थल:</strong> भीमबेटका को 2003 में यूनेस्को विश्व धरोहर स्थल घोषित किया गया था। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>बड़ा परिसर:</strong> साइट में सात पहाड़ियाँ और 10 किमी में फैले 750 से अधिक चट्टान आश्रय हैं, और यह सबसे बड़े प्रागैतिहासिक परिसरों में से एक है। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>100,000 से अधिक वर्षों से आबाद:</strong> कम से कम कुछ आश्रय 100,000 से अधिक वर्षों पहले बसे हुए थे। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>गुफा चित्र:</strong> कुछ शैलाश्रयों में प्रागैतिहासिक काल के गुफा चित्र हैं, जिनमें सबसे पुराने लगभग 10,000 वर्ष पुराने (8,000 ई.पू.) होने का अनुमान लगाया गया है। </p>\r\n\t</li>\r\n\t<li>\r\n\t<p><strong>प्रागैतिहासिक जीवन का चित्रण:</strong> गुफा चित्रों में <strong>जानवरों, नृत्य, पक्षियों और जानवरों के शिकार और घोड़े की पीठ पर योद्धाओं जैसे विषयों</strong> को दर्शाया गया है, जो <strong>मानव बस्ती</strong> और शिकारी-संग्राहक से लेकर कृषि और प्रागैतिहासिक आध्यात्मिकता तक के <strong>सांस्कृतिक विकास की एक दुर्लभ झलक प्रदान करते हैं</strong>।</p>\r\n\t</li>\r\n\t<li><strong>भारत में सबसे पुरानी ज्ञात शैल कला:</strong> भीमबेटका भारत की सबसे पुरानी ज्ञात शैल कला का घर भी है।</li>\r\n</ul>\r\n\r\n<p><strong>इसलिए सही उत्तर अनाज पर रहने वाले पक्षियों को बसाना है।</strong></p>", "question_heading": ""}, {"sr_no": 99, "question": "\r\n<p>भारत की पहली महिला ओलंपिक खिताब विजेता का नाम बताइए।</p>", "option1": "\r\n<p>पी. वी. सिंधु</p>", "option2": "\r\n<p>साइना नेहवाल</p>", "option3": "\r\n<p>मैरी कॉम</p>", "option4": "\r\n<p>कर्णम मल्लेश्वरी</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>कर्णम मल्लेश्वरी</strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li><u><strong>कर्णम मल्लेश्वरी ओलंपिक पदक जीतने वाली पहली भारतीय महिला थीं।</strong></u>\r\n\r\n\t<ul>\r\n\t\t<li>कर्णम मल्लेश्वरी भारत की एक पूर्व महिला वेटलिफ्टर हैं।</li>\r\n\t\t<li>उनका जन्म 1 जून 1975 को हुआ था और वह <strong>आंध्र प्रदेश</strong> से संबंध रखती हैं।</li>\r\n\t\t<li>उन्हें पहली उपलब्धि 1991 में अंबाला में आयोजित वेटलिफ्टिंग नेशनल्स (सीनियर) में प्राप्त हुई थी, जहाँ उन्होंने रजत पदक जीता था।</li>\r\n\t\t<li><strong>सिडनी ओलंपिक, 2000 में, उन्होंने 69 किग्रा वर्ग में वेटलिफ्टिंग  में कांस्य पदक जीता था।</strong></li>\r\n\t\t<li>उन्होंने 1994 में हिरोशिमा में आयोजित एशियाई खेलों में स्वर्ण पदक जीता था।</li>\r\n\t\t<li>उन्होंने 1994 और 1995 विश्व चैंपियनशिप में भी स्वर्ण पदक जीते हैं।</li>\r\n\t\t<li>उन्हें <strong>अर्जुन पुरस्कार (1994), राजीव खेल रत्न पुरस्कार (1999) और पद्म श्री (1999)</strong> से सम्मानित किया गया है।</li>\r\n\t\t<li>उन्हें &#39;आंध्र प्रदेश की लौह महिला&#39; के रूप में भी जाना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>साइना नेहवाल</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>वह भारतीय पेशेवर बैडमिंटन खिलाड़ी हैं।</li>\r\n\t\t\t\t<li>वह 4-स्टार टूर्नामेंट जीतने वाली पहली भारतीय महिला और सबसे कम आयु की एशियाई महिला हैं।</li>\r\n\t\t\t\t<li>उन्हें 2009-2010 में राजीव गांधी खेल रत्न से सम्मानित किया गया।</li>\r\n\t\t\t\t<li>आत्मकथा: <strong>प्लेइंग टू विन: माई लाइफ ऑन एंड ऑफ कोर्ट</strong></li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>मैरी कॉम</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>वह भारतीय शौकिया मुक्केबाज हैं।</li>\r\n\t\t\t\t<li>वह रिकॉर्ड छह बार वर्ल्ड एमेच्योर बॉक्सिंग चैंपियन बनने वाली एकमात्र महिला हैं।</li>\r\n\t\t\t\t<li>वर्तमान सांसद, राज्य सभा।</li>\r\n\t\t\t\t<li>आत्मकथा:<strong>अनब्रेकेबल </strong></li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>पी. वी. सिंधु</td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>वह भारतीय पेशेवर बैडमिंटन खिलाड़ी हैं।</li>\r\n\t\t\t\t<li>वह बैडमिंटन विश्व चैंपियन बनने वाली पहली भारतीय हैं।</li>\r\n\t\t\t\t<li>वह ओलंपिक रजत पदक अर्जित करने वाली पहली भारतीय महिला हैं।</li>\r\n\t\t\t\t<li>उन्हें 2016 में राजीव गांधी खेल रत्न से सम्मानित किया गयाहै ।</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 100, "question": "\r\n\r\n<p><strong>Direction: In the following question a sentence or a phrase is given which can be substituted by one word. Choose the most appropriate word explaining the sentence or the phrase from the given option.</strong></p>\r\n\r\n<p>The process of compulsory enlistment for military service is called ____________</p>", "option1": "\r\n\r\n<p>Recruitment</p>", "option2": "\r\n\r\n<p>Conscription</p>", "option3": "\r\n\r\n<p>Pantheism</p>", "option4": "\r\n\r\n<p>Sinecure</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- &#39;Conscription&#39; </p>\r\n\r\n<ul>\r\n\t<li>Let us see the meanings of the given options:\r\n\t<ul>\r\n\t\t<li><strong>Recruitment:  </strong>the process of actively seeking out, finding and hiring candidates for a specific position or job. (भरती)</li>\r\n\t\t<li><strong>Conscription:  </strong>the system of making somebody join the army, etc. (अनिवार्य सैन्&zwj;य भरती)</li>\r\n\t\t<li><strong>Pantheism:  </strong>the belief that God exists in all natural things. (समस्त प्रकृति में ईश्वर के अस्तित्व का विश्वास; सर्वेश्वरवाद)</li>\r\n\t\t<li><strong>Sinecure:  </strong>a position requiring little or no work but giving the holder status or financial benefit. (ऐसी स्थिति जिसमें बहुत कम या कोई काम नहीं होता है लेकिन धारक का दर्जा या वित्तीय लाभ देता है)</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore, The process of compulsory enlistment for military service is called<strong>Conscription</strong>.</li>\r\n\t<li>Let us see the meanings of other words:\r\n\t<ul>\r\n\t\t<li>Cardiology: Cardio  - root means heart and - logy  - suffix means the study of. It means the study of the heart and its functions in health and disease. (कार्डी - जड़ का अर्थ है हृदय, - ology  - suffix  का अर्थ है अध्ययन करना। इसका मतलब हैं हृदयरोग विज्ञान)</li>\r\n\t\t<li>Osteology:  The word  &#39;Osteology&#39;  is derived from the from Greek ὀ&sigma;&tau;έ&omicron;&nu; (ost&eacute;on)  &#39;bones &#39;and  -ology - suffix  means the study of. It means the study of the structure and function of the skeleton and bony structures. ( &#39;Osteology&#39;  शब्द ग्रीक ὀ&sigma;&tau;έ&omicron;&nu; (ओस्टियन) &#39;हड्डियों&#39; से लिया गया है और  - ology  - suffix  का अर्थ है अध्ययन। इसका मतलब है कंकाल और हड्डी संरचनाओं की संरचना और कार्य का अध्ययन)</li>\r\n\t\t<li>Gastroenterology:  The word  &#39;Gastroenterology&#39;  is derived from the Greek  gastḗr , meaning  &ldquo;stomach&rdquo; or &ldquo;belly&rdquo;  and  -ology - suffix  means the study of. It means the branch of medicine that deals with disorders of the stomach and intestines. (शब्द   &#39;Gastroenterology&#39;  ग्रीक गैस्टर से लिया गया है, जिसका अर्थ है &quot;पेट&quot; या &quot;पेट&quot; और  -ology - suffix  का अर्थ है अध्ययन। इसका मतलब है औषधि की वह शाखा जो पेट और आंतों के विकारों से संबंधित है)</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 101, "question": "\r\n\r\n<p>Direction: Find the correct sequence for the given fill-up</p>\r\n\r\n<p>There were once a _________________________ to grant her desire.<br />\r\nP. had long in vain wished for a child.<br />\r\nQ. At length, the woman hoped<br />\r\nR. man and a woman who<br />\r\nS. that God was about</p>", "option1": "\r\n\r\n<p>PQRS</p>", "option2": "\r\n\r\n<p>RPQS</p>", "option3": "\r\n\r\n<p>SRQP</p>", "option4": "\r\n\r\n<p>RPSQ</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>The correct answer is- <strong>&#39;RPQS&#39;</strong></p>\r\n\r\n<ul>\r\n\t<li>While arranging the parts of the passage given in options, we have to  <u>find some grammatical or contextual connections between them </u>, so let&rsquo;s find out.  \r\n\r\n\t<ul>\r\n\t\t<li>The opener will be <strong>R  </strong>as it is completing the first part of the previous sentence.</li>\r\n\t\t<li>After this, P will come because  RP  is connected with the help of  &#39;who.&#39;</li>\r\n\t\t<li>After this, Qwill come as it is introducing the first part of the last sentence.</li>\r\n\t\t<li>S follows Q  as it is completing the last sentence.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The c <u>orrect sequence </u>:</li>\r\n</ul>\r\n\r\n<p>R. man and a woman who</p>\r\n\r\n<p>P. had long in vain wished for a child.</p>\r\n\r\n<p>Q. At length, the woman hoped</p>\r\n\r\n<p>S. that God was about</p>\r\n\r\n<ul>\r\n\t<li>Steps for solving Para Jumbles:\r\n\t<ul>\r\n\t\t<li>Clues include pronouns, like he, she, it, this, that, these, those; adverbs like formally, really; article a, an and the; definers like actually, finally, another; connectors like but, yet, both, also and neither nor, or, however, nevertheless.</li>\r\n\t\t<li>Now, with the help of clues, try to find out qualifier and qualified sentences, so that we can make pairs of qualified and qualifier sentences to eliminate the wrong choices given in the question.</li>\r\n\t\t<li>After making pairs, start eliminating the wrong choices or options given in the question.</li>\r\n\t\t<li>In case there is more than one choice, try to follow the sequence of sentences according to the occurrence of the events.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>विकल्पों में दिए गए गद्यांश के भागों को व्यवस्थित करते समय, हमें उनके बीच कुछ व्याकरणिक या प्रासंगिक संबंध खोजने होंगे, तो आइए जानें।\r\n\t<ul>\r\n\t\t<li>Opener R होगा क्योंकि यह पिछले वाक्य के पहले भाग को पूरा कर रहा है।</li>\r\n\t\t<li>इसके बाद P आएगा क्योंकि RP &#39;कौन&#39; की मदद से जुड़ा है।</li>\r\n\t\t<li>इसके बाद, <strong>Q</strong>आएगा क्योंकि यह अंतिम वाक्य के पहले भाग का परिचय दे रहा है ।</li>\r\n\t\t<li>S, Q का अनुसरण करता है क्योंकि यह अंतिम वाक्य को पूरा कर रहा है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 102, "question": "\r\n<p><strong>Choose the best replacement for the underlined part of the sentence.</strong></p>\r\n\r\n<p>&#39;Waiter, there&#39;s a fly in my soup. Please <u>take</u> it <u>up</u>.&#39;</p>", "option1": "\r\n<p>take... away</p>", "option2": "\r\n<p>get... away</p>", "option3": "\r\n<p>take... down</p>", "option4": "\r\n<p>put... off</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<u><strong>take... away</strong></u>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>In the above sentence, a request is made by the speaker <em>to remove </em> the soup.</li>\r\n\t<li>&#39;<em><strong>take up</strong></em>&#39; has two meanings</li>\r\n</ul>\r\n\r\n<ol>\r\n\t<li><u><em>become interested or engaged in a pursuit/work</em></u>.\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>Maria Sharapova <strong>took up</strong> tennis at the age of 6</em>.&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><em>occupy something like space, time, or attention.</em></u>\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>I won&#39;t <strong>take up</strong> any more of your time or that product your table.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n</ol>\r\n\r\n<ul>\r\n\t<li>&#39;<em><strong>take away</strong></em>&#39; means<em><u>to remove</u></em>. For example, &#39;<em><strong>Take </strong>these chairs <strong>away </strong>&ndash; we don&#39;t need them.</em>&#39;</li>\r\n</ul>\r\n\r\n<p>So, Option 1 is the correct answer</p>\r\n\r\n<p>Let us see the usage of other words in the options:</p>\r\n\r\n<ul>\r\n\t<li>&#39;get away&#39; &rArr; <u><em>escape</em></u>.\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The thief had <strong>got away</strong> before the police arrived.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&#39;take down&#39; has two meanings\r\n\t<ol>\r\n\t\t<li><u><em>write down spoken words</em></u>;</li>\r\n\t</ol>\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>I <strong>took down</strong> the address of Mr. Chakraborty and went out immediately.</em>&#39;</li>\r\n\t</ul>\r\n\r\n\t<ol>\r\n\t\t<li><em><u>dismantle and remove a structure</u></em>.</li>\r\n\t</ol>\r\n\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The government has decided to <strong>take down</strong> the old building to avert any accidents.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>&#39;put off&#39; &rArr;  <u><em>postpone</em></u>\r\n\t<ul>\r\n\t\t<li>For example, &#39;<em>The meeting has been <strong>put off</strong> till nine o&#39;clock.</em>&#39;</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 103, "question": "\r\n<p><strong>A sentence has been given with a blank to be filled with an appropriate word. Choose the correct alternative.</strong></p>\r\n\r\n<p>Many people ________ the sweeper for not keeping the roads clear.</p>", "option1": "\r\n<p>praised</p>", "option2": "\r\n<p>claimed</p>", "option3": "\r\n<p>calmed</p>", "option4": "\r\n<p>blamed</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;blamed&#39; </strong>.</p>\r\n\r\n<ul>\r\n\t<li>Let us look into the <strong>meaning </strong>of the given options - \r\n\r\n\t<ul>\r\n\t\t<li><strong>praised -  </strong>express warm approval or admiration of.</li>\r\n\t\t<li><strong>claimed -  </strong>state or assert that something is the case, typically without providing evidence or proof.</li>\r\n\t\t<li><strong>calmed -  </strong>make (someone) tranquil and quiet; soothe.</li>\r\n\t\t<li><strong>blamed -  </strong>feel or declare that (someone or something) is responsible for a fault or wrong.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>The given sentence implies that in the people&#39;s opinion, the sweeper was not clearing the roads. </li>\r\n\t<li>Thus we can infer that the sweeper was at fault as per the people. </li>\r\n\t<li>Hence, &#39; <strong>blamed&#39;  </strong>is the appropriate word for the given blank. </li>\r\n\t<li>So,  <strong>option 4  </strong>is the correct answer. </li>\r\n</ul>\r\n\r\n<p><strong><u>Correct sentence </u> - </strong><em>Many people<u><strong>blamed</strong></u>the sweeper for not keeping the roads clear.</em></p>", "question_heading": ""}, {"sr_no": 104, "question": "\r\n\r\n<p>विश्व मौसम विज्ञान संगठन (WMO) के तीसरे उपाध्यक्ष के रूप में किसे चुना गया है?</p>", "option1": "\r\n\r\n<p>सुनील कुमार</p>", "option2": "\r\n\r\n<p>रजत शर्मा</p>", "option3": "\r\n\r\n<p>मृत्युंजय महापात्र</p>", "option4": "\r\n\r\n<p>सुमित सिंह</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <u><strong>मृत्युंजय महापात्र</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>IMD निदेशक मृत्युंजय महापात्र जून 2023 में विश्व मौसम विज्ञान संगठन के तीसरे उपाध्यक्ष चुने गए।</li>\r\n\t<li>विश्व मौसम विज्ञान संगठन (WMO) ने भारत मौसम विज्ञान विभाग (IMD) के निदेशक मृत्युंजय महापात्र को WMO के तीसरे उपाध्यक्ष के रूप में चुना।</li>\r\n\t<li>WMO मौसम, जलवायु और जल पर संयुक्त राष्ट्र का आधिकारिक संगठन है।</li>\r\n\t<li><strong>विश्व मौसम विज्ञान संगठन (WMO)</strong>\r\n\t<ul>\r\n\t\t<li>यह संयुक्त राष्ट्र की एक विशेष एजेंसी है, जो वायुमंडलीय विज्ञान, जलवायु विज्ञान, जल विज्ञान और भूभौतिकी के क्षेत्र में अंतर्राष्ट्रीय सहयोग को बढ़ावा देती है।</li>\r\n\t\t<li>विश्व मौसम विज्ञान संगठन (WMO) अंतर्राष्ट्रीय मौसम विज्ञान संगठन (IMO) से उत्पन्न हुआ, जो कि मौसम डेटा और अनुसंधान के आदान-प्रदान की सुविधा के लिए 1873 में स्थापित एक गैर-सरकारी संगठन है।</li>\r\n\t\t<li>1947 के विश्व मौसम विज्ञान सम्मेलन, जिसने औपचारिक रूप से विश्व मौसम विज्ञान संगठन की स्थापना की, के परिणामस्वरूप IMO की स्थिति और संरचना को बदलने के प्रस्ताव आए।</li>\r\n\t\t<li><strong>मुख्यालय: जिनेवा, स्विट्जरलैंड</strong></li>\r\n\t\t<li><strong>अध्यक्ष: गेरहार्ड एड्रियन (जर्मनी)</strong></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 105, "question": "\r\n<p>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</p>\r\n\r\n<p>A. It accounts for the adaptation and evolution of organisms, those innumerable features that so wonderfully equip them for survival and reproduction.</p>\r\n\r\n<p>B. It is by way of this passive choosing, this natural selection, that the physical features of an entire population come to change over time.</p>\r\n\r\n<p>C. Furthermore, it accounts for the divergence of species from common ancestors and thus for the endless diversity of life.</p>\r\n\r\n<p>D. The theory of natural selection is the centerpiece of On the Origin of Species and of evolutionary theory.</p>", "option1": "\r\n<p>ABDC</p>", "option2": "\r\n<p>DCAB</p>", "option3": "\r\n<p>DACB</p>", "option4": "\r\n<p>BACD</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<ul>\r\n\t<li>The correct answer is DACB.</li>\r\n\t<li>The correct order to form a meaningful and coherent paragraph is  DACB.</li>\r\n\t<li>The sentence in the correct order is written as - &quot; The theory of nature selection is the centerpiece of On the Origin of Species and of evolutionary theory.  It accounts for the adaptation and evolution of organisms, those innumerable features that so wonderfully equip them for survival and reproduction.  Furthermore, it accounts for the divergence of species from common ancestors and thus for the endless diversity of life. It is by way of this passive choosing, this natural selection, that the physical features of an entire population come to change over time. &quot;</li>\r\n\t<li>Therefore  option 3  is the correct option from the given option.</li>\r\n\t<li>Coherent Paragraph  - A coherent paragraph is a paragraph with sequential sentences and logically related to the main idea. The sentence in the paragraph must be parallel in harmony and connected to one another.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 106, "question": "\r\n<p>Find the word which is correctly spelt from the given options.</p>", "option1": "\r\n<p>Unfortunately</p>", "option2": "\r\n<p>Sceince</p>", "option3": "\r\n<p>Uncomfortabel</p>", "option4": "\r\n<p>Negligant</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Unfortunately&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The correctly spelt word is<strong> unfortunately</strong> is an adverb which means happening through bad luck or used to express disappointment, sorrow.\r\n\r\n\t<ul>\r\n\t\t<li><strong>Example</strong>- We couldn&#39;t take him to the hospital. Unfortunately, he died.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p>Therefore,<strong> option1</strong> is the correct answer.</p>\r\n\r\n<p>The correct spelling of other words in the options are :</p>\r\n\r\n<ul>\r\n\t<li>Science which is a particular discipline or branch of learning.</li>\r\n\t<li>Uncomfortable means experiencing uneasiness or anxious, discomfort.</li>\r\n\t<li>Negligent means careless, inattentive.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 107, "question": "\r\n<p><strong>Direction: Choose the option which replaces the underlined word to form a grammatically correct sentence:</strong></p>\r\n\r\n<p><u>He grabbed</u> some cash and ran to buy the turkey and returned before I scolded him about how forgetful he was.</p>", "option1": "\r\n<p>He was being grabbed</p>", "option2": "\r\n<p>He may be grabbed</p>", "option3": "\r\n<p>He had grabbed</p>", "option4": "\r\n<p>No improvement</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is: <strong>He had grabbed</strong>.</p>\r\n\r\n<ul>\r\n\t<li>&#39;Had grabbed&#39; denotes the<strong> past perfect tense</strong>.</li>\r\n\t<li>The Past Perfect tense is used when out of two actions it is necessary to emphasize that the preceding action was completely finished before the succeeding action started.</li>\r\n\t<li>Preceding actions are generally implied by the following as given below:\r\n\t<ul>\r\n\t\t<li><strong>Before</strong></li>\r\n\t\t<li>After</li>\r\n\t\t<li>Recently</li>\r\n\t\t<li>Yet</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>For example: </strong>They had left <strong>before</strong> I spoke to them.</li>\r\n\t<li>Similarly, in this question, there are two actions in the past. The past perfect tense should be used in the preceding action (He had grabbed some cash) and the simple past tense should be used in the action that is done later (I scolded him).</li>\r\n</ul>\r\n\r\n<p>Therefore, the correct answer is: <em><strong><u>He had grabbed</u></strong> some cash and ran to buy the turkey and returned before I scolded him about how forgetful he was.</em></p>", "question_heading": ""}, {"sr_no": 108, "question": "\r\n<p>परमाणु झिल्लीरहित परमाणु सामग्री वाली कोशिकाओं वाले जीवों को निम्नलिखित में से क्या कहा जाता है?</p>", "option1": "\r\n<p>सुकेन्द्रिक</p>", "option2": "\r\n<p>रिक्तिकाएं</p>", "option3": "\r\n<p>प्राक्केन्द्रक</p>", "option4": "\r\n<p>कोशिकांग</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong><u>प्राक्केन्द्रक</u></strong> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>प्रोकैरियोट्स (प्राक्केन्द्रक),</strong>कोशिकाओं में <strong>नाभिक या अन्य </strong><strong>कोशिकांग  रहित</strong> जीव हैं।</li>\r\n\t<li>प्रोकैरियोट्स  (प्राक्केन्द्रक) <strong>आंतरिक झिल्ली</strong> नहीं होने से <strong>यूकेरियोट्स </strong><strong>( सुकेन्द्रिक )</strong> से भिन्न होतेहैं।</li>\r\n\t<li><strong>जीवाणु  और प्राच्य ,</strong> जिन्हें<strong> अलग-अलग विकासवादी वंश</strong> माना जाता है, प्रोकैरियोट्स की दो मुख्य श्रेणियां हैं।</li>\r\n\t<li>प्रोकैरियोटिक  (प्राक्केन्द्रक) कोशिकाओं में<strong> साइनोबैक्टीरिया, ई. कोलाई, माइकोप्लाज्मा आदि </strong>जैसे जीव शामिल हैं।</li>\r\n\t<li>सुकेन्द्रिक ( यूकेरियोट्स )<strong>:</strong>\r\n\t<ul>\r\n\t\t<li>सुविभाजित<strong> नाभिक</strong> वाले <strong>किसी भी कोशिका या प्राणी </strong>को सुकेन्द्रिक (यूकेरियोट)  कहा जाता है।</li>\r\n\t\t<li>नाभिक, जिनमें सुस्पष्ट गुणसूत्र होते हैं, यूकेरियोटिक कोशिकाओं <strong>में एक परमाणु झिल्ली में घिरा होता</strong> है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>रिक्तिका:</strong>\r\n\t<ul>\r\n\t\t<li><strong>एक झिल्ली-बध्य </strong>कोशिकांग  जिसे रिक्तिका  के रूप में जाना जाता है। </li>\r\n\t\t<li><strong>जंतु कोशिकाओं</strong> में सामन्यतः छोटी रिक्तिकाएं  होती हैं जो<strong> कचरे के पृथक्करण में सहायता करती हैं।</strong></li>\r\n\t\t<li><strong>पादप कोशिकाओं में </strong><strong>रिक्तिकाएं</strong> जल  के संतुलन को संरक्षित रखने में सहायता करती हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>कोशिकांग<strong>:</strong>\r\n\t<ul>\r\n\t\t<li>यह एक कोशिका में एक<strong> छोटी, झिल्ली-संलग्न संरचना</strong> है जो एक विशिष्ट उद्देश्य की पूर्ति करती है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 109, "question": "\r\n<p>निम्नलिखित में से किस विमान ने मई 2023 में भारतीय नौसेना के युद्धपोत पर पहली समुद्री लैंडिंग की थी?</p>", "option1": "\r\n<p>तेजस Mk-II</p>", "option2": "\r\n<p>MH60R</p>", "option3": "\r\n<p>सुखोई Su-30MKI</p>", "option4": "\r\n<p>मिग-21</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>MH60R</strong></u> है।</p>\r\n\r\n<p><strong>MH-60R हेलीकॉप्टर की समुद्र में पहली लैंडिंग हुई।</strong></p>\r\n\r\n<ul>\r\n\t<li>भारतीय नौसेना के MH60R हेलीकॉप्टर ने INS कोलकाता पर उतरकर एक महत्वपूर्ण उपलब्धि हासिल की है।</li>\r\n\t<li>यह अपनी असाधारण निगरानी, नौवहन रोधी और खोज और बचाव क्षमताओं के लिए जाना जाता है।</li>\r\n\t<li>भारतीय नौसेना के युद्धपोतों के साथ MH60R हेलीकॉप्टर का एकीकरण पानी के नीचे के खतरों का मुकाबला करने और निगरानी संचालन करने की नौसेना की क्षमता को और मजबूत करेगा।</li>\r\n\t<li>भारतीय नौसेना के अनुसार, MH60R हेलीकॉप्टर एक बहुमुखी मंच है जो अपनी असाधारण ASW, निगरानी, एंटी-शिपिंग और खोज और बचाव क्षमताओं के लिए जाना जाता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 110, "question": "\r\n<p>निम्नलिखित में से किस संवैधानिक संशोधन द्वारा संपत्ति के अधिकार को मौलिक अधिकारों से हटा दिया गया है?</p>", "option1": "\r\n<p>42वां संशोधन</p>", "option2": "\r\n<p>44वां संशोधन</p>", "option3": "\r\n<p>46वां संशोधन</p>", "option4": "\r\n<p>48वां संशोधन</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>44वां संशोधन</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>यह भारत के संविधान का 44वां संशोधन था जिसने घोषणा की कि संपत्ति का अधिकार अब मौलिक अधिकार नहीं रहेगा।</li>\r\n\t<li>44वें संशोधन की सहायता से अनुच्छेद 31 और अनुच्छेद 19(1)(f) को भाग III - संविधान के मौलिक अधिकार से पूरी तरह से हटा दिया गया।</li>\r\n\t<li>सर्वोच्च न्यायालय ने राज्य सरकार को याद दिलाया कि राज्य को किसी व्यक्ति की निजी संपत्ति लेने से पहले विधि के अधिकार और विधि की उचित प्रक्रिया का पालन करना पड़ता है।</li>\r\n\t<li>यह अनुच्छेद 300A में उल्लिखित प्रावधानों के अनुसार किया जाना चाहिए।</li>\r\n\t<li>मौलिक अधिकार भारत के संविधान के तहत सभी व्यक्तियों को गारंटीकृत बुनियादी अधिकारों और स्वतंत्रता का एक समूह है।</li>\r\n\t<li>इन अधिकारों को मौलिक माना जाता है क्योंकि ये व्यक्तियों के विकास, सम्मान और भलाई के लिए आवश्यक हैं।</li>\r\n\t<li>मौलिक अधिकार भारतीय संविधान के भाग III (अनुच्छेद 12 से 35) में निहित हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 111, "question": "\r\n<p>भारतीय संविधान का निम्नलिखित में से कौन सा अनुच्छेद सर्वोच्च न्यायालय द्वारा निर्णयों या आदेशों की समीक्षा से संबंधित है?</p>", "option1": "\r\n<p>अनुच्छेद 137</p>", "option2": "\r\n<p>अनुच्छेद 130</p>", "option3": "\r\n<p>अनुच्छेद 127</p>", "option4": "\r\n<p>अनुच्छेद 131</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>137</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>भारतीय संविधान का अनुच्छेद 137 सर्वोच्च न्यायालय द्वारा निर्णयों या आदेशों की समीक्षा से संबंधित है</strong></li>\r\n\t<li><strong>अनुच्छेद 136: सर्वोच्च न्यायालय द्वारा अपील करने की विशेष अनुमति</strong></li>\r\n\t<li>(1) इस अध्याय में किसी बात के होते हुए भी, सर्वोच्च न्यायालय, अपने विवेक से, भारत के क्षेत्र में किसी न्यायालय या न्यायाधिकरण द्वारा पारित या किए गए किसी भी कारण या मामले में किसी भी निर्णय, आदेश, फैसले, वचन या आदेश से अपील करने के लिए विशेष अनुमति दे सकता है।</li>\r\n\t<li>(2) खंड (1) में कुछ भी सशस्त्र बलों से संबंधित किसी भी कानून द्वारा या उसके तहत गठित किसी अदालत या न्यायाधिकरण द्वारा पारित या दिए गए किसी भी निर्णय, दृढ़ संकल्प, कथन या आदेश पर लागू नहीं होगा।</li>\r\n\t<li><strong>अनुच्छेद 138: सर्वोच्च न्यायालय के अधिकार क्षेत्र में वृद्धि</strong></li>\r\n\t<li>(1) सर्वोच्च न्यायालय के पास संघ सूची के किसी भी मामले के संबंध में उतना अधिक क्षेत्राधिकार और शक्तियां होंगी, जितनी संसद कानून द्वारा प्रदान कर सकती है।</li>\r\n\t<li>(2) सर्वोच्च न्यायालय के पास किसी भी मामले के संबंध में इतना अधिक क्षेत्राधिकार और शक्तियाँ होंगी, जो भारत सरकार और किसी राज्य की सरकार द्वारा विशेष समझौते द्वारा प्रदान की जा सकती हैं, यदि संसद कानून द्वारा इस तरह के अधिकार क्षेत्र और शक्तियों का प्रयोग सुप्रीम कोर्ट को प्रदान करती है।</li>\r\n\t<li><strong>अनुच्छेद 139: सर्वोच्च न्यायालय को कुछ रिट जारी करने की शक्तियां प्रदान करना</strong></li>\r\n\t<li>संसद कानून द्वारा उच्चतम न्यायालय को निर्देश, आदेश या रिट जारी करने की शक्ति प्रदान कर सकती है, जिसमें बंदी प्रत्यक्षीकरण, परमादेश, निषेध, अधिकार-पृच्छा और उत्प्रेषण, या उनमें से किसी भी प्रकार के रिट शामिल हैं, जो खंड (2) अनुच्छेद 32 में वर्णित उद्देश्यों के अलावा किसी भी उद्देश्य के लिए हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 112, "question": "\r\n<p>Directions: Select the option that is nearest in meaning to the underlined word and mark the correct answer accordingly.</p>\r\n\r\n<p>Week-long rain leaves crops damaged in Divar making farmers <u>morose.</u></p>", "option1": "\r\n<p>Communicative</p>", "option2": "\r\n<p>Sullen</p>", "option3": "\r\n<p>Cheerful</p>", "option4": "\r\n<p>Happy</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &#39;<strong>Sullen</strong>&#39;.</p>\r\n\r\n<ul>\r\n\t<li>Morose  means&#39; bad-tempered, and not saying much to other people ( <strong>बुरे स्वभाव वाला, और दूसरे लोगों से ज्यादा कुछ नहीं कहना; चिड़चिड़ा, असौम्&zwj;य और बात को</strong><strong>अपने तक सीमित रखने वाला </strong>)<strong>&#39;.</strong></li>\r\n\t<li>Marked option  &#39;Sullen&#39;  means  &#39; looking bad-tempered and not wanting to speak to people ( <strong>चिड़चिड़ा और उदासी भरा लोगों से बोलने का अनिच्&zwj;छुक; खिन्&zwj;न </strong>)<strong>&#39;.</strong>\r\n\t<ul>\r\n\t\t<li><strong>Example: </strong><em>Kashmir to have a silent and <strong>sullen </strong>Eid after weeks of strife and violence.</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>It is clear that  Morose  and  &#39;Sullen&#39;  are nearly the  same  in meaning. </li>\r\n</ul>\r\n\r\n<p>Therefore, the  correct answer  is  option 2.</p>\r\n\r\n<ul>\r\n\t<li><strong>Communicative  </strong>means  willing and able to talk and share ideas, etc. ( <strong>बातचीत या विचारों के आदान-प्रदान का इच्&zwj;छुक व इसमें सक्षम </strong>).</li>\r\n\t<li><strong>Cheerful  </strong>means  feeling or showing happiness ( <strong>खुशी महसूस करना या दिखाना </strong>).</li>\r\n\t<li><strong>Happy  </strong>means  feeling or showing pleasure; pleased ( <strong>आनंद का अनुभव करने या उसे व्&zwj;यक्त करने वाला; प्रसन्&zwj;न, प्रफुल्&zwj;ल </strong>).</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 113, "question": "\r\n<p>Choose the option that is the correct direct form of the sentence.</p>\r\n\r\n<p>Shubham said that his father was playing cricket with him.</p>", "option1": "\r\n<p>Shubham said, &ldquo;My father was playing cricket with me.&rdquo;</p>", "option2": "\r\n<p>Shubham said, &ldquo;My father is playing cricket with me.&rdquo;</p>", "option3": "\r\n<p>Shubham said, &ldquo;My father played cricket with me.&rdquo;</p>", "option4": "\r\n<p>Shubham said, &ldquo;My father had played cricket with me.&rdquo;</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;Option 2&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>The original sentence</strong> states that Shubham said that his father<strong> &quot;was&quot;</strong> playing cricket with him.</li>\r\n\t<li><strong>When we convert</strong> direct speech to indirect speech, we generally need to shift the verb tense back one step.</li>\r\n\t<li>However, in this case, option 2<strong> maintains the present tense of the verb</strong> &quot;is&quot; because it accurately reflects the original sentence&#39;s meaning.</li>\r\n</ul>\r\n\r\n<p>Therefore, the<strong> correct sentence </strong>is: <em>&#39;Shubham said, &ldquo;My father is playing cricket with me.&rdquo;</em></p>\r\n\r\n<ul>\r\n\t<li><strong>Option 1)</strong> &quot;Shubham said, &#39;My father was playing cricket with me.&#39;&quot; changes the verb tense to <strong>past tense (&quot;was playing&quot;), </strong>which does not align with the reported speech. The original sentence indicates that the father is currently playing cricket, so the present tense should be maintained.</li>\r\n\t<li><strong>Option 3)</strong> &quot;Shubham said, &#39;My father played cricket with me.&#39;&quot; changes the verb tense to <strong>past tense (&quot;played&quot;),</strong> which again does not accurately convey the present ongoing action of the father playing cricket.</li>\r\n\t<li><strong>Option 4)</strong> &quot;Shubham said, &#39;My father had played cricket with me.&#39;&quot; uses the <strong>past perfect tense (&quot;had played&quot;),</strong> which suggests an action completed before a past point of reference. However, there is no specific past point of reference mentioned in the original sentence, so the past perfect tense is not necessary.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 114, "question": "\r\n<p>किस प्रकार की मंदिर वास्तुकला के तहत मंदिरों की संरचना एक तारे की तरह दिखाई देती है और इसे तारकीय संरचना के रूप में जाना जाता है?</p>", "option1": "\r\n<p>वेसर शैली</p>", "option2": "\r\n<p>नागर शैली</p>", "option3": "\r\n<p>द्रविड़ शैली</p>", "option4": "\r\n<p>काकतीय शैली</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>वेसर शैली</strong></u> है। </p>\r\n\r\n<p><strong>वास्तुकला की वेसर शैली:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>मंदिर स्थापत्य की वेसर शैली का विकास दक्कन भारत में हुआ। </strong></li>\r\n\t<li><strong>यह मंदिर वास्तुकला की नागर और द्रविड़ शैली की मिश्रित शैली है।</strong></li>\r\n\t<li>यह सातवीं शताब्दी के मध्य के बाद कर्नाटक के क्षेत्र में <strong>चालुक्य शासकों के संरक्षण</strong> में लोकप्रिय हो गई।</li>\r\n</ul>\r\n\r\n<p><strong>वेसर शैली की विशेषताएं:</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>चहारदीवारी मौजूद हो भी सकती है या नहीं भी हो सकती है।</strong></li>\r\n\t<li>गोपुरम उपस्थित हो भी सकते हैं या नहीं भी हो सकते हैं। </li>\r\n\t<li><strong>इन मंदिरों की संरचना एक तारे की तरह दिखती है और इसलिए इसे तारकीय संरचना के रूप में जाना जाता है। अतः विकल्प 1 सही है।</strong></li>\r\n\t<li><strong>उदाहरण: दुर्गा मंदिर (ऐहोल), विरुपाक्ष मंदिर (पट्टडकल), केशव मंदिर (सोमनाथपुर)।</strong></li>\r\n\t<li>चालुक्य, कला के महान संरक्षक थे। उन्होंने भारत में मंदिर वास्तुकला की <strong>वेसर शैली</strong> विकसित की।</li>\r\n\t<li>चालुक्यों के अंतर्गत गुफा मंदिर की वास्तुकला भी प्रसिद्ध थी। उनके गुफा मंदिर अजंता, एलोरा और नासिक में पाए जाते हैं।</li>\r\n\t<li>बादामी में चालुक्य चित्रों के सर्वोत्तम नमूने देखे जा सकते हैं।</li>\r\n</ul>\r\n\r\n<p><strong>द्रविड़ शैली:</strong></p>\r\n\r\n<ul>\r\n\t<li>आम तौर पर <strong>एक चहारदीवारी के भीतर सीमित</strong> होती है।</li>\r\n\t<li><strong>प्रवेश द्वार</strong> को <strong>गोपुरम </strong>के नाम से जाना जाता है।</li>\r\n\t<li><strong>मंदिर की मीनार के आकार</strong> को <strong>विमान (नागर शैली के शिखर के समान)</strong> के रूप में जाना जाता है।</li>\r\n\t<li>मंदिर परिसर में <strong>पानी की बड़ी टंकियां</strong> आम हैं।</li>\r\n\t<li>उदाहरण: <strong>ब्रहदेश्वर मंदिर, राजराजेश्वर मंदिर।</strong></li>\r\n</ul>\r\n\r\n<p><strong>नागर शैली:</strong></p>\r\n\r\n<ul>\r\n\t<li>एक पत्थर के चबूतरे पर बनाया जाता है जिसतक पहुँचने के लिए सीढ़ियाँ होती हैं।</li>\r\n\t<li>एक मीनार या शिखर होता है।</li>\r\n\t<li><strong>गर्भगृह </strong>(भगवान और देवी की मूर्तियों का स्थान) है।</li>\r\n\t<li>उदाहरण: <strong>खजुराहो में कंदरिया महादेव मंदिर, लक्ष्मण मंदिर। </strong></li>\r\n</ul>\r\n\r\n<p><strong>मध्य भारत के मंदिर</strong></p>\r\n\r\n<ul>\r\n\t<li>उत्तर प्रदेश, मध्य प्रदेश और राजस्थान के प्राचीन मंदिरों में कई विशेषताएं आम हैं।</li>\r\n\t<li>वे <strong>बलुआ पत्थर</strong> से बने हैं।</li>\r\n\t<li><strong>गुप्त काल के</strong> कुछ सबसे पुराने जीवंत <strong>संरचनात्मक मंदिर</strong> मध्य प्रदेश में हैं।</li>\r\n\t<li>ये अपेक्षाकृत मामूली दिखने वाले मंदिर हैं जिनमें से प्रत्येक में चार स्तंभ हैं, जो एक छोटे मंडप को सहारा प्रदान करते हैं, जो गर्भगृह के रूप में कार्य करने वाले समान रूप से छोटे कमरे से पहले एक साधारण चौकोर बरामदे जैसा दिखता है।</li>\r\n\t<li>देवगढ़ (ललितपुर जिले, उत्तर प्रदेश में) छठी शताब्दी ईस्वी की शुरुआत में बनाया गया था। उत्तर गुप्त काल के मंदिर का एक उत्कृष्ट उदाहरण है।</li>\r\n\t<li>इस घुमावदार लैटिना या रेखा-प्रसाद प्रकार के शिखर की उपस्थिति से यह भी स्पष्ट होता है कि यह मंदिर की क्लासिक नागर शैली का एक प्रारंभिक उदाहरण है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 115, "question": "\r\n<p>Select the INCORRECTLY spelt word.</p>", "option1": "\r\n<p>Ilegal</p>", "option2": "\r\n<p>Appeal</p>", "option3": "\r\n<p>Appropriate</p>", "option4": "\r\n<p>Irresponsible</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The erroneous spelling is &#39;Ilegal&#39; .</p>\r\n\r\n<ul>\r\n\t<li>Let us explore the meaning of the given options \r\n\t<ul>\r\n\t\t<li>Ilegal -There is no such word in English or we can say that there is a spelling mistake in the word. But if an extra  <strong>letter l  </strong>is added   the word becomes  illegal,  which is a proper English word. It means  contrary to or forbidden by law, especially criminal law.</li>\r\n\t\t<li>Appeal -   make a serious, urgent, or heartfelt request.</li>\r\n\t\t<li>Appropriate -  suitable or proper in the circumstances.</li>\r\n\t\t<li>Irresponsible -  (of a person, attitude, or action) not showing a proper sense of responsibility.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Hence, the correct answer is  option 1.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 116, "question": "\r\n<p>किसी द्रव के ताप में वृद्धि के साथः</p>", "option1": "\r\n<p>पृष्ठीय तनाव में वृद्धि तथा श्यानता में कमी आती है।</p>", "option2": "\r\n<p>पृष्ठीय तनाव एवं श्यानता दोनों में कमी आती है।</p>", "option3": "\r\n<p>पृष्ठीय तनाव एवं श्यानता दोनों में वृद्धि होती है।</p>", "option4": "\r\n<p>पृष्ठीय तनाव में कमी तथा श्यानता में वृद्धि होती है।</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><u><strong>पृष्ठ तनाव एवं श्यानता पर तापमान का प्रभाव:</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>जैसे-जैसे तापमान बढ़ता है, श्यानता कम होती जाती है।</strong></li>\r\n\t<li><strong>तापमान में वृद्धि के साथ पृष्ठ तनाव कम होता जाता है।</strong></li>\r\n\t<li>सामान्य तौर पर, तापमान बढ़ने पर पृष्ठ तनाव कम हो जाता है क्योंकि आणविक तापीय गतिविधि में वृद्धि के साथ संयोजी बल कम हो जाते हैं।</li>\r\n\t<li>आस-पास के वातावरण का प्रभाव इंटरफेस (अंतराफलक) पर तरल अणुओं की आसंजक क्रिया के कारण होता है।</li>\r\n\t<li>तापमान बढ़ने से श्यानता में कमी आती है क्योंकि अधिक तापमान का अर्थ है कि कणों में अधिक तापीय ऊर्जा होती है और वे उन्हें एक साथ बांधने वाली आकर्षक बलों को आसानी से दूर कर लेते हैं।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 117, "question": "\r\n<p>Direction: The sentence is divided into four parts. Find out which part has an error and mark it as your answer. If there is no error, mark &#39;No error&#39; as your answer.</p>\r\n\r\n<p>One of them (a) / forgot to take their bag (b) / from the school. (c) / No error (d)</p>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>B</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&#39;(B)&#39;.</strong></p>\r\n\r\n<ul>\r\n\t<li>The <strong>error lies </strong>in <strong>Part B </strong>of the sentence.</li>\r\n\t<li><strong>&#39;One of them&#39; </strong>noun phrase is <strong>singular </strong>here so <strong>relative pronoun </strong>should also be in <strong>singular form.</strong></li>\r\n\t<li><strong>&#39;His&#39; </strong>will be used <strong>instead </strong>of <strong>&#39;Their&#39;.</strong></li>\r\n\t<li>So, the <strong>correct answer </strong>is- <strong>&#39;Option 2&#39; </strong>.</li>\r\n</ul>\r\n\r\n<p>Therefore, the <strong>correct sentence </strong>is- <em>One of them forgot to take <strong>his </strong>bag from the school.</em></p>", "question_heading": ""}, {"sr_no": 118, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (1)?</p>", "option1": "\r\n<p>Farmer</p>", "option2": "\r\n<p>Farmers</p>", "option3": "\r\n<p>Farmers&#39;</p>", "option4": "\r\n<p>Farmer&#39;s</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>Farmers&#39;</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the first line of the paragraph, <strong>Farmers&#39;</strong> will be used before unions.</li>\r\n\t<li>It is so because<strong> &#39;If a plural pronoun ends in &#39;s/es&#39;, &#39;s&#39; is not added while apostrophe with the plural form&#39;.</strong>\r\n\t<ul>\r\n\t\t<li><strong>For Examples</strong> - <strong>Boys&#39; </strong>college, <strong>Girls&#39;</strong> college.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore,<strong> farmers&#39; </strong>will be the most appropriate of all the options.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 119, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (3)?</p>", "option1": "\r\n<p>He</p>", "option2": "\r\n<p>Them</p>", "option3": "\r\n<p>They</p>", "option4": "\r\n<p>It</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>They</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the third blank of the passage, <strong>&#39;they&#39; </strong>will be used.</li>\r\n\t<li>Here in the given sentence, <strong>&#39;they&#39;</strong> is qualifying <strong>farmers</strong> which is a <strong>plural noun</strong>.</li>\r\n\t<li><strong>&#39;It&#39; </strong>and <strong>&#39;He&#39;</strong> cannot be used because they are <strong>singular pronouns </strong>and cannot qualify a plural noun.</li>\r\n\t<li><strong>&#39;Them&#39;</strong> is pronoun used in<strong> objective case</strong>.</li>\r\n\t<li>Therefore, it cannot be used.</li>\r\n</ul>\r\n\r\n<p><strong>Thus, the correct answer for the blank is</strong> &#39;They&#39;.</p>", "question_heading": ""}, {"sr_no": 120, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (4)?</p>", "option1": "\r\n<p>At</p>", "option2": "\r\n<p>In</p>", "option3": "\r\n<p>Of</p>", "option4": "\r\n<p>On</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>On.</strong></p>\r\n\r\n<ul>\r\n\t<li>In the fourth blank of the passage, <strong>&#39;on&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;On the other hand&#39; </strong>is an idiom <strong>used to introduce a statement that contrasts with a previous statement or presents a different point of view</strong>.\r\n\t<ul>\r\n\t\t<li><strong>For Example</strong> - He&#39;s a good guy. His brother, <strong>on the other hand</strong>, is a very selfish man.</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>Therefore, the correct answer for the blank is</strong> &#39;On&#39;.</p>", "question_heading": ""}, {"sr_no": 121, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (2)?</p>", "option1": "\r\n<p>off</p>", "option2": "\r\n<p>of</p>", "option3": "\r\n<p>in</p>", "option4": "\r\n<p>to</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is <strong>Of</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the second blank, <strong>&#39;of&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;Of&#39; </strong>is a preposition that indicates relationships between other words, such as belonging, things made of other things, things that contain other things, or a point of reckoning.</li>\r\n\t<li><strong>Usage of &#39;Of&#39;</strong> - We use of when we want to show that people or things relate to other things or people. For example, when we want to say that something or someone belongs to or is a part of something or someone else, we can do it like this:</li>\r\n\t<li><strong>For Examples:-</strong>\r\n\t<ul>\r\n\t\t<li>Tiffany stared at the floor <strong>of </strong>her room.</li>\r\n\t\t<li>He resigned his position as a member <strong>of </strong>the school board.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Here &#39;of&#39; is showing the <strong>relationship between withdrawal and Farm acts</strong>.</li>\r\n\t<li>Therefore,<strong> &#39;of&#39;</strong> will be the appropriate answer for the blank.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 122, "question": "\r\n<p>Which of the following words most appropriately fits the blank labelled as (5)?</p>", "option1": "\r\n<p>At</p>", "option2": "\r\n<p>On</p>", "option3": "\r\n<p>In</p>", "option4": "\r\n<p>with</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>Here the correct answer is<strong> In</strong>.</p>\r\n\r\n<ul>\r\n\t<li>In the<strong> fifth</strong> blank of the passage,<strong> &#39;in&#39;</strong> will be used.</li>\r\n\t<li><strong>&#39;In&#39;</strong> is used to<strong> show the position of something within a limited space, but in a more general sense. </strong></li>\r\n\t<li>It&rsquo;s best suited when you want to say something is contained within something else or inside something else.</li>\r\n\t<li>Here, the selling of crops is being done in the output market <strong>which is showing the position of crops to be sold</strong>.</li>\r\n</ul>\r\n\r\n<p><strong>Therefore, the correct answer for the blank is</strong> &#39;In&#39;.</p>", "question_heading": ""}, {"sr_no": 123, "question": "\r\n<p>What does the phrase, &lsquo;Rather than yield to the pleas of the victim,&rsquo; mean?</p>", "option1": "\r\n<p>Tried to listen to the appeal of the learner</p>", "option2": "\r\n<p>Attempted to oppose the victim</p>", "option3": "\r\n<p>Instead of giving in to the requests of the victim</p>", "option4": "\r\n<p>Tried to yield to the pleas of the victim</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>Instead of giving in to the requests of the victim. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>In the given passage, the writer explains the effects of punishments given by the teacher on the learner.</li>\r\n\t<li>In line 1 of paragraph 2;\r\n\t<ul>\r\n\t\t<li>The typical <strong>Teacher was willing to deliver as much pain as was available </strong>to give.</li>\r\n\t\t<li><strong>Rather than yield to the pleas of the victim </strong>, about two thirds of the subjects in Milgram&rsquo;s experiment pulled every one of the thirty shock switches in front of them and continued to engage the last switch (450 volts) until the researcher ended the experiment.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>&quot;Yield to&quot; in the given sentence means to stop refusing to do something,  </strong>somebody is asking to do.</li>\r\n\t<li>According to the given passage, <strong>the &#39;teacher&#39; doesn&#39;t stop giving shocks to the victim i.e. &quot;the learner&quot;.</strong></li>\r\n\t<li>Thus, it can be inferred from the above explanation that &quot;rather than yield to the pleas of the victim&quot; means that &quot;instead of giving in to the requests of the victim&quot; the teacher continues the punishment.</li>\r\n</ul>\r\n\r\n<p>Hence, the <strong>correct answer is option 3 </strong>.</p>", "question_heading": ""}, {"sr_no": 124, "question": "\r\n<p>What can be the most suitable title for this passage?</p>", "option1": "\r\n<p>Obedience to Authority</p>", "option2": "\r\n<p>Study on Memory</p>", "option3": "\r\n<p>An Experiment on Punishment</p>", "option4": "\r\n<p>Tolerance Level of Human</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>&quot;Obedience to Authority.&quot;</strong></p>\r\n\r\n<ul>\r\n\t<li>The given passage describes the series of psychological experiments which were conducted to study the effects of punishment on learning.</li>\r\n\t<li>Now, let us understand the given options and see which one of them is the suitable title fo
