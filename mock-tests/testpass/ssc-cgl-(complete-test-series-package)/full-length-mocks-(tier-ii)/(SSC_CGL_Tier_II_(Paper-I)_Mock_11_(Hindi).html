r the passage.\r\n\t<ul>\r\n\t\t<li>&quot;Obedience to Authority&quot; fits the best to the given passage, refer to the following lines:\r\n\t\t<ul>\r\n\t\t\t<li>Line 4 of paragraph 2:  This <strong>blind obedience to authority made them do such inhuman acts.</strong></li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>While <strong>the options 2, 3 and 4 describe a part of the passage, option 1 indicate the whole idea of the given passage.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, option 1 is the most suitable title for the given passage.</li>\r\n</ul>\r\n\r\n<p>Hence, <strong>the correct answer is option 1 </strong>.</p>", "question_heading": ""}, {"sr_no": 125, "question": "\r\n<p>Why did the teacher continue to give punishment to the learner?</p>", "option1": "\r\n<p>Teacher wanted to correct the learner</p>", "option2": "\r\n<p>Teacher was only following the given instructions</p>", "option3": "\r\n<p>Teacher believed in punishing learner who answered wrongly</p>", "option4": "\r\n<p>Teacher believed in proving the aims of the study</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>Teacher was only following the given instructions. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>We are asked to answer why the teacher continued to give punishment to the learner.</li>\r\n\t<li>Refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>Line 3 and 4 of paragraph 2: The <strong>reason for such inhuman behavior of a &lsquo;teacher&rsquo; </strong>, according to Milgram, is that his subject&rsquo;s <strong>inability to defy the wishes of the boss of the study&mdash;the lab-coated researcher </strong>who urged and, if need be, directed the subjects to perform their duties, despite the emotional and physical mayhem they were causing.</li>\r\n\t\t<li>Line 4 of paragraph 2: <strong>This blind obedience to authority </strong>made them do such inhuman acts.</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Thus, from the above given lines it is clear that the teacher continued the punishment because he/she was following the instructions given by the researcher.</li>\r\n</ul>\r\n\r\n<p>Hence, the <strong>correct answer is option 2 </strong>.</p>", "question_heading": ""}, {"sr_no": 126, "question": "\r\n<p>What purpose was given to the volunteers about Milgram&rsquo;s experiment?</p>", "option1": "\r\n<p>To study the effect of following the orders of authority</p>", "option2": "\r\n<p>They were not told about the purpose</p>", "option3": "\r\n<p>To study the effect of punishment on learning</p>", "option4": "\r\n<p>To study the effect of memory based learning</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is &quot; <strong>To study the effect of the following the orders of authority. </strong>&quot;</p>\r\n\r\n<ul>\r\n\t<li>Refer to the following lines of the passage:\r\n\t<ul>\r\n\t\t<li>Line 1 of paragraph 1:  A series of psychological experiments were conducted by Professor Milgram <strong>to study the effect of punishment on learning.</strong></li>\r\n\t\t<li>Line 1 of paragraph 1:   In these experiments <strong>two participants had to take part as teacher and learner.</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>From the above given lines, it is clear that the participants were asked to take part in the experiment to study the effect of punishment on learning.</li>\r\n</ul>\r\n\r\n<p>Hence, it can be concluded that <strong>the correct answer is option 3 </strong>.</p>\r\n\r\n<ul>\r\n\t<li> Experiment:  a scientific test that is done in order to get proof of something or new knowledge.</li>\r\n\t<li>Punishment: the imposition of an undesirable or unpleasant outcome upon a group or individual, meted out by an authority.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 127, "question": "\r\n<p>What can be devised about General Lee from this passage?</p>", "option1": "\r\n<p>He could have made better plans for fighting the war.</p>", "option2": "\r\n<p>He should have retreated instead of fighting.</p>", "option3": "\r\n<p>He was a scatter brained person who knew how to fight.</p>", "option4": "\r\n<p>He was a practical and principled man who knew the tactics of war.</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>He was a practical and principled man who knew the tactics of war.</strong></p>\r\n\r\n<ul>\r\n\t<li>In this passage General Lee was a practical and principled man who knew the tactics of war.</li>\r\n\t<li>Therefore <strong>option 4 </strong>is the correct option.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 128, "question": "\r\n<p>After reading this passage, you can conclude that Hooker was ______.</p>", "option1": "\r\n<p>hopeful</p>", "option2": "\r\n<p>vain</p>", "option3": "\r\n<p>disliked</p>", "option4": "\r\n<p>ignorant</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>vain</strong></p>\r\n\r\n<ul>\r\n\t<li>After reading the passage, you can conclude that hooker was <strong><u>vain</u></strong>.</li>\r\n\t<li>Hooker boasted, &quot;My plans are perfect&quot; even though the Union soldiers were in a dire situation, having lost the last four major battles and being famished, exhausted, and demoralized. He had amassed a great deal of intelligence about Lee&rsquo;s army and was aware of his own numeric advantage. Hooker was so sure of his advantage that he believed Lee&#39;s only option was to retreat to Richmond.</li>\r\n\t<li><strong>Vain - </strong>Having or showing an excessively high opinion of one&#39;s appearance, abilities, or worth.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; His flattery made her vain. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n\t<li>Let&#39;s discuss information about other options:</li>\r\n\t<li><strong>Hopeful</strong> - Felling or inspiring optimism about a future event.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; A hopeful sign. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Disliked</strong> - Feel distaste for or hostility towards.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; She dislikes noise. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Ignorant</strong> - Lacking knowledge or awareness in general.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Shreya is very ignorant. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 129, "question": "\r\n<p>What would be the synonym for propensity?</p>", "option1": "\r\n<p>Conviction</p>", "option2": "\r\n<p>Proclivity</p>", "option3": "\r\n<p>Repugnance</p>", "option4": "\r\n<p>Abhorrence</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>Proclivity</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The synonym for propensity is Proclivity.</li>\r\n\t<li><strong>Propensity</strong> = <strong>Proclivity</strong> = An inclination or natural tendency to behave in a particular way. \r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Her propensity for violence. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n\t<li>Let&#39;s discuss information about other options:</li>\r\n\t<li><strong>Conviction</strong> - A firmly held belief or opinion.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Sam takes pride in stating his political conviction. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Repugnance</strong> - Intense disgust.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; Our repugnance at the bleeding carcasses. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>Abhorrence</strong> - Feeling of revulsion or disgusted loathing.\r\n\t<ul>\r\n\t\t<li><em>For example: &quot; The thought of marrying him filled her with abhorrence. &quot;</em></li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 130, "question": "\r\n<p>How many men did Hooker position behind Lee&#39;s army?</p>", "option1": "\r\n<p>64,000</p>", "option2": "\r\n<p>70,000</p>", "option3": "\r\n<p>1,34,000</p>", "option4": "\r\n<p>61,000</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>The correct answer is <strong>70</strong><strong>,000</strong>.</p>\r\n\r\n<ul>\r\n\t<li>The Hooker positioned 70,000 men behind Lee&#39;s army.</li>\r\n\t<li>Therefore <strong>option 2 </strong>is the correct option.</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 131, "question": "\r\n<p>निम्नलिखित में से कौन सा विकल्प कंप्यूटर सिस्टम से संबद्ध नहीं है?</p>", "option1": "\r\n<p>PPP</p>", "option2": "\r\n<p>FTP</p>", "option3": "\r\n<p>URL</p>", "option4": "\r\n<p>EPF</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>EPF</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>EPF</strong><strong>(कर्मचारी भविष्य निधि) कंप्यूटर सिस्टम से संबद्ध नहीं है।</strong></li>\r\n\t<li>कर्मचारी भविष्य निधि <strong>15 नवंबर, 1951 को बनाई गई</strong> थी, जब कर्मचारी भविष्य निधि अध्यादेश पारित किया गया था।</li>\r\n\t<li>श्रमिक भविष्य निधि अधिनियम 1952 ने इसे निरस्त कर दिया। मजदूरों के <strong>भविष्य निधि विधेयक (1952 का बिल नंबर 15) </strong>संसद में कारखानों और अन्य प्रतिष्ठानों में कर्मचारियों के लिए भविष्य निधि के निर्माण के लिए एक बिल के रूप में पेश किया गया था।</li>\r\n\t<li>कर्मचारी भविष्य निधि और विविध प्रावधान अधिनियम, 1952, जो पूरे देश को शामिल करता है, अब कर्मचारी भविष्य निधि और विविध प्रावधान अधिनियम, 1952 के रूप में जाना जाता है।</li>\r\n\t<li><strong>पॉइंट-टू-पॉइंट प्रोटोकॉल (</strong>PPP<strong>)</strong>\r\n\t<ul>\r\n\t\t<li>यह एक डेटा लिंक लेयर (लेयर 2) संचार प्रोटोकॉल है जो किसी होस्ट या किसी अन्य नेटवर्किंग के उपयोग के बिना सीधे दो राउटर को जोड़ता है।</li>\r\n\t\t<li>इसमें कनेक्शन को प्रमाणित करने, प्रसारण को एन्क्रिप्ट करने और डेटा को संपीड़ित करने की क्षमता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>फ़ाइल स्थानांतरण प्रोटोकॉल (</strong>FTP<strong>)</strong>\r\n\t<ul>\r\n\t\t<li>यह एक सर्वर से एक डिवाइस के लिए कंप्यूटर नेटवर्क पर डेटा फ़ाइलों को स्थानांतरित करने के लिए एक आम संचार प्रोटोकॉल है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>यूनिफ़ॉर्म रिसोर्स लोकेटर (URL),</strong>\r\n\t<ul>\r\n\t\t<li>यह एक वेब संसाधन का संदर्भ है जो कंप्यूटर नेटवर्क के साथ-साथ इसे पुनर्प्राप्त करने के लिए एक तंत्र पर अपना स्थान निर्दिष्ट करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 132, "question": "\r\n<p>ई-मेल में शीघ्र पुनर्प्राप्ति के लिए संपर्क जानकारी संग्रहीत करने के लिए सुविधाजनक स्थान कौन सा है? </p>", "option1": "\r\n<p>एड्रेस बॉक्स</p>", "option2": "\r\n<p>मैसेज बॉक्स</p>", "option3": "\r\n<p>एड्रेस बुक</p>", "option4": "\r\n<p>मैसेज बुक</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<ul>\r\n\t<li><strong>एड्रेस बुक</strong>  या एक नाम और एड्रेस बुक (NAB) एक बुक या एक <strong>डेटाबेस </strong>है जो संपर्क नामक वर्गों को दूर रखने के लिए <strong>उपयोग</strong> की जाती है। अधिकांश भाग के लिए प्रत्येक संपर्क अनुभाग में कुछ मानक क्षेत्र शामिल हैं (उदाहरण के लिए: पहला नाम, अंतिम नाम, संगठन का नाम, पता, फ़ोन नंबर, ईमेल पता, फैक्स नंबर, सेल फ़ोन नंबर)।</li>\r\n\t<li><strong>एड्रेस बॉक्स</strong>:  एड्रेस बॉक्स इंटरनेट एक्सप्लोरर की ब्राउज़र विंडो में एक पेन है जो वर्तमान दस्तावेज़ का यूआरएल रखता है। आप इस <strong>बॉक्स </strong>में एक यूआरएल टाइप कर सकते हैं और वेब पेज तक पहुँचने के लिए एंटर दबाएँ। लोकेशन फ़ील्ड भी देखें।</li>\r\n\t<li><strong>मैसेज बॉक्स:</strong> मैसेज  बॉक्स एक विशेष प्रकार का विज़ुअल बेसिक विंडो है जिसमें आप उपयोगकर्ता को एक संदेश दिखा सकते हैं। आप मैसेज बॉक्स में एक संदेश, एक वैकल्पिक आइकन, शीर्षक बार कैप्शन और कमांड बटन प्रदर्शित कर सकते हैं।</li>\r\n\t<li><strong>मैसेज बुक:</strong> मैसेज बुक वह बुक है जिसमें संदेश होते हैं। यह संदेशों को संशोधित या परिवर्तित करने का अवसर प्रदान नहीं करता है।</li>\r\n\t<li><strong>इसलिए, ई-मेल में शीघ्र पुनर्प्राप्ति के लिए संपर्क जानकारी संग्रहीत करने के लिए सुविधाजनक स्थान एड्रेस बुक है।</strong></li>\r\n</ul>", "question_heading": ""}, {"sr_no": 133, "question": "\r\n<p>एक ऐसी सेवा जो एक नेटवर्क पर उपलब्ध मल्टीमीडिया संसाधनों का उपयोग करने के लिए उपयोगकर्ता इंटरफ़ेस प्रदान करती है ______ कहलाती है।</p>", "option1": "\r\n<p>यूज़नेट</p>", "option2": "\r\n<p>आरयूएल</p>", "option3": "\r\n<p>वेब</p>", "option4": "\r\n<p>इंटरनेट रिले चैट (आईआरसी)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही जवाब है <u><strong>वेब</strong></u></p>\r\n\r\n<ul>\r\n\t<li><strong>वेब वर्ल्ड वाइड वेब के</strong> लिए एक सामान्य नाम है, <strong>इंटरनेट का</strong> एक <strong>सबसेट</strong> जिसमें वे <strong>पृष्ठ</strong> होते हैं जिन्हें <strong>वेब ब्राउज़र</strong> द्वारा एक्सेस किया जा सकता <strong>है</strong> । बहुत से लोग यह मानते हैं कि वेब इंटरनेट के समान है, और इन शब्दों का परस्पर उपयोग करें। हालाँकि, इंटरनेट शब्द वास्तव <strong>में सर्वरों</strong> के <strong>वैश्विक नेटवर्क</strong> को संदर्भित करता है जो वेब पर होने वाली सूचना को साझा करना संभव बनाता है। इसलिए, हालांकि वेब <strong>इंटरनेट का</strong> एक <strong>बड़ा हिस्सा</strong> बनाता है, वे एक और एक ही नहीं हैं।</li>\r\n\t<li>वेब पेज <strong>हाइपरटेक्स्ट मार्कअप लैंग्वेज (एचटीएमएल)</strong> नामक भाषा में स्वरूपित होते हैं। यह भाषा है जो उपयोगकर्ताओं को <strong>लिंक के</strong> माध्यम से वेब पर पृष्ठों के माध्यम से क्लिक करने की अनुमति देती है। वेब डेटा को प्रसारित करने और जानकारी साझा करने के लिए <strong>HTTP प्रोटोकॉल</strong> का उपयोग करता है। इंटरनेट एक्सप्लोरर, Google क्रोम, या मोज़िला फ़ायरफ़ॉक्स जैसे <strong>ब्राउज़रों</strong> का उपयोग वेब दस्तावेजों, या वेब पृष्ठों तक पहुंचने के लिए किया जाता है, जो लिंक के माध्यम से जुड़े होते हैं।</li>\r\n\t<li>वेब <strong>इंटरनेट</strong> पर साझा किए जाने वाले तरीकों में से एक <strong>है</strong> ; अन्य में ईमेल, त्वरित संदेश और <strong>फ़ाइल स्थानांतरण प्रोटोकॉल (FTP) शामिल हैं</strong> ।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 134, "question": "\r\n<p>आप अपनी स्प्रैडशीट में रोको फ़्रीज़ क्यों करना चाहेंगे?</p>", "option1": "\r\n<p>केवल फ्रोजेन रो को संशोधित करने के लिए</p>", "option2": "\r\n<p>फ्रोजेन रो में दर्ज किए जा सकने वाले डेटा को सीमित करने के लिए</p>", "option3": "\r\n<p>सहयोग द्वारा रो को एडिट होने से रोकने के लिए</p>", "option4": "\r\n<p>स्प्रैडशीट में स्क्रॉल करने के लिए फ्रोजेन रो को देखना जारी रखने के लिए</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>स्प्रैडशीट में स्क्रॉल करना है जबकि</strong></u><strong><u>फ्रोजेन रो</u></strong><u><strong> को देखना जारी रखता है</strong></u>।</p>\r\n\r\n<p>आप एक्सेल में एक रो को फ़्रीज़ कर सकते हैं, इसलिए <strong>जब आप स्प्रेडशीट में स्क्रॉल करते हैं तो डेटा की तुलना करना आसान हो जाता है</strong>। आप अपनी एक्सेल शीट में केवल पहली दृश्यमान रो को फ़्रीज़ करना या एकाधिक रो को फ़्रीज़ करना चुन सकते हैं।</p>\r\n\r\n<p><strong>रो और कॉलम को फ्रीज करना:</strong></p>\r\n\r\n<p>पैन को फ्रीज करने से उपयोगकर्ता को केवल उन रो और कॉलम को देखने में मदद मिलती है जो वर्कशीट को नीचे स्क्रॉल करते समय फ्रीज हैं। रो के नीचे और कॉलम के दायीं ओर के सेल का चयन करना होता है जिसे दृश्यमान रखना होता है।</p>\r\n\r\n<p><strong>फ़्रीज़ पैन</strong> स्प्रेडशीट अनुप्रयोगों में एक विशेषता है, जैसे कि माइक्रोसॉफ्ट एक्सेल, लिब्रे ऑफिस कैल्क(LibreOffice Calc) और गूगल शीट्स। यह एक रो या कॉलम को &quot;फ्रीज&quot; करता है, ताकि यह हमेशा डिस्प्ले हो, भले ही आप स्प्रेडशीट में नेविगेट करते हों।</p>", "question_heading": ""}, {"sr_no": 135, "question": "\r\n<p>जब ई-मेल भेज दिया जाता है, तब यह __________फोल्डर से _______फोल्डर तक जाता है।</p>", "option1": "\r\n<p>आउटबॉक्स, सेंट</p>", "option2": "\r\n<p>इनबॉक्स, आउटबॉक्स</p>", "option3": "\r\n<p>इनबॉक्स, सेंट</p>", "option4": "\r\n<p>आउटबॉक्स, इनबॉक्स</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p>जब आप एक ई-मेल लिखकर किसी को भेजते हैं, तो यह मेल सर्वर से जुड़ने से पहले <strong>&quot;आउटबॉक्स&quot;</strong> फ़ोल्डर में जाता है और फिर प्राप्तकर्ता को सफलतापूर्वक भेजा जाता है। संदेश प्राप्तकर्ता को सफलतापूर्वक वितरित किए जाने के बाद उन्हें <strong>&quot;सेंट&quot;</strong> या &quot;सेंट मैसेज फ़ोल्डर&quot; में ले जाया जाता है।</p>\r\n\r\n<p>यदि संदेश भेजे जाने में विफल हो जाते हैं, तो वे आउटबॉक्स फोल्डर में फँसकर वहीं संग्रहित हो जाते हैं, क्योंकि मेल सर्वर के अंदर और बाहर संचार अवरुद्ध होते हैं। आउटबॉक्स में संगृहीत ई-मेल, ईमेल प्रोग्राम में एक सामान्य समस्या है, ज्यादातर ईमेल इसलिए फंस जाते हैं, क्योंकि यह SMTP सर्वर से जुड़ने में विफल रहता है।</p>\r\n\r\n<p><strong>अतः सही उत्तर</strong><u><strong>आउटबॉक्स, सेंट</strong></u><strong>है। </strong></p>", "question_heading": ""}, {"sr_no": 136, "question": "\r\n<p>एमएस पॉवरप्वाइंट में, _______आपकी जानकारी और विचारों का एक दृश्य प्रतिनिधित्व है जो एक लेआउट बनाने के लिए उपयोग करता है जो आपके संदेश को फिट करता है।</p>", "option1": "\r\n<p>चार्ट</p>", "option2": "\r\n<p>बैक ग्राउंड पिक्चर</p>", "option3": "\r\n<p>शेप</p>", "option4": "\r\n<p>स्मार्ट आर्ट ग्राफिक</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>स्मार्ट आर्ट ग्राफिक</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>स्मार्ट आर्ट ग्राफिक्स आपकी जानकारी और विचारों का एक दृश्य प्रतिनिधित्व है। जिसका उपयोग एक लेआउट बनाने के लिए किया जाता है जो आपके संदेश को एमएस पॉवरप्वाइंट में फिट करता है।</li>\r\n\t<li>कुछ लेआउट (जैसे संगठन चार्ट और वेन आरेख) विशिष्ट प्रकार की जानकारी को चित्रित करते हैं, जबकि अन्य केवल बुलेटेड सूची की उपस्थिति को बढ़ाते हैं।</li>\r\n</ul>\r\n\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>चार्ट</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>यह डेटा विज़ुअलाइज़ेशन के लिए एक ग्राफिकल प्रतिनिधित्व है, जिसमें &quot;डेटा को प्रतीकों द्वारा दर्शाया जाता है, जैसे कि बार चार्ट में बार, लाइन चार्ट में लाइनें या पाई चार्ट में स्लाइस&quot;।</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>शेप</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>एक आकृति या आकृति किसी वस्तु या उसकी बाहरी सीमा, रूपरेखा या बाहरी का रूप है &middot; कुछ साधारण आकृतियों को व्यापक श्रेणियों में रखा जा सकता है।</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>बैक ग्राउंड पिक्चर</strong></td>\r\n\t\t\t<td>\r\n\t\t\t<ul>\r\n\t\t\t\t<li>इसे डेस्कटॉप वॉलपेपर, डेस्कटॉप बैकग्राउंड, डेस्कटॉप पिक्चर या कंप्यूटर पर डेस्कटॉप इमेज के रूप में भी जाना जाता है) एक डिजिटल इमेज (फोटो, ड्राइंग, आदि) है।</li>\r\n\t\t\t</ul>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 137, "question": "\r\n\r\n<p>निम्नलिखित में से कौन-सा एक इऩपुट डिवाइस है?</p>", "option1": "\r\n\r\n<p>स्पीकर</p>", "option2": "\r\n\r\n<p>प्रोजेक्टर</p>", "option3": "\r\n\r\n<p>लाइट पेन</p>", "option4": "\r\n\r\n<p>प्लॉटर</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <u><strong>लाइट पेन</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>कंप्यूटिंग में एक <strong>इनपुट डिवाइस</strong> कंप्यूटर हार्डवेयर उपकरण का एक टुकड़ा है जिसका उपयोग डेटा प्रोसेसिंग सिस्टम की आपूर्ति के लिए किया जाता है जिसमें कंप्यूटर या सूचना उपकरण नियंत्रण और डेटा सिग्नल शामिल हैं।\r\n\r\n\t<ul>\r\n\t\t<li><strong>कीबोर्ड, स्कैनर, माउज़, जॉयस्टिक, लाइट पेन, स्कैनर और डिजिटल कैमरा इनपुट डिवाइस के उदाहरण हैं।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>एक लाइट पेन एक कंप्यूटर इनपुट डिवाइस है जो कंप्यूटर के कैथोड-रे ट्यूब (CRT) डिस्प्ले के साथ संयोजन में उपयोग की जाने वाली प्रकाश-संवेदनशील छड़ी के रूप में है।</strong>\r\n\t<ul>\r\n\t\t<li>यह उपयोगकर्ता को प्रदर्शित वस्तुओं को इंगित करने या स्क्रीन पर टचस्क्रीन के समान लेकिन अधिक सटीकता के साथ चित्रण की अनुमति देता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>आउटपुट डिवाइस</strong>\r\n\t<ul>\r\n\t\t<li>आउटपुट डिवाइस वह डिवाइस है जिसका उपयोग कंप्यूटर द्वारा किए गए डेटा प्रोसेसिंग के आउटपुट या परिणाम को प्रदर्शित करने या संचार करने के लिए किया जाता है।</li>\r\n\t\t<li><strong>आउटपुट डिवाइस के उदाहरण प्लॉटर, इंजेक्टर प्रिंटर, स्पीकर, लेजर प्रिंटर, और मल्टीमीडिया प्रोजेक्टर हैं।</strong></li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>स्पीकर</strong>-\r\n\t<ul>\r\n\t\t<li>स्पीकर एक इलेक्ट्रॉनिक ट्रांसड्यूसर है जो विद्युत चुम्बकीय तरंगों को ध्वनि तरंगों में परिवर्तित करता है</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>प्रोजेक्टर-\r\n\t<ul>\r\n\t\t<li>प्रोजेक्टर एक ऑप्टिकल डिवाइस है जो एक सतह पर इलेक्ट्रॉनिक छवि को प्रोजेक्ट करता है जिसे प्रोजेक्शन स्क्रीन के रूप में भी जाना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<ul>\r\n\t<li><strong>प्लॉटर</strong>-\r\n\r\n\t<ul>\r\n\t\t<li>प्लॉटर एक प्रिंटिंग डिवाइस है जिसका उपयोग वेक्टर ग्राफिक छवियों को प्रिंट करने के लिए किया जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 138, "question": "\r\n\r\n<p>सेंट्रल प्रोसेसिंग यूनिट (CPU) के संदर्भ में निम्नलिखित में से कौन सा कथन सत्य नहीं है?</p>", "option1": "\r\n\r\n<p>CPU डेटा और निर्देशों प्रसंस्करण करता है</p>", "option2": "\r\n\r\n<p>CPU, ALU  का एक भाग है</p>", "option3": "\r\n\r\n<p>CPU में रजिस्टरों का एक सेट भी होता है</p>", "option4": "\r\n\r\n<p>यह अरिथमेटिक (अंकगणितीय) ऑपरेशन करता है</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <strong>विकल्प (2)</strong> है।</p>\r\n\r\n<ul>\r\n\t<li>एक<strong> सेंट्रल प्रोसेसिंग यूनिट</strong> (CPU), जिसे<strong> सेंट्रल प्रोसेसर, मेन प्रोसेसर </strong>या<strong> प्रोसेसर</strong> भी कहा जाता है, यह कंप्यूटर में ही एक <strong>इलेक्ट्रॉनिक सर्किट्री</strong> है जो कंप्यूटर प्रोग्राम बनाने वाले इंस्ट्रक्शन को एक्सीक्यूट करता है।</li>\r\n\t<li>CPU प्रोग्राम में दिए गए स्पेसिफ़िएड इंस्ट्रक्शंस <strong>बेसिक अर्थमेटिक (अंकगणित), लॉजिक (तर्क), कंट्रोल और इनपुट/आउटपुट (I/O) ऑपरेशन्स</strong> को परफॉर्म करता है।</li>\r\n\t<li>कंप्यूटर उद्योग ने <strong>1955</strong> की शुरुआत में<strong> &quot;सेंट्रल प्रोसेसिंग यूनिट&quot; </strong>शब्द का इस्तेमाल किया था।</li>\r\n\t<li>एक CPU के प्रमुख कम्पोनेंट में <strong>अंकगणितीय तर्क इकाई (ALU)</strong> शामिल है जो <strong>अंकगणित और तर्क संचालन, प्रोसेसर को रजिस्ट</strong>र, ALU को <strong>ऑपरेंड सप्लाई</strong>, ALU ऑपरेशन्स के परिणामों को स्टोर करता है, और यह एक नियंत्रण इकाई जो ALU ऑपरेशन्स को एक्सेक्यूट करके लाने <strong>(मेमोरी से)</strong> और इंस्ट्रक्शन के एक्सेक्यूसन को ऑर्केस्ट्रेट, रजिस्टर करती है और अन्य घटक ALU के कोआर्डिनेट ऑपरेशन को डायरेक्ट करके इंस्ट्रक्शन को एक्सेक्यूट करती है। </li>\r\n\t<li>अधिकांश <strong>CPU</strong> में फंडामेंटल ऑपरेशन, स्टोर किये गए इंस्ट्रक्शन भले ही वे किसी भी भौतिक रूप में हो, संग्रहीत निर्देशों के अनुक्रम को निष्पादित करना है जिसे प्रोग्राम कहा जाता है। एक्सेक्यूट किए जाने वाले इंस्ट्रक्शंस को एक प्रकार की कंप्यूटर मेमोरी में रखा जाता है। लगभग सभी CPU<strong>ऑपरेशन में फेच, डीकोड करने और एक्सेक्यूट करने के स्टेप्स का पालन करते हैं, </strong>जिन्हें सामूहिक रूप से इंस्ट्रक्शन साइकिल के रूप में जाना जाता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 139, "question": "\r\n<p>एक ई-मेल के साथ संलग्न फाइल जो एक रिसीवर को भेजी जाती है, कहलाती है:</p>", "option1": "\r\n<p>अनुलग्नक</p>", "option2": "\r\n<p>अनुरक्ति(अटैचमेंट)</p>", "option3": "\r\n<p>पीडीएफ</p>", "option4": "\r\n<p>इनमे से कोई भी नहीं</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>अनुरक्ति</strong></p>\r\n\r\n<ul>\r\n\t<li><strong>ईमेल अटैचमेंट</strong> एक कंप्यूटर फ़ाइल है जिसे ईमेल संदेश के साथ भेजा जाता है।</li>\r\n\t<li>किसी भी ईमेल संदेश से एक या अधिक फ़ाइलें संलग्न की जा सकती हैं, और इसके साथ प्राप्तकर्ता को भेजी जा सकती हैं।</li>\r\n\t<li>यह आमतौर पर दस्तावेज़ों और छवियों को साझा करने के लिए एक सरल विधि के रूप में उपयोग किया जाता है।</li>\r\n</ul>\r\n\r\n<p><strong>अटैचमेंट</strong></p>\r\n\r\n<ul>\r\n\t<li>अटैचमेंट किसी चीज़ के अतिरिक्त, अक्सर किसी दस्तावेज़ में जोड़ा जाता है।</li>\r\n\t<li>जब आम तौर पर कुछ जोड़ा जाने का मतलब होता है, तो अनुलग्नक अनुलग्नक के साथ विनिमेय होता है।</li>\r\n\t<li>अनुलग्नक आमतौर पर यूके और भारत में अधिक उपयोग किया जाता है, जहां यह अक्सर विशेष रूप से एक आधिकारिक दस्तावेज़ के अतिरिक्त को संदर्भित करता है।</li>\r\n</ul>\r\n\r\n<p><strong>पीडीएफ</strong></p>\r\n\r\n<ul>\r\n\t<li>पीडीएफ का फुल फॉर्म <u>पोर्टेबल डॉक्यूमेंट फॉर्मेट </u>है।</li>\r\n\t<li>वे आम तौर पर केवल-पढ़ने के लिए दस्तावेज़ वितरित करने के लिए उपयोग किए जाते हैं जो किसी पृष्ठ के लेआउट को संरक्षित करते हैं।</li>\r\n\t<li>इसे 1990 के दशक की शुरुआत में अडोब सिस्टम द्वारा विकसित किया गया था।</li>\r\n\t<li>पीडीएफ ईमेल और अन्य स्रोतों के माध्यम से डेटा ट्रांसमिशन और साझा करने के लिए एक आसान और सुरक्षित दृष्टिकोण प्रदान करता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 140, "question": "\r\n<p>अपने कंप्यूटर को वायरस से कैसे बचाएं?</p>", "option1": "\r\n<p>रीबूटिंग द्वारा</p>", "option2": "\r\n<p>रीस्टार्ट करके</p>", "option3": "\r\n<p>स्कैन करके</p>", "option4": "\r\n<p>एंटी-वायरस द्वारा</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>एंटी-वायरस</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>एंटी-वायरस</strong> कंप्यूटर को वायरस से बचाने में मदद करता है।\r\n\r\n\t<ul>\r\n\t\t<li>यह एक <strong>सॉफ्टवेयर प्रोग्राम है जो कंप्यूटर सिस्टम को हानि पहुंचाने वाले किसी भी खतरे की पहचान करता है और उसे समाप्त करता है</strong>।</li>\r\n\t\t<li>यह प्रोग्रामों का एक समूह है जो सॉफ़्टवेयर वायरस को रोकने, खोजने, पता लगाने और हटाने के लिए डिज़ाइन किया गया है।</li>\r\n\t\t<li>एंटीवायरस सॉफ़्टवेयर ज्ञात प्रकार के मैलवेयर के डेटाबेस के विरुद्ध कंप्यूटर प्रोग्राम और फ़ाइलों की जाँच करके परिचालन शुरू कर देता है।</li>\r\n\t\t<li>अधिकांश एंटीवायरस प्रोग्राम स्वचालित और मैन्युअल फ़िल्टरिंग क्षमताओं दोनों को शामिल करते हैं।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>रीबूटिंग</strong>\r\n\t<ul>\r\n\t\t<li>यह प्रारंभिक बूट-लोडिंग अनुक्रम से कंप्यूटर या इसके ऑपरेटिंग सिस्टम को बंद करने और शुरू करने की प्रक्रिया है।</li>\r\n\t\t<li>सरल शब्दों में, इसका अर्थ <strong>पावर बटन के माध्यम से कंप्यूटर</strong> को रिस्टोर करना है।</li>\r\n\t\t<li>कंप्यूटर सभी डिवाइस ड्राइवरों को अनलोड करता है, सभी प्रोग्राम बंद करता है और ऑपरेटिंग सिस्टम को रिस्टोर करता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 141, "question": "\r\n<p>निम्न में से POP3 प्रोटोकॉल का डिफ़ॉल्ट पोर्ट कौन-सा है?</p>", "option1": "\r\n<p>160</p>", "option2": "\r\n<p>110</p>", "option3": "\r\n<p>95</p>", "option4": "\r\n<p>995</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>110 </strong>है।</p>\r\n\r\n<ul>\r\n\t<li><strong>POP3 </strong>का पूरा नाम <strong>पोस्ट ऑफिस प्रोटोकॉल वर्जन 3</strong> है।</li>\r\n\t<li>इसका आशय सिंपल मेल प्रोटोकॉल से है। POP3 का मुख्य काम किसी <strong>रिमोट सर्वर</strong> से<strong> मेल रिट्रीव करना या उसे कॉपी करना है</strong> और फिर उस ईमेल को विशिष्ट स्थानीय क्लाइंट को भेजना है।</li>\r\n\t<li><strong>POP3 </strong>को कई उपकरणों में यूजर के मेलबॉक्स में मेल को <strong>हेंडल और सिंक्रनाइज़ </strong>करने के लिए<strong> प्रोग्राम नहीं किया गया</strong> है।</li>\r\n\t<li>POP3 के लिए दो पोर्ट का उपयोग किया जाता है। ये नीचे दिए गए हैं:\r\n\t<ul>\r\n\t\t<li><strong>पोर्ट 110- POP3 </strong>मेल प्राप्त करने के लिए डिफ़ॉल्ट रूप से <strong>पोर्ट 110</strong> का उपयोग करता है।</li>\r\n\t\t<li><strong>पोर्ट 995- POP3 पोर्ट 995</strong>  का उपयोग SSL/TLS में किया जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>\r\n\r\n<p><strong>इसलिए सही उत्तर</strong><em>110 </em><strong>है। </strong></p>", "question_heading": ""}, {"sr_no": 142, "question": "\r\n\r\n<p>निम्नलिखित में से कौन सा हाल ही में भारत में वाणिज्यिक बैंकों में ई-बैंकिंग पहल है?</p>", "option1": "\r\n\r\n<p>NECS</p>", "option2": "\r\n\r\n<p>NEFT</p>", "option3": "\r\n\r\n<p>NET बैंकिंग</p>", "option4": "\r\n\r\n<p>RTGS</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>प्रमुख वाणिज्यिक बैंकों के व्यवसाय में काफी नवाचार और विविधीकरण हुआ है। उनमें से कुछ ने उपभोक्ता क्रेडिट, क्रेडिट कार्ड, मर्चेंट बैंकिंग, लीजिंग, म्यूचुअल फंड आदि के क्षेत्रों में लगे हुए हैं। कुछ बैंकों ने पहले से ही मर्चेंट बैंकिंग, लीजिंग और म्यूचुअल फंड के लिए सहायक कंपनियों की स्थापना की है और कई अन्य ऐसा करने की प्रक्रिया में हैं।</p>\r\n\r\n<p>बैंक में हाल ही के प्रचलन:</p>\r\n\r\n<p><strong>रियल टाइम ग्रॉस सेटलमेंट</strong><strong>(RTGS): </strong></p>\r\n\r\n<ol>\r\n\t<li>भारत में <strong>मार्च 2004</strong> में शुरू की गई रियल-टाइम ग्रॉस सेटलमेंट प्रणाली, एक ऐसी प्रणाली है जिसके माध्यम से <strong>इलेक्ट्रॉनिक्स निर्देश </strong>बैंकों द्वारा अपने खाते से दूसरे बैंक के खाते में <strong>धनराशि स्थानांतरित</strong> करने के लिए दिए जा सकते हैं।</li>\r\n\t<li>RTGS प्रणाली को <strong>RBI द्वारा</strong> बनाए रखा और <strong>संचालित किया जाता है</strong> और बैंकों के बीच निपुण <strong>और तीव्रतर</strong><strong>फंड ट्रांसफर</strong> का साधन प्रदान करता है जिससे उनके वित्तीय संचालन में आसानी होती है।</li>\r\n\t<li>जैसा कि नाम से पता चलता है, बैंकों के बीच फंड ट्रांसफर &#39;<strong>रियल-टाइम&rsquo; </strong>के आधार पर होता है।</li>\r\n\t<li>इसलिए, धन लाभार्थी तक तुरंत पहुंच सकता है और लाभार्थी के बैंक के पास<strong> दो घंटे के भीतर </strong>लाभार्थी के खाते को क्रेडिट करने की जिम्मेदारी है।</li>\r\n</ol>\r\n\r\n<p><strong>1. NEFT: </strong></p>\r\n\r\n<ul>\r\n\t<li>नेशनल इलेक्ट्रॉनिक फंड ट्रांसफर (NEFT) एक देशव्यापी भुगतान प्रणाली है जो एक बैंक के खाते से दूसरे खाते में <strong>धन के अंतरण</strong> की अनुमति देता है।</li>\r\n\t<li>ऑनलाइन बैंकिंग पर बढ़ते फोकस के साथ, एनईएफटी फंड ट्रांसफर करने के सबसे लोकप्रिय तरीकों में से एक बन गया है।</li>\r\n\t<li><strong>NEFT के अंतर्गत फंड ट्रांसफर को बैच में तय किया जाता है क्योंकि RTGS में रियल-टाइम सेटलमेंट प्रक्रिया का विरोध किया जाता है। बैच प्रति घंटा समय स्लॉट में बसे हैं।</strong></li>\r\n</ul>\r\n\r\n<p><strong>2. NECS: </strong>ग्राहक राष्ट्रीय इलेक्ट्रॉनिक क्लियरिंग सेवा प्रणाली भारतीय रिज़र्व बैंक (RBI) द्वारा भारत के भीतर इलेक्ट्रॉनिक फंड ट्रांसफर के लिए शुरू की गई है। प्रणाली का उद्देश्य दोहराव और थोक भुगतान निर्देशों के लिए केंद्रीकृत प्रसंस्करण को सुविधाजनक बनाना है।</p>\r\n\r\n<p><strong>3. NET बैंकिंग: </strong></p>\r\n\r\n<ul>\r\n\t<li>इंटरनेट बैंकिंग, जिसे <strong>ऑनलाइन बैंकिंग या ई-बैंकिंग </strong>के रूप में भी जाना जाता है, या नेट बैंकिंग बैंकों और वित्तीय संस्थानों द्वारा दी जाने वाली एक सुविधा है जो ग्राहकों को इंटरनेट पर बैंकिंग सेवाओं का उपयोग करने की अनुमति देती है।</li>\r\n\t<li>ग्राहकों को प्रत्येक छोटी सेवा का लाभ उठाने के लिए अपने <strong>बैंक के शाखा कार्यालय का दौरा करने की आवश्यकता नहीं</strong> है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 143, "question": "\r\n<p>निम्नलिखित में से कौन-सा कंप्यूटर हार्डवेयर के रूप में वर्गीकृत नहीं है?</p>", "option1": "\r\n<p>माउस</p>", "option2": "\r\n<p>मॉनीटर</p>", "option3": "\r\n<p>हार्ड डिस्क</p>", "option4": "\r\n<p>DBMS</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्&zwj;तर <u><strong>DBMS</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>कंप्यूटर हार्डवेयर का अर्थ<strong> सिस्टम</strong> की <strong>भौतिक इकाइयाँ</strong> है।\r\n\r\n\t<ul>\r\n\t\t<li><strong>उदाहरण के लिए</strong> -\r\n\r\n\t\t<ul>\r\n\t\t\t<li>सेंट्रल प्रोसेसिंग यूनिट (CPU),</li>\r\n\t\t\t<li>मॉनीटर,</li>\r\n\t\t\t<li>कीबोर्ड,</li>\r\n\t\t\t<li>माउस,</li>\r\n\t\t\t<li>हार्ड डिस्क, आदि।</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t\t<li>सॉफ्टवेयर द्वारा दिए गए निर्देशों के सेट को हार्डवेयर द्वारा स्टोर और रन किया जा सकता है। </li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>सॉफ्टवेयर</strong> निर्देशों, डेटा या प्रोग्राम का एक समूह है जिसका उपयोग कंप्यूटर को संचालित करने और विशिष्ट कार्यों को निष्पादित करने के लिए किया जाता है।\r\n\t<ul>\r\n\t\t<li>यह हार्डवेयर के विपरीत है, जो कंप्यूटर के भौतिक पहलुओं का वर्णन करता है।</li>\r\n\t\t<li><strong>उदाहरण के लिए</strong> -\r\n\t\t<ul>\r\n\t\t\t<li>वर्ड प्रोसेसर,</li>\r\n\t\t\t<li>स्प्रेडशीट,</li>\r\n\t\t\t<li>डेटाबेस सिस्टम,</li>\r\n\t\t\t<li>प्रस्तुतिकरण सॉफ़्टवेयर,</li>\r\n\t\t\t<li>ई-मेल उपकरण।</li>\r\n\t\t\t<li>DBMS- डेटा बेस मैनेजमेंट सिस्टम।</li>\r\n\t\t</ul>\r\n\t\t</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>इसलिए<strong> DBMS</strong> सही उत्तर है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 144, "question": "\r\n<p>निम्नलिखित में से कौनसा कंप्यूटर हार्डवेयर नहीं है?</p>", "option1": "\r\n<p>माउस</p>", "option2": "\r\n<p>मॉनिटर</p>", "option3": "\r\n<p>कीबोर्ड</p>", "option4": "\r\n<p>एंटीवायरस</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>एंटीवायरस</strong></u> है ।</p>\r\n\r\n<ul>\r\n\t<li><strong>एंटीवायरस सॉफ़्टवेयर</strong> (संक्षिप्त रूप में AV सॉफ़्टवेयर), जिसे एंटी-मैलवेयर के रूप में भी जाना जाता है, एक कंप्यूटर प्रोग्राम है, जिसका उपयोग मैलवेयर को रोकने, पता लगाने और हटाने के लिए किया जाता है।</li>\r\n\t<li>एंटीवायरस सॉफ़्टवेयर मूल रूप से कंप्यूटर वायरस का पता लगाने और हटाने के लिए विकसित किया गया था, इसलिए इसका नाम एंटीवायरस रखा गया।</li>\r\n\t<li>हालांकि, अन्य प्रकार के मैलवेयर के प्रसार के साथ, एंटीवायरस सॉफ़्टवेयर ने अन्य कंप्यूटर खतरों से सुरक्षा प्रदान करना शुरू कर दिया।</li>\r\n\t<li>इसलिए <u><strong>एंटीवायरस मूल रूप से एक प्रकार का सॉफ्टवेयर है इसलिए सही उत्तर एंटीवायरस है</strong></u> ।</li>\r\n\t<li><strong>कंप्यूटर हार्डवेयर</strong> में <strong>कंप्यूटर</strong> के भौतिक भाग, जैसे कि केस, <strong>सेंट्रल प्रोसेसिंग यूनिट (सीपीयू), मॉनिटर, माउस, कीबोर्ड, कंप्यूटर डेटा स्टोरेज, ग्राफिक्स कार्ड, साउंड कार्ड, स्पीकर और मदरबोर्ड शामिल हैं</strong> ।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 145, "question": "\r\n<p>निम्नलिखित में से कौन सा ब्राउज़र नहीं है?</p>", "option1": "\r\n<p>मोज़िला फ़ायरफ़ॉक्स</p>", "option2": "\r\n<p>एप्पल सफारी</p>", "option3": "\r\n<p>ओपेरा</p>", "option4": "\r\n<p>माइक्रोसॉफ्ट बिंग</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <strong>विकल्प 4</strong> है अर्थात् <u><strong>माइक्रोसॉफ्ट बिंग।</strong></u></p>\r\n\r\n<ul>\r\n\t<li>वेब ब्राउज़र, या &quot;<strong>ब्राउज़र</strong>&quot;, वेबसाइटों को एक्सेस करने और देखने के लिए उपयोग किया जाने वाला एक एप्लिकेशन है।</li>\r\n\t<li>सामान्य वेब <strong>ब्राउज़रों </strong>में माइक्रोसॉफ्ट इंटरनेट एक्सप्लोरर, गूगल क्रोम, मोज़िला फ़ायरफ़ॉक्स और एप्पल सफारी शामिल हैं।</li>\r\n\t<li>वेब ब्राउज़र एक वेब सर्वर से आवश्यक सामग्री को पुनः प्राप्त करता है और फिर यूजर्स के डिवाइस पर पेज प्रदर्शित करता है।</li>\r\n\t<li>पहला वेब ब्राउज़र, वर्ल्डवाइडवेब, 1990 में टिम बर्नर्स-ली द्वारा नेक्सटी कंप्यूटर के लिए विकसित किया गया था और मार्च 1991 में सर्न में अपने सहयोगियों के लिए पेश किया गया था।</li>\r\n\t<li>विंटन जी। &quot;विंट&quot; सेर्फ़ (जन्म 1943) एक अमेरिकी कंप्यूटर वैज्ञानिक हैं। बॉब कान के साथ इस शीर्षक को साझा करते हुए उन्हें &quot;<strong>इंटरनेट के पिता</strong>&quot; के रूप में पहचाना जाता है।</li>\r\n\t<li>बिंग माइक्रोसॉफ्ट द्वारा स्वामित्व और संचालित एक वेब सर्च इंजन है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 146, "question": "\r\n<p>कंप्यूटर और इंटरनेट के क्षेत्र में W3C का क्या अर्थ है?</p>", "option1": "\r\n<p>वर्ल्ड वाइड वेब कंटेंट</p>", "option2": "\r\n<p>वर्ल्ड वाइड वेब सेंटर</p>", "option3": "\r\n<p>वर्ल्ड वाइड वेब कॉन्सॉर्टियम</p>", "option4": "\r\n<p>वर्ल्ड वाइड वेब कमीशन</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर <u><strong>वर्ल्ड वाइड वेब कॉन्सॉर्टियम </strong></u>है।</p>\r\n\r\n<ul>\r\n\t<li>कंप्यूटर और इंटरनेट के क्षेत्र में, W3C का अर्थ <strong>वर्ल्ड वाइड वेब कॉन्सॉर्टियम है</strong>।</li>\r\n\t<li><strong>वर्ल्ड वाइड वेब कॉन्सॉर्टियम (W3C)</strong> एक अंतरराष्ट्रीय समुदाय है जहां सदस्य संगठन, पूर्णकालिक कर्मचारी और जनता <strong>वेब मानकों को विकसित करने </strong>के लिए मिलकर काम करती है।</li>\r\n\t<li>1994 में स्थापित और वर्तमान में वेब आविष्कारक और <strong>निदेशक टिम बर्नर्स-ली और सीईओ जेफरी जाफ के</strong> नेतृत्व में, W3C का मिशन वेब को उसकी पूरी क्षमता तक ले जाना है।</li>\r\n\t<li>W3C एक उद्योग संघ है <strong>जो विशिष्टताओं और संदर्भ सॉफ़्टवेयर का निर्माण करके वेब के विकास और WWW उत्पादों के बीच अंतरसंचालनीयता के लिए मानकों</strong> को <strong>बढ़ावा देना</strong> चाहता है। हालांकि W3C को औद्योगिक सदस्यों द्वारा वित्त पोषित किया जाता है, यह विक्रेता-तटस्थ है, और इसके उत्पाद सभी के लिए स्वतंत्र रूप से उपलब्ध हैं।</li>\r\n\t<li>संगठन अपने खुले मानकों के सिद्धांतों द्वारा निर्देशित है। यह उन्हें ओपनस्टैंड कहता है, जिसे यह <strong>&quot;मानकों के लिए आधुनिक प्रतिमान&quot; के</strong> रूप में संदर्भित करता है।</li>\r\n\t<li>वर्ल्ड वाइड वेब कॉन्सॉर्टियम (W3C) की स्थापना 1994 में टिम बर्नर्स-ली द्वारा की गई थी, जब उन्होंने <strong>अक्टूबर 1994</strong> में यूरोपियन ऑर्गनाइजेशन फॉर न्यूक्लियर रिसर्च (CERN) को छोड़ दिया <strong>था</strong> ।</li>\r\n\t<li>इसकी स्थापना <strong>मैसाचुसेट्स इंस्टीट्यूट ऑफ टेक्नोलॉजी लेबोरेटरी फॉर कंप्यूटर साइंस (MIT/LCS)</strong> में यूरोपीय आयोग, डिफेंस एडवांस्ड रिसर्च प्रोजेक्ट्स एजेंसी (DARPA) के समर्थन से की गई थी, जिसने ARPANET का बीड़ा उठाया था, जो इंटरनेट के पूर्ववर्तियों में से एक था।</li>\r\n\t<li>W3C शिक्षा और bबाहरी पहुँच में भी संलग्न है, सॉफ्टवेयर विकसित करता है, और वेब के बारे में चर्चा के लिए एक खुले मंच के रूप में कार्य करता है।</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 147, "question": "\r\n<p>एमएस वर्ड 2010 में फाइल को सेव करने की शॉर्टकट की (Key) कौन-सी है?</p>", "option1": "\r\n<p>Ctrl + S</p>", "option2": "\r\n<p>Ctrl + D</p>", "option3": "\r\n<p>Alt + D</p>", "option4": "\r\n<p>Alt + S</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>की(Key)</td>\r\n\t\t\t<td>कार्य</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + S</td>\r\n\t\t\t<td>वर्तमान में खुले डॉक्यूमेंट को सेव करता है।</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + O</td>\r\n\t\t\t<td>एक मौजूदा डॉक्यूमेंट खोलें।</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Ctrl + D</td>\r\n\t\t\t<td>फ़ॉन्ट प्राथमिकताएँ विंडो खोलता है।</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Alt + S</td>\r\n\t\t\t<td>रिबन में रेफरेन्स टैब खोलता है। रेफरेन्स टैब में, आपके पास रेफरेन्स टैब में एक विकल्प चुनने के लिए एक अतिरिक्त की (Key)दबाने का विकल्प भी होगा। उदाहरण के लिए, Alt + S दबाने के बाद यदि आप &quot;P&quot; दबाते हैं, तो यह CAPTION विकल्प को खोलेगा। </td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>CTRL + F</td>\r\n\t\t\t<td>वर्तमान डॉक्यूमें या फ़ाइल में टेक्स्ट खोजने के लिए एक फाइन्ड (खोज) विकल्प खोलता है। </td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>", "question_heading": ""}, {"sr_no": 148, "question": "\r\n\r\n<p>निम्नलिखित में से कौन-सी मेमोरी <strong>नहीं</strong> है?</p>", "option1": "\r\n\r\n<p>कैशे</p>", "option2": "\r\n\r\n<p>रैम</p>", "option3": "\r\n\r\n<p>ए. एल. यू</p>", "option4": "\r\n\r\n<p>रोम</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर <u><strong>ए. एल. यू</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li><strong>एक अंकगणितीय तर्क इकाई या अर्थमेटिकल लॉ जिकल यूनिट (ALU) कंप्यूटर प्रणाली के केंद्रीय प्रसंस्करण इकाई का एक प्रमुख घटक है।</strong></li>\r\n\t<li><strong>यह अंकगणित और तर्क संचालन से संबंधित सभी प्रक्रियाएं करता है जिन्हें निर्देश शब्दों पर किए जाने की आवश्यकता होती है। अतः विकल्प 3 सही है।</strong></li>\r\n\t<li><strong>ALU को एक इंटीजर यूनिट (IU) के रूप में भी जाना जाता है।</strong> अंकगणित तर्क इकाई सीपीयू का वह हिस्सा है जो सीपीयू की आवश्यकता के सभी गणनाओं को करती है।</li>\r\n\t<li>कुछ माइक्रोप्रोसेसर आर्किटेक्चर में, ALU को अंकगणितीय इकाई (AU) और तर्क इकाई (LU) में विभाजित किया गया है।</li>\r\n\t<li><u><strong>ALU के कार्य</strong></u>\r\n\t<ul>\r\n\t\t<li>लॉजिकल ऑपरेशन।</li>\r\n\t\t<li>बिट-शिफ्टिंग ऑपरेशन।</li>\r\n\t\t<li>अंकगणितीय आपरेशनस।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong><u>कैशे मेमोरी</u></strong>\r\n\t<ul>\r\n\t\t<li>इसे <strong>कैशे</strong> भी कहा जाता है, एक पूरक <strong>मेमोरी</strong> सिस्टम जो कंप्यूटर के केंद्रीय प्रोसेसर द्वारा त्वरित प्रसंस्करण के लिए अक्सर उपयोग किए जाने वाले निर्देशों और डेटा को संग्रहीत करती है। <strong>कैशे </strong>में वृद्धि होती है और यह कंप्यूटर की मुख्य<strong> मेमोरी</strong> का विस्तार है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><strong>रैण्डम एक्सेस मेमोरी (RAM)</strong></u>\r\n\t<ul>\r\n\t\t<li>इसका उपयोग वास्तविक समय में सीपीयू द्वारा उपयोग किए जा रहे प्रोग्राम और डेटा को स्टोर करने के लिए किया जाता है। रैंडम एक्सेस मेमोरी के डेटा को किसी भी समय पढ़ा, लिखा और मिटाया जा सकता है। RAM एक हार्डवेयर तत्व है जहाँ वर्तमान में उपयोग किया जा रहा डेटा संग्रहीत होता है। यह एक परिवर्तनशील (वोलाटाइल) मेमोरी है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><u><strong>रीड-ओनली मेमोरी (ROM)</strong></u>\r\n\t<ul>\r\n\t\t<li>यह एक प्रकार की मेमोरी है जहाँ डेटा को पहले से रिकॉर्ड किया जाता है। ROM में संग्रहित डेटा कंप्यूटर के बंद होने के बाद भी बरकरार रहता है यानी नॉन-वोलेटाइल, अर्थात गैर-परिवर्तनशील।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 149, "question": "\r\n\r\n<p>एक ऐसा इलेक्ट्रॉनिक डिवाइस जो कंप्यूटर के डिजिटल सिग्नलों को एनालॉग स्वरूप में रूपांतरित करता है, ताकि फोन लाइन के द्वारा उनका संचारण किया जा सके, इसे क्&zwj;या कहते हैं?</p>", "option1": "\r\n\r\n<p>मॉडेम</p>", "option2": "\r\n\r\n<p>हब</p>", "option3": "\r\n\r\n<p>स्विच</p>", "option4": "\r\n\r\n<p>नेटवर्क इंटरफेस कार्ड</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>सही उत्तर एक <u><strong>मॉडेम</strong></u> है।</p>\r\n\r\n<ul>\r\n\t<li>एक ऐसा इलेक्ट्रॉनिक डिवाइस जो कंप्यूटर के डिजिटल सिग्नलों को एनालॉग स्वरूप में रूपांतरित करता है, ताकि फोन लाइन के द्वारा उनका संचारण किया जा सके, उसे मॉडेम कहा जाता है।</li>\r\n\t<li><strong>मॉडेम</strong>:\r\n\t<ul>\r\n\t\t<li>यह एक इलेक्ट्रॉनिक उपकरण है जो कंप्यूटर के डिजिटल सिग्नल को फोन लाइन पर ट्रांसमिशन के लिए एनालॉग प्रारूप में परिवर्तित करता है।</li>\r\n\t\t<li>एक मॉडेम डिजिटल जानकारी को एन्कोड करने के लिए एक या एक से अधिक ट्रांसमीटर वेव सिग्नल को संशोधित करके डेटा प्रसारित करता है, जबकि रिसीवर मूल डिजिटल जानकारी को फिर से बनाने के लिए सिग्नल को डिक्रिप्ट करता है।</li>\r\n\t\t<li>अंतिम उद्देश्य एक संकेत उत्पन्न करना है जिसे आसानी से प्रसारित किया जा सकता है और मज़बूती से डिकोड किया जा सकता है।</li>\r\n\t\t<li>मॉडेम का उपयोग एनालॉग संकेतों को प्रसारित करने के किसी भी माध्यम से किया जा सकता है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li>एक <strong>नेटवर्क इंटरफेस कार्ड</strong> एक उपकरण है जो कंप्यूटर को कंप्यूटर से जोड़ता है।\r\n\t<ul>\r\n\t\t<li>इसे नेटवर्क एडेप्टर, लैन एडेप्टर या भौतिक नेटवर्क इंटरफेस के रूप में भी जाना जाता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}, {"sr_no": 150, "question": "\r\n<p>निम्न में से किस रूप में वेब पेज को सेव (save) किया जाता है?</p>", "option1": "\r\n<p>http://</p>", "option2": "\r\n<p>HTML</p>", "option3": "\r\n<p>DOC</p>", "option4": "\r\n<p>URL</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>सही उत्तर विकल्प <u><strong>2 </strong></u> है, अर्थात् <u><strong>HTML.</strong></u></p>\r\n\r\n<ul>\r\n\t<li><u><strong>वेब पेज हाइपरटेक्स्ट मार्कअप लैंग्वेज (HTML) नामक भाषा का उपयोग करते हैं।</strong></u>\r\n\r\n\t<ul>\r\n\t\t<li>HTML का उपयोग इलेक्ट्रॉनिक दस्तावेज़ बनाने के लिए किया जाता है (जिन्हें पृष्ठ कहा जाता है) जो वर्ल्ड वाइड वेब पर प्रदर्शित होते हैं।</li>\r\n\t\t<li>ब्राउज़र एप्लिकेशन (Microsoft के इंटरनेट एक्सप्लोरर, मोज़िला फ़ायरफ़ॉक्स, आदि) HTML की व्याख्या करने के लिए डिज़ाइन किए गए हैं ताकि पाठ, चित्र और हाइपरलिंक का उपयोग करके, वेब पर नेविगेट किया जा सके।</li>\r\n\t\t<li>पहली बार <strong>1990 में टिम बर्नर्स-ली</strong> द्वारा विकसित किया गया था।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>HTTP</strong> हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल है।\r\n\t<ul>\r\n\t\t<li>HTTP एक ऐसा एप्लिकेशन प्रोटोकॉल है जिसमें आमतौर पर वर्ल्ड वाइड वेब (WWW) पर वितरित डेटा फ़ाइल सिस्टम और मल्टीमीडिया संचार को स्थानांतरित करने के लिए दिशानिर्देशों की एक सूची होती है।</li>\r\n\t</ul>\r\n\t</li>\r\n\t<li><strong>DOC या doc</strong> (&quot;दस्तावेज़ का संक्षिप्त नाम&quot;) शब्द संसाधन दस्तावेजों के लिए एक फ़ाइल नाम एक्सटेंशन है, जो आमतौर पर मालिकाना माइक्रोसॉफ्ट वर्ड बाइनरी फाइल फॉर्मेट में सबसे अधिक है।</li>\r\n\t<li><strong>URL यूनिफ़ॉर्म रिसोर्स लोकेटर के लिए है</strong> ।\r\n\t<ul>\r\n\t\t<li>प्रत्येक वेब पेज जो इंटरनेट पर प्रदर्शित होता है, उससे जुड़ा एक विशिष्ट पता होता है। इस पते को URL के रूप में जाना जाता है।</li>\r\n\t\t<li>यह हमें प्रदर्शित होने वाले वेब पेज का स्थान और अन्य संबंधित जानकारी बताता है।</li>\r\n\t</ul>\r\n\t</li>\r\n</ul>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
