<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>41.) SSC CGL Tier II (Paper-I) Mock 11 (Hindi - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": "<p>एक बैग में 2 लाल, 3 हरे और 2 नीले रंग की गेंदें हैं, दो गेंदों को यादृच्छिक ढंग से निकाला जाता है। इसकी क्या संभावना है कि निकाली गई कोई भी गेंद नीली नहीं है?</p>", "option1": "<p>2/7</p>", "option2": "<p>11/21</p>", "option3": "<p>10/21</p>", "option4": "<p>5/7</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><strong>दिया गया है</strong>:</p><p>एक बैग में 2 लाल, 3 हरे और 2 नीले रंग की गेंदें हैं, दो गेंदों को यादृच्छिक ढंग से निकाला जाता है। </p><p><strong>प्रयुक्त सूत्र</strong>:</p><p>प्रायिकता = अनुकूल परिणाम/कुल परिणाम</p><p><strong><span>गणना</span>:</strong></p><p>निकाली गई गेंदों में से कोई भी नीली नहीं है, यह केवल तभी हो सकता है जब यादृच्छिक ढंग पर निकाली गई दो गेंदें लाल या हरी या दोनों हों।</p><p><span>गेंदों की कुल संख्या = 2 + 3 + 2 = 7</span></p><p>⇒<span> 7 में से 2 गेंदों को निकालने के तरीकों की संख्या = </span><sup><span>7</span></sup><span>C</span><sub><span>2</span></sub><span> = (7 × 6) / (2 × 1) = 42/2 = 21</span></p><p><span>  नीली गेंद के अतिरिक्त गेंदों की संख्या = 5</span></p><p>⇒<span> 5 में से 2 गेंदों को निकालने के तरीकों की संख्या  = </span><sup><span>5</span></sup><span>C</span><sub><span>2</span></sub><span> = (5 × 4) / (2 × 1) = 20/2 = 10</span></p><p><strong>∴ <span>अभीष्ट संभाव्यता   = 10/21</span></strong></p>", "question_heading": ""}, {"sr_no": 2, "question": "\r\n<p>श्वेता और रिंकी जुड़वाँ हैं। श्वेता का भाई राघव है। अनन्या, राघव की पत्नी है। रिंकी की माता मृदुला है। श्वेता का पति अर्णव है। अर्णव की पुत्री रिया है। तो मृदुला, रिया से किस प्रकार संबंधित है?</p>", "option1": "\r\n<p>माता की माता </p>", "option2": "\r\n<p>पुत्री की पुत्री </p>", "option3": "\r\n<p>पुत्र की पुत्री </p>", "option4": "\r\n<p>पिता की माता </p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दी गई जानकारी के अनुसार,</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882557_1742882557926476_thump.png\" style=\"width: 200px; height: 270px;\" /></figure>\r\n\r\n<ul>\r\n\t<li>श्वेता और रिंकी जुड़वाँ हैं।</li>\r\n\t<li>श्वेता का भाई राघव है।</li>\r\n\t<li>अनन्या, राघव की पत्नी है।</li>\r\n\t<li>रिंकी की माता मृदुला है।</li>\r\n\t<li>श्वेता का पति अर्णव है।</li>\r\n\t<li>अर्णव की पुत्री रिया है।</li>\r\n</ul>\r\n\r\n<p>निम्नलिखित आरेख बनाया जा सकता है,  </p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882615_1742882614691328_thump.png\" style=\"width: 300px; height: 120px;\" /></figure>\r\n\r\n<p>जैसा कि आरेख से ज्ञात होता है कि <strong>रिया, श्वेता की पुत्री है और मृदुला, श्वेता की माता है।</strong></p>\r\n\r\n<p>इस प्रकार, <strong>मृदुला, रिया की माता की माता है।</strong></p>\r\n\r\n<p>अत:, सही उत्तर &quot;<span>माता की माता&quot;  है।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": "\r\n<p>निम्नलिखित प्रश्न में, कथनों के बाद निष्कर्ष दिए गए हैं। दिए गए कथनों पर आधारित निष्कर्षों का अध्ययन कीजिए और अपने उत्तर के रूप में उपयुक्त विकल्प का चयन कीजिए।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>H &gt; J = K,</p>\r\n\r\n<p><strong>निष्कर्ष</strong>:</p>\r\n\r\n<p>I. K &gt; H</p>\r\n\r\n<p>II. J = H</p>", "option1": "\r\n<p>केवल निष्कर्ष II अनुसरण करता है</p>", "option2": "\r\n<p>या तो निष्कर्ष I या <span>निष्कर्ष </span>II अनुसरण करता है</p>", "option3": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है</p>", "option4": "\r\n<p>न तो निष्कर्ष I और न ही <span>निष्कर्ष </span>II अनुसरण करता है</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया तर्क है:</p>\r\n\r\n<p>दिया गया कथन H &gt; J = K है,</p>\r\n\r\n<p>I. K &gt; H &rarr; असत्य (चूँकि H &gt; J = K या H &gt; K)</p>\r\n\r\n<p><span>II. J = H &rarr; असत्य</span> (<span>चूँकि  H &gt; J = K </span>या <span>J &lt; H</span>)</p>\r\n\r\n<p>इसलिए, दिए गए कथन के अनुसार कोई भी निष्कर्ष अनुसरण नहीं करता है।</p>\r\n\r\n<p>अतः, सही उत्तर <span>- </span><strong>&#39;न तो निष्कर्ष I और न ही </strong><span>निष्कर्ष </span><strong>II अनुसरण करता है&#39; </strong><span>है</span>।</p>", "question_heading": ""}, {"sr_no": 4, "question": "\r\n<p>बाह्य स्पर्श करने वाले दो वृत्तों के केन्द्रों के बीच की दूरी 12 सेमी है। यदि उनके क्षेत्रफलों का योग 104&pi; सेमी<span>2</span> है, तो बड़े वृत्त की त्रिज्या है?</p>", "option1": "\r\n<p>7</p>", "option2": "\r\n<p>10</p>", "option3": "\r\n<p>8</p>", "option4": "\r\n<p>9</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>बाह्य स्पर्श करने वाले दो वृत्तों के केन्द्रों के बीच की दूरी 12 सेमी है।</p>\r\n\r\n<p>उनके क्षेत्रफलों का योग 104&pi; सेमी<span>2</span> है।</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>वृत्त का क्षेत्रफल <span>&pi;r 2</span> है<span>।</span></p>\r\n\r\n<p>यहाँ,</p>\r\n\r\n<p><span>r </span>त्रिज्या है<span>।</span></p>\r\n\r\n<p>मान लीजिये, बड़े वृत्त की त्रिज्या x है<span>।</span></p>\r\n\r\n<p>इसलिए, छोटे वृत्त की त्रिज्या = 12 - x</p>\r\n\r\n<p>अब,</p>\r\n\r\n<p>&pi;x<span>2</span> + (12 - x)<span>2</span>&pi; = 104&pi;</p>\r\n\r\n<p>&rArr; &pi;(x<span>2</span> + 144 + x<span>2</span> - 24x) = 104&pi;</p>\r\n\r\n<p>&rArr; 2x<span>2</span> + 144 - 24x = 104</p>\r\n\r\n<p>&rArr; 2x<span>2</span> + 40 - 24x = 0</p>\r\n\r\n<p>&rArr; 2x<span>2</span> - 20x - 4x + 40 = 0</p>\r\n\r\n<p>&rArr; 2x(x - 10)x - 4(x - 10) = 0</p>\r\n\r\n<p>&rArr; (x - 10)(2x - 4) = 0</p>\r\n\r\n<p>&rArr; x = 2, 10</p>\r\n\r\n<p>इसलिए, बड़े वृत्त की त्रिज्या 10 सेमी है<span>।</span></p>\r\n\r\n<p><strong>&there4; बड़े वृत्त की त्रिज्या 10 सेमी है।</strong></p>", "question_heading": ""}, {"sr_no": 5, "question": "\r\n<p>निम्नलिखित आकृति शृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर आने वाली आकृति का चयन कीजिये।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882799_1742882799487904_thump.png\" style=\"width: 300px; height: 62px;\" /></figure>", "option1": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882847_1742882847748246_thump.png\" style=\"width: 100px; height: 98px;\" /></figure>", "option2": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882869_1742882869189336_thump.png\" style=\"width: 100px; height: 98px;\" /></figure>", "option3": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882895_1742882895823834_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>", "option4": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882940_1742882940746425_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरित तर्क निम्नलिखित है:</p>\r\n\r\n<ul>\r\n\t<li>O दक्षिणावर्त दिशा में गति करता है।</li>\r\n\t<li>प्रत्येक आकृति में, स्टार पिछली <span>आकृति </span>के दर्पण प्रतिबिंब की स्थिति में है।</li>\r\n\t<li>C भी एक पैटर्न का अनुसरण करता है।</li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742882972_1742882972743877_thump.png\" style=\"width: 300px; height: 76px;\" /></figure>\r\n\r\n<p>अब प्रत्येक विकल्प की जाँच करने पर :</p>\r\n\r\n<p>1) यह तर्क का अनुसरण करता है।</p>\r\n\r\n<p>2) C पैटर्न का <span>अनुसरण </span>नहीं करता है।</p>\r\n\r\n<p>3) आकृति पैटर्न का <span>अनुसरण</span> नहीं करती है।</p>\r\n\r\n<p>4) आकृति पैटर्न का <span>अनुसरण </span>नहीं करती है।</p>\r\n\r\n<p>इस प्रकार, <strong>विकल्प 1, ?</strong> को प्रतिस्थापित करेगा। अन्य सभी विकल्प समाप्त हो गए हैं।</p>\r\n\r\n<p>अतः सही उत्तर <strong>&#39;विकल्प 1&#39; </strong>है।</p>", "question_heading": ""}, {"sr_no": 6, "question": "\r\n<p>रहीम और उसके चाचा की आयु में 10 वर्ष का अंतर है। 2 वर्ष बाद, यदि उनकी आयु का योगफल 66 वर्ष है, तो तो चाचा की वर्तमान आयु क्या है?</p>", "option1": "\r\n<p>51</p>", "option2": "\r\n<p>49</p>", "option3": "\r\n<p>36</p>", "option4": "\r\n<p>41</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>रहीम और उसके चाचा की आयु के बीच का अंतर<span> = 10 वर्ष</span></p>\r\n\r\n<p>2 वर्ष बाद, उनकी आयु का योगफल<span> = 66 वर्ष</span></p>\r\n\r\n<p><strong><span>गणना:</span></strong></p>\r\n\r\n<p>माना उसके चाचा की आयु U वर्ष तथा रहीम की आयु R वर्ष है।</p>\r\n\r\n<p>अब, प्रश्नानुसार</p>\r\n\r\n<p>&rArr; U - R = 10      -----(1)</p>\r\n\r\n<p>2 वर्ष बाद, उनकी आयु का योगफल<span> = 66 वर्ष</span></p>\r\n\r\n<p>2 वर्ष बाद चाचा की आयु = (U + 2) <span>वर्ष</span></p>\r\n\r\n<p>2 वर्ष बाद रहीम की आयु = (R + 2) <span>वर्ष</span></p>\r\n\r\n<p><span>उनकी आयु का योगफल </span>= (U + 2 + R + 2) = 66</p>\r\n\r\n<p>&rArr; U + R + 4 = 66</p>\r\n\r\n<p>&rArr; U + R = 62        ------(2)</p>\r\n\r\n<p>अब, समीकरण (1) और <span>समीकरण</span> (2) को जोड़ने पर, हमें प्राप्त होता हैं,</p>\r\n\r\n<p>&rArr; 2U = 72</p>\r\n\r\n<p>&rArr; U = 36 वर्ष</p>\r\n\r\n<p><strong>&there4; उसके चाचा की अभीष्ट आयु 36 वर्ष है।</strong></p>", "question_heading": ""}, {"sr_no": 7, "question": "\r\n<p>नीचे दी गई आकृतियों में कागज को मोड़कर काटने का क्रम दिया गया है। यह कागज खोलने पर कैसा दिखाई देगा?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883047_1742883047832270_thump.png\" style=\"width: 300px; height: 98px;\" /></figure>", "option1": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883099_1742883099547869_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option2": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883122_1742883122196679_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option3": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883146_1742883146633244_thump.png\" style=\"width: 100px; height: 100px;\" /></div>", "option4": "\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883198_1742883198134114_thump.png\" style=\"width: 100px; height: 101px;\" /></div>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ हम देख सकते हैं कि दिए गए कागज को तीन बार मोड़ा गया है।</p>\r\n\r\n<div>\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883224_1742883224504205_thump.png\" style=\"width: 300px; height: 82px;\" /></figure>\r\n=\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883283_1742883283692866_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>\r\n</div>\r\n\r\n<p> </p>\r\n\r\n<p>अतः, सही उत्तर<strong> &quot;विकल्प 2&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 8, "question": "\r\n<p>नीचे दिए गए प्रत्येक प्रश्न में एक कथन दिया गया है, जिसके बाद दो धारणाएँ । और ॥ दी गई हैं। आपको कथन और निम्नलिखित धारणाओं पर विचार करना होगा और यह तय करना होगा कि कथन में कौन सा धारणाएँ अंतर्निहित हैं।</p>\r\n\r\n<p>कथनः</p>\r\n\r\n<p>सभी को परिकथाएँ पढ़ना पसंद है।</p>\r\n\r\n<p>धारणाएँ:</p>\r\n\r\n<p>I. परिकथाएँ केवल पठन सामग्री हैं।</p>\r\n\r\n<p>II. कोई भी अन्य सामग्री को पसंद नहीं करता है।</p>", "option1": "\r\n<p>केवल धारणा I अंतर्निहित है।</p>", "option2": "\r\n<p>I और II दोनों अंतर्निहित हैं।</p>", "option3": "\r\n<p>न तो I और न ही II अंतर्निहित है।</p>", "option4": "\r\n<p>केवल धारणा II अंतर्निहित है।</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>कथन में कहा गया है कि <span>परिकथाएँ </span>सभी को पसंद आती हैं।</p>\r\n\r\n<ul>\r\n\t<li>यह कथन केवल <span>परिकथाओं </span>को सभी लोगों द्वारा पसंद किए जाने की बात करता है, लेकिन यह नहीं बताता है कि <span>परिकथाओं </span>का कोई अन्य उपयोग या उद्देश्य नहीं है। तो, धारणा I निहित नहीं है।</li>\r\n\t<li>दिए गए कथन में अन्य चीजों को पसंद या नापसंद करने वाले लोगों के बारे में कुछ भी नहीं सुझाया गया है, इसलिए धारणा II भी निहित नहीं है।</li>\r\n</ul>\r\n\r\n<p>अतः सही उत्तर <strong>विकल्प 3</strong> है।</p>", "question_heading": ""}, {"sr_no": 9, "question": "\r\n<p>जब सूर्य का अक्षांश 45&deg; से 30&deg; में बदलता है, तो मीनार की परछाई 60 मीटर बढ़ जाती है, तो मीनार की लम्बाई क्या है?</p>", "option1": "\r\n<p>30(&radic;3 + 1)</p>", "option2": "\r\n<p>20(&radic;3 + 1)</p>", "option3": "\r\n<p>24(&radic;3 + 1)</p>", "option4": "\r\n<p>30(&radic;3 - 1)</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883369_1742883369855183_thump.png\" style=\"width: 200px; height: 185px;\" /></figure>\r\n\r\n<p>AB = h</p>\r\n\r\n<p>CD = 60</p>\r\n\r\n<p>&Delta; ABC में</p>\r\n\r\n<p><span class=\"math-tex\">\\(\\tan 45^\\circ = \\frac{{AB}}{{BC}} = \\frac{h}{{BC}}\\)</span></p>\r\n\r\n<p>&rArr; BC = h</p>\r\n\r\n<p>&Delta;ABD में</p>\r\n\r\n<p><span class=\"math-tex\">\\(tan30^\\circ = \\frac{h}{{BC + 60}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(h = \\frac{{60}}{{\\sqrt 3 - 1}}\\)</span></p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(h = \\frac{{60}}{{\\sqrt 3 - 1}} \\times \\frac{{\\sqrt 3 + 1}}{{\\sqrt 3 + 1}}\\)</span></p>\r\n\r\n<p>&there4; <span class=\"math-tex\">\\(h = 30\\left( {\\sqrt 3 + 1} \\right)\\)</span></p>", "question_heading": ""}, {"sr_no": 10, "question": "\r\n\r\n<p>निम्नलिखित पाई चार्ट किसी विशेष वर्ष के दौरान विभिन्न जिलों में पर्यटन पर किसी देश के खर्च को दर्शाता है। देश का कुल खर्च ₹15,62,000</p>\r\n\r\n<p>जिला E की तुलना में जिला C पर कितना कम धन (₹में) खर्च किया जाता है?</p>", "option1": "\r\n\r\n<p>65790</p>", "option2": "\r\n\r\n<p>60890</p>", "option3": "\r\n\r\n<p>66780</p>", "option4": "\r\n\r\n<p>62480</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p>दिया है:</p>\r\n\r\n<p>देश का कुल खर्च = ₹15,62,000</p>\r\n\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883742_1742883742677895_thump.png\" style=\"width: 400px; height: 245px;\" /></p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>प्रतिशत = (दिया गया मान/कुल मान) &times; 100</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>प्रश्न के अनुसार,</p>\r\n\r\n<p>जिला C पर खर्च की गई धनराशि = कुल धन का 14%</p>\r\n\r\n<p>&rArr; जिला C = 1562000 का 14%</p>\r\n\r\n<p>&rArr; जिला C = 14/100 &times; 1562000</p>\r\n\r\n<p>&rArr; जिला C = 14 &times; 15620 = 218680 रुपये</p>\r\n\r\n<p>जिला C पर खर्च की गई धनराशि = कुल धन का 18%</p>\r\n\r\n<p>&rArr; जिला E = 1562000 का 18%</p>\r\n\r\n<p>&rArr; जिला E = 18/100 &times; 1562000</p>\r\n\r\n<p>&rArr; जिला E = 18 &times; 15620 = 281160 रुपये</p>\r\n\r\n<p>अब जिला C और जिला E के खर्च किए गए धन के बीच का अंतर</p>\r\n\r\n<p>&rArr; (जिला E पर खर्च किया गया धन) - (जिला C पर खर्च किया गया धन)</p>\r\n\r\n<p>&rArr; (281160) - (218680) = 62480 रुपये</p>\r\n\r\n<p><strong>&there4; जिला E की तुलना में जिला C पर 62480 रुपये खर्च किए जाते हैं।</strong></p>", "question_heading": ""}, {"sr_no": 11, "question": "\r\n<p>नीचे दी गई लम्बाइयों का माध्यक क्या है?</p>\r\n\r\n<p>160 सेमी, 167 सेमी, 158 सेमी, 159 सेमी, 161 सेमी, 158 सेमी, 160 सेमी, 162 सेमी, 170 सेमी</p>", "option1": "\r\n<p><span>161 </span>सेमी</p>", "option2": "\r\n<p><span>160 </span>सेमी</p>", "option3": "\r\n<p><span>160.6 </span>सेमी</p>", "option4": "\r\n<p><span>159 </span>सेमी</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong><span>प्रयुक्त अवधारणा:</span></strong></p>\r\n\r\n<p><span>जब प्रेक्षणों की संख्या, एक विषम संख्या होती है तो माध्यिका मध्य मान होता है।</span></p>\r\n\r\n<p><strong><span>गणना:</span></strong></p>\r\n\r\n<p><span>दी गई ऊँचाइयों की माध्यिका ज्ञात करने के लिए, हमें उन्हें निम्नतम से उच्चतम के क्रम में व्यवस्थित करना होगा:</span></p>\r\n\r\n<p><span>158 सेमी, 158 सेमी, 159 सेमी, 160 सेमी, 160 सेमी, 161 सेमी, 162 सेमी, 167 सेमी, 170 सेमी</span></p>\r\n\r\n<p><span>कुल 9 ऊँचाइयाँ हैं, जो एक विषम संख्या है। जब ऊँचाई  क्रम में व्यवस्थित की जाती है तो माध्यिका , मध्य मान होती है। इस स्थिति में, माध्यिका  पाँचवाँ मान है, जो 160 सेमी है।</span></p>\r\n\r\n<p><strong><span>अतः, समूह की औसत ऊँचाई 160 सेमी है।</span></strong></p>", "question_heading": ""}, {"sr_no": 12, "question": "\r\n<p><span>निम्नलिखित संख्या श्रेणी में अगला पद क्या आना चाहिए?</span></p>\r\n\r\n<p><span><span class=\"math-tex\">\\(\\frac{1}{\\sqrt{2}}, \\frac{1}{2}, \\frac{1}{2 \\sqrt{3}}, \\frac{1}{2 \\sqrt{6}}, \\frac{1}{6 \\sqrt{2}}\\)</span>, ?</span></p>", "option1": "\r\n<p><span>\\(\\frac{1}{12 \\sqrt{3}}\\)</span></p>", "option2": "\r\n<p><span>\\(\\frac{1}{12 \\sqrt{2}}\\)</span></p>", "option3": "\r\n<p><span>\\(\\frac{1}{6 \\sqrt{6}}\\)</span></p>", "option4": "\r\n<p><span>\\(\\frac{1}{12}\\)</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>Concept used:</strong></p>\r\n\r\n<p><span>It follows the multiplicity of \\(\\frac{1}{\\sqrt2}\\)  and then by   \\(\\frac{1}{\\sqrt3}\\)  and then by  \\(\\frac{1}{\\sqrt2}\\)  and by  \\(\\frac{1}{\\sqrt3}\\) respectively.</span></p>\r\n\r\n<p><u><strong>Calculation:</strong></u></p>\r\n\r\n<p>For<span class=\"math-tex\">\\(\\frac{1}{\\sqrt{2}}, \\frac{1}{2}, \\frac{1}{2 \\sqrt{3}}, \\frac{1}{2 \\sqrt{6}}, \\frac{1}{6 \\sqrt{2}}\\)</span> if take a look on the pattern, the next term would be multiplied by <span class=\"math-tex\">\\(\\frac{1}{\\sqrt2}\\)</span> .</p>\r\n\r\n<p>So, the next term would be <span class=\"math-tex\">\\(\\frac{1}{6 \\sqrt{2}}\\times\\frac{1}{\\sqrt2} =\\frac{1}{12}\\)</span></p>", "question_heading": ""}, {"sr_no": 13, "question": "\r\n<p>तीन कथनों के बाद I, II और III के रूप में संख्यांकित <span>तीन निष्कर्ष </span>दिए गए हैं। कथनों को सत्य मानते हुए, भले ही वे सामान्य रूप से ज्ञात तथ्यों से भिन्न प्रतीत होते हों, निर्णय लीजिए कि कौन सा/से निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता/करते है/हैं।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>सभी ग्रंथि, जोड़ हैं।</p>\r\n\r\n<p>कुछ जोड़, अस्थियाँ हैं।</p>\r\n\r\n<p>सभी <span>अस्थि याँ</span>, उपास्थि हैं।</p>\r\n\r\n<p><strong>निष्कर्ष:</strong></p>\r\n\r\n<p>I. कोई ग्रंथि<span>, अस्थि </span>नहीं है।</p>\r\n\r\n<p><span>II</span>. सभी जोड़, उपास्थि हैं।</p>\r\n\r\n<p>III. कुछ उपास्थि, ग्रंथि हैं।</p>", "option1": "\r\n<p>केवल निष्कर्ष II और III अनुसरण करते हैं<span>।</span></p>", "option2": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है<span>।</span></p>", "option3": "\r\n<p>केवल निष्कर्ष I और II अनुसरण करते हैं<span>।</span></p>", "option4": "\r\n<p>कोई भी निष्कर्ष अनुसरण नहीं करता है<span>।</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>दिए गए कथनों से, वेन आरेख निम्न है:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883847_1742883847186153_thump.png\" style=\"width: 100px; height: 128px;\" /></figure>\r\n<br />\r\nअब हम दिए गए निष्कर्षों पर विचार करते हैं:</div>\r\n\r\n<p><span>I. </span><strong><span>कोई </span>ग्रंथि<span>, अस्थि  नहीं है</span></strong>&rarr; अनुसरण नहीं करता है &rarr; चूँकि कुछ जोड़, <span>अस्थि याँ </span>हैं और सभी ग्रंथि, जोड़ हैं, इसलिए संभावना है कि कुछ ग्रंथि, <span>अस्थि याँ </span>हों और इस प्रकार यह निष्कर्ष <span>अनुसरण </span>नहीं करता है।<br />\r\n<span>II. </span><strong><span>सभी जोड़,  उपास्थि  हैं</span></strong>&rarr; अनुसरण नहीं करता <span>है </span>&rarr; चूँकि कुछ जोड़, <span>अस्थि याँ </span>हैं और सभी <span>अस्थियाँ, उपास्थि </span>हैं इसलिए यह कहा जा सकता है कि कुछ जोड़, <span>उपास्थि </span>हैं लेकिन सभी नहीं हैं और इसलिए यह निष्कर्ष अनुसरण नहीं करता है।<br />\r\n<span>III. </span><strong><span>कुछ  उपास्थि, </span>ग्रंथि <span>हैं </span></strong>&rarr; अनुसरण नहीं करता <span>है</span> &rarr; चूँकि कुछ <span>उपास्थि,  जोड़ </span>के साथ हैं और हम कोई संबंध नहीं मान सकते हैं और आकृति से हम देख सकते हैं कि कोई <span>उपास्थि,  जोड़ </span>नहीं है इसलिए यह निष्कर्ष अनुसरण नहीं करता है।<br />\r\nचूँकि कोई निष्कर्ष अनुसरण नहीं करता है।</p>\r\n\r\n<p>अतः <strong>सही उत्तर विकल्प 4 है।</strong></p>", "question_heading": ""}, {"sr_no": 14, "question": "\r\n<p>एक निश्चित कूट भाषा में, &#39;<span>Camera captures moments</span>&#39; को &#39;391&#39; <span>के रूप में कूटबद्ध किया जाता है</span>, &#39;Moments is beautiful&#39; को &#39;987&#39; के रूप में कूटबद्ध किया जाता है और &#39;<span>Moments capture beautiful feelings</span>&#39; को &#39;5739&#39; के रूप में कूटबद्ध किया जाता है। उसी भाषा में &#39;Camera&#39; को किस प्रकार कूटबद्ध किया जाएगा?</p>", "option1": "\r\n<p>1</p>", "option2": "\r\n<p>9</p>", "option3": "\r\n<p>3</p>", "option4": "\r\n<p>8</p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दी गई जानकारी के अनुसार:</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742883911_1742883911153262_thump.png\" style=\"width: 350px; height: 94px;\" /></figure>\r\n\r\n<p>उपरोक्त छवि से, हम यह निष्कर्ष निकाल सकते हैं कि, </p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td><strong>शब्द</strong></td>\r\n\t\t\t<td><strong>कूट</strong></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Moments</td>\r\n\t\t\t<td>9</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>Capture</td>\r\n\t\t\t<td>3</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><strong>Camera </strong></td>\r\n\t\t\t<td><strong>1</strong></td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>इसलिए, <span>&quot;Camera&quot;  के लिए कूट </span><strong>1</strong> है। </p>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;1&quot; </strong><span>है।  </span></p>", "question_heading": ""}, {"sr_no": 15, "question": "\r\n<p>एक बास्केटबॉल टीम में 12 पुरुष होते हैं, जिनमें से 5 किसी भी एक समय खेल रहे होते हैं। यदि खेल एक घंटे तक चलता है और प्रत्येक व्यक्ति समान समय तक खेलता है तो प्रत्येक खिलाड़ी कितने मिनट खेलता है?</p>", "option1": "\r\n<p>20</p>", "option2": "\r\n<p>25</p>", "option3": "\r\n<p>15</p>", "option4": "\r\n<p>30</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>एक बास्केट बॉल टीम में 12 <span>पुरुष </span>हैं और एक गेम में, उनमें से 5 किसी भी एक समय पर खेलते हैं।</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>यदि बास्केटबॉल टीम में 12 पुरुष हैं और <span>खेल के दौरान किसी भी एक समय </span>उनमें से 5 खेलते हैं,</p>\r\n\r\n<p>तब टीम के लिए कुल खेलने का समय होगा<span> = 5 खिलाड़ी x 1 घंटा = 5 घंटे</span></p>\r\n\r\n<p>मिनटों में कुल खेलने का समय = 5 &times; 60 मिनट = 300 <span>मिनट</span></p>\r\n\r\n<p>खिलाड़ियों की संख्या के अनुसार खेलने का <span>कुल </span>समय = <span class=\"math-tex\">\\(\\dfrac{300}{12}\\)</span> = 25 मिनट</p>\r\n\r\n<p><strong><span>&there4; </span>बास्केटबॉल टीम का प्रत्येक व्यक्ति खेल के दौरान 25 मिनट तक खेलेगा।</strong></p>", "question_heading": ""}, {"sr_no": 16, "question": "\r\n<p><span>यदि संख्याओं के एक समूह का माध्य और माध्यिका  क्रमशः 8 और 11 हैं, तो बहुलक क्या होगा?</span></p>", "option1": "\r\n<p>12</p>", "option2": "\r\n<p>19</p>", "option3": "\r\n<p>17</p>", "option4": "\r\n<p>15</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><span>दिया गया है:</span></p>\r\n\r\n<p>माध्य = 8</p>\r\n\r\n<p><span>माध्यिका</span> = 11</p>\r\n\r\n<p><span>प्रयुक्त अवधारणा:</span></p>\r\n\r\n<p>बहुलक = 3 <span>माध्यिका</span> - 2 माध्य</p>\r\n\r\n<p><span>गणना:</span></p>\r\n\r\n<p>बहुलक = 3 &times; 11 - 2 &times; 8</p>\r\n\r\n<p>&rArr; बहुलक = 33 - 16</p>\r\n\r\n<p>&rArr; बहुलक = 17</p>\r\n\r\n<p><span>&there4; बहुलक 17 है।</span></p>\r\n\r\n<p><span>&there4; सही उत्तर विकल्प 3 है।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": "\r\n<p>पाँच मित्रों प्रियंका, मृणालिनी, गीतांजलि, अर्णव और शिवालिका ने एक दौड़ में भाग लिया। प्रियंका, मृणालिनी से आगे लेकिन गीतांजलि से पीछे रही। अर्णव शिवालिका से पहले लेकिन मृणालिनी के पीछे समाप्त करता है।</p>\r\n\r\n<p>दौड़ किसने जीती?</p>", "option1": "\r\n<p><span>गीतांजलि</span></p>", "option2": "\r\n<p><span>अर्णव</span></p>", "option3": "\r\n<p><span>शिवालिका</span></p>", "option4": "\r\n<p><span>मृणालिनी</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दी गई जानकारी से,</p>\r\n\r\n<p>एक दौड़ में 5 मित्र भाग ले रहे हैं। तो, जो पहले दौड़ पूरी करेगा, वह तालिका के शीर्ष पर रहेगा और इसी प्रकार आगे भी।</p>\r\n\r\n<p>1. प्रियंका ने मृणालिनी से पहले लेकिन गीतांजलि के बाद दौड़ पूरी की।</p>\r\n\r\n<p>तो, गीतांजलि, प्रियंका के आगे और मृणालिनी प्रियंका के पीछे रहेगी।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884051_1742884051636804_thump.png\" style=\"width: 50px; height: 119px;\" /></figure>\r\n\r\n<p>2. अर्णव, शिवालिका से आगे लेकिन मृणालिनी के पीछे समाप्त हो करता है।</p>\r\n\r\n<p>अर्थात मृणालिनी के बाद अर्णव और अर्णव के बाद शिवालिका रहेगी।</p>\r\n\r\n<p>तो, यह अंतिम आरेख है</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884073_1742884073811926_thump.png\" style=\"width: 50px; height: 198px;\" /></figure>\r\n\r\n<p>इस आरेख के अनुसार, यह स्पष्ट है कि गीतांजलि शीर्ष पर रहेगी और शिवालिका सबसे निचले स्थान पर रहेगी।</p>\r\n\r\n<p>अत: सही उत्तर <strong>&quot;गीतांजलि&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 18, "question": "\r\n<p>&#39;A % B&#39; का अर्थ है &#39;A, B का पिता है&#39;</p>\r\n\r\n<p>&#39;A &amp; B&#39; का अर्थ है &#39;A, B की बहन है&#39;</p>\r\n\r\n<p>&#39;A @ B&#39; का अर्थ है &#39;A, B का भाई है&#39;</p>\r\n\r\n<p>यदि V% Y &amp; T @ Z <span>&amp;</span> U% X &amp; W, तब Y, U से कैसे संबंधित है?</p>", "option1": "\r\n<p>ननद/भाभी</p>", "option2": "\r\n<p>बहन</p>", "option3": "\r\n<p><span>साला/जीजा</span></p>", "option4": "\r\n<p>भाई</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>निम्नलिखित प्रतीकों का उपयोग करके वंश वृक्ष तैयार करने पर:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884157_1742884157815618_thump.png\" style=\"width: 200px; height: 263px;\" /></figure>\r\n\r\n<p>दी गई सूचना के अनुसार,</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p> </p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"3\">\r\n\t\t\t<p><span>A है</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>प्रतीक</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>%</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>&amp;</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>@</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>अर्थ</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>पिता</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>बहन</p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p>भाई</p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p> </p>\r\n\t\t\t</td>\r\n\t\t\t<td colspan=\"3\">\r\n\t\t\t<p><span>B का</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p>दिया गया व्यंजक है:</p>\r\n\r\n<p><strong>&#39;</strong><span><strong>V % Y &amp; T @ Z &amp; U % X &amp; W&#39;</strong> &rarr; </span>V, Y का पिता है, Y, T की बहन है, T, Z का भाई है, Z, U की बहन है, U, X का पिता है, X, W की बहन है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884225_1742884225261993_thump.png\" style=\"width: 250px; height: 179px;\" /></figure>\r\n\r\n<p><span>&there4; </span>यहाँ, Y, U की बहन है।</p>\r\n\r\n<p>अत:, सही उत्तर <strong>&quot;बहन&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 19, "question": "\r\n<div>\r\n<p><strong>निर्देश:</strong> नीचे दिए गए प्रश्न में एक प्रश्न है और दो कथन I और II उसके नीचे दिए गए हैं। आपको यह तय करना है कि कथन में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त हैं या नहीं।</p>\r\n\r\n<p>आठ व्यक्ति M, N, O, P, Q, R, S और T उत्तर की ओर मुख करके एक पंक्ति में बैठे हैं। O के बायें तीसरा कौन बैठता है?</p>\r\n\r\n<p><strong>कथन I:</strong> P, Q के ठीक दाएं बैठता है। एक व्यक्ति M और T के बीच बैठता है। R, S के बाईं ओर बैठता है, जो M के निकटस्थ है।</p>\r\n<strong>कथन II:</strong> N, M के बाएं से दूसरे स्थान पर बैठा है, जो O के ठीक बाएं बैठता है। P, T के दाईं ओर बैठता है।</div>", "option1": "\r\n<p>केवल कथन I का डेटा ही प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन II का डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।</p>", "option2": "\r\n<p>केवल कथन II का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन I का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।</p>", "option3": "\r\n<p>केवल कथन I या कथन II का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त हैं।</p>", "option4": "\r\n<p>कथन I और II दोनों का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>\r\n<p><strong>कथन I:</strong> P, Q के ठीक दाएं बैठता है। एक व्यक्ति M और T के बीच बैठता है। R, S के बाईं ओर बैठता है, जो M के निकटस्थ है।</p>\r\n\r\n<p>इसलिये, हम O के बायें तीसरे स्थान पर बैठे व्यक्ति को निर्धारित नहीं कर सकते हैं।</p>\r\n\r\n<p><span>कथन II:</span> N, M के बाएं से दूसरे स्थान पर बैठा है, जो O के ठीक बाएं बैठता है। P, T के दाईं ओर बैठता है।</p>\r\n\r\n<p>इस कथन में, M, O के ठीक बाएं है और N, M के बाएं से दूसरे स्थान पर है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742884493_1742884493908806_thump.png\" style=\"width: 300px; height: 41px;\" /></figure>\r\n\r\n<p>इसलिये, N, O के बाएं तीसरा बैठता है।</p>\r\nअतः, केवल कथन II का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन I का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।</div>", "question_heading": ""}, {"sr_no": 20, "question": "\r\n<p>उस समुच्चय का चयन कीजिए जिसमें संख्याएँ उसी प्रकार संबंधित हैं जैसे निम्नलिखित समुच्चयों की संख्याएँ संबंधित हैं।(नोट: संख्याओं को उसके मूल अंकों में विभाजित किए बिना, पूर्ण संख्याओं पर संक्रियाएँ की जानी चाहिए। उद \r\n\r\n<div> </div>\r\n\r\n<div> </div>\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893376_1742893376549111_thump.png\" style=\"width: 100px; height: 119px;\" /></div>\r\n\r\n<div> यहां तर्क लागू नहीं होता है।</div>\r\n\r\n<div> </div>\r\n\r\n<div><strong>विकल्प 4: </strong>(138, 130, 73)</div>\r\n\r\n<div> </div>\r\n\r\n<div><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893556_1742893556186945_thump.png\" style=\"width: 100px; height: 113px;\" /></div>\r\n\r\n<div> </div>\r\n\r\n<div> यहां तर्क लागू नहीं होता है।</div>\r\n\r\n<div> </div>\r\n\r\n<div>इसलिए, सही उत्तर &#39;<strong>विकल्प 4&#39;</strong> है।</div>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n<p>समान्तर चतुर्भुज ABCD में, यदि विकर्ण BD पर दो बिंदु P और Q इस प्रकार लिए गए हैं कि DP = BQ है, तो निम्नलिखित में से कौन-सा/से कथन सही है/हैं?</p>\r\n\r\n<p>(a) &Delta;APD &cong; &Delta;CQB</p>\r\n\r\n<p>(b) AP = CQ</p>\r\n\r\n<p>(c) AQ = CP</p>", "option1": "\r\n<p><span>केवल (a) और (c)</span></p>", "option2": "\r\n<p><span>केवल (b) और (c)</span></p>", "option3": "\r\n<p><span>(a), (b) और (c)</span></p>", "option4": "\r\n<p><span>केवल (c) </span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>ABCD एक समांतर चतुर्भुज है।</p>\r\n\r\n<p>DP = BQ</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>हमें प्रश्न के अनुसार आरेख बनाना है और सही उत्तर प्राप्त करने के लिए दिए गए सभी पांच कथनों की जांच करनी है। </p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>आइए प्रश्न के अनुसार आरेख बनाते हैं।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742893924_1742893924122478_thump.png\" style=\"width: 200px; height: 159px;\" /></figure>\r\n\r\n<p>कथन (a) की जांच करते हैं,</p>\r\n\r\n<p>&Delta;APD और &Delta;CQB में,</p>\r\n\r\n<p>DP = BQ (दिया गया है)</p>\r\n\r\n<p>&ang;ADP = &ang;CBQ  [∵ AD || BC]</p>\r\n\r\n<p>AD = BC  [ABCD समांतर चतुर्भुज के सम्मुख भुजा]</p>\r\n\r\n<p>&there4; <span>&Delta;APD &cong; &Delta;CQB</span></p>\r\n\r\n<p><strong><span>कथन (a) सत्य है। </span></strong></p>\r\n\r\n<p><span>कथन  (b) की जांच करते हैं ,</span></p>\r\n\r\n<p><span>हमें &Delta;APD &cong; &Delta;CQB प्राप्त होता है</span></p>\r\n\r\n<p><span>इसलिए, AP = CQ</span></p>\r\n\r\n<p><span>कथन (b) सत्य है। </span></p>\r\n\r\n<p><span>कथन  (c) की जांच करते हैं ,</span></p>\r\n\r\n<p>हमें &Delta;AQB &cong; &Delta;CPD प्राप्त होता है</p>\r\n\r\n<p>&there4; AQ = CP</p>\r\n\r\n<p><span>कथन (c) सत्य है। </span></p>\r\n\r\n<p><strong>अतः, (a), (b) और (c) सही कथन हैं।</strong></p>", "question_heading": ""}, {"sr_no": 22, "question": "\r\n<div>\r\n<p>उस विकल्प का चयन कीजिए जो दूसरे युग्म को पहले युग्म के समरूप बनाएगा।</p>\r\nबस्तर : छत्तीसगढ :: इटारसी : ?</div>", "option1": "\r\n<p>अरूणाचल प्रदेश</p>", "option2": "\r\n<p>उत्तर प्रदेश</p>", "option3": "\r\n<p>उत्तराखंड</p>", "option4": "\r\n<p>मध्य प्रदेश</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिए गए युग्म में अनुसरण किया गया तर्क निम्नलिखित है:</p>\r\n\r\n<p>बस्तर : छत्तीसगढ़ &rarr; बस्तर, छत्तीसगढ़ का एक <span>शहर </span>है।</p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>इटारसी : ? &rarr; इटारसी, <strong>मध्य प्रदेश </strong>का एक <span>शहर</span> है।</p>\r\n\r\n<p>यहाँ, <strong>&#39;इटारसी : मध्य प्रदेश&#39; </strong>सही युग्म है।</p>\r\n\r\n<p>अतः सही उत्तर <strong>&quot;विकल्प (4)&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 23, "question": "\r\n<p>रोहन अपने घर से पूर्व की ओर चलना शुरू करता है और 5 मीटर चलने के बाद बाएं मुड़ जाता है। वहां से, 15 मीटर चलने के बाद, वह दाएं मुड़ता है और 5 मीटर चलकर एक फूल की दुकान पर पहुंचता है। फूलों की दुकान के सन्दर्भ में उसका घर किस दिशा में है? (सभी मोड़ केवल 90&deg; के मोड़ हैं)</p>", "option1": "\r\n<p>उत्तर </p>", "option2": "\r\n<p><span>पश्चिम</span></p>", "option3": "\r\n<p><span>दक्षिण पश्चिम</span></p>", "option4": "\r\n<p><span>दक्षिण-पूर्व </span></p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दी गयी शर्तों के अनुसार,</p>\r\n\r\n<ul>\r\n\t<li>रोहन अपने घर से पूर्व की ओर चलना शुरू करता है और 5 मीटर चलता है। <img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894032_1742894032909641_thump.png\" style=\"width: 100px; height: 44px;\" /></li>\r\n\t<li>वहां से, 15 मीटर चलने के बाद, वह दाएं मुड़ता है।</li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894067_1742894067403083_thump.png\" style=\"width: 140px; height: 173px;\" /></figure>\r\n\r\n<ul>\r\n\t<li>वह दाएं मुड़ता है और फूलों की दुकान तक पहुँचने के लिए 5 मीटर चलता है। </li>\r\n</ul>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894884_1742894884133176_thump.png\" style=\"width: 300px; height: 279px;\" /></figure>\r\n\r\n<p>स्पष्ट रूप से, रोहन का घर, फूलों की दुकान के दक्षिण-पश्चिम में है।</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742894972_1742894972653881_thump.png\" style=\"width: 400px; height: 315px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर &#39;दक्षिण-पश्चिम&#39; है। </p>", "question_heading": ""}, {"sr_no": 24, "question": "\r\n<p>उस समूह का चयन कीजिए जिसमें संख्याएँ उसी प्रकार से संबंधित हैं, जिस प्रकार निम्नलिखित समूह में संख्याएँ हैं।</p>\r\n\r\n<p>(नोट: संख्याओं को उनके घटक अंकों में विभाजित किए बिना, संक्रियाओं को पूरी संख्याओं पर किया जाना चाहिए। उदाहरण &ndash; 13 पर <span>संक्रियाएँ </span>जैसे 13 को जोड़ना/घटाना/गुणा करना आदि किया जा सकता है। 13 को 1 और 3 में तोड़कर 1 और 3 पर गणितीय संक्रियाएँ करने की अनुमति नहीं है)</p>\r\n\r\n<p>(27, 64, 19)</p>\r\n\r\n<p>(32, 441, 11)</p>", "option1": "\r\n<p>(49, 900, 57)</p>", "option2": "\r\n<p>(24, 169, 17)</p>", "option3": "\r\n<p>(64, 729, 37)</p>", "option4": "\r\n<p>(27, 484, 19)</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया तर्क निम्नलिखित है:</p>\r\n\r\n<p><strong>(पहली <span>संख्या</span> - तीसरी संख्या) = (X)<sup>2</sup> = दूसरी संख्या</strong></p>\r\n\r\n<p>(27, 64, 19) &rarr; (27 - 19) = (8)<sup>2</sup> = 64 <strong>(</strong><span>दूसरी संख्या</span><strong>)</strong></p>\r\n\r\n<p>और,</p>\r\n\r\n<p>(32, 441, 11) &rarr; (32 - 11) = (21)<sup>2</sup> = 441 <strong>(</strong><span>दूसरी संख्या</span><strong>)</strong></p>\r\n\r\n<p>इसी प्रकार,</p>\r\n\r\n<p>(64, 729, 37) &rarr; (64 - 37) = (27)<sup>2</sup> = 729 <strong>(</strong><span>दूसरी संख्या</span><strong>)</strong></p>\r\n\r\n<p>अतः सही उत्तर <strong>&quot;(64, 729, 37)&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 25, "question": "\r\n<p>दिए गए विकल्पों में से उस अक्षर-समूह का चयन कीजिए, जो निम्नलिखित शृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर आ सकता है।</p>\r\n\r\n<p>GROW, FSNX, ETMY, ?, CVKA</p>", "option1": "\r\n<p><span>DULX</span></p>", "option2": "\r\n<p><span>DVLA</span></p>", "option3": "\r\n<p><span>DVLZ</span></p>", "option4": "\r\n<p><span>DULZ</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरित तर्क निम्नलिखित है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742895177_1742895177619208_thump.png\" style=\"width: 100px; height: 222px;\" /></figure>\r\n\r\n<p>इसलिए, दी गई शृंखला में प्रश्नवाचक चिन्ह के स्थान पर &#39;DULZ&#39; आएगा।</p>\r\n\r\n<p>अतः सही उत्तर <strong>&quot;DULZ&quot;</strong> है।</p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n<p>यदि 3a + 4b : 2a - b = 11 : 5 है, तब <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span> का मान ज्ञात कीजिए। </p>", "option1": "\r\n<p><span>\\(\\dfrac{38}{7}\\)</span>a</p>", "option2": "\r\n<p><span>\\(\\dfrac{38}{7}\\)</span>b</p>", "option3": "\r\n<p><span>\\(\\dfrac{31}{7}\\)</span>b</p>", "option4": "\r\n<p><span>\\(\\dfrac{29}{7}\\)</span>b</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>3a + 4b : 2a - b = 11 : 5</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>a<sup>3</sup> + b<sup>3</sup> = (a + b)(a<sup>2</sup> - ab + b<sup>2</sup>)</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>&rArr; <span><span class=\"math-tex\">\\(\\dfrac{3a + 4b}{2a - b} = \\dfrac{11}{5}\\)</span></span></p>\r\n\r\n<p>&rArr; 5 &times; (3a + 4b) = 11 &times; (2a - b)</p>\r\n\r\n<p>&rArr; 15a + 20b = 22a - 11b</p>\r\n\r\n<p>&rArr; 7a = 31b</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{a}{b}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span></p>\r\n\r\n<p>&rArr; a = <strong><span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span></strong>b</p>\r\n\r\n<p>&rArr; <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span></p>\r\n\r\n<p><span>&rArr;  \\(\\dfrac{(a + b)(a^2-ab+b^2)}{a^2-ab+b^2}\\)</span></p>\r\n\r\n<p>&rArr; (a + b) = <span class=\"math-tex\">\\(\\dfrac{31}{7}\\)</span>b + b= <span class=\"math-tex\">\\(\\dfrac{38}{7}\\)</span>b</p>\r\n\r\n<p>&there4; <span class=\"math-tex\">\\(\\dfrac{a^3+b^3}{a^2-ab+b^2}\\)</span><strong> = <span class=\"math-tex\">\\(\\dfrac{38}{7}\\)</span>b</strong></p>", "question_heading": ""}, {"sr_no": 27, "question": "\r\n<p>यदि x के 40% का 40%, 40 है, तो &#39;x&#39; का मान क्या है?</p>", "option1": "\r\n<p>100</p>", "option2": "\r\n<p>250</p>", "option3": "\r\n<p>400</p>", "option4": "\r\n<p>इनमें से कोई नहीं</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>x के 40% का 40%, 40 है।</span></p>\r\n\r\n<p><strong><span>गणना:</span></strong></p>\r\n\r\n<p><span>x के 40% का 40%, 40 है।</span></p>\r\n\r\n<p><span>&rArr; <span class=\"math-tex\">\\(\\frac{40}{{100}}\\)</span> &times; <span class=\"math-tex\">\\(\\frac{40}{{100}}\\)</span> &times; (x) = 40</span></p>\r\n\r\n<p><span>&rArr; <span class=\"math-tex\">\\(\\frac{2}{{5}}\\)</span> &times; <span class=\"math-tex\">\\(\\frac{2}{{5}}\\)</span> &times; (x) = 40</span></p>\r\n\r\n<p><span>&rArr; <span class=\"math-tex\">\\(\\frac{4x}{{25}}\\)</span> = 40</span></p>\r\n\r\n<p><span>&rArr; <span class=\"math-tex\">\\(\\frac{x}{{25}}\\)</span> = 10</span></p>\r\n\r\n<p><span>&rArr; x = (25 &times; 10) = <strong>250</strong></span></p>\r\n\r\n<p><strong><span>&there4; </span>x का अभीष्ट मान 250 है।</strong></p>", "question_heading": ""}, {"sr_no": 28, "question": "<p>A(4, -3) और B(9, 7) को मिलाने वाले रेखाखंड को बिंदु P(7, 3) किस अनुपात में विभाजित करता है? </p>", "option1": "<p>2 <span>&ratio; </span>3</p>", "option2": "<p>3 <span>&ratio; </span>4 </p>", "option3": "<p>3 <span>&ratio; </span>3</p>", "option4": "<p>3 <span>&ratio; </span>2 </p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p><span>दिया गया है:</span></p><p>बिंदु A(4, -3), B(9, 7) और P(7, 3);</p><p><span>प्रयुक्त सूत्र:</span></p><p>यदि एक बिंदु (x, y) एक रेखाखंड को m : n के अनुपात में विभाजित करता है, जिसके अंतिम बिंदु (x<sub>1</sub>, y<sub>1</sub>) और (x<sub>2</sub>, y<sub>2</sub>) हैं,</p><p>तो उस बिंदु के y-निर्देशांक <span class=\"math-tex\">\\(\\dfrac{my_2 + ny_1}{m+n}\\)</span> हैं।</p><p><span>गणना:</span></p><p>उपरोक्त सूत्र का प्रयोग करने पर,</p><p>हमारे पास है, x<span>1</span> = 4, y<span>1</span> = - 3, x<span>2</span> = 9, y<span>2</span> = 7</p><p>विभाजन बिंदु के निर्देशांक (7, 3) हैं।</p><p>हमारे पास उपस्थित y-निर्देशांक की तुलना करने पर,</p><p><span class=\"math-tex\">\\(\\dfrac{7m + (-3)n}{m+n}\\)</span> = 3</p><p>⇒ 7m - 3n = 3m + 3n</p><p>⇒ 7m - 3m = 3n + 3n</p><p>⇒ 4m = 6n</p><p>⇒ <span class=\"math-tex\">\\(\\dfrac{m}{n}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{6}{4}\\)</span> = <span class=\"math-tex\">\\(\\dfrac{3}{2}\\)</span></p><strong><span>∴ अभीष्ट अनुपात  = 3 : 2</span></strong>", "question_heading": ""}, {"sr_no": 29, "question": "\r\n<p><strong>निर्देश:</strong> कौन सी उत्तर-आकृति, प्रश्न-आकृति के पैटर्न को पूर्ण करेगी?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742973895_1742973895495660_thump.png\" style=\"width: 100px; height: 100px;\" /></figure>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974093_1742974093910895_thump.png\" style=\"width: 200px; height: 61px;\" /></figure>", "option1": "\r\n<p>A</p>", "option2": "\r\n<p>B</p>", "option3": "\r\n<p>C</p>", "option4": "\r\n<p>D</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दिया गया है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974188_1742974188821515_thump.png\" style=\"width: 200px; height: 67px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <strong>D </strong>है।</p>", "question_heading": ""}, {"sr_no": 30, "question": "\r\n\r\n<p>दिए गए आलेख का अध्ययन करें और नीचे दिए गए प्रश्न का उत्तर दें।</p>\r\n\r\n<p><span>आलेख </span>5 अलग-अलग संस्थानों से एक परीक्षा में उपस्थित उम्मीदवारों और उत्तीर्ण उम्मीदवारों (सैकड़ों में) की संख्या को दर्शाता है।</p>\r\n\r\n<p>प्रति संस्था उत्तीर्ण होने वाले उम्मीदवारों की औसत संख्या (सैकड़ों में) क्या है?</p>", "option1": "\r\n\r\n<p><span>1460</span></p>", "option2": "\r\n\r\n<p><span>1280</span></p>", "option3": "\r\n\r\n<p><span>1500</span></p>", "option4": "\r\n\r\n<p><span>1680</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p>औसत = सभी पदों का योग/पदों की कुल संख्या</p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>प्रश्न के अनुसार,</p>\r\n\r\n<p>उम्मीदवार उत्तीर्ण = A + B + C + D + E</p>\r\n\r\n<p>मान सैकड़ों में दिए गए हैं:</p>\r\n\r\n<p>उत्तीर्ण अभ्यर्थी = 1200 2000 800 2600 1800 = 8400</p>\r\n\r\n<p>औसत = 8400/5 = 1680</p>\r\n\r\n<p><strong>&there4; संस्थान उत्तीर्ण होने वाले उम्मीदवारों की औसत संख्या (सैकड़ों में) 1680 है।</strong></p>", "question_heading": ""}, {"sr_no": 31, "question": "\r\n<p>निम्न प्रश्न में प्रश्न चिह्न &lsquo;?&rsquo; के स्थान पर क्या आएगा?</p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3 </sup>&times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>", "option1": "\r\n<p>2.5</p>", "option2": "\r\n<p>3</p>", "option3": "\r\n<p>3.5</p>", "option4": "\r\n<p>4</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p> </p>\r\n\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3</sup> &times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा:</strong></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<p>(121)<sup>1/2</sup> &times; (1331)<sup>1/3</sup> &times; (11)<sup>2</sup> &times; &radic;11 = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; 11 &times; 11 &times; (11)<sup>2</sup> &times; (11)<sup>1/2</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; (11)<sup>1 + 1 + 2 + 0.5</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>&rArr; (11)<sup>4.5</sup> = (11)<sup>? + 0.5</sup></p>\r\n\r\n<p>घातों की तुलना करने पर</p>\r\n\r\n<p>4.5 = ? + 0.5</p>\r\n\r\n<p>&rArr; ? = 4.5 &ndash; 0.5</p>\r\n\r\n<p>&rArr; 4</p>\r\n\r\n<p><strong>&there4;  &lsquo;?&rsquo;</strong><strong>का मान 4 है।</strong></p>", "question_heading": ""}, {"sr_no": 32, "question": "\r\n<p>मीता की आय, सीता की आय से 25% अधिक है। सीता की आय, मीता की आय से कितने प्रतिशत कम है?</p>", "option1": "\r\n<p>25</p>", "option2": "\r\n<p>24</p>", "option3": "\r\n<p><span>\\(22\\frac{1}{2}\\)</span></p>", "option4": "\r\n<p>20</p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>मीता की आय, सीता की आय से 25% अधिक है।</span></p>\r\n\r\n<p><strong><span>गणना:</span></strong></p>\r\n\r\n<p>माना सीता की आय 100 है।</p>\r\n\r\n<p><span>मीता की आय = 100 &times;<span class=\"math-tex\">\\(\\dfrac{100+25}{100}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 100 &times; <span class=\"math-tex\">\\(\\dfrac{5}{4}\\)</span></span></p>\r\n\r\n<p><span>&rArr; 125</span></p>\r\n\r\n<p>सीता के संदर्भ में मीता की आय का कम प्रतिशत<span> = <span class=\"math-tex\">\\(\\dfrac{125-100}{125}\\times 100\\)</span></span></p>\r\n\r\n<p><span>&rArr; <span class=\"math-tex\">\\(\\dfrac{25}{125}\\times 100\\)</span> = 20%</span></p>\r\n\r\n<p><strong><span>&there4; सही </span>उत्तर 20% है।</strong></p>", "question_heading": ""}, {"sr_no": 33, "question": "\r\n<p>दिए गए विकल्पों में से उस संख्या का चयन कीजिए, जो निम्नलिखित शृंखला में प्रश्नवाचक चिह्न (?) को प्रतिस्थापित कर सकती है।</p>\r\n\r\n<p>4127, 4248, 4329, 4378, ?</p>", "option1": "\r\n<p>4430</p>", "option2": "\r\n<p>4403</p>", "option3": "\r\n<p>4304</p>", "option4": "\r\n<p>4344</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>यहाँ अनुसरण किया गया तर्क निम्नलिखित है:</p>\r\n\r\n<p>दी गई <span>शृंखला </span>है 4127, 4248, 4329, 4378, ?</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974571_1742974571862046_thump.png\" style=\"width: 200px; height: 105px;\" /></figure>\r\n\r\n<p>इसलिए, अगली संख्या<strong> &#39;4403&#39;</strong> है।</p>\r\n\r\n<p>अतः, <strong>&quot;विकल्प (2)&quot; </strong>सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 34, "question": "\r\n<p>इस प्रश्न में, तीन कथन दिए गए हैं, जिसके बाद I और II के रूप में संख्यांकित <span>दो निष्कर्ष</span> दिए गए हैं। कथनों को सत्य मानते हुए, भले ही वे सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होते हों, निर्णय लीजिए कि कौन सा/से निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता/करते हैं।</p>\r\n\r\n<p><strong>कथन:</strong></p>\r\n\r\n<p>सभी नोटबुक, स्टेशनरी हैं।</p>\r\n\r\n<p>कुछ स्टेशनरी, पेंसिलें हैं।</p>\r\n\r\n<p>सभी पेंसिलें, महंगी हैं।</p>\r\n\r\n<p><strong>निष्कर्ष:</strong></p>\r\n\r\n<p>I. सभी नोटबुक, <span>पेंसिलें  </span>हैं।</p>\r\n\r\n<p><span>II</span>. सभी स्टेशनरी, महंगी हैं।</p>", "option1": "\r\n<p>केवल निष्कर्ष <span>Il </span>अनुसरण करता है।</p>", "option2": "\r\n<p>केवल निष्कर्ष I अनुसरण करता है।</p>", "option3": "\r\n<p>न तो निष्कर्ष I और न ही II अनुसरण करता है।</p>", "option4": "\r\n<p>निष्कर्ष I और II दोनों अनुसरण करते हैं।</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<div>न्यूनतम संभावित वेन आरेख इस प्रकार है:\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974625_1742974625541421_thump.png\" style=\"width: 300px; height: 67px;\" /></figure>\r\n</div>\r\n\r\n<p><span>निष्कर्ष:</span></p>\r\n\r\n<p>I. <span>सभी नोटबुक, पेंसिल हैं।</span> &rarr; अनुसरण नहीं करता है। (चूँकि सभी नोटबुक, स्टेशनरी हैं और केवल कुछ स्टेशनरी, पेंसिल हैं। इसलिए सभी नोटबुक, पेंसिल नहीं हो सकते हैं।)</p>\r\n\r\n<p>II. <span>सभी स्टेशनरी, महंगी हैं। </span>&rarr; <span>अनुसरण नहीं करता है।</span> (<span>चूँकि  </span>सभी पेंसिलें, महंगी हैं और केवल कुछ स्टेशनरी, महंगी हैं, इसलिए सभी स्टेशनरी, महंगी नहीं हो सकती हैं।)</p>\r\n\r\n<p>अतः <strong>&quot;न तो निष्कर्ष I और न ही I अनुसरण करता है।&quot;</strong></p>", "question_heading": ""}, {"sr_no": 35, "question": "\r\n<p>एक खेत में कुछ मुर्गियाँ और बकरियाँ हैं। सभी के सिरों का योगफल 77 और पैरों का योगफल 248 है। खेत में मुर्गियों की संख्या कितनी है?</p>", "option1": "\r\n<p>25</p>", "option2": "\r\n<p>30</p>", "option3": "\r\n<p>40</p>", "option4": "\r\n<p>47</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>सभी </span>मुर्गियों और बकरियों के सिरों का योगफल<span> = 77</span></p>\r\n\r\n<p>मुर्गियों और बकरियों के पैरों का योगफल<span> = 248</span></p>\r\n\r\n<p><strong><span>गणना:</span></strong></p>\r\n\r\n<p>माना मुर्गियों और बकरियों के सिरों की संख्या क्रमशः x और y है।</p>\r\n\r\n<p>अब, प्रश्नानुसार</p>\r\n\r\n<p><span>सभी  मुर्गियों और बकरियों के सिरों का योगफल  = 77</span></p>\r\n\r\n<p><span>&rArr; <strong>x + y = 77 </strong>        -----(1)</span></p>\r\n\r\n<p>और, उनके पैरों का योगफल = 248</p>\r\n\r\n<p>चूँकि प्रत्येक मुर्गी के दो पैर होते हैं और <span>प्रत्येक </span>बकरी के चार पैर होते हैं।</p>\r\n\r\n<p>इसलिए, 2x + 4y = 248       -----(2)</p>\r\n\r\n<p>समीकरण (1) को <span>समीकरण </span>2 से गुणा करने पर, हमें प्राप्त होता है,</p>\r\n\r\n<p>&rArr; <strong>2x + 2y = 154</strong>      -----(3)</p>\r\n\r\n<p>अब, समीकरण (3) को <span>समीकरण</span> (2) से घटाने पर, <span>हमें प्राप्त होता है,</span></p>\r\n\r\n<p>&rArr; 2x + 4y - 2x - 2y = (248 - 154)</p>\r\n\r\n<p>&rArr; 2y = 94</p>\r\n\r\n<p>&rArr; <strong>y = 47</strong></p>\r\n\r\n<p>y का मान समीकरण (1) में रखने पर, <span>हमें प्राप्त होता है,</span></p>\r\n\r\n<p>&rArr; x + 47 = 77</p>\r\n\r\n<p>&rArr; x = (77 - 47) = <strong>30</strong></p>\r\n\r\n<p><strong>&there4; खेत में <span>मुर्गियों</span> की अभीष्ट संख्या 30 है।</strong></p>", "question_heading": ""}, {"sr_no": 36, "question": "\r\n<p>उस विकल्प का चयन करें जिसमें दी गई आकृति सन्निहित है। (घूर्णन की अनुमति नहीं है)</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974695_1742974695859872_thump.png\" style=\"width: 80px; height: 53px;\" /></figure>", "option1": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974769_1742974769966230_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option2": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974813_1742974813727454_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option3": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974875_1742974875640531_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "option4": "\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974901_1742974901365099_thump.png\" style=\"width: 100px; height: 100px;\" /></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p>दी गई आकृति में <span>सन्निहित</span> की गई आकृति नीचे दी गई है:</p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742974973_1742974973348890_thump.png\" style=\"width: 300px; height: 390px;\" /></figure>\r\n\r\n<p>अतः,<strong> &quot;विकल्प 1&quot; </strong>सही उत्तर है।</p>", "question_heading": ""}, {"sr_no": 37, "question": "\r\n<p>ABC एक त्रिभुज है, PQ एक रेखाखंड है जो AB को P पर और AC को Q पर प्रतिच्छेद करता है तथा PQ II BC है। AP : BP का अनुपात = 3 : 5 और BC की लंबाई 48 सेमी है। PQ की <span>लम्बाई </span>ज्ञात कीजिए। </p>", "option1": "\r\n<p><span>18 सेमी</span></p>", "option2": "\r\n<p><span>28 सेमी</span></p>", "option3": "\r\n<p><span>48 सेमी</span></p>", "option4": "\r\n<p><span>38 सेमी</span></p>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p><span>PQ II BC.</span></p>\r\n\r\n<p>AP : BP<span> का अनुपात</span> = 3 : 5</p>\r\n\r\n<p><span>BC</span> की लम्बाई 48 सेमी है<span>। </span></p>\r\n\r\n<p><strong>गणना:</strong></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976261_1742976261236036_thump.png\" style=\"width: 200px; height: 206px;\" /></figure>\r\n\r\n<p>AP ∶ BP = 3 ∶ 5 </p>\r\n\r\n<p>AB = 3 + 5</p>\r\n\r\n<p>&rArr; 8 इकाई</p>\r\n\r\n<p>यहाँ,</p>\r\n\r\n<p>&ang;A, &Delta;APQ और &Delta;ABC में उभयनिष्ठ है<span>। </span></p>\r\n\r\n<p><span>PQ II BC</span></p>\r\n\r\n<p>इसलिए,</p>\r\n\r\n<p>&Delta;APQ &sim; &Delta;ABC</p>\r\n\r\n<p>AP/AB = PQ/BC</p>\r\n\r\n<p>&rArr; 3/8 = PQ/48</p>\r\n\r\n<p>&rArr; PQ = 48 &times; 3/8 </p>\r\n\r\n<p>&rArr; PQ = 18 सेमी</p>\r\n\r\n<p><strong>&there4; PQ की <span>लम्बाई </span> 18 सेमी है।</strong></p>", "question_heading": ""}, {"sr_no": 38, "question": "\r\n<p>तूफान के कारण टेलीग्राफ का खंभा जमीन पर एक बिंदु पर झुक गया है। खंभे का शीर्ष जो जमीन पर है, उसके नीचे से 8&radic;3 दूर है और 30&deg; का कोण बनाता है। तो खम्भे की ऊंचाई कितनी थी?</p>", "option1": "\r\n<p>23</p>", "option2": "\r\n<p>24</p>", "option3": "\r\n<p>10</p>", "option4": "\r\n<p>16</p>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976373_1742976373655401_thump.png\" style=\"width: 150px; height: 149px;\" /></figure>\r\n\r\n<p>टेलीग्राफ की लम्बाई = AC</p>\r\n\r\n<p>AC = AB + BC</p>\r\n\r\n<p>AB = BD</p>\r\n\r\n<p><span class=\"math-tex\">\\(tan30^\\circ = \\frac{{BC}}{{8\\sqrt 3 }}\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(BC = 8\\sqrt 3 \\times \\frac{1}{{\\sqrt 3 }} = 8\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(Sin30^\\circ = \\frac{{BC}}{{BD}}\\)</span></p>\r\n\r\n<p><span class=\"math-tex\">\\(\\frac{1}{2} = \\frac{8}{{{\\rm{BD}}}}\\)</span></p>\r\n\r\n<p>BD = 16</p>\r\n\r\n<p>टेलीग्राफ की लम्बाई AC = AB + BC</p>\r\n\r\n<p>AC = BD + BC</p>\r\n\r\n<p>AC = 16 + 8</p>\r\n\r\n<p>AC = 24</p>", "question_heading": ""}, {"sr_no": 39, "question": "\r\n<p>दी गई तालिका का अध्ययन कीजिए और नीचे दिए गए प्रश्न का उत्तर दीजिए।</p>\r\n\r\n<p>तालिका विभिन्न देशों में विभिन्न वर्षों में एक क्रिकेट खिलाड़ी द्वारा बनाए गए रनों की संख्या को दर्शाती है।</p>\r\n\r\n<figure class=\"table\">\r\n<table>\r\n\t<tbody>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<p><span>वर्ष/ देश </span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>देश </span></p>\r\n\r\n\t\t\t<p><span>A</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>देश </span></p>\r\n\r\n\t\t\t<p><span>B</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>देश </span></p>\r\n\r\n\t\t\t<p><span>C</span></p>\r\n\t\t\t</td>\r\n\t\t\t<td>\r\n\t\t\t<p><span>देश </span></p>\r\n\r\n\t\t\t<p><span>D</span></p>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>2018</td>\r\n\t\t\t<td>30</td>\r\n\t\t\t<td>45</td>\r\n\t\t\t<td>50</td>\r\n\t\t\t<td>38</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td> n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</figure>\r\n\r\n<p><span>गणना:</span></p>\r\n\r\n<p>देश A के लिए = 30 + 25 + 25 + 52 = 132</p>\r\n\r\n<p><span>देश B के लिए</span> = 45 + 32 + 35 + 29 = 141</p>\r\n\r\n<p><span>देश C के लिए</span> = 50 + 40 + 38 + 45 = 173</p>\r\n\r\n<p><span>देश D के लिए</span> = 38 + 50 + 50 + 62 = 200</p>\r\n\r\n<p><span>&there4; </span><strong>इन चार वर्षों के दौरान कुल रनों की <span>सर्वाधिक </span>संख्या देश <span>D</span> के हैं।</strong></p>", "question_heading": ""}, {"sr_no": 40, "question": "\r\n\r\n\r\n<p>एक चर्चा के दौरान 8 सहपाठी सुनीता, फहीम, अनुपम, डिक्सन, बानो, दिलन, जूही और पुनीतकेंद्र के सम्मुख वृत्त में बैठे हैं। बानो, पुनीत और दिलन के बीच में बैठी है। डिक्सन, अनुपम और पुनीत के बीच में बैठा है। बानो और जूही एक दूसरे के सम्मुख नहीं बैठे हैं। सुनीता, बानो के बाएं तीसरे स्थान पर और अनुपम के दाएं दूसरे स्थान पर है।</p>\r\n\r\n<p>सुनीता के बाएं तीसरे स्थान पर कौन है?</p>", "option1": "\r\n\r\n\r\n<p>बानो </p>", "option2": "\r\n\r\n\r\n<p>अनुपम </p>", "option3": "\r\n\r\n\r\n<p>फहीम </p>", "option4": "\r\n\r\n\r\n<p>डिक्सन </p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n\r\n\r\n<p><strong>8 सहपाठी: </strong><span>सुनीता, फहीम, अनुपम, डिक्सन, बानो, दिलन, जूही और पुनीत</span></p>\r\n\r\n<p>1) <span>सुनीता, बानो के बाएं तीसरे स्थान पर है। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976478_1742976478814538_thump.png\" style=\"width: 200px; height: 174px;\" /></figure>\r\n\r\n<p><span>बानो, पुनीत और दिलन के बीच में बैठी है। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976532_1742976532488423_thump.png\" style=\"width: 200px; height: 196px;\" /></figure>\r\n\r\n<p>3) <span>डिक्सन, अनुपम और पुनीत के बीच में बैठा है।</span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976558_1742976558207504_thump.png\" style=\"width: 200px; height: 172px;\" /></figure>\r\n\r\n<p>4) <span>बानो और जूही एक दूसरे के सम्मुख नहीं बैठे हैं। </span></p>\r\n\r\n<figure class=\"image\"><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742976624_1742976624404733_thump.png\" style=\"width: 200px; height: 178px;\" /></figure>\r\n\r\n<p>अतः, सही उत्तर <strong>&quot;डिक्सन&quot;</strong> है। </p>", "question_heading": ""}, {"sr_no": 41, "question": "\r\n<p>एक वर्ग के विकर्ण की लम्बाई 20 सेमी हो, तो इसका परिमाप क्या होगा?</p>", "option1": "\r\n<p><span>10 &radic;2 सेमी</span></p>", "option2": "\r\n<p><span>40 सेमी</span></p>", "option3": "\r\n<p><span>200 सेमी</span></p>", "option4": "\r\n<p><span>40 &radic;2 सेमी</span></p>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<p><strong>दिया गया है:</strong></p>\r\n\r\n<p>वर्ग का विकर्ण 20 सेमी है।</p>\r\n\r\n<p><strong>प्रयुक्त अवधारणा: </strong></p>\r\n\r\n<p>परिमाप = 2&radic;2 x विकर्ण</p>\r\n\r\n<p><strong>गणना: </strong></p>\r\n\r\n<p>&rArr; परिमाप = 2&radic;2 x 20 = 40&radic;2 सेमी</p>\r\n\r\n<p><strong>&there4; वर्ग का विकर्ण 20 सेमी है, तो वर्ग का परिमाप 40 &radic;2 सेमी होना चाहिए।</strong></p>", "question_heading": ""}, {"sr_no": 42, "question": "\r\n<p>एक निश्चित कूट भाषा में &#39;<span>CATHOLIC</span>&#39; को &#39;61231141536&#39; और &#39;ENTIRELY&#39; को &#39;2172332121528&#39; के रूप में कूटित किया गया है। उस भाषा में &#39;INFORMAL&#39; को किस प्रकार कूटित किया जाएगा?</p>", "option1": "\r\n<p>617972116415</p>", "option2": "\r\n<p>31134151018</p>", "option3": "\r\n<p>317942116115</p>", "option4": "\r\n<p>314641813112</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "\r\n<figure class=\"image\">\r\n<p><img src=\"https://static-appxdb-v2.akamai.net.in/paperimages/1742977200_1742977200563146_thump.png\" style=\"width: 400px; height: 96px;\" /></p>\r\n</figure>\r\n\r\n<p>यहाँ अनुसरण किया गया तर्क है :-</p>\r\n\r\n<p><img src=\"https://static-appxd
