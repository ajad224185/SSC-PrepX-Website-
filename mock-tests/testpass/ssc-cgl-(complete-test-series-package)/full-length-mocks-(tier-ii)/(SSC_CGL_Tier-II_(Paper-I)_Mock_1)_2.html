<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) SSC CGL Tier-II (Paper-I) Mock 1 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

tution. It provides relevant commentary and further expands on the topic introduced in S1 and continued in S2.\n  <br> Therefore, the correct answer is option (c) S, Q, with S2 being \"India follows a federal structure with governments in the States and at the Centre, each with their own distinct sense of responsibilities and domains to function\" and S3 being \"One hopes that Governors and Lt. Governors will handle these ties more sensitively.\"\n  <br>", "question_heading": ""}, {"sr_no": 67, "question": "The following sentence has been divided into parts. One of them may contain an error. Select the part that contains the error from the given options. If you don’t find any error, mark ‘No error’ as your answer.\n  <br>She enjoys to read books, especially those on history and culture.\n  <br>", "option1": "She enjoys to read books\n  <br>", "option2": "No error\n  <br>", "option3": "especially those on\n  <br>", "option4": "history and culture\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The error lies in the verb structure \"enjoys to read\". In English, after the verb \"enjoy\", we use the gerund (-ing form) instead of the infinitive (to + verb). So, it should be \"She enjoys reading books\".\n  <br> The correct sentence is: \"She enjoys reading books, especially those on history and culture.\"\n  <br> To understand this better, remember that some verbs can be followed by the gerund form but not the to-infinitive form. \n  <br> \"Enjoy\" is one of these verbs. Other verbs in this category include avoid, consider, delay, deny, finish, keep, miss, practice, resist, and suggest. \n  <br> So, you would say \"She finished doing her homework\" rather than \"She finished to do her homework\". It's important to learn which verbs follow this pattern in English.\n  <br>", "question_heading": ""}, {"sr_no": 68, "question": "Select the most appropriate option to fill in the blank.\n  <br>At a certain season of our life we are _____________ to consider every spot as the possible site of a house.\n  <br>", "option1": "Loaded\n  <br>", "option2": "Allowing\n  <br>", "option3": "Accustomed \n  <br>", "option4": "Allowed \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘accustomed’ to fill in the blank.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Loaded</b> - carrying a load or burden.\n  <br> \n  <b>Allowing</b> - giving permission or consent.\n  <br> \n  <b>Accustomed</b> - familiar with, used to.\n  <br> \n  <b>Allowed</b> - permitted or authorized.\n  <br>As per the context of the sentence given and meanings of all options ‘accustomed’ is the most appropriate option to fill in the blank.\n  <br>", "question_heading": ""}, {"sr_no": 69, "question": "The following sentence has been split into four segments. Identify the segment that contains a grammatical error.\n  <br>The professor elucidated the esoteric principles of quantum mechanics with precision and clarity.\n  <br>", "option1": "The professor elucidated\n  <br>", "option2": "the esoteric principles of quantum\n  <br>", "option3": "mechanics with precision and clarity\n  <br>", "option4": "No Error\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The provided sentence is grammatically correct. Each segment is appropriately structured, and there are no errors in subject-verb agreement or other grammatical aspects. \n  <br>The sentence effectively communicates that the professor explained the complex principles of quantum mechanics with precision and clarity.\n  <br>", "question_heading": ""}, {"sr_no": 70, "question": "Select the INCORRECTLY spelt word.\n  <br>", "option1": "Arachnophobia \n  <br>", "option2": "Acrophobia \n  <br>", "option3": "Xenophonia \n  <br>", "option4": "Claustrophobia \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer to the question is: (c) Xenophonia. The correct term for the fear of strangers or foreigners is \"Xenophobia.\"\n  <br>Meanings of all options:\n  <br> \n  <b>Arachnophobia</b>: The fear or strong aversion to spiders.\n  <br> \n  <b>Acrophobia</b>: The fear of heights or high places.\n  <br> \n  <b>Claustrophobia</b>: The fear of confined or enclosed spaces.\n  <br>", "question_heading": ""}, {"sr_no": 71, "question": "Select the option that expresses the given sentence in reported speech.\n  <br>Mayank said to Shraddha, “Are you angry with me?”\n  <br>", "option1": "Mayank asked Shraddha if she was angry with her.\n  <br>", "option2": "Mayank asked Shraddha if she was angry with him.\n  <br>", "option3": "Mayank asked Shraddha if she was angry with me.\n  <br>", "option4": "Mayank asked Shraddha why she was angry with him.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Direct Speech</b> is a report of the exact words used by a speaker or writer. The words spoken appear within inverted commas “……” and should be exactly word to word as spoken or written.\n  <br> \n  <b>Indirect</b> \n  <b>Speech</b> \n  <b>(Reported speech)</b> is when we report what someone said in our own words. We do not use inverted commas, do not inscribe the exact words as spoken or written by someone. \n  <br>In reported speech, we need to change the tense of the reporting verb and make other necessary changes. The reporting verb \"said\" is changed to \"asked\" because it is a question. The pronouns also need to be changed to reflect the perspective of the reported speaker.\n  <br> In option (a) the pronoun \"her\" is incorrect because it refers to Mayank, but the original sentence states that Mayank asked Shraddha if she was angry with him.\n  <br> Option (b) correctly changes the pronoun \"me\" to \"him\" to reflect the perspective of Mayank.\n  <br> The pronoun \"me\" is incorrect in option (c) because it refers to the reported speaker (Mayank), but the original sentence indicates that Mayank asked Shraddha if she was angry with him.\n  <br> Option (d) changes the question from \"Are you angry with me?\" to \"why she was angry with him.\" It alters the meaning of the sentence and does not accurately represent the original question.\n  <br>", "question_heading": ""}, {"sr_no": 72, "question": "Select the option that expresses the given sentence in passive voice.\n  <br>While John cooks the food, Angela decorates the dining room.\"\n  <br>", "option1": "While the food is cooked by John, the dining room is decorated by Angela.\n  <br>", "option2": "The food is cooked by John, while Angela is decorated the dining room.\n  <br>", "option3": "While John is cooking by food, Angela is decorated by the dining room.\n  <br>", "option4": "The food is being cooked by John, while the dining room is being decorated by Angela.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "In passive voice, the subject of the active sentence becomes the object of the passive sentence, and the verb is changed to a passive form. \n  <br> Let's break down the sentence and apply the rules:\n  <br> Active voice: While John cooks the food, Angela decorates the dining room.\n  <br> Identify the subject, verb, and object in the active sentence:\n  <br> Subject: John\n  <br> Verb: cooks\n  <br> Object: the food\n  <br> Second subject: Angela\n  <br> Second verb: decorates\n  <br> Second object: the dining room\n  <br> Convert the objects into subjects and the subjects into objects in the passive sentence.\n  <br> Change the verb to its passive form:\n  <br> \"cooks\" changes to \"is cooked\" (verb + past participle)\n  <br> \"decorates\" changes to \"is decorated\" (verb + past participle)\n  <br> Include the \"by\" phrase to indicate the doer of the action.\n  <br> Putting it all together, we get the passive voice sentence:\n  <br> \"While the food is cooked by John, the dining room is decorated by Angela.\"\n  <br> Therefore, the correct answer is option (a).\n  <br>", "question_heading": ""}, {"sr_no": 73, "question": "Select the most appropriate option that can substitute the highlighted segment in the given sentence. If there is no need to substitute it, select ‘No substitution required’.\n  <br> Edward II is \n  <b>tragic than</b> some other plays by the dramatist.\n  <br>", "option1": "as least tragic as\n  <br>", "option2": "No substitution required\n  <br>", "option3": "the most tragic\n  <br>", "option4": "less tragic than\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (d) \"less tragic than.\"\n  <br>Let's analyze the given sentence and the options:\n  <br>\"Edward II is tragic than some other plays by the dramatist.\"\n  <br>The highlighted segment in the sentence is \"tragic than.\" This segment is incorrect because it does not follow the correct comparative form.\n  <br>Now let's consider each option:\n  <br> \"\n  <b>As least tragic as</b>\" - This option does not provide the correct comparative form. It should be \"as least tragic as\" instead of \"as least tragic as.\"\n  <br> \"\n  <b>No substitution required</b>\" - This option suggests that the highlighted segment is already correct, but as explained above, it is not.\n  <br> \"\n  <b>The most tragic</b>\" - This option changes the meaning of the sentence. It implies that Edward II is the most tragic among all plays by the dramatist, rather than comparing it to other plays.\n  <br> \"\n  <b>Less tragic than</b>\" - This option correctly provides the comparative form by using \"less tragic than.\" It implies that Edward II is not as tragic as some other plays by the dramatist.\n  <br>The correct answer is option (d) \"less tragic than\" because it provides the appropriate comparative form and maintains the intended meaning of the sentence.\n  <br>", "question_heading": ""}, {"sr_no": 74, "question": "Select the most appropriate ANTONYM of the highlighted word.\n  <br>He sighed again, gripping her shoulders, his gaze \n  <b>stern</b>.\n  <br>", "option1": "Flippant\n  <br>", "option2": "Permissive \n  <br>", "option3": "Desolate\n  <br>", "option4": "Noxious\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Stern</b> (adjective): Serious and strict in manner or attitude; not showing or allowing any kind of leniency or indulgence.\n  <br>Synonyms: strict, severe, harsh, firm, rigid, austere.\n  <br>Antonyms: lenient, gentle, lax, indulgent, \n  <b>permissive.</b> \n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Flippant</b> - lacking seriousness or respect, showing a lack of concern or seriousness, often inappropriately or irreverently.\n  <br> \n  <b>Permissive</b> - allowing or characterized by great freedom or leeway; not strict or restrictive in enforcing rules or regulations.\n  <br> \n  <b>Desolate</b> - deserted, empty, or barren; feeling or showing great unhappiness, loneliness, or emptiness.\n  <br> \n  <b>Noxious</b> - harmful, poisonous, or unpleasant; capable of causing harm or damage to living beings or the environment.\n  <br>", "question_heading": ""}, {"sr_no": 75, "question": "Select the most appropriate option to fill in the blank.\n  <br>I decided to read a book to ______ time while waiting for my flight at the airport.\n  <br>", "option1": "Ignore\n  <br>", "option2": "Kill\n  <br>", "option3": "Move \n  <br>", "option4": "Ease \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (b) kill.\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Ignore</b>: to pay no attention to or disregard something. However, in this context, it doesn't convey the intended meaning of passing time or finding an activity to occupy oneself.\n  <br> \n  <b>Kill (time)</b>: to spend or pass time in an enjoyable or engaging way. This option fits the context well, suggesting that the person decided to read a book as a means of making the time pass more quickly and enjoyable.\n  <br> \n  <b>Move</b>: to change or shift position. This option doesn't fit the context because it doesn't convey the idea of passing time or finding an activity to occupy oneself.\n  <br> \n  <b>Ease</b>: to make something less difficult or more comfortable. This option doesn't fit the context because it doesn't convey the idea of passing time or finding an activity to occupy oneself.\n  <br>Therefore, the most suitable option for the given sentence is (b) kill, which means spending time in an enjoyable or engaging way.\n  <br>", "question_heading": ""}, {"sr_no": 76, "question": "Select the option that can be used as a one-word substitute for the given group of words.\n  <br>A person who is excessively concerned with their own interests, welfare, or well-being.\n  <br>", "option1": "Narcissist\n  <br>", "option2": "Egoist \n  <br>", "option3": "Selfish\n  <br>", "option4": "Dictator\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that can be used as a one-word substitute for the given group of words \"A person who is excessively concerned with their own interests, welfare, or well-being.\" is (b) Egoist.\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Narcissist</b>: a person who has an excessive interest or admiration for oneself, especially their physical appearance or abilities. A narcissist is characterized by self-centeredness and a grandiose sense of self-importance.\n  <br> \n  <b>Egoist</b>: a person who is excessively concerned with their own interests, welfare, or well-being. An egoist is primarily focused on themselves and may disregard the needs or feelings of others.\n  <br> \n  <b>Selfish</b>: a person who is primarily concerned with their own interests and lacks consideration for others. Selfish individuals prioritize their own needs and desires above those of others.\n  <br> \n  <b>Dictator</b>: a ruler who has complete control and power over a country, often obtained and maintained through force. While a dictator may have a high level of self-importance, the term doesn't specifically denote excessive admiration for one's appearance.\n  <br> Among the options provided, (b) Egoist best describes a person who is excessively concerned with their own interests, welfare, or well-being.\n  <br>", "question_heading": ""}, {"sr_no": 77, "question": "Identify the INCORRECTLY spelt word in the given sentence.\n  <br>It may not sound like any bath you've ever taken (when was the last time you lathered up in a patchouli-scented product?), but this convoction is a surprisingly accurate take on its intended essence.\n  <br>", "option1": "Essence\n  <br>", "option2": "Lathered\n  <br>", "option3": "Patchouli\n  <br>", "option4": "Convoction\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The incorrectly spelled word in the given sentence is (d) convoction. The correct spelling should be \"concoction.\"\n  <br>Here are the meanings of all four options:\n  <br> \n  <b>Essence</b>: the intrinsic nature or indispensable quality of something. In this sentence, it refers to the intended fundamental nature or quality.\n  <br> \n  <b>Lathered</b>: covered with lather, which is a frothy mixture of soap and water. In this sentence, it describes the act of applying lather during a bath or shower.\n  <br> \n  <b>Patchouli</b>: a fragrant oil derived from a plant (Pogostemon cablin) used in perfumes and soaps. It has a distinctive, musky scent. In this sentence, it refers to the scented product used during a bath.\n  <br> Convoction (incorrect): The correct spelling is \"\n  <b>Concoction</b>,\" which means a mixture or combination of ingredients or elements. In this sentence, it refers to the particular mixture being described.\n  <br>Therefore, the incorrectly spelled word is (d) convoction, and it should be corrected to \"concoction\" to maintain proper spelling.\n  <br>", "question_heading": ""}, {"sr_no": 78, "question": "Replace the highlighted word with its synonym to make the sentence more meaningful.\n  <br>I delight in his lack of patience with everyone from students to politicians who demonstrate inexcusable ignorance, incompetence or \n  <b>obfuscation</b>. \n  <br>", "option1": "Illuminate\n  <br>", "option2": "Obscurity\n  <br>", "option3": "Standard\n  <br>", "option4": "Revelation\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b>Obfuscation</b> refers to the act of deliberately making something unclear, confusing, or difficult to understand.\n  <br>Synonyms: confuse, \n  <b>obscure</b>, muddle, befuddle.\n  <br>Antonyms: clarify, elucidate, illuminate, reveal.\n  <br>Meanings of all options are as follows:\n  <br> \n  <b>Illuminate</b>: to clarify, shed light on, or make something clear and understandable.\n  <br> \n  <b>Obscurity</b>: the state of being unclear, unknown, or difficult to understand or perceive.\n  <br> \n  <b>Standard</b>: a widely accepted or recognized level of quality, excellence, or norm.\n  <br> \n  <b>Revelation</b>: the act of disclosing or revealing something previously unknown or hidden.\n  <br>", "question_heading": ""}, {"sr_no": 79, "question": "Select the appropriate idiom that can replace the highlighted phrase in the following sentence.\n  <br>The political debate turned into a \n  <b>chaotic situation</b> as the candidates started hurling insults at each other.\n  <br>", "option1": "at stone’s throw\n  <br>", "option2": "carpet bomb\n  <br>", "option3": "a bear garden\n  <br>", "option4": "at sixes and sevens\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The appropriate idiom that can replace the highlighted phrase \"chaotic situation\" in the sentence is (c) a bear garden.\n  <br>Meanings of the options:\n  <br> \n  <b>At a stone's throw</b>: very close in distance, implying proximity. However, it doesn't convey the sense of chaos or disorder.\n  <br> \n  <b>Carpet bomb</b>: to bombard or attack extensively and indiscriminately. This phrase doesn't capture the specific meaning of chaos in the given context.\n  <br> \n  <b>A bear garden</b>: a chaotic or rowdy situation, often characterized by aggressive or unruly behavior. This idiom accurately conveys the sense of disorder and tumultuousness.\n  <br> \n  <b>At sixes and sevens</b>: in a state of confusion or disorder. While this option does convey a sense of disorder, it doesn't capture the context of a political debate or the act of hurling insults.\n  <br>Therefore, the most suitable idiom to replace the highlighted phrase is (c) a bear garden, indicating a chaotic situation.\n  <br>", "question_heading": ""}, {"sr_no": 80, "question": "Fयन पुध ीयहन-ौधnपधncध (S1 पय S4) ूोनोgनोूु ृिधयथ, ौधnपधncधौ S1 ोnक S4 ोनध giॅधn. Fनयं पुध यूपiयnौ P, Q, R, ोnक S ौिधधcप पुध ोूूनयूनiोपध ौधnपधncधौ ीयन S2 ोnक S3, नधौूधcपiॅिधद. (S1) On Jहnध 30, 2023, पुध Kोनnोपोाो Higु Cयहनप कiौंiौौधक Tथiपपधन’ौ cुोििधngध पय पुध iौौहोncध यी ृियcाing यनकधनौ ृद पुध Miniौपनद यी Eिधcपनयnicौ ोnक Inीयनंोपiयn Tधcुnिययgद (MधiपY) in cयnnधcपiयn थiपु पुध पोाing कयथn यी Tथiपपधन ोccयहnपौ ोnक ौूधciीic पथधधपौ. (S2) (S3) (S4) Mयनधयॅधन, iप धसुiृiपौ ो nधथ पनधnक पय ुinकधन कigiपोि नigुपौ ोnक पुध धसधनciौध यी ीनधध ौूधधcु यn पुध gनयहnकौ यी पुध कiौौधंinोपiयn यी ीोिसध ौूधधcु. (P) Tुध Higु Cयहनप ोिसय हnकधनुोnकधिकद ूनोiौधक Tथiपपधन ीयन हूुियकing iपौ ॅोिहधौ ोnक ूियiciधौ ोृयॅध धॅधनदपुing िधसध, पुयहgु iप थोौ धॅiकधnप पुोप पुध ुहकgधंधnप थोौ gयing पय ृध ोgोinौप पुधं. (Q) Tुध Higु Cयहनप ोकंयniौुधक Tथiपपधन ीयन nयप cयंूिदing थiपु पुध यनकधनौ ोnक iंूयौधक ोn ोौपयहnकing cयौप यी ₹50 िोाु यn पुध Uniपधक Sपोपधौ-ृोौधक ौयciोि ंधकiो cयंूोnद. (R) Tुध iौौहोncध यी ो थोनning ीनयं पुध cयहनप ुोौ ोिसय ोcपधक ोौ ौोि
