mor, but his lips twisted into a satirical smile.\n  <br>", "option1": "Mostly\n  <br>", "option2": "Most\n  <br>", "option3": "As\n  <br>", "option4": "More\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The most appropriate option to fill in the blank is (d) more.\n  <br>Here's a detailed explanation of why the other options don't fit:\n  <br> \n  <b>Mostly</b>: This option doesn't fit in the context because \"mostly\" suggests a predominance or majority, which doesn't convey the intended meaning of something different than humor.\n  <br> \n  <b>Most</b>: Similar to option (a), \"most\" implies a majority or highest degree, which doesn't align with the intended meaning of something different than humor.\n  <br> \n  <b>As</b>: This option is incorrect because \"as\" is a comparative word that needs a second part to establish a comparison. In the given sentence, there is no second part of the comparison.\n  <br> \n  <b>More</b>: This is the correct option. \"More\" is used to indicate a greater degree or extent. In the sentence, it implies that the glint in the gray eyes is something beyond or different from humor. The use of \"more\" suggests that the glint holds a different quality or characteristic, enhancing the description of the person's expression.\n  <br>Therefore, the most suitable option for the given sentence is (d) more, as it conveys the intended meaning of something different than humor.\n  <br>", "question_heading": ""}, {"sr_no": 82, "question": "Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.\n  <br>A. The season of elections is upon us. \n  <br>B. The Opposition’s search for a winning electoral strategy to challenge the dominance of the Bharatiya Janata Party must \n  <br>C. The state of the nation, riven by endless schisms, dehumanising insensitivity to the human condition, and an accentuated assault on constitutional fundamentals presents an exceptional situation meriting an extraordinary response. \n  <br>D. An objective scrutiny of the state of ‘Naya Bharat and Shreshta Bharat’ lays bare as never before, the nation’s depressing social and political realities.\n  <br>E. contend with the inherent contradictions of a fractured polity that has birthed the disarrayed political parties but which must now come together in a unity of larger purpose. \n  <br>", "option1": "ABECD\n  <br>", "option2": "ACDBE\n  <br>", "option3": "DAECB\n  <br>", "option4": "DABEC \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct order to form a meaningful and coherent paragraph is (a) ABECD.\n  <br> The paragraph discusses the state of the nation, the upcoming elections, and the challenges faced by the opposition party. Let's analyze each sentence:\n  <br> A. \"The season of elections is upon us.\"\n  <br>This sentence sets the context by stating that the election season is approaching.\n  <br> B. \"The Opposition’s search for a winning electoral strategy to challenge the dominance of the Bharatiya Janata Party must...\"\n  <br>This sentence introduces the opposition party's search for an electoral strategy to challenge the dominance of the Bharatiya Janata Party (BJP).\n  <br> E. \"...contend with the inherent contradictions of a fractured polity that has birthed the disarrayed political parties but which must now come together in a unity of larger purpose.\"\n  <br>This sentence highlights the inherent contradictions within the fractured polity and emphasizes the need for disarrayed political parties to come together for a common purpose.\n  <br> C. \"The state of the nation, riven by endless schisms, dehumanizing insensitivity to the human condition, and an accentuated assault on constitutional fundamentals presents an exceptional situation meriting an extraordinary response.\"\n  <br>This sentence describes the state of the nation, emphasizing the endless schisms, dehumanizing insensitivity, and assault on constitutional fundamentals, which demand an extraordinary response.\n  <br> D. \"An objective scrutiny of the state of ‘Naya Bharat and Shreshta Bharat’ lays bare as never before, the nation’s depressing social and political realities.\"\n  <br>This sentence presents the need for an objective scrutiny of the state of the nation, highlighting the depressing social and political realities that are exposed.\n  <br> Putting these sentences together in the order ABECD, we get a coherent and meaningful paragraph that discusses the election season, the challenges faced by the opposition, the fractured polity, and the state of the nation.\n  <br>Therefore, the correct answer is option (a) ABECD.\n  <br>", "question_heading": ""}, {"sr_no": 83, "question": "Select the option that expresses the given sentence in active voice.\n  <br>Give me the book.\n  <br>", "option1": "The book was given by me.\n  <br>", "option2": "Let the book be given by me.\n  <br>", "option3": "Let the book be given to me.\n  <br>", "option4": "The book is given by me.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The given imperative sentence is \"Give me the book.\" In order to transform it into the passive voice, we need to change the structure so that the object becomes the subject and the subject becomes the agent of the action.\n  <br>Let's analyze the options:\n  <br> \n  <b>The book was given by me.</b> - This option correctly transforms the sentence into the passive voice, where the book becomes the subject and \"was given\" indicates the passive voice construction. However, the preposition \"by\" should be followed by the agent of the action, so this option is not suitable.\n  <br> \n  <b>Let the book be given by me.</b> - This option correctly transforms the first half of the sentence into the passive voice using the construction \"let + object + be + past participle.\" The sentence indicates that someone is requesting or allowing the book to be given by the speaker. This option is an incorrect transformation of the sentence into the passive voice since it does not define the receiver and in active voice the subject is asking for the book not giving it to someone else.\n  <br> \n  <b>Let the book be given to me.</b> - This option correctly transforms the sentence into the passive voice using the construction \"\n  <b>let + object + be + past participle.</b>\" The sentence indicates that someone is requesting or allowing the book to be given to the speaker. This option is a correct transformation of the sentence into the passive voice.\n  <br> \n  <b>The book is given by me.</b> - This option does not correctly transform the sentence into the passive voice because the active voice is maintained, and the subject \"book\" is still the subject in the sentence.\n  <br>Therefore, the correct answer is (c) Let the book be given to me, which transforms the imperative sentence into the passive voice.\n  <br>", "question_heading": ""}, {"sr_no": 84, "question": "Select the option that expresses the given sentence in indirect speech.\n  <br>My mother said to me, “Go play in the backyard.”\n  <br>", "option1": "My mother said to me go play in the backyard.\n  <br>", "option2": "My mother told me to play in the backyard.\n  <br>", "option3": "My mother assured me not to play in the backyard.\n  <br>", "option4": "My mother refused me to play in the backyard.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The option that expresses the given sentence in indirect speech is (b) My mother told me to play in the backyard.\n  <br>To convert a sentence from direct speech to indirect speech, you typically follow these rules:\n  <br> Reporting verb: Identify the reporting verb in the direct speech sentence. In this case, the reporting verb is \"said.\"\n  <br> Reporting clause: Introduce the reported speech using an appropriate reporting clause such as \"told,\" \"said to,\" \"asked,\" etc.\n  <br> Change of pronouns and verb forms: Adjust the pronouns and verb forms to match the perspective of the reporting clause.\n  <br>Applying these rules to the given sentence, \"My mother said to me, 'Go play in the backyard',\" the indirect speech transformation is:\n  <br>Direct speech: \"Go play in the backyard.\"\n  <br>Indirect speech: My mother told me to play in the backyard.\n  <br>Explanation of options:\n  <br> \n  <b>My mother said to me go play in the backyard.</b> - This option is incorrect as it presents the reported speech without the appropriate reporting clause and without adjusting the pronouns and verb forms.\n  <br> \n  <b>My mother told me to play in the backyard.</b> - This option correctly presents the reported speech with the reporting clause \"told\" and adjusts the pronouns and verb forms to match the indirect speech.\n  <br> \n  <b>My mother assured me not to play in the backyard.</b> - This option changes the meaning of the original sentence, as \"assured\" implies the opposite of the original directive. It is not an accurate representation of the indirect speech transformation.\n  <br> \n  <b>My mother refused me to not play in the backyard.</b> - This option also changes the meaning of the original sentence, as \"refused\" implies a denial or rejection of the request. It is not an accurate representation of the indirect speech transformation.\n  <br> Therefore, the correct answer is (b) My mother told me to play in the backyard, which accurately represents the given sentence in indirect speech by using the appropriate reporting verb, adjusting the pronouns, and maintaining the correct tense.\n  <br>", "question_heading": ""}, {"sr_no": 85, "question": "Select the appropriate idiom that can replace the highlighted phrase in the following sentence.\n  <br>In the face of adversity, it is often said that \n  <b>cowards</b> falter while the brave endure, however, I believe that even those labelled as cowards have the potential to muster extraordinary courage when pushed to their limits. \n  <br>", "option1": "Fifth wheel \n  <br>", "option2": "Feel blue \n  <br>", "option3": "Yellow bellies \n  <br>", "option4": "Full of beans \n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The appropriate idiom that can replace the highlighted phrase \"labelled as cowards\" in the sentence is (c) Yellow bellies.\n  <br>Here are the meanings of all the options:\n  <br> \n  <b>Fifth wheel</b>: Someone or something that is unnecessary, surplus, or superfluous to a situation or group. It doesn't convey the meaning of being labeled as cowards.\n  <br> \n  <b>Feel blue</b>: To feel sad or depressed. This option doesn't capture the meaning of being labeled as cowards.\n  <br> \n  <b>Yellow bellies</b>: A term used to describe someone who is considered cowardly or lacking courage. It aligns well with the context of the sentence, as it refers to individuals labeled as cowards.\n  <br> \n  <b>Full of beans</b>: To be energetic, lively, or enthusiastic. This idiom doesn't fit the context of being labeled as cowards.\n  <br>Among the options provided, (c) Yellow bellies is the most suitable idiom to replace the highlighted phrase, as it accurately conveys the meaning of individuals who are considered cowards.\n  <br>", "question_heading": ""}, {"sr_no": 86, "question": "<b>Select the option to fill in the blank no. 1. </b> \n  <br>", "option1": "Shared\n  <br>", "option2": "Sharing\n  <br>", "option3": "Share\n  <br>", "option4": "To Share\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘sharing’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>Shared</b>: past tense or past participle of \"share,\" meaning to divide or distribute something among others.\n  <br> \n  <b>Sharing</b>: gerund form of \"share,\" meaning the act of dividing or distributing something among others.\n  <br> \n  <b>Share</b>: base form of the verb, meaning to divide or distribute something among others.\n  <br> \n  <b>To share</b>: infinitive form of the verb, indicating the purpose or intention to divide or distribute something among others.\n  <br>", "question_heading": ""}, {"sr_no": 87, "question": "<b>Select the option to fill in the blank no. 2. </b> \n  <br>", "option1": "They\n  <br>", "option2": "The\n  <br>", "option3": "Them\n  <br>", "option4": "There\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘the’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>They</b>: pronoun referring to multiple people or things as the subject of a sentence.\n  <br> \n  <b>The</b>: definite article used to specify or identify a particular noun.\n  <br> \n  <b>Them</b>: pronoun used as the object of a verb or preposition to refer to multiple people or things.\n  <br> \n  <b>There</b>: adverb used to indicate a place or location.\n  <br>", "question_heading": ""}, {"sr_no": 88, "question": "<b>Select the option to fill in the blank no. 3. </b> \n  <br>", "option1": "For\n  <br>", "option2": "In\n  <br>", "option3": "Of\n  <br>", "option4": "At\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘of’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>For</b>: preposition indicating the purpose, goal, or intended recipient.\n  <br> \n  <b>In</b>: preposition indicating location or inclusion within something.\n  <br> \n  <b>Of</b>: preposition indicating possession, association, or origin.\n  <br> \n  <b>At</b>: preposition indicating location or a specific point in time.\n  <br>", "question_heading": ""}, {"sr_no": 89, "question": "<b>Select the option to fill in the blank no. 4. </b> \n  <br>", "option1": "At\n  <br>", "option2": "For\n  <br>", "option3": "To\n  <br>", "option4": "With\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘to’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>At</b>: preposition indicating location or a specific point in time.\n  <br> \n  <b>For</b>: preposition indicating purpose, benefit, or intended recipient.\n  <br> \n  <b>To</b>: preposition indicating direction or movement towards something or someone.\n  <br> \n  <b>With</b>: preposition indicating association or accompaniment.\n  <br>", "question_heading": ""}, {"sr_no": 90, "question": "<b>Select the option to fill in the blank no. 5. </b> \n  <br>", "option1": "To\n  <br>", "option2": "For\n  <br>", "option3": "Of\n  <br>", "option4": "With\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "Use ‘of’ to fill in the blank.\n  <br>Meanings of the options:\n  <br> \n  <b>To</b>: preposition indicating direction or movement towards something or someone.\n  <br> \n  <b>For</b>: preposition indicating purpose, benefit, or intended recipient.\n  <br> \n  <b>Of</b>: preposition indicating possession, association, or origin.\n  <br> \n  <b>With</b>: preposition indicating association or accompaniment.\n  <br>", "question_heading": ""}, {"sr_no": 91, "question": "What distinguishes a situation of potential injustice for an animal like Susan?\n  <br>", "option1": "The presence of various hurdles, both frivolous and serious, in her life\n  <br>", "option2": "The deliberate destruction of her home by another creature\n  <br>", "option3": "Being free in sanitary conditions \n  <br>", "option4": "The interference of another creature that obstructs her goals\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) The deliberate destruction of her home by another creature.\n  <br>Refer to, \"What, though, if Susan’s home was destroyed deliberately by a creature that ought to have known better?\"\n  <br>", "question_heading": ""}, {"sr_no": 92, "question": "According to Martha Nussbaum, what is the key consideration in determining if Susan, as a non-human animal, has suffered injustice?\n  <br>", "option1": "Whether Susan is capable of understanding the concept of justice\n  <br>", "option2": "The extent to which Susan's suffering is comparable to that of a human being\n  <br>", "option3": "Whether our conception of justice should encompass non-human animals\n  <br>", "option4": "The severity of the hurdles and challenges Susan faces in her life\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (c) Whether our conception of justice should encompass non-human animals.\n  <br>Refer to, \"Should the fact that she is a non-human animal matter? Should not our conception of justice make space for Susan?\"\n  <br>", "question_heading": ""}, {"sr_no": 93, "question": "How does the passage argue for including non-human animals in our conception of justice?\n  <br>", "option1": "By highlighting the similarities between the suffering of humans and non-human animals\n  <br>", "option2": "By suggesting that non-human animals should be granted constitutional rights\n  <br>", "option3": "By emphasizing the need for a more enlightened approach to animal welfare within our legal system\n  <br>", "option4": "By proposing that animals should be considered legal persons with standing in court\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (c) By emphasizing the need for a more enlightened approach to animal welfare within our legal system.\n  <br>Refer to, \"To confer personhood on animals will unquestionably bring with it various vexing quandaries. Should this, though, stop us from seeing the Constitution as a tool for ensuring justice for animals? Is there not enough room available within the abstract guarantees of the Constitution for a more enlightened approach to animal welfare?\"\n  <br>", "question_heading": ""}, {"sr_no": 94, "question": "In what context does the passage mention the Supreme Court of India's involvement in the jallikattu case?\n  <br>", "option1": "To illustrate the court's previous ruling declaring the practice illegal\n  <br>", "option2": "To highlight the court's opportunity to establish a fairer animal welfare code\n  <br>", "option3": "To examine the court's contradictory response to arguments of personhood for animals\n  <br>", "option4": "To showcase the retrograde effort of the court in resolving the conflict\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (b) To highlight the court's opportunity to establish a fairer animal welfare code.\n  <br>Refer to, \"The case offered a signal opportunity for the Court to usher India’s animal welfare code onto a fairer path.\"\n  <br>", "question_heading": ""}, {"sr_no": 95, "question": "How does the Government of Tamil Nadu defend the amendments to the Union law on animal welfare?\n  <br>", "option1": "By asserting the importance of preserving the state's tradition and culture\n  <br>", "option2": "By claiming that the amendments align with the verdict in A. Nagaraja\n  <br>", "option3": "By arguing that animals should be treated as legal persons with fundamental rights\n  <br>", "option4": "By emphasizing the legislative competence of the government to amend the law\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The correct answer is option (a) By asserting the importance of preserving the state's tradition and culture.\n  <br>Refer to, \"The government said the law (which later received the President of India’s assent) was made with a view to preserving the State’s tradition and culture.\"\n  <br>", "question_heading": ""}, {"sr_no": 96, "question": "How does the Supreme Court respond to claims of personhood for animals in the jallikattu case?\n  <br>", "option1": "By conferring fundamental rights on animals similar to those of humans\n  <br>", "option2": "By testing the amending law's reasonableness within the framework of Article 14\n  <br>", "option3": "By asserting that animal rights can only be invoked by juridical entities\n  <br>", "option4": "By declaring that animals cannot be considered legal persons under the Constitution\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) By asserting that animal rights can only be invoked by juridical entities.\n  <br>The relevant lines supporting this answer are: \"But having said this, the Court then claims that the amending law can still be tested on an anvil of reasonableness that is contained in Article 14 of the Constitution. But that right too, it says, cannot be invoked by any animal as a person, but only 'at the instance of a human being or a juridical person who may espouse the cause of animal welfare.'\"\n  <br>", "question_heading": ""}, {"sr_no": 97, "question": "Why does the author find the Court's response to claims of personhood contradictory?\n  <br>", "option1": "The Court suggests that the amending law can be tested on the basis of reasonableness despite denying animal personhood.\n  <br>", "option2": "The Court acknowledges that animals cannot invoke rights but claims they can be protected through human intervention.\n  <br>", "option3": "The Court states that animals cannot enjoy fundamental rights but can still be considered juridical entities.\n  <br>", "option4": "The Court argues that fundamental rights cannot be conferred on animals while invoking Article 14 for testing the law's reasonableness.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) The Court suggests that the amending law can be tested on the basis of reasonableness despite denying animal personhood.\n  <br>The relevant lines supporting this answer are: \"The Court begins by holding that there is no precedent bestowing fundamental rights on animals in India... the Court then claims that the amending law can still be tested on an anvil of reasonableness that is contained in Article 14 of the Constitution.\"\n  <br>", "question_heading": ""}, {"sr_no": 98, "question": "According to the passage, what role should the Constitution play in ensuring animal welfare?\n  <br>", "option1": "The Constitution should explicitly bestow fundamental rights on animals.\n  <br>", "option2": "The Constitution should treat the advancement of animal welfare as a parliamentary prerogative.\n  <br>", "option3": "The Constitution should be interpreted to accommodate basic requirements of animal welfare.\n  <br>", "option4": "The Constitution should exclude animals from considerations of justice and welfare.\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) The Constitution should be interpreted to accommodate basic requirements of animal welfare.\n  <br>The relevant lines supporting this answer are: \"Instead, what we can do is to see how best to mend our conception of rights to partake basic requirements of animal welfare as intrinsic to our constitutional arrangement... we must see it as our collective obligation to extend our commitment to justice not only to human beings but to animals too.\"\n  <br>", "question_heading": ""}, {"sr_no": 99, "question": "How does the author question the Court's approach to animal welfare and constitutional rights?\n  <br>", "option1": "By challenging the Court's assertion that animals are not persons under the Constitution.\n  <br>", "option2": "By suggesting that animal rights should be given equal weight to human rights within the constitutional framework.\n  <br>", "option3": "By criticizing the Court for not thoroughly analyzing the impact of the Tamil Nadu amendments on equal treatment.\n  <br>", "option4": "By questioning whether the Court's contradictory reasoning reflects a fair exercise of judicial power.\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) By suggesting that animal rights should be given equal weight to human rights within the constitutional framework.\n  <br>The relevant lines supporting this answer are: \"The answer to the debate lies not necessarily in seeing animals as persons with standing, or in bestowing on them a set of justiciable rights. Instead, what we can do is to see how best to mend our conception of rights to partake basic requirements of animal welfare as intrinsic to our constitutional arrangement.\"\n  <br>", "question_heading": ""}, {"sr_no": 100, "question": "What does the author argue should be our collective obligation regarding justice?\n  <br>", "option1": "Extending our commitment to justice to both human beings and animals.\n  <br>", "option2": "Prioritizing animal welfare over human rights within our constitutional framework.\n  <br>", "option3": "Pहनौहing ोn ोकॅोncधक िधgोि ीनोंधथयना पुोप नधcयgnप्रधौ ोniंोिस ोौ िधgोि ूधनौयnौ.", "option4": "Rधcयgnप्रing ोniंोिसै ूधनौयnुययक थiपु ीहnकोंधnपोि नigुपौ cयnीधननधक ृद Pोिनiोंधnप.", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) Extending our commitment to justice to both human beings and animals.\n  <br>The relevant lines supporting this answer are: \"Indeed, we must see it as our collective obligation to extend our commitment to justice not only to human beings but to animals too.\"\n  <br>", "question_heading": ""}, {"sr_no": 101, "question": "What is the primary reason behind the continued existence of multilateral groupings like the Non-Aligned Movement (NAM) and G-77, despite losing their relevance?\n  <br>", "option1": "They have managed to adapt to changing geopolitical dynamics.\n  <br>", "option2": "They continue to attract numerous nations seeking admission.\n  <br>", "option3": "The Secretariats of these groupings actively engage in various activities.\n  <br>", "option4": "They maintain their existence for historical and symbolic purposes.\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) They have managed to adapt to changing geopolitical dynamics.\n  <br>The relevant lines supporting this answer are: \"Mysterious are the ways in which multilateral groupings prosper and wither away... The Non-Aligned Movement (NAM) and G-77 had their heyday in the Cold War era. Later they lost their relevance, but they still exist.\"\n  <br>", "question_heading": ""}, {"sr_no": 102, "question": "What led to the increased global economic stress and damaged India-China ties, ultimately impacting the BRICS group?\n  <br>", "option1": "The COVID-19 pandemic, the Galwan clash, and the Ukraine conflict\n  <br>", "option2": "The diminishing power of Russia and policy divergences on China and Myanmar\n  <br>", "option3": "The loss of relevance and policy divergences within the BRICS group\n  <br>", "option4": "The decreased participation and involvement of Brazil and South Africa\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) The COVID-19 pandemic, the Galwan clash, and the Ukraine conflict.\n  <br>The relevant lines supporting this answer are: \"COVID-19, the Galwan clash, and the Ukraine conflict resulted in increased global economic stress, damaged India-China ties, and turned Russia into a diminishing power.\"\n  <br>", "question_heading": ""}, {"sr_no": 103, "question": "How did China manage to bring South Africa into the BRICS group?\n  <br>", "option1": "By gaining support from Brazil and India for including South Africa\n  <br>", "option2": "By playing a trump card and offering South Africa membership in BRIC\n  <br>", "option3": "By convincing South Africa to join BRIC instead of the IBSA group\n  <br>", "option4": "By leveraging its influence and convincing South Africa to join BRICS\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (b) By playing a trump card and offering South Africa membership in BRIC.\n  <br>The relevant lines supporting this answer are: \"Rebuffed, China played a trump card, and decided to bring South Africa into BRIC, thus turning it into BRICS.\"\n  <br>", "question_heading": ""}, {"sr_no": 104, "question": "What were the key areas of focus for the BRICS group in terms of geopolitical and economic dimensions?\n  <br>", "option1": "Strengthening democracy and promoting regional cooperation\n  <br>", "option2": "Launching new initiatives for economic development and cooperation\n  <br>", "option3": "Addressing global and regional issues from a non-western perspective\n  <br>", "option4": "Ensuring the dominating influence of the West is curbed\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (c) Addressing global and regional issues from a non-western perspective.\n  <br>The relevant lines supporting this answer are: \"By articulating a common view on key global and regional issues, it projected a non-western view. This strengthened the world’s march towards multipolarity, thus helping to curb the dominating influence of the West.\"\n  <br>", "question_heading": ""}, {"sr_no": 105, "question": "What does the mention of a frozen formulation in every BRICS communiqué indicate?\n  <br>", "option1": "BRICS group's diplomatic bankruptcy and inability to secure UN Security Council membership\n  <br>", "option2": "The reluctance of China and Russia to fully support Brazil, India, and South Africa's UN aspirations\n  <br>", "option3": "BRICS group's ongoing efforts to enhance their role within the United Nations\n  <br>", "option4": "The lack of progress and cooperation within the IBSA trio of BRICS\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "The answer is (a) BRICS group's diplomatic bankruptcy and inability to secure UN Security Council membership.\n  <br>The relevant lines supporting this answer are: \"A formulation, frozen in time, patronizingly supporting ‘the aspiration’ of Brazil, India, and South Africa to play a greater role in the UN, figures in every BRICS communiqué, showing the grouping’s utter diplomatic bankruptcy.\"\n  <br>", "question_heading": ""}, {"sr_no": 106, "question": "निम्नलिखित कथनों में से कौन सही है?\n  <br>I. विश्व बैंक का मुख्यालय न्यूयॉर्क में है।\n  <br>II. अंतर्राष्ट्रीय मुद्रा कोष (IMF) की स्थापना वर्ष 1944 में हुई थी।\n  <br>", "option1": "केवल II\n  <br>", "option2": "I और II दोनों\n  <br>", "option3": "न तो I और न ही II\n  <br>", "option4": "केवल I\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "पहला कथन गलत है क्योंकि विश्व बैंक का मुख्यालय वाशिंगटन डी.सी. में है, न्यूयॉर्क में नहीं। दूसरा कथन सही है। IMF की स्थापना 1944 में ब्रेटन वुड्स सम्मेलन में की गई थी और आधिकारिक तौर पर 1945 में बनाई गई थी।\n  <br>", "question_heading": ""}, {"sr_no": 107, "question": "सही कथन की पहचान करे।\n  <br>", "option1": "भारतीय रिजर्व बैंक देश के स्वर्ण भंडार का संरक्षक है।\n  <br>", "option2": "भारतीय स्टेट बैंक भारत का केंद्रीय बैंक है।\n  <br>", "option3": "भारतीय रिजर्व बैंक का मुख्यालय मुंबई में है।\n  <br>", "option4": "भारतीय रिजर्व बैंक की स्थापना 1947 में हुई थी।\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "भारतीय रिज़र्व बैंक का मुख्यालय मुंबई में है। यह कथन सही है।\n  <br>आरबीआई देश के विदेशी मुद्रा भंडार का संरक्षक है, सोने के भंडार का नहीं। भारतीय स्टेट बैंक एक वाणिज्यिक बैंक है, केंद्रीय बैंक नहीं। भारत का केंद्रीय बैंक RBI है, जिसकी स्थापना 1947 में नहीं बल्कि 1935 में हुई थी।\n  <br>", "question_heading": ""}, {"sr_no": 108, "question": "इनमें सामान्य तत्व क्या था?\n  <br>(i) जी.डी. बिड़ला\n  <br>(ii) अंबालाल साराभाई और\n  <br>(iii) वालचंद हीराचंद\n  <br>", "option1": "वे भारत में समाजवादी आंदोलन के अग्रणी सदस्य थे।\n  <br>", "option2": "वे भारतीय उद्योगपति थे।\n  <br>", "option3": "वे राष्ट्रवादी नेता थे।\n  <br>", "option4": "उपरोक्त सभी\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "जी.डी. बिड़ला, अंबालाल साराभाई और वालचंद हीराचंद के बीच आम बात यह है कि वे भारतीय उद्योगपति थे। इसलिए, सही उत्तर (b) है, वे भारतीय उद्योगपति थे।\n  <br>वालचंद हीराचंद दोशी एक भारतीय उद्योगपति और वालचंद समूह के संस्थापक थे। उन्होंने भारत का पहला आधुनिक शिपयार्ड, पहला विमान कारखाना और पहला कार कारखाना स्थापित किया। वह 26 मई 1936 के बॉम्बे मेनिफेस्टो के हस्ताक्षरकर्ता भी थे, जिसने जवाहरलाल नेहरू के समाजवादी और मार्क्सवादी विचारों का विरोध किया था।\n  <br>अंबालाल साराभाई अहमदाबाद में एक भारतीय उद्योगपति थे। उन्होंने भारत के स्वतंत्रता आंदोलनों में भी भाग लिया। साराभाई साराभाई टेक्सटाइल्स, केलिको टेक्सटाइल मिल्स, साराभाई केमिकल्स और अन्य जैसी साराभाई समूह की कंपनियों के संस्थापक थे। अंबालाल साराभाई मिल मालिकों में से एक थे और अहमदाबाद मिल ओनर्स एसोसिएशन के अध्यक्ष थे, जिसकी स्थापना 1891 में अहमदाबाद में कपड़ा उद्योग को विकसित करने के लिए की गई थी।\n  <br>बिड़ला को अक्सर 'राष्ट्रवादी व्यवसायी' के रूप में जाना जाता है, जिन्होंने देश के स्वतंत्रता संग्राम में भाग लिया था। उन्होंने स्वतंत्रता आंदोलन का आर्थिक रूप से भी समर्थन किया।\n  <br>", "question_heading": ""}, {"sr_no": 109, "question": "<p>निम्नलिखित में से किसने भारतीय कृषि सेवा आरम्भ की?</p>", "option1": "<p>लॉर्ड कर्जन</p>", "option2": "<p>विलियम बेंटिक</p>", "option3": "<p>लॉर्ड मिंटो</p>", "option4": "<p>लॉर्ड रिपन</p>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<p>लॉर्ड मिंटो द्वितीय ने 1906 में भारतीय कृषि सेवा आरम्भ की। इसलिए, सही उत्तर (c) लॉर्ड मिंटो है।<br />\n1899-1900 के भीषण अकाल के दौरान, भारत के तत्कालीन वायसराय लॉर्ड कर्जन को विश्वास था कि भारत सरकार को लगातार अकालों से होने वाले नुकसान को दूर करने के लिए कृषि क्षेत्र पर तत्काल ध्यान केंद्रित करना चाहिए।<br />\nपरिणामस्वरूप, कृषि अनुसंधान संस्थान (अब भारतीय कृषि अनुसंधान संस्थान (IARI)), उन्नत कृषि प्रशिक्षण के लिए एक कॉलेज के साथ, वर्ष 1905 में पूसा में स्थापित किया गया था और इसके निदेशक 1929 तक भारत सरकार के कृषि सलाहकार थे। 1936 में इसे दिल्ली स्थानांतरित कर दिया गया।</p>", "question_heading": ""}, {"sr_no": 110, "question": "'तत्त्वबोधिनी सभा' की स्थापना किसके द्वारा की गई थी?\n  <br>", "option1": "1839 में देवेन्द्रनाथ टैगोर\n  <br>", "option2": "1857 में केशव चंद्र सेन\n  <br>", "option3": "1850 में अक्षय कुमार दत्त\n  <br>", "option4": "1840 में द्वारकानाथ टैगोर\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "तत्त्वबोधिनी सभा 6 अक्टूबर 1839 को कलकत्ता में देवेन्द्रनाथ टैगोर द्वारा ब्रह्म समाज, हिंदू धर्म और भारतीय समाज के सुधारकों के एक अलग समूह के रूप में आरम्भ किया गया एक समूह था।\n  <br>सभा का मुख्य उद्देश्य वेदांत, उपनिषद जो वेदों का अंतिम भाग है, पर आधारित हिंदू धर्म के अधिक तर्कसंगत और मानवतावादी रूप को बढ़ावा देना था।\n  <br>सभा ने तत्त्वबोधिनी पत्रिका नामक एक पत्रिका प्रकाशित की, जिसने हिंदू धर्म के तर्कसंगत और मानवतावादी रूप को बढ़ावा दिया।\n  <br>", "question_heading": ""}, {"sr_no": 111, "question": "कान्हा राष्ट्रीय उद्यान विश्व के निम्नलिखित जैव-भौगोलिक क्षेत्रों में से किस एक से संबंधित है?\n  <br>", "option1": "उष्णकटिबंधीय उप-आर्द्र वन\n  <br>", "option2": "उष्णकटिबंधीय आर्द्र वन\n  <br>", "option3": "उष्णकटिबंधीय शुष्क वन\n  <br>", "option4": "उष्णकटिबंधीय नम वन\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही जवाब (c) है। कान्हा राष्ट्रीय उद्यान विश्व के उष्णकटिबंधीय शुष्क वन जैव-भौगोलिक क्षेत्र के अंतर्गत आता है।\n  <br>कान्हा राष्ट्रीय उद्यान मध्य भारतीय राज्य मध्य प्रदेश में स्थित है। यह घास के मैदान और जंगल का एक विशाल विस्तार है, और यह बंगाल टाइगर, भारतीय तेंदुए और बारासिंघा सहित विभिन्न प्रकार के वन्यजीवों का घर है।\n  <br>उष्णकटिबंधीय शुष्क वन जैव-भौगोलिक क्षेत्र की विशेषता इसकी गर्म, शुष्क जलवायु है। इन जंगलों में पेड़ आमतौर पर पर्णपाती होते हैं, जिसका अर्थ है कि शुष्क मौसम के दौरान वे अपने पत्ते खो देते हैं। इन वनों में वनस्पति भी आम तौर पर विरल होती है, जिनमें खुले घास के मैदान के बड़े क्षेत्र होते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 112, "question": "भारत के दक्षिण पश्चिम मानसून के निर्माण का संबंध 'अल नीनो' से है\n  <br>", "option1": "एक असामान्य रूप से गर्म समुद्री धारा\n  <br>", "option2": "एक आवधिक गर्म वायु-राशि\n  <br>", "option3": "एक आवधिक गर्म हवा\n  <br>", "option4": "एक आवधिक निम्न दबाव केंद्र\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (a) है। अल नीनो एक असामान्य रूप से गर्म समुद्री धारा है जो प्रशांत महासागर में उत्पन्न होती है।\n  <br>यह भारत के दक्षिण पश्चिम मानसून के निर्माण से जुड़ा है क्योंकि यह व्यापारिक हवाओं को कमजोर कर देता है जो आम तौर पर प्रशांत महासागर में पूर्व से पश्चिम की ओर चलती हैं।\n  <br>व्यापारिक हवाओं के कमजोर होने से पश्चिमी प्रशांत महासागर से गर्म पानी पूर्व की ओर बहने लगता है, जो भारत में मानसून पैटर्न को बाधित करता है।\n  <br>", "question_heading": ""}, {"sr_no": 113, "question": "निम्नलिखित में से कौन सा एक आग्नेय चट्टान नहीं है?\n  <br>", "option1": "ग्रेनाइट\n  <br>", "option2": "बेसाल्ट\n  <br>", "option3": "गैब्रो\n  <br>", "option4": "गनीस\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br>नीस एक रूपांतरित चट्टान है जो कायापलट की प्रक्रिया से बनी है, जबकि ग्रेनाइट, बेसाल्ट और गैब्रो सभी आग्नेय चट्टानों के उदाहरण हैं।\n  <br>आग्नेय चट्टान (लैटिन शब्द इग्निस से लिया गया है जिसका अर्थ है आग), या मैग्मैटिक चट्टान, तीन मुख्य चट्टानों में से एक है, अन्य तलछटी और रूपांतरित हैं। आग्नेय चट्टान का निर्माण मैग्मा या लावा के ठंडा होने और जमने से होता है।\n  <br>", "question_heading": ""}, {"sr_no": 114, "question": "भारतीय रेलवे के संबंध में निम्नलिखित में से कौन सा कथन सही नहीं है?\n  <br>", "option1": "भारतीय रेल नेटवर्क पूरे कोंकण तट पर विकसित किया गया है।\n  <br>", "option2": "हिमालय क्षेत्र में रेलवे लाइनों का घनत्व बहुत कम है।\n  <br>", "option3": "उत्तर भारतीय मैदान में रेलवे का घना नेटवर्क है।\n  <br>", "option4": "वर्तमान में, भारत में दुनिया का सबसे बड़ा रेलवे नेटवर्क है।\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "उत्तर (d) है। भारत के पास विश्व का सबसे बड़ा रेलवे नेटवर्क नहीं है। वह शीर्षक संयुक्त राज्य अमेरिका का है। संयुक्त राज्य अमेरिका, चीन और रूस के बाद भारत का रेलवे नेटवर्क विश्व में चौथा सबसे बड़ा है।\n  <br>आकार के हिसाब से भारतीय रेलवे विश्व की चौथी सबसे बड़ी राष्ट्रीय रेलवे प्रणाली है, जिसकी कुल रूट लंबाई, 31 मार्च 2022 तक 68,043 किमी (42,280 मील), रनिंग ट्रैक लंबाई 102,831 किमी (63,896 मील) और ट्रैक लंबाई 128,305 किमी (79,725 मील) है। \n  <br>सरकार ने 2023-24 तक भारत के संपूर्ण रेल नेटवर्क को विद्युतीकृत करने और 2030 तक \"शुद्ध शून्य\" (कार्बन उत्सर्जन) रेलवे\" बनने के लिए प्रतिबद्ध किया है।\n  <br>अन्य कथन सही हैं:\n  <br> भारतीय रेल नेटवर्क पूरे कोंकण तट पर विकसित किया गया है।\n  <br> हिमालय क्षेत्र में रेलवे लाइनों का घनत्व बहुत कम है।\n  <br> उत्तर भारतीय मैदान में रेलवे का घना नेटवर्क है।\n  <br>", "question_heading": ""}, {"sr_no": 115, "question": "निम्नलिखित में से कौन सा भारतीय शहर नदी तट पर स्थित नहीं है?\n  <br>", "option1": "आगरा\n  <br>", "option2": "भागलपुर\n  <br>", "option3": "भोपाल\n  <br>", "option4": "कानपुर\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "आगरा भारत में उत्तर प्रदेश राज्य का एक शहर है जो यमुना नदी के तट पर स्थित है। भागलपुर भारत के बिहार राज्य में गंगा नदी के दक्षिणी तट पर स्थित एक ऐतिहासिक महत्व का शहर है। कानपुर, कानपुर नगर जिले और कानपुर मंडल का प्रशासनिक मुख्यालय है। यह गंगा नदी के पश्चिमी तट पर स्थित है। हालाँकि, भोपाल किसी नदी के किनारे पर स्थित नहीं है। यह मध्य भारत में मालवा पठार पर स्थित है और शहर से होकर सीधे कोई नदी नहीं बहती है।\n  <br>", "question_heading": ""}, {"sr_no": 116, "question": "संविधान सभा का विचार पहली बार किसके द्वारा सामने रखा गया था?\n  <br>", "option1": "एम.एन. रॉय\n  <br>", "option2": "डॉ. बी. आर. अम्बेडकर\n  <br>", "option3": "डॉ. राजेंद्र प्रसाद\n  <br>", "option4": "सरदार वल्लभभाई पटेल\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "संविधान सभा का विचार सबसे पहले 1934 में एम.एन. द्वारा प्रस्तावित किया गया था। रॉय. हालाँकि, वास्तविक संविधान सभा का गठन 1946 में कैबिनेट मिशन योजना के आधार पर किया गया था। इसलिए, विकल्प (a) सही है।\n  <br>", "question_heading": ""}, {"sr_no": 117, "question": "निम्नलिखित में से कौन सा सही सुमेलित नहीं है।\n  <br>", "option1": "मौलिक अधिकार - भाग III\n  <br>", "option2": "राज्य - भाग VI\n  <br>", "option3": "नागरिकता - भाग II\n  <br>", "option4": "मौलिक कर्तव्य - भाग VI - A\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<b> </b>मौलिक कर्तव्यों से संबंधित प्रावधान संविधान के भाग IV-A में शामिल हैं। यह भाग 42वें संशोधन अधिनियम, 1976 द्वारा संविधान में जोड़ा गया था। इसलिए, विकल्प (d) गलत है, अन्य सभी विकल्प सही ढंग से मेल खाते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 118, "question": "निम्नलिखित में से कौन सा कारक हमारे संविधान के विशाल आकार के लिए जिम्मेदार है/हैं?\n  <br>", "option1": "भौगोलिक कारक\n  <br>", "option2": "ऐतिहासिक कारक\n  <br>", "option3": "संविधान सभा में कानूनी विशेषज्ञों का प्रभुत्व\n  <br>", "option4": "उपरोक्त सभी\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "ऐसे कई कारक हैं, जो हमारे संविधान के विशाल आकार के लिए जिम्मेदार हैं। जैसे - भौगोलिक कारक यानि देश की विशालता और उसकी विविधता। ऐतिहासिक कारक जैसे भारत सरकार अधिनियम 1935 का प्रभाव, जो बहुत भारी था। केंद्र और राज्य दोनों के लिए एक ही संविधान था और संविधान सभा में कानूनी विशेषज्ञों की प्रबल शक्ति थी, जो सबसे लंबे संविधान के लिए भी जिम्मेदार थी। इनके अलावा और भी कारण हैं. अतः, दिए गए सभी विकल्प सही हैं।\n  <br>", "question_heading": ""}, {"sr_no": 119, "question": "उपभोक्ताओं द्वारा नए कार्बनिक पदार्थ के निर्माण की दर को आप क्या कहते हैं?\n  <br>", "option1": "तृतीयक उत्पादकता\n  <br>", "option2": "प्राथमिक उत्पादकता\n  <br>", "option3": "शुद्ध उत्पादकता\n  <br>", "option4": "माध्यमिक उत्पादकता\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "द्वितीयक उत्पादकता\n  <br> प्राथमिक उत्पादकता वह प्रक्रिया है जहां सरल कार्बनिक पदार्थों का उत्पादन करने के लिए जीवों द्वारा अकार्बनिक पदार्थों को संश्लेषित किया जाता है। इस घटना के लिए प्राथमिक उत्पादक या स्वपोषी जिम्मेदार हैं। प्राथमिक उत्पादकों के सामान्य उदाहरणों में डायटम, डाइनोफ्लैगलेट्स और कोकोलिथोफोरस शामिल हैं।\n  <br> उपभोक्ताओं द्वारा कार्बनिक पदार्थ का उत्पादन द्वितीयक उत्पादकता कहलाता है। द्वितीयक उत्पादकता में, ऊर्जा खाद्य श्रृंखला के माध्यम से ऊर्जा के हस्तांतरण द्वारा प्राप्त की जाती है।\n  <br> नए बायोमास (भार) की मात्रा जो एक निश्चित अवधि में मांस खाने वाले जानवरों (मांसाहारी) द्वारा उत्पन्न होती है।\n  <br>", "question_heading": ""}, {"sr_no": 120, "question": "अग्न्याशय रस में कौन सा एंजाइम वसा को तोड़ने में सहायता करता है?\n  <br>", "option1": "प्रोटीज\n  <br>", "option2": "पेप्सिन\n  <br>", "option3": "लाइपेज\n  <br>", "option4": "एमाइलेज\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "लाइपेज एक एंजाइम है जो वसा को फैटी एसिड और ग्लिसरॉल में तोड़ देता है। यह अग्न्याशय द्वारा स्रावित होता है और अग्न्याशय रस में पाया जाता है। लाइपेज छोटी आंत में भी पाया जाता है, जहां यह भोजन से वसा को पचाने में मदद करता है।\n  <br>लाइपेज एक पानी में घुलनशील एंजाइम है, जिसका अर्थ है कि यह केवल जलीय वातावरण में ही काम कर सकता है। अग्न्याशय लाइपेस को निष्क्रिय रूप में स्रावित करता है जिसे प्रोलिपेज़ कहा जाता है। प्रोलिपेज़ पित्त लवण द्वारा सक्रिय होता है, जो यकृत द्वारा निर्मित होता है।\n  <br> \n  <b>प्रोटीज़</b> एक एंजाइम है जो प्रोटीन को तोड़ता है। यह अग्न्याशय और छोटी आंत में पाया जाता है। प्रोटीज़ शरीर को प्रोटीन पचाने में मदद करता है।\n  <br> \n  <b>पेप्सिन</b> एक प्रोटीज़ है जो पेट में पाया जाता है। पेप्सिन पेट में प्रोटीन को पचाने में शरीर की मदद करता है।\n  <br> \n  <b>एमाइलेज़</b> एक एंजाइम है जो कार्बोहाइड्रेट को तोड़ता है। यह लार और अग्न्याशय में पाया जाता है। एमाइलेज शरीर को मुंह और छोटी आंत में कार्बोहाइड्रेट को पचाने में मदद करता है।\n  <br>", "question_heading": ""}, {"sr_no": 121, "question": "बकमिनस्टरफुलरीन एक नैनो-कण है जो गोलाकार ज्यामिति और खोखले आंतरिक भाग की विशेषता रखता है जिसमें कितने कार्बन परमाणु होते हैं?\n  <br>", "option1": "60\n  <br>", "option2": "50\n  <br>", "option3": "40\n  <br>", "option4": "70\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "60 कार्बन परमाणु\n  <br> बकमिनस्टरफुलरीन एक गोलाकार अणु है जिसमें 60 कार्बन परमाणु कार्बन परमाणुओं के हेक्सागोनल और पेंटागोनल रिंगों को इंटरलॉकिंग में व्यवस्थित करते हैं।\n  <br>  कार्बन अपनी संयोजकता के कारण कई अपररूप (एक ही तत्व के संरचनात्मक रूप से भिन्न रूप) बनाने में सक्षम है।\n  <br> कार्बन के प्रसिद्ध रूपों में हीरा और ग्रेफाइट शामिल हैं।\n  <br> हाल के दशकों में, कई और एलोट्रोप की खोज की गई है और उन पर शोध किया गया है, जिनमें गेंद के आकार जैसे बकमिनस्टरफुलरीन और ग्राफीन जैसी शीट शामिल हैं।\n  <br> ग्रेफाइट, हीरा और बकमिनस्टरफुलरीन कार्बन के तीन अलग-अलग रूप हैं।\n  <br>", "question_heading": ""}, {"sr_no": 122, "question": "एक तटस्थ घोल का pH ______ होता है।\n  <br>", "option1": "7\n  <br>", "option2": "0\n  <br>", "option3": "8\n  <br>", "option4": "14\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "pH7\n  <br> pH इस बात का माप है कि पानी कितना अम्लीय/क्षारीय है। सीमा 0 - 14 तक होती है, जिसमें 7 तटस्थ होता है। 7 से कम का pH अम्लता को दर्शाता है, जबकि 7 से अधिक का pH एक आधार को इंगित करता है।\n  <br> ऐसा होता है कि pH 7 पर, H+ और OH- की सांद्रता बराबर होती है। यही कारण है कि pH 7 को तटस्थ pH माना जाता है। pH 7 से नीचे, H+ की सांद्रता OH- की सांद्रता से अधिक है, जिससे पानी अम्लीय हो जाता है।\n  <br> 7.0 से नीचे की कोई भी चीज़ अम्लीय होती है, और 7.0 से ऊपर की कोई भी चीज़ क्षारीय या क्षारीय होती है।\n  <br>", "question_heading": ""}, {"sr_no": 123, "question": "निम्नलिखित में से कौन सा RNA का एक प्रकार नहीं है?\n  <br>", "option1": "मैसेंजर RNA (mRNA)\n  <br>", "option2": "ट्रांसफर RNA (tRNA)\n  <br>", "option3": "राइबोसोमल RNA (rRNA)\n  <br>", "option4": "प्लाज्मा RNA (pRNA)\n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "सही उत्तर (d) प्लाज्मा RNA (pRNA) है। RNA के तीन मुख्य प्रकार हैं: मैसेंजर RNA (mRNA), ट्रांसफर RNA (tRNA), और राइबोसोमल RNA (rRNA). प्लाज्मा RNA (pRNA), RNA का एक मान्यता प्राप्त प्रकार नहीं है।\n  <br> मैसेंजर RNA (mRNA): यह RNA का प्रकार है जो आनुवंशिक जानकारी को डीएनए से राइबोसोम तक ले जाता है, जहां इसे प्रोटीन में अनुवादित किया जाता है।\n  <br> स्थानांतरण RNA (tRNA): यह RNA का प्रकार है जो अमीनो एसिड को राइबोसोम में ले जाता है, जहां वे प्रोटीन में इकट्ठे होते हैं।\n  <br> राइबोसोमल RNA (rRNA): यह RNA का प्रकार है जो राइबोसोम बनाता है, अंग जो प्रोटीन संश्लेषण के लिए जिम्मेदार होते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 124, "question": "480MW की क्षमता वाली हाल ही में लॉन्च की गई फुकोट करनाली हाइड्रो इलेक्ट्रिक परियोजना कहाँ स्थित है?\n  <br>", "option1": "भारत\n  <br>", "option2": "नेपाल\n  <br>", "option3": "भूटान\n  <br>", "option4": "श्रीलंका\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "480MW की स्थापित क्षमता वाली हाल ही में लॉन्च की गई फुकोट करनाली हाइड्रो इलेक्ट्रिक परियोजना नेपाल में स्थित है।\n  <br> परियोजना का लक्ष्य बिजली उत्पादन के लिए करनाली नदी के प्रवाह का उपयोग करना है, और उत्पन्न बिजली को नेपाल की बिजली प्रणाली में एकीकृत किया जाएगा।\n  <br> इस परियोजना के विकास के लिए नई दिल्ली में एनएचपीसी लिमिटेड और नेपाल की विद्युत उत्पादन कंपनी लिमिटेड (VUCL) के बीच प्रधान मंत्री मोदी और नेपाल के प्रधान मंत्री पुष्प कमल दहल 'प्रचंड' दोनों की उपस्थिति में समझौता ज्ञापन पर हस्ताक्षर किए गए।\n  <br>", "question_heading": ""}, {"sr_no": 125, "question": "GOBARdhan पोर्टल का पूर्ण रूप क्या है, जिसे हाल ही में जल शक्ति मंत्रालय द्व ", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "जॉर्जी गोस्पोडिनोव और एंजेला रोडेल ने अपनी पुस्तक 'टाइम शेल्टर' के लिए 2023 अंतर्राष्ट्रीय बुकर पुरस्कार जीता।\n  <br> यह पुरस्कार जीतने वाली बल्गेरियाई भाषा की पहली पुस्तक भी है।\n  <br> अंतर्राष्ट्रीय बुकर पुरस्कार (पहले मैन बुकर अंतर्राष्ट्रीय पुरस्कार के रूप में जाना जाता था) यूनाइटेड किंगडम में आयोजित एक अंतर्राष्ट्रीय साहित्यिक पुरस्कार है।\n  <br> गीतांजलि श्री और डेज़ी रॉकवेल अपने उपन्यास टॉम्ब ऑफ सैंड के लिए पिछले वर्ष की विजेता हैं।\n  <br>", "question_heading": ""}, {"sr_no": 128, "question": "हाल ही में किन देशों ने 'टाइगर शार्क 40' नामक संयुक्त नौसैनिक ड्रिल अभ्यास आरम्भ किया है?\n  <br>", "option1": "बांग्लादेश और भारत\n  <br>", "option2": "बांग्लादेश और श्रीलंका\n  <br>", "option3": "बांग्लादेश और संयुक्त राज्य अमेरिका\n  <br>", "option4": "बांग्लादेश और म्यांमार\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "वर्तमान में \"टाइगर शार्क 40\" का आयोजन बांग्लादेश और संयुक्त राज्य अमेरिका के बीच एक संयुक्त नौसैनिक ड्रिल अभ्यास है।\n  <br> इसकी शुरुआत चट्टोग्राम में बीएनएस निर्विक में हुई जिसमें बांग्लादेश सेना और नौसेना के साथ-साथ अमेरिकी विशेष बलों की भागीदारी भी शामिल है।\n  <br> कमोडोर स्वॉर्ड्स कमांड इस प्रशिक्षण अभ्यास के प्रबंधन के लिए जिम्मेदार है।\n  <br>", "question_heading": ""}, {"sr_no": 129, "question": "अंतर्राष्ट्रीय भारतीय फिल्म अकादमी पुरस्कार (IIFA) 2023 में किस फिल्म ने सर्वश्रेष्ठ फिल्म का पुरस्कार जीता?\n  <br>", "option1": "दृश्यम 2\n  <br>", "option2": "विक्रम वेधा\n  <br>", "option3": "गंगूबाई काठियावाड़ी\n  <br>", "option4": "रॉकेट्री: द नांबी इफ़ेक्ट\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "अंतर्राष्ट्रीय भारतीय फिल्म अकादमी पुरस्कार (IIFA) 2023 में सर्वश्रेष्ठ फिल्म का पुरस्कार दृश्यम 2 ने जीता।\n  <br> ऋतिक रोशन ने विक्रम वेधा में अपने अभिनय के लिए सर्वश्रेष्ठ अभिनेता का पुरस्कार जीता।\n  <br> आलिया भट्ट ने गंगूबाई काठियावाड़ी के लिए सर्वश्रेष्ठ अभिनेता (महिला) का पुरस्कार जीता।\n  <br> आर माधवन ने रॉकेट्री: द नांबी इफेक्ट के लिए सर्वश्रेष्ठ निर्देशक का पुरस्कार जीता।\n  <br>", "question_heading": ""}, {"sr_no": 130, "question": "2023 में मलेशिया मास्टर्स सुपर 500 बैडमिंटन टूर्नामेंट में अपना पहला BWF विश्व टूर खिताब किसने जीता?\n  <br>", "option1": "एच.एस. प्रणय\n  <br>", "option2": "वेंग होंग यांग\n  <br>", "option3": "अकाने यामागुची\n  <br>", "option4": "कांग मिन-ह्युक\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "एच.एस. विश्व में 9वें नंबर के भारतीय शटलर प्रणॉय ने 2023 में मलेशिया मास्टर्स सुपर 500 बैडमिंटन टूर्नामेंट में अपना पहला बीडब्ल्यूएफ वर्ल्ड टूर खिताब जीता।\n  <br> फाइनल में उन्होंने चीन के वेंग होंग यांग को रोमांचक मुकाबले में 21-19, 13-21, 21-18 के स्कोर से हराया.\n  <br> एच.एस. प्रणय ने इससे पहले 2017 यूएस ओपन में खिताब जीता था।\n  <br> महिला एकल वर्ग में अकाने यामागुची विजेता बनकर उभरीं।\n  <br> कांग मिन-ह्युक और सियो सेउंग-जे ने पुरुष युगल वर्ग में खिताब हासिल किया।\n  <br> महिला युगल वर्ग में बाक हा-ना और ली सो-ही विजेता रहीं।\n  <br> मिश्रित युगल वर्ग में डेचापोल पुवारानुक्रोह और सपसिरी टेराटनाचाई ने जीत हासिल की।\n  <br>", "question_heading": ""}, {"sr_no": 131, "question": "सिंपल नेटवर्क मैनेजमेंट प्रोटोकॉल (SNMP) के संदर्भ में, निम्नलिखित में से कौन सा कथन गलत है? \n  <br>I. SNMP नेटवर्क लेयर का एक प्रोटोकॉल है जिसका उपयोग नेटवर्क की निगरानी के लिए किया जाता है।\n  <br>II. SNMP प्रोटोकॉल कई स्थानीय उपकरणों जैसे राउटर, स्विच, सर्वर और फायरवॉल में निहित है।\n  <br>", "option1": "केवल I \n  <br>", "option2": "केवल II \n  <br>", "option3": "I और II दोनों\n  <br>", "option4": "न तो I और न ही II\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> SNMP का अर्थ सरल नेटवर्क प्रबंधन प्रोटोकॉल है, और यह नेटवर्क वाले उपकरणों के प्रबंधन और निगरानी के लिए एक एप्लिकेशन लेयर प्रोटोकॉल है।\n  <br> कई स्थानीय डिवाइस, जैसे राउटर, स्विच, सर्वर, फ़ायरवॉल और वायरलेस एक्सेस पॉइंट, एसएनएमपी प्रोटोकॉल का उपयोग करते हैं, जिसे उनके आईपी एड्रेस द्वारा एक्सेस किया जा सकता है।\n  <br> इसे लागू करने के लिए यूजर डेटाग्राम प्रोटोकॉल (UDP) का उपयोग किया जाता है।\n  <br> यूडीपी एक कनेक्शन रहित प्रोटोकॉल है जो ट्रांसमिशन कंट्रोल प्रोटोकॉल (TCP) के समान कार्य करता है लेकिन इसमें त्रुटि-जांच या पुनर्प्राप्ति सेवाओं की आवश्यकता नहीं होती है।\n  <br>", "question_heading": ""}, {"sr_no": 132, "question": "स्वाइप कमांड मुख्य रूप से निम्नलिखित में से किस डिवाइस के साथ प्रयोग किया जाता है?\n  <br>", "option1": "माउस\n  <br>", "option2": "प्रिंटर\n  <br>", "option3": "टचस्क्रीन\n  <br>", "option4": "स्कैनर\n  <br>", "answer": "3", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> स्वाइप एक कमांड है जिसका उपयोग आमतौर पर स्मार्टफोन और टैबलेट जैसे टचस्क्रीन डिवाइस पर किया जाता है।\n  <br> ट्रैकपैड वाले कुछ लैपटॉप और ट्रैकपैड इनपुट वाले डेस्कटॉप पीसी भी इसका समर्थन करते हैं।\n  <br> स्वाइप तब होता है जब आप अपनी उंगली को टचस्क्रीन या ट्रैकपैड पर तेजी से घुमाते हैं।\n  <br> फोटो देखने वाले ऐप में, उदाहरण के लिए, स्क्रीन को दाएं से बाएं स्वाइप करने पर सामान्यतः अगली तस्वीर प्रदर्शित होती है।\n  <br> आप अधिकांश स्मार्टफ़ोन पर बाएँ या दाएँ स्वाइप करके भी होम स्क्रीन के बीच स्विच कर सकते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 133, "question": "सर्वलेट, जो वेब आधारित अनुप्रयोगों के निर्माण के लिए मंच-स्वतंत्र पद्धति प्रदान करते हैं, किस भाषा में लिखे गए हैं?\n  <br>", "option1": "ASP\n  <br>", "option2": "C#\n  <br>", "option3": "Python\n  <br>", "option4": "Java\n  <br> \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> सर्वलेट एक जावा वेब एप्लिकेशन है जो सर्वर पर चलता है।\n  <br> यह एक एप्लेट के समान है, लेकिन क्लाइंट के पीसी पर संसाधित होने के बजाय, यह सर्वर पर संसाधित होता है।\n  <br> जब कोई उपयोगकर्ता किसी लिंक पर क्लिक करता है, एक फॉर्म भरता है, या किसी वेबसाइट पर कोई अन्य कार्रवाई करता है, तो सर्वलेट अक्सर लागू होते हैं।\n  <br> सर्वलेट गतिशील वेबपेज बनाने और आगंतुकों द्वारा भेजे गए डेटा को संसाधित करने के लिए वेब डेवलपर्स के लिए उपलब्ध कई टूल में से एक है।\n  <br> सर्वलेट्स उन प्रोग्रामर्स के लिए वेब एप्लिकेशन बनाना आसान बनाते हैं जो पहले से ही जावा प्रोग्रामिंग भाषा से परिचित हैं।\n  <br>", "question_heading": ""}, {"sr_no": 134, "question": "निम्नलिखित में से कौन सा डिवाइस USB पोर्ट से लैस नहीं है?\n  <br>", "option1": "इंटरनल हार्ड ड्राइव \n  <br>", "option2": "एक्सटर्नल हार्ड ड्राइव\n  <br>", "option3": "प्रिंटर\n  <br>", "option4": "डिजिटल कैमरा\n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> इंटरनल हार्ड ड्राइव डिवाइस USB पोर्ट से लैस नहीं है।\n  <br> आज के पीसी में कंप्यूटर पोर्ट का सबसे प्रचलित रूप यूनिवर्सल सीरियल बस (यूएसबी) है।\n  <br> कीबोर्ड, माउस, गेम कंट्रोलर, प्रिंटर, स्कैनर, डिजिटल कैमरा और रिमूवेबल मीडिया ड्राइव सभी को इससे जोड़ा जा सकता है।\n  <br> आप एक ही यूएसबी पोर्ट में 127 पेरिफेरल्स जोड़ सकते हैं और कुछ यूएसबी हब की मदद से उन सभी का एक साथ उपयोग कर सकते हैं।\n  <br> पुराने पोर्ट, जैसे सीरियल और समानांतर कनेक्टर, यूएसबी की तुलना में धीमे हैं।\n  <br>", "question_heading": ""}, {"sr_no": 135, "question": "किसी सॉफ्टवेयर या कंप्यूटर सिस्टम में त्रुटि या दोष की पहचान करने और उसका समाधान करने की प्रक्रिया को __________ के रूप में जाना जाता है।\n  <br>", "option1": "हैकिंग\n  <br>", "option2": "स्पैमिंग\n  <br>", "option3": "डिफ्रैगिंग\n  <br>", "option4": "ट्रबलशूटिंग \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> किसी समस्या के स्रोत का निदान करने की प्रक्रिया को समस्या निवारण के रूप में जाना जाता है।\n  <br> इसका उपयोग हार्डवेयर, सॉफ़्टवेयर और कई अन्य सामानों से संबंधित समस्याओं के निवारण के लिए किया जाता है।\n  <br> जब कोई कंप्यूटर या प्रोग्राम खराब हो जाता है, अनुत्तरदायी हो जाता है, या असामान्य व्यवहार करता है, तो उसकी मरम्मत की जा सकती है और उसे बहाल किया जा सकता है।\n  <br> समस्या निवारण का उपयोग किसी सिस्टम या प्रोग्राम को वांछित स्थिति में रखने के लिए किया जाता है, खासकर जब यह किसी समस्या का सामना करता है या प्रदर्शित करता है।\n  <br>", "question_heading": ""}, {"sr_no": 136, "question": "FSB, CPU को निम्नलिखित में से किस अन्य घटक से जोड़ता है?\n  <br>", "option1": "PCI कार्ड\n  <br>", "option2": "RAM\n  <br>", "option3": "SSD\n  <br>", "option4": "HDD \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> फ्रंटसाइड बस (FSB) प्रोसेसर को सिस्टम मेमोरी (FSB) और अन्य मदरबोर्ड घटकों से जोड़ती है।\n  <br> सिस्टम चिपसेट, एजीपी कार्ड, पीसीआई डिवाइस और अन्य बाह्य उपकरण इन घटकों में से हैं।\n  <br> एफएसबी को \"सिस्टम बस\" के रूप में भी जाना जाता है क्योंकि यह प्रोसेसर से बाकी मदरबोर्ड तक का मुख्य मार्ग है।\n  <br> प्रोसेसर की तरह, फ्रंटसाइड बस की गति मेगाहर्ट्ज़ या गीगाहर्ट्ज़ में मापी जाती है।\n  <br>", "question_heading": ""}, {"sr_no": 137, "question": "ब्राउटर एक नेटवर्क डिवाइस है जो एक राउटर को __________ के साथ जोड़ता है।\n  <br>", "option1": "ब्लूटूथ\n  <br>", "option2": "ब्रिज \n  <br>", "option3": "बस\n  <br>", "option4": "बैकअप स्टोरेज डिवाइस\n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> ब्राउटर एक नेटवर्किंग डिवाइस है जो एक ही समय में ब्रिज और राउटर के रूप में कार्य कर सकता है।\n  <br> यह डेटा को नेटवर्क के अंदर विशेष सिस्टम तक रूट कर सकता है और साथ ही नेटवर्क के बीच डेटा को अग्रेषित कर सकता है।\n  <br> यह डेटा लिंक लेयर या नेटवर्क लेयर पर काम कर सकता है।\n  <br> जब राउटर के रूप में कॉन्फ़िगर किया जाता है, तो ब्राउटर पूर्ण डुप्लेक्स होता है और ब्रिज के रूप में कॉन्फ़िगर किए जाने पर यह आधा डुप्लेक्स होता है।\n  <br>", "question_heading": ""}, {"sr_no": 138, "question": "इथरनेट, रिपीटर और नेटवर्किंग हब __________ में हार्डवेयर के उदाहरण हैं।\n  <br>", "option1": "डेटा लिंक लेयर \n  <br>", "option2": "फिजिकल लेयर\n  <br>", "option3": "ट्रांसपोर्ट लेयर\n  <br>", "option4": "सेशन लेयर \n  <br>", "answer": "2", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> OSI मॉडल में, फिजिकल लेयर वास्तविक हार्डवेयर और सिग्नलिंग तंत्र  "question_heading": ""}, {"sr_no": 141, "question": "एक छोटे पैकेज में उच्च क्षमता वाली मेमोरी डिलीवर करने के लिए निम्न में से किस प्रकार के मेमोरी कार्ड का सबसे अधिक उपयोग किया जाता है?\n  <br>", "option1": "SDHC कार्ड\n  <br>", "option2": "कॉम्पैक्ट फ़्लैश\n  <br>", "option3": "स्मार्ट मीडिया कार्ड\n  <br>", "option4": "SD कार्ड\n  <br> \n  <br>", "answer": "4", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> \n  <b>SD</b> कार्ड एक प्रकार की गैर-वाष्पशील फ्लैश मेमोरी है जिसका उपयोग पोर्टेबल और मोबाइल उपकरणों में किया जा सकता है।\n  <br> यह मेमोरी कार्ड के सबसे प्रचलित प्रकारों में से एक है।\n  <br> इसे एक छोटे पैकेज में बहुत सारी मेमोरी फिट करने के लिए डिज़ाइन किया गया है।\n  <br> यह विभिन्न प्रकार के छोटे पोर्टेबल उपकरणों में पाया जा सकता है, जिनमें हैंडहेल्ड कंप्यूटर, डिजिटल वीडियो कैमकोर्डर, डिजिटल कैमरा और सेल फोन शामिल हैं।\n  <br> \n  <b>SD</b> कार्ड विभिन्न प्रकार की भंडारण क्षमताओं में भी आते हैं।\n  <br>", "question_heading": ""}, {"sr_no": 142, "question": "पोस्टस्क्रिप्ट भाषा किस कंपनी द्वारा विकसित पृष्ठ विवरण भाषा है?\n  <br>", "option1": "एडोब\n  <br>", "option2": "कोरल\n  <br>", "option3": "आईबीएम\n  <br>", "option4": "एप्पल \n  <br>", "answer": "1", "negative_marking": "1.00", "positive_marking": "1", "solution_text": "<br> पोस्टस्क्रिप्ट एक पेज विवरण भाषा (PDL) है जो एक वेब पेज के टेक्स्ट और ग्राफिक सामग्री को निर्दिष्ट करती है।\n  <br> इसका उपयोग यह निर्दिष्ट करने के लिए किया जा सकता है कि दृश्य और पाठ स्क्रीन पर और प्रिंट में कैसे दिखाई देते हैं।\n  <br> एडोब ने 1984 में भाषा बनाई और तब से इसमें कई संशोधन और अपडेट हुए हैं।\n  <br> अन्य कंप्यूटर भाषाओं की तरह, पोस्टस्क्रिप्ट संख्याओं, सरणियों और पाठों सहित विभिन्न प्रकार के डेटा प्रकारों का समर्थन करता है।\n  <br>", "question_heading": ""}, {"sr_no": 143, "question": "माइक्रोसॉफ्ट वर्ड में, निम्नलिखित में से कौन सा फॉन्ट केस आपके टेक्स्ट के सभी अक्षरों को कैपिटलाइज़ करता है?\n  <br>", "option1": "कैपिटलाइज़ इच वर्ड \n  <br>", "option2": "अपरकेस\n  <br>", "opti
