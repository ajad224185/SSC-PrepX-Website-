<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9.) FULL LENGTH - TEST -5 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

 style=\"font-size:12pt;font-family:'Nirmala UI'\">, carved from a single rock</span></li></ul></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Jain caves (Caves 30–34)</span><ul type=\"square\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Latest phase (9th–10th century CE)</span></li><li style=\"margin-left:27.58pt;padding-left:8.42pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Known for fine detailing and symmetry</span></li></ul></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The coexistence of these caves highlights</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">religious tolerance during the early medieval period</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Mahatma Gandhi launched the Kheda Satyagraha in Gujarat in:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1921</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1931</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1942</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1918</span></p>", "answer": "4", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Kheda Satyagraha</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">was launched by</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Mahatma Gandhi</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1918</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Kheda district of Gujarat</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Background</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The region faced</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">severe crop failure due to floods and famine</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Despite this, the British government</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">refused to grant land revenue remission</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Objectives of the movement</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Demand</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">suspension of land revenue</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">for peasants.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Use of</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">non-violent resistance (Satyagraha)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Key leaders involved</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Mahatma Gandhi</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Sardar Vallabhbhai Patel</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Indulal Yagnik</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Outcome</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The British authorities</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">relaxed revenue collection</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The movement strengthened</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">peasant participation in the national movement</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Facts:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">A) 1921</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– Year of the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Non-Cooperation Movement</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">B) 1931</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– Year of</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Gandhi–Irwin Pact</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">C) 1942</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– Year of the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Quit India Movement</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The Promotion and Regulation of Online Gaming Act, 2025 regulates:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Real-money online games and esports</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Offline card games</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Fantasy sports only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Free-to-play games only</span></p>", "answer": "1", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Promotion and Regulation of Online Gaming Act, 2025</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(as referred to in current exam-oriented discussions) is aimed at</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">regulating the online gaming ecosystem</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, especially where</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">financial stakes and consumer protection issues</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">are involved.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The Act focuses on:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Real-money online games</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(RMGs), where users wager money.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Esports and competitive online gaming</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, bringing them under a regulatory framework.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Ensuring</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">fair play, transparency, player protection, and prevention of fraud/addiction</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It does</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">not</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">primarily regulate:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Purely</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">offline games</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Games with</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">no monetary stake</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">only</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Who was proclaimed the symbolic leader of the Revolt of 1857 in Delhi?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Rani Lakshmibai</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Nana Sahib</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Bahadur Shah II</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Tantia Tope</span></p>", "answer": "3", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">During the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Revolt of 1857</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, the rebels in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Delhi</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">proclaimed</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Bahadur Shah II (Bahadur Shah Zafar)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">as the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">symbolic leader of the uprising</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Reasons for his proclamation</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">He was the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">last Mughal emperor</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, seen as a unifying figure.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">His name gave the revolt</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">legitimacy and all-India appeal</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Rebels fought in his name to restore</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">traditional authority</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Role and outcome</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">After the suppression of the revolt, he was</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">captured by the British</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">He was</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">exiled to Rangoon (Myanmar)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, ending Mughal rule in India.</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Additional Facts:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">A) Rani Lakshmibai</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– Leader of the revolt in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Jhansi</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">B) Nana Sahib</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– Led the revolt in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Kanpur</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">D) Tantia Tope</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">– A key military commander, not the symbolic leader.</span></li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which statement is NOT correct about the 52nd Constitutional Amendment Act (1985)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">It introduced the concept of a Money Bill</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">It dealt with anti-defection</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">It was enacted in 1985</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">It added the Tenth Schedule</span></p>", "answer": "1", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">52nd Constitutional Amendment Act, 1985</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">is known as the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Anti-Defection Law</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Key features of the 52nd Amendment</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It aimed to</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">curb political defections</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">by legislators.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It laid down</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">grounds for disqualification</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">of MPs and MLAs on defection.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">added the Tenth Schedule</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">to the Indian Constitution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It was</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">enacted in 1985</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">during the tenure of</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Prime Minister Rajiv Gandhi</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Money Bill provisions</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The concept of a</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Money Bill already existed</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">in the Constitution.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It is defined under</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Article 110</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, not by the 52nd Amendment.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which Indian cricketer won the ICC Men’s Player of the Month for August 2025?</span></p> hird of the members retire every two years</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">This system ensures:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Continuity in parliamentary functioning</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Experience is retained while allowing</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">periodic renewal</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">of membership</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">This provision is mentioned under</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Article 83(1)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">of the Indian Constitution.</span></li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">'CM with Me’ initiative (2025) was launched by which state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Odisha</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Punjab</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">West Bengal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Kerala</span></p>", "answer": "4", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">‘CM with Me’</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">initiative, also known as</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Mukhyamantri Ennodoppam</span><span style=\"font-family:'Nirmala UI'\">, was launched by the</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Government of Kerala</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">under Chief Minister</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Pinarayi Vijayan</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">to strengthen communication and citizen engagement with the state government and improve grievance redressal.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Mudumal Megalithic Menhirs (UNESCO tentative list 2025) are located in:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Telangana</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Tamil Nadu</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Kerala</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Karnataka</span></p>", "answer": "1", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Mudumal Megalithic Menhirs</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">were included in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">India’s UNESCO Tentative List (2025)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">under cultural heritage.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Location</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Situated in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Telangana</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, specifically in the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Narayanpet region</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(earlier part of Mahbubnagar area).</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The site contains</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">large upright stone slabs (menhirs)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">dating to the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Iron Age / Megalithic period</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Significance</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Menhirs are associated with</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">megalithic burial practices and ritual landscapes</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The site reflects</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">early socio-religious traditions</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">and advanced stone-working skills.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Common confusion to avoid</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Mudumalai</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(with “ai”) is a</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">tiger reserve in Tamil Nadu</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Mudumal Megalithic Menhirs</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">are</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">not in Tamil Nadu</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, but in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Telangana</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which initiative facilitated digital agricultural trade post-1991 reforms?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">DBT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Digital India</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NeGP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">e-NAM</span></p>", "answer": "4", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">e-NAM (National Agriculture Market)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">is an electronic trading portal that</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">integrates existing APMC mandis</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">across states into a</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">single national digital market</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It facilitates</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">online trading of agricultural commodities</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, enabling better</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">price discovery</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">and</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">transparent transactions</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">for farmers.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Though launched later (2016), e-NAM represents the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">continuation of market-oriented reforms</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">initiated after the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">1991 economic reforms</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, especially in agricultural marketing.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Key benefits include:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Reduced role of intermediaries</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Wider market access for farmers</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Real-time price information</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Inter-state trade facilitation</span></li></ul></li></ul><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Additional facts:</span></p><ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">A) DBT (Direct Benefit Transfer)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">focuses on</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">welfare payments</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, not trade.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">B) Digital India</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">is a</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">broad umbrella programme</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, not specific to agricultural trade.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">C) NeGP (National e-Governance Plan)</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">aimed at e-governance services, not a dedicated agri-trade platform.</span></li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Maitree 2025 joint military exercise was held between India and:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Myanmar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Indonesia</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Thailand</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Sri Lanka</span></p>", "answer": "3", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">“Maitree”</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">exercise is an annual</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">joint military exercise between India and Thailand</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">In</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">2025</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">14th edition of Exercise Maitree</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">was conducted in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Umroi, Meghalaya</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">. It involved the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Indian Army and the Royal Thai Army</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, focusing on enhancing interoperability and cooperation in counter-terrorism operations.</span></li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Under MGNREGA, wage employment guaranteed per year is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">100 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">80 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">120 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">150 days</span></p>", "answer": "1", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">MGNREGA (Mahatma Gandhi National Rural Employment Guarantee Act), 2005</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">guarantees</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">wage employment to rural households</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Key provision:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Each rural household is entitled to</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">at least 100 days of wage employment per financial year</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Employment is provided for</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">unskilled manual work</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li></ul></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Important features:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">If work is not provided within</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">15 days of demand</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, the applicant is entitled to an</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">unemployment allowance</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Wages are paid as per</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">notified MGNREGA wage rates</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">(linked to CPI).</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Verchol Dalit Literary Award 2025 was given to:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Yashica Dutt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Yogesh Maitreya</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">P. Sivakami</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Toral Jatin Gajarawala</span></p>", "answer": "3", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Renowned writer, retired IAS officer, and social activist</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">P. Sivakami</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">was honoured with the</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Verchol Dalit Literary Award 2025</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">by the Neelam Cultural Centre in Chennai, recognising her significant contributions to Dalit literature and advocacy for marginalized voices.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Tarpa dance of Maharashtra is performed by which tribe?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Bhil</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Gond</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Warli</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Santhal</span></p>", "answer": "3", "negative_marking": "0.25", "positive_marking": "1", "solution_text": " <ul type=\"disc\" style=\"margin:0pt;padding-left:0pt\"><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Tarpa dance</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">is a traditional folk dance of</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Maharashtra</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, mainly associated with the</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Warli tribe</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">It is performed around a</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Tarpa</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, a wind instrument made from</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">gourd and bamboo</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">Dancers move in</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\"> </span><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">circular formations</span><span style=\"font-size:12pt;font-family:'Nirmala UI'\">, following the rhythm of the Tarpa player.</span></li><li style=\"margin-left:27.6pt;padding-left:8.4pt;font-family:serif;font-size:10pt\"><span style=\"font-size:12pt;font-family:'Nirmala UI'\">The dance reflects:</span><ul type=\"circle\" style=\"margin-right:0pt;margin-left:0pt;padding-left:0pt\"><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Community bonding</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Harmony with nature</span></li><li style=\"margin-left:29pt;padding-left:7pt\"><span style=\"font-size:12pt;font-weight:bold;font-family:'Nirmala UI'\">Tribal cultural expression</span></li></ul></li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });

  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }

  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
