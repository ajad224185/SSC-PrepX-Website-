<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>23.) MOCK-12 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

92767011602_image026.png\" width=\"59\" height=\"230\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A man spends 20% of his monthly income on food and 15% on children's education. Of the remaining amount, he spends 40% on entertainment and transport together and 30% on medical expenses. If he is left with an amount of ₹8,775, what is his monthly income?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹45,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹48,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹50,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the total monthly income of the man be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image027.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total initial expenditure on food and education = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image028.png\" width=\"48\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Remaining amount = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image029.png\" width=\"84\" height=\"47\" alt style=\"vertical-align:middle\" ><span> of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image027.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total expenditure from the remaining amount = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image030.png\" width=\"48\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Amount left = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image031.png\" width=\"84\" height=\"47\" alt style=\"vertical-align:middle\" ><span> of the remaining amount</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the question:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image032.png\" width=\"49\" height=\"111\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image033.png\" width=\"49\" height=\"79\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image034.png\" width=\"71\" height=\"99\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, his monthly income is ₹45,000.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following is an unsaturated hydrocarbon?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Butane</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Propene</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ethane</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Methane</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hydrocarbons that contain double or triple bonds between carbon atoms are called unsaturated hydrocarbons. Propene (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image035.png\" width=\"34\" height=\"28\" alt style=\"vertical-align:middle\" ><span>) is an alkene containing a carbon-carbon double bond, making it an unsaturated hydrocarbon. In contrast, butane, ethane, and methane are alkanes containing only single carbon-carbon bonds, which are saturated hydrocarbons.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Rough Endoplasmic Reticulum (RER) looks rough under a microscope because of the presence of which of the following particles attached to its surface?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Lysosomes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ribosomes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Centrosomes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chloroplasts</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Rough Endoplasmic Reticulum (RER) appears rough under a microscope because it has tiny structures called </span><span style=\"font-weight:bold\">ribosomes</span><span> attached to its outer surface. Ribosomes are the sites of protein synthesis in the cell. In contrast, the Smooth Endoplasmic Reticulum (SER) lacks ribosomes on its surface and is involved in lipid synthesis.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A sum of money invested at compound interest, compounded annually, amounts to ₹3,000 at the end of the first year and to ₹3,360 at the end of the second year. What is the rate of interest per annum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The interest earned during the second year is the simple interest on the amount at the end of the first year for 1 year.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Interest for the 2nd year </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image036.png\" width=\"122\" height=\"58\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rate of interest </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image037.png\" width=\"64\" height=\"89\" alt style=\"vertical-align:middle\" ><span> per annum.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A 160 m long train running at a speed of 48 km/h crosses another train coming from the opposite direction at a speed of 42 km/h in 12 seconds. What is the length of the second train?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>140 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>150 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>160 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When two trains move in opposite directions, their relative speed is the sum of their individual speeds.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Relative speed = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image038.png\" width=\"56\" height=\"111\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Convert speed into m/s:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image039.png\" width=\"45\" height=\"120\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total distance covered in 12 seconds = Length of first train + Length of second train (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image040.png\" width=\"16\" height=\"23\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image041.png\" width=\"106\" height=\"179\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image042.png\" width=\"40\" height=\"73\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image043.png\" width=\"78\" height=\"94\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the length of the second train is 140 m.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Permanent hardness of water cannot be removed by simple boiling. It is primarily caused by the presence of soluble:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bicarbonates of calcium and magnesium</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chlorides and sulphates of calcium and magnesium</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Carbonates and bicarbonates of sodium</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nitrates and nitrites of potassium</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hardness of water is categorized into two types:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Temporary hardness:</span><span> Caused by the dissolved bicarbonates (hydrogen carbonates) of calcium and magnesium, i.e., </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image044.png\" width=\"76\" height=\"28\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image045.png\" width=\"81\" height=\"28\" alt style=\"vertical-align:middle\" ><span>. It can be removed simply by boiling or by Clark's method (adding slaked lime).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Permanent hardness:</span><span> Caused by the dissolved chlorides and sulphates of calcium and magnesium, such as </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image021.png\" width=\"40\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image046.png\" width=\"45\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image047.png\" width=\"45\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image048.png\" width=\"50\" height=\"23\" alt style=\"vertical-align:middle\" ><span>. It cannot be removed by boiling and requires treatment with washing soda (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image049.png\" width=\"54\" height=\"28\" alt style=\"vertical-align:middle\" ><span>), Calgon's method, or ion-exchange processes.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-clusters will replace the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BZE, DYH, GWL, KTQ, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PQX</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OPW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PPW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PPV</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in each position of the letter-clusters is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image050.png\" width=\"211\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image051.png\" width=\"213\" height=\"24\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image052.png\" width=\"214\" height=\"28\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining these letters gives </span><span style=\"font-weight:bold\">PPW</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the kinetic molecular theory of matter, the average kinetic energy of the particles of a substance is directly proportional to its:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>density</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>absolute temperature</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>volume</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>pressure</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the kinetic theory of matter, the average kinetic energy of the particles is directly proportional to the absolute temperature (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image053.png\" width=\"23\" height=\"47\" alt style=\"vertical-align:middle\" ><span>). When the temperature of a substance increases, the particles gain energy and move faster, leading to an increase in their average kinetic energy.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. You have to take the given statements to be true even if they seem to be at variance from commonly known facts and decide which conclusion(s) logically follow(s) from the given statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some doctors are teachers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All teachers are researchers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some researchers are scientists.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Some researchers are doctors.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Some scientists are teachers.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'Some doctors are teachers' and 'All teachers are researchers' directly implies that the intersection of doctors and teachers is also contained in researchers. Therefore, 'Some researchers are doctors' definitely follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'All teachers are researchers' and 'Some researchers are scientists' does not provide a definite relationship between scientists and teachers. Therefore, conclusion (II) does not necessarily follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, only conclusion (I) follows.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 'P' denotes '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image001.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span>', 'Q' denotes '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image002.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span>', 'R' denotes '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image003.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span>', and 'S' denotes '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_u vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3 (Addition): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image057.png\" width=\"42\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 4 (Subtraction): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image058.png\" width=\"56\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the correct answer is 123.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In which Union Territory has the 'Sindhu Central University' been established under the Central Universities (Amendment) Act?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jammu and Kashmir</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ladakh</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chandigarh</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Delhi</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Parliament passed the Central Universities (Amendment) Act to establish the 'Sindhu Central University' in the Union Territory of Ladakh. It is the first central university set up in Ladakh to facilitate higher education in the region.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vishal starts from Point A and walks 18 m towards North. He turns to his right and walks 7 m. He turns to his right again and walks 26 m. Finally, he turns to his right and walks 22 m, stopping at Point B. How far (shortest distance) and in which direction is Point B with respect to Point A? (All turns are 90-degree turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 m, South-West</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 m, North-West</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 m, South-East</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 m, South-West</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the starting Point A be at coordinates (0, 0):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Walking 18 m North brings him to (0, 18).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turning right (facing East) and walking 7 m brings him to (7, 18).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Turning right (facing South) and walking 26 m brings him to (7, 18 − 26) = (7, −8).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Turning right (facing West) and walking 22 m brings him to Point B at (7 − 22, −8) = (−15, −8).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, finding the distance and direction of Point B (−15, −8) with respect to Point A (0, 0):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Direction: Since the x-coordinate is negative (West) and the y-coordinate is negative (South), Point B is in the </span><span style=\"font-weight:bold\">South-West</span><span> direction from Point A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Shortest distance = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image059.png\" width=\"122\" height=\"139\" alt style=\"vertical-align:middle\" ><span> m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Point B is 17 m, South-West with respect to Point A.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a row of 50 students facing north, Ananya is 34ᵗʰ from the left end and Bhavya is 28ᵗʰ from the right end. How many students are standing between Ananya and Bhavya?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students = 50</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Ananya from the left = 34</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Bhavya from the right = 28</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of their positions = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image060.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the sum of positions (62) is greater than the total number of students (50), this is a case of overlapping.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of students between them = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image061.png\" width=\"132\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image062.png\" width=\"68\" height=\"47\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who among the following was awarded the 'Player of the Tournament' in the ICC Men's T20 World Cup 2024?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rohit Sharma</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Travis Head</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jasprit Bumrah</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hardik Pandya</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Indian fast bowler Jasprit Bumrah was awarded the 'Player of the Tournament' at the ICC Men's T20 World Cup 2024. He took 15 wickets in 8 matches at an exceptional economy rate of 4.17, playing a pivotal role in India winning their second T20 World Cup title.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Twelve years ago, Rohan's age was </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image063.png\" width=\"7\" height=\"31\" alt style=\"vertical-align:middle\" ><span> of that of his elder brother. The ratio of the pres the particle size lies between </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image076.png\" width=\"32\" height=\"24\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image077.png\" width=\"58\" height=\"24\" alt style=\"vertical-align:middle\" ><span>. Because of this intermediate size, colloidal particles are large enough to scatter a beam of visible light passing through them, demonstrating the </span><span style=\"font-weight:bold\">Tyndall effect</span><span>. They do not settle down when left undisturbed (they are stable) and cannot be separated by ordinary filtration.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following is NOT one of the five foundational pillars of the National Education Policy (NEP) 2020?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Access</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Centralisation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Equity</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Accountability</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The National Education Policy (NEP) 2020 is built on five foundational pillars: </span><span style=\"font-weight:bold\">Access, Equity, Quality, Affordability, and Accountability</span><span>. 'Centralisation' is not one of these pillars; rather, the policy promotes institutional autonomy, flexibility, and decentralised governance.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bott g src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image091.png\" width=\"47\" height=\"47\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Following this pattern, the next difference will increase by 8:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image092.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing number is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image093.png\" width=\"42\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘PASTE’ is coded as ‘73592’, ‘STORE’ is coded as ‘59842’, and ‘PARTS’ is coded as ‘37495’. What is the code for ‘E’ in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Compare the letters and digits in the given words:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. In ‘PASTE’ (7, 3, 5, 9, 2) and ‘STORE’ (5, 9, 8, 4, 2), the common letters are S, T, and E, and the common digits are 2, 5, and 9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Now compare with ‘PARTS’ (3, 7, 4, 9, 5): The common letters among all three words are S and T, and the common digits are 5 and 9. Thus, {S, T} = {5, 9}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Removing S and T (digits 5 and 9) from the common elements of ‘PASTE’ and ‘STORE’ leaves letter ‘E’ and digit ‘2’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the code for ‘E’ is 2.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following organisations releases the Periodic Labour Force Survey (PLFS) to provide data on India's employment and unemployment rates?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NITI Aayog</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>National Sample Survey Office (NSSO)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reserve Bank of India (RBI)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Securities and Exchange Board of India (SEBI)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Periodic Labour Force Survey (PLFS) is conducted and released by the National Sample Survey Office (NSSO), which operates under the Ministry of Statistics and Programme Implementation (MoSPI). It was launched in April 2017 to generate frequent data on key labour force indicators such as Labour Force Participation Rate (LFPR), Worker Population Ratio (WPR), and Unemployment Rate (UR).</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 4 : 12 :: 7 : x, what i refore, the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image027.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is 21.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-clusters will replace the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WCZ, TGX, QKV, NOT, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KTR</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JSR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KSR</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KSQ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: W (-3) → T (-3) → Q (-3) → N (-3) → </span><span style=\"font-weight:bold\">K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: C (+4) → G (+4) → K (+4) → O (+4) → </span><span style=\"font-weight:bold\">S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: Z (-2) → X (-2) → V (-2) → T (-2) → </span><span style=\"font-weight:bold\">R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the missing letter-cluster is </span><span style=\"font-weight:bold\">KSR</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><spa =\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Amount remaining after education and travel (monthly savings) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image102.png\" width=\"97\" height=\"136\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the question:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image103.png\" width=\"63\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image104.png\" width=\"61\" height=\"99\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, his monthly income is ₹50,000.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following represents the correct pathway of urine flow in the human excretory system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kidney → Urinary bladder → Ureter → Urethra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kidney → Ureter → Urinary bladder → Urethra</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kidney → Urethra → Urinary bladder → Ureter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Urinary bladder → Kidney → Ureter → Urethra</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct pathway of urine flow in the human excretory system is: </span><span style=\"font-weight:bold\">Kidney → Ureter → Urinary bladder → Urethra</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Kidneys:</span><span> Filter blood to remove metabolic wastes and produce urine.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Ureters:</span><span> Muscular tubes that carry urine from the kidneys to the urinary bladder.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Urinary bladder:</span><span> A reservoir that temporarily stores urine.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">Urethra:</span><span> A tube that carries urine from the bladder to the exterior of the body during urination.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The transfer of pollen grains from the anther to the stigma of another flower on the same plant is known as ______.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Autogamy</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Geitonogamy</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Xenogamy</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apomixis</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Geitonogamy is the transfer of pollen grains from the anther to the stigma of another flower of the same plant. Although functionally it is a type of cross-pollination involving a pollinating agent, genetically it is similar to autogamy because the pollen grains come from the same parent plant.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘fresh fruits are sweet’ is written as ‘le ra ta po’, ‘sweet orange is fresh’ is written as ‘po ma le si’, and ‘orange are very sour’ is written as ‘ma ra ju ka’. How is ‘fruits’ written in that code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ta</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>po</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>le</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘fresh fruits are sweet’ = ‘le ra ta po’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘sweet orange is fresh’ = ‘po ma le si’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ‘orange are very sour’ = ‘ma ra ju ka’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing statement 1 and statement 2, the common words are ‘fresh’ and ‘sweet’, and the common codes are ‘le’ and ‘po’. So, {fresh, sweet} = {le, po}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing statement 1 and statement 3, the common word is ‘are’, and the common code is ‘ra’. So, ‘are’ = ‘ra’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now looking back at statement 1, the only remaining word is ‘fruits’ and the only remaining code is ‘ta’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, ‘fruits’ is coded as ‘ta’.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What type of chemical reaction takes place when an iron nail is dipped in a copper sulfate solution, causing the blue color of the solution to fade and a reddish-brown deposit to form on the nail?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combination reaction</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decomposition reaction</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Displacement reaction</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Double displacement reaction</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A displacement reaction is a chemical reaction in which a more reactive element displaces a less reactive element from its salt solution. In this reaction, iron is more reactive than copper and displaces it from copper sulfate: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image105.png\" width=\"114\" height=\"73\" alt style=\"vertical-align:middle\" ><span>. Therefore, it is a displacement reaction.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Evaluate the value of the given expression:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image106.png\" width=\"427\" height=\"24\" alt ></p>", "option1": "<p style= pt;font-size:12pt\"><span>R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T − 4 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C + 5 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image146.png\" width=\"48\" height=\"58\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now testing the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• PZK : SVO → P + 3 = S, Z − 4 = V, K + 5 = P (≠ O)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">BXN : ETS</span><span> → B + 3 = E, X − 4 = T, N + 5 = S (Matches the pattern)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• MLG : PHM → M + 3 = P, L − 4 = H, G + 5 = L (≠ M)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• FUJ : IRO → F + 3 = I, U − 4 = Q (≠ R), J + 5 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, </span><span style=\"font-weight:bold\">BXN : ETS</span><span> is the correct pair.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In September 2024, Prime Minister Narendra Modi dedicated three 'Param Rudra' supercomputers to the nation. Under which of the following missions were these supercomputers developed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>National Quantum Mission</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Digital India Mission</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>National Supercomputing Mission</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Atal Innovation Mission</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In September 2024, Prime Minister Narendra Modi dedicated three indigenously developed 'Param Rudra' supercomputers to the nation. These supercomputers have been developed under the National Supercomputing Mission (NSM) by the Centre for Development of Advanced Computing (C-DAC) to facilitate advanced scientific research.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Unlike in Amoeba where binary fission can take place in any plane, in which of the following organisms does binary fission occur in a definite orientation with respect to a whip-like structure?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plasmodium</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Leishmania</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paramecium</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Spirogyra</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In organisms like Amoeba, binary fission can occur in any plane because of an irregular body shape. However, in </span><span style=\"font-style:italic\">Leishmania</span><span> (which causes kala-azar), the cell has a whip-like structure (flagellum) at one end, and binary fission takes place in a definite longitudinal orientation in relation to this structure. Meanwhile, </span><span style=\"font-style:italic\">Plasmodium</span><span> divides through multiple fission, and </span><span style=\"font-style:italic\">Paramecium</span><span> divides transversely.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A dishonest merchant claims to sell wheat at ₹28 per kg, which costs him ₹32 per kg. However, he uses a false weight and gives only 700 gm instead of 1 kg. What is his actual profit or loss percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20% profit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25% profit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12.5% loss</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25% loss</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cost price of 1 kg (1000 gm) of wheat = ₹32</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cost price of 700 gm given to the customer = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image147.png\" width=\"63\" height=\"81\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Selling price of that 700 gm (sold as 1 kg) = ₹28</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Selling Price &gt; Cost Price, he makes a profit:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image148.png\" width=\"67\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit percentage = </span><img src=\"https://st ing": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The apparent flattening of the Sun's disc at sunrise and sunset is caused by </span><span style=\"font-weight:bold\">atmospheric refraction</span><span>. As the rays of light from the upper and lower edges of the Sun travel through different layers of Earth's atmosphere having varying optical densities, the rays from the lower edge are bent slightly more than those from the upper edge. This unequal refraction makes the vertical diameter appear compressed, giving the Sun a flattened or oval appearance.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": "Rधीधन पय पुध ीियियथing ौधनiधौ ोnक ोnौथधन पुध तहधौपiयn पुोप ीियियथौ. Cयहnपing पय ृध कयnध ीनयं िधीप पय नigुप यnिद.(Lधीप) P # 6 2 K @ 9 M % T 4 &ोंूे 5 R * 8 Q 7 @ A (Rigुप)Hयथ ंोnद ौहcु ौदंृियस ोनध पुधनध, धोcु यी थुicु iौ iंंधकiोपिधद ूनधcधकधक ृद ो िधपपधन ोnक ोिसय iंंधकiोपिधद ीियियथधक ृद ो nहंृधन?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: </span><span style=\"font-weight:bold\">Letter → Symbol → Number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Scanning the given sequence from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">P # 6</span><span> — Symbol '#' is preceded by letter 'P' and followed by number '6'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">K @ 9</span><span> — Symbol '@' is preceded by letter 'K' and followed by number '9'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">R * 8</span><span> — Symbol '*' is preceded by letter 'R' and followed by number '8'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking other symbols:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- In 'M % T', '%' is followed by a letter, not a number.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- In '4 &amp; 5', '&amp;' is preceded by a number, not a letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- In '7 @ A', '@' is preceded by a number and followed by a letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, there are exactly </span><span style=\"font-weight:bold\">3</span><span> such symbols.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image169.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is an acute angle, then the expression </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image170.png\" width=\"74\" height=\"31\" alt style=\"vertical-align:middle\" ><span> is equal to:</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image171.png\" width=\"39\" height=\"31\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxd ital role in enhancing individual well-being and fostering harmony within the community.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 men and 4 women can complete a piece of work in 18 days, while 4 men and 7 women can complete the same work in 12 days. In how many days can 1 man alone complete the work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>75 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>90 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the daily work done by 1 man and 1 woman be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image183.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image184.png\" width=\"12\" height=\"23\" alt style=\"vertical-align:middle\" ><span> respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total Work = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image185.png\" width=\"45\" height=\"159\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dividing both sides by 6:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767011602_image186.png\" width=\"54\" height=\"113\" alt st
