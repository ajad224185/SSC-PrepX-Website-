<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>25.) MOCK-13 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

ize:12pt\"><span>'P + Q' means 'P is the father of Q',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P - Q' means 'P is the sister of Q',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P × Q' means 'P is the brother of Q',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P ÷ Q' means 'P is the wife of Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How is M related to P in the expression ‘M × N ÷ O + P - Q’?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother's son</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's father</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression ‘M × N ÷ O + P - Q’:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'P - Q' means P is the sister of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'O + P' means O is the father of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'N ÷ O' means N is the wife of O. Therefore, N is the mother of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 'M × N' means M is the brother of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since N is the mother of P and M is the brother of N, M is the mother's brother (maternal uncle) of P.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read t 1792915239226_image046.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is directly proportional to:</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image046.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image047.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image048.png\" width=\"17\" height=\"24\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image049.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the second equation of motion, the distance </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image050.png\" width=\"8\" height=\"23\" alt style=\"vertical-align:middle\" ><span> covered by an object in time </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image046.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is given by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image051.png\" width=\"45\" height=\"99\" alt style=\"vertical-align:middle\" ><span>. Since the object starts from rest, its initial velocity </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image052.png\" width=\"25\" height=\"47\" alt style=\"vertical-align:middle\" ><span>. Therefore, the equation simplifies to </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image053.png\" width=\"48\" height=\"56\" alt style=\"vertical-align:middle\" ><span>. As acceleration </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image054.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is uniform (constant), </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image055.png\" width=\"25\" height=\"50\" alt style=\"vertical-align:middle\" ><span>. Hence, the distance is directly proportional to the square of time.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons, P, Q, R, S, T and U, are sitting in a row facing north. P sits at the extreme left end of the row. T sits third to the right of P. S sits to the immediate left of T. Q sits to the immediate right of P. R sits to the immediate right of T. Who sits at the extreme right end of the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information, let the six positions from left to right be 1, 2, 3, 4, 5, and 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P sits at the extreme left end, so Position 1 = P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T sits third to the right of P, so Position 4 = T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. S sits to the immediate left of T, so Position 3 = S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Q sits to the immediate right of P, so Position 2 = Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. R sits to the immediate right of T, so Position 5 = R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, only Position 6 is left, which must be occupied by the remaining person, U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: P, Q, S, T, R, U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, U sits at the extreme right end of the row.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following groups contains only biodegradable substances?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plastic bucket, Dry leaves, Polythene bag, Cardboard</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cotton shirt, Woollen scarf, Cardboard box, Banana peel</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Glass bottle, Aluminium can, Nylon rope, Vegetable peel</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Leather shoe, Synthetic yarn, Leftover food, Polythene wrap</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Biodegradable substances are materials that can naturally be decomposed into simple, harmless substances by biological processes, primarily through the action of microorganisms like bacteria and fungi. Natural plant and animal products such as cotton, wool, paper, cardboard, and fruit peels are biodegradable. Hence, cotton shirt, woollen scarf, cardboard box, and banana peel all belong to the biodegradable category. On the other hand, materials like plastics, polythene, glass, aluminium cans, and synthetic fibers are non-biodegradable.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image056.png\" width=\"38\" height=\"47\" alt style=\"vertical-align:middle\" ><span>, then what is the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image057.png\" width=\"77\" height=\"47\" alt style=\"vertical-align:middle\" ><span>?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 : 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given that </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image056.png\" width=\"38\" height=\"47\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-si = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image062.png\" width=\"63\" height=\"113\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Vikas is sitting exactly in the middle of Rohan and Sumit, the number of persons between Sumit and Vikas is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image063.png\" width=\"30\" height=\"57\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the position of Vikas from the right end = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image064.png\" width=\"44\" height=\"96\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In August 2026, the Indian Air Force (IAF) deployed Rafale fighter aircraft to participate in the bilateral air exercise 'Udara Shakti 2026' with which country's air force?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Indonesia</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Malaysia</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Singapore</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thailand</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Exercise 'Udara Shakti' is a bilateral air combat exercise conducted between the Indian Air Force (IAF) and the Royal Malaysian Air Force (RMAF). In August 2026, the exercise was conducted at Subang Air Base in Malaysia, where the IAF deployed its Rafale fighter jets alongside Malaysia's Su-30MKM and F/A-18D aircraft.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which umbrella scheme was launched by the Ministry of Women and Child Development for the safety, security, and empowerment of women, consisting of two sub-schemes named 'Sambal' and 'Samarthya'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mission Poshan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mission Shakti</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mission Vatsalya</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mission Jagriti</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Mission Shakti</span><span> is an integrated umbrella scheme formulated by the Ministry of Women and Child Development for the safety, security, and empowerment of women. It is divided into two distinct sub-schemes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Sambal:</span><span> Dedicated to the safety and security of women. Key components include One Stop Centres (OSC), Universalisation of Women Helpline (181), Beti Bachao Beti Padhao (BBBP), and Nari Adalat.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Samarthya:</span><span> Dedicated to the empowerment of women. Key components include the Pradhan Mantri Matru Vandana Yojana (PMMVY), Hub for Empowerment of Women, Working Women Hostels (Sakhi Niwas), and the National Creche Scheme (Palna).</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In September 2026, who among the following won the silver medal in the Women's 10m Air Rifle Standing SH1 event at the World Shooting Para Sport Championships held in Changwon, South Korea?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Avani Lekhara</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mona Agarwal</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rubina Francis</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Millie Shah</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In September 2026, Indian para-shooter Mona Agarwal won the silver medal in the Women's 10m Air Rifle Standing SH1 event at the World Shooting Para Sport Championships in Changwon, South Korea, with a score of 250.0, also securing a quota place for the Los Angeles 2028 Paralympics. Avani Lekhara took the bronze medal with a score of 229.4, while Serbia's Kristina Trifunovic won the gold medal.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A man spends 25% of his monthly salary on house rent and 15% on children's education. He spends 40% of the remaining salary on groceries and entertainment. If he is left with a savings of ₹8,640, then what is his total monthly salary?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹22,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹24,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹25,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹20,000< <span>.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If each vowel in the word FLOWER is changed to the letter following it in the English alphabetical order and each consonant is changed to the letter preceding it in the English alphabetical order, and then the letters so formed are arranged in alphabetical order from left to right, which of the following letters will be fourth from the left end?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: FLOWER</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Consonants are changed to the preceding letter (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F → E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W → V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R → Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Vowels are changed to the following letter (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letters obtained are: E, K, P, V, F, Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging these letters in alphabetical order from left to right: E, F, K, P, Q, V.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The fourth letter from the left end is </span><span style=\"font-weight:bold\">P</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which Indian Institute of Technology (IIT) developed the 'SATHEE' (Self-Assessment, Test Preparation and Innovation) platform launched in collaboration with the Ministry of Education?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IIT Madras</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IIT Kanpur</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IIT Delhi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IIT Bombay</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 'SATHEE' (Self-Assessment, Test Preparation and Innovation) platform was developed by </span><span style=\"font-weight:bold\">IIT Kanpur</span><span> in collaboration with the Ministry of Education, Government of India. It aims to bridge the educational divide by providing free, high-quality preparation materials, AI-driven mentorship, and mock tests for competitive examinations like JEE, NEET, SSC, and various recruitment exams to students across India.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-clusters will replace the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;m  the left end?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: PROBLEM</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Changing each vowel to the next letter (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Changing each consonant to the previous letter (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R → Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B → A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letters obtained are: O, Q, P, A, K, F, L.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, arranging these letters in reverse alphabetical order from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q, P, O, L, K, F, A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The third letter from the left end is O.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The mode of asexual reproduction in which a simple multicellular organism, such as </span><span style=\"font-style:italic\">Spirogyra</span><span>, breaks into smaller pieces upon maturation, with each piece growing into a new individual, is known as:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Binary fission</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Budding</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fragmentation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Multiple fission</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fragmentation is a mode of asexual reproduction observed in multicellular organisms with relatively simple body organisation, such as the green alga </span><span style=\"font-style:italic\">Spirogyra</span><span>. Upon reaching maturity, the organism simply breaks up into smaller pieces (fragments), and each fragment subsequently grows into a new individual organism.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which state became the first full-fledged state in India to be declared fully literate under the ULLAS - Nav Bharat Saaksharta Karyakram?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kerala</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mizoram</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Goa</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Himachal Pradesh</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Under the ULLAS - Nav Bharat Saaksharta Karyakram (New India Literacy Programme), a State or Union Territory is certified as fully literate once it crosses the 95% literacy benchmark through the Foundational Literacy and Numeracy Assessment Test (FLNAT). While Ladakh became the first Union Territory to achieve this milestone in June 2024, Mizoram became the first full-fledged state to be declared fully literate under the ULLAS scheme.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For a moderately skewed distribution, the values of the mean and median are </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image119.png\" width=\"30\" height=\"23\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image120.png\" width=\"30\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, respectively. Using the empirical relationship, what is the value of the mode of this distribution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28.4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>29.8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>31.6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>33.2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the empirical relationship between the measures of central tendency for a moderately skewed distribution:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img ght:bold\">NRPQ</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following terms refers to the phase transition in which a substance changes directly from a gas to a solid without passing through the liquid state?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sublimation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Deposition</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Condensation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vaporisation</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Deposition</span><span> (also known as desublimation) is the thermodynamic process in which a gas transforms directly into a solid without passing through the liquid phase. A common natural example is the formation of frost on cold surfaces.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Key phase transitions include:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Deposition:</span><span> Gas to Solid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Sublimation:</span><span> Solid to Gas</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Condensation:</span><span> Gas to Liquid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Vaporisation:</span><span> Liquid to Gas</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Roh  + 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2nd pair: 2nd letter = 1st letter + 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3rd pair: 2nd letter = 1st letter - 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us check the given triads:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">BF - DH - GD:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• First letters: B(2) + 2 = D(4); D(4) + 3 = G(7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Pairs: B(2) + 4 = F(6); D(4) + 4 = H(8); G(7) - 3 = D(4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">FJ - HL - KH:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• First letters: F(6) + 2 = H(8); H(8) + 3 = K(11)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Pairs: F(6) + 4 = J(10); H(8) + 4 = L(12); K(11) - 3 = H(8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, checking option </span><span style=\"font-weight:bold\">JN - LP - OL</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• First letters: J(10) + 2 = L(12); L(12) + 3 = O(15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Pairs: J(10) + 4 = N(14); L(12) + 4 = P(16); O(15) - 3 = L(12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, 'JN - LP - OL' follows the exact same pattern.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven friends, A, B, C, D, E, F, and G, are sitting around a circular table facing the centre. B sits third to the right of D. E sits second to the left of B. Only one person sits between D and F when counted from the left of D. A sits to the immediate left of F. C does not sit adjacent to D. How many people sit between E and A, when counted from the right of E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 7 positions around the circle be numbered 1 to 7 in clockwise order, all facing the centre (where moving clockwise is to the left, and moving anticlockwise is to the right):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let D be at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. B sits third to the right of D (anticlockwise): position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E sits second to the left of B (clockwise): position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only one person sits between D and F when counted from the left of D: F is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. A sits to the immediate left of F: A is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The remaining positions are 2 and 6 for C and G. Since C does not sit adjacent to D (position 1), C must be at position 6, and G is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final clockwise arrangement is: D (1) - G (2) - F (3) - A (4) - B (5) - C (6) - E (7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the right of E (anticlockwise from position 7): positions 6 (C) and 5 (B) lie between E and A. Thus, there are </span><span style=\"font-weight:bold\">2</span><span> people (C and B) between E and A.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which book, compiled and edited by writer and social activist Leher Sethi, was launched in New Delhi in September 2026 to mark the centenary of the Rashtriya Swayamsevak Sangh?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saffron Shadows: The RSS, A Century of Influence</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RSS: A Century of Service and Ideology</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shadows of the Sangh: The Hundred-Year Journey</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Beyond the Shakha: The RSS at 100</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In September 2026, the book titled </span><span style=\"font-weight:bold\">'Saffron Shadows: The RSS, A Century of Influence'</span><span>, compiled and edited by writer and activist Leher Sethi, was launched in New Delhi. Published by Om Books International, the book is an anthology of essays presenting viewpoints from both Sangh ideologues and its critics in the centenary year of the Rashtriya Swayamsevak Sangh (RSS).</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The total cost of 5 pens and 3 notebooks is ₹110. If the cost of each pen increases by ₹2 and the cost of each notebook decrea , "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Collenchyma</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sclerenchyma</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Aerenchyma</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sclerenchyma is a simple permanent plant tissue composed of long, narrow, dead cells that lack protoplasm at maturity. Their cell walls are heavily and uniformly thickened with lignin, a complex polymer that acts as a cement and makes the tissue hard and impermeable. This tissue provides mechanical support, rigidity, and strength to plant parts (e.g., the husk of a coconut).</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is observed when an aqueous solution of potassium iodide is added to an aqueous solution of lead(II) nitrate?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A yellow precipitate of lead(II) iodide is formed</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A white precipitate of lead(II) iodide is formed</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A yellow precipitate of potassium nitrate is formed</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A black precipitate of lead(II) oxide is formed</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an aqueous solution of lead(II) nitrate reacts with potassium iodide, a double displacement and precipitation reaction takes place: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image212.png\" width=\"144\" height=\"81\" alt style=\"vertical-align:middle\" ><span>. In this reaction, an insoluble yellow precipitate of lead(II) iodide (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image213.png\" width=\"32\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) is formed along with soluble potassium nitrate.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Due to having four electrons in its valence shell, a carbon atom is capable of bonding with four other atoms of carbon or atoms of some other monovalent elements. This property of carbon is known as ______.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Allotropy</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Catenation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tetravalency</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Isomerism</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Carbon has an atomic number of 6 with an electronic configuration of (2, 4). Since it has four electrons in its outermost shell, it needs four electrons to attain a stable octet configuration. By sharing these four valence electrons with four other atoms, carbon exhibits a valency of four, a characteristic known as </span><span style=\"font-weight:bold\">tetravalency</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many sportspersons were conferred the Major Dhyan Chand Khel Ratna Award in the National Sports Awards 2024?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A total of 4 sportspersons were conferred the Major Dhyan Chand Khel Ratna Award for the year 2024 (announced and presented in January 2025 by the Ministry of Youth Affairs and Sports). The recipients were Manu Bhaker (Shooting), D. Gukesh (Chess), Harmanpreet Singh (Hockey), and Praveen Kumar (Para-Athletics).</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following statements is INCORRECT regarding magnetic field lines?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Outside a magnet, the magnetic field lines emerge from the North pole and merge at the South pole.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The relative closeness of the magnetic field lines indicates the strength of the magnetic field.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two magnetic field lines can intersect each other in regions where the magnetic field is very strong.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic field lines are closed and continuous loops.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic field lines can never cross or intersect each other. If two field lines were to intersect at a point, a compass needle placed at that point would have to point in two different directions simultaneously, which is physically impossible. Hence, statement C is incorrect.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following is the SI unit of power?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Joule</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Watt</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Newton</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pascal</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The SI unit of power is the watt (W), named after James Watt. Power is defined as the rate at which work is done (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image214.png\" width=\"32\" height=\"88\" alt style=\"vertical-align:middle\" ><span>), where 1 watt is equal to 1 joule per second.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘fresh green salad’ is coded as ‘35 82 46’, ‘salad taste delicious’ is coded as ‘46 71 59’, and ‘green mango delicious’ is coded as ‘82 59 14’. What is the code for ‘taste’ in that code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>46</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>71</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>59</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>82</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the given coded statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘fresh green salad’ = ‘35 82 46’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘salad taste delicious’ = ‘46 71 59’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ‘green mango delicious’ = ‘82 59 14’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statements (1) and (2), the common word is ‘salad’ and the common code is ‘46’, so ‘salad’ = ‘46’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statements (2) and (3), the common word is ‘delicious’ and the common code is ‘59’, so ‘delicious’ = ‘59’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In statement (2), the only remaining word is ‘taste’ and the remaining code is ‘71’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the code for ‘taste’ is </span><span style=\"font-weight:bold\">71</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which pair does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KRM - NOP</span></p>", "option2": " <p style=\"margin-top:0pt; lt style=\"vertical-align:middle\" ><span> = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) PMR - SJT: P </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = S, M </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image215.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = J, R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image216.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = T (does not follow the pattern, should be R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = U)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) SHV - VEY: S </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = V, H </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image215.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = E, V </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = Y</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) CGT - FDW: C </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = F, G </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image215.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = D, T </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, PMR - SJT is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'sky is clear' is coded as 'de ra ta', 'clear blue water' is coded as 'ta ni zo', and 'water is deep' is coded as 'zo ra mu'. What is the code for the word 'deep' in that code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>zo</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>mu</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ta</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the first and third statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'sky </span><span style=\"font-weight:bold\">is</span><span> clear' = 'de </span><span style=\"font-weight:bold\">ra</span><span> ta'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'water </span><span style=\"font-weight:bold\">is</span><span> deep' = 'zo </span><span style=\"font-weight:bold\">ra</span><span> mu'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Common word is 'is' and common code is 'ra'. So, 'is' = 'ra'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the second and third statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'clear blue </span><span style=\"font-weight:bold\">water</span><span>' = 'ta ni </span><span style=\"font-weight:bold\">zo</span><span>'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'</span><span style=\"font-weight:bold\">water</span><span> is deep' = '</span><span style=\"font-weight:bold\">zo</span><span> ra mu'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Common word is 'water' and common code is 'zo'. So, 'water' = 'zo'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the third statement, the remaining word is 'deep' and the remaining code is 'mu'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the code for 'deep' is 'mu'.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If each consonant in the word BISHOP is changed to the letter immediately preceding it in the English alphabetical order and each vowel is changed to the letter immediately succeeding it in the English alphabetical order, then how many vowels will be present in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: BISHOP</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given operations:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Consonants are changed to the immediately preceding letters (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• B → A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• S → R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• H → G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• P → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Vowels are changed to the immediately succeeding letters (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• I → J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• O → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The new group of letters formed is: A, J, R, G, P, O.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The vowels in this new group are 'A' and 'O'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are 2 vowels present in the new group.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which letter-cluster does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNRW</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGKP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MPTZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QTXC</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = N (14), N (14) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image114.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = R (18), R (18) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image217.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = W (23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = G (7), G (7) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image114.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = K (11), K (11) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image217.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = P (16)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = T (20), T (20) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image114.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = X (24), X (24) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image217.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = C (29 or 3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MPTZ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image112.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = P (16), P (16) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image114.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = T (20), T (20) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image218.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = Z (26)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, MPTZ does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When a beam of light parallel to the principal axis is incident on a convex mirror, the reflected rays appear to diverge from which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Centre of curvature</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Principal focus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pole of the mirror</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Optical centre</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A convex mirror is a diverging mirror. When rays of light travelling par 252\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the surface area of a sphere is 616 cm², then what is the diameter of that sphere? [Use </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image234.png\" width=\"30\" height=\"56\" alt style=\"vertical-align:middle\" ><span>]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The surface area of a sphere is given by the formula:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image235.png\" width=\"97\" height=\"50\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image236.png\" width=\"40\" height=\"51\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792915239226_image237.png\" width=\"40\" height=\"105\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_imag
