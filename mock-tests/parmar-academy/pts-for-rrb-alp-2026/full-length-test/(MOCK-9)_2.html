<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>18.) MOCK-9 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image017.png\" width=\"35\" height=\"145\" alt style=\"vertical-align:middle\" ><span> इकाई/दिन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P की अकेले की कार्यक्षमता = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image018.png\" width=\"61\" height=\"159\" alt style=\"vertical-align:middle\" ><span> इकाई/दिन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P द्वारा अकेले कार्य को पूरा करने में लिया गया समय = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image019.png\" width=\"32\" height=\"57\" alt style=\"vertical-align:middle\" ><span> दिन।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित संख्या और प्रतीक श्रृंखला का अध्ययन कीजिए और उसके बाद दिए गए प्रश्न का उत्तर दीजिए। गणना केवल बाएं से दाएं की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएं) @ 4 6 % 7 # 8 2 $ 3 * 5 9 @ 2 4 # 6 &amp; 1 (दाएं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई श्रृंखला में ऐसी कितनी संख्याएँ हैं जिनमें से प्रत्येक के ठीक पहले एक प्रतीक और ठीक बाद में एक सम संख्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हमें निम्नलिखित स्वरूप ज्ञात करना है: [प्रतीक] [संख्या] [सम संख्या]।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आइए उन संख्याओं की जाँच करें जिनके ठीक पहले एक प्रतीक है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>@ 4 6 में: '4' के ठीक पहले प्रतीक '@' है और ठीक बाद में सम संख्या '6' है। (पहला युग्म)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>% 7 # में: '7' के ठीक पहले प्रतीक '%' है परंतु ठीक बाद में प्रतीक '#' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># 8 2 में: '8' के ठीक पहले प्रतीक '#' है और ठीक बाद में सम संख्या '2' है। (दूसरा युग्म)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image020.png\" width=\"167\" height=\"50\" alt style=\"vertical-align:middle\" ><span>' है परंतु ठीक बाद में प्रतीक '*' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>* 5 9 में: '5' के ठीक पहले प्रतीक '*' है परंतु ठीक बाद में विषम संख्या '9' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>@ 2 4 में: '2' के ठीक पहले प्रतीक '@' है और ठीक बाद में सम संख्या '4' है। (तीसरा युग्म)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># 6 &amp; में: '6' के ठीक पहले प्रतीक '#' है परंतु ठीक बाद में प्रतीक '&amp;' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>&amp; 1 में: '1' के ठीक पहले प्रतीक '&amp;' है परंतु इसके बाद कोई सम संख्या नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ऐसी कुल 3 संख्याएँ (4, 8 और 2) हैं।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से कौन-सा अनुपात सबसे बड़ा है: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image021.png\" width=\"31\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image022.png\" width=\"39\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image023.png\" width=\"31\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, या </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image024.png\" width=\"39\" height=\"24\" alt style=\"vertical-align:middle\" ><span>?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 : 24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11 : 15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 : 13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 : 10</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सबसे बड़ा अनुपात ज्ञात करने के लिए, प्रत्येक अनुपात को दशमलव मान में परिवर्तित करते हैं या उनकी तुलना करते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image025.png\" width=\"52\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image026.png\" width=\"52\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image027.png\" width=\"52\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image028.png\" width=\"52\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इन दशमलव मानों की तुलना करने पर, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image029.png\" width=\"54\" height=\"133\" alt style=\"vertical-align:middle\" ><span> प्राप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सबसे बड़ा अनुपात </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image024.png\" width=\"39\" height=\"24\" alt style=\"vertical-align:middle\" ><span> है।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यान से पढ़ें। यह मानते हुए कि कथनों में दी गई जानकारी सही है, भले ही वह आमतौर पर ज्ञात तथ्यों से भिन्न प्रतीत होती हो, यह तय करें कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुछ किताबें, पेन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी पेन, स्केल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोई स्केल, इरेज़र नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) कुछ स्केल, किताबें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) कोई पेन, इरेज़र नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(III) कुछ किताबें, इरेज़र हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) और (II) अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (II) और (III) अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी निष्कर्ष अनुसरण करते हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'कुछ किताबें, पेन हैं' और 'सभी पेन, स्केल हैं' से यह निष्कर्ष निकलता है कि किताबों का जो भाग पेन है, वह निश्चित रूप से स्केल भी होगा। अतः 'कुछ स्केल, किताबें हैं' तार्किक रूप से अनुसरण करता है। इसलिए, निष्कर्ष (I) सही है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'सभी पेन, स्केल हैं' और 'कोई स्केल, इरेज़र नहीं है' से स्पष्ट है कि चूंकि सभी पेन पूरी तरह से स्केल के अंदर हैं और कोई भी स्केल इरेज़र नहीं हो सकता, इसलिए कोई भी पेन इरेज़र नहीं हो सकता। अतः निष्कर्ष (II) भी सही है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. किताबों और इरेज़र के बीच कोई निश्चित संबंध नहीं दिया गया है जिससे उनके बीच संबंध होना अनिवार्य हो। अतः निष्कर्ष (III) अनुसरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष (I) और (II) अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कोड भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' का अर्थ है 'A, B का भाई है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' का अर्थ है 'A, B की बहन है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' का अर्थ है 'A, B का पिता है' और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' का अर्थ है 'A, B की माता है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपरोक्त के आधार पर, यदि 'P + Q × R - S' है, तो P का S से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चाचा (पिता का भाई)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्र</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए व्यंजक 'P + Q × R - S' से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'P + Q' का अर्थ है कि P, Q का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'Q × R' का अर्थ है कि Q, R का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'R - S' का अर्थ है कि R, S की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि Q, R का पिता है और R, S की बहन है, इसलिए Q, S का भी पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P, Q (S के पिता) का भाई है, जिसका अर्थ है कि P, S का चाचा (पिता का भाई) है।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>छह सहकर्मियों — काव्या, ललित, मनीष, नितिन, ओम और प्रदीप — का मासिक वेतन अलग-अलग है। नितिन केवल ओम से अधिक कमाता है। ललित, प्रदीप से अधिक कमाता है। काव्या, मनीष से अधिक लेकिन प्रदीप से कम कमाती है। काव्या से अधिक कितने व्यक्ति कमाते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. नितिन केवल ओम से अधिक कमाता है, जिसका अर्थ है कि ओम का वेतन सबसे कम है और नितिन ऊपर से 5वें स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ललित, प्रदीप से अधिक कमाता है: ललित &gt; प्रदीप।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. काव्या, मनीष से अधिक लेकिन प्रदीप से कम कमाती है: प्रदीप &gt; काव्या &gt; मनीष।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इन सभी कथनों को मिलाने पर, वेतन का घटता क्रम इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ललित &gt; प्रदीप &gt; काव्या &gt; मनीष &gt; नितिन &gt; ओम</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, काव्या से अधिक ठीक दो व्यक्ति (ललित और प्रदीप) कमाते हैं।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वायु में ध्वनि तरंगों के संचरण के संबंध में निम्नलिखित में से कौन-सा कथन सही है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माध्यम के कण तरंग संचरण की दिशा के लंबवत दोलन करते हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माध्यम के कण तरंग संचरण की दिशा के समानांतर दोलन करते हैं।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माध्यम के कण स्रोत से श्रोता तक लगातार यात्रा करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ध्वनि तरंगें किसी भौतिक माध्यम की पूर्ण अनुपस्थिति में भी आसानी से संचरित हो सकती हैं।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वायु में ध्वनि तरंगें अनुदैर्ध्य यांत्रिक तरंगें होती हैं। एक अनुदैर्ध्य तरंग में, माध्यम के कण तरंग संचरण की दिशा के समानांतर आगे-पीछे दोलन या कंपन करते हैं, जिससे संपीडन और विरलन के क्षेत्र बनते हैं। माध्यम के कण स्रोत से श्रोता तक भौतिक रूप से यात्रा नहीं करते हैं, बल्कि वे केवल अपनी माध्य स्थिति के इर्द-गिर्द कंपन करते हैं और ऊर्जा का स्थानांतरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णानुक्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: विषम अक्षर-समूह व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDF - EHK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GIK - JMP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT - SVZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LNP - ORU</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षर-समूहों के बीच अनुसरण किया गया तर्क इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक युग्म में, दूसरे समूह के संगत अक्षर पहले समूह के अक्षरों में क्रमशः +3, +4 और +5 जोड़कर प्राप्त किए जाते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. BDF - EHK:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 3 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 4 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) + 5 = K (11)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. GIK - JMP:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (7) + 3 = J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (9) + 4 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 5 = P (16)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. LNP - ORU:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (12) + 3 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (14) + 4 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 5 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. PRT - SVZ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 3 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 6 = Z (26) (यहाँ T + 5 = Y होना चाहिए था)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, 'PRT - SVZ' इस समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक समबाहु त्रिभुज के आंतरिक बिंदु से तीनों भुजाओं पर खींचे गए लंबों की लंबाइयाँ क्रमशः </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image030.png\" width=\"49\" height=\"26\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image031.png\" width=\"49\" height=\"26\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image032.png\" width=\"49\" height=\"26\" alt style=\"vertical-align:middle\" ><span> हैं। त्रिभुज का परिमाप ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>75 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>90 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भुजा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image033.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> और ऊंचाई </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image034.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> वाले एक समबाहु त्रिभुज के लिए, आंतरिक बिंदु से तीनों भुजाओं पर लंबों का योग त्रिभुज की ऊंचाई के बराबर होता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_i े से संबंधित है। उसी प्रकार FAME, JYPZ से संबंधित है। उसी तर्क का पालन करते हुए, PINK निम्नलिखित में से किससे संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TGQF</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TGPE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SGQF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UGQF</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अनुसरित तर्क इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COLD → GMOY के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (+4) = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (−2) = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (+3) = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (−5) = Y</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उसी प्रकार, FAME → JYPZ के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (+4) = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (−2) = Y</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (+3) = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (−5) = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही तर्क PINK पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (+4) = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (−2) = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (+3) = Q</span>  E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, लुप्त अक्षर-समूह VJE है।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P, Q, R, S, T, U और V में से प्रत्येक का साक्षात्कार उसी सप्ताह के सोमवार से शुरू होकर रविवार को समाप्त होने वाले सप्ताह के अलग-अलग दिनों में है। T का साक्षात्कार मंगलवार को है। T और Q के बीच केवल दो व्यक्तियों का साक्षात्कार है। U का साक्षात्कार S से ठीक पहले वाले दिन है। S का साक्षात्कार रविवार को है। R और P के बीच केवल एक व्यक्ति का साक्षात्कार है, जहाँ R का साक्षात्कार P से पहले किसी दिन है। P से पहले कितने व्यक्तियों का साक्षात्कार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के आधार पर, हम सोमवार से रविवार तक का कार्यक्रम निर्धारित कर सकते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. T का साक्षात्कार मंगलवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T और Q के बीच केवल दो व्यक्तियों का साक्षात्कार है, इसलिए Q का साक्षात्कार शुक्रवार को होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. S का साक्षात्कार रविवार को है, और U का साक्षात्कार S से ठीक पहले वाले दिन है, इसलिए U का साक्षात्कार शनिवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अब केवल सोमवार, बुधवार और गुरुवार खाली बचे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12p n/website/bulk_uploader_images/1792163718820_image125.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image126.png\" width=\"42\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही संख्या 194 है।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित अक्षर श्रृंखला को देखें और उसके बाद दिए गए प्रश्न का उत्तर दें। गणना केवल बाएं से दाएं की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएं) B A D F E I G O T H U A L E K M N E U Z R T (दाएं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऐसे कितने स्वर हैं, जिनमें से प्रत्येक के ठीक पहले एक व्यंजन है और ठीक बाद भी एक व्यंजन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हमें ऐसे स्वर खोजने हैं जो इस प्रारूप का पालन करते हैं: व्यंजन — स्वर — व्यंजन।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई श्रृंखला में बाएं से दाएं प्रत्येक स्वर की जांच करते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. B A D → 'A' के ठीक पहले व्यंजन 'B' है और ठीक बाद व्यंजन 'D' है। (शर्त पूरी होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. F E I → 'E' के ठीक बाद स्वर 'I' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E I G → 'I' के ठीक पहले स्वर 'E' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. G O T → 'O' के ठीक पहले व्यंजन 'G' है और ठीक बाद व्यंजन 'T' है। (शर्त पूरी होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. H U A → 'U' के ठीक बाद स्वर 'A' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. U A L → 'A' के ठीक पहले स्वर 'U' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. L E K → 'E' के ठीक पहले व्यंजन 'L' है और ठीक बाद व्यंजन 'K' है। (शर्त पूरी होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8. N E U → 'E' के ठीक बाद स्वर 'U' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9. E U Z → 'U' के ठीक पहले स्वर 'E' है। (शर्त पूरी नहीं होती)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ऐसे कुल 3 स्वर हैं (BAD में A, GOT में O, और LEK में E)।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से कौन-सी रक्त वाहिकाएं शरीर के विभिन्न ऊतकों से रक्त को वापस हृदय तक ले जाती हैं और उनमें रक्त के उल्टे प्रवाह को रोकने के लिए कपाट (वाल्व) होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>धमनियां</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शिराएं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केशिकाएं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>धमनिकाएं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शिराएं (Veins) वे रक्त वाहिकाएं हैं जो विभिन्न अंगों और ऊतकों से रक्त को एकत्र कर वापस हृदय तक लाती हैं। चूंकि शिराओं में रक्त का दबाव धमनियों की तुलना में काफी कम होता है, इसलिए इनकी दीवारें पतली होती हैं और इनमें आंतरिक एक-तरफा कपाट (वाल्व) होते हैं जो रक्त को केवल हृदय की दिशा में प्रवाहित करते हैं और उसे वापस बहने से रोकते हैं।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाँच मित्र — अंकित, भुवन, चेतन, दिनेश और ईशा — एक ही सप्ताह के सोमवार से शुक्रवार तक अलग-अलग दिनों में एक प्रशिक्षण सत्र में भाग लेते हैं। चेतन सोमवार को सत्र में भाग लेता है। दिनेश गुरुवार को सत्र में भाग लेता है। अंकित, भुवन से ठीक पहले वाले दिन सत्र में भाग लेता है। भुवन किस दिन सत्र में भाग लेता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार से शुक्रवार तक की समय-सारणी व्यवस्थित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. चेतन सोमवार को सत्र में भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. दिनेश गुरुवार को सत्र में भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. अंकित, भुवन से ठीक पहले वाले दिन भाग लेता है। लगातार दो खाली दिन केवल मंगलवार और बुधवार हैं। अतः अंकित मंगलवार को और भुवन बुधवार को सत्र में भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. शेष दिन, शुक्रवार को ईशा सत्र में भाग लेती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः भुवन बुधवार को सत्र में भाग लेता है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह प्रश्न नीचे दी गई पाँच तीन-अंकीय संख्याओं पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएँ) 742 386 853 491 627 (दाएँ)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(उदाहरण: 582 – पहला अंक = 5, दूसरा अंक = 8, और तीसरा अंक = 2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि दूसरी सबसे छोटी संख्या के पहले और तीसरे अंक के गुणनफल को सबसे बड़ी संख्या के दूसरे अंक के वर्ग में से घटाया जाए, तो परिणाम क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>29</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई संख्याएँ हैं: 742, 386, 853, 491, 627.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>संख्याओं को आरोही क्रम में व्यवस्थित करने पर: 386 &lt; 491 &lt; 627 &lt; 742 &lt; 853.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सबसे बड़ी संख्या 853 है। इसका दूसरा अंक 5 है। इस अंक का वर्ग = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image127.png\" width=\"32\" height=\"51\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरी सबसे छोटी संख्या 491 है। इसका पहला अंक 4 और तीसरा अंक 1 है। इन अंकों का गुणनफल = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image128.png\" width=\"25\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिणाम = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image129.png\" width=\"38\" height=\"47\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि शब्द 'REPUBLIC' में प्रत्येक व्यंजन को अंग्रेजी वर्णमाला क्रम में उसके ठीक पहले वाले अक्षर से बदल दिया जाए और प्रत्येक स्वर को अंग्रेजी वर्णमाला क्रम में उसके ठीक बाद वाले अक्षर से बदल दिया जाए, और फिर इस प्रकार बने सभी अक्षरों को बाएं से दाएं वर्णमाला क्रम में व्यवस्थित किया जाए, तो बाएं छोर से पांचवां अक्षर कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द: REPUBLIC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नियमों को लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. स्वरों को उनके अगले अक्षर (+1) से बदला जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F, U → V, I → J</span></p><p style=\"margin-top:0pt;margin alt style=\"vertical-align:middle\" ><span> है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक प्रश्न के बाद दो कथन (I) और (II) दिए गए हैं। आपको यह तय करना है कि कथनों में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं। दोनों कथनों को पढ़ें और सही उत्तर चुनें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रश्न: चार मित्र – P, Q, R और S – उत्तर की ओर मुख करके एक सीधी पंक्ति में बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सबसे दाएँ छोर पर कौन बैठा है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) P, Q के दाएँ से दूसरे स्थान पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) S, P के ठीक दाएँ बैठा है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कथन I में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि केवल कथन II में दिया गया डेटा नहीं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि केवल कथन I में दिया गया डेटा नहीं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों में दिया गया डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों में दिया गया डेटा मिलकर भी प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लीजिए उत्तर की ओर मुख किए हुए बाएँ से दाएँ 4 स्थान 1, 2, 3 और 4 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: P, Q के दाएँ से दूसरे स्थान पर बैठा है। (Q, P) के संभावित स्थान (1, 3) या (2, 4) हो सकते हैं। अतः सबसे दाएँ छोर पर कौन बैठा है, यह निश्चित रूप से तय नहीं किया जा सकता। इसलिए, केवल कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: S, P के ठीक दाएँ बैठा है। युग्म (P, S) स्थान (1, 2), (2, 3) या (3, 4) पर हो सकता है। इसलिए, केवल कथन (II) भी पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) को मिलाने पर: (I) से व्यवस्था Q _ P मिलती है और (II) से S, P के ठीक दाएँ है, जिससे क्रम Q _ P S बनता है। चूँकि पंक्ति में कुल 4 ही स्थान हैं, इसलिए यह व्यवस्था पूरी तरह निश्चित हो जाती है: स्थान 1 = Q, स्थान 2 = R, स्थान 3 = P और स्थान 4 = S। अतः सबसे दाएँ छोर पर निश्चित रूप से S बैठा है। इसलिए, कथन I और II दोनों में दिया गया डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रश्न में, एक प्रश्न के बाद दो कथन (I) और (II) दिए गए हैं। आपको यह तय करना है कि कथनों में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अलग-अलग ऊँचाई वाले चार मित्रों — P, Q, R और S — में से सबसे लंबा कौन है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) P, Q और S दोनों से लंबा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) P, R से लंबा है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन I में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि अकेले कथन II में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि अकेले कथन I में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त हैं, लेकिन कोई भी कथन अकेले पर्याप्त नहीं है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों मिलकर भी प्रश्न का उत्तर देने के लिए पर्याप्त नहीं हैं</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: P, Q और S दोनों से लंबा है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image174.png\" width=\"27\" height=\"47\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image175.png\" width=\"25\" height=\"47\" alt style=\"vertical-align:middle\" ><span>)। लेकिन P और R के बीच संबंध अज्ञात है, इसलिए R, P से लंबा हो सकता है। अतः अकेले कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: P, R से लंबा है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792163718820_image176.png\" width=\"27\" height=\"47\" alt style=\"vertical-align:middle\" ><span>)। लेकिन P के सापेक्ष Q और S की ऊँचाई अज्ञात है। अतः अकेले कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) को मिलाने पर: P, Q, S और R तीनों से लंबा है। चूँकि P अन्य तीनों मित्रों से लंबा है, इसलिए P निश्चित रूप से सबसे लंबा है। अतः प्रश्न का उत्तर देने के लिए दोनों कथन I और II मिलकर पर्याप्त हैं, लेकिन कोई भी कथन अकेले पर्याप्त नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात मित्र P, Q, R, S, T, U और V एक सीधी पंक्ति में उत्तर दिशा की ओर मुख करके बैठे हैं। P पंक्ति के अंतिम बाएं छोर पर बैठा है। P और R के बीच केवल दो व्यक्ति बैठे हैं। V, R के ठीक क व्यंजन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हमें निम्नलिखित स्वरूप की पहचान करनी है: व्यंजन – स्वर – व्यंजन।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आइए प्रत्येक स्वर और उसके आस-पास के अक्षरों की जाँच करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K E T → पहले K (व्यंजन) है, बाद में T (व्यंजन) है → गिनती 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R I U → बाद में U (स्वर) है → मान्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I U D → पहले I (स्वर) है → मान्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D O F → पहले D (व्यंजन) है, बाद में F (व्यंजन) है → गिनती 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B A J → पहले B (व्यंजन) है, बाद में J (व्यंजन) है → गिनती 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J O P → पहले J (व्यंजन) है, बाद में P (व्यंजन) है → गिनती 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P E I → बाद में I (स्वर) है → मान्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E I L → पहले E (स्वर) है → मान्य नहीं</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M U S → पहले M (व्यंजन) है, बाद में S (व्यंजन) है → गिनती 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ऐसे कुल 5 स्वर हैं।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला के क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: विषम युग्म व्यंजनों/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDF - HJL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMO - QSU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DFH - JMO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT - VXZ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'DFH - JMO' को छोड़कर अन्य सभी अक्षर-समूह युग्मों में, पहले समूह के प्रत्येक अक्षर में +6 जोड़ने पर दूसरे समूह का संगत अक्षर प्राप्त होता है, और प्रत्येक समूह के क्रमिक अक्षरों के बीच +2 का अंतर होता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) BDF - HJL: B (+6) = H, D (+6) = J, F (+6) = L; साथ ही B (+2) = D (+2) = F तथा H (+2) = J (+2) = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) KMO - QSU: K (+6) = Q, M (+6) = S, O (+6) = U; साथ ही K (+2) = M (+2) = O तथा Q (+2) = S (+2) = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) PRT - VXZ: P (+6) = V, R (+6) = X, T (+6) = Z; साथ ही P (+2) = R (+2) = T तथा V (+2) = X (+2) = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) DFH - JMO: D (+6) = J, लेकिन F (+7) = M और H (+7) = O; साथ ही JMO में J (+3) = M (+2) = O है,  के बाईं ओर से गिना जाता है, तो P और S के बीच केवल दो व्यक्ति बैठे हैं। Q, S के बाईं ओर दूसरे स्थान पर बैठा है। R, P का निकटतम पड़ोसी नहीं है। U, Q का निकटतम पड़ोसी नहीं है। U के बाईं ओर तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेज के चारों ओर 7 स्थानों को दक्षिणावर्त (घड़ी की दिशा में) क्रम में व्यवस्थित करते हैं (केंद्र की ओर मुख करने पर, बायाँ भाग दक्षिणावर्त और दायाँ भाग वामावर्त होता है):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P को स्थिति 1 पर रखें। चूँकि T, P के दाईं ओर तीसरे स्थान पर है, इसलिए T स्थिति 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P के बाईं ओर से गिनने पर, P और S के बीच दो व्यक्ति हैं, इसलिए S स्थिति 4 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q, S के बाईं ओर दूसरे स्थान पर है, इसलिए Q स्थिति 6 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. शेष रिक्त स्थान 2, 3 और 7 हैं। P के पड़ोसी स्थान 2 और 7 हैं। चूँकि R, P का निकटतम पड़ोसी नहीं है, इसलिए R स्थिति 3 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Q स्थिति 6 पर है, इसलिए स्थिति 7, Q का पड़ोसी स्थान है। चूँकि U, Q का पड़ोसी नहीं है, इसलिए U स्थिति 2 पर होगा और V स्थिति 7 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दक्षिणावर्त क्रम: P, U, R, S, T, Q, V है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12
