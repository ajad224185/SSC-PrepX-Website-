<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) MOCK-5 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

t.in/website/bulk_uploader_images/1791443129742_image094.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> जोड़ने पर: M (13) + 2 = O, L (12) + 2 = N, R (18) + 2 = T, O (15) + 2 = Q → ONTQ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, DUST के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. उलटा क्रम: T - S - U - D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. विपरीत अक्षर: G - H - F - W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image094.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> जोड़ने पर: G (7) + 2 = I, H (8) + 2 = J, F (6) + 2 = H, W (23) + 2 = Y → IJHY</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः सही उत्तर IJHY है।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नीचे दिए गए प्रश्न में एक प्रश्न और उसके बाद दो कथन (I) और (II) दिए गए हैं। आपको यह तय करना होगा कि कथनों में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रश्न: तीन मित्रों – रवि, सुरेश और तरुण में सबसे लंबा कौन है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) रवि, सुरेश से लंबा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) तरुण, रवि से लंबा है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन I में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि अकेले कथन II में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन II में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि अकेले कथन I में दिया गया डेटा पर्याप्त नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कथनों I और II में दिया गया डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कथनों I और II में दिया गया डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: रवि &gt; सुरेश। हमें तरुण की ऊंचाई के बारे में ज्ञात नहीं है, इसलिए केवल कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: तरुण &gt; रवि। हमें सुरेश की ऊंचाई के बारे में ज्ञात नहीं है, इसलिए केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कथनों को मिलाने पर: तरुण &gt; रवि &gt; सुरेश।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, तीनों में तरुण सबसे लंबा है। इसलिए, दोनों कथनों I और II का डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात व्यक्ति – P, Q, R, S, T, U और V – सोमवार से शुरू होकर उसी सप्ताह के रविवार को समाप्त होने वाले सात अलग-अलग दिनों में एक सेमिनार में भाग लेते हैं। S से पहले केवल एक व्यक्ति सेमिनार में भाग लेता है। U के बाद केवल दो व्यक्ति सेमिनार में भाग लेते हैं। S और V के बीच तीन व्यक्ति सेमिनार में भाग लेते हैं। P, R से ठीक पहले सेमिनार में भाग लेता है। T, Q से पहले किसी एक दिन सेमिनार में भाग लेता है। T और U के बीच कितने व्यक्ति सेमिनार में भाग लेते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के आधार पर सोमवार से रविवार तक की व्यवस्था निम्न प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. S से पहले केवल एक व्यक्ति भाग लेता है, इसलिए S मंगलवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. U के बाद केवल दो व्यक्ति भाग लेते हैं, इसलिए U शुक्रवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. S और V के बीच तीन व्यक्ति भाग लेते हैं। चूँकि S मंगलवार को है, इसलिए V शनिवार को भाग लेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P, R से ठीक पहले भाग लेता है। लगातार खाली दिन केवल बुधवार और गुरुवार हैं, इसलिए P बुधवार को और R गुरुवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T, Q से पहले किसी दिन भाग लेता है। शेष बचे दिन सोमवार और रविवार हैं, इसलिए T सोमवार को और Q रविवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम क्रम इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनिवार: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रविवार: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (सोमवार) और U (शुक्रवार) के बीच भाग लेने वाले व्यक्ति S, P और R हैं, यानी कुल 3 व्यक्ति हैं।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर दी गई शृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर क्या आना चाहिए?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DTM, GQQ, JNU, MKY, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QHD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PHC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OGC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PID</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में निम्नलिखित पैटर्न का अनुसरण किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला अक्षर: D (+3) → G (+3) → J (+3) → M (+3) → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा अक्षर: T (-3) → Q (-3) → N (-3) → K (-3) → H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा अक्षर: M (+4) → Q (+4) → U (+4) → Y (+4) → C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः लुप्त पद PHC है।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़ें। यह मानते हुए कि कथनों में दी गई जानकारी सही है, भले ही यह सामान्य रूप से ज्ञात तथ्यों से भिन्न प्रतीत होती हो, यह निर्णय लें कि दिए गए निष्कर्षों में से कौन-सा/से कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी पेन, पेंसिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुछ पेंसिल, इरेज़र हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी इरेज़र, शार्पनर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) कुछ शार्पनर, पेंसिल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) कुछ पेंसिल, पेन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(III) सभी पेन, इरेज़र हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) और (II) अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (II) और (III) अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी निष्कर्ष (I), (II) और (III) अनुसरण करते हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'कुछ पेंसिल, इरेज़र हैं' और 'सभी इरेज़र, शार्पनर हैं': चूँकि सभी इरेज़र शार्पनर के अंतर्गत आते हैं और कुछ पेंसिल इरेज़र से संबंधित हैं, इसलिए पेंसिल और इरेज़र का उभयनिष्ठ भाग निश्चित रूप से शार्पनर भी होगा। अतः 'कुछ शार्पनर, पेंसिल हैं' तार्किक रूप से अनुसरण करता है (निष्कर्ष I सही है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'सभी पेन, पेंसिल हैं': सर्वव्यापी सकारात्मक कथन के सीधे परिवर्तन से 'कुछ पेंसिल, पेन हैं' निश्चित रूप से निकलता है (निष्कर्ष II सही है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. पेन और इरेज़र के बीच कोई निश्चित संबंध नहीं दिया गया है। इसलिए 'सभी पेन, इरेज़र हैं' केवल एक संभावना हो सकती है, निश्चित निष्कर्ष नहीं (निष्कर्ष III गलत है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष (I) और (II) अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>छह मित्र P, Q, R, S, T और U एक गोलाकार मेज के चारों ओर केंद्र की ओर मुख करके बैठे हैं। S, P के दायें तीसरे स्थान पर बैठा है। U, P के ठीक बायें बैठा है। R, T के बायें दूसरे स्थान पर बैठा है। P के दायें दूसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना P केंद्र की ओर मुख करके बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S, P के दायें तीसरे स्थान पर बैठा है, अर्थात S, P के ठीक सामने है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U, P के ठीक बायें बैठा है (P के दक्षिणावर्त ठीक बगल में)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अब Q, R और T के लिए स्थान शेष हैं। R, T के बायें दूसरे स्थान पर बैठा है, जो केवल तभी संभव है जब T, U के ठीक बायें बैठे, जिससे R, T के बायें दूसरे स्थान पर आ जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अंतिम रिक्त स्थान पर Q बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार दक्षिणावर्त (clockwise) दिशा में क्रम है: P → U → T → S → R → Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P के दायीं ओर (वामावर्त दिशा में) गिनने पर: पहले स्थान पर Q और दूसरे स्थान पर R है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, P के दायें दूसरे स्थान पर R बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A, B और C ने साझेदारी में एक व्यवसाय शुरू किया। A ने 6 महीने के लिए ₹50,000, B ने 9 महीने के लिए ₹40,000 और C ने 8 महीने के लिए ₹60,000 का निवेश किया। यदि अवधि के अंत में कुल लाभ ₹53,200 था, तो लाभ में B का हिस्सा ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹14,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹16,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹19,600</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹22,400</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लाभ का अनुपात निवेश की गई पूंजी और समय अवधि के गुणनफल के समानुपाती होता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A, B और C के लाभ का अनुपात</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image095.png\" width=\"84\" height=\"100\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader न (II) का डेटा पर्याप्त नहीं है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन (II) में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि अकेले कथन (I) का डेटा पर्याप्त नहीं है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रश्न का उत्तर देने के लिए कथन (I) और (II) दोनों एक साथ आवश्यक हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) दोनों मिलकर भी प्रश्न का उत्तर देने के लिए पर्याप्त नहीं हैं</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: P, Q और R दोनों से भारी है, लेकिन S से हल्का है। इससे क्रम बनता है: S &gt; P &gt; (Q, R)। चूँकि केवल 4 मित्र हैं, इसलिए S सबसे भारी होना चाहिए। अतः, केवल कथन (I) पर्याप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: Q &gt; R। इसमें P और S के बारे में कोई जानकारी नहीं मिलती है। अतः, केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसलिए, अकेले कथन (I) का डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रोहित बिंदु M से चलना शुरू करता है और उत्तर की ओर 15 मीटर चलता है। फिर वह दाएँ मुड़ता है और 20 मीटर चलता है। वह दाएँ मुड़ता है और 35 मीटर चलता है। वह फिर से दाएँ मुड़ता है और 32 मीटर चलता है। अंत में, वह दाएँ मुड़ता है और बिंदु N पर पहुँचने के लिए 20 मीटर चलता है। बिंदु M पर फिर से पहुँचने के लिए उसे बिंदु N से कितनी दूर (न्यूनतम दूरी) और किस दिशा में चलना चाहिए? (सभी मोड़ केवल 90-डिग्री के मोड़ हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूर्व में 12 मीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\">< . T और R के बीच ठीक दो व्यक्ति रहते हैं, इसका अर्थ है कि R मंजिल 4 पर रहता है। 3. P, R के ठीक ऊपर रहता है, इसलिए P मंजिल 5 पर रहता है। 4. S, R के नीचे एक सम संख्या वाली मंजिल पर रहता है। मंजिल 4 के नीचे केवल एक ही सम मंजिल 2 है, इसलिए S मंजिल 2 पर रहता है। 5. U, S के ठीक ऊपर रहता है, इसलिए U मंजिल 3 पर रहता है। 6. केवल मंजिल 6 शेष बचती है, जिस पर Q रहेगा। अतः, सबसे ऊपर वाली मंजिल पर Q रहता है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मधुमक्खी का डंक त्वचा में मेथेनॉइक अम्ल छोड़ने के कारण दर्द और जलन पैदा करता है। उदासीनीकरण के माध्यम से राहत पाने के लिए निम्नलिखित में से किस पदार्थ का लेप लगाया जा सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सिरका</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बेकिंग सोडा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नींबू का रस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टार्टरिक अम्ल</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मधुमक्खी के डंक से मेथेनॉइक अम्ल (फॉर्मिक अम्ल) त्वचा में प्रवेश कर जाता है, जिससे तेज जलन और दर्द होता है। इससे राहत पाने के लिए, बेकिंग सोडा (सोडियम हाइड्रोजन कार्बोनेट, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image177.png\" width=\"60\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) या कैलामाइन विलयन जैसे हल्के क्षारक का लेप लगाया जाता है ताकि अम्ल का उदासीनीकरण हो सके। अन्य विकल्प जैसे सिरका, नींबू का रस और टार्टरिक अम्ल अम्लीय प्रकृति के होते हैं, जो राहत देने के बजाय जलन को बढ़ा देंगे।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शब्द 'SPECTRUM' में प्रत्येक व्यंजन को अंग्रेजी वर्णमाला में उसके तुरंत पहले आने वाले अक्षर से बदल दिया जाता है तथा प्रत्येक स्वर को अंग्रेजी वर्णमाला में उसके तुरंत बाद आने वाले अक्षर से बदल दिया जाता है। इस प्रकार बने नए अक्षर-समूह में दायें छोर से चौथा अक्षर निम्नलिखित में से कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द: SPECTRUM</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शर्तों को लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्यंजनों को उनके तुरंत पहले वाले अक्षर (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image178.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>) से बदला जाता है: S → R, P → O, C → B, T → S, R → Q, M → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्वरों को उनके तुरंत बाद वाले अक्षर (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image179.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) से बदला जाता है: E → F, U → V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार बना नया अक्षर-समूह है: R O F B S Q V L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दायें छोर से गिनने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दायें से पहला = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दायें से दूसरा = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दायें से तीसरा = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दायें से चौथा = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, दायें छोर से चौथा अक्षर S होगा।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10.5 सेमी त्रिज्या वाले एक वृत्त के त्रिज्यखंड का परिमाप 43 सेमी है। इस त्रिज्यखंड का क्षेत्रफल (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image180.png\" width=\"28\" height=\"23\" alt style=\"vertical-align:middle\" ><span> में) कितना है? (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image099.png\" width=\"30\" height=\"56\" alt style=\"vertical-align:middle\" ><span> लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>115.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>105</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>126</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>231</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>त्रिज्यखंड का परिमाप निम्न सूत्र द्वारा दिया जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिमाप</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image181.png\" width=\"34\" height=\"58\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जहाँ </span><img src=\"https://static-appxdb-v2.akama pt;margin-bottom:0pt;font-size:12pt\"><span>दक्षिणावर्त क्रम में व्यवस्था इस प्रकार है: P (1), T (2), R (3), S (4), U (5), और Q (6)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः T (स्थान 2) के विपरीत U (स्थान 5) बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए वेन आरेख द्वारा निम्नलिखित में से कौन-सा वर्ग-समूह सर्वोत्तम रूप से निरूपित होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता, भाई, पुरुष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शाकाहारी, गाय, बाघ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वैज्ञानिक, लेखक, महिलाएँ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इंजीनियर, डॉक्टर, वकील</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया वेन आरेख तीन ऐसे वर्गों को दर्शाता है जो परस्पर एक-दूसरे को आंशिक रूप से काटते हैं, जिससे सात क्षेत्र बनते हैं: तीन एकल क्षेत्र, तीन युग्म प्रतिच्छेदन क्षेत्र और एक केंद्रीय क्षेत्र जहाँ तीनों वर्ग परस्पर मिलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्पों का विश्लेषण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. पिता, भाई, पुरुष: सभी पिता पुरुष होते हैं और सभी भाई भी पुरुष होते हैं। इसे एक बड़े वृत्त के भीतर दो परस्पर प्रतिच्छेदी वृत्तों द्वारा निरूपित किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. शाकाहारी, गाय, बाघ: सभी गाय शाकाहारी होती हैं, जबकि बाघ मांसाहारी होते हैं। इसे एक वृत्त के अंदर दूसरे वृत्त तथा एक पूर्णतः अलग वृत्त द्वारा दर्शाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. वैज्ञानिक, लेखक, margin-bottom:0pt;font-size:12pt\"><span>'A - B' का अर्थ है 'A, B की बहन है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' का अर्थ है 'A, B का भाई है' और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' का अर्थ है 'A, B की माता है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तो व्यंजक 'M × N + O - P' में M का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चाचा (पिता का भाई)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भतीजा</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया व्यंजक: M × N + O - P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M × N → M, N का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N + O → N, O का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. O - P → O, P की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (2) और (3) से स्पष्ट है कि N, O और P दोनों का पिता है। चूँकि M, N (P के पिता) का भाई है, इसलिए M, P का चाचा (पिता का भाई) है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्तंभ I में दिए गए संयोजी ऊतकों के प्रकारों का स्तंभ II में उनके संबंधित कार्यों/विशेषताओं से मिलान कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्तंभ I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. कंडरा (Tendon)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. स्नायु (Ligament)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. एरियोलर ऊतक (Areolar tissue)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्तंभ II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. अंगों के भीतर के स्थान को भरता है और ऊतकों की मरम्मत में सहायता करता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. कंकाल की मांसपेशियों को अस्थियों से जोड़ता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C. एक अस्थि को दूसरी अस्थि से जोड़ता है</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-B, II-C, III-A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-C, II-B, III-A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-B, II-A, III-C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-A, II-C, III-B</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सही मिलान इस प्रकार है:कंडरा (I-B): कंडरा (Tendon) सघन नियमित संयोजी ऊतक है जो कंकाल की मांसपेशियों को अस्थियों से जोड़ता है। यह मजबूत होता है तथा इसमें सीमित लचीलापन होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्नायु (II-C): स्नायु (Ligament) एक रेशेदार संयोजी ऊतक है जो एक अस्थि को दूसरी अस्थि से जोड़ता है। यह काफी लचीला और मजबूत होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एरियोलर ऊतक (III-A): यह एक ढीला संयोजी ऊतक है जो त्वचा और मांसपेशियों के बीच, रक्त वाहिकाओं तथा तंत्रिकाओं के चारों ओर पाया जाता है। यह अंगों के भीतर खाली स्थान को भरता है, आंतरिक अंगों को सहारा देता है तथा ऊतकों की मरम्मत में सहायता करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः सही संयोजन I-B, II-C, III-A है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कोड भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A + B’ का अर्थ है ‘A, B का पिता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A − B’ का अर्थ है ‘A, B की माता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A × B’ का अर्थ है ‘A, B का भाई है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A ÷ B’ का अर्थ है ‘A, B की बहन है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि ‘P × Q − R + S ÷ T’ है, तो P का S से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता की माता का भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता के पिता का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता के पिता का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता की माता का भाई</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए व्यंजक ‘P × Q − R + S ÷ T’ का चरणबद्ध विश्लेषण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P × Q → P, Q का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q − R → Q, R की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R + S → R, S का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. S ÷ T → S, T की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S से P का संबंध देखने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- R, S का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Q, R की माता है (अर्थात् S के पिता की माता)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- P, Q का भाई है (अर्थात् S के पिता की माता का भाई)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, P, S के पिता की माता का भाई है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो पाइप A और B एक टंकी को क्रमशः 24 मिनट और 32 मिनट में भर सकते हैं। यदि दोनों पाइपों को एक साथ खोल दिया जाए, तो पाइप B को कितने समय बाद बंद कर देना चाहिए ताकि टंकी 18 मिनट में पूरी भर जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 मिनट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना टंकी की कुल क्षमता 24 और 32 का ल.स.प. (LCM) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image289.png\" width=\"18\" height=\"23\" alt style=\"vertical-align:middle\" ><span> इकाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाइप A की कार्यक्षमता = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image290.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> इकाई/मिनट</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font :0pt;margin-bottom:0pt;font-size:12pt\"><span>बना अक्षर-समूह = MHQ (कोई स्वर नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. NET:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image310.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image310.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791443129742_image310.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बना अक्षर-समूह = ODU (स्वर 'O' और 'U' शामिल हैं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः ठीक दो अक्षर-समूहों (SDE और ODU) में कम से कम एक स्वर आता है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णानुक्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है? (नोट: भिन्न को व्यंजन/स्वर की संख्या या अक्षर-समूह में उनकी स्थिति के आधार पर नहीं चुना गया है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ACF - HJM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMP - RTW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GIL - OQT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OQT - VXA</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अंग्रेजी वर्णमाला में अक्षरों के स्थानीय मानों का उपयोग किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अक्षर-समूह में आंतरिक स्वरूप इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला अक्षर + 2 = दूसरा अक्षर, और दूसरा अक्षर + 3 = तीसरा अक्षर।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब प्रत्येक युग्म में पहले और दूसरे अक्षर-समूह के संगत अक्षरों के बीच संबंध की जाँच करते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) ACF - HJM:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A(1) + 7 = H(8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C(3) + 7 = J(10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F(6) + 7 = M(13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(प्रत्येक अक्षर में +7 की वृद्धि है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) KMP - RTW:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K(11) + 7 = R(18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M(13) + 7 = T(20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P(16) + 7 = W(23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(प्रत्येक अक्षर में +7 की वृद्धि है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) OQT - VXA:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O(15) + 7 = V(22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q(17) + 7
