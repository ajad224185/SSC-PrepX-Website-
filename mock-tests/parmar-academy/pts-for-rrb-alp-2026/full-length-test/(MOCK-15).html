<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>29.) MOCK-15 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

026. Under the amended Section 11 of the Act, penalties for organized examination-related crimes were substantially strengthened by increasing the minimum term of imprisonment from 5 years to 7 years (extendable up to 10 years) and enhancing the maximum fine from ₹1 crore to ₹10 crore.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If each consonant in the word 'DISPLAY' is changed to the letter immediately preceding it in the English alphabetical order and each vowel is changed to the letter immediately following it in the English alphabetical order, then which letter will be the third from the right end in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: DISPLAY</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given rules:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Each consonant is replaced by its preceding letter (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image010.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> C</spa ": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Axis Bank</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kotak Mahindra Bank</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In May 2025, ICICI Bank announced the discontinuation of its 'PayLater' facility with effect from 8 May 2025. The PayLater service was ICICI Bank's pre-approved credit line on the Unified Payments Interface (UPI) framework introduced under RBI guidelines, allowing customers to make instant transactions and repay within a set billing cycle. The bank informed users to clear their outstanding dues and switch recurring auto-pay mandates to alternative payment modes.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": "Wुय ोंयng पुध ीियियथing ौciधnपiौपौ धसूोnकधक पुध cिधि पुधयनद ृद ूनयूयौing पुोप ोिि cिधिस ोनiौध ीनयं ूनध-धसiौपing cिधिस (ैOंniौ cिधििहो-ध-cिधििहोै)?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rudolf Virchow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Matthias Schleiden</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Theodor Schwann</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Robert Brown</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rudolf Virchow in 1855 first explained that cells divide and new cells are formed from pre-existing cells ('Omnis cellula-e-cellula'). He modified the cell hypothesis proposed by Matthias Schleiden and Theodor Schwann to give the cell theory its final shape.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Where was the 'Ashtalakshmi Mahotsav', celebrating the rich culture and heritage of the eight North Eastern States, inaugurated in December 2024?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>New Delhi</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Guwahati</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shillong</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kolkata</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Prime Minister Narendra Modi inaugurated the first-ever 'Ashtalakshmi Mahotsav' on 6 December 2024 at Bharat Mandapam, Pragati Maidan, New Delhi. The three-day event was held from 6 to 8 December 2024 to showcase the textiles, handicrafts, GI products, and cultural diversity of the eight North Eastern states.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven people, P, Q, R, S, T, U and V are sitting in a straight line facing north. Only two people sit to the right of S. P sits third to the left of S. R sits second to the right of P. U sits at one of the extreme ends of the line. T sits to the immediate left of Q. How many people sit between U and R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven positions from left to right be 1, 2, 3, 4, 5, 6, and 7, all facing north:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Only two people sit to the right of S, which places S at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P sits third to the left of S, so P is at position 2 (5 - 3 = 2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R sits second to the right of P, so R is at position 4 (2 + 2 = 4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. T sits to the immediate left of Q. The only two consecutive vacant spots are positions 6 and 7. Thus, T is at position 6 and Q is at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. U sits at one of the extreme ends. Since position 7 is occupied by Q, U must be at position 1. The remaining person, V, sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: U, P, V, R, S, T, Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U is at position 1 and R is at position 4. The people sitting between them are P and V. Hence, exactly two people sit between U and R.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is thrown vertically upwards, the work done by the gravitational force on the object during its upward motion is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Zero</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Positive</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Negative</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Infinite</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Work done is given by the formula </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image012.png\" width=\"66\" height=\"47\" alt style=\"vertical-align:middle\" ><span>, where </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image013.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is the angle between the applied force and the displacement. During the upward motion of an object, the displacement is directed vertically upwards while the gravitational force acts vertically downwards. Therefore, the angle </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image014.png\" width=\"46\" height=\"50\" alt style=\"vertical-align:middle\" ><span>, giving </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image015.png\" width=\"55\" height=\"51\" alt style=\"vertical-align:middle\" ><span>. Hence, the work done by the gravitational force is negative.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following pairs will undergo a displacement reaction?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NaCl solution and copper metal</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MgCl2 solution and aluminium metal</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FeSO4 solution and silver metal</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AgNO3 solution and copper metal</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A displacement reaction takes place when a more reactive metal displaces a less reactive metal from its salt solution. According to the reactivity series of metals, copper is more reactive than silver. Therefore, copper displaces silver from silver nitrate (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image016.png\" width=\"50\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) solution: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image017.png\" width=\"152\" height=\"73\" alt style=\"vertical-align:middle\" ><span>. In the other options, the metals (copper, aluminium, and silver) are less reactive than the metal ions in the respective salt solutions (sodium, magnesium, and iron), so no displacement reaction occurs.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object moves along a circular path with a constant speed, which of the following physical quantities remains constant?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Velocity</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Linear momentum</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kinetic energy</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Acceleration</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is in uniform circular motion, its speed remains constant, but the direction of motion continuously changes at every point. Since direction changes, vector quantities such as velocity, linear momentum, and centripetal acceleration change continuously. However, kinetic energy is a scalar quantity given by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image018.png\" width=\"55\" height=\"56\" alt style=\"vertical-align:middle\" ><span>, which depends only on mass and speed (magnitude of velocity), and therefore remains constant throughout the motion.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is placed at the centre of curvature of a concave mirror, the image formed is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual, erect and enlarged</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Real, inverted and diminished</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Real, inverted and of the same size</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual, erect and of the same size</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is placed at the centre of curvature (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image019.png\" width=\"10\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) of a concave mirror, the reflected rays converge at the centre of curvature itself. Hence, the image formed is real, inverted, and of the same size as the object.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the pair which follows the same pattern as that followed by the two sets of pai ses are cups.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No cup is a plate.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Some cups are bottles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) No bottle is a plate.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Some bottles are glasses.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. All glasses are cups.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since all glasses are cups and some bottles are glasses, those bottles which are glasses are also cups. Hence, 'Some cups are bottles' logically follows. Thus, conclusion (I) is correct.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. No cup is a plate.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>This means the portion of bottles that are cups cannot be plates (i.e., Some bottles are not plates). However, bottles that are not cups can still be plates. Therefore, 'No bottle is a plate' is not necessarily true and does not follow.</span></ style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fog</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pumice stone</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>An emulsion is a colloidal system in which both the dispersed phase and the dispersion medium are liquids. Milk is a classic example of an emulsion, consisting of liquid fat globules dispersed in water. On the other hand, smoke is a solid aerosol (solid in gas), fog is a liquid aerosol (liquid in gas), and pumice stone is a solid foam (gas in solid).</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which letter-cluster should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BZD, EXH, HVL, KTP, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MST</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NRT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NRU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ORT</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: B (+3) → E (+3) → H (+3) → K (+3) → </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: Z (-2) → X (-2) → V (-2) → T (-2) → </span><span style=\"font-weight:bold\">R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: D (+4) → H (+4) → L (+4) → P (+4) → </span><span style=\"font-weight:bold\">T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing term is </span><span style=\"font-weight:bold\">NRT</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The increase in the girth (thickness) of the stem or root of a plant is primarily due to which of the following tissues?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apical meristem</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Lateral meristem</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Intercalary meristem</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parenchyma</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The lateral meristem (which includes the vascular cambium and cork cambium) lies along the sides of the stem and roots and is responsible for secondary growth, which leads to an increase in the girth or thickness of the plant body. In contrast, the apical meristem causes growth in length at root and shoot tips, while the intercalary meristem facilitates elongation of internodes.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the simple interest on a sum of ₹2,000 invested at a rate of 5% per annum for 4 years?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹400</span></p>" _image072.png\" width=\"35\" height=\"24\" alt style=\"vertical-align:middle\" ><span>. Five years ago, the sum of their ages was 65 years. What will be the age of B after 7 years?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 years</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the present ages of A, B, and C be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image073.png\" width=\"18\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image074.png\" width=\"18\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image075.png\" width=\"18\" height=\"24\" alt style=\"vertical-align:middle\" ><span> years, respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five years ago, the sum of their ages was:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image076.png\" width=\"66\" height=\"93\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image077.png\" width=\"55\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image078.png\" width=\"61\" height=\"90\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Present age of B = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image079.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ><span> years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, age of B after 7 years = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image080.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ><span> years.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Refer to the following number and symbol series and answer the question that follows. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) 4 # 7 @ 6 $ % 8 * 2 &amp; 3 © 4 ! 6 (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many such symbols are there, each of which is immediately preceded by an even number but not immediately followed by an even number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find symbols that follow the pattern: </span><span style=\"font-weight:bold\">[Even Number] → [Symbol] → [Not an Even Number]</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us check each symbol from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4 # 7</span><span>: '#' is preceded by 4 (even number) and followed by 7 (not an even number) → </span><span style=\"font-weight:bold\">Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">7 @ 6</span><span>: '@' is preceded by 7 (odd number) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">6 $' is preceded by 6 (even number) and followed by '%' (a symbol, so not an even number) → Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><span style=\"font-weight:bold\">$' (not an even number) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">8 * 2: '*' is preceded by 8 (even number) but followed by 2 (even number) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2 &amp; 3: '&amp;' is preceded by 2 (even number) and followed by 3 (not an even number) → Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3 © 4: '©' is preceded by 3 (odd number) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4 ! 6: '!' is preceded by 4 (even number) but followed by 6 (even number) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, there are 3 such symbols: #, $, and &amp;.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. You have to take the given statements to be true even if they seem to be at variance from commonly known facts and decide which conclusion(s) logically follow(s) from the given statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All shirts are pants.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some pants are jackets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All jackets are coats.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Some coats are pants.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Some jackets are shirts.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"Some pants are jackets\" and \"All jackets are coats\" imply that the portion of pants that are jackets is necessarily part of coats. Therefore, \"Some coats are pants\" definitely holds true. Hence, conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. While \"All shirts are pants\" and \"Some pants are jackets\", there is no direct definite relation established between shirts and jackets. Hence, \"Some jackets are shirts\" is only a possibility, not a definite conclusion. Thus, conclusion (II) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion (I) follows.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which compound is formed when dilute sulfuric acid is added to black copper(II) oxide, turning the solution blue?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Copper(I) sulfate</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Copper(II) sulfide</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Copper(II) sulfate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Copper(II) sulfite</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When dilute sulfuric acid is added to copper(II) oxide, a neutralization reaction takes place between the basic metal oxide and the acid to form salt and water: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image081.png\" width=\"114\" height=\"76\" alt style=\"vertical-align:middle\" ><span>. The formation of copper(II) sulfate (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image082.png\" width=\"45\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) gives the resulting solution its characteristic blue color.</span></p>", "question_heading": ""} .33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In humans (ureotelic animals), toxic ammonia produced during the deamination of excess amino acids is converted into less toxic urea in the </span><span style=\"font-weight:bold\">liver</span><span> via the urea cycle (ornithine cycle). This urea is then released into the bloodstream and filtered out from the blood by the </span><span style=\"font-weight:bold\">kidneys</span><span> to be excreted in urine.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Below are given two statements numbered I and II. These statements may be independent causes, or effects of independent causes, or of a common cause. One of the statements may be the effect of the other statement. Read both statements and select the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. The local police department increased night patrolling and installed surveillance cameras across major intersections in the town.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. A substantial decline in incidents of night-time burglary and street theft was recorded in the town over the last two months.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is the cause and statement II is its effect.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is the cause and statement I is its effect.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are independent causes.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are effects of independent causes.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Enhanced security measures, such as increased night patrolling and the installation of CCTV cameras (Statement I), directly deter criminals and prevent illegal activities, which naturally leads to a noticeable decline in burglary and theft (Statement II). Therefore, Statement I is the cause and Statement II is its direct effect.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following numbers should replace the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 12, 28, 62, ?, 274</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>132</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>128</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>136</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image118.png\" width=\"34\" height=\"93\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image119.png\" width=\"34\" height=\"93\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website ic-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image123.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the sum of positions (63) is greater than the total number of students (50), this is a case of overlapping.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of students between them = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image124.png\" width=\"132\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image125.png\" width=\"89\" height=\"115\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, there are 11 students between Divya and Karan.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The smallest natural number that must be multiplied by 1800 so that the product becomes a perfect cube is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First, find the prime factorization of 1800:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image126.png\" width=\"35\" height=\"103\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For a number to be a perfect cube, the exponents of all its prime factors must be multiples of 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Here, the exponent of 2 is 3 (already a multiple of 3). The exponent of 3 is 2, and the exponent of 5 is 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To make the exponents multiples of 3, we need one more factor of 3 and one more factor of 5:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image127.png\" width=\"126\" height=\"99\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the smallest natural number to be multiplied is 15, yielding </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image128.png\" width=\"60\" height=\"116\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct statement(s).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. Cytokinin is a plant hormone that promotes cell division.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. Abscisic acid is a plant hormone that inhibits growth.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements A and B are true.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement A is true but B is false.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement B is true but A is false.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements A and B are false.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements are correct:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Cytokinins:</span><span> These are plant hormones that promote active cell division and are found in areas of rapid cell division, such as growing fruits and seeds.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Abscisic acid (ABA):</span><span> Unlike auxins, gibberellins, and cytokinins, abscisic acid acts as a plant growth inhibitor. It inhibits plant growth, induces seed dormancy, and causes wilting and falling of leaves.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The rate of diffusion of liquids and gases increases with an increase in temperature primarily because:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the intermolecular forces of attraction become stronger</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the kinetic energy of the particles increases</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the density of the substance increases</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>the mass of the individual particles increases</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Particles of matter possess kinetic energy due to their continuous motion. When t gn:middle\" ><span>, so it is a composite number.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. For </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image133.png\" width=\"26\" height=\"23\" alt style=\"vertical-align:middle\" ><span>: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image134.png\" width=\"34\" height=\"90\" alt style=\"vertical-align:middle\" ><span>, so it is a composite number.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. For </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image135.png\" width=\"26\" height=\"23\" alt style=\"vertical-align:middle\" ><span>: Since </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image136.png\" width=\"43\" height=\"94\" alt style=\"vertical-align:middle\" ><span>, we check primes less than </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image137.png\" width=\"18\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, which are </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image138.png\" width=\"106\" height=\"24\" alt style=\"vertical-align:middle\" ><span>. None of these primes divide </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image135.png\" width=\"26\" height=\"23\" alt style=\"vertical-align:middle\" ><span>. Therefore, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image135.png\" width=\"26\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is a prime number.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which pair does NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FIL - EHK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNQ - JMP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RUX - QTW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZCF - ADG</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all the pairs except 'ZCF - ADG', each letter of the second cluster is obtained by shifting the corresponding letter of the first cluster by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FIL - EHK: F </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = E, I </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = H, L </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNQ - JMP: K </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = J, N </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = M, Q </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RUX - QTW: R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = Q, U </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = T, X </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In ZCF - ADG:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image011.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = A, C </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image011.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = D, F </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image011.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = G (here, each letter is shifted by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image011.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> instead of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image009.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, 'ZCF - ADG' does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘PRISM’ is coded as ‘47193’, ‘PROUD’ is coded as ‘47682’, and ‘DUMPS’ is coded as ‘28349’. What is the code for ‘O’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given codes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘PRISM’ = ‘47193’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘PROUD’ = ‘47682’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘DUMPS’ = ‘28349’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing ‘PROUD’ and ‘PRISM’, the common letters are P and R, and the common digits are 4 and 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing ‘PROUD’ and ‘DUMPS’, the common letters are P, U, and D, and the common digits are 4, 8, and 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Together, the letters {P, R, U, D} account for the digits {2, 4, 7, 8}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The only remaining letter in ‘PROUD’ is ‘O’, and the only remaining digit in its code ‘47682’ is 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the code for ‘O’ is 6.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which pair does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PJ - JD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WR - QL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZT - TO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SO - MI</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is that each letter of the first cluster is decreased by 6 positions to obtain the corresponding letter of the second cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) PJ - JD: P </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793286172968_image139.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\"
