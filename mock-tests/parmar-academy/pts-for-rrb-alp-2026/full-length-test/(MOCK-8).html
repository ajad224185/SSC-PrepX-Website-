<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>15.) MOCK-8 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

\"><span>Step 2 (Multiplication): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image034.png\" width=\"42\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, substitute these values back into the expression:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image035.png\" width=\"47\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3 (Addition and Subtraction):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image036.png\" width=\"76\" height=\"113\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct answer is -60.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A trader sells an article for ₹1,156 after giving two successive discounts of 20% and 15% on its marked price. Had he sold the article at its marked price without any discount, he would have earned a profit of 36%. What is the cost price (in ₹) of the article?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,250</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,400</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the marked price of the article be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image037.png\" width=\"24\" height=\"24\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Selling Price (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image038.png\" width=\"19\" height=\"24\" alt style=\"vertical-align:middle\" ><span>) after two successive discounts of 20% and 15%:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image039.png\" width=\"73\" height=\"131\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image040.png\" width=\"43\" height=\"179\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image041.png\" width=\"60\" height=\"99\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If no discount is given, the selling price equals the marked price, and the profit is 36%.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image042.png\" width=\"43\" height=\"102\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image043.png\" width=\"51\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image044.png\" width=\"60\" height=\"99\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the cost price of the article is ₹1,250.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six colleagues, A, B, C, D, E, and F, scored different marks in an examination. D scored more marks than only two colleagues. B scored more marks than D but less than C. C did not score the highest marks. E scored more marks than F, who is not the lowest scorer. Who scored the lowest marks?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the six positions in descending order of marks be: 1 &gt; 2 &gt; 3 &gt; 4 &gt; 5 &gt; 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D scored more marks than only two colleagues, which means D is at the 4th position: _ &gt; _ &gt; _ &gt; D &gt; _ &gt; _.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. B scored more marks than D but less than C, so C &gt; B &gt; D. Since C did not score the highest marks (not 1st), C must be 2nd and B must be 3rd: _ &gt; C &gt; B &gt; D &gt; _ &gt; _.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The remaining positions are 1st, 5th, and 6th, and the remaining colleagues are A, E, and F.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. E scored more marks than F, and F is not the lowest scorer (not 6th). If A were 1st, then E would be 5th and F would be 6th, which contradicts that F is not the lowest. Therefore, E must be 1st, F must be 5th, and A must be 6th.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete order is: E &gt; C &gt; B &gt; D &gt; F &gt; A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, A scored the lowest marks.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A solid metallic sphere is melted and recast into 27 identical smaller spheres without any loss of material. If 8 litres of paint was required to paint the surface of the original sphere, how many litres of paint will be required to paint all the smaller spheres?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72 litres</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the radius of the original sphere be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image045.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span> and that of each smaller sphere be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image046.png\" width=\"8\" height=\"23\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the volume remains conserved:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image047.png\" width=\"82\" height=\"211\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Surface area of the original sphere, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image048.png\" width=\"49\" height=\"54\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total surface area of 27 smaller spheres:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image049.png\" width=\"65\" height=\"343\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the total surface area is 3 times the original surface area, the paint required is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image050.png\" width=\"73\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'COLD' is coded as 'ERPI' and 'HEAT' is coded as 'JHEY'. How will 'WARM' be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XCVR</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>YDVR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>YCUS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XDVR</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the code is an increasing addition of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image051.png\" width=\"28\" height=\"100\" alt style=\"vertical-align:middle\" ><span> to the positional values of letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C + 2 = E, O + 3 = R, L + 4 = P, D + 5 = I → ERPI</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H + 2 = J, E + 3 = H, A + 4 = E, T + 5 = Y → JHEY</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to 'WARM':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W (23) + 2 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (1) + 3 = D (4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 5 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, 'WARM' is coded as 'YDVR'.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All cups are plates.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All plates are spoons.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) All spoons are cups.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) All cups are spoons.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. All cups are plates.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. All plates are spoons.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both statements (Universal Affirmative + Universal Affirmative):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All cups are spoons.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Conclusion (II) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>However, 'All cups are spoons' only converts to 'Some spoons are cups', not 'All spoons are cups'. Thus, Conclusion (I) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, only conclusion (II) follows.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In plants, the organic nutrients synthesized during photosynthesis are primarily translocated through the phloem in the form of which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Glucose</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Starch</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sucrose</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cellulose</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In plants, carbohydrates produced by photosynthesis (initially glucose) are converted into sucrose for translocation through the phloem. Sucrose is a non-reducing disaccharide, chemically stable, and water-soluble, making it the most suitable form for transport. Once reaching storage organs, it is usually converted into starch for long-term storage.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image052.png\" width=\"38\" height=\"47\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image053.png\" width=\"38\" height=\"47\" alt style=\"vertical-align:middle\" ><span>, then what is the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image054.png\" width=\"55\" height=\"32\" alt style=\"vertical-a he topmost position. Box J is kept immediately above Box N. Which box is kept immediately below Box M?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions of the boxes from bottom to top be numbered 1 to 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P is at the bottommost position, so P = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two boxes are kept between P and M, so M must be at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box K is immediately above Box M, so K = 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Box L is at the topmost position, so L = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Box J is immediately above Box N. The remaining positions are 2 and 3, which means J = 3 and N = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the arrangement from top to bottom (6 to 1) is: L, K, M, J, N, P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The box kept immediately below Box M is J.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which letter-cluster DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VQMP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TPLO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZUQT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PKGJ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positional values of letters in the English alphabetical order follow a specific pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VQMP: V (22) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image066.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = Q (17) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image067.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = M (13) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image068.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> = P (16)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZUQT: Z (26) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image066.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = U (21) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image067.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span> = Q (17) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_u e, TPLO does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The cost of 8 kg of wheat of type P is ₹288, and the cost of 12 kg of wheat of type Q is ₹576. In what ratio should type P wheat and type Q wheat be mixed so that by selling the mixture at ₹46 per kg, there is a gain of 15%?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 : 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 : 1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 : 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cost price of 1 kg of type P wheat = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image070.png\" width=\"40\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cost price of 1 kg of type Q wheat = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image071.png\" width=\"40\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Selling price of the mixture = ₹46 per kg with a gain of 15%.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cost price of the mixture = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image072.png\" width=\"40\" height=\"79\" alt style=\"vertical-align:middle\" ><span> per kg.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the rule of alligation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ratio of type P to type Q = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image073.png\" width=\"124\" height=\"90\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Question: Among four students – Ankit, Bipin, Chetan, and Deep, who scored the highest marks?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Ankit scored more marks than Bipin and Chetan.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Deep scored more marks than Ankit.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement I alone is sufficient to answer the question, while data in Statement II alone is not</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement II alone is sufficient to answer the question, while data in Statement I alone is not</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in both statements I and II together are sufficient to answer the question</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in both statements I and II together are not sufficient to answer the question</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From Statement (I): Ankit scored more marks than Bipin and Chetan, but Deep's performance is unknown. So, Statement (I) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From Statement (II): Deep scored more marks than Ankit, but the comparison between Deep, Bipin, and Chetan is unknown. So, Statement (II) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining Statements (I) and (II):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Deep &gt; Ankit &gt; Bipin and Chetan.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, Deep scored the highest marks among all four students.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, data in both statements I and II together are sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A, B, and C invest ₹15,000, ₹25,000, and ₹10,000, respectively, in a business. At the end of the year, the total profit earned is ₹15,000. If 20% of the total profit is given to charity and the rest is divided among them in the ratio of their investments, what will be the share of B (in ₹)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4800</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ratio of investments of A, B, and C = </span><img src=\"https://static-appxdb-v2.akamai.n creased by 15% and later decreased by 10%. What is the final price (in ₹) of the laptop?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48,960</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>49,680</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>51,200</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Initial price = ₹48,000</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Price after 15% increase = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image090.png\" width=\"71\" height=\"168\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Price after subsequent 10% decrease = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image091.png\" width=\"73\" height=\"145\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alternatively, net percentage change = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image092.png\" width=\"98\" height=\"143\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Final price = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image093.png\" width=\"71\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons L, M, N, O, P and Q live on six different floors of the same building. The lowermost floor is numbered 1, the floor above it is numbered 2, and so on till the topmost floor is numbered 6. M lives on an even-numbered floor, but not on the topmost floor. Only two persons live between M and P, where P lives below M. Only one person lives between P and N. L lives immediately below Q. Who lives on Floor 5?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information, we can determine the arrangement step-by-step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M lives on an even-numbered floor other than the topmost floor (6). So, M can live on Floor 4 or Floor 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Two persons live between M and P, and P lives below M. This is only possible if M lives on Floor 4 and P lives on Floor 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Only one person lives between P and N. Since P is on Floor 1, N must live on Floor 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. L lives immediately below Q. The only two consecutive vacant floors remaining are 6 and 5. Therefore, Q lives on Floor 6 and L lives on Floor 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining person O lives on Floor 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final floor arrangement from top to bottom is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 6: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 5: L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 4: M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 3: N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 2: O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 1: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, L lives on Floor 5.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each vowel in the word FESTIVAL is changed to the letter immediately following it in the English alphabetical order and each consonant is changed to the letter immediately preceding it in the English alphabetical order. How many vowels are there in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: FESTIVAL</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given operations:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Consonants are changed to the preceding letter (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F → E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S → R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V → U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Vowels are changed to the following letter (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I → J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A → B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The new set of letters formed is: E, F, R, S, J, U, B, K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The vowels in this new group are E and U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are 2 vowels in the new group.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A person standing between two parallel vertical cliffs claps their hands. If the first echo is heard after 1 second and the second echo is heard after 2 seconds, what is the distance between the two cliffs? (Speed of sound in air = 340 m/s)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>340 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>510 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>680 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1020 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the distances t;font-size:12pt\"><span>1. P sits at the extreme left end: Position 1 = P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two persons sit between P and S: Position 4 = S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. T sits to the immediate right of S: Position 5 = T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Q sits to the immediate right of T: Position 6 = Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. R sits adjacent to both P and U: Position 2 = R and Position 3 = U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete arrangement from left to right is: P, R, U, S, T, Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The persons sitting between U and Q are S and T, which means there are 2 persons between them.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each letter in the word DELIGHT is replaced by the letter immediately following it in the English alphabetical order, and then all the letters thus obtained are arranged in alphabetical order from left to right. Which of the following letters will be third from the right end in the new group of letters?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: DELIGHT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Replacing each letter with the letter immediately following it in the alphabetical series:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D → E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L → M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I → J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G → H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H → I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T → U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Letters obtained: E, F, M, J, H, I, U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging these letters in alphabetical order from left to right: E, F, H, I, J, M, U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the right end:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st from right: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd from right: M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd from right: J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the third letter from the right end is J.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Why does a person feel cool and comfortable when sitting in front of a fan while sweating profusely?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The fan significantly lowers the ambient temperature of the room</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Moving air increases the ra ze:12pt\"><span>Radhika starts from Point X and walks 18 m towards South. She takes a left turn and walks 10 m. She then takes a left turn and walks 25 m. Finally, she takes a left turn, walks 10 m and stops at Point Y. How far and towards which direction should she walk in order to reach Point X again?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 m towards South</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 m towards North</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 m towards South</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 m towards North</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the starting Point X be at the coordinates (0, 0).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Radhika walks 18 m towards South: coordinate becomes (0, -18).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. She turns left (towards East) and walks 10 m: coordinate becomes (10, -18).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. She turns left (towards North) and walks 25 m: coordinate becomes (10, -18 + 25) = (10, 7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. She turns left (towards West) and walks 10 m to reach Point Y: coordinate becomes (10 - 10, 7) = (0, 7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Point Y is at (0, 7) and Point X is at (0, 0). Therefore, to reach Point X from Point Y, she needs to walk 7 m towards South.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The provisions related to the allocation of seats in the Council of States (Rajya Sabha) are contained in which Schedule of the Indian Constitution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second Schedule</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fourth Schedule</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seventh Schedule</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fifth Schedule</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Fourth Schedule of the Indian Constitution deals with the allocation of seats in the Rajya Sabha (Council of States) to the States and Union Territories. The Second Schedule deals with salaries, allowances, and emoluments; the Fifth Schedule relates to the administration of Scheduled Areas and Scheduled Tribes; and the Seventh Schedule specifies the distribution of powers through the Union, State, and Concurrent Lists.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five persons – P, Q, R, S, and T – attend a seminar on different days from Monday to Friday of the same week, with only one person attending each day. P attends the seminar on Wednesday. Q attends immediately before P. Only one person attends between P and T, where T attends on a day after P. If R attends on a day after Wednesday, on which day does R attend the seminar?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Monday</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tuesday</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thursday</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Friday</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P attends on Wednesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q attends immediately before P, which means Q attends on Tuesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Only one person attends between P and T, and T attends after P. Since P is on Wednesday, T must attend on Friday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The remaining days are Monday and Thursday for R and S. Since R attends on a day after Wednesday, R must attend on Thursday (and S attends on Monday).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, R attends the seminar on Thursday.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to Bohr's model of the hydrogen atom, what is the energy of an electron in the third orbit (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image131.png\" width=\"25\" height=\"47\" alt style=\"vertical-align:middle\" ><span>) if the ground-state energy (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image132.png\" width=\"25\" height=\"47\" alt style=\"vertical-align:middle\" ><span>) is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792080276455_image133.png\" width=\"60\" height=\"24\" alt style=\"vertical-align:middle\" ><span>?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>-4.53 eV</span></p>", "option2": " <p styl pan>PRKM is related to UWPR in a certain way based on the English alphabetical order. In the same way, BDGI is related to GILN. To which of the following is FKNR related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JORV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KQTV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KPSW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LPTX</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is that each letter is shifted forward by 5 positions in the English alphabetical order:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P + 5 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R + 5 = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K + 5 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 5 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, PRKM is related to UWPR.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B + 5 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 5 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G + 5 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I + 5 = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, BDGI is related to GILN.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to FKNR:</span></p><p style=\"margi
