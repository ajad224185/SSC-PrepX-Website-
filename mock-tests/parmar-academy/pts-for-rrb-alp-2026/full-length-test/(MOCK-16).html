356488482_image189.png\" width=\"129\" height=\"29\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>India's fastest and largest Artificial Intelligence (AI) supercomputing system, 'AIRAWAT', is installed at which of the following institutions?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C-DAC, Pune</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IISc, Bengaluru</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IIT Delhi</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ISRO, Bengaluru</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'AIRAWAT' (AI Research Analytics and Knowledge Dissemination Platform) is India's fastest AI supercomputing system. It is deployed at the Centre for Development of Advanced Computing (C-DAC) in Pune under the National Programme on AI by the Ministry of Electronics and Information Technology (MeitY). It achieved global recognition by securing a prominent spot in the Top 500 Global Supercomputing list.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who among the following sports personalities is the author of the autobiography titled 'The Race of My Life'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Milkha Singh</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kapil Dev</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Abhinav Bindra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sachin Tendulkar</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'The Race of My Life' is the autobiography of legendary Indian track and field sprinter Milkha Singh, popularly known as 'The Flying Sikh'. The book was co-authored with his daughter, Sonia Sanwalka.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 'P' stands for '÷', 'Q' stands for '×', 'R' stands for '+', and 'S' stands for '−', what will come in place of the question mark '?' in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48 R 96 P 8 Q 4 S 37 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>47</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>59</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>63</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>71</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation: 48 R 96 P 8 Q 4 S 37 = ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Replacing the letters with their respective mathematical signs:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image190.png\" width=\"147\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image191.png\" width=\"119\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image192.png\" width=\"92\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image193.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 59 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven boxes, A, B, C, D, E, F and G, are kept one above the other, but not necessarily in the same order. Only A is kept above E. Only three boxes are kept between E and G. Only B is kept below G. F is kept immediately above C. D is kept above F. Which box is kept third from the top?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions be numbered 1 to 7 from top to bottom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"Only A is kept above E\" means A is at the top (position 1) and E is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. \"Only three boxes are kept between E and G\" means G is at position 6 (boxes at positions 3, 4, and 5 are between them).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. \"Only B is kept below G\" means B is at the bottom (position 7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. \"F is kept immediately above C\" means F and C occupy consecutive positions (either 3, 4 or 4, 5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Since \"D is kept above F\", D must occupy position 3, F occupies position 4, and C occupies position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the arrangement from top to bottom is: A, E, D, F, C, G, B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the box kept third from the top is D.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which pair does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BGL - EJO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FKP - INS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PUZ - SYC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LQV - OTY</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the pairs of letter-clusters is that each letter of the second cluster is obtained by adding 3 to the alphabetical positional value of the corresponding letter of the first cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BGL - EJO:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 3 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (7) + 3 = J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (12) + 3 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FKP - INS:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) + 3 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 3 = N (14)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 3 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LQV - OTY:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (12) + 3 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 3 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) + 3 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PUZ - SYC:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 3 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (21) + 4 = Y (25) [does not follow +3]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z (26) + 3 = C (3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, PUZ - SYC is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The length of the longest rod that can be placed in a cubical room is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image194.png\" width=\"54\" height=\"23\" alt style=\"vertical-align:middle\" ><span>. What is the total cost of painting the four walls and the ceiling of the room at the rate of ₹25 per </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image195.png\" width=\"22\" height=\"21\" alt style=\"vertical-align:middle\" ><span>?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹22,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹28,125</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹33,750</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹25,625</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The length of the longest rod that can be placed in a cube is equal to its space diagonal.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Space diagonal = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image196.png\" width=\"187\" height=\"23\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Area to be painted = Area of 4 walls + Area of ceiling = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image197.png\" width=\"109\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Area = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image198.png\" width=\"223\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total cost of painting = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image199.png\" width=\"149\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In terms of colloidal mixtures, milk is an example of a/an:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gel</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Emulsion</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sol</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Foam</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Milk is a colloidal mixture classified as an </span><span style=\"font-weight:bold\">emulsion</span><span>. An emulsion is a colloid of two or more immiscible liquids where both the dispersed phase and the dispersion medium are liquids. In milk, liquid butterfat globules are dispersed in water.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is India's rank on the Corruption Perceptions Index (CPI) 2025, released by Transparency International in February 2026?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>85th</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>91st</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96th</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>103rd</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the Corruption Perceptions Index (CPI) 2025 released by Transparency International in February 2026, India climbed 5 spots to rank </span><span style=\"font-weight:bold\">91st</span><span> out of 182 countries and territories with a score of 39 out of 100. In the previous edition (CPI 2024), India was ranked 96th.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Under the 'Yuva Sangam' youth exchange programme, the thematic pillar 'Parampara' primarily focuses on which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Science and technology</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Traditions and culture</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Digital banking</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>National defense</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'Yuva Sangam' is a flagship youth exchange initiative launched under the 'Ek Bharat Shreshtha Bharat' (EBSB) programme by the Ministry of Education (with Phase VII registrations conducted in August 2026). The programme provides multi-dimensional exposure to participating youth across five broad thematic pillars (the 5 Ps):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Paryatan</span><span> (Tourism)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Parampara</span><span> (Traditions and Culture)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Pragati</span><span> (Development and Governance)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Paraspar Sampark</span><span> (People-to-People Connect)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Prodyogiki</span><span> (Technology and Innovation)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the pillar 'Parampara' is centered on traditions and cultural heritage.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider the following statements regarding cellular respiration:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a. The process of glycolysis takes place in the cytoplasm and does not require oxygen.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>b. The breakdown of pyruvate into carbon dioxide, water, and energy takes place in the mitochondria.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>c. In yeast, during anaerobic respiration, pyruvate is converted into ethanol and carbon dioxide.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the statements given above is/are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only a and b</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only b and c</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only a and c</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a, b and c</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All three statements are correct:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Glycolysis is the initial pathway of cellular respiration wherein glucose (a 6-carbon molecule) is broken down into pyruvate (a 3-carbon molecule). It occurs in the cytoplasm and does not require oxygen.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. In aerobic conditions, pyruvate enters the mitochondria, where it is completely oxidized into carbon dioxide, water, and ATP.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. In yeast, anaerobic respiration (fermentation) takes place in the absence of oxygen, converting pyruvate into ethanol (a 2-carbon compound) and carbon dioxide.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If each consonant in the word DOCUMENT is replaced with the letter immediately preceding it in the English alphabetical series, and each vowel is replaced with the letter immediately following it in the English alphabetical series, and then all the letters thus formed are arranged in alphabetical order from left to right, which letter will be fifth from the left end?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: DOCUMENT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Vowels and Consonants in the word:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consonants: D, C, M, N, T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vowels: O, U, E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Applying the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each consonant is replaced by the preceding letter: D → C, C → B, M → L, N → M, T → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each vowel is replaced by the following letter: O → P, U → V, E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letters obtained are: C, P, B, V, L, F, M, S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Arranging all the letters in alphabetical order from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B, C, F, L, M, P, S, V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The fifth letter from the left end is </span><span style=\"font-weight:bold\">M</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": "Wुय ोंयng पुध ीियियथing ौciधnपiौपौ धसूोnकधक पुध cिधि पुधयनद ृद ूनयूयौing पुोप ोिि िiॅing cिधिस ोनiौध ीनयं ूनध-धसiौपing cिधिस (ैOंniौ cिधििहो-ध cिधििहोै)?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rudolf Virchow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Robert Brown</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Theodor Schwann</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J. E. Purkinje</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In 1855, Rudolf Virchow first explained that cells divide and new cells are formed from pre-existing cells (</span><span style=\"font-style:italic\">Omnis cellula-e cellula</span><span>). He modified the initial cell theory formulated by Matthias Schleiden (1838) and Theodor Schwann (1839) to give it a final shape.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In August 2026, Air Marshal Tejpal Singh assumed charge as the _______ of the Indian Air Force.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vice Chief of the Air Staff</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chief of the Air Staff</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Deputy Chief of the Air Staff</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Chief of Integrated Defence Staff</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Air Marshal Tejpal Singh assumed the appointment of </span><span style=\"font-weight:bold\">Deputy Chief of the Air Staff (DCAS)</span><span> on 1 August 2026. He succeeded Air Marshal Awadhesh Kumar Bharti, who superannuated from service on 31 July 2026. Commissioned as a fighter pilot in June 1990, Air Marshal Tejpal Singh is a Category 'A' Qualified Flying Instructor and an Experimental Test Pilot with over 3,500 hours of flying experience.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which pair does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DHK - HLO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QTX - UXB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MPS - QTV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RUZ - VYD</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positional values of letters in the English alphabetical order are as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">DHK - HLO:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 4 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) + 4 = L (12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 4 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each corresponding letter increases by +4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">QTX - UXB:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 4 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 4 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>X (24) + 4 = B (28 − 26 = 2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each corresponding letter increases by +4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">RUZ - VYD:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (21) + 4 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z (26) + 4 = D (30 − 26 = 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each corresponding letter increases by +4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">MPS - QTV:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 4 = Q (17)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 4 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 3 = V (22) (Here the last letter increases by +3 instead of +4; it should be W)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, </span><span style=\"font-weight:bold\">MPS - QTV</span><span> does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven friends, J, K, L, M, N, O and P, are sitting in a straight row facing north. K sits at the extreme right end of the row. Only three people sit between K and M. P sits second to the left of M. L sits third to the right of J. O is not an immediate neighbour of M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many people sit between M and O?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. There are 7 positions in the row from left to right: 1, 2, 3, 4, 5, 6, 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. K sits at the extreme right end: K is at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Only three people sit between K and M: M is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P sits second to the left of M: P is at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. L sits third to the right of J: the available positions for J and L such that L is three places to the right of J are positions 2 and 5 (since position 4 + 3 = 7 is already occupied by K). Thus, J is at position 2 and L is at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Positions 4 and 6 are left for N and O. Since O is not an immediate neighbour of M (position 3), O cannot be at position 4. Therefore, O is at position 6 and N is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: P, J, M, N, L, O, K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M is at position 3 and O is at position 6. The people sitting between them are N and L, which is a total of 2 people.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following functional groups is formed by the combination of a carbonyl group and a hydroxyl group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ketone group</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Aldehyde group</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Carboxyl group</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ester group</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The carboxyl group (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image200.png\" width=\"59\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) is a functional group consisting of a carbonyl group (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image201.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) directly bonded to a hydroxyl group (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image202.png\" width=\"38\" height=\"21\" alt style=\"vertical-align:middle\" ><span>). The term 'carboxyl' itself is derived from the combination of </span><span style=\"font-weight:bold\">carb</span><span>onyl and hydr</span><span style=\"font-weight:bold\">oxyl</span><span>. It is the defining functional group of carboxylic acids such as ethanoic acid.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A statement is followed by two courses of action numbered I and II. Assuming everything in the statement to be true, decide which of the suggested courses of action logically follow(s) for pursuing.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Many commuters on a busy stretch of a national highway have complained that streetlights are non-functional, leading to an increase in road accidents at night.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Courses of Action:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. The highway authority should immediately repair the streetlights and install high-visibility reflective signboards along the stretch.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. The traffic department should completely ban all vehicular movement on this highway during night hours.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both courses of action I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither course of action I nor II follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Course of action I directly addresses the root cause of the problem (poor visibility due to non-functional streetlights) in a practical, constructive, and feasible manner. Hence, I follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Course of action II is an extreme and disproportionate measure; completely banning vehicular movement on a national highway causes immense disruption to public travel and freight transport rather than solving the infrastructure defect. Hence, II does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only course of action I follows.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which fundamental law of inheritance was formulated by Gregor Mendel based on the results of his dihybrid cross experiments on pea plants?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Law of Dominance</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Law of Segregation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Law of Independent Assortment</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Law of Linkage</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gregor Mendel formulated the </span><span style=\"font-weight:bold\">Law of Independent Assortment</span><span> based on his dihybrid cross experiments involving two pairs of contrasting traits (such as seed shape and seed color). This law states that when two pairs of traits are combined in a hybrid, segregation of one pair of characters is independent of the other pair of characters during gamete formation, resulting in a phenotypic ratio of 9 : 3 : 3 : 1 in the </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image203.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span> generation. In contrast, the Law of Dominance and the Law of Segregation were derived from monohybrid crosses.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following statements is INCORRECT regarding acids, bases, and the pH scale?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>At 25 °C, the pH value of an acidic solution is always less than 7.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>As the concentration of hydronium ions in a solution increases, its pH value also increases.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The human body functions within a narrow pH range of approximately 7.0 to 7.8.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Antacids are mild bases used to neutralize excess acid in the stomach.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement B is incorrect. The pH of a solution is inversely related to the concentration of hydrogen or hydronium ions (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image204.png\" width=\"40\" height=\"21\" alt style=\"vertical-align:middle\" ><span>), defined as </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image205.png\" width=\"128\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Therefore, higher hydronium ion concentration corresponds to a lower pH value (greater acidity). All other given statements are scientifically correct.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven people, P, Q, R, S, T, U and V, are sitting in a straight row facing north.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S sits third from the left end of the row. T sits third to the right of S. Q sits to the immediate right of T. P sits to the immediate left of S. Only three people sit between U and R, where U sits to the left of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many people sit between V and T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can determine the positions from left to right (1 to 7):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. S sits third from the left end: _ _ S _ _ _ _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T sits third to the right of S (position 3 + 3 = 6): _ _ S _ _ T _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q sits to the immediate right of T (position 7): _ _ S _ _ T Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P sits to the immediate left of S (position 2): _ P S _ _ T Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining vacant positions are 1, 4, and 5. Since exactly three people sit between U and R, and U is to the left of R, U must be at position 1 and R must be at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The only remaining person, V, must sit at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: U, P, S, V, R, T, Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V is at position 4 and T is at position 6. Only R sits between V and T. Therefore, only one person sits between V and T.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sum of seven consecutive odd numbers is 343. What is the difference between the square of the largest number and the square of the smallest number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1128</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1176</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1224</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1092</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven consecutive odd numbers be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image206.png\" width=\"247\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Their sum is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image207.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The smallest number is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image208.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The largest number is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image209.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The difference between the squares of the largest and smallest numbers is:</span></p><p style=\"margin-  style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SGW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: C (+4) → G (+4) → K (+4) → O (+4) → </span><span style=\"font-weight:bold\">S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: P (−2) → N (−2) → L (−2) → J (−2) → </span><span style=\"font-weight:bold\">H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: D (+5) → I (+5) → N (+5) → S (+5) → </span><span style=\"font-weight:bold\">X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing letter-cluster is </span><span style=\"font-weight:bold\">SHX</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When a hanging carpet is beaten with a stick, dust particles start coming out of it. This phenomenon is an application of which of the following?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Newton's First Law of Motion</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Newton's Second Law of Motion</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Newton's Third Law of Motion</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Law of Conservation of Momentum</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Newton's First Law of Motion states that an object at rest stays at rest, and an object in motion stays in motion with the same speed and in the same direction, unless acted upon by an unbalanced external force. This property of an object to resist any change in its state of rest or motion is called inertia. When a hanging carpet is beaten with a stick, the carpet suddenly moves, but the dust particles tend to remain at rest due to the inertia of rest. As a result, the dust particles separate from the carpet and fall down under the influence of gravity.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is thrown vertically upwards, what is the nature of the work done by the gravitational force during its upward motion?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Positive</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Negative</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Zero</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Infinite</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Work done is given by the formula </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image219.png\" width=\"109\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, where </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image220.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span> is the angle between the applied force and the direction of displacement. When an object moves vertically upwards, the gravitational force acts vertically downwards. Thus, the angle between the displacement and the gravitational force is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image221.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Since </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356488482_image222.png\" width=\"98\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, the work done by gravity is negative.</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
