<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>32.) MOCK-16 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

ont-weight:bold\">अंतरालीय (एरियोलर) ऊतक</span><span> अंगों के अंदर के स्थानों को भरता है और आंतरिक संरचनाओं को सहारा देता है।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फरवरी 2026 में, फाइनल मुकाबले में कर्नाटक पर पहली पारी में निर्णायक बढ़त हासिल करके किस टीम ने अपना पहला रणजी ट्रॉफी क्रिकेट खिताब जीता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बंगाल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विदर्भ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जम्मू और कश्मीर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उत्तराखंड</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जम्मू और कश्मीर ने फरवरी 2026 में अपने पहले फाइनल मुकाबले में ऐतिहासिक जीत दर्ज करते हुए अपना पहला रणजी ट्रॉफी खिताब जीता। हुबली (कर्नाटक) के केएससीए (KSCA) स्टेडियम में खेले गए 91वें संस्करण (2025-26 सत्र) के फाइनल में, जम्मू और कश्मीर ने पहली पारी में 584 रन बनाकर आठ बार की चैंपियन कर्नाटक को 293 रन पर समेट दिया और पहली पारी में 291 रनों की निर्णायक बढ़त के आधार पर भारत की प्रतिष्ठित प्रथम श्रेणी घरेलू क्रिकेट ट्रॉफी अपने नाम की।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर निम्नलिखित में से कौन-सा अक्षर-समूह आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DZB, GWF, JTJ, MQN, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QNR</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PMS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font- </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• प्रत्येक स्वर को उसके बाद आने वाले अक्षर से बदला जाता है (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O → P, U → V, E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• प्रत्येक व्यंजन को उसके पहले आने वाले अक्षर से बदला जाता है (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D → C, C → B, M → L, N → M, T → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाईं ओर से दाईं ओर अक्षरों का नया क्रम है: C, P, B, V, L, F, M, S।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाईं ओर से पाँचवें स्थान पर आने वाला अक्षर </span><span style=\"font-weight:bold\">L</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' का अर्थ है 'A, B का पिता है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' का अर्थ है 'A, B की पत्नी है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' का अर्थ है 'A, B की पुत्री है', और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' का अर्थ है 'A, B का भाई है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि 'K ÷ L + M - N + O' है, तो K का O से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता के पिता का भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता की माता का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता के भाई का पुत्र</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> ic-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image022.png\" width=\"242\" height=\"21\" alt style=\"vertical-align:middle\" ><span>ऊष्मा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, यह संयोजन अभिक्रिया का एक उदाहरण है।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से कौन-सा एककोशिकीय जीव नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पैरामीशियम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूग्लीना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हाइड्रा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>क्लैमाइडोमोनास</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हाइड्रा एक बहुकोशिकीय मीठे पानी का जीव है जो नाइडेरिया (सीलेन्ट्रेटा) संघ से संबंधित है और इसमें ऊतक स्तर का शारीरिक संगठन होता है। इसके विपरीत, पैरामीशियम, यूग्लीना और क्लैमाइडोमोनास सभी एककोशिकीय सूक्ष्मजीव हैं।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में, ‘CRANE’ को ‘72549’ के रूप में कूटबद्ध किया जाता है, ‘TRAIN’ को ‘91872’ के रूप में, और ‘STARE’ को ‘25317’ के रूप में कूटबद्ध किया जाता है। दी गई कूट भाषा में ‘I’ के लिए कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": " N (14) + 6 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (12) + 6 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (15) + 6 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उसी प्रकार,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 6 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 6 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (14) + 6 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 6 = W (23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGFI पर समान तर्क लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 6 = J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (7) + 6 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) + 6 = L (12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (9) + 6 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, DGFI का संबंध JMLO से है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। आपको दिए गए कथनों को सत्य मानना है, भले ही वे सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होते हों, और तय करना है कि कौन-सा/से निष्कर्ष दिए गए कथनों का तार्किक रूप से अनुसरण करता/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुछ आम, फल हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोई भी फल, मीठा नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) कुछ आम, मीठे नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) कोई भी आम, मीठा नहीं है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. कथनों के अनुसार, 'कुछ आम, फल हैं' और 'कोई भी फल, मीठा नहीं है'। आम का वह भाग जो फल है, मीठा नहीं हो सकता क्योंकि कोई भी फल मीठा नहीं है। इसलिए, 'कुछ आम, मीठे नहीं हैं' निश्चित रूप से अनुसरण करता है (निष्कर्ष I अनुसरण करता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. हम निश्चित रूप से यह नहीं कह सकते कि कोई भी आम मीठा नहीं है, क्योंकि जो आम फल नहीं हैं, वे मीठे हो भी सकते हैं। इसलिए, निष्कर्ष (II) अनुसरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वार्षिक रूप से संयोजित चक्रवृद्धि ब्याज पर निवेश की गई कोई धनराशि 3 वर्षों में स्वयं की </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image083.png\" width=\"20\" height=\"29\" alt style=\"vertical-align:middle\" ><span> गुनी हो जाती है। प्रति वर्ष ब्याज दर क्या है?</span></p>", "option1": "<p style=\"marg  alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image197.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः सही उत्तर 59 है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात बॉक्स, A, B, C, D, E, F और G, एक के ऊपर एक रखे गए हैं, लेकिन जरूरी नहीं कि इसी क्रम में हों। केवल A, E के ऊपर रखा गया है। E और G के बीच केवल तीन बॉक्स रखे गए हैं। केवल B, G के नीचे रखा गया है। F, C के ठीक ऊपर रखा गया है। D, F के ऊपर रखा गया है। ऊपर से तीसरा बॉक्स कौन-सा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना ऊपर से नीचे तक पदों की संख्या 1 से 7 है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"केवल A, E के ऊपर रखा गया है\" का अर्थ है कि A सबसे ऊपर (स्थान 1) है और E स्थान 2 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. \"E और G के बीच केवल तीन बॉक्स रखे गए हैं\" का अर्थ है कि G स्थान 6 पर है (स्थान 3, 4 और 5 पर स्थित बॉक्स उनके बीच हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. \"केवल B, G के नीचे रखा गया है\" का अर्थ है कि B सबसे नीचे (स्थान 7) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. \"F, C के ठीक ऊपर रखा गया है\" का अर्थ है कि F और C लगातार स्थानों (या तो 3, 4 या 4, 5) पर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. चूँकि \"D, F के ऊपर रखा गया है\", इसलिए D स्थान 3 पर होगा, F स्थान 4 पर होगा और C स्थान 5 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः ऊपर से नीचे का क्रम है: A, E, D, F, C, G, B।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसलिए, ऊपर से तीसरा बॉक्स D है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: भिन्न समूह, व्यंजन/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BGL - EJO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FKP - INS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PUZ - SYC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LQV - OTY</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षर-समूहों के युग्मों में अनुसरण किया गया पैटर्न यह है कि दूसरे समूह का प्रत्येक अक्षर, पहले समूह के संगत अक्षर के वर्णमाला स्थानीय मान में 3 जोड़कर प्राप्त किया जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BGL - EJO:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 3 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:1 -size:12pt\"><span>कोलाइडल मिश्रण के संदर्भ में, दूध निम्नलिखित में से किसका एक उदाहरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जेल (Gel)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पायस (Emulsion)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सॉल (Sol)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फोम (Foam)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूध एक कोलाइडल मिश्रण है जिसे </span><span style=\"font-weight:bold\">पायस (Emulsion)</span><span> के रूप में वर्गीकृत किया जाता है। पायस दो या दो से अधिक अमिश्रणीय द्रवों का एक कोलाइड होता है, जिसमें परिक्षिप्त प्रावस्था और परिक्षेपण माध्यम दोनों द्रव होते हैं। दूध में जल के भीतर वसा की छोटी बूंदें परिक्षिप्त होती हैं।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फरवरी 2026 में ट्रांसपेरेंसी इंटरनेशनल द्वारा जारी भ्रष्टाचार धारणा सूचकांक (CPI) 2025 में भारत को कौन-सा स्थान प्राप्त हुआ है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>85वां</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>91वां</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96वां</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>103वां</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फरवरी 2026 में ट्रांसपेरेंसी इंटरनेशनल द्वारा जारी भ्रष्टाचार धारणा सूचकांक (CPI) 2025 में, भारत 100 में से 39 के स्कोर के साथ 182 देशों और क्षेत्रों में 5 पायदान चढ़कर </span><span style=\"font-weight:bold\">91वें</span><span> स्थान पर पहुंच गया। इसके पिछले संस्करण (CPI 2024) में भारत 96वें स्थान पर था।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'युवा संगम' युवा विनिमय कार्यक्रम के अंतर्गत, 'परंपरा' (Parampara) विषयगत स्तंभ मुख्य रूप से निम्नलिखित में से किस पर केंद्रित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विज्ञान और प्रौद्योगिकी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रीति-रिवाज और संस्कृति</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिजिटल बैंकिंग</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राष्ट्रीय सुरक्षा</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'युवा संगम' शिक्षा मंत्रालय द्वारा 'एक भारत श्रेष्ठ भारत' (EBSB) पहल के तहत शुरू किया गया एक प्रमुख युवा विनिमय कार्यक्रम है (जिसके चरण VII का पंजीकरण अगस्त 2026 में आयोजित किया गया था)। यह कार्यक्रम पाँच विषयगत स्तंभों (5 P) पर आधारित है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">पर्यटन</span><span> (Tourism)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">परंपरा</span><span> (Traditions and Culture)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">प्रगति</span><span> (Development and Governance)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">परस्पर संपर्क</span><span> (People-to-People Connect)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">प्रौद्योगिकी</span><span> (Technology and Innovation)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः 'परंपरा' विषयगत स्तंभ मुख्य रूप से रीति-रिवाजों और संस्कृति पर केंद्रित है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोशिकीय श्वसन के संबंध में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a. ग्लाइकोलाइसिस की प्रक्रिया कोशिकाद्रव्य (साइटोप्लाज्म) में होती है और इसके लिए ऑक्सीजन की आवश्यकता नहीं होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>b. ऑक्सीजन की उपस्थिति में पायरुवेट का कार्बन डाइऑक्साइड, जल और ऊर्जा में विखंडन माइटोकॉन्ड्रिया में होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>c. यीस्ट में अवायवीय श्वसन के दौरान, पायरुवेट एथेनॉल और कार्बन डाइऑक्साइड में परिवर्तित हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपर्युक्त कथनों में से कौन-सा/से सही है/हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल a और b</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल b और c</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल a और c</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a, b और c</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीनों कथन सही हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ग्लाइकोलाइसिस कोशिकीय श्वसन का पहला चरण है, जिसमें 6-कार्बन ग्लूकोज अणु दो 3-कार्बन पायरुवेट अणुओं में टूटता है। यह प्रक्रिया कोशिकाद्रव्य (साइटोप्लाज्म) में होती है और इसमें ऑक्सीजन की आवश्यकता नहीं होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. वायवीय श्वसन में, पायरुवेट माइटोकॉन्ड्रिया में प्रवेश करता है जहाँ ऑक्सीजन की उपस्थिति में यह पूरी तरह से कार्बन डाइऑक्साइड, जल और ATP में परिवर्तित हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. यीस्ट कोशिकाओं में किण्वन (अवायवीय श्वसन) ऑक्सीजन की अनुपस्थिति में होता है, जिससे पायरुवेट एथेनॉल और कार्बन डाइऑक्साइड में परिवर्तित होता है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि शब्द DOCUMENT में प्रत्येक व्यंजन को अंग्रेजी वर्णमाला श्रृंखला में उसके ठीक पहले आने वाले अक्षर से बदल दिया जाए, और प्रत्येक स्वर को अंग्रेजी वर्णमाला श्रृंखला में उसके ठीक बाद आने वाले अक्षर से बदल दिया जाए, और फिर इस प्रकार बने सभी अक्षरों को बाएं से दाएं वर्णमाला क्रम में व्यवस्थित किया जाए, तो बाएं छोर से पांचवां अक्षर कौन-सा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द: DOCUMENT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. शब्द में स्वर और व्यंजन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्यंजन: D, C, M, N, T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्वर: O, U, E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. दी गई शर्तों को लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक व्यंजन को उसके ठीक पहले वाले अक्षर से बदलने पर: D → C, C → B, M → L, N → M, T → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक स्वर को उसके ठीक बाद वाले अक्षर से बदलने पर: O → P, U → V, E → F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्राप्त अक्षर समूह: C, P, B, V, L, F, M, S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. सभी अक्षरों को बाएं से दाएं वर्णमाला क्रम में व्यवस्थित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B, C, F, L, M, P, S, V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, बाएं छोर से पांचवां अक्षर </span><span style=\"font-weight:bold\">M</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से किस वैज्ञानिक ने यह प्रतिपादित करके कोशिका सिद्धांत का विस्तार किया कि सभी जीवित कोशिकाएँ पूर्व-मौजूद कोशिकाओं से ही उत्पन्न होती हैं ('</span><span style=\"font-style:italic\">ओम्निस सेल्युला-ए सेल्युला</span><span>')?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रुडोल्फ विरचो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रॉबर्ट ब्राउन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>थियोडोर श्वान</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जे. ई. पुरकिंजे</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1855 में, रुडोल्फ विरचो ने सर्वप्रथम यह स्पष्ट किया कि कोशिकाएँ विभाजित होती हैं और नई कोशिकाएँ पूर्व-मौजूद कोशिकाओं से ही बनती हैं (</span><span style=\"font-style:italic\">ओम्निस सेल्युला-ए सेल्युला</span><span>)। उन्होंने मैथियास श्लाइडेन (1838) और थियोडोर श्वान (1839) द्वारा प्रस्तुत मूल कोशिका सिद्धांत को अंतिम रूप देने के लिए इसे संशोधित किया।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अगस्त 2026 में, एयर मार्शल तेजपाल सिंह ने भारतीय वायु सेना के _______ के रूप में पदभार ग्रहण किया।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वाइस चीफ ऑफ़ द एयर स्टाफ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चीफ ऑफ़ द एयर स्टाफ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिप्टी चीफ ऑफ़ द एयर स्टाफ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चीफ ऑफ़ इंटीग्रेटेड डिफेंस स्टाफ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एयर मार्शल तेजपाल सिंह ने 1 अगस्त 2026 को भारतीय वायु सेना के </span><span style=\"font-weight:bold\">डिप्टी चीफ ऑफ़ द एयर स्टाफ (DCAS)</span><span> के रूप में पदभार ग्रहण किया। उन्होंने एयर मार्शल अवधेश कुमार भारती का स्थान लिया, जो 31 जुलाई 2026 को सेवानिवृत्त हुए थे। जून 1990 में एक लड़ाकू पायलट के रूप में कमीशन प्राप्त करने वाले एयर मार्शल तेजपाल सिंह एक श्रेणी 'ए' योग्य उड़ान प्रशिक्षक और प्रायोगिक परीक्षण पायलट हैं, जिनके पास 3,500 से अधिक घंटों का उड़ान अनुभव है।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: भिन्न समूह, व्यंजन/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DHK - HLO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QTX - UXB</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MPS - QTV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RUZ - VYD</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम में अक्षरों के स्थानीय मान इस प्रकार हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">DHK - HLO:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 4 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) + 4 = L (12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 4 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(प्रत्येक संगत अक्षर में +4 की वृद्धि होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">QTX - UXB:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 4 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 4 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>X (24) + 4 = B (28 − 26 = 2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(प्रत्येक संगत अक्षर में +4 की वृद्धि होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">RUZ - VYD:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (21) + 4 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z (26) + 4 = D (30 − 26 = 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(प्रत्येक संगत अक्षर में +4 की वृद्धि होती है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">MPS - QTV:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 4 = Q (17)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 4 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 3 = V (22) (यहाँ अंतिम अक्षर में +4 के स्थान पर +3 की वृद्धि हुई है; नियम के अनुसार W होना चाहिए)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">MPS - QTV</span><span> समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात मित्र, J, K, L, M, N, O और P, एक सीधी पंक्ति में उत्तर के सम्मुख बैठे हैं। K पंक्ति के अंतिम दाएं छोर पर बैठा है। K और M के बीच केवल तीन व्यक्ति बैठे हैं। P, M के बाईं ओर दूसरे स्थान पर बैठा है। L, J के दाईं ओर तीसरे स्थान पर बैठा है। O, M का निकटतम पड़ोसी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M और O के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. पंक्ति में बाएं से दाएं 7 स्थान हैं: 1, 2, 3, 4, 5, 6, 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. K पंक्ति के अंतिम दाएं छोर पर बैठा है: K स्थान 7 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. K और M के बीच केवल तीन व्यक्ति बैठे हैं: M स्थान 3 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P, M के बाईं ओर दूसरे स्थान पर बैठा है: P स्थान 1 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. L, J के दाईं ओर तीसरे स्थान पर बैठा है: J और L के लिए केवल स्थान 2 और 5 संभव हैं (क्योंकि स्थान 4 + 3 = 7 पहले से K द्वारा भरा है)। अतः J स्थान 2 पर और L स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. अब N और O के लिए स्थान 4 और 6 शेष हैं। चूंकि O, M (स्थान 3) का निकटतम पड़ोसी नहीं है, इसलिए O स्थान 4 पर नहीं हो सकता। अतः O स्थान 6 पर और N स्थान 4 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएं से दाएं अंतिम व्यवस्था है: P, J, M, N, L, O, K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M स्थान 3 पर है और O स्थान 6 पर है। उनके बीच N और L बैठे हैं, अर्थात् कुल 2 व्यक्ति बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से कौन-सा प्रकार्यात्मक समूह, कार्बोनिल समूह और हाइड्रॉक्सिल समूह के संयोजन से बनता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कीटोन समूह</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एल्डिहाइड समूह</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्बोक्सिल समूह</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एस्टर समूह</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्बोक्सिल समूह (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image204.png\" width=\"59\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) एक ऐसा प्रकार्यात्मक समूह है जो एक कार्बोनिल समूह (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image205.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) और उससे सीधे जुड़े एक हाइड्रॉक्सिल समूह (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image206.png\" width=\"38\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) के संयोजन से बनता है। 'कार्बोक्सिल' (Carboxyl) शब्द 'कार्बोनिल' (Carbonyl) और 'हाइड्रॉक्सिल' (Hydroxyl) के मेल से ही बना है। यह एथेनॉइक अम्ल जैसे कार्बोक्सिलिक अम्लों का अभिलाक्षणिक प्रकार्यात्मक समूह है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक कथन के बाद दो कार्यवाहियाँ I और II दी गई हैं। कथन में दी गई सभी बातों को सत्य मानते हुए, यह तय कीजिए कि सुझाई गई कार्यवाहियों में से कौन-सी कार्यवाही तार्किक रूप से अनुसरण करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक राष्ट्रीय राजमार्ग के व्यस्त हिस्से पर कई यात्रियों ने शिकायत की है कि स्ट्रीट लाइटें खराब हैं, जिससे रात के समय सड़क दुर्घटनाओं में वृद्धि हो रही है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कार्यवाहियाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. राजमार्ग प्राधिकरण को तुरंत स्ट्रीट लाइटों की मरम्मत करनी चाहिए और उस हिस्से पर अत्यधिक दृश्यमान परावर्तक संकेतक बोर्ड लगाने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. यातायात विभाग को रात के समय इस राजमार्ग पर वाहनों की आवाजाही पर पूरी तरह से प्रतिबंध लगा देना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही I अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही II अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I और II दोनों कार्यवाहियाँ अनुसरण करती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो कार्यवाही I और न ही II अनुसरण करती है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्यवाही I समस्या के मूल कारण (स्ट्रीट लाइट खराब होने के कारण कम दृश्यता) को व्यावहारिक, रचनात्मक और तार्किक तरीके से हल करती है। अतः कार्यवाही I अनुसरण करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्यवाही II एक अत्यधिक कठोर और अनुचित कदम है; राष्ट्रीय राजमार्ग पर रात में वाहनों की आवाजाही को पूरी तरह से प्रतिबंधित करने से बुनियादी ढांचे की खामी को ठीक करने के बजाय आम जनता और माल ढुलाई में भारी बाधा उत्पन्न होगी। अतः कार्यवाही II अनुसरण नहीं करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसलिए, केवल कार्यवाही I अनुसरण करती है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मटर के पौधों पर किए गए अपने द्विसंकर संकरण (dihybrid cross) प्रयोगों के परिणामों के आधार पर ग्रेगर मेंडल ने आनुवंशिकता के किस मूलभूत नियम को प्रतिपादित किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रभाविता का नियम (Law of Dominance)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विसंयोजन का नियम (Law of Segregation)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्वतंत्र अपव्यूहन का नियम (Law of Independent Assortment)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सहलग्नता का नियम (Law of Linkage)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ग्रेगर मेंडल ने मटर के दो जोड़ी विपर्यासी लक्षणों (जैसे बीज का आकार और बीज का रंग) वाले द्विसंकर संकरण (dihybrid cross) प्रयोगों के आधार पर </span><span style=\"font-weight:bold\">स्वतंत्र अपव्यूहन का नियम (Law of Independent Assortment)</span><span> प्रतिपादित किया था। इस नियम के अनुसार, जब दो जोड़ी लक्षणों को एक संकर में संयोजित किया जाता है, तो युग्मक निर्माण के दौरान एक जोड़ी लक्षण का पृथक्करण दूसरी जोड़ी के लक्षण से स्वतंत्र होता है, जिससे </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image207.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span> पीढ़ी में 9 : 3 : 3 : 1 का लक्षणप्ररूपी (phenotypic) अनुपात प्राप्त होता है। इसके विपरीत, प्रभाविता का नियम और विसंयोजन का नियम एकसंकर संकरण (monohybrid cross) पर आधारित थे।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अम्ल, क्षारक और pH पैमाने के संबंध में निम्नलिखित में से कौन-सा कथन गलत है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 °C पर एक अम्लीय विलयन का pH मान हमेशा 7 से कम होता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी विलयन में हाइड्रोनियम आयनों की सांद्रता बढ़ने पर उसका pH मान भी बढ़ जाता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मानव शरीर लगभग 7.0 से 7.8 के संकीर्ण pH परास के भीतर कार्य करता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एंटासिड (प्रतिअम्ल) सौम्य क्षारक होते हैं जिनका उपयोग पेट में अतिरिक्त अम्ल को उदासीन करने के लिए किया जाता है।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन B गलत है। किसी विलयन का pH मान हाइड्रोजन या हाइड्रोनियम आयनों (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image208.png\" width=\"40\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) की सांद्रता के व्युत्क्रमानुपाती होता है, जिसे </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793356532002_image209.png\" width=\"128\" height=\"21\" alt style=\"vertical-align:middle\" ><span> के रूप में परिभाषित किया जाता है। इसलिए, हाइड्रोनियम आयनों की सांद्रता जितनी अधिक होगी, pH मान उतना ही कम (अधिक अम्लीय) होगा। अन्य सभी कथन सही हैं।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात व्यक्ति, P, Q, R, S, T, U और V एक सीधी पंक्ति में उत्तर के सम्मुख बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S पंक्ति के बाएं छोर से तीसरे स्थान पर बैठा है। T, S के दाईं ओर तीसरे स्थान पर बैठा है। Q, T के ठीक दाईं ओर बैठा है। P, S के ठीक बाईं ओर बैठा है। U और R के बीच केवल तीन व्यक्ति बैठे हैं, जहाँ U, R के बाईं ओर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V और T के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोई नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-si
