<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>11.) MOCK-6 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

n><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image004.png\" width=\"34\" height=\"90\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image005.png\" width=\"34\" height=\"90\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image006.png\" width=\"34\" height=\"90\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since 23, 31, and 41 are prime numbers, the HCF is 17.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V and W are a married couple, where W is the wife. X is the only son of V. Y is the wife of X. Z is the brother of Y. A is the daughter of X. How is Z related to A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paternal uncle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal uncle</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information: 1. V (male) is married to W (female). 2. X is the son of V and W. 3. Y is the wife of X. 4. A is the daughter of X and Y. 5. Z is the brother of Y. Since Y is the mother of A and Z is Y's brother, Z is the maternal uncle of A.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PKVG is related to MGSC in a certain way based on the English alphabetical order. In the same way, JNQT is related to GJNP. To which of the following is ROUL related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PLSI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OKRH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OJSG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NKRG</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st letter: −3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd letter: −4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd letter: −3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th letter: −4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For PKVG → MGSC:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P − 3 = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K − 4 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V − 3 = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G − 4 = C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For JNQT → GJNP:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J − 3 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N − 4 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q − 3 = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T − 4 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for ROUL:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R − 3 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O − 4 = K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U − 3 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L − 4 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, ROUL is related to OKRH.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Refer to the following letter series and answer the question that follows. Counting to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) P E R T M A K Z I B O D U G S C L E V N (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many such consonants are there, each of which is immediately preceded by a vowel and also immediately followed by a consonant?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: Vowel – Consonant – Consonant.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given series: P E R T M A K Z I B O D U G S C L E V 131\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total distance to be covered to overtake completely = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image010.png\" width=\"56\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, time taken = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image011.png\" width=\"89\" height=\"112\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the number that can replace the question mark (?) in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17, 26, 42, 67, 103, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>148</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>152</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>156</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>160</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is the addition of consecutive perfect squares starting from </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image012.png\" width=\"16\" height=\"23\" alt style=\"vertical-align:middle\" ><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image013.png c=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image032.png\" width=\"21\" height=\"51\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'SUN' has 3 letters: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image033.png\" width=\"34\" height=\"141\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'MOON' has 4 letters: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image034.png\" width=\"34\" height=\"141\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, 'EARTH' has 5 letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image035.png\" width=\"34\" height=\"141\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 'EARTH' is coded as 50.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six friends P, Q, R, S, T and U are sitting around a circular table facing the centre. P sits second to the left of U. Q sits to the immediate left of S. R sits second to the right of S. What is the position of P with respect to Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediate left</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second to the right</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third to the right</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second to the left</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 6 positions in clockwise order around the table be numbered 1 to 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let U be at position 1. Since all face the centre, left is clockwise and right is anti-clockwise.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P sits second to the left of U, so P is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q sits to the immediate left of S, and R sits second to the right of S. If S is placed at position 4, then Q (immediate left of S) is at position 5, and R (second to the right of S) is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. T occupies the remaining position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The clockwise arrangement of persons from position 1 to 6 is: U, R, P, S, Q, T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, looking from Q's position (position 5) facing the centre, moving anti-clockwise (to the right of Q):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 1st to the right is S (position 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 2nd to the right is P (position 3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, P is second to the right of Q.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the semi-permeable membrane that encloses the central vacuole in a plant cell called?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tonoplast</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Amyloplast</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dictyosome</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plasmodesmata</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In plant cells, the vacuole is bound by a single membrane called the tonoplast. The tonoplast regulates the movement of ions and other materials into and out of the vacuole, maintaining turgor pressure within the cell.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The mode of the following data is 14. Find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image036.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11, 14, 13, 17, 13, 14, 15, 13, 18, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image037.png\" width=\"39\" height=\"24\" alt style=\"vertical-align:middle\" ><span>, 14, 12, 16</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The mode of a dataset is the observation that occurs with the highest frequency.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting the frequencies of the given values:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frequency of 13 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frequency of 14 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All other numbers (11, 12, 15, 16, 17, 18) appear only once.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the mode is 14, the value 14 must appear more frequently than 13. Thus, the unknown term must be 14.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image038.png\" width=\"39\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image039.png\" width=\"34\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image040.png\" width=\"25\" height=\"47\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' means 'A is the sister of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A – B' means 'A is the brother of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' means 'A is the father of B' and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' means 'A is the wife of B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the above, how is P related to T if 'P × Q + R – S ÷ T'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wife's father</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister's husband</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter's husband</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given expression: P × Q + R – S ÷ T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the relations step by step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P × Q: P is the father of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q + R: Q is the sister of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R – S: R is the brother of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From these relations, Q, R, and S are siblings, which means P is also the father of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. S ÷ T: S is the wife of T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since S is the wife of T and P is the father of S, P is the wife's father of T.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-siz ;font-size:12pt\"><span>At twice the focal length (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image067.png\" width=\"19\" height=\"24\" alt style=\"vertical-align:middle\" ><span>)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Between the principal focus and the optical centre</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Between the focus and twice the focal length</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Beyond twice the focal length</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is placed between the optical centre and the principal focus of a convex lens, the refracted rays diverge and appear to meet behind the object on the same side of the lens. Consequently, a virtual, erect, and magnified image is formed. This property is utilized in a simple magnifying glass (reading lens).</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>While compiling the examination results, a student's marks were mistakenly entered as 88 instead of 46. As a result, the average marks of the class increased by 1.75. Find the total number of students in the class.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bot swer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The colour of scattered light depends on the size of the scattering particles. Very fine particles scatter shorter wavelengths (such as blue light) more effectively. However, when the size of the scattering particles (such as water droplets in clouds) is much larger than the wavelength of light, all wavelengths of visible light are scattered almost equally, causing the scattered light to appear white.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A and B invested in a business in the ratio </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image143.png\" width=\"22\" height=\"24\" alt style=\"vertical-align:middle\" ><span>. They earned a total profit of ₹90,000. One-third of the profit was divided equally between them, and the remaining profit was divided in proportion to their investments. What is the total profit share of A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹45,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹50,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹40,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total profit = ₹90,000</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit divided equally = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image144.png\" width=\"71\" height=\"81\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Share of each from this part = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image145.png\" width=\"69\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Remaining profit = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image146.png\" width=\"105\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ratio of investments of A and B = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image143.png\" width=\"22\" height=\"24\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A's share from the remaining profit = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image147.png\" width=\"71\" height=\"156\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total profit share of A = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image148.png\" width=\"71\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Refer to the following letter series and answer the question that follows. Counting to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) U T R A B I O N D E K L U P E I M T A S O Z (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many such consonants are there, each of which is immediately preceded by a vowel and also immediately followed by a consonant?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: Vowel – Consonant – Consonant.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Scanning the series from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U T R: 'T' is preceded by vowel 'U' and followed by consonant 'R'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O N D: 'N' is preceded by vowel 'O' and followed by consonant 'D'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E K L: 'K' is preceded by vowel 'E' and followed by consonant 'L'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I M T: 'M' is preceded by vowel 'I' and followed by consonant 'T'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None of the other consonants satisfy the given condition. Hence, there are 4 such consonants.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BD - EG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HJ - KM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PR - TU</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SU - VX</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positional values of the letters according to the English alphabet are:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) BD - EG:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 3 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 3 = G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Internal difference: B + 2 = D, E + 2 = G)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) HJ - KM:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) + 3 = K (11)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J (10) + 3 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Internal difference: H + 2 = J, K + 2 = M)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) PR - TU:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 4 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 3 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Internal difference: P + 2 = R, but T + 1 = U)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) SU - VX:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 3 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (21) + 3 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Internal difference: S + 2 = U, V + 2 = X)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all pairs except 'PR - TU', adding 3 to each letter of the first cluster gives the corresponding letter of the second cluster. Therefore, PR - TU does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": "Rधीधन पय पुध ीियियथing ोिूुोnहंधनic-ौदंृिय ौधनiधौ ोnक ोnौथधन पुध तहधौपiयn पुोप ीियियथौ. Cयहnपing iौ पय ृध कयnध ीनयं िधीप पय नigुप यnिद.(Lधीप) A # B 5 @ C &ोंूे D E $ 2 % F * G (Rigुप)Hयथ ंोnद ौहcु ौदंृियस ोनध पुधनध, धोcु यी थुicु iौ iंंधकiोपिधद ूनधcधकधक ृद ो िधपपधन ोnक ोिसय iंंधकiोपिधद ीियियथधक ृद ो िधपपधन?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: Letter → Symbol → Letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us check each symbol in the series from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A # B: Preceded by letter 'A' and followed by letter 'B' — (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 5 @ C: Preceded by number '5' — (Not valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. C &amp; D: Preceded by letter 'C' align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No dancer is a singer.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All actors are dancers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some actors are painters.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) No actor is a singer.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Some painters are dancers.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"All actors are dancers\" and \"No dancer is a singer\": Since the entire class of 'actors' is inside 'dancers', and no 'dancer' can be a 'singer', it logically follows that no 'actor' can be a 'singer'. Hence, conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. \"Some actors are painters\" and \"All actors are dancers\": Since some painters are actors and all actors are dancers, that overlapping portion of painters must also be dancers. Thus, \"Some painters are dancers\" logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, both conclusions (I) and (II) follow.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A trader marks an article 60% above its cost price. He then allows two successive discounts of 15% and 10% on the marked price. Find his profit percentage on the transaction.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24.2%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22.4%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20.8%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25.6%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the cost price (CP) be ₹100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Marked Price (MP) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image175.png\" width=\"51\" height=\"102\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Selling Price (SP) after two successive discounts of 15% and 10%:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxd top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Only two persons attend after S, so S attends on Friday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only three persons attend between P and S, so P attends on Monday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R attends immediately before Q. The only consecutive days available that allow the other conditions to be fulfilled are Saturday and Sunday. Thus, R attends on Saturday and Q on Sunday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only one person attends between V and U, which leaves Tuesday and Thursday for them.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T attends after V and before U, so V attends on Tuesday, T on Wednesday, and U on Thursday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete schedule is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Monday: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Tuesday: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Wednesday: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Thursday: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Friday: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Saturday: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Sunday: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, T attends the seminar on Wednesday.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The question below consists of a question followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Among four friends—K, L, M, and N—who is the tallest?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) K is taller than both L and M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) N is taller than K.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II together are sufficient to answer the question</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I alone is sufficient while statement II alone is not sufficient</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II alone is sufficient while statement I alone is not sufficient</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither statement I nor statement II is sufficient to answer the question</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statement (I): K is taller than L and M (K &gt; L and K &gt; M), but N's position is unknown. So, statement (I) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statement (II): N is taller than K (N &gt; K), but the positions of L and M are unknown. So, statement (II) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both statements (I) and (II): N &gt; K &gt; L, M. Thus, N is clearly the tallest among all four friends. Hence, both statements together are sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 'K' stands for '+', ' yle=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The remaining positions (3rd, 5th, and 6th) must be occupied by S, P, and U. Given that S is heavier than P and P is heavier than U (S &gt; P &gt; U), they fit uniquely as: Q &gt; T &gt; S &gt; R &gt; P &gt; U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, S is the third heaviest person.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDF - GIK</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLN - OQS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT - UWY</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EGI - JLM</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the letter-cluster pairs is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Within each cluster, the letters increase by +2, and each letter of the second cluster is obtained by adding +5 to the corresponding letter of the first cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) BDF - GIK: B(+2) = D, D(+2) = F; G(+2) = I, I(+2) = K. Also, B(+5) = G, D(+5) = I, F(+5) = K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) JLN - OQS: J(+2) = L, L(+2) = N; O(+2) = Q, Q(+2) = S. Also, J(+5) = O, L(+5) = Q, N(+5) = S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) PRT - UWY: P(+2) = R, R(+2) = T; U(+2) = W, W(+2) = Y. Also, P(+5) = U, R(+5) = W, T(+5) = Y.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) EGI - JLM: In JLM, J(+2) = L, but L(+1) = M (not +2). Also, I(+5) = N ≠ M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, EGI - JLM does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GLQ - JOT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CHM - FKP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KPU - NSX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DIN - GLR</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us analyze the pattern followed by each letter-cluster pair:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each cluster, the letters increase by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image229.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>, and between the corresponding letters of the two clusters, there is an addition of </span><img ing": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given that Simple Interest (SI) for 2 years = ₹360 and Compound Interest (CI) for 2 years = ₹387.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Simple interest for 1 year = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image255.png\" width=\"49\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Difference between CI and SI for 2 years = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image256.png\" width=\"64\" height=\"47\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>This difference of ₹27 is the interest earned on the first year's interest (₹180).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rate of interest (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image073.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image257.png\" width=\"48\" height=\"81\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Principal (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image072.png\" width=\"10\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791630394547_image258.png\" width=\"63\" height=\"109\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons P, Q, R, S, T and U are sitting around a circular table facing the centre. P sits opposite to S. Q sits to the immediate right of P. R sits second to the left of Q. T sits between R and S. Who sits opposite to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let the 6 positions around the circle be numbered 1 to 6 in a clockwise direction.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Let P be at position 1. Since P sits opposite to S, S is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Facing the centre, the right is anticlockwise. Q sits to the immediate right of P, so Q is at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Facing the centre, the left is clockwise. R sits second to the left of Q. Moving clockwise from position 6, the first position is 1 (P) and the second is 2, so R is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T sits between R and S, so T is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. U takes the remaining position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the person sitting opposite to T (position 3) is Q (position 6).</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A shopkeeper bought a mixer g ": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following sets of classes is best represented by the Venn diagram given below?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>World, Asia, India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Furniture, Chairs, Tables</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mammals, Cows, Crows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Teachers, Authors, Women</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The relationship among Furniture, Chairs, and Tables is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Both Chairs and Tables are items of Furniture, so both must lie completely inside the circle representing 'Furniture'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Chairs and Tables are two completely separate and mutually exclusive items (no chair is a table, and no table is a chair), so their circles must be disjoint and non-overlapping.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, this relationship is correctly depicted by one large outer circle containing two smaller, non-intersecting circles inside it.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Analysis of other options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- World, Asia, India: India is in Asia, and Asia is in the World (represented by three concentric circles).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Mammals, Cows, Crows: All cows are mammals, but crows are birds (represented by one circle inside another, plus a third separate circle).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Teachers, Authors, Women: A person can belong to one, two, or all three categories simultaneously (represented by three mutually intersecting circles).</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Refer to the following letter series and answer the question that follows. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) P A K R E T M I O B U D L A S N E C K O F T (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many such consonants are there, each of which is immediately preceded by a vowel and also immediately followed by a consonant?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the consonants that follow the pattern: Vowel — Consonant — Consonant.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Looking at the series from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) P A K R E T M I O B U D L A S N E C K O F T (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The combinations satisfying the condition (Vowel — Consonant — Consonant) are:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A - K - R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. E - T - M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U - D - L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. A - S - N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. E - C - K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. O - F - T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Note that 'B' in 'O B U' is followed by a vowel, so it does not qualify.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are 6 such consonants.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven boxes, P, Q, R, S, T, U and V, are kept one above another, but not necessarily in the same order. Box R is kept third from the bottom. Only two boxes are kept between Box R and Box V. Box P is kept immediately below Box R. Only two boxes are kept between Box P and Box T. Box Q is kept at the lowermost position. Box S is kept somewhere above Box U. Which box is kept immediately above Box R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions be numbered 1 to 7 from bottom to top:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box R is kept third from the bottom, so R is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two boxes are kept between Box R and Box V, which places V at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box P is kept immediately below Box R, so P is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only two boxes are kept between Box P and Box T, which places T at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Box Q is kept at the lowermost position, so Q is at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The remaining positions are 7 and 4. Since Box S is kept above Box U, S is at position 7 and U is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement from top to bottom is: S (7), V (6), T (5), U (4), R (3), P (2), Q (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Box U is kept immediately above Box R.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two sets of numbers are given below. In each set of numbers, a certain mathematical operation on the first number results in the second number. Similarly, a certain mathematical operation on the second number results in the third number, and so on. Which of the given options follows the same set of operations as in the given sets?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32 - 36 - 144 - 138</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21 - 25 - 100 - 94</span></p>", "option1": "<p st
