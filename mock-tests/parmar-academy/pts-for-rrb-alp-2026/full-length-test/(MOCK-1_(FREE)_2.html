<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) MOCK-1 (FREE - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

 है। R एक सम संख्या वाली मंजिल पर रहता है। R और T के बीच केवल तीन लोग रहते हैं, तथा T, R के नीचे किसी मंजिल पर रहता है। S और T के बीच केवल एक व्यक्ति रहता है। P, S के ठीक नीचे रहता है। Q, U के ऊपर किसी मंजिल पर रहता है। Q और T के बीच कितने लोग रहते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के आधार पर मंजिलों की व्यवस्था निम्न प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R एक सम संख्या वाली मंजिल पर रहता है, और R तथा T के बीच तीन लोग रहते हैं (जहाँ T, R के नीचे है)। यह केवल तभी संभव है जब R मंजिल 6 पर रहे और T मंजिल 2 पर रहे।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S और T के बीच केवल एक व्यक्ति रहता है। चूँकि T मंजिल 2 पर है, इसलिए S मंजिल 4 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P, S के ठीक नीचे रहता है, अतः P मंजिल 3 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q, U के ऊपर वाली मंजिल पर रहता है। शेष मंजिलें 5 और 1 हैं, इसलिए Q मंजिल 5 पर और U मंजिल 1 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऊपर से नीचे तक अंतिम व्यवस्था:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल 6: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल 5: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल 4: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: R केवल S और T से भारी है। इसका अर्थ है कि P और Q दोनों R से भारी हैं। अतः, भार का घटता क्रम है: (P, Q) &gt; R &gt; (S, T)। हालाँकि, हम यह निर्धारित नहीं कर सकते कि S और T में से कौन अधिक हल्का है। इसलिए, केवल कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: T, S से भारी है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image060.png\" width=\"39\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)। अकेले यह P, Q या R के भार के बारे में कोई जानकारी नहीं देता है। इसलिए, केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) को मिलाने पर: कथन (I) से, S और T दो सबसे हल्के व्यक्ति हैं। कथन (II) से, T, S से भारी है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image060.png\" width=\"39\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)। अतः, भार का अंतिम क्रम </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image061.png\" width=\"71\" height=\"21\" alt style=\"vertical-align:middle\" ><span> बनता है, जिससे स्पष्ट होता है कि S सभी पाँच मित्रों में सबसे हल्का है। इसलिए, कथन I और II दोनों में दिया गया डेटा मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब 16, 21, 22 और 30 में से प्रत्येक से </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image062.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span> घटाया जाता है, तो इस क्रम में प्राप्त संख्याएं समानुपात में होती हैं। </span><img src=\"https://static-appxdb-v2.akam nt-size:12pt\"><span>इसमें प्रतिरक्षा प्रतिक्रिया के लिए जिम्मेदार विशिष्ट लिम्फोसाइट्स होते हैं।</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लसीका (लिम्फ) एक रंगहीन तरल पदार्थ है जो अंतराली द्रव के लसीका वाहिकाओं में प्रवेश करने पर बनता है। इसमें लाल रक्त कोशिकाएं (RBCs) और प्लेटलेट्स पूरी तरह से अनुपस्थित होते हैं, इसलिए यह ऑक्सीजन का परिवहन नहीं करता है। इसके बजाय, इसमें श्वेत रक्त कोशिकाएं (मुख्य रूप से लिम्फोसाइट्स) होती हैं जो संक्रमण से लड़ने में मदद करती हैं। यह अतिरिक्त अंतराली द्रव को पुनः रक्त परिसंचरण में वापस ले जाने और छोटी आंत के विली (लैक्टियल्स) के माध्यम से पचे हुए वसा को अवशोषित करने में भी महत्वपूर्ण भूमिका निभाता है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>संयुक्त सूक्ष्मदर्शी के तहत प्याज के छिलके के अभिरंजित (stained) अस्थायी माउंट का अवलोकन करते समय, निम्नलिखित में से कौन-सी कोशिकीय संरचना सर्वाधिक अभिरंजक अवशोषित करती है और सबसे गहरी दिखाई देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बड़ी केंद्रीय रसधानी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोशिकाद्रव्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्रक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हरितलवक (क्लोरोप्लास्ट)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब प्याज के छिलके जैसी पादप कोशिकाओं को सैफ्रानिन, आयोडीन या मेथिलीन ब्लू जैसे अभिरंजकों से रंगा जाता है, तो कोशिका के विभिन्न भाग अपनी रासायनिक संरचना के आधार पर अलग-अलग मात्रा में रंग ग्रहण करते हैं। केंद्रक में न्यूक्लिक अम्ल (DNA और RNA) तथा प्रोटीनों की सघनता अधिक होती है, जिसके कारण यह सबसे अधिक अभिरंजक अवशोषित करता है। नतीजतन, सूक्ष्मदर्शी के नीचे केंद्रक, कोशिकाद्रव्य और रसधानी की तुलना में सबसे गहरा और प्रमुख दिखाई देता है।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आठ मित्र, P, Q, R, S, T, U, V और W, एक वृत्ताकार मेज के चारों ओर केंद्र की ओर मुख करके बैठे हैं। P, S के दाएं तीसरे स्थान पर बैठा है। T, P के दाएं तीसरे स्थान पर बैठा है। R, T के बाएं दूसरे स्थान पर बैठा है। Q, T और R दोनों का निकटतम पड़ोसी है। U, V के दाएं दूसरे स्थान पर बैठा है। W के दाएं से गिनने पर W और Q के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना केंद्र की ओर मुख किए हुए वृत्ताकार मेज के चारों ओर 8 स्थान दक्षिणावर्त (clockwise) क्रम में 1 से 8 तक हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना S स्थान 1 पर है। चूंकि सभी का मुख केंद्र की ओर है, अतः दायां वामावर्त (counter-clockwise) और बायां दक्षिणावर्त (clockwise) होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P, S के दाएं तीसरे स्थान पर है, इसलिए P स्थान 6 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. T, P के दाएं तीसरे स्थान पर है, इसलिए T स्थान 3 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. R, T के बाएं दूसरे स्थान पर है, इसलिए R स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Q, T और R दोनों का निकटतम पड़ोसी है, इसलिए Q स्थान 4 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. खाली स्थान 2, 7 और 8 हैं। U, V के दाएं दूसरे स्थान पर है। यदि V स्थान 2 पर है, तो उसके दाएं दूसरा स्थान 8 होगा, इसलिए U स्थान 8 पर है। शेष स्थान 7 पर W बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः दक्षिणावर्त क्रम में व्यवस्था है: S(1), V(2), T(3), Q(4), R(5), P(6), W(7), U(8)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W के दाएं से गिनने पर (स्थान 7 से वामावर्त दिशा में स्थान 4 की ओर), W और Q के बीच P (स्थान 6) और R (स्थान 5) बैठे हैं। अतः W और Q के बीच 2 व्यक्ति बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि ‘P’ का अर्थ ‘+’ है, ‘Q’ का अर्थ ‘−’ है, ‘R’ का अर्थ ‘×’ है और ‘S’ का अर्थ ‘÷’ है, तो निम्नलिखित समीकरण में प्रश्न चिह्न (?) के स्थान पर क्या आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>78 Q 14 R 5 P 192 S 16 = ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया समीकरण: 78 Q 14 R 5 P 192 S 16 = ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षरों को उनके संबंधित गणितीय चिह्नों से प्रतिस्थापित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image150.png\" width  के पीछे; अवतल लेंस</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हाइपरमेट्रोपिया (दूर-दृष्टि दोष) में व्यक्ति दूर की वस्तुओं को स्पष्ट देख सकता है लेकिन पास की वस्तुओं को स्पष्ट नहीं देख पाता है। यह दोष या तो अभिनेत्र लेंस की फोकस दूरी के अत्यधिक हो जाने के कारण या नेत्र गोलक के छोटा हो जाने के कारण होता है। इसके परिणामस्वरूप, पास की वस्तु से आने वाली प्रकाश किरणें रेटिना के पीछे फोकसित होती हैं। इस दोष को उपयुक्त क्षमता वाले उत्तल (अभिसारी) लेंस के चश्मे का उपयोग करके ठीक किया जाता है, जो किरणों को मोड़कर ठीक रेटिना पर फोकसित करता है।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित त्रिकों में, अक्षरों का प्रत्येक समूह एक निश्चित तर्क का पालन करते हुए अगले समूह से संबंधित है। दिए गए विकल्पों में से, वह विकल्प चुनें जो उसी तर्क का पालन करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CAMP - AMCP - MCAP</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BLUE - LUBE - UBLE</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FISH - ISHF - SHIF</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FISH - ISFH - SFIH</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FISH - ISFH - FSIH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FISH - SFIH - ISFH</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए त्रिकों में अक्षरों के स्थान परिवर्तन का स्वरूप निम्नलिखित है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्थान: 1 2 3 4 </span><span style=\"font-family:Arial\">→</span><span> 2 3 1 4 </span><span style=\"font-family:Arial\">→</span><span> 3 1 2 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथा अक्षर अंत में अपने ही स्थान पर स्थिर रहता है, जबकि पहले तीन अक्षर प्रत्येक चरण में चक्रीय रूप से बाईं ओर खिसकते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. C A M P (1 2 3 4) </span><span style=\"font-family:Arial\">→</span><span> A M C P (2 3 1 4) </span><span style=\"font-family:Arial\">→</span><span> M C A P (3 1 2 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. B L U E (1 2 3 4) </span><span style=\"font-family:Arial\">→</span><span> L U B E (2 3 1 4) </span><span style=\"font-family:Arial\">→</span><span> U B L E (3 1 2 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>समान तर्क FISH पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F I S H (1 2 3 4) </span><span style=\"font-family:Arial\">→</span><span> I S F H (2 3 1 4) </span><span style=\"font-family:Arial\">→</span><span> S F I H (3 1 2 4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, समान तर्क का पालन करने वाला सही विकल्प FISH - ISFH - SFIH है।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित अक्षर श्रृंखला को देखें और उसके बाद दिए गए प्रश्न का उत्तर दें। गणना केवल बाएं से दाएं की जानी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएं) H T E B P J A K U R D M O T E S F (दाएं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऐसे कितने व्यंजन हैं, जिनमें से प्रत्येक के ठीक पहले एक स्वर है और ठीक बाद में एक व्यंजन है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>" :0pt;font-size:12pt\"><span>Q केवल R से लंबा है, जिसका अर्थ है कि R सबसे छोटा है और Q दूसरा सबसे छोटा है: _ &gt; _ &gt; _ &gt; Q &gt; R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इससे यह ज्ञात नहीं होता कि P, S और T में से सबसे लंबा कौन है। अतः केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) और (II) दोनों को मिलाने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से स्पष्ट है कि Q और R सबसे छोटे दो व्यक्ति हैं, जिसका अर्थ है कि शीर्ष तीन स्थानों पर P, S और T हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से, T &gt; P &gt; S है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः लंबाई का सही क्रम (सबसे लंबे से सबसे छोटे की ओर) T &gt; P &gt; S &gt; Q &gt; R होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः T सबसे लंबा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार, प्रश्न का उत्तर देने के लिए कथन I और II दोनों का डेटा एक साथ आवश्यक है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब किसी संख्या के चार-पाँचवें भाग में से 23 घटाया जाता है, तो परिणाम उसी संख्या के दो-तिहाई भाग से 15 अधिक प्राप्त होता है। मूल संख्या के अंकों का योग क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना मूल संख्या </p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह प्रश्न नीचे दी गई पाँच, तीन-अंकीय संख्याओं पर आधारित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएं) 674 385 921 548 836 (दाएं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(उदाहरण: 697 – पहला अंक = 6, दूसरा अंक = 9 और तीसरा अंक = 7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि दूसरी सबसे छोटी संख्या के पहले अंक को दूसरी सबसे बड़ी संख्या के तीसरे अंक में जोड़ा जाए, तो परिणाम क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई संख्याएँ हैं: 674, 385, 921, 548, 836.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>संख्याओं को आरोही क्रम में व्यवस्थित करने पर: 385 &lt; 548 &lt; 674 &lt; 836 &lt; 921.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरी सबसे छोटी संख्या 548 है, और इसका पहला अंक 5 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरी सबसे बड़ी संख्या 836 है, और इसका तीसरा अंक 6 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अभीष्ट परिणाम = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image247.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात व्यक्ति A, B, C, D, E, F और G एक इमारत की सात अलग-अलग मंजिलों पर रहते हैं, जहाँ सबसे निचली मंजिल संख्या 1 है, उसके ऊपर की मंजिल संख्या 2 है और इसी प्रकार सबसे ऊपरी मंजिल संख्या 7 है। C मंजिल संख्या 4 पर रहता है। C और F के बीच केवल दो व्यक्ति रहते हैं, तथा F, C के ऊपर किसी मंजिल पर रहता है। B, C के ठीक नीचे रहता है। B और D के बीच केवल एक व्यक्ति रहता है। G, E के ठीक ऊपर रहता है। A, G के ऊपर किसी मंजिल पर रहता है। A किस मंजिल संख्या पर रहता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल संख्या 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल संख्या 6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल संख्या 5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंजिल संख्या 1</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. C मंजिल संख्या 4 पर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. F, C के ऊपर रहता है और C तथा F के बीच केवल दो व्यक्ति रहते हैं, इसलिए F मंजिल संख्या 7 पर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. B, C के ठीक नीचे रहता है, इसलिए B मंजिल संख्या 3 पर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. B और D के बीच केवल एक व्यक्ति रहता है। अतः D मंजिल 5 या मंजिल 1 पर हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- स्थिति 1: यदि D मंजिल 1 पर है, तो शेष मंजिलें 2, 5 और 6 हैं। चूँकि G, E के ठीक ऊपर रहता है, इसलिए G मंजिल 6 पर और E मंजिल 5 पर होगा, जिससे A के लिए मंजिल 2 बचेगी। लेकिन A, G के ऊपर रहता है, जो यहाँ गलत सिद्ध होता है। अतः यह स्थिति अमान्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- स्थिति 2: D मंजिल 5 पर रहता है। शेष मंजिलें 1, 2 और 6 हैं। G, E के ठीक ऊपर रहता है, इसलिए G मंजिल 2 पर और E मंजिल 1 पर रहता है। A के लिए शेष मंजिल 6 बचती है, जो इस शर्त को पूरा करती है कि A, G के ऊपर रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः ऊपर से नीचे (7 से 1) तक की अंतिम व्यवस्था है: F(7), A(6), D(5), C(4), B(3), G(2), E(1)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसलिए, A मंजिल संख्या 6 पर रहता है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image248.png\" width=\"131\" height=\"33\" alt style=\"vertical-align:middle\" ><span> का सरलीकृत मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>84</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>70</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया व्यंजक: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image248.png\" width=\"131\" height=\"33\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हम जानते हैं कि:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image249.png\" width=\"85\" height=\"23\" alt style=\"vertical-align:middle\" ><span> (क्योंकि </span><img src=\"https://st , ‘CRAFT’ को ‘48195’, ‘FLUTE’ को ‘53682’ और ‘TRACE’ को ‘19428’ के रूप में कोडित किया जाता है। दी गई कोड भाषा में ‘T’ के लिए कोड क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए शब्दों और उनके कोड की तुलना करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘CRAFT’ (48195) और ‘FLUTE’ (53682) में:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उभयनिष्ठ अक्षर = F, T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उभयनिष्ठ अंक = 5, 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘FLUTE’ (53682) और ‘TRACE’ (19428) में:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उभयनिष्ठ अक्षर = T, E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उभयनिष्ठ अंक = 8, 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों तुलनाओं में उभयनिष्ठ अक्षर ‘T’ है और दोनों समूहों में उभयनिष्ठ अंक ‘8’ है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ‘T’ के लिए कोड 8 है।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में, ‘PLANT’ को ‘48152’, ‘STARE’ को ‘92163’, ‘TRAIN’ को ‘26175’ और ‘SPLIT’ को ‘94872’ के रूप में कोडित किया जाता है। दी गई कूट भाषा में ‘R’ के लिए क्या कोड है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. अक्षर T चारों शब्दों में उभयनिष्ठ (common) है: 'PLANT', 'STARE', 'TRAIN' और 'SPLIT'। चारों कोडों (48152, 92163, 26175, 94872) में केवल अंक 2 उभयनिष्ठ है। अतः, T = 2 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. अक्षर A शब्द 'PLANT', 'STARE' और 'TRAIN' में उभयनिष्ठ है। इन तीनों के कोड में उभयनिष्ठ अंक 1 और 2 हैं। चूँकि T = 2 है, इसलिए A = 1 होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. अब, 'STARE' और 'TRAIN' की तुलना करने पर, उभयनिष्ठ अक्षर T, A और R हैं। इनके कोड (92163 और 26175) के बीच उभयनिष्ठ अंक 1, 2 और 6 हैं। चूँकि T = 2 और A = 1 है, इसलिए R का कोड 6 होगा।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह प्रश्न निम्नलिखित पाँच तीन-अक्षर वाले शब्दों पर आधारित है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WOK HEN TUB FAR DIG</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक शब्द में, प्रत्येक स्वर को अंग्रेजी वर्णमाला क्रम में उसके ठीक बाद आने वाले अक्षर में बदल दिया जाता है और प्रत्येक व्यंजन को अंग्रेजी वर्णमाला क्रम में उसके ठीक पहले आने वाले अक्षर में बदल दिया जाता है। इस प्रकार बने कितने अक्षर-समूहों में कम से कम एक स्वर होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोई नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक शब्द पर दी गई शर्तों को लागू करने पर (स्वर: +1, व्यंजन: −1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. WOK: W(−1) = V, O(+1) = P, K(−1) = J </span><span style=\"font-family:Arial\">→</span><span> VPJ (कोई स्वर नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. HEN: H(−1) = G, E(+1) = F, N(−1) = M </span><span style=\"font-family:Arial\">→</span><span> GFM (कोई स्वर नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. TUB: T(−1) = S, U(+1) = V, B(−1) = A </span><span style=\"font-family:Arial\">→</span><span> SVA (स्वर 'A' मौजूद है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. FAR: F(−1) = E, A(+1) = B, R(−1) = Q </span><span style=\"font-family:Arial\">→</span><span> EBQ (स्वर 'E' मौजूद है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. DIG: D(−1) = C, I(+1) = J, G(−1) = F </span><span style=\"font-family:Arial\">→</span><span> CJF (कोई स्वर नहीं)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ठीक दो अक्षर-समूहों (SVA और EBQ) में कम से कम एक स्वर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शॉर्टकट: स्वरों को ठीक बाद वाले अक्षर (+1) में बदलने पर B, F, J, P, V प्राप्त होते हैं (कोई स्वर नहीं बनता)। व्यंजनों को ठीक पहले वाले अक्षर (−1) में बदलने पर स्वर केवल तभी प्राप्त हो सकता है जब व्यंजन B (A बनता है), F (E बनता है), J (I बनता है), P (O बनता है), या V (U बनता है) हो। दिए गए शब्दों में केवल TUB (B मौजूद है) और FAR (F मौजूद है) में ये व्यंजन हैं, अतः केवल 2 समूहों में स्वर होगा।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उस युग्म का चयन करें जो नीचे दिए गए दो युग्मों द्वारा अपनाए गए समान पैटर्न का अनुसरण करता है। दोनों युग्म एक ही पैटर्न का अनुसरण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DKMT : GHRO</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FPBY : IMGT</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LTCV : OQHR</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HSEW : KPJR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NUHX : QRLS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BRJZ : EPOU</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए युग्मों में अनुसरित पैटर्न इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला अक्षर: +3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा अक्षर: -3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा अक्षर: +5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथा अक्षर: -5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DKMT : GHRO के लिए</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 3 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K - 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 5 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T - 5 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FPBY : IMGT के लिए</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P - 3 = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B + 5 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Y - 5 = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, HSEW : KPJR के लिए</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H + 3 = K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S - 3 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E + 5 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W - 5 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही युग्म HSEW : KPJR है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A % B' का अर्थ है 'A, B की बहन है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A $ B' का अर्थ है 'A, B का पिता है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A # B' का अर्थ है 'A, B का भाई है' और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A &amp; B' का अर्थ है 'A, B की माता है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपरोक्त के आधार पर, यदि 'J $ K &amp; L # M' है, तो J का M से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माँ का भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माँ का पिता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता का पिता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए व्यंजक 'J $ K &amp; L # M' के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'L # M' का अर्थ है कि L, M का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'K &amp; L' का अर्थ है कि K, L की माता है। चूँकि L, M का भाई है, इसलिए K, M की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'J $ K' का अर्थ है कि J, K का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि J, M की माता (K) का पिता है, इसलिए J, M की माँ का पिता (नाना) है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भिन्न </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image257.png\" width=\"68\" height=\"29\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image258.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> की माध्यिका क्या है?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image259.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image260.png\" width=\"14\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\" :0pt;margin-bottom:0pt;font-size:12pt\"><span>4. U, T का निकटतम पड़ोसी नहीं है: चूंकि स्थान 5, T (स्थान 6) के ठीक बगल में है, इसलिए U स्थान 5 पर नहीं हो सकता। अतः S स्थान 5 पर और U स्थान 3 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. शेष व्यक्ति Q स्थान 1 पर बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएं से दाएं अंतिम व्यवस्था है: Q (1), P (2), U (3), R (4), S (5), T (6), V (7)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, Q और R के बीच 2 व्यक्ति (P और U) बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन साझेदार रोहित, मोहित और शोभित क्रमशः ₹18,000, ₹22,500 और ₹31,500 के निवेश के साथ एक व्यवसाय शुरू करते हैं। वर्ष के अंत में, उन्होंने कुल निवेश के 20% के बराबर लाभ अर्जित किया और लाभ का 12% व्यवसाय में पुनर्निवेश करने का निर्णय लिया। यदि शेष लाभ को उनके निवेश के अनुपात में उनके बीच वितरित किया जाता है, तो लाभ में मोहित का हिस्सा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,168</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,960</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,320</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹5,544</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुल निवेश = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image269.png\" width=\"248\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुल लाभ = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/17904 ://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image282.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) पर या उससे आगे रखी वस्तु के सभी स्थानों के लिए वास्तविक और उल्टा प्रतिबिंब बनाता है। हालांकि, जब किसी वस्तु को प्रकाशिक केंद्र (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image283.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) और मुख्य फोकस (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image282.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) के बीच रखा जाता है, तो अपवर्तित किरणें फैलती हैं और वस्तु की ओर ही मिलती हुई प्रतीत होती हैं, जिससे एक आभासी, सीधा और आवर्धित प्रतिबिंब बनता है। इसी सिद्धांत का उपयोग साधारण आवर्धक लेंस (मैग्निफाइंग ग्लास) में किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात मित्र — P, Q, R, S, T, U और V — सोमवार से शुरू होकर उसी सप्ताह के रविवार को समाप्त होने वाले अलग-अलग दिनों में एक सेमिनार में भाग लेते हैं। T शनिवार को सेमिनार में भाग लेता है। R और T के बीच केवल दो व्यक्ति भाग लेते हैं, जहाँ R, T से पहले भाग लेता है। Q, P के ठीक पहले भाग लेता है। P और U के बीच केवल एक व्यक्ति भाग लेता है। S, V के बाद किसी दिन भाग लेता है, लेकिन S रविवार को भाग नहीं लेता है। Q किस दिन सेमिनार में भाग लेता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. T शनिवार को सेमिनार में भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. R, T से पहले भाग लेता है और उनके बीच केवल दो व्यक्ति हैं, इसलिए R बुधवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q, P के ठीक पहले भाग लेता है, इसलिए (Q, P) का क्रम (सोमवार, मंगलवार) या (गुरुवार, शुक्रवार) हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. यदि (Q, P) सोमवार और मंगलवार को होते, तो P और U के बीच एक व्यक्ति होने के कारण U को गुरुवार को होना पड़ता। तब V और S के लिए शुक्रवार और रविवार बचते। चूँकि S, V के बाद भाग लेता है और रविवार को भाग नहीं ले सकता, इसलिए यह स्थिति अमान्य हो जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अतः, Q गुरुवार को और P शुक्रवार को भाग लेता है। P और U के बीच एक व्यक्ति होने के कारण U रविवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. S, V के बाद भाग लेता है, इसलिए V सोमवार को और S मंगलवार को भाग लेता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम क्रम:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनिवार: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रविवार: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, Q गुरुवार को सेमिनार में भाग लेता है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\ ttps://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image286.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लाभ में बिपिन का हिस्सा = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1790424016454_image287.png\" width=\"153\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला के क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा अक्षर-समूह युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: विषम युग्म, व्यंजनों/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PMTK - IVKR</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ROWF - DYMT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TKVD - BXJV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UHXC - AZFW</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षर-समूह युग्मों में पहले समूह के अक्षरों का दूसरे समूह के अक्षरों के साथ उल्टे क्रम (reverse order) में एकांतर रूप से (+2 और -2) का संबंध है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- पहला अक्षर + 2 = दूसरे समूह का चौथा अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- दूसरा अक्षर - 2 = दूसरे समूह का तीसरा अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- तीसरा अक्षर + 2 = दूसरे समूह का दूसरा अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- चौथा अक्षर - 2 = दूसरे समूह का पहला अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक विकल्प की जाँच करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) PMTK - IVKR:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 2 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) - 2 = K (11)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 2 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) - 2 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिणाम = IVKR (पैटर्न का पालन करता है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) ROWF - DYMT:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (18) + 2 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (15) - 2 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W (23) + 2 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) - 2 = D (4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिणाम = DYMT (पैटर्न का पालन करता है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) UHXC - AZFW:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (21) + 2 = W (23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) - 2 = F (6)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>X (24) + 2 = Z (26)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) - 2 = A (1)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिणाम = AZFW (पैटर्न का पालन करता है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) TKVD - BXJV:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 2 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) - 2 = I (9) </span><span style=\"font-family:'Cambria Math'\">≠</span><span> J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) + 2 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) - 2 = B (2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ BXJV के स्थान पर BXIV होना चाहिए था।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, TKVD - BXJV समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P, Q, R, S, T, U और V में से प्रत्येक की एक ही सप्ताह के सोमवार से शुरू होकर उसी सप्ताह के रविवार को समाप्त होने वाले अलग-अलग दिनों में एक संगोष्ठी है। P की संगोष्ठी शुक्रवार को है। Q की संगोष्ठी P के तुरंत बाद वाले दिन है। R की संगोष्ठी S के तुरंत पहले वाले दिन है। T की संगोष्ठी S के तुरंत बाद वाले दिन है। U और V के बीच केवल दो व्यक्तियों की संगोष्ठी है। V की संगोष्ठी रविवार को नहीं है। निम्नलिखित में से किसकी संगोष्ठी गुरुवार को है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के आधार पर, हम सोमवार से रविवार तक का कार्यक्रम निर्धारित कर सकते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P की संगोष्ठी शुक्रवार को है और Q की संगोष्ठी P के तुरंत बाद है, इसलिए Q शनिवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R की संगोष्ठी S के तुरंत पहले है और T की संगोष्ठी S के तुरंत बाद है। अतः R, S और T को इसी क्रम (R - S - T) में लगातार तीन दिनों में होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शेष उपलब्ध दिन सोमवार, मंगलवार, बुधवार, गुरुवार और रविवार हैं। लगातार तीन दिनों के समूह केवल (सोमवार, मंगलवार, बुधवार) या (मंगलवार, बुधवार, गुरुवार) हो सकते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि R, S और T क्रमशः मंगलवार, बुधवार और गुरुवार को होते हैं, तो U और V को सोमवार और रविवार को होना होगा। लेकिन सोमवार और रविवार के बीच 5 व्यक्ति होंगे, जो इस शर्त का खंडन करता है कि U और V के बीच केवल दो व्यक्तियों की संगोष्ठी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः R, S और T क्रमशः सोमवार, मंगलवार और बुधवार को होने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब U और V के लिए केवल गुरुवार और रविवार शेष हैं। गुरुवार और रविवार के बीच ठीक दो व्यक्ति (शुक्रवार - P और शनिवार - Q) हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि V की संगोष्ठी रविवार को नहीं है, इसलिए V की संगोष्ठी गुरुवार को और U की संगोष्ठी रविवार को होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम व्यवस्था:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"> । (दूसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U I M </span><span style=\"font-family:Arial\">→</span><span> 'I' के ठीक पहले स्वर 'U' और ठीक बाद में व्यंजन 'M' है। (तीसरा)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अन्य कोई भी स्वर इस शर्त को पूरा नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ऐसे 3 स्वर हैं।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यान से पढ़ें। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह आमतौर पर ज्ञात तथ्यों से भिन्न प्रतीत होती हो, यह तय करें कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. सभी धातुएं ठोस हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. कोई ठोस गैस नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. कुछ तरल धातुएं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. कुछ तरल गैस नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. कोई धातु गैस नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. सभी तरल के गैस होने की संभावना है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और II अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और III अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II अनुसरण करता है</spa
