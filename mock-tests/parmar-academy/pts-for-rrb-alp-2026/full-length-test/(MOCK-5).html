Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given number: 8527364</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given operations:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 is added to each even digit:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 + 1 = 9</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 + 1 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 + 1 = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 + 1 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 is subtracted from each odd digit:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 - 2 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 - 2 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 - 2 = 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the digits in their respective places, the new number formed is 9335175.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In 9335175, the digits </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image219.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image001.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> appear twice. Thus, exactly two digits appear more than once.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five friends — Ankit, Bhavna, Chirag, Divya, and Ekta — have exams on different days of a week from Monday to Friday. Bhavna has her exam on Wednesday. Ankit has his exam on the day immediately before Bhavna. Divya has her exam on the day immediately after Ekta. How many people have exams after Ekta?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can arrange the friends from Monday to Friday:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Bhavna has her exam on Wednesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Ankit has his exam immediately before Bhavna, so Ankit has his exam on Tuesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Divya has her exam on the day immediately after Ekta. The only two consecutive days remaining are Thursday and Friday. Thus, Ekta has her exam on Thursday and Divya on Friday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The remaining day, Monday, is for Chirag.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final schedule is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Monday: Chirag</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tuesday: Ankit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wednesday: Bhavna</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thursday: Ekta</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Friday: Divya</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1 person (Divya) has an exam after Ekta.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons B, D, F, H, J, and M live on six different floors of a building. The lowermost floor is numbered 1, the floor above it is numbered 2, and so on till the topmost floor is numbered 6. J lives on an odd-numbered floor. Only two persons live between J and D, where D lives on a floor above J. B lives immediately below D. F lives immediately above M. Neither F nor M lives on the lowermost floor. H lives on an even-numbered floor. Who lives on floor number 5?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. J lives on an odd-numbered floor (1, 3, or 5). Since D lives above J with two persons between them, J can only be on floor 1 or 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. If J is on floor 3, D is on floor 6, and B is on floor 5. The remaining floors are 4, 2, and 1. Since F lives immediately above M, they must occupy consecutive floors (2 and 1), which means M lives on floor 1. But it is given that neither F nor M lives on the lowermost floor (floor 1). So this case is invalid.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Therefore, J lives on floor 1. D lives on floor 4 (two floors between them). B lives immediately below D, so B is on floor 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The available floors are 6, 5, and 2. Since F lives immediately above M, F must live on floor 6 and M on floor 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining person H lives on floor 2, which is an even-numbered floor.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Final arrangement from top to bottom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 6: F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 5: M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 4: D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 3: B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 2: H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 1: J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, M lives on floor number 5.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rohit spends 25% of his monthly salary on house rent, 15% on groceries, and 10% on transport. Of the remaining amount, he spends 40% on entertainment and deposits the rest in a savings account. If his monthly deposit in the savings account is ₹10,800, what is his total annual salary?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,60,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom: 3\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given that monthly deposit is ₹10,800:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image304.png\" width=\"90\" height=\"165\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Annual salary = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image305.png\" width=\"83\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Refer to the following number series and answer the question that follows. Counting is to be done from left to right.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Left) 7 4 8 5 2 4 9 6 3 8 2 7 1 4 6 5 (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many such even digits are there, each of which is immediately preceded by an odd digit and also immediately followed by an even digit?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: Odd Digit — Even Digit — Even Digit.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us check the given series: 7 4 8 5 2 4 9 6 3 8 2 7 1 4 6 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 7 4 8: 4 is an even digit, preceded by 7 (odd) and followed by 8 (even).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 5 2 4: 2 is an even digit, preceded by 5 (odd) and followed by 4 (even).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 3 8 2: 8 is an even digit, preceded by 3 (odd) and followed by 2 (even).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 1 4 6: 4 is an even digit, preceded by 1 (odd) and followed by 6 (even).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, there are 4 such even digits.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>This question is based on the following words:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CUB RED LIP NET</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each of the words, each vowel is changed to the letter immediately preceding it in the English alphabetical order and each consonant is changed to the letter immediately following it in the English alphabetical order. In how many letter-clusters thus formed, will at least one vowel appear?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given words: CUB, RED, LIP, NET</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the given condition:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Each vowel is replaced by its preceding letter (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image179.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Each consonant is replaced by its succeeding letter (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image180.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the changes to each word:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. CUB:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cluster formed = DTC (No vowel)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. RED:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cluster formed = SDE (Contains vowel 'E')</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. LIP:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cluster formed = MHQ (No vowel)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. NET:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image306.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cluster formed = ODU (Contains vowels 'O' and 'U')</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, exactly two letter-clusters (SDE and ODU) contain at least one vowel.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which letter-cluster pair DOES NOT belong to that group? (Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ACF - HJM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMP - RTW</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GIL - OQT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OQT - VXA</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positional values of letters in the English alphabet are used here.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each letter-cluster, the internal pattern is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st letter + 2 = 2nd letter, and 2nd letter + 3 = 3rd letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now check the relation between the corresponding letters of the first and second clusters in each pair:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) ACF - HJM:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A(1) + 7 = H(8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C(3) + 7 = J(10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F(6) + 7 = M(13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each letter is increased by +7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) KMP - RTW:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K(11) + 7 = R(18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M(13) + 7 = T(20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P(16) + 7 = W(23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each letter is increased by +7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) OQT - VXA:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O(15) + 7 = V(22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q(17) + 7 = X(24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T(20) + 7 = 27 = A(1)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each letter is increased by +7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) GIL - OQT:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G(7) + 8 = O(15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I(9) + 8 = Q(17)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L(12) + 8 = T(20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Each letter is increased by +8 instead of +7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, GIL - OQT does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the set in which the numbers are related in the same way as are the numbers of the given sets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding to/subtracting from/multiplying with 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(85, 125, 165)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(72, 112, 152)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(65, 105, 155)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(94, 134, 174)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(83, 121, 163)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(58, 98, 148)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }

    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>

</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
