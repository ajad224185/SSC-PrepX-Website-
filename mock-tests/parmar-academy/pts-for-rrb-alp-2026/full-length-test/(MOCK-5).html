<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9.) MOCK-5 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: TERMINAL</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given operations:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vowels are replaced by the next letter (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F, I → J, A → B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consonants are replaced by the previous letter (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T → S, R → Q, M → L, N → M, L → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The newly formed word is: SFQLJMBK</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the right end:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st from right = K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd from right = B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd from right = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th from right = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the letter fourth from the right end is J.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": "Wुicु cुनयnic नधौूiनोपयनद कiौधोौध iौ cुोनोcपधनप्रधक ृद ूधनंोnधnप कोंोgध पय पुध ोिॅधियोन थोििस, ूनiंोनiिद cोहौधक ृद ूनिययngधक cigोनधपपध ौंयाing?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Asthma</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Emphysema</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tuberculosis</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pneumonia</span></p>", "answer": "2 ence should be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image087.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Missing term = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image088.png\" width=\"42\" height=\"70\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 typists working 6 hours a day can type 1,080 pages in 5 days. How many typists working 8 hours a day are required to type 1,440 pages in 6 days?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Using the work formula: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image089.png\" width=\"75\" height=\"72\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image090.png\" width=\"52\" height=\"130\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image091.png\" width=\"49\" height=\"130\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Substituting the values:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image092.png\" width=\"59\" height=\"66\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image093.png\" width=\"51\" height=\"66\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image094.png\" width=\"31\" height=\"66\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image095.png\" width=\"32\" height=\"103\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, 15 typists are required.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain way based on the English alphabetical order, CAMP is related to MPBZ and LION is related to ONTQ. Following the same logic, to which of the following is DUST related?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IJHY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JIHY</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IKGZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HJFX</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1: Reverse the letters of the word.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2: Replace each letter with its opposite (reverse alphabetical) letter (where sum of positions is 27).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3: Add </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image096.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span> to the positional value of each letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For CAMP:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Reverse: P - M - A - C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Opposite letters: K - N - Z - X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Add </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image096.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>: K (11) + 2 = M, N (14) + 2 = P, Z (26) + 2 = B, X (24) + 2 = Z → MPBZ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For LION:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Reverse: N - O - I - L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Opposite letters: M - L - R - O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Add </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image096.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>: M (13) + 2 = O, L (12) + 2 = N, R (18) + 2 = T, O (15) + 2 = Q → ONTQ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for DUST:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Reverse: T - S - U - D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Opposite letters: G - H - F - W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Add </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image096.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>: G (7) + 2 = I, H (8) + 2 = J, F (6) + 2 = H, W (23) + 2 = Y → IJHY</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct answer is IJHY.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The question below consists of a question followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Question: Among three friends – Ravi, Suresh, and Tarun – who is the tallest?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Ravi is taller than Suresh.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Tarun is taller than Ravi.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement I alone is sufficient to answer the question, while data in Statement II alone is not</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement II alone is sufficient to answer the question, while data in Statement I alone is not</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in both statements I and II together are sufficient to answer the question</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in both statements I and II together are NOT sufficient to answer the question</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From Statement (I): Ravi &gt; Suresh. We do not know about Tarun's height, so Statement (I) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From Statement (II): Tarun &gt; Ravi. We do not know about Suresh's height, so Statement (II) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both statements: Tarun &gt; Ravi &gt; Suresh.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Tarun is the tallest among the three. Thus, data in both statements I and II together are sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven persons – P, Q, R, S, T, U and V – attend a seminar on seven different days of the same week starting from Monday and ending on Sunday. Only one person attends the seminar before S. Only two people attend the seminar after U. Three people attend the seminar between S and V. P attends the seminar immediately before R. T attends the seminar on one of the days before Q. How many people attend the seminar between T and U?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can determine the schedule from Monday to Sunday:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Only one person attends before S, so S attends on Tuesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people attend after U, so U attends on Friday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Three people attend between S and V. Since S is on Tuesday, V must attend on Saturday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P attends immediately before R. The only available consecutive days are Wednesday and Thursday, so P attends on Wednesday and R attends on Thursday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T attends on one of the days before Q. The remaining days are Monday and Sunday, so T attends on Monday and Q attends on Sunday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final order of days is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Monday: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tuesday: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wednesday: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thursday: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Friday: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturday: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sunday: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The people attending between T (Monday) and U (Friday) are S, P, and R, which is a total of 3 people.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DTM, GQQ, JNU, MKY, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QHD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PHC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OGC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PID</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: D (+3) → G (+3) → J (+3) → M (+3) → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: T (-3) → Q (-3) → N (-3) → K (-3) → H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: M (+4) → Q (+4) → U (+4) → Y (+4) → C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing term is PHC.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "Rधोक पुध giॅधn ौपोपधंधnपौ ोnक cयncिहौiयnौ cोनधीिहिद. Aौौहंing पुोप पुध inीयनंोपiयn giॅधn in पुध ौपोपधंधnपौ iौ पनहध, धॅधn iी iप ोूूधोनौ पय ृध ोप ॅोनiोncध थiपु cयंंयnिद ाnयथn ीोcपौ, कधciकध थुicु यी पुध giॅधn cयncिहौiयnौ ियgicोििद ीियियथ(ौ) ीनयं पुध ौपोपधंधnपौ.Sपोपधंधnपौ:Aिि ूधnौ ोनध ूधnciिस.Sयंध ूधnciिस ोनध धनोौधनौ.Aिि धनोौधनौ ोनध ौुोनूधnधनौ.Cयncिहौiयnौ:(I) Sयंध ौुोनूधnधनौ ोनध ूधnciिस.(II) Sयंध ूधnciिस ोनध ूधnौ.(III) Aिि ूधnौ ोनध धनोौधनौ.", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions (I) and (II) follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions (II) and (III) follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All conclusions (I), (II) and (III) follow</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'Some pencils are erasers' and 'All erasers are sharpeners': Since all erasers lie inside sharpeners and some pencils overlap with erasers, the intersection between pencils and erasers is definitely part of sharpeners. Therefore, 'Some sharpeners are pencils' logically follows (Conclusion I is true).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'All pens are pencils': By definite conversion of a universal affirmative statement, 'Some pencils are pens' logically follows (Conclusion II is true).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. There is no definite relationship established between pens and erasers. Thus, 'All pens are erasers' is merely a possibility and does not definitely follow (Conclusion III is false).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, only conclusions (I) and (II) follow.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six friends P, Q, R, S, T, and U are sitting around a circular table facing the centre. S sits third to the right of P. U sits to the immediate left of P. R sits second to the left of T. Who is sitting second to the right of P?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let P be seated facing the centre.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S sits third to the right of P, which means S is directly opposite to P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U sits to the immediate left of P (clockwise adjacent to P).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The remaining positions are for Q, R, and T. R sits second to the left of T, which is only possible if T sits to the immediate left of U, placing R second to T's left.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining position is taken by Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the circular order in clockwise direction is: P → U → T → S → R → Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting to the right of P (counter-clockwise): first to the right is Q, and second to the right is R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, R is sitting second to the right of P.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A, B, and C started a business in partnership. A invested ₹50,000 for 6 months, B invested ₹40,000 for 9 months, and C invested ₹60,000 for 8 months. If the total profit at the end of the period was ₹53,200, find the share of B in the profit.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹14,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹16,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹19,600</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹22,400</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The ratio of profit is proportional to the product of capital invested and the time period:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image097.png\" width=\"208\" height=\"136\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image098.png\" width=\"181\" height=\"58\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total ratio units = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image099.png\" width=\"34\" height=\"93\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total profit = ₹53,200</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Share of B = </span><img src=\"https://static-appxdb-v2.ak ttom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image105.png\" width=\"98\" height=\"223\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Curved surface area (CSA) of the conical tent:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image106.png\" width=\"71\" height=\"280\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Area of canvas needed = Length </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image107.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span> Width</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image108.png\" width=\"121\" height=\"165\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the 7-digit number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image109.png\" width=\"61\" height=\"24\" alt style=\"vertical-align:middle\" ><span> is completely divisible by 11, then what is the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image110.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span>?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option3": " <p style=\"margin-top:  src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image116.png\" width=\"61\" height=\"113\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Below are given two sets of numbers. In each set of numbers, a certain mathematical operation on the first number results in the second number. Similarly, a certain mathematical operation on the second number results in the third number and so on. Which of the given options follows the same set of operations as in the given sets?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 - 14 - 18 - 9 ; 11 - 22 - 26 - 13</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 - 16 - 22 - 11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 - 28 - 32 - 18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 - 30 - 34 - 17</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 - 20 - 26 - 13</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed in the given sets is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image11 estion_heading": ""}, {"sr_no": 30, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the mode of the following data is 18, then find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image110.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16, 18, 15, 17, 16, 18, 19, 16, 17, 18, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image156.png\" width=\"23\" height=\"47\" alt style=\"vertical-align:middle\" ><span>, 20</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given data: 16, 18, 15, 17, 16, 18, 19, 16, 17, 18, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image156.png\" width=\"23\" height=\"47\" alt style=\"vertical-align:middle\" ><span>, 20.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting the frequency of each known observation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 occurs 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 occurs 3 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 occurs 2 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 occurs 3 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19 occurs 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 occurs 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For 18 to be the mode of the data, its frequency must be strictly greater than that of 16 (which occurs 3 times). Thus, 18 must appear at least 4 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image157.png\" width=\"34\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image158.png\" width=\"54\" height=\"90\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The ratio of the radius and height of a solid right circular cylinder is 2 : 3. If its volume is 12,936 cm³, then what is the total surface area of the cylinder? (Take </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image101.png\" width=\"30\" height=\"56\" alt style=\"vertical-align:middle\" ><span>)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2940 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3080 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3160 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2860 cm²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the radius of " width=\"54\" height=\"122\" alt style=\"vertical-align:middle\" ><span> per annum.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the sum </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image177.png\" width=\"63\" height=\"151\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons – P, Q, R, S, T, and U – live on six different floors of a building. The lowermost floor is numbered 1, the floor above it is numbered 2, and so on till the topmost floor is numbered 6. T lives on the lowermost floor. Exactly two persons live between T and R. P lives immediately above R. S lives on an even-numbered floor below R. U lives immediately above S. Who lives on the topmost floor?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information: 1. T lives on the lowermost floor, so T lives on floor 1. 2. Exactly two persons live between T and R, which means R lives on floor 4. 3. P lives immediately above R, so P lives on floor 5. 4. S lives on an even-numbered floor below R. The only even-numbered floor below floor 4 is floor 2, so S lives on floor 2. 5. U lives immediately above S, so U lives on floor 3. 6. The only remaining floor is floor 6, which must be occupied by Q. Therefore, Q lives on the topmost floor.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A bee sting causes pain and irritation due to the injection of methanoic acid into the skin. Which of the following substances can be applied to provide relief through neutralisation?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vinegar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Baking soda</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Lemon juice</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tartaric acid</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A bee sting injects methanoic acid (formic acid), which causes severe burning pain and irritation. To relieve this, a mild base such as baking soda (sodium hydrogen carbonate, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image178.png\" width=\"60\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) or calamine solution is applied to neutralise the acid. Other options like vinegar, lemon juice, and tartaric acid are all acidic substances and would aggravate the irritation rather than neutralizing it.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the word 'SPECTRUM', each consonant is changed to the letter immediately preceding it in the English alphabetical order and each vowel is changed to the letter immediately following it in the English alphabetical order. Which of the following letters will be fourth from the right end in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: SPECTRUM</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consonants are changed to the preceding letter (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image179.png\" width=\"21\" height=\"24\" alt style=\"vertical-align:middle\" ><span>): S → R, P → O, C → B, T → S, R → Q, M → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vowels are changed to the following letter (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image180.png\" width=\"21\" height=\"23\" alt style=\"vertical-align:middle\" ><span>): E → F, U → V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The new letter sequence formed is: R O F B S Q V L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the right end:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st from right = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd from right = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd from right = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th from right = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the letter fourth from the right end is S.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The perimeter of a sector of a circle of radius 10.5 cm is 43 cm. What is the area (in </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image181.png\" width=\"28\" height=\"23\" alt style=\"vertical-align:middle\" ><span>) of this sector? (Take </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image101.png\" width=\"30\" height=\"56\" alt style=\"vertical-align:middle\" ><span>)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>115.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>105</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>126</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>231</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The perimeter of a sector is given by the formula:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image182.png\" width=\"74\" height=\"90\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>where </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image183.png\" width=\"8\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is the radius and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image104.png\" width=\"6\" height=\"23\" alt style=\"vertical-align:middle\" ><span> is the length of the arc.</span></p><p style=\"margin-top:0pt;mar does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P, Q, and R together can complete a piece of work in 12 days. P and Q together can do the same work in 18 days, while Q and R together can do it in 24 days. How many days would Q alone take to complete the entire work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>80 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>90 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the total work be the LCM of 12, 18, and 24, which is 72 units.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of (P + Q + R) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image205.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> units/day</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of (P + Q) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image206.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> units/day</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of (Q + R) = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image207.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> units/day</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of Q = Efficiency of (P + Q) + Efficiency of (Q + R) - Efficiency of (P + Q + R)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of Q = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image208.png\" width=\"44\" height=\"70\" alt style=\"vertical-align:middle\" ><span> unit/day</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, time taken by Q alone = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image209.png\" width=\"32\" height=\"57\" alt style=\"vertical-align:middle\" ><span> days.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following four letter-clusters are alike in a certain way based on the English alphabetical order and thus form a group. Which letter-cluster DOES NOT belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEHL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLOS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRUZ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORV</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Check the positional difference between consecutive letters in each cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEHL: C (+2) → E (+3) → H (+4) → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLOS: J (+2) → L (+3) → O (+4) → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORV: M (+2) → O (+3) → R (+4) → V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRUZ: P (+2) → R (+3) → U (+5) → Z (it should be Y for +4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, PRUZ does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A certain sum amounts to ₹8,060 in 3 years and to ₹9,100 in 5 years at simple interest at a certain rate per annum. What is the sum (in ₹)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6,200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the principal be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image045.png\" width=\"10\" height=\"23\" alt style=\"vertical-align:middle\" ><span> and the rate of simple interest be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image210.png\" width=\"25\" height=\"24\" alt style=\"vertical-align:middle\" ><span> per annum.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Amount in 5 years </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image211.png\" width=\"64\" height=\"23\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Amount in 3 years </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image212.png\" width=\"64\" height=\"23\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Simple Interest for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image213.png\" width=\"43\" height=\"47\" alt style=\"vertical-align:middle\" ><span> years </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image214.png\" width=\"105\" height=\"58\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Simple Interest for 1 year </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image215.png\" width=\"49\" height=\"67\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Simple Interest for 3 years </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image216.png\" width=\"64\" height=\"79\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Principal </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image217.png\" width=\"260\" height=\"94\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six friends, P, Q, R, S, T, and U, are sitting around a circular table facing the centre. P sits opposite to S. Q sits to the immediate right of P. T sits between P and R. U sits between S and Q. Who sits opposite to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 6 positions around the circular table facing the centre be arranged in clockwise order from 1 to 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let P be at position 1. Since P sits opposite to S, S is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Facing the centre, the immediate right of position 1 is position 6 (counter-clockwise). So, Q is at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. T sits between P and R. Since position 6 is already occupied by Q, T must be at position 2 and R at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. U sits between S (position 4) and Q (position 6), which places U at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The clockwise arrangement is P (1), T (2), R (3), S (4), U (5), and Q (6).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The person sitting opposite to T (position 2) is U (position 5).</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following groups of classes is best represented by the given Venn diagram?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fathers, Brothers, Males</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Herbivores, Cows, Tigers</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Scientists, Authors, Women</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Engineers, Doctors, Lawyers</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given Venn diagram shows three distinct sets that mutually intersect one another, creating seven regions: three individual regions, three pairwise intersections, and one central region where all three overlap.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Evaluating the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Fathers, Brothers, Males: All fathers are males and all brothers are males. This relationship is represented by two overlapping circles completely enclosed within a larger circle.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Herbivores, Cows, Tigers: All cows are herbivores, while tigers are strictly non-herbivores (carnivores). This requires one circle inside another and one completely separate circle.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Scientists, Authors, Women: Some scientists are authors; some authors are women; some scientists are women; and an individual can simultaneously be a scientist, an author, and a woman. Additionally, each class has members who do not belong to the other two. Thus, this relationship is accurately depicted by three mutually intersecting circles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Engineers, Doctors, Lawyers: These are three distinct professions with separate qualifications, represented by three mutually disjoint circles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, option C is correct.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What is the total membership of the Estimates Committee of the Parliament of India?</sp a deep purple solution is formed. Even after repeatedly diluting this solution several times, the colour remains visible. This experiment primarily demonstrates that:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>particles of matter are extremely tiny and numerous</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>particles of matter remain stationary in a liquid medium</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>water molecules react chemically with the crystals</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>liquids do not have any intermolecular spaces</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The persistence of colour even after multiple dilutions shows that just a few crystals of potassium permanganate contain millions of extremely tiny particles. These particles continue to divide and distribute themselves uniformly between the intermolecular spaces of water molecules, demonstrating the particulate and microscopic nature of matter.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 'A + B' means 'A is the father of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' means 'A is the sister of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' means 'A is the brother of B' and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' means 'A is the mother of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>then how is M related to P in the expression 'M × N + O - P'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paternal uncle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nephew</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given expression: M × N + O - P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M × N → M is the brother of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N + O → N is the father of O.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. O - P → O is the sister of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From (2) and (3), N is the father of both O and P. Since M is the brother of N (P's father), M is the paternal uncle of P.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Match the types of connective tissues in Column I with their respective functions/features in Column II:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Column I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Tendon</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Ligament</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. Areolar tissue</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Column II</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. Fills the space inside organs and helps in tissue repair</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. Connects skeletal muscles to bones</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C. Connects one bone to another bone</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-B, II-C, III-A</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-C, II-B, III-A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-B, II-A, III-C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I-A, II-C, III-B</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct match is:Tendon (I-B): Tendons are dense regular connective tissues that attach skeletal muscles to bones. They are tough and have high tensile strength with limited flexibility.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ligament (II-C): Ligaments are fibrous connective tissues that connect two bones to each other at a joint. They are elastic and flexible.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Areolar tissue (III-A): This is a loose connective tissue found between the skin and muscles, around blood vessels and nerves, and in the bone marrow. It fills the space inside organs, supports internal organs, and helps in the repair of tissues.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct combination is I-B, II-C, III-A.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A + B’ means ‘A is the father of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A − B’ means ‘A is the mother of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A × B’ means ‘A is the brother of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A ÷ B’ means ‘A is the sister of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How is P related to S if ‘P × Q − R + S ÷ T’?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's mother's brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's father's brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's father's brother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's mother's brother</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the given expression ‘P × Q − R + S ÷ T’ step by step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P × Q → P is the brother of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q − R → Q is the mother of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R + S → R is the father of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. S ÷ T → S is the sister of T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tracing the relationship from S to P:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- R is the father of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Q is the mother of R (S's father's mother).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- P is the brother of Q (S's father's mother's brother).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, P is the father's mother's brother of S.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two pipes A and B can fill a tank in 24 minutes and 32 minutes, respectively. If both pipes are opened simultaneously, after how much time should pipe B be closed so that the tank is completely filled in 18 minutes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 minutes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 minutes</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the total capacity of the tank be the LCM of 24 and 32, which is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image286.png\" width=\"18\" height=\"23\" alt style=\"vertical-align:middle\" ><span> units.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of pipe A = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image287.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> units/minute</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Efficiency of pipe B = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1791442869815_image288.png\" width=\"23\" height=\"57\" alt style=\"vertical-align:middle\" ><span> units/minute</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since pipe A remains open for the entire 18 minutes, the
