<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>24.) MOCK-12 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पदार्थ के गतिज आणविक सिद्धांत के अनुसार, किसी पदार्थ के कणों की औसत गतिज ऊर्जा उसके किसके सीधे समानुपाती होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>घनत्व</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परम तापमान (एब्सोल्यूट टेम्परेचर)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आयतन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दाब</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पदार्थ के गतिज सिद्धांत के अनुसार, कणों की औसत गतिज ऊर्जा उसके परम तापमान के सीधे समानुपाती होती है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image054.png\" width=\"23\" height=\"47\" alt style=\"vertical-align:middle\" ><span>)। जब किसी पदार्थ का तापमान बढ़ाया जाता है, तो उसके कण ऊर्जा प्राप्त करके तेजी से गति करने लगते हैं, जिससे उनकी औसत गतिज ऊर्जा बढ़ जाती है।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यान से पढ़िए। आपको दिए गए कथनों को सत्य मानना है, भले ही वे सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होते हों, और यह तय करना है कि कौन-सा/से निष्कर्ष दिए गए कथनों से तार्किक रूप से अनुसरण करता/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुछ डॉक्टर, शिक्षक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी शिक्षक, शोधकर्ता हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुछ शोधकर्ता, वैज्ञानिक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) कुछ शोधकर्ता, डॉक्टर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) कुछ वैज्ञानिक, शिक्षक हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों निष्कर्ष (I) और (II) अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'कुछ डॉक्टर, शिक्षक हैं' और 'सभी शिक्षक, शोधकर्ता हैं' से स्पष्ट है कि डॉक्टरों का वह भाग जो शिक्षक है, शोधकर्ता के अंतर्गत भी आता है। अतः, 'कुछ शोधकर्ता, डॉक्टर हैं' निश्चित रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'सभी शिक्षक, शोधकर्ता हैं' और 'कुछ शोधकर्ता, वैज्ञानिक हैं' से वैज्ञानिकों और शिक्षकों के बीच कोई निश्चित संबंध स्थापित नहीं होता है। अतः, निष्कर्ष (II) अनुसरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष (I) अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि 'P' का अर्थ '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image001.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span>' है, ' in-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">मूत्राशय (Urinary bladder):</span><span> एक थैलीनुमा अंग जो मूत्र को अस्थायी रूप से संग्रहित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">मूत्रमार्ग (Urethra):</span><span> वह नलिका जिसके माध्यम से मूत्र को शरीर से बाहर विसर्जित किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परागकणों का उसी पौधे के एक फूल के परागकोश से दूसरे फूल के वर्तिकाग्र तक स्थानांतरण ______ कहलाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्वयुग्मन (Autogamy)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सजातपुष्पी परागण (Geitonogamy)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परनिषेचन (Xenogamy)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>असंगजनन (Apomixis)</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सजातपुष्पी परागण (Geitonogamy) परागकणों का उसी पौधे के एक फूल के परागकोश से दूसरे फूल के वर्तिकाग्र तक स्थानांतरण है। यद्यपि कार्यात्मक रूप से यह परागण कारक से होने वाला एक प्रकार का पर-परागण है, लेकिन आनुवंशिक रूप से यह स्वयुग्मन के समान होता है क्योंकि परागकण एक ही पौधे से प्राप्त होते हैं।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में, ‘fresh fruits are sweet’ को ‘le ra ta po’ लिखा जाता है, ‘sweet orange is fresh’ को ‘po ma le si’ लिखा जाता है, और ‘orange are very sour’ को ‘ma ra ju ka’ लिखा जाता है। उसी कूट भाषा में ‘fruits’ को कैसे लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ra</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ta</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>po</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>le</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘fresh fruits are sweet’ = ‘le ra ta po’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘sweet orange is fresh’ = ‘po ma le si’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ‘orange are very sour’ = ‘ma ra ju ka’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 1 और कथन 2 की तुलना करने पर, उभयनिष्ठ शब्द ‘fresh’ और ‘sweet’ हैं, तथा उभयनिष्ठ कूट ‘le’ और ‘po’ हैं। अतः {fresh, sweet} = {le, po} होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 1 और कथन 3 की तुलना करने पर, उभयनिष्ठ शब्द ‘are’ है, तथा उभयनिष्ठ कूट ‘ra’ है। अतः ‘are’ = ‘ra’ होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब कथन 1 में, केवल शब्द ‘fruits’ बचता है और केवल कूट ‘ta’ बचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः ‘fruits’ का कूट ‘ta’ है।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब लोहे की कील को कॉपर सल्फेट के विलयन में डुबोया जाता है, जिससे विलयन का नीला रंग फीका पड़ जाता है और कील पर लाल-भूरे रंग की परत जम जाती है, तो यह किस प्रकार की रासायनिक अभिक्रिया होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>संयोजन अभिक्रिया</span></p>", "option2": " <p style=\"m म समान पैटर्न का अनुसरण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DMK : GIP</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RTC : UPH</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PZK : SVO</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BXN : ETS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MLG : PHM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FUJ : IRO</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए युग्मों में निम्नलिखित पैटर्न का अनुसरण किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">DMK : GIP</span><span> के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 3 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M − 4 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K + 5 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">RTC : UPH</span><span> के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T − 4 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C + 5 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पैटर्न </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image151.png\" width=\"48\" height=\"58\" alt style=\"vertical-align:middle\" ><span> है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्पों की जाँच करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• PZK : SVO → P + 3 = S, Z − 4 = V, K + 5 = P (≠ O)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">BXN : ETS</span><span> → B + 3 = E, X − 4 = T, N + 5 = S (पैटर्न का अनुसरण करता है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• MLG : PHM → M + 3 = P, L − 4 = H, G + 5 = L (≠ M)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• FUJ : IRO → F + 3 = I, U − 4 = Q (≠ R), J + 5 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही युग्म </span><span style=\"font-weight:bold\">BXN : ETS</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सितंबर 2024 में, प्रधानमंत्री नरेंद्र मोदी ने तीन 'परम रुद्र' सुपरकंप्यूटर राष्ट्र को समर्पित किए। ये सुपरकंप्यूटर निम्नलिखित में से किस मिशन के तहत विकसित किए गए हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राष्ट्रीय क्वांटम मिशन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिजिटल इंडिया मिशन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राष्ट्रीय सुपरकंप्यूटिंग मिशन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अटल इनोवेशन मिशन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सितंबर 2024 में, प्रधानमंत्री नरेंद्र मोदी ने तीन स्वदेशी रूप से विकसित 'परम रुद्र' सुपरकंप्यूटर राष्ट्र को समर्पित किए। इन सुपरकंप्यूटरों को उन्नत वैज्ञानिक अनुसंधान की सुविधा के लिए राष्ट्रीय सुपरकंप्यूटिंग मिशन (NSM) के तहत प्रगत संगणन विकास केंद्र (C-DAC) द्वारा विकसित किया गया है।</span></p>", "questi र्य चपटा या अंडाकार दिखाई देता है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित शृंखला का संदर्भ लें और उसके बाद आने वाले प्रश्न का उत्तर दें। गणना केवल बाएँ से दाएँ की जानी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(बाएँ) P # 6 2 K @ 9 M % T 4 &amp; 5 R * 8 Q 7 @ A (दाएँ)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऐसे कितने प्रतीक हैं, जिनमें से प्रत्येक के ठीक पहले एक अक्षर और ठीक बाद में एक संख्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हमें निम्नलिखित स्वरूप (पैटर्न) की पहचान करनी है: </span><span style=\"font-weight:bold\">अक्षर → प्रतीक → संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में बाएँ से दाएँ देखने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">P # 6</span><span> — प्रतीक '#' के ठीक पहले अक्षर 'P' और ठीक बाद में संख्या '6' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">K @ 9</span><span> — प्रतीक '@' के ठीक पहले अक्षर 'K' और ठीक बाद में संख्या '9' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">R * 8</span><span> — प्रतीक '*' के ठीक पहले अक्षर 'R' और ठीक बाद में संख्या '8' है।</span></p><p style=\"marg ps://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image193.png\" width=\"73\" height=\"108\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुरुष की कार्यक्षमता 2 इकाई/दिन और महिला की कार्यक्षमता 1 इकाई/दिन मानते हुए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुल कार्य = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image194.png\" width=\"42\" height=\"206\" alt style=\"vertical-align:middle\" ><span> इकाई।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले 1 पुरुष द्वारा लिया गया समय = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image195.png\" width=\"32\" height=\"57\" alt style=\"vertical-align:middle\" ><span> दिन।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित ऊँचाई तक उठाई गई किसी वस्तु की गुरुत्वाकर्षण स्थितिज ऊर्जा निम्नलिखित में से किस पर निर्भर करती है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>i) वस्तु का द्रव्यमान</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ii) संदर्भ तल से वस्तु की ऊँचाई</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>iii) उस ऊँचाई तक पहुँचने के लिए वस्तु द्वारा तय किया गया पथ</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (i) और (ii)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (ii) और (iii)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i), (ii) और (iii) सभी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (i) और (iii)</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऊँचाई </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image196.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> पर किसी वस्तु की गुरुत्वाकर्षण स्थितिज ऊर्जा का सूत्र </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image197.png\" width=\"49\" height=\"47\" alt style=\"vertical-align:middle\" ><span> होता है, जहाँ </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image188.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> वस्तु का द्रव्यमान है, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image198.png\" width=\"10\" height=\"23\" alt style=\"vertical-align:middle\" ><span> गुरुत्वीय त्वरण है, और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image196.png\" width=\"9\" height=\"23\" alt style=\"vertical-align:middle\" ><span> संदर्भ तल से ऊर्ध्वाधर ऊँचाई है। चूँकि गुरुत्वाकर्षण एक संरक्षी बल (conservative force) है, इसलिए गुरुत्वाकर्षण के विरुद्ध किया गया कार्य केवल प्रारंभिक और अंतिम स्थितियों पर निर्भर करता है, न कि तय किए गए पथ पर। अतः यह केवल (i) और (ii) पर निर्भर करती है।</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर DFIM का संबंध GJNS से एक निश्चित तरीके से है। उसी तरह, KMPT का संबंध NQUZ से है। उसी तर्क का अनुसरण करते हुए, निम्नलिखित में से किस विकल्प का संबंध BDGK से है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EHMQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EHLQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EGMQ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FHLQ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अनुसरित तर्क इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला पद से दूसरा पद:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 3 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F + 4 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I + 5 = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 6 = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उसी प्रकार, KMPT और NQUZ के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K + 3 = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 4 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P + 5 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T + 6 = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही स्वरूप BDGK पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B + 3 = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 4 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G + 5 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K + 6 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, BDGK का संबंध EHLQ से है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: भिन्न समूह व्यंजन/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CH - GL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MR - QV</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TY - XC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PU - TZ</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षर-समूह युग्मों में अनुसरण किया गया पैटर्न इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला अक्षर + 4 = दूसरे समूह का पहला अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा अक्षर + 4 = दूसरे समूह का दूसरा अक्षर</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक विकल्प की जाँच करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) CH - GL: C (3) + 4 = G (7); H (8) + 4 = L (12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) MR - QV: M (13) + 4 = Q (17); R (18) + 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) TY - XC: T (20) + 4 = X (24); Y (25) + 4 = C (3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) PU - TZ: P (16) + 4 = T (20); U (21) + 5 = Z (26) [+4 के पैटर्न का अनुसरण नहीं करता है]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, PU - TZ समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात मित्र P, Q, R, S, T, U और V एक वृत्ताकार मेज के चारों ओर केंद्र की ओर मुख करके बैठे हैं। T, P के दाईं ओर तीसरे स्थान पर बैठा है। Q, T के बाईं ओर दूसरे स्थान पर बैठा है। U, P के ठीक बाईं ओर बैठा है। R, S के दाईं ओर दूसरे स्थान पर बैठा है। T के संदर्भ में V का स्थान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाईं ओर दूसरा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दाईं ओर तीसरा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दाईं ओर दूसरा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ठीक बाईं ओर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्र की ओर मुख करके बैठे 7 स्थानों को दक्षिणावर्त (clockwise) क्रम में 1, 2, 3, 4, 5, 6, 7 मान लेते हैं (जहाँ दक्षिणावर्त दिशा बाईं ओर और वामावर्त दिशा दाईं ओर होती है):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना P स्थान 1 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T, P के दाईं ओर तीसरे स्थान पर है, इसलिए T स्थान 5 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q, T के बाईं ओर दूसरे स्थान पर है, इसलिए Q स्थान 7 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. U, P के ठीक बाईं ओर बैठा है, इसलिए U स्थान 2 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अब रिक्त स्थान 3, 4 और 6 बचे हैं। चूँकि R, S के दाईं ओर दूसरे स्थान पर है, इसलिए S स्थान 6 पर और R स्थान 4 पर बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. अतः शेष बचा व्यक्ति V स्थान 3 पर बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (स्थान 5) के संदर्भ में देखने पर, V (स्थान 3) दाईं ओर दूसरे स्थान पर है।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि किसी धारावाही वृत्ताकार कुंडली में धारा और त्रिज्या को स्थिर रखते हुए फेरों की संख्या को दोगुना कर दिया जाए, तो कुंडली के केंद्र पर चुंबकीय क्षेत्र:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अपरिवर्तित रहेगा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आधा हो जाएगा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोगुना हो जाएगा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार गुना हो जाएगा</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी धारावाही वृत्ताकार कुंडली के केंद्र पर चुंबकीय क्षेत्र का मान सूत्र </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image199.png\" width=\"43\" height=\"56\" alt style=\"vertical-align:middle\" ><span> द्वारा दिया जाता है, जहाँ </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image200.png\" width=\"12\" height=\"23\" alt style=\"vertical-align:middle\" ><span> फेरों की संख्या, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image201.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ><span> धारा और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image138.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span> त्रिज्या है। चूँकि चुंबकीय क्षेत्र फेरों की संख्या के सीधे आनुपातिक होता है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image202.png\" width=\"26\" height=\"47\" alt style=\"vertical-align:middle\" ><span>), इसलिए फेरों की संख्या दोगुनी करने पर चुंबकीय क्षेत्र भी दोगुना हो जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नीचे दो कथन, I और II दिए गए हैं। ये कथन स्वतंत्र कारण हो सकते हैं या स्वतंत्र कारणों या किसी सामान्य कारण के प्रभाव हो सकते हैं। इनमें से एक कथन दूसरे कथन का प्रभाव हो सकता है। दोनों कथनों को पढ़िए और सही उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. पिछले दो सप्ताहों में शहर 'Z' में ताजी सब्जियों के खुदरा मूल्यों में भारी वृद्धि हुई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. शहर 'Z' के पड़ोसी ग्रामीण जिलों में लगातार और बेमौसम भारी बारिश ने खड़ी सब्जियों की फसलों को नष्ट कर दिया।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका संभावित प्रभाव है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारणों के प्रभाव हैं।</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सब्जियों की आपूर्ति करने वाले ग्रामीण जिलों में भारी और बेमौसम बारिश के कारण फसलों के नष्ट होने से नजदीकी शहरी बाजार में सब्जियों की आपूर्ति कम हो जाती है। आपूर्ति में इस कमी के कारण सब्जियों की कीमतों में वृद्धि होती है। अतः, कथन II कारण है और कथन I इसका संभावित प्रभाव है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पौधों में लचीलापन, जो बिना टूटे विभिन्न भागों जैसे कि प्रतान और पर्वतारोहियों के तनों को आसानी से मुड़ने की अनुमति देता है, निम्नलिखित में से किस ऊतक के कारण होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्क्लेरेन्काइमा (दृढ़ोतक)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोलेंकाइमा (स्थूलकोण ऊतक)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पेरेन्काइमा (मृदूतक)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जाइलम</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोलेंकाइमा (स्थूलकोण ऊतक) पौधों में पाया जाने वाला एक सरल स्थायी ऊतक है, जो मुख्य रूप से एपिडर्मिस के नीचे पत्ती के डंठलों में पाया जाता है। इसमें जीवित, लंबी कोशिकाएं होती हैं जिनकी कोशिका भित्ति कोनों पर पेक्टिन और सेल्यूलोज के कारण असमान रूप से मोटी होती है। यह पौधों को यांत्रिक सहायता और लचीलापन प्रदान करता है, जिससे पौधे के अंग बिना टूटे आसानी से मुड़ सकते हैं।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर, निम्नलिखित चार अक्षर-समूह युग्मों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: भिन्न समूह व्यंजन/स्वरों की संख्या या अक्षर-समूह में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BFK - DHM</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PTY - RVZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GKP - IMR</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MQV - OSX</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षर-समूह युग्मों में अनुसरण किया गया पैटर्न यह है कि दूसरे समूह का प्रत्येक अक्षर, पहले समूह के संगत अक्षर के स्थानीय मान में 2 जोड़कर प्राप्त होता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BFK → DHM:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 2 = D (4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) + 2 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 2 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GKP → IMR:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (7) + 2 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) + 2 = M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 2 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MQV → OSX:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 2 = O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 2 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) + 2 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PTY → RVZ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 2 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 2 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Y (25) + 1 = Z (26) [यहाँ, Y + 2 करने पर A आना चाहिए था]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">PTY - RVZ</span><span> उस समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक दुकानदार एक वस्तु को ₹720 में खरीदता है। उसे उस वस्तु पर कितना मूल्य अंकित करना चाहिए ताकि 8% की छूट देने के बाद भी उसे 15% का लाभ प्राप्त हो?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹850</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹900</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹920</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹960</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हम जानते हैं कि अंकित मूल्य (MP) और क्रय मूल्य (CP) के बीच का संबंध है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image203.png\" width=\"71\" height=\"70\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया है: CP = ₹720, लाभ% = 15%, छूट% = 8%</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image204.png\" width=\"57\" height=\"170\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image205.png\" width=\"49\" height=\"122\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, अंकित मूल्य ₹900 होना चाह िष्कर्ष निकलता है कि कुछ शर्ट, जैकेट हैं, जिसका अर्थ है 'कुछ जैकेट, शर्ट हैं'। अतः, निष्कर्ष (I) तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. कथन 'सभी पैंट, जैकेट हैं' और 'कोई जैकेट, स्वेटर नहीं है' से, चूंकि सभी पैंट पूरी तरह से जैकेट के अंतर्गत हैं और कोई भी जैकेट स्वेटर नहीं है, इसलिए कोई भी पैंट स्वेटर नहीं हो सकती है। अतः, निष्कर्ष (II) भी तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, दोनों निष्कर्ष (I) और (II) अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 cm फोकस दूरी वाले एक अवतल दर्पण के सामने 30 cm की दूरी पर एक वस्तु रखी गई है। दर्पण से प्रतिबिम्ब की दूरी (cm में) क्या होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>-20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>-15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+15</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दर्पण सूत्र के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image217.png\" width=\"23\" height=\"120\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अवतल दर्पण की फोकस दूरी, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image218.png\" width=\"67\" height=\"47\" alt oader_images/1792767125570_image224.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ><span>।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि शब्द REPUBLIC में प्रत्येक स्वर को अंग्रेजी वर्णमाला में उसके बाद आने वाले अक्षर से बदल दिया जाए और प्रत्येक व्यंजन को अंग्रेजी वर्णमाला में उसके पहले आने वाले अक्षर से बदल दिया जाए, तो इस प्रकार बने अक्षरों के नए समूह में बाएं छोर से चौथे स्थान पर कौन-सा अक्षर होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द: REPUBLIC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शर्त के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. स्वरों को अगले अक्षर (+1) से बदला जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E → F, U → V, I → J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. व्यंजनों को पिछले अक्षर (−1) से बदला जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R → Q, P → O, B → A, L → K, C → B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, बनने वाला नया अक्षर समूह है: </span><span style=\"font-weight:bold\">Q F O V A K J B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएं छोर से चौथा अक्षर </span><span style=\"font-weight:bold\">V</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A + B’ का अर्थ है ‘A, B का पुत्र है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A – B’ का अर्थ है ‘A, B की पत्नी है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A × B’ का अर्थ है ‘A, B का भाई है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘A ÷ B’ का अर्थ है ‘A, B की माता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि ‘U ÷ V × W – X + Y’ है, तो U का Y से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्र की पत्नी की माता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्री के पति की माता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई की पत्नी की माता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्र की पत्नी की बहन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए व्यंजक ‘U ÷ V × W – X + Y’ से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘X + Y’ → X, Y का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘W – X’ → W, X की पत्नी है (Y के पुत्र की पत्नी)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ‘V × W’ → V, W का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. ‘U ÷ V’ → U, V की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि V, W का भाई है, इसलिए U, W की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, U, Y के पुत्र की पत्नी की माता है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वह समुच्चय चुनिए जिसमें संख्याएँ उसी प्रकार संबंधित हैं जैसे निम्नलिखित समुच्चयों की संख्याएँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: संख्याओं को उनके घटकीय अंकों में तोड़े बिना, पूर्ण संख्याओं पर संक्रियाएँ की जानी चाहिए। उदाहरण के लिए 13 - 13 पर संक्रियाएँ जैसे कि 13 को जोड़ना/घटाना/गुणा करना आदि किया जा सकता है। 13 को 1 और 3 में तोड़ना और फिर 1 और 3 पर गणितीय संक्रियाएँ करने की अनुमति नहीं है।)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(15, 6, 189)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(11, 4, 105)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 8, 90)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 7, 135)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(13, 5, 144)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(16, 9, 165)</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अनुसरित तर्क इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image062.png\" width=\"7\" height=\"23\" alt style=\"vertical-align:middle\" ><span>पहली संख्या</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image235.png\" width=\"32\" height=\"28\" alt style=\"vertical-align:middle\" ><span>दूसरी संख्या</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image236.png\" width=\"14\" height=\"51\" alt style=\"vertical-align:middle\" ><span>तीसरी संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(15, 6, 189) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image237.png\" width=\"69\" height=\"94\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(11, 4, 105) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image238.png\" width=\"69\" height=\"94\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, विकल्पों की जाँच करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प C, (13, 5, 144) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image239.png\" width=\"69\" height=\"94\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, (13, 5, 144) सही समुच्चय है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रतिरोध </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image138.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span> वाले एकसमान धात्विक तार को एकसमान रूप से खींचकर उसकी लंबाई दोगुनी कर दी जाती है। यदि तार के सिरों पर विभवांतर स्थिर रहता है, तो उसमें प्रवाहित होने वाली धारा हो जाएगी:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोगुनी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आधी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक-चौथाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार गुनी</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रतिरोध के सूत्र के अनुसार, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image240.png\" width=\"36\" height=\"56\" alt style=\"vertical-align:middle\" ><span> होता है। जब किसी तार को उसके आयतन (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image241.png\" width=\"27\" height=\"90\" alt style=\"vertical-align:middle\" ><span>) को स्थिर रखते हुए उसकी लंबाई दोगुनी (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image242.png\" width=\"31\" height=\"51\" alt style=\"vertical-align:middle\" ><span>) करने के लिए खींचा जाता है, तो उसका अनुप्रस्थ काट क्षेत्रफल आधा (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image243.png\" width=\"23\" height=\"60\" alt style=\"vertical-align:middle\" ><span>) हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, नया प्रतिरोध: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image244.png\" width=\"59\" height=\"157\" alt style=\"vertical-align:middle\" ><span> हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ओम के नियम के अनुसार, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image245.png\" width=\"25\" height=\"56\" alt style=\"vertical-align:middle\" ><span> होता है। यदि वोल्टेज </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image246.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span> स्थिर रहता है, तो नई धारा: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image247.png\" width=\"32\" height=\"164\" alt style=\"vertical-align:middle\" ><span> (मूल धारा की एक-चौथाई) होगी।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात मित्र, J, K, L, M, N, O और P, एक सीधी पंक्ति में उत्तर के सम्मुख बैठे हैं। K और M के बीच केवल पाँच लोग बैठे हैं। L, M के बाईं ओर दूसरे स्थान पर बैठा है। N, J और L दोनों का निकटतम पड़ोसी है। O, L के ठीक दाईं ओर बैठा है। P और L के बीच कितने लोग बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. चूँकि पंक्ति में सात लोग हैं और K तथा M के बीच केवल पाँच लोग बैठे हैं, इसलिए K और M दोनों छोरों पर होंगे।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. L, M के बाईं ओर दूसरे स्थान पर बैठा है, इसका अर्थ है कि M दाएँ छोर (स्थान 7) पर है और K बाएँ छोर (स्थान 1) पर है। अतः L स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. N, J और L दोनों का निकटतम पड़ोसी है। चूँकि स्थान 7 पर M है, इसलिए N स्थान 6 पर नहीं हो सकता। अतः N स्थान 4 पर है और J स्थान 3 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. O, L के ठीक दाईं ओर बैठा है, इसलिए O स्थान 6 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. शेष बचा स्थान 2, P द्वारा लिया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएँ से दाएँ बैठने का क्रम है: </span><span style=\"font-weight:bold\">K, P, J, N, L, O, M</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P स्थान 2 पर है और L स्थान 5 पर है। उनके बीच J और N (2 लोग) बैठे हैं। अतः सही उत्तर </span><span style=\"font-weight:bold\">दो</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि 4 पुरुष और 3 लड़के किसी कार्य को 6 दिनों में कर सकते हैं, जबकि 2 पुरुष और 4 लड़के उसी कार्य को 9 दिनों में कर सकते हैं, तो 1 पुरुष और 2 लड़के उसी कार्य को पूरा करने में कितने दिन लेंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 दिन</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना 1 पुरुष और 1 लड़के का 1 दिन का कार्य क्रमशः </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image248.png\" width=\"14\" height=\"23\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1792767125570_image249.png\" width=\"11\" height=\"23\" alt style=\"vertical-align:middle\" ><span> है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों स्थितियों में कुल कार्य को बराबर
