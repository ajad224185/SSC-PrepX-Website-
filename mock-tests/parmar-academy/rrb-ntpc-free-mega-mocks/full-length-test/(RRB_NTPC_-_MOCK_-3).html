<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5.) RRB NTPC - MOCK -3 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    correctly describes the Mukh Mantri Sehat Yojana launched by the    Punjab government?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It covers treatment exclusively in    government hospitals without private sector participation.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is applicable only to senior    citizens and government employees.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It provides free cashless medical    treatment up to 10 lakh per family across Punjab.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is limited only to below poverty    line families with an annual cover of ₹5 lakh.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Punjab government launched     the </span><span style=\"font-family:'Nirmala UI'\"><b>Mukh Mantri     Sehat Yojana,</b></span><span style=\"font-family:'Nirmala UI'\"> a     universal health insurance scheme offering cashless treatment up     to 10 lakh per family.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7fd8c8812deee0e2.png\" width=\"24\" height=\"24\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Mukh Mantri Sehat Yojana     provides free cashless healthcare coverage of up to </span><span style=\"font-family:'Nirmala UI'\"><b>10     lakh per family.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The scheme covers all </span><span style=\"font-family:'Nirmala UI'\"><b>65     lakh families in Punjab,</b></span><span style=\"font-family:'Nirmala UI'\"> benefiting     nearly three crore residents.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Eligibility requires possession of     an Aadhaar card and voter card, making it a universal scheme.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">More than </span><span style=\"font-family:'Nirmala UI'\"><b>2,500     medical</b></span><span style=\"font-family:'Nirmala UI'\"> procedures     are covered across government and empanelled private hospitals.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Aims to ensure free and quality     healthcare for every resident of the state.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Focuses on a</span><span style=\"font-family:'Nirmala UI'\"><b>ffordability,     accessibility and quality of care.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>It    provides free cashless medical treatment up to ₹10 lakh per    family across Punjab.</b></span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which edition of National Voters'    Day was celebrated on 25 January 2026 to commemorate the    foundation day of the Election Commission of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span><sup><span style=\"font-family:'Nirmala UI'\">th</span></sup></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15</span><sup><span style=\"font-family:'Nirmala UI'\">th</span></sup></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16</span><sup><span style=\"font-family:'Nirmala UI'\">th</span></sup></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span><sup><span style=\"font-family:'Nirmala UI'\">th</span></sup></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">National Voters' Day is celebrated     every year on </span><span style=\"font-family:'Nirmala UI'\"><b>25th     January</b></span><span style=\"font-family:'Nirmala UI'\"> to mark     the foundation day of the Election Commission of India (ECI),     which was established o</span><span style=\"font-family:'Nirmala UI'\"><b>n     25th January 1950</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>16th     edition</b></span><span style=\"font-family:'Nirmala UI'\"> of     National Voters' Day was observed on </span><span style=\"font-family:'Nirmala UI'\"><b>25th     January 2026,</b></span><span style=\"font-family:'Nirmala UI'\"> commemorating     the </span><span style=\"font-family:'Nirmala UI'\"><b>75th     anniversary </b></span><span style=\"font-family:'Nirmala UI'\">of the     Election Commission of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The theme for National Voters' Day     often highlights voter awareness and inclusive participation in     democratic processes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">For the</span><span style=\"font-family:'Nirmala UI'\"><b> 16th     edition, the focus was likely on strengthening democratic values.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_16befd5dd6ccef0a.png\" width=\"20\" height=\"19\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Election Commission of India    (ECI):</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The ECI is an autonomous     constitutional authority responsible for administering elections     to Parliament, State Legislatures, and the offices of the     President and Vice President in India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It was established on </span><span style=\"font-family:'Nirmala UI'\"><b>25th     January 1950</b></span><span style=\"font-family:'Nirmala UI'\"> under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     324</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Commission consists of     the </span><span style=\"font-family:'Nirmala UI'\"><b>Chief Election     Commissioner </b></span><span style=\"font-family:'Nirmala UI'\">and </span><span style=\"font-family:'Nirmala UI'\"><b>two     Election Commissioners,</b></span><span style=\"font-family:'Nirmala UI'\"> who     are appointed by the </span><span style=\"font-family:'Nirmala UI'\"><b>President     of India.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">ECI plays a crucial role in     ensuring free and fair elections in India.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><u><b>Historical Milestones:</b></u></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">National Voters' Day was first     celebrated in </span><span style=\"font-family:'Nirmala UI'\"><b>2011</b></span><span style=\"font-family:'Nirmala UI'\"> to     commemorate the foundation day of the Election Commission of     India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It has since become an important     annual event to promote voter awareness and democratic     participation.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is</span><span style=\"font-family:'Nirmala UI'\"><b> 16th.</b></span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the correct statements    regarding the Foundation Day of </span><span style=\"font-family:'Nirmala UI'\"><b>Manipur,    Meghalaya and Tripura:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Statement 1:</b></span><span style=\"font-family:'Nirmala UI'\"> Manipur,    Meghalaya and Tripura attained full statehood on January 21, 1972    under the North Eastern Region (Re-organisation) Act, 1971.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Statement 2:</b></span><span style=\"font-family:'Nirmala UI'\"> Manipur    and Tripura were Union Territories before becoming states, while    Meghalaya had autonomous status within Assam under the Sixth    Schedule of the Indian Constitution.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Statement 3:</b></span><span style=\"font-family:'Nirmala UI'\"> Meghalaya    was a Union Territory from 1949 to 1972 before attaining    statehood.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Which    of the statements given above are correct?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and  3 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Statement 1 is correct </b></span><span style=\"font-family:'Nirmala UI'\">as     Manipur, Meghalaya and Tripura became full-fledged states on     January 21, 1972 under the North Eastern Region (Re-organisation)     Act, 1971.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Statement 2 is correct</b></span><span style=\"font-family:'Nirmala UI'\"> as     Manipur and Tripura were Union Territories, while Meghalaya had     autonomous status within Assam under the Sixth Schedule of the     Constitution.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Statement 3 is     incorrect</b></span><span style=\"font-family:'Nirmala UI'\"> because     Meghalaya was not a Union Territory; it had autonomous status     within Assam before attaining statehood.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Manipur, Meghalaya and Tripura     celebrated their </span><span style=\"font-family:'Nirmala UI'\"><b>54th     Foundation Day on January 21, 2026.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7fd8c8812deee0e2.png\" width=\"24\" height=\"24\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The three Northeastern states     attained </span><span style=\"font-family:'Nirmala UI'\"><b>statehood     on January 21, 1972</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>North     Eastern Region (Re-organisation) Act, 1971</b></span><span style=\"font-family:'Nirmala UI'\"> enabled     their transition to full statehood.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Manipur and Tripura were Union     Territories before becoming states.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Integration into India:</b></span><span style=\"font-family:'Nirmala UI'\"> Manipur     and Tripura were integrated into India in October 1949.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Autonomous State of     Meghalaya: </b></span><span style=\"font-family:'Nirmala UI'\">Created     in 1969 under the Assam Reorganisation (Meghalaya) Act, 1969.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Foundation Day Significance</b></span><span style=\"font-family:'Nirmala UI'\">:     Marks the elevation of regions from Union Territory or autonomous     status to full statehood.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Statement    1 and Statement 2 only.</b></span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Former India defender Ilyas Pasha,    who recently passed away, won the Durand Cup four times during    which years?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1987, 1988, 1990 and 1992</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1991, 1994, 1996 and 1998</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1990, 1991, 1993 and 1995</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1992, 1993, 1994 and 1996</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Former India defender Ilyas Pasha     passed away at the age of </span><span style=\"font-family:'Nirmala UI'\"><b>61</b></span><span style=\"font-family:'Nirmala UI'\">,     leaving behind a legacy marked by multiple domestic and     international football titles.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_17cd8aaefc1e4f46.png\" width=\"21\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ilyas Pasha</b></span><span style=\"font-family:'Nirmala UI'\"> won     the </span><span style=\"font-family:'Nirmala UI'\"><b>Durand Cup four     times</b></span><span style=\"font-family:'Nirmala UI'\"> in the     years </span><span style=\"font-family:'Nirmala UI'\"><b>1990, 1991,     1993 and 1995.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">All four Durand Cup titles were     won while he represented </span><span style=\"font-family:'Nirmala UI'\"><b>East     Bengal Football Club.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Durand Cup victories came     during East Bengal's dominant phase in Indian football in the     1990s.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Pasha played as a </span><span style=\"font-family:'Nirmala UI'\"><b>right     wing-back</b></span><span style=\"font-family:'Nirmala UI'\"> and was     known for disciplined defending and tactical awareness.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Durand Cup One of the oldest     football tournaments in the world, established in </span><span style=\"font-family:'Nirmala UI'\"><b>1888.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Played annually in India with     participation from top domestic and invited teams.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>1990,    1991, 1993 and 1995.</b></span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The first-ever Investors’ Meet on    fisheries and aquaculture opportunities was hosted at which    location?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Andaman Island</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Daman &amp; Diu</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bangaram Island</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kochi</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1. The Department of Fisheries    under the Ministry of Fisheries, Animal Husbandry &amp; Dairying    collaborated with the Lakshadweep Administration to host the    first-ever Investors’ Meet on fisheries and aquaculture    opportunities at </span><span style=\"font-family:'Nirmala UI'\"><b>Bangaram    Island</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><br> 2.    The initiative aligns with the </span><span style=\"font-family:'Nirmala UI'\"><b>Pradhan    Mantri Matsya Sampada Yojana (PMMSY)< the Economic     Survey 2025-26 in Parliament.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_93859ba3b3f09532.png\" width=\"20\" height=\"20\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Despite rising foodgrain output,     horticulture, accounting for about 33% of agricultural GVA, has     emerged as a key driver of agricultural growth.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">In 2024-25, horticulture     production reached </span><span style=\"font-family:'Nirmala UI'\"><b>362.08     million tonnes (MT).</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This production surpassed the     estimated food grain production of </span><span style=\"font-family:'Nirmala UI'\"><b>357.73     MT (3,577.3 LMT)</b></span><span style=\"font-family:'Nirmala UI'\"> for     the same period.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_45acb7b186f9fdf9.png\" width=\"18\" height=\"18\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Other    Agricultural Sectors (Growth Trends)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Livestock</b></span><span style=\"font-family:'Nirmala UI'\">:     Between FY15 and FY24, the sector witnessed strong growth with     GVA rising by nearly 195 per cent.</span></p te/bulk_uploader_images/1772907327398_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Grass </b></span><span style=\"font-family:'Nirmala UI'\">contains     xylem tissues thus it conducts water.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ipomoea</b></span><span style=\"font-family:'Nirmala UI'\"> contains     xylem tissues thus it conducts water.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Paphiopedilum</b></span><span style=\"font-family:'Nirmala UI'\"> contains     xylem tissues thus it conducts water.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Funaria</b></span><span style=\"font-family:'Nirmala UI'\"> belongs     to the plant Kingdom, these are the amphibians.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">They have no specialized tissue     for conduction of water and they reproduce by spores formation     method.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Funaria.</b></span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">____is any food constituent or    group of food constituents of the same general composition that    aids in the support of animal life.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Enzyme</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Protein</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Minerals</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nutrient</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><u><b>Nutrient: </b></u></span><span style=\"font-family:'Nirmala UI'\">It     is defined as any food constituent or group of food constituents     of the same general composition that aids in the support of     animal life.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">There are</span><span style=\"font-family:'Nirmala UI'\"><b> six     classes </b></span><span style=\"font-family:'Nirmala UI'\">of     nutrients that are essential to every living animal for survival</span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Water</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Protein</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Carbohydrates</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Fats/Lipids</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Vitamins</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Minerals</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the Correct Answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Nutrient.</b></span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The part of human ear which    converts sound vibrations into electrical signals is _____ .</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tympanic membrane</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hammer</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Stirrup</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cochlea</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Cochlea is </span><span style=\"font-family:'Nirmala UI'\"><b>hollow</b></span><span style=\"font-family:'Nirmala UI'\">,     which is in (</span><span style=\"font-family:'Nirmala UI'\"><b>Spiral     shaped</b></span><span style=\"font-family:'Nirmala UI'\">) bone found in     the inner part of the ear that plays an important role in the     senses of hearing and participates in the process of listening to     Auditory Transduction in the human ear.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound waves are Transduced into     the Electrical impulse that can be interpreted by the Brain as     the individual frequencies of sound.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The spiral shape structure of the     Cochlea allows differentiating the frequencies to stimulate     specific areas along the spiral.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This result visualizes     the </span><span style=\"font-family:'Nirmala UI'\"><b>Tonotopic     map,</b></span><span style=\"font-family:'Nirmala UI'\"> which helps     people perceive various frequencies of sound in the ear.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Cochlea is stimulated by the     vibrations carried within a fluid-like a thing known as     (</span><span style=\"font-family:'Nirmala UI'\"><b>Endolymph</b></span><span style=\"font-family:'Nirmala UI'\">)     that is found in the </span><span style=\"font-family:'Nirmala UI'\"><b>Cochlear     Duct</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The vibrations of the sound are     then converted into the electrical impulses in the Cochlear Duct     through the Mechanical stimulation of hair cells within a special     structure known as the Organ of Corti.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">These Nerve Impulses are carried     by the (</span><span style=\"font-family:'Nirmala UI'\"><b>Vestibulocochlear     Nerve</b></span><span style=\"font-family:'Nirmala UI'\">) from the Cochlea     to the Brain cells for interpretation of the sound</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Image of the Human Ear (Cochlea    Part):</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_cf9d9f43c5cdbc55.jpg\" width=\"371\" height=\"457\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_4ac2176c1e29996d.png\" width=\"19\" height=\"19\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Si unit of intensity of sound     - </span><span style=\"font-family:'Nirmala UI'\"><b>Decibel (db).</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Study of sound - </span><span style=\"font-family:'Nirmala UI'\"><b>Acoustics</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Speed of sound is maximum in     solids and minimum in gases.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound waves cannot travel through     a vacuum.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Speed of sound in air - </span><span style=\"font-family:'Nirmala UI'\"><b>343     m/s.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Speed of sound in water - </span><span style=\"font-family:'Nirmala UI'\"><b>1483     m/s.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Speed of sound in iron - </span><span style=\"font-family:'Nirmala UI'\"><b>5130     m/s.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The organ in human beings which     helps to produce sound - </span><span style=\"font-family:'Nirmala UI'\"><b>Larynx.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Cochlea.</b></span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following organic    compound coagulates the protoplasm in the human body?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Methanal</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Methanoic Acid</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ethanol</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Propanone</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_4ac2176c1e29996d.png\" width=\"19\" height=\"19\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The term '</span><span style=\"font-family:'Nirmala UI'\"><b>Protoplasm</b></span><span style=\"font-family:'Nirmala UI'\">'     is given by </span><span style=\"font-family:'Nirmala UI'\"><b>Purkinje     in 1839.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is the living Content of a Cell     that is Surrounded by a Plasma Membrane.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is basically Composed of a     Mixture of Small Molecules such as </span><span style=\"font-family:'Nirmala UI'\"><b>Nucleic     Acids, Proteins, and Lipids.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Coagulation of protoplasm is the     precipitation of cytoplasm and other cell organelles.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This happens when we consume     methanol.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The methanol is oxidised to form     methanal by our liver and this methanal causes coagulation of     protoplasm.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Methanal.</b></span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is pH of Lemon Juice?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5.5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3.8</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6.6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2.5</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>pH</b></span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Drug which reduce fever is known    as___</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Barbiturates</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Antipyretic</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Antibiotic</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Antiseptic</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_93859ba3b3f09532.png\" width=\"20\" height=\"20\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Antipyretic is a drug that reduces     fever.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Antipyretics cause the     hypothalamus to override a prostaglandin-induced increase in     temperature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The body then works to lower the     temperature, which results in a reduction in fever.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_16befd5dd6ccef0a.png\" width=\"20\" height=\"19\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Barbiturates</b></span><span style=\"font-family:'Nirmala UI'\"> are     a type of central nervous system (CNS) depressant used to treat     insomnia, seizures, and headaches.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Antiseptic</b></span><span style=\"font-family:'Nirmala UI'\"> slows     or stops the growth of micro-organisms on external surfaces of     the body and helps to prevent infections.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Antibiotics</b></span><span style=\"font-family:'Nirmala UI'\"> include     a range of powerful drugs that kill bacteria or slow their     growth.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">They treat bacterial infections</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Antipyretic</b></span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Common name of the compound    CaOCl</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\"> is______</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">bleaching powder</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">gypsum</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">baking soda</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">washing soda</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Bleaching powder:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The chlorine produced on passing     electricity through brine solution undergoes a reaction with dry     slaked lime [Ca (OH)</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\">]     to produce Bleaching powder.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The reaction is as follows:     Ca(OH)</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\">+     Cl</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub>→<span style=\"font-family:'Nirmala UI'\">     CaOCl</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\">+     H</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\">O     where, Ca(OH)</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\"> is </span><span style=\"font-family:'Nirmala UI'\"><b>calcium     hydroxide or dry-slaked lime.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Cl</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\">     is chlorine gas</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">CaOCl</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\"> is     a </span><span style=\"font-family:'Nirmala UI'\"><b>bleaching powder     or calcioxychlorate.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_9506300eba535bbf.png\" width=\"22\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Bleaching powder is used for     several purposes:</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">As a bleaching agent for bleaching     cotton and linen in the textile industry</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">To bleach wood pulp in the paper     manufacturing industry.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">To bleach washed clothes in the     laundry.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">As an oxidizing agent in many     chemical industries.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">To disinfect drinking water and     make it germ-free.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>bleaching    powder.</b></span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following can exist in    solid, liquid and gaseous forms?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Metalloids</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Inert elements</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Metals</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Non-metals</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_756a6939c63dc606.png\" width=\"21\" height=\"20\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Non-Metals     can exist in solid, liquid and gaseous forms.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Physical     Properties of non-metals:</b></span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Density:</b></span><span style=\"font-family:'Nirmala UI'\"> Non-metals     have low densities</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lustre:</b></span><span style=\"font-family:'Nirmala UI'\"> Non-metals     do not have lustre, except diamond and iodine crystals.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Brittleness: </b></span><span style=\"font-family:'Nirmala UI'\">Solid     non-metals are brittle, and some non-metals are soft. Diamond (an     allotrope of carbon) is an exception, which is the hardest     natural substance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ductility     &amp; Malleability:</b></span><span style=\"font-family:'Nirmala UI'\"> Non-metals     are neither ductile nor malleable.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conduction     of Heat &amp; Electricity: </b></span><span style=\"font-family:'Nirmala UI'\">Non-metals     are bad conductors of heat and electricity except graphite.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Physical     State: </b></span><span style=\"font-family:'Nirmala UI'\">At ordinary     temperature non-metals occur as solids, liquids, and gases.</span></p>    </li></ol>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">For     example, </span><span style=\"font-family:'Nirmala UI'\"><b>Solids</b></span><span style=\"font-family:'Nirmala UI'\">:     Carbon, Sulphur, Phosphorus, </span><span style=\"font-family:'Nirmala UI'\"><b>Liquids:</b></span><span style=\"font-family:'Nirmala UI'\"> Bromine<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Gases: </b></span><span style=\"font-family:'Nirmala UI'\">Hydrogen,     Nitrogen</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Non-Metals</b></span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Large amplitude of sound vibrations    will produce______</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Feeble sound</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gruff sound</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Loud sound</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shrill sound</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7fd8c8812deee0e2.png\" width=\"24\" height=\"24\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound travels as a longitudinal     wave.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">A sound wave traveling through air     is indeed a longitudinal wave with compressions and rarefactions.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The study of sound is called     acoustics.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The large amplitude of sound     vibrations will produce a loud sound.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The intensity of sound is     identified by loudness.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The loudness of sound is     proportional to the square of the amplitude of the vibration     producing the sound</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">If the amplitude of vibration is     large, then sound produced is loud.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">If the amplitude is small, the     sound produced is feeble.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The loudness of sound depends on     the amplitude of vibration of sound-producing objects.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound is a mechanical wave and     needs a material medium like air, water, steel.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The speed of sound depends on the     properties of the medium through which it travels.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound cannot travel in a </span><span style=\"font-family:'Nirmala UI'\"><b>vacuum.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sound travels faster in </span><span style=\"font-family:'Nirmala UI'\"><b>solids.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The audible range of an average     human is </span><span style=\"font-family:'Nirmala UI'\"><b>20 Hz - 20     kHz.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Speed of sound in air = </span><span style=\"font-family:'Nirmala UI'\"><b>343     m/s.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Hertz(Hz)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the unit of the frequency of sound.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Decibels(dB)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the unit of Intensity of sound.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Loud    sound.</b></span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is NOT true    about nuclear fusion?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It produces much more energy than    nuclear fission</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The process is used for making    nuclear bomb</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is the source of energy in the    stars.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Electricity production through this    process is commercially less viable than nuclear fission.</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">A nuclear bomb uses either uranium     or plutonium and relies on fission, a nuclear reaction in which a     nucleus or an atom breaks into two pieces.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The by-products of nuclear fission     include free neutrons, photons usually in the form of gamma rays,     and other atomic fragments such as beta particles and alpha     particles.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Nuclear fission produces energy     for nuclear power and drives atomic weapon explosions.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Nuclear fusion is a reaction in     which two or more atomic nuclei are combined to form one or more     different atomic nuclei and subatomic particles (neutrons or     protons).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">An example of nuclear fusion is     the process of four hydrogens coming together to form helium.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">A hydrogen bomb is based on the     principle of uncontrollable nuclear fusion.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is T</span><span style=\"font-family:'Nirmala UI'\"><b>he    process is used for making nuclear bomb</b></span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A moving coil galvanometer can be    converted into a ammeter by connecting to the moving coil    galvanometer________ .</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A low resistance in series</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A high resistance in parallel</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A low resistance in parallel</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A high resistance in series.</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>CONCEPT:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">A galvanometer can be converted     into an ammeter by </span><span style=\"font-family:'Nirmala UI'\"><b>connecting     a shunt resistance in parallel to it</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The shunt resistance should have     v</span><span style=\"font-family:'Nirmala UI'\"><b>ery low resistance</b></span><span style=\"font-family:'Nirmala UI'\">.     So, the ammeter (the parallel combination of galvanometer and     shunt resistance) will have low resistance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">To convert a galvanometer into an     ammeter of current rating 'I', a small resistance 'S' (shunt     resistance) is connected in parallel across the galvanometer.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>EXPLANATION:</b></span><span style=\"font-family:'Nirmala UI'\"><br> A    moving coil galvanometer can be converted into a ammeter by    connecting a low resistance in parallel to the moving coil    galvanometer. So option 3 is correct.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following does not    involve Total Internal Reflection?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mirages in Deserts</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kaleidoscope</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Transmission of light rays in    Optical Fibres</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Diamond Sparkle</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_16befd5dd6ccef0a.png\" width=\"20\" height=\"19\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Total Internal Reflection: </b></span><span style=\"font-family:'Nirmala UI'\">It     is the phenomenon that occurs when the light rays travel from a     more optically denser medium to a less optically denser medium.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><u><b>Following are the two    conditions of total internal reflection:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The light ray moves from a more     dense medium to a less dense medium.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The angle of incidence must be     greater than the critical angle</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">      <span style=\"font-family:'Nirmala UI'\"><b>Examples of Total Internal      Reflection</b></span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>1. Sparkling of diamonds</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>2. Transmission of light in    optical fibres</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-famil
