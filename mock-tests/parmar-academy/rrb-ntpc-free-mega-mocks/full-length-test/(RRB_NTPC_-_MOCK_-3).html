y:'Nirmala UI'\"><b>3. Mirage formation in deserts</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The phenomenon is popularly known    as the 22-degree circular halo of the sun or occasionally the Moon    (also called a moon ring or winter halo), occurs when the sun's or    moon's rays get deflected/refracted through the hexagonal ice    crystals present in cirrus clouds.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Kaleidoscope    does not involve total internal reflection</b></span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The force of attraction between two    objects is called the_____</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">electromagnetic force</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">centrifugal force</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">gravitational force</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">centripetal force</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_17cd8aaefc1e4f46.png\" width=\"21\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Gravitational force:</b></span><span style=\"font-family:'Nirmala UI'\"> Everybody     attracts another body by a force i.e force of attraction between     two objects is called the force of gravitation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Centripetal force</b></span><span style=\"font-family:'Nirmala UI'\"> is     the force acting towards the center of the circular path.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Centrifugal force </b></span><span style=\"font-family:'Nirmala UI'\">acts     in a direction pointing away from the center of the circular     path.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Electromagnetic force:</b></span><span style=\"font-family:'Nirmala UI'\"> It     is a type of force that occurs between electrically charged     particles.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>gravitational    force</b></span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who was the author of    'Buddhacharita'?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Harishena</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ashvaghosh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vasumitra</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalidas</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Ashvaghosh was a philosopher and     poet who is considered India's greatest poet before Kalidasa (5th     century) and the father of Sanskrit drama.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He popularized the style of     Sanskrit poetry known as kavya.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Ashvaghosh adorned the court of     Kanishka who was considered the greatest Kushana king.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Though Pali literature was popular     in Buddhism, Ashvaghosh wrote in classical Sanskrit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Ashvaghosh spoke at length on     Mahayana (Greater Vehicle) Buddhist doctrine at the </span><span style=\"font-family:'Nirmala UI'\"><b>Fourth     Buddhist Council</b></span><span style=\"font-family:'Nirmala UI'\">, which     he helped to organize.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Buddhacharita, an epic on the </span><span style=\"font-family:'Nirmala UI'\"><b>life     Buddha</b></span><span style=\"font-family:'Nirmala UI'\">, was written by     Ashvaghosh.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He also wrote </span><span style=\"font-family:'Nirmala UI'\"><b>Saundarananda</b></span><span style=\"font-family:'Nirmala UI'\">,     with the theme of conversion of Nanda, Buddha's half brother, so     that he might reach salvation.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    we can conclude that </span><span style=\"font-family:'Nirmala UI'\"><b>Ashvaghosh    was the author of 'Buddhacharita'.</b></span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Malavikagnimitra, a drama of the    5th century CE, was written by____</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pingala</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalidasa</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Harisena</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bhavabhuti</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Kalidasa, a prominent figure in     classical Sanskrit literature, authored the renowned play     \"</span><span style=\"font-family:'Nirmala UI'\"><b>Mälavik</b></span><b>ā</b><span style=\"font-family:'Nirmala UI'\"><b>gnimitram\"</b></span><span style=\"font-family:'Nirmala UI'\"> during     the 5th century CE</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Set in the backdrop of Pushyamitra     Shunga's reign, the five-act drama revolves around King     Agnimitra's affection for Malavika, the maid of his chief queen.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Its captivating storyline, the     play is also esteemed as a comprehensive discourse on dramatic     art, featuring intricate details such as the Rajasuya sacrifice     and insightful theories on music and acting.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Kalidasa himself, a luminary of     the Gupta era, is best known for his contributions to Sanskrit     literature, which primarily draw from Hindu Puranic narratives     and philosophical themes.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is</span><span style=\"font-family:'Nirmala UI'\"><b> Kalidasa.</b></span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sahitya Akademi' is India's highest    honour given in the field of_____</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Agriculture</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Literature</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Business</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Education</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>'Sahitya Akademi'</b></span><span style=\"font-family:'Nirmala UI'\"> is     India's highest honour given in the field of Literature.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_93859ba3b3f09532.png\" width=\"20\" height=\"20\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The awards were instituted     in </span><span style=\"font-family:'Nirmala UI'\"><b>1954.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The first Awards were given     in </span><span style=\"font-family:'Nirmala UI'\"><b>1955.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Sahitya     Akademi Award </b></span><span style=\"font-family:'Nirmala UI'\">is     given to the mist outstanding books of literary merit published     in any of the major Indian languages recognised by the Akademi.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Sahitya Akademi functions as     an autonomous organisation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The award is given in </span><span style=\"font-family:'Nirmala UI'\"><b>24     Indian languages.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The plaque which is awarded by the     Akademi was designed by the </span><span style=\"font-family:'Nirmala UI'\"><b>Indian     film-maker Satyajit Ray</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">RK Narayan was the first winner     for his novel The Guide.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Makhanlal Chaturvedi was the first     Hindi writer to win the award in 1955 for his work \"Him     Tarangini\" (Poetry)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is</span><span style=\"font-family:'Nirmala UI'\"><b> Literature.</b></span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following was the    first independent Gupta king to hold the title of Maharajadhiraj?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ghatotkach Gupta</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Srigupta I</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ramagupta</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandragupta I</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Chandragupta I was the first     independent Gupta king to hold the title of </span><span style=\"font-family:'Nirmala UI'\"><b>Maharajadhiraj,</b></span><span style=\"font-family:'Nirmala UI'\"> which     means \"</span><span style=\"font-family:'Nirmala UI'\"><b>King of     Kings\".</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">His reign marked the beginning of     the Gupta Empire's expansion, which is often referred to as     the</span><span style=\"font-family:'Nirmala UI'\"><b> Golden Age</b></span><span style=\"font-family:'Nirmala UI'\"> of     India due to significant achievements in arts, science, and     political administration.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Chandragupta I ruled from </span><span style=\"font-family:'Nirmala UI'\"><b>320     to 335</b></span><span style=\"font-family:'Nirmala UI'\"> CE,     succeeding his father, </span><span style=\"font-family:'Nirmala UI'\"><b>Ghatotkach     Gupta.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He strengthened his position and     extended his empire through matrimonial alliances, notably by     marrying Kumaradevi, a Lichchhavi princess.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_9506300eba535bbf.png\" width=\"22\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Gupta    Empire</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Gupta Empire was an ancient     Indian empire that existed from approximately </span><span style=\"font-family:'Nirmala UI'\"><b>320     to 550 CE</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is known for a period of     prosperity and cultural flourishing, particularly in fields such     as literature, architecture, and sciences.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The period of Gupta rule is often     referred to as the Golden Age of India.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Chandragupta I's Contributions</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Chandragupta I's reign laid the     foundation for the future expansion and consolidation of the     Gupta Empire.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">His strategic matrimonial     alliances bolstered the empire's political strength and     stability.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Successors- </span><span style=\"font-family:'Nirmala UI'\"><b>Chandragupta     I</b></span><span style=\"font-family:'Nirmala UI'\"> was succeeded by     his son, </span><span style=\"font-family:'Nirmala UI'\"><b>Samudragupta,</b></span><span style=\"font-family:'Nirmala UI'\"> who     expanded the empire through military conquests.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Samudragupta is often considered     one of the greatest rulers of the Gupta dynasty</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Chandragupta    I</b></span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the Battle of Khatoli (1517)    Rana Sanga of Mewar defeated Sultan of Delhi_____ Lodhi and    imprisoned him and then released him after collecting ransom.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bahlul Khan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Qutb-ud-din</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sikandar</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ibrahim</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">In the</span><span style=\"font-family:'Nirmala UI'\"><b> Battle     of Khatoli (1517)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Rana     Sanga</b></span><span style=\"font-family:'Nirmala UI'\"> of Mewar     defeated the </span><span style=\"font-family:'Nirmala UI'\"><b>Sultan     of Delhi, Ibrahim Lodhi</b></span><span style=\"font-family:'Nirmala UI'\"> and     imprisoned him and then released him after collecting ransom.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Ibrahim Lodhi (1517 AD-1526 AD):</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He was the last ruler of the Lodhi     dynasty and the last sultan of Delhi.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He was the son of Sikandar Lodhi.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Daulat Khan Lodhi, the Governor of     Punjab, invited Babur to overthrow Ibrahim.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He captured Gwalior and was     defeated by Rana Sanga of Mewar.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He was defeated and killed at the     hands of Babur in the First Battle of Panipat in 1526 AD.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_4d35d243d6f5c885.png\" width=\"21\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Sisodia ruler of </span><span style=\"font-family:'Nirmala UI'\"><b>Mewar     (1433 AD-1468 AD):</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Rana Kumbha</b></span><span style=\"font-family:'Nirmala UI'\"> was     a famous ruler of Mewar.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He defeated Mohammad Khilji and     erected the Tower of Victory Vilav-Stambha) in Chittor.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">His successors Rana Sangram Singh     (Rana Sanga) and Rana Pratap were also great kings of the Mewar     state.</span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Sikandar Lodh</b></span><span style=\"font-family:'Nirmala UI'\">i     established </span><span style=\"font-family:'Nirmala UI'\"><b>Agra     city in 1504.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He shifted his capital from </span><span style=\"font-family:'Nirmala UI'\"><b>Delhi     to Agra in 1506.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Slave Dynasty was established in     Northern India by Qutb-ud-Din Aibak, a Turkish Mamluk slave     general from Central Asia.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He became the ruler of an     independent kingdom that evolved into the Delhi Sultanate ruled     by the </span><span style=\"font-family:'Nirmala UI'\"><b>Mamluk     dynasty.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He constructed a Quwwat-ul-Islam     mosque in Delhi and Adhai Din Ka Jhonpra in Ajmer.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">He initiated the construction of     Qutb Minar which was completed by Iltutmish</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Ibrahim</b></span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which feature of India's    constitutional system becomes debatable with Membership of India    to Commonwealth?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Republic</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Democratic</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Secular</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Socialist</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">India being the Sovereign Republic     became debatable with the Membership of India in the     Commonwealth.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7fd8c8812deee0e2.png\" width=\"24\" height=\"24\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">Nehru initially rejected    dominion status through the </span><span style=\"font-family:'Nirmala UI'\"><b>Objectives    Resolution.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">Many expected India to leave    the Commonwealth after becoming independent.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">Later, Nehru saw political and    economic benefits in continuing membership.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">He emphasized that Commonwealth    membership would be voluntary.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">He clarified that it would not    affect India’s sovereignty or republican status.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\">Thus, India became a Republic    in </span><span style=\"font-family:'Nirmala UI'\"><b>1950 while    remaining in the Commonwealth</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Sharda Act is related to ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sharda River</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Police reforms</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Child Marriage</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dowry</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Child     Marriage Restraint Act, 1929 </b></span><span style=\"font-family:'Nirmala UI'\">was     also known as Sharda Act.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The act was passed on </span><span style=\"font-family:'Nirmala UI'\"><b>28     September 1929.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">As per the act, the age of     marriage for girls was fixed at </span><span style=\"font-family:'Nirmala UI'\"><b>14</b></span><span style=\"font-family:'Nirmala UI'\"> years     and for </span><span style=\"font-family:'Nirmala UI'\"><b>boys,</b></span><span style=\"font-family:'Nirmala UI'\"> it     was </span><span style=\"font-family:'Nirmala UI'\"><b>18 years.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Later through an amendment, it was     changed to </span><span style=\"font-family:'Nirmala UI'\"><b>18 for     girls </b></span><span style=\"font-family:'Nirmala UI'\">and </span><span style=\"font-family:'Nirmala UI'\"><b>21     for boys.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The name Sarda was derived from     its sponsor </span><span style=\"font-family:'Nirmala UI'\"><b>Harbilas     Sarda.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_4c82dc780f5421c4.png\" width=\"24\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Child Marriage Restraint Act     was the first social reform issue taken up by an organized     women's group in India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This group pressured many     politicians into supporting the act by picketing their     delegations, holding placards, and shouting slogans.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">They believed that the passing of     this act would show the world that India is serious about social     reforms.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Child    Marriage</b></span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Panchayati Raj Institutions in    India have been established following the_____ of the Constitution    Of India.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">42th Amendment Act</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">57th Amendment Act</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">86th amendment Act</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">73rd amendment Act</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_17cd8aaefc1e4f46.png\" width=\"21\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Panchayati Raj Institutions in     India have been established following the </span><span style=\"font-family:'Nirmala UI'\"><b>73rd     Amendment Act</b></span><span style=\"font-family:'Nirmala UI'\"> of     the Constitution of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This amendment was enacted     in </span><span style=\"font-family:'Nirmala UI'\"><b>1992</b></span><span style=\"font-family:'Nirmala UI'\"> and     came into effect on </span><span style=\"font-family:'Nirmala UI'\"><b>24th     April 1993.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>73rd     Amendment Act added Part IX</b></span><span style=\"font-family:'Nirmala UI'\"> to     the Constitution, titled \"The Panchayats\", and also     added the Eleventh Schedule which contains </span><span style=\"font-family:'Nirmala UI'\"><b>29     functional items</b></span><span style=\"font-family:'Nirmala UI'\"> that     panchayats are responsible for.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The amendment aimed to provide a     constitutional status to the Panchayati Raj institutions and     ensure a more decentralized form of governance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It mandates the establishment of     panchayats at the village, intermediate, and district levels.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7825f2be65c1d812.png\" width=\"19\" height=\"18\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Constitution of India was     adopted by the Constituent Assembly on 26th November 1949 and     came into effect on 26th January 1950.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It lays down the framework     defining fundamental political principles, establishes the     structure, procedures, powers, and duties of government     institutions, and sets out fundamental rights, directive     principles, and the duties of citizens.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Constitution of India is the     longest written constitution of any country in the world.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It declares India a </span><span style=\"font-family:'Nirmala UI'\"><b>sovereign,     socialist, secular, and democratic republic</b></span><span style=\"font-family:'Nirmala UI'\">,     assuring its citizens justice, equality, and liberty, and     endeavors to promote fraternity.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Seventh Schedule of the     Constitution contains three lists which delineate the subjects     under the Union, State, and Concurrent lists.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Amendments to the Constitution can     be made through a process outlined in </span><span style=\"font-family:'Nirmala UI'\"><b>Article     368</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the  correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>73rd    amendment Act</b></span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The groundwater stored between    layers of hard rock below the water table is called:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Glacier</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Geyser</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hot spring</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aquifer</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_93859ba3b3f09532.png\" width=\"20\" height=\"20\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The groundwater stored between     layers of hard rock below the water table is called </span><span style=\"font-family:'Nirmala UI'\"><b>aquifer.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">An aquifer is a saturated zone     beneath the water table.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is a body of porous rock or     sediment saturated with groundwater.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Groundwater enters an aquifer as     precipitation seeps through the soil.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It can move through the aquifer     and resurface through springs and wells.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">There are two general types of     aquifers: </span><span style=\"font-family:'Nirmala UI'\"><b>confined     and unconfined.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Confined aquifers</b></span><span style=\"font-family:'Nirmala UI'\"> have     a layer of impenetrable rock or clay above them, while unconfined     aquifers lie below a permeable layer of soil.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Aquifers are typically made up of     gravel, sand, sandstone, or fractured rock, like limestone.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Water can move through these     materials because they have large connected spaces that make them     permeable.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_4c82dc780f5421c4.png\" width=\"24\" height=\"23\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Groundwater resources: </b></span><span style=\"font-family:'Nirmala UI'\">It     is the water found underground in the cracks and spaces in </span><span style=\"font-family:'Nirmala UI'\"><b>soil,     sand, and rocks.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is stored in and moves slowly     through the geological formation of soil, sand, and rocks called     aquifers.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The total replenishable     groundwater resources in the country are about </span><span style=\"font-family:'Nirmala UI'\"><b>432     cubic km</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>aquifer.</b></span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is a coarse    grained igneous rock that contains quartz and feldspar?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Granite</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Marble</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Andesite</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Basalt</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Granite </b></span><span style=\"font-family:'Nirmala UI'\">is     is a coarse-grained igneous rock that contains quartz and     feldspar.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Granite is a coarse-grained,     light-colored, intrusive igneous rock that contains     mainly </span><span style=\"font-family:'Nirmala UI'\"><b>quartz,     feldspar, and mica minerals.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Granite is a light-colored igneous     rock with grains large enough to be visible with the unaided eye.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It forms from the slow     crystallization of magma below Earth's surface.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Granite is composed mainly     of </span><span style=\"font-family:'Nirmala UI'\"><b>quartz and     feldspar </b></span><span style=\"font-family:'Nirmala UI'\">with     minor amounts of </span><span style=\"font-family:'Nirmala UI'\"><b>mica,     amphiboles</b></span><span style=\"font-family:'Nirmala UI'\">, and </span><span style=\"font-family:'Nirmala UI'\"><b>other     minerals</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Major production of granite in raw     as well as processed form is generally from </span><span style=\"font-family:'Nirmala UI'\"><b>Andhra     Pradesh, Rajasthan, Karnataka, Tamil Nadu, and Gujarat.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Granite.</b></span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Where is the air pressure highest?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Moon</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sea Level</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Stratosphere</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exosphere</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Concept:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Atmospheric pressure</b></span><span style=\"font-family:'Nirmala UI'\">-The     weight of a column of air contained in a unit area from the mean     sea level to the top of the atmosphere is called </span><span style=\"font-family:'Nirmala UI'\"><b>atmospheric     pressure.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The atmospheric pressure is     expressed in units of </span><span style=\"font-family:'Nirmala UI'\"><b>millibar.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Air pressure is measured with the     help of a mercury barometer or the aneroid barometer.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><u><b>Explanation:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Air Pressure: </b></span><span style=\"font-family:'Nirmala UI'\">As     one goes from the surface of the earth to higher altitudes, the     atmosphere becomes less dense.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Places at a higher region or at     high altitudes have low atmospheric pressure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This causes a decrease in     atmospheric temperature and pressure with increasing altitude</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">In the lower atmosphere, the     pressure decreases rapidly with height, about 1 millibar for each     10 m increase in elevation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Places near sea level have the     highest air pressure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">At sea level, the standard     atmospheric pressure is </span><span style=\"font-family:'Nirmala UI'\"><b>1,013.2     millibar.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Hilly regions have the</span><span style=\"font-family:'Nirmala UI'\"><b> lowest     air pressure.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The atmosphere is divided     into </span><span style=\"font-family:'Nirmala UI'\"><b>Troposphere,     Stratosphere, Mesosphere, Thermosphere and Exosphere (from lowest     to highest altitude).</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Air pressure in the atmospheric     layers decreases as one moves upwards, the highest being in the     troposphere and lowest in the exosphere.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Thus, </span><span style=\"font-family:'Nirmala UI'\"><b>air     pressure is highest at sea level</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the shortcut key to open    the Open dialog box?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alt + F12</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tab + F12</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ctrl + F12</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shift + F1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ctrl + F12</b></span><span style=\"font-family:'Nirmala UI'\"> is     the shortcut key used to open the Open dialog box in most     applications, such as Microsoft Word.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The Open dialog box allows users     to browse through their files and folders to select a file to     open.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This shortcut helps in quickly     accessing files without navigating through menus, improving     productivity.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It is widely used in Microsoft     Office applications and is a part of common keyboard shortcuts     for file operations.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_7825f2be65c1d812.png\" width=\"19\" height=\"18\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Alt + F12:</b></span><span style=\"font-family:'Nirmala UI'\"> This     shortcut is not used to open the Open dialog box. In some     applications, it might perform a different action, such as     toggling tool settings or features.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Tab + F12:</b></span><span style=\"font-family:'Nirmala UI'\"> This     is an unconventional combination and does not have any predefined     function in most applications.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Shift + F12:</b></span><span style=\"font-family:'Nirmala UI'\"> In     Microsoft Word, Shift + F12 is used to save the current document.     It is equivalent to using the Save option in the File menu.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Other Important Shortcuts:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ctrl + N:</b></span><span style=\"font-family:'Nirmala UI'\"> Creates     a new document.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ctrl + O:</b></span><span style=\"font-family:'Nirmala UI'\"> Another     shortcut to open the Open dialog box.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Ctrl + S:</b></span><span style=\"font-family:'Nirmala UI'\"> Saves     the current document.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Ctrl    + F12</b></span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In__________the virus places an    identical copy of itself into other programs or into certain    system areas on the disk.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Propagation phase</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dormant phase</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Triggering phase</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Execution phase</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_6de0b7b16f9df427.png\" width=\"18\" height=\"18\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The propagation phase</b></span><span style=\"font-family:'Nirmala UI'\"> is     when a virus makes identical  copies of itself. This phase     involves inserting the copies into other programs or system     areas, such as </span><span style=\"font-family:'Nirmala UI'\"><b>directories     or specific files.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Viruses in this phase aim to     spread to as many systems or files as possible. The propagation     phase ensures the virus can replicate and remain active even if     the original infected file is removed.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_ed8d383cc172efb9.png\" width=\"23\" height=\"22\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Information</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Dormant phase: </b></span><span style=\"font-family:'Nirmala UI'\">In     this phase. the virus remains inactive or dormant in the svstem.     It does not FREE perform any harmful actions but waits for a     trigger, such as a specific date or action.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Triggering phase:</b></span><span style=\"font-family:'Nirmala UI'\"> The     virus transitions from dormancy to activation in this phase.     Specific conditions, such as user actions or system events,     activate the virus.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Execution phase:</b></span><span style=\"font-family:'Nirmala UI'\"> This     is the phase where the virus executes its malicious payload. It     may </span><span style=\"font-family:'Nirmala UI'\"><b>delete files,     steal data, or damage</b></span><span style=\"font-family:'Nirmala UI'\"> the     system during this phase.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    the correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Propagation    phase.</b></span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The shortcut key used to quit MS    Access.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Esc +W</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tab + F4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alt +F4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ctrl + F4</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_17cd8aaefc1e4f46.png\" width=\"21\" height=\"21\" > <span style=\"font-family:'Nirmala UI'\"><u><b>Important    Points</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Alt + F4 </b></span><span style=\"font-family:'Nirmala UI'\">is     a standard shortcut used to close applications on Windows     systems.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This shortcut w ": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772907327398_html_57deed9e0b0d6fef.png\" width=\"297\" height=\"198\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b><br> </b></span><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Conclusion I:</b></span><span style=\"font-family:'Nirmala UI'\"> The     statement says all </span><span style=\"font-family:'Nirmala UI'\"><i>books</i></span><span style=\"font-family:'Nirmala UI'\"> are </span><span style=\"font-family:'Nirmala UI'\"><i>pens</i></span><span style=\"font-family:'Nirmala UI'\">,     but that doesn't work in reverse. There could be many pens that     are not books.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Conclusion II:</b></span><span style=\"font-family:'Nirmala UI'\"> While     some phones are bags, and some bags are pens, there is no direct     link established between phones and books.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    neither I nor II follows, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the triad that follows the    same pattern as that followed by the two triads given below. Both    triads follow the same pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>DP–FS–HV<br> AG–CJ–EM</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">JL–MO–QR</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BK–DN–FQ</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BK–DM–GP</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">JL–MN–QR</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the matching pattern, let's    analyze the numerical positions of the letters in the alphabet for    the given triads:- </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>DP – FS – HV</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>First letters</b></span><span style=\"font-family:'Nirmala UI'\">:     D </span>→<span style=\"font-family:'Nirmala UI'\"> F </span>→<span style=\"font-family:'Nirmala UI'\">     H (+2, +2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Second letters:</b></span><span style=\"font-family:'Nirmala UI'\">     P </span>→<span style=\"font-family:'Nirmala UI'\"> S </span>→<span style=\"font-family:'Nirmala UI'\">     V (+3, +3)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Confirm the pattern with AG – CJ    – EM:-</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The pattern: </span><span style=\"font-family:'Nirmala UI'\"><b>first    letter: +2, +2 and second letter: +3, +3.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the given options, only    </span><span style=\"font-family:'Nirmala UI'\"><b>option b follows</b></span><span style=\"font-family:'Nirmala UI'\">    the given pattern.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>B </b></span>→<span style=\"font-family:'Nirmala UI'\"><b>     D </b></span>→<span style=\"font-family:'Nirmala UI'\"><b> F (+2, +2)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>K </b></span>→<span style=\"font-family:'Nirmala UI'\"><b>     N </b></span>→<span style=\"font-family:'Nirmala UI'\"><b> Q (+3, +3)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    BK–DN–FQ is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What will come in place of the    question mark (?) in the following equation if ‘+’ and ‘×’    are interchanged and ‘–’ and ‘÷’ are interchanged?<br> </span><span style=\"font-family:'Nirmala UI'\"><b>15    + 2 × 5 – 5 ÷ 5 = ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">26</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">50</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">New equation after    interchanging the symbols;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>15 × 2 + 5 ÷ 5 – 5</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Apply BODMAS;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">15 × 2 = 30</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">5 ÷ 5 = 1</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">30 + 1 – 5 = 26</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    26 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ZBC is related to BDE in a certain    way based on the English alphabetical order. In the same way, LNO    is related to NPQ. To which of the following is STU related,    following the same logic?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">TUV</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">TUX</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">UWA</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">UVW</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the triad related to STU,    first find the pattern in the given examples;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>ZBC </b></span>→<span style=\"font-family:'Nirmala UI'\"><b>    BDE</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bot arking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the next number, we first    observe the jump between the given numbers;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">36 + 9 = 45</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">45 + 23 = 68</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">68 + 9 = 77</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">77 + 23 = 100</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">100 + 9 = 109</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Pattern:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>+9,    +23, +9, +23, +9 …</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">So next difference should be </span><span style=\"font-family:'Nirmala UI'\"><b>+23</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">109 + 23 =</span><span style=\"font-family:'Nirmala UI'\"><b> 132</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    132 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Refer to the following number and    symbol series and answer the question that follows.<br> Counting    to be done from function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}
